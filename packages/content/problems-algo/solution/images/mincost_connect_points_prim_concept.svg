<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最小生成树：用最短的总边长把所有点连成一个连通图</text>

  <!-- ===== Left panel: complete graph (all edges) ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">完全图（所有 C(n,2) 条边）</text>

  <!-- all edges (faint) -->
  <line x1="80" y1="90" x2="180" y2="80" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="90" x2="100" y2="170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="90" x2="200" y2="160" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="80" x2="100" y2="170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="80" x2="200" y2="160" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="170" x2="200" y2="160" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="80" cy="90" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <circle cx="180" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <circle cx="100" cy="170" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <circle cx="200" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#aaa">6 条边，总长太大</text>

  <!-- arrow -->
  <path d="M 260 125 L 300 125" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="10" fill="#888">Prim</text>

  <!-- ===== Right panel: MST (selected edges) ===== -->
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最小生成树（n−1 条边）</text>

  <!-- MST edges (highlighted) -->
  <line x1="380" y1="90" x2="480" y2="80" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="380" y1="90" x2="400" y2="170" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="400" y1="170" x2="500" y2="160" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- edge labels -->
  <rect x="418" y="78" width="24" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="89" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">4</text>

  <rect x="372" y="120" width="24" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="384" y="131" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">4</text>

  <rect x="438" y="152" width="24" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="163" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">3</text>

  <!-- points -->
  <circle cx="380" cy="90" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <circle cx="480" cy="80" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <circle cx="400" cy="170" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <circle cx="500" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <text x="430" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 条边，总长 = 4+4+3 = 11</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="230" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：n 个点的完全图有 C(n,2) 条边</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#555">MST 只需选 n−1 条边使总代价最小 → Prim 贪心：每步选最短的跨集合边</text>

  <!-- ===== Bottom: Prim core idea ===== -->
  <rect x="40" y="295" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Prim 核心思想</text>
  <text x="280" y="337" text-anchor="middle" font-size="11" fill="#555">维护两个集合：已加入 MST 的 S 和未加入的 V\S</text>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#555">每步从跨越 S 与 V\S 的边中选最短的一条，把新节点加入 S</text>
</svg>
