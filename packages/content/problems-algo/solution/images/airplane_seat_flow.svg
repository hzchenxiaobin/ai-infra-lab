<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">证明流程：递推公式 → 数学归纳 → f(n) = 1/2</text>

  <!-- ===== Step 1: Define f(n) ===== -->
  <rect x="40" y="42" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 1：定义 f(n) = 乘客 n 坐到自己座位的概率</text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#888">基准：f(1) = 1（只有自己，必坐对）</text>

  <path d="M 280 84 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Case analysis for passenger 1's choice ===== -->
  <text x="40" y="114" font-size="11" fill="#555" font-weight="bold">Step 2：乘客 1 随机选座，三种情况（各 1/n 概率）</text>

  <!-- Case A: picks seat 1 -->
  <rect x="40" y="124" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选座位 1</text>
  <text x="115" y="156" text-anchor="middle" font-size="9" fill="#888">（概率 1/n）</text>
  <text x="115" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 后续全坐对，P = 1</text>

  <!-- Case B: picks seat n -->
  <rect x="205" y="124" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">选座位 n</text>
  <text x="280" y="156" text-anchor="middle" font-size="9" fill="#888">（概率 1/n）</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#b85450">→ 最后乘客必坐错，P = 0</text>

  <!-- Case C: picks seat k (2<=k<=n-1) -->
  <rect x="370" y="124" width="150" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">选座位 k</text>
  <text x="445" y="156" text-anchor="middle" font-size="9" fill="#888">（2≤k≤n-1，共 n-2 个）</text>
  <text x="445" y="170" text-anchor="middle" font-size="10" fill="#d6a040">→ 乘客 k 成新"1 号"</text>

  <path d="M 445 180 L 445 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Recurrence ===== -->
  <rect x="60" y="200" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 3：递推公式</text>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#333">f(n) = 1/n · [1 + 0 + f(n-1) + f(n-2) + ··· + f(2)]</text>
  <text x="280" y="250" text-anchor="middle" font-size="9" fill="#888">即 f(n) = 1/n · [1 + Σf(i), i=2..n-1]</text>

  <path d="M 280 254 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Induction base ===== -->
  <rect x="40" y="276" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Step 4：归纳基础 — f(1) = 1, f(2) = 1/2 · [1 + 0] = 1/2 ✓</text>
  <text x="280" y="304" text-anchor="middle" font-size="9" fill="#888">n=2 时，1 号选座位 1（成功）或座位 2（失败），各 1/2</text>

  <path d="M 280 312 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Induction step ===== -->
  <rect x="40" y="334" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Step 5：归纳步 — 假设 f(2)=f(3)=···=f(n-1)=1/2</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333">f(n) = 1/n · [1 + (n-2)·1/2] = 1/n · [(2+n-2)/2]</text>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">= 1/n · n/2 = 1/2  ✓</text>

  <path d="M 280 392 L 280 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="100" y="410" width="360" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结论：f(n) = 1/2 （∀ n ≥ 2），f(1) = 1</text>
</svg>
