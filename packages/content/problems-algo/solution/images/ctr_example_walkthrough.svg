<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s1="acb", n1=4, s2="ab", n2=2</text>
  <path d="M 250 40 Q 450 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- round 0 -->
  <text x="60" y="78" font-size="12" font-weight="bold" fill="#2b6e9e">第 0 轮</text>
  <g filter="url(#sk)">
    <rect x="120" y="64" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="148" y="64" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="176" y="64" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="133" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="161" y="84" text-anchor="middle" font-size="11" fill="#888">c</text>
  <text x="189" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">b</text>
  <!-- match arrows to s2 -->
  <text x="240" y="84" font-size="11" fill="#4a7a3a">a 命中 s2[0]，b 命中 s2[1] → 完成一个 "ab"</text>
  <g filter="url(#sk2)">
    <rect x="240" y="100" width="22" height="22" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="264" y="100" width="22" height="22" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="251" y="116" text-anchor="middle" font-size="10" fill="#2e6e2e">a</text>
  <text x="275" y="116" text-anchor="middle" font-size="10" fill="#2e6e2e">b</text>
  <text x="300" y="116" font-size="11" fill="#b85450">C₁ = 1</text>

  <!-- state after round 0 -->
  <text x="60" y="146" font-size="11" fill="#444">轮末 s2pos =</text>
  <g filter="url(#sk2)">
    <rect x="170" y="132" width="40" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="190" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="230" y="150" font-size="11" fill="#b85450">seen[0]=0 已存在 → 检测到循环节！</text>
  <text x="230" y="166" font-size="11" fill="#b85450">cycleStart=0, cycleLen=1, cycleCount=1−0=1</text>

  <!-- cycle schema -->
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#2b2b2b">三段分解（n1 = 4）：</text>

  <g filter="url(#sk)">
    <rect x="80" y="214" width="120" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="140" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">前缀</text>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#444">0 轮, C=0</text>

  <g filter="url(#sk2)">
    <rect x="230" y="214" width="320" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="390" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">循环节 × 4</text>
  <text x="390" y="252" text-anchor="middle" font-size="10" fill="#444">numCycles=4/1=4, 贡献 4×1=4</text>

  <g filter="url(#sk)">
    <rect x="580" y="214" width="120" height="50" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="640" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">尾段</text>
  <text x="640" y="252" text-anchor="middle" font-size="10" fill="#444">postReps=0, 增量 0</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="80" y="290" width="620" height="120" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="100" y="316" font-size="13" font-weight="bold" fill="#7a5415">计算：</text>
  <text x="100" y="340" font-size="12" fill="#444">totalCount = C_{0+0} + 4 × 1 = 0 + 4 = 4</text>
  <text x="100" y="362" font-size="12" fill="#444">m = ⌊ totalCount / n2 ⌋ = ⌊ 4 / 2 ⌋ = 2</text>
  <text x="100" y="390" font-size="12" font-weight="bold" fill="#b85450">答案：m = 2 ✓</text>

  <!-- visual: str1 blocks with 4 s1 -->
  <text x="730" y="316" font-size="11" font-weight="bold" fill="#2b6e9e">str1 拼接：</text>
  <g filter="url(#sk)">
    <rect x="730" y="324" width="50" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="782" y="324" width="50" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="755" y="340" text-anchor="middle" font-size="10" fill="#2b6e9e">acb</text>
  <text x="807" y="340" text-anchor="middle" font-size="10" fill="#2b6e9e">acb</text>
  <g filter="url(#sk)">
    <rect x="730" y="352" width="50" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="782" y="352" width="50" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="755" y="368" text-anchor="middle" font-size="10" fill="#2b6e9e">acb</text>
  <text x="807" y="368" text-anchor="middle" font-size="10" fill="#2b6e9e">acb</text>
  <text x="730" y="392" font-size="10" fill="#888">每轮匹配出 1 个 "ab"</text>
</svg>
