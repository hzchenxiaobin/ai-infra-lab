<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A=[12,28,46,32,50]，B=[50,12,32,46,28]</text>

  <!-- given arrays -->
  <text x="30" y="56" font-size="12" fill="#888">B = [50, 12, 32, 46, 28]</text>
  <text x="30" y="74" font-size="12" fill="#888">↓ 先建倒排索引 map</text>

  <!-- initial map snapshot -->
  <rect x="30" y="84" width="270" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="102" font-size="11" fill="#4a7a3a" font-weight="bold">初始 map：</text>
  <text x="40" y="120" font-size="11" fill="#333">50→[0]</text>
  <text x="40" y="136" font-size="11" fill="#333">12→[1]</text>
  <text x="40" y="152" font-size="11" fill="#333">32→[2]</text>
  <text x="40" y="168" font-size="11" fill="#333">46→[3]</text>
  <text x="200" y="168" font-size="11" fill="#333">28→[4]</text>

  <!-- table header -->
  <text x="30" y="206" font-size="12" fill="#444" font-weight="bold">逐步遍历 A：</text>
  <rect x="30" y="212" width="560" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">A[i]</text>
  <text x="200" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">查 map[A[i]]</text>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">取出 j</text>
  <text x="430" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">map 更新</text>
  <text x="540" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">P[i]</text>

  <!-- row 0 -->
  <rect x="30" y="238" width="560" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="120" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#333">[1]</text>
  <text x="320" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="430" y="256" text-anchor="middle" font-size="11" fill="#888">12→[] (空)</text>
  <text x="540" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 1 -->
  <rect x="30" y="264" width="560" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="120" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">28</text>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#333">[4]</text>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="430" y="282" text-anchor="middle" font-size="11" fill="#888">28→[]</text>
  <text x="540" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- row 2 -->
  <rect x="30" y="290" width="560" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="120" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">46</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#333">[3]</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="430" y="308" text-anchor="middle" font-size="11" fill="#888">46→[]</text>
  <text x="540" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- row 3 -->
  <rect x="30" y="316" width="560" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="120" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">32</text>
  <text x="200" y="334" text-anchor="middle" font-size="11" fill="#333">[2]</text>
  <text x="320" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="334" text-anchor="middle" font-size="11" fill="#888">32→[]</text>
  <text x="540" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 4 -->
  <rect x="30" y="342" width="560" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="120" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">50</text>
  <text x="200" y="360" text-anchor="middle" font-size="11" fill="#333">[0]</text>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="430" y="360" text-anchor="middle" font-size="11" fill="#888">50→[]</text>
  <text x="540" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- result -->
  <rect x="30" y="380" width="560" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="406" font-size="12" fill="#333" font-weight="bold">最终结果 P =</text>
  <text x="170" y="406" font-size="13" fill="#b85450" font-weight="bold">[1, 4, 3, 2, 0]</text>
  <text x="330" y="406" font-size="11" fill="#888">验证：B[P[i]] == A[i] 逐项成立 ✓</text>

  <text x="30" y="432" font-size="11" fill="#888">提示：本例无重复元素，每个列表恰含 1 个下标；有重复时按入栈顺序逐个 pop 即可。</text>
</svg>
