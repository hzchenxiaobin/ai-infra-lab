<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">flip() / reset() 算法流程</text>

  <rect x="80" y="44" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="65" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">调用 flip()</text>

  <path d="M 170 78 L 170 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="104" width="220" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="127" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">r ← rand(0, total − 1)</text>

  <path d="M 170 142 L 170 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="164" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="182" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">actual ← map.get(r, r)</text>
  <text x="170" y="197" text-anchor="middle" font-size="9.5" fill="#888">位置 r 当前存的值（默认就是 r 本身）</text>

  <path d="M 170 206 L 170 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="228" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">map[r] ← map.get(total − 1, total − 1)</text>
  <text x="170" y="263" text-anchor="middle" font-size="11" fill="#4a7a3a">map.remove(total − 1)</text>
  <text x="170" y="277" text-anchor="middle" font-size="9.5" fill="#888">末尾值搬到 r，再清理末尾条目</text>

  <path d="M 170 286 L 170 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="308" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="329" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">total − −</text>

  <path d="M 170 342 L 170 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="364" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="382" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return [actual // n, actual % n]</text>
  <text x="170" y="397" text-anchor="middle" font-size="9.5" fill="#888">一维索引 → (行, 列)</text>

  <path d="M 170 406 L 170 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="424" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="170" y="442" text-anchor="middle" font-size="11" fill="#446688">结束</text>

  <rect x="350" y="180" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="201" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">调用 reset()</text>

  <path d="M 440 214 L 440 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="240" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="263" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">map.clear()</text>

  <path d="M 440 278 L 440 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="304" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="327" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">total ← m · n</text>

  <path d="M 440 342 L 440 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="368" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="386" text-anchor="middle" font-size="11" fill="#446688">结束</text>

  <rect x="330" y="412" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="440" y="430" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reset 仅 O(map.size) 清表</text>
  <text x="440" y="445" text-anchor="middle" font-size="10" fill="#888">不真正清零 10⁸ 格子</text>
</svg>
