<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：相邻访问之间的空档 +「今天」作哨兵</text>

  <!-- ===== Timeline ===== -->
  <text x="70" y="62" font-size="10" fill="#888">用户 1 的访问时间线（按 visit_date 排序，末尾补「今天」）</text>

  <!-- timeline axis -->
  <line x1="80" y1="210" x2="500" y2="210" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- window brackets (above axis) -->
  <!-- W1: 10-20 -> 11-28 = 39 (biggest, red) -->
  <path d="M 110 195 L 110 168 L 230 168 L 230 195" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">39 天 ★</text>
  <!-- W2: 11-28 -> 12-03 = 5 -->
  <path d="M 230 195 L 230 168 L 320 168 L 320 195" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="275" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a">5 天</text>
  <!-- W3: 12-03 -> 01-01(today) = 29 -->
  <path d="M 320 195 L 320 168 L 470 168 L 470 195" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="395" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">29 天</text>

  <!-- visit dots on axis -->
  <circle cx="110" cy="210" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="230" cy="210" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="320" cy="210" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- sentinel today (red) -->
  <circle cx="470" cy="210" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 470 200 L 470 184 L 484 188 L 470 192 z" fill="#b85450" filter="url(#rough2)" opacity="0.0"/>

  <!-- date labels below axis -->
  <text x="110" y="230" text-anchor="middle" font-size="9" fill="#446688">10-20</text>
  <text x="230" y="230" text-anchor="middle" font-size="9" fill="#446688">11-28</text>
  <text x="320" y="230" text-anchor="middle" font-size="9" fill="#446688">12-03</text>
  <text x="470" y="230" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">01-01</text>
  <text x="470" y="246" text-anchor="middle" font-size="8" fill="#b85450">今天 · 哨兵</text>

  <!-- biggest window callout -->
  <rect x="40" y="262" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">biggest_window = max(39, 5, 29) = 39 天</text>

  <!-- ===== LEAD mechanism table ===== -->
  <text x="70" y="318" font-size="10" fill="#888">LEAD(visit_date, 1, '2021-01-01')：取下一行访问日期，末行无下一行 → 用第三参「今天」补位</text>

  <rect x="60" y="328" width="460" height="116" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <text x="120" y="346" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visit_date</text>
  <text x="300" y="346" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">LEAD 下一行</text>
  <text x="450" y="346" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">空档(天)</text>
  <line x1="70" y1="352" x2="510" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- rows -->
  <text x="120" y="370" text-anchor="middle" font-size="9" fill="#446688">2020-10-20</text>
  <text x="300" y="370" text-anchor="middle" font-size="9" fill="#446688">2020-11-28</text>
  <text x="450" y="370" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">39</text>

  <text x="120" y="390" text-anchor="middle" font-size="9" fill="#446688">2020-11-28</text>
  <text x="300" y="390" text-anchor="middle" font-size="9" fill="#446688">2020-12-03</text>
  <text x="450" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a">5</text>

  <rect x="66" y="398" width="448" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="120" y="412" text-anchor="middle" font-size="9" fill="#446688">2020-12-03</text>
  <text x="300" y="412" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-01-01（默认）</text>
  <text x="450" y="412" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">29</text>

  <text x="290" y="436" text-anchor="middle" font-size="8" fill="#888">末行 LEAD 无下一行 → 第三参 '2021-01-01' 补位 → 空档 = 29</text>
</svg>
