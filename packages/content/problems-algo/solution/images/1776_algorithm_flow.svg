<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：从右向左遍历 → while 弹栈 → 记录相遇时间 → 入栈</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n) 均摊，空间 O(n)；每辆车入栈出栈各 1 次</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init -->
    <rect x="40" y="60" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="80" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="130" y="80" font-family="monospace" font-size="10" fill="#555">res = [-1.0] * n;  stack = []</text>
    <text x="130" y="96" font-size="9" fill="#888">res 默认 -1（永不相遇），栈空</text>

    <path d="M 270 108 L 270 122" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: for loop (right to left) -->
    <rect x="40" y="126" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">② 逆序遍历</text>
    <text x="150" y="146" font-family="monospace" font-size="10" fill="#555">for i in range(n-1, -1, -1):   # 从最右车向左</text>
    <text x="150" y="160" font-size="9" fill="#888">p, s = cars[i]</text>

    <path d="M 270 170 L 270 184" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: while loop with decision diamond -->
    <rect x="40" y="188" width="460" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="208" font-size="12" fill="#d6a040" font-weight="bold">③ while 栈非空：</text>
    <text x="70" y="226" font-family="monospace" font-size="10" fill="#555">j = stack[-1];  pj, sj = cars[j]</text>

    <!-- decision: s <= sj ? -->
    <text x="70" y="248" font-family="monospace" font-size="10" fill="#b85450">if s &le; sj:</text>
    <text x="200" y="248" font-size="9" fill="#b85450">← 追不上（j 更快或同速，永远拉开）</text>
    <text x="90" y="264" font-family="monospace" font-size="10" fill="#b85450">stack.pop();  continue</text>
    <text x="200" y="264" font-size="9" fill="#b85450">← 弹 j，j 可能并入前方慢车队</text>

    <!-- decision: t > res[j] ? -->
    <text x="70" y="288" font-family="monospace" font-size="10" fill="#d6a040">t = (pj - p) / (s - sj)</text>
    <text x="70" y="306" font-family="monospace" font-size="10" fill="#b85450">if res[j] != -1 and t &gt; res[j]:</text>
    <text x="300" y="306" font-size="9" fill="#b85450">← j 先被前方吸收</text>
    <text x="90" y="322" font-family="monospace" font-size="10" fill="#b85450">stack.pop();  continue</text>
    <text x="200" y="322" font-size="9" fill="#b85450">← 弹 j，看下一辆领队</text>

    <!-- else: catch -->
    <text x="70" y="346" font-family="monospace" font-size="10" fill="#4a7a3a">else:  res[i] = t;  break</text>
    <text x="240" y="346" font-size="9" fill="#4a7a3a">← i 追上 j，记录时间，跳出</text>

    <path d="M 270 372 L 270 386" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: push -->
    <rect x="40" y="390" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="410" font-size="12" fill="#4a7a3a" font-weight="bold">④ 入栈</text>
    <text x="110" y="410" font-family="monospace" font-size="10" fill="#555">stack.append(i)   # i 成为新的候选领队</text>

    <path d="M 270 428 L 270 436" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- loop back arrow -->
    <path d="M 500 410 Q 524 410 524 300 Q 524 146 500 146" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="510" y="278" font-size="8" fill="#888" transform="rotate(90 510 278)">下一辆车 i−1</text>

    <!-- Step 5: return -->
    <rect x="40" y="440" width="460" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="54" y="456" font-size="11" fill="#b85450" font-weight="bold">⑤ 返回</text>
    <text x="110" y="456" font-family="monospace" font-size="10" fill="#555">return res   # 栈中剩余 res 已是 -1</text>
  </g>
</svg>
