<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：正 / 负 / 零，三种 x 一网打尽</text>

  <!-- header row -->
  <rect x="33" y="48" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="91" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1</text>
  <rect x="151" y="48" width="116" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="209" y="69" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">nums2</text>
  <rect x="269" y="48" width="66" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="302" y="69" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">min1</text>
  <rect x="337" y="48" width="66" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="69" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">min2</text>
  <rect x="405" y="48" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="446" y="69" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x（答案）</text>

  <!-- row 1 -->
  <rect x="33" y="84" width="116" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="91" y="108" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">[2, 6, 4]</text>
  <rect x="151" y="84" width="116" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="108" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">[9, 7, 5]</text>
  <rect x="269" y="84" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="108" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="337" y="84" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="108" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">5</text>
  <rect x="405" y="84" width="82" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="109" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="33" y="124" width="116" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="91" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">[10]</text>
  <rect x="151" y="124" width="116" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="148" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">[5]</text>
  <rect x="269" y="124" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="148" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">10</text>
  <rect x="337" y="124" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="148" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">5</text>
  <rect x="405" y="124" width="82" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="149" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5</text>

  <!-- row 3 -->
  <rect x="33" y="164" width="116" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="91" y="188" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">[1,1,1,1]</text>
  <rect x="151" y="164" width="116" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="188" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">[1,1,1,1]</text>
  <rect x="269" y="164" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="188" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="337" y="164" width="66" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="188" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="405" y="164" width="82" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="189" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- annotations -->
  <rect x="52" y="224" width="416" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 2：min2 &lt; min1 → x = −5，「相加」也可以是整体减小</text>

  <rect x="52" y="262" width="416" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 3：两数组本就相等 → x = 0，加 0 什么都不变</text>

  <rect x="52" y="300" width="416" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min 只看值不看位置 —— 数组乱序、元素重复都无所谓</text>

  <rect x="52" y="338" width="416" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交叉验证：x = max2 − max1 = (sum2 − sum1) ÷ n，殊途同归</text>
</svg>
