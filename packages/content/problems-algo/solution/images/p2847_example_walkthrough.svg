<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：105 → 357，44 → -1，96 → 268</text>

  <!-- lane 1: n = 105 -->
  <rect x="30" y="62" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 105</text>

  <path d="M 110 80 L 128 80" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="62" width="130" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="197" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">105 = 3 · 5 · 7</text>

  <path d="M 262 80 L 280 80" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="63" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="322" y="63" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="360" y="63" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <path d="M 396 80 L 418 80" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="62" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="484" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">357 ✓</text>

  <text x="484" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">rem=(0,1) → 3；5、7 各自成位</text>

  <!-- lane 2: n = 44 -->
  <rect x="30" y="126" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 44</text>

  <path d="M 110 144 L 128 144" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="126" width="130" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="197" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">44 = 2² · 11</text>

  <path d="M 262 144 L 280 144" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="126" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="364" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">残留 11 &gt; 1 → 无解</text>

  <path d="M 444 144 L 462 144" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="466" y="126" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="516" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1 ✗</text>

  <!-- lane 3: n = 96, row A -->
  <rect x="30" y="190" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="213" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 96</text>

  <path d="M 110 208 L 128 208" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="190" width="130" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="197" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">96 = 2⁵ · 3</text>

  <path d="M 262 208 L 280 208" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="190" width="260" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="414" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">试除后：a = 5 个 2，b = 1 个 3</text>

  <!-- row B -->
  <rect x="30" y="244" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">捆 ⌊5/3⌋ = 1 个 8，余料 (2, 1)</text>

  <path d="M 280 262 L 298 262" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="302" y="244" width="176" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="259" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">查表：2²·3 → {2, 6}</text>
  <text x="390" y="274" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">（"26" &lt; "34"）</text>

  <path d="M 478 262 L 496 262" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="500" y="245" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="516" y="267" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="536" y="245" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="552" y="267" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="572" y="245" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="588" y="267" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- row C -->
  <rect x="30" y="298" width="220" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数位集合 {2, 6, 8}，升序拼接</text>

  <path d="M 250 316 L 268 316" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="298" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="342" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">268 ✓</text>

  <text x="510" y="321" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">验证：2 × 6 × 8 = 96</text>

  <text x="310" y="362" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">官方用例：105 → 357、7 → 7、44 → -1；96 为补充的捆包完整演算</text>
</svg>
