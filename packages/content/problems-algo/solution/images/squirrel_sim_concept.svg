<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：拆出公共往返，只挑「最省的第一颗」</text>

  <!-- ===== Grid 5 rows x 7 cols, cell=34, origin (60,70) ===== -->
  <!-- grid cells -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="60" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="94" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="128" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="162" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="196" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="230" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="264" y="70" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <!-- row 1 -->
    <rect x="60" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="94" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="128" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="162" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="196" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="230" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="264" y="104" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <!-- row 2: tree [2,2], nut [2,5] -->
    <rect x="60" y="138" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="94" y="138" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="128" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="162" y="138" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="196" y="138" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="230" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="264" y="138" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <!-- row 3: nut [3,0] -->
    <rect x="60" y="172" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="94" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="128" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="162" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="196" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="230" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="264" y="172" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <!-- row 4: squirrel [4,4] -->
    <rect x="60" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="94" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="128" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="162" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="196" y="206" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="230" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="264" y="206" width="34" height="34" fill="#fff" stroke="#cccccc" stroke-width="0.8"/>
  </g>

  <!-- entities (cell centers: tree=145,155  nut[2,5]=247,155  nut[3,0]=77,189  squirrel=213,223) -->
  <text x="145" y="160" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">树</text>
  <text x="247" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">果①</text>
  <text x="77" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">果②</text>
  <text x="213" y="228" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">鼠</text>

  <!-- col ticks (top) -->
  <text x="77" y="62" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="145" y="62" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="247" y="62" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <!-- row ticks (left) -->
  <text x="50" y="160" text-anchor="end" font-size="9" fill="#aaa">2</text>
  <text x="50" y="194" text-anchor="end" font-size="9" fill="#aaa">3</text>
  <text x="50" y="228" text-anchor="end" font-size="9" fill="#aaa">4</text>

  <!-- ===== Path arrows ===== -->
  <!-- First nut: squirrel(213,223) -> nut[2,5](247,155) -> tree(145,155)  [red, the "replacement"] -->
  <path d="M 220 217 Q 250 190 247 162" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 155 L 154 155" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="180" font-size="9.5" fill="#b85450" font-weight="bold">第一颗</text>
  <text x="272" y="192" font-size="9" fill="#b85450">鼠→果→树</text>

  <!-- Normal round trip: tree(145,155) -> nut[3,0](77,189) -> tree  [green dashed] -->
  <path d="M 138 161 Q 95 175 82 183" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 84 195 Q 110 178 138 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="38" y="250" font-size="9.5" fill="#4a7a3a" font-weight="bold">其余：树↔果</text>
  <text x="38" y="262" font-size="9" fill="#4a7a3a">往返 2·d</text>

  <!-- ===== Formula breakdown panel ===== -->
  <rect x="318" y="74" width="222" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="429" y="98" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">拆解：公共往返 − 最大节省</text>

  <text x="332" y="124" font-size="11" fill="#444">① 公共往返（所有坚果）</text>
  <text x="346" y="140" font-size="10.5" fill="#666">S = Σ 2·dist(tree, nut_i)</text>

  <text x="332" y="164" font-size="11" fill="#444">② 第一颗替换：少走一段</text>
  <text x="346" y="180" font-size="10.5" fill="#666">total(j) = S − d(tree,n_j) + d(sq,n_j)</text>

  <text x="332" y="204" font-size="11" fill="#b85450" font-weight="bold">③ 选 max(d_tree − d_sq)</text>
  <text x="346" y="220" font-size="10.5" fill="#b85450" font-weight="bold">ans = S − maxSave</text>

  <!-- legend -->
  <rect x="318" y="252" width="222" height="56" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="328" y="270" font-size="10" fill="#555" font-weight="bold">图例</text>
  <rect x="328" y="276" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="344" y="285" font-size="9.5" fill="#555">树</text>
  <rect x="368" y="276" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="384" y="285" font-size="9.5" fill="#555">松鼠</text>
  <rect x="412" y="276" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="428" y="285" font-size="9.5" fill="#555">坚果</text>
  <line x1="460" y1="282" x2="480" y2="282" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="486" y="285" font-size="9.5" fill="#b85450">第一颗</text>
  <line x1="328" y1="298" x2="348" y2="298" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="354" y="301" font-size="9.5" fill="#4a7a3a">其余往返</text>

  <!-- bottom insight -->
  <rect x="30" y="324" width="510" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">直觉：第一颗选「离树远、离松鼠近」的坚果</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#444">本来这颗要从树绕一大圈往返，松鼠顺手拿了 ⇒ 省下 (d_tree − d_sq) 最多</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = 2·Σ d(tree,nut) − max( d(tree,nut) − d(squirrel,nut) )</text>
</svg>
