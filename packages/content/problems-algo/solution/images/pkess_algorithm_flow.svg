<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 逐个放桶 → 三重剪枝 → 放完即成功</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">dfs(idx)：尝试把 nums[idx] 放进某个桶</text>

  <!-- ===== Preprocess box ===== -->
  <rect x="150" y="56" width="240" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">预处理</text>
  <text x="270" y="93" text-anchor="middle" font-size="10.5" fill="#555">total%k≠0 或 nums[0]&gt;target → false</text>
  <text x="270" y="107" text-anchor="middle" font-size="10.5" fill="#555">target=total/k；nums 降序排序</text>
  <path d="M 270 116 L 270 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: idx == n ? ===== -->
  <polygon points="270,134 360,170 270,206 180,170" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">idx == n ?</text>
  <text x="270" y="183" text-anchor="middle" font-size="10" fill="#446688">（元素已放完）</text>

  <!-- yes -> return true -->
  <path d="M 360 170 L 430 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="164" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="154" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="478" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- no -> down to loop -->
  <path d="M 270 206 L 270 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="218" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Loop over buckets ===== -->
  <rect x="90" y="222" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">遍历每个桶 i = 0 … k−1</text>
  <path d="M 270 262 L 270 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: overflow ? ===== -->
  <polygon points="270,280 380,312 270,344 160,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">buckets[i]+nums[idx]</text>
  <text x="270" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">&gt; target ?</text>
  <path d="M 380 312 L 430 312" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="306" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="436" y="316" font-size="10" fill="#888">continue</text>
  <text x="436" y="328" font-size="9.5" fill="#aaa">（试下一桶）</text>

  <path d="M 270 344 L 270 358" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="356" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== skip same capacity ===== -->
  <rect x="120" y="360" width="300" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="381" text-anchor="middle" font-size="10.5" fill="#555">i&gt;0 且 buckets[i]==buckets[i−1] → continue（剪枝②）</text>
  <path d="M 270 394 L 270 406" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== place / recurse / undo ===== -->
  <rect x="70" y="408" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="427" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">放入 buckets[i]+=nums[idx]</text>
  <text x="220" y="442" text-anchor="middle" font-size="10.5" fill="#4a7a3a">dfs(idx+1)? 成功→true；撤销 buckets[i]-=nums[idx]</text>
  <text x="220" y="455" text-anchor="middle" font-size="10" fill="#b85450">撤销后 buckets[i]==0 → break（剪枝③ 空桶失败即停）</text>

  <!-- side note: pruning 1 (desc sort) -->
  <rect x="384" y="408" width="140" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="454" y="427" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">剪枝① 降序排序</text>
  <text x="454" y="442" text-anchor="middle" font-size="9.5" fill="#888">大数先放，浅层</text>
  <text x="454" y="454" text-anchor="middle" font-size="9.5" fill="#888">触发超容早剪枝</text>
</svg>
