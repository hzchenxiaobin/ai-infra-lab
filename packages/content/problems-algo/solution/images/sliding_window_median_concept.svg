<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双堆维护滑动窗口中位数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">大顶堆存较小一半，小顶堆存较大一半，中位数在堆顶</text>

  <!-- ===== Array with window ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">nums[]（窗口 k=3）</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="52" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="78" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="126" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="148" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-1</text>
    <rect x="174" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="196" y="100" text-anchor="middle">-3</text>
    <rect x="222" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="244" y="100" text-anchor="middle">5</text>
    <rect x="270" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="292" y="100" text-anchor="middle">3</text>
    <rect x="318" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="100" text-anchor="middle">6</text>
    <rect x="366" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="388" y="100" text-anchor="middle">7</text>
  </g>

  <!-- Window bracket -->
  <path d="M 28 120 L 28 126 L 172 126 L 172 120" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">当前窗口 [1, 3, -1]</text>

  <!-- ===== Left max-heap ===== -->
  <rect x="30" y="158" width="230" height="180" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="178" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">大顶堆 left（较小的一半）</text>
  <text x="145" y="194" text-anchor="middle" font-size="9" fill="#888">堆顶 = 左半最大值</text>

  <!-- Heap tree: root 1, child -1 -->
  <g filter="url(#rough2)">
    <line x1="145" y1="220" x2="105" y2="268" stroke="#446688" stroke-width="1"/>
    <circle cx="145" cy="220" r="18" fill="#fff" stroke="#446688" stroke-width="2"/>
    <circle cx="105" cy="268" r="15" fill="#fff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="145" y="225" fill="#446688">1</text>
    <text x="105" y="272" fill="#446688">-1</text>
  </g>
  <text x="145" y="250" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 堆顶 max=1</text>
  <text x="145" y="310" text-anchor="middle" font-size="9" fill="#555">存了 {1, -1}</text>
  <text x="145" y="326" text-anchor="middle" font-size="9" fill="#555">left_size = 2</text>

  <!-- ===== Right min-heap ===== -->
  <rect x="300" y="158" width="230" height="180" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">小顶堆 right（较大的一半）</text>
  <text x="415" y="194" text-anchor="middle" font-size="9" fill="#888">堆顶 = 右半最小值</text>

  <g filter="url(#rough2)">
    <circle cx="415" cy="220" r="18" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="415" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="415" y="250" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 堆顶 min=3</text>
  <text x="415" y="310" text-anchor="middle" font-size="9" fill="#555">存了 {3}</text>
  <text x="415" y="326" text-anchor="middle" font-size="9" fill="#555">right_size = 1</text>

  <!-- Invariant arrow between heaps -->
  <path d="M 260 220 L 300 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">≤</text>
  <text x="280" y="234" text-anchor="middle" font-size="8" fill="#888">left.max ≤ right.min</text>

  <!-- ===== Median formula ===== -->
  <rect x="130" y="352" width="300" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k 奇 → median = left.top = 1.0</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">k 偶 → median = (left.top + right.top) / 2</text>
</svg>
