<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 贪心收集 → 排序 → 按序回填</text>

  <!-- start -->
  <ellipse cx="210" cy="46" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="51" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 210 61 L 210 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step1 count -->
  <rect x="106" y="76" width="208" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">统计 freq[26]（'?' 不计数）</text>
  <path d="M 210 106 L 210 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step2 greedy loop -->
  <polygon points="210,122 268,148 210,174 152,148" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="153" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">还有 '?' ?</text>
  <path d="M 210 174 L 210 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="187" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="100" y="192" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="209" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">取 freq 最小的下标 j（并列取小）</text>
  <text x="210" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">freq[j]++ ；filled += 字母 j</text>

  <!-- loop back -->
  <path d="M 320 214 L 420 214 L 420 148 L 268 148" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="234" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">下一个 '?'</text>

  <!-- no -> sort -->
  <path d="M 152 148 L 100 148 L 100 258" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="128" y="140" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>

  <!-- step3 sort -->
  <rect x="106" y="260" width="208" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="280" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">将 filled 排序</text>
  <path d="M 210 290 L 210 304" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step4 refill -->
  <rect x="86" y="306" width="248" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="326" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">重扫 s，'?' 位置依序填入 filled</text>
  <path d="M 210 336 L 210 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- end -->
  <ellipse cx="210" cy="366" rx="46" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="371" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 s</text>

  <!-- side note -->
  <rect x="360" y="260" width="140" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">贪心：O(26k)</text>
  <text x="430" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">排序：O(k log k)</text>
  <text x="430" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">回填：O(n)</text>
  <text x="430" y="346" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">整体 O(26n)</text>

  <!-- bottom note -->
  <rect x="40" y="30" width="0" height="0" fill="none" filter="url(#rough2)"/>
  <rect x="360" y="76" width="140" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">排序后回填：</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">小字母放靠前的 '?'</text>
  <text x="430" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">分数不变的前提上</text>
  <text x="430" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">字典序最小</text>
</svg>
