<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：一个 @ 即可分流，两种格式各自走规则化模板</text>

  <!-- input string -->
  <text x="60" y="66" font-size="11" fill="#888">输入 s</text>
  <rect x="120" y="50" width="380" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="12" fill="#333">"LeetCode@LeetCode.com"  /  "86-(10)12345678"</text>

  <!-- decision -->
  <path d="M 310 96 L 360 116 L 310 136 L 260 116 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">find('@')</text>

  <!-- arrows to two branches -->
  <path d="M 260 116 L 180 116" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="225" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">有 @</text>
  <path d="M 360 116 L 440 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">无 @</text>

  <!-- email branch header -->
  <rect x="40" y="150" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="169" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">邮箱分支</text>

  <!-- email steps -->
  <text x="50" y="198" font-size="11" fill="#333">① 整串转小写</text>
  <rect x="48" y="206" width="264" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="222" text-anchor="middle" font-size="11" fill="#333">"leetcode@leetcode.com"</text>

  <text x="50" y="248" font-size="11" fill="#333">② 取首字符 + 5 星 + @前字符</text>
  <rect x="48" y="256" width="264" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l + ***** + e</text>

  <text x="50" y="298" font-size="11" fill="#333">③ 接 @域名</text>
  <rect x="48" y="306" width="264" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"l*****e@leetcode.com"</text>

  <!-- phone branch header -->
  <rect x="340" y="150" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">电话分支</text>

  <!-- phone steps -->
  <text x="350" y="198" font-size="11" fill="#333">① 只留数字（剔分隔符）</text>
  <rect x="348" y="206" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#333">"861012345678"</text>

  <text x="350" y="248" font-size="11" fill="#333">② 数位数 n=12 → 国家码 2 位</text>
  <rect x="348" y="256" width="244" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+ + ** + -***-***- + 末4位</text>

  <text x="350" y="298" font-size="11" fill="#333">③ 取末 4 位 = 5678</text>
  <rect x="348" y="306" width="244" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"+**-***-***-5678"</text>

  <!-- bottom note -->
  <rect x="40" y="350" width="540" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键差异</text>
  <text x="310" y="383" text-anchor="middle" font-size="10" fill="#444">邮箱：星号个数固定 5 个（与名字长度无关）；电话：n==10 不加 +，n&gt;10 才加 + 和国家码星号</text>
</svg>
