<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层 + prev 滚动比较</text>

  <!-- 1. 初始化 -->
  <rect x="170" y="46" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">队列 q = [root]，level = 0</text>

  <line x1="290" y1="80" x2="290" y2="96" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. while 队列非空 -->
  <rect x="190" y="100" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">while 队列非空</text>

  <line x1="290" y1="134" x2="290" y2="150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. size & prev -->
  <rect x="150" y="154" width="280" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="175" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">size = q.size()，prev = −∞（哨兵）</text>

  <line x1="290" y1="188" x2="290" y2="204" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. for 循环 -->
  <rect x="170" y="208" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="229" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for i in 0..size-1</text>

  <line x1="290" y1="242" x2="290" y2="258" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. pop -->
  <rect x="190" y="262" width="200" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="283" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">node = q.pop()</text>

  <line x1="290" y1="294" x2="290" y2="308" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 判定菱形：level 偶? -->
  <polygon points="290,310 390,346 290,382 190,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">level % 2</text>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">== 0 ?</text>

  <!-- 是偶层：向左分支 -->
  <line x1="190" y1="346" x2="120" y2="346" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a">偶层</text>
  <rect x="20" y="328" width="100" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="345" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">val 奇数?</text>
  <text x="70" y="357" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">val &gt; prev?</text>

  <!-- 否奇层：向右分支 -->
  <line x1="390" y1="346" x2="460" y2="346" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="338" text-anchor="middle" font-size="10" fill="#446688">奇层</text>
  <rect x="460" y="328" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="345" text-anchor="middle" font-size="10" fill="#2a4a6a" font-weight="bold">val 偶数?</text>
  <text x="510" y="357" text-anchor="middle" font-size="10" fill="#2a4a6a" font-weight="bold">val &lt; prev?</text>

  <!-- 两分支汇合 → 任一不满足 return false -->
  <line x1="70" y1="364" x2="70" y2="392" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="510" y1="364" x2="510" y2="392" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="392" width="280" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="413" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">任一条件不满足 → return false ✗</text>
  <line x1="70" y1="392" x2="150" y2="403" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="510" y1="392" x2="430" y2="403" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 满足 → prev=val, push孩子 -->
  <line x1="290" y1="382" x2="290" y2="436" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="402" font-size="10" fill="#4a7a3a">满足</text>
  <rect x="170" y="440" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="461" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">prev = val；push 左/右孩子</text>

  <!-- for 结束 → level++ 回到 while -->
  <path d="M 170 457 L 100 457 L 100 510 L 290 510 L 290 134 L 290 134" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="108" y="492" font-size="10" fill="#888">for 结束→level++</text>
  <text x="108" y="504" font-size="10" fill="#888">回到 while</text>

  <!-- while 结束 → return true -->
  <line x1="390" y1="117" x2="470" y2="117" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="109" text-anchor="middle" font-size="10" fill="#888">队列空</text>
  <rect x="470" y="100" width="96" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="518" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
