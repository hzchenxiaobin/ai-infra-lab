<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：新字符只需和栈顶「对暗号」</text>

  <!-- 输入行 -->
  <text x="30" y="59" font-size="11.5" fill="#555" filter="url(#rough2)">输入 s =</text>
  <rect x="95" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="133" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="171" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="209" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="252" y="59" font-size="10" fill="#777" filter="url(#rough2)">（示例 2）</text>

  <path d="M95,86 L235,86" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="167" y="101" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">从左往右扫描</text>
  <text x="280" y="101" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">栈（左=底，右=顶）</text>

  <!-- 步骤 1：读 a -->
  <rect x="30" y="108" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="43" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <path d="M60,121 L76,121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="82" y="125" font-size="11.5" fill="#333" filter="url(#rough2)">栈空 → 压入 a</text>
  <rect x="252" y="108" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- 步骤 2：读 d -->
  <rect x="30" y="160" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="43" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <path d="M60,173 L76,173" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="82" y="171" font-size="11.5" fill="#333" filter="url(#rough2)">|a−d| = 3 ✗</text>
  <text x="82" y="186" font-size="10" fill="#777" filter="url(#rough2)">不相邻 → d 入栈</text>
  <rect x="252" y="160" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="284" y="160" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <!-- 步骤 3：读 c，消对 -->
  <rect x="30" y="212" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="43" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <path d="M60,225 L76,225" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="82" y="223" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">|d−c| = 1 ✓ 相邻</text>
  <text x="82" y="238" font-size="10" fill="#b85450" filter="url(#rough2)">消对：d 出栈，c 作废</text>
  <rect x="252" y="212" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="284" y="212" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="297" y="230" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">d</text>
  <path d="M285,225 L309,225" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 步骤 4：读 b，级联消对 -->
  <rect x="30" y="264" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="43" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <path d="M60,277 L76,277" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="82" y="275" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">|a−b| = 1 ✓ 相邻</text>
  <text x="82" y="290" font-size="10" fill="#b85450" filter="url(#rough2)">消对：a 出栈，b 作废</text>
  <rect x="252" y="264" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="265" y="282" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">a</text>
  <path d="M253,277 L277,277" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="282" font-size="10.5" fill="#777" filter="url(#rough2)">（空）</text>

  <!-- 右侧面板：环形相邻判定 -->
  <rect x="336" y="104" width="172" height="190" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">判「相邻」（环形）</text>
  <text x="422" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = |c₁ − c₂|</text>
  <text x="422" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ∈ {1, 25} ⇒ 相邻</text>

  <!-- 字母环 -->
  <text x="365" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <path d="M376,192 L387,192" stroke="#999" stroke-width="1.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="397" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="425" y="196" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="452" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">y</text>
  <path d="M461,192 L472,192" stroke="#999" stroke-width="1.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="482" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">z</text>
  <path d="M478,186 C452,170 398,170 372,186" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="422" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">|'z'−'a'| = 25 ✓</text>
  <text x="422" y="236" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">等价 min(d, 26−d) = 1</text>
  <text x="422" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">(a,b) 与 (b,a) 都算</text>
  <text x="422" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">坑：只判 d==1 会漏 a↔z！</text>

  <!-- 底部结论 -->
  <rect x="30" y="312" width="478" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">不变量：栈内不存在任何相邻对 → 新字符只和栈顶比较一次</text>
  <text x="269" y="349" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">adcb 依次消 (d,c)、(a,b)：dc 消掉后 a、b 才「见面」，级联清空 → 答案 ""</text>
</svg>
