<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">含随机指针的二叉树：left / right / random 三引用</text>
  <path d="M 170 42 Q 310 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#666">每个节点除 left/right 外还有 random，可指向树中任意节点或 null</text>

  <!-- 节点 1 -->
  <g filter="url(#sk)">
    <rect x="280" y="74" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="310" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#234">1</text>
  <text x="310" y="110" text-anchor="middle" font-size="9" fill="#888">rnd=null</text>

  <!-- 节点 4 -->
  <g filter="url(#sk)">
    <rect x="370" y="160" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="400" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#234">4</text>
  <text x="400" y="196" text-anchor="middle" font-size="9" fill="#888">rnd→7</text>

  <!-- 节点 7 -->
  <g filter="url(#sk)">
    <rect x="300" y="252" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#234">7</text>
  <text x="330" y="288" text-anchor="middle" font-size="9" fill="#888">rnd→1</text>

  <!-- 节点 5 -->
  <g filter="url(#sk)">
    <rect x="460" y="252" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="490" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#234">5</text>
  <text x="490" y="288" text-anchor="middle" font-size="9" fill="#888">rnd=null</text>

  <!-- 树结构边 left/right（黑实线）-->
  <path d="M 335 118 L 388 158" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="132" font-size="9" fill="#3a3a3a">right</text>
  <path d="M 382 204 L 340 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="346" y="232" font-size="9" fill="#3a3a3a">left</text>
  <path d="M 418 204 L 474 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="436" y="232" font-size="9" fill="#3a3a3a">right</text>

  <!-- random 指针（红虚线）-->
  <!-- 4.random → 7：弧到左侧 -->
  <path d="M 374 178 Q 232 224 304 268" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <!-- 7.random → 1：弧到右侧 -->
  <path d="M 358 260 Q 540 168 344 116" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <line x1="50" y1="322" x2="92" y2="322" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="100" y="326" font-size="11" fill="#333">left / right（树结构边）</text>
  <g filter="url(#sk)">
    <line x1="280" y1="322" x2="322" y2="322" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="330" y="326" font-size="11" fill="#b85450">random（可指向任意节点）</text>

  <!-- 难点框 -->
  <g filter="url(#sk)">
    <rect x="40" y="346" width="540" height="60" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="60" y="370" font-size="12" font-weight="bold" fill="#7a5415">深拷贝难点</text>
  <text x="60" y="388" font-size="11" fill="#444">新节点的 left / right / random 必须指向新树里的节点，而非原树——不能简单复制指针值</text>
  <text x="60" y="402" font-size="11" fill="#444">关键：建立「旧节点 → 新节点」的哈希映射，复制时据此修正所有引用</text>
</svg>
