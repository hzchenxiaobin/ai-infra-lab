<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">夹紧的三种情形（以 x 轴为例，y 轴同理）</text>

  <!-- ===== Row 1: C left of [x1,x2] ===== -->
  <rect x="170" y="70" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x1</text>
  <text x="380" y="88" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x2</text>
  <!-- center C -->
  <circle cx="110" cy="82" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="110" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- closest P = x1 -->
  <circle cx="170" cy="82" r="5" fill="#b85450" filter="url(#rough2)"/>
  <line x1="110" y1="82" x2="170" y2="82" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="135" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">|Δx|</text>
  <text x="410" y="88" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">closestX = x1</text>
  <text x="410" y="104" font-size="10" fill="#888" filter="url(#rough2)">xC &lt; x1 → 取下界</text>

  <!-- ===== Row 2: C inside [x1,x2] ===== -->
  <rect x="170" y="170" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x1</text>
  <text x="380" y="188" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x2</text>
  <!-- center C inside -->
  <circle cx="270" cy="182" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">C = P</text>
  <!-- closest P = C itself -->
  <circle cx="270" cy="182" r="7" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Δx = 0</text>
  <text x="410" y="188" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">closestX = xC</text>
  <text x="410" y="204" font-size="10" fill="#888" filter="url(#rough2)">x1 ≤ xC ≤ x2 → 自身</text>

  <!-- ===== Row 3: C right of [x1,x2] ===== -->
  <rect x="170" y="270" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x1</text>
  <text x="380" y="288" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x2</text>
  <!-- center C right -->
  <circle cx="430" cy="282" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- closest P = x2 -->
  <circle cx="370" cy="282" r="5" fill="#b85450" filter="url(#rough2)"/>
  <line x1="370" y1="282" x2="430" y2="282" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">|Δx|</text>
  <text x="410" y="330" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">closestX = x2</text>
  <text x="300" y="330" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">xC &gt; x2 → 取上界</text>
</svg>
