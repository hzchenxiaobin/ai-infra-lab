<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，回看 k 位决定去留</text>

  <rect x="230" y="40" width="170" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">慢指针 slow = 0</text>

  <path d="M 315 74 L 315 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="92" width="230" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">快指针 i 依次取 nums[i]</text>

  <path d="M 315 126 L 315 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="315,140 465,190 315,240 165,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">slow &lt; k</text>
  <text x="315" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">或 nums[i] ≠ nums[slow−k]？</text>

  <path d="M 165 190 L 120 190 L 120 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="30" y="210" width="180" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">写入 nums[slow] = nums[i]</text>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">然后 slow += 1</text>

  <path d="M 465 190 L 430 190 L 430 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="474" y="182" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="365" y="210" width="130" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">跳过：不写入</text>
  <text x="430" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">该值已留满 k 个</text>

  <path d="M 120 266 L 120 292 L 305 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 266 L 430 292 L 325 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="315" cy="292" r="4" fill="#446688" filter="url(#rough2)"/>

  <path d="M 315 296 L 315 310" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <path d="M 315 310 L 510 310 L 510 111 L 438 111" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="473" y="103" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取下一个元素</text>

  <path d="M 315 310 L 315 326" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="322" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">扫完</text>

  <rect x="215" y="330" width="200" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">截断：只留前 slow 个</text>
  <text x="315" y="367" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">resize / del 后返回</text>
</svg>
