<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">修改图中的边权：下界试探 + 逐条抬升</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">可修改边(w=-1)只能改成正数 → 「下界=1」试出最短，不够再抬</text>

  <!-- ===== mini graph ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">带权图：实线=固定边，虚线=可修改(-1)</text>

  <!-- fixed path S-A-T -->
  <path d="M 78 128 L 178 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <path d="M 202 100 L 372 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>

  <!-- modifiable path S-B-C-T (dashed) -->
  <path d="M 76 140 Q 150 180 178 196" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="110" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">-1</text>
  <path d="M 206 200 L 296 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">-1</text>
  <path d="M 322 198 Q 390 175 412 132" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">-1</text>

  <!-- nodes -->
  <ellipse cx="62" cy="128" rx="22" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="133" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">S</text>
  <ellipse cx="190" cy="90" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="95" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>
  <ellipse cx="190" cy="206" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="211" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <ellipse cx="312" cy="206" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="211" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">C</text>
  <ellipse cx="392" cy="130" rx="22" ry="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">T</text>

  <!-- legend -->
  <text x="440" y="86" font-size="9" fill="#888">固定边路 S-A-T = 8</text>
  <text x="440" y="100" font-size="9" fill="#888">可改路 S-B-C-T</text>
  <text x="440" y="113" font-size="9" fill="#888">设全 1 则 = 3</text>

  <!-- arrow down -->
  <path d="M 280 246 L 280 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="258" font-size="10" fill="#666">把 -1 都先设为 1，跑 Dijkstra 得 d</text>

  <!-- ===== three branches ===== -->
  <text x="30" y="284" font-size="11" fill="#446688" font-weight="bold">按下界 d 分三种情况</text>

  <!-- branch 1: d > target -->
  <rect x="20" y="292" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d &gt; target</text>
  <text x="100" y="326" text-anchor="middle" font-size="9.5" fill="#666">边权全取最小仍超 →</text>
  <text x="100" y="338" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">无解 返回 []</text>

  <!-- branch 2: d == target -->
  <rect x="196" y="292" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="276" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d == target</text>
  <text x="276" y="326" text-anchor="middle" font-size="9.5" fill="#666">最小已恰好命中 →</text>
  <text x="276" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">直接返回(可改边全1)</text>

  <!-- branch 3: d < target -->
  <rect x="372" y="292" width="168" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="456" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d &lt; target</text>
  <text x="456" y="326" text-anchor="middle" font-size="9.5" fill="#666">最短偏低，需把可改边</text>
  <text x="456" y="338" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">逐条抬升 → 进入循环</text>

  <!-- arrow from branch3 down to bump -->
  <path d="M 456 348 L 456 360" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== bump operation ===== -->
  <rect x="20" y="362" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="30" y="380" font-size="11" fill="#446688" font-weight="bold">抬升一步：</text>
  <text x="100" y="380" font-size="10" fill="#333">重跑 Dijkstra(s)、Dijkstra(dest)；在「当前最短路」上找一条可修改边 (u,v)</text>
  <text x="100" y="394" font-size="10" fill="#333">令 w ← w + (target − d) 使该路恰好=target；若最短路全是固定边（无可改边）→ 无解 []</text>
</svg>
