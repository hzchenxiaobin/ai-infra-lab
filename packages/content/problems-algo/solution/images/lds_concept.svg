<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：存在性 exists(L) 关于长度 L 单调</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">「有长度 L 的重复子串」⟹「有长度 L−1 的重复子串」→ 二段性，可二分</text>

  <!-- ===== 长度轴 ===== -->
  <text x="40" y="100" font-size="11" fill="#666">长度 L：</text>
  <g font-size="11">
    <rect x="80" y="86" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="108" y="105" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="136" y="86" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="164" y="105" text-anchor="middle" fill="#3a5a2a" font-weight="bold">2</text>
    <rect x="192" y="86" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="220" y="105" text-anchor="middle" fill="#3a5a2a" font-weight="bold">3</text>
    <rect x="248" y="86" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="276" y="105" text-anchor="middle" fill="#7a5a20" font-weight="bold">L*=3</text>
    <rect x="304" y="86" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="332" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="360" y="86" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="388" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <text x="40" y="140" font-size="11" fill="#666">存在重复？</text>
  <g font-size="12">
    <text x="108" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="164" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="220" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="276" y="140" text-anchor="middle" fill="#d6a040" font-weight="bold">✓ ← 最长</text>
    <text x="332" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="388" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- 区域标注 -->
  <path d="M 80 158 L 276 158" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">L ≤ L*：重复存在（绿区）</text>
  <path d="M 304 158 L 416 158" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="178" text-anchor="middle" font-size="11" fill="#b85450">L &gt; L*：不存在（红区）</text>

  <!-- 分界线 -->
  <path d="M 290 78 L 290 190" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="296" y="194" font-size="11" fill="#d6a040" font-weight="bold">分界点 L*</text>

  <!-- ===== 二分搜索动作 ===== -->
  <rect x="30" y="210" width="500" height="170" fill="#f4f6f8" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">二分逻辑（在长度 L 上二分，不是在下标上）</text>

  <!-- mid ✓ -->
  <rect x="50" y="248" width="220" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">check(mid) = true</text>
  <text x="160" y="288" text-anchor="middle" font-size="10" fill="#555">存在长度 mid 的重复 →</text>
  <text x="160" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a">记 ans=mid，lo = mid+1（试更长）</text>
  <line x1="270" y1="277" x2="300" y2="277" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a">→</text>

  <!-- mid ✗ -->
  <rect x="300" y="248" width="220" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">check(mid) = false</text>
  <text x="410" y="288" text-anchor="middle" font-size="10" fill="#555">不存在 → mid 太长 →</text>
  <text x="410" y="302" text-anchor="middle" font-size="10" fill="#b85450">hi = mid−1（缩短）</text>

  <!-- 证明 hint -->
  <rect x="50" y="320" width="470" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="64" y="340" font-size="10" fill="#7a5a20" font-weight="bold">单调性证明：</text>
  <text x="64" y="356" font-size="10" fill="#555">若 s[p..p+L−1] == s[q..q+L−1]（两处长度 L 相同，p≠q），则其长度 L−1 的前缀也相同且位置不同 → 重复长度 L−1 必存在。</text>
  <text x="475" y="356" font-size="9" fill="#888">↑ 子串「截前缀」保重复性</text>
</svg>
