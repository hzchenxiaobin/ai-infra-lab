<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：在 depth 层插入一行 val 节点</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">找到 depth−1 层的每个节点 cur，在其下方插入新节点，原子树下移一层</text>

  <text x="40" y="72" font-size="12" fill="#446688" font-weight="bold">原始树：root = [4,2,6,3,1,5]</text>

  <line x1="270" y1="100" x2="200" y2="150" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="270" y1="100" x2="340" y2="150" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="200" y1="158" x2="165" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="200" y1="158" x2="235" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="158" x2="305" y2="208" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="270" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <circle cx="200" cy="142" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="200" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <circle cx="340" cy="142" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="340" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>

  <circle cx="165" cy="198" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <circle cx="235" cy="198" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <circle cx="305" cy="198" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <text x="20" y="97" font-size="10" fill="#b85450" font-weight="bold">depth=1</text>
  <text x="20" y="147" font-size="10" fill="#b85450">depth=2</text>
  <text x="20" y="203" font-size="10" fill="#b85450">depth=3</text>

  <line x1="270" y1="230" x2="270" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="234" width="200" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">插入 val=1, depth=2</text>

  <text x="40" y="280" font-size="12" fill="#4a7a3a" font-weight="bold">结果树：[4,1,1,2,null,null,6,3,1,5]</text>

  <line x1="270" y1="308" x2="200" y2="358" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="270" y1="308" x2="340" y2="358" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="200" y1="366" x2="165" y2="416" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="366" x2="375" y2="416" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="165" y1="424" x2="135" y2="474" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="165" y1="424" x2="195" y2="474" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="375" y1="424" x2="375" y2="474" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="270" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <circle cx="200" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="355" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">1</text>

  <circle cx="340" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="355" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">1</text>

  <circle cx="165" cy="412" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="165" y="417" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <circle cx="375" cy="412" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="375" y="417" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>

  <circle cx="135" cy="470" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="475" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <circle cx="195" cy="470" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="475" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <circle cx="375" cy="470" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="475" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <text x="20" y="305" font-size="10" fill="#b85450" font-weight="bold">depth=1</text>
  <text x="20" y="355" font-size="10" fill="#d6a040" font-weight="bold">depth=2(新)</text>
  <text x="20" y="417" font-size="10" fill="#b85450">depth=3</text>
  <text x="20" y="475" font-size="10" fill="#b85450">depth=4</text>

  <rect x="30" y="502" width="480" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="520" text-anchor="middle" font-size="11" fill="#3a5a2a">关键：depth−1 层的每个节点 cur 各生成两个 val 节点</text>
  <text x="270" y="536" text-anchor="middle" font-size="11" fill="#3a5a2a">cur 原左子树 → 新左节点的左子树；原右子树 → 新右节点的右子树</text>
</svg>
