<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：预处理 left/up 表 + 枚举右下角查四边</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">每个 (i,j) 作正方形右下角，边长 k 从大到小试，命中即停</text>

  <!-- B1: build tables -->
  <rect x="135" y="58" width="270" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 预处理 left[i][j]、up[i][j] 两张表</text>
  <text x="270" y="92" text-anchor="middle" font-size="9.5" fill="#888">grid=0→0；grid=1→ left[i][j−1]+1 / up[i−1][j]+1</text>

  <!-- B2: init ans -->
  <rect x="135" y="110" width="270" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② ans = 1（至少有一个 1 即返回 1，否则 0）</text>

  <!-- D1: 遍历 (i,j)? -->
  <polygon points="270,152 350,188 270,224 190,188" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">还有 (i,j) 未枚举?</text>

  <!-- end (right of D1) -->
  <rect x="380" y="164" width="140" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 返回 ans × ans</text>
  <text x="450" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a">面积 = 边长平方</text>

  <!-- B3: k from min(i,j)+1 down to ans+1 -->
  <rect x="135" y="240" width="270" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ k 从 min(i,j)+1 ↓ ans+1 递减枚举</text>
  <text x="270" y="274" text-anchor="middle" font-size="9.5" fill="#888">只试比当前 ans 更大的 k，剪枝</text>

  <!-- D2: 四边都 ≥ k ? -->
  <polygon points="270,296 370,336 270,376 170,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">四边 ≥ k ?</text>
  <text x="270" y="346" text-anchor="middle" font-size="9" fill="#888">left[i][j],up[i][j],</text>
  <text x="270" y="358" text-anchor="middle" font-size="9" fill="#888">left[顶][j],up[i][左]</text>

  <!-- B4: update ans (是) -->
  <rect x="380" y="316" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ ans = k，break</text>

  <!-- B5: k-- (否) -->
  <rect x="40" y="316" width="120" height="40" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="342" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">k −− 继续</text>

  <!-- arrows -->
  <path d="M 270 98 L 270 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 140 L 270 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 -> end (是) -->
  <path d="M 350 188 L 380 188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- D1 -> B3 (是) -->
  <path d="M 270 224 L 270 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="236" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- B3 -> D2 -->
  <path d="M 270 280 L 270 296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2 -> B4 (是) -->
  <path d="M 370 336 L 380 336" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- D2 -> B5 (否) -->
  <path d="M 170 336 L 160 336" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- B5 -> back up to B3 (k--) -->
  <path d="M 100 316 L 100 260 L 135 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="292" font-size="9.5" fill="#888">换更小 k</text>

  <!-- B4 -> back to D1 (next cell) -->
  <path d="M 450 356 L 450 432 L 60 432 L 60 188 L 190 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="424" font-size="10" fill="#4a7a3a" font-weight="bold">回到 ② 枚举下一格</text>

  <!-- footer -->
  <text x="40" y="458" font-size="10" fill="#888">k 递减 + 只试 ans+1 以上 → 单格均摊 O(min(m,n))，总体 O(m·n·min(m,n))</text>
</svg>
