<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种情形各一例</text>

  <!-- table header -->
  <rect x="20" y="44" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="10.5" fill="#444" font-weight="bold">text</text>
  <text x="150" y="64" font-size="10.5" fill="#444" font-weight="bold">groups</text>
  <text x="290" y="64" font-size="10.5" fill="#444" font-weight="bold">命中情形</text>
  <text x="430" y="64" font-size="10.5" fill="#444" font-weight="bold">ans</text>

  <!-- Row 1: ababa -->
  <rect x="20" y="74" width="520" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="98" font-size="11" fill="#333" font-weight="bold">"ababa"</text>
  <text x="40" y="116" font-size="9.5" fill="#888">cnt[a]=3 cnt[b]=2</text>
  <text x="150" y="98" font-size="10.5" fill="#444">a:1 b:1 a:1 b:1 a:1</text>
  <text x="150" y="116" font-size="9.5" fill="#888">i=0: a:1 + a:1, gap=1</text>
  <text x="290" y="98" font-size="10.5" fill="#b85450" font-weight="bold">B 桥接 + 富余</text>
  <text x="290" y="116" font-size="9.5" fill="#555">merged=2, cnt[a]=3&gt;2 → 3</text>
  <text x="430" y="108" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 2: aaabaaa -->
  <rect x="20" y="130" width="520" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="11" fill="#333" font-weight="bold">"aaabaaa"</text>
  <text x="40" y="172" font-size="9.5" fill="#888">cnt[a]=6 cnt[b]=1</text>
  <text x="150" y="154" font-size="10.5" fill="#444">a:3 b:1 a:3</text>
  <text x="150" y="172" font-size="9.5" fill="#888">i=0: a:3 + a:3, gap=1</text>
  <text x="290" y="154" font-size="10.5" fill="#d6a040" font-weight="bold">B 桥接 无富余</text>
  <text x="290" y="172" font-size="9.5" fill="#555">merged=6, cnt[a]=6≯6 → 6</text>
  <text x="430" y="164" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Row 3: aaabbaaa -->
  <rect x="20" y="186" width="520" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="210" font-size="11" fill="#333" font-weight="bold">"aaabbaaa"</text>
  <text x="40" y="228" font-size="9.5" fill="#888">cnt[a]=6 cnt[b]=2</text>
  <text x="150" y="210" font-size="10.5" fill="#444">a:3 b:2 a:3</text>
  <text x="150" y="228" font-size="9.5" fill="#888">i=0: gap=2 ✗ 不桥接</text>
  <text x="290" y="210" font-size="10.5" fill="#446688" font-weight="bold">A 单段延长</text>
  <text x="290" y="228" font-size="9.5" fill="#555">len=3, cnt[a]=6&gt;3 → 4</text>
  <text x="430" y="220" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- swap illustration for row 2 -->
  <text x="40" y="264" font-size="11" fill="#888" font-weight="bold">"aaabaaa" 的交换细节：</text>

  <text x="40" y="290" font-size="10.5" fill="#888">交换前:</text>
  <rect x="110" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="274" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="230" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="245" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="290" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- swap arc b <-> last a -->
  <path d="M 215 272 Q 260 248 305 272" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">swap</text>

  <text x="40" y="330" font-size="10.5" fill="#888">交换后:</text>
  <rect x="110" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="230" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="245" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="314" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="290" y="314" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <!-- bracket for the run of 6 a's -->
  <path d="M 110 352 Q 110 360 116 360 L 284 360 Q 290 360 290 352" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="200" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连续 6 个 a（无富余，不能再 +1）</text>

  <!-- footer note -->
  <rect x="30" y="386" width="500" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="9.5" fill="#888">规律：先看能否桥接（gap=1），再看有无富余决定 +1</text>
</svg>
