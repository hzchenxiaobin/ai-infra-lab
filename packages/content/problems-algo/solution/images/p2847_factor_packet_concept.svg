<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：数位 = 质因子的「小包裹」</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">数位乘积等于 n ⇔ 把 n 的质因子装进若干个值 ≤ 9 的包裹</text>

  <!-- digit packet row: 2..9 -->
  <rect x="72" y="62" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="88" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="100" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="132" y="62" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="160" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="192" y="62" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="88" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="220" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2·2</text>

  <rect x="252" y="62" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="280" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>

  <rect x="312" y="62" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="88" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="340" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2·3</text>

  <rect x="372" y="62" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="400" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>

  <rect x="432" y="62" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="88" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="460" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2·2·2</text>

  <rect x="492" y="62" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="88" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="520" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3·3</text>

  <text x="310" y="142" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">数位拆到最碎只剩质因子 2、3、5、7 —— n 里不能有别的质因子</text>

  <!-- left panel: -1 condition -->
  <rect x="40" y="156" width="280" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无解判定</text>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">试除 2,3,5,7 后残留 &gt; 1</text>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">= 含 ≥ 11 的质因子 → 返回 "-1"</text>
  <text x="180" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">例：44 = 2²·11 ✗　例：13 ✗</text>

  <!-- right panel: 5/7 standalone -->
  <rect x="350" y="156" width="230" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="178" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5、7 单打独斗</text>
  <text x="465" y="200" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5·k ≥ 10（k ≥ 2）不再是数位</text>
  <text x="465" y="218" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个因子 5 → 数位 5</text>
  <text x="465" y="238" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个因子 7 → 数位 7</text>

  <!-- bottom panel: packing density -->
  <rect x="40" y="262" width="540" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="284" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 和 3 才有打包自由度（设剩 a 个 2、b 个 3）</text>
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2 的密度上限：2×2×2 = 8 → 三个 2 捆成一个 8</text>
  <text x="310" y="324" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3 的密度上限：3×3 = 9 → 两个 3 捆成一个 9</text>
  <text x="310" y="342" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">跨类打包只有 2×3 = 6；捆完 8/9 的零头查「余料表」</text>

  <text x="310" y="370" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">位数最少优先（数位 ≥ 2，位数少一位数值必更小）→ 同位数取字典序最小 → 升序拼接</text>
</svg>
