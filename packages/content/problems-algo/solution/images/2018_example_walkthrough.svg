<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：board 3×3, word = "abc"</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">竖直扫描第 1 列 → 槽 [' ',' ','c'] 长度 3 → 正读匹配</text>

  <!-- Board 3x3 grid (left). cell 54x54, x=70,124,178 ; y=70,124,178 -->
  <text x="150" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">board</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <!-- row 0 -->
    <rect x="70"  y="70" width="54" height="54" fill="#666"    stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="97"  y="103" fill="#fff" font-weight="bold">#</text>
    <rect x="124" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="151" y="103" fill="#446688" font-size="11">空</text>
    <rect x="178" y="70" width="54" height="54" fill="#666"    stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="205" y="103" fill="#fff" font-weight="bold">#</text>
    <!-- row 1 -->
    <rect x="70"  y="124" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="97"  y="157" fill="#446688" font-size="11">空</text>
    <rect x="124" y="124" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="151" y="157" fill="#446688" font-size="11">空</text>
    <rect x="178" y="124" width="54" height="54" fill="#666"    stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="205" y="157" fill="#fff" font-weight="bold">#</text>
    <!-- row 2 -->
    <rect x="70"  y="178" width="54" height="54" fill="#666"    stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="97"  y="211" fill="#fff" font-weight="bold">#</text>
    <rect x="124" y="178" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="151" y="211" fill="#d6a040" font-weight="bold">c</text>
    <rect x="178" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="205" y="211" fill="#446688" font-size="11">空</text>
  </g>

  <!-- Highlight col 1 -->
  <rect x="120" y="66" width="62" height="170" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="151" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 列 = 槽（长 3）</text>

  <!-- Extracted slot (middle) -->
  <text x="350" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">槽 seg</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="323" y="70"  width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="350" y="103" fill="#446688" font-size="11">空</text>
    <rect x="323" y="124" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="350" y="157" fill="#446688" font-size="11">空</text>
    <rect x="323" y="178" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="350" y="211" fill="#d6a040" font-weight="bold">c</text>
  </g>

  <!-- Word "abc" (right) -->
  <text x="490" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">word</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="463" y="70"  width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="490" y="103" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="463" y="124" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="490" y="157" fill="#4a7a3a" font-weight="bold">b</text>
    <rect x="463" y="178" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="490" y="211" fill="#4a7a3a" font-weight="bold">c</text>
  </g>

  <!-- Match arrows seg -> word -->
  <g filter="url(#rough2)">
    <path d="M 377 97  L 461 97"  stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="419" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a">空→a</text>
    <path d="M 377 151 L 461 151" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="419" y="144" text-anchor="middle" font-size="9.5" fill="#4a7a3a">空→b</text>
    <path d="M 377 205 L 461 205" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)"/>
    <text x="419" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">c=c</text>
  </g>

  <!-- Result -->
  <rect x="120" y="280" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长度 3 = 3 ✓  字母相容 ✓</text>
  <text x="300" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">上界=网格边界, 下界=网格边界 → return true</text>

  <!-- Note -->
  <rect x="40" y="338" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">若正读不匹配，再试 reversed(word)；示例 3 即靠反读放入</text>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（水平方向同理：逐行按 '#' 切分）</text>
</svg>
