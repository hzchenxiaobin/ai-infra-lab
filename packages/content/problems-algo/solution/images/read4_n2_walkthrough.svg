<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：file="leetcode"，连续两次 read(buf, 5)</text>
  <text x="310" y="44" text-anchor="middle" font-size="10" fill="#888">调用 #1 产生暂存 "ode" · 调用 #2 先消费缓存再撞 EOF</text>

  <!-- ===== 调用 #1 ===== -->
  <rect x="20" y="58" width="580" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">调用 #1：read(buf, 5) → 返回 5，buf = "leetc"</text>

  <!-- 表头 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="90" width="552" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="58" y="105" text-anchor="middle" font-weight="bold">轮</text>
    <text x="110" y="105" text-anchor="middle" font-weight="bold">动作</text>
    <text x="210" y="105" text-anchor="middle" font-weight="bold">buf4</text>
    <text x="330" y="105" text-anchor="middle" font-weight="bold">Ptr,Cnt</text>
    <text x="420" y="105" text-anchor="middle" font-weight="bold">need</text>
    <text x="480" y="105" text-anchor="middle" font-weight="bold">total</text>
    <text x="548" y="105" text-anchor="middle" font-weight="bold">buf</text>
  </g>

  <!-- 行 1：read4 "leet" -->
  <g font-size="9" fill="#444">
    <rect x="34" y="112" width="552" height="34" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="133" text-anchor="middle">1</text>
    <text x="110" y="129" text-anchor="middle" fill="#446688" font-weight="bold">read4</text>
    <text x="110" y="140" text-anchor="middle" font-size="8" fill="#888">缓存空</text>
    <!-- buf4 -->
    <rect x="180" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="191" y="133" text-anchor="middle" fill="#446688" font-weight="bold">l</text>
    <rect x="202" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="213" y="133" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="224" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="235" y="133" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="246" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="257" y="133" text-anchor="middle" fill="#446688" font-weight="bold">t</text>
    <text x="330" y="133" text-anchor="middle" fill="#446688" font-weight="bold">0,4</text>
    <text x="420" y="133" text-anchor="middle" fill="#4a7a3a" font-weight="bold">min(4,5)=4</text>
    <text x="480" y="133" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="548" y="133" text-anchor="middle" font-size="8" fill="#4a7a3a">leet</text>
  </g>

  <!-- 行 2：read4 "code"，只拷 c，暂存 ode -->
  <g font-size="9" fill="#444">
    <rect x="34" y="146" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="58" y="171" text-anchor="middle">2</text>
    <text x="110" y="167" text-anchor="middle" fill="#446688" font-weight="bold">read4</text>
    <text x="110" y="178" text-anchor="middle" font-size="8" fill="#888">缓存空</text>
    <!-- buf4: c 高亮，ode 暂存标记 -->
    <rect x="180" y="152" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="191" y="167" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="202" y="152" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="213" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="224" y="152" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="235" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">d</text>
    <rect x="246" y="152" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="257" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <text x="330" y="167" text-anchor="middle" fill="#446688" font-weight="bold">0,4</text>
    <text x="420" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">min(4,1)=1</text>
    <text x="480" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="548" y="167" text-anchor="middle" font-size="8" fill="#4a7a3a">leetc</text>
    <text x="210" y="182" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">只拷 "c"，剩 "ode" 暂存</text>
  </g>

  <!-- 调用 #1 结束状态 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="186" width="552" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="204" font-weight="bold" fill="#4a7a3a">total==n=5 ⇒ 返回 5</text>
    <text x="240" y="204">成员状态保留：buf4=[c,o,d,e], <tspan fill="#b85450" font-weight="bold">buf4Ptr=1</tspan>, buf4Cnt=4</text>
    <text x="500" y="204" fill="#b85450" font-weight="bold">"ode" 不丢弃！</text>
  </g>

  <!-- ===== 跨调用箭头 ===== -->
  <path d="M 310 268 L 310 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="284" font-size="10" fill="#b85450" font-weight="bold">成员状态原样保留到调用 #2</text>

  <!-- ===== 调用 #2 ===== -->
  <rect x="20" y="292" width="580" height="220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="12" fill="#4a7a3a" font-weight="bold">调用 #2：read(buf, 5) → 返回 3，buf = "ode"</text>

  <!-- 表头 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="324" width="552" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="58" y="339" text-anchor="middle" font-weight="bold">轮</text>
    <text x="110" y="339" text-anchor="middle" font-weight="bold">动作</text>
    <text x="210" y="339" text-anchor="middle" font-weight="bold">buf4</text>
    <text x="330" y="339" text-anchor="middle" font-weight="bold">Ptr,Cnt</text>
    <text x="420" y="339" text-anchor="middle" font-weight="bold">need</text>
    <text x="480" y="339" text-anchor="middle" font-weight="bold">total</text>
    <text x="548" y="339" text-anchor="middle" font-weight="bold">buf</text>
  </g>

  <!-- 行 1：消费缓存 ode（不调 read4） -->
  <g font-size="9" fill="#444">
    <rect x="34" y="346" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="58" y="371" text-anchor="middle">1</text>
    <text x="110" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">用缓存</text>
    <text x="110" y="378" text-anchor="middle" font-size="8" fill="#888">Ptr&lt;Cnt</text>
    <!-- buf4: c 灰（已消费），ode 高亮（本次取） -->
    <rect x="180" y="352" width="22" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="191" y="367" text-anchor="middle" fill="#bbb" font-weight="bold">c</text>
    <rect x="202" y="352" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="213" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">o</text>
    <rect x="224" y="352" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="235" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d</text>
    <rect x="246" y="352" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="257" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="330" y="367" text-anchor="middle" fill="#b85450" font-weight="bold">1,4</text>
    <text x="420" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">min(3,5)=3</text>
    <text x="480" y="367" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="548" y="367" text-anchor="middle" font-size="8" fill="#4a7a3a">ode</text>
    <text x="210" y="382" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">不调 read4，直接取 buf4[1..4)</text>
  </g>

  <!-- 行 2：read4 返回 0，EOF -->
  <g font-size="9" fill="#444">
    <rect x="34" y="386" width="552" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="58" y="407" text-anchor="middle">2</text>
    <text x="110" y="403" text-anchor="middle" fill="#446688" font-weight="bold">read4</text>
    <text x="110" y="414" text-anchor="middle" font-size="8" fill="#888">Ptr==Cnt</text>
    <!-- buf4 全空 -->
    <rect x="180" y="392" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="191" y="407" text-anchor="middle" font-size="8" fill="#aaa">空</text>
    <rect x="202" y="392" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="213" y="407" text-anchor="middle" font-size="8" fill="#aaa">空</text>
    <rect x="224" y="392" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="235" y="407" text-anchor="middle" font-size="8" fill="#aaa">空</text>
    <rect x="246" y="392" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
    <text x="257" y="407" text-anchor="middle" font-size="8" fill="#aaa">空</text>
    <text x="330" y="407" text-anchor="middle" fill="#b85450" font-weight="bold">0,0</text>
    <text x="420" y="407" text-anchor="middle" fill="#b85450" font-weight="bold">EOF</text>
    <text x="480" y="407" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="548" y="407" text-anchor="middle" font-size="8" fill="#4a7a3a">ode</text>
  </g>

  <!-- 调用 #2 结束状态 -->
  <g font-size="10" fill="#444">
    <rect x="34" y="420" width="552" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="438" font-weight="bold" fill="#4a7a3a">buf4Cnt==0 ⇒ break，返回 3</text>
    <text x="300" y="438">全程只调 1 次 read4（返回 0），完整复用上次暂存</text>
  </g>

  <!-- 合计校验 -->
  <rect x="34" y="458" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="476" font-size="10" fill="#444" font-weight="bold">合计校验：</text>
  <text x="60" y="492" font-size="10" fill="#444">两次 read 返回 5 + 3 = <tspan fill="#4a7a3a" font-weight="bold">8</tspan> = file.length ✓　·　read4 有效调用 <tspan fill="#4a7a3a" font-weight="bold">2</tspan> 次（leet+code）= ⌈8/4⌉ + 1 次 EOF 探测（返回 0）</text>

  <!-- 调用 #2 的 read4 实际是第 3 次（含 EOF 探测） -->
  <text x="60" y="524" font-size="9" fill="#888">注：调用 #2 第 2 轮的 read4 返回 0 是「EOF 探测」（文件早已读完），不计入有效读取；有效 read4 调用 = 2 次 = ⌈file.length/4⌉</text>
</svg>
