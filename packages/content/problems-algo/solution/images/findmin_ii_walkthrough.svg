<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 2, 2, 0, 2]</text>

  <!-- column headers -->
  <text x="40" y="56" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="84" y="56" font-size="10.5" fill="#888" font-weight="bold">left</text>
  <text x="120" y="56" font-size="10.5" fill="#888" font-weight="bold">right</text>
  <text x="168" y="56" font-size="10.5" fill="#888" font-weight="bold">mid</text>
  <text x="226" y="56" font-size="10.5" fill="#888" font-weight="bold">数组 (L…R)</text>
  <text x="430" y="56" font-size="10.5" fill="#888" font-weight="bold">比较</text>
  <text x="530" y="56" font-size="10.5" fill="#888" font-weight="bold">动作</text>

  <!-- separator -->
  <line x1="30" y1="64" x2="545" y2="64" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: left=0 right=4 mid=2, nums[mid]=2 == nums[right]=2 -> right-- -->
  <text x="40" y="96" font-size="11" fill="#333">1</text>
  <text x="84" y="96" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="120" y="96" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="168" y="96" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <g filter="url(#rough2)">
    <rect x="226" y="80" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="80" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="298" y="80" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="334" y="80" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="80" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="243" y="98" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="279" y="98" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="315" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="351" y="98" text-anchor="middle" font-size="11" fill="#446688">0</text>
  <text x="387" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="96" font-size="10.5" fill="#d6a040" font-weight="bold">2 == 2</text>
  <text x="530" y="96" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">right=3</text>

  <!-- Row 2: left=0 right=3 mid=1, nums[mid]=2 > nums[right]=0 -> left=mid+1=2 -->
  <text x="40" y="160" font-size="11" fill="#333">2</text>
  <text x="84" y="160" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="120" y="160" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="168" y="160" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <g filter="url(#rough2)">
    <rect x="226" y="144" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="144" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="298" y="144" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="334" y="144" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="370" y="144" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
  </g>
  <text x="243" y="162" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="279" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="315" y="162" text-anchor="middle" font-size="10.5" fill="#bbb">2</text>
  <text x="351" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="387" y="162" text-anchor="middle" font-size="10.5" fill="#bbb">2</text>
  <text x="430" y="160" font-size="10.5" fill="#b85450" font-weight="bold">2 &gt; 0</text>
  <text x="530" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">left=2</text>

  <!-- Row 3: left=2 right=3 mid=2, nums[mid]=2 > nums[right]=0 -> left=mid+1=3 -->
  <text x="40" y="224" font-size="11" fill="#333">3</text>
  <text x="84" y="224" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="120" y="224" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="168" y="224" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <g filter="url(#rough2)">
    <rect x="226" y="208" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="262" y="208" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="298" y="208" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="334" y="208" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="370" y="208" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
  </g>
  <text x="243" y="226" text-anchor="middle" font-size="10.5" fill="#bbb">2</text>
  <text x="279" y="226" text-anchor="middle" font-size="10.5" fill="#bbb">2</text>
  <text x="315" y="226" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="351" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="387" y="226" text-anchor="middle" font-size="10.5" fill="#bbb">2</text>
  <text x="430" y="224" font-size="10.5" fill="#b85450" font-weight="bold">2 &gt; 0</text>
  <text x="530" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">left=3</text>

  <!-- Row 4: end -->
  <text x="40" y="288" font-size="11" fill="#333" font-weight="bold">结束</text>
  <text x="84" y="288" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="120" y="288" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="168" y="288" font-size="11" fill="#888">—</text>
  <g filter="url(#rough2)">
    <rect x="334" y="272" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="351" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="430" y="288" font-size="10.5" fill="#888">left==right</text>
  <text x="530" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 0</text>

  <!-- legend -->
  <line x1="30" y1="324" x2="545" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="340" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="62" y="351" font-size="10" fill="#666">区间内</text>
  <rect x="130" y="340" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="351" font-size="10" fill="#666">mid</text>
  <rect x="200" y="340" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="222" y="351" font-size="10" fill="#666">right 端点</text>
  <rect x="300" y="340" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="322" y="351" font-size="10" fill="#666">最终答案</text>
  <rect x="390" y="340" width="16" height="14" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="351" font-size="10" fill="#666">已收缩出区间</text>

  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#555">第 1 轮 == 歧义仅 right−−（未砍半），后续轮恢复正常二分砍半</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888">平均 O(log n)，最坏全相同值时 O(n)</text>
</svg>
