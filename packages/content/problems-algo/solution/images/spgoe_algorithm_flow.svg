<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="520" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 逐层扩展 + 预算剪枝流程</text>
  <path d="M 130 36 Q 260 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start init -->
  <g filter="url(#sk)">
    <rect x="150" y="52" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">初始化</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#555">队列入 (0,0,k−grid[0][0])，vis[0][0]=该值，steps=0</text>

  <!-- arrow down -->
  <path d="M 260 98 L 260 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: queue empty? -->
  <g filter="url(#sk)">
    <path d="M 260 120 L 330 156 L 260 192 L 190 156 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">队列空?</text>
  <text x="260" y="170" text-anchor="middle" font-size="9" fill="#888">Yes → return -1</text>
  <!-- Yes branch to right -->
  <path d="M 330 156 L 400 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="140" width="84" height="34" rx="6" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="442" y="162" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">不可达 -1</text>

  <!-- No branch down -->
  <text x="246" y="206" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>
  <path d="M 260 192 L 260 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- steps++ and pop layer -->
  <g filter="url(#sk)">
    <rect x="150" y="214" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">steps++，取本层 size，pop (r,c,rem)</text>
  <path d="M 260 254 L 260 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- for each neighbor -->
  <g filter="url(#sk)">
    <rect x="150" y="274" width="220" height="34" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历四邻居 (nr,nc)：nrem = rem − grid[nr][nc]</text>
  <path d="M 260 308 L 260 326" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: nrem < 0 ? -->
  <g filter="url(#sk)">
    <path d="M 260 330 L 330 360 L 260 390 L 190 360 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">nrem &lt; 0 ?</text>
  <text x="260" y="372" text-anchor="middle" font-size="9" fill="#888">(障碍且无额度)</text>
  <text x="340" y="356" font-size="10" fill="#b03a3a" font-weight="bold">Yes → 跳过</text>
  <path d="M 260 390 L 260 408" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="404" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- diamond: nrem <= vis ? -->
  <g filter="url(#sk)">
    <path d="M 260 410 L 340 440 L 260 470 L 180 440 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="438" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">nrem ≤ vis[nr][nc]?</text>
  <text x="260" y="452" text-anchor="middle" font-size="9" fill="#888">(非更优)</text>
  <text x="350" y="436" font-size="10" fill="#b03a3a" font-weight="bold">Yes → 跳过</text>
  <path d="M 260 470 L 260 488" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="484" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- final: check dest & push -->
  <g filter="url(#sk)">
    <rect x="120" y="490" width="290" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="265" y="508" text-anchor="middle" font-size="10" fill="#2b4b6e" font-weight="bold">到终点? return steps : vis=nrem, push (nr,nc,nrem)</text>

  <!-- loop back arrow: from push box up the left side to queue-empty diamond -->
  <path d="M 120 503 L 70 503 L 70 156 L 188 156" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="60" y="330" font-size="10" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 60 330)">回到队首判断</text>
</svg>
