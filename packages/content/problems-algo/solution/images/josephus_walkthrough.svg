<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=5, m=3</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">递推表：从 f(1)=0 逐步推到 f(5)=3</text>

  <!-- ===== Recurrence table ===== -->
  <!-- column header -->
  <rect x="40" y="56" width="80" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="73" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">i (人数)</text>
  <rect x="124" y="56" width="140" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="73" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">计算 (ans+m)%i</text>
  <rect x="266" y="56" width="80" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="73" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">f(i,3)</text>
  <rect x="348" y="56" width="180" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="73" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">剩余圈（删除过程）</text>

  <!-- row i=1 -->
  <rect x="40" y="86" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="124" y="86" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a">边界（只剩1人）</text>
  <rect x="266" y="86" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="348" y="86" width="180" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="103" text-anchor="middle" font-size="11" fill="#888">[0,1,2,3,4]</text>

  <!-- row i=2 -->
  <rect x="40" y="116" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="133" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="124" y="116" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="133" text-anchor="middle" font-size="11" fill="#446688">(0+3)%2 = 1</text>
  <rect x="266" y="116" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="133" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="348" y="116" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="133" text-anchor="middle" font-size="11" fill="#b85450">删 2 → [3,4,0,1]</text>

  <!-- row i=3 -->
  <rect x="40" y="146" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="124" y="146" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="163" text-anchor="middle" font-size="11" fill="#446688">(1+3)%3 = 1</text>
  <rect x="266" y="146" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="348" y="146" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="163" text-anchor="middle" font-size="11" fill="#b85450">删 0 → [1,3,4]</text>

  <!-- row i=4 -->
  <rect x="40" y="176" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <rect x="124" y="176" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="193" text-anchor="middle" font-size="11" fill="#446688">(1+3)%4 = 0</text>
  <rect x="266" y="176" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <rect x="348" y="176" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="193" text-anchor="middle" font-size="11" fill="#b85450">删 4 → [1,3]</text>

  <!-- row i=5 (highlighted) -->
  <rect x="40" y="206" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="224" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <rect x="124" y="206" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(0+3)%5 = 3</text>
  <rect x="266" y="206" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="224" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <rect x="348" y="206" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="438" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删 1 → [3] ✓</text>

  <!-- ===== verification: elimination sequence ===== -->
  <path d="M 280 244 L 280 262" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="266" width="440" height="120" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">验证：实际删除顺序（每轮数 3 个，从上轮被删者的下一位开始）</text>

  <!-- step 1 -->
  <text x="76" y="308" font-size="10" fill="#888">①</text>
  <rect x="92" y="296" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="311" text-anchor="middle" font-size="10" fill="#446688">0 1 [2] 3 4</text>
  <text x="200" y="311" font-size="9" fill="#b85450">数3→删2</text>

  <!-- step 2 -->
  <text x="76" y="336" font-size="10" fill="#888">②</text>
  <rect x="92" y="324" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="339" text-anchor="middle" font-size="10" fill="#446688">3 4 [0] 1</text>
  <text x="200" y="339" font-size="9" fill="#b85450">数3→删0</text>

  <!-- step 3 -->
  <text x="290" y="308" font-size="10" fill="#888">③</text>
  <rect x="306" y="296" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="351" y="311" text-anchor="middle" font-size="10" fill="#446688">1 3 [4]</text>
  <text x="404" y="311" font-size="9" fill="#b85450">数3→删4</text>

  <!-- step 4 -->
  <text x="290" y="336" font-size="10" fill="#888">④</text>
  <rect x="306" y="324" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="351" y="339" text-anchor="middle" font-size="10" fill="#446688">1 [3] →</text>
  <text x="404" y="339" font-size="9" fill="#b85450">数3→删1</text>

  <!-- final result -->
  <rect x="92" y="354" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最后剩下：3 ✓ 与递推结果一致</text>

  <!-- key insight -->
  <rect x="60" y="398" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 递推只关心「编号」，不真正删除</text>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888">f(5)=3：5 人圈从 0 开始数 3 的幸存者，与右栏模拟逐一吻合</text>
</svg>
