<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分组 + 布尔聚合 + 四舍五入（每天一行占比）</text>

  <!-- ① FROM Delivery -->
  <rect x="10" y="86" width="96" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM</text>
  <text x="58" y="126" text-anchor="middle" font-size="9" fill="#666">Delivery</text>
  <text x="58" y="142" text-anchor="middle" font-size="9" fill="#666">读取全部订单</text>

  <path d="M 110 121 L 124 121" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② GROUP BY order_date -->
  <rect x="126" y="86" width="96" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="174" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② GROUP BY</text>
  <text x="174" y="126" text-anchor="middle" font-size="9" fill="#666">order_date</text>
  <text x="174" y="142" text-anchor="middle" font-size="9" fill="#666">同日归为一组</text>

  <path d="M 226 121 L 240 121" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ AVG(布尔)*100 -->
  <rect x="242" y="86" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="292" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ AVG(条件)</text>
  <text x="292" y="126" text-anchor="middle" font-size="9" fill="#666">× 100</text>
  <text x="292" y="142" text-anchor="middle" font-size="9" fill="#666">组内求即时占比</text>

  <path d="M 346 121 L 360 121" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ ROUND(...,2) -->
  <rect x="362" y="86" width="86" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ ROUND</text>
  <text x="405" y="126" text-anchor="middle" font-size="9" fill="#666">(..., 2)</text>
  <text x="405" y="142" text-anchor="middle" font-size="9" fill="#666">四舍五入</text>

  <path d="M 452 121 L 466 121" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ ORDER BY order_date -->
  <rect x="468" y="86" width="84" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⑤ ORDER BY</text>
  <text x="510" y="126" text-anchor="middle" font-size="9" fill="#666">order_date</text>
  <text x="510" y="142" text-anchor="middle" font-size="9" fill="#666">升序输出</text>

  <!-- lower detail: step-by-step -->
  <rect x="20" y="180" width="520" height="100" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="36" y="202" font-size="10" fill="#555" font-weight="bold">逐步说明</text>
  <text x="36" y="220" font-size="10" fill="#666">① 整张 Delivery 表（10 行）作为输入。</text>
  <text x="36" y="236" font-size="10" fill="#666">② 按 order_date 分组，10 行归为 4 组（08-01、08-02、08-03、08-04）。</text>
  <text x="36" y="252" font-size="10" fill="#666">③ 每组对布尔表达式 order_date=pref_date 取 AVG（TRUE=1/FALSE=0），乘 100 转百分比。</text>
  <text x="36" y="268" font-size="10" fill="#666">④ ROUND 四舍五入保留两位小数（如 66.667 → 66.67）。⑤ 按 order_date 升序输出 4 行。</text>
</svg>
