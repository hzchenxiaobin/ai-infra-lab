<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：误差数组 d 与它的差分 e（两端接哨兵 0）</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 2：nums = [1, 3, 2]，target = [2, 1, 4] —— 目标是把 d 全部归零</text>

  <!-- Panel A: 归一化 -->
  <rect x="22" y="52" width="536" height="142" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 归一化（官方 hint 1）：d[i] = nums[i] − target[i]</text>

  <text x="142" y="98" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="150" y="80" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="80" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="234" y="80" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="142" y="130" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">target =</text>
  <rect x="150" y="112" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="192" y="112" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="234" y="112" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="142" y="162" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">d =</text>
  <rect x="150" y="144" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="162" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="192" y="144" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="162" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="234" y="144" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="162" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>

  <text x="330" y="96" font-size="10.5" fill="#555" filter="url(#rough2)">只有「差多少」是本质信息；</text>
  <text x="330" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">操作照旧：任选子数组整体 ±1，</text>
  <text x="330" y="128" font-size="10.5" fill="#555" filter="url(#rough2)">把 d 抹成全 0 即达成目标</text>

  <text x="290" y="186" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d &gt; 0 的位置要变小（用 −1 操作），d &lt; 0 的位置要变大（用 +1 操作）</text>

  <!-- Panel B: 差分 -->
  <rect x="22" y="206" width="536" height="204" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 差分：给 d 两端各接一个哨兵 0，取相邻差得 e</text>

  <rect x="118" y="240" width="36" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="136" y="260" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="160" y="240" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="260" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="204" y="240" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="260" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="248" y="240" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="260" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="292" y="240" width="36" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <path d="M 157 274 L 157 292" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 202 274 L 202 292" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 246 274 L 246 292" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 274 L 290 292" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="128" y="316" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">e =</text>
  <rect x="138" y="296" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="184" y="296" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="230" y="296" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−4</text>
  <rect x="276" y="296" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="157" y="340" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e₀=d₀−0</text>
  <text x="203" y="340" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e₁=d₁−d₀</text>
  <text x="249" y="340" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e₂=d₂−d₁</text>
  <text x="295" y="340" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e₃=0−d₂</text>

  <text x="370" y="306" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正差分：3 + 2 = 5</text>
  <text x="370" y="326" font-size="11" fill="#b85450" filter="url(#rough2)">负差分：−1、−4（合计 −5）</text>
  <text x="370" y="346" font-size="10" fill="#555" filter="url(#rough2)">首尾相接 Σe ≡ 0 → 正负必配平</text>
  <text x="370" y="368" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 正差分之和 = 5 ✓</text>

  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">换个记法：答案 = Σ|e| / 2 —— 误差轮廓「起伏总量」的一半</text>
</svg>
