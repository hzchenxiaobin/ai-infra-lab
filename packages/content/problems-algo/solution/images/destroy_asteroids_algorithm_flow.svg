<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序升序 + 一趟贪心吸收</text>

  <!-- ① 排序 -->
  <rect x="90" y="44" width="240" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="65" text-anchor="middle" font-size="11" fill="#444">① sort(asteroids)  升序排列</text>
  <path d="M 210 76 L 210 90" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② 初始化 i=0 -->
  <rect x="90" y="92" width="240" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="113" text-anchor="middle" font-size="11" fill="#444">② i = 0  （指向最小小行星）</text>
  <path d="M 210 124 L 210 138" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ diamond: i < n ? -->
  <polygon points="210,140 320,172 210,204 100,172" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="176" text-anchor="middle" font-size="11" fill="#444">③ i &lt; n ?</text>
  <!-- ③ No → return true -->
  <path d="M 320 172 L 416 172" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="368" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a">No 全吞完</text>
  <rect x="418" y="158" width="150" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>
  <!-- ③ Yes → down -->
  <path d="M 210 204 L 210 218" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="224" y="214" font-size="9" fill="#4a7a3a">Yes</text>

  <!-- ④ diamond: mass >= asteroids[i] ? -->
  <polygon points="210,220 360,262 210,304 60,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="258" text-anchor="middle" font-size="11" fill="#444">④ mass ≥ asteroids[i] ?</text>
  <text x="210" y="274" text-anchor="middle" font-size="9" fill="#888">（行星质量够吞这颗？）</text>
  <!-- ④ No → return false -->
  <path d="M 60 262 L 30 262 L 30 338 L 96 338" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="38" y="300" font-size="9" fill="#b85450">No 吞不动</text>
  <rect x="98" y="324" width="150" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <!-- ④ Yes → down -->
  <path d="M 210 304 L 210 318" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="224" y="314" font-size="9" fill="#4a7a3a">Yes 吞掉</text>

  <!-- ⑤ mass += asteroids[i]; i++ -->
  <rect x="90" y="320" width="240" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="341" text-anchor="middle" font-size="11" fill="#444">⑤ mass += asteroids[i];  i++</text>

  <!-- loop back to ③ -->
  <path d="M 330 336 L 380 336 L 380 172 L 320 172" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="258" font-size="9" fill="#888">回到 ③</text>
  <text x="388" y="270" font-size="9" fill="#888">继续下一颗</text>

  <!-- bottom note -->
  <rect x="40" y="376" width="520" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="398" font-size="11" fill="#444">一趟 O(n)：每颗小行星只比较+吸收一次；提前 return false 让失败用例快速结束</text>
</svg>
