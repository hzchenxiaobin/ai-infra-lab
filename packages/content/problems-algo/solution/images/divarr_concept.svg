<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：追加一位数字 = 旧值 × 10 + d，余数滚动传递</text>

  <!-- old prefix digits: 9 9 8 2 -->
  <text x="40" y="78" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">已处理</text>
  <rect x="80" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
  <rect x="126" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
  <rect x="172" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="194" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8</text>
  <rect x="218" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>

  <!-- arrow adding new digit -->
  <path d="M 268 80 L 296 80" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="72" text-anchor="middle" font-size="10" fill="#b85450">追加</text>

  <!-- new digit 4 -->
  <rect x="302" y="54" width="48" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="71" text-anchor="middle" font-size="9.5" fill="#b85450">新位 d</text>
  <text x="326" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">4</text>

  <!-- old value box -->
  <rect x="60" y="128" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="153" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">旧前缀数值 = 9982，其余数 r_old = 1</text>

  <!-- formula box: new value = old * 10 + d -->
  <path d="M 180 168 L 180 184" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="188" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">新前缀数值 = 旧值 × 10 + d　=　9982 × 10 + 4 = 99824</text>

  <!-- mod distributivity -->
  <path d="M 280 228 L 280 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="248" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">取模可分配：(旧值×10+d) mod m = (r_old×10 + d) mod m</text>
  <text x="280" y="285" text-anchor="middle" font-size="11.5" fill="#333">⇒ r_new = (1 × 10 + 4) mod 3 = 14 mod 3 = 2　✓ div[4]=0</text>

  <!-- takeaway -->
  <rect x="40" y="308" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">只需维护余数 r（始终 &lt; m），不必保留整个大数</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#888">每步：r = (r×10 + d) % m，若 r==0 则 div[i]=1</text>
  <text x="280" y="361" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">10⁵ 位数字也无法溢出 long long（r×10+d ≤ 10¹⁰）</text>
</svg>
