<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 442" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="442" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐行定向，只走保留格（步长 2）</text>

  <!-- start -->
  <rect x="210" y="40" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：ans = []</text>

  <path d="M 280 74 L 280 94" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="195" y="96" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举行 i = 0 … m−1</text>

  <!-- side note -->
  <rect x="400" y="88" width="148" height="70" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="474" y="108" text-anchor="middle" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">start = (i·n) mod 2</text>
  <text x="474" y="124" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">行 i 首个保留格的行内序号</text>
  <text x="474" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（「交替」跨行连续的体现）</text>

  <path d="M 280 130 L 280 152" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: parity of i -->
  <polygon points="280,154 366,192 280,230 194,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">i 是偶数？</text>

  <path d="M 194 192 L 166 192" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 366 192 L 394 192" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- left branch: even row -->
  <rect x="22" y="166" width="144" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="94" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶数行：向右 →</text>
  <text x="94" y="202" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">列 j = start, start+2, …</text>
  <text x="94" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">直到 j ≥ n 停</text>

  <!-- right branch: odd row -->
  <rect x="394" y="166" width="144" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="466" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">奇数行：向左 ←</text>
  <text x="466" y="202" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">列 j = n−1−start, −2, …</text>
  <text x="466" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">直到 j &lt; 0 停</text>

  <!-- merge arrows -->
  <path d="M 94 222 L 94 252 L 270 252" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 466 222 L 466 252 L 290 252" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- collect -->
  <rect x="188" y="262" width="184" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">沿途收集 grid[i][j] 进 ans</text>

  <path d="M 280 296 L 280 318" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: more rows? -->
  <polygon points="280,320 356,354 280,388 204,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">还有下一行？</text>

  <!-- yes: loop back -->
  <path d="M 204 354 L 70 354 L 70 113 L 193 113" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="346" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是：i+1</text>

  <!-- no: return -->
  <path d="M 280 388 L 280 404" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="400" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="176" y="406" width="208" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans（⌈mn/2⌉ 个值）</text>
</svg>
