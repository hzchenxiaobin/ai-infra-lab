<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2787w" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10, x = 2，物品 w = [1, 4, 9]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[j] = 凑出 j 的方案数；每行底色为更新后的 dp 值</text>

  <!-- column headers j=0..10 -->
  <g font-size="10" fill="#888">
    <text x="61"  y="72" text-anchor="middle">0</text>
    <text x="103" y="72" text-anchor="middle">1</text>
    <text x="145" y="72" text-anchor="middle">2</text>
    <text x="187" y="72" text-anchor="middle">3</text>
    <text x="229" y="72" text-anchor="middle">4</text>
    <text x="271" y="72" text-anchor="middle">5</text>
    <text x="313" y="72" text-anchor="middle">6</text>
    <text x="355" y="72" text-anchor="middle">7</text>
    <text x="397" y="72" text-anchor="middle">8</text>
    <text x="439" y="72" text-anchor="middle">9</text>
    <text x="485" y="72" text-anchor="middle">10</text>
  </g>

  <!-- Row 1: init dp -->
  <text x="36" y="100" font-size="11" fill="#446688" font-weight="bold">init</text>
  <g font-size="11" fill="#333">
    <rect x="40"  y="84" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/><text x="61"  y="102" text-anchor="middle">1</text>
    <rect x="82"  y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="103" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="124" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="145" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="166" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="187" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="208" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="229" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="250" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="271" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="292" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="313" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="334" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="355" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="376" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="397" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="418" y="84" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="439" y="102" text-anchor="middle" fill="#bbb">0</text>
    <rect x="460" y="84" width="50" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="485" y="102" text-anchor="middle" fill="#bbb">0</text>
  </g>

  <!-- Row 2: after w=1 -->
  <text x="36" y="138" font-size="11" fill="#d6a040" font-weight="bold">w=1</text>
  <g font-size="11" fill="#333">
    <rect x="40"  y="122" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/><text x="61"  y="140" text-anchor="middle">1</text>
    <rect x="82"  y="122" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="103" y="140" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="124" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="145" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="166" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="187" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="208" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="229" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="250" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="271" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="292" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="313" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="334" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="355" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="376" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="397" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="418" y="122" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="439" y="140" text-anchor="middle" fill="#bbb">0</text>
    <rect x="460" y="122" width="50" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="485" y="140" text-anchor="middle" fill="#bbb">0</text>
  </g>

  <!-- Row 3: after w=4 -->
  <text x="36" y="176" font-size="11" fill="#d6a040" font-weight="bold">w=4</text>
  <g font-size="11" fill="#333">
    <rect x="40"  y="160" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/><text x="61"  y="178" text-anchor="middle">1</text>
    <rect x="82"  y="160" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="103" y="178" text-anchor="middle">1</text>
    <rect x="124" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="145" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="166" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="187" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="208" y="160" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="229" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="250" y="160" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="271" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="292" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="313" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="334" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="355" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="376" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="397" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="418" y="160" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="439" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="460" y="160" width="50" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="485" y="178" text-anchor="middle" fill="#bbb">0</text>
  </g>

  <!-- Row 4: after w=9 -->
  <text x="36" y="214" font-size="11" fill="#d6a040" font-weight="bold">w=9</text>
  <g font-size="11" fill="#333">
    <rect x="40"  y="198" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/><text x="61"  y="216" text-anchor="middle">1</text>
    <rect x="82"  y="198" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="103" y="216" text-anchor="middle">1</text>
    <rect x="124" y="198" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="145" y="216" text-anchor="middle" fill="#bbb">0</text>
    <rect x="166" y="198" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="187" y="216" text-anchor="middle" fill="#bbb">0</text>
    <rect x="208" y="198" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="229" y="216" text-anchor="middle">1</text>
    <rect x="250" y="198" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="271" y="216" text-anchor="middle">1</text>
    <rect x="292" y="198" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="313" y="216" text-anchor="middle" fill="#bbb">0</text>
    <rect x="334" y="198" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="355" y="216" text-anchor="middle" fill="#bbb">0</text>
    <rect x="376" y="198" width="42" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="397" y="216" text-anchor="middle" fill="#bbb">0</text>
    <rect x="418" y="198" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="439" y="216" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="460" y="198" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/><text x="485" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- update annotations -->
  <text x="200" y="248" font-size="10" fill="#888">● 高亮格 = 本轮新获得方案数（dp[j] += dp[j−w]）</text>
  <text x="200" y="264" font-size="10" fill="#888">● w=1: dp[1]=dp[0]=1　w=4: dp[4]=dp[0], dp[5]=dp[1]　w=9: dp[9]=dp[0], dp[10]=dp[1]</text>

  <!-- Conclusion box -->
  <rect x="30" y="284" width="500" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终 dp[10] = 1，即唯一方案 {1², 3²} = 1 + 9 = 10</text>
  <text x="50" y="330" font-size="11" fill="#666">① 初始化 dp[0] = 1（空集凑出 0 算一种方案，是所有转移的种子）</text>
  <text x="50" y="352" font-size="11" fill="#666">② 每个物品只更新「能被它凑出新方案」的位置，逆序保证不重复选</text>
  <text x="50" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">③ 对 j=10：选 9 → 剩 1，dp[1] 在前面 w=1 轮已置 1 → dp[10] += 1 → 1 ✓</text>
  <text x="50" y="394" font-size="11" fill="#888">对照 n=4, x=1：物品 [1,2,3,4]，最终 dp[4] = 2（{4} 与 {1,3}）</text>
</svg>
