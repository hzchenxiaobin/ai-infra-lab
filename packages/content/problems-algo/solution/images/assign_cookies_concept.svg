<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">概念：小饼干优先喂小贪心孩子，大饼干留给大贪心孩子</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">排序后双指针：当前最小饼干能喂当前最小贪心孩子就喂，否则丢掉这块饼干</text>

  <!-- children row label -->
  <text x="46" y="116" font-size="12" fill="#446688" font-weight="bold">孩子</text>
  <!-- child g=1 at x=170 -->
  <ellipse cx="170" cy="110" rx="36" ry="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="106" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">贪心</text>
  <text x="170" y="124" text-anchor="middle" font-size="15" fill="#2a4a66" font-weight="bold">1</text>
  <!-- child g=2 at x=330 -->
  <ellipse cx="330" cy="110" rx="36" ry="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">贪心</text>
  <text x="330" y="124" text-anchor="middle" font-size="15" fill="#2a4a66" font-weight="bold">2</text>

  <!-- cookies row label -->
  <text x="46" y="266" font-size="12" fill="#d6a040" font-weight="bold">饼干</text>
  <!-- cookie s=1 at x=170 -->
  <ellipse cx="170" cy="260" rx="32" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="266" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">尺寸1</text>
  <!-- cookie s=2 at x=330 -->
  <ellipse cx="330" cy="260" rx="32" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">尺寸2</text>
  <!-- cookie s=3 leftover at x=478 -->
  <ellipse cx="478" cy="260" rx="32" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="266" text-anchor="middle" font-size="12" fill="#a67830" font-weight="bold">尺寸3</text>

  <!-- match arrows child -> cookie -->
  <line x1="170" y1="140" x2="170" y2="234" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="330" y1="140" x2="330" y2="234" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- leftover annotation -->
  <text x="478" y="300" text-anchor="middle" font-size="11" fill="#a67830">剩余大饼干</text>
  <text x="478" y="314" text-anchor="middle" font-size="10" fill="#a67830">留给更大孩子</text>

  <!-- captions -->
  <rect x="40" y="330" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#555">贪心=1 的孩子用尺寸=1 的饼干满足；贪心=2 的孩子用尺寸=2 的饼干满足</text>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#555">尺寸=3 的大饼干留给后面更大的孩子——别把它浪费在小贪心孩子身上</text>
</svg>
