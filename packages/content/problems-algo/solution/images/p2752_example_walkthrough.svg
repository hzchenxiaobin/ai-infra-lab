<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：三顾客的岛与段长</text>

  <!-- column headers -->
  <text x="50" y="48" font-size="11" fill="#888" filter="url(#rough2)">顾客</text>
  <text x="230" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">交易日期 → 岛（同色同岛）</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最长段</text>

  <!-- Customer 101 -->
  <text x="50" y="74" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <rect x="110" y="60" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-01</text>
  <rect x="188" y="60" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-02</text>
  <rect x="266" y="60" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-03</text>
  <!-- bracket -->
  <path d="M110,90 L110,96 L336,96 L336,90" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="223" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛 长 3</text>
  <rect x="450" y="64" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Customer 102 -->
  <text x="50" y="138" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">102</text>
  <rect x="110" y="124" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-01</text>
  <!-- gap -->
  <text x="223" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⋯ 缺 5-02</text>
  <rect x="266" y="124" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-03</text>
  <rect x="344" y="124" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-04</text>
  <!-- brackets: A under 5-01, B under 5-03..5-04 -->
  <path d="M110,154 L110,160 L180,160 L180,154" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="145" y="174" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">岛A 长1</text>
  <path d="M266,154 L266,160 L414,160 L414,154" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">岛B 长2</text>
  <rect x="450" y="128" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- Customer 105 -->
  <text x="50" y="202" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">105</text>
  <rect x="110" y="188" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-01</text>
  <rect x="188" y="188" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-02</text>
  <rect x="266" y="188" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5-03</text>
  <path d="M110,218 L110,224 L336,224 L336,218" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="223" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛 长 3</text>
  <rect x="450" y="192" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- separator -->
  <line x1="30" y1="258" x2="510" y2="258" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- global max -->
  <text x="30" y="286" font-size="12" fill="#888" filter="url(#rough2)">全局最大段长 =</text>
  <rect x="170" y="272" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="195" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M240,284 L270,284" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="288" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">由 101 与 105 并列共享</text>

  <!-- output -->
  <text x="30" y="330" font-size="12" fill="#888" filter="url(#rough2)">输出（筛回所有 max = 3 的顾客）：</text>
  <rect x="280" y="316" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="315" y="334" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <rect x="360" y="316" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="334" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">105</text>

  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键：同段同色同键、异段异键；并列第一用 = (SELECT MAX(...)) 全部保留</text>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">102 的 5-02 缺交易使岛键跳变，自动裂为岛 A、岛 B 两段，无需显式比较相邻行</text>
  <text x="270" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 返回 101、105</text>
</svg>
