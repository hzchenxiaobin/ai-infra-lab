<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="530" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举左上角 → 全新双表 → 数字格直比 / 字母格双查 → 首个命中即返回</text>

  <!-- start -->
  <ellipse cx="260" cy="44" rx="34" ry="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 59 L 260 71" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 1: enumerate -->
  <rect x="110" y="73" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 行主序枚举左上角 (i, j)：外层 i、内层 j</text>
  <path d="M 260 103 L 260 115" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: exhausted? -->
  <polygon points="260,117 350,145 260,173 170,145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">候选耗尽？</text>
  <text x="356" y="137" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 145 L 382 145" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="384" y="131" width="122" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [-1,-1]</text>
  <text x="268" y="183" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 173 L 260 187" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 2: fresh maps -->
  <rect x="110" y="189" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② check(i,j)：新建空表 l2d = { }、d2l = { }</text>
  <path d="M 260 219 L 260 231" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 3: next cell -->
  <rect x="110" y="233" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 取下一格：ch=pattern[a][b]，d=board[i+a][j+b]</text>
  <path d="M 260 263 L 260 275" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: cells done? -->
  <polygon points="260,277 345,305 260,333 175,305" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">格子取完？</text>
  <text x="351" y="297" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 345 305 L 380 305" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="382" y="283" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="444" y="300" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">返回 [i, j]</text>
  <text x="444" y="317" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">首个命中=行最小列最小</text>
  <text x="268" y="343" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 333 L 260 347" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 3: digit or letter? -->
  <polygon points="260,349 350,379 260,409 170,379" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ch 是数字？</text>
  <text x="270" y="425" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是 · 数字</text>
  <path d="M 260 409 L 260 423" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- letter branch (right) -->
  <text x="360" y="370" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 · 字母</text>
  <path d="M 350 379 L 382 379" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="384" y="345" width="122" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="363" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">字母格双向校验</text>
  <text x="445" y="380" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">l2d[ch]≠d 或 d2l[d]≠ch</text>
  <text x="445" y="393" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 冲突即 ✗</text>
  <text x="445" y="407" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">无冲突 ⇒ 写入两表</text>

  <!-- digit branch (down) -->
  <rect x="110" y="425" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="441" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数字格锚点直比：ch−'0' ≠ d ⇒ ✗</text>
  <text x="260" y="458" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">相等 ⇒ 下一格（回 ③）</text>

  <!-- loop back to phase 3 -->
  <path d="M 260 467 C 250 484, 70 486, 50 400 L 50 258 Q 50 248, 62 248 L 106 248" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 445 417 C 445 468, 100 478, 54 404" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="42" y="330" font-size="9.5" fill="#999" filter="url(#rough2)">下一格</text>
  <text x="42" y="344" font-size="9.5" fill="#999" filter="url(#rough2)">回 ③</text>

  <!-- fail note -->
  <rect x="110" y="492" width="396" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="308" y="511" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">任一格 ✗ ⇒ 该候选立即作废，换下一个 (i, j) 回 ① 继续枚举</text>
</svg>
