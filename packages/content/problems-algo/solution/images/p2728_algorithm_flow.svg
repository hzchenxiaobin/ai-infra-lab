<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2728b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：清场 → 标记 → 计数（三步法）</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 清场：关 k 扇门</text>
  <text x="150" y="90" text-anchor="middle" font-size="10" fill="#446688">循环 k 次：closeDoor(); moveRight()</text>
  <text x="150" y="106" text-anchor="middle" font-size="10" fill="#888">n ≤ k ⇒ 覆盖整圈，所有门必闭</text>

  <!-- Step 2 -->
  <rect x="300" y="50" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 标记：开当前门</text>
  <text x="410" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a">openDoor()</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#888">此时全场唯一一扇开着的门</text>

  <!-- arrow 1->2 -->
  <path d="M260,85 L298,85" stroke="#446688" stroke-width="2" marker-end="url(#arr2728b)" filter="url(#rough2)"/>

  <!-- Step 3: counting loop with decision diamond -->
  <rect x="180" y="160" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 向右走并计数</text>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#d6a040">moveRight(); ans++</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">每走一格 ans + 1</text>

  <!-- arrow 2->3 -->
  <path d="M410,120 L410,140 Q410,160 390,160 L300,160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2728b)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,250 360,295 280,340 200,295" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遇到</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">开门?</text>

  <!-- arrow 3->diamond -->
  <path d="M280,220 L280,248" stroke="#446688" stroke-width="2" marker-end="url(#arr2728b)" filter="url(#rough2)"/>

  <!-- NO: loop back to step3 -->
  <path d="M200,295 L150,295 L150,190 L178,190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2728b)" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- YES: end -->
  <path d="M280,340 L280,368" stroke="#b85450" stroke-width="2" marker-end="url(#arr2728b)" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- result -->
  <rect x="180" y="370" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans = n（绕整圈回到标记）</text>
</svg>
