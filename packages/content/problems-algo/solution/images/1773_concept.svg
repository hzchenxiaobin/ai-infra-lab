<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：ruleKey 一次性映射为列下标 idx，循环内只比对一列</text>
  <path d="M 120 36 Q 360 44 600 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== ruleKey input (top-left) ===== -->
  <text x="40" y="72" font-size="12" fill="#888" font-weight="bold">输入：ruleKey（常量）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="120" y="102" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ruleKey = "color"</text>

  <!-- ===== Hash map (middle) ===== -->
  <text x="270" y="72" font-size="12" fill="#888" font-weight="bold">哈希映射 mp（一次性查表）</text>
  <g filter="url(#rough2)">
    <rect x="270" y="80" width="180" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mp = { ... }</text>
  <text x="290" y="120" font-size="11" fill="#333">"type"  → 0</text>
  <text x="290" y="138" font-size="11" fill="#d6a040" font-weight="bold">"color" → 1</text>
  <text x="290" y="156" font-size="11" fill="#333">"name"  → 2</text>

  <!-- arrow ruleKey -> map -->
  <path d="M 202 97 L 266 97" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="90" text-anchor="middle" font-size="9" fill="#888">查一次</text>

  <!-- ===== idx output ===== -->
  <g filter="url(#rough2)">
    <rect x="490" y="80" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="565" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">idx = 1</text>

  <!-- arrow map -> idx -->
  <path d="M 452 97 L 486 97" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="469" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a">外提</text>

  <!-- ===== items table (bottom-left) ===== -->
  <text x="40" y="200" font-size="12" fill="#888" font-weight="bold">items（逐行扫描）</text>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="90" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[0] type</text>
  <text x="190" y="225" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[1] color</text>
  <text x="290" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[2] name</text>

  <!-- row 0 -->
  <g filter="url(#rough2)"><rect x="40" y="234" width="300" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="90" y="250" text-anchor="middle" font-size="11" fill="#888">phone</text>
  <text x="190" y="250" text-anchor="middle" font-size="11" fill="#888">blue</text>
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#888">pixel</text>

  <!-- row 1 (highlighted color cell) -->
  <g filter="url(#rough2)"><rect x="40" y="258" width="300" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="90" y="274" text-anchor="middle" font-size="11" fill="#888">computer</text>
  <text x="190" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">silver</text>
  <text x="290" y="274" text-anchor="middle" font-size="11" fill="#888">lenovo</text>

  <!-- row 2 -->
  <g filter="url(#rough2)"><rect x="40" y="282" width="300" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="90" y="298" text-anchor="middle" font-size="11" fill="#888">phone</text>
  <text x="190" y="298" text-anchor="middle" font-size="11" fill="#888">gold</text>
  <text x="290" y="298" text-anchor="middle" font-size="11" fill="#888">iphone</text>

  <!-- column highlight band (only color column accessed) -->
  <g filter="url(#rough2)">
    <rect x="140" y="208" width="100" height="98" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" rx="3"/>
  </g>
  <text x="190" y="326" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">仅此列被访问（idx=1）</text>

  <!-- arrow idx -> column -->
  <path d="M 565 116 Q 565 170 380 200 Q 250 220 240 240" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="430" y="180" font-size="10" fill="#d6a040" font-style="italic">锁定列下标</text>

  <!-- ===== Loop body box (right) ===== -->
  <text x="430" y="200" font-size="12" fill="#888" font-weight="bold">循环体（每项仅一次比较）</text>
  <g filter="url(#rough2)">
    <rect x="430" y="208" width="250" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="450" y="232" font-size="11" fill="#333">for item in items:</text>
  <text x="470" y="252" font-size="11" fill="#d6a040" font-weight="bold">if item[idx] == ruleValue:</text>
  <text x="490" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">count += 1</text>
  <text x="450" y="294" font-size="10" fill="#888" font-style="italic">无 ruleKey 判断、无分支</text>

  <!-- arrow items -> loop -->
  <path d="M 342 270 L 426 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom insight box ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="350" width="640" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="60" y="374" font-size="12" fill="#446688" font-weight="bold">⭐ 循环不变量外提（loop-invariant code motion）</text>
  <text x="60" y="396" font-size="11" fill="#333">ruleKey 在整次调用中是常量 → map[ruleKey] 每次迭代结果相同 → 属循环不变量。</text>
  <text x="60" y="414" font-size="11" fill="#333">外提到循环前只算一次：循环体从「三路 if-else + 多次字符串比较」退化为「单次下标比较」。</text>
  <text x="60" y="430" font-size="11" fill="#d6a040" font-weight="bold">→ 常数更小、逻辑更清晰、无分支预测开销。</text>
</svg>
