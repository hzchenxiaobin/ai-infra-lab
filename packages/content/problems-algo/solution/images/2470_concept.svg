<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">核心观察：子数组扩展时 lcm 单调不减，元素不整除 k 即可终止</text>
  <text x="270" y="40" text-anchor="middle" font-size="11" fill="#888">nums = [3, 6, 2, 7, 1]，k = 6</text>

  <!-- ====== TOP: the array cells ====== -->
  <text x="58" y="70" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold">nums</text>
  <!-- cells: 3 6 2 7 1 at x=80,136,192,248,304 (w=48) -->
  <rect x="80" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="136" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="192" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="52" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="74" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
  <rect x="304" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="104" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=0</text>
  <text x="160" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="216" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="272" y="98" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="328" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <text x="58" y="74" text-anchor="end" font-size="9.5" fill="#b85450">起点</text>
  <text x="272" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7 ∤ 6（非因子）</text>

  <!-- ====== LEFT: lcm ladder for start i=0 ====== -->
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">从 i=0 向右扩展，前缀 lcm 阶梯上升</text>

  <!-- j=0: sub [3], l=3  (blue: l<k -> continue) -->
  <rect x="60" y="150" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="174" font-size="11.5" fill="#333" font-weight="bold">j=0  [3]</text>
  <text x="252" y="174" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold">l = 3</text>
  <text x="124" y="166" text-anchor="middle" font-size="9" fill="#888">3 | 6 ✓ 继续</text>

  <!-- down arrow with label -->
  <line x1="160" y1="192" x2="160" y2="214" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="208" font-size="10.5" fill="#666" font-weight="bold">lcm(3, 6) = 6</text>

  <!-- j=1: sub [3,6], l=6  (green: ==k -> count) -->
  <rect x="60" y="218" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="78" y="242" font-size="11.5" fill="#333" font-weight="bold">j=1  [3,6]</text>
  <text x="252" y="242" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">l = 6</text>
  <text x="124" y="234" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">== k ✓ 计数</text>

  <!-- down arrow with label -->
  <line x1="160" y1="260" x2="160" y2="282" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="276" font-size="10.5" fill="#666" font-weight="bold">lcm(6, 2) = 6</text>

  <!-- j=2: sub [3,6,2], l=6  (green: still ==k -> count) -->
  <rect x="60" y="286" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="78" y="310" font-size="11.5" fill="#333" font-weight="bold">j=2  [3,6,2]</text>
  <text x="252" y="310" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">l = 6</text>
  <text x="130" y="302" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">续加 k 的因子仍 = k ✓</text>

  <!-- down arrow with label -->
  <line x1="160" y1="328" x2="160" y2="350" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="344" font-size="10.5" fill="#b85450" font-weight="bold">7 ∤ 6 → break</text>

  <!-- j=3: break box (red) -->
  <rect x="60" y="354" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="78" y="376" font-size="11.5" fill="#333" font-weight="bold">j=3  [..,7]</text>
  <text x="252" y="376" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">非因子，终止</text>

  <!-- ====== RIGHT: insight box ====== -->
  <rect x="300" y="150" width="210" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="170" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">为何非因子即可早退？</text>
  <text x="310" y="190" font-size="9.5" fill="#555">lcm(sub) = k 要求 k 是每元素</text>
  <text x="310" y="204" font-size="9.5" fill="#555">的公倍数 ⇒ 每元素必整除 k</text>
  <text x="310" y="220" font-size="9.5" fill="#555">若 nums[j] ∤ k（k % nums[j]≠0）</text>
  <text x="310" y="234" font-size="9.5" fill="#555">含它的子数组 lcm 必 ≠ k；</text>
  <text x="310" y="250" font-size="9.5" fill="#555">而扩展只会把 nums[j] 纳入，</text>
  <text x="310" y="264" font-size="9.5" fill="#b85450" font-weight="bold">故立即 break，永不再来。</text>

  <!-- ====== RIGHT LOWER: why l never exceeds k ====== -->
  <rect x="300" y="284" width="210" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="304" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">为何 lcm 永不超过 k？</text>
  <text x="310" y="324" font-size="9.5" fill="#555">只在「整除 k 的元素」间扩展，</text>
  <text x="310" y="338" font-size="9.5" fill="#555">这些元素都是 k 的因子；</text>
  <text x="310" y="352" font-size="9.5" fill="#555">k 的因子们的 lcm 仍整除 k</text>
  <text x="310" y="366" font-size="9.5" fill="#555">（k 是它们公共倍数）⇒ l | k</text>
  <text x="310" y="380" font-size="9.5" fill="#4a7a3a" font-weight="bold">故 l ≤ k 恒成立，只升向 k。</text>

  <!-- ====== BOTTOM: monotonic note ====== -->
  <rect x="40" y="396" width="470" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="414" font-size="10.5" fill="#444" font-weight="bold">两条性质：① 单调不减 l_{j+1}=lcm(l_j,nums[j+1])，l_j | l_{j+1} ⇒ l_{j+1} ≥ l_j；</text>
  <text x="60" y="427" font-size="10.5" fill="#b85450" font-weight="bold">② 因子封闭：k % nums[j]≠0 即 break；命中 l==k 计数但勿停（续加 k 的因子仍 = k）</text>
</svg>
