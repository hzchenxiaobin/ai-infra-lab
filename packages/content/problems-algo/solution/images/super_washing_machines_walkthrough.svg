<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="840" height="600" fill="#fdfcf7"/>
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：machines = [1, 0, 5]</text>
  <path d="M 280 42 Q 420 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="420" y="60" text-anchor="middle" font-size="11" fill="#888">total = 6，n = 3，target = 2 → ans = 3</text>

  <!-- ===== 顶部：实际搬运过程 ===== -->
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#2e6e2e">实际搬运过程（3 回合）</text>

  <!-- 初始 [1,0,5] -->
  <g filter="url(#sk)">
    <rect x="70" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="132" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="194" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#2b4a6e">
    <text x="100" y="132">1</text>
    <text x="162" y="132">0</text>
    <text x="224" y="132">5</text>
  </g>
  <text x="262" y="130" font-size="10" fill="#888">初始</text>

  <line x1="300" y1="125" x2="350" y2="125" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="325" y="118" text-anchor="middle" font-size="10" fill="#b85450">m₂→m₁</text>

  <!-- move1 [1,1,4] -->
  <g filter="url(#sk)">
    <rect x="360" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="422" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="484" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#2b4a6e">
    <text x="390" y="132">1</text>
    <text x="452" y="132">1</text>
    <text x="514" y="132">4</text>
  </g>
  <text x="552" y="130" font-size="10" fill="#888">第 1 回合</text>

  <line x1="590" y1="125" x2="640" y2="125" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="615" y="118" text-anchor="middle" font-size="10" fill="#b85450">m₂→m₁</text>

  <!-- move2 [1,2,3] -->
  <g filter="url(#sk)">
    <rect x="650" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="712" y="102" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#2b4a6e">
    <text x="680" y="132">1</text>
    <text x="742" y="132">2</text>
  </g>
  <text x="710" y="160" text-anchor="middle" font-size="10" fill="#888">第 2 回合（m₂=3 未画全）</text>

  <line x1="280" y1="178" x2="350" y2="178" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="315" y="172" text-anchor="middle" font-size="10" fill="#b85450">m₂→m₁</text>
  <g filter="url(#sk)">
    <rect x="360" y="156" width="60" height="46" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="422" y="156" width="60" height="46" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="484" y="156" width="60" height="46" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="390" y="186">2</text>
    <text x="452" y="186">2</text>
    <text x="514" y="186">2</text>
  </g>
  <text x="552" y="184" font-size="10" fill="#2e6e2e" font-weight="bold">第 3 回合 ✓</text>

  <!-- ===== 中部：扫描计算表 ===== -->
  <text x="60" y="232" font-size="13" font-weight="bold" fill="#2b6e9e">一趟扫描计算（两类下界同步维护）</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="244" width="720" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="110" y="265">i</text>
    <text x="200" y="265">m</text>
    <text x="310" y="265">flow = m−target</text>
    <text x="450" y="265">balance += flow</text>
    <text x="600" y="265">max(|balance|, flow)</text>
    <text x="730" y="265">ans</text>
  </g>

  <!-- 行 0 -->
  <g filter="url(#sk)">
    <rect x="60" y="278" width="720" height="34" rx="3" fill="#fff" stroke="#9ab" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="110" y="300" fill="#344">0</text>
    <text x="200" y="300" fill="#344">1</text>
    <text x="310" y="300" fill="#b03a3a" font-weight="bold">−1</text>
    <text x="450" y="300" fill="#7a5415" font-weight="bold">−1</text>
    <text x="600" y="300" fill="#344">max(1, −1) = 1</text>
    <text x="730" y="300" fill="#2e6e2e" font-weight="bold">1</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="314" width="720" height="34" rx="3" fill="#fff8e1" stroke="#9ab" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="110" y="336" fill="#344">1</text>
    <text x="200" y="336" fill="#344">0</text>
    <text x="310" y="336" fill="#b03a3a" font-weight="bold">−2</text>
    <text x="450" y="336" fill="#7a5415" font-weight="bold">−3</text>
    <text x="600" y="336" fill="#344">max(3, −2) = 3</text>
    <text x="730" y="336" fill="#2e6e2e" font-weight="bold">3</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="350" width="720" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="110" y="372" fill="#344">2</text>
    <text x="200" y="372" fill="#344">5</text>
    <text x="310" y="372" fill="#2e6e2e" font-weight="bold">+3</text>
    <text x="450" y="372" fill="#7a5415" font-weight="bold">0</text>
    <text x="600" y="372" fill="#344">max(0, 3) = 3</text>
    <text x="730" y="372" fill="#2e6e2e" font-weight="bold">3</text>
  </g>

  <!-- ===== 底部：下界对照 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="398" width="340" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="230" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">边切口下界</text>
  <text x="76" y="446" font-size="11.5" fill="#344">切口 0|1：|balance₀| = 1</text>
  <text x="76" y="466" font-size="11.5" fill="#344">切口 1|2：|balance₁| = 3 ← 最紧</text>
  <text x="76" y="484" font-size="11" fill="#6a96c0">每回合每切口净流 1 件</text>

  <g filter="url(#sk)">
    <rect x="440" y="398" width="340" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="610" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">盈余机下界</text>
  <text x="456" y="446" font-size="11.5" fill="#344">m₀: flow=−1（亏缺，不算）</text>
  <text x="456" y="466" font-size="11.5" fill="#344">m₁: flow=−2（亏缺，不算）</text>
  <text x="456" y="484" font-size="11.5" fill="#2e6e2e" font-weight="bold">m₂: flow=+3 ← 最紧</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="60" y="506" width="720" height="44" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="420" y="528" text-anchor="middle" font-size="12.5" fill="#444">
    <tspan font-weight="bold" fill="#b03a3a">ans = max(3, 3) = 3</tspan>
    <tspan>   两类下界在 m₂ / 切口1|2 同时取等 → 答案 3</tspan>
  </text>
  <text x="420" y="546" text-anchor="middle" font-size="10.5" fill="#888">
    切口 1|2 三回合净流 3 件向左；同时 m₂ 每回合吐 1 件，三回合恰好吐完 → 两约束互不冲突
  </text>

  <text x="420" y="580" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">关键：两下界「并行」不「串行」，故取 max 而非相加</text>
</svg>
