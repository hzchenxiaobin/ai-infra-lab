<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建 nxt → 找首个命中 → 删除 → 整轮重扫</text>

  <!-- step 1 -->
  <rect x="36" y="44" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="61" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 从右往左建 nxt[]</text>
  <text x="146" y="77" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">哈希 last[c] = c 右侧最近出现位置</text>

  <path d="M 146 86 L 146 99" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="36" y="103" width="220" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="120" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">② i 从 0 向右找首个命中</text>
  <text x="146" y="136" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">nxt[i] ≠ −1 且 nxt[i] − i ≤ k</text>

  <path d="M 146 145 L 146 158" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="146,162 216,194 146,226 76,194" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="198" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">找到目标对？</text>

  <!-- yes branch: down to step 3 -->
  <path d="M 146 226 L 146 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="155" y="240" text-anchor="start" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- step 3 -->
  <rect x="36" y="248" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="146" y="266" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 删除 t[nxt[i]]</text>
  <text x="146" y="282" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">右侧全体左移，回到 ① 整轮重扫</text>

  <!-- loop back arrow -->
  <path d="M 36 270 L 22 270 Q 14 270 14 262 L 14 76 Q 14 68 22 68 L 32 68" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- no branch: right to return -->
  <path d="M 216 194 C 258 194, 258 270, 292 270" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="188" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- return box -->
  <rect x="296" y="248" width="188" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="390" y="266" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回当前串 t</text>
  <text x="390" y="282" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">已无任何靠近对</text>

  <!-- pitfalls box -->
  <rect x="296" y="44" width="188" height="158" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⚠️ 三个易错点</text>
  <text x="306" y="88" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① 每删必整轮重扫：距离只</text>
  <text x="306" y="102" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">减不增，左侧左端点可能新</text>
  <text x="306" y="116" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">转正（abcba k=3 的 'a' 对）</text>
  <text x="306" y="138" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② 键序（左端点，右端点）：</text>
  <text x="306" y="152" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">固定 i 恰取下一个出现位置</text>
  <text x="306" y="174" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">③ 右消失、左保留，不产新字符</text>

  <!-- complexity box -->
  <rect x="296" y="306" width="188" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="326" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(n²)，空间 O(n)</text>
  <text x="390" y="342" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n ≤ 100 ⇒ 约 10⁴ 步</text>
  <text x="390" y="356" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">至多 n−1 轮，每轮恰删 1 字符</text>
</svg>
