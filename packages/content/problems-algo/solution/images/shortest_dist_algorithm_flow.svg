<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种解法对比：自连接 O(n²) vs 窗口函数 O(n log n)</text>

  <!-- Left: Approach A - Self Join -->
  <rect x="20" y="48" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解法 A：自连接（暴力）</text>

  <!-- Self join steps -->
  <rect x="30" y="106" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="124" text-anchor="middle" font-size="10.5" fill="#333">Point p1 JOIN Point p2 ON p1.x != p2.x</text>

  <rect x="30" y="142" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="160" text-anchor="middle" font-size="10.5" fill="#333">→ 所有点对 (n×(n-1) 组合)</text>

  <rect x="30" y="178" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="196" text-anchor="middle" font-size="10.5" fill="#333">→ MIN(ABS(p1.x - p2.x))</text>

  <!-- Self join: all pairs grid -->
  <text x="145" y="226" text-anchor="middle" font-size="10" fill="#999">所有点对（含非相邻）：</text>
  <rect x="50" y="232" width="190" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="250" font-size="9" fill="#333">(-1,0)→1</text>
  <text x="70" y="266" font-size="9" fill="#333">(-1,2)→3</text>
  <text x="70" y="282" font-size="9" fill="#333">(-1,5)→6</text>
  <text x="70" y="298" font-size="9" fill="#333">(0,2)→2</text>
  <text x="180" y="250" font-size="9" fill="#333">(0,5)→5</text>
  <text x="180" y="266" font-size="9" fill="#333">(2,3)→1</text>
  <text x="180" y="282" font-size="9" fill="#333">(2,5)→3</text>
  <text x="180" y="298" font-size="9" fill="#333">(3,5)→2</text>

  <text x="145" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">MIN = 1</text>
  <text x="145" y="352" text-anchor="middle" font-size="10" fill="#999">O(n²) — 大量非相邻对是冗余</text>

  <!-- Right: Approach B - Window Function -->
  <rect x="290" y="48" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">解法 B：LAG 窗口函数（推荐）</text>

  <!-- Window function steps -->
  <rect x="300" y="106" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="124" text-anchor="middle" font-size="10.5" fill="#333">ORDER BY x 排序</text>

  <rect x="300" y="142" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="160" text-anchor="middle" font-size="10.5" fill="#333">LAG(x) OVER (ORDER BY x) AS prev_x</text>

  <rect x="300" y="178" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="196" text-anchor="middle" font-size="10.5" fill="#333">→ MIN(x - prev_x) 只看相邻 gap</text>

  <!-- Window function: adjacent pairs only -->
  <text x="415" y="226" text-anchor="middle" font-size="10" fill="#999">仅相邻对（排序后）：</text>
  <rect x="320" y="232" width="190" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="256" text-anchor="middle" font-size="10" fill="#333">x=-1, prev=NULL</text>
  <text x="365" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=0,  prev=-1 → 1 ★</text>
  <text x="365" y="292" text-anchor="middle" font-size="10" fill="#333">x=2,  prev=0  → 2</text>
  <text x="365" y="306" font-size="9" fill="#999">... 只需 n-1 个相邻 gap</text>

  <text x="415" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">MIN = 1</text>
  <text x="415" y="352" text-anchor="middle" font-size="10" fill="#999">O(n log n) — 排序 + 单趟扫描</text>

  <!-- Arrow between two approaches -->
  <path d="M270 200 L290 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">优化</text>

  <!-- Bottom callout -->
  <rect x="60" y="368" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#333">自连接枚举全部 C(n,2) 对；窗口函数只看 n-1 个相邻 gap — 结果相同，效率不同</text>
</svg>
