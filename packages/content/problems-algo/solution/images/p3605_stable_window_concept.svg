<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：GCD 越切越大 ⟹ 只查定长窗口；坏窗口右端落针</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">子区间的 gcd 是大区间 gcd 的倍数 ⟹ 长 M &gt; k 的稳定段内必含长 L=k+1 的稳定窗口</text>

  <!-- ============ Panel 1: 长度归一 ============ -->
  <text x="34" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 长度归一：以 [2,4,9,6]、k=1（L=2）为例</text>

  <g filter="url(#rough2)">
    <line x1="72" y1="86" x2="280" y2="86" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="176" y="79" text-anchor="middle" font-size="9.5" fill="#b85450">整段 gcd = 1 ✗ 不稳定</text>

    <rect x="72" y="94" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="94" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="94" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="94" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="95" y="117" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="149" y="117" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="203" y="117" text-anchor="middle" font-size="12" fill="#333">9</text>
    <text x="257" y="117" text-anchor="middle" font-size="12" fill="#333">6</text>

    <path d="M 74 140 v 6 h 96 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 182 140 v 6 h 96 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="122" y="160" text-anchor="middle" font-size="9.5" fill="#2a5a2a">gcd=2 ✓ 稳定</text>
    <text x="230" y="160" text-anchor="middle" font-size="9.5" fill="#2a5a2a">gcd=3 ✓ 稳定</text>
  </g>

  <g filter="url(#rough2)">
    <text x="308" y="100" font-size="10.5" fill="#446688" font-weight="bold">长 M &gt; k 的稳定段</text>
    <text x="308" y="117" font-size="10" fill="#555">⟹ 内部任取 L=k+1 连续格</text>
    <text x="308" y="134" font-size="10" fill="#555">仍稳定（子区间 gcd 更大）</text>
    <text x="308" y="154" font-size="10" fill="#b85450" font-weight="bold">∴ 最长稳定 ≤ k ⟺ 无长 L 坏窗口</text>
  </g>

  <!-- ============ Panel 2: 坏窗口右端落针 ============ -->
  <text x="34" y="190" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 坏窗口 = 待戳区间：右端改 1，一票否决</text>

  <g filter="url(#rough2)">
    <rect x="66" y="218" width="112" height="48" fill="none" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="174" y="218" width="112" height="48" fill="none" stroke="#d6a040" stroke-width="2" rx="6"/>

    <rect x="72" y="224" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="224" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="180" y="224" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="224" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="95" y="246" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="149" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="203" y="246" text-anchor="middle" font-size="12" fill="#333">9</text>
    <text x="257" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

    <line x1="149" y1="202" x2="149" y2="216" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <circle cx="149" cy="199" r="2.2" fill="#b85450"/>
    <text x="157" y="210" font-size="9" fill="#b85450">4→1</text>
    <line x1="257" y1="202" x2="257" y2="216" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <circle cx="257" cy="199" r="2.2" fill="#b85450"/>
    <text x="265" y="210" font-size="9" fill="#b85450">6→1</text>

    <text x="122" y="280" text-anchor="middle" font-size="9.5" fill="#8a6d1f">窗 [2,1] gcd=1 ✓灭</text>
    <text x="230" y="280" text-anchor="middle" font-size="9.5" fill="#8a6d1f">窗 [9,1] gcd=1 ✓灭</text>
  </g>

  <g filter="url(#rough2)">
    <text x="310" y="228" font-size="10.5" fill="#446688" font-weight="bold">针落在坏窗右端 i+L−1</text>
    <text x="310" y="245" font-size="10" fill="#555">随后起点 i += L，跳过整窗</text>
    <text x="310" y="262" font-size="10" fill="#555">（含 1 的窗口 gcd 必为 1）</text>
    <text x="310" y="282" font-size="10" fill="#b85450" font-weight="bold">cnt=2 &gt; maxC=1 ⟹ k=1 ✗</text>
    <text x="310" y="299" font-size="10" fill="#2a5a2a" font-weight="bold">check(2)：L=3 无坏窗 ✓</text>
  </g>

  <!-- ============ Bottom note ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="318" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">贪心 = 等长区间选点：按左端扫描，遇未覆盖坏窗就在右端落针、起点跳 L 格</text>
    <text x="260" y="362" text-anchor="middle" font-size="10" fill="#8a6d1f">（交换论证：首针右移覆盖不减 ⟹ 针数最少）；cnt ≤ maxC ⟺ k 可行 ⟹ 二分答案</text>
  </g>
</svg>
