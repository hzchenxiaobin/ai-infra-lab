<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 演算：nums = [2,1,4,4,4,2]，k = 2（表项 (j, g)）</text>

  <!-- highlight row i=4 -->
  <rect x="29" y="234.5" width="470" height="39" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- table grid -->
  <rect x="28" y="48" width="472" height="266" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <path d="M 28 74 L 500 74 M 28 114 L 500 114 M 28 154 L 500 154 M 28 194 L 500 194 M 28 234 L 500 234 M 28 274 L 500 274" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 70 48 L 70 314 M 126 48 L 126 314 M 316 48 L 316 314 M 442 48 L 442 314" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="49" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="98" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">新元素 x</text>
  <text x="221" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分组表 f（gcd 从左到右递增）</text>
  <text x="379" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合法候选（长度 ≥ 2）</text>
  <text x="471" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- row i=0 -->
  <text x="49" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="98" y="97" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="138" y="97" font-size="11" fill="#333">(0, 2)</text>
  <text x="326" y="97" font-size="10.5" fill="#999">长度 1 &lt; 2 ✗</text>
  <text x="471" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row i=1 -->
  <text x="49" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="98" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="138" y="137" font-size="11" fill="#333">(0, 1)</text>
  <text x="326" y="137" font-size="10.5" fill="#333">1×3 = 3</text>
  <text x="471" y="137" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- row i=2 -->
  <text x="49" y="177" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="98" y="177" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="138" y="177" font-size="11" fill="#333">(0, 1)&#160;&#160;&#160;(2, 4)</text>
  <text x="326" y="177" font-size="10.5" fill="#333">1×7 = 7（4 的组长度 ✗）</text>
  <text x="471" y="177" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- row i=3 -->
  <text x="49" y="217" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="98" y="217" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="138" y="217" font-size="11" fill="#333">(0, 1)&#160;&#160;&#160;(2, 4)</text>
  <text x="326" y="217" font-size="10.5" fill="#333">1×11；4×8 = 32</text>
  <text x="471" y="217" text-anchor="middle" font-size="11" fill="#333">32</text>

  <!-- row i=4 (highlight) -->
  <text x="49" y="257" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="98" y="257" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="138" y="257" font-size="11" fill="#333">(0, 1)&#160;&#160;&#160;<tspan fill="#b85450" font-weight="bold">(2, 4)</tspan></text>
  <text x="326" y="257" font-size="10.5" fill="#333">1×15；<tspan fill="#b85450" font-weight="bold">4×12 = 48 ★</tspan></text>
  <text x="471" y="257" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">48</text>

  <!-- row i=5 -->
  <text x="49" y="297" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="98" y="297" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="138" y="297" font-size="11" fill="#333">(0, 1)&#160;&#160;&#160;(2, 2)</text>
  <text x="326" y="297" font-size="10.5" fill="#333">1×17；2×14 = 28</text>
  <text x="471" y="297" text-anchor="middle" font-size="11" fill="#333">48</text>

  <!-- footnotes -->
  <rect x="28" y="330" width="472" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="264" y="350" text-anchor="middle" font-size="10.5" fill="#333">① i=1、i=3、i=4：追加 (i, x) 时该 gcd 已存在 → 跳过（保留 j 更小的组，和更大）</text>
  <text x="264" y="368" text-anchor="middle" font-size="10.5" fill="#333">② i=5：旧组 gcd=4 遇新元素 2 合并为 gcd=2，组起点 j=2 不变</text>
  <text x="264" y="386" text-anchor="middle" font-size="10.5" fill="#333">③ 相邻合并（示例 2 的 i=3）：旧链 {1, 3, 9} 遇 4 全压平 → 只留 (0, 1)</text>
  <text x="264" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 48 = 4 × (4+4+4)，对应子数组 [4,4,4] ✓</text>
</svg>
