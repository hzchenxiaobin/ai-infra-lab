<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：移动代价 1s / 2s 交替 ⇒ 状态 = (位置, 步数奇偶)</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">同一房间可经偶数步或奇数步到达，后续代价不同 → 光记位置不够用</text>

  <!-- 左区：网格与交替代价 -->
  <text x="130" y="64" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 k 次移动：k 奇→1s，k 偶→2s</text>

  <rect x="58" y="72" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="96" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,0)</text>
  <rect x="102" y="72" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="121" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(0,1)</text>
  <rect x="146" y="72" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(0,2)</text>
  <rect x="58" y="116" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="140" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(1,0)</text>
  <rect x="102" y="116" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="121" y="140" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(1,1)</text>
  <rect x="146" y="116" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="140" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">(1,2)</text>

  <path d="M 96 91 L 100 91" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 140 91 L 144 91" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 165 110 L 165 114" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 76 66 C 90 56, 108 56, 119 66" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="54" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1s</text>
  <path d="M 122 66 C 136 56, 154 56, 163 66" fill="none" stroke="#a07830" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="54" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">+2s</text>
  <path d="M 176 108 C 186 118, 186 124, 178 130" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="196" y="122" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1s</text>

  <text x="130" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">代价序列：1, 2, 1, 2, … 往复</text>

  <!-- 右区：状态定义 -->
  <rect x="288" y="60" width="212" height="42" fill="#ffffff" stroke="#666" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="394" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">状态 (i, j, p)</text>
  <text x="394" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p = 已走步数 mod 2</text>

  <rect x="288" y="122" width="212" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="141" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">p = 0（偶数步到达）</text>
  <text x="394" y="158" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">→ 下一次移动 1 秒</text>

  <rect x="288" y="184" width="212" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="203" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">p = 1（奇数步到达）</text>
  <text x="394" y="220" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">→ 下一次移动 2 秒</text>

  <path d="M 340 168 C 328 174, 328 178, 340 184" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 448 184 C 460 178, 460 174, 448 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="394" y="176" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">移动一次 p 翻转</text>

  <!-- 下半：分层图 -->
  <rect x="48" y="252" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="274" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Layer p=0（出边 1s）</text>
  <rect x="48" y="322" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="344" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">Layer p=1（出边 2s）</text>

  <path d="M 90 286 C 76 296, 76 312, 90 322" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 190 322 C 204 312, 204 296, 190 286" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="138" y="308" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">每次移动在两层之间跳</text>

  <!-- 右下：说明框 -->
  <rect x="278" y="248" width="228" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="292" y="268" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">把 p 并入状态 ⇒ 分层图最短路：</text>
  <text x="292" y="286" font-size="10" fill="#333" filter="url(#rough2)">· dist[i][j][0] 与 dist[i][j][1] 各自松弛</text>
  <text x="292" y="304" font-size="10" fill="#333" filter="url(#rough2)">· 状态数 2nm，边权 ≥ 1 &gt; 0</text>
  <text x="292" y="322" font-size="10" fill="#333" filter="url(#rough2)">· Dijkstra 贪心照常成立</text>
  <text x="292" y="340" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = min(dist[n−1][m−1][0],</text>
  <text x="292" y="356" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">        dist[n−1][m−1][1])</text>
</svg>
