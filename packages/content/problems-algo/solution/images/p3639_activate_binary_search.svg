<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + O(n) 扫描 check</text>

  <ellipse cx="260" cy="44" rx="38" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 58 L 260 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="70" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">total = n(n+1)/2（必须 64 位！）</text>

  <path d="M 260 94 L 260 102" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,104 322,132 260,160 198,132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">total &lt; k ?</text>
  <path d="M 322 132 L 392 132" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="396" y="120" width="104" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1 ✗</text>
  <path d="M 260 160 L 260 166" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="159" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <rect x="140" y="170" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = 0，hi = n − 1（f(hi) ≥ k 已保证）</text>

  <path d="M 260 194 L 260 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,204 318,232 260,260 202,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo &lt; hi ?</text>
  <path d="M 202 232 L 164 232" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="182" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="38" y="220" width="124" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 lo ✓</text>
  <path d="M 260 260 L 260 266" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="259" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <rect x="95" y="270" width="330" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">mid = ⌊(lo + hi) / 2⌋</text>
  <text x="260" y="305" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">check(mid)：标记 order[0..mid] 为 '*'</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫描非 '*' 段长 L → valid = total − Σ L(L+1)/2</text>

  <path d="M 260 328 L 260 336" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,338 318,366 260,394 202,366" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">valid ≥ k ?</text>

  <path d="M 202 366 L 166 366" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="58" y="354" width="106" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">hi = mid</text>

  <path d="M 318 366 L 392 366" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="396" y="354" width="106" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="449" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = mid + 1</text>

  <path d="M 111 378 L 111 434" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 449 378 L 449 434" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 111 434 L 505 434 L 505 232 L 326 232" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">更新 lo / hi 后回到「lo &lt; hi ?」继续二分</text>

  <text x="260" y="482" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">f(t) 单调不减 ⇒ 二分正确；时间 O(n log n)、空间 O(n)</text>
</svg>
