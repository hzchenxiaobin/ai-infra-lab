<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三步原地翻转法：去空格 → 整体翻 → 逐词翻</text>

  <!-- ===== 输入行：␣␣hello␣␣␣world␣␣ 共17格 ===== -->
  <text x="20" y="76" font-size="11" fill="#888" font-weight="bold">输入</text>
  <!-- spaces(red) letters(blue=hello, green=world) -->
  <rect x="55"  y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70"  y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>
  <rect x="85"  y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>
  <rect x="115" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="145" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="78" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="175" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="78" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="205" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="235" y="58" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="265" y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>
  <rect x="295" y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>
  <rect x="325" y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>
  <rect x="355" y="58" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="13" fill="#333">w</text>
  <rect x="385" y="58" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="415" y="58" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="78" text-anchor="middle" font-size="13" fill="#333">r</text>
  <rect x="445" y="58" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="78" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="475" y="58" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="78" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="505" y="58" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">·</text>

  <text x="545" y="76" font-size="10.5" fill="#b85450">·=空格</text>

  <!-- arrow down to step1 -->
  <path d="M 280 96 L 280 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 1 ===== -->
  <rect x="40" y="112" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="135" font-size="12.5" fill="#446688" font-weight="bold">① 去除多余空格（读写双指针）</text>
  <text x="60" y="156" font-size="12" fill="#333">→ <tspan font-family="'Comic Sans MS', monospace" font-weight="bold" fill="#4a7a3a">hello world</tspan>　（无前导/后随空格，单词间单个空格）</text>

  <!-- arrow down to step2 -->
  <path d="M 280 174 L 280 186" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2 ===== -->
  <rect x="40" y="190" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="213" font-size="12.5" fill="#d6a040" font-weight="bold">② 整体翻转 reverse(0, n)</text>
  <text x="60" y="234" font-size="12" fill="#333">→ <tspan font-family="'Comic Sans MS', monospace" font-weight="bold" fill="#d6a040">dlrow olleh</tspan>　（字符级翻转，单词顺序与字母同时倒过来）</text>

  <!-- arrow down to step3 -->
  <path d="M 280 252 L 280 264" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3 ===== -->
  <rect x="40" y="268" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="291" font-size="12.5" fill="#4a7a3a" font-weight="bold">③ 逐词翻转 reverse(每个单词)</text>
  <text x="60" y="312" font-size="12" fill="#333">→ <tspan font-family="'Comic Sans MS', monospace" font-weight="bold" fill="#4a7a3a">world hello</tspan>　（字母还原、单词顺序保持倒序）</text>

  <!-- ===== 结果 ===== -->
  <rect x="40" y="338" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 结果：world hello　·　两次翻转抵消字母级翻转、保留单词级翻转</text>
</svg>
