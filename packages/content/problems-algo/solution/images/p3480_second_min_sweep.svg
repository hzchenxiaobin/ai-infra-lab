<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：f[i] 由最小 y 决定，删它才跳到次小</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 7，冲突对 P = (3,5)、Q = (5,7)｜看左端点 i = 3：此时 P、Q 均已激活</text>

  <!-- arcs for conflicting pairs -->
  <path d="M 198 114 C 198 66, 286 66, 286 114" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="242" y="68" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">P (3,5)</text>
  <path d="M 286 114 C 286 46, 374 46, 374 114" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="54" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Q (5,7)</text>

  <!-- number line cells 1..7 -->
  <rect x="88" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="176" y="118" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="139" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="220" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="264" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="308" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="352" y="118" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="198" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左端点 i=3</text>

  <!-- sweep arrow -->
  <path d="M 390 166 L 104 166" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="245" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i 从 7 → 1 扫描：i ≤ x 后该对一直激活（只进不出）</text>

  <!-- f[3] bracket: solid to 4, dashed extension to 6 -->
  <path d="M 176 210 L 264 210" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 176 202 L 176 218" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 264 202 L 264 218" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">f[3] = min1 − 1 = 4（P 的 y=5 最小）</text>
  <path d="M 264 210 L 352 210" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 352 202 L 352 218" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="310" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删 P 后 f[3] = min2 − 1 = 6，多 2 个子数组</text>

  <!-- three note boxes -->
  <g filter="url(#rough2)">
    <rect x="24" y="254" width="152" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="100" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">① 最小说了算</text>
    <text x="100" y="292" text-anchor="middle" font-size="9.5" fill="#33506b">f[i] = min1 − 1</text>
    <text x="100" y="307" text-anchor="middle" font-size="9.5" fill="#33506b">删「非最小」的对</text>
    <text x="100" y="322" text-anchor="middle" font-size="9.5" fill="#33506b">⇒ 增量为 0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="184" y="254" width="152" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="260" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">② 删最小那对</text>
    <text x="260" y="292" text-anchor="middle" font-size="9.5" fill="#2f5d24">f[i] 跳到 min2 − 1</text>
    <text x="260" y="307" text-anchor="middle" font-size="9.5" fill="#2f5d24">增量 = min2 − min1</text>
    <text x="260" y="322" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">本例：7 − 5 = 2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="344" y="254" width="152" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="420" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">③ 唯一约束被删</text>
    <text x="420" y="292" text-anchor="middle" font-size="9.5" fill="#8a6d1f">f[i] = n（一路通到底）</text>
    <text x="420" y="307" text-anchor="middle" font-size="9.5" fill="#8a6d1f">增量 = n − min1 + 1</text>
    <text x="420" y="322" text-anchor="middle" font-size="9.5" fill="#8a6d1f">min1 并列 ⇒ 增量 0</text>
  </g>

  <text x="260" y="354" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">增量逐位置累加进「取得 min1 的那对」的 gain ⇒ 一趟扫描同时算出删每一对的收益</text>
</svg>
