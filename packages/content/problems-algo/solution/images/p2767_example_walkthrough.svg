<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：s = "1011"</text>

  <!-- row labels -->
  <text x="30" y="77" font-size="11" fill="#888">i</text>
  <text x="30" y="101" font-size="11" fill="#888">s[i-1]</text>
  <text x="30" y="125" font-size="11" fill="#888">dp[i]</text>

  <!-- i row: 0..4, start x=70 step 86 width 76 -->
  <rect x="70" y="62" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="108" y="77" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="156" y="62" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="77" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="242" y="62" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="328" y="62" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="366" y="77" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="414" y="62" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="452" y="77" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- s[i-1] row -->
  <rect x="70" y="86" width="76" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="108" y="101" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="156" y="86" width="76" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="101" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="242" y="86" width="76" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="101" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="328" y="86" width="76" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="101" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="414" y="86" width="76" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="101" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- dp[i] row -->
  <rect x="70" y="110" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="108" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="156" y="110" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="242" y="110" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
  <rect x="328" y="110" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="366" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="414" y="110" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="452" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- transition arrows -->
  <path d="M 108 110 Q 150 60 194 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[0:1]="1"→dp[0]+1</text>
  <path d="M 108 110 Q 236 38 366 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="236" y="32" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[0:3]="101"→dp[0]+1</text>
  <path d="M 366 110 Q 410 150 452 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[3:4]="1"→dp[3]+1</text>

  <!-- explanation -->
  <rect x="40" y="186" width="480" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="208" font-size="11" fill="#333" font-weight="bold">关键步骤：</text>
  <text x="56" y="228" font-size="11" fill="#555">• i=1：s[0:1]="1"=5^0 美丽 → dp[1]=dp[0]+1=1</text>
  <text x="56" y="248" font-size="11" fill="#555">• i=2：s[0:2]="10"=2 非 5 的幂；s[1:2]="0" 有前导 0 → dp[2]=∞</text>
  <text x="56" y="268" font-size="11" fill="#555">• i=3：s[0:3]="101"=5^1 美丽 → dp[3]=dp[0]+1=1（绕过 i=2 的 ∞）</text>
  <text x="56" y="288" font-size="11" fill="#555">• i=4：s[3:4]="1" 美丽 → dp[4]=dp[3]+1=2</text>

  <!-- answer -->
  <rect x="40" y="306" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[4] = 2  →  "101" | "1" 两段</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#aaa">绿色=命中美丽字典；红色 ∞=该位置无可行分割</text>
</svg>
