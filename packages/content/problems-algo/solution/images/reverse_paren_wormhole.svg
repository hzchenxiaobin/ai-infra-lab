<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">虫洞法：括号配对做传送门，遇括号翻转方向</text>

  <!-- ===== 字符串格子 ( a b c d ) ===== -->
  <!-- cell0 ( -->
  <rect x="120" y="56" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="143" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">(</text>
  <!-- cell1 a -->
  <rect x="166" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="189" y="76" text-anchor="middle" font-size="14" fill="#333">a</text>
  <!-- cell2 b -->
  <rect x="212" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235" y="76" text-anchor="middle" font-size="14" fill="#333">b</text>
  <!-- cell3 c -->
  <rect x="258" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="76" text-anchor="middle" font-size="14" fill="#333">c</text>
  <!-- cell4 d -->
  <rect x="304" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="327" y="76" text-anchor="middle" font-size="14" fill="#333">d</text>
  <!-- cell5 ) -->
  <rect x="350" y="56" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="373" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">)</text>

  <!-- 下标 -->
  <text x="143" y="100" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="189" y="100" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="235" y="100" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="281" y="100" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="327" y="100" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="373" y="100" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- 配对传送门弧线 (0 <-> 5) -->
  <path d="M 143 56 C 143 32, 373 32, 373 56" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arro)" marker-start="url(#arro)" filter="url(#rough2)"/>
  <text x="258" y="44" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">pair[0] ↔ pair[5]：传送门</text>

  <!-- ===== 步骤说明 ===== -->
  <!-- step 1 -->
  <rect x="70" y="124" width="420" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11" fill="#444"><tspan fill="#d6a040" font-weight="bold">i=0, d=+1</tspan>  遇 '(' → 跳到 i=5, 翻转 <tspan fill="#b85450" font-weight="bold">d=-1</tspan></text>
  <path d="M 280 154 L 280 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: 反向读取 + 收集字母 -->
  <rect x="70" y="166" width="420" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#444"><tspan fill="#b85450" font-weight="bold">d=-1</tspan>  反向读取 i=4→3→2→1，加入结果：</text>
  <!-- 收集到的字母 d c b a -->
  <rect x="190" y="190" width="26" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="203" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d</text>
  <text x="222" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">←</text>
  <rect x="234" y="190" width="26" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="247" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="266" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">←</text>
  <rect x="278" y="190" width="26" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="291" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="310" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">←</text>
  <rect x="322" y="190" width="26" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <path d="M 280 210 L 280 218" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="70" y="222" width="420" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#444"><tspan fill="#d6a040" font-weight="bold">i=0, d=-1</tspan>  再遇 '(' → 跳到 i=5, 翻转 <tspan fill="#4a7a3a" font-weight="bold">d=+1</tspan>, i=6 越界结束</text>
  <path d="M 280 252 L 280 260" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="170" y="264" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">结果：dcba</text>

  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#888">每个字符只访问一次 → 严格 O(n)，无需真正反转字符</text>
</svg>
