<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：把「对象」当哈希表，键 → 桶，首次访问自动建空数组</text>

  <!-- ===== 左：输入数组 ===== -->
  <rect x="30" y="58" width="150" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">array</text>

  <rect x="45" y="86" width="120" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ "id": "1" }</text>

  <rect x="45" y="126" width="120" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ "id": "1" }</text>

  <rect x="45" y="166" width="120" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ "id": "2" }</text>

  <text x="105" y="222" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐个喂给 fn(item) 求键</text>

  <!-- ===== 右：结果对象 ===== -->
  <rect x="360" y="58" width="230" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="475" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">result = {}</text>

  <!-- 桶 "1" -->
  <rect x="375" y="86" width="200" height="66" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="104" font-size="12" fill="#d6a040" filter="url(#rough2)" font-weight="bold">"1":</text>
  <rect x="420" y="94" width="62" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="451" y="111" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{id:1}</text>
  <rect x="490" y="94" width="62" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="111" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{id:1}</text>
  <text x="388" y="142" font-size="10" fill="#999" filter="url(#rough2)">（同键的两项进同一桶）</text>

  <!-- 桶 "2" -->
  <rect x="375" y="166" width="200" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="184" font-size="12" fill="#d6a040" filter="url(#rough2)" font-weight="bold">"2":</text>
  <rect x="420" y="174" width="62" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="451" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{id:2}</text>

  <text x="475" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">键 = fn(item)，值 = 原数组项的列表</text>
  <text x="475" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列表内顺序与原数组一致</text>

  <!-- ===== 连线：item → 对应桶 ===== -->
  <path d="M 165 103 C 250 103, 290 110, 375 119" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">key="1"</text>

  <path d="M 165 143 C 250 143, 290 130, 375 130" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">key="1"</text>

  <path d="M 165 183 C 250 183, 290 185, 375 186" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="178" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">key="2"</text>

  <!-- 底部要点 -->
  <rect x="30" y="312" width="560" height="48" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">关键：res[key] ||= [] —— 读到不存在的键，先建空数组，再 push(item)</text>
  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对象本身即哈希表，查找/建桶均摊 O(1)，整体只需一次遍历 O(n)</text>
</svg>
