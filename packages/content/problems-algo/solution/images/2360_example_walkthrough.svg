<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：edges = [3,3,4,2,3]，最长环 = 3</text>

  <!-- ===== 左：从 0 出发 ===== -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">从 0 出发（start = clock = 1）</text>

  <!-- 0 (挂链, 蓝) -->
  <circle cx="70" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="70" y="154" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">ts=1</text>

  <!-- 3 (环, 红) -->
  <circle cx="155" cy="120" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="155" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ts=2</text>

  <!-- 2 (环, 红) -->
  <circle cx="240" cy="120" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="240" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ts=3</text>

  <!-- 4 (环, 红) -->
  <circle cx="325" cy="120" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="325" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="325" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ts=4</text>

  <!-- 前进箭头 -->
  <path d="M 88 120 L 135 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 173 120 L 220 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 258 120 L 305 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 回到 3 的弧线 -->
  <path d="M 325 138 Q 240 200 168 138" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">vis[3]=2 ≥ start=1 → 发现环 ✓</text>

  <!-- ===== 右：从 1 出发 ===== -->
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">从 1 出发（start = 5）</text>

  <circle cx="410" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410" y="154" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">ts=5</text>

  <!-- 已访问的 3（虚线） -->
  <rect x="455" y="104" width="56" height="32" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="483" y="125" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">3 已访问</text>
  <path d="M 428 120 L 453 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="483" y="158" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">vis[3]=2 &lt; start=5</text>
  <text x="483" y="172" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">汇入旧分量，跳过 ✗</text>

  <!-- ===== 环长计算框 ===== -->
  <rect x="30" y="218" width="500" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="240" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">环长计算</text>

  <text x="50" y="262" font-size="12" fill="#333" filter="url(#rough2)">clock = 5（即将盖给下一个未访问点的戳，正要盖给 3 却发现它已盖章）</text>
  <text x="50" y="282" font-size="12" fill="#333" filter="url(#rough2)">vis[3] = 2（环入口 3 第一次被盖戳的时刻）</text>
  <text x="50" y="304" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">环长 = clock − vis[3] = 5 − 2 = 3 ⇒ ans = max(−1, 3) = 3 ✓</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="30" y="324" width="500" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么 vis[u] ≥ start 才算环？</text>
  <text x="50" y="366" font-size="11" fill="#333" filter="url(#rough2)">start 是本轮盖出的第一个戳。vis[u] ≥ start ⇒ u 在本轮被盖过，即本轮路径自闭环；</text>
  <text x="50" y="384" font-size="11" fill="#333" filter="url(#rough2)">vis[u] &lt; start ⇒ u 是前几轮已处理的旧分量，本轮只是从挂链汇入其中，不产生新环。</text>
  <text x="50" y="406" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⇒ 每点只盖一次戳，全图 O(n) 一遍扫完即得所有环长。</text>
</svg>
