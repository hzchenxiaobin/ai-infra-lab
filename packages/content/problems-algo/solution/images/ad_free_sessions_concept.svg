<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：会话区间内无同客户广告 → 即为无广告会话</text>

  <!-- ===== Ads reference timeline ===== -->
  <text x="40" y="50" font-size="10" fill="#b85450" font-weight="bold">Ads 投放</text>
  <line x1="70" y1="58" x2="518" y2="58" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- ad diamonds: ad1@5(c1), ad2@17(c2), ad3@20(c2) -->
  <path d="M150 51 L157 58 L150 65 L143 58 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="44" text-anchor="middle" font-size="8" fill="#b85450">ad1·c1@5</text>
  <path d="M342 51 L349 58 L342 65 L335 58 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="44" text-anchor="middle" font-size="8" fill="#b85450">ad2·c2@17</text>
  <path d="M386 51 L393 58 L386 65 L379 58 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="44" font-size="8" fill="#b85450">ad3·c2@20</text>

  <!-- ===== Session bars ===== -->
  <!-- S1 c1 [1,5] has ad -> red -->
  <text x="62" y="95" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">S1·c1</text>
  <rect x="86" y="80" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="118" y="95" text-anchor="middle" font-size="9" fill="#b85450">[1,5]</text>
  <path d="M150 88 L157 95 L150 102 L143 95 Z" fill="#b85450" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="98" font-size="8" fill="#b85450">⚠ 5∈[1,5]</text>

  <!-- S2 c1 [15,23] no ad -> green -->
  <text x="62" y="125" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">S2·c1</text>
  <rect x="310" y="110" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="374" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">[15,23]</text>
  <text x="446" y="125" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 无广告</text>

  <!-- S3 c2 [10,12] no ad -> green -->
  <text x="62" y="155" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">S3·c2</text>
  <rect x="230" y="140" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="246" y="155" text-anchor="middle" font-size="8" fill="#4a7a3a">[10,12]</text>
  <text x="270" y="155" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 无广告</text>

  <!-- S4 c2 [17,28] has ad -> red -->
  <text x="62" y="185" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">S4·c2</text>
  <rect x="342" y="170" width="176" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="185" text-anchor="middle" font-size="9" fill="#b85450">[17,28]</text>
  <path d="M342 178 L349 185 L342 192 L335 185 Z" fill="#b85450" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M386 178 L393 185 L386 192 L379 185 Z" fill="#b85450" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="524" y="188" font-size="8" fill="#b85450">⚠ 17、20∈[17,28]</text>

  <!-- S5 c2 [2,8] no ad -> green -->
  <text x="62" y="215" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">S5·c2</text>
  <rect x="102" y="200" width="96" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="150" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a">[2,8]</text>
  <text x="204" y="215" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 无广告</text>

  <!-- ===== Time axis ===== -->
  <line x1="70" y1="240" x2="518" y2="240" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="528" y="244" font-size="9" fill="#888">time</text>
  <!-- ticks at 0,5,10,15,20,25,28 -->
  <g font-size="8" fill="#888" text-anchor="middle">
    <line x1="70" y1="238" x2="70" y2="244" stroke="#888" filter="url(#rough2)"/><text x="70" y="256">0</text>
    <line x1="150" y1="238" x2="150" y2="244" stroke="#888" filter="url(#rough2)"/><text x="150" y="256">5</text>
    <line x1="230" y1="238" x2="230" y2="244" stroke="#888" filter="url(#rough2)"/><text x="230" y="256">10</text>
    <line x1="310" y1="238" x2="310" y2="244" stroke="#888" filter="url(#rough2)"/><text x="310" y="256">15</text>
    <line x1="390" y1="238" x2="390" y2="244" stroke="#888" filter="url(#rough2)"/><text x="390" y="256">20</text>
    <line x1="470" y1="238" x2="470" y2="244" stroke="#888" filter="url(#rough2)"/><text x="470" y="256">25</text>
    <line x1="518" y1="238" x2="518" y2="244" stroke="#888" filter="url(#rough2)"/><text x="518" y="256">28</text>
  </g>

  <!-- ===== Key insight ===== -->
  <rect x="20" y="272" width="580" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="291" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="36" y="310" font-size="9.5" fill="#333">• 匹配两维度：<tspan fill="#446688" font-weight="bold">客户相同</tspan>（广告只对该客户生效）+ <tspan fill="#446688" font-weight="bold">时间∈[start,end]</tspan>，同时满足才算打扰</text>
  <text x="36" y="326" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">绿色会话</tspan>（S2/S3/S5）区间内无同客户广告 → 无广告会话，输出 session_id</text>
  <text x="36" y="342" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">红色会话</tspan>（S1/S4）区间内有广告投放 → 被打扰，排除</text>

  <!-- ===== SQL snippet ===== -->
  <rect x="20" y="360" width="580" height="48" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="34" y="378" font-size="9.5" fill="#446688" font-family="monospace">SELECT p.session_id  FROM Playback p</text>
  <text x="34" y="392" font-size="9.5" fill="#446688" font-family="monospace">LEFT JOIN Ads a ON a.customer_id=p.customer_id AND a.timestamp BETWEEN p.start_time AND p.end_time</text>
  <text x="34" y="406" font-size="9.5" fill="#446688" font-family="monospace">WHERE a.ad_id IS NULL;</text>
</svg>
