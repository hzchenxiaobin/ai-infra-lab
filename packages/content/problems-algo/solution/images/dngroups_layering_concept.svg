<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分组 = BFS 按距离分层：相邻节点组号差恰为 1</text>

  <!-- Layered graph panel -->
  <rect x="20" y="44" width="560" height="262" rx="10" fill="#f4f8fc" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- group column headers -->
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">组 1</text>
  <text x="220" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">组 2</text>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">组 3</text>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">组 4</text>

  <!-- vertical dashed separators -->
  <path d="M 150 76 L 150 292" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 290 76 L 290 292" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 430 76 L 430 292" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- edges (drawn before nodes) -->
  <path d="M 80 196 L 220 196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 220 196 L 360 146" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 220 196 L 360 246" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 360 146 L 500 146" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 360 146 L 500 246" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 360 246 L 500 246" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="80" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <circle cx="220" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="360" cy="146" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="151" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="360" cy="246" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="500" cy="146" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="151" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <circle cx="500" cy="246" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">每条边都横跨相邻列 → |y − x| = 1 ✓（4 组，最大）</text>

  <!-- Bottom-left: parity argument -->
  <rect x="20" y="324" width="340" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="346" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">二分图 ⟹ BFS 分层即合法分组</text>
  <text x="34" y="368" font-size="11" fill="#444">g(v) = dist(s, v)。相邻边两端距离差</text>
  <text x="34" y="384" font-size="11" fill="#444">≤ 1；二分图使两端奇偶不同，故</text>
  <text x="34" y="400" font-size="11" fill="#444">差为奇数 ⟹ {0,1} 中只能是 1 ✓</text>

  <!-- Bottom-right: odd cycle -->
  <rect x="380" y="324" width="200" height="96" rx="8" fill="#fdf3f4" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="346" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">奇环 ⟹ 同层边 → 无解</text>
  <!-- mini triangle -->
  <path d="M 450 374 L 510 374" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 450 374 L 480 402" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 510 374 L 480 402" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <circle cx="450" cy="374" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="510" cy="374" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="480" cy="402" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="416" text-anchor="middle" font-size="10" fill="#b03a3a">两端同层 → 返回 -1</text>
</svg>
