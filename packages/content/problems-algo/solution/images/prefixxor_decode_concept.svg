<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：异或的逆运算还是异或 —— 相邻 pref 作差即得 arr</text>

  <!-- index labels -->
  <text x="110" y="50" text-anchor="middle" font-size="11" fill="#999">i=0</text>
  <text x="190" y="50" text-anchor="middle" font-size="11" fill="#999">i=1</text>
  <text x="270" y="50" text-anchor="middle" font-size="11" fill="#999">i=2</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#999">i=3</text>
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#999">i=4</text>

  <!-- ===== pref row ===== -->
  <text x="44" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">pref</text>
  <rect x="77" y="58" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
  <rect x="157" y="58" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <rect x="237" y="58" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="317" y="58" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="350" y="86" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">3</text>
  <rect x="397" y="58" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>

  <!-- ===== arrows: arr[i] pulls pref[i] (straight, blue) + pref[i-1] (diagonal, green) ===== -->
  <!-- arr[0]: copy -->
  <path d="M 110,248 L 110,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="124" y="180" text-anchor="start" font-size="11" fill="#446688">复制</text>

  <!-- arr[1]: pref[1] ^ pref[0] -->
  <path d="M 190,248 L 190,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 178,248 L 122,104" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="150" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⊕</text>

  <!-- arr[2]: pref[2] ^ pref[1] -->
  <path d="M 270,248 L 270,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 258,248 L 202,104" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="230" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⊕</text>

  <!-- arr[3]: pref[3] ^ pref[2] -->
  <path d="M 350,248 L 350,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 338,248 L 282,104" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="310" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⊕</text>

  <!-- arr[4]: pref[4] ^ pref[3] -->
  <path d="M 430,248 L 430,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 418,248 L 362,104" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="390" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⊕</text>

  <!-- ===== arr row ===== -->
  <text x="44" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">arr</text>
  <rect x="77" y="250" width="66" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <rect x="157" y="250" width="66" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">7</text>
  <rect x="237" y="250" width="66" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <rect x="317" y="250" width="66" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">3</text>
  <rect x="397" y="250" width="66" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== analogy banner ===== -->
  <rect x="50" y="316" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">前缀和：arr[i] = pref[i] − pref[i−1]   ⟶   前缀异或：arr[i] = pref[i] ⊕ pref[i−1]</text>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#a07a30">异或自反：a ⊕ a = 0，⊕ 同时充当「加」与「减」，故逆运算无须另设算符</text>
</svg>
