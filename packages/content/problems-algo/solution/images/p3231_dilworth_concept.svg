<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="450" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：反链卡下界，链划分给上界 ⇒ 答案 = LNIS 长度</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偏序：i ≺ j ⟺ i &lt; j 且 nums[i] &lt; nums[j]；严格递增子序列 = 链，非递增子序列 = 反链（两两不可比）</text>

  <!-- Panel A: 下界 -->
  <rect x="22" y="52" width="536" height="168" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 下界：反链（非递增子序列）中任意两个不能同批删除</text>

  <text x="100" y="122" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="110" y="94" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="118" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="166" y="94" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="118" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="222" y="94" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="118" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="278" y="94" width="46" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="118" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">4</text>
  <rect x="334" y="94" width="46" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="118" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>

  <text x="133" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="189" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="301" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="357" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 133 152 L 245 152" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="168" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反链 [5,3,1]，长度 L = 3</text>

  <text x="402" y="106" font-size="10" fill="#555" filter="url(#rough2)">5 ≥ 3 ≥ 1（允许相等）</text>
  <text x="402" y="122" font-size="10" fill="#555" filter="url(#rough2)">任意两个：前者 ≥ 后者</text>
  <text x="402" y="138" font-size="10" fill="#555" filter="url(#rough2)">⇒ 不能同属一批</text>
  <text x="402" y="156" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 每批至多删掉其中 1 个</text>

  <text x="290" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一次操作（严格递增子序列）至多带走反链的一个元素 ⇒ 至少 L 批</text>

  <!-- Panel B: 上界 -->
  <rect x="22" y="232" width="536" height="168" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 上界：Dilworth 定理——整个数组可划分成 L = 3 条严格递增链</text>

  <rect x="110" y="274" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="298" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="166" y="274" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="189" y="298" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="222" y="274" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="298" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="278" y="274" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="298" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="334" y="274" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="357" y="298" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="133" y="326" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="189" y="326" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="326" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="301" y="326" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="357" y="326" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <text x="133" y="342" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">链③</text>
  <text x="189" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">链①</text>
  <text x="245" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">链②</text>
  <text x="301" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">链①</text>
  <text x="357" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">链②</text>

  <rect x="105" y="354" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="126" y="366" font-size="10" fill="#555" filter="url(#rough2)">链① [3,4]</text>
  <rect x="195" y="354" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="366" font-size="10" fill="#555" filter="url(#rough2)">链② [1,2]</text>
  <rect x="285" y="354" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="306" y="366" font-size="10" fill="#555" filter="url(#rough2)">链③ [5]</text>
  <text x="420" y="366" font-size="10" fill="#888" filter="url(#rough2)">每条链严格递增 ✓</text>

  <text x="290" y="388" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按链分批删除 ⇒ L 批删空 ⇒ 至多 L 批</text>

  <text x="290" y="424" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">下界 = 上界 ⇒ 答案 = L = 最长非递增子序列的长度</text>
</svg>
