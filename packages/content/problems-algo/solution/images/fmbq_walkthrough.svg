<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：蓝色=front 段，绿色=back 段，| 为两段分界</text>

  <!-- Header row -->
  <rect x="20" y="44" width="540" height="32" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="360" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">队列状态（front | back）</text>
  <text x="525" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>

  <!-- vertical column separators -->
  <path d="M 70 44 L 70 408" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 230 44 L 230 408" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 490 44 L 490 408" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: pushFront(1) -> [] | [1] -->
  <text x="45" y="92" text-anchor="middle" font-size="11" fill="#888">①</text>
  <text x="80" y="92" font-size="11" fill="#333">pushFront(1)</text>
  <text x="240" y="92" font-size="12" fill="#bbb">∅</text>
  <text x="276" y="92" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="92" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="525" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <path d="M 20 104 L 560 104" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: pushBack(2) -> [1] | [2] -->
  <text x="45" y="124" text-anchor="middle" font-size="11" fill="#888">②</text>
  <text x="80" y="124" font-size="11" fill="#333">pushBack(2)</text>
  <text x="240" y="124" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="276" y="124" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="124" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="525" y="124" text-anchor="middle" font-size="11" fill="#888">—</text>
  <path d="M 20 136 L 560 136" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: pushMiddle(3) -> [1] | [3,2] -->
  <text x="45" y="156" text-anchor="middle" font-size="11" fill="#888">③</text>
  <text x="80" y="156" font-size="11" fill="#333">pushMiddle(3)</text>
  <text x="240" y="156" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="276" y="156" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="156" font-size="13" fill="#4a7a3a" font-weight="bold">3, 2</text>
  <text x="525" y="156" text-anchor="middle" font-size="11" fill="#888">—</text>
  <path d="M 20 168 L 560 168" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: pushMiddle(4) -> [1,4] | [3,2] -->
  <text x="45" y="188" text-anchor="middle" font-size="11" fill="#888">④</text>
  <text x="80" y="188" font-size="11" fill="#333">pushMiddle(4)</text>
  <text x="240" y="188" font-size="13" fill="#446688" font-weight="bold">1, 4</text>
  <text x="276" y="188" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="188" font-size="13" fill="#4a7a3a" font-weight="bold">3, 2</text>
  <text x="525" y="188" text-anchor="middle" font-size="11" fill="#888">—</text>
  <path d="M 20 200 L 560 200" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 5: popFront() -> [4] | [3,2], return 1 -->
  <text x="45" y="220" text-anchor="middle" font-size="11" fill="#888">⑤</text>
  <text x="80" y="220" font-size="11" fill="#333">popFront()</text>
  <text x="240" y="220" font-size="13" fill="#446688" font-weight="bold">4</text>
  <text x="276" y="220" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="220" font-size="13" fill="#4a7a3a" font-weight="bold">3, 2</text>
  <text x="525" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <path d="M 20 232 L 560 232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 6: popMiddle() -> [4] | [2], return 3 -->
  <text x="45" y="252" text-anchor="middle" font-size="11" fill="#888">⑥</text>
  <text x="80" y="252" font-size="11" fill="#333">popMiddle()</text>
  <text x="240" y="252" font-size="13" fill="#446688" font-weight="bold">4</text>
  <text x="276" y="252" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="252" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="525" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <path d="M 20 264 L 560 264" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 7: popMiddle() -> [] | [2], return 4 -->
  <text x="45" y="284" text-anchor="middle" font-size="11" fill="#888">⑦</text>
  <text x="80" y="284" font-size="11" fill="#333">popMiddle()</text>
  <text x="240" y="284" font-size="12" fill="#bbb">∅</text>
  <text x="276" y="284" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="284" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="525" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <path d="M 20 296 L 560 296" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 8: popBack() -> [] | [], return 2 -->
  <text x="45" y="316" text-anchor="middle" font-size="11" fill="#888">⑧</text>
  <text x="80" y="316" font-size="11" fill="#333">popBack()</text>
  <text x="240" y="316" font-size="12" fill="#bbb">∅</text>
  <text x="276" y="316" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="316" font-size="12" fill="#bbb">∅</text>
  <text x="525" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <path d="M 20 328 L 560 328" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 9: popFront() -> [] | [], return -1 -->
  <text x="45" y="348" text-anchor="middle" font-size="11" fill="#888">⑨</text>
  <text x="80" y="348" font-size="11" fill="#333">popFront()</text>
  <text x="240" y="348" font-size="12" fill="#bbb">∅</text>
  <text x="276" y="348" font-size="13" fill="#d6a040" font-weight="bold">|</text>
  <text x="296" y="348" font-size="12" fill="#bbb">∅</text>
  <text x="525" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-1</text>

  <!-- Bottom note -->
  <rect x="20" y="372" width="540" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">观察 ④：pushMiddle(4) 时 |front|&lt;|back|，把 4 接到 front 末尾 → front=[1,4]</text>
  <text x="290" y="410" text-anchor="middle" font-size="10.5" fill="#888">观察 ⑥⑦：popMiddle 在 |front|&lt;|back| 时弹 back.front（=3），等长时弹 front.back（=4）</text>
</svg>
