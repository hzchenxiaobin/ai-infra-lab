<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一步只改行或只改列，行列分离各自最优</text>

  <!-- 棋盘 A：初始状态 -->
  <rect x="32" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="32" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="32" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- 冲突标记 -->
  <rect x="72" y="96" width="104" height="48" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <rect x="30" y="52" width="48" height="96" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>

  <!-- 车（初始，橙色） -->
  <circle cx="54" cy="76" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="54" y="80" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">车</text>
  <circle cx="54" cy="120" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="54" y="124" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">车</text>
  <circle cx="98" cy="120" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="98" y="124" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">车</text>

  <text x="98" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">初始：第 1 行两车、第 0 列两车 ✗</text>

  <!-- 中间箭头 -->
  <path d="M 178 120 L 254 120" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="216" y="108" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">最少总步数</text>

  <!-- 棋盘 B：和平状态 -->
  <rect x="262" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="54" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="262" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="98" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="262" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="142" width="44" height="44" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- 车（终局，绿色） -->
  <circle cx="284" cy="76" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">车</text>
  <circle cx="372" cy="120" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="124" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">车</text>
  <circle cx="328" cy="164" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="328" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">车</text>

  <text x="328" y="205" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">和平：每行、每列恰好一车 ✓</text>

  <!-- 分解公式 -->
  <rect x="40" y="216" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">总步数 = Σ 竖直步（只改行号） + Σ 水平步（只改列号）</text>

  <!-- 两个独立子问题 -->
  <rect x="40" y="264" width="210" height="64" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="145" y="284" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行指派 = 竖直步</text>
  <text x="145" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 个行坐标排序后</text>
  <text x="145" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">配上目标行 {0, 1, …, n−1}</text>

  <rect x="270" y="264" width="210" height="64" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="375" y="284" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">列指派 = 水平步</text>
  <text x="375" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 个列坐标排序后</text>
  <text x="375" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">配上目标列 {0, 1, …, n−1}</text>

  <!-- 结论 -->
  <rect x="40" y="340" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">行、列互不牵制：任一「行双射」× 任一「列双射」都拼成合法和平局面</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 两个 min 独立求解，再相加即为答案</text>
</svg>
