<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：开新矩阵，一次遍历完成映射</text>

  <!-- Step 1: input -->
  <rect x="150" y="50" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#333">读取输入 matrix，规模 m × n</text>
  <path d="M 260 96 L 260 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: create result -->
  <rect x="130" y="120" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="13" fill="#333">新建结果矩阵 result</text>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a">规模 n × m（行数=原列数，列数=原行数）</text>
  <path d="M 260 168 L 260 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: outer loop -->
  <rect x="150" y="192" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="13" fill="#333">外层循环 i = 0 … m−1</text>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#d6a040">遍历输入的每一行</text>
  <path d="M 260 240 L 260 262" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop -->
  <rect x="150" y="264" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#333">内层循环 j = 0 … n−1</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#d6a040">遍历当前行的每一列</text>
  <path d="M 260 312 L 260 334" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: assign -->
  <rect x="120" y="336" width="280" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">result[j][i] = matrix[i][j]</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#888">行列下标互换，写入新位置</text>
  <path d="M 260 390 L 260 410" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: inner done? -->
  <polygon points="260,414 330,450 260,486 190,450" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="12" fill="#333">j &lt; n ?</text>
  <text x="260" y="464" text-anchor="middle" font-size="10" fill="#888">未完则 ↑</text>

  <!-- inner loop back arrow -->
  <path d="M 190 450 L 110 450 L 110 286 L 148 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="370" font-size="11" fill="#666">是</text>

  <!-- no path -->
  <path d="M 330 450 L 380 450" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="442" font-size="11" fill="#666">否</text>

  <!-- Decision2: outer done? -->
  <polygon points="430,414 430,486 380,450" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="448" text-anchor="middle" font-size="12" fill="#333">i&lt;m?</text>
  <text x="412" y="464" text-anchor="middle" font-size="10" fill="#888">是↑</text>

  <path d="M 430 450 L 430 214 L 372 214" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <path d="M 412 486 L 412 506 L 260 506" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="494" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="516" text-anchor="middle" font-size="13" fill="#333">返回 result</text>

  <!-- side note -->
  <text x="20" y="120" font-size="11" fill="#4a7a3a">O(m·n) 时间</text>
  <text x="20" y="138" font-size="11" fill="#4a7a3a">O(m·n) 空间</text>
  <text x="20" y="156" font-size="10" fill="#888">（非方阵必须新建）</text>
</svg>
