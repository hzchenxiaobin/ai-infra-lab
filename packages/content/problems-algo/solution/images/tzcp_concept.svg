<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：转角路径（L 形）+ 尾随零 = min(v₂, v₅)</text>

  <!-- ===== Left: 5x5 schematic grid with an L-shaped cornered path ===== -->
  <!-- non-path cells -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="44" y="64" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="78" y="64" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="112" y="64" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="146" y="64" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="180" y="64" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 1 -->
    <rect x="44" y="98" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="78" y="98" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="112" y="98" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="146" y="98" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="180" y="98" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 2: cols 0,1 path -->
    <rect x="44" y="132" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="78" y="132" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <!-- corner col 2 -->
    <rect x="112" y="132" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3"/>
    <rect x="146" y="132" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="180" y="132" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 3: col 2 path -->
    <rect x="44" y="166" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="78" y="166" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="112" y="166" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="146" y="166" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="180" y="166" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <!-- row 4: col 2 path -->
    <rect x="44" y="200" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="78" y="200" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="112" y="200" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="146" y="200" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
    <rect x="180" y="200" width="34" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="3"/>
  </g>

  <!-- L-shaped direction arrow: (2,0) -> (2,2) -> (4,2) -->
  <path d="M 61 149 L 121 149 L 121 217" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- labels for arms and corner -->
  <text x="78" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">水平臂</text>
  <text x="156" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">竖直臂</text>
  <text x="160" y="140" font-size="11" fill="#b85450" font-weight="bold">← 转角</text>
  <text x="214" y="234" font-size="10.5" fill="#888">（转角被两臂各算一次，结果减一份）</text>

  <!-- divider -->
  <path d="M 240 60 L 240 250" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: trailing-zero formula ===== -->
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">尾随零只取决于因子 2 与 5</text>

  <rect x="250" y="70" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="95" text-anchor="middle" font-size="12.5" fill="#333">路径乘积 P = ∏ 路径上的值</text>

  <rect x="250" y="120" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#333">分解：P = 2ᵃ · 5ᵇ · 其它因子</text>

  <rect x="250" y="174" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">尾随零数 = min(a, b)</text>

  <rect x="250" y="232" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">例：18000 = 2⁴·5³·9 → min(4, 3) = 3</text>

  <rect x="250" y="286" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="311" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∴ 每格只需存 v₂, v₅，乘积变求和</text>

  <!-- bottom takeaway -->
  <rect x="40" y="340" width="510" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="360" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">关键转化：① 尾随零 → min(v₂之和, v₅之和)  ② L 形 → 转角 + 两臂  ③ 满臂延伸最优</text>
  <text x="295" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a">两臂各是一维区间 → 行 / 列前缀和 O(1) 求和</text>
</svg>
