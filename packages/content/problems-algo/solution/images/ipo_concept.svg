<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按资本排序 + 大顶堆选最大利润</text>

  <!-- Left: sorted projects by capital -->
  <text x="100" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">项目（按所需资本升序）</text>
  <rect x="50" y="74" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="11.5" fill="#333">资本 0 · 利润 1</text>
  <rect x="50" y="108" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="127" text-anchor="middle" font-size="11.5" fill="#333">资本 1 · 利润 2</text>
  <rect x="50" y="142" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="161" text-anchor="middle" font-size="11.5" fill="#333">资本 1 · 利润 3</text>
  <rect x="50" y="176" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="195" text-anchor="middle" font-size="11" fill="#999">资本 3 · 利润 5</text>

  <!-- pointer label -->
  <text x="168" y="93" font-size="10.5" fill="#4a7a3a" font-weight="bold">w=0 ✓</text>
  <text x="168" y="127" font-size="10.5" fill="#b85450" font-weight="bold">w&lt;1 ✗</text>

  <!-- arrow: available -> heap -->
  <path d="M 160 90 L 210 90" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="178" y="84" font-size="10" fill="#4a7a3a">入堆</text>

  <!-- Middle: max-heap -->
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">大顶堆（可选利润）</text>
  <rect x="230" y="74" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">利润 1</text>
  <text x="340" y="93" font-size="11" fill="#d6a040" font-weight="bold">← 堆顶（最大）</text>

  <!-- arrow: heap top -> capital -->
  <path d="M 280 108 L 280 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="290" y="124" font-size="10" fill="#d6a040" font-weight="bold">弹出最大</text>

  <!-- Right: current capital -->
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">当前资本 w</text>
  <rect x="230" y="156" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="177" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">w = 0 + 1 = 1</text>

  <!-- loop arrow back to projects -->
  <path d="M 230 172 Q 180 210 160 130" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="176" y="214" font-size="10" fill="#888">资本增长 → 解锁更多项目</text>

  <!-- conclusion box -->
  <rect x="32" y="236" width="456" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="258" font-size="12.5" fill="#4a7a3a" font-weight="bold">贪心策略：每轮从「当前资本能做的项目」中选利润最大的</text>
  <text x="48" y="276" font-size="11" fill="#4a7a3a">排序保证项目按资本单调入堆；大顶堆保证 O(log n) 取最大利润</text>

  <!-- tip box -->
  <rect x="32" y="304" width="456" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="324" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ 为什么贪心是对的？</text>
  <text x="48" y="342" font-size="11" fill="#b85450">利润非负 → 做项目只增不减资本；先拿最大利润能最快解锁后续项目</text>
  <text x="48" y="356" font-size="11" fill="#b85450">每步最优 = 全局最优（资本单调递增，无后效性）</text>
</svg>
