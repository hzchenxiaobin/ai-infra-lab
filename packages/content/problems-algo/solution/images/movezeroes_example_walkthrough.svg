<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,1,0,3,12]</text>

  <!-- column headers -->
  <text x="24" y="56" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="64" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">fast</text>
  <text x="120" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">值</text>
  <text x="200" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="290" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">slow</text>
  <text x="430" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">数组状态</text>

  <line x1="14" y1="64" x2="546" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row init -->
  <text x="24" y="84" font-size="11" fill="#aaa">初始</text>
  <text x="64" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="290" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="430" y="84" text-anchor="middle" font-size="11" fill="#333">[0,1,0,3,12]</text>

  <!-- Row 1: fast=0, val=0, skip -->
  <text x="24" y="108" font-size="11" fill="#333">1</text>
  <text x="64" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="96" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="200" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <text x="290" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#333">[0,1,0,3,12]</text>

  <!-- Row 2: fast=1, val=1, write -->
  <text x="24" y="132" font-size="11" fill="#333">2</text>
  <text x="64" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="120" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="200" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">写 nums[0]=1</text>
  <text x="290" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#333">[1,1,0,3,12]</text>

  <!-- Row 3: fast=2, val=0, skip -->
  <text x="24" y="156" font-size="11" fill="#333">3</text>
  <text x="64" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="144" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="200" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <text x="290" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#333">[1,1,0,3,12]</text>

  <!-- Row 4: fast=3, val=3, write -->
  <text x="24" y="180" font-size="11" fill="#333">4</text>
  <text x="64" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="168" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">写 nums[1]=3</text>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#333">[1,3,0,3,12]</text>

  <!-- Row 5: fast=4, val=12, write -->
  <text x="24" y="204" font-size="11" fill="#333">5</text>
  <text x="64" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="110" y="192" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="200" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">写 nums[2]=12</text>
  <text x="290" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#333">[1,3,12,3,12]</text>

  <line x1="14" y1="218" x2="546" y2="218" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row: fill zeros -->
  <text x="24" y="242" font-size="11" fill="#333" font-weight="bold">补零</text>
  <text x="64" y="242" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="120" y="242" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="200" y="242" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">[slow,n)=0</text>
  <text x="290" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,3,12,0,0]</text>

  <!-- before/after array highlight -->
  <text x="20" y="290" font-size="12" fill="#888" font-weight="bold">前：</text>
  <rect x="60" y="276" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="108" y="276" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="294" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="156" y="276" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="204" y="276" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="294" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="252" y="276" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="294" text-anchor="middle" font-size="12" fill="#333">12</text>

  <!-- arrow -->
  <path d="M 310 289 L 350 289" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)" marker-end="url(#arrR2)"/>
  <text x="330" y="282" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">移动</text>

  <!-- after -->
  <text x="370" y="290" font-size="12" fill="#888" font-weight="bold">后：</text>
  <rect x="410" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="294" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="458" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="294" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="506" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="528" y="294" text-anchor="middle" font-size="12" fill="#333">12</text>

  <rect x="410" y="312" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="458" y="312" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- note -->
  <rect x="20" y="312" width="370" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="204" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">非零 1,3,12 相对顺序不变 ✓</text>
  <text x="204" y="352" text-anchor="middle" font-size="11" fill="#888">两个 0 移到末尾，原地完成</text>

  <!-- defs marker reuse -->
  <defs>
    <marker id="arrR2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>
</svg>
