<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建大根堆 → 算目标 → 循环减半最大 → 达标即停</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">累计收益 reduced ≥ total/2 即停止；每次 pop 最大、push 减半值</text>

  <!-- ===== Step 1: build heap ===== -->
  <rect x="60" y="70" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 建大根堆 + 算总和</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#555">total = Σ nums[i]</text>
  <text x="150" y="122" text-anchor="middle" font-size="9.5" fill="#888">所有数入堆，O(n)</text>

  <path d="M 150 128 L 150 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: target -->
  <rect x="60" y="148" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 定目标线</text>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#555">target = total / 2</text>

  <path d="M 150 196 L 150 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="60" y="216" width="180" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">③ 循环减半最大</text>
  <text x="150" y="252" text-anchor="middle" font-size="9.5" fill="#555">while reduced &lt; target:</text>
  <text x="150" y="266" text-anchor="middle" font-size="9.5" fill="#555">  v = pop 堆顶</text>
  <text x="150" y="278" text-anchor="middle" font-size="9.5" fill="#555">  reduced += v/2; push(v/2)</text>
  <text x="150" y="290" text-anchor="middle" font-size="9.5" fill="#555">  ops += 1</text>

  <path d="M 150 296 L 150 312" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="60" y="316" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">④ 返回 ops</text>
  <text x="150" y="356" text-anchor="middle" font-size="10" fill="#555">累计削减达标，操作数最少</text>
  <text x="150" y="368" text-anchor="middle" font-size="9.5" fill="#888">ops ≤ n</text>

  <!-- loop back arrow -->
  <path d="M 60 255 C 40 255 40 255 40 255" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 48 282 L 48 244 L 58 244" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <text x="34" y="266" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90 34 266)">未达标则回</text>

  <!-- ===== Right: trace for [5,19,8,1] ===== -->
  <line x1="270" y1="60" x2="270" y2="380" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="415" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">代入 nums = [5,19,8,1]</text>

  <rect x="300" y="84" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="106" text-anchor="middle" font-size="10.5" fill="#333">total = 33，target = 16.5</text>

  <rect x="300" y="128" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="150" text-anchor="middle" font-size="10.5" fill="#333">堆 {19, 8, 5, 1}</text>

  <rect x="300" y="172" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="190" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">循环：</text>
  <text x="312" y="206" font-size="9.5" fill="#555">op1: 19→9.5, red=9.5</text>
  <text x="312" y="220" font-size="9.5" fill="#555">op2: 9.5→4.75, red=14.25</text>
  <text x="312" y="234" font-size="9.5" fill="#555">op3: 8→4, red=18.25</text>
  <text x="415" y="254" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">18.25 ≥ 16.5 停</text>

  <rect x="300" y="276" width="230" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="415" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ops = 3 ✓</text>

  <!-- connecting arrows left->right -->
  <path d="M 240 98 L 296 101" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 171 L 296 145" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 255 L 296 220" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 344 L 296 293" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>

  <text x="415" y="330" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">注意：19 被减半两次</text>
  <text x="415" y="344" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">（减半后放回仍是最大）</text>
</svg>
