<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0,1,2,3,3,6,5,4]，k = 6，n/2 = 4 对</text>

  <!-- 四对信息 -->
  <rect x="20" y="36" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="74" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(0, 4)</text>
  <text x="74" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=4，M=6</text>

  <rect x="144" y="36" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="198" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(1, 5)</text>
  <text x="198" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=4，M=5</text>

  <rect x="268" y="36" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(2, 6)</text>
  <text x="322" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=4，M=6</text>

  <rect x="392" y="36" width="108" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="446" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(3, 3)</text>
  <text x="446" y="72" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">d=0，M=3</text>

  <!-- 扫描表 -->
  <text x="260" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">扫描 X = 0..6：cost(X) = 4 − diff[X] + less</text>

  <!-- 表头 -->
  <rect x="60" y="112" width="66" height="24" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="93" y="128" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">X</text>
  <rect x="126" y="112" width="106" height="24" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="179" y="128" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">diff[X]</text>
  <rect x="232" y="112" width="116" height="24" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="128" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">less = #{M&lt;X}</text>
  <rect x="348" y="112" width="112" height="24" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="128" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">cost</text>

  <!-- 数据行 -->
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <rect x="60" y="136" width="400" height="22" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="151" text-anchor="middle">0</text><text x="179" y="151" text-anchor="middle">1</text><text x="290" y="151" text-anchor="middle">0</text><text x="404" y="151" text-anchor="middle">3</text>

    <rect x="60" y="158" width="400" height="22" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="173" text-anchor="middle">1</text><text x="179" y="173" text-anchor="middle">0</text><text x="290" y="173" text-anchor="middle">0</text><text x="404" y="173" text-anchor="middle">4</text>

    <rect x="60" y="180" width="400" height="22" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="195" text-anchor="middle">2</text><text x="179" y="195" text-anchor="middle">0</text><text x="290" y="195" text-anchor="middle">0</text><text x="404" y="195" text-anchor="middle">4</text>

    <rect x="60" y="202" width="400" height="22" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="217" text-anchor="middle">3</text><text x="179" y="217" text-anchor="middle">0</text><text x="290" y="217" text-anchor="middle">0</text><text x="404" y="217" text-anchor="middle">4</text>

    <rect x="60" y="224" width="400" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="93" y="240" text-anchor="middle" font-weight="bold" fill="#4a7a3a">4</text><text x="179" y="240" text-anchor="middle" font-weight="bold" fill="#4a7a3a">3</text><text x="290" y="240" text-anchor="middle" font-weight="bold" fill="#4a7a3a">1</text><text x="404" y="240" text-anchor="middle" font-weight="bold" fill="#4a7a3a">2 ★</text>

    <rect x="60" y="248" width="400" height="22" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="263" text-anchor="middle">5</text><text x="179" y="263" text-anchor="middle">0</text><text x="290" y="263" text-anchor="middle">1</text><text x="404" y="263" text-anchor="middle">5</text>

    <rect x="60" y="270" width="400" height="22" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="93" y="285" text-anchor="middle">6</text><text x="179" y="285" text-anchor="middle">0</text><text x="290" y="285" text-anchor="middle">2</text><text x="404" y="285" text-anchor="middle">6</text>
  </g>

  <!-- 桶说明 -->
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">桶：diff = {0:1, 4:3}；cnt = {3:1, 5:1, 6:2}（X=4 用完后 less 才吃进 cnt[4]=0，X=5 吃进 cnt[5]=1）</text>

  <!-- 结论 -->
  <rect x="40" y="322" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 2：X = 4 时三对差值本就是 4，只有 (3,3) 两改为 (0,4)</text>
</svg>
