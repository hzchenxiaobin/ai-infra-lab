<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：path = "NESWW"</text>
  <text x="270" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">起点 (0,0) 已预入集合，逐步行走查重</text>

  <!-- 表格外框 -->
  <rect x="20" y="58" width="500" height="220" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="20" y="58" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="125" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">方向</text>
  <text x="210" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">新坐标</text>
  <text x="335" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">已在 visited?</text>
  <text x="455" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- 列分隔线 -->
  <line x1="95"  y1="58" x2="95"  y2="278" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="58" x2="160" y2="278" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="58" x2="270" y2="278" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="58" x2="400" y2="278" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <line x1="20" y1="104" x2="520" y2="104" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="144" x2="520" y2="144" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="184" x2="520" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="224" x2="520" y2="224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 0：起始 -->
  <text x="60"  y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">起始</text>
  <text x="125" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="210" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 0)</text>
  <text x="335" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—（初始入集）</text>
  <text x="455" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">visited={(0,0)}</text>

  <!-- 行 1：N -->
  <text x="60"  y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="125" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="210" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="455" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入</text>

  <!-- 行 2：E -->
  <text x="60"  y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="125" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="210" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="335" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="455" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入</text>

  <!-- 行 3：S -->
  <text x="60"  y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="125" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="210" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <text x="335" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="455" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入</text>

  <!-- 行 4：W（命中，高亮）-->
  <rect x="20" y="224" width="500" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="125" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">W</text>
  <text x="210" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 0)</text>
  <text x="335" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是！</text>
  <text x="455" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">return true ✓</text>
  <text x="270" y="272" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">回到起点 → 命中集合，提前终止（第 5 个 W 不再处理）</text>

  <!-- 底部对照 -->
  <rect x="20" y="294" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">对照 path = "NES"：(0,0)→(0,1)→(1,1)→(1,0) 全程无重复</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历结束未命中 → 返回 false</text>
</svg>
