<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个典型输入的展开与判定</text>

  <!-- ===== 示例 1: p=2, q=1 ===== -->
  <text x="20" y="58" font-size="12" fill="#446688" font-weight="bold">① p=2, q=1</text>

  <!-- 小房间图 -->
  <g filter="url(#rough2)">
    <rect x="100" y="50" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <!-- 源 SW -->
    <circle cx="100" cy="110" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <!-- 0 SE -->
    <circle cx="160" cy="110" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="160" y="113" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">0</text>
    <!-- 1 NE -->
    <circle cx="160" cy="50" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="160" y="53" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- 2 NW -->
    <circle cx="100" cy="50" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="100" y="53" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">2</text>
    <!-- 光线 -->
    <path d="M 100 110 L 160 80 L 100 50" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arrR)"/>
  </g>

  <!-- 推导 -->
  <text x="180" y="66" font-size="10" fill="#555">g=gcd(2,1)=1</text>
  <text x="180" y="82" font-size="10" fill="#555">k=p/g=2 (偶) → 西墙</text>
  <text x="180" y="98" font-size="10" fill="#555">m=q/g=1 (奇) → 北墙</text>
  <text x="180" y="114" font-size="10" fill="#b85450" font-weight="bold">西+北=NW → return 2 ✓</text>

  <!-- 分隔线 -->
  <line x1="20" y1="128" x2="600" y2="128" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 2: p=3, q=1 ===== -->
  <text x="20" y="150" font-size="12" fill="#446688" font-weight="bold">② p=3, q=1</text>

  <!-- 小房间图 -->
  <g filter="url(#rough2)">
    <rect x="100" y="142" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <circle cx="100" cy="202" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="160" cy="202" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="160" y="205" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">0</text>
    <!-- 1 NE — 命中 -->
    <circle cx="160" cy="142" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="145" text-anchor="middle" font-size="7" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="100" cy="142" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="100" y="145" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- 光线: (0,0)→(3,1)→(0,2)→(3,3)=NE -->
    <path d="M 100 202 L 160 182 L 100 162 L 160 142" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  </g>

  <text x="180" y="158" font-size="10" fill="#555">g=gcd(3,1)=1</text>
  <text x="180" y="174" font-size="10" fill="#555">k=p/g=3 (奇) → 东墙</text>
  <text x="180" y="190" font-size="10" fill="#555">m=q/g=1 (奇) → 北墙</text>
  <text x="180" y="206" font-size="10" fill="#d6a040" font-weight="bold">东+北=NE → return 1 ✓</text>

  <!-- 分隔线 -->
  <line x1="20" y1="220" x2="600" y2="220" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 3: p=4, q=2 ===== -->
  <text x="20" y="242" font-size="12" fill="#446688" font-weight="bold">③ p=4, q=2</text>

  <!-- 推导（含去因子2步骤） -->
  <text x="100" y="258" font-size="10" fill="#555">原始：p=4, q=2（同为偶）</text>
  <rect x="200" y="246" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="261" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p/=2, q/=2</text>
  <text x="300" y="258" font-size="10" fill="#555">→ p=2, q=1（仍同偶）</text>
  <rect x="430" y="246" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="261" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p/=2, q/=2</text>
  <text x="530" y="258" font-size="10" fill="#555">→ p=1, q=1</text>

  <text x="100" y="288" font-size="10" fill="#555">去尽因子 2 后：p=1, q=1</text>
  <text x="100" y="304" font-size="10" fill="#555">k=p/g=1 (奇) → 东墙</text>
  <text x="100" y="320" font-size="10" fill="#555">m=q/g=1 (奇) → 北墙</text>
  <rect x="100" y="330" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">东+北=NE → return 1 ✓</text>

  <!-- 右侧：等价于 p=1,q=1 的房间图 -->
  <g filter="url(#rough2)">
    <rect x="360" y="286" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <circle cx="360" cy="336" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="410" cy="336" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="410" y="339" text-anchor="middle" font-size="6" fill="#4a7a3a">0</text>
    <circle cx="410" cy="286" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="410" y="289" text-anchor="middle" font-size="6" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="360" cy="286" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="360" y="289" text-anchor="middle" font-size="6" fill="#4a7a3a">2</text>
    <path d="M 360 336 L 410 286" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="385" y="352" text-anchor="middle" font-size="9" fill="#888">等价于 p=1, q=1</text>

  <!-- 底部总结 -->
  <rect x="30" y="380" width="560" height="44" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#555">关键：先去尽 p、q 的公因子 2（等价于求 gcd 后约分），</text>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#555">再判剩余 p、q 的奇偶：p 偶→2，q 偶→0，皆奇→1</text>
</svg>
