<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：orders = [[10,5,0],[15,2,1],[25,1,1],[30,4,0]]</text>

  <!-- Column headers -->
  <text x="40" y="58" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="120" y="58" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">新订单</text>
  <text x="260" y="58" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">buy 大顶堆</text>
  <text x="430" y="58" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sell 小顶堆</text>
  <text x="560" y="58" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- separator -->
  <path d="M 20 68 L 580 68" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: [10,5,0] buy -->
  <text x="40" y="92" font-size="10.5" fill="#555" filter="url(#rough2)">①</text>
  <text x="120" y="92" font-size="10.5" fill="#446688" filter="url(#rough2)">buy 5@10</text>
  <rect x="260" y="80" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <text x="430" y="92" font-size="10" fill="#bbb" filter="url(#rough2)">∅（空）</text>
  <text x="560" y="92" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">sell 空 → 入 buy 堆</text>

  <!-- Step 2: [15,2,1] sell -->
  <text x="40" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">②</text>
  <text x="120" y="124" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">sell 2@15</text>
  <text x="300" y="124" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <rect x="430" y="112" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">15×2</text>
  <text x="560" y="124" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">10&lt;15 → 入 sell 堆</text>

  <!-- Step 3: [25,1,1] sell -->
  <text x="40" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">③</text>
  <text x="120" y="156" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">sell 1@25</text>
  <text x="300" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <rect x="430" y="144" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">15×2</text>
  <rect x="476" y="144" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">25×1</text>
  <text x="560" y="156" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">10&lt;25 → 入 sell 堆</text>

  <!-- Step 4: [30,4,0] buy — multi match -->
  <text x="40" y="190" font-size="10.5" fill="#555" filter="url(#rough2)">④</text>
  <text x="120" y="190" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">buy 4@30</text>
  <text x="560" y="190" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">循环撮合 ↓</text>

  <!-- 4a: match 2@15 -->
  <text x="40" y="218" font-size="10" fill="#888" filter="url(#rough2)">④a</text>
  <text x="120" y="218" font-size="10" fill="#b85450" filter="url(#rough2)">match 2@15</text>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <rect x="430" y="206" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="221" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">15×0</text>
  <text x="496" y="221" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">25×1</text>
  <text x="560" y="218" font-size="9.5" fill="#b85450" text-anchor="end" filter="url(#rough2)">15≤30, 取 min(4,2)=2</text>

  <!-- 4b: match 1@25 -->
  <text x="40" y="250" font-size="10" fill="#888" filter="url(#rough2)">④b</text>
  <text x="120" y="250" font-size="10" fill="#b85450" filter="url(#rough2)">match 1@25</text>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <text x="450" y="250" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">∅</text>
  <text x="560" y="250" font-size="9.5" fill="#b85450" text-anchor="end" filter="url(#rough2)">25≤30, 取 min(2,1)=1</text>

  <!-- 4c: residual push -->
  <text x="40" y="282" font-size="10" fill="#888" filter="url(#rough2)">④c</text>
  <text x="120" y="282" font-size="10" fill="#446688" filter="url(#rough2)">剩 1@30 入堆</text>
  <rect x="260" y="270" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10×5</text>
  <rect x="306" y="270" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="285" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">30×1</text>
  <text x="430" y="282" font-size="10" fill="#bbb" filter="url(#rough2)">∅（空）</text>
  <text x="560" y="282" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">sell 空，余 1 入 buy</text>

  <!-- separator -->
  <path d="M 20 312 L 580 312" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="40" y="340" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最终积压：</text>
  <rect x="140" y="328" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="345" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10×5</text>
  <text x="232" y="345" font-size="11" fill="#555" filter="url(#rough2)">+</text>
  <rect x="248" y="328" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="345" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">30×1</text>
  <text x="346" y="345" font-size="11" fill="#555" filter="url(#rough2)">= </text>
  <text x="372" y="345" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Sum formula -->
  <rect x="60" y="370" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">结果 = Σ(两堆中所有 amt) mod (10⁹+7)</text>
  <text x="300" y="412" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">此处 5 + 1 = 6，无需取余</text>
</svg>
