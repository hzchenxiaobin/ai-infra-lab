  <text x="48" y="286.0" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">6</text>
  <rect x="304" y="62" width="208" height="76" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408.0" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">观察一：A 的路径唯一</text>
  <text x="314" y="94" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">每步 i+j 增量 ∈ {+1, +1, +2}，而 n−1 步</text>
  <text x="314" y="107" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">要把 i+j 从 0 拉到 2(n−1) → 步步 +2，</text>
  <text x="314" y="120" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">只能走 (i+1, j+1) —— 钉死主对角线！</text>
  <text x="314" y="133" text-anchor="start" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A 的贡献固定为 Σ fruits[i][i]</text>
  <rect x="304" y="146" width="208" height="76" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408.0" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">观察二：B 被双向夹逼成楔形</text>
  <text x="314" y="178" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">出发端：列每步至多 −1 → 列 ≥ n−1−i</text>
  <text x="314" y="191" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">终点端：列还要爬回 n−1 → 列 ≥ i</text>
  <text x="314" y="204" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">两条下界夹出右侧楔形（绿色区）</text>
  <text x="314" y="217" text-anchor="start" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C 是 B 的转置 → 左下楔形（橙色区）</text>
  <rect x="304" y="230" width="208" height="76" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408.0" y="246" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">观察三：分区而治，贡献可加</text>
  <text x="314" y="262" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">B 的格子满足 j ≥ i，C 的格子满足 i ≥ j</text>
  <text x="314" y="275" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">→ B∩C ⊆ 主对角线，而整条对角线归 A，</text>
  <text x="314" y="288" text-anchor="start" font-size="8.8" fill="#555" filter="url(#rough2)">相遇也分不到水果</text>
  <text x="314" y="301" text-anchor="start" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = Σ对角线 + bestB + bestC ✓</text>
  <rect x="56" y="316" width="456" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="68" y="323" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="82" y="332" text-anchor="start" font-size="9" fill="#444" filter="url(#rough2)">A：主对角线</text>
  <rect x="180" y="323" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="194" y="332" text-anchor="start" font-size="9" fill="#444" filter="url(#rough2)">B：右侧楔形</text>
  <rect x="292" y="323" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="306" y="332" text-anchor="start" font-size="9" fill="#444" filter="url(#rough2)">C：左下楔形</text>
  <rect x="404" y="323" width="10" height="10" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="418" y="332" text-anchor="start" font-size="9" fill="#444" filter="url(#rough2)">无人区</text>
  <text x="284" y="350" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = Σ fruits[i][i] ＋ bestB ＋ bestC（B、C 的 DP 中对角线格子记 0 —— 能路过，拿不到）</text>
</svg>
