  <path d="M 277.0 79.0 L 73.0 283.0" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.75" filter="url(#rough2)"/>
  <text x="175" y="174" text-anchor="middle" font-size="8.5" fill="#b85450" transform="rotate(-45 175 174)" filter="url(#rough2)">副对角线 i+j = n−1</text>
  <text x="73.0" y="83.0" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="277.0" y="83.0" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="73.0" y="287.0" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="277.0" y="287.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">终</text>
  <rect x="261.5" y="267.5" width="31" height="31" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="73.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="107.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="141.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="175.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="209.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="243.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="277.0" y="57" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="48" y="82.0" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="48" y="116.0" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="48" y="150.0" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">2</text>
