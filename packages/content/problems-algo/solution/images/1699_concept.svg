<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两人之间的通话次数：双向通话归一化 → 按 (person1, person2) 分组 → COUNT + SUM</text>

  <!-- ===== 左：Calls 表（原始） ===== -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Calls 表（原始，from→to 有方向）</text>
  <rect x="20" y="62" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="78" text-anchor="middle" font-size="9.5" fill="#333">from_id</text>
  <text x="95" y="78" text-anchor="middle" font-size="9.5" fill="#333">to_id</text>
  <text x="155" y="78" text-anchor="middle" font-size="9.5" fill="#333">duration</text>
  <line x1="72" y1="62" x2="72" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="62" x2="120" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 1→2 59 -->
  <rect x="20" y="86" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="95" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="155" y="100" text-anchor="middle" font-size="9.5" fill="#333">59</text>
  <line x1="72" y1="86" x2="72" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="86" x2="120" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 2→1 11 -->
  <rect x="20" y="106" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="95" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="155" y="120" text-anchor="middle" font-size="9.5" fill="#333">11</text>
  <line x1="72" y1="106" x2="72" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="106" x2="120" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 1→3 20 -->
  <rect x="20" y="126" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="140" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="95" y="140" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="155" y="140" text-anchor="middle" font-size="9.5" fill="#333">20</text>
  <line x1="72" y1="126" x2="72" y2="146" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="126" x2="120" y2="146" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 3→4 100 -->
  <rect x="20" y="146" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="160" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="95" y="160" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="155" y="160" text-anchor="middle" font-size="9.5" fill="#333">100</text>
  <line x1="72" y1="146" x2="72" y2="166" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="146" x2="120" y2="166" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 3→4 200 -->
  <rect x="20" y="166" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="180" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="95" y="180" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="155" y="180" text-anchor="middle" font-size="9.5" fill="#333">200</text>
  <line x1="72" y1="166" x2="72" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="166" x2="120" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 3→4 200(重复) -->
  <rect x="20" y="186" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="200" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="95" y="200" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="155" y="200" text-anchor="middle" font-size="9.5" fill="#333">200</text>
  <line x1="72" y1="186" x2="72" y2="206" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="186" x2="120" y2="206" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 4→3 499 -->
  <rect x="20" y="206" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="220" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="95" y="220" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="155" y="220" text-anchor="middle" font-size="9.5" fill="#333">499</text>
  <line x1="72" y1="206" x2="72" y2="226" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="206" x2="120" y2="226" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 双向配对提示：1→2 和 2→1 是同一对 -->
  <path d="M48 86 Q8 96 8 106 Q8 116 48 106" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="16" y="100" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">同</text>
  <text x="16" y="112" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">对</text>

  <!-- 3↔4 双向配对提示 -->
  <path d="M48 146 Q8 176 8 206 Q8 226 48 226" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="16" y="180" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">同</text>
  <text x="16" y="192" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">对</text>

  <!-- ===== 归一化箭头 ===== -->
  <path d="M202 156 L248 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="225" y="148" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">LEAST</text>
  <text x="225" y="160" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GREATEST</text>
  <text x="225" y="172" text-anchor="middle" font-size="8" fill="#446688">归一化</text>

  <!-- ===== 中：归一化后（每行 person1 < person2） ===== -->
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">归一化后（person1 &lt; person2，无方向）</text>
  <rect x="260" y="62" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="9.5" fill="#333">person1</text>
  <text x="350" y="78" text-anchor="middle" font-size="9.5" fill="#333">person2</text>
  <text x="415" y="78" text-anchor="middle" font-size="9.5" fill="#333">duration</text>
  <line x1="320" y1="62" x2="320" y2="86" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="62" x2="380" y2="86" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 1,2,59 -->
  <rect x="260" y="86" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="350" y="100" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="415" y="100" text-anchor="middle" font-size="9.5" fill="#333">59</text>
  <line x1="320" y1="86" x2="320" y2="106" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="86" x2="380" y2="106" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 1,2,11 (原 2→1) -->
  <rect x="260" y="106" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="350" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="415" y="120" text-anchor="middle" font-size="9.5" fill="#333">11</text>
  <line x1="320" y1="106" x2="320" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="106" x2="380" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 1,3,20 -->
  <rect x="260" y="126" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="350" y="140" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="415" y="140" text-anchor="middle" font-size="9.5" fill="#333">20</text>
  <line x1="320" y1="126" x2="320" y2="146" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="126" x2="380" y2="146" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 3,4,100 -->
  <rect x="260" y="146" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="350" y="160" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="415" y="160" text-anchor="middle" font-size="9.5" fill="#333">100</text>
  <line x1="320" y1="146" x2="320" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="146" x2="380" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 3,4,200 -->
  <rect x="260" y="166" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="350" y="180" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="415" y="180" text-anchor="middle" font-size="9.5" fill="#333">200</text>
  <line x1="320" y1="166" x2="320" y2="186" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="166" x2="380" y2="186" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 3,4,200(重复) -->
  <rect x="260" y="186" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="350" y="200" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="415" y="200" text-anchor="middle" font-size="9.5" fill="#333">200</text>
  <line x1="320" y1="186" x2="320" y2="206" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="186" x2="380" y2="206" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 归一化行 3,4,499 (原 4→3) -->
  <rect x="260" y="206" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="350" y="220" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <text x="415" y="220" text-anchor="middle" font-size="9.5" fill="#333">499</text>
  <line x1="320" y1="206" x2="320" y2="226" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="206" x2="380" y2="226" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 红色标注：1→2 和 2→1 归一化后都是 (1,2) -->
  <text x="475" y="100" font-size="9" fill="#b85450" font-weight="bold">← 原 1→2</text>
  <text x="475" y="120" font-size="9" fill="#b85450" font-weight="bold">← 原 2→1 翻转</text>

  <!-- ===== 分组箭头 ===== -->
  <path d="M462 156 L498 156" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="480" y="148" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">GROUP BY</text>
  <text x="480" y="160" text-anchor="middle" font-size="8.5" fill="#b85450">person1,</text>
  <text x="480" y="172" text-anchor="middle" font-size="8.5" fill="#b85450">person2</text>

  <!-- ===== 右：分组结果 ===== -->
  <text x="595" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（每对一行）</text>
  <rect x="510" y="62" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="530" y="78" text-anchor="middle" font-size="8.5" fill="#333">person1</text>
  <text x="565" y="78" text-anchor="middle" font-size="8.5" fill="#333">person2</text>
  <text x="610" y="78" text-anchor="middle" font-size="8.5" fill="#333">count</text>
  <text x="655" y="78" text-anchor="middle" font-size="8.5" fill="#333">total</text>
  <line x1="548" y1="62" x2="548" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="582" y1="62" x2="582" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="630" y1="62" x2="630" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结果行 1,2,2,70 -->
  <rect x="510" y="86" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="530" y="101" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="565" y="101" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="610" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="655" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">70</text>
  <line x1="548" y1="86" x2="548" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="582" y1="86" x2="582" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="630" y1="86" x2="630" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结果行 1,3,1,20 -->
  <rect x="510" y="108" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="530" y="123" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="565" y="123" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="610" y="123" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="655" y="123" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <line x1="548" y1="108" x2="548" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="582" y1="108" x2="582" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="630" y1="108" x2="630" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结果行 3,4,4,999 -->
  <rect x="510" y="130" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="530" y="145" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="565" y="145" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="610" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="655" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">999</text>
  <line x1="548" y1="130" x2="548" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="582" y1="130" x2="582" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="630" y1="130" x2="630" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="595" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a">COUNT(*) + SUM(duration)</text>

  <!-- ===== 底部要点 ===== -->
  <rect x="30" y="250" width="620" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键要点</text>
  <text x="50" y="298" font-size="10.5" fill="#333">① from_id → to_id 和 to_id → from_id 是同一对人，需归一化为 person1 &lt; person2</text>
  <text x="50" y="318" font-size="10.5" fill="#333">② LEAST(from_id, to_id) 取较小者为 person1，GREATEST 取较大者为 person2</text>
  <text x="50" y="338" font-size="10.5" fill="#333">③ GROUP BY person1, person2 后 COUNT(*) 数通话次数、SUM(duration) 累加时长</text>
  <text x="50" y="358" font-size="10.5" fill="#333">④ 表无主键且可有重复行（3→4 出现 3 次），COUNT/SUM 自然覆盖全部行</text>

  <!-- 常见错误 -->
  <rect x="30" y="382" width="620" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ 常见错误</text>
  <text x="50" y="428" font-size="10.5" fill="#333">✗ 直接 GROUP BY from_id, to_id → (1→2) 和 (2→1) 被拆成两组，漏掉反向通话</text>
  <text x="50" y="444" font-size="10.5" fill="#333">✗ 忘了 person1 &lt; person2 约束 → 结果可能出现 person1 &gt; person2 的行</text>
</svg>
