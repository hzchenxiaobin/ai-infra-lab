<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只看「频率的频率」—— 值维度被彻底压掉</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同一判定走两层聚合：freq（值→次数）再聚成 fc（频率→值个数），判定只看 fc</text>

  <!-- 正例大框 -->
  <rect x="20" y="52" width="480" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="34" y="70" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 合法　[2, 1, 2, 3, 3] —— 示例 1 的答案（长度 5）</text>

  <rect x="64" y="76" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="106" y="76" width="40" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="148" y="76" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="76" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="232" y="76" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="94" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="126" y="94" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="168" y="94" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="210" y="94" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="252" y="94" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 150 105 L 150 115" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="113" font-size="9" fill="#999" filter="url(#rough2)">逐值计数</text>

  <text x="34" y="132" font-size="10.5" fill="#778899" filter="url(#rough2)">freq：</text>
  <rect x="80" y="118" width="64" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="152" y="118" width="64" height="20" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="224" y="118" width="64" height="20" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="132" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">2 → 2 次</text>
  <text x="184" y="132" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1 → 1 次</text>
  <text x="256" y="132" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">3 → 2 次</text>

  <path d="M 150 141 L 150 151" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="149" font-size="9" fill="#999" filter="url(#rough2)">再聚合</text>

  <text x="34" y="168" font-size="10.5" fill="#778899" filter="url(#rough2)">fc：</text>
  <rect x="80" y="154" width="84" height="20" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="172" y="154" width="84" height="20" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="168" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#rough2)">频率 1 × 1 个值</text>
  <text x="214" y="168" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#rough2)">频率 2 × 2 个值</text>

  <rect x="300" y="120" width="196" height="58" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="140" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">判定：fc 恰有两键</text>
  <text x="398" y="156" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">频率 1 &lt; 2，且 2 = 2×1</text>
  <text x="398" y="172" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">两种频率都有值 → 平衡 ✓</text>

  <!-- 反例大框 -->
  <rect x="20" y="196" width="480" height="132" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="34" y="214" font-size="11" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">✗ 非法　[1, 1, 2, 2] —— 每个值恰好出现 2 次</text>

  <rect x="64" y="220" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="106" y="220" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="148" y="220" width="40" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="220" width="40" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="238" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="126" y="238" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="168" y="238" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="210" y="238" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 150 249 L 150 259" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="257" font-size="9" fill="#999" filter="url(#rough2)">逐值计数</text>

  <text x="34" y="276" font-size="10.5" fill="#778899" filter="url(#rough2)">freq：</text>
  <rect x="80" y="262" width="64" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="152" y="262" width="64" height="20" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="276" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">1 → 2 次</text>
  <text x="184" y="276" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2 → 2 次</text>

  <path d="M 150 285 L 150 295" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="293" font-size="9" fill="#999" filter="url(#rough2)">再聚合</text>

  <text x="34" y="312" font-size="10.5" fill="#778899" filter="url(#rough2)">fc：</text>
  <rect x="80" y="298" width="84" height="20" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="312" text-anchor="middle" font-size="10" fill="#8c3a34" filter="url(#rough2)">频率 2 × 2 个值</text>

  <rect x="300" y="224" width="196" height="94" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="244" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">fc 只有一键 {2: 2}</text>
  <text x="398" y="262" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">一种频率、两个不同值</text>
  <text x="398" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">f 与 2f 无法并存</text>
  <text x="398" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 不平衡 ✗</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">一句话：合法 ⟺ 单值，或 fc 恰两键且大键 = 2×小键 —— 与具体值无关</text>
</svg>
