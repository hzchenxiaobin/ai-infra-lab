<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：初始化边界 → 逐行填表 → 返回 dp[m][n]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">二维 DP，O(m×n) 时间 / O(m×n) 空间（可滚动数组压到 O(n)）</text>

  <!-- ===== Step 1: 初始化 ===== -->
  <rect x="40" y="64" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① 初始化边界</text>
  <text x="56" y="104" font-family="monospace" font-size="10" fill="#555">dp[(m+1) x (n+1)]</text>
  <text x="56" y="118" font-family="monospace" font-size="10" fill="#b85450">dp[0][j]=j, dp[i][0]=i</text>

  <!-- arrow down -->
  <path d="M 160 124 L 160 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: 逐行填表 ===== -->
  <rect x="40" y="148" width="240" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 逐行填表 i=1..m, j=1..n</text>

  <!-- decision diamond: 字符相等? -->
  <path d="M 160 182 L 200 200 L 160 218 L 120 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">word1[i-1]</text>
  <text x="160" y="216" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">== w2[j-1]?</text>

  <!-- yes branch (right) -->
  <path d="M 200 200 L 232 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="196" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="232" y="188" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">dp[i-1]</text>
  <text x="254" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[j-1]</text>

  <!-- no branch (down) -->
  <path d="M 160 218 L 160 232" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="228" font-size="9" fill="#d6a040" font-weight="bold">否</text>
  <rect x="92" y="232" width="136" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="243" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1 + min(dp[i-1][j], dp[i][j-1])</text>

  <!-- arrow down to step 3 -->
  <path d="M 160 248 L 160 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 返回 ===== -->
  <rect x="40" y="272" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 返回 dp[m][n]</text>
  <text x="160" y="308" text-anchor="middle" font-size="10" fill="#555">右下角 = 最小删除步数</text>

  <!-- ===== right side: 填表顺序示意 ===== -->
  <rect x="320" y="64" width="220" height="252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">填表顺序（依赖方向）</text>
  <text x="430" y="100" text-anchor="middle" font-size="9" fill="#888">每格依赖 左上 / 上 / 左</text>

  <!-- mini grid 4x4 -->
  <g font-size="9">
    <!-- header row -->
    <rect x="350" y="116" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <rect x="380" y="116" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <rect x="410" y="116" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <rect x="440" y="116" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <rect x="470" y="116" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="395" y="133" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">0</text>
    <text x="425" y="133" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">1</text>
    <text x="455" y="133" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2</text>
    <text x="485" y="133" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">3</text>

    <!-- row 1 -->
    <rect x="350" y="142" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="159" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">1</text>
    <rect x="380" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="410" y="142" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="440" y="142" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="470" y="142" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

    <!-- row 2 -->
    <rect x="350" y="168" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="185" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2</text>
    <rect x="380" y="168" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="410" y="168" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="440" y="168" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="470" y="168" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

    <!-- row 3 (current, highlighted with arrows) -->
    <rect x="350" y="194" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="365" y="211" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">3</text>
    <rect x="380" y="194" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="410" y="194" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <!-- current cell being filled -->
    <rect x="440" y="194" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="455" y="211" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">?</text>
    <rect x="470" y="194" width="30" height="26" fill="#f5f5f5" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <!-- arrows pointing to current cell: from 左上, 上, 左 -->
    <path d="M 392 168 L 446 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 455 168 L 455 192" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 412 207 L 438 207" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

    <text x="395" y="162" font-size="8" fill="#4a7a3a" font-weight="bold">左上</text>
    <text x="460" y="180" font-size="8" fill="#446688" font-weight="bold">上</text>
    <text x="414" y="204" font-size="8" fill="#d6a040" font-weight="bold">左</text>
  </g>

  <!-- legend -->
  <text x="350" y="240" font-size="9" fill="#b85450" font-weight="bold">■ 红色 = 边界(空串)</text>
  <text x="350" y="254" font-size="9" fill="#4a7a3a" font-weight="bold">■ 绿色 = 匹配格</text>
  <text x="350" y="268" font-size="9" fill="#d6a040" font-weight="bold">■ 橙色 = 当前格</text>
  <text x="350" y="282" font-size="9" fill="#446688" font-weight="bold">■ 蓝色 = 已填普通格</text>
  <text x="350" y="300" font-size="9" fill="#888">顺序：行从上到下，列从左到右</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="328" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">复杂度：时间 O(m×n)｜空间 O(m×n)，滚动数组可压到 O(n)</text>

  <rect x="40" y="374" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#555">下标偏移 1：word1[i-1] 对应 dp[i] 行，dp[0] 代表空串</text>
</svg>
