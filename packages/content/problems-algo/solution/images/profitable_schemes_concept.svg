<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">盈利计划 = 二维容量 0-1 背包（计数型）</text>

  <!-- 犯罪列表 = 物品 -->
  <text x="40" y="58" font-size="12" fill="#888">每桩犯罪 = 一件物品，消耗「成员数」并产出「利润」</text>

  <rect x="40" y="68" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">犯罪 0</text>
  <text x="100" y="106" text-anchor="middle" font-size="10" fill="#666">成员 2  利润 2</text>

  <rect x="170" y="68" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">犯罪 1</text>
  <text x="230" y="106" text-anchor="middle" font-size="10" fill="#666">成员 2  利润 3</text>

  <rect x="300" y="68" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">犯罪 i</text>
  <text x="360" y="106" text-anchor="middle" font-size="10" fill="#666">成员 g  利润 pr</text>

  <text x="440" y="98" font-size="11" fill="#888">每桩最多选一次</text>

  <path d="M 300 120 L 300 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="138" font-size="10" fill="#888">建模为背包</text>

  <!-- 二维容量背包框 -->
  <rect x="100" y="150" width="400" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">二维容量 0-1 背包（求方案数）</text>

  <rect x="120" y="184" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="207" text-anchor="middle" font-size="12" fill="#333">容量① 成员数 ≤ n</text>

  <rect x="310" y="184" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="207" text-anchor="middle" font-size="12" fill="#333">容量② 利润 ≥ minProfit</text>

  <rect x="150" y="228" width="300" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="245" text-anchor="middle" font-size="11" fill="#333">dp[j][p] = 用 j 名成员、利润 ≥ p 的方案数</text>
  <text x="300" y="261" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">利润截断：p 超过 minProfit 一律记为 minProfit</text>

  <path d="M 300 282 L 300 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 截断说明 -->
  <rect x="70" y="310" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="11" fill="#333">利润 5 与利润 100 对「是否 ≥ minProfit」无区别</text>
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#333">⇒ dp 第二维只开 0..minProfit，min(minProfit, p+pr) 截断</text>

  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#888">关键：成员维度「至多」，利润维度「至少」且截断 → 计数型二维背包</text>
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#888">对比 474 一和零：两维都是「至多」，求最大件数；本题求方案数</text>
</svg>
