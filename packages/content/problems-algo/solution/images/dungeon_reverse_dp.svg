<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反向网格 DP：从公主倒推回起点</text>

  <!-- mini grid 3x3: cell 58x42, origin x=60 y=70. cols x=60,120,180; rows y=70,114,158 -->
  <!-- (2,2) green=先算 ; (1,1) orange=当前 ; (0,0) red=答案 -->
  <rect x="60" y="70" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="70" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="70" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="114" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="114" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(i,j)</text>
  <rect x="180" y="114" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="158" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="158" width="58" height="42" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="158" width="58" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">先算</text>

  <!-- (0,0) answer marker -->
  <rect x="60" y="70" width="58" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">答案</text>

  <!-- arrows: from (2,1) up into (1,1); from (1,2) left into (1,1) -->
  <!-- (2,1) center = (149, 179); (1,1) center = (149,135) -->
  <path d="M 149 172 L 149 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="162" font-size="10" fill="#4a7a3a">dp[i+1][j]</text>
  <!-- (1,2) center = (209,135); (1,1) center = (149,135) -->
  <path d="M 202 135 L 176 135" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="128" font-size="10" fill="#4a7a3a">dp[i][j+1]</text>

  <!-- big scan direction arrow: from (2,2) to (0,0) -->
  <path d="M 232 196 Q 160 230 70 118" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="246" font-size="11" fill="#b85450" font-weight="bold">倒推扫描方向（右下 → 左上）</text>

  <!-- formula box -->
  <rect x="300" y="74" width="200" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">转移方程</text>
  <text x="400" y="122" text-anchor="middle" font-size="12" fill="#444">dp[i][j] =</text>
  <text x="400" y="142" text-anchor="middle" font-size="12" fill="#444">max( 1,</text>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#444">min(dp[i+1][j], dp[i][j+1])</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#444">− dungeon[i][j] )</text>

  <!-- why-not-forward note -->
  <rect x="40" y="276" width="460" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为什么不能正向 DP？</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#444">「到 (i,j) 已用的最小 HP」不是最优子结构：</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#444">少花 HP 的路径可能残血到达，遇到后续恶魔直接阵亡；</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#444">反向定义「从 (i,j) 到终点所需 HP」只依赖未来格，子结构干净。</text>
</svg>
