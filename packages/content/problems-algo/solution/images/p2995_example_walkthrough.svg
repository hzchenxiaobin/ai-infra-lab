<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：窗口打标 → 资格判定 → 内连接计数 → 输出</text>

  <!-- 左侧明细表 -->
  <rect x="16" y="46" width="288" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">user_id</text>
  <text x="124" y="62" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">session_start</text>
  <text x="224" y="62" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">session_type</text>
  <text x="284" y="62" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">rk</text>

  <rect x="16" y="70" width="288" height="72" fill="#f0f5fa" stroke="#b8c4d4" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="16" y="142" width="288" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="16" y="190" width="288" height="24" fill="#f0f5fa" stroke="#b8c4d4" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="16" y="214" width="288" height="24" fill="#ffffff" stroke="#b8c4d4" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="40" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">101</text>
  <text x="124" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-06 13:53:42</text>
  <text x="224" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Viewer</text>
  <rect x="264" y="70" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="86" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="40" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">101</text>
  <text x="124" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-20 07:16:06</text>
  <text x="224" y="110" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">Streamer</text>
  <text x="284" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="40" y="134" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">101</text>
  <text x="124" y="134" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-22 16:45:21</text>
  <text x="224" y="134" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">Streamer</text>
  <text x="284" y="134" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="40" y="158" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">102</text>
  <text x="124" y="158" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-16 13:23:09</text>
  <text x="224" y="158" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">Streamer</text>
  <rect x="264" y="142" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="158" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="40" y="182" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">102</text>
  <text x="124" y="182" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-17 13:23:09</text>
  <text x="224" y="182" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">Streamer</text>
  <text x="284" y="182" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="40" y="206" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">103</text>
  <text x="124" y="206" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-27 03:10:49</text>
  <text x="224" y="206" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">Streamer</text>
  <rect x="264" y="190" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="206" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="40" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">104</text>
  <text x="124" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11-27 03:10:49</text>
  <text x="224" y="230" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Viewer</text>
  <rect x="264" y="214" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="230" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="64" y1="46" x2="64" y2="238" stroke="#b8c4d4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="184" y1="46" x2="184" y2="238" stroke="#b8c4d4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="264" y1="46" x2="264" y2="238" stroke="#b8c4d4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="16" y="46" width="288" height="192" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 左下：资格名单 -->
  <rect x="16" y="252" width="288" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="270" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">rk=1 的 4 行里，首场是 Viewer 的只有 101、104</text>
  <text x="160" y="288" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">资格名单 = {101, 104}</text>

  <path d="M 306 140 L 316 140" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 右侧：资格判定 -->
  <rect x="318" y="46" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="413" y="63" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">资格判定（只看 rk=1 行）</text>

  <rect x="318" y="80" width="190" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="97" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">101：首场 Viewer ✓</text>
  <text x="413" y="113" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">数其 Streamer 行 → 2 场</text>

  <rect x="318" y="130" width="190" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="147" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">102：首场 Streamer ✗</text>
  <text x="413" y="163" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">整组排除</text>

  <rect x="318" y="180" width="190" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="197" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">103：首场 Streamer ✗</text>
  <text x="413" y="213" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">不考虑</text>

  <rect x="318" y="230" width="190" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="413" y="247" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">104：首场 Viewer ✓</text>
  <text x="413" y="263" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">但 0 场主播 → 被内连接过滤</text>

  <!-- 右下：输出 -->
  <rect x="318" y="282" width="190" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="413" y="300" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输出（双键降序）</text>
  <text x="413" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">101 → sessions_count = 2</text>
</svg>
