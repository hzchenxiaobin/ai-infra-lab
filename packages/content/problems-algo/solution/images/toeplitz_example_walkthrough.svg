<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐格比左上邻居</text>

  <!-- ===== Example 1 ===== -->
  <text x="124" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1 · 3×4 → true</text>

  <!-- grid 3x4, cell 42, origin (40,74) -->
  <!-- d=-2 blue -->
  <rect x="40" y="158" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="61" y="185" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <!-- d=-1 green -->
  <rect x="40" y="116" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="61" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="82" y="158" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="103" y="185" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="118" y="172" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- d=0 orange -->
  <rect x="40" y="74" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="61" y="101" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="82" y="116" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="103" y="143" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="118" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="124" y="158" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="145" y="185" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="160" y="172" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- d=1 red -->
  <rect x="82" y="74" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="103" y="101" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="124" y="116" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="145" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="166" y="158" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="187" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="202" y="172" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- d=2 blue -->
  <rect x="124" y="74" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="145" y="101" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <rect x="166" y="116" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="187" y="143" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <text x="202" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- d=3 green -->
  <rect x="166" y="74" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="187" y="101" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- one representative comparison arrow: (2,2) -> (1,1) -->
  <path d="M 150 174 L 110 134" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="124" y="216" text-anchor="middle" font-size="10" fill="#555">✓ = 该格与左上邻居相等</text>
  <text x="124" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6 处比较全部相等 → true</text>

  <!-- divider -->
  <path d="M 252 60 L 252 240" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2 · 2×2 → false</text>

  <!-- grid 2x2, cell 64, origin (348,84) -->
  <!-- (0,0)=1 orange highlight (the upper-left reference) -->
  <rect x="348" y="84" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="380" y="122" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">1</text>
  <text x="380" y="160" text-anchor="middle" font-size="9" fill="#d6a040">[0][0]</text>

  <!-- (0,1)=2 plain -->
  <rect x="412" y="84" width="64" height="64" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="444" y="122" text-anchor="middle" font-size="17" fill="#999" font-weight="bold">2</text>

  <!-- (1,0)=2 plain -->
  <rect x="348" y="148" width="64" height="64" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="186" text-anchor="middle" font-size="17" fill="#999" font-weight="bold">2</text>

  <!-- (1,1)=2 red highlight -->
  <rect x="412" y="148" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="444" y="186" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">2</text>
  <text x="444" y="224" text-anchor="middle" font-size="9" fill="#b85450">[1][1]</text>

  <!-- arrow from (1,1) to (0,0) -->
  <path d="M 430 168 L 392 130" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- not-equal badge -->
  <rect x="392" y="118" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="407" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">≠</text>

  <text x="410" y="216" text-anchor="middle" font-size="10" fill="#555">matrix[1][1] 比 matrix[0][0]</text>
  <text x="410" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2 ≠ 1 → 立即 return false</text>

  <!-- bottom summary -->
  <rect x="40" y="262" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定规则：任一 (i,j) 与左上邻居不等 → false；全部相等 → true</text>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#555">第 0 行 / 第 0 列没有左上邻居，天然跳过（每格独占一条对角线）</text>

  <!-- compare count table -->
  <rect x="40" y="324" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="10.5" fill="#d6a040" font-weight="bold">比较次数</text>
  <text x="60" y="360" font-size="10.5" fill="#555">示例 1：(m-1)×(n-1) = 2×3 = 6 次  ·  示例 2：1×1 = 1 次即出局</text>
</svg>
