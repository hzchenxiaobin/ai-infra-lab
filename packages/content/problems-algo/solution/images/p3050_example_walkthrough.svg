<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 种配料 → 上三角 6 对 → 总成本降序</text>

  <!-- input table -->
  <rect x="20" y="40" width="160" height="132" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="56" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 Toppings</text>
  <rect x="28" y="62" width="68" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="77" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">topping_name</text>
  <rect x="96" y="62" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="114" y="77" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cost</text>
  <text x="32" y="99" font-size="9.5" fill="#555" filter="url(#rough2)">Pepperoni</text>
  <text x="114" y="99" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.50</text>
  <text x="32" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">Sausage</text>
  <text x="114" y="118" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.70</text>
  <text x="32" y="137" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken</text>
  <text x="114" y="137" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.55</text>
  <text x="32" y="156" font-size="9.5" fill="#555" filter="url(#rough2)">Extra Cheese</text>
  <text x="114" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.40</text>

  <path d="M 184 106 L 206 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 6 pair sums, two columns -->
  <rect x="210" y="40" width="300" height="132" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="360" y="56" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上三角 6 对求和（t1 &lt; t2）</text>
  <text x="220" y="78" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken+ExtraCheese: 0.55+0.40</text>
  <text x="360" y="78" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0.95</text>
  <text x="220" y="97" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken+Pepperoni: 0.55+0.50</text>
  <text x="360" y="97" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1.05</text>
  <text x="220" y="116" font-size="9.5" fill="#555" filter="url(#rough2)">ExtraCheese+Pepp: 0.40+0.50</text>
  <text x="360" y="116" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0.90</text>
  <text x="220" y="135" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken+Sausage: 0.55+0.70</text>
  <text x="360" y="135" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1.25</text>
  <text x="220" y="154" font-size="9.5" fill="#555" filter="url(#rough2)">ExtraCheese+Saus: 0.40+0.70</text>
  <text x="360" y="154" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1.10</text>
  <text x="220" y="167" font-size="9.5" fill="#555" filter="url(#rough2)">Pepperoni+Sausage: 0.50+0.70</text>
  <text x="360" y="167" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1.20</text>

  <path d="M 360 176 L 360 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="190" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ORDER BY total_cost DESC</text>

  <!-- result table -->
  <text x="60" y="212" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">输出（6 行，降序）：</text>
  <rect x="60" y="220" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="234" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">topping1</text>
  <rect x="210" y="220" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="234" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">topping2</text>
  <rect x="360" y="220" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405" y="234" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total_cost</text>

  <!-- row 1 highlighted -->
  <rect x="60" y="242" width="390" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="135" y="254" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Chicken</text>
  <text x="285" y="254" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Sausage</text>
  <text x="405" y="254" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1.25</text>

  <rect x="60" y="261" width="390" height="17" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="273" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Pepperoni</text>
  <text x="285" y="273" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Sausage</text>
  <text x="405" y="273" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1.20</text>

  <rect x="60" y="280" width="390" height="17" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Extra Cheese</text>
  <text x="285" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Sausage</text>
  <text x="405" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1.10</text>

  <rect x="60" y="299" width="390" height="17" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="311" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken</text>
  <text x="285" y="311" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Pepperoni</text>
  <text x="405" y="311" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1.05</text>

  <rect x="60" y="318" width="390" height="17" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Chicken</text>
  <text x="285" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Extra Cheese</text>
  <text x="405" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.95</text>

  <rect x="60" y="337" width="390" height="17" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="349" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">Extra Cheese</text>
  <text x="285" y="349" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">Pepperoni</text>
  <text x="405" y="349" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">0.90</text>

  <!-- side note -->
  <text x="462" y="250" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">←最贵</text>
  <text x="462" y="348" font-size="9.5" fill="#888" filter="url(#rough2)">←最便宜</text>
</svg>
