<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字符集只有 T/F → 分两遍分别「保留 T」「保留 F」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">answerKey = "TTFTTFTT", k = 1</text>

  <!-- index labels -->
  <text x="70" y="72" font-size="10" fill="#888">下标:</text>
  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="150" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="190" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="230" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="270" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="310" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="350" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="390" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">7</text>

  <!-- ============ Pass 1: keep T ============ -->
  <text x="70" y="98" font-size="12" fill="#446688" font-weight="bold">第一遍 保留 T：</text>
  <text x="70" y="114" font-size="10" fill="#888">窗口内 F 的个数 ≤ k=1 → 把 F 翻成 T</text>

  <!-- row1 cells: T=blue, F=orange highlight -->
  <rect x="90" y="122" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">T</text>
  <rect x="130" y="122" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">T</text>
  <rect x="170" y="122" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="144" text-anchor="middle" font-size="14" fill="#b87a20" font-weight="bold">F</text>
  <rect x="210" y="122" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">T</text>
  <rect x="250" y="122" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">T</text>
  <!-- faded cells outside window -->
  <rect x="290" y="122" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="144" text-anchor="middle" font-size="14" fill="#bbb">F</text>
  <rect x="330" y="122" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="14" fill="#bbb">T</text>
  <rect x="370" y="122" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="14" fill="#bbb">T</text>

  <!-- bracket window [0,4] -->
  <path d="M 90 162 Q 90 170 96 170 L 284 170 Q 290 170 290 162" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="190" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [0,4]="TTFTT"，1 个 F ≤ k=1 ✓ → 翻成 "TTTTT" 长度 5</text>

  <!-- ============ Pass 2: keep F ============ -->
  <text x="70" y="214" font-size="12" fill="#b85450" font-weight="bold">第二遍 保留 F：</text>
  <text x="70" y="230" font-size="10" fill="#888">窗口内 T 的个数 ≤ k=1 → 把 T 翻成 F</text>

  <!-- row2 cells: highlight T as the "to flip" -->
  <rect x="90" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>
  <rect x="130" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>
  <rect x="170" y="238" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">F</text>
  <rect x="210" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>
  <rect x="250" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>
  <rect x="290" y="238" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">F</text>
  <rect x="330" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>
  <rect x="370" y="238" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="260" text-anchor="middle" font-size="14" fill="#b83a30" font-weight="bold">T</text>

  <!-- bracket best window for F: [1,2]="TF" 1 T -> len 2 -->
  <path d="M 130 278 Q 130 286 136 286 L 204 286 Q 210 286 210 278" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最佳窗口 [1,2]="TF"，1 个 T ≤ k=1 → 长度仅 2</text>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#888">T 太密，k=1 不够翻</text>

  <!-- ============ take max ============ -->
  <rect x="60" y="324" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = max(第一遍 5, 第二遍 2) = 5</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#777">目标字符非 T 即 F，两遍覆盖所有情况，取较大者即全局最优</text>

  <!-- legend -->
  <rect x="60" y="392" width="440" height="36" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="76" y="402" width="16" height="16" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="98" y="414" font-size="10" fill="#666">保留的字符(T)</text>
  <rect x="196" y="402" width="16" height="16" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
  <text x="218" y="414" font-size="10" fill="#666">需翻转(F)</text>
  <rect x="296" y="402" width="16" height="16" fill="#f5f5f5" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="318" y="414" font-size="10" fill="#666">窗口外</text>
  <text x="400" y="414" font-size="10" fill="#888">k=1 限翻转数</text>
</svg>
