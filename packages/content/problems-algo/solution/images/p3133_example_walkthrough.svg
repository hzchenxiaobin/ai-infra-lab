<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="385" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：把 v = n−1 的二进制位，从右往左填进 x 的空槽</text>

  <!-- ===== Example 1: n=3, x=4 ===== -->
  <text x="170" y="46" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：n = 3, x = 4 → v = n−1 = 2 = (10)₂</text>

  <!-- row 1: bits of x -->
  <text x="158" y="80" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x 的位</text>
  <rect x="170" y="58" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="79" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="215" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="79" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="260" y="58" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="305" y="58" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="325" y="79" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- bit + slot labels -->
  <text x="190" y="100" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">位3·slot2</text>
  <text x="235" y="100" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">位2·锁死</text>
  <text x="280" y="100" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">位1·slot1</text>
  <text x="325" y="100" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">位0·slot0</text>

  <!-- row 2: bits of v aligned under slots -->
  <text x="158" y="128" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">v 的位</text>
  <rect x="170" y="106" width="40" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <rect x="215" y="106" width="40" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="106" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="305" y="106" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="325" y="127" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- arrows down into answer row -->
  <path d="M 280 138 L 280 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 325 138 L 325 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 3: ans -->
  <text x="158" y="176" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">ans</text>
  <rect x="170" y="152" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="173" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="215" y="152" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="173" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="260" y="152" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="305" y="152" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="173" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="354" y="174" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 6</text>

  <!-- right panel A -->
  <rect x="400" y="54" width="150" height="130" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="475" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最小数组</text>
  <rect x="403" y="80" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="447" y="80" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="469" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="491" y="80" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="513" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="475" y="130" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= {4, 5, 6}</text>
  <text x="475" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">AND = 100₂ = 4 = x ✓</text>
  <text x="475" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">末元素 6 即答案</text>

  <!-- ===== Example 2: n=2, x=7 ===== -->
  <text x="170" y="210" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：n = 2, x = 7 → v = n−1 = 1 = (1)₂</text>

  <!-- row 1 -->
  <text x="158" y="244" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x 的位</text>
  <rect x="170" y="222" width="40" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="243" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="215" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="243" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="260" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="305" y="222" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="243" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- slot labels -->
  <text x="190" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">位3·slot0</text>
  <text x="235" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">位2·锁死</text>
  <text x="280" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">位1·锁死</text>
  <text x="325" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">位0·锁死</text>

  <!-- row 2 -->
  <text x="158" y="292" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">v 的位</text>
  <rect x="170" y="270" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="291" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="215" y="270" width="40" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="270" width="40" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <rect x="305" y="270" width="40" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>

  <!-- arrow -->
  <path d="M 190 302 L 190 314" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 3 -->
  <text x="158" y="340" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">ans</text>
  <rect x="170" y="316" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="337" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="215" y="316" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="337" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="260" y="316" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="305" y="316" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="337" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="338" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 15</text>

  <!-- right panel B -->
  <rect x="400" y="218" width="150" height="130" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="475" y="236" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最小数组</text>
  <rect x="405" y="244" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="264" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="465" y="244" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="475" y="294" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= {7, 15}</text>
  <text x="475" y="314" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">AND = 0111₂ = 7 = x ✓</text>
  <text x="475" y="334" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">末元素 15 即答案</text>

  <!-- bottom note -->
  <path d="M 240 360 L 268 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">v 的位从右往左依次落入 slot0, slot1, …；x 的固定 1 位原样保留 —— ans = merge(x, n−1)</text>
</svg>
