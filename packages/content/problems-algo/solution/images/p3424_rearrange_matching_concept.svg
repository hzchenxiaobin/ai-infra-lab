<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：操作一 = 花 k 买任意排列；排序逐位配对最优</text>

  <!-- Panel 1: 操作一的全能性 -->
  <rect x="12" y="30" width="496" height="120" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">观察一：切成单元素块 ⇒ 一次操作一可达任意排列</text>

  <rect x="36" y="60" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="80" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">−7</text>
  <rect x="90" y="60" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="80" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <rect x="144" y="60" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="80" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">5</text>

  <path d="M 86 56 L 86 96" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 140 56 L 140 96" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <path d="M 200 76 L 286 76" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="243" y="68" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任意重排</text>
  <text x="243" y="92" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">代价 k</text>

  <rect x="296" y="60" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="80" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">9</text>
  <rect x="350" y="60" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="80" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">5</text>
  <rect x="404" y="60" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="80" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">−7</text>

  <text x="113" y="108" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">原数组 arr（按单元素切开）</text>
  <text x="373" y="108" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">重排结果（n! 种任选其一）</text>

  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">⇒ 操作一至多用一次：不用 = 原位匹配；用 = 花 k 买任意匹配</text>

  <!-- Panel 2: 交换引理 -->
  <rect x="12" y="158" width="496" height="138" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">观察二：同序配对不劣于交叉配对（交换引理）</text>

  <path d="M 272 182 L 272 282" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- 左半：同序（最优） -->
  <text x="26" y="201" text-anchor="end" font-size="9" fill="#33506b" filter="url(#rough2)">a↑</text>
  <rect x="30" y="184" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="202" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">−7</text>
  <rect x="76" y="184" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="202" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">5</text>
  <rect x="122" y="184" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="202" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">9</text>

  <text x="26" y="257" text-anchor="end" font-size="9" fill="#33506b" filter="url(#rough2)">b↑</text>
  <rect x="30" y="240" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="258" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">−5</text>
  <rect x="76" y="240" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="258" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">−2</text>
  <rect x="122" y="240" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="258" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">7</text>

  <path d="M 51 210 L 51 240" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 97 210 L 97 240" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 143 210 L 143 240" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="59" y="229" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="105" y="229" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="151" y="229" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="100" y="288" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">同序（最优）：C = 2+7+2 = 11</text>

  <!-- 右半：交叉（更贵） -->
  <text x="296" y="201" text-anchor="end" font-size="9" fill="#33506b" filter="url(#rough2)">a↑</text>
  <rect x="300" y="184" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="202" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">−7</text>
  <rect x="346" y="184" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="202" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">5</text>
  <rect x="392" y="184" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="202" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">9</text>

  <text x="296" y="257" text-anchor="end" font-size="9" fill="#33506b" filter="url(#rough2)">b↑</text>
  <rect x="300" y="240" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="258" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">−5</text>
  <rect x="346" y="240" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="258" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">−2</text>
  <rect x="392" y="240" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="258" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">7</text>

  <path d="M 321 210 L 367 240" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 367 210 L 413 240" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 413 210 L 321 240" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <text x="390" y="288" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">交叉（更贵）：5+2+14 = 21</text>

  <!-- 底部结论 -->
  <rect x="12" y="304" width="496" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">answer = min( A , k + C )</text>
  <text x="260" y="338" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">A = 原位 Σ|arr[i]−brr[i]|；C = 排序后 Σ|a[i]−b[i]|</text>

  <text x="260" y="357" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">示例 1：min(35, 2+11) = 13</text>
</svg>
