<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字符串 → 26 维频率向量 → 逐位比较供应</text>

  <!-- ===== Section A: chars -> supply ===== -->
  <text x="40" y="52" font-size="11" fill="#446688" font-weight="bold">供应：chars = "atach"  →  统计频率 supply[26]</text>

  <!-- chars letters as small cells -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="51" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="64" y="62" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="75" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
    <rect x="88" y="62" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="99" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="112" y="62" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="123" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
    <rect x="136" y="62" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="147" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">h</text>
  </g>

  <!-- arrow down to supply table -->
  <path d="M 88 90 L 88 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- supply freq table: only show a..h window for readability -->
  <text x="40" y="120" font-size="10" fill="#888">supply（仅展示 a–h 段，其余为 0）：</text>
  <g filter="url(#rough2)">
    <!-- header letters a b c d e f g h -->
    <rect x="40" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="60" y="140" text-anchor="middle" font-size="11" fill="#888">a</text>
    <rect x="80" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="100" y="140" text-anchor="middle" font-size="11" fill="#888">b</text>
    <rect x="120" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="140" y="140" text-anchor="middle" font-size="11" fill="#888">c</text>
    <rect x="160" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="180" y="140" text-anchor="middle" font-size="11" fill="#888">d</text>
    <rect x="200" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="220" y="140" text-anchor="middle" font-size="11" fill="#888">e</text>
    <rect x="240" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="260" y="140" text-anchor="middle" font-size="11" fill="#888">f</text>
    <rect x="280" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="300" y="140" text-anchor="middle" font-size="11" fill="#888">g</text>
    <rect x="320" y="126" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="340" y="140" text-anchor="middle" font-size="11" fill="#888">h</text>
    <!-- values -->
    <rect x="40" y="146" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="60" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="80" y="146" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="162" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="120" y="146" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="140" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="160" y="146" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="180" y="162" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="200" y="146" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="220" y="162" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="240" y="146" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="260" y="162" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="280" y="146" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="300" y="162" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="320" y="146" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="340" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- t value placed at far right hint -->
    <text x="380" y="156" font-size="10" fill="#888">… t:1</text>
  </g>
  <text x="380" y="170" font-size="10" fill="#888">(t 在第 19 位)</text>

  <!-- ===== Section B: word -> need ===== -->
  <text x="40" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">需求：单词 "cat"  →  统计频率 need[26]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="206" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="51" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
    <rect x="64" y="206" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="75" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="88" y="206" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="99" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  </g>

  <path d="M 88 230 L 88 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- need table a..h -->
  <text x="40" y="260" font-size="10" fill="#888">need（仅展示 a–h 段）：</text>
  <g filter="url(#rough2)">
    <rect x="40" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="60" y="280" text-anchor="middle" font-size="11" fill="#888">a</text>
    <rect x="80" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="100" y="280" text-anchor="middle" font-size="11" fill="#888">b</text>
    <rect x="120" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="140" y="280" text-anchor="middle" font-size="11" fill="#888">c</text>
    <rect x="160" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="180" y="280" text-anchor="middle" font-size="11" fill="#888">d</text>
    <rect x="200" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="220" y="280" text-anchor="middle" font-size="11" fill="#888">e</text>
    <rect x="240" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="260" y="280" text-anchor="middle" font-size="11" fill="#888">f</text>
    <rect x="280" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="300" y="280" text-anchor="middle" font-size="11" fill="#888">g</text>
    <rect x="320" y="266" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="340" y="280" text-anchor="middle" font-size="11" fill="#888">h</text>
    <rect x="40" y="286" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="60" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="80" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="120" y="286" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="140" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="160" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="180" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="200" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="220" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="240" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="260" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="280" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="300" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="320" y="286" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="340" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <text x="380" y="300" font-size="10" fill="#888">… t:1</text>
  </g>

  <!-- ===== Section C: comparison ===== -->
  <text x="40" y="332" font-size="11" fill="#b85450" font-weight="bold">逐位比较：need[c] ≤ supply[c] 对所有 c 成立？</text>

  <g filter="url(#rough2)">
    <rect x="40" y="340" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="100" y="355" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">a: 1 ≤ 2 ✓</text>
    <rect x="170" y="340" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="230" y="355" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c: 1 ≤ 1 ✓</text>
    <rect x="300" y="340" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="360" y="355" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">t: 1 ≤ 1 ✓</text>
  </g>

  <path d="M 200 362 L 200 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="374" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="389" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">好词！ans += 3</text>
</svg>
