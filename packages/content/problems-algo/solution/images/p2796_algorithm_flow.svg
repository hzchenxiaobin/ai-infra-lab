<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：原型查找 → this 取串 → 拼接 n 次 → 返回</text>

  <!-- step 1: call -->
  <rect x="195" y="50" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="75" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 调用 "code".repeatString(3)</text>
  <path d="M 320 92 L 320 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: prototype lookup (diamond) -->
  <path d="M 320 116 L 412 158 L 320 200 L 228 158 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">String.prototype</text>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">找到 repeatString?</text>
  <path d="M 320 200 L 320 220" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="335" y="216" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step 3: this binding -->
  <rect x="160" y="224" width="320" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="245" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ this 绑定为调用方字符串</text>
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">this → "code"（String 包装对象，拼接时自动拆箱）</text>
  <path d="M 320 272 L 320 292" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: accumulate loop -->
  <rect x="140" y="296" width="360" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 拼接 num 次（或调内置 this.repeat(num)）</text>
  <text x="320" y="335" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">result += this，循环 i = 0 .. num-1</text>
  <path d="M 320 350 L 320 370" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- step 5: return -->
  <rect x="190" y="374" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="401" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 "codecodecode"</text>
</svg>
