<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="210" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 + 隔位取和</text>
  <text x="494" y="46" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">O(n log n) 时间</text>

  <!-- 开始 -->
  <rect x="150" y="38" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="57" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">开始</text>
  <path d="M 210 66 L 210 80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="130" y="82" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">将 nums 升序排序</text>
  <path d="M 210 114 L 210 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="120" y="132" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = len(nums)，k = n / 3</text>
  <text x="210" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，i = 0</text>
  <path d="M 210 176 L 210 190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：i < k ? -->
  <polygon points="210,192 285,222 210,252 135,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="227" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">i &lt; k ?</text>

  <!-- 否 → 返回 -->
  <path d="M 285 222 L 341 222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="214" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <rect x="345" y="206" width="130" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="226" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 累加 -->
  <path d="M 210 252 L 210 264" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="262" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="125" y="266" width="170" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="284" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">ans += nums[n−2−2i]</text>
  <text x="210" y="302" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">i += 1</text>

  <!-- 累加框 → i++ 框（左侧回边） -->
  <path d="M 125 288 L 65 288 L 65 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="206" width="70" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>

  <!-- i++ → 菱形左侧 -->
  <path d="M 100 222 L 131 222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右下注释框：索引序列 -->
  <rect x="330" y="290" width="164" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="309" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">取的索引依次为：</text>
  <text x="412" y="324" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">n−2, n−4, ⋯, n−2k（即 k）</text>
  <text x="412" y="339" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">共 k = n/3 个</text>

  <!-- 左下注释框：溢出警示 -->
  <rect x="30" y="324" width="270" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="344" text-anchor="middle" font-size="10" fill="#7a3030" filter="url(#rough2)">⚠ C++ 用 long long：和可达约 1.7×10¹⁴，爆 int</text>
</svg>
