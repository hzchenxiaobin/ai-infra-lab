<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后，连通块 = 值轴上的连续段</text>

  <text x="100" y="54" font-size="12" fill="#555">原数组 nums（limit = 3）</text>

  <rect x="100" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="150" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="82" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="200" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="82" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="250" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="82" text-anchor="middle" font-size="13" fill="#333">18</text>
  <rect x="300" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="82" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="350" y="60" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>

  <path d="M 260 102 L 260 128" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="272" y="120" font-size="12" fill="#446688">按值排序（记住原下标）</text>

  <text x="70" y="158" font-size="12" fill="#555">排序后（值 ↑，标注原下标）</text>

  <text x="117" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="167" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="232" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4&gt;3</text>
  <text x="297" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="357" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">11&gt;3</text>

  <rect x="70" y="180" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="120" y="180" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="170" y="180" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="204" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="250" y="180" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="204" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="300" y="180" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="204" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="370" y="180" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="204" text-anchor="middle" font-size="13" fill="#333">18</text>

  <text x="92" y="234" text-anchor="middle" font-size="10" fill="#888">i0</text>
  <text x="142" y="234" text-anchor="middle" font-size="10" fill="#888">i5</text>
  <text x="192" y="234" text-anchor="middle" font-size="10" fill="#888">i4</text>
  <text x="272" y="234" text-anchor="middle" font-size="10" fill="#888">i2</text>
  <text x="322" y="234" text-anchor="middle" font-size="10" fill="#888">i1</text>
  <text x="392" y="234" text-anchor="middle" font-size="10" fill="#888">i3</text>

  <path d="M 227 180 L 236 188 L 226 196 L 237 204 L 228 212 L 235 218" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 180 L 361 188 L 351 196 L 362 204 L 353 212 L 360 218" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="142" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">块 A</text>
  <text x="297" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">块 B</text>
  <text x="392" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">块 C</text>

  <rect x="40" y="272" width="225" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="152" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">段内：相邻差 ≤ limit</text>
  <text x="152" y="312" text-anchor="middle" font-size="11" fill="#555">链式传递 → 同一连通块</text>
  <text x="152" y="330" text-anchor="middle" font-size="11" fill="#555">块内值可任意重排</text>

  <rect x="285" y="272" width="215" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">断口：相邻差 &gt; limit</text>
  <text x="392" y="312" text-anchor="middle" font-size="11" fill="#555">左右任意元素对差都 &gt; limit</text>
  <text x="392" y="330" text-anchor="middle" font-size="11" fill="#555">无边跨越 → 块彻底隔离</text>
</svg>
