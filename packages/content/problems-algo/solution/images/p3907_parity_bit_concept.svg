<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：奇偶分桶 + 值域前缀 —— 三个条件各归其位</text>

  <!-- 左：数组与倒序扫描 -->
  <g filter="url(#rough2)">
    <rect x="20" y="36" width="252" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="146" y="56" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">倒序扫描（i : n−1 → 0）</text>

    <rect x="34" y="66" width="38" height="26" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="53" y="84" text-anchor="middle" font-size="12" fill="#999">5</text>
    <rect x="82" y="66" width="38" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="101" y="84" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="130" y="66" width="38" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="149" y="84" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="178" y="66" width="38" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="197" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="226" y="66" width="38" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="245" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>

    <text x="53" y="106" text-anchor="middle" font-size="9" fill="#888">i=0</text>
    <text x="101" y="106" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold">i=1</text>
    <text x="149" y="106" text-anchor="middle" font-size="9" fill="#888">i=2</text>
    <text x="197" y="106" text-anchor="middle" font-size="9" fill="#888">i=3</text>
    <text x="245" y="106" text-anchor="middle" font-size="9" fill="#888">i=4</text>

    <text x="146" y="124" text-anchor="middle" font-size="9" fill="#555">绿 = 已入桶（右侧）　橙 = 当前　灰 = 待处理</text>

    <path d="M 250 140 C 210 156, 92 156, 46 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="148" y="160" text-anchor="middle" font-size="9" fill="#33506b">扫描方向</text>

    <text x="146" y="186" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">当前 i = 1：值 2 是偶数</text>
    <text x="146" y="204" text-anchor="middle" font-size="10.5" fill="#33506b">→ 去查对面【奇数桶】里 &lt; 2 的</text>
    <text x="146" y="222" text-anchor="middle" font-size="9.5" fill="#4a6b8a">（桶中 = i 右侧全体：4、1、3 已入桶）</text>
  </g>

  <!-- 右：奇偶两个桶 -->
  <g filter="url(#rough2)">
    <rect x="292" y="36" width="248" height="200" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="416" y="56" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">按奇偶分两桶（各一棵 BIT）</text>

    <text x="302" y="79" font-size="10" fill="#2f5d24" font-weight="bold">奇数桶 bit₁：</text>
    <rect x="330" y="84" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="347" y="100" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">1</text>
    <rect x="370" y="84" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="387" y="100" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="424" y="100" font-size="9" fill="#2f5d24">✓ 1 &lt; 2 计入</text>
    <text x="424" y="114" font-size="9" fill="#888">✗ 3 ≥ 2 不计</text>

    <text x="302" y="143" font-size="10" fill="#2f5d24" font-weight="bold">偶数桶 bit₀：</text>
    <rect x="330" y="148" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="347" y="164" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="424" y="164" font-size="9" fill="#4a6b5a">本轮不碰（2 是偶数）</text>

    <rect x="304" y="188" width="224" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
    <text x="416" y="208" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">ans[1] = 奇桶中 &lt; 2 的个数 = 1 ✓</text>
  </g>

  <!-- 查询箭头：左面板 → 奇数桶 -->
  <path d="M 268 96 L 324 96" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="297" y="88" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">查 &lt; 2</text>

  <!-- 底部左：三个要点 -->
  <g filter="url(#rough2)">
    <rect x="20" y="250" width="336" height="138" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="188" y="268" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">三个要点</text>
    <text x="32" y="288" font-size="9.5" fill="#8a6d1a">① 奇偶是「值」的属性 ⇒ 分桶后，查询永远只碰「对面桶」，</text>
    <text x="32" y="304" font-size="9.5" fill="#8a6d1a">　　自己所在的本桶对当前查询毫无贡献（异奇偶才计数）</text>
    <text x="32" y="322" font-size="9.5" fill="#8a6d1a">② 「严格小于 x」= 值域前缀 pre(rank(x)−1)；且相等 ⟹ 同奇偶</text>
    <text x="32" y="338" font-size="9.5" fill="#8a6d1a">　　⟹ 早被奇偶条件排除——对面桶上 &lt; 与 ≤ 天然等价</text>
    <text x="32" y="356" font-size="9.5" fill="#8a6d1a">③ 倒序 + 先查后插 ⇒ 两桶恒装「i 右侧全体」：</text>
    <text x="32" y="372" font-size="9.5" fill="#8a6d1a">　　右侧管方向、值管前缀、奇偶管选桶——三条件各归其位</text>
  </g>

  <!-- 底部右：常见翻车点 -->
  <g filter="url(#rough2)">
    <rect x="372" y="250" width="168" height="138" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="456" y="268" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">常见翻车点</text>
    <text x="384" y="288" font-size="9.5" fill="#8a3030">① 正序扫描会数成「左侧」——</text>
    <text x="384" y="304" font-size="9.5" fill="#8a3030">　　本题要右侧，须倒序</text>
    <text x="384" y="322" font-size="9.5" fill="#8a3030">② 查错桶：2（偶）应查【奇桶】，</text>
    <text x="384" y="338" font-size="9.5" fill="#8a3030">　　同奇偶的压根不计数</text>
    <text x="384" y="356" font-size="9.5" fill="#8a3030">③ 值域大 / 有负数：离散化通吃，</text>
    <text x="384" y="372" font-size="9.5" fill="#8a3030">　　别按值硬开数组</text>
  </g>
</svg>
