<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：pattern="abba", s="dog cat cat dog"</text>
  <text x="290" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">逐位同步核对 p2w 与 w2p，全程无冲突 → true ✓</text>

  <g>
    <rect x="32" y="70" width="120" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="92" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 0</text>
    <line x1="42" y1="100" x2="142" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="92" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">ch: a</text>
    <text x="92" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">w: dog</text>
    <line x1="42" y1="150" x2="142" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="92" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p2w:</text>
    <text x="92" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{a:dog}</text>
    <text x="92" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w2p:</text>
    <text x="92" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{dog:a}</text>
    <line x1="42" y1="226" x2="142" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="92" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="92" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <g>
    <rect x="168" y="70" width="120" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="228" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 1</text>
    <line x1="178" y1="100" x2="278" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="228" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">ch: b</text>
    <text x="228" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">w: cat</text>
    <line x1="178" y1="150" x2="278" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="228" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p2w:</text>
    <text x="228" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{a:dog, b:cat}</text>
    <text x="228" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w2p:</text>
    <text x="228" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{dog:a,cat:b}</text>
    <line x1="178" y1="226" x2="278" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="228" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="228" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <g>
    <rect x="304" y="70" width="120" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="364" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 2</text>
    <line x1="314" y1="100" x2="414" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="364" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">ch: b</text>
    <text x="364" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">w: cat</text>
    <line x1="314" y1="150" x2="414" y2="150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="364" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p2w[b]:</text>
    <text x="364" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= cat ✓</text>
    <text x="364" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w2p[cat]:</text>
    <text x="364" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= b ✓</text>
    <line x1="314" y1="226" x2="414" y2="226" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="364" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">老字符</text>
    <text x="364" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">双向一致 ✓</text>
  </g>

  <g>
    <rect x="440" y="70" width="120" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="500" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 3</text>
    <line x1="450" y1="100" x2="550" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="500" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">ch: a</text>
    <text x="500" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">w: dog</text>
    <line x1="450" y1="150" x2="550" y2="150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="500" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p2w[a]:</text>
    <text x="500" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= dog ✓</text>
    <text x="500" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w2p[dog]:</text>
    <text x="500" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= a ✓</text>
    <line x1="450" y1="226" x2="550" y2="226" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="500" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">老字符</text>
    <text x="500" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">双向一致 ✓</text>
  </g>

  <rect x="120" y="296" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4 步全程无冲突</text>
  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ return true（符合规律）</text>

  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">对照：abba / "dog dog dog dog" 在 i=1 因 w2p[dog]=a ≠ b 冲突 → false</text>
</svg>
