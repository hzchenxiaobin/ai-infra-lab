<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">极坐标法核心：ρ 必须取 R·√U，而非 R·U</text>

  <!-- ===== LEFT: wrong disk (rho = R*U, clustered near center) ===== -->
  <ellipse cx="130" cy="100" rx="55" ry="55" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- many dots near center -->
  <circle cx="125" cy="98" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="133" cy="102" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="128" cy="105" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="135" cy="96" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="130" cy="100" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="126" cy="104" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="132" cy="93" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="134" cy="106" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="127" cy="95" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="131" cy="108" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <!-- mid ring -->
  <circle cx="105" cy="100" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="155" cy="100" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="130" cy="125" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="130" cy="78" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <!-- far -->
  <circle cx="90" cy="100" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="170" cy="100" r="2.2" fill="#b85450" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">错误：ρ = R·U</text>
  <text x="130" y="195" text-anchor="middle" font-size="10" fill="#888">点堆积于圆心</text>

  <!-- ===== RIGHT: correct disk (rho = R*sqrt(U), uniform) ===== -->
  <ellipse cx="430" cy="100" rx="55" ry="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- uniform spread -->
  <circle cx="441" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="111" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="419" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="89" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="452" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="122" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="408" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="78" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="446" cy="108" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="414" cy="92" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="446" cy="92" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="414" cy="108" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="463" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="133" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="397" cy="100" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="430" cy="67" r="2.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正确：ρ = R·√U</text>
  <text x="430" y="195" text-anchor="middle" font-size="10" fill="#888">整圆均匀</text>

  <!-- ===== BOTTOM: CDF curve + inverse transform ===== -->
  <!-- plot area: x 90..300 (rho 0..R), y 250..380 (F 0..1, inverted) -->
  <!-- axes -->
  <line x1="90" y1="380" x2="310" y2="380" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="380" x2="90" y2="240" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="395" font-size="10" fill="#888">ρ/R</text>
  <text x="74" y="248" font-size="10" fill="#888">F(ρ)</text>
  <text x="80" y="384" font-size="9" fill="#888">0</text>
  <text x="298" y="395" font-size="9" fill="#888">1</text>
  <text x="74" y="384" font-size="9" fill="#888">0</text>
  <text x="74" y="252" font-size="9" fill="#888">1</text>

  <!-- CDF parabola F = (rho/R)^2 : quadratic bezier P0(90,380) P1(200,380) P2(310,250) -->
  <path d="M 90 380 Q 200 380 310 250" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="250" y="300" font-size="11" fill="#446688" font-weight="bold">F(ρ) = (ρ/R)²</text>

  <!-- inverse: U=0.64 -> y=380-130*0.64=380-83.2=296.8; x on curve: t=sqrt(0.64)=0.8 -> x=90+220*0.8=266 -->
  <line x1="90" y1="297" x2="266" y2="297" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="266" y1="297" x2="266" y2="380" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="10" fill="#b85450">U=0.64</text>
  <text x="240" y="375" font-size="10" fill="#b85450">ρ/R=0.8</text>

  <!-- arrow U -> rho -->
  <text x="172" y="288" font-size="10" fill="#888">逆变换 ρ=R·√U</text>

  <!-- ===== RIGHT-SIDE formula box ===== -->
  <rect x="360" y="240" width="180" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">面积元：ρ dρ dθ</text>
  <text x="450" y="284" text-anchor="middle" font-size="10" fill="#666">边缘密度</text>
  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#333">f(ρ) = 2ρ / R²</text>
  <text x="450" y="324" text-anchor="middle" font-size="10" fill="#666">CDF 及其逆</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#333">F(ρ) = ρ²/R²</text>
  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ρ = R·√U</text>
  <text x="450" y="380" text-anchor="middle" font-size="10" fill="#888">θ = 2π·U₁ 仍均匀</text>
</svg>
