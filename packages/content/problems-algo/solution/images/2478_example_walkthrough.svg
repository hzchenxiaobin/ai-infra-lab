<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "23542185131"，k=3，minLength=2</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">质数 = {2,3,5,7}（段首着绿）；非质数 = {1,4,6,8,9}（段尾着红）</text>

  <!-- ===== reference string row: y=56, cells width 40, start x=80 ===== -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <!-- idx0 '2' prime -->
    <rect x="80" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="77">2</text>
    <!-- idx1 '3' prime -->
    <rect x="120" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="77">3</text>
    <!-- idx2 '5' prime -->
    <rect x="160" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="77">5</text>
    <!-- idx3 '4' non-prime -->
    <rect x="200" y="56" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="77">4</text>
    <!-- idx4 '2' prime -->
    <rect x="240" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="77">2</text>
    <!-- idx5 '1' non-prime -->
    <rect x="280" y="56" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="77">1</text>
    <!-- idx6 '8' non-prime -->
    <rect x="320" y="56" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="77">8</text>
    <!-- idx7 '5' prime -->
    <rect x="360" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="380" y="77">5</text>
    <!-- idx8 '1' non-prime -->
    <rect x="400" y="56" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="77">1</text>
    <!-- idx9 '3' prime -->
    <rect x="440" y="56" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="460" y="77">3</text>
    <!-- idx10 '1' non-prime -->
    <rect x="480" y="56" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="500" y="77">1</text>
  </g>
  <!-- index labels -->
  <g font-size="8.5" fill="#888" text-anchor="middle">
    <text x="100" y="100">0</text><text x="140" y="100">1</text><text x="180" y="100">2</text>
    <text x="220" y="100">3</text><text x="260" y="100">4</text><text x="300" y="100">5</text>
    <text x="340" y="100">6</text><text x="380" y="100">7</text><text x="420" y="100">8</text>
    <text x="460" y="100">9</text><text x="500" y="100">10</text>
  </g>

  <!-- ===== Partition rows: seg1=blue seg2=orange seg3=green ===== -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- 方案1: 2354 | 218 | 5131  (seg i=0..3 | 4..6 | 7..10) -->
    <text x="44" y="151" font-size="11" fill="#444" font-weight="bold">方案1</text>
    <rect x="78" y="130" width="164" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="238" y="130" width="124" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="358" y="130" width="164" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="160" y="152">2 3 5 4</text>
    <text x="300" y="152">2 1 8</text>
    <text x="440" y="152">5 1 3 1</text>

    <!-- 方案2: 2354 | 21851 | 31  (i=0..3 | 4..8 | 9..10) -->
    <text x="44" y="207" font-size="11" fill="#444" font-weight="bold">方案2</text>
    <rect x="78" y="186" width="164" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="238" y="186" width="204" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="438" y="186" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="160" y="208">2 3 5 4</text>
    <text x="340" y="208">2 1 8 5 1</text>
    <text x="480" y="208">3 1</text>

    <!-- 方案3: 2354218 | 51 | 31  (i=0..6 | 7..8 | 9..10) -->
    <text x="44" y="263" font-size="11" fill="#444" font-weight="bold">方案3</text>
    <rect x="78" y="242" width="244" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="318" y="242" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="398" y="242" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="200" y="264">2 3 5 4 2 1 8</text>
    <text x="360" y="264">5 1</text>
    <text x="460" y="264">3 1</text>
  </g>

  <!-- answer banner -->
  <rect x="80" y="290" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">完美分割方案数 = dp[11][3] = 3 ✓</text>

  <!-- dp trace note -->
  <rect x="30" y="332" width="540" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="354" font-size="11" fill="#333" font-weight="bold">DP 轨迹：</text>
  <text x="40" y="372" font-size="10.5" fill="#555">j=1：dp[4][1]=1, dp[6][1]=1, dp[7][1]=1, dp[9][1]=1, dp[11][1]=1（整段首质数 + 尾非质数）</text>
  <text x="40" y="388" font-size="10.5" fill="#555">j=2：段首质数处累加 → dp[6][2]=1, dp[7][2]=1, dp[9][2]=2, dp[11][2]=3</text>
  <text x="40" y="404" font-size="10.5" fill="#b85450">j=3：dp[7][2]=1 + dp[9][2]=2（均为质数起点）→ dp[11][3] = S[9] = 3 ✓</text>
</svg>
