<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双数组排序 → 遍历训练师 → 达标则匹配并推进 i，否则跳过</text>

  <!-- Step 1: sort -->
  <rect x="180" y="40" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#446688">① 排序 players、trainers 升序</text>

  <path d="M 270 82 L 270 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="200" y="102" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#d6a040">② i = 0 (运动员指针)</text>

  <path d="M 270 140 L 270 158" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for each trainer -->
  <rect x="170" y="160" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#446688">③ 遍历每个训练师 t = trainers[j]</text>

  <path d="M 270 198 L 270 214" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,216 400,266 270,316 140,266" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i &lt; n 且</text>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t ≥ players[i] ?</text>

  <!-- Yes branch (right) -->
  <path d="M 400 266 L 440 266" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="444" y="246" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="487" y="263" text-anchor="middle" font-size="10.5" fill="#4a7a3a">匹配 i↔t</text>
  <text x="487" y="277" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i += 1</text>

  <!-- loop back arrow from yes -->
  <path d="M 487 246 L 487 178 L 372 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch (left) -->
  <path d="M 140 266 L 96 266" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="10" y="246" width="84" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="263" text-anchor="middle" font-size="10.5" fill="#b85450">该训练师</text>
  <text x="52" y="277" text-anchor="middle" font-size="10.5" fill="#b85450">太小，跳过</text>

  <!-- loop back arrow from no -->
  <path d="M 52 246 L 52 178 L 168 178" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End: return i -->
  <path d="M 270 316 L 270 332" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="328" font-size="10" fill="#888">训练师遍尽</text>
  <rect x="190" y="334" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="359" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">④ return i （= 匹配数）</text>
</svg>
