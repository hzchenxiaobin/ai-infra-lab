<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心：差分 map 记端点增量，单趟扫描求最大重叠</text>

  <text x="40" y="56" font-size="11.5" fill="#888" font-weight="bold">三次 book 后的事件（半开区间）</text>

  <rect x="90" y="64" width="60" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[5,15)</text>

  <rect x="120" y="86" width="60" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[10,20)</text>

  <rect x="120" y="108" width="180" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[10,40)</text>

  <line x1="70" y1="150" x2="380" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="146" x2="70" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="90" y1="146" x2="90" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="146" x2="120" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="146" x2="150" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="146" x2="180" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="146" x2="300" y2="154" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <text x="70" y="168" text-anchor="middle" font-size="9.5" fill="#888">t=0</text>
  <text x="90" y="168" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="120" y="168" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="150" y="168" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="180" y="168" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="300" y="168" text-anchor="middle" font-size="9.5" fill="#888">40</text>

  <path d="M 360 138 L 392 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="376" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">扫描</text>

  <text x="40" y="192" font-size="11" fill="#888" font-weight="bold">diff（端点增量）</text>
  <text x="90" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+1</text>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+2</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>

  <line x1="90" y1="178" x2="90" y2="198" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="120" y1="178" x2="120" y2="198" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="150" y1="178" x2="150" y2="198" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="180" y1="178" x2="180" y2="198" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="300" y1="178" x2="300" y2="198" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="40" y="232" font-size="11" fill="#888" font-weight="bold">cur（重叠数）</text>
  <text x="105" y="232" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="122" y="220" width="26" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="165" y="232" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="240" y="232" text-anchor="middle" font-size="11" fill="#555">1</text>

  <path d="M 135 244 L 135 268" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="262" font-size="10.5" fill="#b85450" font-weight="bold">max = 3（k-booking）</text>

  <rect x="36" y="284" width="468" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#446688" font-weight="bold">差分 map 的力量</text>
  <text x="56" y="326" font-size="10.5" fill="#555">• 每个 book(start, end) 只改两处：diff[start] += 1，diff[end] −= 1</text>
  <text x="56" y="344" font-size="10.5" fill="#555">• 值域 10⁹ 不铺满，只存端点 → O(book 次数) 条记录，空间压缩 7 个数量级</text>
  <text x="56" y="362" font-size="10.5" fill="#555">• 按键有序扫描累加 cur，max(cur) 即最大重叠层数（k-booking）</text>
  <text x="56" y="378" font-size="10.5" fill="#b85450" font-weight="bold">→ 与 253 会议室 II 扫描线同源，区别：732 在线动态插入端点</text>
</svg>
