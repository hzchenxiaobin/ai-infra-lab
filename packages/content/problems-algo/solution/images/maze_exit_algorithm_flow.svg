<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="600" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">BFS 算法流程：入口标记已访问 → 逐层扩展 → 发现边界即返回</text>
  <path d="M 300 40 Q 430 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: Init ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="280" height="56" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="180" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">① 初始化</text>
  <text x="180" y="108" text-anchor="middle" font-size="11" fill="#34506e">入口入队，maze[sr][sc] = '+'</text>

  <!-- arrow down -->
  <path d="M 180 120 L 180 138" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 2: steps++ ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="138" width="280" height="56" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="180" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">② steps += 1（进入下一层）</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#7a5415">层 = 步数，逐层递增</text>

  <!-- arrow down -->
  <path d="M 180 194 L 180 212" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 3: pop all of current layer ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="212" width="280" height="56" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="180" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">③ 出队当前层全部 size 个格子</text>
  <text x="180" y="256" text-anchor="middle" font-size="11" fill="#34506e">for k in range(size): pop (r, c)</text>

  <!-- arrow right to neighbor loop -->
  <path d="M 320 240 L 360 240" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 4: for each direction, decision diamond ===== -->
  <!-- decision: neighbor valid? -->
  <g filter="url(#sk)">
    <polygon points="460,200 560,240 460,280 360,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="460" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">邻居</text>
  <text x="460" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">是空格?</text>

  <!-- No: skip -->
  <text x="460" y="196" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <path d="M 460 200 L 460 180 L 440 180" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="168" width="80" height="26" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="400" y="186" text-anchor="middle" font-size="10.5" fill="#b85450">跳过</text>
  <path d="M 360 181 L 340 181 L 340 240 L 360 240" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- Yes: arrow down to next decision -->
  <text x="475" y="288" text-anchor="middle" font-size="10" fill="#4a8e4a">是</text>
  <path d="M 460 280 L 460 300" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- decision: on boundary? -->
  <g filter="url(#sk)">
    <polygon points="460,300 580,348 460,396 340,348" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="460" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">在边界?</text>
  <text x="460" y="360" text-anchor="middle" font-size="10" fill="#2e6e2e">(nr==0||m-1</text>
  <text x="460" y="374" text-anchor="middle" font-size="10" fill="#2e6e2e">||nc==0||n-1)</text>

  <!-- Yes: return steps -->
  <text x="600" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是 ✓</text>
  <path d="M 580 348 L 640 348" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="640" y="324" width="180" height="48" rx="8" fill="#fff0f3" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="730" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">return steps</text>
  <text x="730" y="364" text-anchor="middle" font-size="10" fill="#b85450">发现最近出口！</text>

  <!-- No: mark visited + enqueue -->
  <text x="460" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">否</text>
  <path d="M 460 396 L 460 420" stroke="#34506e" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="420" width="200" height="48" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="460" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">maze[nr][nc] = '+'</text>
  <text x="460" y="460" text-anchor="middle" font-size="11" fill="#34506e">入队 q.push(nr, nc)</text>

  <!-- loop back: neighbor direction loop -->
  <path d="M 360 444 L 340 444 L 340 240 L 320 240" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#5a5a5a">4 方向</text>
  <text x="300" y="354" text-anchor="middle" font-size="10" fill="#5a5a5a">循环</text>

  <!-- loop back: layer loop -->
  <path d="M 180 268 L 180 340 L 120 340 L 120 166 L 40 166" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="100" y="300" text-anchor="middle" font-size="10" fill="#5a5a5a">下一层</text>

  <!-- queue empty? -> return -1 -->
  <path d="M 180 268 L 180 500" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="288" font-size="10" fill="#5a5a5a">队空?</text>
  <g filter="url(#sk)">
    <rect x="40" y="500" width="280" height="48" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="180" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">return -1</text>
  <text x="180" y="540" text-anchor="middle" font-size="10.5" fill="#b85450">无可达出口</text>

  <!-- ===== Right side: key points ===== -->
  <g filter="url(#sk)">
    <rect x="620" y="420" width="220" height="160" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="730" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">关键不变式</text>
  <text x="634" y="466" font-size="10.5" fill="#7a5415">• 入口先标 + → 不被误判</text>
  <text x="634" y="484" font-size="10.5" fill="#7a5415">  为出口</text>
  <text x="634" y="504" font-size="10.5" fill="#7a5415">• 发现邻居即检查边界</text>
  <text x="634" y="522" font-size="10.5" fill="#7a5415">  → 少一轮入队开销</text>
  <text x="634" y="542" font-size="10.5" fill="#7a5415">• 队列按距离单调不减</text>
  <text x="634" y="560" font-size="10.5" fill="#7a5415">  → 首次命中 = 最近</text>
  <text x="634" y="576" font-size="10.5" font-weight="bold" fill="#2e6e2e">  O(mn) 一趟搞定</text>

  <text x="430" y="586" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">每格至多入队一次 → 时间 O(mn)，空间 O(mn)</text>
</svg>
