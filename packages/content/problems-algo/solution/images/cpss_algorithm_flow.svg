<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="480" height="480" fill="#fdfcf7"/>

  <text x="240" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟扫描 + 哈希累加</text>
  <path d="M 160 36 Q 240 44 320 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Init oval -->
  <g filter="url(#sk)"><ellipse cx="240" cy="70" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="240" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans = 0; cnt = {}</text>

  <path d="M 240 92 L 240 116" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop header -->
  <g filter="url(#sk)"><rect x="140" y="118" width="200" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="240" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">对每个 word w ∈ words</text>

  <path d="M 240 154 L 240 178" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop body container -->
  <g filter="url(#sk)"><rect x="70" y="180" width="340" height="186" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6 4"/></g>
  <text x="86" y="200" font-size="11" fill="#888" filter="url(#sk)">（循环体）</text>

  <!-- step 1 build mask -->
  <g filter="url(#sk)"><rect x="100" y="210" width="280" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="240" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">① 建掩码</text>
  <text x="240" y="250" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">mask=0; for c in w: mask |= 1&lt;&lt;(c-'a')</text>

  <path d="M 240 262 L 240 272" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 accumulate -->
  <g filter="url(#sk)"><rect x="100" y="274" width="280" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="240" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② ans += cnt[mask]   （取旧值）</text>

  <path d="M 240 314 L 240 324" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 insert -->
  <g filter="url(#sk)"><rect x="100" y="326" width="280" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="240" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">③ cnt[mask] += 1   （入表）</text>

  <!-- loop back arrow: from step3 right side back up to loop header right side -->
  <path d="M 380 344 Q 430 344 430 136 L 342 136" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="436" y="240" font-size="10" fill="#4a8e4a" filter="url(#sk)">下一个</text>
  <text x="436" y="254" font-size="10" fill="#4a8e4a" filter="url(#sk)">word</text>

  <!-- exit arrow -->
  <path d="M 240 366 L 240 392" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- return oval -->
  <g filter="url(#sk)"><ellipse cx="240" cy="416" rx="80" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="240" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">return ans</text>

  <!-- order note -->
  <g filter="url(#sk)"><rect x="60" y="448" width="360" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="240" y="463" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">⚠ ② 必须在 ③ 前：先取旧计数(不含自己)，再入表</text>
</svg>
