<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：按长度分情况计数</text>

  <!-- 起点 -->
  <ellipse cx="270" cy="60" rx="78" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 low, high</text>

  <path d="M 270 78 L 270 92" stroke="#446688" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo=len(low), hi=len(high), L=lo, count=0</text>

  <path d="M 270 128 L 270 142" stroke="#446688" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判断 L <= hi -->
  <polygon points="270,144 360,184 270,224 180,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L ≤ hi ?</text>

  <!-- 否 → 结束 -->
  <path d="M 360 184 L 430 184" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="470" cy="184" rx="58" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return count</text>

  <!-- 是 → 向下 -->
  <text x="282" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 270 224 L 270 250" stroke="#446688" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判断 中间长度 -->
  <polygon points="270,252 380,292 270,332 160,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo &lt; L &lt; hi ?</text>
  <text x="270" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（中间长度）</text>

  <!-- 是（右）→ 闭式累加 -->
  <path d="M 380 292 L 430 292" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="402" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="436" y="274" width="92" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="482" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">count += f(L)</text>
  <text x="482" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">闭式 O(1)</text>

  <!-- 闭式框 → 回到 L≤hi 判断（右侧绕回顶部循环） -->
  <path d="M 482 274 L 482 184 L 360 184" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="492" y="230" font-size="9" fill="#4a7a3a" filter="url(#rough2)">L++ 续</text>

  <!-- 否（下）→ 生成 + 过滤 -->
  <text x="282" y="346" font-size="11" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M 270 332 L 270 352" stroke="#446688" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="160" y="354" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个 s ∈ find(L)（复用 247）</text>

  <path d="M 270 384 L 270 394" stroke="#446688" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="270,396 386,426 270,456 154,426" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(L==lo &amp; s&lt;low)</text>
  <text x="270" y="437" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">或 (L==hi &amp; s&gt;high)?</text>

  <!-- 左：丢弃 -->
  <path d="M 154 426 L 96 426" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="124" y="420" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="412" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="68" y="431" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">丢弃</text>

  <!-- 右：计数 -->
  <path d="M 386 426 L 430 426" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="420" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="436" y="412" width="72" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="472" y="431" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">count++</text>

  <!-- 计数完一个 s 后回到「对每个 s」 -->
  <path d="M 472 412 L 472 369 L 380 369" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 68 412 L 68 369 L 160 369" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="220" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一个 s / s 用尽后 L++ 回到 L≤hi</text>
</svg>
