<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三组示例演算（T_n = n·delay + period·n(n−1)/2 &lt; cancelTime）</text>

  <!-- column headers -->
  <text x="20" y="52" font-size="10" fill="#888">输入 (delay,period,cancel)</text>
  <text x="240" y="52" font-size="10" fill="#888">间隔序列 a_k</text>
  <text x="445" y="52" font-size="10" fill="#888">调用时刻 T_n</text>

  <line x1="10" y1="58" x2="590" y2="58" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 1 -->
  <rect x="10" y="64" width="580" height="78" fill="none" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="20" y="82" font-size="11" fill="#333" font-weight="bold">① (50, 20, 225)</text>
  <text x="20" y="98" font-size="9" fill="#888">a: 50,70,90,110…</text>
  <text x="20" y="112" font-size="9" fill="#888">T: 50,120,210,320</text>
  <text x="20" y="130" font-size="10" fill="#4a7a3a">T₃=210&lt;225, T₄=320≥225</text>

  <!-- timeline mini for ex1 -->
  <line x1="240" y1="100" x2="430" y2="100" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="265" cy="100" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="305" cy="100" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="345" cy="100" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="395" cy="100" r="3.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="362" y1="72" x2="362" y2="112" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="362" y="70" text-anchor="middle" font-size="9" fill="#b85450">225</text>
  <text x="265" y="120" text-anchor="middle" font-size="8" fill="#888">50</text>
  <text x="305" y="120" text-anchor="middle" font-size="8" fill="#888">120</text>
  <text x="345" y="120" text-anchor="middle" font-size="8" fill="#888">210</text>
  <text x="395" y="120" text-anchor="middle" font-size="8" fill="#b85450">320✗</text>

  <!-- count box ex1 -->
  <rect x="450" y="76" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="100" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="510" y="116" text-anchor="middle" font-size="9" fill="#888">执行次数</text>

  <line x1="10" y1="146" x2="590" y2="146" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <rect x="10" y="150" width="580" height="78" fill="none" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="20" y="168" font-size="11" fill="#333" font-weight="bold">② (20, 20, 150)</text>
  <text x="20" y="184" font-size="9" fill="#888">a: 20,40,60,80…</text>
  <text x="20" y="198" font-size="9" fill="#888">T: 20,60,120,200</text>
  <text x="20" y="216" font-size="10" fill="#4a7a3a">T₃=120&lt;150, T₄=200≥150</text>

  <line x1="240" y1="186" x2="430" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="265" cy="186" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="305" cy="186" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="345" cy="186" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="395" cy="186" r="3.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="360" y1="158" x2="360" y2="198" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="360" y="156" text-anchor="middle" font-size="9" fill="#b85450">150</text>
  <text x="265" y="206" text-anchor="middle" font-size="8" fill="#888">20</text>
  <text x="305" y="206" text-anchor="middle" font-size="8" fill="#888">60</text>
  <text x="345" y="206" text-anchor="middle" font-size="8" fill="#888">120</text>
  <text x="395" y="206" text-anchor="middle" font-size="8" fill="#b85450">200✗</text>

  <rect x="450" y="162" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="186" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="510" y="202" text-anchor="middle" font-size="9" fill="#888">执行次数</text>

  <line x1="10" y1="232" x2="590" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 3 -->
  <rect x="10" y="236" width="580" height="78" fill="none" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="20" y="254" font-size="11" fill="#333" font-weight="bold">③ (100, 200, 500)</text>
  <text x="20" y="270" font-size="9" fill="#888">a: 100,300,500…</text>
  <text x="20" y="284" font-size="9" fill="#888">T: 100,400,900</text>
  <text x="20" y="302" font-size="10" fill="#4a7a3a">T₂=400&lt;500, T₃=900≥500</text>

  <line x1="240" y1="272" x2="430" y2="272" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="275" cy="272" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="340" cy="272" r="3.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="410" cy="272" r="3.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="244" x2="380" y2="284" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="380" y="242" text-anchor="middle" font-size="9" fill="#b85450">500</text>
  <text x="275" y="292" text-anchor="middle" font-size="8" fill="#888">100</text>
  <text x="340" y="292" text-anchor="middle" font-size="8" fill="#888">400</text>
  <text x="410" y="292" text-anchor="middle" font-size="8" fill="#b85450">900✗</text>

  <rect x="450" y="248" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="272" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="510" y="288" text-anchor="middle" font-size="9" fill="#888">执行次数</text>

  <!-- footer note -->
  <rect x="10" y="322" width="580" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="343" text-anchor="middle" font-size="11" fill="#333">🔑 三例的取消时刻都未压在某个 T_n 上 ⇒ “严格小于”边界无歧义，印证间隔递增的题意</text>
</svg>
