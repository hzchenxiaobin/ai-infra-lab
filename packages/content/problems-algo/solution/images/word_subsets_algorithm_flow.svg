<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两阶段 — 先合并需求，再逐词过滤</text>

  <!-- ===== Phase 1: build maxFreq ===== -->
  <rect x="60" y="50" width="440" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：构建 maxFreq（遍历 words2 一次）</text>
  <text x="80" y="94" font-size="11" fill="#555" filter="url(#rough2)">for b in words2:</text>
  <text x="100" y="112" font-size="11" fill="#555" filter="url(#rough2)">freq = count(b)           // 统计 b 的字母频次</text>
  <text x="100" y="130" font-size="11" fill="#555" filter="url(#rough2)">maxFreq[i] = max(maxFreq[i], freq[i])   // 逐字母取 max</text>

  <!-- arrow down -->
  <path d="M 280 150 L 280 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: iterate words1 ===== -->
  <rect x="60" y="178" width="440" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">阶段二：遍历 words1 逐词判定</text>
  <text x="80" y="222" font-size="11" fill="#555" filter="url(#rough2)">for a in words1:</text>
  <text x="100" y="240" font-size="11" fill="#555" filter="url(#rough2)">freq = count(a)           // 统计 a 的字母频次</text>

  <!-- arrow down to diamond -->
  <path d="M 280 260 L 280 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="280,288 400,338 280,388 160,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">freq[c] ≥ maxFreq[c]</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">∀ c ∈ [0, 26) ?</text>

  <!-- Yes / No branches -->
  <path d="M 160 338 L 110 338 L 110 372" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="332" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Yes</text>
  <rect x="62" y="374" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="396" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">加入 res</text>

  <path d="M 400 338 L 450 338 L 450 372" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="332" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">No</text>
  <rect x="402" y="374" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="396" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">跳过</text>

  <!-- ===== shortcut note ===== -->
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遇首个 freq[c] &lt; maxFreq[c] 即 break，无需比完全部 26 个字母</text>
</svg>
