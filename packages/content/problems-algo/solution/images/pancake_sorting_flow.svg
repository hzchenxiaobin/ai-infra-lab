<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：选择排序 + 煎饼翻转，从最大值 n 递减归位</text>

  <!-- start -->
  <rect x="220" y="46" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x = n（待归位的目标值）</text>
  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop check diamond -->
  <polygon points="280,104 360,150 280,196 200,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">x ≥ 1 ?</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#888">（还有元素待归位）</text>

  <!-- no branch -> end -->
  <path d="M 360 150 L 430 150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="133" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="480" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- yes branch down -->
  <path d="M 280 196 L 280 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- find idx -->
  <rect x="190" y="218" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找到值 x 当前下标 idx</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#888">（线性扫描 arr，或用 pos 数组 O(1)）</text>
  <path d="M 280 258 L 280 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- already in place diamond -->
  <polygon points="280,282 380,322 280,362 180,322" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">idx == x−1 ?</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#888">（已在目标位置）</text>

  <!-- yes -> x-- loop back -->
  <path d="M 180 322 L 120 322 L 120 150 L 200 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">是，跳过</text>
  <text x="126" y="254" font-size="10" fill="#888">x ← x−1</text>

  <!-- no -> down -->
  <path d="M 280 362 L 280 382" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="376" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- two flips box -->
  <rect x="120" y="384" width="320" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">若 idx ≠ 0：先 flip(idx+1)，记 k=idx+1（把 x 翻到首位）</text>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">再 flip(x)，记 k=x（把 x 翻到下标 x−1 归位）</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">每轮至多 2 次翻转，记录到 ans</text>

  <!-- loop back from flips -->
  <path d="M 440 415 L 500 415 L 500 150 L 360 150" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="238" font-size="10" fill="#888" font-weight="bold">x ← x−1</text>
  <text x="494" y="254" font-size="10" fill="#888">回到判定</text>
</svg>
