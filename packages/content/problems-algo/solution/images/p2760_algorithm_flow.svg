<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="af2760" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#666"/>
    </marker>
    <marker id="afG2760" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一次遍历流程：遇偶起点 → 扩展 → 跳跃</text>

  <!-- Start node -->
  <rect x="225" y="42" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 i=0, ans=0</text>

  <!-- arrow down -->
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.4" marker-end="url(#af2760)" filter="url(#rough2)"/>

  <!-- loop check -->
  <rect x="225" y="96" width="110" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#555">i &lt; n ?</text>
  <path d="M 280 126 L 280 138" stroke="#666" stroke-width="1.4" marker-end="url(#af2760)" filter="url(#rough2)"/>

  <!-- decision diamond: even & <=threshold -->
  <polygon points="280,140 380,188 280,236 180,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums[i] 偶数</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">且 ≤ threshold ?</text>

  <!-- No branch: i++ loop back -->
  <path d="M 380 188 L 440 188 L 440 111 L 335 111" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#af2760)" filter="url(#rough2)"/>
  <text x="392" y="180" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="448" y="150" font-size="11" fill="#b85450">i++ → 下一轮</text>

  <!-- Yes branch down -->
  <path d="M 280 236 L 280 254" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#afG2760)" filter="url(#rough2)"/>
  <text x="290" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- start = i; i++ -->
  <rect x="205" y="258" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">start = i; i++（起点入窗）</text>
  <path d="M 280 290 L 280 306" stroke="#666" stroke-width="1.4" marker-end="url(#af2760)" filter="url(#rough2)"/>

  <!-- extend loop -->
  <rect x="150" y="310" width="260" height="48" fill="#f5f5f5" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#444">扩展：i &lt; n 且 nums[i] ≤ threshold</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#444">且 nums[i]%2 ≠ nums[i−1]%2 → i++</text>
  <path d="M 280 358 L 280 372" stroke="#666" stroke-width="1.4" marker-end="url(#af2760)" filter="url(#rough2)"/>

  <!-- update ans -->
  <rect x="180" y="376" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = max(ans, i − start)；回循环</text>

  <!-- side note: i never goes back -->
  <rect x="430" y="300" width="120" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="322" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">关键</text>
  <text x="440" y="340" font-size="10" fill="#888">i 只增不减</text>
  <text x="440" y="356" font-size="10" fill="#888">总推进 ≤ n</text>
  <text x="440" y="372" font-size="10" fill="#888">→ 整体 O(n)</text>

  <!-- end -->
  <path d="M 180 188 L 110 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#af2760)" filter="url(#rough2)"/>
  <rect x="40" y="172" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="75" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans</text>
  <text x="120" y="180" font-size="10" fill="#888">否(i≥n)</text>
</svg>
