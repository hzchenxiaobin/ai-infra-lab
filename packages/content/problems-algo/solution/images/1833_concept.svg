<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：等贡献 + 异代价 → 优先买最便宜的</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">每支雪糕都只 +1 支（贡献相同），但价格不同 → 先买便宜的能凑更多支</text>

  <!-- Original array label -->
  <text x="28" y="78" font-size="10.5" fill="#666">原数组</text>

  <!-- Original cards: 1,3,2,4,1 -->
  <rect x="68" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="107" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="83" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="146" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="83" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="185" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="83" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="224" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Arrow down: sort -->
  <path d="M 155 100 L 155 118" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">↑ 升序排序（计数排序 / 库排序）</text>

  <!-- Sorted array label -->
  <text x="28" y="148" font-size="10.5" fill="#666">排序后</text>

  <!-- Sorted cards: 1,1,2,3,4 -->
  <rect x="68" y="130" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="107" y="130" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="130" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="185" y="130" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="224" y="130" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Coins = 7 label -->
  <text x="290" y="153" font-size="11" fill="#b85450" font-weight="bold">coins = 7</text>

  <!-- Bought bracket -->
  <path d="M 68 174 Q 68 182 76 182 L 200 182 Q 208 182 208 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="138" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">买入 4 支，花 1+1+2+3=7</text>

  <!-- Stop marker on price 4 -->
  <text x="241" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗ 停</text>
  <text x="241" y="210" text-anchor="middle" font-size="9.5" fill="#b85450">剩余 0 &lt; 4</text>

  <!-- Insight box -->
  <rect x="40" y="226" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么先买便宜的？</text>
  <text x="260" y="263" text-anchor="middle" font-size="10.5" fill="#555">每支贡献相同（都 +1 支），代价不同 → 优先小代价能凑更多支</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#555">交换论证：用便宜 a 替换贵 b，总价不增、数量不变 → 总存在「全取最便宜」最优解</text>

  <!-- Footer -->
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#888">排序后取「总价 ≤ coins 的最长前缀」即答案</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#aaa">对照 455 分发饼干：小饼干配小胃口，结构完全同构</text>
</svg>
