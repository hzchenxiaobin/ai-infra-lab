<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">RLE 游程编码：encoding 存 (次数, 值) 对，指针 i 只前进</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">next(n) 从当前对逐个消耗：够吃就吃、不够就跳整对，返回最后一个被吃的值</text>

  <!-- ===== Encoding pairs row ===== -->
  <text x="30" y="78" font-size="11" fill="#446688" font-weight="bold">encoding（成对：次数 | 值）</text>
  <g font-size="10" fill="#333">
    <!-- pair 0: (3,8) -->
    <rect x="40" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="58" y="105" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="58" y="84" text-anchor="middle" font-size="8" fill="#888">次数</text>
    <rect x="78" y="88" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="96" y="105" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <text x="96" y="84" text-anchor="middle" font-size="8" fill="#888">值</text>
    <rect x="40" y="86" width="74" height="30" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
    <text x="77" y="126" text-anchor="middle" font-size="8" fill="#446688">i=0</text>

    <!-- pair 1: (0,9) -->
    <rect x="124" y="88" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="142" y="105" text-anchor="middle" fill="#999">0</text>
    <rect x="162" y="88" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="105" text-anchor="middle" fill="#999">9</text>
    <rect x="124" y="86" width="74" height="30" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
    <text x="161" y="126" text-anchor="middle" font-size="8" fill="#999">i=2（0 个，跳过）</text>

    <!-- pair 2: (2,5) -->
    <rect x="208" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="226" y="105" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="246" y="88" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="264" y="105" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="208" y="86" width="74" height="30" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
    <text x="245" y="126" text-anchor="middle" font-size="8" fill="#446688">i=4</text>
  </g>

  <!-- decode arrow -->
  <path d="M 150 132 L 150 152" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="146" font-size="9" fill="#888">展开</text>

  <!-- ===== Decoded sequence row ===== -->
  <text x="30" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">展开后的序列（逻辑上）</text>
  <g font-size="10" fill="#333">
    <rect x="120" y="174" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="192" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="156" y="174" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="173" y="192" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="192" y="174" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="209" y="192" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="228" y="174" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="245" y="192" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="264" y="174" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="281" y="192" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="370" y="192" font-size="9" fill="#888">从不真正展开，只在 encoding 上原地扣减次数</text>

  <!-- ===== Two branches of next(n) ===== -->
  <text x="30" y="226" font-size="11" fill="#b85450" font-weight="bold">next(n) 的两种动作</text>

  <!-- branch A: enough -->
  <rect x="40" y="238" width="240" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">A. 当前对够吃：count ≥ n</text>
  <text x="56" y="276" font-size="10" fill="#555" font-family="monospace">count -= n;  return value;</text>
  <text x="56" y="292" font-size="9" fill="#888">指针 i 不动，原地扣减，下次接着吃这对</text>
  <text x="56" y="307" font-size="9" fill="#888">例：next(2) 遇 (3,8) → count 3→1，返回 8</text>

  <!-- branch B: not enough -->
  <rect x="300" y="238" width="240" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="316" y="258" font-size="11" fill="#b85450" font-weight="bold">B. 不够吃：count &lt; n</text>
  <text x="316" y="276" font-size="10" fill="#555" font-family="monospace">n -= count;  i += 2;</text>
  <text x="316" y="292" font-size="9" fill="#888">跳过整对，指针 i 前进到下一对</text>
  <text x="316" y="307" font-size="9" fill="#888">例：next(2) 遇 (1,8) → n 2→1，i 跳到下对</text>

  <!-- arrow between -->
  <path d="M 280 277 L 300 277" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pointer only moves forward note ===== -->
  <rect x="40" y="332" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="11" fill="#d6a040" font-weight="bold">关键不变式：指针 i 单调递增，永不回退</text>
  <text x="56" y="372" font-size="10" fill="#555">每次 next 最多做一次「扣减」（A 分支，i 不动）+ 若干次「跳对」（B 分支，i += 2）</text>
  <text x="56" y="388" font-size="10" fill="#555">所有 next 的「跳对」次数总和 ≤ encoding.length / 2，因为每对最多被跳一次</text>
  <text x="56" y="404" font-size="10" fill="#555">→ n 次调用总 O(L)，每次均摊 O(1)；n 高达 10⁹ 也不怕，因为按「对」批量跳</text>
  <text x="56" y="418" font-size="9" fill="#888">本质：游程编码把重复值压成 (次数, 值)，迭代器在压缩表示上做「批量消费」</text>
</svg>
