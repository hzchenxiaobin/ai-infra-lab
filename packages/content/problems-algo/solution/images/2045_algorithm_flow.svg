<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 求边数 → 模拟耗时</text>

  <!-- ===== Step 1: BFS ===== -->
  <rect x="70" y="44" width="420" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 1：BFS 追踪最短 / 次短路径（边数）</text>
  <text x="86" y="88" font-size="11.5" fill="#555">• dist1[v] = 到达 v 的最短边数（首次访问时设置）</text>
  <text x="86" y="106" font-size="11.5" fill="#555">• dist2[v] = 到达 v 的次短边数（第二个不同距离，严格 &gt; dist1[v]）</text>
  <text x="86" y="124" font-size="11.5" fill="#4a7a3a">• 每个节点最多入队 2 次 → O(n + m)</text>

  <!-- Arrow down -->
  <path d="M 280 132 L 280 156" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Extract k ===== -->
  <rect x="120" y="162" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 2：k = dist2[n]</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#888">第二短路径的边数（= L+1 或 L+2）</text>

  <!-- Arrow down -->
  <path d="M 280 214 L 280 238" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Simulate ===== -->
  <rect x="70" y="244" width="420" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 3：模拟 k 条边的实际耗时 f(k)</text>
  <text x="96" y="290" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">t = 0</text>
  <text x="96" y="308" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">重复 k 次：</text>
  <text x="116" y="326" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">若 (t / change) % 2 == 1 → 红灯，t = 下一个绿灯时刻</text>
  <text x="116" y="344" font-size="11.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">t += time  （走一条边）</text>

  <!-- Arrow down -->
  <path d="M 280 362 L 280 380" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="160" y="384" width="240" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 t = 到达 n 的第二短时间</text>
</svg>
