<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算  nums = [1,2,2,1,1,0]</text>

  <text x="40" y="46" font-size="11.5" fill="#446688" font-weight="bold">阶段① 顺序合并</text>

  <!-- ===== Row i=0 ===== -->
  <text x="82" y="73" text-anchor="end" font-size="11" fill="#555" font-weight="bold">i=0</text>
  <g filter="url(#rough2)">
    <rect x="90" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="170" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="210" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="290" y="54" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="108" y="74" filter="url(#rough2)">1</text>
    <text x="148" y="74" filter="url(#rough2)">2</text>
    <text x="188" y="74" filter="url(#rough2)">2</text>
    <text x="228" y="74" filter="url(#rough2)">1</text>
    <text x="268" y="74" filter="url(#rough2)">1</text>
    <text x="308" y="74" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="74" font-size="11" fill="#888">1≠2 → 跳过</text>

  <!-- ===== Row i=1 ===== -->
  <text x="82" y="111" text-anchor="end" font-size="11" fill="#555" font-weight="bold">i=1</text>
  <g filter="url(#rough2)">
    <rect x="90" y="92" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="92" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="170" y="92" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="210" y="92" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="92" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="290" y="92" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="108" y="112" fill="#333" filter="url(#rough2)">1</text>
    <text x="148" y="112" fill="#4a7a3a" filter="url(#rough2)">4</text>
    <text x="188" y="112" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="228" y="112" fill="#333" filter="url(#rough2)">1</text>
    <text x="268" y="112" fill="#333" filter="url(#rough2)">1</text>
    <text x="308" y="112" fill="#333" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">2==2 → 2×2=4, 置 0</text>

  <!-- ===== Row i=2 ===== -->
  <text x="82" y="149" text-anchor="end" font-size="11" fill="#555" font-weight="bold">i=2</text>
  <g filter="url(#rough2)">
    <rect x="90" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="170" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="210" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="290" y="130" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="108" y="150" filter="url(#rough2)">1</text>
    <text x="148" y="150" filter="url(#rough2)">4</text>
    <text x="188" y="150" filter="url(#rough2)">0</text>
    <text x="228" y="150" filter="url(#rough2)">1</text>
    <text x="268" y="150" filter="url(#rough2)">1</text>
    <text x="308" y="150" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="150" font-size="11" fill="#888">0≠1 → 跳过</text>

  <!-- ===== Row i=3 ===== -->
  <text x="82" y="187" text-anchor="end" font-size="11" fill="#555" font-weight="bold">i=3</text>
  <g filter="url(#rough2)">
    <rect x="90" y="168" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="168" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="170" y="168" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="210" y="168" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="250" y="168" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="290" y="168" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="108" y="188" fill="#333" filter="url(#rough2)">1</text>
    <text x="148" y="188" fill="#333" filter="url(#rough2)">4</text>
    <text x="188" y="188" fill="#333" filter="url(#rough2)">0</text>
    <text x="228" y="188" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="268" y="188" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="308" y="188" fill="#333" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">1==1 → 2×1=2, 置 0</text>

  <!-- ===== Row i=4 ===== -->
  <text x="82" y="225" text-anchor="end" font-size="11" fill="#555" font-weight="bold">i=4</text>
  <g filter="url(#rough2)">
    <rect x="90" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="170" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="210" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="290" y="206" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="108" y="226" filter="url(#rough2)">1</text>
    <text x="148" y="226" filter="url(#rough2)">4</text>
    <text x="188" y="226" filter="url(#rough2)">0</text>
    <text x="228" y="226" filter="url(#rough2)">2</text>
    <text x="268" y="226" filter="url(#rough2)">0</text>
    <text x="308" y="226" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="226" font-size="11" fill="#888">0==0 → 0×2=0, 无变化</text>

  <!-- ===== Phase 2 ===== -->
  <text x="40" y="264" font-size="11.5" fill="#446688" font-weight="bold">阶段② 搬零</text>

  <text x="82" y="283" text-anchor="end" font-size="11" fill="#555" font-weight="bold">结果</text>
  <g filter="url(#rough2)">
    <rect x="90" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="130" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="170" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="210" y="264" width="36" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="250" y="264" width="36" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="290" y="264" width="36" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="108" y="284" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="148" y="284" fill="#4a7a3a" filter="url(#rough2)">4</text>
    <text x="188" y="284" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="228" y="284" fill="#888" filter="url(#rough2)">0</text>
    <text x="268" y="284" fill="#888" filter="url(#rough2)">0</text>
    <text x="308" y="284" fill="#888" filter="url(#rough2)">0</text>
  </g>
  <text x="342" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">非零前置，末尾补零</text>

  <!-- legend -->
  <rect x="90" y="312" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="324" font-size="10.5" fill="#555">合并产出 / 保留</text>
  <rect x="220" y="312" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="240" y="324" font-size="10.5" fill="#555">被置零</text>
  <rect x="330" y="312" width="14" height="14" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="350" y="324" font-size="10.5" fill="#555">末尾零</text>

  <!-- output badge -->
  <rect x="430" y="310" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="515" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输出 [1,4,2,0,0,0] ✓</text>
</svg>
