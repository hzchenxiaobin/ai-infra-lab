<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="548" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：固定左端点 + 增量元音计数，O(n²) 枚举所有子串</text>

  <ellipse cx="280" cy="54" rx="52" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 280 72 L 280 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="150" y="88" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333">固定左端点 i（0…n−1）：v = 0，j = i</text>

  <path d="M 280 124 L 280 136" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="150" y="140" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#333">v += isVowel(s[j])（增量维护，均摊 O(1)）</text>

  <path d="M 280 176 L 280 194" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,198 396,242 280,286 164,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#333">2v == j−i+1</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">且 v² % k == 0？</text>

  <path d="M 396 242 L 420 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="404" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <rect x="424" y="224" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="472" y="246" text-anchor="middle" font-size="12" fill="#333">ans += 1</text>

  <path d="M 472 260 L 472 300 L 292 300" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <path d="M 280 286 L 280 302" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="292" y="300" font-size="11" fill="#b85450">否</text>

  <polygon points="280,306 368,344 280,382 192,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333">j &lt; n−1？</text>

  <path d="M 192 344 L 118 344 L 118 158 L 144 158" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="172" y="334" text-anchor="middle" font-size="11" fill="#446688">是</text>
  <text x="66" y="336" font-size="11" fill="#446688">j++（右移）</text>

  <path d="M 280 382 L 280 400" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="292" y="398" font-size="11" fill="#b85450">否</text>

  <polygon points="280,404 368,442 280,480 192,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="12" fill="#333">i &lt; n−1？</text>

  <path d="M 368 442 L 536 442 L 536 106 L 414 106" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="382" y="432" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <text x="446" y="470" font-size="11" fill="#d6a040">i++（换左端点，v 清零）</text>

  <path d="M 280 480 L 280 498" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="292" y="496" font-size="11" fill="#b85450">否</text>

  <ellipse cx="280" cy="522" rx="62" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="527" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>
</svg>
