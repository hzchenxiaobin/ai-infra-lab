<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程：求最小可行除数 d</text>

  <!-- Step 1: init -->
  <rect x="200" y="40" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">lo=1, hi=max(nums), ans=hi</text>
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop condition -->
  <polygon points="280,96 380,140 280,184 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333">lo ≤ hi ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">否 → 跳出循环</text>
  <path d="M 380 140 L 430 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="134" font-size="10" fill="#b85450">否</text>

  <!-- return ans -->
  <rect x="430" y="122" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- yes branch down -->
  <path d="M 280 184 L 280 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="196" font-size="10" fill="#4a7a3a">是</text>

  <!-- Step 3: mid -->
  <rect x="200" y="204" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#333">mid = lo + (hi-lo)/2</text>
  <path d="M 280 236 L 280 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: check -->
  <polygon points="280,256 400,300 280,344 160,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#333">Σ ⌈nums[i]/mid⌉</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">≤ threshold ?</text>
  <text x="280" y="330" text-anchor="middle" font-size="9" fill="#888">check(mid)</text>

  <!-- yes (feasible) -->
  <path d="M 160 300 L 110 300 L 110 360" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="294" font-size="10" fill="#4a7a3a">是 ✓</text>
  <rect x="40" y="364" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="382" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="110" y="398" text-anchor="middle" font-size="11" fill="#333">hi = mid - 1</text>
  <text x="110" y="416" text-anchor="middle" font-size="9" fill="#888">尝试更小除数</text>

  <!-- no (infeasible) -->
  <path d="M 400 300 L 450 300 L 450 360" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="294" font-size="10" fill="#b85450">否 ✗</text>
  <rect x="380" y="364" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#333">lo = mid + 1</text>
  <text x="450" y="410" text-anchor="middle" font-size="9" fill="#888">除数太小，加大</text>

  <!-- loop back arrows -->
  <path d="M 110 404 L 110 440 L 280 440 L 280 96" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 404 L 450 440 L 280 440" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="190" y="434" font-size="9" fill="#999">回到循环判断</text>
</svg>
