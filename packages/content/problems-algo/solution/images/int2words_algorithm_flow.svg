<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：主循环（左）+ helper 决策（右）</text>

  <!-- ===== LEFT: main loop (center x ~150) ===== -->
  <text x="150" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">numberToWords 主循环</text>

  <!-- A: num==0? decision -->
  <polygon points="150,54 250,86 150,118 50,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">num == 0 ?</text>
  <text x="150" y="96" text-anchor="middle" font-size="9" fill="#888">特判</text>

  <!-- A yes -> Zero -->
  <path d="M 250 86 L 286 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="288" y="74" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="323" y="92" text-anchor="middle" font-size="10" fill="#333">return "Zero"</text>

  <!-- A no -> init -->
  <path d="M 150 118 L 150 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="132" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="70" y="140" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="middle" font-size="10" fill="#333">i = 0, res = ""</text>

  <!-- arrow to loop test -->
  <path d="M 150 170 L 150 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: num > 0? decision -->
  <polygon points="150,194 250,228 150,262 50,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">num &gt; 0 ?</text>
  <text x="150" y="240" text-anchor="middle" font-size="9" fill="#888">继续取块</text>

  <!-- B no -> return res -->
  <path d="M 50 228 L 30 228 L 30 470 L 70 470" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="350" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- B yes -> chunk -->
  <path d="M 150 262 L 150 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="276" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="60" y="284" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="303" text-anchor="middle" font-size="10" fill="#333">chunk = num % 1000</text>

  <path d="M 150 314 L 150 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: chunk==0? decision -->
  <polygon points="150,334 238,364 150,394 62,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="360" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">chunk == 0 ?</text>
  <text x="150" y="376" text-anchor="middle" font-size="9" fill="#888">零块跳过</text>

  <!-- C yes -> skip back to loop (num/=1000, i++) -->
  <path d="M 238 364 L 276 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="358" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="278" y="350" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="338" y="363" text-anchor="middle" font-size="9" fill="#333">跳过，仅 num/=1000</text>
  <text x="338" y="374" text-anchor="middle" font-size="9" fill="#333">i++</text>
  <!-- loop back up to B -->
  <path d="M 338 350 L 338 210 L 250 210" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C no -> build cur -->
  <path d="M 150 394 L 150 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="406" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="40" y="414" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="432" text-anchor="middle" font-size="9" fill="#333">cur = helper(chunk)</text>
  <text x="150" y="446" text-anchor="middle" font-size="9" fill="#333">+ THOUSANDS[i] + res  →  res = cur</text>
  <text x="150" y="458" text-anchor="middle" font-size="9" fill="#888">num /= 1000; i++</text>

  <!-- loop back to B -->
  <path d="M 260 436 L 286 436 L 286 210 L 250 210" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- return res -->
  <rect x="70" y="458" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="480" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return res</text>

  <!-- ===== RIGHT: helper decision (center x ~445) ===== -->
  <text x="445" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">helper(n)  （n &lt; 1000）</text>

  <!-- D: n==0? -->
  <polygon points="445,54 535,84 445,114 355,84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">n == 0 ?</text>
  <!-- yes -> "" -->
  <path d="M 355 84 L 330 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="78" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="270" y="72" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="88" text-anchor="middle" font-size="10" fill="#333">return ""</text>

  <!-- no -> n<20? -->
  <path d="M 445 114 L 445 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="128" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <polygon points="445,138 535,168 445,198 355,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="164" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">n &lt; 20 ?</text>
  <!-- yes -> table -->
  <path d="M 355 168 L 320 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="190" y="156" width="128" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="172" text-anchor="middle" font-size="9" fill="#333">LESS_THAN_20[n]</text>

  <!-- no -> n<100? -->
  <path d="M 445 198 L 445 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="212" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <polygon points="445,222 535,252 445,282 355,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="248" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">n &lt; 100 ?</text>
  <!-- yes -> TENS + ones -->
  <path d="M 355 252 L 320 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="238" width="148" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="252" text-anchor="middle" font-size="9" fill="#333">TENS[n/10]</text>
  <text x="244" y="264" text-anchor="middle" font-size="8" fill="#666">+ (n%10 ? " "+LESS_THAN_20[n%10] : "")</text>

  <!-- no -> Hundred + recurse -->
  <path d="M 445 282 L 445 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="296" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="355" y="304" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="322" text-anchor="middle" font-size="9" fill="#333">LESS_THAN_20[n/100] + " Hundred"</text>
  <text x="445" y="336" text-anchor="middle" font-size="9" fill="#666">+ (n%100 ? " " + helper(n%100) : "")</text>

  <!-- recursion arrow -->
  <path d="M 445 348 L 445 362 L 555 362 L 555 250 L 535 250" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566" y="308" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">递归</text>
  <text x="566" y="320" text-anchor="middle" font-size="8" fill="#b85450">helper(n%100)</text>

  <!-- table legend -->
  <rect x="340" y="386" width="220" height="118" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="404" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">三张查表</text>
  <text x="350" y="422" font-size="9" fill="#666">LESS_THAN_20[0..19]</text>
  <text x="350" y="434" font-size="8" fill="#999">"" One Two … Nineteen</text>
  <text x="350" y="452" font-size="9" fill="#666">TENS[0..9]</text>
  <text x="350" y="464" font-size="8" fill="#999">"" "" Twenty … Ninety</text>
  <text x="350" y="482" font-size="9" fill="#666">THOUSANDS[0..3]</text>
  <text x="350" y="494" font-size="8" fill="#999">"" Thousand Million Billion</text>
</svg>
