<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口 count_and_sum(target)：以 nums=[1,2,3,4], target=4 为例</text>

  <!-- prefix sum row -->
  <text x="40" y="58" font-size="11" fill="#555" font-weight="bold">前缀和 P：</text>
  <rect x="120" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="63" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="168" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="63" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="216" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="264" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="63" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="312" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="63" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="120" y="86" font-size="9.5" fill="#aaa">P[0]</text>
  <text x="168" y="86" font-size="9.5" fill="#aaa">P[1]</text>
  <text x="216" y="86" font-size="9.5" fill="#aaa">P[2]</text>
  <text x="264" y="86" font-size="9.5" fill="#aaa">P[3]</text>
  <text x="312" y="86" font-size="9.5" fill="#aaa">P[4]</text>

  <!-- Step rows: r=1,2,3,4 -->
  <!-- r=1 -->
  <text x="40" y="120" font-size="11" fill="#555" font-weight="bold">r=1：</text>
  <text x="90" y="120" font-size="10.5" fill="#555">子数组和 P[1]−P[0]=1 ≤4 ✓</text>
  <rect x="120" y="106" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="106" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="120" font-size="10.5" fill="#4a7a3a">cnt+=1, sum+=1</text>

  <!-- r=2 -->
  <text x="40" y="158" font-size="11" fill="#555" font-weight="bold">r=2：</text>
  <text x="90" y="158" font-size="10.5" fill="#555">P[2]−P[0]=3, P[2]−P[1]=2 均 ≤4 ✓</text>
  <rect x="120" y="144" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="144" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="144" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="158" font-size="10.5" fill="#4a7a3a">cnt+=2, sum+=3+2</text>

  <!-- r=3 -->
  <text x="40" y="196" font-size="11" fill="#555" font-weight="bold">r=3：</text>
  <text x="90" y="196" font-size="10.5" fill="#555">P[3]−P[0]=6&gt;4, P[3]−P[1]=5&gt;4 → l 右移</text>
  <rect x="120" y="182" width="48" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="168" y="182" width="48" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="216" y="182" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="182" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="196" font-size="10.5" fill="#4a7a3a">l=2, cnt+=1, sum+=3</text>
  <text x="560" y="196" font-size="9.5" fill="#b85450">P[3]−P[2]=3</text>

  <!-- r=4 -->
  <text x="40" y="234" font-size="11" fill="#555" font-weight="bold">r=4：</text>
  <text x="90" y="234" font-size="10.5" fill="#555">P[4]−P[2]=7&gt;4 → l 继续右移到 3</text>
  <rect x="216" y="220" width="48" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="264" y="220" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="220" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="234" font-size="10.5" fill="#4a7a3a">l=3, cnt+=1, sum+=4</text>
  <text x="560" y="234" font-size="9.5" fill="#b85450">P[4]−P[3]=4</text>

  <!-- legend -->
  <rect x="60" y="276" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="288" font-size="10.5" fill="#555">窗口内 P[l..r−1]（子数组和 ≤ target）</text>
  <rect x="300" y="276" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="330" y="288" font-size="10.5" fill="#555">P[r]（当前右端）</text>
  <rect x="440" y="276" width="22" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="470" y="288" font-size="10.5" fill="#555">已弹出（和 &gt; target）</text>

  <!-- formula box -->
  <rect x="60" y="306" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">每步贡献 = (r−l)×P[r] − ΣP[l..r−1]</text>
  <text x="300" y="344" text-anchor="middle" font-size="10.5" fill="#666">sumP 维护窗口内前缀和之和，l 右移时减 P[l]，r 右移时加 P[r−1]</text>

  <!-- result -->
  <rect x="120" y="370" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="393" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">结果：cnt=5, sum=13 ✓（即 count(≤4)=5, sum(≤4)=13）</text>
</svg>
