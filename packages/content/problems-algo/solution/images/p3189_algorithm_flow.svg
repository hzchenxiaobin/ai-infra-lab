<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：行、列各排序一次、扫一遍</text>

  <!-- 开始 -->
  <rect x="135" y="44" width="250" height="36" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输入 rooks：n 个车的坐标</text>
  <path d="M 260 80 L 260 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 行部分 -->
  <rect x="135" y="96" width="250" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">按行坐标 x 升序排序</text>
  <path d="M 260 132 L 260 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="135" y="148" width="250" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i = 0 … n−1：moves += |x(i) − i|</text>
  <text x="392" y="171" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">← 行代价</text>
  <path d="M 260 184 L 260 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 列部分 -->
  <rect x="135" y="200" width="250" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">按列坐标 y 升序排序</text>
  <path d="M 260 236 L 260 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="135" y="252" width="250" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">i = 0 … n−1：moves += |y(i) − i|</text>
  <text x="392" y="275" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 列代价</text>
  <path d="M 260 288 L 260 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="135" y="304" width="250" height="36" rx="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 moves（行代价 + 列代价）</text>

  <!-- 左侧阶段标签 -->
  <text x="127" y="133" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 行</text>
  <text x="127" y="237" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 列</text>

  <!-- 右侧复杂度备注 -->
  <rect x="398" y="150" width="106" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="451" y="172" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">两次排序</text>
  <text x="451" y="190" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">O(n log n)</text>
  <text x="451" y="208" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">坐标 ∈ 0…n−1</text>
  <text x="451" y="226" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">可换计数排序</text>
  <text x="451" y="244" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ 总 O(n)</text>
</svg>
