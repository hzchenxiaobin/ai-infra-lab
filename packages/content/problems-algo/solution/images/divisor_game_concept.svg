<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇偶性决定胜负</text>

  <!-- ===== 上半：n 为偶数 → 必胜 ===== -->
  <text x="40" y="62" font-size="11.5" fill="#4a7a3a" font-weight="bold">情况 A：n 为偶数（Alice 必胜）</text>

  <!-- n 偶 -->
  <rect x="40" y="72" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="85" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n = 偶</text>
  <text x="85" y="108" text-anchor="middle" font-size="10.5" fill="#333">必胜态 ✓</text>

  <!-- 选 x=1 -->
  <path d="M 130 94 L 168 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="149" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选 x=1</text>
  <text x="149" y="105" text-anchor="middle" font-size="9.5" fill="#888">1 必为真因数</text>

  <!-- n-1 奇（留给对手） -->
  <rect x="168" y="72" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="223" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n − 1 = 奇</text>
  <text x="223" y="108" text-anchor="middle" font-size="10.5" fill="#333">对手必败态 ✗</text>

  <!-- 对手被迫交回偶数 -->
  <path d="M 278 94 L 316 94" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="297" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">对手任意选</text>
  <text x="297" y="105" text-anchor="middle" font-size="9.5" fill="#888">奇−奇=偶</text>

  <!-- 回到偶数 -->
  <rect x="316" y="72" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="361" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n = 偶</text>
  <text x="361" y="108" text-anchor="middle" font-size="10.5" fill="#333">又轮到我 ✓</text>

  <!-- 终点 1 -->
  <path d="M 406 94 L 440 94" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="72" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="468" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">收敛</text>
  <text x="468" y="108" text-anchor="middle" font-size="10.5" fill="#333">→ n=1</text>

  <!-- ===== 下半：n 为奇数 → 必败 ===== -->
  <text x="40" y="172" font-size="11.5" fill="#b85450" font-weight="bold">情况 B：n 为奇数（Alice 必败）</text>

  <!-- n 奇 -->
  <rect x="40" y="182" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="85" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n = 奇</text>
  <text x="85" y="218" text-anchor="middle" font-size="10.5" fill="#333">必败态 ✗</text>

  <!-- 真因数全奇 -->
  <path d="M 130 204 L 168 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="149" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">选任意 x</text>
  <text x="149" y="215" text-anchor="middle" font-size="9.5" fill="#888">x 必为奇</text>

  <!-- n-x 偶（留给对手） -->
  <rect x="168" y="182" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="223" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n − x = 偶</text>
  <text x="223" y="218" text-anchor="middle" font-size="10.5" fill="#333">对手必胜态 ✓</text>

  <!-- 对手选 x=1 交回奇数 -->
  <path d="M 278 204 L 316 204" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="297" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">对手选 x=1</text>
  <text x="297" y="215" text-anchor="middle" font-size="9.5" fill="#888">偶−1=奇</text>

  <!-- 回到奇数 -->
  <rect x="316" y="182" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="361" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n = 奇</text>
  <text x="361" y="218" text-anchor="middle" font-size="10.5" fill="#333">又轮到我 ✗</text>

  <!-- 终点 -->
  <path d="M 406 204 L 440 204" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="182" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="468" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">收敛</text>
  <text x="468" y="218" text-anchor="middle" font-size="10.5" fill="#333">→ n=1</text>

  <!-- ===== 结论条 ===== -->
  <rect x="40" y="252" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">结论：奇偶性构成「不变量」</text>
  <text x="60" y="298" font-size="11" fill="#333">• 偶数玩家总能耗到 1：每轮自减 1，把奇数甩给对手，对手只能交回偶数，反复直到 n=1 落在对手轮次。</text>
  <text x="60" y="316" font-size="11" fill="#333">• 奇数玩家无解：所有真因数均为奇，n−x 恒为偶，对手拿偶即必胜。</text>
  <text x="60" y="334" font-size="11.5" fill="#b85450" font-weight="bold">⇒ answer = (n % 2 == 0)</text>
</svg>
