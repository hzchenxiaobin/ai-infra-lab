<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对角线概念：topLeft（红）与 bottomRight（蓝）</text>

  <!-- 3x3 grid, cell size 48, start at x=170, y=56 -->
  <!-- Row 0 -->
  <rect x="170" y="56" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="85" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="218" y="56" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="85" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="266" y="56" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="85" text-anchor="middle" font-size="15" fill="#333">3</text>

  <!-- Row 1 -->
  <rect x="170" y="104" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="133" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="218" y="104" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="133" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="266" y="104" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="133" text-anchor="middle" font-size="15" fill="#333">5</text>

  <!-- Row 2 -->
  <rect x="170" y="152" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="181" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="218" y="152" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="181" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="266" y="152" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="181" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- topLeft arrow: from (0,0) to (1,1) -->
  <path d="M 184 96 L 228 108" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottomRight arrow: from (1,1) to (2,2) -->
  <path d="M 256 148 L 280 154" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Labels for highlighted cells -->
  <text x="148" y="82" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">topLeft</text>
  <text x="148" y="96" text-anchor="end" font-size="9" fill="#b85450">= {1} → 1</text>

  <text x="318" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">bottomRight</text>
  <text x="318" y="192" font-size="9" fill="#4a7a3a">= {1} → 1</text>

  <text x="242" y="100" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">当前格 (1,1)</text>

  <!-- Coordinate labels -->
  <text x="194" y="50" text-anchor="middle" font-size="9" fill="#aaa">c=0</text>
  <text x="242" y="50" text-anchor="middle" font-size="9" fill="#aaa">c=1</text>
  <text x="290" y="50" text-anchor="middle" font-size="9" fill="#aaa">c=2</text>
  <text x="164" y="84" text-anchor="end" font-size="9" fill="#aaa">r=0</text>
  <text x="164" y="132" text-anchor="end" font-size="9" fill="#aaa">r=1</text>
  <text x="164" y="180" text-anchor="end" font-size="9" fill="#aaa">r=2</text>

  <!-- Formula box -->
  <rect x="100" y="225" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">answer[1][1] = |topLeft - bottomRight|</text>
  <text x="260" y="266" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= |1 - 1| = 0  ✓</text>

  <!-- Legend -->
  <rect x="100" y="295" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="306" font-size="10" fill="#b85450">左上对角线（r-k, c-k）</text>
  <rect x="250" y="295" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="306" font-size="10" fill="#4a7a3a">右下对角线（r+k, c+k）</text>
  <rect x="380" y="295" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="306" font-size="10" fill="#d6a040">当前格子 (r,c)</text>

  <!-- Summary -->
  <rect x="40" y="325" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#333">同一对角线 r-c 恒定；topLeft/bottomRight 各统计不同值个数</text>
</svg>
