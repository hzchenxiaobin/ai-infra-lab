<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：LIS 型 DP，O(m·n²)</text>

  <!-- 开始 -->
  <rect x="110" y="48" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="180" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M180,74 L180,96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A: init -->
  <rect x="100" y="100" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[0..n−1] ← 1</text>
  <path d="M180,134 L180,156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: for j -->
  <rect x="100" y="160" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for j = 1 … n−1</text>
  <path d="M180,194 L180,216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: for i -->
  <rect x="100" y="220" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i = 0 … j−1</text>
  <path d="M180,254 L180,276" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: 相容? -->
  <polygon points="180,278 272,325 180,372 88,325" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">列 i 与列 j 相容？</text>
  <text x="180" y="340" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">∀r: |g[r][j] − g[r][i]| ≤ limit</text>

  <!-- D 否 → 回 C -->
  <path d="M272,325 L355,325 L355,242 L266,242" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="315" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- D 是 → E -->
  <path d="M180,372 L180,396" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="390" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- E: 转移 -->
  <rect x="100" y="400" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[j] ← max(dp[j], dp[i]+1)</text>

  <!-- E → 回 C（右外回环） -->
  <path d="M260,417 L440,417 L440,228 L266,228" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="438" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">转移完成 → 下一个 i</text>

  <!-- C i 用完 → 回 B -->
  <path d="M100,242 L62,242 L62,195 L94,195" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="252" font-size="9" fill="#888" filter="url(#rough2)">i 用完</text>

  <!-- B j 用完 → F -->
  <path d="M100,172 L30,172 L30,517 L94,517" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text transform="rotate(-90 40 350)" x="40" y="350" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">j 用完</text>

  <!-- F: 返回 -->
  <rect x="100" y="500" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="522" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">返回 max(dp[0..n−1])</text>

  <!-- 侧注：剪枝 -->
  <text x="460" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">剪枝：若</text>
  <text x="460" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[i]+1≤dp[j]</text>
  <text x="460" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">可跳过相容检查</text>
</svg>
