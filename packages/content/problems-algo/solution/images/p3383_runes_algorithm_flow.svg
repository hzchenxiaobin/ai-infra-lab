<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：三遍图遍历，O(n + m)</text>

  <!-- 左列：三步 -->
  <rect x="35" y="50" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="68" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">① 建邻接表 g</text>
  <text x="110" y="85" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">flowFrom → flowTo</text>

  <path d="M110,96 L110,118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="120" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="138" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">② 水晶 BFS 激活</text>
  <text x="110" y="155" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">可达点标 vis = 1</text>

  <path d="M110,166 L110,188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="190" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="208" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">③ 剩余点 DFS</text>
  <text x="110" y="225" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">记录后序 order</text>

  <!-- ③ → 菱形 -->
  <path d="M185,213 L226,215" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="203" font-size="10.5" fill="#888" filter="url(#rough2)">逆序扫描</text>

  <!-- 菱形判断 -->
  <path d="M320,163 L414,215 L320,267 L226,215 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="211" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">逆后序中还有</text>
  <text x="320" y="228" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">未覆盖点？</text>

  <!-- 菱形 → ④（是，向上） -->
  <path d="M320,163 L320,142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="245" y="95" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="113" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">④ 正向 BFS 覆盖</text>
  <text x="320" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans += 1</text>

  <!-- ④ 回到菱形 -->
  <path d="M395,118 L448,118 L448,215 L418,215" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形 → 返回（否，向下） -->
  <path d="M320,267 L320,290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="284" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="250" y="292" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">返回 ans</text>

  <!-- 底部图例 -->
  <rect x="35" y="300" width="150" height="44" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="110" y="317" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">vis 三态：</text>
  <text x="110" y="334" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0 新点 · 1 激活 · 2 待覆盖</text>
</svg>
