<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：FROM → 窗口排序 → 逐行累加 → SELECT</text>

  <!-- Step 1: FROM -->
  <rect x="60" y="50" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM Activity</text>
  <text x="150" y="88" text-anchor="middle" font-size="9.5" fill="#666">读取 5 行原始数据</text>

  <!-- Step 2: PARTITION + ORDER -->
  <rect x="320" y="50" width="200" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 窗口排序</text>
  <text x="420" y="86" text-anchor="middle" font-size="9.5" fill="#666">PARTITION BY player_id</text>
  <text x="420" y="97" text-anchor="middle" font-size="9.5" fill="#666">ORDER BY event_date</text>

  <path d="M240 75 L320 75" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: SUM OVER frame -->
  <rect x="60" y="140" width="200" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 窗口聚合 SUM</text>
  <text x="160" y="178" text-anchor="middle" font-size="9.5" fill="#666">帧：UNBOUNDED PRECEDING</text>
  <text x="160" y="190" text-anchor="middle" font-size="9.5" fill="#666">  到 CURRENT ROW</text>

  <path d="M420 100 L420 120 L160 120 L160 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT -->
  <rect x="320" y="140" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ SELECT 输出</text>
  <text x="420" y="178" text-anchor="middle" font-size="9.5" fill="#666">player_id, event_date,</text>
  <text x="420" y="190" text-anchor="middle" font-size="9.5" fill="#666">games_played_so_far</text>

  <path d="M260 170 L320 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- window sort detail box -->
  <rect x="40" y="225" width="480" height="195" fill="#fcfcf6" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口排序后的逐行视图（关键步骤 ② ③ 细节）</text>

  <!-- sorted table -->
  <text x="80" y="272" font-size="10" fill="#555" font-weight="bold">排序后（按 player_id 分区，区内按 date 升序）</text>
  <rect x="60" y="278" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="80" y="293" font-size="9" fill="#333">player_id</text>
  <text x="170" y="293" font-size="9" fill="#333">event_date</text>
  <text x="270" y="293" font-size="9" fill="#333">games</text>
  <text x="345" y="293" font-size="9" fill="#333">SUM 帧</text>
  <line x1="150" y1="278" x2="150" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="278" x2="250" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="278" x2="330" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="300" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="314" font-size="9" fill="#333">1</text>
  <text x="170" y="314" font-size="9" fill="#333">2016-03-01</text>
  <text x="270" y="314" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <text x="345" y="314" font-size="8.5" fill="#888">[5]</text>

  <rect x="60" y="320" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="334" font-size="9" fill="#333">1</text>
  <text x="170" y="334" font-size="9" fill="#333">2016-05-02</text>
  <text x="270" y="334" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <text x="345" y="334" font-size="8.5" fill="#888">[5,6]</text>

  <rect x="60" y="340" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="354" font-size="9" fill="#333">1</text>
  <text x="170" y="354" font-size="9" fill="#333">2017-06-25</text>
  <text x="270" y="354" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="345" y="354" font-size="8.5" fill="#888">[5,6,1]</text>

  <rect x="60" y="360" width="320" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="374" font-size="9" fill="#333">3</text>
  <text x="170" y="374" font-size="9" fill="#333">2016-03-02</text>
  <text x="270" y="374" font-size="9" fill="#d6a040" font-weight="bold">0</text>
  <text x="345" y="374" font-size="8.5" fill="#888">[0]</text>

  <rect x="60" y="380" width="320" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="394" font-size="9" fill="#333">3</text>
  <text x="170" y="394" font-size="9" fill="#333">2018-07-03</text>
  <text x="270" y="394" font-size="9" fill="#d6a040" font-weight="bold">5</text>
  <text x="345" y="394" font-size="8.5" fill="#888">[0,5]</text>

  <line x1="150" y1="300" x2="150" y2="400" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="300" x2="250" y2="400" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="300" x2="330" y2="400" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- so_far column -->
  <text x="430" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">累加结果</text>
  <rect x="410" y="278" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="293" text-anchor="middle" font-size="9" fill="#333">so_far</text>

  <rect x="410" y="300" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>

  <rect x="410" y="320" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="334" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">11</text>

  <rect x="410" y="340" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">12</text>

  <rect x="410" y="360" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="374" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>

  <rect x="410" y="380" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="394" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>

  <path d="M385 310 L410 310" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
