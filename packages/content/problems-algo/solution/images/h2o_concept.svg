<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">屏障同步：2H + 1O 三三成组 → H₂O</text>

  <text x="80" y="65" text-anchor="middle" font-size="11" fill="#888">线程到达</text>
  <text x="260" y="65" text-anchor="middle" font-size="11" fill="#888">屏障 Barrier</text>
  <text x="430" y="65" text-anchor="middle" font-size="11" fill="#888">分子输出</text>

  <rect x="40" y="80" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">H 线程</text>

  <rect x="40" y="120" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">H 线程</text>

  <rect x="40" y="160" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">O 线程</text>

  <path d="M 200 50 L 200 290" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="8,5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="42" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">屏障</text>

  <path d="M 120 94 L 185 94" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 120 134 L 185 134" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 120 174 L 185 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="150" y="88" text-anchor="middle" font-size="9" fill="#888">等待</text>
  <text x="150" y="128" text-anchor="middle" font-size="9" fill="#888">等待</text>
  <text x="150" y="168" text-anchor="middle" font-size="9" fill="#888">等待</text>

  <rect x="310" y="80" width="240" height="120" fill="#e6f4ea" fill-opacity="0.3" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 N 个水分子</text>

  <circle cx="370" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="145" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">H</text>

  <circle cx="430" cy="140" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="146" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">O</text>

  <circle cx="490" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="145" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">H</text>

  <line x1="388" y1="140" x2="408" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="452" y1="140" x2="472" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 215 94 Q 280 120 360 138" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 215 134 Q 280 130 360 140" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 215 174 Q 280 155 430 138" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 200 220 Q 260 218 320 220" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="240" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="259" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">H 线程</text>

  <rect x="40" y="280" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="299" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">H 线程</text>

  <rect x="40" y="320" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="339" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">O 线程</text>

  <path d="M 120 254 L 185 254" stroke="#ccc" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 120 294 L 185 294" stroke="#ccc" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 120 334 L 185 334" stroke="#ccc" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#ccc">阻塞</text>

  <rect x="310" y="240" width="240" height="120" fill="#fff8e1" fill-opacity="0.3" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">第 N+1 个水分子（等待）</text>

  <circle cx="370" cy="300" r="15" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="370" y="305" text-anchor="middle" font-size="12" fill="#ccc">H?</text>

  <circle cx="430" cy="300" r="15" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="305" text-anchor="middle" font-size="12" fill="#ccc">O?</text>

  <circle cx="490" cy="300" r="15" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="490" y="305" text-anchor="middle" font-size="12" fill="#ccc">H?</text>

  <rect x="60" y="370" width="400" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#444">约束：第 N 个分子完成（3 线程均释放）后，第 N+1 个才能开始</text>
</svg>
