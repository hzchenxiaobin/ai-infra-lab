<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：连续段内子串数 = 三角形数 L(L+1)/2</text>

  <!-- 输入串 aaaba -->
  <text x="40" y="72" font-size="11" fill="#888">输入 s：</text>
  <rect x="180" y="52" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="220" y="52" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="52" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="300" y="52" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="340" y="52" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- 连续段括号 -->
  <path d="M 180 90 Q 180 98 186 98 L 294 98 Q 300 98 300 90" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:3</text>
  <path d="M 300 90 Q 300 98 306 98 L 334 98 Q 340 98 340 90" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b:1</text>
  <path d="M 340 90 Q 340 98 346 98 L 374 98 Q 380 98 380 90" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="360" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:1</text>

  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">取 a:3 段剖析 → 段内所有子串按长度分层</text>

  <!-- 三角形：段内子串按长度分层 -->
  <!-- 长度 3：1 个 -->
  <rect x="212" y="150" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aaa</text>
  <text x="330" y="169" font-size="10.5" fill="#888">→ 1 个</text>

  <!-- 长度 2：2 个 -->
  <rect x="197" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aa</text>
  <rect x="243" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aa</text>
  <text x="330" y="203" font-size="10.5" fill="#888">→ 2 个</text>

  <!-- 长度 1：3 个 -->
  <rect x="192" y="218" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="226" y="218" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="218" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="330" y="237" font-size="10.5" fill="#888">→ 3 个</text>

  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">合计 = 1 + 2 + 3 = 6</text>

  <!-- 公式框 -->
  <rect x="40" y="284" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">长度为 L 的连续段 → 贡献 1 + 2 + … + L = L(L+1)/2 个子串</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#888">例：L=3 → 6；L=1 → 1；L=10 → 55</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">跨段必含两种字符 → 不合法，各段独立计数后求和</text>
</svg>
