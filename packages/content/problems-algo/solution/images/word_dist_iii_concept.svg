<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：word1 == word2 时，两游标合并为一个 prev</text>

  <!-- shared array -->
  <text x="24" y="62" font-size="12" fill="#888">words：</text>
  <rect x="60" y="46" width="92" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="106" y="67" text-anchor="middle" font-size="11.5" fill="#aaa">practice</text>
  <rect x="156" y="46" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="67" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <rect x="252" y="46" width="92" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="67" text-anchor="middle" font-size="11.5" fill="#aaa">perfect</text>
  <rect x="348" y="46" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="67" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">coding</text>
  <rect x="444" y="46" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="67" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <text x="106" y="96" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="202" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="298" y="96" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="394" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="490" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>

  <!-- Case 1: different words -->
  <rect x="40" y="112" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="155" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情形 A：word1 ≠ word2（= 243）</text>
  <text x="60" y="156" font-size="11" fill="#555">word1=makes, word2=coding → 两游标 p1, p2</text>
  <path d="M 202 170 L 202 180 L 394 180 L 394 170" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="298" y="196" text-anchor="middle" font-size="11" fill="#888">|1 − 3| = 2</text>
  <path d="M 394 210 L 394 220 L 490 220 L 490 210" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrR)" marker-start="url(#arrR)"/>
  <text x="442" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">|4 − 3| = 1 ✓</text>

  <!-- Case 2: same word -->
  <rect x="290" y="112" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="405" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情形 B：word1 == word2（新约束）</text>
  <text x="310" y="156" font-size="11" fill="#555">word1=makes, word2=makes → 单游标 prev</text>
  <path d="M 202 170 L 202 220 L 490 220 L 490 170" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrR)" marker-start="url(#arrR)"/>
  <text x="346" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">|4 − 1| = 3 ✓ 相邻两次出现</text>
  <text x="346" y="262" text-anchor="middle" font-size="10.5" fill="#888">（不能取 |1−1|=0，必须不同位置）</text>

  <!-- divider -->
  <line x1="280" y1="112" x2="280" y2="280" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- key idea box -->
  <rect x="40" y="292" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">同词时：命中目标词先算 i − prev 再更新 prev</text>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#555">「先比距后挪指针」保证两位置不同 → 避开 i − i = 0 的陷阱</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">异词时：退化为 243 的 if / else if 两游标模板</text>

  <!-- footer -->
  <rect x="40" y="378" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">统一单遍 O(n) 扫描 + O(1) 空间，same 标志分支</text>
</svg>
