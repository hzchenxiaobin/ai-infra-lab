<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fdfcf7"/>

  <text x="380" y="24" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">示例演算：[5,2,13,3,8]</text>
  <path d="M 250 32 Q 380 40 510 32" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#888">① 反转 → [8,3,13,2,5]　② 扫描删小（maxSoFar 初值 0）：</text>

  <!-- ===== 表格 ===== -->
  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="20" y="60" width="720" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="45" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">步骤</text>
  <text x="100" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">curr</text>
  <text x="165" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">maxSoFar</text>
  <text x="275" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">判断 curr.val≥max?</text>
  <text x="455" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">动作</text>
  <text x="640" y="76" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">链表（反转视角）</text>

  <!-- 列分隔线 -->
  <g filter="url(#sk)">
    <path d="M 70 60 L 70 232" stroke="#446688" stroke-width="1"/>
    <path d="M 130 60 L 130 232" stroke="#446688" stroke-width="1"/>
    <path d="M 200 60 L 200 232" stroke="#446688" stroke-width="1"/>
    <path d="M 350 60 L 350 232" stroke="#446688" stroke-width="1"/>
    <path d="M 560 60 L 560 232" stroke="#446688" stroke-width="1"/>
    <path d="M 20 232 L 740 232" stroke="#446688" stroke-width="1.3"/>
  </g>

  <!-- 行数据 -->
  <g filter="url(#sk)">
    <rect x="20" y="84" width="720" height="22" fill="#ffffff"/>
    <rect x="20" y="106" width="720" height="22" fill="#fafafa"/>
    <rect x="20" y="128" width="720" height="22" fill="#ffffff"/>
    <rect x="20" y="150" width="720" height="22" fill="#fafafa"/>
    <rect x="20" y="172" width="720" height="22" fill="#ffffff"/>
    <rect x="20" y="194" width="720" height="22" fill="#e6f4ea" fill-opacity="0.5"/>
  </g>

  <!-- 步骤1 -->
  <text x="45" y="99" text-anchor="middle" font-size="11" fill="#2b2b2b">1</text>
  <text x="100" y="99" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">8</text>
  <text x="165" y="99" text-anchor="middle" font-size="11" fill="#2b2b2b">0</text>
  <text x="275" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8 ≥ 0 ✔</text>
  <text x="455" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a">保留，max=8</text>
  <text x="640" y="99" text-anchor="middle" font-size="11" fill="#2b2b2b">8→3→13→2→5</text>

  <!-- 步骤2 -->
  <text x="45" y="121" text-anchor="middle" font-size="11" fill="#2b2b2b">2</text>
  <text x="100" y="121" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">3</text>
  <text x="165" y="121" text-anchor="middle" font-size="11" fill="#2b2b2b">8</text>
  <text x="275" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 &lt; 8 ✘</text>
  <text x="455" y="121" text-anchor="middle" font-size="11" fill="#b85450">删除 3</text>
  <text x="640" y="121" text-anchor="middle" font-size="11" fill="#2b2b2b">8→13→2→5</text>

  <!-- 步骤3 -->
  <text x="45" y="143" text-anchor="middle" font-size="11" fill="#2b2b2b">3</text>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">13</text>
  <text x="165" y="143" text-anchor="middle" font-size="11" fill="#2b2b2b">8</text>
  <text x="275" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">13 ≥ 8 ✔</text>
  <text x="455" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a">保留，max=13</text>
  <text x="640" y="143" text-anchor="middle" font-size="11" fill="#2b2b2b">8→13→2→5</text>

  <!-- 步骤4 -->
  <text x="45" y="165" text-anchor="middle" font-size="11" fill="#2b2b2b">4</text>
  <text x="100" y="165" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="165" y="165" text-anchor="middle" font-size="11" fill="#2b2b2b">13</text>
  <text x="275" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 &lt; 13 ✘</text>
  <text x="455" y="165" text-anchor="middle" font-size="11" fill="#b85450">删除 2</text>
  <text x="640" y="165" text-anchor="middle" font-size="11" fill="#2b2b2b">8→13→5</text>

  <!-- 步骤5 -->
  <text x="45" y="187" text-anchor="middle" font-size="11" fill="#2b2b2b">5</text>
  <text x="100" y="187" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">5</text>
  <text x="165" y="187" text-anchor="middle" font-size="11" fill="#2b2b2b">13</text>
  <text x="275" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 &lt; 13 ✘</text>
  <text x="455" y="187" text-anchor="middle" font-size="11" fill="#b85450">删除 5</text>
  <text x="640" y="187" text-anchor="middle" font-size="11" fill="#2b2b2b">8→13</text>

  <!-- 结束行 -->
  <text x="45" y="209" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">结束</text>
  <text x="100" y="209" text-anchor="middle" font-size="11" fill="#888">∅</text>
  <text x="165" y="209" text-anchor="middle" font-size="11" fill="#2b2b2b">13</text>
  <text x="275" y="209" text-anchor="middle" font-size="11" fill="#888">prev.next=∅</text>
  <text x="455" y="209" text-anchor="middle" font-size="11" fill="#888">退出循环</text>
  <text x="640" y="209" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">8→13</text>

  <!-- 底部 ③ 反转回 -->
  <path d="M 380 240 L 380 262" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="392" y="256" font-size="11" fill="#4a4a4a" font-weight="bold">③ 反转回</text>

  <g filter="url(#sk)">
    <rect x="300" y="262" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="356" y="262" width="46" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="323" y="282" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">13</text>
  <text x="379" y="282" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">8</text>
  <path d="M 346 277 L 354 277" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">= 答案 [13,8]</text>

  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#888">两段反转只是换视角，不变式「保留节点 ≥ 其右侧最大值」全程成立</text>
</svg>
