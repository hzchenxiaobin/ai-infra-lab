<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：等值游程扫描 + 取模判定</text>

  <ellipse cx="260" cy="62" rx="55" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 84 L 260 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="108" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#444">i = 0, hasTwo = false</text>

  <path d="M 260 142 L 260 162" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 200 180 L 320 180 L 320 212 L 200 212 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="209" text-anchor="middle" font-size="11" fill="#666">(还有字符未扫)</text>

  <path d="M 200 196 L 110 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <path d="M 260 212 L 260 232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="120" y="236" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="11.5" fill="#333">j 从 i 走到字符不同处，len = j − i</text>

  <path d="M 260 270 L 260 290" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 190 308 L 330 308 L 330 340 L 190 340 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">len % 3 == ?</text>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#666">(分三路判定)</text>

  <path d="M 190 324 L 60 324" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">== 1</text>

  <path d="M 260 340 L 260 360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="354" font-size="10.5" fill="#d6a040" font-weight="bold">== 2</text>

  <path d="M 330 324 L 460 324" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">== 0</text>

  <rect x="20" y="316" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="40" y="337" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <rect x="460" y="316" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="337" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">跳过</text>

  <path d="M 480 350 L 480 388" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 480 388 L 260 388" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 360 L 260 380" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 190 396 L 330 396 L 330 428 L 190 428 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">hasTwo 已为真?</text>
  <text x="260" y="425" text-anchor="middle" font-size="11" fill="#666">(已有长度 2)</text>

  <path d="M 330 412 L 460 412" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="404" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <rect x="430" y="396" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="417" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <path d="M 260 428 L 260 448" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="442" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="160" y="452" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="471" text-anchor="middle" font-size="11.5" fill="#333">hasTwo = true；i = j，回到循环</text>

  <path d="M 160 467 L 70 467 L 70 196 L 110 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环结束</text>
  <text x="80" y="213" text-anchor="middle" font-size="11" fill="#666">返回 hasTwo</text>

  <text x="80" y="232" text-anchor="middle" font-size="10" fill="#888">(无长度 2 → false)</text>
</svg>
