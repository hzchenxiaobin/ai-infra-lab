<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：共享三元 → 同异判定</text>

  <line x1="235" y1="48" x2="235" y2="360" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="120" y="60" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">返回值 = f(1 的个数)</text>

  <rect x="55" y="72" width="65" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1的个数</text>
  <rect x="120" y="72" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回值</text>

  <rect x="55" y="98" width="65" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="98" width="55" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <rect x="55" y="122" width="65" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="122" width="55" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="55" y="146" width="65" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="146" width="55" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="55" y="170" width="65" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="170" width="55" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="55" y="194" width="65" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="120" y="194" width="55" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 105 110 L 105 134 M 102 130 L 105 134 L 108 130" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="112" y="125" font-size="9" fill="#b85450" filter="url(#rough2)">≠</text>
  <path d="M 105 134 L 105 158 M 102 154 L 105 158 L 108 154" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="112" y="149" font-size="9" fill="#b85450" filter="url(#rough2)">≠</text>
  <path d="M 105 158 L 105 182 M 102 178 L 105 182 L 108 178" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="112" y="173" font-size="9" fill="#b85450" filter="url(#rough2)">≠</text>
  <path d="M 105 182 L 105 206 M 102 202 L 105 206 L 108 202" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="112" y="197" font-size="9" fill="#b85450" filter="url(#rough2)">≠</text>

  <rect x="40" y="235" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">关键性质：</text>
  <text x="115" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">f(k) ≠ f(k+1)</text>

  <rect x="40" y="300" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相邻 1 的个数</text>
  <text x="115" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 返回值必不同</text>

  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">两个 query 共享 3 个下标</text>

  <text x="282" y="96" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">query(0,1,2,3)</text>
  <rect x="290" y="80" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="330" y="80" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="370" y="80" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="410" y="80" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="429" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="349" y="128" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">← 共享三元 →</text>
  <text x="429" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">基准</text>

  <text x="282" y="166" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">query(0,1,2,i)</text>
  <rect x="290" y="150" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="330" y="150" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="370" y="150" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="410" y="150" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="429" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i</text>

  <rect x="265" y="200" width="210" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回值相同 ⟹ nums[3] = nums[i]</text>
  <text x="370" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回值不同 ⟹ nums[3] ≠ nums[i]</text>
  <text x="370" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（因 f(k) ≠ f(k+1)，差 1 个 1 必改变返回值）</text>

  <rect x="265" y="285" width="210" height="65" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">用 {0,1,2} 作共享三元</text>
  <text x="370" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐个比较 i=4..n-1 与基准 3</text>
  <text x="370" y="339" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">→ 统计相同个数 a、不同个数 b</text>
</svg>
