<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：source = "abcd" → target = "acbe"</text>

  <!-- header row -->
  <rect x="40" y="46" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="67" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="127" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">source</text>
  <text x="192" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="315" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">最短路走法</text>
  <text x="442" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">成本</text>

  <!-- row 0 -->
  <rect x="40" y="80" width="440" height="36" fill="#ffffff" stroke="#aab" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="103" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">0</text>
  <text x="127" y="103" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">a</text>
  <text x="192" y="103" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">a</text>
  <text x="315" y="103" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不用换：dist[a][a] = 0</text>
  <text x="442" y="103" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <rect x="40" y="116" width="440" height="36" fill="#f6f8fb" stroke="#aab" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="139" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>
  <text x="127" y="139" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">b</text>
  <text x="192" y="139" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">c</text>
  <text x="315" y="139" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">b→c</text>
  <text x="442" y="139" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">5</text>

  <!-- row 2 (highlight) -->
  <rect x="40" y="152" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="175" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="127" y="175" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="192" y="175" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="315" y="175" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c→e→b（绕道！直连要 5）</text>
  <text x="442" y="175" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 3 -->
  <rect x="40" y="188" width="440" height="36" fill="#f6f8fb" stroke="#aab" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="211" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">3</text>
  <text x="127" y="211" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">d</text>
  <text x="192" y="211" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">e</text>
  <text x="315" y="211" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">d→e（唯一路径）</text>
  <text x="442" y="211" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">20</text>

  <!-- total -->
  <rect x="120" y="234" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 0 + 5 + 3 + 20 = 28</text>

  <!-- bottom note -->
  <rect x="40" y="288" width="440" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">下标 2 是关键：直连 c→b 花 5，绕道 e 只花 3 —— 这就是必须求最短路的原因；</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对照示例 3：d→e 无任何路径（规则只有 a→e）→ 一旦查到 ∞ 即返回 −1。</text>
</svg>
