<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建集合 → 定边界 → 升序枚举收集</text>

  <rect x="215" y="28" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 52 L 260 64" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="66" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① S = set(nums)（一趟建集合，判定 O(1)）</text>

  <path d="M 260 92 L 260 104" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="106" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② lo = min(nums)，hi = max(nums)（题设两端必在）</text>

  <path d="M 260 132 L 260 144" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 260 144 L 352 180 L 260 216 L 168 180 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ x ∈ S ?</text>
  <text x="260" y="192" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">当前枚举值存在？</text>

  <!-- 否：收集 -->
  <path d="M 260 216 L 260 244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">否（缺失）</text>

  <rect x="150" y="246" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ res.push_back(x)（收入答案）</text>

  <!-- 是：跳过 -->
  <path d="M 352 180 L 392 180" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="394" y="166" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="449" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过（存在）</text>

  <!-- 跳过分支汇入 ⑤ -->
  <path d="M 449 194 L 449 303 L 415 303" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="458" y="214" font-size="10" fill="#999" filter="url(#rough2)">下一轮</text>

  <!-- ④ 汇入 ⑤ -->
  <path d="M 260 274 L 260 289" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="290" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ x += 1，回 ③（x &gt; hi 时出循环）</text>

  <!-- 循环回边 -->
  <path d="M 110 303 L 60 303 L 60 180 L 162 180" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="108" y="174" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">回 ③</text>

  <!-- 出循环 -->
  <path d="M 260 316 L 260 326" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="328" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ return res（升序）</text>

  <text x="16" y="356" font-size="10" fill="#999" filter="url(#rough2)">💡 升序枚举 ⇒ 收集顺序天然有序，无需 sort；无缺失时 res 为空 []，直接返回</text>
</svg>
