<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每商品取最大日期订单，并列全保留</text>

  <!-- axis hint -->
  <text x="160" y="52" font-size="10" fill="#888">旧 ←</text>
  <text x="515" y="52" text-anchor="end" font-size="10" fill="#888">→ 新</text>

  <!-- ===== keyboard row (4 orders, #6 #7 tie on max date 08-01) ===== -->
  <rect x="20" y="72" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">keyboard</text>
  <text x="70" y="105" text-anchor="middle" font-size="9" fill="#666">4 笔 → 留 2</text>
  <line x1="140" y1="92" x2="520" y2="92" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <circle cx="190" cy="92" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#4</text>
  <text x="190" y="120" text-anchor="middle" font-size="8" fill="#999">07-29</text>

  <circle cx="270" cy="92" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#1</text>
  <text x="270" y="120" text-anchor="middle" font-size="8" fill="#999">07-31</text>

  <circle cx="380" cy="92" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">#6</text>
  <text x="380" y="120" text-anchor="middle" font-size="8" fill="#4a7a3a">08-01 ✓</text>

  <circle cx="460" cy="92" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">#7</text>
  <text x="460" y="120" text-anchor="middle" font-size="8" fill="#4a7a3a">08-01 ✓</text>

  <!-- ===== mouse row (4 orders, #8 max) ===== -->
  <rect x="20" y="142" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mouse</text>
  <text x="70" y="175" text-anchor="middle" font-size="9" fill="#666">4 笔 → 留 1</text>
  <line x1="140" y1="162" x2="520" y2="162" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <circle cx="175" cy="162" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="166" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#5</text>
  <text x="175" y="190" text-anchor="middle" font-size="8" fill="#999">06-10</text>

  <circle cx="255" cy="162" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="166" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#10</text>
  <text x="255" y="190" text-anchor="middle" font-size="8" fill="#999">07-15</text>

  <circle cx="340" cy="162" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="166" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#2</text>
  <text x="340" y="190" text-anchor="middle" font-size="8" fill="#999">07-30</text>

  <circle cx="450" cy="162" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">#8</text>
  <text x="450" y="190" text-anchor="middle" font-size="8" fill="#4a7a3a">08-03 ✓</text>

  <!-- ===== screen row (2 orders, #3 max) ===== -->
  <rect x="20" y="212" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="231" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">screen</text>
  <text x="70" y="245" text-anchor="middle" font-size="9" fill="#666">2 笔 → 留 1</text>
  <line x1="140" y1="232" x2="520" y2="232" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <circle cx="280" cy="232" r="13" fill="#eee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">#9</text>
  <text x="280" y="260" text-anchor="middle" font-size="8" fill="#999">08-07</text>

  <circle cx="460" cy="232" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">#3</text>
  <text x="460" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a">08-29 ✓</text>

  <!-- ===== hard disk row (no orders) ===== -->
  <rect x="20" y="282" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="301" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hard disk</text>
  <text x="70" y="315" text-anchor="middle" font-size="9" fill="#666">0 笔</text>
  <line x1="140" y1="302" x2="520" y2="302" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="320" y="307" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无订单 → 不出现在结果中</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="340" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最大日期订单保留（绿） / 其余丢弃（灰）</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#666">同一最大日期有多笔 → 全部保留（键盘 #6 #7）；无订单商品 → 排除</text>
</svg>
