<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：梯形 = 同斜率「跨直线」的底边配对；平行四边形数 2 次再减 1</text>

  <!-- ================= left panel ================= -->
  <text x="15" y="56" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 同一斜率的桶：再按所在直线分</text>
  <text x="15" y="69" font-size="8.5" fill="#666" filter="url(#rough2)">平行直线不相交 ⇒ 跨直线配对必不共端点</text>

  <!-- green trapezoid: one cross-line base pair -->
  <polygon points="82,153 122,133 141,102 85,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>

  <!-- bucket lines -->
  <line x1="32" y1="178" x2="172" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="85" y1="130" x2="225" y2="60" stroke="#999" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <text x="20" y="184" font-size="9" fill="#666" filter="url(#rough2)">L₁</text>
  <text x="74" y="140" font-size="9" fill="#666" filter="url(#rough2)">L₂</text>

  <!-- segments on L1 (3) -->
  <g filter="url(#rough2)">
    <line x1="32" y1="178" x2="71" y2="158" stroke="#446688" stroke-width="3"/>
    <line x1="82" y1="153" x2="122" y2="133" stroke="#446688" stroke-width="3"/>
    <line x1="133" y1="128" x2="172" y2="108" stroke="#446688" stroke-width="3"/>
    <circle cx="32" cy="178" r="2.6" fill="#33506b"/><circle cx="71" cy="158" r="2.6" fill="#33506b"/>
    <circle cx="82" cy="153" r="2.6" fill="#33506b"/><circle cx="122" cy="133" r="2.6" fill="#33506b"/>
    <circle cx="133" cy="128" r="2.6" fill="#33506b"/><circle cx="172" cy="108" r="2.6" fill="#33506b"/>
    <!-- segments on L2 (2) -->
    <line x1="85" y1="130" x2="141" y2="102" stroke="#446688" stroke-width="3"/>
    <line x1="155" y1="95" x2="225" y2="60" stroke="#446688" stroke-width="3"/>
    <circle cx="85" cy="130" r="2.6" fill="#33506b"/><circle cx="141" cy="102" r="2.6" fill="#33506b"/>
    <circle cx="155" cy="95" r="2.6" fill="#33506b"/><circle cx="225" cy="60" r="2.6" fill="#33506b"/>
  </g>
  <text x="170" y="100" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">k₁=3</text>
  <text x="228" y="55" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">k₂=2</text>
  <text x="96" y="146" font-size="8" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 跨线的 1 对底边</text>

  <text x="130" y="196" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">斜率 (−1,2) 的直线同属一个桶</text>
  <text x="130" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">跨直线配对 k₁×k₂ = 6 个底边对</text>

  <!-- collinear exclusion -->
  <g filter="url(#rough2)">
    <line x1="35" y1="232" x2="185" y2="212" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="35" y1="232" x2="80" y2="226" stroke="#b85450" stroke-width="3"/>
    <line x1="133" y1="220" x2="185" y2="212" stroke="#b85450" stroke-width="3"/>
    <circle cx="35" cy="232" r="2.6" fill="#b85450"/><circle cx="80" cy="226" r="2.6" fill="#b85450"/>
    <circle cx="133" cy="220" r="2.6" fill="#b85450"/><circle cx="185" cy="212" r="2.6" fill="#b85450"/>
    <text x="108" y="247" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  </g>
  <text x="130" y="262" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">同一直线上的配对：四点共线，退化不算</text>

  <!-- ================= right panel ================= -->
  <text x="275" y="56" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 平行四边形：两组对边 ⇒ 被数 2 次</text>
  <text x="275" y="69" font-size="8.5" fill="#666" filter="url(#rough2)">减 1 的凭据：对角线互相平分（共中点）</text>

  <!-- top parallelogram -->
  <g filter="url(#rough2)">
    <line x1="300" y1="120" x2="390" y2="95" stroke="#446688" stroke-width="3.2"/>
    <line x1="430" y1="155" x2="340" y2="180" stroke="#446688" stroke-width="3.2"/>
    <line x1="390" y1="95" x2="430" y2="155" stroke="#d6a040" stroke-width="3.2"/>
    <line x1="340" y1="180" x2="300" y2="120" stroke="#d6a040" stroke-width="3.2"/>
    <circle cx="300" cy="120" r="2.6" fill="#333"/><circle cx="390" cy="95" r="2.6" fill="#333"/>
    <circle cx="430" cy="155" r="2.6" fill="#333"/><circle cx="340" cy="180" r="2.6" fill="#333"/>
    <text x="290" y="116" font-size="10" fill="#333" font-weight="bold">A</text>
    <text x="394" y="90" font-size="10" fill="#333" font-weight="bold">B</text>
    <text x="435" y="160" font-size="10" fill="#333" font-weight="bold">C</text>
    <text x="330" y="194" font-size="10" fill="#333" font-weight="bold">D</text>
  </g>
  <text x="392" y="203" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">AB∥CD 一对 + BC∥DA 一对 ⇒ part₁ 计 2</text>

  <!-- bottom parallelogram with diagonals -->
  <g filter="url(#rough2)">
    <polygon points="305,218 373,203 409,245 341,260" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="305" y1="218" x2="409" y2="245" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line x1="373" y1="203" x2="341" y2="260" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
    <circle cx="357" cy="232" r="3" fill="#b85450"/>
    <text x="362" y="230" font-size="9.5" fill="#b85450" font-weight="bold">M</text>
  </g>
  <text x="392" y="277" text-anchor="middle" font-size="8.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">对角线共中点 M（且斜率不同）⇒ part₂ 减 1，净贡献 1</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="30" y="290" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">part₁ = Σ斜率 (K² − Σℓ kℓ²)/2 —— 同斜率、跨直线两两配对（共端点 / 共线自动排除）</text>
    <text x="260" y="332" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">答案 = part₁ − Σ中点 [C(m,2) − Σₛ C(mₛ,2)] —— 共中点且异斜率 = 平行四边形，恰减一次</text>
  </g>
</svg>
