<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历数段开始</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: count = 0,  i = 0</text>

  <!-- Arrow down -->
  <path d="M 270 82 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i < n? -->
  <polygon points="270,102 380,148 270,194 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- No branch: left to return -->
  <path d="M 160 148 L 100 148 L 100 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Yes branch: down to decision 2 -->
  <path d="M 270 194 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: seg start? -->
  <polygon points="270,218 410,278 270,338 130,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#333">s[i] != ' '</text>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#333">且</text>
  <text x="270" y="302" text-anchor="middle" font-size="11" fill="#333">(i==0 或 s[i−1]==' ') ?</text>

  <!-- Yes branch: count++ -->
  <path d="M 410 278 L 460 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="270" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="460" y="256" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="274" text-anchor="middle" font-size="10" fill="#333">新段开始</text>
  <text x="492" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count++</text>

  <!-- No branch: down to i++ -->
  <path d="M 270 338 L 270 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="356" font-size="11" fill="#b85450">否</text>

  <!-- count++ path joins i++ (from right side down to i++ box) -->
  <path d="M 492 300 L 492 380 L 322 380" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="218" y="362" width="104" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>

  <!-- Loop back from i++ to decision 1 (up) -->
  <path d="M 218 380 L 60 380 L 60 148 L 158 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="264" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 264)">回到循环判定</text>

  <!-- End node -->
  <ellipse cx="100" cy="406" rx="80" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="410" text-anchor="middle" font-size="12" fill="#333">返回 count</text>

  <!-- Summary note -->
  <text x="270" y="442" text-anchor="middle" font-size="10" fill="#888">关键：只在「空格→非空格」跳变处计数；连续空格不重复计，O(n)/O(1)</text>
</svg>
