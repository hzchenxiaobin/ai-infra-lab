<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：daniel 触发警告，luis 正常</text>

  <!-- ===== daniel block ===== -->
  <rect x="20" y="44" width="520" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="68" font-size="12" fill="#446688" font-weight="bold">daniel</text>

  <!-- times as strings -->
  <text x="40" y="92" font-size="11" fill="#333">时间串：</text>
  <rect x="100" y="80" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="128" y="95" text-anchor="middle" font-size="11" fill="#333">10:00</text>
  <rect x="162" y="80" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="95" text-anchor="middle" font-size="11" fill="#333">10:40</text>
  <rect x="224" y="80" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="252" y="95" text-anchor="middle" font-size="11" fill="#333">11:00</text>

  <!-- arrow down -->
  <path d="M 252 104 L 252 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="114" font-size="10" fill="#888">转分钟</text>

  <!-- minutes -->
  <text x="40" y="138" font-size="11" fill="#333">分钟：</text>
  <rect x="100" y="126" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="141" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">600</text>
  <rect x="162" y="126" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="141" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">640</text>
  <rect x="224" y="126" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="141" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">660</text>

  <!-- window bracket -->
  <path d="M 100 156 L 100 162 L 280 162 L 280 156" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口 [i, i+2]：660 − 600 = 60 ≤ 60</text>

  <rect x="320" y="124" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 触发警告</text>
  <text x="410" y="162" text-anchor="middle" font-size="10" fill="#666">命中即加入名单</text>

  <!-- ===== luis block ===== -->
  <rect x="20" y="200" width="520" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="224" font-size="12" fill="#4a7a3a" font-weight="bold">luis</text>

  <text x="40" y="248" font-size="11" fill="#333">分钟：</text>
  <rect x="100" y="236" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="128" y="251" text-anchor="middle" font-size="11" fill="#333">540</text>
  <rect x="162" y="236" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="251" text-anchor="middle" font-size="11" fill="#333">660</text>
  <rect x="224" y="236" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="252" y="251" text-anchor="middle" font-size="11" fill="#333">780</text>
  <rect x="286" y="236" width="56" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="314" y="251" text-anchor="middle" font-size="11" fill="#333">900</text>

  <!-- window 1 -->
  <path d="M 100 266 L 100 272 L 280 272 L 280 266" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="190" y="286" text-anchor="middle" font-size="10" fill="#666">窗口1：780 − 540 = 240 &gt; 60</text>

  <!-- window 2 -->
  <path d="M 162 292 L 162 298 L 342 298 L 342 292" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="252" y="312" text-anchor="middle" font-size="10" fill="#666">窗口2：900 − 660 = 240 &gt; 60</text>

  <rect x="370" y="266" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 正常</text>
  <text x="445" y="302" text-anchor="middle" font-size="10" fill="#666">所有窗口均 &gt; 60</text>

  <text x="40" y="336" font-size="10" fill="#888">注：只需检查相邻 3 个；非相邻三元组不会比相邻更紧（中间值夹在两端之间）</text>
  <text x="40" y="354" font-size="10" fill="#888">边界："10:00"–"11:00" 差 60 分钟算一小时内（≤ 60）；"23:52"–"22:51" 差 61 不算</text>

  <!-- ===== result ===== -->
  <rect x="20" y="384" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="12" fill="#333">最终名单 = ["daniel"]（已去重 + 字典序升序）</text>
</svg>
