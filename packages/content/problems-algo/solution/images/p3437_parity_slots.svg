<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：相邻奇偶交替 ⇒ 排列被「奇偶槽位」锁定</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">奇数只能落「奇槽」，偶数只能落「偶槽」，两轨独立排列</text>

  <!-- n = 4：两种槽位模式 -->
  <text x="36" y="72" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">n = 4（2 奇 + 2 偶）→ 两种模式</text>
  <g filter="url(#rough2)">
    <rect x="36" y="82" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="58" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">1</text>
    <rect x="82" y="82" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="104" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">2</text>
    <rect x="128" y="82" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">3</text>
    <rect x="174" y="82" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="196" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">4</text>
    <text x="228" y="105" font-size="10.5" fill="#55677d">奇开头 OEOE</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="126" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="58" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">2</text>
    <rect x="82" y="126" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="104" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">1</text>
    <rect x="128" y="126" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="150" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">4</text>
    <rect x="174" y="126" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="196" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">3</text>
    <text x="228" y="149" font-size="10.5" fill="#55677d">偶开头 EOEO</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="88" width="168" height="66" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="414" y="110" text-anchor="middle" font-size="10" fill="#55677d">每模式 = 奇数排法 × 偶数排法</text>
    <text x="414" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2! × 2! = 4</text>
    <text x="414" y="146" text-anchor="middle" font-size="10" fill="#55677d">两模式 ⇒ 共 2 × 4 = 8 个</text>
  </g>

  <!-- n = 5：唯一槽位模式 -->
  <text x="36" y="192" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">n = 5（3 奇 + 2 偶）→ 奇数恰多一个，必须占两端</text>
  <g filter="url(#rough2)">
    <rect x="36" y="202" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="58" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">1</text>
    <rect x="82" y="202" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="104" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">2</text>
    <rect x="128" y="202" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="150" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">3</text>
    <rect x="174" y="202" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="196" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">4</text>
    <rect x="220" y="202" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="242" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">5</text>
    <text x="276" y="225" font-size="10.5" fill="#55677d">唯一模式 OEOEO</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="204" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="414" y="222" text-anchor="middle" font-size="10" fill="#2f5d24">偶开头会「差一个奇数」：</text>
    <text x="414" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">3! × 2! = 12 个</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="36" y="262" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="76" y="277" font-size="10.5" fill="#55677d">奇数槽（⌈n/2⌉ 个）</text>
    <rect x="200" y="262" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="240" y="277" font-size="10.5" fill="#55677d">偶数槽（⌊n/2⌋ 个）</text>
  </g>

  <!-- 底部：计数闭式 -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="215" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="147" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">n = 2k（奇偶各 k 个）</text>
    <text x="147" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">A(n) = 2 · k! · k!</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="265" y="300" width="215" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="372" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">n = 2k+1（奇数多一个）</text>
    <text x="372" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">A(n) = (k+1)! · k!</text>
  </g>
</svg>
