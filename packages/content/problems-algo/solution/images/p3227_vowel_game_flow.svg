<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：线性扫描数元音，k &gt; 0 即 true</text>

  <!-- 开始 -->
  <rect x="168" y="38" width="64" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 200 64 L 200 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 扫描 -->
  <rect x="100" y="82" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt = 0，逐字符扫描 s</text>
  <path d="M 200 112 L 200 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：是元音? -->
  <polygon points="200,134 272,162 200,190 128,162" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ∈ {a,e,i,o,u} ?</text>

  <!-- 是 → cnt+1，回环 -->
  <path d="M 272 162 L 328 162" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="298" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="147" width="86" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="373" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt += 1</text>
  <path d="M 416 162 C 446 162, 446 97, 300 97" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 否 → 扫描完毕 -->
  <path d="M 200 190 L 200 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="212" y="204" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="152" y="210" width="96" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">扫描完毕</text>
  <path d="M 200 238 L 200 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：cnt > 0? -->
  <polygon points="200,256 262,282 200,308 138,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cnt &gt; 0 ?</text>

  <!-- 是 → true -->
  <path d="M 262 282 L 392 282 L 392 304" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="308" y="306" width="188" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="327" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true（Alice 必胜）</text>

  <!-- 否 → false -->
  <path d="M 138 282 L 108 282 L 108 304" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="24" y="306" width="188" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="327" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false（元音数 = 0）</text>

  <!-- 脚注 -->
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">早退版：扫到第一个元音即可 return true，后面不用看了</text>
</svg>
