<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举包围盒 + 信号累加 + 严格更优更新</text>

  <!-- Step 1 -->
  <rect x="180" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1. 求包围盒上界 maxX, maxY</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#777">bestQ = -1, bestX = bestY = 0</text>
  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate -->
  <rect x="180" y="106" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2. 枚举 (x, y) ：x 0→maxX, y 0→maxY</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#777">升序遍历 ⇒ 首次最大即字典序最小</text>
  <path d="M 280 146 L 280 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init q -->
  <rect x="200" y="164" width="160" height="32" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#333">3. q = 0；遍历每座塔 (xi, yi, qi)</text>
  <path d="M 280 196 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: compute d -->
  <rect x="170" y="214" width="220" height="32" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#333">4. d = √((x−xi)² + (y−yi)²)</text>
  <path d="M 280 246 L 280 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: d <= radius ? -->
  <polygon points="280,264 360,300 280,336 200,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d ≤ radius ?</text>
  <text x="280" y="311" text-anchor="middle" font-size="10" fill="#777">否 → 跳过该塔</text>

  <!-- Yes branch -->
  <path d="M 360 300 L 410 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="412" y="282" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5. q += ⌊qi/(1+d)⌋</text>
  <text x="477" y="312" text-anchor="middle" font-size="9" fill="#777">向下取整</text>

  <!-- back to next tower -->
  <path d="M 477 282 L 477 232 L 390 232" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="226" font-size="9" fill="#999">下一座塔</text>

  <!-- after all towers -->
  <path d="M 280 336 L 280 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: update best -->
  <rect x="160" y="358" width="240" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6. 若 q &gt; bestQ（严格大于）</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#777">更新 bestQ, bestX, bestY；否则不动</text>
  <path d="M 280 400 L 280 416" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: return -->
  <rect x="190" y="418" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7. 返回 [bestX, bestY]</text>
</svg>
