<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">双指针归并流程</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888">i 遍历字符流，j 遍历空格位，命中则先写空格</text>

  <!-- Start (oval) -->
  <rect x="210" y="52" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M260,82 L260,92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="94" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="129" text-anchor="middle" font-size="10.5" fill="#555">i = 0, j = 0, res = []</text>
  <path d="M260,136 L260,146" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: j < m and i == spaces[j]? -->
  <polygon points="260,148 360,184 260,220 160,184" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j &lt; m 且</text>
  <text x="260" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i == spaces[j]?</text>

  <!-- Yes branch: right -->
  <path d="M360,184 L398,184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="398" y="168" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="446" y="182" text-anchor="middle" font-size="10.5" fill="#333">写 ' '</text>
  <text x="446" y="196" text-anchor="middle" font-size="10.5" fill="#333">j++</text>
  <!-- arrow from yes-box down and back to merge (below) -->
  <path d="M446,202 L446,250 L346,250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- No branch: down to merge -->
  <path d="M260,220 L260,232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="230" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Merge: write s[i], i++ -->
  <rect x="180" y="234" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">写字符</text>
  <text x="260" y="269" text-anchor="middle" font-size="10.5" fill="#555">res += s[i], i++</text>
  <path d="M260,276 L260,286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: i < n? -->
  <polygon points="260,288 340,312 260,336 180,312" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n?</text>

  <!-- Yes: loop back to Decision 1 (left side up) -->
  <path d="M180,312 L120,312 L120,184 L160,184" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="120" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="120" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a">回到判定</text>

  <!-- No: end -->
  <path d="M340,312 L378,312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="378" y="298" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="428" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#aaa">i 必走完 0…n−1；j 至多走 m 步 ⇒ O(n + m)</text>
</svg>
