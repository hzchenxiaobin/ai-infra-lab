<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：三桶分类 +「xx」万能牌跨两侧</text>
  <text x="260" y="33" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">以示例 1 为例：cards = ["aa","ab","ba","ac"]，x = 'a'</text>

  <!-- 第一行：三个类桶 -->
  <rect x="18" y="38" width="152" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">「xx」类 · both 张</text>
  <rect x="79" y="64" width="30" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="79" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">aa</text>

  <rect x="184" y="38" width="152" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">「xc」类 · cnt1[c]</text>
  <rect x="206" y="64" width="28" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ab</text>
  <rect x="248" y="64" width="28" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="79" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ac</text>

  <rect x="350" y="38" width="152" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="56" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">「cx」类 · cnt2[c]</text>
  <rect x="412" y="64" width="28" height="22" rx="3" fill="#fff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426" y="79" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ba</text>

  <!-- 类桶 → 图结构的箭头 -->
  <path d="M 94 94 L 94 142" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="120" font-size="9" fill="#446688" filter="url(#rough2)">both 张</text>

  <path d="M 260 94 C 260 110, 278 116, 298 126" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 426 94 C 426 140, 436 180, 432 222" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 万能牌 xx -->
  <circle cx="94" cy="172" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="94" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">xx</text>
  <text x="94" y="212" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">xx–xx ✗（0 处不同）</text>

  <!-- xx 分配到两侧 -->
  <path d="M 118 162 C 152 150, 185 148, 216 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">i 张</text>
  <path d="M 118 182 C 152 194, 185 196, 216 188" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="212" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">both−i 张</text>

  <!-- 侧 1 -->
  <rect x="222" y="130" width="256" height="60" rx="8" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="350" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">侧 1：「xc」族 + 分来的 xx（新颜色）</text>
  <rect x="240" y="152" width="30" height="24" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">xa</text>
  <rect x="280" y="152" width="30" height="24" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">xb</text>
  <rect x="320" y="152" width="30" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">xx</text>
  <line x1="270" y1="164" x2="280" y2="164" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="310" y1="164" x2="320" y2="164" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">异色可配 ✓</text>

  <!-- 两侧之间：不相容 -->
  <path d="M 350 190 L 350 226" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="212" font-size="8.5" fill="#b85450" filter="url(#rough2)">两处都不同 ✗</text>

  <!-- 侧 2 -->
  <rect x="222" y="226" width="256" height="60" rx="8" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="350" y="242" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">侧 2：「cx」族 + 分来的 xx（新颜色）</text>
  <rect x="240" y="248" width="30" height="24" rx="3" fill="#fff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="264" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ax</text>
  <rect x="280" y="248" width="30" height="24" rx="3" fill="#fff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="264" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">bx</text>
  <rect x="320" y="248" width="30" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="264" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">xx</text>
  <line x1="270" y1="260" x2="280" y2="260" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="310" y1="260" x2="320" y2="260" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="264" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">异色可配 ✓</text>

  <!-- 结论框 -->
  <rect x="18" y="300" width="484" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每侧 =「同色不配、异色可配」：最大对数 = min(⌊T/2⌋, T − M)</text>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">答案 = max over i∈[0,both]：solve(cnt1, i) + solve(cnt2, both−i)</text>
</svg>
