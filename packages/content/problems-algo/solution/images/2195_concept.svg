<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序找挡板 → 缺口批量取数 → 等差求和</text>

  <!-- ====== Top: number line with holes (nums=[5,6]) ====== -->
  <rect x="24" y="44" width="532" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.45"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">正整数轴（nums = [5, 6] 为例）</text>

  <!-- cells 1..9 -->
  <!-- 1 (take) -->
  <rect x="44" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 2 (take) -->
  <rect x="88" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- 3 (take) -->
  <rect x="132" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- 4 (take) -->
  <rect x="176" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 5 (blocked) -->
  <rect x="220" y="78" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="99" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <!-- 6 (blocked) -->
  <rect x="264" y="78" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="99" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <!-- 7 (take) -->
  <rect x="308" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <!-- 8 (take) -->
  <rect x="352" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <!-- 9 ... -->
  <rect x="396" y="78" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="448" y="99" font-size="13" fill="#888">…</text>

  <!-- legend -->
  <rect x="476" y="82" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="498" y="94" font-size="10" fill="#4a7a3a">可取</text>
  <rect x="476" y="102" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="498" y="114" font-size="10" fill="#b85450">挡板</text>

  <!-- gap brackets -->
  <path d="M 44 122 L 44 128 L 216 128 L 216 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">缺口① [1,4]</text>
  <path d="M 308 122 L 308 128 L 436 128 L 436 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="372" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">缺口② [7,∞)</text>

  <!-- ====== Middle: three observations ====== -->
  <!-- obs 1: greedy -->
  <rect x="24" y="156" width="170" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="109" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">观察一：贪心取最小</text>
  <text x="109" y="198" text-anchor="middle" font-size="11" fill="#444">最小化和 ⟺</text>
  <text x="109" y="214" text-anchor="middle" font-size="11" fill="#444">取最小的 k 个</text>
  <text x="109" y="230" text-anchor="middle" font-size="11" fill="#444">未出现正整数</text>

  <!-- obs 2: gaps -->
  <rect x="205" y="156" width="170" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="290" y="178" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">观察二：缺口连续</text>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#444">排序去重 → 挡板</text>
  <text x="290" y="214" text-anchor="middle" font-size="11" fill="#444">挡板间为连续段</text>
  <text x="290" y="230" text-anchor="middle" font-size="11" fill="#444">全部可用且互异</text>

  <!-- obs 3: arithmetic sum -->
  <rect x="386" y="156" width="170" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.6"/>
  <text x="471" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">观察三：等差求和</text>
  <text x="471" y="198" text-anchor="middle" font-size="11" fill="#444">连续段 = 等差数列</text>
  <text x="471" y="214" text-anchor="middle" font-size="11" fill="#444">每段 O(1) 批量算</text>
  <text x="471" y="230" text-anchor="middle" font-size="11" fill="#444">O(k) → O(n)</text>

  <!-- arrows down -->
  <path d="M 109 242 L 109 252 L 290 252 L 290 262" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 471 242 L 471 252 L 290 252" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ====== Bottom: arithmetic series formula ====== -->
  <rect x="24" y="264" width="532" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)" opacity="0.7"/>
  <text x="290" y="290" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">连续段 [a, b] 的和 = 等差数列求和公式</text>
  <text x="290" y="316" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">Σ(a→b) = (a + b) × (b − a + 1) / 2</text>
  <text x="290" y="330" text-anchor="middle" font-size="10" fill="#888">首项 a，末项 b，项数 b−a+1，公差 1</text>

  <!-- ====== Bottom strip: complexity gain ====== -->
  <rect x="24" y="346" width="532" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.45"/>
  <text x="290" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">复杂度收益：逐个枚举 O(k) → 缺口遍历 O(n log n)</text>
  <text x="290" y="388" text-anchor="middle" font-size="11" fill="#555">k ≤ 10⁹，n ≤ 10⁵：从 10⁹ 次操作降到 ~1.7×10⁶ 次</text>
  <text x="290" y="408" text-anchor="middle" font-size="11" fill="#555">排序 O(n log n) 主导 + 去重 O(n) + 缺口遍历 O(n) 每段 O(1)</text>
  <text x="290" y="424" text-anchor="middle" font-size="10" fill="#888">去重：重复值只占一个挡板位置，不制造额外缺口</text>
</svg>
