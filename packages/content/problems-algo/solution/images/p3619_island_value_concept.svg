<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一次 flood fill 累加岛屿价值和，判定 total % k == 0</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1（k = 5）：正数是陆地、0 是水，四连通的同色块各是一座岛屿</text>

  <!-- ============ 5x5 网格（格子 40px，原点 64,66） ============ -->
  <g filter="url(#rough2)">
    <!-- 水格子 -->
    <rect x="64" y="66" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="184" y="66" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="224" y="66" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="64" y="106" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="144" y="106" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="184" y="106" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="64" y="146" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="104" y="146" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="184" y="146" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="224" y="146" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="64" y="186" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="224" y="186" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="64" y="226" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="144" y="226" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="184" y="226" width="40" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>

    <!-- 岛①（红）：2 + 1 + 5 = 8 -->
    <rect x="104" y="66" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="144" y="66" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="104" y="106" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <!-- 岛②（绿）：5 -->
    <rect x="224" y="106" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <!-- 岛③（绿）：1 + 1 + 4 + 7 + 2 = 15 -->
    <rect x="144" y="146" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="104" y="186" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="144" y="186" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="184" y="186" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="104" y="226" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <!-- 岛④（红）：8 -->
    <rect x="224" y="226" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <!-- 格子数值 -->
    <text x="84" y="91" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="124" y="91" text-anchor="middle" font-size="13" fill="#8a3a36">2</text>
    <text x="164" y="91" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
    <text x="204" y="91" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="244" y="91" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="84" y="131" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="124" y="131" text-anchor="middle" font-size="13" fill="#8a3a36">5</text>
    <text x="164" y="131" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="204" y="131" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="244" y="131" text-anchor="middle" font-size="13" fill="#2a5a2a">5</text>
    <text x="84" y="171" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="124" y="171" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="164" y="171" text-anchor="middle" font-size="13" fill="#2a5a2a">1</text>
    <text x="204" y="171" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="244" y="171" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="84" y="211" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="124" y="211" text-anchor="middle" font-size="13" fill="#2a5a2a">1</text>
    <text x="164" y="211" text-anchor="middle" font-size="13" fill="#2a5a2a">4</text>
    <text x="204" y="211" text-anchor="middle" font-size="13" fill="#2a5a2a">7</text>
    <text x="244" y="211" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="84" y="251" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="124" y="251" text-anchor="middle" font-size="13" fill="#2a5a2a">2</text>
    <text x="164" y="251" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="204" y="251" text-anchor="middle" font-size="13" fill="#b0b0b0">0</text>
    <text x="244" y="251" text-anchor="middle" font-size="13" fill="#8a3a36">8</text>

    <!-- 岛屿编号小标 -->
    <text x="109" y="80" font-size="9" fill="#b85450" font-weight="bold">①</text>
    <text x="229" y="120" font-size="9" fill="#4a7a3a" font-weight="bold">②</text>
    <text x="149" y="160" font-size="9" fill="#4a7a3a" font-weight="bold">③</text>
    <text x="229" y="240" font-size="9" fill="#b85450" font-weight="bold">④</text>

    <!-- 网格外框 -->
    <rect x="64" y="66" width="200" height="200" fill="none" stroke="#999" stroke-width="1.6"/>
  </g>

  <text x="164" y="288" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">绿色 ✓：总价值是 5 的倍数 · 红色 ✗：不是</text>

  <!-- ============ 右侧判定面板 ============ -->
  <text x="300" y="82" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">四座岛屿的整除判定（k = 5）</text>

  <g filter="url(#rough2)">
    <rect x="300" y="96" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="322" y="108" font-size="10.5" fill="#8a3a36">① 2 + 1 + 5 = 8 → 8 % 5 ≠ 0 ✗</text>

    <rect x="300" y="126" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="322" y="138" font-size="10.5" fill="#2a5a2a">② 5 → 5 % 5 = 0 ✓</text>

    <rect x="300" y="156" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="322" y="168" font-size="10.5" fill="#2a5a2a">③ 1 + 1 + 4 + 7 + 2 = 15 → ✓</text>

    <rect x="300" y="186" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="322" y="198" font-size="10.5" fill="#8a3a36">④ 8 → 8 % 5 ≠ 0 ✗</text>

    <rect x="300" y="220" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="400" y="241" text-anchor="middle" font-size="11.5" fill="#33455e" font-weight="bold">ans = 2（② 与 ③）</text>
  </g>

  <!-- ============ 底部陷阱提示 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="304" width="460" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="326" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">⚠️ 两个工程陷阱（本题真正的考点）</text>
    <text x="260" y="348" text-anchor="middle" font-size="10" fill="#33455e">陷阱一（溢出）：总价值上界 10⁵ × 10⁶ = 10¹¹，远超 int ≈ 2.1×10⁹ → C++ 必须用 long long</text>
    <text x="260" y="370" text-anchor="middle" font-size="10" fill="#33455e">陷阱二（爆栈）：最坏岛屿是长 10⁵ 的蛇形链 → 递归深度 10⁵，Python / C++ 都可能爆栈 → 显式栈迭代</text>
  </g>
</svg>
