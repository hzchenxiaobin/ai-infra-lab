<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrX" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">异或消去演算：非根值出现两次抵消，根值唯一保留</text>

  <!-- Mini tree -->
  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#888">示例树（根=1，子节点 3,2,4；3 的子节点 5,6）</text>

  <!-- tree edges -->
  <path d="M 270 72 Q 250 86 232 96" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 78 L 280 96" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 290 72 Q 310 86 328 96" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 226 112 Q 220 122 214 130" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 238 112 Q 244 122 250 130" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- root 1 -->
  <circle cx="280" cy="66" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- 3,2,4 -->
  <circle cx="228" cy="102" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="106" text-anchor="middle" font-size="10" fill="#333">3</text>
  <circle cx="280" cy="102" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="10" fill="#333">2</text>
  <circle cx="332" cy="102" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="332" y="106" text-anchor="middle" font-size="10" fill="#333">4</text>
  <!-- 5,6 -->
  <circle cx="210" cy="136" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="140" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <circle cx="252" cy="136" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="140" text-anchor="middle" font-size="9.5" fill="#333">6</text>

  <!-- Divider -->
  <path d="M 40 162 L 520 162" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Row label: all node values -->
  <text x="48" y="194" font-size="11.5" fill="#4a7a3a" font-weight="bold">所有节点值 ⊕</text>

  <!-- Node value cells: 1,2,3,4,5,6  centered around x positions -->
  <!-- positions for 6 cells: x centers 150,210,270,330,390,450, width 42 -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <!-- 1 (root, highlighted) -->
    <rect x="129" y="182" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="203" fill="#b85450" font-weight="bold">1</text>
    <!-- 2 -->
    <rect x="189" y="182" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="203">2</text>
    <!-- 3 -->
    <rect x="249" y="182" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="270" y="203">3</text>
    <!-- 4 -->
    <rect x="309" y="182" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="203">4</text>
    <!-- 5 -->
    <rect x="369" y="182" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="203">5</text>
    <!-- 6 -->
    <rect x="429" y="182" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="450" y="203">6</text>
  </g>

  <!-- ⊕ between rows -->
  <text x="280" y="244" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">⊕</text>

  <!-- Row label: all child values -->
  <text x="48" y="276" font-size="11.5" fill="#446688" font-weight="bold">所有子节点值 ⊕</text>

  <!-- Child value cells: 2,3,4,5,6 aligned under matching node cells (210,270,330,390,450) -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <!-- empty slot under 1 -->
    <rect x="129" y="264" width="42" height="30" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
    <text x="150" y="284" font-size="10" fill="#bbb">∅</text>
    <!-- 2 -->
    <rect x="189" y="264" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="284">2</text>
    <!-- 3 -->
    <rect x="249" y="264" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="270" y="284">3</text>
    <!-- 4 -->
    <rect x="309" y="264" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="284">4</text>
    <!-- 5 -->
    <rect x="369" y="264" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="284">5</text>
    <!-- 6 -->
    <rect x="429" y="264" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="450" y="284">6</text>
  </g>

  <!-- Cancel arrows: connect each green cell to matching blue cell below -->
  <!-- 2: from (210,212) to (210,264) -->
  <path d="M 210 214 L 210 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrX)" filter="url(#rough2)"/>
  <path d="M 270 214 L 270 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrX)" filter="url(#rough2)"/>
  <path d="M 330 214 L 330 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrX)" filter="url(#rough2)"/>
  <path d="M 390 214 L 390 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrX)" filter="url(#rough2)"/>
  <path d="M 450 214 L 450 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrX)" filter="url(#rough2)"/>

  <!-- "抵消" labels on cancel arrows -->
  <text x="500" y="244" font-size="10.5" fill="#888">出现两次 → 抵消</text>

  <!-- 1 has no match: highlight -->
  <text x="150" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">仅一次</text>

  <!-- equals -->
  <text x="280" y="324" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">=</text>

  <!-- Result -->
  <rect x="240" y="336" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">1</text>
  <text x="332" y="360" font-size="11.5" fill="#b85450" font-weight="bold">← rootVal（根值）</text>

  <!-- notes -->
  <text x="50" y="398" font-size="11.5" fill="#555">• 非根节点在两行各出现一次，<tspan fill="#4a7a3a" font-weight="bold">x ⊕ x = 0</tspan> 自相抵消</text>
  <text x="50" y="416" font-size="11.5" fill="#555">• 根只在"所有节点值"出现一次，无配对 → 保留，即 <tspan fill="#b85450" font-weight="bold">rootVal</tspan></text>
  <text x="50" y="434" font-size="11" fill="#888">  再扫一遍节点列表，找到 val == rootVal 的节点返回 → O(n) 时间 / O(1) 空间</text>
</svg>
