<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">值 → 有序下标表，最近必是前驱 / 后继</text>

  <!-- nums = [1,3,1,4,1,3,2]，7 格 -->
  <!-- 格 i：x = 81 + 52i，y = 58，w 46 h 34 -->
  <rect x="81" y="58" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="104" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>

  <rect x="133" y="58" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="156" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <rect x="185" y="58" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="208" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <rect x="237" y="58" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <rect x="289" y="58" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="312" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <!-- 查询 q=5：红色高亮 -->
  <rect x="341" y="58" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="364" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="364" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ←q</text>

  <rect x="393" y="58" width="46" height="34" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="416" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <!-- 环形回绕弧：下标 6 的下一个是 0 -->
  <path d="M 416 94 C 416 130, 104 130, 104 96" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">环形：下标 6 的下一个绕回 0</text>

  <!-- 哈希分组面板 -->
  <rect x="45" y="150" width="430" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">按值分组 → 下标列表天然有序（无需排序）</text>

  <rect x="66" y="184" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="116" y="201" font-size="13" fill="#333" filter="url(#rough2)">pos[1] = [0, 2, 4]</text>
  <text x="300" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">前后驱都在表内</text>

  <rect x="66" y="214" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="116" y="231" font-size="13" fill="#333" filter="url(#rough2)">pos[3] = [1, 5]</text>
  <text x="250" y="231" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">← q = 5 在此</text>

  <rect x="66" y="244" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="116" y="261" font-size="13" fill="#333" filter="url(#rough2)">pos[4] = [3]</text>
  <text x="230" y="261" font-size="11" fill="#b85450" filter="url(#rough2)">只有自己 → 答案 −1</text>

  <rect x="66" y="274" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="291" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="116" y="291" font-size="13" fill="#333" filter="url(#rough2)">pos[2] = [6]</text>
  <text x="230" y="291" font-size="11" fill="#999999" filter="url(#rough2)">只有自己 → 答案 −1</text>

  <!-- 底部技巧框 -->
  <rect x="30" y="312" width="460" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#2a4a6a" filter="url(#rough2)">💡 环距 = min(|i−j|, n−|i−j|)：q=5 → 1 即 min(4, 3) = 3</text>
</svg>
