<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 1, 5, 0, 4, 6]</text>

  <!-- Array index labels (fixed at top of each row context) -->
  <!-- We'll show 6 steps, each with the array and first/second state -->

  <!-- Step 0: init -->
  <text x="36" y="60" font-size="11" fill="#888" font-weight="bold">初始</text>
  <text x="80" y="60" font-size="10.5" fill="#888">first = +∞, second = +∞</text>

  <!-- Array cells row 0 -->
  <g filter="url(#rough2)">
    <rect x="100" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="160" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="200" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="240" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="280" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="370" y="86" font-size="10.5" fill="#888">first=∞</text>
  <text x="440" y="86" font-size="10.5" fill="#888">second=∞</text>

  <path d="M 270 104 L 270 116" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 1: i=0, x=2, first=2 -->
  <text x="36" y="136" font-size="10.5" fill="#446688" font-weight="bold">i=0</text>
  <text x="36" y="150" font-size="10" fill="#888">x=2</text>
  <text x="80" y="136" font-size="10.5" fill="#446688">2 ≤ first → first=2</text>

  <g filter="url(#rough2)">
    <rect x="100" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="140" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="142" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#ccc">1</text>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#ccc">5</text>
  <text x="240" y="162" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#ccc">4</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#ccc">6</text>

  <text x="370" y="162" font-size="11" fill="#446688" font-weight="bold">first=2</text>
  <text x="440" y="162" font-size="11" fill="#888">second=∞</text>

  <path d="M 270 176 L 270 188" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 2: i=1, x=1, first=1 -->
  <text x="36" y="208" font-size="10.5" fill="#446688" font-weight="bold">i=1</text>
  <text x="36" y="222" font-size="10" fill="#888">x=1</text>
  <text x="80" y="208" font-size="10.5" fill="#446688">1 ≤ first → first=1</text>

  <g filter="url(#rough2)">
    <rect x="100" y="214" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="140" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="180" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="234" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="160" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="200" y="234" text-anchor="middle" font-size="12" fill="#ccc">5</text>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#ccc">4</text>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#ccc">6</text>

  <text x="370" y="234" font-size="11" fill="#446688" font-weight="bold">first=1</text>
  <text x="440" y="234" font-size="11" fill="#888">second=∞</text>

  <path d="M 270 248 L 270 260" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: i=2, x=5, second=5 -->
  <text x="36" y="280" font-size="10.5" fill="#d6a040" font-weight="bold">i=2</text>
  <text x="36" y="294" font-size="10" fill="#888">x=5</text>
  <text x="80" y="280" font-size="10.5" fill="#d6a040">5 &gt; first → second=5</text>

  <g filter="url(#rough2)">
    <rect x="100" y="286" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="140" y="286" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="180" y="286" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="220" y="286" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="286" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="286" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="306" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="160" y="306" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <text x="200" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="240" y="306" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#ccc">4</text>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#ccc">6</text>

  <text x="370" y="306" font-size="11" fill="#446688" font-weight="bold">first=1</text>
  <text x="440" y="306" font-size="11" fill="#d6a040" font-weight="bold">second=5</text>

  <path d="M 270 320 L 270 332" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 4: i=3, x=0, first=0 (KEY STEP) -->
  <text x="36" y="352" font-size="10.5" fill="#b85450" font-weight="bold">i=3</text>
  <text x="36" y="366" font-size="10" fill="#888">x=0</text>
  <text x="80" y="352" font-size="10.5" fill="#b85450" font-weight="bold">0 ≤ first → first=0</text>
  <text x="80" y="366" font-size="9.5" fill="#b85450">⚠ second 不变！</text>

  <g filter="url(#rough2)">
    <rect x="100" y="358" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="140" y="358" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="180" y="358" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="220" y="358" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="260" y="358" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="358" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="378" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="160" y="378" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <text x="200" y="378" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="240" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#ccc">4</text>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#ccc">6</text>

  <text x="370" y="378" font-size="11" fill="#446688" font-weight="bold">first=0</text>
  <text x="440" y="378" font-size="11" fill="#d6a040" font-weight="bold">second=5</text>

  <path d="M 270 392 L 270 404" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 5: i=4, x=4, second=4 -->
  <text x="36" y="424" font-size="10.5" fill="#d6a040" font-weight="bold">i=4</text>
  <text x="36" y="438" font-size="10" fill="#888">x=4</text>
  <text x="80" y="424" font-size="10.5" fill="#d6a040">4 &gt; first, ≤ second → second=4</text>

  <g filter="url(#rough2)">
    <rect x="100" y="430" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="140" y="430" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="180" y="430" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="220" y="430" width="40" height="30" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="260" y="430" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="300" y="430" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="120" y="450" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="160" y="450" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <text x="200" y="450" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="240" y="450" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="280" y="450" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#ccc">6</text>

  <text x="370" y="450" font-size="11" fill="#446688" font-weight="bold">first=0</text>
  <text x="440" y="450" font-size="11" fill="#d6a040" font-weight="bold">second=4</text>

  <path d="M 270 464 L 270 476" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 6: i=5, x=6, return true -->
  <text x="36" y="496" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=5</text>
  <text x="36" y="510" font-size="10" fill="#888">x=6</text>
  <text x="80" y="496" font-size="11" fill="#4a7a3a" font-weight="bold">6 &gt; second → return true ✓</text>
  <text x="80" y="510" font-size="10" fill="#555">三元组 (0, 4, 6) 或旧 (1, 5, 6)</text>
</svg>
