<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递推：一次旋转 = 一个元素从尾移到首</text>

  <!-- F(k-1) row -->
  <text x="30" y="76" font-size="12" fill="#888">F(k-1):</text>
  <rect x="80" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₀</text>
  <text x="120" y="94" text-anchor="middle" font-size="10" fill="#888">× 0</text>

  <rect x="170" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₁</text>
  <text x="210" y="94" text-anchor="middle" font-size="10" fill="#888">× 1</text>

  <rect x="260" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₂</text>
  <text x="300" y="94" text-anchor="middle" font-size="10" fill="#888">× 2</text>

  <rect x="350" y="56" width="80" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₃</text>
  <text x="390" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">× 3 ← 尾</text>

  <!-- curved arrow from a3 old pos down to a3 new pos -->
  <path d="M 390 104 Q 200 168 120 152" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">顺时针旋转 1 位：a₃ 从尾移到首</text>

  <!-- F(k) row -->
  <text x="30" y="204" font-size="12" fill="#888">F(k):</text>
  <rect x="80" y="184" width="80" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₃</text>
  <text x="120" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">× 0 ← 首</text>

  <rect x="170" y="184" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₀</text>
  <text x="210" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">× 1 ↑1</text>

  <rect x="260" y="184" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₁</text>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">× 2 ↑1</text>

  <rect x="350" y="184" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a₂</text>
  <text x="390" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">× 3 ↑1</text>

  <!-- derivation box -->
  <rect x="40" y="252" width="460" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">变化拆解（设 Σ = a₀+a₁+a₂+a₃，n = 4）</text>
  <text x="58" y="298" font-size="11.5" fill="#555">• a₃ 系数 3 → 0：贡献损失 (n−1)·a₃</text>
  <text x="58" y="318" font-size="11.5" fill="#555">• a₀, a₁, a₂ 系数各 +1：贡献共增 (Σ − a₃)</text>
  <text x="58" y="338" font-size="11.5" fill="#555">• 净变化 Δ = (Σ − a₃) − (n−1)·a₃ = Σ − n·a₃</text>
  <text x="270" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">F(k) = F(k−1) + Σ − n · a₃</text>
</svg>
