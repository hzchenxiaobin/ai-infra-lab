<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="236" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：割在哪里，连通段就断在哪里</text>

  <!-- 图例 -->
  <rect x="398" y="36" width="114" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="52" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">割 ⟺ 左边全部 ≤ 右边全部</text>
  <text x="455" y="69" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（max 左 ≤ min 右）</text>

  <!-- 割线 -->
  <path d="M 146 48 L 146 102" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <path d="M 266 48 L 266 102" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="146" y="42" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">割：1 ≤ 2</text>
  <text x="266" y="42" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">割：3 ≤ 4</text>

  <!-- 数值格子 -->
  <rect x="90" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="210" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="270" y="56" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="330" y="56" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="356" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- 下标 -->
  <text x="116" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="176" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="236" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="296" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="356" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=4</text>

  <!-- 非割位置的双向边 -->
  <path d="M 180 132 L 232 132" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">3 &gt; 2 ⇒ 有边</text>
  <path d="M 300 132 L 352 132" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">5 &gt; 4 ⇒ 有边</text>
  <text x="76" y="136" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">1 &lt; 3 无边</text>

  <!-- 段括号 -->
  <rect x="86" y="168" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="116" y="185" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">max = 1</text>
  <rect x="146" y="168" width="116" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="204" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">max = 3</text>
  <rect x="266" y="168" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="324" y="185" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">max = 5</text>

  <!-- ans 行 -->
  <text x="236" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[i] = 所在段的最大值</text>
  <rect x="90" y="230" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="230" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="210" y="230" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="270" y="230" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="330" y="230" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="356" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- 底部注解 -->
  <rect x="56" y="292" width="400" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="256" y="311" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">向前跳小、向后跳大 ⇒ 每条边都是双向的</text>
  <text x="256" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 可达集 = 无向连通分量 = 极大无割段（连续区间）</text>
</svg>
