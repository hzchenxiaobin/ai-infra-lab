<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">回调式 → Promise 式</text>

  <!-- 左侧：回调函数 -->
  <rect x="30" y="70" width="210" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">回调式 fn</text>
  <text x="40" y="122" font-size="12" fill="#555" filter="url(#rough2)">fn(callback, ...args)</text>
  <text x="40" y="144" font-size="12" fill="#555" filter="url(#rough2)">  callback(value)</text>
  <text x="40" y="162" font-size="12" fill="#888" filter="url(#rough2)">  callback(value, error)</text>
  <text x="40" y="182" font-size="11" fill="#999" filter="url(#rough2)">↑ 第一个参数是 callback</text>

  <!-- 中间转换箭头 -->
  <path d="M250 130 Q300 110 318 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="104" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">promisify</text>

  <!-- 右侧：Promise 式 -->
  <rect x="320" y="70" width="210" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Promise 式 promisified</text>
  <text x="330" y="122" font-size="12" fill="#555" filter="url(#rough2)">promisified(...args)</text>
  <text x="330" y="144" font-size="12" fill="#555" filter="url(#rough2)">  → Promise</text>
  <text x="330" y="162" font-size="12" fill="#4a7a3a" filter="url(#rough2)">  resolve(value)</text>
  <text x="330" y="180" font-size="12" fill="#b85450" filter="url(#rough2)">  reject(error)</text>

  <!-- 下方：callback 契约两条分支 -->
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">callback 契约：(value, error)</text>

  <rect x="40" y="240" width="220" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">单参：callback(value)</text>
  <text x="50" y="285" font-size="11" fill="#555" filter="url(#rough2)">error 未提供（无第二参）</text>
  <text x="50" y="305" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ resolve(value)</text>
  <text x="50" y="324" font-size="11" fill="#888" filter="url(#rough2)">例：callback(6) → resolve(6)</text>

  <rect x="300" y="240" width="220" height="95" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双参：callback(value, error)</text>
  <text x="310" y="285" font-size="11" fill="#555" filter="url(#rough2)">error 为真值 → 出错信号</text>
  <text x="310" y="305" font-size="12" fill="#b85450" filter="url(#rough2)">→ reject(error)</text>
  <text x="310" y="324" font-size="11" fill="#888" filter="url(#rough2)">例：callback(120, "Err") → reject</text>
</svg>
