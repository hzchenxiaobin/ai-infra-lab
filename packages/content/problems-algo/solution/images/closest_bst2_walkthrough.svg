<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="320" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[4,2,5,1,3], target=3.714286, k=2</text>

  <!-- Table header -->
  <rect x="20" y="44" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="10" fill="#555" font-weight="bold">步骤</text>
  <text x="120" y="62" font-size="10" fill="#555" font-weight="bold">pred 栈</text>
  <text x="240" y="62" font-size="10" fill="#555" font-weight="bold">succ 栈</text>
  <text x="350" y="62" font-size="10" fill="#555" font-weight="bold">比较</text>
  <text x="470" y="62" font-size="10" fill="#555" font-weight="bold">选取 → result</text>

  <!-- Column dividers -->
  <line x1="100" y1="44" x2="100" y2="280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="44" x2="220" y2="280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="44" x2="330" y2="280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="44" x2="450" y2="280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: Init -->
  <rect x="20" y="74" width="540" height="44" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="92" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="50" y="106" font-size="9" fill="#888">O(h)</text>
  <!-- pred stack: [2, 3] top=3 -->
  <rect x="110" y="80" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="150" y="94" font-size="8" fill="#b85450">←top</text>
  <rect x="110" y="102" width="36" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="113" text-anchor="middle" font-size="9" fill="#333">2</text>
  <!-- succ stack: [4] top=4 -->
  <rect x="230" y="80" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="270" y="94" font-size="8" fill="#b85450">←top</text>
  <text x="350" y="96" font-size="10" fill="#888">—</text>
  <text x="470" y="96" font-size="10" fill="#888">result = [ ]</text>

  <!-- Row 1: Step 1 -->
  <rect x="20" y="120" width="540" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="140" font-size="10" fill="#333" font-weight="bold">①</text>
  <text x="50" y="156" font-size="9" fill="#888">k=1</text>
  <!-- pred stack: [2, 3] -->
  <rect x="110" y="126" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="148" width="36" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="159" text-anchor="middle" font-size="9" fill="#333">2</text>
  <!-- succ: [4] → [5] -->
  <rect x="230" y="126" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="140" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">4</text>
  <path d="M 268 136 L 286 148" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="148" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="308" y="162" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="332" y="162" font-size="8" fill="#b85450">←top</text>
  <!-- Compare -->
  <text x="350" y="138" font-size="9" fill="#4a7a3a">pred: |3.71−3|=0.71</text>
  <text x="350" y="152" font-size="9" fill="#446688">succ: |3.71−4|=0.29</text>
  <text x="350" y="168" font-size="9" fill="#b85450" font-weight="bold">0.29 &lt; 0.71 → succ</text>
  <!-- Result -->
  <rect x="460" y="132" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="500" y="146" font-size="10" fill="#333">→ [4]</text>

  <!-- Row 2: Step 2 -->
  <rect x="20" y="180" width="540" height="56" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="200" font-size="10" fill="#333" font-weight="bold">②</text>
  <text x="50" y="216" font-size="9" fill="#888">k=2</text>
  <!-- pred: [2,3] → [2] -->
  <rect x="110" y="186" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="200" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">3</text>
  <path d="M 148 196 L 166 208" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="208" width="36" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="218" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="210" y="218" font-size="8" fill="#b85450">←top</text>
  <!-- succ: [5] -->
  <rect x="230" y="186" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="200" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <!-- Compare -->
  <text x="350" y="198" font-size="9" fill="#4a7a3a">pred: |3.71−3|=0.71</text>
  <text x="350" y="212" font-size="9" fill="#446688">succ: |3.71−5|=1.29</text>
  <text x="350" y="228" font-size="9" fill="#4a7a3a" font-weight="bold">0.71 &lt; 1.29 → pred</text>
  <!-- Result -->
  <rect x="460" y="192" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="206" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="500" y="206" font-size="10" fill="#333">→ [4,3]</text>

  <!-- Done -->
  <rect x="20" y="240" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="259" font-size="11" fill="#333" font-weight="bold">完成 ✓</text>
  <text x="120" y="259" font-size="10" fill="#333">k=2 个最近值已收集：result = [4, 3]，验证：|3.71−4|+|3.71−3| = 0.29+0.71 = 1.00（最优）</text>

  <!-- Init detail -->
  <rect x="20" y="278" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="294" font-size="9" fill="#d6a040">初始化：pred 从 root(4) 出发 → 4≥3.71 走左 → 2&lt;3.71 压栈走右 → 3&lt;3.71 压栈走右→null。pred=[2,3]</text>
  <text x="40" y="308" font-size="9" fill="#d6a040">succ 从 root(4) 出发 → 4≥3.71 压栈走左 → 2&lt;3.71 走右 → 3&lt;3.71 走右→null。succ=[4]</text>
</svg>
