<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">算法流程：一遍线性扫描</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="52" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260,67 L 260,82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="140" y="84" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxGreen = max(lights)，ans = 0</text>
  <path d="M 260,116 L 260,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="150" y="134" width="220" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历每辆车 t = arrivalTime[j]</text>
  <path d="M 260,166 L 260,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,182 362,219 260,256 158,219" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">r = t % period</text>
  <text x="260" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">r &lt; maxGreen ?</text>

  <!-- 是：等待 0 -->
  <path d="M 158,219 L 148,219" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="155" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="18" y="202" width="128" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">等待 0</text>
  <text x="82" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（ans 不变）</text>

  <!-- 否：更新 ans -->
  <path d="M 362,219 L 372,219" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="366" y="209" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="374" y="202" width="116" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans,</text>
  <text x="432" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">period − r)</text>

  <!-- 汇合 + 回到循环头 -->
  <path d="M 432,236 L 432,288 L 82,288 L 82,236" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 82,288 L 12,288 L 12,150 L 144,150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="304" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下一辆车</text>

  <!-- 遍历结束 → 返回 -->
  <path d="M 370,150 L 505,150 L 505,325 L 428,325" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="170" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">遍历结束</text>
  <rect x="300" y="310" width="122" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="329" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
