<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算："aaAbcBC" 一趟扫描 → ans = 3</text>

  <!-- char boxes -->
  <rect x="60" y="40" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="81" y="62" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="112" y="40" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="62" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="164" y="40" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="62" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>

  <rect x="216" y="40" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="237" y="62" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="268" y="40" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="289" y="62" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="320" y="40" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="341" y="62" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>

  <rect x="372" y="40" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="393" y="62" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- action tags -->
  <rect x="58" y="82" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="81" y="97" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">lower|=a</text>

  <text x="133" y="97" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（重复）</text>

  <rect x="162" y="82" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="97" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">upper|=a</text>

  <rect x="214" y="82" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="237" y="97" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">lower|=b</text>

  <rect x="266" y="82" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="289" y="97" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">lower|=c</text>

  <rect x="318" y="82" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="341" y="97" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">upper|=b</text>

  <rect x="370" y="82" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="393" y="97" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">upper|=c</text>

  <!-- final masks -->
  <rect x="105" y="122" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="144" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lower = {a,b,c}</text>

  <rect x="238" y="126" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">&amp;</text>

  <rect x="285" y="122" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">upper = {a,b,c}</text>

  <path d="M 260 156 L 260 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="106" y="180" width="308" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交集 = {a, b, c} → ans = 3</text>

  <!-- summary table -->
  <rect x="30" y="232" width="470" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">word</text>
  <text x="220" y="250" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">lower</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">upper</text>
  <text x="415" y="250" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">交集</text>
  <text x="480" y="250" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="30" y="258" width="470" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"aaAbcBC"</text>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{a,b,c}</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">{a,b,c}</text>
  <text x="415" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{a,b,c}</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="30" y="284" width="470" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"abc"</text>
  <text x="220" y="302" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{a,b,c}</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">∅</text>
  <text x="415" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">∅</text>
  <text x="480" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="30" y="310" width="470" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"abBCab"</text>
  <text x="220" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{a,b}</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">{b,c}</text>
  <text x="415" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{b}</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- column separators -->
  <path d="M 170 232 L 170 336" stroke="#bbb" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>
  <path d="M 270 232 L 270 336" stroke="#bbb" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>
  <path d="M 370 232 L 370 336" stroke="#bbb" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>
  <path d="M 460 232 L 460 336" stroke="#bbb" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>

  <rect x="48" y="352" width="424" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">只问「是否出现过」——不问次数、不问先后，字符顺序打乱答案不变</text>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（一旦开始关心先后，就是 3121 的地盘了）</text>
</svg>
