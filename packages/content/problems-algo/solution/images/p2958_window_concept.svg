<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：维护「所有频率 ≤ k」的滑动窗口</text>

  <!-- 上排：超频瞬间 -->
  <text x="24" y="48" font-size="12" fill="#b85450" font-weight="bold">第 7 步：right=6，元素 1 入窗 → cnt[1] = 3 &gt; k = 2，超频！</text>

  <rect x="24" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="68" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="79" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="112" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="79" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="156" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="200" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="244" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="79" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="288" y="58" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="79" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="332" y="58" width="40" height="32" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="79" text-anchor="middle" font-size="13" fill="#999">2</text>

  <text x="44" y="102" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="88" y="102" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="132" y="102" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="176" y="102" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="220" y="102" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="264" y="102" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="308" y="102" text-anchor="middle" font-size="10" fill="#b85450">6←right</text>
  <text x="352" y="102" text-anchor="middle" font-size="10" fill="#999">7</text>

  <rect x="20" y="54" width="312" height="40" fill="none" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="176" y="46" text-anchor="middle" font-size="11" fill="#b85450">窗口 [left=0, right=6]（暂时非法）</text>

  <!-- 右侧频率表 -->
  <rect x="390" y="52" width="158" height="66" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="469" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">窗口内频率（k = 2）</text>
  <text x="410" y="88" font-size="11" fill="#b85450" font-weight="bold">1 → 3  ✗ 超频</text>
  <text x="410" y="103" font-size="11" fill="#4a7a3a">2 → 2  ✓</text>
  <text x="410" y="113" font-size="11" fill="#4a7a3a">3 → 2  ✓</text>

  <!-- 中间收缩说明 -->
  <path d="M 200 122 L 200 148" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="212" y="138" font-size="11" fill="#4a7a3a">弹出 nums[left]=1，cnt[1] 回落到 2，left 0→1</text>

  <!-- 下排：恢复合法 -->
  <rect x="24" y="160" width="40" height="32" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="181" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="68" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="181" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="112" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="156" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="181" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="200" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="244" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="288" y="160" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="181" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="64" y="156" width="268" height="40" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="198" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">窗口 [left=1, right=6] 恢复合法 ✓</text>
  <text x="198" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">[2,3,1,2,3,1]，频率 1:2 2:2 3:2，长度 6</text>

  <!-- 底部要点 -->
  <rect x="24" y="228" width="512" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333">① right 每右移一步：cnt[nums[right]]++</text>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#333">② 超频只可能发生在新元素 x 上：while (cnt[x] &gt; k) 逐个弹出左端</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#333">③ 每步更新 ans = max(ans, right − left + 1)</text>

  <rect x="24" y="312" width="512" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#333">left、right 都只增不减 → 总位移 2n → 整体 O(n)</text>
</svg>
