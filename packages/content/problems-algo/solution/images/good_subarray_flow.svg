<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口流程：增量计数 + 收缩定位</text>

  <!-- Init -->
  <rect x="100" y="44" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#555">left=0, pairs=0, ans=0, cnt={}</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="90" y="126" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for right in 0..n−1</text>
  <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="#555">右指针遍历每个位置</text>

  <path d="M 230 174 L 230 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- add x -->
  <rect x="70" y="196" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="216" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">加入 x = nums[right]</text>
  <text x="230" y="234" text-anchor="middle" font-size="10.5" fill="#555">pairs += cnt[x]；cnt[x]++</text>

  <path d="M 230 248 L 230 266" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: pairs >= k? -->
  <polygon points="230,270 360,316 230,362 100,316" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pairs ≥ k ?</text>
  <text x="230" y="330" text-anchor="middle" font-size="10.5" fill="#777">已凑够 k 对？</text>

  <!-- Yes branch: shrink -->
  <path d="M 100 316 L 40 316 L 40 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="52" y="308" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="6" y="376" width="160" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="86" y="398" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">收缩左指针</text>
  <text x="86" y="416" text-anchor="middle" font-size="10" fill="#555">cnt[nums[left]]−−</text>
  <text x="86" y="432" text-anchor="middle" font-size="10" fill="#555">pairs −= cnt[nums[left]]</text>
  <text x="86" y="446" text-anchor="middle" font-size="10" fill="#555">left++</text>

  <!-- loop back from shrink to diamond -->
  <path d="M 86 452 L 86 476 L 230 476 L 230 362" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="120" y="470" font-size="9.5" fill="#aaa" font-style="italic">继续判 ≥ k</text>

  <!-- No branch -->
  <path d="M 360 316 L 420 316 L 420 388" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="374" y="308" font-size="11" fill="#82b366" font-weight="bold">No</text>
  <rect x="334" y="392" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="394" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计数累加</text>
  <text x="394" y="430" text-anchor="middle" font-size="10" fill="#555">ans += left</text>

  <!-- merge: no-branch back to for-loop -->
  <path d="M 394 440 L 394 476 L 300 476" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <path d="M 230 476 L 156 476" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="300" y="470" font-size="9.5" fill="#aaa" font-style="italic">下个 right</text>

  <!-- final -->
  <text x="230" y="516" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束 → return ans</text>
  <text x="230" y="536" text-anchor="middle" font-size="10.5" fill="#888">O(n) 时间 / O(n) 空间（哈希表）</text>
</svg>
