<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心算法流程：单次扫描 + 集合计数</text>

  <!-- start -->
  <rect x="210" y="50" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">开始：count = 0，seen = 空集</text>

  <!-- loop box -->
  <rect x="120" y="110" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="12" fill="#333">遍历 rolls 中每个 r</text>

  <!-- add to seen -->
  <rect x="180" y="174" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="12" fill="#333">seen.insert(r)</text>

  <!-- decision diamond -->
  <polygon points="280,232 392,278 280,324 168,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#333">|seen| == k ?</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#333">凑齐全部点数？</text>

  <!-- yes branch -->
  <text x="430" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="412" y="296" width="130" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="477" y="317" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count++</text>
  <text x="477" y="334" text-anchor="middle" font-size="11" fill="#333">seen.clear()</text>
  <path d="M 390 282 Q 430 282 440 296" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 477 296 Q 477 132 412 132" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- no branch back to loop -->
  <text x="150" y="274" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 168 278 Q 90 278 90 132 L 116 132" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end loop arrow -->
  <path d="M 440 132 Q 520 132 520 374 L 280 374" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="530" y="255" font-size="9" fill="#888" transform="rotate(0 530 255)">遍历完</text>

  <!-- return -->
  <rect x="190" y="404" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="429" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 count + 1</text>
</svg>
