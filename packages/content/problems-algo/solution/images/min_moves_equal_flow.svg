<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="380" fill="#fafafa"/>
  <text x="230" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求最小值 → 求总和 → 相减</text>

  <!-- input -->
  <rect x="130" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：数组 nums（长度 n）</text>

  <path d="M 230 88 L 230 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 1: min -->
  <rect x="100" y="108" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 1：求最小值</text>
  <text x="230" y="148" text-anchor="middle" font-size="11.5" fill="#d6a040">m = min(nums)　O(n)</text>

  <path d="M 230 158 L 230 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 2: sum -->
  <rect x="100" y="178" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 2：求总和</text>
  <text x="230" y="218" text-anchor="middle" font-size="11.5" fill="#d6a040">S = Σ nums[i]　O(n)</text>

  <path d="M 230 228 L 230 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 3: answer -->
  <rect x="80" y="248" width="300" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="230" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 3：相减得答案</text>
  <text x="230" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">moves = S − n × m</text>

  <path d="M 230 304 L 230 320" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="130" y="324" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="349" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 moves（int）</text>

  <!-- side note -->
  <text x="380" y="135" font-size="9.5" fill="#888">一遍遍历</text>
  <text x="380" y="148" font-size="9.5" fill="#888">即可同步完成</text>
  <path d="M 360 140 L 335 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
</svg>
