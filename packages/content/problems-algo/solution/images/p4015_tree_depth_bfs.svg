<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">核心观察：一趟遍历求出全部深度 —— 同层节点乘数相同</text>
  <text x="260" y="31" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">框内「编号 : 值」｜绿色数 = 该节点权重（值 × 所在层乘数）</text>

  <!-- 深度分层带 -->
  <path d="M 55 112 L 425 112" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 55 192 L 425 192" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="50" y="78" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="50" y="158" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d=2</text>
  <text x="50" y="238" text-anchor="end" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">d=3</text>
  <text x="50" y="262" text-anchor="end" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">h=3</text>

  <!-- 树边 -->
  <path d="M 164 80 Q 118 102 92 124" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 170 80 Q 173 102 170 124" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 176 80 Q 222 102 248 124" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 164 160 Q 148 182 137 204" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 176 160 Q 192 182 203 204" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 节点 -->
  <rect x="146" y="46" width="48" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0 : 5</text>

  <rect x="66" y="126" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1 : 2</text>
  <rect x="146" y="126" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2 : 3</text>
  <rect x="226" y="126" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3 : 1</text>

  <rect x="111" y="206" width="48" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4 : 4</text>
  <rect x="181" y="206" width="48" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5 : 6</text>

  <!-- 权重 -->
  <text x="202" y="70" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→15</text>
  <text x="90" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→4</text>
  <text x="170" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→6</text>
  <text x="250" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→2</text>
  <text x="135" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→4</text>
  <text x="205" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">→6</text>

  <!-- 每层乘数徽章 -->
  <text x="464" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">乘数 h−d+1</text>
  <rect x="436" y="51" width="56" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">×3</text>
  <rect x="436" y="131" width="56" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">×2</text>
  <rect x="436" y="211" width="56" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">×1</text>

  <!-- 结论框 -->
  <rect x="30" y="286" width="460" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5527" filter="url(#rough2)">权重(i) = nums[i] × (h − d + 1)：15 + 4 + 6 + 2 + 4 + 6 = 37</text>
  <text x="260" y="321" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">乘数只依赖深度 d：同一层共用一个乘数，越深越小（最深层恰为 ×1）</text>
  <text x="260" y="337" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">depth[v] = depth[parent[v]] + 1：从根一趟 BFS / DFS 即得全部深度与 h</text>
</svg>
