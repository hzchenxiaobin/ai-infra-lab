<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1, 2, 34, 3, 4, 5, 7, 23, 12]</text>

  <!-- Table header -->
  <rect x="50" y="44" width="460" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="63" text-anchor="start" font-size="11" fill="#555" font-weight="bold">i</text>
  <text x="120" y="63" text-anchor="start" font-size="11" fill="#555" font-weight="bold">arr[i]</text>
  <text x="180" y="63" text-anchor="start" font-size="11" fill="#555" font-weight="bold">奇/偶</text>
  <text x="240" y="63" text-anchor="start" font-size="11" fill="#555" font-weight="bold">cnt</text>
  <text x="290" y="63" text-anchor="start" font-size="11" fill="#555" font-weight="bold">动作</text>

  <!-- Vertical column separators -->
  <line x1="110" y1="44" x2="110" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="44" x2="170" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="44" x2="230" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="44" x2="280" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: i=0, arr=1, odd, cnt=1 -->
  <rect x="50" y="72" width="460" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="91" text-anchor="start" font-size="11" fill="#333">0</text>
  <text x="120" y="91" text-anchor="start" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="180" y="91" text-anchor="start" font-size="11" fill="#b85450">奇</text>
  <text x="245" y="91" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="290" y="91" text-anchor="start" font-size="11" fill="#666">cnt++ → cnt=1</text>

  <!-- Row 1: i=1, arr=2, even, cnt=0 -->
  <rect x="50" y="100" width="460" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="119" text-anchor="start" font-size="11" fill="#333">1</text>
  <text x="120" y="119" text-anchor="start" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="180" y="119" text-anchor="start" font-size="11" fill="#446688">偶</text>
  <text x="245" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="290" y="119" text-anchor="start" font-size="11" fill="#666">cnt=0（清零）</text>

  <!-- Row 2: i=2, arr=34, even, cnt=0 -->
  <rect x="50" y="128" width="460" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="147" text-anchor="start" font-size="11" fill="#333">2</text>
  <text x="120" y="147" text-anchor="start" font-size="11" fill="#333" font-weight="bold">34</text>
  <text x="180" y="147" text-anchor="start" font-size="11" fill="#446688">偶</text>
  <text x="245" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="290" y="147" text-anchor="start" font-size="11" fill="#666">cnt=0（保持）</text>

  <!-- Row 3: i=3, arr=3, odd, cnt=1 -->
  <rect x="50" y="156" width="460" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="start" font-size="11" fill="#333">3</text>
  <text x="120" y="175" text-anchor="start" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="180" y="175" text-anchor="start" font-size="11" fill="#b85450">奇</text>
  <text x="245" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="290" y="175" text-anchor="start" font-size="11" fill="#666">cnt++ → cnt=1</text>

  <!-- Row 4: i=4, arr=4, even, cnt=0 -->
  <rect x="50" y="184" width="460" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="203" text-anchor="start" font-size="11" fill="#333">4</text>
  <text x="120" y="203" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="180" y="203" text-anchor="start" font-size="11" fill="#446688">偶</text>
  <text x="245" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="290" y="203" text-anchor="start" font-size="11" fill="#666">cnt=0（清零）</text>

  <!-- Row 5: i=5, arr=5, odd, cnt=1 -->
  <rect x="50" y="212" width="460" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="231" text-anchor="start" font-size="11" fill="#333">5</text>
  <text x="120" y="231" text-anchor="start" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="180" y="231" text-anchor="start" font-size="11" fill="#b85450">奇</text>
  <text x="245" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="290" y="231" text-anchor="start" font-size="11" fill="#666">cnt++ → cnt=1</text>

  <!-- Row 6: i=6, arr=7, odd, cnt=2 -->
  <rect x="50" y="240" width="460" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="259" text-anchor="start" font-size="11" fill="#333">6</text>
  <text x="120" y="259" text-anchor="start" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="180" y="259" text-anchor="start" font-size="11" fill="#b85450">奇</text>
  <text x="245" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="290" y="259" text-anchor="start" font-size="11" fill="#666">cnt++ → cnt=2</text>

  <!-- Row 7: i=7, arr=23, odd, cnt=3 — HIGHLIGHTED -->
  <rect x="50" y="268" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="start" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="120" y="287" text-anchor="start" font-size="11" fill="#333" font-weight="bold">23</text>
  <text x="180" y="287" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">奇</text>
  <text x="245" y="287" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="290" y="287" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">cnt++ → cnt=3 → 返回 true ⭐</text>

  <!-- Row 8: i=8, not reached -->
  <rect x="50" y="296" width="460" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="315" text-anchor="start" font-size="11" fill="#aaa">8</text>
  <text x="120" y="315" text-anchor="start" font-size="11" fill="#aaa" font-weight="bold">12</text>
  <text x="180" y="315" text-anchor="start" font-size="11" fill="#aaa">—</text>
  <text x="245" y="315" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="290" y="315" text-anchor="start" font-size="11" fill="#aaa">未执行（已短路返回）</text>

  <!-- Summary box -->
  <rect x="80" y="340" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=7 时 cnt 达到 3，立即返回 true</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#888">三连奇数 [5, 7, 23] 位于下标 5, 6, 7</text>
</svg>
