<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="580" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：一次遍历维护最近候选</text>

  <!-- ===== Example 1 panel ===== -->
  <rect x="24" y="40" width="492" height="240" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="62" font-size="12.5" fill="#446688" font-weight="bold">示例 1：nums = [−4, −2, 1, 4, 8] → 1</text>

  <!-- header row -->
  <rect x="40" y="74" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="91" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">num</text>
  <rect x="104" y="74" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="91" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">|num|</text>
  <rect x="172" y="74" width="232" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="91" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">判定</text>
  <rect x="408" y="74" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="446" y="91" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans</text>

  <!-- row: 初始 ans=−4 -->
  <rect x="40" y="102" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="119" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始</text>
  <rect x="104" y="102" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="119" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="102" width="232" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="119" font-size="11" fill="#888">ans = nums[0] = −4</text>
  <rect x="408" y="102" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="119" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−4</text>

  <!-- row: num=−2 → 更新 -->
  <rect x="40" y="130" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">−2</text>
  <rect x="104" y="130" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="172" y="130" width="232" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="147" font-size="11" fill="#4a7a3a" font-weight="bold">2 &lt; 4 ✓ 更近 → 更新</text>
  <rect x="408" y="130" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="446" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">−2</text>

  <!-- row: num=1 → 更新（最终赢家）-->
  <rect x="40" y="158" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="104" y="158" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="172" y="158" width="232" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="175" font-size="11" fill="#4a7a3a" font-weight="bold">1 &lt; 2 ✓ 更近 → 更新 ★</text>
  <rect x="408" y="158" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row: num=4 → 跳过 -->
  <rect x="40" y="186" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="203" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <rect x="104" y="186" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="203" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <rect x="172" y="186" width="232" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="203" font-size="11" fill="#b85450">4 ≮ 1，4 ≠ 1 → 跳过</text>
  <rect x="408" y="186" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="446" y="203" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">1</text>

  <!-- row: num=8 → 跳过 -->
  <rect x="40" y="214" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="231" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">8</text>
  <rect x="104" y="214" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="231" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">8</text>
  <rect x="172" y="214" width="232" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="231" font-size="11" fill="#b85450">8 ≮ 1 → 跳过</text>
  <rect x="408" y="214" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="446" y="231" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">1</text>

  <!-- result bar -->
  <rect x="40" y="248" width="444" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="262" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遍历结束，|1| = 1 最小 → 返回 1 ✓</text>

  <!-- ===== Example 2 panel ===== -->
  <rect x="24" y="292" width="492" height="276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="314" font-size="12.5" fill="#d6a040" font-weight="bold">示例 2：nums = [2, −1, 1] → 1（平局取大）</text>

  <!-- header row -->
  <rect x="40" y="326" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="343" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">num</text>
  <rect x="104" y="326" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="343" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">|num|</text>
  <rect x="172" y="326" width="232" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="343" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">判定</text>
  <rect x="408" y="326" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="446" y="343" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans</text>

  <!-- row: 初始 ans=2 -->
  <rect x="40" y="354" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="371" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始</text>
  <rect x="104" y="354" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="136" y="371" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="172" y="354" width="232" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="371" font-size="11" fill="#888">ans = nums[0] = 2</text>
  <rect x="408" y="354" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="371" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <!-- row: num=−1 → 更新 -->
  <rect x="40" y="382" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="399" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">−1</text>
  <rect x="104" y="382" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="399" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="172" y="382" width="232" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="399" font-size="11" fill="#4a7a3a" font-weight="bold">1 &lt; 2 ✓ 更近 → 更新</text>
  <rect x="408" y="382" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="446" y="399" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">−1</text>

  <!-- row: num=1 → 平局取大（关键）-->
  <rect x="40" y="410" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="427" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="104" y="410" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="427" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="172" y="410" width="232" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="427" font-size="11" fill="#4a7a3a" font-weight="bold">1==1 且 1&gt;−1 ✓ 平局取大 ★</text>
  <rect x="408" y="410" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="427" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- result bar -->
  <rect x="40" y="442" width="444" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="262" y="459" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">|−1| 与 |1| 都等于 1，取较大值 1 → 返回 1 ✓</text>

  <!-- key note -->
  <rect x="40" y="476" width="444" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="498" font-size="11.5" fill="#d6a040" font-weight="bold">★ 平局判定要点</text>
  <text x="52" y="518" font-size="11" fill="#666">· 仅当 |num| == |ans|（等距）时才比较大小</text>
  <text x="52" y="536" font-size="11" fill="#666">· 此时取 max(num, ans)：正数胜，因为正数本身就是较大值</text>
  <text x="52" y="552" font-size="11" fill="#666">· 示例 2 第 3 步正是此规则触发，把 ans 从 −1 改为 1</text>
</svg>
