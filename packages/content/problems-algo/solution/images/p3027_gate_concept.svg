<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">固定 A 之后：maxY 是一道只升不降的闸门</text>

  <!-- axes -->
  <path d="M 46 316 L 484 316" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 46 316 L 46 56" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="490" y="330" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="36" y="52" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <!-- scan direction -->
  <path d="M 96 300 L 430 300" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="3 6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">j 向右扫（排序保证中间点 x 都落在 [x_A, x_B] 内）</text>

  <!-- point A -->
  <circle cx="80" cy="112" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <text x="66" y="106" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>

  <!-- ceiling line y_A -->
  <path d="M 46 112 L 484 112" stroke="#446688" stroke-width="1.6" stroke-dasharray="8 6" fill="none" filter="url(#rough2)"/>
  <text x="424" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y_A · 天花板</text>

  <!-- gate line maxY -->
  <path d="M 46 232 L 484 232" stroke="#d6a040" stroke-width="2" stroke-dasharray="10 6" fill="none" filter="url(#rough2)"/>
  <text x="404" y="250" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">maxY · 闸门（当前）</text>

  <!-- gate raise arrow -->
  <path d="M 320 228 C 316 196 314 186 312 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="196" font-size="10" fill="#4a7a3a" filter="url(#rough2)">合法 B 把闸门抬到自己脚下</text>

  <!-- point above ceiling: harmless -->
  <circle cx="180" cy="72" r="5" fill="#999" filter="url(#rough2)"/>
  <text x="192" y="70" font-size="10.5" fill="#888" filter="url(#rough2)">y &gt; y_A：在天花板之上，</text>
  <text x="192" y="84" font-size="10.5" fill="#888" filter="url(#rough2)">进不了任何围栏，也不抬闸门</text>

  <!-- point on gate: previous counted B -->
  <circle cx="140" cy="232" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="128" y="256" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">刚数过的 B，闸门就停在它这</text>

  <!-- candidate between gate and ceiling: valid -->
  <circle cx="306" cy="166" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="316" y="162" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B₁</text>
  <rect x="226" y="132" width="182" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" transform="rotate(-4 317 144)"/>
  <text x="318" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" transform="rotate(-4 317 144)">maxY &lt; y_B₁ ≤ y_A → 合法 ✓</text>

  <!-- candidate below gate: blocked -->
  <circle cx="408" cy="272" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="422" y="276" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B₂</text>
  <text x="396" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">y_B₂ ≤ maxY → 前面必有人挡路 ✗</text>

  <!-- bottom note -->
  <rect x="48" y="336" width="424" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">合法性判据一次比较搞定：maxY &lt; y_B ≤ y_A 即计数，</text>
  <text x="260" y="376" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">坐标是 ±1 还是 ±10⁹ 全无影响——只做比较，从不关心具体数值</text>
</svg>
