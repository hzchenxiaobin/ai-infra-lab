<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "Let's take LeetCode contest"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">i 逐词推进，每词扫描到空格定尾、原地反转</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步</text>
  <rect x="80" y="60" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">单词</text>
  <rect x="160" y="60" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">[start, i)</text>
  <rect x="280" y="60" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">反转后</text>
  <rect x="400" y="60" width="140" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i 落点</text>

  <!-- Step 1: Let's -->
  <rect x="20" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="80" y="90" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Let's</text>
  <rect x="160" y="90" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#333">[0, 5)</text>
  <rect x="280" y="90" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s'teL</text>
  <rect x="400" y="90" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="110" text-anchor="middle" font-size="10" fill="#8a6a20">i=5（空格），跳到 6</text>

  <!-- Step 2: take -->
  <rect x="20" y="124" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="80" y="124" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">take</text>
  <rect x="160" y="124" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="11" fill="#333">[6, 10)</text>
  <rect x="280" y="124" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ekat</text>
  <rect x="400" y="124" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="144" text-anchor="middle" font-size="10" fill="#8a6a20">i=10（空格），跳到 11</text>

  <!-- Step 3: LeetCode -->
  <rect x="20" y="158" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="80" y="158" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="120" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">LeetCode</text>
  <rect x="160" y="158" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="178" text-anchor="middle" font-size="11" fill="#333">[11, 19)</text>
  <rect x="280" y="158" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">edoCteeL</text>
  <rect x="400" y="158" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="178" text-anchor="middle" font-size="10" fill="#8a6a20">i=19（空格），跳到 20</text>

  <!-- Step 4: contest -->
  <rect x="20" y="192" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="80" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">contest</text>
  <rect x="160" y="192" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#333">[20, 27)</text>
  <rect x="280" y="192" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tsetnoc</text>
  <rect x="400" y="192" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="212" text-anchor="middle" font-size="10" fill="#8a6a20">i=27 = n，结束</text>

  <!-- Step 5: 终止 -->
  <rect x="20" y="226" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="246" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">5</text>
  <rect x="80" y="226" width="80" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="246" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="160" y="226" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="246" text-anchor="middle" font-size="11" fill="#999">i = n = 27</text>
  <rect x="280" y="226" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回结果</text>
  <rect x="400" y="226" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="246" text-anchor="middle" font-size="10" fill="#999">循环退出</text>

  <!-- 最终结果 -->
  <rect x="30" y="278" width="500" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出：</text>
  <text x="42" y="316" font-size="12" fill="#333" font-weight="bold">"s'teL ekat edoCteeL tsetnoc"</text>

  <!-- 对撞双指针细节 -->
  <rect x="30" y="340" width="500" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="360" font-size="11" fill="#8a6a20" font-weight="bold">单词内反转细节（以 LeetCode 为例，[11, 19)）：</text>
  <text x="42" y="378" font-size="10" fill="#666">left=11, right=18 → swap(L, e) → "e...L"</text>
  <text x="42" y="394" font-size="10" fill="#666">left=12, right=17 → swap(e, d) → "ed...dL"  略作示意</text>
  <text x="42" y="412" font-size="10" fill="#666">⇒ 套 344 模板：while (left &lt; right) swap(s[left++], s[right--]);</text>
</svg>
