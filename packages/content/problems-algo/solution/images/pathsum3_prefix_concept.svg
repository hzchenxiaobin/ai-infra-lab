<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树上前缀和：向下路径和 = prefix(B) − prefix(parent(A))</text>

  <!-- vertical path nodes -->
  <!-- virtual root -->
  <ellipse cx="180" cy="66" rx="34" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="180" y="71" text-anchor="middle" font-size="12" fill="#8a6a20">虚根</text>
  <text x="180" y="100" text-anchor="middle" font-size="10" fill="#8a6a20">prefix = 0</text>

  <!-- node 10 -->
  <circle cx="180" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="118" y="145" text-anchor="middle" font-size="10" fill="#446688">prefix=10</text>

  <!-- node 5 -->
  <circle cx="180" cy="210" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="118" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">prefix=15</text>

  <!-- node 3 -->
  <circle cx="180" cy="280" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="118" y="285" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">prefix=18</text>

  <!-- edges -->
  <path d="M 180 86 L 180 118" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 160 L 180 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 230 L 180 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bracket spanning 5 -> 3 -->
  <path d="M 208 192 Q 226 192 226 210 L 226 280 Q 226 298 244 298" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="252" y="240" font-size="11" fill="#b85450" font-weight="bold">路径 5→3</text>

  <!-- right side: equation -->
  <rect x="300" y="120" width="200" height="186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="146" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">path(5→3)</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#333">= prefix(3) − prefix(10)</text>
  <text x="400" y="194" text-anchor="middle" font-size="11" fill="#333">= 18 − 10</text>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 8 = target ✓</text>
  <line x1="320" y1="236" x2="480" y2="236" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#555">需 prefix(parent(A))</text>
  <text x="400" y="274" text-anchor="middle" font-size="10" fill="#555">= prefix(B) − target</text>
  <text x="400" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">→ 哈希表查频次</text>

  <!-- bottom generalization -->
  <rect x="40" y="326" width="460" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#333">每个结束节点 B：在祖先链中数 prefix = prefix(B) − target 的个数</text>
</svg>
