<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">mat = [[1,2,3],[4,5,6],[7,8,9]],  target = 13,  cap = 83</text>

  <!-- ===== After row 0 ===== -->
  <text x="56" y="88" font-size="11" fill="#666" font-weight="bold">第 0 行后</text>
  <text x="56" y="104" font-size="10" fill="#888">{0}+{1,2,3}</text>

  <g font-size="13">
    <rect x="120" y="76" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="140" y="97" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="168" y="76" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="188" y="97" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="216" y="76" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="236" y="97" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="280" y="97" font-size="11" fill="#888">→ dp = {1, 2, 3}</text>

  <!-- Arrow -->
  <path d="M 300 116 L 300 130" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== After row 1 ===== -->
  <text x="56" y="160" font-size="11" fill="#666" font-weight="bold">第 1 行后</text>
  <text x="56" y="176" font-size="10" fill="#888">dp+{4,5,6}</text>

  <g font-size="12">
    <rect x="120" y="148" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="138" y="167" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="164" y="148" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="182" y="167" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="208" y="148" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="226" y="167" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <rect x="252" y="148" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="167" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="296" y="148" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="314" y="167" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
  </g>
  <text x="350" y="167" font-size="11" fill="#888">→ dp = {5, 6, 7, 8, 9}</text>

  <!-- Arrow -->
  <path d="M 300 188 L 300 202" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== After row 2 ===== -->
  <text x="56" y="232" font-size="11" fill="#666" font-weight="bold">第 2 行后</text>
  <text x="56" y="248" font-size="10" fill="#888">dp+{7,8,9}</text>

  <g font-size="11">
    <rect x="100" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="117" y="238" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <rect x="140" y="220" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="157" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="180" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="197" y="238" text-anchor="middle" fill="#446688" font-weight="bold">14</text>
    <rect x="220" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="237" y="238" text-anchor="middle" fill="#446688" font-weight="bold">15</text>
    <rect x="260" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="277" y="238" text-anchor="middle" fill="#446688" font-weight="bold">16</text>
    <rect x="300" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="317" y="238" text-anchor="middle" fill="#446688" font-weight="bold">17</text>
    <rect x="340" y="220" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="357" y="238" text-anchor="middle" fill="#446688" font-weight="bold">18</text>
  </g>
  <text x="395" y="238" font-size="11" fill="#888">→ dp = {12, …, 18}</text>

  <!-- Arrow -->
  <path d="M 300 258 L 300 272" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Answer ===== -->
  <rect x="150" y="278" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">target = 13,  dp 含 13</text>
  <text x="300" y="314" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">|13 − 13| = 0  ✓</text>

  <!-- Note -->
  <text x="300" y="348" text-anchor="middle" font-size="10" fill="#888">本例所有和 ≤ 18 ≪ cap = 83，封顶未触发；较大实例中封顶可大幅剪枝</text>
</svg>
