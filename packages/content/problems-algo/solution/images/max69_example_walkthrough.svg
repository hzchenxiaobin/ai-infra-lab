<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三个示例演算</text>

  <rect x="30" y="52" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入</text>
  <text x="190" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最左 6 位置</text>
  <text x="310" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">改动</text>
  <text x="430" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出</text>

  <rect x="30" y="90" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9669</text>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">百位 (10²)</text>
  <text x="310" y="120" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6→9，+300</text>
  <text x="430" y="120" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">9969</text>

  <rect x="30" y="144" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9996</text>
  <text x="190" y="174" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">个位 (10⁰)</text>
  <text x="310" y="174" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6→9，+3</text>
  <text x="430" y="174" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">9999</text>

  <rect x="30" y="198" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9999</text>
  <text x="190" y="228" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">无 6</text>
  <text x="310" y="228" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">不改，+0</text>
  <text x="430" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">9999</text>

  <rect x="30" y="270" width="460" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">规律：找到最左 6（=最高位 6）</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收益 = 3 × 10^k（k 为该位权值）</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">无 6 则原数即最大</text>
</svg>
