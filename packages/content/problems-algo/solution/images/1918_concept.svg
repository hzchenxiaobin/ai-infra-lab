<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">二分答案：阈值 mid 越大 → 和 ≤ mid 的子数组数 count(mid) 越多（单调递增）</text>

  <!-- ===== Subarray sums ===== -->
  <text x="30" y="52" font-size="12" fill="#888">nums = [2, 1, 3]，全部 6 个子数组和：</text>

  <!-- subarray sum chips -->
  <rect x="40" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="68" y="102" text-anchor="middle" font-size="9" fill="#999">[2]</text>

  <rect x="106" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="134" y="102" text-anchor="middle" font-size="9" fill="#999">[1]</text>

  <rect x="172" y="64" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="200" y="102" text-anchor="middle" font-size="9" fill="#999">[3]</text>

  <rect x="238" y="64" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="266" y="102" text-anchor="middle" font-size="9" fill="#999">[2,1]</text>

  <rect x="304" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="332" y="102" text-anchor="middle" font-size="9" fill="#999">[1,3]</text>

  <rect x="370" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="398" y="102" text-anchor="middle" font-size="9" fill="#999">[2,1,3]</text>

  <text x="448" y="82" font-size="11" fill="#888">排序：[1,2,3,3,4,6]</text>
  <text x="448" y="98" font-size="11" fill="#d6a040" font-weight="bold">k=4 → 第4小 = 3</text>

  <!-- arrow down -->
  <path d="M 290 116 L 290 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="128" font-size="11" fill="#888">count(mid) 单调递增</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="70" y1="150" x2="70" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="430" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="156" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="434" y="334" font-size="10" fill="#888">mid →</text>
  <text x="64" y="334" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y axis ticks -->
  <text x="64" y="304" text-anchor="end" font-size="9" fill="#aaa">4</text>
  <text x="64" y="180" text-anchor="end" font-size="9" fill="#aaa">6</text>

  <!-- step curve: mid 1→cnt1, 2→2, 3→4, 4→5, 5→5, 6→6 -->
  <!-- x: mid 1..6 at 140,190,240,290,340,390 ; y: cnt 0..6 at 330,305,280,255,230,205,180 -->
  <path d="M 90 330 L 140 330 L 140 305 L 190 305 L 190 280 L 240 280 L 240 230 L 290 230 L 290 205 L 390 205 L 390 180 L 420 180" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="222" font-size="11" fill="#446688" font-weight="bold">mid ↑ ⇒ count ↑</text>

  <!-- mid axis labels -->
  <text x="140" y="346" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="190" y="346" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="240" y="346" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="290" y="346" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="340" y="346" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="390" y="346" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- k threshold line -->
  <line x1="70" y1="230" x2="430" y2="230" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="434" y="234" font-size="11" fill="#b85450" font-weight="bold">k = 4</text>

  <!-- answer point at mid=3 (count jumps to 4) -->
  <circle cx="240" cy="230" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="240" y1="230" x2="240" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="240" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid* = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="110" y="300" font-size="10" fill="#b85450">count &lt; k ✗</text>
  <text x="330" y="300" font-size="10" fill="#4a7a3a">count ≥ k ✓</text>

  <!-- right summary note -->
  <rect x="448" y="150" width="120" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="508" y="174" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="508" y="196" text-anchor="middle" font-size="11" fill="#666">mid ∈ [min, sum]</text>
  <text x="508" y="216" text-anchor="middle" font-size="11" fill="#666">求最小的 mid</text>
  <text x="508" y="236" text-anchor="middle" font-size="11" fill="#666">使 count(mid) ≥ k</text>
  <text x="508" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>

  <!-- note about jump -->
  <rect x="70" y="372" width="500" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">mid=3 时 count 从 2 跳到 4（两个子数组和同为 3），全正 → 滑动窗口 O(n) 统计 count(mid)</text>
  <text x="320" y="406" text-anchor="middle" font-size="10" fill="#888">同骨架：719 数对距离 / 378 矩阵第K小 / 410 分割最大值，差异只在 count() 的实现</text>
</svg>
