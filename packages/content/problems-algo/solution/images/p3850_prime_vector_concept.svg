<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">val 的真身：质因数指数向量 (x, y, z)，乘除 = 向量加减</text>

  <!-- 左：元素 → delta 换算表 -->
  <g filter="url(#rough2)">
    <text x="108" y="46" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">nums[i] → delta（2,3,5 的指数）</text>
    <rect x="30" y="52" width="156" height="140" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="108" y="76"  text-anchor="middle" font-size="11.5" fill="#333">1 → (0, 0, 0)</text>
    <text x="108" y="98"  text-anchor="middle" font-size="11.5" fill="#333">2 → (1, 0, 0)</text>
    <text x="108" y="120" text-anchor="middle" font-size="11.5" fill="#333">3 → (0, 1, 0)</text>
    <text x="108" y="142" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4 → (2, 0, 0)</text>
    <text x="108" y="164" text-anchor="middle" font-size="11.5" fill="#333">5 → (0, 0, 1)</text>
    <text x="108" y="186" text-anchor="middle" font-size="11.5" fill="#333">6 → (1, 1, 0)</text>
  </g>

  <!-- 右：三种操作的向量语义 -->
  <g filter="url(#rough2)">
    <text x="372" y="46" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">每个下标三选一，只动向量不动别的</text>
    <rect x="212" y="54" width="320" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="372" y="71" text-anchor="middle" font-size="11.5" fill="#2f5d24">× nums[i] ⟹ (x,y,z) + (dx,dy,dz)</text>
    <rect x="212" y="84" width="320" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="372" y="101" text-anchor="middle" font-size="11.5" fill="#8a6d1a">÷ nums[i] ⟹ (x,y,z) − (dx,dy,dz)</text>
    <rect x="212" y="114" width="320" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="372" y="131" text-anchor="middle" font-size="11.5" fill="#33506b">保持不变 ⟹ (x,y,z) + (0,0,0)</text>
    <rect x="212" y="150" width="320" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="372" y="166" text-anchor="middle" font-size="11.5" fill="#8a3030">除法 → 负指数 = 挪到分母，</text>
    <text x="372" y="182" text-anchor="middle" font-size="11.5" fill="#8a3030">val 中途是分数也照样算（如 2/3 ↔ (1, −1, 0)）</text>
  </g>

  <!-- 中：示例 2 的一条路径 -->
  <g filter="url(#rough2)">
    <text x="280" y="214" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">示例 2 的一条路：nums = [4, 6, 3]，k = 2</text>
    <rect x="52"  y="226" width="72" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88"  y="247" text-anchor="middle" font-size="12" fill="#333">(0,0,0)</text>
    <rect x="186" y="226" width="72" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="222" y="247" text-anchor="middle" font-size="12" fill="#333">(2,0,0)</text>
    <rect x="320" y="226" width="72" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="356" y="247" text-anchor="middle" font-size="12" fill="#8a3030">(1,−1,0)</text>
    <rect x="454" y="226" width="72" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="490" y="247" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">(1,0,0)</text>
    <path d="M 126 242 L 182 242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 260 242 L 316 242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 394 242 L 450 242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="155" y="234" text-anchor="middle" font-size="11" fill="#2f5d24">×4</text>
    <text x="288" y="234" text-anchor="middle" font-size="11" fill="#8a6d1a">÷6</text>
    <text x="422" y="234" text-anchor="middle" font-size="11" fill="#2f5d24">×3</text>
    <text x="88"  y="274" text-anchor="middle" font-size="11" fill="#666">val = 1</text>
    <text x="222" y="274" text-anchor="middle" font-size="11" fill="#666">val = 4</text>
    <text x="356" y="274" text-anchor="middle" font-size="11" fill="#b85450">val = 2/3</text>
    <text x="490" y="274" text-anchor="middle" font-size="11" fill="#2f5d24">val = 2 ✓</text>
  </g>

  <!-- 底：k 的分解检查 -->
  <g filter="url(#rough2)">
    <rect x="55" y="292" width="450" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="313" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">先分解 k = 2^a · 3^b · 5^c</text>
    <text x="280" y="333" text-anchor="middle" font-size="11.5" fill="#8a6d1a">分解后余数 ≠ 1（含其它质因子）→ 直接返回 0；终态必须 (x,y,z) = (a,b,c)</text>
  </g>
</svg>
