<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrN" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：筛 → 倒扫建 nxt 表 → 一趟扫描按奇偶累加</text>

  <!-- 开始 -->
  <rect x="215" y="30" width="90" height="26" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- ① 埃氏筛 -->
  <rect x="180" y="70" width="160" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 埃氏筛标记 np[]</text>
  <text x="260" y="103" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">上界 V = 1e5+200，np[1] = true</text>

  <!-- ② 倒扫建表 -->
  <rect x="165" y="130" width="190" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 倒扫递推 nxt[x]</text>
  <text x="260" y="163" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">nxt[x] = x 是质数 ? x : nxt[x+1]</text>

  <!-- ③ 遍历 -->
  <rect x="180" y="190" width="160" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ 遍历 i = 0..n−1</text>
  <text x="260" y="222" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（各位独立，循环 n 次）</text>

  <!-- 判断菱形 -->
  <polygon points="260,242 330,278 260,314 190,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="10.5" fill="#8f3a34" font-weight="bold" filter="url(#rough2)">i 是偶数？</text>

  <!-- 是 → 蓝盒（右上） -->
  <rect x="370" y="200" width="140" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="221" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans += nxt[x] − x</text>
  <text x="440" y="240" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">偶数位：查表跳到</text>
  <text x="440" y="251" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">下一个质数</text>

  <!-- 否 → 橙盒（左下） -->
  <rect x="30" y="252" width="150" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="271" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans += np[x] ? 0</text>
  <text x="105" y="287" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">: (x==2 ? 2 : 1)</text>
  <text x="105" y="304" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">奇数位：闭式，无需查表</text>

  <!-- 汇合：返回 -->
  <rect x="215" y="326" width="90" height="26" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 箭头 -->
  <path d="M 260 56 L 260 66" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <path d="M 260 112 L 260 126" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <path d="M 260 172 L 260 186" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <path d="M 260 228 L 260 238" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <path d="M 330 278 C 355 278, 355 234, 366 230" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="262" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 190 278 C 170 278, 175 282, 184 283" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="170" y="268" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 440 256 L 440 339 L 309 339" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 105 316 L 105 339 L 211 339" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
