<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#fdfcf7"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">统计重复个数：贪心子序列匹配 + 状态周期加速</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- str1 = [s1, n1] -->
  <text x="70" y="86" font-size="13" font-weight="bold" fill="#2b6e9e">str1 = [s1, n1]</text>
  <g filter="url(#sk)">
    <rect x="170" y="72" width="78" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="252" y="72" width="78" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="334" y="72" width="78" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="416" y="72" width="78" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="209" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">s1</text>
  <text x="291" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">s1</text>
  <text x="373" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">s1</text>
  <text x="455" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">s1</text>
  <text x="510" y="94" font-size="14" fill="#888">. . .  (共 n1 个 s1)</text>

  <!-- greedy matching: one s2 across s1 blocks -->
  <text x="70" y="148" font-size="13" font-weight="bold" fill="#7a5415">贪心匹配 s2</text>
  <g filter="url(#sk2)">
    <rect x="170" y="134" width="78" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="209" y="154" text-anchor="middle" font-size="11" fill="#7a5415">第 0 轮 s1</text>
  <!-- s2 chars being matched inside -->
  <g filter="url(#sk2)">
    <rect x="184" y="178" width="24" height="24" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="178" width="24" height="24" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="196" y="195" text-anchor="middle" font-size="11" fill="#2e6e2e">s2[0]</text>
  <text x="228" y="195" text-anchor="middle" font-size="11" fill="#2e6e2e">s2[1]</text>
  <path d="M 196 164 L 196 176" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <path d="M 228 164 L 228 176" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="260" y="195" font-size="11" fill="#b85450">→ 完成一个 s2，计数 +1</text>

  <!-- cross-round state -->
  <text x="70" y="240" font-size="13" font-weight="bold" fill="#b85450">跨轮状态 s2pos</text>
  <g filter="url(#sk)">
    <rect x="170" y="226" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="252" y="226" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="334" y="226" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="209" y="248" text-anchor="middle" font-size="12" fill="#b85450">pos=k</text>
  <text x="291" y="248" text-anchor="middle" font-size="12" fill="#b85450">pos=k'</text>
  <text x="373" y="248" text-anchor="middle" font-size="12" fill="#b85450">pos=k''</text>
  <path d="M 248 243 L 252 243" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 243 L 334 243" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)">
    <rect x="430" y="220" width="220" height="48" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-dasharray="5 3" stroke-width="1.3"/>
  </g>
  <text x="540" y="242" text-anchor="middle" font-size="12" fill="#7a5415">s2pos ∈ {0, 1, …, |s2|−1}</text>
  <text x="540" y="258" text-anchor="middle" font-size="11" fill="#888">仅 |s2| 种 → 鸽笼 → 必现循环节</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="120" y="310" width="660" height="104" rx="10" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="450" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">最终换算</text>
  <text x="200" y="368" font-size="13" fill="#444">C = str1 中累计完整匹配出的 s2 个数</text>
  <text x="200" y="392" font-size="13" fill="#444">m = ⌊ C / n2 ⌋</text>
  <text x="430" y="380" font-size="11" fill="#888">（[str2, m] = s2 重复 n2·m 次，</text>
  <text x="430" y="394" font-size="11" fill="#888">  故 m = 能匹配的 s2 总数 ÷ n2）</text>
</svg>
