<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">原型链逐层比对：obj 是否落在 classFunction.prototype 这条链上？</text>

  <!-- chain boxes: obj -> Dog.prototype -> Animal.prototype(target) -> Object.prototype -> null -->
  <!-- y=130, box w=104 h=54 -->
  <rect x="14"  y="110" width="104" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66"  y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj</text>
  <text x="66"  y="148" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(new Dog())</text>

  <rect x="134" y="110" width="104" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Dog.prototype</text>

  <rect x="254" y="110" width="104" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="306" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">Animal.prototype</text>

  <rect x="374" y="110" width="104" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Object.prototype</text>

  <rect x="494" y="110" width="74" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="531" y="140" text-anchor="middle" font-size="11" fill="#8a6d20" filter="url(#rough2)">null</text>

  <!-- arrows between boxes -->
  <path d="M118,137 L130,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M238,137 L250,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M358,137 L370,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M478,137 L492,137" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- target marker -->
  <path d="M306,182 L306,168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="306" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">classFunction.prototype 命中 → 返回 true</text>

  <!-- bottom note -->
  <rect x="40" y="228" width="500" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="254" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">💡 Object.getPrototypeOf(原始值) 会自动装箱：</text>
  <text x="60" y="276" font-size="12" fill="#2f5d24" filter="url(#rough2)">getPrototypeOf(5) → Number.prototype，故 5 也是 Number 实例</text>
  <text x="60" y="295" font-size="11" fill="#5a7a52" filter="url(#rough2)">（而裸 5 instanceof Number 为 false，正是本题要规避的陷阱）</text>
</svg>
