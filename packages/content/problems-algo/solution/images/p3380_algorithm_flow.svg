<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 690"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="690" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：枚举对角点对 → 三道关卡 → 更新答案</text>

  <!-- step 1 -->
  <rect x="140" y="48" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 点集存入哈希表 S，ans = −1</text>
  <path d="M260,84 L260,110" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="105" y="112" width="310" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 枚举点对 points[i], points[j]（i &lt; j）作为对角点</text>
  <path d="M260,148 L260,176" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,178 378,216 260,254 142,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">x₁ = x₂ 或 y₁ = y₂ ？</text>
  <text x="336" y="208" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M378,216 L432,216" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="272" y="272" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M260,254 L260,284" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="260,286 378,324 260,362 142,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">(x₁,y₂) 与 (x₂,y₁)</text>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">都在 S 中？</text>
  <text x="390" y="312" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M378,324 C416,324 442,292 455,256" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="272" y="380" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,362 L260,392" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="105" y="394" width="310" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 令 R = [lx,rx] × [ly,ry]，逐点 p 检查</text>
  <path d="M260,430 L260,460" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 3 -->
  <polygon points="260,462 385,502 260,542 135,502" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="496" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">有点 p 落在 R 内（含边界）</text>
  <text x="260" y="514" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">且不是四个角之一？</text>
  <text x="398" y="490" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M385,502 C452,500 482,400 470,256" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="272" y="560" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M260,542 L260,572" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="105" y="574" width="310" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="597" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">④ ans = max(ans, (rx−lx) × (ry−ly))</text>
  <path d="M260,610 L260,638" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="150" y="640" width="220" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="663" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">所有点对枚举完 → 返回 ans</text>

  <!-- skip box -->
  <rect x="435" y="210" width="65" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="230" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="467" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">该点对 ↺</text>

  <!-- loop back: skip -> step 2 -->
  <path d="M467,210 C467,168 448,134 417,130" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="470" y="172" font-size="10" fill="#b85450" filter="url(#rough2)">下一对</text>

  <!-- loop back: step 4 -> step 2 (left rail) -->
  <path d="M105,592 C36,560 36,164 103,132" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 46 372)" x="46" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一对</text>
</svg>
