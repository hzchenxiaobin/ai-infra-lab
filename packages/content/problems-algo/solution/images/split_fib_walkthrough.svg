<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算："1101111" → i=2, j=1：11, 0, 11, 11</text>

  <!-- input string with index ruler -->
  <text x="40" y="56" font-size="11" fill="#888">num:</text>
  <text x="124" y="44" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="166" y="44" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="208" y="44" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="250" y="44" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="292" y="44" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="334" y="44" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="376" y="44" text-anchor="middle" font-size="9" fill="#bbb">6</text>

  <!-- 7 digit cells -->
  <rect x="104" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="188" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="250" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>
  <rect x="272" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="292" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>
  <rect x="314" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>
  <rect x="356" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="376" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>

  <!-- bracket: a=num[0:2], b=num[2:3] -->
  <path d="M 104 90 L 104 96 L 186 96 L 186 90" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="145" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a = "11"</text>
  <path d="M 188 90 L 188 100 L 228 100 L 228 90" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="208" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = "0"</text>

  <!-- ===== Step 1: z = 11 + 0 = 11 ===== -->
  <text x="40" y="148" font-size="12" fill="#b85450" font-weight="bold">第 1 步：z = 11 + 0 = 11</text>
  <text x="44" y="178" font-size="11" fill="#888">求和：</text>
  <rect x="100" y="162" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>
  <text x="168" y="184" font-size="13" fill="#666" font-weight="bold">+</text>
  <rect x="184" y="162" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="240" y="184" font-size="13" fill="#666" font-weight="bold">=</text>
  <rect x="256" y="162" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="284" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>

  <text x="328" y="184" font-size="11" fill="#666">检查 num[3:5]</text>
  <!-- check cells 3,4 -->
  <rect x="230" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="261" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="352" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">idx = 3 → 5 ✓</text>
  <text x="352" y="240" font-size="10" fill="#888">path=[11,0,11], x=0, y=11</text>

  <!-- ===== Step 2: z = 0 + 11 = 11 ===== -->
  <text x="40" y="278" font-size="12" fill="#b85450" font-weight="bold">第 2 步：z = 0 + 11 = 11</text>
  <text x="44" y="308" font-size="11" fill="#888">求和：</text>
  <rect x="100" y="292" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="156" y="314" font-size="13" fill="#666" font-weight="bold">+</text>
  <rect x="172" y="292" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>
  <text x="240" y="314" font-size="13" fill="#666" font-weight="bold">=</text>
  <rect x="256" y="292" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="284" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>

  <text x="328" y="314" font-size="11" fill="#666">检查 num[5:7]</text>
  <!-- check cells 5,6 -->
  <rect x="314" y="332" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="356" y="332" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="345" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="420" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">idx = 5 → 7 ✓</text>
  <text x="420" y="370" font-size="10" fill="#888">path=[11,0,11,11]</text>

  <!-- ===== Termination ===== -->
  <text x="40" y="408" font-size="12" fill="#b85450" font-weight="bold">终止：idx = 7 = n，len(path) = 4 ≥ 3</text>

  <!-- full sequence highlight -->
  <text x="40" y="438" font-size="11" fill="#888">完整序列：</text>
  <rect x="110" y="422" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="170" y="422" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="218" y="422" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="278" y="422" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <text x="346" y="444" font-size="11" fill="#b85450" font-weight="bold">return [11,0,11,11] ✓</text>

  <!-- ===== Alternative & failure ===== -->
  <rect x="40" y="472" width="510" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="496" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">另一合法拆分：i=3, j=1 → a="110", b="1", z=111 匹配 num[4:7]</text>
  <text x="295" y="516" text-anchor="middle" font-size="11" fill="#666">序列 [110, 1, 111]，题解只需返回任意一组即可</text>
  <text x="295" y="534" text-anchor="middle" font-size="10" fill="#b85450">反例 "112358130"：1,1,2,3,5,8,13 用尽 8 位剩 "0"，8+13=21≠0，无解 → return []</text>
</svg>
