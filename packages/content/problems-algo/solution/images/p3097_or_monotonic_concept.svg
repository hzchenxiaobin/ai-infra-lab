<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：OR 只增不减 → 滑窗；OR 不可逆 → 位计数</text>

  <!-- Panel 1 -->
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 加入元素只置位：[2,1] 的 OR=3，并入 8 → OR=11</text>

  <rect x="152" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="194" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="214" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="236" y="62" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="172" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0010</text>
  <text x="214" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0001</text>
  <text x="256" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1000</text>

  <rect x="92" y="118" width="336" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">OR = 0011 ∨ 1000 = 1011 = 11 ≥ 10 ✓（bit3 被新元素置 1）</text>

  <path d="M 260 148 L 260 170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="163" font-size="11" fill="#555" filter="url(#rough2)">移出 2（收缩 left）</text>

  <!-- Panel 2 -->
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② OR 没有「减法」：11 撤销不掉 2 —— 只能按位计数</text>

  <!-- bit count table -->
  <rect x="150" y="210" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="227" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">位</text>
  <rect x="220" y="210" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="227" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">[2,1,8]</text>
  <rect x="310" y="210" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="355" y="227" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">移除 2 后</text>

  <rect x="150" y="234" width="70" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">bit3</text>
  <rect x="220" y="234" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="250" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="310" y="234" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="250" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="150" y="256" width="70" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">bit2</text>
  <rect x="220" y="256" width="90" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="272" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="310" y="256" width="90" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="272" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <rect x="150" y="278" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">bit1</text>
  <rect x="220" y="278" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="310" y="278" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ← 归 0</text>

  <rect x="150" y="300" width="70" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">bit0</text>
  <rect x="220" y="300" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="316" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="310" y="300" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="316" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="150" y="322" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="339" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">OR</text>
  <rect x="220" y="322" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="265" y="339" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="310" y="322" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="339" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <path d="M 300 348 L 300 358" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="92" y="362" width="336" height="20" fill="#ffffff" stroke="#999" stroke-width="0" rx="6" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[bit1] 归 0 ⇔ bit1 从 OR 中消失：11 → 9</text>

  <rect x="48" y="386" width="424" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不变式：cnt[b] = 窗口内第 b 位 1 的个数；窗口 OR = 所有 cnt[b] &gt; 0 的位之并</text>
</svg>
