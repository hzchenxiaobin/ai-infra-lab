<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：nums = [42, 11, 1, 97]，答案 = 2</text>

  <!-- Column headers -->
  <text x="60" y="62" font-size="11" fill="#888" font-weight="bold">j</text>
  <text x="120" y="62" font-size="11" fill="#888" font-weight="bold">x</text>
  <text x="200" y="62" font-size="11" fill="#888" font-weight="bold">rev(x)</text>
  <text x="290" y="62" font-size="11" fill="#888" font-weight="bold">d=x−rev(x)</text>
  <text x="400" y="62" font-size="11" fill="#888" font-weight="bold">查 cnt[d]</text>
  <text x="510" y="62" font-size="11" fill="#888" font-weight="bold">ans</text>

  <line x1="40" y1="70" x2="600" y2="70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row j=0: x=42, rev=24, d=18, cnt=0, ans=0 -->
  <rect x="50" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="100" y="78" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">42</text>
  <text x="220" y="98" text-anchor="middle" font-size="12" fill="#333">24</text>
  <rect x="260" y="78" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">18</text>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="530" y="98" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- Row j=1: x=11, rev=11, d=0, cnt=0, ans=0 -->
  <rect x="50" y="116" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="100" y="116" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="220" y="136" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="260" y="116" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="420" y="136" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="530" y="136" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- Row j=2: x=1, rev=1, d=0, cnt=1 (HIT), ans=1 -->
  <rect x="50" y="154" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="174" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="100" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="220" y="174" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="260" y="154" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="386" y="154" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ⭐</text>
  <rect x="510" y="154" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row j=3: x=97, rev=79, d=18, cnt=1 (HIT), ans=2 -->
  <rect x="50" y="192" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="100" y="192" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">97</text>
  <text x="220" y="212" text-anchor="middle" font-size="12" fill="#333">79</text>
  <rect x="260" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">18</text>
  <rect x="386" y="192" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ⭐</text>
  <rect x="510" y="192" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- Pair annotations -->
  <line x1="40" y1="236" x2="600" y2="236" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="258" font-size="12" fill="#444" font-weight="bold">命中分析：</text>
  <rect x="60" y="268" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough)"/>
  <text x="80" y="288" font-size="11" fill="#333">j=2 (x=1, d=0)：前面 j=1 的 d 也是 0 → 配成好对子 (11, 1) ✅</text>
  <rect x="60" y="304" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough)"/>
  <text x="80" y="324" font-size="11" fill="#333">j=3 (x=97, d=18)：前面 j=0 的 d 也是 18 → 配成好对子 (42, 97) ✅</text>

  <!-- HashMap state visualization -->
  <text x="60" y="358" font-size="12" fill="#444" font-weight="bold">遍历结束后的 cnt 哈希表：</text>
  <rect x="60" y="368" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
  <text x="210" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt</text>
  <line x1="160" y1="368" x2="160" y2="394" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="396" width="220" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="412" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="210" y="412" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="60" y="422" width="220" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="438" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="210" y="438" text-anchor="middle" font-size="11" fill="#333">2</text>

  <rect x="340" y="396" width="260" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough)"/>
  <text x="470" y="416" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 ans = 2</text>
  <text x="470" y="434" text-anchor="middle" font-size="10" fill="#666">每对相同 d 贡献其「前缀出现次数」</text>
</svg>
