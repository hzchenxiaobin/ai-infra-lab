<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟遍历，双状态滚动更新</text>

  <!-- 初始化 -->
  <rect x="200" y="46" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333">初始化 f = 0, g = 0, ans = -∞</text>
  <path d="M 280 86 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历循环 -->
  <rect x="180" y="112" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">取下一个元素 x = nums[i]</text>
  <path d="M 280 148 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新 f -->
  <rect x="120" y="172" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">更新 f（未平方状态）</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">ff = max(f, 0) + x</text>
  <path d="M 280 218 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新 g：决策菱形 -->
  <rect x="100" y="242" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">更新 g（已平方状态，二选一取 max）</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#d6a040">gg = max( max(f,0)+x² , g+x )</text>
  <path d="M 280 288 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两个候选分支说明 -->
  <rect x="40" y="312" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="150" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">候选① 在 i 处平方</text>
  <text x="150" y="350" text-anchor="middle" font-size="10" fill="#555">前缀无操作 max(f,0)</text>
  <text x="150" y="364" text-anchor="middle" font-size="10" fill="#555">+ 当前 x²</text>

  <rect x="300" y="312" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="410" y="332" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选② 之前已平方</text>
  <text x="410" y="350" text-anchor="middle" font-size="10" fill="#555">延展已操作段 g</text>
  <text x="410" y="364" text-anchor="middle" font-size="10" fill="#555">+ 当前原值 x</text>

  <!-- 汇聚到更新 ans -->
  <path d="M 150 368 Q 200 388 270 392" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 368 Q 360 388 290 392" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="394" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#333">ans = max(ans, f, g)</text>

  <!-- 回环箭头 -->
  <path d="M 390 134 Q 480 134 480 130 Q 480 110 380 128" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="100" font-size="10" fill="#888">还有元素</text>
  <text x="500" y="114" font-size="10" fill="#888">→ 继续</text>

  <!-- 返回 -->
  <path d="M 280 428 L 280 444" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="446" width="140" height="0" fill="none"/>
  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
