<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="384" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：JOIN 补维度 → 两级聚合 → 1:1 拼装 → 排序输出</text>

  <rect x="130" y="38" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① T = Transactions ⋈ Products（补 category）</text>

  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="88" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② P：GROUP BY customer_id, category → (cnt, max_date)</text>

  <path d="M 260 118 L 260 130 L 148 130 L 148 144" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 260 118 L 260 130 L 372 130 L 372 144" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="148" width="224" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="148" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③a 客户级聚合 Agg</text>
  <text x="148" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">total = SUM · cnt = COUNT</text>
  <text x="148" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">uniq = COUNT(DISTINCT) · avg</text>

  <rect x="260" y="148" width="224" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="372" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③b 类别级排名取一 Top1</text>
  <text x="372" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ROW_NUMBER() OVER (PARTITION BY cust</text>
  <text x="372" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ORDER BY cnt DESC, max_date DESC) = 1</text>

  <path d="M 148 202 L 148 224 L 250 234" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 372 202 L 372 224 L 272 234" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="110" y="238" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ Agg ⋈ Top1（ON customer_id，1:1）</text>

  <path d="M 260 268 L 260 284" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="52" y="288" width="416" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ loyalty = cnt×10 + total/100，三个金额列 ROUND(..., 2)</text>

  <path d="M 260 318 L 260 334" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="338" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ ORDER BY loyalty_score DESC, customer_id ASC</text>

  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Agg 与 Top1 每客户各恰一行 → JOIN 不放大行数</text>
</svg>
