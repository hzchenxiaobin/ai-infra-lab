<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：定位 → 套公式</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：nums = [2,1,4,3]，n = 4</text>

  <text x="30" y="80" font-size="11" fill="#888">定位：</text>
  <rect x="80" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="120" y="66" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="66" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="200" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="140" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=1</text>
  <text x="180" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">y=2</text>

  <text x="260" y="80" font-size="11" fill="#555">x &lt; y → 不交叉</text>
  <text x="260" y="98" font-size="11" fill="#333" font-weight="bold">ans = 1 + (4-1-2) = 1 + 1 = <tspan fill="#4a7a3a">2</tspan></text>

  <!-- swap sequence -->
  <text x="30" y="134" font-size="10" fill="#888">交换序列：[2,1,4,3] →①(0,1)→ [1,2,4,3] →②(2,3)→ [1,2,3,4]</text>

  <line x1="20" y1="148" x2="500" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="174" font-size="12" fill="#d6a040" font-weight="bold">示例 2：nums = [2,4,1,3]，n = 4</text>

  <text x="30" y="200" font-size="11" fill="#888">定位：</text>
  <rect x="80" y="186" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="206" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="120" y="186" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="206" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="160" y="186" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="206" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="186" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="206" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="140" y="230" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">y=1</text>
  <text x="180" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=2</text>

  <text x="260" y="200" font-size="11" fill="#555">x &gt; y → 交叉一次，减 1</text>
  <text x="260" y="218" font-size="11" fill="#333" font-weight="bold">ans = 2 + (4-1-1) - 1 = 2+2-1 = <tspan fill="#d6a040">3</tspan></text>

  <text x="30" y="254" font-size="10" fill="#888">交换序列：[2,4,1,3] →①(1,2)→ [2,1,4,3] →②(0,1)→ [1,2,4,3] →③(2,3)→ [1,2,3,4]</text>

  <line x1="20" y1="268" x2="500" y2="268" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="30" y="294" font-size="12" fill="#446688" font-weight="bold">示例 3：nums = [1,3,4,2,5]，n = 5</text>

  <text x="30" y="320" font-size="11" fill="#888">定位：</text>
  <rect x="80" y="306" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="326" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="306" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="326" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="152" y="306" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="326" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="188" y="306" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="326" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="224" y="306" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="326" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="98" y="350" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=0</text>
  <text x="242" y="350" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">y=4</text>

  <text x="280" y="320" font-size="11" fill="#555">x &lt; y</text>
  <text x="280" y="338" font-size="11" fill="#333" font-weight="bold">ans = 0 + (5-1-4) = 0</text>
  <text x="30" y="374" font-size="10" fill="#888">已是半有序（首=1 末=5），无需交换</text>

  <!-- summary -->
  <rect x="20" y="388" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三个示例分别得 2、3、0，与公式一致 ✓</text>
</svg>
