<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：模拟 + 状态判重，重复即停</text>

  <!-- Start oval -->
  <ellipse cx="200" cy="48" rx="42" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="52" text-anchor="middle" font-size="12" fill="#333">开始 (0,0,右)</text>

  <!-- arrow down -->
  <path d="M 200 63 L 200 76" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Mark current cell cleaned -->
  <rect x="140" y="76" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">标记当前格清扫</text>
  <text x="200" y="106" text-anchor="middle" font-size="9.5" fill="#888">room[i][j]==0 才计数，置 -1</text>

  <!-- arrow down -->
  <path d="M 200 110 L 200 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Record state seen -->
  <rect x="140" y="120" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">seen[i][j][k] = true</text>

  <!-- arrow down to diamond -->
  <path d="M 200 146 L 200 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: state seen before? -->
  <path d="M 140,184 L 200,158 L 260,184 L 200,210 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">该状态已</text>
  <text x="200" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">出现过?</text>

  <!-- Yes (right) -> return ans -->
  <path d="M 260 184 L 330 184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="330" y="170" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- No (down) -->
  <path d="M 200 210 L 200 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="214" y="220" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Diamond: next in bounds & not wall? -->
  <path d="M 120,250 L 200,222 L 280,250 L 200,278 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">下一格越界</text>
  <text x="200" y="260" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">或为墙(1)?</text>

  <!-- No (right) -> move forward -->
  <path d="M 280 250 L 330 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="330" y="236" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前进：i,j ← 下一格</text>

  <!-- Yes (left) -> rotate -->
  <path d="M 120 250 L 90 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="244" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">是</text>
  <rect x="30" y="236" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">转 90°</text>

  <!-- loop back arrows to "mark current cell" (top rect at y=76) -->
  <!-- from move-forward box up to top -->
  <path d="M 390 236 L 390 64 L 260 64 L 260 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <!-- from rotate box up to top -->
  <path d="M 60 236 L 60 64 L 140 64 L 140 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="232" y="60" font-size="9.5" fill="#888">回循环（重新标记/判重）</text>

  <!-- bottom note -->
  <rect x="50" y="294" width="420" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为什么状态重复就一定能停？</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555">状态数有限且后继唯一 → 轨迹必成环，重复后只 revisit 旧格，ans 不再增长</text>

  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#aaa">时间 O(m·n) · 空间 O(m·n)（seen 三维表）</text>
</svg>
