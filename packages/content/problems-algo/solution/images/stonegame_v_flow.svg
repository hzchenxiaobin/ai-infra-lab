<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arwf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP 流程：按长度递增 + 三分支转移</text>

  <!-- ===== left: dp table fill order (n=6) ===== -->
  <text x="195" y="48" text-anchor="middle" font-size="11" fill="#888">dp 表填充顺序（n=6，示意）</text>

  <!-- column headers j -->
  <text x="105" y="74" text-anchor="middle" font-size="9" fill="#aaa">j\i</text>
  <text x="135" y="74" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="165" y="74" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="195" y="74" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="225" y="74" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="255" y="74" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="285" y="74" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- row headers i -->
  <text x="105" y="98"  text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="105" y="118" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="105" y="138" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="105" y="158" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="105" y="178" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="105" y="198" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- len1 diagonal (green) all 0 -->
  <rect x="120" y="84"  width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="135" y="98" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="150" y="104" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="118" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="180" y="124" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="138" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="210" y="144" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="225" y="158" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="240" y="164" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="255" y="178" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="270" y="184" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="285" y="198" text-anchor="middle" font-size="9" fill="#333">0</text>

  <!-- len2 (blue) -->
  <rect x="150" y="84"  width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="104" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="124" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="144" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="164" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>

  <!-- len3 (orange) -->
  <rect x="180" y="84"  width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="104" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="124" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="144" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- len4 (light orange) -->
  <rect x="210" y="84"  width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="104" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="124" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>

  <!-- len5,6 (faint red) -->
  <rect x="240" y="84"  width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="104" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>

  <!-- answer cell dp[0][5] = 18 -->
  <rect x="270" y="84"  width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">18</text>

  <!-- legend -->
  <rect x="60"  y="232" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="78"  y="242" font-size="9" fill="#555">len=1 (边界=0)</text>
  <rect x="60"  y="250" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="78"  y="260" font-size="9" fill="#555">len=2</text>
  <rect x="200" y="232" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="218" y="242" font-size="9" fill="#555">len=3..4</text>
  <rect x="200" y="250" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="218" y="260" font-size="9" fill="#555">len=n 答案</text>

  <!-- ===== right: flowchart ===== -->
  <rect x="330" y="56" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="76" text-anchor="middle" font-size="11" fill="#333">① 预处理前缀和 prefix</text>

  <path d="M 440 86 L 440 98" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="330" y="100" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="120" text-anchor="middle" font-size="11" fill="#333">② for len = 2 .. n</text>

  <path d="M 440 130 L 440 142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="330" y="144" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="164" text-anchor="middle" font-size="11" fill="#333">③ for i, j = i+len−1</text>

  <path d="M 440 174 L 440 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="320" y="188" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="208" text-anchor="middle" font-size="11" fill="#333">④ for k=i..j−1，按 leftSum vs rightSum 取分支</text>

  <path d="M 440 218 L 440 230" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="330" y="232" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="252" text-anchor="middle" font-size="11" fill="#333">⑤ dp[i][j] = max over k</text>

  <path d="M 440 262 L 440 274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="330" y="276" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥ return dp[0][n−1]</text>

  <!-- loop back from ④ to ② -->
  <path d="M 320 203 Q 300 203 300 115 Q 300 115 330 115" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arwf)" filter="url(#rough2)"/>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 290 170)">len 循环</text>

  <!-- footer -->
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">每个 dp[i][j] 依赖更短的 [i,k]、[k+1,j]，按长度递增保证依赖就绪</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">前缀和使 leftSum / rightSum 求和 O(1)</text>
</svg>
