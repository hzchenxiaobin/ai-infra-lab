<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 2 演算：m=2, n=2, h=[7], v=[4] → 15</text>

  <!-- 左：蛋糕 2x2 -->
  <rect x="70" y="56" width="120" height="120" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="70" y1="116" x2="190" y2="116" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <line x1="130" y1="56" x2="130" y2="176" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="196" y="112" font-size="11" fill="#b85450" filter="url(#rough2)">← 横切 7</text>
  <text x="196" y="126" font-size="11" fill="#b85450" filter="url(#rough2)">乘数 1（×1）</text>
  <text x="76" y="192" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↑ 竖切 4，被横线断成 2 段（×2）</text>
  <text x="130" y="216" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2×2 蛋糕：mn−1 = 3 刀不变量</text>

  <!-- 右：步骤表 -->
  <rect x="268" y="48" width="232" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="68" font-size="11" fill="#446688" filter="url(#rough2)">步</text>
  <text x="316" y="68" font-size="11" fill="#446688" filter="url(#rough2)">选谁</text>
  <text x="376" y="68" font-size="11" fill="#446688" filter="url(#rough2)">乘数</text>
  <text x="416" y="68" font-size="11" fill="#446688" filter="url(#rough2)">本步</text>
  <text x="470" y="68" font-size="11" fill="#446688" filter="url(#rough2)">累计</text>

  <rect x="268" y="80" width="232" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="286" y="100" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="100" font-size="11" fill="#333" filter="url(#rough2)">7 ≥ 4 横</text>
  <text x="380" y="100" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="410" y="100" font-size="11" fill="#333" filter="url(#rough2)">7×1</text>
  <text x="472" y="100" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <rect x="268" y="112" width="232" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="286" y="132" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="132" font-size="11" fill="#333" filter="url(#rough2)">竖 4</text>
  <text x="380" y="132" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="406" y="132" font-size="11" fill="#333" filter="url(#rough2)">4×2</text>
  <text x="466" y="132" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">15 ✓</text>

  <!-- 对比：反过来切 -->
  <rect x="268" y="150" width="232" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反过来先竖后横：</text>
  <text x="384" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4×1 + 7×2 = 18（多付 3）</text>
  <text x="384" y="200" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3 = max(7,4) − min(7,4)：那对交点</text>
  <text x="384" y="200" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)"> </text>

  <!-- 底部结论 -->
  <rect x="26" y="240" width="468" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">读表要点</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 1 步横切时竖线还没切（j=0）→ 乘数 1，只付基准一刀</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 2 步竖切时横线已切 1 条（i=1）→ 被断成 2 段，付 2 刀</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">顺序影响的是「谁被断开多付钱」——贵的先切 = 每对交点只付 min</text>
</svg>
