<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：先按值分组，只在同组内枚举数对</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">nums[i] == nums[j] 是过滤条件 → 分组后天然满足，免去无谓比较</text>

  <!-- ===== Array row: nums = [3,1,2,2,2,1,3] ===== -->
  <text x="28" y="68" font-size="10.5" fill="#666">数组</text>
  <!-- index labels -->
  <text x="78" y="60" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="118" y="60" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="60" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="60" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="60" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="278" y="60" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="318" y="60" text-anchor="middle" font-size="9" fill="#888">6</text>
  <!-- value boxes -->
  <rect x="58" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="98" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="178" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="258" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="298" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- ===== Left: brute force checks ALL pairs ===== -->
  <text x="28" y="128" font-size="10.5" fill="#666">暴力：枚举所有数对</text>
  <rect x="20" y="136" width="210" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C(7,2) = 21 对</text>
  <text x="125" y="174" text-anchor="middle" font-size="10" fill="#555">逐对检查 i &lt; j</text>
  <text x="125" y="190" text-anchor="middle" font-size="10" fill="#b85450">nums[i]==nums[j]?</text>
  <text x="125" y="206" text-anchor="middle" font-size="10" fill="#b85450">(i·j) % k == 0?</text>
  <text x="125" y="222" text-anchor="middle" font-size="9.5" fill="#888">16 对值不同 → 白查</text>

  <!-- ===== Right: group by value ===== -->
  <text x="260" y="128" font-size="10.5" fill="#666">优化：按值分桶</text>
  <rect x="250" y="136" width="250" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <!-- bucket: value 1 -->
  <rect x="262" y="146" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="162" font-size="9.5" fill="#333">1→[1,5]</text>
  <!-- bucket: value 2 -->
  <rect x="340" y="146" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="162" font-size="9.5" fill="#333">2→[2,3,4]</text>
  <!-- bucket: value 3 -->
  <rect x="428" y="146" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="162" font-size="9.5" fill="#333">3→[0,6]</text>
  <text x="375" y="184" text-anchor="middle" font-size="10" fill="#555">只在同桶内枚举数对</text>
  <text x="375" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">共 1+3+1 = 5 对</text>
  <text x="375" y="216" text-anchor="middle" font-size="9.5" fill="#888">值相同天然满足 → 只查整除</text>

  <!-- arrow from brute to group: optimization -->
  <path d="M 230 182 L 248 182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="239" y="176" text-anchor="middle" font-size="9" fill="#4a7a3a">优化</text>

  <!-- ===== Bottom: the divisibility filter ===== -->
  <rect x="40" y="248" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第二步：对每个同值数对 (i, j) 检查 (i · j) % k == 0</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#555">i·j 能被 k 整除 ⇔ i·j 含 k 的所有质因子</text>
  <text x="260" y="300" text-anchor="middle" font-size="9.5" fill="#888">n ≤ 100 → 同组内两两枚举完全可接受</text>

  <!-- ===== Footer ===== -->
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#888">分组把「值相等」条件从 O(n²) 枚举中剥离 → 只剩同值数对的整除判定</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">最坏情形（全相同值）仍 O(n²)，但常数大幅缩小；n ≤ 100 下暴力亦 AC</text>
  <text x="260" y="364" text-anchor="middle" font-size="10" fill="#aaa">分组思想是 1/200/219 等值查重题的通用优化模板</text>
</svg>
