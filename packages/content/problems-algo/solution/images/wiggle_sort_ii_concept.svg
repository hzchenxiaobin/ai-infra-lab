<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：摆动序列的谷峰结构 + 排序分半反向穿插</text>

  <!-- Section 1: wiggle pattern -->
  <text x="36" y="62" font-size="12" fill="#446688" font-weight="bold">① 摆动序列：谷位（偶下标）&lt; 峰位（奇下标）</text>

  <!-- wiggle curve -->
  <path d="M 60 130 Q 90 100 120 130 T 180 130 T 240 130 T 300 130 T 360 130" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- valley and peak labels -->
  <text x="60" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">谷</text>
  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#d6a040">峰</text>
  <text x="180" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">谷</text>
  <text x="240" y="100" text-anchor="middle" font-size="10" fill="#d6a040">峰</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">谷</text>
  <text x="360" y="100" text-anchor="middle" font-size="10" fill="#d6a040">峰</text>

  <!-- array cells below curve -->
  <g filter="url(#rough2)">
    <rect x="40" y="162" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="100" y="162" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="160" y="162" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="220" y="162" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="162" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="162" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="60" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="120" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <text x="180" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="240" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="340" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="60" y="210" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="120" y="210" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="180" y="210" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="240" y="210" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="280" y="210" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="340" y="210" text-anchor="middle" font-size="9" fill="#888">5</text>

  <text x="400" y="178" font-size="10.5" fill="#555">⌈n/2⌉ = 3 谷位</text>
  <text x="400" y="194" font-size="10.5" fill="#555">⌊n/2⌋ = 3 峰位</text>

  <!-- divider -->
  <path d="M 36 226 L 524 226" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: sort and split -->
  <text x="36" y="252" font-size="12" fill="#446688" font-weight="bold">② 排序后分半：小半 S 填谷位，大半 L 填峰位</text>

  <!-- sorted array -->
  <text x="36" y="276" font-size="10.5" fill="#888">排序后：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="264" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="264" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="264" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="210" y="264" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="250" y="264" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="290" y="264" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="110" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="150" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="190" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="230" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="310" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- S and L brackets -->
  <path d="M 90 300 L 90 306 L 210 306 L 210 300" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">小半 S（⌈n/2⌉=3）</text>

  <path d="M 210 300 L 210 306 L 330 306 L 330 300" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">大半 L（⌊n/2⌋=3）</text>

  <!-- divider -->
  <path d="M 36 332 L 524 332" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: reverse interleave -->
  <text x="36" y="356" font-size="12" fill="#b85450" font-weight="bold">③ 反向穿插：S' 和 L' 逆序后交叉填入谷位与峰位</text>

  <!-- S' reversed -->
  <text x="36" y="380" font-size="10.5" fill="#888">S' 逆序：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="368" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="124" y="368" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="368" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="107" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="141" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="175" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- L' reversed -->
  <text x="210" y="380" font-size="10.5" fill="#888">L' 逆序：</text>
  <g filter="url(#rough2)">
    <rect x="260" y="368" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="294" y="368" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="328" y="368" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="277" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="311" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="345" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- result -->
  <text x="380" y="380" font-size="10.5" fill="#888">→ 结果：</text>
  <g filter="url(#rough2)">
    <rect x="410" y="368" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="438" y="368" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="466" y="368" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="424" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="452" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="480" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="500" y="386" font-size="10" fill="#888">...</text>

  <!-- insight box -->
  <rect x="36" y="396" width="488" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 反向后中位数 2 被推到两端（下标 0 和 5），中间隔开，无等值碰撞</text>
</svg>
