<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两阶段 —— 归拢 + 统计</text>

  <!-- ===== Step 1: Initialize ===== -->
  <rect x="40" y="48" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="68" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="56" y="86" font-size="10" fill="#555" filter="url(#rough2)">userTimes = {}（空哈希表）, answer = [0] * k</text>

  <!-- arrow down -->
  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Iterate logs ===== -->
  <rect x="40" y="122" width="480" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="142" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 遍历日志归拢：对每条 [id, t] ∈ logs</text>

  <!-- decision diamond -->
  <polygon points="280,154 340,178 280,202 220,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">id 在表中?</text>

  <!-- yes branch -->
  <path d="M 220 178 L 100 178 L 100 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="172" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="48" y="214" width="104" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">建空集合</text>

  <!-- no branch -->
  <path d="M 340 178 L 460 178 L 460 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="172" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="408" y="214" width="104" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过建表</text>

  <!-- merge to add -->
  <path d="M 100 242 L 100 250 L 280 250" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 460 242 L 460 250 L 280 250" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 250 L 280 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- add operation -->
  <rect x="180" y="264" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">userTimes[id].add(t)</text>

  <!-- loop back arrow -->
  <path d="M 380 278 L 470 278 L 470 178 L 342 178" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="270" font-size="9" fill="#888" filter="url(#rough2)">下一条</text>

  <!-- arrow down to step 3 -->
  <path d="M 280 296 L 280 314" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Count distribution ===== -->
  <rect x="40" y="318" width="480" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="338" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 统计分布：遍历 userTimes 中每个用户的集合 s</text>

  <rect x="72" y="350" width="180" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="162" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">uam = len(s)</text>

  <path d="M 252 364 L 290 364" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="296" y="350" width="196" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="394" y="368" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">answer[uam − 1] += 1</text>

  <text x="56" y="398" font-size="10" fill="#555" filter="url(#rough2)">注：uam 恒 ≥ 1（用户至少一条日志才入表）</text>
  <text x="56" y="414" font-size="10" fill="#b85450" filter="url(#rough2)">下标 uam−1：UAM 值 j → answer[j−1]（1-indexed 转 0-indexed）</text>

  <!-- arrow down -->
  <path d="M 280 432 L 280 450" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Return ===== -->
  <rect x="40" y="454" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="476" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 返回 answer（长度 k，下标从 1 计数语义）</text>

  <!-- footer -->
  <text x="280" y="514" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">阶段①②归拢 O(n) + 阶段③统计 O(U) ≤ O(n) → 总 O(n)</text>
  <text x="280" y="530" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">集合的 add/insert 即去重，无需额外步骤</text>
</svg>
