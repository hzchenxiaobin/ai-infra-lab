<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：喜欢率 = likes / (likes + dislikes) 严格低于 60% 即低质量</text>

  <!-- ===== Y axis ===== -->
  <line x1="70" y1="80" x2="70" y2="340" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="84" text-anchor="end" font-size="9" fill="#999">100%</text>
  <text x="58" y="188" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">60%</text>
  <text x="58" y="344" text-anchor="end" font-size="9" fill="#999">0%</text>

  <!-- Y axis ticks -->
  <line x1="66" y1="80" x2="70" y2="80" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="66" y1="340" x2="70" y2="340" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 60% threshold line ===== -->
  <line x1="70" y1="184" x2="560" y2="184" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="500" y="170" width="70" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="535" y="182" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">阈值 60%</text>

  <!-- ===== X axis ===== -->
  <line x1="70" y1="340" x2="560" y2="340" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ===== Bars (6 problems) ===== -->
  <!-- Problem 1: 61.7% green (above) -->
  <rect x="100" y="180" width="60" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="174" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">61.7%</text>
  <text x="130" y="356" text-anchor="middle" font-size="9.5" fill="#555">P1</text>

  <!-- Problem 6: 75.2% green -->
  <rect x="176" y="144" width="60" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">75.2%</text>
  <text x="206" y="356" text-anchor="middle" font-size="9.5" fill="#555">P6</text>

  <!-- Problem 7: 58.5% red (below) -->
  <rect x="252" y="188" width="60" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">58.5%</text>
  <text x="282" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">P7</text>

  <!-- Problem 10: 54.7% red -->
  <rect x="328" y="198" width="60" height="142" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="358" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">54.7%</text>
  <text x="358" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">P10</text>

  <!-- Problem 11: 23.6% red -->
  <rect x="404" y="279" width="60" height="61" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="434" y="292" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">23.6%</text>
  <text x="434" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">P11</text>

  <!-- Problem 13: 33.0% red -->
  <rect x="480" y="254" width="60" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="267" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">33.0%</text>
  <text x="510" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">P13</text>

  <!-- ===== Legend ===== -->
  <rect x="100" y="378" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="122" y="388" font-size="9.5" fill="#4a7a3a">喜欢率 ≥ 60%（合格）</text>

  <rect x="280" y="378" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="302" y="388" font-size="9.5" fill="#b85450">喜欢率 &lt; 60%（低质量）</text>

  <!-- ===== Cross-multiplication callout ===== -->
  <rect x="70" y="402" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="416" font-size="9.5" fill="#d6a040" font-weight="bold">避免浮点除法：交叉相乘</text>
  <text x="85" y="428" font-size="9" fill="#555">likes/(likes+dislikes) &lt; 0.6  ⟺  5×likes &lt; 3×(likes+dislikes)  ⟺  2×likes &lt; 3×dislikes</text>
</svg>
