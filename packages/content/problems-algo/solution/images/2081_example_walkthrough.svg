<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：k = 2, n = 5（枚举十进制回文，过滤二进制回文）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">长度 L=1 时十进制回文即 1..9，逐个转二进制判回文</text>

  <!-- Column headers -->
  <rect x="40" y="58" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">十进制回文 p</text>
  <text x="220" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">base 2 表示</text>
  <text x="340" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">回文?</text>
  <text x="420" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cnt</text>
  <text x="495" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">sum</text>

  <!-- Row 1: p=1 ✓ -->
  <rect x="40" y="92" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace">1</text>
  <text x="220" y="112" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1</text>
  <text x="340" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="495" y="112" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1</text>

  <!-- Row 2: p=2 ✗ -->
  <rect x="40" y="126" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="146" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">2</text>
  <text x="220" y="146" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">10</text>
  <text x="340" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="146" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="495" y="146" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1</text>

  <!-- Row 3: p=3 ✓ -->
  <rect x="40" y="160" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="180" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace">3</text>
  <text x="220" y="180" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">11</text>
  <text x="340" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="495" y="180" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">4</text>

  <!-- Row 4: p=4 ✗ -->
  <rect x="40" y="194" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="214" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">4</text>
  <text x="220" y="214" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">100</text>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="214" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="495" y="214" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">4</text>

  <!-- Row 5: p=5 ✓ -->
  <rect x="40" y="228" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="248" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace">5</text>
  <text x="220" y="248" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">101</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="248" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="495" y="248" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">9</text>

  <!-- Row 6: p=6 ✗ -->
  <rect x="40" y="262" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="282" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">6</text>
  <text x="220" y="282" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">110</text>
  <text x="340" y="282" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="282" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="495" y="282" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">9</text>

  <!-- Row 7: p=7 ✓ -->
  <rect x="40" y="296" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace">7</text>
  <text x="220" y="316" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">111</text>
  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="495" y="316" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">16</text>

  <!-- Row 8: p=8 ✗ -->
  <rect x="40" y="330" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">8</text>
  <text x="220" y="350" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1000</text>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#aaa">—</text>
  <text x="495" y="350" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">16</text>

  <!-- Row 9: p=9 ✓ (final) -->
  <rect x="40" y="364" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="386" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace">9</text>
  <text x="220" y="386" text-anchor="middle" font-size="14" fill="#333" font-family="'Comic Sans MS', monospace">1001</text>
  <text x="340" y="386" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="386" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="495" y="386" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">25</text>

  <!-- Final verdict -->
  <rect x="80" y="416" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">cnt == 5 == n ⇒ 立即返回 sum = 25</text>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#888">命中行（绿）：1, 3, 5, 7, 9 —— 即最小的 5 个 2 镜像数</text>

  <!-- Insight -->
  <rect x="40" y="476" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="496" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何不必先收集再排序？</text>
  <text x="280" y="514" text-anchor="middle" font-size="10.5" fill="#555">十进制回文按长度/前半枚举已天然升序 → 命中序列即升序 → 前 n 个命中即最小 n 个</text>
</svg>
