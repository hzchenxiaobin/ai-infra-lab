<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：前后缀分解 —— 删 i ＝ 左右两段各自聚合再合并</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">gcd/lcm 可结合且有单位元，一次合并 O(1)</text>

  <!-- 数组格子 -->
  <rect x="168" y="84" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="193" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 174 90 L 212 116 M 212 90 L 174 116" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="193" y="74" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删除 i=0</text>

  <rect x="224" y="84" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="249" y="108" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="280" y="84" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="108" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="336" y="84" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="361" y="108" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">16</text>

  <text x="193" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="249" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="305" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="361" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>

  <!-- 左：空段 → 单位元 -->
  <rect x="30" y="176" width="130" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="95" y="194" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">空段 [0, 0)</text>
  <text x="95" y="210" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">preG[0] = 0</text>
  <text x="95" y="226" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">preL[0] = 1（单位元）</text>
  <path d="M 170 130 Q 120 146 98 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右：后段 -->
  <rect x="360" y="176" width="130" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="194" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">右段 [1, 4)</text>
  <text x="425" y="210" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">sufG[1] = gcd(4,8,16) = 4</text>
  <text x="425" y="226" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">sufL[1] = 16</text>
  <path d="M 380 130 Q 420 148 424 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 合并 -->
  <path d="M 95 236 Q 120 252 168 258" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 425 236 Q 400 252 352 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="120" y="252" width="280" height="46" fill="#ffffff" stroke="#b85450" stroke-width="1.9" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">G = gcd(0, 4) = 4，L = lcm(1, 16) = 16</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">得分 = 4 × 16 = 64 ✓（本题最优）</text>

  <!-- 底部：单位元总结 -->
  <rect x="26" y="310" width="466" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="259" y="326" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">单位元：gcd ↔ 0，lcm ↔ 1 —— 空/单元素边界全部自动吸收</text>
  <text x="259" y="342" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">n=1 删除唯一元素：gcd(0,0) × lcm(1,1) = 0，恰为空数组规定得分，免特判</text>
</svg>
