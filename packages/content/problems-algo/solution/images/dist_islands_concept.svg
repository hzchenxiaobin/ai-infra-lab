<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">不同岛屿的数量：平移同形 → DFS 路径签名相同</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== left: grid 4x5, cell 32, origin (50,75) ===== -->
  <!-- row0 -->
  <g filter="url(#rough2)"><rect x="50" y="75" width="32" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="66" y="97" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="82" y="75" width="32" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="98" y="97" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="114" y="75" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="130" y="97" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="146" y="75" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="162" y="97" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="178" y="75" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="194" y="97" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <!-- row1 -->
  <g filter="url(#rough2)"><rect x="50" y="107" width="32" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="66" y="129" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="82" y="107" width="32" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="98" y="129" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="114" y="107" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="130" y="129" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="146" y="107" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="162" y="129" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="178" y="107" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="194" y="129" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <!-- row2 -->
  <g filter="url(#rough2)"><rect x="50" y="139" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="66" y="161" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="82" y="139" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="98" y="161" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="114" y="139" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="130" y="161" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="146" y="139" width="32" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="162" y="161" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="178" y="139" width="32" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="194" y="161" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <!-- row3 -->
  <g filter="url(#rough2)"><rect x="50" y="171" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="66" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="82" y="171" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="98" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="114" y="171" width="32" height="32" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="130" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="146" y="171" width="32" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="162" y="193" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="178" y="171" width="32" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="194" y="193" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>

  <!-- island labels -->
  <text x="82" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">岛屿 A</text>
  <text x="178" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">岛屿 B</text>

  <!-- translation arrow A -> B -->
  <path d="M 120 108 Q 150 150 178 158" stroke="#b85450" stroke-width="1.8"
        fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="138" font-size="12" fill="#b85450" font-weight="bold">平移</text>

  <!-- ===== right: signatures + set ===== -->
  <!-- Island A signature -->
  <g filter="url(#rough2)"><rect x="290" y="78" width="220" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="98" font-size="12" fill="#446688" font-weight="bold">岛屿 A 签名</text>
  <text x="400" y="118" text-anchor="middle" font-size="15" fill="#2b4a66" font-weight="bold" font-family="'Comic Sans MS',monospace">O D R U B B B B</text>

  <!-- Island B signature -->
  <g filter="url(#rough2)"><rect x="290" y="140" width="220" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="300" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">岛屿 B 签名</text>
  <text x="400" y="180" text-anchor="middle" font-size="15" fill="#2e5a26" font-weight="bold" font-family="'Comic Sans MS',monospace">O D R U B B B B</text>

  <!-- equal sign -->
  <text x="400" y="200" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">＝ 相同</text>

  <!-- arrows down to set -->
  <path d="M 400 206 L 400 228" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set box -->
  <g filter="url(#rough2)"><rect x="300" y="232" width="200" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">shapes 集合（去重）</text>
  <text x="400" y="270" text-anchor="middle" font-size="13" fill="#444" font-family="'Comic Sans MS',monospace">{ "ODRUBBBB" }</text>

  <!-- result -->
  <g filter="url(#rough2)"><rect x="330" y="294" width="140" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="400" y="316" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">不同岛屿 = 1</text>

  <!-- core idea box -->
  <g filter="url(#rough2)">
    <rect x="540" y="78" width="220" height="250" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="556" y="102" font-size="13" font-weight="bold" fill="#444">核心观察</text>
  <text x="556" y="126" font-size="12" fill="#444">用 DFS 探索路径做</text>
  <text x="556" y="142" font-size="12" fill="#444">岛屿的「形状指纹」：</text>
  <text x="556" y="166" font-size="12" fill="#444">O = 起点（进入首格）</text>
  <text x="556" y="184" font-size="12" fill="#444">U/D/L/R = 四向移动</text>
  <text x="556" y="202" font-size="12" fill="#444">B = 回溯（退出本格）</text>
  <text x="556" y="226" font-size="12" fill="#b85450" font-weight="bold">关键：必须记 B！</text>
  <text x="556" y="246" font-size="12" fill="#444">否则不同形状可能</text>
  <text x="556" y="262" font-size="12" fill="#444">产生相同路径串。</text>
  <text x="556" y="286" font-size="11" fill="#888">起点 = 行优先扫到</text>
  <text x="556" y="300" font-size="11" fill="#888">的首个 1（左上角），</text>
  <text x="556" y="314" font-size="11" fill="#888">天然平移归一化。</text>

  <!-- legend -->
  <g filter="url(#rough2)"><rect x="50" y="232" width="16" height="14" rx="3" fill="#e8f0fe" stroke="#446688"/></g>
  <text x="72" y="244" font-size="11" fill="#444">岛屿 A</text>
  <g filter="url(#rough2)"><rect x="50" y="252" width="16" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="72" y="264" font-size="11" fill="#444">岛屿 B（同形）</text>
  <g filter="url(#rough2)"><rect x="50" y="272" width="16" height="14" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="72" y="284" font-size="11" fill="#444">水 0</text>
  <text x="50" y="312" font-size="11" fill="#888">两座 2×2 岛形状一致，</text>
  <text x="50" y="328" font-size="11" fill="#888">签名相同 → 只算 1 种。</text>
</svg>
