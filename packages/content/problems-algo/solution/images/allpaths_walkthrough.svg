<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：graph = [[1,2],[3],[3],[]]，递归树</text>

  <!-- ===== recursion tree ===== -->
  <!-- root: dfs(0,[0]) -->
  <rect x="206" y="48" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(0)  path=[0]</text>

  <!-- edges to children -->
  <path d="M 250 78 L 130 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 78 L 410 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="10" fill="#446688">v=1</text>
  <text x="382" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">v=2</text>

  <!-- child left: dfs(1,[0,1]) blue path -->
  <rect x="66" y="110" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="11.5" fill="#333">dfs(1)  path=[0,1]</text>

  <!-- child right: dfs(2,[0,2]) green path -->
  <rect x="346" y="110" width="128" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="130" text-anchor="middle" font-size="11.5" fill="#333">dfs(2)  path=[0,2]</text>

  <!-- edges to leaf (v=3) -->
  <path d="M 130 140 L 130 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 140 L 410 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="162" font-size="10" fill="#446688">v=3</text>
  <text x="426" y="162" font-size="10" fill="#4a7a3a">v=3</text>

  <!-- leaves: dfs(3) record -->
  <rect x="50" y="176" width="160" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">dfs(3)  u==n−1 ✓</text>
  <rect x="330" y="176" width="160" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">dfs(3)  u==n−1 ✓</text>

  <!-- recorded path boxes -->
  <path d="M 130 208 L 130 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 208 L 410 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="58" y="222" width="144" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="240" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">记录 [0,1,3]</text>
  <rect x="338" y="222" width="144" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">记录 [0,2,3]</text>

  <!-- backtrack arrows (pop) -->
  <path d="M 50 192 Q 18 192 18 130 L 18 63" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="150" text-anchor="middle" font-size="9.5" fill="#b85450">回溯 pop</text>
  <path d="M 474 192 Q 522 192 522 130 L 522 63" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="526" y="150" text-anchor="middle" font-size="9.5" fill="#b85450">回溯 pop</text>

  <!-- ===== step table ===== -->
  <rect x="24" y="266" width="62" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="283" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <rect x="86" y="266" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="146" y="283" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">调用</text>
  <rect x="206" y="266" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="266" y="283" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">path 状态</text>
  <rect x="326" y="266" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="283" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">操作</text>

  <!-- row 1 -->
  <rect x="24" y="290" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="307" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="86" y="290" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="146" y="307" text-anchor="middle" font-size="10.5" fill="#333">dfs(0)</text>
  <rect x="206" y="290" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="266" y="307" text-anchor="middle" font-size="10.5" fill="#333">[0]</text>
  <rect x="326" y="290" width="190" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="421" y="307" text-anchor="middle" font-size="10" fill="#333">push 1 → dfs(1)</text>

  <!-- row 2 -->
  <rect x="24" y="314" width="62" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="331" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="86" y="314" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="146" y="331" text-anchor="middle" font-size="10.5" fill="#333">dfs(1)</text>
  <rect x="206" y="314" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="266" y="331" text-anchor="middle" font-size="10.5" fill="#333">[0,1]</text>
  <rect x="326" y="314" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="421" y="331" text-anchor="middle" font-size="10" fill="#333">push 3 → dfs(3) 命中终点</text>

  <!-- row 3 -->
  <rect x="24" y="338" width="62" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="355" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="86" y="338" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="146" y="355" text-anchor="middle" font-size="10.5" fill="#333">dfs(3)</text>
  <rect x="206" y="338" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="266" y="355" text-anchor="middle" font-size="10.5" fill="#333">[0,1,3]</text>
  <rect x="326" y="338" width="190" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="355" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">记录路径，返回→pop 3</text>

  <!-- row 4 -->
  <rect x="24" y="362" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="379" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="86" y="362" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="146" y="379" text-anchor="middle" font-size="10.5" fill="#333">回到 dfs(0)</text>
  <rect x="206" y="362" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="266" y="379" text-anchor="middle" font-size="10.5" fill="#333">[0]</text>
  <rect x="326" y="362" width="190" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="421" y="379" text-anchor="middle" font-size="10" fill="#333">pop 1，push 2 → dfs(2) …同理</text>
</svg>
