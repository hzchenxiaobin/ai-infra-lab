<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：三个 O(1) 判定，答案只取 {−1, 1, 2}</text>

    <!-- start -->
    <rect x="155" y="36" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="245" y="57" text-anchor="middle" font-size="10.5" fill="#33507a">输入 source=(sr,sc)，target=(tr,tc)</text>

    <!-- decision 1 -->
    <polygon points="153,126 245,90 337,126 245,162" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="245" y="130" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold">同一格子？</text>
    <rect x="420" y="104" width="110" height="44" rx="8" fill="#f0ede6" stroke="#8a8a80" stroke-width="1.6"/>
    <text x="475" y="122" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">返回 0</text>
    <text x="475" y="138" text-anchor="middle" font-size="8.5" fill="#777">约束保证不触发</text>

    <!-- decision 2 -->
    <polygon points="147,218 245,178 343,218 245,258" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="245" y="212" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold">颜色相同？</text>
    <text x="245" y="230" text-anchor="middle" font-size="9" fill="#33507a">(r+c 奇偶)</text>
    <rect x="420" y="196" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="475" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 −1</text>
    <text x="475" y="230" text-anchor="middle" font-size="8.5" fill="#8a3a35">异色永不可达</text>

    <!-- decision 3 -->
    <polygon points="145,312 245,270 345,312 245,354" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="245" y="306" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold">同对角线？</text>
    <text x="245" y="324" text-anchor="middle" font-size="9" fill="#33507a">(r−c 或 r+c 相等)</text>
    <rect x="420" y="290" width="110" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="475" y="308" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold">返回 1</text>
    <text x="475" y="324" text-anchor="middle" font-size="8.5" fill="#2f5527">一步直达</text>

    <!-- result 2 -->
    <rect x="180" y="378" width="130" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="245" y="396" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">返回 2</text>
    <text x="245" y="411" text-anchor="middle" font-size="8.5" fill="#7a5c1a">经交点中转</text>

    <!-- arrows -->
    <path d="M 245 70 L 245 86" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <path d="M 337 126 L 416 126" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="376" y="119" text-anchor="middle" font-size="9.5" fill="#333">是</text>
    <path d="M 245 162 L 245 174" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="254" y="172" font-size="9.5" fill="#333">否</text>
    <path d="M 343 218 L 416 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="378" y="211" text-anchor="middle" font-size="9.5" fill="#333">否</text>
    <path d="M 245 258 L 245 266" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="254" y="266" font-size="9.5" fill="#333">是</text>
    <path d="M 345 312 L 416 312" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="380" y="305" text-anchor="middle" font-size="9.5" fill="#333">是</text>
    <path d="M 245 354 L 245 374" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="254" y="369" font-size="9.5" fill="#333">否</text>

    <!-- note -->
    <rect x="330" y="372" width="205" height="54" rx="8" fill="#f5f4ef" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="432" y="392" text-anchor="middle" font-size="8.8" fill="#666">注：三个判定均为 O(1) 整数比较，</text>
    <text x="432" y="406" text-anchor="middle" font-size="8.8" fill="#666">结论可用 64×64 全量 BFS 打表验证。</text>
  </g>
</svg>
