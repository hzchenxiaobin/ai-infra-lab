<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrLg" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrRb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最优路径最多一次转弯</text>

  <!-- Number line -->
  <path d="M 50 275 Q 260 273 470 275" stroke="#999" stroke-width="2.5" fill="none" filter="url(#rough)"/>

  <!-- L marker -->
  <circle cx="140" cy="275" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="140" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">L</text>

  <!-- startPos marker -->
  <circle cx="260" cy="275" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">startPos</text>

  <!-- R marker -->
  <circle cx="420" cy="275" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="420" y="298" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">R</text>

  <!-- Distance labels -->
  <path d="M 150 262 L 250 262" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="200" y="256" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">a</text>
  <path d="M 270 262 L 410 262" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">b</text>

  <!-- Path 4: Right then left (y=55-75) -->
  <path d="M 260 75 L 412 75" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 420 75 L 420 55" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 412 55 L 148 55" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <rect x="435" y="48" width="75" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="62" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">先右后左</text>
  <text x="472" y="76" text-anchor="middle" font-size="11" fill="#d6a040">a + 2b</text>

  <!-- Path 3: Left then right (y=110-130) -->
  <path d="M 260 130 L 148 130" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 140 130 L 140 110" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 148 110 L 412 110" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="435" y="103" width="75" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="117" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">先左后右</text>
  <text x="472" y="131" text-anchor="middle" font-size="11" fill="#446688">2a + b</text>

  <!-- Path 2: Right only (y=175) -->
  <path d="M 260 175 L 412 175" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="435" y="166" width="75" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">向右: b</text>

  <!-- Path 1: Left only (y=210) -->
  <path d="M 260 210 L 148 210" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <rect x="12" y="201" width="75" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="49" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">向左: a</text>

  <!-- Formula box -->
  <rect x="90" y="320" width="340" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">最小代价 = min(2a + b,  a + 2b)</text>
  <text x="260" y="365" text-anchor="middle" font-size="11" fill="#666">先走短侧 → 该侧距离算两次，另一侧算一次</text>
</svg>
