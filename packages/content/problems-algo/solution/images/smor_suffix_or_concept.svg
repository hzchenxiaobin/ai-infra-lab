<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：起点 i 的子数组 OR 随 j 单调不减，最大值即后缀或</text>

  <!-- nums row -->
  <text x="40" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">nums</text>
  <text x="40" y="76" font-size="9.5" fill="#888">(i=0 起)</text>
  <!-- 5 cells: 1,0,2,1,3 -->
  <rect x="120" y="44" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="190" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="68" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="260" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="68" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="330" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="68" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="400" y="44" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="68" text-anchor="middle" font-size="15" fill="#333">3</text>
  <!-- start marker -->
  <path d="M145 92 L145 102" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="145" y="116" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">起点 i=0</text>

  <!-- staircase OR values B_{0,j} = 1,1,3,3,3 ; baseline y=300, scale: value*40 -->
  <!-- j=0 -> 1 -->
  <rect x="120" y="260" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <!-- j=1 -> 1 (same) -->
  <rect x="190" y="260" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <!-- j=2 -> 3 (first reach max, highlight orange) -->
  <rect x="260" y="180" width="50" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <!-- j=3 -> 3 -->
  <rect x="330" y="180" width="50" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <!-- j=4 -> 3 (suffix OR) -->
  <rect x="400" y="180" width="50" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- suffix OR dashed line -->
  <path d="M110 180 L460 180" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <text x="470" y="184" font-size="10" fill="#d6a040" font-weight="bold">后缀或</text>

  <!-- monotonic arrow -->
  <path d="M115 300 L460 300" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">j 增大 →  OR 单调不减</text>

  <!-- annotations box -->
  <rect x="30" y="128" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最大值 = B(0,4) = 后缀或 = 3；不同取值 {1, 3} ≤ 30 种（位宽）</text>
  <text x="270" y="160" text-anchor="middle" font-size="10.5" fill="#888">首个达到最大值的 j=2 ⟹ answer[0] = 2−0+1 = 3</text>

  <!-- vertical link nums->staircase for j=2 -->
  <path d="M285 84 C 285 110, 285 140, 285 178" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="135" font-size="9.5" fill="#d6a040">或上 2</text>
  <text x="300" y="148" font-size="9.5" fill="#d6a040">跳到 3</text>
</svg>
