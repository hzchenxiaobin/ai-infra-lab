<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：火势扩散与人的路径解耦 — 多源 BFS + 二分等待</text>

  <!-- ===== LEFT: Grid with fire BFS ===== -->
  <text x="130" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">多源 BFS 预计算 fire[i][j]</text>

  <!-- 4x3 grid, cell=38px, origin (56, 70) -->
  <!-- Row 0: grass(3) grass(4) safehouse(5) -->
  <rect x="56" y="70" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="75" y="66" text-anchor="middle" font-size="9" fill="#888">S</text>

  <rect x="94" y="70" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <rect x="132" y="70" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="151" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="151" y="66" text-anchor="middle" font-size="9" fill="#4a7a3a">H</text>

  <!-- Row 1: grass(2) grass(3) grass(4) -->
  <rect x="56" y="108" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <rect x="94" y="108" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <rect x="132" y="108" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- Row 2: grass(1) grass(2) grass(3) -->
  <rect x="56" y="146" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <rect x="94" y="146" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <rect x="132" y="146" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- Row 3: fire(0) grass(1) grass(2) -->
  <rect x="56" y="184" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <rect x="94" y="184" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <rect x="132" y="184" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <!-- Person path arrow: (0,0)→(0,1)→(0,2) -->
  <path d="M 75 108 L 75 88 L 113 88 L 113 108" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrBlue)" filter="url(#rough2)" opacity="0.7"/>
  <text x="94" y="84" text-anchor="middle" font-size="8.5" fill="#446688">人路径</text>

  <!-- Fire spread arrows (a few) -->
  <path d="M 75 184 L 75 150" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)" opacity="0.5"/>
  <path d="M 94 222 L 113 222" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)" opacity="0.5"/>

  <!-- Legend -->
  <rect x="50" y="240" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="252" font-size="9" fill="#666">火源</text>
  <rect x="100" y="240" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="252" font-size="9" fill="#666">草地</text>
  <rect x="150" y="240" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="252" font-size="9" fill="#666">安全屋</text>

  <text x="130" y="272" text-anchor="middle" font-size="9.5" fill="#888">格子内数字 = 火势到达时间</text>

  <!-- ===== RIGHT: Binary search ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">二分搜索最大等待时间</text>

  <!-- Number line -->
  <path d="M 260 130 L 530 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="535" y="134" font-size="9" fill="#888">wait</text>

  <!-- Tick marks and labels: 0..5 -->
  <g font-size="10" fill="#555">
    <line x1="280" y1="126" x2="280" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="148" text-anchor="middle">0</text>
    <line x1="330" y1="126" x2="330" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="330" y="148" text-anchor="middle">1</text>
    <line x1="380" y1="126" x2="380" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="148" text-anchor="middle">2</text>
    <line x1="430" y1="126" x2="430" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="430" y="148" text-anchor="middle">3</text>
    <line x1="480" y1="126" x2="480" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="480" y="148" text-anchor="middle">4</text>
    <line x1="510" y1="126" x2="510" y2="134" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
    <text x="510" y="148" text-anchor="middle">5</text>
  </g>

  <!-- Green region: w=0,1,2 (reachable) -->
  <rect x="265" y="158" width="135" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 可达安全屋</text>

  <!-- Red region: w=3,4,5 (unreachable) -->
  <rect x="400" y="158" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 无法到达</text>

  <!-- Boundary line -->
  <path d="M 397 142 L 397 200" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="397" y="200" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">↑ 答案 = 2</text>

  <!-- Binary search steps -->
  <rect x="250" y="210" width="270" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="228" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">二分过程（单调性保证）</text>
  <text x="260" y="246" font-size="9.5" fill="#555">① lo=0, hi=5, mid=2 → check(2)=✓ → lo=3</text>
  <text x="260" y="262" font-size="9.5" fill="#555">② lo=3, hi=5, mid=4 → check(4)=✗ → hi=3</text>
  <text x="260" y="278" font-size="9.5" fill="#555">③ lo=3, hi=3 → 结束，返回 2</text>
  <text x="260" y="292" font-size="9" fill="#888">若 check(w) 可达，则 w'&lt;w 也可达 → 单调</text>

  <!-- ===== Bottom: Key insight ===== -->
  <rect x="30" y="320" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键解耦：火势扩散不依赖人的移动</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555">① 多源 BFS 预计算每个格子的着火时间 fire[i][j]</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#555">② 对等待时间 wait 二分：人到达时间 &lt; fire（中间格）/ ≤ fire（安全屋）</text>
</svg>
