<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐员工判定两个条件 → 计算 bonus</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="44" width="600" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="61">employee_id</text>
    <text x="150" y="61">name</text>
    <text x="240" y="61">salary</text>
    <text x="340" y="61">① id 奇数?</text>
    <text x="450" y="61">② 非 M 开头?</text>
    <text x="560" y="61">bonus</text>
  </g>
  <g stroke="#446688" stroke-width="0.6" filter="url(#rough2)">
    <line x1="105" y1="44" x2="105" y2="70"/>
    <line x1="195" y1="44" x2="195" y2="70"/>
    <line x1="285" y1="44" x2="285" y2="70"/>
    <line x1="395" y1="44" x2="395" y2="70"/>
    <line x1="505" y1="44" x2="505" y2="70"/>
  </g>

  <!-- ===== Row 1: id=2 Meir, even -> 0 (red) ===== -->
  <rect x="20" y="70" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="60" y="88" fill="#333" font-weight="bold">2</text>
    <text x="150" y="88" fill="#333">Meir</text>
    <text x="240" y="88" fill="#333">3000</text>
    <text x="340" y="88" fill="#b85450" font-weight="bold">✗ 偶数</text>
    <text x="450" y="88" fill="#888">—</text>
    <text x="560" y="88" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== Row 2: id=3 Michael, odd but M -> 0 (red) ===== -->
  <rect x="20" y="98" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="60" y="116" fill="#333" font-weight="bold">3</text>
    <text x="150" y="116" fill="#333">Michael</text>
    <text x="240" y="116" fill="#333">3800</text>
    <text x="340" y="116" fill="#4a7a3a" font-weight="bold">✓ 奇数</text>
    <text x="450" y="116" fill="#b85450" font-weight="bold">✗ M 开头</text>
    <text x="560" y="116" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== Row 3: id=7 Addilyn, odd, not M -> salary (green) ===== -->
  <rect x="20" y="126" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="60" y="144" fill="#333" font-weight="bold">7</text>
    <text x="150" y="144" fill="#333">Addilyn</text>
    <text x="240" y="144" fill="#333">7400</text>
    <text x="340" y="144" fill="#4a7a3a" font-weight="bold">✓ 奇数</text>
    <text x="450" y="144" fill="#4a7a3a" font-weight="bold">✓ 非 M</text>
    <text x="560" y="144" fill="#4a7a3a" font-weight="bold">7400</text>
  </g>

  <!-- ===== Row 4: id=8 Juan, even -> 0 (red) ===== -->
  <rect x="20" y="154" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="60" y="172" fill="#333" font-weight="bold">8</text>
    <text x="150" y="172" fill="#333">Juan</text>
    <text x="240" y="172" fill="#333">6100</text>
    <text x="340" y="172" fill="#b85450" font-weight="bold">✗ 偶数</text>
    <text x="450" y="172" fill="#888">—</text>
    <text x="560" y="172" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== Row 5: id=9 Kannon, odd, not M -> salary (green) ===== -->
  <rect x="20" y="182" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="60" y="200" fill="#333" font-weight="bold">9</text>
    <text x="150" y="200" fill="#333">Kannon</text>
    <text x="240" y="200" fill="#333">7700</text>
    <text x="340" y="200" fill="#4a7a3a" font-weight="bold">✓ 奇数</text>
    <text x="450" y="200" fill="#4a7a3a" font-weight="bold">✓ 非 M</text>
    <text x="560" y="200" fill="#4a7a3a" font-weight="bold">7700</text>
  </g>

  <!-- column separators through rows -->
  <g stroke="#bbb" stroke-width="0.5" filter="url(#rough2)">
    <line x1="105" y1="70" x2="105" y2="210"/>
    <line x1="195" y1="70" x2="195" y2="210"/>
    <line x1="285" y1="70" x2="285" y2="210"/>
    <line x1="395" y1="70" x2="395" y2="210"/>
    <line x1="505" y1="70" x2="505" y2="210"/>
  </g>

  <!-- arrow to final result -->
  <path d="M320 214 L320 238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Final output (ORDER BY employee_id) ===== -->
  <rect x="120" y="242" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最终输出（按 employee_id 升序）</text>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace">{ (2,0), (3,0), (7,7400), (8,0), (9,7700) }</text>

  <!-- ===== Footnote ===== -->
  <text x="320" y="306" text-anchor="middle" font-size="8.5" fill="#888">判定式：bonus = (employee_id mod 2 = 1) ∧ (name not like 'M%') ? salary : 0</text>
  <text x="320" y="322" text-anchor="middle" font-size="8.5" fill="#888">注意 id=2 Meir 虽名字非 M，但偶数 ID → 仍为 0；id=3 Michael 虽奇数 ID，但 M 开头 → 仍为 0</text>
</svg>
