<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2810f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双端队列 + 方向标记</text>

  <!-- init -->
  <rect x="210" y="46" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化 dq=[], dir=false</text>

  <path d="M280,88 L280,108" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2810f)" filter="url(#rough2)"/>

  <!-- loop entry -->
  <text x="300" y="104" font-size="10" fill="#888">遍历 s 中每个字符 c</text>

  <!-- decision diamond: c == 'i'? -->
  <polygon points="280,110 370,160 280,210 190,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c == 'i' ?</text>

  <!-- yes branch: toggle -->
  <path d="M370,160 L420,160 L420,108 L316,68" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="392" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="420" y="108" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dir = !dir</text>
  <text x="480" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">翻转标记，不入队</text>

  <!-- no branch -->
  <path d="M190,160 L140,160" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="150" y="152" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- decision: dir? -->
  <polygon points="140,160 80,200 140,240 200,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dir ?</text>

  <!-- dir=true: push front -->
  <path d="M80,200 L50,200 L50,252" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="44" y="192" font-size="9" fill="#b85450" font-weight="bold">反</text>

  <rect x="10" y="256" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dq.push_front(c)</text>

  <!-- dir=false: push back -->
  <path d="M200,200 L230,200 L230,252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="210" y="192" font-size="9" fill="#446688" font-weight="bold">正</text>

  <rect x="170" y="256" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dq.push_back(c)</text>

  <!-- back to loop -->
  <path d="M70,296 L70,330 L280,330 L280,210" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <path d="M230,296 L230,330 L280,330" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="290" y="324" font-size="9" fill="#888">下一个字符</text>

  <!-- end decision: dir? -->
  <path d="M280,330 L280,360" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="290" y="354" font-size="10" fill="#888">遍历结束</text>

  <polygon points="280,362 370,402 280,442 190,402" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dir == true ?</text>

  <!-- yes: reverse -->
  <path d="M370,402 L420,402" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="384" y="394" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="420" y="382" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="406" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逆序读出 dq</text>

  <!-- no: normal -->
  <path d="M190,402 L140,402" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2810f)" filter="url(#rough2)"/>
  <text x="150" y="394" font-size="9" fill="#446688" font-weight="bold">否</text>
  <rect x="20" y="382" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="406" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">正序读出 dq</text>

  <text x="280" y="456" text-anchor="middle" font-size="9" fill="#aaa">每个字符 O(1)，整体 O(n)</text>
</svg>
