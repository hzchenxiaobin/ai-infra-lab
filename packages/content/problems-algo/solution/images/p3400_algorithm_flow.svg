<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">枚举移位量 k：不搬数组，取模对齐统计</text>

  <!-- Step 1 -->
  <rect x="60" y="48" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① ans = 0；枚举移位量 k = 0, 1, …, n−1（共 n 种终态）</text>

  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="102" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">② 对每个 i ∈ [0, n)：nums1[i] == nums2[(i−k) mod n] 则 cnt++</text>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">—— 不真搬数组，用取模把两个下标「错位对齐」</text>

  <path d="M 260 154 L 260 172" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="100" y="174" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">③ ans = max(ans, cnt)</text>

  <!-- loop back arrow -->
  <path d="M 100 191 C 14 191 14 65 60 65" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一个 k</text>

  <path d="M 260 208 L 260 226" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="90" y="228" width="340" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">④ 所有 k 枚举完毕，返回 ans</text>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">时间 O(n²) · 空间 O(1)</text>

  <!-- bottom notes -->
  <rect x="40" y="300" width="440" height="80" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ n 次右移回到原位：k 只需枚举 [0, n)</text>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ C++：(i−k) % n 可能为负，先 +n 再取模</text>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ Python：nums2[i−k] 的负索引恰好等价循环取模</text>
</svg>
