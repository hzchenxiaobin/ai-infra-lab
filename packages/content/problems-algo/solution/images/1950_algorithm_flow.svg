<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单调栈求窗口 + 反向传播填空</text>

  <!-- Step 1 -->
  <rect x="40" y="54" width="560" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="78" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 单调递增栈：一次遍历求每个元素的最小窗口</text>
  <g font-size="11.5" font-family="monospace" fill="#555">
    <text x="60" y="100" filter="url(#rough2)">for i in 0..n-1:</text>
    <text x="60" y="118" filter="url(#rough2)">  while 栈非空 且 arr[栈顶] ≥ arr[i]:   // 当前更小，弹出</text>
    <text x="60" y="136" filter="url(#rough2)">    top = pop; left = 栈顶(空则 -1); right = i; w = right-left-1; len[w]=max(len[w], arr[top])</text>
  </g>

  <!-- arrow -->
  <path d="M 320 148 L 320 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="174" width="560" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="198" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 收尾：栈中剩余元素的右更小视为 n（数组末端外）</text>
  <g font-size="11.5" font-family="monospace" fill="#555">
    <text x="60" y="220" filter="url(#rough2)">while 栈非空:</text>
    <text x="60" y="238" filter="url(#rough2)">  top = pop; left = 栈顶(空则 -1); right = n; w = right-left-1; len[w]=max(len[w], arr[top])</text>
  </g>

  <!-- arrow -->
  <path d="M 320 250 L 320 270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="276" width="560" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 映射：res[i] = len[i+1]（窗口大小 k 对应 len[k]）</text>
  <g font-size="11.5" font-family="monospace" fill="#555">
    <text x="60" y="322" filter="url(#rough2)">for i in 0..n-1: res[i] = len[i+1]   // 此时部分 res[i] 可能为 0（无元素恰好以该大小为最大窗口）</text>
  </g>

  <!-- arrow -->
  <path d="M 320 338 L 320 358" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="364" width="560" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="388" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 反向传播：res[i] = max(res[i], res[i+1])（i 从 n-2 到 0）</text>
  <g font-size="11.5" fill="#555">
    <text x="60" y="410" filter="url(#rough2)">最大最小值随窗口增大单调不增：大窗口的答案对更小窗口同样成立（任取大窗口的子窗口）。</text>
    <text x="60" y="428" filter="url(#rough2)">从右向左取 max，把「恰好命中」的值扩散到未命中的位置，填补 0 空缺 → 得到最终答案。</text>
  </g>
</svg>
