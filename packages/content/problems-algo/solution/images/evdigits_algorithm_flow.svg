<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：值域分段判定（一趟遍历）</text>

  <!-- Start -->
  <rect x="230" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="215" y="98" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333">count = 0, i = 0</text>
  <line x1="280" y1="128" x2="280" y2="146" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop diamond: i < n? -->
  <polygon points="280,148 350,184 280,220 210,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#888">遍历完?</text>

  <!-- No branch -> return count -->
  <line x1="350" y1="184" x2="398" y2="184" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="400" y="168" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="460" y="189" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return count</text>

  <!-- Yes branch down -->
  <line x1="280" y1="220" x2="280" y2="238" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- x = nums[i] -->
  <rect x="220" y="240" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">x = nums[i]</text>
  <line x1="280" y1="270" x2="280" y2="288" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: even digits? -->
  <polygon points="280,290 370,330 280,370 190,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333">10≤x≤99  ‖</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333">1000≤x≤9999  ‖</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333">x==100000 ?</text>

  <!-- Yes -> count++ -->
  <line x1="370" y1="330" x2="398" y2="330" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="314" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count++</text>
  <!-- count++ merges down to i++ -->
  <path d="M 455 346 L 455 392 L 280 392" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> directly to i++ -->
  <line x1="280" y1="370" x2="280" y2="388" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="380" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- i++ -->
  <rect x="235" y="390" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- Loop back arrow: i++ -> left -> up -> right to loop diamond -->
  <path d="M 235 405 L 130 405 L 130 184 L 206 184" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="296" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 118 296)">回到循环判断</text>
</svg>
