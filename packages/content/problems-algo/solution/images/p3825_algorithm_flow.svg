<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="640" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：枚举位 → 过滤 → LIS（贪心+二分）→ 取 max</text>

  <!-- 开始 -->
  <rect x="180" y="44" width="200" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输入 nums（n ≤ 1e5，值 ≤ 1e9）</text>

  <path d="M 280 78 L 280 96" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask 预筛 -->
  <rect x="150" y="98" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">mask = OR(nums)：只枚举出现过的位</text>

  <path d="M 280 138 L 280 156" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举位（循环头） -->
  <rect x="170" y="158" width="220" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举 mask 中的下一个位 b</text>

  <path d="M 280 192 L 280 210" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 过滤 -->
  <rect x="120" y="212" width="320" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">过滤：按原顺序收集</text>
  <text x="280" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 b 位为 1 的元素（x &gt;&gt; b &amp; 1 == 1）</text>

  <path d="M 280 258 L 280 276" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：过滤后为空？ -->
  <polygon points="280,278 372,312 280,346 188,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">过滤后为空？</text>

  <!-- 是：跳过 -->
  <path d="M 372 312 L 412 312" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="304" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="416" y="292" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过该位</text>
  <text x="476" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（换下一位）</text>
  <path d="M 476 292 L 476 175 L 396 175" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 否：做 LIS -->
  <path d="M 280 346 L 280 368" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="362" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- LIS 贪心+二分 -->
  <rect x="90" y="370" width="380" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">LIS（贪心 + 二分）：对每个 x 在 tails 中</text>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二分找首个 ≥ x 的位置替换之；越界则追加</text>

  <path d="M 280 418 L 280 436" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="160" y="438" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="460" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = max(ans, len(tails))</text>

  <path d="M 280 472 L 280 490" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：位枚举完？ -->
  <polygon points="280,492 360,526 280,560 200,526" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="523" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">位枚举完？</text>
  <text x="280" y="541" text-anchor="middle" font-size="10.5" fill="#99865a" filter="url(#rough2)">（mask 还有位吗）</text>

  <!-- 否：回到枚举位 -->
  <path d="M 200 526 L 40 526 L 40 175 L 164 175" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="518" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 是：输出 -->
  <path d="M 280 560 L 280 582" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="576" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 结束 -->
  <rect x="175" y="584" width="210" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="608" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans（全 0 自然为 0）</text>
</svg>
