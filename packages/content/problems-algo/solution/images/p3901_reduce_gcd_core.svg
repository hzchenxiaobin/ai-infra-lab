<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：除 p 降维 → 全局 gcd 是唯一门槛，长度限制只卡 n ≤ 7</text>

  <!-- ① 左上：除 p 降维 -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="256" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="148" y="56" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">① 只留 p 的倍数，再除以 p（降维）</text>
    <text x="32" y="74" font-size="9" fill="#666">nums（p = 3）：</text>

    <rect x="48" y="78" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="68" y="93" text-anchor="middle" font-size="11" fill="#333">6</text>
    <rect x="100" y="78" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="93" text-anchor="middle" font-size="11" fill="#333">9</text>
    <rect x="152" y="78" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="93" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="204" y="78" width="40" height="22" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="224" y="93" text-anchor="middle" font-size="11" fill="#999">8</text>

    <path d="M146 100 L146 114" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="156" y="112" font-size="9.5" fill="#33506b">÷ p</text>

    <rect x="48" y="116" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="68" y="131" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="100" y="116" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="131" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="152" y="116" width="40" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="131" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="204" y="116" width="40" height="22" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="224" y="131" text-anchor="middle" font-size="11" fill="#999">∅</text>

    <text x="148" y="152" text-anchor="middle" font-size="9.5" fill="#33506b">好子序列 ⟺ 全选 p 的倍数 ∧ 除后 gcd = 1</text>
  </g>

  <!-- ②③ 左下：全局 gcd 整除下界 + 长度这道坎 -->
  <g filter="url(#rough2)">
    <rect x="20" y="170" width="256" height="224" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="148" y="188" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">② 全局 gcd g 整除一切子集的 gcd</text>
    <text x="148" y="207" text-anchor="middle" font-size="10" fill="#2f5d24">g ≥ 2 ⇒ 任何子集的 gcd ≥ 2 →「否」</text>
    <text x="148" y="223" text-anchor="middle" font-size="10" fill="#2f5d24">g = 1 ⇒ 只剩「长度 &lt; n」这道坎</text>

    <text x="148" y="245" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">③ 这道坎怎么过（m = 活动元素个数）</text>
    <text x="148" y="264" text-anchor="middle" font-size="10" fill="#2f5d24">m &lt; n：取全部活动元素（T = S），</text>
    <text x="148" y="279" text-anchor="middle" font-size="10" fill="#2f5d24">　长度 m ≤ n−1 且 gcd = g = 1 →「是」</text>
    <text x="148" y="301" text-anchor="middle" font-size="10" fill="#2f5d24">m = n：子集必须删掉至少一个元素；</text>
    <text x="148" y="316" text-anchor="middle" font-size="10" fill="#2f5d24">　子集越小 gcd 只增不减 ⇒ 只试「删一个」</text>

    <rect x="36" y="328" width="224" height="26" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="148" y="345" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">答案 = [ ∃i：gcd(S∖{i}) = 1 ]</text>

    <text x="148" y="368" text-anchor="middle" font-size="9.5" fill="#4a6b5a">（删一个失败 ⇒ 删更多只会更糟：</text>
    <text x="148" y="383" text-anchor="middle" font-size="9.5" fill="#4a6b5a">　gcd(S∖{i}) 整除其一切子集的 gcd）</text>
  </g>

  <!-- ④ 右上：临界素数反例 -->
  <g filter="url(#rough2)">
    <rect x="292" y="38" width="248" height="152" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="416" y="56" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">④ 「删一个」何时失败：临界素数</text>
    <text x="416" y="74" text-anchor="middle" font-size="10" fill="#8a6d1a">反例 a = [6, 10, 15]（n = 3，g = 1）：</text>
    <text x="416" y="96" text-anchor="middle" font-size="10" fill="#8a6d1a">素数 2 整除 6、10 —— 恰好漏掉 <tspan fill="#b85450" font-weight="bold">15</tspan></text>
    <text x="416" y="116" text-anchor="middle" font-size="10" fill="#8a6d1a">素数 3 整除 6、15 —— 恰好漏掉 <tspan fill="#b85450" font-weight="bold">10</tspan></text>
    <text x="416" y="136" text-anchor="middle" font-size="10" fill="#8a6d1a">素数 5 整除 10、15 —— 恰好漏掉 <tspan fill="#b85450" font-weight="bold">6</tspan></text>
    <text x="416" y="160" text-anchor="middle" font-size="10" fill="#8a6d1a">三个下标全被漏 ⇒ 删谁都剩 gcd ≥ 2</text>
    <text x="416" y="180" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">→ 答案「否」（尽管 g = 1！）</text>
  </g>

  <!-- ⑤ 右下：素数预算 -->
  <g filter="url(#rough2)">
    <rect x="292" y="202" width="248" height="192" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="416" y="220" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">⑤ 素数预算：n ≥ 8 永远安全</text>
    <text x="416" y="240" text-anchor="middle" font-size="10" fill="#8a3030">a ≤ 5×10⁴ ⇒ 每个数至多 6 个素因子</text>
    <text x="416" y="257" text-anchor="middle" font-size="9.5" fill="#8a3030">（2·3·5·7·11·13 = 30030，再 ×17 超界）</text>
    <text x="416" y="279" text-anchor="middle" font-size="10" fill="#8a3030">临界素数 ≤ ⌊6n/(n−1)⌋ ≤ 6 &lt; n（n ≥ 8）</text>
    <text x="416" y="297" text-anchor="middle" font-size="10" fill="#8a3030">⇒ 被漏下标至多 6 个 &lt; n，必有幸存者</text>
    <text x="416" y="315" text-anchor="middle" font-size="10" fill="#8a3030">⇒ m = n 时「删一个」必成功</text>

    <rect x="304" y="330" width="224" height="50" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <text x="416" y="348" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">n ≥ 8：答案 = [ g = 1 ]，gcd 线段树维护</text>
    <text x="416" y="368" text-anchor="middle" font-size="10" fill="#8a3030">n ≤ 7：按公式直判（O(n²) 次 gcd）</text>
  </g>
</svg>
