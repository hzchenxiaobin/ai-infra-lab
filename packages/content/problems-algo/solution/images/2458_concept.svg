<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：脊柱外的最深叶子决定剩余高度</text>

  <!-- ===== 左侧：示例 1 的树 ===== -->
  <!-- 普通边（先画底层） -->
  <g stroke="#9aa6b8" stroke-width="1.5" fill="none" filter="url(#rough2)" stroke-linecap="round">
    <line x1="170" y1="92" x2="115" y2="160" stroke="#4a7a3a" stroke-width="2.3"/>
    <line x1="115" y1="160" x2="80" y2="228" stroke="#4a7a3a" stroke-width="2.3"/>
  </g>
  <!-- 脊柱边 1->4（橙色加粗） -->
  <line x1="170" y1="92" x2="235" y2="160" stroke="#d6a040" stroke-width="2.8" filter="url(#rough2)" stroke-linecap="round"/>
  <!-- 移除子树的边（灰色虚线） -->
  <g stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)" stroke-linecap="round">
    <line x1="235" y1="160" x2="200" y2="228"/>
    <line x1="235" y1="160" x2="270" y2="228"/>
    <line x1="270" y1="228" x2="305" y2="298"/>
  </g>

  <!-- 节点 -->
  <!-- 1 根，脊柱起点 -->
  <circle cx="170" cy="92" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="78" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">脊柱</text>

  <!-- 3 姐妹子树根（绿） -->
  <circle cx="115" cy="160" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="115" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 2 姐妹子树叶子（绿） -->
  <circle cx="80" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="80" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="80" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">depth=2</text>

  <!-- 4 查询目标（红） -->
  <circle cx="235" cy="160" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="235" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="235" y="136" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">移除子树</text>

  <!-- 6,5,7 被移除（灰虚） -->
  <circle cx="200" cy="228" r="17" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="200" y="233" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <circle cx="270" cy="228" r="17" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="233" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <circle cx="305" cy="298" r="17" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="305" y="303" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">7</text>

  <!-- ===== 右侧：公式说明框 ===== -->
  <rect x="365" y="80" width="180" height="270" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="105" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">关键递推</text>
  <line x1="380" y1="115" x2="530" y2="115" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="378" y="138" font-size="11" fill="#333" filter="url(#rough2)">移除子树(u) 后,</text>
  <text x="378" y="156" font-size="11" fill="#333" filter="url(#rough2)">剩余高度 = 脊柱外</text>
  <text x="378" y="174" font-size="11" fill="#333" filter="url(#rough2)">最深叶子的深度</text>

  <text x="378" y="202" font-size="11" fill="#b85450" filter="url(#rough2)">ans[u] = max(</text>
  <text x="388" y="220" font-size="11" fill="#333" filter="url(#rough2)">ans[父],</text>
  <text x="388" y="238" font-size="11" fill="#4a7a3a" filter="url(#rough2)">depth[u]+height[姐妹]</text>
  <text x="378" y="256" font-size="11" fill="#b85450" filter="url(#rough2)">)</text>

  <line x1="380" y1="270" x2="530" y2="270" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="378" y="292" font-size="11" fill="#333" filter="url(#rough2)">本例 ans[4] =</text>
  <text x="388" y="310" font-size="11" fill="#4a7a3a" filter="url(#rough2)">depth[3]+height[3]</text>
  <text x="388" y="328" font-size="11" fill="#333" filter="url(#rough2)">= 1 + 1 = 2</text>
  <text x="388" y="344" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>

  <!-- 图例 -->
  <rect x="55" y="345" width="12" height="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="351" font-size="10" fill="#666" filter="url(#rough2)">脊柱</text>
  <rect x="115" y="345" width="12" height="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="132" y="351" font-size="10" fill="#666" filter="url(#rough2)">姐妹子树</text>
  <rect x="190" y="345" width="12" height="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="207" y="351" font-size="10" fill="#666" filter="url(#rough2)">被移除</text>
</svg>
