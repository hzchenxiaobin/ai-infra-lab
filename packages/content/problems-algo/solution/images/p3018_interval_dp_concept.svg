<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：只删两端 ⇒ 剩余永远是连续区间 [i, j]</text>

  <!-- deleted left cells -->
  <rect x="140" y="52" width="44" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a₀</text>
  <rect x="190" y="52" width="44" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a₁</text>

  <!-- surviving interval -->
  <rect x="240" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a₂</text>
  <rect x="290" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a₃</text>
  <rect x="340" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a₄</text>

  <!-- deleted right cell -->
  <rect x="390" y="52" width="44" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a₅</text>

  <!-- labels: deleted / surviving -->
  <text x="187" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">已删除</text>
  <text x="312" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">存活区间 [i, j] = [2, 4]</text>
  <text x="412" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">已删除</text>

  <!-- deletion arrows at both ends -->
  <path d="M 240 70 L 196 70" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删除只发生在这两端</text>
  <path d="M 384 70 L 428 70" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="406" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两端</text>

  <!-- transitions -->
  <text x="310" y="152" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">转移：区间由外向内收缩一格，f 值本身就是下一个查询的下标</text>

  <!-- left source -->
  <rect x="60" y="172" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="119" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[i−1][j]</text>

  <path d="M 178 189 L 240 189" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="209" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">删左端 aᵢ₋₁</text>

  <!-- right source -->
  <rect x="442" y="172" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="501" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[i][j+1]</text>

  <path d="M 442 189 L 380 189" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="411" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">删右端 aⱼ₊₁</text>

  <!-- center state -->
  <rect x="244" y="170" width="132" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[i][j]（= 已处理 k 个）</text>

  <!-- condition notes -->
  <rect x="60" y="216" width="230" height="52" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="175" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">端点 ≥ queries[k] ？</text>
  <text x="175" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是 → 用查询删，k 加 1</text>
  <text x="175" y="266" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(删得动就别浪费查询)</text>

  <rect x="330" y="216" width="230" height="52" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">端点 &lt; queries[k] ？</text>
  <text x="445" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是 → 免费删，k 不变（+0）</text>
  <text x="445" y="266" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(绊脚石白丢掉即可)</text>

  <!-- bottom equivalence box -->
  <rect x="40" y="288" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">「开局换子序列」 ≡ 「过程中随时免费丢一个端点」</text>
  <text x="310" y="332" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">免费删掉的元素集合 D，等价于开局就把 D 从 nums 里剔除成子序列；</text>
  <text x="310" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">子序列之外的元素也总能等它成为端点时再免费删——两种视角可互换。</text>
  <text x="310" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 例：查询 4 面对两端 3,3 卡死时，免费丢掉一个 3，内部的 4 就成了端点！</text>
</svg>
