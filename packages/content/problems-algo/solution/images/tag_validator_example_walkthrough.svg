<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：栈状态追踪（合法 vs 非法）</text>

  <!-- ===== Example 1: valid ===== -->
  <rect x="20" y="40" width="520" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="34" y="60" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例 1（合法）：&lt;DIV&gt;...&lt;![CDATA[&lt;div&gt;]]&gt;...&lt;/DIV&gt;</text>

  <!-- Step 1: push DIV -->
  <rect x="34" y="72" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="92" font-size="10.5" fill="#446688">step1: push DIV</text>
  <rect x="148" y="76" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="163" y="92" text-anchor="middle" font-size="9.5" fill="#7a5415">DIV</text>
  <text x="163" y="112" text-anchor="middle" font-size="9" fill="#999">栈: [DIV]</text>

  <path d="M 184 87 L 200 87" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: cdata skip -->
  <rect x="204" y="72" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="92" font-size="10.5" fill="#4a7a3a">step2: 跳过 CDATA</text>
  <text x="279" y="112" text-anchor="middle" font-size="9" fill="#999">栈: [DIV]（不变）</text>

  <path d="M 354 87 L 370 87" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: pop DIV -->
  <rect x="374" y="72" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="384" y="92" font-size="10.5" fill="#b85450">step3: pop DIV ✓</text>
  <text x="449" y="112" text-anchor="middle" font-size="9" fill="#999">栈: [] 空 → i==n</text>

  <!-- Result -->
  <rect x="34" y="130" width="492" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果：栈空 + 到达末尾 → true ✓</text>

  <text x="34" y="178" font-size="10" fill="#666">CDATA 内的 &lt;div&gt; 被视为普通字符，不解析为标签</text>
  <text x="34" y="196" font-size="10" fill="#666">根标签 &lt;DIV&gt;...&lt;/DIV&gt; 包裹全部内容，嵌套正确</text>

  <!-- ===== Example 3: invalid ===== -->
  <path d="M 30 232 L 530 232" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <rect x="20" y="244" width="520" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="34" y="264" font-size="11.5" fill="#b85450" font-weight="bold">示例 3（非法）：&lt;A&gt;  &lt;B&gt; &lt;/A&gt;   &lt;/B&gt;</text>

  <!-- Step 1: push A -->
  <rect x="34" y="276" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="296" font-size="10.5" fill="#446688">step1: push A</text>
  <text x="109" y="316" text-anchor="middle" font-size="9" fill="#999">栈: [A]</text>

  <path d="M 184 291 L 200 291" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: push B -->
  <rect x="204" y="276" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="296" font-size="10.5" fill="#446688">step2: push B</text>
  <text x="279" y="316" text-anchor="middle" font-size="9" fill="#999">栈: [A, B]</text>

  <path d="M 354 291 L 370 291" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: try pop A but top is B -->
  <rect x="374" y="276" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="384" y="296" font-size="10.5" fill="#b85450">step3: 遇 &lt;/A&gt;</text>
  <text x="449" y="316" text-anchor="middle" font-size="9" fill="#b85450">栈顶=B ≠ A ✗</text>

  <!-- Result -->
  <rect x="34" y="334" width="492" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结果：结束标签名 ≠ 栈顶 → false ✗</text>

  <text x="34" y="382" font-size="10" fill="#666">&lt;A&gt; 内先开了 &lt;B&gt;，&lt;/A&gt; 时 B 尚未闭合 → 交叉嵌套非法</text>
  <text x="34" y="400" font-size="10" fill="#666">栈的 LIFO 特性天然检测：结束标签必须与最近未闭合的开始标签同名</text>
</svg>
