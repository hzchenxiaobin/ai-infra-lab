<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：一趟扫描 + 滚动续接/重置</text>

  <rect x="190" y="46" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333">cur = 1, best = 1, i = 1</text>

  <path d="M 270 84 L 270 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="106" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="12" fill="#333">i &lt; n ? （是否扫完）</text>

  <path d="M 150 124 L 96 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="16" y="106" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return best</text>

  <path d="M 270 142 L 270 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <polygon points="270,164 386,206 270,248 154,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="11.5" fill="#333">nums[i] &gt; nums[i−1] ?</text>
  <text x="270" y="218" text-anchor="middle" font-size="10" fill="#888">（相邻是否递增）</text>

  <path d="M 154 206 L 96 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="16" y="188" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a">cur = cur + 1</text>
  <text x="56" y="218" text-anchor="middle" font-size="10" fill="#888">续接</text>

  <path d="M 386 206 L 444 206" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="444" y="188" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="484" y="204" text-anchor="middle" font-size="11" fill="#b85450">cur = 1</text>
  <text x="484" y="218" text-anchor="middle" font-size="10" fill="#888">重置</text>

  <path d="M 56 224 L 56 262 L 240 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 484 224 L 484 262 L 300 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="246" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="12" fill="#333">best = max(best, cur)</text>

  <path d="M 270 282 L 270 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="304" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="327" text-anchor="middle" font-size="12" fill="#333">i = i + 1</text>

  <path d="M 270 340 L 270 360 L 350 360 L 350 124 L 390 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="354" font-size="10" fill="#446688">回循环</text>

  <rect x="40" y="384" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一趟扫描 O(n)，常数空间 O(1)</text>
  <text x="270" y="426" text-anchor="middle" font-size="11" fill="#555">cur 即 dp[i] 的滚动值，best 即 max(dp)，无需数组</text>
</svg>
