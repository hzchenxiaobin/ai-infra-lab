<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两路套公式，结果拼接为数组</text>

  <!-- ===================== Example 1: celsius = 36.50 ===================== -->
  <text x="30" y="52" font-size="12.5" fill="#446688" font-weight="bold">示例 1</text>

  <!-- input box -->
  <rect x="30" y="58" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="12" fill="#333">celsius = 36.50</text>

  <!-- split arrows -->
  <path d="M 90 92 L 90 104 L 175 104 L 175 110" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 90 92 L 90 104 L 360 104 L 360 110" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- kelvin computation -->
  <rect x="160" y="112" width="180" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">kelvin = C + 273.15</text>
  <text x="250" y="148" text-anchor="middle" font-size="11.5" fill="#333">= 36.50 + 273.15 = 309.65</text>

  <!-- fahrenheit computation -->
  <rect x="350" y="112" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">fahrenheit = C×1.8+32</text>
  <text x="440" y="148" text-anchor="middle" font-size="11.5" fill="#333">= 65.70 + 32 = 97.70</text>

  <!-- converge arrows -->
  <path d="M 250 160 L 250 170 L 320 170 L 320 178" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 440 160 L 440 170 L 360 170 L 360 178" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="200" y="180" width="280" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = [309.65000, 97.70000]</text>

  <!-- divider -->
  <path d="M 30 226 L 510 226" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 2: celsius = 122.11 ===================== -->
  <text x="30" y="250" font-size="12.5" fill="#446688" font-weight="bold">示例 2</text>

  <!-- input box -->
  <rect x="30" y="256" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="278" text-anchor="middle" font-size="12" fill="#333">celsius = 122.11</text>

  <!-- split arrows -->
  <path d="M 90 290 L 90 302 L 175 302 L 175 308" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 90 290 L 90 302 L 360 302 L 360 308" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- kelvin computation -->
  <rect x="160" y="310" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="335" text-anchor="middle" font-size="11.5" fill="#333">= 122.11 + 273.15 = 395.26</text>

  <!-- fahrenheit computation -->
  <rect x="350" y="310" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="335" text-anchor="middle" font-size="11.5" fill="#333">= 219.798 + 32 = 251.798</text>

  <!-- converge + output combined note -->
  <rect x="180" y="354" width="320" height="4" fill="#b85450" filter="url(#rough2)"/>
</svg>
