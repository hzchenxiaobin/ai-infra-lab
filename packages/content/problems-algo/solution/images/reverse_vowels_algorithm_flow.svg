<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：左跳非元音 / 右跳非元音 / 交换 / 收敛</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每轮最多一次交换，循环 left &lt; right 控制</text>

  <!-- ===== 初始化 ===== -->
  <rect x="200" y="58" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left=0, right=n-1</text>
  <line x1="280" y1="92" x2="280" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 循环判定 ===== -->
  <polygon points="280,110 380,150 280,190 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">（否则结束）</text>

  <!-- 否 → 结束 -->
  <line x1="380" y1="150" x2="440" y2="150" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="134" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 s</text>

  <!-- 是 ↓ -->
  <line x1="280" y1="190" x2="280" y2="204" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== 步骤①：left 找元音 ===== -->
  <rect x="170" y="208" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">①</tspan> while !vowel(s[left]) : left++</text>
  <line x1="280" y1="242" x2="280" y2="256" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤②：right 找元音 ===== -->
  <rect x="170" y="260" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold" fill="#d6a040">②</tspan> while !vowel(s[right]) : right--</text>
  <line x1="280" y1="294" x2="280" y2="308" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 再次判定 left<right ===== -->
  <polygon points="280,312 360,344 280,376 200,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="356" text-anchor="middle" font-size="9" fill="#888">（防交叉后误换）</text>

  <!-- 否 → 回到顶部循环 -->
  <line x1="200" y1="344" x2="120" y2="344" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="344" x2="120" y2="150" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="150" x2="174" y2="150" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="128" y="250" font-size="10" fill="#b85450" font-weight="bold">否↺ 回循环</text>

  <!-- 是 ↓ -->
  <line x1="280" y1="376" x2="280" y2="390" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== 步骤③：交换 + 推进 ===== -->
  <rect x="150" y="394" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold" fill="#b85450">③</tspan> swap(s[left++], s[right--])</text>

  <!-- 回循环 -->
  <line x1="410" y1="411" x2="450" y2="411" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="450" y1="411" x2="450" y2="150" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="450" y1="150" x2="384" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="456" y="280" font-size="10" fill="#446688" font-weight="bold">↺ 回循环</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="40" y="436" width="500" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="54" y="451" font-size="10" fill="#b85450" font-weight="bold">⚠️ 交换前再判一次 left&lt;right：扫描后可能已交叉，避免把已配对的元音又换回去</text>
</svg>
