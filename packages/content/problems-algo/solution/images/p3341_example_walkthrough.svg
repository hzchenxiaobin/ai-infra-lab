<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：moveTime = [[0,4],[4,4]]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">从 (0,0) 出发，堆中逐次弹出时间最小的房间</text>

  <!-- column headers -->
  <text x="42" y="66" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="130" y="66" font-size="10" fill="#888" font-weight="bold">弹出 (d,x,y)</text>
  <text x="258" y="66" font-size="10" fill="#888" font-weight="bold">松弛动作</text>
  <text x="392" y="66" font-size="10" fill="#888" font-weight="bold">dist 网格</text>
  <text x="488" y="66" font-size="10" fill="#888" font-weight="bold">堆(处理后)</text>

  <!-- ===== Initial row ===== -->
  <rect x="20" y="74" width="520" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="95" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="130" y="95" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="258" y="95" text-anchor="middle" font-size="10" fill="#888">dist[0][0] = 0</text>
  <text x="392" y="95" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[[0,∞],[∞,∞]]</text>
  <text x="488" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0,·,·)]</text>

  <!-- ===== Step 1 ===== -->
  <rect x="20" y="114" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="130" y="142" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(0,(0,0))</text>
  <text x="258" y="135" text-anchor="middle" font-size="9" fill="#555">→(0,1): max(0,4)+1=5 ✓</text>
  <text x="258" y="150" text-anchor="middle" font-size="9" fill="#555">→(1,0): max(0,4)+1=5 ✓</text>
  <text x="392" y="142" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[[0,5],[5,∞]]</text>
  <text x="488" y="142" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(5,(0,1)),(5,(1,0))]</text>

  <!-- ===== Step 2 ===== -->
  <rect x="20" y="168" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(5,(0,1))</text>
  <text x="258" y="189" text-anchor="middle" font-size="9" fill="#555">→(1,1): max(5,4)+1=6 ✓</text>
  <text x="258" y="204" text-anchor="middle" font-size="9" fill="#999">→(0,0): 5+1=6&gt;0 ✗</text>
  <text x="392" y="196" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[[0,5],[5,6]]</text>
  <text x="488" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(5,(1,0)),(6,(1,1))]</text>

  <!-- ===== Step 3 ===== -->
  <rect x="20" y="224" width="520" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="248" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(5,(1,0))</text>
  <text x="258" y="248" text-anchor="middle" font-size="9" fill="#999">→(1,1): 6≥6 ✗（无更优）</text>
  <text x="392" y="248" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">不变</text>
  <text x="488" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(6,(1,1))]</text>

  <!-- ===== Step 4 ===== -->
  <rect x="20" y="272" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(6,(1,1))</text>
  <text x="258" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">★ 是终点，立即返回 6</text>
  <text x="392" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-family="monospace">确定 6</text>
  <text x="488" y="296" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[]</text>

  <!-- arrow down to conclusion -->
  <path d="M 280 316 L 280 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Conclusion ===== -->
  <rect x="60" y="338" width="440" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">终点弹出即确定：答案 = 6</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">路径：(0,0) —t=5→ (1,0) —t=6→ (1,1)</text>

  <!-- footnotes -->
  <text x="40" y="412" font-size="10" fill="#888">第 2 步：t=5 已晚于 (1,1) 的开启时间 4 → 等待 0 秒直接进（max 的含义）</text>
  <text x="40" y="430" font-size="10" fill="#888">第 3 步：两条候选路径时间相同，后弹出者松弛失败被跳过，堆中不留垃圾记录</text>
</svg>
