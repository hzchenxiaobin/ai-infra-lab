<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">last[c] ＝ 路径上「最近同字符节点」的速查表</text>

  <!-- ===== 左侧：DFS 活动路径 ===== -->
  <text x="105" y="52" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">DFS 活动路径（已进入未退出）</text>

  <!-- 路径连线 -->
  <line x1="105" y1="94" x2="105" y2="126" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="105" y1="160" x2="105" y2="192" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="105" y1="226" x2="105" y2="258" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 节点 0:a -->
  <circle cx="105" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">0:a</text>
  <!-- 节点 1:b -->
  <circle cx="105" cy="146" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1:b</text>
  <!-- 节点 4:a -->
  <circle cx="105" cy="212" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="216" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">4:a</text>
  <text x="128" y="216" font-size="8" fill="#888" filter="url(#rough2)">← x 的父亲，但是 'a'</text>
  <!-- 节点 2:b（当前进入，红圈） -->
  <circle cx="105" cy="272" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="105" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2:b</text>
  <text x="105" y="305" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">正在进入 x ＝ 2</text>
  <text x="105" y="330" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（示例 2 中的路径 0→1→4→2）</text>

  <!-- ===== 右上：last 表 ===== -->
  <text x="355" y="52" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">进入 2 的瞬间，查表：</text>
  <rect x="245" y="62" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">last['a']</text>
  <rect x="355" y="62" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">last['b']</text>
  <rect x="245" y="92" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="355" y="92" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 查表箭头 -->
  <path d="M 124 266 Q 290 235 402 128" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">新父 ＝ last['b'] ＝ 1 ✓</text>
  <text x="300" y="184" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">路径上 'b' 只出现在 1，</text>
  <text x="300" y="197" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">父亲 4 是 'a' 帮不上忙</text>

  <!-- ===== 右下：四拍说明框 ===== -->
  <rect x="225" y="212" width="275" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="362" y="232" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">进入 / 退出「四拍」（c ＝ s[x]）</text>
  <text x="237" y="252" font-size="9" fill="#2f5d24" filter="url(#rough2)">① 进入 x：先查 last[c]</text>
  <text x="237" y="268" font-size="9" fill="#2f5d24" filter="url(#rough2)">② 非空 ⇒ np[x] ＝ last[c]（改挂目标）</text>
  <text x="237" y="284" font-size="9" fill="#2f5d24" filter="url(#rough2)">③ 存旧值，last[c] ＝ x，深入孩子</text>
  <text x="237" y="300" font-size="9" fill="#2f5d24" filter="url(#rough2)">④ 退出 x：last[c] ＝ 旧值（还原现场）</text>
  <text x="237" y="322" font-size="8.5" fill="#a05a20" filter="url(#rough2)">不还原 ⇒ 已离开路径的节点</text>
  <text x="237" y="334" font-size="8.5" fill="#a05a20" filter="url(#rough2)">会被错认成祖先！</text>
</svg>
