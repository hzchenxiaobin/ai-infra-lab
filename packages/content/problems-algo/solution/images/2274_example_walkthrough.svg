<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：排序后逐段统计空隙</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="58" font-size="12" fill="#446688" font-weight="bold">示例 1：bottom=2, top=9, special=[4,6] → 排序后 [4,6]</text>

  <!-- table header -->
  <g font-size="10.5" fill="#888">
    <rect x="30" y="68" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="85" y="84" text-anchor="middle">段类型</text>
    <rect x="140" y="68" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="230" y="84" text-anchor="middle">计算</text>
    <rect x="320" y="68" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="375" y="84" text-anchor="middle">连续楼层</text>
    <rect x="430" y="68" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="460" y="84" text-anchor="middle">个数</text>
  </g>

  <!-- row 1: head -->
  <g font-size="11" fill="#333">
    <rect x="30" y="94" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="85" y="111" text-anchor="middle">头段</text>
    <rect x="140" y="94" width="180" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="230" y="111" text-anchor="middle">special[0]−bottom = 4−2</text>
    <rect x="320" y="94" width="110" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="375" y="111" text-anchor="middle">2..3</text>
    <rect x="430" y="94" width="60" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="460" y="111" text-anchor="middle" font-weight="bold">2</text>
  </g>

  <!-- row 2: middle -->
  <g font-size="11" fill="#333">
    <rect x="30" y="122" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="85" y="139" text-anchor="middle">中间段</text>
    <rect x="140" y="122" width="180" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="230" y="139" text-anchor="middle">special[1]−special[0]−1 = 6−4−1</text>
    <rect x="320" y="122" width="110" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="375" y="139" text-anchor="middle">5..5</text>
    <rect x="430" y="122" width="60" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="460" y="139" text-anchor="middle" font-weight="bold">1</text>
  </g>

  <!-- row 3: tail (highlight) -->
  <g font-size="11" fill="#b85450">
    <rect x="30" y="150" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="85" y="167" text-anchor="middle" font-weight="bold">尾段</text>
    <rect x="140" y="150" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="230" y="167" text-anchor="middle" font-weight="bold">top−special[last] = 9−6</text>
    <rect x="320" y="150" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="375" y="167" text-anchor="middle" font-weight="bold">7..9</text>
    <rect x="430" y="150" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="460" y="167" text-anchor="middle" font-weight="bold">3</text>
  </g>

  <!-- answer 1 -->
  <rect x="120" y="186" width="320" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max(2, 1, 3) = 3 → 输出 3</text>

  <!-- ===== divider ===== -->
  <line x1="20" y1="232" x2="540" y2="232" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="260" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：bottom=6, top=8, special=[7,6,8] → 排序后 [6,7,8]</text>

  <!-- compact gap chips -->
  <g font-size="10.5" fill="#333">
    <rect x="30" y="272" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="90" y="289" text-anchor="middle">头段 6−6</text>
    <text x="90" y="305" text-anchor="middle" font-weight="bold" fill="#446688">= 0</text>

    <rect x="158" y="272" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="218" y="289" text-anchor="middle">中间 7−6−1</text>
    <text x="218" y="305" text-anchor="middle" font-weight="bold" fill="#d6a040">= 0</text>

    <rect x="286" y="272" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="346" y="289" text-anchor="middle">中间 8−7−1</text>
    <text x="346" y="305" text-anchor="middle" font-weight="bold" fill="#d6a040">= 0</text>

    <rect x="414" y="272" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="474" y="289" text-anchor="middle">尾段 8−8</text>
    <text x="474" y="305" text-anchor="middle" font-weight="bold" fill="#b85450">= 0</text>
  </g>

  <!-- answer 2 -->
  <rect x="120" y="324" width="320" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max(0, 0, 0, 0) = 0 → 输出 0</text>

  <!-- footer -->
  <rect x="30" y="372" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#333">关键：special 未排序时相邻关系未知，排序后每个“相邻特殊楼层对”才对应一段空隙</text>
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#333">首尾各一个边界（bottom / top）也视作“隔板”，故空隙分三类：头、中、尾</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#888">special 全覆盖 [bottom, top] 时各空隙均为 0，结果自然为 0</text>
</svg>
