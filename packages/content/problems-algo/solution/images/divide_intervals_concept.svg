<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最少组数 = 任意时刻重叠区间数的最大值</text>

  <!-- interval bars: x(p) = 100 + (p-1)*42 -->
  <!-- [1,5] -->
  <rect x="100" y="64" width="168" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="184" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[1,5]</text>
  <!-- [1,10] -->
  <rect x="100" y="96" width="378" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="289" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,10]</text>
  <!-- [2,3] -->
  <rect x="142" y="128" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="163" y="144" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[2,3]</text>
  <!-- [5,10] -->
  <rect x="268" y="160" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="373" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[5,10]</text>
  <!-- [6,8] -->
  <rect x="310" y="192" width="84" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="352" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6,8]</text>

  <!-- vertical dashed line at point 2 (x=142): 3 intervals overlap -->
  <line x1="142" y1="56" x2="142" y2="232" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="150" y="54" font-size="11" fill="#b85450" font-weight="bold">t=2</text>

  <!-- vertical dashed line at point 5 (x=268): 3 intervals overlap -->
  <line x1="268" y1="56" x2="268" y2="232" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="276" y="54" font-size="11" fill="#b85450" font-weight="bold">t=5</text>

  <!-- count callouts -->
  <text x="142" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">重叠 3 个 → 需 3 组</text>
  <text x="268" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">重叠 3 个 → 需 3 组</text>

  <!-- timeline axis -->
  <line x1="90" y1="266" x2="492" y2="266" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="284" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="142" y="284" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="184" y="284" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="226" y="284" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="268" y="284" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="310" y="284" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="352" y="284" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="394" y="284" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="436" y="284" text-anchor="middle" font-size="10" fill="#888">9</text>
  <text x="478" y="284" text-anchor="middle" font-size="10" fill="#888">10</text>
  <text x="498" y="270" font-size="10.5" fill="#888">t</text>

  <!-- insight box -->
  <rect x="40" y="300" width="480" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12.5" fill="#b85450" font-weight="bold">💡 为什么「最大重叠数 = 最少组数」？</text>
  <text x="56" y="342" font-size="11" fill="#b85450">同一组内区间两两不相交 ⟹ 某时刻重叠的 k 个区间必须分属 k 个不同组</text>
  <text x="56" y="360" font-size="11" fill="#b85450">下界：峰值时刻 k 个重叠 ⟹ 至少 k 组；上界：按峰值 k 贪心着色必可分成 k 组</text>
  <text x="56" y="378" font-size="11" fill="#b85450">（区间图是完美图，最大团数 = 点色数，下界即上界 ⟹ 答案 = 最大重叠数）</text>
</svg>
