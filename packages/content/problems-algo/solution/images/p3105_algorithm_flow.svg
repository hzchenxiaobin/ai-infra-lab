<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，三路转移 + 打擂台</text>

  <!-- start -->
  <rect x="225" y="36" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 nums（1 ≤ n ≤ 50）</text>

  <path d="M 300 68 L 300 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="210" y="92" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="113" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans = inc = dec = 1，i = 1</text>

  <path d="M 300 124 L 300 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: i < n ? -->
  <polygon points="300,146 390,182 300,218 210,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="300" y="194" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">还有元素没看</text>

  <!-- no: return ans -->
  <path d="M 390 182 L 451 182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="455" y="164" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="501" y="187" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- yes: compare -->
  <path d="M 300 218 L 300 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="234" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- diamond 2: three-way compare -->
  <polygon points="300,244 395,282 300,320 205,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums[i] vs nums[i−1]</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">比较相邻两数</text>

  <!-- left branch: > -->
  <path d="M 205 282 L 194 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="199" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <rect x="56" y="258" width="138" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="277" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">变大 ↑</text>
  <text x="125" y="296" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">inc += 1，dec = 1</text>

  <!-- right branch: < -->
  <path d="M 395 282 L 406 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <rect x="410" y="258" width="138" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="479" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">变小 ↓</text>
  <text x="479" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dec += 1，inc = 1</text>

  <!-- bottom branch: == -->
  <path d="M 300 320 L 300 338" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="334" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">＝</text>
  <rect x="218" y="342" width="164" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="363" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">相等：inc = dec = 1</text>

  <!-- update box -->
  <rect x="206" y="396" width="190" height="44" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="301" y="414" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans = max(ans, inc, dec)</text>
  <text x="301" y="432" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i += 1</text>

  <!-- merge arrows -->
  <path d="M 125 306 L 125 418 L 202 418" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 479 306 L 479 418 L 400 418" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 374 L 300 392" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 301 440 L 301 456 L 22 456 L 22 182 L 206 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="450" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">回到循环条件 i &lt; n ?</text>

  <!-- note -->
  <rect x="100" y="464" width="360" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="481" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">相等也是断裂点：严格单调不容「＝」，双计数器一律重开为 1</text>
</svg>
