<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + 容斥计数</text>

  <!-- Step 1: precompute -->
  <rect x="140" y="44" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">① 预处理：递推 2ⁿ 个子集的 lcm 与 popcnt</text>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n ≤ 15 ⇒ 至多 32767 个子集，一次性建表</text>

  <path d="M 280 90 L 280 104" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: init bounds -->
  <rect x="140" y="108" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">② lo = 1，hi = 25k，ans = 0</text>

  <path d="M 280 144 L 280 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: count(mid) -->
  <rect x="100" y="162" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">③ mid = (lo + hi) / 2，算 count(mid)</text>
  <text x="280" y="197" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">count(x) = Σ 非空子集 S（−1）^(|S|+1) · ⌊x / lcm(S)⌋</text>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">即「≤ x 的互不相同金额个数」，查表 O(2ⁿ)</text>

  <path d="M 280 218 L 280 234" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,238 380,286 280,334 180,286" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">count(mid)</text>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">≥ k ？</text>

  <!-- Yes branch (right) -->
  <path d="M 380 286 L 424 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="402" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="426" y="262" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="491" y="279" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">金额够 k 个 ✓</text>
  <text x="491" y="294" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = mid</text>
  <text x="491" y="307" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">hi = mid − 1</text>

  <!-- No branch (left) -->
  <path d="M 180 286 L 136 286" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="158" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="14" y="262" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不足 k 个 ✗</text>
  <text x="74" y="294" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lo = mid + 1</text>
  <text x="74" y="307" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向右收缩</text>

  <!-- loop back arrows -->
  <path d="M 491 262 L 491 126 L 424 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 74 262 L 74 126 L 136 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="497" y="196" font-size="9.5" fill="#aaa" filter="url(#rough2)">lo ≤ hi</text>
  <text x="497" y="208" font-size="9.5" fill="#aaa" filter="url(#rough2)">循环 ↑</text>

  <!-- exit down -->
  <path d="M 280 334 L 280 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="350" font-size="10" fill="#aaa" filter="url(#rough2)">lo &gt; hi 结束</text>

  <!-- Step 4: return -->
  <rect x="140" y="360" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">④ 返回 ans（第 k 小金额）</text>

  <!-- note box -->
  <rect x="50" y="410" width="460" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">hi = 25k 的底气：min(coins) ≤ 25 ⇒ count(25k) ≥ ⌊25k/25⌋ = k，解必在界内；</text>
  <text x="280" y="445" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">取「最小可行 x」⇒ x 必是某硬币的倍数（否则 count(x) = count(x−1)，与最小性矛盾）</text>
  <text x="280" y="460" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">二分 O(log 25k) ≈ 36 轮 × 每轮 O(2ⁿ) 容斥 ⇒ 总复杂度 O(2ⁿ log(25k))</text>
</svg>
