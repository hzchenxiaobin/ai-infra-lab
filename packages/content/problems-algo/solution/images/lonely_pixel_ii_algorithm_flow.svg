<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">算法流程：两遍扫描 + O(1) 判定</text>

  <!-- 步骤1 -->
  <rect x="120" y="46" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 遍历矩阵，统计 rowCount[i] / colCount[j]</text>
  <text x="260" y="79" text-anchor="middle" font-size="9.5" fill="#888">O(mn)</text>

  <path d="M 260 90 L 260 104" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="120" y="108" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">② 构造行签名 sig[i] = 行字符串</text>
  <text x="260" y="143" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">哈希表累计 freq[sig]++</text>

  <path d="M 260 160 L 260 174" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3 -->
  <rect x="120" y="178" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">③ 遍历每个 B(i,j)</text>

  <path d="M 260 216 L 260 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 260 230 L 376 262 L 260 294 L 144 262 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">rowCount[i]==target</text>
  <text x="260" y="268" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">&amp;&amp; colCount[j]==target</text>
  <text x="260" y="280" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">&amp;&amp; freq[sig[i]]==target?</text>

  <!-- 是 → ans++ -->
  <path d="M 376 262 L 410 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="248" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="456" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans++</text>

  <!-- 否 → skip -->
  <path d="M 144 262 L 110 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="256" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="18" y="248" width="92" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="64" y="267" text-anchor="middle" font-size="11" fill="#888">跳过</text>

  <!-- 循环回边：ans++ / 跳过 → 回到步骤3 -->
  <path d="M 456 248 Q 456 190 380 190 L 400 190" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 64 248 Q 64 190 140 190 L 120 190" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#aaa">继续下一个 B</text>

  <!-- 返回 -->
  <path d="M 260 294 L 260 312" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="316" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>

</svg>
