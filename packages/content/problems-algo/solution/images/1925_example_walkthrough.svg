<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10（仅展示部分 (a,b) 对）</text>

  <!-- Table -->
  <!-- Column boundaries: a(60-100) b(100-140) s(140-210) c(210-270) c²==s(270-330) c≤n(330-380) 贡献(380-430) -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <!-- Header row -->
    <rect x="60" y="48" width="370" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="80" y="67">a</text>
    <text x="120" y="67">b</text>
    <text x="175" y="67">s = a²+b²</text>
    <text x="240" y="67">c = ⌊√s⌋</text>
    <text x="300" y="67">c² == s?</text>
    <text x="355" y="67">c ≤ n?</text>
    <text x="405" y="67">贡献</text>

    <!-- Row 1: (3,4,25,5,✓,✓,+1) green -->
    <rect x="60" y="78" width="370" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="97">3</text>
    <text x="120" y="97">4</text>
    <text x="175" y="97">25</text>
    <text x="240" y="97">5</text>
    <text x="300" y="97" fill="#4a7a3a">✓</text>
    <text x="355" y="97" fill="#4a7a3a">✓</text>
    <text x="405" y="97" fill="#4a7a3a" font-weight="bold">+1</text>

    <!-- Row 2: (4,3,25,5,✓,✓,+1) green -->
    <rect x="60" y="106" width="370" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="125">4</text>
    <text x="120" y="125">3</text>
    <text x="175" y="125">25</text>
    <text x="240" y="125">5</text>
    <text x="300" y="125" fill="#4a7a3a">✓</text>
    <text x="355" y="125" fill="#4a7a3a">✓</text>
    <text x="405" y="125" fill="#4a7a3a" font-weight="bold">+1</text>

    <!-- Row 3: (6,8,100,10,✓,✓,+1) green -->
    <rect x="60" y="134" width="370" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="153">6</text>
    <text x="120" y="153">8</text>
    <text x="175" y="153">100</text>
    <text x="240" y="153">10</text>
    <text x="300" y="153" fill="#4a7a3a">✓</text>
    <text x="355" y="153" fill="#4a7a3a">✓</text>
    <text x="405" y="153" fill="#4a7a3a" font-weight="bold">+1</text>

    <!-- Row 4: (8,6,100,10,✓,✓,+1) green -->
    <rect x="60" y="162" width="370" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="181">8</text>
    <text x="120" y="181">6</text>
    <text x="175" y="181">100</text>
    <text x="240" y="181">10</text>
    <text x="300" y="181" fill="#4a7a3a">✓</text>
    <text x="355" y="181" fill="#4a7a3a">✓</text>
    <text x="405" y="181" fill="#4a7a3a" font-weight="bold">+1</text>

    <!-- Row 5: (1,2,5,2,✗,—,0) pink -->
    <rect x="60" y="190" width="370" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="209">1</text>
    <text x="120" y="209">2</text>
    <text x="175" y="209">5</text>
    <text x="240" y="209">2</text>
    <text x="300" y="209" fill="#b85450">✗ (4≠5)</text>
    <text x="355" y="209" fill="#888">—</text>
    <text x="405" y="209" fill="#888">0</text>

    <!-- Row 6: (5,5,50,7,✗,—,0) pink -->
    <rect x="60" y="218" width="370" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="237">5</text>
    <text x="120" y="237">5</text>
    <text x="175" y="237">50</text>
    <text x="240" y="237">7</text>
    <text x="300" y="237" fill="#b85450">✗ (49≠50)</text>
    <text x="355" y="237" fill="#888">—</text>
    <text x="405" y="237" fill="#888">0</text>

    <!-- Row 7: (10,10,200,14,✗,—,0) pink -->
    <rect x="60" y="246" width="370" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="80" y="265">10</text>
    <text x="120" y="265">10</text>
    <text x="175" y="265">200</text>
    <text x="240" y="265">14</text>
    <text x="300" y="265" fill="#b85450">✗ (196≠200)</text>
    <text x="355" y="265" fill="#888">—</text>
    <text x="405" y="265" fill="#888">0</text>

    <!-- Ellipsis row -->
    <text x="245" y="293" font-size="12" fill="#aaa">⋯ 其余 (a,b) 对均不满足 ⋯</text>
  </g>

  <!-- Divider -->
  <path d="M 40 310 L 520 310" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="60" y="322" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans = 4：{ (3,4,5), (4,3,5), (6,8,10), (8,6,10) }</text>

  <!-- Note -->
  <text x="60" y="372" font-size="11" fill="#555">• a &lt; b 优化：仅枚举 (3,4) 与 (6,8)，各贡献 ×2 = 4，省半循环</text>
  <text x="60" y="390" font-size="11" fill="#555">• a = b 恒无效：2a² = c² → c = a√2，永远非整数</text>
</svg>
