<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">字符串 → 价值数组 → 最大子数组和</text>

  <!-- 步骤1: 字符串 -->
  <text x="30" y="78" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 字符串 s = "adaa"</text>
  <g filter="url(#rough2)">
    <rect x="30" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="58" y="111" text-anchor="middle" font-size="18" fill="#333">a</text>
    <rect x="86" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="114" y="111" text-anchor="middle" font-size="18" fill="#333">d</text>
    <rect x="142" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="111" text-anchor="middle" font-size="18" fill="#333">a</text>
    <rect x="198" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="226" y="111" text-anchor="middle" font-size="18" fill="#333">a</text>
  </g>

  <!-- 映射箭头 -->
  <path d="M142 134 L142 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="146" font-size="12" fill="#777" filter="url(#rough2)">价值表: a=1, d=-1000 (默认1..26, chars覆盖)</text>

  <!-- 步骤2: 价值数组 -->
  <text x="30" y="172" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 价值数组 v</text>
  <g filter="url(#rough2)">
    <rect x="30" y="182" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="58" y="205" text-anchor="middle" font-size="16" fill="#333">1</text>
    <rect x="86" y="182" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="114" y="205" text-anchor="middle" font-size="16" fill="#b85450">-1000</text>
    <rect x="142" y="182" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="205" text-anchor="middle" font-size="16" fill="#333">1</text>
    <rect x="198" y="182" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="226" y="205" text-anchor="middle" font-size="16" fill="#333">1</text>
  </g>

  <!-- 步骤3: Kadane 轨迹 -->
  <text x="30" y="246" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ cur 轨迹 (Kadane)</text>

  <!-- 基线 0 -->
  <line x1="20" y1="310" x2="270" y2="310" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="14" y="314" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <!-- cur 折线: 起点0 -> a:1 -> d:0 -> a:1 -> a:2 -->
  <path d="M58 310 L58 280 L114 310 L170 280 L226 250"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="58" cy="280" r="3.5" fill="#446688"/>
    <circle cx="114" cy="310" r="3.5" fill="#b85450"/>
    <circle cx="170" cy="280" r="3.5" fill="#446688"/>
    <circle cx="226" cy="250" r="4.5" fill="#b85450" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="58" y="272" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="114" y="328" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">归零</text>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="226" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- ans 峰值标注 -->
  <path d="M240 250 L300 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="306" y="244" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 峰值 2</text>

  <!-- 公式框 -->
  <g filter="url(#rough)">
    <rect x="290" y="92" width="215" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="300" y="115" font-size="13" font-weight="bold" fill="#d6a040">状态转移</text>
    <text x="300" y="138" font-size="14" fill="#333">cur = max(0, cur + v[i])</text>
    <text x="300" y="160" font-size="14" fill="#333">ans = max(ans, cur)</text>
    <text x="300" y="180" font-size="11" fill="#888">丢弃负前缀 / 续接</text>
  </g>

  <!-- 关键说明 -->
  <g filter="url(#rough)">
    <rect x="290" y="200" width="215" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="300" y="222" font-size="13" font-weight="bold" fill="#b85450">为什么归零?</text>
    <text x="300" y="244" font-size="12" fill="#333">负前缀只会拖累后续</text>
    <text x="300" y="262" font-size="12" fill="#333">子串, 不如丢弃从空串</text>
    <text x="300" y="280" font-size="12" fill="#333">重新起算 (开销=0)。</text>
    <text x="300" y="294" font-size="11" fill="#888">← 允许空串语义</text>
  </g>

  <!-- 等价提示 -->
  <path d="M397 296 L397 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">等价于 53 题最大子数组和 (允许空串)</text>
</svg>
