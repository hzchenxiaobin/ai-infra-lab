<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：左 L 与右 R 逃逸，中间段全部停下</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">directions = "LL RSL RR" → 左逃逸 LL / 中间 RSL / 右逃逸 RR</text>

  <!-- ===== Road ===== -->
  <line x1="30" y1="208" x2="530" y2="208" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="30" y1="212" x2="530" y2="212" stroke="#ddd" stroke-width="1" stroke-dasharray="6 6" filter="url(#rough2)"/>

  <!-- ===== Zone labels ===== -->
  <text x="68" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">左侧逃逸区</text>
  <text x="250" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中间段 [l, r]（全部停下）</text>
  <text x="455" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">右侧逃逸区</text>

  <!-- zone separators -->
  <line x1="150" y1="70" x2="150" y2="240" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="370" y1="70" x2="370" y2="240" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Leading L's (escape left) ===== -->
  <!-- car L (index 0) -->
  <rect x="40" y="168" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="15" fill="#666" font-weight="bold">L</text>
  <!-- car L (index 1) -->
  <rect x="90" y="168" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="194" text-anchor="middle" font-size="15" fill="#666" font-weight="bold">L</text>
  <!-- escape arrows pointing left -->
  <path d="M 40 188 L 22 188" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <path d="M 90 178 L 70 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <text x="68" y="232" text-anchor="middle" font-size="10" fill="#888">同向同速驶向 −∞</text>
  <text x="68" y="246" text-anchor="middle" font-size="10" fill="#888">贡献 0 次碰撞</text>

  <!-- ===== Middle segment R S L ===== -->
  <!-- highlight box -->
  <rect x="188" y="156" width="124" height="64" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>

  <!-- car R (index 2) moves right -->
  <rect x="196" y="168" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">R</text>
  <path d="M 236 188 L 252 188" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- car S (index 3) stationary wall -->
  <rect x="256" y="168" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="276" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">S</text>

  <!-- car L (index 4) moves left -->
  <rect x="296" y="168" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="316" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">L</text>
  <path d="M 296 178 L 280 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- collision sparks -->
  <text x="246" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="306" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="250" y="232" text-anchor="middle" font-size="10" fill="#446688">R 撞 S、L 撞 S，均停下</text>
  <text x="250" y="246" text-anchor="middle" font-size="10" fill="#446688">移动车 2 辆 → 碰撞 2 次</text>

  <!-- ===== Trailing R's (escape right) ===== -->
  <rect x="400" y="168" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="420" y="194" text-anchor="middle" font-size="15" fill="#666" font-weight="bold">R</text>
  <rect x="450" y="168" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="470" y="194" text-anchor="middle" font-size="15" fill="#666" font-weight="bold">R</text>
  <path d="M 490 188 L 512 188" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <path d="M 440 178 L 460 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <text x="455" y="232" text-anchor="middle" font-size="10" fill="#888">同向同速驶向 +∞</text>
  <text x="455" y="246" text-anchor="middle" font-size="10" fill="#888">贡献 0 次碰撞</text>

  <!-- ===== Invariant formula ===== -->
  <rect x="40" y="276" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不变量：碰撞总次数 = 中间段中被停下的移动车辆数</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#444">反向相撞 +2 停 2 辆 ｜ 移动撞静止 +1 停 1 辆 ｜ 同向同行 +0 停 0 辆</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans = 中间段中 'L' 与 'R' 的个数 = (r − l + 1) − 中间段 'S' 的个数</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">本例：中间段 "RSL" 移动车 2 辆 → ans = 2</text>
</svg>
