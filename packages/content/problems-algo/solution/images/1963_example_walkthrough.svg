<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：扫描 balance，跌负即记一次交换</text>

  <!-- ===== Example 1: ][][ -> 1 ===== -->
  <text x="40" y="54" font-size="12.5" fill="#555" font-weight="bold">示例 1：s = "][]["  →  输出 1</text>

  <text x="40" y="82" font-size="10" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="97" y="82">0</text>
    <text x="135" y="82">1</text>
    <text x="173" y="82">2</text>
    <text x="211" y="82">3</text>
  </g>

  <text x="40" y="106" font-size="11" fill="#888">s:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="90" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="97" y="110">]</text>
    <rect x="116" y="90" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="110">[</text>
    <rect x="154" y="90" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="110">]</text>
    <rect x="192" y="90" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="211" y="110">[</text>
  </g>

  <text x="40" y="138" font-size="11" fill="#888">bal:</text>
  <g font-size="11" text-anchor="middle">
    <text x="97" y="138" fill="#b85450" font-weight="bold">-1→1</text>
    <text x="135" y="138" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="173" y="138" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="211" y="138" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <text x="97" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换①</text>
  <text x="250" y="138" font-size="10.5" fill="#b85450" font-weight="bold">跌负 1 次 → swaps=1 ✓</text>

  <rect x="78" y="162" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="228" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">交换 idx0 ↔ idx3 → "[[]]" 已平衡</text>

  <!-- Divider -->
  <path d="M 40 196 L 560 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: ]]][[[ -> 2 ===== -->
  <text x="40" y="222" font-size="12.5" fill="#555" font-weight="bold">示例 2：s = "]]][[["  →  输出 2</text>

  <text x="40" y="250" font-size="10" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="97" y="250">0</text>
    <text x="135" y="250">1</text>
    <text x="173" y="250">2</text>
    <text x="211" y="250">3</text>
    <text x="249" y="250">4</text>
    <text x="287" y="250">5</text>
  </g>

  <text x="40" y="274" font-size="11" fill="#888">s:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="258" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="97" y="278">]</text>
    <rect x="116" y="258" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="278">]</text>
    <rect x="154" y="258" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="173" y="278">]</text>
    <rect x="192" y="258" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="211" y="278">[</text>
    <rect x="230" y="258" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="249" y="278">[</text>
    <rect x="268" y="258" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="287" y="278">[</text>
  </g>

  <text x="40" y="306" font-size="11" fill="#888">bal:</text>
  <g font-size="11" text-anchor="middle">
    <text x="97" y="306" fill="#b85450" font-weight="bold">-1→1</text>
    <text x="135" y="306" fill="#888">0</text>
    <text x="173" y="306" fill="#b85450" font-weight="bold">-1→1</text>
    <text x="211" y="306" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="249" y="306" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="287" y="306" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <text x="97" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换①</text>
  <text x="173" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交换②</text>
  <text x="330" y="306" font-size="10.5" fill="#b85450" font-weight="bold">跌负 2 次 → swaps=2 ✓</text>

  <rect x="78" y="330" width="340" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="248" y="346" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">①0↔5 ②2↔4 → "[][[]]" 已平衡</text>

  <!-- Divider -->
  <path d="M 40 366 L 560 366" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3: [] -> 0 ===== -->
  <text x="40" y="392" font-size="12.5" fill="#555" font-weight="bold">示例 3：s = "[]"  →  输出 0</text>

  <text x="40" y="420" font-size="10" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="97" y="420">0</text>
    <text x="135" y="420">1</text>
  </g>

  <text x="40" y="444" font-size="11" fill="#888">s:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="78" y="428" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97" y="448">[</text>
    <rect x="116" y="428" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="448">]</text>
  </g>

  <text x="40" y="476" font-size="11" fill="#888">bal:</text>
  <g font-size="11" text-anchor="middle">
    <text x="97" y="476" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="135" y="476" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <text x="180" y="476" font-size="10.5" fill="#4a7a3a" font-weight="bold">全程 ≥ 0，无跌负 → swaps=0 ✓</text>

  <rect x="78" y="486" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="502" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">原串已平衡，无需交换</text>

  <!-- ===== Summary ===== -->
  <path d="M 40 522 L 560 522" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="78" y="530" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="308" y="546" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">规律：答案 = balance 跌负次数 = ⌈k/2⌉（k = 栈消配对后剩余 ] 数）</text>
</svg>
