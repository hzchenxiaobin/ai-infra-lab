<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：d（不同字符数）只升不降 ⟷ L%3 循环 1·2·0，相等只在 d∈{1,2}</text>

  <!-- 面板一：相位 0 不可达 -->
  <rect x="20" y="36" width="520" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">① 相位 0 不可达：非空前缀 d ≥ 1，而 L%3==0 要求 d == 0</text>

  <!-- L=1..9 的 L%3 格子 -->
  <rect x="36" y="68" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="86" y="68" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="68" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="186" y="68" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="68" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="68" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="336" y="68" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="68" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="436" y="68" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="57" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="107" y="88" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="157" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="207" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="257" y="88" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="307" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="357" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="407" y="88" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="457" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 相位 0 的格子打叉 -->
  <path d="M 146 74 L 168 92 M 168 74 L 146 92" stroke="#b85450" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#rough2)"/>
  <path d="M 296 74 L 318 92 M 318 74 L 296 92" stroke="#b85450" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#rough2)"/>
  <path d="M 446 74 L 468 92 M 468 74 L 446 92" stroke="#b85450" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#rough2)"/>

  <text x="57" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">L=1</text>
  <text x="107" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="157" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="207" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="257" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="307" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <text x="357" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <text x="407" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">8</text>
  <text x="457" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">9</text>

  <text x="36" y="132" font-size="10.5" fill="#b85450" filter="url(#rough2)">红格（L=3,6,9,…）要求 d==0，永不成立 ⇒ 2/3 候选瞬间蒸发</text>

  <!-- 面板二：台阶 vs 循环 -->
  <rect x="20" y="154" width="520" height="186" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="174" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 台阶 d(L) 对撞循环 L%3 —— s = "aabbcc"</text>

  <!-- L=1 命中列高亮带 -->
  <rect x="100" y="180" width="48" height="136" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 列头 -->
  <text x="124" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=1</text>
  <text x="178" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=2</text>
  <text x="232" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=3</text>
  <text x="286" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=4</text>
  <text x="340" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=5</text>
  <text x="394" y="193" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">L=6</text>

  <!-- 行标签 -->
  <text x="92" y="213" text-anchor="end" font-size="10.5" fill="#33506b" filter="url(#rough2)">前缀</text>
  <text x="92" y="247" text-anchor="end" font-size="10.5" fill="#33506b" filter="url(#rough2)">d</text>
  <text x="92" y="281" text-anchor="end" font-size="10.5" fill="#33506b" filter="url(#rough2)">L%3</text>
  <text x="92" y="313" text-anchor="end" font-size="10.5" fill="#33506b" filter="url(#rough2)">命中？</text>

  <!-- 行1：前缀 -->
  <rect x="100" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="154" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="208" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="262" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="316" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="370" y="196" width="48" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="124" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="178" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aa</text>
  <text x="232" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aab</text>
  <text x="286" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aabb</text>
  <text x="340" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aabbc</text>
  <text x="394" y="213" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">aabbcc</text>

  <!-- 行2：d -->
  <rect x="100" y="230" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="154" y="230" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="208" y="230" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="262" y="230" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="316" y="230" width="48" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="370" y="230" width="48" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="247" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="178" y="247" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="232" y="247" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="286" y="247" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="340" y="247" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="394" y="247" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <!-- 行3：L%3 -->
  <rect x="100" y="264" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="264" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="264" width="48" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="262" y="264" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="264" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="264" width="48" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="281" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="178" y="281" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="232" y="281" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="286" y="281" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="340" y="281" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="394" y="281" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 行4：命中 -->
  <text x="124" y="315" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="178" y="315" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="232" y="315" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="286" y="315" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="340" y="315" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="394" y="315" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 右侧注记 -->
  <rect x="426" y="188" width="108" height="128" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="480" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中的两种形态</text>
  <text x="480" y="226" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">d=1 且 L≡1</text>
  <text x="480" y="240" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（全同字符）</text>
  <text x="480" y="260" text-anchor="middle" font-size="9.5" fill="#2d5a24" filter="url(#rough2)">d=2 且 L≡2</text>
  <text x="480" y="274" text-anchor="middle" font-size="9.5" fill="#2d5a24" filter="url(#rough2)">（恰两种字符）</text>
  <text x="480" y="296" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">d≥3 ⇒ 出局</text>
  <text x="480" y="310" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（台阶不回落）</text>

  <text x="36" y="334" font-size="10" fill="#33506b" filter="url(#rough2)">L=4 的 d=2 卡在相位 1（出现太晚错过档期）；L=5 第 3 种字符登场，此后 d≥3 全灭</text>

  <!-- 面板三：结论 -->
  <rect x="20" y="352" width="520" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">坍缩：d==1 且 L≡1（前缀全同字符）或 d==2 且 L≡2（恰含两种字符）</text>
  <text x="280" y="385" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">d 是只升不降的台阶——第 3 种字符一出现（d≥3），此后永不再命中</text>
</svg>
