<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：删除必是「整根拔除」，且专挑低频字符下手</text>
  <text x="260" y="58" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">s = "yyyzz"，k = 1（不同字符数 d = 2）</text>

  <!-- 字符格子行 -->
  <rect x="158" y="72" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="72" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="242" y="72" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="284" y="72" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="326" y="72" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="176" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">y</text>
  <text x="218" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">y</text>
  <text x="260" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">y</text>
  <text x="302" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">z</text>
  <text x="344" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">z</text>

  <text x="214" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y 频次 3 → 保留 ★</text>
  <text x="342" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">z 频次 2 → 拔光</text>

  <!-- 左面板：频次升序 -->
  <rect x="30" y="142" width="205" height="108" rx="10" fill="#f0f5fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="132" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">频次升序 → [2, 3]</text>
  <rect x="48" y="176" width="84" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">z : 2</text>
  <rect x="146" y="176" width="84" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y : 3</text>
  <text x="132" y="238" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">删去前 d − k = 1 个 → 2</text>

  <!-- 右面板：部分删除 vs 整根拔除 -->
  <rect x="255" y="142" width="235" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="168" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 只删 1 个 z → "yyyz"</text>
  <text x="272" y="188" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">   仍 2 种 &gt; 1，白删</text>
  <text x="272" y="214" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 删光 2 个 z → "yyy"</text>
  <text x="272" y="234" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">   仅 1 种 ≤ 1 ✓</text>

  <!-- 答案框 -->
  <rect x="30" y="262" width="205" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="281" text-anchor="middle" font-size="12" fill="#2a5a2a" filter="url(#rough2)">ans = sum(freqs[:1])</text>
  <text x="132" y="299" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">= 2</text>

  <!-- 兜底框 -->
  <rect x="255" y="262" width="235" height="44" rx="8" fill="#f0f5fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="281" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d ≤ k 时（如 "aabb", k=2）</text>
  <text x="372" y="299" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">免删，直接返回 0</text>

  <!-- 底部提示 -->
  <rect x="30" y="318" width="460" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">⚠️ 剩 1 个也算 1 种 → 部分删除纯浪费；交换论证保证「拔最低频」最优</text>
</svg>
