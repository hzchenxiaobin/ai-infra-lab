<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：数位映射 + 稳定排序</text>

  <!-- ====== Section 1: Mapping table ====== -->
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">mapping = [8,9,4,0,2,1,3,5,7,6]，数位 i 映射为 mapping[i]</text>

  <!-- Original digits row: 10 boxes, x = 62 + i*44, width=40, y=62, h=28 -->
  <rect x="62" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="106" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="194" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="282" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="326" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="370" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="414" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="458" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- Arrows down -->
  <path d="M 82 92 L 82 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 126 92 L 126 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 92 L 170 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 92 L 214 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 92 L 258 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 92 L 302 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 92 L 346 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 92 L 390 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 434 92 L 434 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 92 L 478 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Mapped values row: y=112, h=28 -->
  <rect x="62" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="106" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="150" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="194" y="112" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="131" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="238" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="282" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="326" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="370" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="414" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="458" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#b85450">↑ 数位 3 映射为 0（会产生前导零）</text>

  <!-- ====== Section 2: Transformation examples ====== -->
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐位映射 + 整数重组（前导零自动消失）</text>

  <!-- Left: 991 → 669 -->
  <rect x="40" y="196" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.4"/>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">991 → 669</text>

  <!-- digits 9,9,1 -->
  <rect x="70" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="114" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="158" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- arrows -->
  <path d="M 88 252 L 88 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 252 L 132 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 252 L 176 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mapped 6,6,9 -->
  <rect x="70" y="272" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="114" y="272" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="158" y="272" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- Right: 338 → 007 → 7 -->
  <rect x="300" y="196" width="240" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">338 → 007 → 7（去前导零）</text>

  <!-- digits 3,3,8 -->
  <rect x="330" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="374" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="418" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <!-- arrows -->
  <path d="M 348 252 L 348 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 252 L 392 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 252 L 436 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mapped 0,0,7 -->
  <rect x="330" y="272" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="374" y="272" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="418" y="272" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- ====== Section 3: Stable sort ====== -->
  <rect x="24" y="306" width="512" height="138" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">稳定排序：映射值相同 → 保持原序</text>

  <!-- Before sort -->
  <text x="100" y="350" text-anchor="middle" font-size="10" fill="#888">排序前</text>
  <rect x="62" y="356" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">991</text>
  <text x="90" y="396" text-anchor="middle" font-size="10" fill="#888">→669</text>

  <rect x="138" y="356" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">338</text>
  <text x="166" y="396" text-anchor="middle" font-size="10" fill="#d6a040">→7</text>

  <rect x="214" y="356" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">38</text>
  <text x="242" y="396" text-anchor="middle" font-size="10" fill="#d6a040">→7</text>

  <!-- Arrow to after -->
  <path d="M 290 372 L 330 372" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">稳定排序</text>

  <!-- After sort -->
  <text x="430" y="350" text-anchor="middle" font-size="10" fill="#888">排序后（返回原值）</text>
  <rect x="350" y="356" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">338</text>
  <text x="378" y="396" text-anchor="middle" font-size="10" fill="#d6a040">→7</text>

  <rect x="426" y="356" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">38</text>
  <text x="454" y="396" text-anchor="middle" font-size="10" fill="#d6a040">→7</text>

  <rect x="502" y="356" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">991</text>

  <!-- note -->
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a">338 与 38 映射值同为 7，保持原序（338 在 38 前）</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">⚠️ nums[i]=0 时只有一位，映射值为 mapping[0]，须单独处理</text>
</svg>
