<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：target = [1,3]，stream 读 1,2,3</text>

  <!-- Step lines -->
  <text x="40" y="56" font-size="12" fill="#333">① i=1, j=0：1 == target[0]=1 → <tspan fill="#4a7a3a" font-weight="bold">保留</tspan>，j=1</text>
  <text x="40" y="78" font-size="12" fill="#333">② i=2, j=1：2 &lt; target[1]=3 → <tspan fill="#b85450" font-weight="bold">Pop</tspan>，j 不动</text>
  <text x="40" y="100" font-size="12" fill="#333">③ i=3, j=1：3 == target[1]=3 → <tspan fill="#4a7a3a" font-weight="bold">保留</tspan>，j=2=len → 停</text>

  <!-- Table header row -->
  <rect x="60" y="112" width="460" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="145" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">流值 i</text>
  <text x="215" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target[j]</text>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="395" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">栈（底→顶）</text>
  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>

  <!-- vertical column separators -->
  <path d="M 110 112 L 110 280 M 180 112 L 180 280 M 250 112 L 250 280 M 350 112 L 350 280 M 440 112 L 440 280" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 1: i=1 keep -->
  <rect x="60" y="140" width="460" height="28" rx="3" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="145" y="158" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="215" y="158" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Push</text>
  <text x="395" y="158" text-anchor="middle" font-size="11" fill="#333">[1]</text>
  <text x="495" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 2: i=2 pop -->
  <rect x="60" y="168" width="460" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="186" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="145" y="186" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="215" y="186" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="300" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Push, Pop</text>
  <text x="395" y="186" text-anchor="middle" font-size="11" fill="#333">[1]</text>
  <text x="495" y="186" text-anchor="middle" font-size="11.5" fill="#333">1</text>

  <!-- row 3: i=3 keep -->
  <rect x="60" y="196" width="460" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="214" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="145" y="214" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="215" y="214" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Push</text>
  <text x="395" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,3]</text>
  <text x="495" y="214" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 4: stop -->
  <rect x="60" y="224" width="460" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="242" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">停</text>
  <text x="300" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j == len(target) → 退出循环</text>
  <text x="395" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,3] == target ✓</text>

  <!-- Result -->
  <text x="290" y="280" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 res = ["Push", "Push", "Pop", "Push"]</text>

  <!-- footer note -->
  <rect x="60" y="300" width="460" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="10.5" fill="#555">读到 target[-1]=3 即停（不读 n=3 之后的数，本题 n=3 恰好到头）</text>
  <text x="290" y="336" text-anchor="middle" font-size="10.5" fill="#555">Push 数 = target[-1] = 3；Pop 数 = target[-1] − len(target) = 3 − 2 = 1</text>
  <text x="290" y="352" text-anchor="middle" font-size="10" fill="#888">序列长度 = 2·target[-1] − len(target) = 4，已达下界，最短</text>
</svg>
