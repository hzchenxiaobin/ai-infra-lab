<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,4,5,6]，numSlots = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">按顺序放数，每步选一个有空位的篮子；红框 = 本步放入的篮子</text>

  <!-- Column headers: item being placed -->
  <text x="60"  y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 1</text>
  <text x="148" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 2</text>
  <text x="236" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 3</text>
  <text x="324" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 4</text>
  <text x="412" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 5</text>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = 6</text>

  <!-- ===== Basket rows: b1 / b2 / b3 per column ===== -->
  <!-- Column x centers: 60,148,236,324,412,500 ; basket rect width 64 -> x = center-32 -->

  <!-- Row b1 (y=72..112): receives items at step1(1), step4(4) -->
  <!-- step1: chosen, [1] -->
  <rect x="28" y="72" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="34" y="86" font-size="9" fill="#b85450" font-weight="bold">#1</text>
  <text x="60" y="102" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <!-- step2: not chosen, [1] -->
  <rect x="116" y="72" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="122" y="86" font-size="9" fill="#4a7a3a" font-weight="bold">#1</text>
  <text x="148" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- step3: not chosen, [1] -->
  <rect x="204" y="72" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="210" y="86" font-size="9" fill="#4a7a3a" font-weight="bold">#1</text>
  <text x="236" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- step4: chosen, [1,4] -->
  <rect x="292" y="72" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="298" y="86" font-size="9" fill="#b85450" font-weight="bold">#1</text>
  <text x="324" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1, 4</text>
  <!-- step5: not chosen, [1,4] -->
  <rect x="380" y="72" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="386" y="86" font-size="9" fill="#4a7a3a" font-weight="bold">#1</text>
  <text x="412" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1, 4</text>
  <!-- step6: not chosen, [1,4] -->
  <rect x="468" y="72" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="474" y="86" font-size="9" fill="#4a7a3a" font-weight="bold">#1</text>
  <text x="500" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1, 4</text>

  <!-- Row b2 (y=120..160): receives items at step2(2), step6(6) -->
  <!-- step1: empty -->
  <rect x="28" y="120" width="64" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="34" y="134" font-size="9" fill="#bbb" font-weight="bold">#2</text>
  <!-- step2: chosen, [2] -->
  <rect x="116" y="120" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="122" y="134" font-size="9" fill="#b85450" font-weight="bold">#2</text>
  <text x="148" y="150" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <!-- step3: not chosen, [2] -->
  <rect x="204" y="120" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="210" y="134" font-size="9" fill="#4a7a3a" font-weight="bold">#2</text>
  <text x="236" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- step4: not chosen, [2] -->
  <rect x="292" y="120" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="298" y="134" font-size="9" fill="#4a7a3a" font-weight="bold">#2</text>
  <text x="324" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- step5: not chosen, [2] -->
  <rect x="380" y="120" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="386" y="134" font-size="9" fill="#4a7a3a" font-weight="bold">#2</text>
  <text x="412" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- step6: chosen, [2,6] -->
  <rect x="468" y="120" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="474" y="134" font-size="9" fill="#b85450" font-weight="bold">#2</text>
  <text x="500" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2, 6</text>

  <!-- Row b3 (y=168..208): receives items at step3(3), step5(5) -->
  <!-- step1: empty -->
  <rect x="28" y="168" width="64" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="34" y="182" font-size="9" fill="#bbb" font-weight="bold">#3</text>
  <!-- step2: empty -->
  <rect x="116" y="168" width="64" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="122" y="182" font-size="9" fill="#bbb" font-weight="bold">#3</text>
  <!-- step3: chosen, [3] -->
  <rect x="204" y="168" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="210" y="182" font-size="9" fill="#b85450" font-weight="bold">#3</text>
  <text x="236" y="198" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <!-- step4: not chosen, [3] -->
  <rect x="292" y="168" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="298" y="182" font-size="9" fill="#4a7a3a" font-weight="bold">#3</text>
  <text x="324" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- step5: chosen, [3,5] -->
  <rect x="380" y="168" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="386" y="182" font-size="9" fill="#b85450" font-weight="bold">#3</text>
  <text x="412" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3, 5</text>
  <!-- step6: not chosen, [3,5] -->
  <rect x="468" y="168" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="474" y="182" font-size="9" fill="#4a7a3a" font-weight="bold">#3</text>
  <text x="500" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3, 5</text>

  <!-- arrows between columns -->
  <path d="M 94 140 L 114 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 140 L 202 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 140 L 290 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 140 L 378 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 446 140 L 466 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- per-column annotations: chosen / gain / total / state -->
  <!-- step1 -->
  <text x="60"  y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #1</text>
  <text x="60"  y="240" text-anchor="middle" font-size="9.5" fill="#555">1&amp;1 = 1</text>
  <text x="60"  y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σ = 1</text>
  <text x="60"  y="268" text-anchor="middle" font-size="9" fill="#888">s = 1</text>
  <!-- step2 -->
  <text x="148" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #2</text>
  <text x="148" y="240" text-anchor="middle" font-size="9.5" fill="#555">2&amp;2 = 2</text>
  <text x="148" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σ = 3</text>
  <text x="148" y="268" text-anchor="middle" font-size="9" fill="#888">s = 4</text>
  <!-- step3 -->
  <text x="236" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #3</text>
  <text x="236" y="240" text-anchor="middle" font-size="9.5" fill="#555">3&amp;3 = 3</text>
  <text x="236" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σ = 6</text>
  <text x="236" y="268" text-anchor="middle" font-size="9" fill="#888">s = 13</text>
  <!-- step4 -->
  <text x="324" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #1</text>
  <text x="324" y="240" text-anchor="middle" font-size="9.5" fill="#555">4&amp;1 = 0</text>
  <text x="324" y="254" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Σ = 6</text>
  <text x="324" y="268" text-anchor="middle" font-size="9" fill="#888">s = 14</text>
  <!-- step5 -->
  <text x="412" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #3</text>
  <text x="412" y="240" text-anchor="middle" font-size="9.5" fill="#555">5&amp;3 = 1</text>
  <text x="412" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σ = 7</text>
  <text x="412" y="268" text-anchor="middle" font-size="9" fill="#888">s = 23</text>
  <!-- step6 -->
  <text x="500" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">放 #2</text>
  <text x="500" y="240" text-anchor="middle" font-size="9.5" fill="#555">6&amp;2 = 2</text>
  <text x="500" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σ = 9</text>
  <text x="500" y="268" text-anchor="middle" font-size="9" fill="#888">s = 26</text>

  <!-- final answer -->
  <path d="M 500 280 L 500 296 L 280 296 L 280 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="308" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">终态 s = 26 = (2,2,2)，dp = 9</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大与和 = 9 ✓</text>
</svg>
