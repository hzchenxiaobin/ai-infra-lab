<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：从 0 出发的 BFS 命中三角形</text>

  <!-- ===== LEFT: graph ===== -->
  <!-- triangle 0-1-2 (highlighted red = answer) -->
  <line x1="92" y1="92" x2="58" y2="156" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="64" y1="166" x2="146" y2="166" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="152" y1="156" x2="110" y2="92" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <!-- 4-cycle 3-4-5-6 (gray) -->
  <line x1="68" y1="250" x2="150" y2="250" stroke="#9aa6b8" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="158" y1="258" x2="158" y2="300" stroke="#9aa6b8" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="150" y1="308" x2="68" y2="308" stroke="#9aa6b8" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="60" y1="300" x2="60" y2="258" stroke="#9aa6b8" stroke-width="1.7" filter="url(#rough2)"/>

  <!-- triangle nodes -->
  <circle cx="100" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="100" y="58" text-anchor="middle" font-size="10" fill="#b85450">dist=0</text>

  <circle cx="55" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">1</text>
  <text x="32" y="180" font-size="10" fill="#34506e">d=1</text>

  <circle cx="155" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">2</text>
  <text x="172" y="180" font-size="10" fill="#34506e">d=1</text>

  <!-- square nodes -->
  <circle cx="60" cy="250" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="255" text-anchor="middle" font-size="12" fill="#888">3</text>
  <circle cx="155" cy="250" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="255" text-anchor="middle" font-size="12" fill="#888">4</text>
  <circle cx="155" cy="308" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="313" text-anchor="middle" font-size="12" fill="#888">5</text>
  <circle cx="60" cy="308" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="313" text-anchor="middle" font-size="12" fill="#888">6</text>

  <text x="108" y="345" text-anchor="middle" font-size="10.5" fill="#aaa">4-环长 4 · 三角环长 3 ← 更短</text>

  <!-- divider -->
  <line x1="245" y1="60" x2="245" y2="370" stroke="#ddd" stroke-width="1.4" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== RIGHT: BFS steps ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">BFS（源 s = 0）</text>

  <!-- step 1 -->
  <rect x="265" y="72" width="270" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="91" font-size="11" fill="#333" font-weight="bold">① 出队 0</text>
  <text x="278" y="107" font-size="10.5" fill="#555">邻 1、2 均未访问 →</text>
  <text x="278" y="121" font-size="10.5" fill="#555">dist=1, parent=0, 入队</text>

  <!-- step 2 -->
  <rect x="265" y="140" width="270" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="159" font-size="11" fill="#333" font-weight="bold">② 出队 1</text>
  <text x="278" y="175" font-size="10.5" fill="#555">邻 0 = parent[1] → 跳过</text>
  <text x="278" y="189" font-size="10.5" fill="#555">邻 2 已访问 且 2 ≠ parent[1] → 横边</text>

  <!-- step 3 highlight -->
  <rect x="265" y="208" width="270" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="278" y="227" font-size="11" fill="#b85450" font-weight="bold">③ 命中环 ✓</text>
  <text x="278" y="243" font-size="10.5" fill="#333">环 = dist[1]+dist[2]+1</text>
  <text x="278" y="257" font-size="11" fill="#b85450" font-weight="bold">= 1 + 1 + 1 = 3 → ans = 3</text>

  <!-- step 4 prune -->
  <rect x="265" y="276" width="270" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="295" font-size="11" fill="#2e6e2e" font-weight="bold">④ 剪枝收尾</text>
  <text x="278" y="311" font-size="10.5" fill="#555">其余源点 dist×2 ≥ 3 即跳出，无更短环</text>

  <!-- result -->
  <rect x="265" y="338" width="270" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="365" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最短环 = 3（0 → 1 → 2 → 0）</text>

  <text x="280" y="418" text-anchor="middle" font-size="9.5" fill="#aaa">n=7 · edges=[[0,1],[1,2],[2,0],[3,4],[4,5],[5,6],[6,3]]</text>
</svg>
