<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">隔板法：e 个相同物品放入 n 个不同盒子（每盒 ≥ 0）</text>

  <!-- ===== Example: e=4 stars, n=3 bins → C(4+3-1, 3-1) = C(6,2) = 15 ===== -->
  <text x="34" y="60" font-size="12" fill="#446688" font-weight="bold">示例：e=4 个 ☆，n=3 个盒子</text>

  <!-- Arrangement 1: **|*|* → [2, 1, 1] -->
  <text x="34" y="92" font-size="11" fill="#666">[2, 1, 1]</text>
  <g filter="url(#rough2)">
    <rect x="90" y="76" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="104" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="120" y="76" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="134" y="96" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="152" y="76" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="162" y="96" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
    <rect x="174" y="76" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="188" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">☆</text>
    <rect x="204" y="76" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="214" y="96" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
    <rect x="226" y="76" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="240" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">☆</text>
  </g>

  <!-- Arrangement 2: |****| → [0, 4, 0] -->
  <text x="34" y="130" font-size="11" fill="#666">[0, 4, 0]</text>
  <g filter="url(#rough2)">
    <rect x="90" y="114" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="100" y="134" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
    <rect x="112" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="126" y="134" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="142" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="156" y="134" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="172" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="186" y="134" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="202" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="216" y="134" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="232" y="114" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="242" y="134" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
  </g>

  <!-- Arrangement 3: ***||* → [3, 0, 1] -->
  <text x="34" y="168" font-size="11" fill="#666">[3, 0, 1]</text>
  <g filter="url(#rough2)">
    <rect x="90" y="152" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="104" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="120" y="152" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="134" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="150" y="152" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="164" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">☆</text>
    <rect x="180" y="152" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="190" y="172" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
    <rect x="202" y="152" width="20" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="212" y="172" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">|</text>
    <rect x="224" y="152" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="238" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">☆</text>
  </g>

  <text x="282" y="100" font-size="11" fill="#888">☆ = 物品（相同）</text>
  <text x="282" y="118" font-size="11" fill="#d6a040" font-weight="bold">| = 隔板（分盒子）</text>
  <text x="282" y="136" font-size="11" fill="#888">4 个 ☆ + 2 个 |</text>
  <text x="282" y="154" font-size="11" fill="#888">排列数 = C(6, 2) = 15</text>

  <!-- ===== Formula box ===== -->
  <rect x="50" y="200" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">隔板法公式</text>
  <text x="290" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e 个相同物品 → n 个不同盒子 = C(n + e − 1, e) = C(n + e − 1, n − 1)</text>

  <!-- arrow down -->
  <path d="M 290 258 Q 290 270 290 282" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Application to this problem ===== -->
  <rect x="50" y="296" width="480" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">套用本题：质因子 p^e 的 e 个 p 分配到数组的 n 个位置</text>
  <text x="290" y="340" text-anchor="middle" font-size="11" fill="#555">每个位置分到 j 个 p → 该位置贡献因子 p^j（含 j=0 即 p^0=1）</text>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#555">不同质因子彼此独立 → 乘法原理连乘</text>
  <text x="290" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = ∏ C(n + eᵢ − 1, eᵢ)  （对所有质因子 pᵢ^eᵢ）</text>
</svg>
