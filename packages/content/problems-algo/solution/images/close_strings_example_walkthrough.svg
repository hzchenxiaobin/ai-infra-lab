<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：cabbba vs abbccc</text>

  <!-- word1 行 -->
  <text x="30" y="74" font-size="12" fill="#446688" filter="url(#rough2)">word1</text>
  <rect x="78" y="56" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="114" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="150" y="56" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="186" y="56" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="222" y="56" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="258" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- 频次统计 -->
  <text x="310" y="68" font-size="11" fill="#666" filter="url(#rough2)">频次：</text>
  <rect x="354" y="54" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="377" y="71" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a:2</text>
  <rect x="404" y="54" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="427" y="71" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b:3</text>
  <rect x="454" y="54" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="477" y="71" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c:1</text>

  <!-- word2 行 -->
  <text x="30" y="118" font-size="12" fill="#4a7a3a" filter="url(#rough2)">word2</text>
  <rect x="78" y="100" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="114" y="100" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="150" y="100" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="186" y="100" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="222" y="100" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="258" y="100" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>

  <text x="310" y="112" font-size="11" fill="#666" filter="url(#rough2)">频次：</text>
  <rect x="354" y="98" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="377" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a:1</text>
  <rect x="404" y="98" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="427" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b:2</text>
  <rect x="454" y="98" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="477" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c:3</text>

  <!-- 三步检查 -->
  <text x="30" y="158" font-size="13" fill="#333" filter="url(#rough2)">三步检查：</text>

  <rect x="30" y="168" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="46" y="190" font-size="12" fill="#333" filter="url(#rough2)">① 长度 6 == 6  ✓</text>
  <text x="250" y="190" font-size="11" fill="#666" filter="url(#rough2)">② 集合 {a,b,c} == {a,b,c}  ✓</text>
  <text x="470" y="190" font-size="11" fill="#666" filter="url(#rough2)">③ 排序频次 [1,2,3]==[1,2,3] ✓</text>

  <text x="30" y="226" font-size="13" fill="#333" filter="url(#rough2)">三条全满足 → true。具体如何用操作互推？</text>

  <!-- 操作序列 -->
  <!-- step1: cabbba --op1--> caabbb -->
  <text x="30" y="258" font-size="11" fill="#446688" filter="url(#rough2)">操作1 重排</text>
  <rect x="110" y="244" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="146" y="244" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="163" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="182" y="244" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="199" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="218" y="244" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="235" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="254" y="244" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="271" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="290" y="244" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="307" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>

  <line x1="338" y1="257" x2="384" y2="257" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="250" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">排成同色相邻</text>

  <rect x="396" y="244" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="413" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="432" y="244" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="449" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="468" y="244" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="485" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="504" y="244" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="521" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>

  <text x="40" y="288" font-size="10" fill="#666" filter="url(#rough2)">cabbba</text>
  <text x="430" y="288" font-size="10" fill="#666" filter="url(#rough2)">caabbb</text>

  <!-- step2: op2 交换 a,c 频次 -->
  <text x="30" y="318" font-size="11" fill="#b85450" filter="url(#rough2)">操作2 a↔c</text>
  <line x1="110" y1="304" x2="470" y2="304" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="298" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a(2)↔c(2)：频次相同，等同换字母身份</text>

  <rect x="110" y="324" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="146" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="163" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="182" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="199" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="218" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="235" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="254" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="271" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="290" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="307" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="340" y="342" font-size="10" fill="#666" filter="url(#rough2)">acccbb</text>

  <line x1="380" y1="337" x2="426" y2="337" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="403" y="330" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">操作2 b↔c</text>

  <rect x="438" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="474" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="491" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="510" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="527" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>

  <text x="30" y="370" font-size="10" fill="#666" filter="url(#rough2)">acccbb</text>
  <text x="448" y="370" font-size="10" fill="#666" filter="url(#rough2)">abb + ccc = abbccc</text>

  <!-- 结论 -->
  <rect x="120" y="392" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 次操作完成 cabbba → abbccc ✓</text>
</svg>
