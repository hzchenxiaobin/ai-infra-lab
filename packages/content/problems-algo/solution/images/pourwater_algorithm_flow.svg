<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">倒水算法流程（每滴水重复一次，共 V 次）</text>

  <!-- Start -->
  <rect x="180" y="42" width="200" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">水滴落在 K，令 cur = K</text>

  <line x1="280" y1="76" x2="280" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Left scan -->
  <rect x="150" y="94" width="260" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">向左扫描：i = K−1 → 0</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#666">更低: cur=i｜更高: break｜同高: 继续</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">（沿非递增方向找最近最低点）</text>

  <line x1="280" y1="152" x2="280" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <polygon points="280,172 360,214 280,256 200,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">左扫后</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cur ≠ K ?</text>

  <!-- D1 Yes -->
  <line x1="360" y1="214" x2="396" y2="214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="398" y="196" width="138" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">heights[cur] += 1</text>
  <text x="467" y="225" text-anchor="middle" font-size="9" fill="#888">→ 下一滴</text>

  <!-- D1 No -->
  <line x1="280" y1="256" x2="280" y2="272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="266" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Right scan -->
  <rect x="150" y="274" width="260" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">向右扫描：i = K+1 → n−1</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">规则同左，方向相反</text>

  <line x1="280" y1="320" x2="280" y2="336" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2 -->
  <polygon points="280,338 360,380 280,422 200,380" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">右扫后</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cur ≠ K ?</text>

  <!-- D2 Yes -->
  <line x1="360" y1="380" x2="396" y2="380" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="398" y="362" width="138" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">heights[cur] += 1</text>
  <text x="467" y="391" text-anchor="middle" font-size="9" fill="#888">→ 下一滴</text>

  <!-- D2 No -->
  <line x1="280" y1="422" x2="280" y2="438" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="432" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Rise -->
  <rect x="195" y="440" width="170" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="457" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">heights[K] += 1（原地上升）</text>

  <!-- loop back arrow (left side) -->
  <path d="M 195 453 Q 36 453 36 250 Q 36 59 180 59" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="30" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 30 256)">重复 V 次</text>

  <text x="467" y="446" text-anchor="middle" font-size="9" fill="#888">三处加水后</text>
  <text x="467" y="458" text-anchor="middle" font-size="9" fill="#888">均回顶部</text>
</svg>
