<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：矩形能切出的最大正方形边长 = min(l, w)</text>

  <!-- ===== Section 1: single rectangle with inscribed square ===== -->
  <!-- Rectangle [5, 8]: l=5 horizontal, w=8 vertical, scale 1 unit = 14px -->
  <!-- l=5 -> 70px wide, w=8 -> 112px tall -->
  <rect x="80" y="60" width="70" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <!-- inscribed 5x5 square (70x70) -->
  <rect x="80" y="60" width="70" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- dimension labels -->
  <text x="115" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">l = 5</text>
  <text x="160" y="120" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">w = 8</text>
  <!-- bracket for l -->
  <path d="M 80 48 L 80 44 L 150 44 L 150 48" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- bracket for w -->
  <path d="M 156 60 L 160 60 L 160 172 L 156 172" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- square label -->
  <text x="115" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k×k</text>
  <text x="115" y="190" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">正方形 k = min(5,8) = 5</text>

  <!-- arrow to formula -->
  <path d="M 170 116 L 200 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right side: formula explanation -->
  <rect x="210" y="58" width="180" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个矩形 [l, w]</text>
  <line x1="222" y1="88" x2="378" y2="88" stroke="#c0dcc0" stroke-width="1" filter="url(#rough2)"/>
  <text x="222" y="106" font-size="10" fill="#555" filter="url(#rough2)">能切出的最大正方形</text>
  <text x="222" y="122" font-size="10" fill="#555" filter="url(#rough2)">边长受较短边限制：</text>
  <text x="300" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = min(l, w)</text>
  <text x="222" y="168" font-size="9" fill="#888" filter="url(#rough2)">k ≤ l 且 k ≤ w ⇒ k 最大 = min</text>

  <!-- ===== Section 2: array of rectangles -> min values -> max + count ===== -->
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：4 个矩形 → min 值 → 取最大再计数</text>

  <!-- 4 rectangles with [l, w] labels -->
  <g filter="url(#rough2)" font-size="10" fill="#446688" text-anchor="middle">
    <!-- rect 1: [5,8] -->
    <rect x="50" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="72" y="250">[5, 8]</text>
    <!-- rect 2: [3,9] -->
    <rect x="110" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="132" y="250">[3, 9]</text>
    <!-- rect 3: [5,12] -->
    <rect x="170" y="232" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="194" y="250">[5, 12]</text>
    <!-- rect 4: [16,5] -->
    <rect x="232" y="232" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="256" y="250">[16, 5]</text>
  </g>

  <!-- arrows down -->
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.2" fill="none">
    <path d="M 72 264 L 72 278" marker-end="url(#arr)"/>
    <path d="M 132 264 L 132 278" marker-end="url(#arr)"/>
    <path d="M 194 264 L 194 278" marker-end="url(#arr)"/>
    <path d="M 256 264 L 256 278" marker-end="url(#arr)"/>
  </g>
  <text x="300" y="274" font-size="9" fill="#888" filter="url(#rough2)">min(l, w)</text>

  <!-- min values: 5, 3, 5, 5 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="54" y="284" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="72" y="302" fill="#d6a040">5</text>
    <rect x="114" y="284" width="36" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="132" y="302" fill="#888">3</text>
    <rect x="176" y="284" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="194" y="302" fill="#d6a040">5</text>
    <rect x="238" y="284" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="256" y="302" fill="#d6a040">5</text>
  </g>

  <!-- arrow to max+count -->
  <path d="M 300 320 L 300 338" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="316" y="334" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取最大 + 计数</text>

  <!-- max + count result boxes on right -->
  <rect x="320" y="232" width="100" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">maxLen</text>
  <text x="370" y="274" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="430" y="232" width="100" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count（个数）</text>
  <text x="480" y="274" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- bottom insight -->
  <rect x="40" y="352" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="372" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一遍扫描即可完成：维护 maxLen 与 count</text>
  <text x="52" y="390" font-size="10" fill="#555" filter="url(#rough2)">① 每个矩形算 k = min(l, w)；② k &gt; maxLen 时更新 maxLen 并重置 count = 1；</text>
  <text x="52" y="406" font-size="10" fill="#555" filter="url(#rough2)">③ k == maxLen 时 count += 1。最终 count 即答案，O(n) / O(1)。</text>
</svg>
