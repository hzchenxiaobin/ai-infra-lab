<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定最长边，其余边全选前缀</text>

  <!-- 排序后数组 -->
  <text x="46" y="66" font-size="12" fill="#4a7a3a" filter="url(#rough2)">排序后：</text>
  <rect x="106" y="46" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="46" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="46" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="262" y="46" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="314" y="46" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="366" y="46" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="68" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="418" y="46" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="444" y="68" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">50</text>

  <text x="132" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="184" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="236" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="288" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="340" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="392" y="96" text-anchor="middle" font-size="11" fill="#7a2e2a" filter="url(#rough2)">5 = i</text>
  <text x="444" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <!-- 前缀大括号 -->
  <path d="M 106 102 Q 236 116 366 102" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="140" y="122" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="240" y="139" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">其余边候选 = 前 i 条，全部选上！</text>

  <path d="M 392 84 L 392 122" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="330" y="124" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="395" y="141" text-anchor="middle" font-size="11" fill="#7a2e2a" filter="url(#rough2)">最长边 nums[i]</text>

  <!-- 分隔线 -->
  <path d="M 40 168 L 480 168" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 天平判定 -->
  <text x="52" y="200" font-size="12" fill="#555" filter="url(#rough2)">判定（只压最长边一个人）：</text>

  <rect x="60" y="216" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="238" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">其余边之和</text>
  <text x="135" y="256" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">pre[i] = 12</text>

  <text x="248" y="248" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <path d="M 262 242 L 288 242" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <rect x="300" y="216" width="150" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="238" text-anchor="middle" font-size="12" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">最长边</text>
  <text x="375" y="256" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">nums[i] = 12</text>

  <rect x="150" y="284" width="240" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">12 &gt; 12 不成立（相等也不行！）✗</text>

  <!-- 要点框 -->
  <rect x="46" y="324" width="428" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">多边形条件只约束最长边一条 ⇒ 其余边多选无害：</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">和变大（更易满足）+ 周长变大（更优）⇒ 全选前缀，一次判定定胜负</text>
</svg>
