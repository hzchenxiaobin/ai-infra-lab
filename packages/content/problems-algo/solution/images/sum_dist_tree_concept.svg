<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">换根 DP 核心：根从 p=0 移到 c=2 时距离如何变化</text>

  <!-- Tree edges -->
  <line x1="280" y1="64" x2="170" y2="134" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="64" x2="390" y2="134" stroke="#d6a040" stroke-width="2.8" filter="url(#rough2)"/>
  <line x1="390" y1="134" x2="300" y2="214" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="390" y1="134" x2="390" y2="214" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="390" y1="134" x2="470" y2="214" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Nodes outside subtree (blue) -->
  <circle cx="280" cy="64" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">0</text>
  <circle cx="170" cy="134" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Nodes in subtree (green) -->
  <circle cx="390" cy="134" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="138" text-anchor="middle" font-size="12" fill="#333">2</text>
  <circle cx="300" cy="214" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="12" fill="#333">3</text>
  <circle cx="390" cy="214" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="218" text-anchor="middle" font-size="12" fill="#333">4</text>
  <circle cx="470" cy="214" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="218" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Reroot arrow on edge 0-2 -->
  <path d="M 330 88 Q 360 72 375 96" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="358" y="82" text-anchor="middle" font-size="10" fill="#d6a040">换根</text>

  <!-- Annotation boxes -->
  <rect x="30" y="250" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#333">c 的子树 (count[c] = 4 个节点)</text>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每个距离 −1 → 总变化 −count[c]</text>

  <rect x="290" y="250" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="11" fill="#333">子树外 (n − count[c] = 2 个节点)</text>
  <text x="410" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每个距离 +1 → 总变化 +(n − count[c])</text>

  <!-- Formula box -->
  <rect x="60" y="316" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[c] = ans[p] − count[c] + (n − count[c])</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#888">ans[2] = ans[0] − 4 + 2 = 8 − 4 + 2 = 6 ✓</text>
</svg>
