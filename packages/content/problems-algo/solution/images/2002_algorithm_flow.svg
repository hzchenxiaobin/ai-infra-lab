<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：枚举掩码 → 回文判定 → 子集配对 → 更新答案</text>

  <!-- Step 1 -->
  <rect x="80" y="50" width="380" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① 枚举所有掩码</text>
  <text x="270" y="92" text-anchor="middle" font-size="11" fill="#333">遍历 mask = 1, 2, …, 2ⁿ−1（n ≤ 12，最多 4096 个）</text>
  <text x="270" y="107" text-anchor="middle" font-size="10" fill="#666">每个掩码代表一个子序列（选中的下标集合）</text>

  <!-- arrow 1→2 -->
  <path d="M 270 116 L 270 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="140" width="380" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">② 回文判定 + 记录长度</text>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#333">提取 mask 对应子序列 t，isPalin[mask] = (t == t⁻¹)</text>
  <text x="270" y="197" text-anchor="middle" font-size="10" fill="#666">len[mask] = popcount(mask)（选中下标个数）</text>

  <!-- arrow 2→3 -->
  <path d="M 270 206 L 270 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="230" width="380" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="253" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">③ 枚举不相交回文对（子掩码 trick）</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#333">对每个回文 mask m1：remaining = FULL ^ m1</text>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#446688" font-family="'Comic Sans MS', monospace">m2 = remaining; while m2: { … m2 = (m2−1) &amp; remaining }</text>
  <text x="270" y="302" text-anchor="middle" font-size="10" fill="#666">枚举 remaining 的所有子掩码（即与 m1 不相交的全部掩码）</text>

  <!-- arrow 3→4 -->
  <path d="M 270 312 L 270 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="80" y="336" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">④ 更新最大乘积</text>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#333">若 isPalin[m2]：ans = max(ans, len[m1] × len[m2])</text>

  <!-- complexity note -->
  <rect x="80" y="402" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="422" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总复杂度 O(3ⁿ) ≈ 53 万（n = 12）</text>
  <text x="270" y="438" text-anchor="middle" font-size="10" fill="#666">子掩码枚举保证每对不相交掩码恰好访问一次</text>
</svg>
