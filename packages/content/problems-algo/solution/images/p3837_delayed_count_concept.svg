<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：从右往左扫，cnt 恰为后缀 [i+k+1, n−1] 的计数</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 每左移一格，后缀恰好多出一个左端 i+k+1 入表——即官方 hint「insert nums[i+k+1]」</text>

  <text x="150" y="54" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1：nums = [1,2,1,1]，k = 1</text>

  <!-- Snapshot A: i = 1 -->
  <text x="140" y="82" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">扫描至 i = 1</text>
  <rect x="150" y="62" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <rect x="202" y="62" width="44" height="30" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="224" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="254" y="62" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="306" y="62" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="172" y="106" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="224" y="106" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="276" y="106" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">i+k</text>
  <text x="328" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i+k+1</text>

  <text x="362" y="70" text-anchor="start" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">cnt = { 1 : 1 }</text>
  <text x="362" y="86" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">res[1] = cnt[2] = 0</text>
  <text x="362" y="104" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">后缀 [i+k+1, n−1] = [3, 3]</text>

  <!-- transition arrow -->
  <path d="M 110 116 L 110 154" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">i ← i−1：</text>
  <text x="122" y="143" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">位置 2（新 i+k+1）入表</text>

  <!-- Snapshot B: i = 0 -->
  <text x="276" y="155" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">刚入表</text>
  <path d="M 176 158 C 196 132, 254 132, 272 157" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="224" y="137" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">延迟 &gt; k 才计数</text>

  <text x="140" y="182" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">扫描至 i = 0</text>
  <rect x="150" y="162" width="44" height="30" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="172" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="202" y="162" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="162" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="306" y="162" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="172" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="224" y="206" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">i+k</text>
  <text x="276" y="206" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i+k+1</text>
  <text x="328" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">n−1</text>

  <text x="362" y="170" text-anchor="start" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">cnt = { 1 : 2 }</text>
  <text x="362" y="186" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">res[0] = cnt[1] = 2</text>
  <text x="362" y="204" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">后缀 [i+k+1, n−1] = [2, 3]</text>

  <!-- legend -->
  <rect x="30" y="222" width="14" height="10" rx="2" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="231" font-size="8.5" fill="#666" filter="url(#rough2)">已处理左侧</text>
  <rect x="140" y="222" width="14" height="10" rx="2" fill="#fff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="231" font-size="8.5" fill="#666" filter="url(#rough2)">当前 i</text>
  <rect x="230" y="222" width="14" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="231" font-size="8.5" fill="#666" filter="url(#rough2)">延迟区（不入表）</text>
  <rect x="360" y="222" width="14" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="231" font-size="8.5" fill="#666" filter="url(#rough2)">后缀（cnt 内容）</text>

  <!-- bottom notes -->
  <rect x="48" y="246" width="424" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">不变式：处理 i 时 cnt 恰为 { nums[j] : j ≥ i+k+1 } 的计数 ⇒ res[i] = cnt[nums[i]]</text>
  <text x="260" y="286" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">每个位置恰入表一次、从不删除 ⇒ 单趟 O(n)；「if it exists」= 越界保护 i+k+1 &lt; n</text>
  <text x="260" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">hint 4 的 reverse：倒序 append 收集天然逆序；原地 res[i] 赋值则免反转</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1 全程：res = [2, 0, 0, 0] ✓</text>
</svg>
