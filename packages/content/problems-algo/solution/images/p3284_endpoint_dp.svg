<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：子数组按右端点分组，由「扩展」递推</text>

  <!-- nums strip -->
  <text x="92" y="60" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="128" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="176" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="224" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="196" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="244" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- Group A: ending at i=1 -->
  <rect x="24" y="96" width="300" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="116" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">以 i=1（元素 2）结尾的 +1 子数组</text>
  <rect x="44" y="126" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="68" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 2</text>
  <rect x="110" y="126" width="62" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="141" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 3</text>
  <text x="242" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">up_cnt = 2</text>
  <text x="242" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">up_sum = 5</text>

  <!-- extension arrow -->
  <path d="M 174 190 L 174 214" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="184" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个子数组延长一个 3（各 +3）∪ 新单元素 [3]</text>

  <!-- Group B: ending at i=2 -->
  <rect x="24" y="218" width="300" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="238" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">以 i=2（元素 3）结尾的 +1 子数组</text>
  <rect x="40" y="248" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="64" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 3（新）</text>
  <rect x="100" y="248" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="128" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="128" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 5</text>
  <rect x="168" y="248" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="203" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2,3]</text>
  <text x="203" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 6</text>
  <text x="266" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">up_cnt = 3</text>
  <text x="266" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">up_sum = 14</text>
  <text x="266" y="300" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">= 5 + 3×3</text>

  <!-- right panel: formula -->
  <rect x="340" y="96" width="164" height="214" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="422" y="118" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">递推公式</text>
  <text x="422" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">up_sum[i] =</text>
  <text x="422" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">up_sum[i−1]</text>
  <text x="422" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+ up_cnt[i] × y</text>
  <line x1="356" y1="182" x2="488" y2="182" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="422" y="200" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">增量核对（i=2）：</text>
  <text x="422" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">旧 2 段各 +3 → +6</text>
  <text x="422" y="232" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">新单元素 → +3</text>
  <text x="422" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 +9 = 3×3 √</text>
  <line x1="356" y1="258" x2="488" y2="258" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="422" y="276" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">全程 up_sum：1 → 5 → 14</text>
  <text x="422" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Σ = 20 = 示例 1 答案</text>

  <!-- bottom note -->
  <rect x="34" y="326" width="452" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">−1 方向完全对称（本例只有单元素：1+2+3 = 6）；单元素两个方向各算一次</text>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = Σ( up_sum[i] + down_sum[i] − nums[i] ) = 26 − 6 = 20</text>

  <text x="260" y="404" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个子数组有唯一的右端点 —— 分组天然不重不漏</text>
</svg>
