<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：差距 = goal − sum，每个新元素最多贡献 limit，故最少 ⌈|差距|/limit⌉ 个</text>

  <!-- ===== Row 1: nums array → sum S ===== -->
  <text x="44" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">数组 nums</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="86" y="52" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="72" fill="#333">1</text>
    <rect x="130" y="52" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="150" y="72" fill="#333">−1</text>
    <rect x="174" y="52" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="194" y="72" fill="#333">1</text>
  </g>
  <!-- arrow to sum -->
  <path d="M 222 67 L 256 67" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="60" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">求和</text>
  <!-- sum S box -->
  <rect x="262" y="54" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="292" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S = 1</text>

  <!-- ===== Row 2: goal vs S, diff ===== -->
  <text x="44" y="116" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">目标 goal</text>
  <rect x="86" y="104" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="114" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−4</text>

  <!-- diff = goal - S -->
  <path d="M 150 118 L 210 118" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">goal − S</text>
  <rect x="216" y="104" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="264" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">差距 = −5</text>

  <!-- abs -->
  <path d="M 318 118 L 358 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="110" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">取绝对值</text>
  <rect x="364" y="104" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="402" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">|差距| = 5</text>

  <!-- ===== Row 3: |diff| bar divided into limit chunks ===== -->
  <text x="44" y="170" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">用 limit 大小的块填满 |差距|</text>

  <!-- the |diff| track (width 5 units, scale 40px/unit → 200px) -->
  <rect x="86" y="184" width="200" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="286" y="178" font-size="9" fill="#aaa" filter="url(#rough2)">|差距| = 5</text>

  <!-- chunk 1: limit = 3 → 120px -->
  <rect x="86" y="184" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="146" y="230" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">第 1 块 = limit</text>

  <!-- chunk 2: remainder = 2 → 80px -->
  <rect x="206" y="184" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="246" y="230" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">第 2 块 = 余数</text>

  <!-- limit bracket -->
  <path d="M 86 244 L 86 252 L 206 252 L 206 244" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="146" y="266" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">每块 ≤ limit = 3</text>

  <!-- count annotation -->
  <rect x="330" y="190" width="190" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块数 = ⌈5 / 3⌉ = 2</text>
  <text x="425" y="226" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每个新元素贡献 ±limit</text>
  <text x="425" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心：每次填满 limit 最优</text>

  <!-- ===== Bottom: formula box ===== -->
  <rect x="40" y="290" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="310" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">三步闭式：求和 → 算差距 → 上取整除法</text>
  <line x1="52" y1="318" x2="508" y2="318" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="336" font-size="10.5" fill="#555" filter="url(#rough2)">① S = Σ nums[i]   （注意用 64 位整数，|S| 可达 10¹¹）</text>
  <text x="52" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">② diff = goal − S；若 diff = 0 直接返回 0</text>
  <text x="52" y="372" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ ans = ⌈|diff| / limit⌉ = (|diff| + limit − 1) // limit</text>

  <!-- footer -->
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">符号无关：差距为正填 +limit，为负填 −limit，块数只取决于绝对值</text>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键：每个新元素最多贡献 limit → 最少块数 = 上取整</text>
</svg>
