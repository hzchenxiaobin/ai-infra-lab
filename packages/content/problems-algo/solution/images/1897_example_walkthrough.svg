<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：整除 → true / 不整除 → false</text>

  <!-- ============ Example 1: true ============ -->
  <rect x="30" y="40" width="500" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.25"/>
  <text x="50" y="62" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：words = ["abc","aabc","bc"]，n = 3</text>

  <!-- Character cells row -->
  <rect x="60"  y="74" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="94"  y="74" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="74" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="74" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="74" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="238" y="74" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="74" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="74" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="74" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="111" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="145" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="187" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="221" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="255" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="289" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="331" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="365" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- Totals -->
  <text x="50" y="124" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">总数：</text>
  <rect x="100" y="112" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a: 3</text>
  <rect x="180" y="112" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b: 3</text>
  <rect x="260" y="112" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c: 3</text>

  <!-- Divisibility -->
  <text x="50" y="162" font-size="12" fill="#555" filter="url(#rough2)">3 % 3 = 0 ✓   3 % 3 = 0 ✓   3 % 3 = 0 ✓</text>
  <rect x="380" y="150" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="171" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ true</text>

  <!-- ============ Example 2: false ============ -->
  <rect x="30" y="210" width="500" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.25"/>
  <text x="50" y="232" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：words = ["ab","a"]，n = 2</text>

  <!-- Character cells -->
  <rect x="60"  y="244" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="94"  y="244" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="244" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="111" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="153" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- Totals -->
  <text x="50" y="294" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">总数：</text>
  <rect x="100" y="282" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a: 2</text>
  <rect x="180" y="282" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b: 1</text>

  <!-- Divisibility -->
  <text x="50" y="332" font-size="12" fill="#555" filter="url(#rough2)">2 % 2 = 0 ✓   1 % 2 = 1 ✗ ← b 无法均分到 2 串</text>
  <rect x="380" y="320" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="341" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ false</text>

  <!-- Divider -->
  <path d="M 40 376 L 520 376" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=a  绿=b  橙=c   |   整除 → true   不整除 → false</text>
</svg>
