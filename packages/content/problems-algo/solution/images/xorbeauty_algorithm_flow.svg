<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟线性异或</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">无需枚举 n³ 三元组，也无需逐位遍历 30 个比特位</text>

  <!-- Flow row at y=72..104 -->
  <!-- 开始 -->
  <rect x="40" y="72" width="74" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="77" y="93" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- arrow -->
  <path d="M 114 88 L 138 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="142" y="72" width="92" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="93" text-anchor="middle" font-size="12" fill="#333">ans ← 0</text>

  <!-- arrow -->
  <path d="M 234 88 L 258 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body -->
  <rect x="262" y="72" width="158" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="341" y="93" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for x in nums: ans ⊕= x</text>

  <!-- arrow -->
  <path d="M 420 88 L 446 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="450" y="72" width="62" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="481" y="93" text-anchor="middle" font-size="11.5" fill="#333">return</text>

  <!-- Side note: equivalence -->
  <rect x="40" y="138" width="440" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">逐位等价视角</text>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#555">每位只数「该位为 1 的元素个数 c」的奇偶，c 奇则该位置 1</text>
  <text x="260" y="192" text-anchor="middle" font-size="10.5" fill="#555">⇔ 全体异或 ⊕nums 的对应位 —— 二者逐位相等</text>

  <!-- arrow down -->
  <path d="M 260 202 L 260 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="40" y="214" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">异或美丽值 = ⊕nums</text>
  <text x="260" y="254" text-anchor="middle" font-size="10.5" fill="#666">N_b = 2nc² − c³ ≡ c (mod 2)，n 被消去 ⇒ 无条件成立</text>

  <!-- Complexity -->
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">O(n) 时间  ·  O(1) 空间  ·  一趟扫描</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#888">对照暴力 O(n³)：把 n³ 项按位塌缩为「全体异或和」一个量</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#aaa">nums[i] ≤ 10⁹ &lt; 2³⁰，int 足够，无需 long long</text>
</svg>
