<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：numBottles = 10, numExchange = 3</text>

  <!-- header -->
  <rect x="76" y="48" width="368" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段</text>
  <text x="162" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">阈值 x</text>
  <text x="228" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">交换前空瓶</text>
  <text x="298" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">交换后空瓶</text>
  <text x="362" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">drunk</text>
  <text x="424" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">备注</text>

  <!-- highlight rows: 3 exchange rounds -->
  <rect x="76" y="130" width="368" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="76" y="166" width="368" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="76" y="202" width="368" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <!-- stop row highlight -->
  <rect x="76" y="238" width="368" height="36" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- grid lines -->
  <path d="M 76 78 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 114 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 130 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 166 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 202 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 238 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 76 274 H 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 130 48 V 274" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 194 48 V 274" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 262 48 V 274" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 334 48 V 274" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 394 48 V 274" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="76" y="48" width="368" height="226" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 0: drink all -->
  <text x="102" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">喝光</text>
  <text x="162" y="100" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="228" y="100" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="298" y="100" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="362" y="100" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="424" y="100" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始入账</text>

  <!-- row 1: exchange at x=3 -->
  <text x="102" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第1轮</text>
  <text x="162" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="228" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">10 ≥ 3 ✓</text>
  <text x="298" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">10−3+1=8</text>
  <text x="362" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="424" y="152" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">x 涨到 4</text>

  <!-- row 2: exchange at x=4 -->
  <text x="102" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第2轮</text>
  <text x="162" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="228" y="188" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">8 ≥ 4 ✓</text>
  <text x="298" y="188" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">8−4+1=5</text>
  <text x="362" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="424" y="188" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">x 涨到 5</text>

  <!-- row 3: exchange at x=5 -->
  <text x="102" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第3轮</text>
  <text x="162" y="224" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="228" y="224" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5 ≥ 5 ✓</text>
  <text x="298" y="224" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5−5+1=1</text>
  <text x="362" y="224" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="424" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">x 涨到 6</text>

  <!-- row 4: stop -->
  <text x="102" y="260" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">终止</text>
  <text x="162" y="260" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="228" y="260" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 &lt; 6 ✗</text>
  <text x="298" y="260" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="362" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="424" y="260" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">循环结束</text>

  <!-- example 1 box -->
  <rect x="48" y="292" width="424" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 1：numBottles = 13, numExchange = 6</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">空瓶 13 → 8 → 2，阈值 6 → 7 → 8，两轮交换后 2 &lt; 8 终止</text>

  <!-- conclusion box -->
  <rect x="48" y="350" width="424" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论：答案 = numBottles + 交换次数 k</text>
  <text x="260" y="388" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">示例 2：10 + 3 = 13；示例 1：13 + 2 = 15</text>
</svg>
