<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：rectangles = [[4,3],[8,6],[12,9],[6,4]]</text>

  <!-- Step labels -->
  <text x="40" y="64" font-size="11" fill="#446688" font-weight="bold">输入</text>
  <text x="40" y="110" font-size="11" fill="#d6a040" font-weight="bold">GCD</text>
  <text x="40" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">键</text>
  <text x="40" y="202" font-size="11" fill="#b85450" font-weight="bold">分组</text>
  <text x="40" y="268" font-size="11" fill="#446688" font-weight="bold">计数</text>
  <text x="40" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">配对</text>

  <!-- Input row -->
  <rect x="80" y="48" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="70" text-anchor="middle" font-size="10" fill="#333">[4,3]</text>

  <rect x="170" y="48" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="70" text-anchor="middle" font-size="10" fill="#333">[8,6]</text>

  <rect x="260" y="48" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="10" fill="#333">[12,9]</text>

  <rect x="350" y="48" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="70" text-anchor="middle" font-size="10" fill="#333">[6,4]</text>

  <!-- GCD row -->
  <rect x="80" y="94" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">gcd=1</text>

  <rect x="170" y="94" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="116" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">gcd=2</text>

  <rect x="260" y="94" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">gcd=3</text>

  <rect x="350" y="94" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="116" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">gcd=2</text>

  <!-- Key row -->
  <rect x="80" y="140" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4,3)</text>

  <rect x="170" y="140" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4,3)</text>

  <rect x="260" y="140" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4,3)</text>

  <rect x="350" y="140" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">(3,2)</text>

  <!-- Grouping box -->
  <rect x="80" y="186" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">同键 (4,3) → 一组</text>

  <rect x="350" y="186" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">单独一组</text>

  <!-- Count row -->
  <rect x="80" y="240" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">count[(4,3)] = 3</text>
  <text x="210" y="276" text-anchor="middle" font-size="9" fill="#888">三个矩形比例相同</text>

  <rect x="350" y="240" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">count=1</text>
  <text x="390" y="276" text-anchor="middle" font-size="9" fill="#888">无法配对</text>

  <!-- Pair counting -->
  <rect x="80" y="298" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">C(3,2) = 3·2/2 = 3</text>
  <text x="210" y="334" text-anchor="middle" font-size="9" fill="#888">(R₁,R₂) (R₁,R₃) (R₂,R₃)</text>

  <rect x="350" y="298" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="318" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">C(1,2) = 0</text>
  <text x="390" y="334" text-anchor="middle" font-size="9" fill="#888">无配对</text>

  <!-- Final answer -->
  <rect x="170" y="352" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 3 + 0 = 3</text>
</svg>
