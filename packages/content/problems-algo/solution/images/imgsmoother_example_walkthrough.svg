<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：img = [[100,200,100],[200,50,200],[100,200,100]]</text>

  <!-- ===== TOP: input grid → output grid ===== -->
  <text x="60" y="50" font-size="11" fill="#446688" font-weight="bold">输入 img</text>

  <!-- input 3x3, cell 40, origin (50,60) -->
  <rect x="50"  y="60"  width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70"  y="86"  text-anchor="middle" font-size="11" fill="#333">100</text>
  <rect x="90"  y="60"  width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="86"  text-anchor="middle" font-size="11" fill="#333">200</text>
  <rect x="130" y="60"  width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="86"  text-anchor="middle" font-size="11" fill="#333">100</text>

  <rect x="50"  y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70"  y="126" text-anchor="middle" font-size="11" fill="#333">200</text>
  <rect x="90"  y="100" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">50</text>
  <rect x="130" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#333">200</text>

  <rect x="50"  y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70"  y="166" text-anchor="middle" font-size="11" fill="#333">100</text>
  <rect x="90"  y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="166" text-anchor="middle" font-size="11" fill="#333">200</text>
  <rect x="130" y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#333">100</text>

  <!-- arrow input -> output -->
  <path d="M 174 120 L 406 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3×3 平滑</text>

  <text x="420" y="50" font-size="11" fill="#4a7a3a" font-weight="bold">输出 ans</text>

  <!-- output 3x3, cell 40, origin (410,60) -->
  <rect x="410" y="60"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="430" y="86"  text-anchor="middle" font-size="11" fill="#333">137</text>
  <rect x="450" y="60"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="86"  text-anchor="middle" font-size="11" fill="#333">141</text>
  <rect x="490" y="60"  width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="510" y="86"  text-anchor="middle" font-size="11" fill="#333">137</text>

  <rect x="410" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="430" y="126" text-anchor="middle" font-size="11" fill="#333">141</text>
  <rect x="450" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">138</text>
  <rect x="490" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="510" y="126" text-anchor="middle" font-size="11" fill="#333">141</text>

  <rect x="410" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="430" y="166" text-anchor="middle" font-size="11" fill="#333">137</text>
  <rect x="450" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#333">141</text>
  <rect x="490" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#333">137</text>

  <!-- divider -->
  <text x="300" y="206" text-anchor="middle" font-size="11" fill="#888">三个代表位置：角落 4 格 / 边缘 6 格 / 内部 9 格</text>

  <!-- ===== BOTTOM: 3 mini neighborhoods ===== -->
  <!-- mini grid 1: corner (0,0), cell 30, origin (60,222) -->
  <text x="105" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0,0) 角 · 4 格</text>
  <!-- row0: all OOB -->
  <rect x="60"  y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="75"  y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="90"  y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="105" y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="120" y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="135" y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <!-- row1: OOB, center 100, right 200 -->
  <rect x="60"  y="252" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="75"  y="272" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="90"  y="252" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="105" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <rect x="120" y="252" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="135" y="272" text-anchor="middle" font-size="9" fill="#333">200</text>
  <!-- row2: OOB, 200, 50 -->
  <rect x="60"  y="282" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="75"  y="302" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="90"  y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="105" y="302" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="120" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="135" y="302" text-anchor="middle" font-size="9" fill="#333">50</text>
  <text x="105" y="330" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">550 ÷ 4 = 137</text>

  <!-- mini grid 2: edge (0,1), cell 30, origin (245,222) -->
  <text x="290" y="216" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(0,1) 边 · 6 格</text>
  <!-- row0: all OOB -->
  <rect x="245" y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="275" y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="290" y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <rect x="305" y="222" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="320" y="242" text-anchor="middle" font-size="9" fill="#bbb">×</text>
  <!-- row1: 100, center 200, 100 -->
  <rect x="245" y="252" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="9" fill="#333">100</text>
  <rect x="275" y="252" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">200</text>
  <rect x="305" y="252" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="9" fill="#333">100</text>
  <!-- row2: 200, 50, 200 -->
  <rect x="245" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="275" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="9" fill="#333">50</text>
  <rect x="305" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="9" fill="#333">200</text>
  <text x="290" y="330" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">850 ÷ 6 = 141</text>

  <!-- mini grid 3: center (1,1), cell 30, origin (430,222) -->
  <text x="475" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(1,1) 心 · 9 格</text>
  <!-- row0: 100, 200, 100 -->
  <rect x="430" y="222" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="445" y="242" text-anchor="middle" font-size="9" fill="#333">100</text>
  <rect x="460" y="222" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="475" y="242" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="490" y="222" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="505" y="242" text-anchor="middle" font-size="9" fill="#333">100</text>
  <!-- row1: 200, center 50, 200 -->
  <rect x="430" y="252" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="445" y="272" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="460" y="252" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="475" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">50</text>
  <rect x="490" y="252" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="505" y="272" text-anchor="middle" font-size="9" fill="#333">200</text>
  <!-- row2: 100, 200, 100 -->
  <rect x="430" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="445" y="302" text-anchor="middle" font-size="9" fill="#333">100</text>
  <rect x="460" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="475" y="302" text-anchor="middle" font-size="9" fill="#333">200</text>
  <rect x="490" y="282" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="505" y="302" text-anchor="middle" font-size="9" fill="#333">100</text>
  <text x="475" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1250 ÷ 9 = 138</text>

  <!-- bottom note -->
  <rect x="40" y="344" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="361" text-anchor="middle" font-size="10.5" fill="#444">分母 = 有效格数：角 4 / 边 6 / 心 9 → 同一滤波器，不同位置取不同平均</text>
</svg>
