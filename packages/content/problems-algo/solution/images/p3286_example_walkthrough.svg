<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：grid = 全 1 套一圈 0，health = 5</text>

  <!-- 左：grid -->
  <text x="105" y="54" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">grid（1 = 扣血）</text>

  <rect x="58" y="64" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="102" y="64" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="64" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="58" y="108" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="102" y="108" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="146" y="108" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="58" y="152" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="102" y="152" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="152" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="80" cy="86" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="70" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <circle cx="168" cy="174" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="212" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点</text>

  <!-- 中间箭头 -->
  <path d="M 202 130 L 296 130" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="249" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0-1 BFS</text>

  <!-- 右：dist -->
  <text x="397" y="54" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">dist（最小损失）</text>

  <rect x="330" y="64" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="91" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="64" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="396" y="91" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="418" y="64" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="91" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="108" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="135" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="374" y="108" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="418" y="108" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="135" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="152" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="179" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="374" y="152" width="44" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="396" y="179" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="418" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="179" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="396" y="220" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">终点 dist = 4（橙框）</text>

  <!-- 关键步骤 -->
  <rect x="26" y="236" width="468" height="82" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="256" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">① dist[0][0] = 1：起点自己就要扣 1（别漏算）</text>
  <text x="40" y="274" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">② 弹 (0,1)₂ 时经 0 权边进 (1,1)：nd = 2 → push_front 免费插队</text>
  <text x="40" y="292" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">③ 之后 (1,1)₂ 先于所有 d=3 的格子弹出，把 2 「扩散」给右、下邻居</text>
  <text x="40" y="310" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">④ 终点 (2,2) 被锁定为 4：沿 (0,0)→(1,0)→(1,1)→(1,2)→(2,2)</text>

  <!-- 底部结论 -->
  <rect x="26" y="330" width="468" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dist[m-1][n-1] = 4 &lt; health = 5</text>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">剩余健康 = 5 − 4 = 1 &gt; 0 → 返回 true</text>

  <text x="260" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照示例 2：最小损失 4，health = 3 → 剩 −1 ≤ 0 → false</text>
  <text x="260" y="410" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照示例 1：存在全 0 路径，dist = 0 &lt; health = 1 → true</text>
</svg>
