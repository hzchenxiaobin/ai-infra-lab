<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [2,4,8,3,9,12]，T = 10</text>
  <text x="260" y="45" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">present = {2,3,4,8,9}（12 &gt; T 为孤点，big=1）</text>

  <!-- table header -->
  <rect x="36" y="58" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d</text>
  <rect x="84" y="58" width="106" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">枚举的 m</text>
  <rect x="192" y="58" width="214" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">first[] 设置 / union 操作</text>
  <rect x="408" y="58" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">连通块</text>

  <!-- row 1: d=2 -->
  <rect x="36" y="94" width="46" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="94" width="106" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="137" y="119" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2,4,6,8,10</text>
  <rect x="192" y="94" width="214" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">first[2]=first[4]=first[6]=first[8]</text>
  <text x="299" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">=first[10]=2（全部当锚点 2）</text>
  <rect x="408" y="94" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="119" text-anchor="middle" font-size="11.5" fill="#2a4a1e" filter="url(#rough2)">{2}</text>

  <!-- row 2: d=3 (highlight) -->
  <rect x="36" y="140" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="59" y="165" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <rect x="84" y="140" width="106" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">3,6,9</text>
  <rect x="192" y="140" width="214" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="158" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">first[3]=3；m=6：锚点已有 ⟹</text>
  <text x="299" y="174" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">union(2,3)；first[9]=3</text>
  <rect x="408" y="140" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1e" filter="url(#rough2)">{2,3}</text>

  <!-- row 3: d=4 -->
  <rect x="36" y="186" width="46" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="84" y="186" width="106" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="137" y="211" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4,8</text>
  <rect x="192" y="186" width="214" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m=4：union(2,4)</text>
  <text x="299" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m=8：已同根，合并无效</text>
  <rect x="408" y="186" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="211" text-anchor="middle" font-size="11.5" fill="#2a4a1e" filter="url(#rough2)">{2,3,4}</text>

  <!-- row 4: d=8 -->
  <rect x="36" y="232" width="46" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="84" y="232" width="106" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="137" y="257" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="192" y="232" width="214" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">union(2,8)，已同根</text>
  <rect x="408" y="232" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="257" text-anchor="middle" font-size="11.5" fill="#2a4a1e" filter="url(#rough2)">{2,3,4,8}</text>

  <!-- row 5: d=9 -->
  <rect x="36" y="278" width="46" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="84" y="278" width="106" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="137" y="303" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="192" y="278" width="214" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">union(3,9)，已同根</text>
  <rect x="408" y="278" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="296" text-anchor="middle" font-size="11" fill="#2a4a1e" filter="url(#rough2)">{2,3,4,</text>
  <text x="446" y="310" text-anchor="middle" font-size="11" fill="#2a4a1e" filter="url(#rough2)">8,9}</text>

  <!-- final answer -->
  <rect x="120" y="336" width="280" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">present 中 1 个连通块 + 孤点 12（big=1）</text>
  <text x="260" y="373" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">答案 = 1 + 1 = 2 ✓</text>
</svg>
