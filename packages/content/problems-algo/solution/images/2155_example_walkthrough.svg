<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [0, 0, 1, 0]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">rightOnes 初值 = 1（全数组只有 1 个 1），leftZeros = 0</text>

  <!-- Table header -->
  <!-- columns: i | numsleft | numsright | leftZeros | rightOnes | score | 备注 -->
  <!-- col x: i=40, left=80, right=160, lz=255, ro=310, score=365, note=415 ; widths vary -->
  <rect x="30" y="56" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>

  <rect x="70" y="56" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="72" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">numsleft</text>

  <rect x="160" y="56" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="72" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">numsright</text>

  <rect x="250" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="72" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">leftZeros</text>

  <rect x="310" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="72" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">rightOnes</text>

  <rect x="370" y="56" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="72" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">score</text>

  <rect x="420" y="56" width="74" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="72" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">备注</text>

  <!-- Row i=0: left=[], right=[0,0,1,0], lz=0, ro=1, score=1 -->
  <g>
    <rect x="30" y="84" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="48" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="70" y="84" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="113" y="103" text-anchor="middle" font-size="10" fill="#888">[ ]</text>
    <rect x="160" y="84" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="203" y="103" text-anchor="middle" font-size="10" fill="#333">[0,0,1,0]</text>
    <rect x="250" y="84" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="278" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="310" y="84" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="338" y="103" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="370" y="84" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="393" y="103" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="420" y="84" width="74" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="103" text-anchor="middle" font-size="9" fill="#888">nums[0]=0</text>
  </g>

  <!-- Row i=1: left=[0], right=[0,1,0], lz=1, ro=1, score=2 -->
  <g>
    <rect x="30" y="116" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="48" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="70" y="116" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="113" y="135" text-anchor="middle" font-size="10" fill="#333">[0]</text>
    <rect x="160" y="116" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="203" y="135" text-anchor="middle" font-size="10" fill="#333">[0,1,0]</text>
    <rect x="250" y="116" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="278" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="310" y="116" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="338" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="370" y="116" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="393" y="135" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="420" y="116" width="74" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="135" text-anchor="middle" font-size="9" fill="#888">nums[1]=0</text>
  </g>

  <!-- Row i=2: left=[0,0], right=[1,0], lz=2, ro=1, score=3 ★ -->
  <g>
    <rect x="30" y="148" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="48" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="70" y="148" width="86" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="113" y="167" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[0,0]</text>
    <rect x="160" y="148" width="86" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="203" y="167" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,0]</text>
    <rect x="250" y="148" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="278" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="310" y="148" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="338" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="370" y="148" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="393" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 ★</text>
    <rect x="420" y="148" width="74" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="457" y="167" text-anchor="middle" font-size="9" fill="#333">best=3</text>
  </g>

  <!-- Row i=3: left=[0,0,1], right=[0], lz=2, ro=0, score=2 -->
  <g>
    <rect x="30" y="180" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="48" y="199" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="70" y="180" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="113" y="199" text-anchor="middle" font-size="10" fill="#333">[0,0,1]</text>
    <rect x="160" y="180" width="86" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="203" y="199" text-anchor="middle" font-size="10" fill="#333">[0]</text>
    <rect x="250" y="180" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="278" y="199" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="310" y="180" width="56" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="338" y="199" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="370" y="180" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="393" y="199" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="420" y="180" width="74" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="199" text-anchor="middle" font-size="9" fill="#888">nums[2]=1</text>
  </g>

  <!-- Row i=4: left=[0,0,1,0], right=[], lz=3, ro=0, score=3 ★ -->
  <g>
    <rect x="30" y="212" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="48" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="70" y="212" width="86" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="113" y="231" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[0,0,1,0]</text>
    <rect x="160" y="212" width="86" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="203" y="231" text-anchor="middle" font-size="10" fill="#888">[ ]</text>
    <rect x="250" y="212" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="278" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="310" y="212" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="338" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
    <rect x="370" y="212" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="393" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 ★</text>
    <rect x="420" y="212" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="457" y="231" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">==best 追加</text>
  </g>

  <!-- Update trace note -->
  <rect x="40" y="256" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">增量更新轨迹：i=0→1 吃 0(lZ+1)；1→2 吃 0(lZ+1)；2→3 吃 1(rO−1)；3→4 吃 0(lZ+1)</text>
  <text x="260" y="291" text-anchor="middle" font-size="10.5" fill="#555">每步只改一个变量，score 由两变量相加直接得到，无需重扫</text>

  <!-- Answer -->
  <rect x="120" y="312" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终答案：[2, 4]（最高得分 3）</text>
</svg>
