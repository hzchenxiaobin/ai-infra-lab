<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [6,3,3,2]，k = 2</text>

  <text x="44" y="80" font-size="12" fill="#555" font-weight="bold">初始堆</text>
  <rect x="120" y="56" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="56" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="80" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="240" y="56" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="300" y="56" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="80" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="404" y="80" font-size="11" fill="#888">堆顶 = 2（最小）</text>

  <path d="M 148 96 L 148 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="172" y="114" font-size="10" fill="#b85450" font-weight="bold">弹 2 → +1 = 3 → 回填</text>

  <text x="44" y="166" font-size="12" fill="#555" font-weight="bold">第 1 步</text>
  <rect x="120" y="142" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="148" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="142" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="166" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="240" y="142" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="166" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="300" y="142" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="166" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="404" y="166" font-size="11" fill="#888">堆顶 = 3，k = 1</text>

  <path d="M 148 182 L 148 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="172" y="200" font-size="10" fill="#b85450" font-weight="bold">弹 3 → +1 = 4 → 回填</text>

  <text x="44" y="252" font-size="12" fill="#555" font-weight="bold">第 2 步</text>
  <rect x="120" y="228" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="252" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="180" y="228" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="252" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="240" y="228" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="268" y="252" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="300" y="228" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="252" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="404" y="252" font-size="11" fill="#888">k = 0，停止</text>

  <path d="M 300 268 L 300 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="300" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">乘积 = 3 × 3 × 4 × 6</text>
  <text x="300" y="344" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 216 ✓</text>

  <rect x="80" y="372" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">观察：每次都把 +1 用在当前最小值上</text>
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#555">数列趋向「均衡」→ 由 AM-GM，均衡时乘积最大</text>
</svg>
