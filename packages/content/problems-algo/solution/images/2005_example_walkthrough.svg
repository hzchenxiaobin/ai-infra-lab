<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3，Alice 胜（SG=1⊕2=3≠0）</text>

  <!-- Step 0: initial tree order(3) -->
  <text x="120" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① 初始：order(3)</text>
  <circle cx="120" cy="86" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="#333">3</text>
  <path d="M 120 100 L 96 124" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="90" cy="132" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="136" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 120 100 L 148 124" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="154" cy="132" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="136" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 154 143 L 154 160" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="154" cy="168" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="154" y="171" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="120" y="196" text-anchor="middle" font-size="10" fill="#555">左:order(1) 右:order(2)</text>

  <!-- arrow -->
  <path d="M 210 110 L 250 110" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Alice</text>
  <text x="230" y="124" text-anchor="middle" font-size="9.5" fill="#b85450">删右子树节点1</text>

  <!-- Step 1: Alice removes right-subtree leaf node 1 -->
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② Alice 删右子树叶子 1</text>
  <circle cx="360" cy="86" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#333">3</text>
  <path d="M 360 100 L 336 124" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="330" cy="132" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="136" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 360 100 L 388 124" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="394" cy="132" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="136" text-anchor="middle" font-size="10" fill="#333">2</text>
  <!-- removed node 1 shown as ghost -->
  <circle cx="394" cy="168" r="9" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="394" y="171" text-anchor="middle" font-size="8.5" fill="#b85450">✗</text>
  <text x="360" y="196" text-anchor="middle" font-size="10" fill="#555">右子树 order(2) 变成单节点 2</text>

  <!-- divider -->
  <path d="M 40 216 L 520 216" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step 2: Bob's two options -->
  <text x="280" y="238" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">③ Bob 的两种选择（无论选哪个，对称）</text>

  <!-- Bob option A: remove left node 1 -->
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob 选删左子树节点 1</text>
  <circle cx="150" cy="290" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="294" text-anchor="middle" font-size="10" fill="#333">3</text>
  <path d="M 150 303 L 176 322" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="182" cy="328" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="332" text-anchor="middle" font-size="9" fill="#333">2</text>
  <circle cx="118" cy="328" r="9" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="118" y="331" text-anchor="middle" font-size="8.5" fill="#b85450">✗</text>
  <text x="150" y="352" text-anchor="middle" font-size="10" fill="#555">剩 根3 + 右子2</text>

  <!-- Bob option B: remove right node 2 -->
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob 选删右子树节点 2</text>
  <circle cx="410" cy="290" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="294" text-anchor="middle" font-size="10" fill="#333">3</text>
  <path d="M 410 303 L 384 322" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="378" cy="328" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="378" y="332" text-anchor="middle" font-size="9" fill="#333">1</text>
  <circle cx="442" cy="328" r="9" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="442" y="331" text-anchor="middle" font-size="8.5" fill="#b85450">✗</text>
  <text x="410" y="352" text-anchor="middle" font-size="10" fill="#555">剩 根3 + 左子1</text>

  <!-- arrow down to step 4 -->
  <path d="M 280 366 L 280 386" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="300" y="380" font-size="10" fill="#b85450" font-weight="bold">Alice</text>

  <!-- Step 4: Alice removes the remaining single child -->
  <rect x="60" y="392" width="440" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ Alice 删掉 Bob 没碰的那个节点 → 只剩根 3</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#555">轮到 Bob：只有根可删 → Bob 删根 → Bob 负</text>
  <text x="280" y="450" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 true（Alice 胜），与 SG=3≠0 一致 ✓</text>
</svg>
