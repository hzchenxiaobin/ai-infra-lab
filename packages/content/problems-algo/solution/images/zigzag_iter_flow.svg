<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    next() / hasNext() 流程：队首出队 → 取值推进 → 按需回尾
  </text>

  <!-- ===== next() flow (left/center) ===== -->
  <text x="40" y="62" font-size="13" fill="#446688" filter="url(#rough2)">next()</text>

  <rect x="40" y="74" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">确保 hasNext()（队非空）</text>

  <path d="M150,106 L150,124" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="126" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">队首出队：it = q.pop_front()</text>

  <path d="M150,158 L150,176" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="178" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">val = *it；++it（推进）</text>

  <path d="M150,210 L150,226" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond: it 未到 end? -->
  <polygon points="150,228 220,262 150,296 80,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">it 未到</text>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">end ?</text>

  <!-- 是 branch (right) -->
  <path d="M220,262 L300,262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="232" y="256" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="300" y="246" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q.push_back(it) 回队尾</text>
  <path d="M390,280 L390,300 L150,300" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 否 branch (down) -->
  <path d="M150,296 L150,308" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="156" y="306" font-size="10" fill="#b85450" filter="url(#rough2)">否（耗尽，丢弃）</text>

  <rect x="40" y="312" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="333" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return val</text>

  <!-- ===== hasNext() flow (right top) ===== -->
  <text x="400" y="62" font-size="13" fill="#4a7a3a" filter="url(#rough2)">hasNext()</text>
  <polygon points="460,74 524,104 460,134 396,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">queue</text>
  <text x="460" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">为空？</text>

  <path d="M396,104 L360,104 L360,150" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="98" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="318" y="152" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return false</text>

  <path d="M524,104 L540,104 L540,150" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="528" y="98" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="498" y="152" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="540" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return true</text>

  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    职责分离：hasNext() 只判队列非空，next() 负责出队、取值、按需回尾
  </text>
</svg>
