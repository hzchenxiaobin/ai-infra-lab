<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滑动窗口 + 频率哈希</text>

  <!-- 开始 -->
  <rect x="90" y="36" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="170" y="55" text-anchor="middle" font-size="12" fill="#333">开始：cnt 清空，left=0, ans=0</text>

  <path d="M 170 64 L 170 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- for 循环 -->
  <rect x="90" y="86" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="106" text-anchor="middle" font-size="12" fill="#333">for right = 0 … n−1</text>

  <path d="M 170 116 L 170 136" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 入窗 -->
  <rect x="90" y="138" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="158" text-anchor="middle" font-size="12" fill="#333">x = nums[right]，cnt[x]++</text>

  <path d="M 170 170 L 170 190" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 菱形判断 -->
  <polygon points="170,192 252,225 170,258 88,225" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="230" text-anchor="middle" font-size="12" fill="#333">cnt[x] &gt; k ?</text>

  <path d="M 170 258 L 170 280" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="180" y="274" font-size="11" fill="#4a7a3a">否</text>

  <!-- 收缩分支 -->
  <path d="M 252 225 L 318 225" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="278" y="218" text-anchor="middle" font-size="11" fill="#b85450">是</text>

  <rect x="320" y="207" width="204" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="229" text-anchor="middle" font-size="12" fill="#333">cnt[nums[left]]−−，left++</text>

  <path d="M 422 207 L 422 182 L 176 182" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="300" y="176" font-size="10" fill="#b85450">窗口修复，重新判断</text>

  <!-- ans 更新 -->
  <rect x="90" y="282" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="302" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, right−left+1)</text>

  <!-- 循环回路 -->
  <path d="M 250 298 L 300 298 L 300 101 L 250 101" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="308" y="200" font-size="11" fill="#446688">right+1</text>

  <!-- 循环出口 -->
  <path d="M 90 101 L 34 101 L 34 345 L 98 345" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="40" y="205" font-size="10" fill="#555">right 用尽</text>

  <!-- 返回 -->
  <rect x="100" y="330" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="170" y="350" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- 右下要点 -->
  <rect x="320" y="282" width="216" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="304" text-anchor="middle" font-size="11" fill="#333">只有新入窗的 x 可能超频，</text>
  <text x="428" y="320" text-anchor="middle" font-size="11" fill="#333">while 只查 cnt[x]，无需全表扫描；</text>
  <text x="428" y="340" text-anchor="middle" font-size="11" fill="#333">left 总位移 ≤ n → 均摊 O(n)</text>
</svg>
