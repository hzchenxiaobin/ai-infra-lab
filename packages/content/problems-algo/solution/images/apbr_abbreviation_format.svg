<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">乘积缩写：三步走</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">以 12345678987600000 为例</text>

  <!-- ===== 原始乘积 ===== -->
  <rect x="60" y="60" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">P = 12345678987600000</text>
  <text x="290" y="92" text-anchor="middle" font-size="10" fill="#888">闭区间 [left, right] 全部整数之积</text>

  <path d="M 290 100 L 290 116" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第一步：数尾零 ===== -->
  <rect x="60" y="118" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="138" font-size="12" fill="#d6a040" font-weight="bold">① 数尾零 C</text>
  <text x="80" y="156" font-size="11" fill="#555">C = min(v₂(P), v₅(P)) = 5，移除 → 123456789876</text>
  <rect x="430" y="130" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">C = 5</text>

  <path d="M 290 170 L 290 186" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第二步：数位数 d ===== -->
  <rect x="60" y="188" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">② 数剩余位数 d</text>
  <text x="80" y="226" font-size="11" fill="#555">d = 12 &gt; 10 → 取前 5 位 + 后 5 位</text>
  <rect x="430" y="200" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">d = 12</text>

  <path d="M 290 240 L 290 256" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第三步：拼接 ===== -->
  <rect x="60" y="258" width="460" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="278" font-size="12" fill="#b85450" font-weight="bold">③ 拼接缩写串</text>
  <text x="80" y="296" font-size="11" fill="#555">d &gt; 10 → "&lt;pre&gt;...&lt;suf&gt;eC"</text>
  <text x="80" y="312" font-size="11" fill="#555">d ≤ 10 → "&lt;完整数&gt;eC"</text>

  <!-- 最终结果 -->
  <path d="M 290 320 L 290 336" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="338" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">"12345...89876e5"</text>
  <text x="290" y="374" text-anchor="middle" font-size="10" fill="#888">pre=12345 · suf=89876 · C=5</text>
</svg>
