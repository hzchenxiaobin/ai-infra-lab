<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n=6 时数组 arr=[1,3,5,7,9,11]，目标值 = n = 6</text>

  <!-- Target dashed line -->
  <line x1="80" y1="184" x2="470" y2="184" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="440" y="174" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">目标=6</text>

  <!-- Bars: scale 16 per unit, baseline y=280, width 38, gap 18, start x=121 -->
  <!-- bar0: val=1, deficit -->
  <rect x="121" y="264" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="140" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">↓5</text>

  <!-- bar1: val=3, deficit -->
  <rect x="177" y="232" width="38" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="260" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="196" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">↓3</text>

  <!-- bar2: val=5, deficit -->
  <rect x="233" y="200" width="38" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="244" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="252" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">↓1</text>

  <!-- bar3: val=7, surplus -->
  <rect x="289" y="168" width="38" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="308" y="228" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="308" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑1</text>

  <!-- bar4: val=9, surplus -->
  <rect x="345" y="136" width="38" height="144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="364" y="212" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="364" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑3</text>

  <!-- bar5: val=11, surplus -->
  <rect x="401" y="104" width="38" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="10" fill="#333">11</text>
  <text x="420" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑5</text>

  <!-- baseline -->
  <line x1="100" y1="280" x2="460" y2="280" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- deficit bracket -->
  <path d="M 121 312 L 121 318 L 271 318 L 271 312" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="196" y="332" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">总 deficit = 5+3+1 = 9</text>

  <!-- surplus bracket -->
  <path d="M 289 312 L 289 318 L 439 318 L 439 312" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="364" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">总 surplus = 1+3+5 = 9</text>

  <!-- transfer arrows (curved, surplus -> deficit) -->
  <path d="M 420 104 Q 280 60 140 264" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 364 136 Q 300 80 196 232" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 168 Q 290 120 252 200" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="40" y="346" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每次操作转移 1 单位 → 最小操作数 = 总 deficit = 总 surplus = 9</text>
</svg>
