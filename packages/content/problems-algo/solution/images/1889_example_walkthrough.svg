<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：packages = [2,3,5]</text>

  <!-- Global: sorted packages + prefix -->
  <text x="24" y="52" font-size="10.5" fill="#666">排序后</text>
  <rect x="70" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="59" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <rect x="114" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="59" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="158" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="59" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <text x="210" y="59" font-size="10.5" fill="#888">prefix = [0, 2, 5, 10]</text>

  <!-- Divider -->
  <line x1="30" y1="84" x2="550" y2="84" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Supplier 0 -->
  <rect x="30" y="94" width="250" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="155" y="112" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">供应商 0：boxes = [4, 8]</text>

  <!-- Supplier 0: b=4 step -->
  <text x="42" y="132" font-size="10" fill="#555">b=4：upper_bound → idx=2</text>
  <rect x="42" y="140" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="86" y="140" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="138" y="158" font-size="10" fill="#666">段和 = 5</text>
  <text x="42" y="180" font-size="10" fill="#b85450">浪费 = 4×2 − 5 = 3</text>

  <!-- Supplier 0: b=8 step -->
  <text x="42" y="200" font-size="10" fill="#555">b=8：upper_bound → idx=3</text>
  <rect x="42" y="208" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="226" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="92" y="226" font-size="10" fill="#666">段和 = 5</text>
  <text x="42" y="248" font-size="10" fill="#b85450">浪费 = 8×1 − 5 = 3</text>

  <text x="42" y="266" font-size="11" fill="#d6a040" font-weight="bold">总浪费 = 3 + 3 = 6 ✓</text>

  <!-- Supplier 1 -->
  <rect x="300" y="94" width="250" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="425" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">供应商 1：boxes = [2, 8]</text>

  <!-- Supplier 1: b=2 step -->
  <text x="312" y="132" font-size="10" fill="#555">b=2：upper_bound → idx=1</text>
  <rect x="312" y="140" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="362" y="158" font-size="10" fill="#666">段和 = 2</text>
  <text x="312" y="180" font-size="10" fill="#b85450">浪费 = 2×1 − 2 = 0</text>

  <!-- Supplier 1: b=8 step -->
  <text x="312" y="200" font-size="10" fill="#555">b=8：upper_bound → idx=3</text>
  <rect x="312" y="208" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="226" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="356" y="208" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="226" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="408" y="226" font-size="10" fill="#666">段和 = 8</text>
  <text x="312" y="248" font-size="10" fill="#b85450">浪费 = 8×2 − 8 = 8</text>

  <text x="312" y="266" font-size="11" fill="#446688" font-weight="bold">总浪费 = 0 + 8 = 8</text>

  <!-- Result box -->
  <path d="M 155 278 L 155 300 L 290 300" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 425 278 L 425 300 L 290 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="312" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min(6, 8) = 6</text>
  <text x="290" y="348" text-anchor="middle" font-size="10.5" fill="#555">返回 6 % (10⁹+7) = 6</text>

  <!-- Footer note -->
  <rect x="40" y="372" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：upper_bound 定位「≤ b」的右边界，前缀和 O(1) 求段和</text>
  <text x="290" y="410" text-anchor="middle" font-size="10.5" fill="#555">箱子升序 → prev 单调递增 → 每个包裹恰好被处理一次</text>
</svg>
