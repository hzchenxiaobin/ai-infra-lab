<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心递推：每个数 = 肩上两数之和</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">除每行首尾的 1 外，中间数 = 正上方 + 左上方</text>

  <!-- ===== Pascal triangle (5 rows) ===== -->
  <!-- cell w=38 h=36, centers spaced 40 horizontally, rows offset 20; vertical cy spaced 42 -->
  <g font-size="13" fill="#333">
    <!-- Row 0: [1] -->
    <rect x="241" y="70" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="260" y="93" text-anchor="middle" fill="#666">1</text>

    <!-- Row 1: [1,1] -->
    <rect x="221" y="112" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="135" text-anchor="middle" fill="#666">1</text>
    <rect x="261" y="112" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="280" y="135" text-anchor="middle" fill="#666">1</text>

    <!-- Row 2: [1,2,1]  shoulder A=1 (pos0), shoulder B=2 (pos1) highlighted -->
    <rect x="201" y="154" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="220" y="177" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="241" y="154" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="260" y="177" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="281" y="154" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="300" y="177" text-anchor="middle" fill="#666">1</text>

    <!-- Row 3: [1,3,3,1]  target = 3 (pos1) highlighted -->
    <rect x="181" y="196" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="200" y="219" text-anchor="middle" fill="#666">1</text>
    <rect x="221" y="196" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="219" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="261" y="196" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="280" y="219" text-anchor="middle" fill="#666">3</text>
    <rect x="301" y="196" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="320" y="219" text-anchor="middle" fill="#666">1</text>

    <!-- Row 4: [1,4,6,4,1] -->
    <rect x="161" y="238" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="180" y="261" text-anchor="middle" fill="#666">1</text>
    <rect x="201" y="238" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="220" y="261" text-anchor="middle" fill="#666">4</text>
    <rect x="241" y="238" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="260" y="261" text-anchor="middle" fill="#666">6</text>
    <rect x="281" y="238" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="300" y="261" text-anchor="middle" fill="#666">4</text>
    <rect x="321" y="238" width="38" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="340" y="261" text-anchor="middle" fill="#666">1</text>
  </g>

  <!-- arrows: shoulder A (row2 pos0, bottom ~190, cx=220) -> target (row3 pos1, top ~196, cx=240) -->
  <path d="M 220 192 Q 225 196 238 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- shoulder B (row2 pos1, bottom ~190, cx=260) -> target (cx=240) -->
  <path d="M 260 192 Q 252 196 242 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- small labels on shoulders -->
  <text x="220" y="148" text-anchor="middle" font-size="9" fill="#446688">左上方</text>
  <text x="260" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">正上方</text>
  <text x="240" y="246" text-anchor="middle" font-size="9" fill="#b85450">= 1 + 2</text>

  <!-- ===== Formula ===== -->
  <rect x="60" y="300" width="400" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-family="monospace" font-size="13" fill="#333" font-weight="bold">triangle[i][j] = [i-1][j-1] + [i-1][j]</text>
  <text x="260" y="338" text-anchor="middle" font-size="9" fill="#888">帕斯卡恒等式：肩上两数相加（0 &lt; j &lt; i）</text>
</svg>
