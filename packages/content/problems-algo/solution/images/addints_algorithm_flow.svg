<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="420" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：读取两数 → 相加 → 返回</text>

  <!-- Start oval -->
  <ellipse cx="240" cy="64" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="69" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="240" y1="84" x2="240" y2="100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- read inputs -->
  <rect x="110" y="104" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="122" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">读取 num1, num2</text>
  <text x="240" y="138" text-anchor="middle" font-size="10.5" fill="#888">范围 [-100, 100]，无溢出风险</text>

  <line x1="240" y1="148" x2="240" y2="164" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ADD operation -->
  <rect x="80" y="168" width="320" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">sum = num1 + num2</text>
  <text x="240" y="208" text-anchor="middle" font-size="11" fill="#b85450">映射到 CPU 的 ADD 指令 · 单周期</text>

  <line x1="240" y1="218" x2="240" y2="234" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="130" y="238" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="263" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return sum</text>

  <line x1="240" y1="278" x2="240" y2="294" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="240" cy="314" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note -->
  <rect x="60" y="346" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">三步即最优解，无优化空间</text>

  <!-- complexity tag -->
  <rect x="60" y="388" width="360" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="406" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(1)，空间 O(1)</text>
</svg>
