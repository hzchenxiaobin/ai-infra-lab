<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：预处理 + 子集枚举</text>

  <!-- Step 1 -->
  <rect x="100" y="44" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 编码所有 word → 26 位掩码</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mask |= 1 &lt;&lt; (c - 'a')；统计 freq[mask]++</text>
  <path d="M 280 96 L 280 112" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="100" y="114" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 对每个 puzzle：编码 → pmask</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">取首字母位 first = 1 &lt;&lt; (p[0]-'a')；rest = pmask ^ first</text>
  <path d="M 280 166 L 280 182" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 (highlight) -->
  <rect x="70" y="184" width="420" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">③ 枚举 rest 的全部子集 sub（共 2⁶ = 64 个）</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#rough2)">for (sub = rest; ; sub = (sub-1) &amp; rest)</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#rough2)">candidate = sub | first  ← 强制含首字母</text>
  <path d="M 280 256 L 280 272" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="100" y="274" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">④ 累加 freq[candidate] 到 answer[i]</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">sub == 0 时处理完最后一个子集，break</text>
  <path d="M 280 326 L 280 342" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="140" y="344" width="280" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">⑤ 返回 answer 数组</text>

  <!-- side note: subset trick -->
  <rect x="40" y="194" width="24" height="50" fill="#fafafa" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="212" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">子集</text>
  <text x="52" y="226" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">枚举</text>
  <text x="52" y="240" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">技巧</text>

  <!-- bottom key note -->
  <rect x="40" y="392" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">关键：puzzle 恰 7 个不同字母 → 子集数固定 2⁶ = 64</text>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">把 O(words × puzzles) 降到 O(Σ|word| + 64 × puzzles)</text>
</svg>
