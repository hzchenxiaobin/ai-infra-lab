<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2730c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2730b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：窗口内相邻相同对 ≤ 1，出现第二对时左端跳过第一对</text>

  <!-- ===== top: window with 0 pairs / 1 pair, legal ===== -->
  <text x="40" y="78" font-size="12" fill="#888" font-weight="bold">合法（≤1 对）</text>

  <!-- example string 5223: one pair 22 highlighted -->
  <g font-size="18" font-weight="bold">
    <rect x="90" y="90" width="40" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="110" y="119" text-anchor="middle" fill="#333">5</text>

    <rect x="130" y="90" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="150" y="119" text-anchor="middle" fill="#b85450">2</text>

    <rect x="170" y="90" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="190" y="119" text-anchor="middle" fill="#b85450">2</text>

    <rect x="210" y="90" width="40" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="230" y="119" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- bracket showing window [0,3] -->
  <path d="M88,150 Q88,158 96,158 L244,158 Q252,158 252,150" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 5223：1 对(22)，合法 ✓</text>

  <!-- ===== bottom: second pair appears, violation -> jump ===== -->
  <text x="40" y="232" font-size="12" fill="#888" font-weight="bold">违例（2 对）</text>

  <g font-size="18" font-weight="bold">
    <rect x="90" y="244" width="40" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="110" y="273" text-anchor="middle" fill="#333">5</text>

    <rect x="130" y="244" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="150" y="273" text-anchor="middle" fill="#b85450">2</text>

    <rect x="170" y="244" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="190" y="273" text-anchor="middle" fill="#b85450">2</text>

    <rect x="210" y="244" width="40" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="230" y="273" text-anchor="middle" fill="#333">3</text>

    <rect x="250" y="244" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="270" y="273" text-anchor="middle" fill="#b85450">3</text>
  </g>

  <!-- bracket old window [0,4] with X -->
  <path d="M88,304 Q88,312 96,312 L284,312 Q292,312 292,304" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="190" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">52233：2 对(22,33)，违例 ✗</text>

  <!-- arrow indicating left jump -->
  <text x="360" y="270" font-size="11" fill="#d6a040" font-weight="bold">左端跳到 last+1</text>
  <path d="M300,272 L358,272" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2730c)" filter="url(#rough2)"/>

  <!-- after jump: window [2,4] = 233 -->
  <g font-size="18" font-weight="bold">
    <rect x="370" y="244" width="40" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="390" y="273" text-anchor="middle" fill="#333">2</text>

    <rect x="410" y="244" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="430" y="273" text-anchor="middle" fill="#b85450">3</text>

    <rect x="450" y="244" width="40" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="470" y="273" text-anchor="middle" fill="#b85450">3</text>
  </g>
  <path d="M368,304 Q368,312 376,312 L484,312 Q492,312 492,304" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">233：1 对(33)，恢复合法 ✓</text>

  <!-- bottom note -->
  <rect x="80" y="346" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">跳越式收缩：l ← last+1，旧对被挤掉，计数回到 1</text>
  <text x="280" y="379" text-anchor="middle" font-size="10" fill="#d6a040">K=1 时左端可一次跳到位，故整体 O(n)</text>
</svg>
