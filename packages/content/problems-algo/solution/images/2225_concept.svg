<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：哈希表 loss 记录每个玩家的败场数</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">胜者登记 0 · 败者 +1 · 败场∈{0,1} 收集排序</text>

  <!-- ===== Left: matches (a few rows) ===== -->
  <text x="60" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">matches</text>
  <rect x="22" y="82" width="92" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="38" y="100" font-size="10" fill="#555">[1,3]</text>
  <text x="38" y="116" font-size="10" fill="#555">[2,3]</text>
  <text x="38" y="132" font-size="10" fill="#555">[3,6]</text>
  <text x="38" y="148" font-size="10" fill="#555">[5,6]</text>
  <text x="38" y="164" font-size="10" fill="#555">[4,5]</text>
  <text x="38" y="180" font-size="10" fill="#555">[10,4]</text>
  <text x="38" y="196" font-size="10" fill="#888">...</text>
  <text x="38" y="222" font-size="9.5" fill="#888">每场 [w, l]</text>

  <!-- arrow matches -> loss table -->
  <path d="M 118 157 L 168 157" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="150" text-anchor="middle" font-size="9" fill="#888">遍历一次</text>

  <!-- ===== Middle: hash table loss ===== -->
  <text x="262" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">loss 表（玩家→败场）</text>
  <rect x="180" y="82" width="164" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <!-- table header -->
  <text x="216" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">玩家</text>
  <text x="298" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">败场</text>
  <line x1="190" y1="106" x2="334" y2="106" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <!-- rows -->
  <text x="216" y="122" font-size="10.5" fill="#333">1</text>
  <text x="298" y="122" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="216" y="138" font-size="10.5" fill="#333">2</text>
  <text x="298" y="138" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="216" y="154" font-size="10.5" fill="#333">3</text>
  <text x="298" y="154" font-size="10.5" fill="#888">2</text>
  <text x="216" y="170" font-size="10.5" fill="#333">4</text>
  <text x="298" y="170" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="216" y="186" font-size="10.5" fill="#333">5</text>
  <text x="298" y="186" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="216" y="202" font-size="10.5" fill="#333">6</text>
  <text x="298" y="202" font-size="10.5" fill="#888">2</text>
  <text x="216" y="218" font-size="10.5" fill="#333">10</text>
  <text x="298" y="218" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="216" y="236" font-size="10.5" fill="#888">...</text>
  <text x="298" y="236" font-size="10.5" fill="#888">...</text>
  <text x="216" y="258" font-size="9" fill="#4a7a3a">setdefault(w,0)</text>
  <text x="298" y="258" font-size="9" fill="#4a7a3a">loss[l]++</text>

  <!-- arrows loss -> answer buckets -->
  <path d="M 346 122 C 372 122 372 110 398 110" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 346 170 C 372 170 372 210 398 210" stroke="#d6a040" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Right: answer buckets ===== -->
  <!-- answer[0]: loss==0 (red highlight) -->
  <rect x="400" y="78" width="140" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <text x="470" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">answer[0]</text>
  <text x="470" y="110" text-anchor="middle" font-size="9.5" fill="#888">败场 == 0</text>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1, 2, 10]</text>

  <!-- answer[1]: loss==1 (orange highlight) -->
  <rect x="400" y="178" width="140" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">answer[1]</text>
  <text x="470" y="210" text-anchor="middle" font-size="9.5" fill="#888">败场 == 1</text>
  <text x="470" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[4, 5, 7, 8]</text>

  <!-- ===== Bottom: final answer ===== -->
  <rect x="40" y="298" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">
    排序后返回 [[1,2,10], [4,5,7,8]]
  </text>

  <!-- ===== Footer legend ===== -->
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#888">红=败场0(没输过) · 橙=败场1(输一场) · 灰=败场≥2(忽略)</text>
  <text x="280" y="370" text-anchor="middle" font-size="9.5" fill="#888">胜者登记0：只赢没输的玩家也进表，否则会被遗漏</text>
</svg>
