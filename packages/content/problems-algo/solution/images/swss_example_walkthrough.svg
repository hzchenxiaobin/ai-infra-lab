<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：steps = 3, arrLen = 2</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#888">有效长度 = min(2, 4) = 2，只需维护 2 个位置</text>

  <!-- ===== Table ===== -->
  <!-- Header -->
  <rect x="150" y="56" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">s</text>
  <rect x="206" y="56" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">pos 0</text>
  <rect x="262" y="56" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">pos 1</text>

  <!-- Row s=0 -->
  <rect x="150" y="86" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="106" text-anchor="middle" font-size="12" fill="#555">0</text>
  <rect x="206" y="86" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="262" y="86" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>

  <!-- Row s=1 -->
  <rect x="150" y="116" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="136" text-anchor="middle" font-size="12" fill="#555">1</text>
  <rect x="206" y="116" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="136" text-anchor="middle" font-size="13" fill="#555">1</text>
  <rect x="262" y="116" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="13" fill="#555">1</text>

  <!-- Row s=2 -->
  <rect x="150" y="146" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="166" text-anchor="middle" font-size="12" fill="#555">2</text>
  <rect x="206" y="146" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="166" text-anchor="middle" font-size="13" fill="#555">2</text>
  <rect x="262" y="146" width="56" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="166" text-anchor="middle" font-size="13" fill="#555">2</text>

  <!-- Row s=3 (answer highlighted) -->
  <rect x="150" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="206" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="196" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
  <rect x="262" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="196" text-anchor="middle" font-size="13" fill="#555">4</text>

  <!-- Answer annotation arrow -->
  <path d="M 318 191 L 350 191" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = 4</text>

  <!-- Transition hints -->
  <text x="345" y="106" font-size="9" fill="#aaa">初始</text>
  <text x="345" y="136" font-size="9" fill="#aaa">1+0 / 0+1</text>
  <text x="345" y="166" font-size="9" fill="#aaa">1+1 / 1+1</text>
  <text x="345" y="196" font-size="9" fill="#aaa">2+2 / 2+2</text>

  <!-- Separator -->
  <path d="M 60 222 L 460 222" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 4 paths -->
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">4 条合法路径（3 步后回到索引 0）</text>

  <text x="70" y="264" font-size="10" fill="#4a7a3a">① 不动 → 不动 → 不动</text>
  <text x="300" y="264" font-size="10" fill="#888">0 → 0 → 0 → 0</text>

  <text x="70" y="284" font-size="10" fill="#4a7a3a">② 右移 → 左移 → 不动</text>
  <text x="300" y="284" font-size="10" fill="#888">0 → 1 → 0 → 0</text>

  <text x="70" y="304" font-size="10" fill="#4a7a3a">③ 右移 → 不动 → 左移</text>
  <text x="300" y="304" font-size="10" fill="#888">0 → 1 → 1 → 0</text>

  <text x="70" y="324" font-size="10" fill="#4a7a3a">④ 不动 → 右移 → 左移</text>
  <text x="300" y="324" font-size="10" fill="#888">0 → 0 → 1 → 0</text>
</svg>
