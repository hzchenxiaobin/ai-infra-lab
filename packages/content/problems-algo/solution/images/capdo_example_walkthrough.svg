<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="460" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：n = 1, 2, 3</text>
  <path d="M 170 36 Q 280 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="32" y="56" width="496" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="62" y="76" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">i</text>
  <text x="140" y="76" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">f(i−1)</text>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">i × (2i−1)</text>
  <text x="410" y="76" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">f(i)</text>
  <text x="500" y="76" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">验证</text>

  <!-- row 1: i=1 -->
  <g filter="url(#sk)">
    <rect x="32" y="90" width="496" height="30" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="110" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="140" y="110" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="270" y="110" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">1 × 1 = 1</text>
  <text x="410" y="110" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">1</text>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#4a8e4a">P₁D₁ ✓</text>

  <!-- row 2: i=2 -->
  <g filter="url(#sk)">
    <rect x="32" y="122" width="496" height="30" rx="3" fill="#fffdf3" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="140" y="142" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="270" y="142" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">2 × 3 = 6</text>
  <text x="410" y="142" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">6</text>
  <text x="500" y="142" text-anchor="middle" font-size="11" fill="#4a8e4a">✓</text>

  <!-- row 3: i=3 -->
  <g filter="url(#sk)">
    <rect x="32" y="154" width="496" height="30" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="174" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="140" y="174" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="270" y="174" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">3 × 5 = 15</text>
  <text x="410" y="174" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">90</text>
  <text x="500" y="174" text-anchor="middle" font-size="11" fill="#4a8e4a">✓</text>

  <!-- separator -->
  <path d="M 60 200 Q 280 208 500 200" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- n=2 enumeration -->
  <text x="280" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">n = 2 的全部 6 种合法序列</text>

  <!-- 6 sequences in 2 columns x 3 rows -->
  <g font-size="11" fill="#333">
    <!-- seq 1 -->
    <g filter="url(#sk)">
      <rect x="44" y="240" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    </g>
    <text x="134" y="258" text-anchor="middle" fill="#2b4b6e" font-weight="bold">P₁ P₂ D₁ D₂</text>

    <!-- seq 2 -->
    <g filter="url(#sk)">
      <rect x="44" y="272" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    </g>
    <text x="134" y="290" text-anchor="middle" fill="#2b4b6e" font-weight="bold">P₁ P₂ D₂ D₁</text>

    <!-- seq 3 -->
    <g filter="url(#sk)">
      <rect x="44" y="304" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    </g>
    <text x="134" y="322" text-anchor="middle" fill="#2b4b6e" font-weight="bold">P₁ D₁ P₂ D₂</text>

    <!-- seq 4 -->
    <g filter="url(#sk)">
      <rect x="296" y="240" width="180" height="26" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    </g>
    <text x="386" y="258" text-anchor="middle" fill="#2e6e2e" font-weight="bold">P₂ P₁ D₁ D₂</text>

    <!-- seq 5 -->
    <g filter="url(#sk)">
      <rect x="296" y="272" width="180" height="26" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    </g>
    <text x="386" y="290" text-anchor="middle" fill="#2e6e2e" font-weight="bold">P₂ P₁ D₂ D₁</text>

    <!-- seq 6 -->
    <g filter="url(#sk)">
      <rect x="296" y="304" width="180" height="26" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    </g>
    <text x="386" y="322" text-anchor="middle" fill="#2e6e2e" font-weight="bold">P₂ D₂ P₁ D₁</text>
  </g>

  <!-- explanation box -->
  <g filter="url(#sk)">
    <rect x="32" y="346" width="496" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="48" y="368" font-size="11.5" fill="#444">n=2 验证插入法：已有 P₁D₁（1 对、2 项、3 空位），插入 P₂D₂：</text>
  <text x="48" y="386" font-size="11.5" fill="#7a5415" font-weight="bold">  选 2 空位（可重复）= C(4,2) = 2×3 = 6 种 → f(2) = 1 × 6 = 6 ✓</text>
  <text x="48" y="406" font-size="11.5" fill="#444">闭式验证：(2n)! / 2ⁿ</text>
  <text x="48" y="424" font-size="11" fill="#888">  n=1: 2!/2 = 1   n=2: 4!/4 = 6   n=3: 6!/8 = 90   n=4: 8!/16 = 2520</text>
  <text x="48" y="440" font-size="10.5" fill="#888">  每对 P/D 顺序独立各占一半 → 总排列 (2n)! 中合法占比 1/2ⁿ</text>
</svg>
