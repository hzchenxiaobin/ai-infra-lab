<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums=[1,3,2,6,4,2], k=3, dist=3（need=2，窗口长 4）</text>

  <!-- header band -->
  <rect x="30" y="48" width="600" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">right</text>
  <text x="150" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">窗口下标</text>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">窗口元素</text>
  <text x="450" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">L（2 最小）</text>
  <text x="540" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">smallSum</text>
  <text x="600" y="66" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- row 1: right=2 -->
  <rect x="30" y="80" width="600" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="102" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="150" y="102" text-anchor="middle" font-size="12" fill="#333">[1, 2]</text>
  <text x="300" y="102" text-anchor="middle" font-size="12" fill="#333">3, 2</text>
  <text x="450" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2, 3}</text>
  <text x="540" y="102" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="600" y="102" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- row 2: right=3 -->
  <rect x="30" y="116" width="600" height="34" fill="#f4f8fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="138" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#333">[1, 3]</text>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#333">3, 2, 6</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2, 3}</text>
  <text x="540" y="138" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="600" y="138" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- row 3: right=4 -->
  <rect x="30" y="152" width="600" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="174" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="150" y="174" text-anchor="middle" font-size="12" fill="#333">[1, 4]</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#333">3, 2, 6, 4</text>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2, 3}</text>
  <text x="540" y="174" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="600" y="174" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- row 4: right=5 (highlight) -->
  <rect x="30" y="188" width="600" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="150" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[2, 5]</text>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2, 6, 4, 2</text>
  <text x="450" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2, 2}</text>
  <text x="540" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="600" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="618" y="206" font-size="11" fill="#b85450" font-weight="bold">←最优</text>

  <!-- final note -->
  <rect x="40" y="244" width="560" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">right=5 时窗口左端滑过 nums[1]=3，新窗口 [2,5] 内 2 最小为 {2,2}</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#666">smallSum 由 5 降到 4 → ans 更新为 4</text>
  <text x="320" y="310" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">代价 = nums[0] + ans = 1 + 4 = 5</text>
</svg>
