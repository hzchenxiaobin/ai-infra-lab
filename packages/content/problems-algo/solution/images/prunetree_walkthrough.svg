<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,null,0,null,null,0,1]</text>

  <!-- ====== 左侧：原树标注 ====== -->
  <text x="170" y="52" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原树（标注节点名）</text>

  <!-- A=1 -->
  <circle cx="170" cy="76" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="81" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="195" y="74" font-size="10" fill="#888">A</text>
  <!-- A 右 → B=0 -->
  <line x1="182" y1="89" x2="210" y2="114" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="220" cy="126" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="131" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="243" y="124" font-size="10" fill="#888">B</text>
  <!-- B 左 → C=0 -->
  <line x1="210" y1="139" x2="185" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="178" cy="179" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="178" y="183" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="198" y="177" font-size="10" fill="#888">C</text>
  <!-- B 右 → D=1 -->
  <line x1="230" y1="139" x2="258" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="265" cy="179" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="183" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="285" y="177" font-size="10" fill="#888">D</text>

  <!-- ====== 右侧：递归调用步骤表 ====== -->
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">后序递归步骤</text>

  <!-- 表头 -->
  <rect x="330" y="64" width="270" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="355" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <text x="405" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">访问</text>
  <text x="475" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">判定 / 操作</text>
  <text x="565" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">返回</text>

  <!-- 步骤行 -->
  <rect x="330" y="88" width="270" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="103" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="405" y="103" text-anchor="middle" font-size="10" fill="#333">C</text>
  <text x="475" y="103" text-anchor="middle" font-size="9" fill="#b85450">叶=0,无1</text>
  <text x="565" y="103" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">null ✗</text>

  <rect x="330" y="110" width="270" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="125" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="405" y="125" text-anchor="middle" font-size="10" fill="#333">D</text>
  <text x="475" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">叶=1,保留</text>
  <text x="565" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">D ✓</text>

  <rect x="330" y="132" width="270" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="147" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="405" y="147" text-anchor="middle" font-size="10" fill="#333">B</text>
  <text x="475" y="147" text-anchor="middle" font-size="9" fill="#333">=0,left=null,right=D</text>
  <text x="565" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">B ✓</text>

  <rect x="330" y="154" width="270" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="169" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="405" y="169" text-anchor="middle" font-size="10" fill="#333">A</text>
  <text x="475" y="169" text-anchor="middle" font-size="9" fill="#333">=1,保留</text>
  <text x="565" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A ✓</text>

  <!-- ====== 底部：结果树 ====== -->
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">剪枝结果：[1,null,0,null,null,1]</text>

  <!-- 结果树 -->
  <circle cx="270" cy="250" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="255" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="295" y="248" font-size="10" fill="#888">A</text>

  <line x1="282" y1="263" x2="310" y2="288" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="320" cy="300" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="305" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="343" y="298" font-size="10" fill="#888">B</text>

  <line x1="330" y1="313" x2="358" y2="340" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="365" cy="353" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="357" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="385" y="351" font-size="10" fill="#888">D</text>

  <!-- C 被删标注 -->
  <rect x="140" y="340" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="225" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">节点 C 被删除</text>
  <text x="225" y="373" text-anchor="middle" font-size="10" fill="#b85450">val=0 且子树全 null → 返回 null</text>

  <!-- 说明 -->
  <rect x="50" y="400" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">关键：后序——先处理子树，再判自身</text>
  <text x="310" y="436" text-anchor="middle" font-size="10" fill="#888">子树剪完后，若当前节点 val=0 且无孩子，说明自身也不含 1，删除</text>
</svg>
