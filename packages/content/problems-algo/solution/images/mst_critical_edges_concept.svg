<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">关键边 vs 伪关键边：以示例 1 为例</text>

  <!-- left: original graph -->
  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原图（n=5, 7 条边）</text>

  <!-- edges drawn before nodes -->
  <!-- edge 0: 0-1 w=1 (critical, red) -->
  <line x1="80" y1="100" x2="180" y2="100" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <!-- edge 1: 1-2 w=1 (critical, red) -->
  <line x1="180" y1="100" x2="180" y2="180" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="188" y="143" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <!-- edge 2: 2-3 w=2 (pseudo, orange) -->
  <line x1="180" y1="180" x2="80" y2="180" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="197" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <!-- edge 3: 0-3 w=2 (pseudo, orange) diagonal -->
  <line x1="80" y1="100" x2="180" y2="180" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="118" y="148" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <!-- edge 4: 0-4 w=3 (pseudo, orange) -->
  <line x1="80" y1="100" x2="80" y2="240" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="62" y="174" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <!-- edge 5: 3-4 w=3 (pseudo, orange) -->
  <line x1="180" y1="180" x2="80" y2="240" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="142" y="220" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <!-- edge 6: 1-4 w=6 (neither, grey dashed) -->
  <line x1="180" y1="100" x2="80" y2="240" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="148" y="178" font-size="10.5" fill="#aaa">6</text>

  <!-- nodes -->
  <circle cx="80" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <circle cx="180" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="180" cy="180" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <circle cx="80" cy="180" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <circle cx="80" cy="240" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>

  <!-- right: legend + classification -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">边分类</text>

  <!-- critical box -->
  <rect x="320" y="74" width="220" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="94" font-size="11.5" fill="#b85450" font-weight="bold">关键边 Critical</text>
  <text x="334" y="110" font-size="10.5" fill="#555">删去后 MST 权值增大</text>
  <text x="334" y="124" font-size="10.5" fill="#555">出现在所有 MST 中</text>
  <text x="520" y="106" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">边 0, 1</text>

  <!-- pseudo box -->
  <rect x="320" y="144" width="220" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="164" font-size="11.5" fill="#d6a040" font-weight="bold">伪关键边 Pseudo</text>
  <text x="334" y="180" font-size="10.5" fill="#555">删去后 MST 权值不变</text>
  <text x="334" y="194" font-size="10.5" fill="#555">出现在部分 MST 中</text>
  <text x="520" y="176" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold">边 2,3,4,5</text>

  <!-- neither box -->
  <rect x="320" y="214" width="220" height="58" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="334" y="234" font-size="11.5" fill="#888" font-weight="bold">两者都不是</text>
  <text x="334" y="250" font-size="10.5" fill="#555">不在任何 MST 中</text>
  <text x="334" y="264" font-size="10.5" fill="#555">强制纳入会增大权值</text>
  <text x="520" y="246" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">边 6</text>

  <!-- bottom annotation -->
  <rect x="40" y="296" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="318" font-size="11.5" fill="#446688" font-weight="bold">判定方法（对每条边做两次 Kruskal）</text>
  <text x="56" y="336" font-size="11" fill="#555">① 排除该边跑 MST → 权值变大 or 无法连通 ⇒ 关键边</text>
  <text x="56" y="352" font-size="11" fill="#555">② 强制纳入该边跑 MST → 权值不变且非关键 ⇒ 伪关键边</text>
</svg>
