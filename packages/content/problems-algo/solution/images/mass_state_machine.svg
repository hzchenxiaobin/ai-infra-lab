<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两状态机：「+ 位」与「− 位」的转移</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="80" cy="210" rx="38" ry="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="80" y="214" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">起点</text>

  <!-- ===== f state : + position ===== -->
  <rect x="220" y="120" width="170" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="305" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">「+ 位」状态 f</text>
  <text x="305" y="168" text-anchor="middle" font-size="12" fill="#333">f = max(g, 0) + x</text>
  <text x="305" y="188" text-anchor="middle" font-size="10" fill="#888">续接 g + x  或  开新段 0 + x</text>

  <!-- ===== g state : - position ===== -->
  <rect x="220" y="300" width="170" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="305" y="326" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">「− 位」状态 g</text>
  <text x="305" y="348" text-anchor="middle" font-size="12" fill="#333">g = f − x</text>
  <text x="305" y="368" text-anchor="middle" font-size="10" fill="#888">只能续接，不能开新段</text>

  <!-- ===== Start -> f (开新段, +x) ===== -->
  <path d="M 118 210 Q 170 210 170 175 Q 170 160 218 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">开新段</text>
  <text x="150" y="164" font-size="10" fill="#4a7a3a">0 + x = x</text>

  <!-- ===== f -> g : subtract x ===== -->
  <path d="M 305 202 L 305 298" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="318" y="240" font-size="11" fill="#b85450" font-weight="bold">− x</text>
  <text x="318" y="256" font-size="10" fill="#888">下一位取负</text>

  <!-- ===== g -> f : add x (extend) ===== -->
  <path d="M 255 300 L 255 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">+ x（续接）</text>
  <text x="150" y="256" font-size="10" fill="#888">g + x</text>

  <!-- ===== ans collector ===== -->
  <rect x="440" y="200" width="150" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="515" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">更新答案</text>
  <text x="515" y="244" text-anchor="middle" font-size="11" fill="#333">ans = max(ans, f, g)</text>

  <path d="M 390 160 Q 420 160 420 215" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 340 Q 420 340 420 245" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="404" width="540" height="44" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="310" y="424" text-anchor="middle" font-size="11" fill="#555">两状态在「+ 位」「− 位」间交替跃迁；只有「+ 位」可从「起点」进入。</text>
  <text x="310" y="440" text-anchor="middle" font-size="11" fill="#555">每步同步更新 f、g（依赖旧值），全局 ans 取所有 f、g 的最大值。</text>
</svg>
