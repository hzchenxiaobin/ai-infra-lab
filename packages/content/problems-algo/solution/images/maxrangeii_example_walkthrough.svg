<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：banned=[1,6,5], n=5, maxSum=6 → 2</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">排序去重后保留 ∈[1,5]：[1, 5]（6 &gt; n 丢弃），哨兵 n+1=6</text>

  <!-- ====== number line 1..5 ====== -->
  <text x="52" y="80" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold">[1, 5]</text>
  <!-- 1 banned -->
  <rect x="70" y="60" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="100" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">banned ✗</text>
  <!-- 2 take -->
  <rect x="134" y="60" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="164" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">取 ✓</text>
  <!-- 3 take -->
  <rect x="198" y="60" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <text x="228" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">取 ✓</text>
  <!-- 4 stop -->
  <rect x="262" y="60" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="83" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="292" y="110" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4 &gt; rem 停</text>
  <!-- 5 banned -->
  <rect x="326" y="60" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="83" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <text x="356" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">banned ✗</text>
  <!-- 6 dropped -->
  <rect x="390" y="60" width="60" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="420" y="83" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">6</text>
  <text x="420" y="110" text-anchor="middle" font-size="9.5" fill="#aaa" font-weight="bold">&gt;n 丢弃</text>

  <!-- gap bracket [2,4] -->
  <path d="M134,128 L134,136 L322,136 L322,128" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">空隙 [2, 4]：L=2, sz=3</text>

  <!-- ====== binary search table ====== -->
  <text x="80" y="182" font-size="12" fill="#446688" font-weight="bold">二分 cnt ∈ [0, 3]：sum = cnt·(2·2 + cnt − 1)/2，使 sum ≤ rem=6</text>

  <!-- header row -->
  <rect x="80" y="190" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt</text>
  <rect x="200" y="190" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sum（取到的和）</text>
  <rect x="340" y="190" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">≤ rem=6 ?</text>

  <!-- cnt=1 -->
  <rect x="80" y="218" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="235" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="218" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="235" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="340" y="218" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- cnt=2 -->
  <rect x="80" y="244" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="244" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="340" y="244" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="261" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓（最大可取）</text>

  <!-- cnt=3 -->
  <rect x="80" y="270" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="200" y="270" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="340" y="270" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 超预算</text>

  <!-- pick cnt=2 -->
  <line x1="200" y1="306" x2="200" y2="326" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="80" y="328" width="380" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取 cnt=2 → 选 {2, 3}，ans=2，rem=6−5=1</text>

  <!-- ====== final gap exhausted ====== -->
  <line x1="270" y1="358" x2="270" y2="376" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="80" y="378" width="380" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt=2 &lt; sz=3 ⇒ 预算耗尽；下一个 4 &gt; rem=1，终止</text>

  <!-- ====== result ====== -->
  <rect x="120" y="416" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 ans = 2 ✓</text>
</svg>
