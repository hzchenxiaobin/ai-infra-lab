<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：先 ORDER BY id，再算 cnt 圈岛，最后取岛内 MAX(drink)</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">输入原始顺序为 9,6,7,3,1,2 → 排成 id 升序后如下表</text>

  <!-- column x: id 30-80, drink(raw) 80-250, cnt 250-305, 岛 305-365, drink(filled) 365-545 -->
  <!-- header -->
  <rect x="30" y="60" width="515" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <line x1="80" y1="60" x2="80" y2="90" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="250" y1="60" x2="250" y2="90" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="305" y1="60" x2="305" y2="90" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="365" y1="60" x2="365" y2="90" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="80" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">id</text>
  <text x="165" y="80" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">drink（原始）</text>
  <text x="277" y="80" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="335" y="80" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">岛</text>
  <text x="455" y="80" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">drink（填充后）</text>

  <!-- Row 1: id=1 A (island1 blue) -->
  <rect x="30" y="90" width="515" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="90" x2="80" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="90" x2="250" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="90" x2="305" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="90" x2="365" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Orange Margarita</text>
  <text x="277" y="110" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="335" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">岛1</text>
  <text x="455" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Orange Margarita</text>

  <!-- Row 2: id=2 null -> A (island1) -->
  <rect x="30" y="120" width="515" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="120" x2="80" y2="150" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="120" x2="250" y2="150" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="120" x2="305" y2="150" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="120" x2="365" y2="150" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="140" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="277" y="140" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="335" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">岛1</text>
  <text x="455" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Orange Margarita</text>

  <!-- Row 3: id=3 B (island2 green) -->
  <rect x="30" y="150" width="515" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="150" x2="80" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="150" x2="250" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="150" x2="305" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="150" x2="365" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">St Germain Spritz</text>
  <text x="277" y="170" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛2</text>
  <text x="455" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">St Germain Spritz</text>

  <!-- Row 4: id=6 null -> B (island2) -->
  <rect x="30" y="180" width="515" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="180" x2="80" y2="210" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="180" x2="250" y2="210" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="180" x2="305" y2="210" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="180" x2="365" y2="210" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="165" y="200" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="277" y="200" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛2</text>
  <text x="455" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">St Germain Spritz</text>

  <!-- Row 5: id=7 null -> B (island2) -->
  <rect x="30" y="210" width="515" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="210" x2="80" y2="240" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="210" x2="250" y2="240" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="210" x2="305" y2="240" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="210" x2="365" y2="240" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="165" y="230" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="277" y="230" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛2</text>
  <text x="455" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">St Germain Spritz</text>

  <!-- Row 6: id=9 C (island3 orange) -->
  <rect x="30" y="240" width="515" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="80" y1="240" x2="80" y2="270" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="240" x2="250" y2="270" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="305" y1="240" x2="305" y2="270" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="240" x2="365" y2="270" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="165" y="260" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Rum and Coke</text>
  <text x="277" y="260" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="335" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">岛3</text>
  <text x="455" y="260" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Rum and Coke</text>

  <!-- note -->
  <rect x="30" y="284" width="515" height="64" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="45" y="304" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">读表要点：</text>
  <text x="45" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">• cnt 仅在非空行递增 → 同一 cnt 值即同一岛（岛1 cnt=1，岛2 cnt=2，岛3 cnt=3）</text>
  <text x="45" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">• id=2/6/7 原为 null（灰色删除线），填充后（红色加粗）= 其所在岛的非空锚值</text>
</svg>
