<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">网络空闲算法流程</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 求距离 → 公式推算每服务器最后回复 → 取 max +1</text>

  <!-- ===== Step 1: build graph ===== -->
  <rect x="60" y="58" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 建无向图邻接表</text>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="#555">edges → g[u].push(v), g[v].push(u)</text>

  <path d="M 200 104 L 200 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: BFS init ===== -->
  <rect x="60" y="128" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② BFS 初始化</text>
  <text x="200" y="164" text-anchor="middle" font-size="9" fill="#555">dist[0]=0，其余=-1；队列 q=[0]</text>

  <path d="M 200 174 L 200 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond: queue empty? ===== -->
  <polygon points="200,198 270,232 200,266 130,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">队列为空?</text>
  <text x="200" y="244" text-anchor="middle" font-size="9" fill="#888">是 → 进入 ④</text>

  <!-- yes arrow to right -->
  <path d="M 270 232 L 370 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="372" y="210" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 推算答案</text>
  <text x="452" y="246" text-anchor="middle" font-size="9" fill="#555">遍历服务器算公式</text>
  <text x="452" y="256" text-anchor="middle" font-size="9" fill="#555">取 max + 1</text>

  <!-- no arrow down -->
  <path d="M 200 266 L 200 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="280" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Step 3: pop & relax ===== -->
  <rect x="80" y="290" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="310" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 弹出 u，遍历邻居 v</text>
  <text x="200" y="326" text-anchor="middle" font-size="9" fill="#555">若 dist[v]==-1：dist[v]=dist[u]+1，v 入队</text>

  <!-- relax note -->
  <path d="M 320 312 L 370 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="294" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="312" text-anchor="middle" font-size="9" fill="#446688">边权全 1</text>
  <text x="452" y="326" text-anchor="middle" font-size="9" fill="#446688">无需堆，BFS 即最短路</text>

  <!-- loop back -->
  <path d="M 200 336 L 200 370" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="356" font-size="9" fill="#888">回到 ② 循环</text>

  <!-- separator -->
  <path d="M 40 390 L 500 390" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ===== Step 4 detail: formula ===== -->
  <text x="40" y="410" font-size="11" fill="#b85450" font-weight="bold">④ 推算每个数据服务器 i（1 ≤ i &lt; n）的最后回复：</text>

  <rect x="60" y="420" width="420" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="442" font-size="11" fill="#b85450" font-weight="bold">round = 2 × dist[i]</text>
  <text x="80" y="460" font-size="11" fill="#d6a040" font-weight="bold">lastResend = ⌊(round - 1) / patience[i]⌋ × patience[i]</text>
  <text x="80" y="478" font-size="11" fill="#b85450" font-weight="bold">lastReply = lastResend + round</text>
  <text x="80" y="494" font-size="11" fill="#4a7a3a" font-weight="bold">ans = max(lastReply) + 1</text>
</svg>
