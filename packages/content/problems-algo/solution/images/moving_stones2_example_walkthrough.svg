<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两条路径对比</text>

  <!-- ===== Example 1: [4,7,9] → [1,2] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="36" width="520" height="138" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="6"/>
    <text x="30" y="52" font-size="12" fill="#444" font-weight="bold">示例 1：stones = [4, 7, 9]，n = 3 → [1, 2]</text>
  </g>

  <!-- Ex1 Min label -->
  <text x="30" y="70" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小移动（1 步）：</text>

  <!-- Ex1 Min row: [4,7,9] →4→8→ [7,8,9] ✓ -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold">
    <!-- First set: 4(red,endpoint), 7(blue), 9(blue) -->
    <circle cx="100" cy="88" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="100" y="91" text-anchor="middle" fill="#b85450">4</text>
    <circle cx="132" cy="88" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="91" text-anchor="middle" fill="#446688">7</text>
    <circle cx="164" cy="88" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="91" text-anchor="middle" fill="#446688">9</text>

    <!-- Arrow -->
    <path d="M 180 88 L 220 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="200" y="80" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4→8</text>

    <!-- Second set: 7(blue), 8(green,new), 9(blue) -->
    <circle cx="236" cy="88" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="236" y="91" text-anchor="middle" fill="#446688">7</text>
    <circle cx="268" cy="88" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="268" y="91" text-anchor="middle" fill="#4a7a3a">8</text>
    <circle cx="300" cy="88" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="91" text-anchor="middle" fill="#446688">9</text>

    <!-- Checkmark -->
    <text x="325" y="92" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 连续</text>
  </g>

  <!-- Ex1 Max label -->
  <text x="30" y="118" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最大移动（2 步）：</text>

  <!-- Ex1 Max row 1: [4,7,9] →9→5→ [4,5,7] -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold">
    <circle cx="100" cy="135" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="138" text-anchor="middle" fill="#446688">4</text>
    <circle cx="132" cy="135" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="138" text-anchor="middle" fill="#446688">7</text>
    <circle cx="164" cy="135" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="164" y="138" text-anchor="middle" fill="#b85450">9</text>

    <path d="M 180 135 L 220 135" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="200" y="127" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">9→5</text>

    <circle cx="236" cy="135" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="236" y="138" text-anchor="middle" fill="#446688">4</text>
    <circle cx="268" cy="135" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="268" y="138" text-anchor="middle" fill="#4a7a3a">5</text>
    <circle cx="300" cy="135" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="138" text-anchor="middle" fill="#446688">7</text>

    <text x="325" y="139" font-size="9" fill="#888">①</text>
  </g>

  <!-- Ex1 Max row 2: [4,5,7] →4→6→ [5,6,7] ✓ -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold">
    <circle cx="100" cy="162" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="100" y="165" text-anchor="middle" fill="#b85450">4</text>
    <circle cx="132" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="165" text-anchor="middle" fill="#446688">5</text>
    <circle cx="164" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="165" text-anchor="middle" fill="#446688">7</text>

    <path d="M 180 162 L 220 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="200" y="154" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4→6</text>

    <circle cx="236" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="236" y="165" text-anchor="middle" fill="#446688">5</text>
    <circle cx="268" cy="162" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="268" y="165" text-anchor="middle" fill="#4a7a3a">6</text>
    <circle cx="300" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="165" text-anchor="middle" fill="#446688">7</text>

    <text x="325" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 连续</text>
  </g>

  <!-- ===== Example 2: [3,4,5,6,10] → [2,3] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="186" width="520" height="210" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="6"/>
    <text x="30" y="202" font-size="12" fill="#444" font-weight="bold">示例 2：stones = [3, 4, 5, 6, 10]，n = 5 → [2, 3]</text>
  </g>

  <!-- Ex2 Min label -->
  <text x="30" y="220" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小移动（2 步，触发特判）：</text>

  <!-- Ex2 Min row 1: [3,4,5,6,10] →3→8→ [4,5,6,8,10] -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold">
    <circle cx="60" cy="238" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="60" y="241" text-anchor="middle" fill="#b85450">3</text>
    <circle cx="88" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="241" text-anchor="middle" fill="#446688">4</text>
    <circle cx="116" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="241" text-anchor="middle" fill="#446688">5</text>
    <circle cx="144" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="144" y="241" text-anchor="middle" fill="#446688">6</text>
    <circle cx="172" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="241" text-anchor="middle" fill="#446688">10</text>

    <path d="M 188 238 L 228 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="230" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3→8</text>

    <circle cx="244" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="244" y="241" text-anchor="middle" fill="#446688">4</text>
    <circle cx="272" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="241" text-anchor="middle" fill="#446688">5</text>
    <circle cx="300" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="241" text-anchor="middle" fill="#446688">6</text>
    <circle cx="328" cy="238" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="328" y="241" text-anchor="middle" fill="#4a7a3a">8</text>
    <circle cx="356" cy="238" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="356" y="241" text-anchor="middle" fill="#446688">10</text>

    <text x="380" y="242" font-size="9" fill="#888">①</text>
  </g>

  <!-- Ex2 Min row 2: [4,5,6,8,10] →10→7→ [4,5,6,7,8] ✓ -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold">
    <circle cx="60" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="268" text-anchor="middle" fill="#446688">4</text>
    <circle cx="88" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="268" text-anchor="middle" fill="#446688">5</text>
    <circle cx="116" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="268" text-anchor="middle" fill="#446688">6</text>
    <circle cx="144" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="144" y="268" text-anchor="middle" fill="#446688">8</text>
    <circle cx="172" cy="265" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="172" y="268" text-anchor="middle" fill="#b85450">10</text>

    <path d="M 188 265 L 228 265" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="257" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">10→7</text>

    <circle cx="244" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="244" y="268" text-anchor="middle" fill="#446688">4</text>
    <circle cx="272" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="268" text-anchor="middle" fill="#446688">5</text>
    <circle cx="300" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="268" text-anchor="middle" fill="#446688">6</text>
    <circle cx="328" cy="265" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="328" y="268" text-anchor="middle" fill="#4a7a3a">7</text>
    <circle cx="356" cy="265" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="356" y="268" text-anchor="middle" fill="#446688">8</text>

    <text x="380" y="269" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 连续</text>
  </g>

  <!-- Ex2 Max label -->
  <text x="30" y="292" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最大移动（3 步，牺牲左端策略）：</text>

  <!-- Ex2 Max row 1: [3,4,5,6,10] →3→7→ [4,5,6,7,10] -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold">
    <circle cx="60" cy="310" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="60" y="313" text-anchor="middle" fill="#b85450">3</text>
    <circle cx="88" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="313" text-anchor="middle" fill="#446688">4</text>
    <circle cx="116" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="313" text-anchor="middle" fill="#446688">5</text>
    <circle cx="144" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="144" y="313" text-anchor="middle" fill="#446688">6</text>
    <circle cx="172" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="313" text-anchor="middle" fill="#446688">10</text>

    <path d="M 188 310 L 228 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="302" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3→7</text>

    <circle cx="244" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="244" y="313" text-anchor="middle" fill="#446688">4</text>
    <circle cx="272" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="313" text-anchor="middle" fill="#446688">5</text>
    <circle cx="300" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="313" text-anchor="middle" fill="#446688">6</text>
    <circle cx="328" cy="310" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="328" y="313" text-anchor="middle" fill="#4a7a3a">7</text>
    <circle cx="356" cy="310" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="356" y="313" text-anchor="middle" fill="#446688">10</text>

    <text x="380" y="314" font-size="9" fill="#888">①</text>
  </g>

  <!-- Ex2 Max row 2: [4,5,6,7,10] →4→8→ [5,6,7,8,10] -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold">
    <circle cx="60" cy="337" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="60" y="340" text-anchor="middle" fill="#b85450">4</text>
    <circle cx="88" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="340" text-anchor="middle" fill="#446688">5</text>
    <circle cx="116" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="340" text-anchor="middle" fill="#446688">6</text>
    <circle cx="144" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="144" y="340" text-anchor="middle" fill="#446688">7</text>
    <circle cx="172" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="340" text-anchor="middle" fill="#446688">10</text>

    <path d="M 188 337 L 228 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="329" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4→8</text>

    <circle cx="244" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="244" y="340" text-anchor="middle" fill="#446688">5</text>
    <circle cx="272" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="340" text-anchor="middle" fill="#446688">6</text>
    <circle cx="300" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="340" text-anchor="middle" fill="#446688">7</text>
    <circle cx="328" cy="337" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="328" y="340" text-anchor="middle" fill="#4a7a3a">8</text>
    <circle cx="356" cy="337" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="356" y="340" text-anchor="middle" fill="#446688">10</text>

    <text x="380" y="341" font-size="9" fill="#888">②</text>
  </g>

  <!-- Ex2 Max row 3: [5,6,7,8,10] →5→9→ [6,7,8,9,10] ✓ -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold">
    <circle cx="60" cy="364" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="60" y="367" text-anchor="middle" fill="#b85450">5</text>
    <circle cx="88" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="367" text-anchor="middle" fill="#446688">6</text>
    <circle cx="116" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="367" text-anchor="middle" fill="#446688">7</text>
    <circle cx="144" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="144" y="367" text-anchor="middle" fill="#446688">8</text>
    <circle cx="172" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="172" y="367" text-anchor="middle" fill="#446688">10</text>

    <path d="M 188 364 L 228 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="356" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5→9</text>

    <circle cx="244" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="244" y="367" text-anchor="middle" fill="#446688">6</text>
    <circle cx="272" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="367" text-anchor="middle" fill="#446688">7</text>
    <circle cx="300" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="367" text-anchor="middle" fill="#446688">8</text>
    <circle cx="328" cy="364" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="328" y="367" text-anchor="middle" fill="#4a7a3a">9</text>
    <circle cx="356" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="356" y="367" text-anchor="middle" fill="#446688">10</text>

    <text x="380" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 连续</text>
  </g>

  <!-- Bottom note -->
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红圈 = 被移动的端点石子 | 绿圈 = 石子落入的新位置 | ✓ = 已连续，游戏结束</text>
</svg>
