<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2698a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：把 i² 的数字串切成连续片段，片段值之和等于 i</text>

  <!-- ===== Example A: 9² = 81 → [8][1] = 9 ===== -->
  <text x="56" y="86" font-size="13" fill="#446688" font-weight="bold">9² = 81</text>
  <rect x="140" y="60" width="44" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="87" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <line x1="192" y1="64" x2="192" y2="96" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="200" y="60" width="44" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="87" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>
  <path d="M256,80 L290,80" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2698a)" filter="url(#rough2)"/>
  <text x="300" y="84" font-size="13" fill="#333" font-weight="bold">8 + 1 = 9 = i  ✓</text>

  <!-- ===== Example B: 36² = 1296 → [1][29][6] = 36 ===== -->
  <text x="56" y="166" font-size="13" fill="#446688" font-weight="bold">36² = 1296</text>
  <rect x="140" y="140" width="44" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="167" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <line x1="192" y1="144" x2="192" y2="176" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="196" y="136" width="96" height="48" rx="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="200" y="140" width="44" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="167" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>
  <rect x="244" y="140" width="44" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="167" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">9</text>
  <line x1="298" y1="144" x2="298" y2="176" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="306" y="140" width="44" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="167" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">6</text>
  <path d="M362,160 L396,160" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2698a)" filter="url(#rough2)"/>
  <text x="406" y="164" font-size="12" fill="#333" font-weight="bold">1 + 29 + 6 = 36 = i  ✓</text>
  <text x="244" y="198" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ "29" = 相邻两位合并成一段</text>

  <!-- ===== Rule box ===== -->
  <rect x="40" y="220" width="480" height="124" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">规则：i² 的十进制串 = 若干连续子串的拼接</text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#446688">这些子串对应的整数值之和 = i</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">惩罚数 = 所有满足条件的 i 的平方和</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#888">关键：在数字串每个间隙选择「切」或「不切」，本质是回溯分割</text>
</svg>
