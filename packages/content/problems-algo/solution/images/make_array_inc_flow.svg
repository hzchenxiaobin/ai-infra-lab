<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">使数组严格递增 — 算法流程</text>
  <path d="M 220 44 Q 390 52 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="66" width="280" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="390" y="92" text-anchor="middle" font-size="12" fill="#2b2b2b">① 排序去重 arr2</text>

  <path d="M 390 106 L 390 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="120" width="280" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="390" y="146" text-anchor="middle" font-size="12" fill="#2b2b2b">② 初始化 dp = {-∞: 0}</text>

  <path d="M 390 160 L 390 174" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="210" y="174" width="360" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#2b2b2b">③ 遍历 arr1 每个元素 x</text>

  <path d="M 390 214 L 390 228" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 390 228 L 480 266 L 390 304 L 300 266 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="390" y="264" text-anchor="middle" font-size="11" fill="#2b2b2b">对 dp 中每个</text>
  <text x="390" y="278" text-anchor="middle" font-size="11" fill="#2b2b2b">(prev_val, ops)</text>

  <path d="M 300 266 L 170 266 L 170 310" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="178" y="260" font-size="10" fill="#4a8e4a" font-weight="bold">保留</text>

  <g filter="url(#sk)">
    <rect x="60" y="310" width="220" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="170" y="332" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">prev_val &lt; x ?</text>
  <text x="170" y="350" text-anchor="middle" font-size="10" fill="#444">new_dp[x] = min(.., ops)</text>

  <path d="M 480 266 L 610 266 L 610 310" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="530" y="260" font-size="10" fill="#b85450" font-weight="bold">替换</text>

  <g filter="url(#sk)">
    <rect x="500" y="310" width="220" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="610" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j = upper_bound(arr2, prev_val)</text>
  <text x="610" y="350" text-anchor="middle" font-size="10" fill="#444">new_dp[arr2[j]] = min(.., ops+1)</text>

  <path d="M 170 366 L 170 380 L 390 380" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 610 366 L 610 380 L 390 380" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 390 380 L 390 396" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="180" y="396" width="420" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="390" y="418" text-anchor="middle" font-size="11" fill="#2b2b2b">④ dp = new_dp（同 val 取 min ops 合并）</text>
  <text x="390" y="434" text-anchor="middle" font-size="10" fill="#b85450">dp 为空 → return -1</text>

  <path d="M 600 419 Q 720 419 720 194 L 570 194" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4,3"/>
  <text x="735" y="310" font-size="10" fill="#888" transform="rotate(90, 735, 310)">下一个 x</text>

  <path d="M 390 442 L 390 456" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="456" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="390" y="484" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ return min(dp.values())</text>
</svg>
