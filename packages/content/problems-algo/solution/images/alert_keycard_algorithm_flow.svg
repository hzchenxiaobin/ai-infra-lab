<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希分组 → 排序 → 定长滑窗 → 收集排序</text>

  <!-- Step 1: group -->
  <rect x="160" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333">用哈希表按 name 收集时间，转分钟</text>
  <path d="M 260 86 L 260 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort per person -->
  <rect x="160" y="106" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333">对每个人的 times 排序</text>
  <path d="M 260 148 L 260 166" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init loop -->
  <rect x="170" y="168" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#333">遍历每个人，令 i = 0</text>
  <path d="M 260 206 L 260 222" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i+2 < n ? -->
  <polygon points="260,224 360,262 260,300 160,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333">i + 2 &lt; n ?</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333">(还有第 3 个)</text>

  <!-- No branch: next person -->
  <path d="M 360 262 L 410 262" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="412" y="246" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="10" fill="#333">该人正常，下一位</text>

  <!-- Yes branch -->
  <path d="M 260 300 L 260 318" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision 2: diff <= 60 ? -->
  <polygon points="260,320 380,358 260,396 140,358" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#333">times[i+2] − times[i]</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333">≤ 60 ?</text>

  <!-- Yes: warn -->
  <path d="M 140 358 L 90 358" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="342" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="364" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠ 警告</text>
  <path d="M 54 378 L 54 398 L 200 398" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: i++ -->
  <path d="M 380 358 L 430 358 L 430 188 L 350 188" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="452" y="276" text-anchor="middle" font-size="10" fill="#888">i++ 继续滑窗</text>

  <!-- Step final: collect & sort -->
  <rect x="200" y="400" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#333">收集警告名单 → 字典序排序 → 返回</text>
  <path d="M 300 380 L 300 398" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="458" text-anchor="middle" font-size="10" fill="#888">每人命中即 break，避免重复计入；最后统一排序保证字典序输出</text>
</svg>
