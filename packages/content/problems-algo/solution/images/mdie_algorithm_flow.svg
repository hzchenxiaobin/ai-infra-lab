<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历 + 维护前缀最小值</text>

  <!-- Step 1: init -->
  <rect x="60" y="56" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="180" y="96" text-anchor="middle" font-size="11" fill="#666">min_so_far = nums[0]，ans = −1</text>

  <path d="M 180 110 L 180 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="40" y="134" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j = 1 .. n−1：</text>
  <text x="180" y="172" text-anchor="middle" font-size="10" fill="#666">从第二个元素开始遍历</text>

  <path d="M 180 182 L 180 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: branch -->
  <rect x="30" y="206" width="300" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判断 nums[j] &gt; min_so_far ?</text>
  <text x="180" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是：ans = max(ans, nums[j] − min_so_far)</text>
  <text x="180" y="262" text-anchor="middle" font-size="10" fill="#888">否：跳过（无法构成递增对）</text>

  <path d="M 180 272 L 180 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update min -->
  <rect x="60" y="296" width="240" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">更新前缀最小</text>
  <text x="180" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min_so_far = min(min_so_far, nums[j])</text>

  <!-- loop back arrow -->
  <path d="M 60 321 Q 30 321 30 156 Q 30 156 40 156" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="232" font-size="10" fill="#888" transform="rotate(-90 20 232)">继续下一个</text>

  <!-- Step 5: return -->
  <path d="M 180 348 L 180 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="372" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="394" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束</text>
  <text x="180" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans（无递增对则仍为 −1）</text>

  <!-- side notes -->
  <rect x="360" y="206" width="220" height="186" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">为什么 ans 初值取 −1？</text>
  <text x="370" y="252" font-size="10" fill="#555">题目要求：若无满足</text>
  <text x="370" y="266" font-size="10" fill="#555">i&lt;j 且 nums[i]&lt;nums[j]</text>
  <text x="370" y="280" font-size="10" fill="#555">的对，返回 −1。</text>
  <text x="370" y="302" font-size="10" fill="#555">差值 ≥ 0 恒成立，用 −1</text>
  <text x="370" y="316" font-size="10" fill="#555">作「未找到」哨兵值，</text>
  <text x="370" y="330" font-size="10" fill="#555">无需额外布尔标志位。</text>
  <text x="370" y="352" font-size="10" fill="#4a7a3a" font-weight="bold">min_so_far 初始为</text>
  <text x="370" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">nums[0]，循环从 j=1 起。</text>
  <text x="370" y="380" font-size="10" fill="#4a7a3a" font-weight="bold">保证 i&lt;j 严格成立。</text>
</svg>
