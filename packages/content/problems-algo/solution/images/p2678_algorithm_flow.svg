<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 → 取两位字符 → 字符比较 → 累加</text>

  <!-- ① ans = 0 -->
  <rect x="210" y="42" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① ans = 0</text>

  <!-- arrow ① → ② -->
  <path d="M 280 74 L 280 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② diamond: 还有下一条记录? center (280,116) -->
  <polygon points="280,92 372,116 280,140 188,116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 还有下一条记录?</text>
  <text x="280" y="127" text-anchor="middle" font-size="9" fill="#4a7a3a">遍历 details</text>

  <!-- ⑥ 返回 ans (to the right of ②, on "否") -->
  <rect x="420" y="100" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="121" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥ 返回 ans</text>
  <!-- arrow ② → ⑥ (right, 否) -->
  <path d="M 372 116 L 420 116" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="396" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- arrow ② → ③ (down, 是) -->
  <path d="M 280 140 L 280 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ③ 取 s[11]、s[12] -->
  <rect x="160" y="162" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 读 s[11]、s[12]（年龄两位，不切子串）</text>

  <!-- arrow ③ → ④ -->
  <path d="M 280 194 L 280 216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ diamond: age > 60 ? center (280,252) -->
  <polygon points="280,216 392,252 280,288 168,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ age &gt; 60 ?</text>
  <text x="280" y="262" text-anchor="middle" font-size="9" fill="#a07a30">s[11]&gt;'6' 或</text>
  <text x="280" y="275" text-anchor="middle" font-size="9" fill="#a07a30">(s[11]=='6' 且 s[12]&gt;'0')</text>

  <!-- arrow ④ → ⑤ (down, 是) -->
  <path d="M 280 288 L 280 318" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="308" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ⑤ ans += 1 -->
  <rect x="200" y="318" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ ans += 1</text>

  <!-- Loop back: ⑤ → up the left trunk → ② (left side) -->
  <!-- ⑤ left out to x=110, up to y=116, right into ② left (188,116) -->
  <path d="M 200 334 L 110 334 L 110 116 L 188 116" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="118" y="328" font-size="9" fill="#4a7a3a">继续</text>

  <!-- ④ No loop back: ④ left (168,252) → left to x=110 → up to join trunk at (110,252) -->
  <path d="M 168 252 L 110 252" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="150" y="246" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Side note box -->
  <rect x="40" y="368" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每条记录：两次字符读 + 两次字符比较，零内存分配</text>
  <text x="280" y="401" text-anchor="middle" font-size="10" fill="#888">"定长 + 数字字符"约束让解析降到 O(1)，无需 substr / stoi</text>
</svg>
