<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 前缀和 + 双指针滑窗</text>

  <!-- step 1 sort -->
  <rect x="60" y="48" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="71" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 按 li 升序排序 tiles</text>

  <path d="M 160 84 L 160 104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2 prefix -->
  <rect x="60" y="108" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="131" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 前缀和 pref[i+1]=pref[i]+len_i</text>

  <path d="M 160 144 L 160 164" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3 loop -->
  <rect x="40" y="168" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 遍历左端 l = 0 .. n−1</text>
  <text x="160" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">end = tiles[l].l + carpetLen − 1</text>

  <path d="M 160 212 L 160 232" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 4 advance r -->
  <rect x="40" y="236" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="255" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 右移 r：while r+1&lt;n 且 tiles[r+1].l ≤ end</text>
  <text x="180" y="271" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">r 单调不减（end 随 l 递增）；r = max(r, l) 保 r ≥ l</text>

  <path d="M 180 280 L 180 300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 5 cover -->
  <rect x="40" y="304" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="323" text-anchor="middle" font-size="10.8" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ cover = pref[r]−pref[l] + min(tiles[r].r, end)−tiles[r].l+1</text>
  <text x="210" y="339" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">整块和（l..r−1） + 截断块（右端落在 tile r 内）</text>

  <!-- side: answer track -->
  <rect x="400" y="236" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(ans, cover)</text>
  <text x="470" y="271" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每步更新最大覆盖</text>

  <path d="M 380 326 L 400 258" stroke="#666" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <path d="M 210 348 L 210 368" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="372" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="394" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="470" y="394" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序 O(n log n)，扫描 O(n)</text>
</svg>
