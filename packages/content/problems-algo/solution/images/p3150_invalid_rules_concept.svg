<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：三条无效规则，任一命中即无效（OR）</text>
  <text x="260" y="41" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 tweet 7 为例：4 个 @、4 个 #，双双超过 3 → 无效</text>

  <!-- tweet 7 content panel -->
  <rect x="30" y="50" width="460" height="110" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="66" font-size="10" fill="#888" filter="url(#rough2)">tweet 7 的 content（名字缩写示意）：So grateful for today's experiences …</text>

  <!-- @ token row -->
  <rect x="42" y="72" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">@Anna</text>

  <rect x="146" y="72" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">@Lisa</text>

  <rect x="250" y="72" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">@Chris</text>

  <rect x="354" y="72" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="402" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">@Mike</text>

  <!-- # token row -->
  <rect x="42" y="100" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="115" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">#Fashion</text>

  <rect x="146" y="100" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="115" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">#HappyDay</text>

  <rect x="250" y="100" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="115" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">#WorkLife</text>

  <rect x="354" y="100" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="402" y="115" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">#Nature</text>

  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">len = 122    '@' × 4    '#' × 4</text>

  <path d="M 260 160 L 260 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- three rule boxes -->
  <rect x="16" y="170" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="91" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">规则① 字符数</text>
  <text x="91" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">122 &gt; 140 ?</text>
  <text x="91" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否 → 未命中 ✓</text>

  <text x="176" y="206" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">OR</text>

  <rect x="186" y="170" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="261" y="190" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">规则② '@' 次数</text>
  <text x="261" y="207" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 &gt; 3 ?</text>
  <text x="261" y="225" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是 → 命中 ✗</text>

  <text x="346" y="206" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">OR</text>

  <rect x="356" y="170" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="431" y="190" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">规则③ '#' 次数</text>
  <text x="431" y="207" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 &gt; 3 ?</text>
  <text x="431" y="225" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是 → 命中 ✗</text>

  <path d="M 260 232 L 260 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- verdict -->
  <rect x="90" y="246" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">任一命中 ⇒ 无效推文 → 输出 tweet_id = 7</text>

  <!-- counting trick -->
  <rect x="30" y="292" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">SQL 没有 COUNT_CHAR：用 REPLACE 差值数字符</text>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt@ = CHAR_LENGTH(content) − CHAR_LENGTH(REPLACE(content, '@', ''))</text>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">= 122 − 118 = 4 个 '@'</text>
</svg>
