<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：JOIN 配对 → 日期差过滤 → DISTINCT → ORDER BY</text>

  <!-- ===== Step 1: FROM/JOIN ===== -->
  <rect x="20" y="70" width="160" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① FROM + JOIN</text>
  <text x="100" y="108" text-anchor="middle" font-size="8" fill="#446688">Purchases p1</text>
  <text x="100" y="120" text-anchor="middle" font-size="8" fill="#446688">JOIN Purchases p2</text>
  <line x1="40" y1="128" x2="160" y2="128" stroke="#bcd" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="8" fill="#446688">ON user_id 相同</text>
  <text x="100" y="155" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">AND pid1 &lt; pid2</text>
  <text x="100" y="168" text-anchor="middle" font-size="7" fill="#888">生成同用户购买对</text>

  <path d="M 182 125 L 226 125" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: decision diamond (date diff) ===== -->
  <polygon points="300,70 374,125 300,180 226,125" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">② |Δdate|</text>
  <text x="300" y="132" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">≤ 7 ?</text>

  <!-- No branch (down) -->
  <path d="M 300 180 L 300 226" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="200" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="250" y="230" width="100" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="9" fill="#999">丢弃该对</text>

  <!-- Yes branch (right) -->
  <path d="M 374 125 L 418 125" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="118" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Step 3: SELECT DISTINCT ===== -->
  <rect x="422" y="86" width="100" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="106" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ SELECT</text>
  <text x="472" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">DISTINCT</text>
  <text x="472" y="138" text-anchor="middle" font-size="8" fill="#666">p1.user_id</text>
  <text x="472" y="152" text-anchor="middle" font-size="7" fill="#888">同用户多对只留一次</text>

  <path d="M 472 164 L 472 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: ORDER BY / output ===== -->
  <rect x="422" y="200" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">④ ORDER BY</text>
  <text x="472" y="234" text-anchor="middle" font-size="8" fill="#4a7a3a">user_id ASC</text>
  <text x="472" y="250" text-anchor="middle" font-size="8" fill="#4a7a3a">→ 输出</text>
  <text x="472" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2, 7</text>

  <!-- ===== Bottom: execution order ===== -->
  <rect x="20" y="288" width="580" height="58" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">SQL 子句执行顺序</text>
  <text x="310" y="324" text-anchor="middle" font-size="9" fill="#666">FROM / JOIN（生成配对，ON 含「同用户 + 主键不等」）→ WHERE（日期差 ≤7）</text>
  <text x="310" y="338" text-anchor="middle" font-size="9" fill="#666">→ SELECT DISTINCT（去重）→ ORDER BY（排序）</text>
</svg>
