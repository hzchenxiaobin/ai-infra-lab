<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：剪枝先行，再做状态 BFS</text>

  <!-- ===== Left: Example 1 ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1 → true</text>

  <!-- grid 4x3, cs=36 -->
  <g font-size="14" font-weight="bold">
    <!-- Row0 ( ( (  -->
    <rect x="40" y="70" width="36" height="36" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="58" y="94" text-anchor="middle" fill="#333">(</text>
    <rect x="76" y="70" width="36" height="36" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="94" y="94" text-anchor="middle" fill="#333">(</text>
    <rect x="112" y="70" width="36" height="36" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="94" text-anchor="middle" fill="#333">(</text>
    <!-- Row1 ) ( ) -->
    <rect x="40" y="106" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="58" y="130" text-anchor="middle" fill="#333">)</text>
    <rect x="76" y="106" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="94" y="130" text-anchor="middle" fill="#333">(</text>
    <rect x="112" y="106" width="36" height="36" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="130" text-anchor="middle" fill="#333">)</text>
    <!-- Row2 ( ( ) -->
    <rect x="40" y="142" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="58" y="166" text-anchor="middle" fill="#333">(</text>
    <rect x="76" y="142" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="94" y="166" text-anchor="middle" fill="#333">(</text>
    <rect x="112" y="142" width="36" height="36" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="166" text-anchor="middle" fill="#333">)</text>
    <!-- Row3 ( ( ) -->
    <rect x="40" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="58" y="202" text-anchor="middle" fill="#333">(</text>
    <rect x="76" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="94" y="202" text-anchor="middle" fill="#333">(</text>
    <rect x="112" y="178" width="36" height="36" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="202" text-anchor="middle" fill="#333">)</text>
  </g>

  <!-- path polyline R,R,D,D,D -->
  <path d="M 58 88 H 130 V 196" fill="none" stroke="#b85450" stroke-width="1.8"
        stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- balance strip -->
  <text x="40" y="240" font-size="10" fill="#666" font-weight="bold">路径串 + balance</text>
  <g font-size="13" font-weight="bold">
    <rect x="40" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="57" y="266" text-anchor="middle" fill="#333">(</text>
    <rect x="78" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="95" y="266" text-anchor="middle" fill="#333">(</text>
    <rect x="116" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="133" y="266" text-anchor="middle" fill="#333">(</text>
    <rect x="154" y="246" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="171" y="266" text-anchor="middle" fill="#333">)</text>
    <rect x="192" y="246" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="209" y="266" text-anchor="middle" fill="#333">)</text>
    <rect x="230" y="246" width="34" height="30" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="247" y="266" text-anchor="middle" fill="#333">)</text>
  </g>
  <g font-size="10" font-weight="bold">
    <text x="57" y="290" text-anchor="middle" fill="#d6a040">1</text>
    <text x="95" y="290" text-anchor="middle" fill="#d6a040">2</text>
    <text x="133" y="290" text-anchor="middle" fill="#d6a040">3</text>
    <text x="171" y="290" text-anchor="middle" fill="#d6a040">2</text>
    <text x="209" y="290" text-anchor="middle" fill="#d6a040">1</text>
    <text x="247" y="290" text-anchor="middle" fill="#b85450">0</text>
  </g>

  <!-- example1 verdict -->
  <rect x="30" y="306" width="244" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="152" y="327" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全程 ≥ 0，终点 = 0 → 合法 → return true</text>

  <!-- ===== Right: Example 2 ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2 → false</text>

  <!-- grid 2x2, cs=48 -->
  <g font-size="16" font-weight="bold">
    <rect x="350" y="80" width="48" height="48" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
    <text x="374" y="112" text-anchor="middle" fill="#333">)</text>
    <rect x="398" y="80" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="422" y="112" text-anchor="middle" fill="#333">)</text>
    <rect x="350" y="128" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="374" y="160" text-anchor="middle" fill="#333">(</text>
    <rect x="398" y="128" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="422" y="160" text-anchor="middle" fill="#333">(</text>
  </g>

  <!-- big X on illegal start cell -->
  <path d="M 356 88 L 392 120 M 392 88 L 356 120" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="374" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">首格 = ')'</text>

  <!-- two candidate strings -->
  <rect x="320" y="190" width="222" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="331" y="208" font-size="10" fill="#444" font-weight="bold">两条路径都非法：</text>
  <text x="331" y="223" font-size="10" fill="#666">→ → ↓：串 “))”（bal 先到 -1）</text>
  <text x="331" y="238" font-size="10" fill="#666">↓ → →：串 “)((”（终点 bal ≠ 0）</text>

  <!-- example2 verdict -->
  <rect x="320" y="258" width="222" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="431" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">首格即 ')' → 剪枝直接 false</text>

  <!-- divider -->
  <line x1="295" y1="50" x2="295" y2="300" stroke="#ddd" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- footer -->
  <rect x="30" y="356" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">先做 O(1) 必要性剪枝，再 BFS：状态 (i,j,balance) 去重 + 上界剪枝，最坏 O(mn(m+n))</text>
</svg>
