<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s1="My name is Haley"，s2="My Haley"</text>

  <!-- sentence1 label -->
  <text x="36" y="60" font-size="11" fill="#888" filter="url(#rough2)">w1 (n1=4)</text>

  <!-- s1 word boxes with indices -->
  <g font-size="13" text-anchor="middle">
    <rect x="96" y="50" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="126" y="72" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">My</text>
    <rect x="164" y="50" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="196" y="72" fill="#d6a040" font-weight="bold" filter="url(#rough2)">name</text>
    <rect x="236" y="50" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="260" y="72" fill="#d6a040" font-weight="bold" filter="url(#rough2)">is</text>
    <rect x="292" y="50" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="72" fill="#446688" font-weight="bold" filter="url(#rough2)">Haley</text>
  </g>
  <!-- s1 indices -->
  <g font-size="9" text-anchor="middle" fill="#aaa">
    <text x="126" y="96" filter="url(#rough2)">[0]</text>
    <text x="196" y="96" filter="url(#rough2)">[1]</text>
    <text x="260" y="96" filter="url(#rough2)">[2]</text>
    <text x="328" y="96" filter="url(#rough2)">[3]</text>
  </g>

  <!-- sentence2 label -->
  <text x="36" y="128" font-size="11" fill="#888" filter="url(#rough2)">w2 (n2=2)</text>

  <!-- s2 word boxes aligned under matched s1 words -->
  <g font-size="13" text-anchor="middle">
    <rect x="96" y="118" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="126" y="140" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">My</text>
    <rect x="292" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="140" fill="#446688" font-weight="bold" filter="url(#rough2)">Haley</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#aaa">
    <text x="126" y="164" filter="url(#rough2)">[0]</text>
    <text x="328" y="164" filter="url(#rough2)">[1]</text>
  </g>

  <!-- matching connectors -->
  <path d="M 126 154 L 126 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 328 154 L 328 92" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- divider -->
  <path d="M 20 184 L 540 184" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- step table header -->
  <text x="40" y="202" font-size="10" fill="#888" filter="url(#rough2)">步骤</text>
  <text x="120" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">比较</text>
  <text x="260" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">结果</text>
  <text x="420" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">指针值</text>

  <!-- Step 1: prefix l=0 -->
  <text x="40" y="228" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 前缀</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1[0] vs w2[0]</text>
  <text x="200" y="228" font-size="9" fill="#888" filter="url(#rough2)">My vs My</text>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">相等 ✓</text>
  <text x="420" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l = 1</text>

  <!-- Step 2: prefix l=1 stop -->
  <text x="40" y="254" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 前缀</text>
  <text x="120" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1[1] vs w2[1]</text>
  <text x="196" y="254" font-size="9" fill="#888" filter="url(#rough2)">name vs Haley</text>
  <text x="260" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">不等 ✗ 停</text>
  <text x="420" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l = 1</text>

  <!-- Step 3: suffix r=0 -->
  <text x="40" y="280" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 后缀</text>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1[3] vs w2[1]</text>
  <text x="196" y="280" font-size="9" fill="#888" filter="url(#rough2)">Haley vs Haley</text>
  <text x="260" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">相等 ✓</text>
  <text x="420" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">r = 1</text>

  <!-- Step 4: suffix r=1 stop -->
  <text x="40" y="306" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 后缀</text>
  <text x="120" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1[2] vs w2[0]</text>
  <text x="200" y="306" font-size="9" fill="#888" filter="url(#rough2)">is vs My</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">不等 ✗ 停</text>
  <text x="420" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">r = 1</text>

  <!-- divider -->
  <path d="M 20 326 L 540 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="342" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l + r = 1 + 1 = 2，n2 = 2</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ≥ 2 → 返回 true</text>

  <!-- footer -->
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿=前缀匹配区；蓝=后缀匹配区；橙=待插入段（name is）</text>
  <text x="280" y="434" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">短句两词均被前缀/后缀吃下 → 可在中间插入 "name is"</text>
  <text x="280" y="452" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">对照示例3 "Eating right now"/"Eating"：l=1,r=0 → 1≥1 同样为 true</text>
</svg>
