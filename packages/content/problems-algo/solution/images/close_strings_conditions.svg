<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">「接近」的三大充要条件</text>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">word1 与 word2 接近 ⟺ 以下三条同时成立</text>

  <!-- 条件 1 -->
  <rect x="30" y="74" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="102" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="107" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">1</text>
  <text x="86" y="98" font-size="13" fill="#333" filter="url(#rough2)">长度相同</text>
  <text x="86" y="118" font-size="11" fill="#666" filter="url(#rough2)">两种操作都不改变字符总数 → 长度必相等</text>
  <text x="520" y="107" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">len1 == len2</text>

  <!-- 条件 2 -->
  <rect x="30" y="138" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="166" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="58" y="171" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">2</text>
  <text x="86" y="162" font-size="13" fill="#333" filter="url(#rough2)">字符集合相同</text>
  <text x="86" y="182" font-size="11" fill="#666" filter="url(#rough2)">操作2 只在「已有字符」间换 → 不能凭空造出/消灭某字符</text>
  <text x="520" y="171" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">set1 == set2</text>

  <!-- 条件 3 -->
  <rect x="30" y="202" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="230" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="58" y="235" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">3</text>
  <text x="86" y="226" font-size="13" fill="#333" filter="url(#rough2)">频次多重集相同</text>
  <text x="86" y="246" font-size="11" fill="#666" filter="url(#rough2)">操作2 可任意置换频次 → 排序后的频次序列必相等</text>
  <text x="520" y="235" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sorted(freq1)==sorted(freq2)</text>

  <!-- 反例区 -->
  <text x="30" y="288" font-size="13" fill="#b85450" filter="url(#rough2)">⚠️ 两条都满足还不够：常见反例</text>

  <rect x="30" y="298" width="255" height="80" fill="#fafafa" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="11" fill="#333" filter="url(#rough2)">uau  vs  ssx</text>
  <text x="40" y="336" font-size="10" fill="#666" filter="url(#rough2)">长度 3==3 ✓</text>
  <text x="40" y="352" font-size="10" fill="#666" filter="url(#rough2)">频次 [1,2]==[1,2] ✓</text>
  <text x="40" y="370" font-size="10" fill="#b85450" filter="url(#rough2)">集合 {a,u}≠{s,x} ✗ → false</text>

  <rect x="300" y="298" width="230" height="80" fill="#fafafa" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="310" y="318" font-size="11" fill="#333" filter="url(#rough2)">a  vs  aa</text>
  <text x="310" y="336" font-size="10" fill="#666" filter="url(#rough2)">集合 {a}=={a} ✓</text>
  <text x="310" y="352" font-size="10" fill="#666" filter="url(#rough2)">（长度 1≠2 已挂）</text>
  <text x="310" y="370" font-size="10" fill="#b85450" filter="url(#rough2)">频次 [1]≠[2] ✗ → false</text>
</svg>
