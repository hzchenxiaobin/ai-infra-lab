<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：把 u→v 路径上的边都操作一遍 = 只翻转两个端点</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">中间节点各被翻转 2 次，异或自反，状态复原</text>

  <!-- tree edges: path edges orange, others gray dashed -->
  <line x1="70" y1="140" x2="160" y2="215" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="160" y1="215" x2="250" y2="290" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="160" y1="215" x2="75" y2="295" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="160" y1="215" x2="255" y2="145" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- operation labels along path -->
  <text x="88" y="162" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">操作①</text>
  <text x="222" y="240" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">操作②</text>

  <!-- nodes -->
  <circle cx="70" cy="140" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="145" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="70" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">端点·翻 1 次</text>

  <circle cx="160" cy="215" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="160" y="256" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">中间·翻 2 次 ⇒ 抵消</text>

  <circle cx="250" cy="290" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="295" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="250" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">端点·翻 1 次</text>

  <circle cx="75" cy="295" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="300" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="75" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">没被碰</text>

  <circle cx="255" cy="145" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="150" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="255" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">没被碰</text>

  <!-- right facts -->
  <rect x="315" y="100" width="190" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">异或自反律</text>
  <text x="410" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(x ⊕ k) ⊕ k = x</text>
  <text x="410" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">翻偶数次等于白翻</text>

  <rect x="315" y="170" width="190" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">树连通 ⇒ 任意配对</text>
  <text x="410" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">任选两点 u、v</text>
  <text x="410" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">都能「单独」同时 ⊕k</text>

  <rect x="315" y="240" width="190" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="260" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">奇偶不变量</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">每步操作恰翻 2 个节点</text>
  <text x="410" y="291" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">⇒ 翻转集大小恒为偶数</text>

  <!-- bottom conclusion -->
  <rect x="30" y="330" width="460" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">可达状态 = 对任意偶数大小子集 S 做 nums[i] ⊕= k</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">必要性（恒偶）+ 充分性（配对可达）夹逼 ⇒ 与树的形状无关，edges 白给了</text>
</svg>
