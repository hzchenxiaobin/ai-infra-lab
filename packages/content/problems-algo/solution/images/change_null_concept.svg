<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">前向填充（LOCF）：每个 NULL 取「按 id 排序后最近一个非空值」</text>

  <!-- ===== Left table: original (with NULL) ===== -->
  <text x="160" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">原始 CoffeeShop（按 id 排序）</text>

  <!-- header -->
  <rect x="40" y="64" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="180" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">drink</text>
  <line x1="90" y1="64" x2="90" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: id=1 Orange Margarita  (group1 blue) -->
  <rect x="40" y="86" width="240" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="65" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="98" y="107" font-size="9.5" fill="#446688" font-weight="bold">Orange Margarita</text>
  <line x1="90" y1="86" x2="90" y2="120" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 2: id=2 NULL (orange highlight) -->
  <rect x="40" y="120" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,2" rx="2" filter="url(#rough2)"/>
  <text x="65" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="98" y="141" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="180" y="141" font-size="8" fill="#b85450" font-style="italic">← 缺值</text>
  <line x1="90" y1="120" x2="90" y2="154" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 3: id=3 St Germain Spritz (group2 green) -->
  <rect x="40" y="154" width="240" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="65" y="175" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="98" y="175" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz</text>
  <line x1="90" y1="154" x2="90" y2="188" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 4: id=6 NULL -->
  <rect x="40" y="188" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,2" rx="2" filter="url(#rough2)"/>
  <text x="65" y="209" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="98" y="209" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="180" y="209" font-size="8" fill="#b85450" font-style="italic">← 缺值</text>
  <line x1="90" y1="188" x2="90" y2="222" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 5: id=7 NULL -->
  <rect x="40" y="222" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,2" rx="2" filter="url(#rough2)"/>
  <text x="65" y="243" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="98" y="243" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="180" y="243" font-size="8" fill="#b85450" font-style="italic">← 缺值</text>
  <line x1="90" y1="222" x2="90" y2="256" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 6: id=9 Rum and Coke (group3 orange) -->
  <rect x="40" y="256" width="240" height="34" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="65" y="277" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="98" y="277" font-size="9.5" fill="#d6a040" font-weight="bold">Rum and Coke</text>
  <line x1="90" y1="256" x2="90" y2="290" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- ===== middle: carry-forward arrows from source to NULL rows ===== -->
  <!-- group1: id1 -> id2 -->
  <path d="M280 103 C 360 103, 360 141, 300 141" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- group2: id3 -> id6 -->
  <path d="M280 171 C 370 171, 370 209, 300 209" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- group2: id3 -> id7 -->
  <path d="M280 171 C 385 171, 385 243, 300 243" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="360" y="320" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">NULL 取「上方最近一个非空值」</text>
  <text x="360" y="335" text-anchor="middle" font-size="9" fill="#888">连续 NULL 共用同一个来源</text>

  <!-- big arrow label -->
  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">前向填充 LOCF</text>

  <!-- ===== Right table: filled ===== -->
  <text x="580" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">填充后结果</text>

  <rect x="460" y="64" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="79" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">id</text>
  <text x="600" y="79" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">drink</text>
  <line x1="510" y1="64" x2="510" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1 -->
  <rect x="460" y="86" width="240" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="485" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="518" y="107" font-size="9.5" fill="#446688" font-weight="bold">Orange Margarita</text>
  <line x1="510" y1="86" x2="510" y2="120" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 2 filled (blue, ★) -->
  <rect x="460" y="120" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="485" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="518" y="141" font-size="9.5" fill="#446688" font-weight="bold">Orange Margarita ★</text>
  <line x1="510" y1="120" x2="510" y2="154" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 3 -->
  <rect x="460" y="154" width="240" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="485" y="175" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="518" y="175" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz</text>
  <line x1="510" y1="154" x2="510" y2="188" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 4 filled (green, ★) -->
  <rect x="460" y="188" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="485" y="209" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="518" y="209" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz ★</text>
  <line x1="510" y1="188" x2="510" y2="222" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 5 filled (green, ★) -->
  <rect x="460" y="222" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="485" y="243" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="518" y="243" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz ★</text>
  <line x1="510" y1="222" x2="510" y2="256" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 6 -->
  <rect x="460" y="256" width="240" height="34" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="485" y="277" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="518" y="277" font-size="9.5" fill="#d6a040" font-weight="bold">Rum and Coke</text>
  <line x1="510" y1="256" x2="510" y2="290" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="40" y="384" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="60" y="393" font-size="9" fill="#888">NULL 行</text>
  <text x="160" y="393" font-size="9" fill="#4a7a3a" font-weight="bold">★</text>
  <text x="176" y="393" font-size="9" fill="#888">由上方非空值填充而来</text>
  <text x="360" y="424" text-anchor="middle" font-size="8.5" fill="#aaa">蓝色组 = id1,2 · 绿色组 = id3,6,7 · 橙色组 = id9（颜色同源即同来源）</text>
</svg>
