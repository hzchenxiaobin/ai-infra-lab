<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：7 个用户的旅行距离累加与排序</text>

  <!-- ============ Header row ============ -->
  <rect x="20" y="44" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">用户</text>
  <rect x="104" y="44" width="250" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">LEFT JOIN 后的行程行</text>
  <rect x="358" y="44" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="60" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SUM</text>
  <rect x="462" y="44" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="492" y="60" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">IFNULL</text>
  <rect x="526" y="44" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="563" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">排序位次</text>

  <!-- ============ Elvis (rank 1, tie 450) ============ -->
  <rect x="20" y="72" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Elvis(19)</text>
  <text x="60" y="100" text-anchor="middle" font-size="8" fill="#888">2 次行程</text>
  <rect x="104" y="72" width="250" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="92" font-size="9.5" fill="#333">50</text>
  <text x="160" y="92" font-size="9.5" fill="#888">+</text>
  <text x="180" y="92" font-size="9.5" fill="#333">400</text>
  <text x="408" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">450</text>
  <text x="492" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">450</text>
  <rect x="526" y="72" width="74" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="563" y="93" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- ============ Lee (rank 2, tie 450) ============ -->
  <rect x="20" y="110" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Lee(7)</text>
  <text x="60" y="138" text-anchor="middle" font-size="8" fill="#888">3 次行程</text>
  <rect x="104" y="110" width="250" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="130" font-size="9.5" fill="#333">100</text>
  <text x="162" y="130" font-size="9.5" fill="#888">+</text>
  <text x="180" y="130" font-size="9.5" fill="#333">120</text>
  <text x="222" y="130" font-size="9.5" fill="#888">+</text>
  <text x="240" y="130" font-size="9.5" fill="#333">230</text>
  <text x="408" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">450</text>
  <text x="492" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">450</text>
  <rect x="526" y="110" width="74" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="563" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- tie note -->
  <text x="350" y="106" font-size="8.5" fill="#b85450" font-weight="bold">↑ 并列 450：name ASC → Elvis &lt; Lee</text>

  <!-- ============ Bob (rank 3) ============ -->
  <rect x="20" y="148" width="80" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="167" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Bob(2)</text>
  <rect x="104" y="148" width="250" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="167" font-size="9.5" fill="#333">317</text>
  <text x="408" y="167" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">317</text>
  <text x="492" y="167" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">317</text>
  <rect x="526" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <!-- ============ Jonathan (rank 4) ============ -->
  <rect x="20" y="182" width="80" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="201" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">Jonathan(13)</text>
  <rect x="104" y="182" width="250" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="201" font-size="9.5" fill="#333">312</text>
  <text x="408" y="201" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">312</text>
  <text x="492" y="201" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">312</text>
  <rect x="526" y="182" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>

  <!-- ============ Alex (rank 5) ============ -->
  <rect x="20" y="216" width="80" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="235" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Alex(3)</text>
  <rect x="104" y="216" width="250" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="235" font-size="9.5" fill="#333">222</text>
  <text x="408" y="235" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">222</text>
  <text x="492" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">222</text>
  <rect x="526" y="216" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <!-- ============ Alice (rank 6) ============ -->
  <rect x="20" y="250" width="80" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="269" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Alice(1)</text>
  <rect x="104" y="250" width="250" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="269" font-size="9.5" fill="#333">120</text>
  <text x="408" y="269" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">120</text>
  <text x="492" y="269" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">120</text>
  <rect x="526" y="250" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>

  <!-- ============ Donald (rank 7, NULL -> 0) ============ -->
  <rect x="20" y="284" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Donald(4)</text>
  <text x="60" y="312" text-anchor="middle" font-size="8" fill="#b85450">无行程</text>
  <rect x="104" y="284" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">r.distance = NULL（无匹配行）</text>
  <text x="408" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="492" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="526" y="284" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="305" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>

  <!-- NULL -> 0 arrow -->
  <text x="450" y="324" font-size="8.5" fill="#b85450" font-weight="bold">IFNULL 兜底</text>

  <!-- ============ Conservation check ============ -->
  <rect x="20" y="332" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="352" font-size="10.5" fill="#d6a040" font-weight="bold">守恒校验：所有用户距离之和 = Rides.distance 总和</text>
  <text x="40" y="368" font-size="9.5" fill="#333">用户侧：120 + 317 + 222 + 0 + 450 + 312 + 450 = </text>
  <text x="320" y="368" font-size="10" fill="#4a7a3a" font-weight="bold">1871</text>
  <text x="360" y="368" font-size="9.5" fill="#888">| Rides 侧：120+317+222+100+312+50+120+400+230 = </text>
  <text x="588" y="368" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">1871 ✓</text>
  <text x="40" y="382" font-size="9" fill="#888">两组相等 → 无遗漏（Donald 已计入 0）、无重复（每行程恰属一用户）。若不守恒，检查 LEFT JOIN 条件或 IFNULL 是否漏写。</text>

  <!-- ============ bottom note ============ -->
  <rect x="20" y="398" width="580" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="416" font-size="9.5" fill="#333">两个核心验证点：① <tspan fill="#b85450" font-weight="bold">Donald 的 NULL → 0</tspan>：LEFT JOIN 保留他，但 SUM(空集)=NULL，必须 IFNULL 兜底，否则输出 null 而非 0。</text>
  <text x="40" y="430" font-size="9.5" fill="#333">② <tspan fill="#b85450" font-weight="bold">并列破序</tspan>：Elvis 与 Lee 同为 450，ORDER BY 的第二关键字 name ASC 让 Elvis(E) 排在 Lee(L) 前。只按距离排序无法保证此顺序。</text>
  <text x="40" y="442" font-size="8.5" fill="#888">注：Lee 有 3 次行程（100/120/230），LEFT JOIN 后裂变为 3 行，GROUP BY 收回成一组再 SUM。</text>
</svg>
