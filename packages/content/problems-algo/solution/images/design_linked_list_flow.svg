<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">设计链表：五个操作的算法流程</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#666">公共子过程：getNode(index) — 从 head->next 走 index 步定位到目标节点（哨兵让“定位前驱”更顺手）</text>

  <!-- ===== get ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="88" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="120" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">get(index)</text>

  <g filter="url(#sk)">
    <path d="M 120 138 L 210 178 L 120 218 L 30 178 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">index 越界？</text>
  <text x="120" y="190" text-anchor="middle" font-size="9" fill="#7a2828">(&lt;0 或 ≥size)</text>
  <path d="M 120 128 L 120 138" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="12" y="178" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="20" y="240" width="100" height="36" rx="6" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="70" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>
  <path d="M 80 218 L 70 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="220" y="178" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="150" y="240" width="180" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e"/></g>
  <text x="240" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur = head-&gt;next</text>
  <text x="240" y="280" text-anchor="middle" font-size="11" fill="#333">走 index 步 → return cur-&gt;val</text>
  <path d="M 145 218 L 220 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== addAtHead / addAtTail ===== -->
  <g filter="url(#sk)"><rect x="380" y="88" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="480" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">addAtHead(val) / addAtTail(val)</text>
  <text x="480" y="122" text-anchor="middle" font-size="10" fill="#666">O(1)：哨兵让头尾插入无特例</text>

  <g filter="url(#sk)"><rect x="360" y="150" width="240" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e"/></g>
  <text x="480" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">addAtHead: cur = head</text>
  <text x="480" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">addAtTail: cur = tail-&gt;prev</text>
  <text x="480" y="202" text-anchor="middle" font-size="9" fill="#7a5415">都在 cur 之后插入 → 复用 addAtIndex(0/size)</text>
  <path d="M 480 128 L 480 150" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="360" y="226" width="240" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a"/></g>
  <text x="480" y="251" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">spliceAfter(cur, new Node(val))</text>
  <path d="M 480 206 L 480 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== addAtIndex ===== -->
  <g filter="url(#sk)"><rect x="640" y="88" width="180" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="730" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">addAtIndex(index,val)</text>

  <g filter="url(#sk)">
    <path d="M 730 138 L 820 178 L 730 218 L 640 178 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="730" y="175" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">index &gt; size ?</text>
  <text x="730" y="190" text-anchor="middle" font-size="9" fill="#7a2828">(index==size 允许,插尾)</text>
  <path d="M 730 128 L 730 138" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="618" y="178" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="630" y="240" width="120" height="36" rx="6" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="690" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不插入 return</text>
  <path d="M 700 218 L 690 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="832" y="178" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="660" y="226" width="220" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e"/></g>
  <text x="770" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur = head; 走 index 步</text>
  <text x="770" y="266" text-anchor="middle" font-size="11" fill="#333">spliceAfter(cur, new Node(val))</text>
  <text x="770" y="278" text-anchor="middle" font-size="9" fill="#7a5415">定位到“前驱”再后插 → size++</text>
  <path d="M 760 218 L 770 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== spliceAfter 子过程（核心 4 指针） ===== -->
  <text x="70" y="332" font-size="13" font-weight="bold" fill="#2b2b2b">公共子过程 spliceAfter(cur, node) —— 所有插入的统一实现</text>

  <g filter="url(#sk)"><rect x="60" y="346" width="820" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>

  <g filter="url(#sk2)">
    <rect x="90" y="372" width="50" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="250" y="372" width="50" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="410" y="372" width="50" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="115" y="397" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">cur</text>
  <text x="275" y="397" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">node</text>
  <text x="435" y="397" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur.next</text>

  <g filter="url(#sk2)">
    <!-- ① node.next = cur.next -->
    <path d="M 300 386 Q 360 358 408 386" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
    <!-- ② node.prev = cur -->
    <path d="M 250 386 Q 200 358 142 386" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <!-- ③ cur.next.prev = node -->
    <path d="M 410 400 Q 360 422 302 400" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)"/>
    <!-- ④ cur.next = node -->
    <path d="M 140 400 Q 195 422 248 400" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="354" y="352" font-size="10" fill="#4a7a3a" font-weight="bold">① node.next = cur-&gt;next</text>
  <text x="178" y="352" font-size="10" fill="#2b6e9e" font-weight="bold">② node.prev = cur</text>
  <text x="330" y="440" font-size="10" fill="#b85450" font-weight="bold">③ cur-&gt;next-&gt;prev = node</text>
  <text x="160" y="440" font-size="10" fill="#7a5415" font-weight="bold">④ cur-&gt;next = node</text>
  <text x="500" y="397" font-size="11" fill="#666">→ size++</text>
  <text x="640" y="386" font-size="10" fill="#444">顺序要点：①② 先把新节点两根指针接好</text>
  <text x="640" y="402" font-size="10" fill="#444">③④ 再改 cur 与原后继回指——</text>
  <text x="640" y="418" font-size="10" fill="#7a5415">先存/先接新节点，避免丢失 cur.next</text>

  <!-- ===== deleteAtIndex ===== -->
  <g filter="url(#sk)"><rect x="40" y="490" width="180" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="130" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">deleteAtIndex(index)</text>

  <g filter="url(#sk)">
    <path d="M 130 540 L 220 580 L 130 620 L 40 580 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="130" y="577" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">index 越界？</text>
  <text x="130" y="592" text-anchor="middle" font-size="9" fill="#7a2828">(&lt;0 或 ≥size)</text>
  <path d="M 130 530 L 130 540" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="12" y="580" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <text x="22" y="616" font-size="11" fill="#b85450" font-weight="bold">return</text>

  <text x="232" y="580" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="250" y="556" width="320" height="64" rx="4" fill="#fffdf3" stroke="#9e9e9e"/></g>
  <text x="410" y="578" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur = getNode(index)</text>
  <text x="410" y="596" text-anchor="middle" font-size="11" fill="#333">cur-&gt;prev-&gt;next = cur-&gt;next</text>
  <text x="410" y="612" text-anchor="middle" font-size="11" fill="#333">cur-&gt;next-&gt;prev = cur-&gt;prev; delete cur; size--</text>
  <path d="M 175 580 L 250 580" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="600" y="556" width="280" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-dasharray="5 3"/></g>
  <text x="740" y="578" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">删除只需 2 指针重连</text>
  <text x="740" y="596" text-anchor="middle" font-size="10" fill="#444">前驱.next 越过自己指后继</text>
  <text x="740" y="612" text-anchor="middle" font-size="10" fill="#444">后继.prev 越过自己指前驱</text>
</svg>
