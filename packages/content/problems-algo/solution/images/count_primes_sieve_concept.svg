<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">埃氏筛核心：质数 p 的所有倍数都是合数，逐个划掉</text>

  <!-- Number grid 2..10, 9 boxes, w=48 step=54 start x=70 y=90 -->
  <!-- 2 prime green -->
  <rect x="70" y="90" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- 3 prime green -->
  <rect x="124" y="90" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <!-- 4 composite red strike -->
  <rect x="178" y="90" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="180" y1="128" x2="224" y2="92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="202" y="116" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">4</text>
  <!-- 5 prime green -->
  <rect x="232" y="90" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- 6 composite red strike -->
  <rect x="286" y="90" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="288" y1="128" x2="332" y2="92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">6</text>
  <!-- 7 prime green -->
  <rect x="340" y="90" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>
  <!-- 8 composite red strike -->
  <rect x="394" y="90" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="396" y1="128" x2="440" y2="92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="418" y="116" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">8</text>
  <!-- 9 composite red strike -->
  <rect x="448" y="90" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="450" y1="128" x2="494" y2="92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="116" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
  <!-- 10 composite red strike -->
  <rect x="502" y="90" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="504" y1="128" x2="548" y2="92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="526" y="116" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">10</text>

  <!-- index labels -->
  <text x="94" y="148" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="148" y="148" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <!-- Annotation row 1: i=2 -->
  <rect x="40" y="170" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="192" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">第 1 轮 i=2：</tspan>2 是质数 → 划掉倍数 4, 6, 8, 10</text>

  <!-- Annotation row 2: i=3 -->
  <rect x="40" y="212" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="234" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">第 2 轮 i=3：</tspan>3 是质数 → 划掉 9（从 3×3 起，6 已被 2 划过）</text>

  <!-- i=4 stop note -->
  <rect x="40" y="254" width="300" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="11" fill="#888">i=4：4×4=16 ≥ 10，无需再划，筛选结束</text>

  <!-- Result -->
  <rect x="40" y="300" width="520" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">未被划掉的数：2, 3, 5, 7 → 都是质数，共 4 个（&lt; 10）</text>
</svg>
