<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次比较判定闭区间是否相离</text>

  <!-- Start -->
  <rect x="200" y="42" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">取 s1,e1 = event1；s2,e2 = event2</text>

  <!-- arrow -->
  <path d="M 280 80 L 280 98" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision 1: e1 < s2 ? -->
  <polygon points="280,100 400,150 280,200 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e1 &lt; s2 ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#888">（字符串直接比较）</text>

  <!-- Yes branch -->
  <path d="M 160 150 L 96 150" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="128" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="24" y="132" width="72" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No branch -->
  <path d="M 280 200 L 280 218" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="214" font-size="10" fill="#446688">否</text>

  <!-- Decision 2: e2 < s1 ? -->
  <polygon points="280,220 400,270 280,320 160,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e2 &lt; s1 ?</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#888">（反向再判一次）</text>

  <!-- Yes branch -->
  <path d="M 160 270 L 96 270" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="128" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="24" y="252" width="72" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="275" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No branch -->
  <path d="M 280 320 L 280 338" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="334" font-size="10" fill="#446688">否</text>

  <!-- return true -->
  <rect x="200" y="340" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true（有冲突）</text>

  <!-- note -->
  <text x="420" y="150" font-size="10" fill="#888">e1&lt;s2 说明</text>
  <text x="420" y="164" font-size="10" fill="#888">事件1 完全早于事件2</text>
  <text x="420" y="272" font-size="10" fill="#888">e2&lt;s1 说明</text>
  <text x="420" y="286" font-size="10" fill="#888">事件2 完全早于事件1</text>
</svg>
