<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">观察：arr2 = nums − arr1 免费得到，双单调合并成一条差分下界</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">arr1 ↗ 非递减，arr2 ↘ 非递增，arr1[i] + arr2[i] = nums[i]</text>
  <text x="260" y="53" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">记 δ = arr1[i] − arr1[i−1]（增量），Δ = nums[i] − nums[i−1]（相邻差）</text>

  <!-- 顶部两个观察框 -->
  <rect x="36" y="62" width="216" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">和约束 ⇒ arr2[i] = nums[i] − arr1[i]</text>
  <text x="144" y="97" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">arr2 无自由度：知道 arr1 就知道 arr2</text>

  <rect x="276" y="62" width="208" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">非负 ⇒ arr2[i] ≥ 0</text>
  <text x="380" y="97" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">⇒ arr1[i] ≤ nums[i]（值域上界）</text>

  <!-- 中部推导 -->
  <rect x="36" y="120" width="224" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">arr1 非递减 ⇒ δ ≥ 0</text>

  <rect x="36" y="158" width="224" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="177" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">arr2 非递增：arr2[i−1] ≥ arr2[i]</text>
  <text x="148" y="194" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">代入 arr2 = nums − arr1 ⇒ δ ≥ Δ</text>

  <rect x="292" y="128" width="192" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="147" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合并成一条差分下界</text>
  <text x="388" y="165" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">δ ≥ max(0, Δ) = d</text>
  <text x="388" y="182" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">nums 涨 d ⇒ arr1 至少涨 d</text>

  <path d="M 262 135 L 288 147" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 262 184 L 288 172" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 底部跷跷板图景 -->
  <text x="36" y="226" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">跷跷板：涨的差额全由 arr1 吃下</text>

  <!-- 左柱：位置 i-1, nums=3 -->
  <rect x="120" y="265" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="292" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">arr2=2</text>
  <rect x="120" y="311" width="44" height="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="327" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">arr1=1</text>

  <!-- 右柱：位置 i, nums=5 -->
  <rect x="280" y="219" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="246" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">arr2≤2</text>
  <rect x="280" y="265" width="44" height="69" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="302" y="294" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">arr1≥3</text>
  <text x="302" y="308" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">（至少涨 d=2）</text>

  <!-- arr2 上限虚线 -->
  <path d="M 108 265 L 344 265" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="230" y="258" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">arr2 顶多持平 2 格</text>

  <!-- Δ 箭头 -->
  <path d="M 170 256 Q 222 222 276 218" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="216" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Δ = +2</text>

  <!-- 基线与标注 -->
  <path d="M 96 334 L 352 334" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="350" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">位置 i−1：nums=3</text>
  <text x="302" y="350" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">位置 i：nums=5</text>
</svg>
