<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：head = [4,5,1,9]，删除值为 1 的节点</text>

  <!-- ===== Step 0: 初态 ===== -->
  <rect x="30" y="44" width="540" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="64" font-size="11" fill="#446688" font-weight="bold">① 初态</text>
  <text x="44" y="110" font-size="10" fill="#888">node 指向第 3 个节点（值 1），node.next 指向值 9</text>
  <!-- chain 4 -> 5 -> [1] -> 9 -->
  <rect x="120" y="74" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="95" text-anchor="middle" font-size="13" fill="#333">4</text>
  <line x1="176" y1="90" x2="208" y2="90" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="208" y="74" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="95" text-anchor="middle" font-size="13" fill="#333">5</text>
  <line x1="264" y1="90" x2="296" y2="90" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="296" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="95" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <line x1="352" y1="90" x2="384" y2="90" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="384" y="74" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="95" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- node / node.next labels -->
  <path d="M324 112 L324 120 L324 122" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="324" y="132" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">node</text>
  <text x="412" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">node.next</text>

  <!-- arrow down with step1 code -->
  <path d="M300 124 L300 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="180" y="132" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">node.val = node.next.val</text>

  <!-- ===== Step 1: 值后移 ===== -->
  <rect x="30" y="152" width="540" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="172" font-size="11" fill="#d6a040" font-weight="bold">② 值后移</text>
  <text x="44" y="218" font-size="10" fill="#888">9 搬到 node 位置，链表出现两个连续 9</text>
  <!-- chain 4 -> 5 -> [9] -> 9, node changed from 1 to 9 -->
  <rect x="120" y="182" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="203" text-anchor="middle" font-size="13" fill="#333">4</text>
  <line x1="176" y1="198" x2="208" y2="198" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="208" y="182" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="203" text-anchor="middle" font-size="13" fill="#333">5</text>
  <line x1="264" y1="198" x2="296" y2="198" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="296" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="203" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <line x1="352" y1="198" x2="384" y2="198" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="384" y="182" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="203" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- change annotation: 1 -> 9 -->
  <path d="M300 170 Q 324 160 348 170" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="324" y="158" text-anchor="middle" font-size="9" fill="#b85450">1→9</text>

  <!-- arrow down with step2 code -->
  <path d="M300 232 L300 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="170" y="240" width="260" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="253" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">node.next = node.next.next</text>

  <!-- ===== Step 2: 跳过后继 ===== -->
  <rect x="30" y="260" width="540" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="280" font-size="11" fill="#b85450" font-weight="bold">③ 跳过后继</text>
  <text x="44" y="326" font-size="10" fill="#888">node 直接连到原后继的下一个（此处为 null），真后继脱链</text>
  <!-- chain 4 -> 5 -> 9, next dropped -->
  <rect x="120" y="290" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="311" text-anchor="middle" font-size="13" fill="#333">4</text>
  <line x1="176" y1="306" x2="208" y2="306" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="208" y="290" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="311" text-anchor="middle" font-size="13" fill="#333">5</text>
  <line x1="264" y1="306" x2="296" y2="306" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="296" y="290" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">9</text>
  <!-- dropped next (greyed) -->
  <rect x="384" y="290" width="56" height="32" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="412" y="311" text-anchor="middle" font-size="13" fill="#bbb">9</text>
  <line x1="386" y1="292" x2="438" y2="320" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="412" y="340" text-anchor="middle" font-size="9" fill="#999">脱链</text>
  <!-- null marker after 9 -->
  <text x="362" y="311" font-size="11" fill="#888">→∅</text>

  <!-- arrow down to result -->
  <path d="M300 340 L300 362" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="30" y="366" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="44" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <text x="90" y="386" font-size="12" fill="#333">从 head 看值序列：</text>
  <text x="150" y="408" font-size="13" fill="#4a7a3a" font-weight="bold">4 → 5 → 9</text>
  <text x="250" y="408" font-size="11" fill="#4a7a3a">✓ 与「真正删除值为 1 的节点」完全等价</text>
  <text x="460" y="386" font-size="10" fill="#888">O(1) / O(1)</text>
</svg>
