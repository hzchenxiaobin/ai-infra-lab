<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：哈希表把「查找」从 O(n) 降到 O(1)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">list1 建表 string→index，扫 list2 时 O(1) 拿下标</text>

  <!-- ===== Left: list1 array ===== -->
  <text x="70" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">list1</text>
  <rect x="20" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="104" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <rect x="70" y="86" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="10" fill="#333">Shogun</text>

  <rect x="20" y="114" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="132" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <rect x="70" y="114" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#333">Tapioca Express</text>

  <rect x="20" y="142" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="160" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <rect x="70" y="142" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="9" fill="#333">Burger King</text>

  <rect x="20" y="170" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="188" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <rect x="70" y="170" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="10" fill="#333">KFC</text>

  <!-- arrow list1 -> hash map -->
  <path d="M 170 141 L 214 141" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="134" text-anchor="middle" font-size="9" fill="#888">建表</text>

  <!-- ===== Middle: hash map ===== -->
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">哈希表 map</text>
  <rect x="220" y="86" width="120" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="106" text-anchor="middle" font-size="9" fill="#888">key</text>
  <text x="305" y="106" text-anchor="middle" font-size="9" fill="#888">val</text>
  <line x1="278" y1="92" x2="278" y2="194" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="245" y="124" text-anchor="middle" font-size="9" fill="#333">Shogun</text>
  <text x="305" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="245" y="142" text-anchor="middle" font-size="8" fill="#333">Tapioca</text>
  <text x="305" y="142" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="245" y="160" text-anchor="middle" font-size="8" fill="#333">Burger K.</text>
  <text x="305" y="160" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="245" y="178" text-anchor="middle" font-size="9" fill="#333">KFC</text>
  <text x="305" y="178" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- arrow hash map -> list2 lookup -->
  <path d="M 340 141 L 394 141" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="134" text-anchor="middle" font-size="9" fill="#888">O(1) 查</text>

  <!-- ===== Right: list2 scanning ===== -->
  <text x="470" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">扫 list2</text>
  <rect x="410" y="86" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="104" text-anchor="middle" font-size="9" fill="#888">j=0</text>
  <rect x="460" y="86" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="104" text-anchor="middle" font-size="9" fill="#333">KFC</text>

  <rect x="410" y="114" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="9" fill="#888">j=1</text>
  <rect x="460" y="114" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="132" text-anchor="middle" font-size="9" fill="#333">Shogun</text>

  <rect x="410" y="142" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="160" text-anchor="middle" font-size="9" fill="#888">j=2</text>
  <rect x="460" y="142" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="160" text-anchor="middle" font-size="9" fill="#333">Burger King</text>

  <!-- ===== Bottom: index sum computation ===== -->
  <path d="M 505 132 L 505 232" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 198 L 280 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="238" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#7a4a10" font-weight="bold">索引和 = i + j = 0 + 1 = 1</text>

  <!-- ===== insight box ===== -->
  <rect x="24" y="300" width="512" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">暴力：对每个 list2[j] 线性扫 list1 找相等 → O(n·m·L)</text>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">哈希：建 list1 表，查 list2[j] 时 O(L) 拿下标 → O(n+m)</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">list1 字符串唯一 → string→index 一一映射，建表天然合法</text>
</svg>
