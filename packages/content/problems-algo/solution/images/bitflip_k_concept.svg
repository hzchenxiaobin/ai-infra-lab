<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">K 连续位翻转：贪心 + 差分跟踪翻转区间</text>
  <path d="M 220 42 Q 360 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="62" text-anchor="middle" font-size="11" fill="#888">在 i 开启翻转覆盖 [i, i+k−1]；在 i+k 撤销——两点标记代替区间修改</text>

  <!-- ===== nums row with window ===== -->
  <text x="60" y="98" font-size="12" font-weight="bold" fill="#446688">nums：</text>
  <text x="60" y="116" font-size="10" fill="#888">下标</text>
  <g font-size="13" filter="url(#sk)">
    <!-- indices 0..7 -->
    <text x="130" y="116" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="170" y="116" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="210" y="116" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="250" y="116" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="290" y="116" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="330" y="116" text-anchor="middle" font-size="10" fill="#888">5</text>
    <text x="370" y="116" text-anchor="middle" font-size="10" fill="#888">6</text>
    <text x="410" y="116" text-anchor="middle" font-size="10" fill="#888">7</text>
    <!-- values: 0 0 0 1 0 1 1 0 ; window [4,6] highlighted -->
    <rect x="110" y="124" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="130" y="150" text-anchor="middle" fill="#888">0</text>
    <rect x="150" y="124" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="170" y="150" text-anchor="middle" fill="#888">0</text>
    <rect x="190" y="124" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="210" y="150" text-anchor="middle" fill="#888">0</text>
    <rect x="230" y="124" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="250" y="150" text-anchor="middle" fill="#888">1</text>
    <rect x="270" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="290" y="150" text-anchor="middle" fill="#2b4a7a" font-weight="bold">0</text>
    <rect x="310" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="330" y="150" text-anchor="middle" fill="#2b4a7a" font-weight="bold">1</text>
    <rect x="350" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="370" y="150" text-anchor="middle" fill="#2b4a7a" font-weight="bold">1</text>
    <rect x="390" y="124" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="410" y="150" text-anchor="middle" fill="#888">0</text>
  </g>

  <!-- window bracket -->
  <g filter="url(#sk)">
    <path d="M 270 178 L 270 170 L 390 170 L 390 178" stroke="#b85450" stroke-width="2" fill="none"/>
    <text x="330" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">翻转窗口 [i, i+k−1]，k=3</text>
  </g>
  <text x="290" y="196" text-anchor="middle" font-size="10" fill="#b85450">i=4</text>
  <text x="370" y="196" text-anchor="middle" font-size="10" fill="#b85450">i+k−1=6</text>

  <!-- ===== diff array row ===== -->
  <text x="60" y="226" font-size="12" font-weight="bold" fill="#4a7a3a">diff：</text>
  <text x="60" y="244" font-size="10" fill="#888">下标</text>
  <g font-size="11" filter="url(#sk)">
    <text x="130" y="244" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="170" y="244" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="210" y="244" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="250" y="244" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="290" y="244" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="330" y="244" text-anchor="middle" font-size="10" fill="#888">5</text>
    <text x="370" y="244" text-anchor="middle" font-size="10" fill="#888">6</text>
    <text x="410" y="244" text-anchor="middle" font-size="10" fill="#888">7</text>
    <rect x="110" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="130" y="274" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="150" y="252" width="40" height="34" fill="#fff" stroke="#bbb" rx="3"/><text x="170" y="274" text-anchor="middle" fill="#bbb">0</text>
    <rect x="190" y="252" width="40" height="34" fill="#fff" stroke="#bbb" rx="3"/><text x="210" y="274" text-anchor="middle" fill="#bbb">0</text>
    <rect x="230" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="250" y="274" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="270" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="290" y="274" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="310" y="252" width="40" height="34" fill="#fff" stroke="#bbb" rx="3"/><text x="330" y="274" text-anchor="middle" fill="#bbb">0</text>
    <rect x="350" y="252" width="40" height="34" fill="#fff" stroke="#bbb" rx="3"/><text x="370" y="274" text-anchor="middle" fill="#bbb">0</text>
    <rect x="390" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="410" y="274" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>

  <!-- annotations for diff -->
  <g filter="url(#sk)">
    <path d="M 130 294 L 130 304" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <text x="135" y="316" font-size="10" fill="#4a7a3a">翻转[0,2]开始</text>
    <path d="M 250 294 L 250 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <text x="255" y="316" font-size="10" fill="#d6a040">翻转[0,2]在 3 撤销</text>
    <path d="M 290 294 L 290 304" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <text x="295" y="316" font-size="10" fill="#4a7a3a">翻转[4,6]开始</text>
    <path d="M 410 294 L 410 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <text x="415" y="316" font-size="10" fill="#d6a040">翻转[4,6]在 7 撤销</text>
  </g>

  <!-- ===== formula box ===== -->
  <g filter="url(#sk)">
    <rect x="470" y="110" width="230" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="585" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">关键公式</text>
  <g font-size="11" fill="#444">
    <text x="486" y="158">有效位 = nums[i] ⊕ flip</text>
    <text x="486" y="178" fill="#888">flip = 覆盖 i 的翻转数 mod 2</text>
    <text x="486" y="202">进入 i：</text>
    <text x="500" y="218">flip ⊕= diff[i]（累加）</text>
    <text x="486" y="240" fill="#b85450" font-weight="bold">cur == 0 ⟹ 必须在 i 翻转</text>
  </g>

  <!-- ===== bottom: greedy insight ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="640" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="360" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">贪心选择性质</text>
  <g font-size="11" fill="#444">
    <text x="60" y="390">· 从左到右扫描，遇到有效位为 0 的位置 i，<tspan font-weight="bold" fill="#b85450">必须</tspan>在 i 开启翻转</text>
    <text x="60" y="410">· 理由：i 左侧已固定，只有起点 ≤ i 的翻转能影响 i；而已处理的不可撤销</text>
    <text x="60" y="430">· 故唯一能修复 i 的就是「在 i 翻转」，选择唯一 → 贪心安全</text>
  </g>
</svg>
