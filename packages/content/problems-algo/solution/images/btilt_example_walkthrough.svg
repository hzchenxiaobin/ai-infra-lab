<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[4,2,9,3,5,null,7] 后序逐节点求坡度</text>

  <!-- 小树示意 (后序顺序 ①③⑤②④) -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <!-- edges -->
  <line x1="90" y1="76" x2="60" y2="104" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="76" x2="150" y2="104" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="104" x2="120" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="60" y1="104" x2="30" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- root 4 -->
  <circle cx="90" cy="76" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="106" y="74" font-size="8" fill="#b85450">⑥</text>
  <!-- node 2 -->
  <circle cx="60" cy="104" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="74" y="102" font-size="8" fill="#446688">③</text>
  <!-- node 9 -->
  <circle cx="150" cy="104" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">9</text>
  <text x="164" y="102" font-size="8" fill="#446688">⑤</text>
  <!-- node 3 -->
  <circle cx="30" cy="132" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="30" y="135" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">3</text>
  <text x="42" y="130" font-size="7" fill="#4a7a3a">①</text>
  <!-- node 5 -->
  <circle cx="120" cy="132" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">5</text>
  <text x="100" y="130" font-size="7" fill="#4a7a3a">②</text>
  <!-- node 7 -->
  <circle cx="120" cy="160" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="163" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">7</text>
  <text x="132" y="158" font-size="7" fill="#4a7a3a">④</text>
  <line x1="120" y1="141" x2="120" y2="151" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="200" y="48" width="430" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="230" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="305" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">l, r</text>
  <text x="375" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">tilt=|l−r|</text>
  <text x="460" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">子树和</text>
  <text x="555" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">total</text>
  <line x1="265" y1="48" x2="265" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="345" y1="48" x2="345" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="405" y1="48" x2="405" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="510" y1="48" x2="510" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① 叶 3 -->
  <rect x="200" y="74" width="430" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="10" fill="#333">① 叶 3</text>
  <text x="305" y="92" text-anchor="middle" font-size="9" fill="#888">0, 0</text>
  <text x="375" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="460" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="555" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ② 叶 5 -->
  <rect x="200" y="102" width="430" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#333">② 叶 5</text>
  <text x="305" y="120" text-anchor="middle" font-size="9" fill="#888">0, 0</text>
  <text x="375" y="120" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="460" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="555" y="120" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ③ 节点 2 -->
  <rect x="200" y="130" width="430" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="10" fill="#333">③ 节点 2</text>
  <text x="305" y="148" text-anchor="middle" font-size="9" fill="#888">3, 5</text>
  <text x="375" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="460" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="555" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ④ 叶 7 -->
  <rect x="200" y="158" width="430" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="10" fill="#333">④ 叶 7</text>
  <text x="305" y="176" text-anchor="middle" font-size="9" fill="#888">0, 0</text>
  <text x="375" y="176" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="460" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="555" y="176" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ⑤ 节点 9 -->
  <rect x="200" y="186" width="430" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 节点 9</text>
  <text x="305" y="204" text-anchor="middle" font-size="9" fill="#888">0, 7</text>
  <text x="375" y="204" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
  <text x="460" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="555" y="204" text-anchor="middle" font-size="10" fill="#333">9</text>

  <!-- 行 ⑥ 根 4 -->
  <rect x="200" y="214" width="430" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">⑥ 根 4</text>
  <text x="305" y="232" text-anchor="middle" font-size="9" fill="#888">10, 16</text>
  <text x="375" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <text x="460" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="555" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">15</text>

  <!-- 表格边框 -->
  <rect x="200" y="48" width="430" height="194" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="265" y1="74" x2="265" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="345" y1="74" x2="345" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="405" y1="74" x2="405" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="74" x2="510" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="268" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">全树坡度 = 0 + 0 + 2 + 0 + 7 + 6 = 15 ✓</text>
  <text x="320" y="305" text-anchor="middle" font-size="10" fill="#555">叶子 tilt 恒为 0；只有内部节点（左右子树和不等）才贡献坡度</text>

  <!-- 关键观察 -->
  <rect x="60" y="324" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="10" fill="#555">每个节点 tilt 由「左右子树和」决定，子树和又由更深的子树和累加而成</text>
  <text x="320" y="360" text-anchor="middle" font-size="10" fill="#555">→ 后序传递子树和，避免重复扫描；dfs 返回 sum，副作用累加 tilt</text>

  <!-- 空树提示 -->
  <rect x="60" y="378" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="395" text-anchor="middle" font-size="10" fill="#b85450">⚠️ 约束允许空树（n=0），此时返回 0</text>
</svg>
