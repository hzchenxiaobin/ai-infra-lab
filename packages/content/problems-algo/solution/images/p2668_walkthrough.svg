<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每员工候选薪水 → 取 MAX 保留</text>

  <!-- header -->
  <rect x="30" y="50" width="60" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">emp_id</text>
  <rect x="90" y="50" width="230" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="70" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">候选 salary 值</text>
  <rect x="320" y="50" width="120" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="70" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">MAX(salary)</text>
  <rect x="440" y="50" width="100" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="70" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">输出行</text>

  <!-- row 1: emp 1 -->
  <rect x="30" y="80" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="90" y="80" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110000</text>
  <text x="210" y="102" text-anchor="middle" font-size="11" fill="#999">|</text>
  <text x="250" y="102" text-anchor="middle" font-size="11" fill="#bbb">106119</text>
  <rect x="320" y="80" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110000</text>
  <rect x="440" y="80" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- row 2: emp 2 -->
  <rect x="30" y="114" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="90" y="114" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="136" text-anchor="middle" font-size="11" fill="#bbb">128922</text>
  <text x="210" y="136" text-anchor="middle" font-size="11" fill="#999">|</text>
  <text x="250" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">130000</text>
  <rect x="320" y="114" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">130000</text>
  <rect x="440" y="114" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- row 3: emp 3 (single) -->
  <rect x="30" y="148" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="90" y="148" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">42689</text>
  <rect x="320" y="148" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">42689</text>
  <rect x="440" y="148" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- row 4: emp 4 -->
  <rect x="30" y="182" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="90" y="182" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="204" text-anchor="middle" font-size="11" fill="#bbb">162825</text>
  <text x="210" y="204" text-anchor="middle" font-size="11" fill="#999">|</text>
  <text x="250" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">170000</text>
  <rect x="320" y="182" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">170000</text>
  <rect x="440" y="182" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- row 5: emp 5 (single) -->
  <rect x="30" y="216" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <rect x="90" y="216" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">44101</text>
  <rect x="320" y="216" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">44101</text>
  <rect x="440" y="216" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- row 6: emp 6 -->
  <rect x="30" y="250" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <rect x="90" y="250" width="230" height="34" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#bbb">79632</text>
  <text x="210" y="272" text-anchor="middle" font-size="11" fill="#999">|</text>
  <text x="250" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">90000</text>
  <rect x="320" y="250" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">90000</text>
  <rect x="440" y="250" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 ✓</text>

  <!-- Bottom note -->
  <rect x="30" y="306" width="510" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6 位员工 → 输出 6 行，每人恰好一条当前（最大）薪水</text>
  <text x="285" y="344" text-anchor="middle" font-size="10" fill="#666">绿色 = 被选中的 MAX；灰色 = 丢弃的历史值；单行员工无候选竞争直接保留</text>
</svg>
