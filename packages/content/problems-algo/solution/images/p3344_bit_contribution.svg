<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">按位贡献：每个二进制位独立计数，T(n) 一把算清</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">T(n) = Σ 2^b · (n² − (n−c_b)²)，其中 c_b = [0, n) 中 bit b 为 1 的数个数</text>

  <!-- 左面板：n=3 的 bit 分布 -->
  <text x="130" y="66" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">n = 3：先数清每个 bit 的 1</text>

  <rect x="55" y="74" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="92" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">数</text>
  <rect x="95" y="74" width="42" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="137" y="74" width="42" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="179" y="74" width="42" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="55" y="100" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="118" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">bit0</text>
  <rect x="95" y="100" width="42" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="137" y="100" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="118" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="179" y="100" width="42" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="233" y="118" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c₀ = 1</text>

  <rect x="55" y="126" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="144" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">bit1</text>
  <rect x="95" y="126" width="42" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="144" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="137" y="126" width="42" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="144" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="179" y="126" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="233" y="144" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c₁ = 1</text>

  <!-- 方波公式框 -->
  <rect x="20" y="166" width="238" height="84" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="32" y="186" font-size="10" fill="#333" filter="url(#rough2)">bit b 是周期 2^(b+1) 的方波：</text>
  <text x="32" y="202" font-size="10" fill="#333" filter="url(#rough2)">每轮前 2^b 个数该位为 0，后 2^b 个为 1</text>
  <text x="32" y="222" font-size="10.5" fill="#446688" filter="url(#rough2)">c_b = ⌊n/2^(b+1)⌋·2^b</text>
  <text x="32" y="238" font-size="10.5" fill="#446688" filter="url(#rough2)">　　+ max(0, n mod 2^(b+1) − 2^b)</text>

  <!-- 右面板：3×3 数对 (j∨k) 网格 -->
  <text x="390" y="66" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">3×3 个有序对 (j, k) 的 j ∨ k 值</text>

  <text x="336" y="92" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">k=0</text>
  <text x="388" y="92" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">k=1</text>
  <text x="440" y="92" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">k=2</text>
  <text x="300" y="118" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=0</text>
  <text x="300" y="160" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=1</text>
  <text x="300" y="202" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=2</text>

  <!-- 网格单元：列 x=310/362/414，行 y=98/140/182，w=52 h=42 -->
  <rect x="310" y="98" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="336" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="362" y="98" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="371" cy="131" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="414" y="98" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="452" y="104" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="310" y="140" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="336" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="319" cy="173" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="362" y="140" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="371" cy="173" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="414" y="140" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="423" cy="173" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="452" y="146" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="310" y="182" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="336" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="348" y="188" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="362" y="182" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="371" cy="215" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="404" y="188" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="414" y="182" width="52" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="452" y="188" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- 图例 -->
  <circle cx="298" cy="240" r="4.5" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="244" font-size="10" fill="#446688" filter="url(#rough2)">bit0 = 1 的对：5 个 → 每个 +1</text>
  <rect x="290" y="252" width="8" height="8" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="261" font-size="10" fill="#d6a040" filter="url(#rough2)">bit1 = 1 的对：5 个 → 每个 +2</text>

  <!-- 容斥公式框 -->
  <rect x="20" y="266" width="480" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="282" font-size="10" fill="#333" filter="url(#rough2)">容斥数对：双方 bit b 都为 0 的有序对有 (n−c_b)² 个，</text>
  <text x="34" y="298" font-size="10" fill="#333" filter="url(#rough2)">「至少一方为 1」= n² − (n−c_b)² 对 → bit b 贡献 = 2^b × 该对数</text>

  <!-- 结果框 -->
  <rect x="20" y="312" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T(3) = 1×(9−4) + 2×(9−4) = 5 + 10 = 15 ✓（直接枚举 0+1+2+1+1+3+2+3+2 = 15）</text>
</svg>
