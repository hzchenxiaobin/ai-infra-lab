<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：洗牌是置换 — 把前半段与后半段交错穿插</text>

  <!-- perm (before) row: n=6 -->
  <text x="44" y="74" font-size="11" fill="#888" filter="url(#rough2)">perm</text>
  <text x="44" y="90" font-size="9" fill="#aaa" filter="url(#rough2)">(操作前)</text>

  <!-- 6 cells: positions 0..5, values 0..5 -->
  <g font-size="13" text-anchor="middle">
    <rect x="84" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="84" fill="#888" filter="url(#rough2)">0</text>
    <rect x="130" y="60" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="152" y="84" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="176" y="60" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="198" y="84" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="222" y="60" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="244" y="84" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="268" y="60" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="290" y="84" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <rect x="314" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="336" y="84" fill="#888" filter="url(#rough2)">5</text>
  </g>
  <text x="152" y="52" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">← 前半段 →</text>
  <text x="267" y="52" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">← 后半段 →</text>

  <!-- interleave arrows: perm[j] -> arr position -->
  <!-- arr[0]=perm[0], arr[2]=perm[1], arr[4]=perm[2] (blue, first half) -->
  <!-- arr[1]=perm[3], arr[3]=perm[4], arr[5]=perm[5] (green, second half) -->

  <!-- arrows from perm cells down to arr cells (interleaving) -->
  <path d="M 106 104 L 106 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 104 L 198 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 198 104 L 290 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 244 104 L 152 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 290 104 L 244 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 336 104 L 336 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr (after) row -->
  <text x="44" y="224" font-size="11" fill="#888" filter="url(#rough2)">arr</text>
  <text x="44" y="240" font-size="9" fill="#aaa" filter="url(#rough2)">(操作后)</text>

  <!-- position labels under arr -->
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="106" y="252" filter="url(#rough2)">i=0</text>
    <text x="152" y="252" filter="url(#rough2)">1</text>
    <text x="198" y="252" filter="url(#rough2)">2</text>
    <text x="244" y="252" filter="url(#rough2)">3</text>
    <text x="290" y="252" filter="url(#rough2)">4</text>
    <text x="336" y="252" filter="url(#rough2)">5</text>
  </g>

  <g font-size="13" text-anchor="middle">
    <rect x="84" y="210" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="234" fill="#888" filter="url(#rough2)">0</text>
    <rect x="130" y="210" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="152" y="234" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="176" y="210" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="198" y="234" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="222" y="210" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="244" y="234" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <rect x="268" y="210" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="290" y="234" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="314" y="210" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="336" y="234" fill="#888" filter="url(#rough2)">5</text>
  </g>

  <!-- position mapping f(j) -->
  <path d="M 40 282 L 520 282" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">位置映射 f：元素从位置 j 走到 f(j)</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j &lt; n/2 ：f(j) = 2j（蓝色：1→2, 2→4）</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j ≥ n/2 ：f(j) = 2j − n + 1（绿色：3→1, 4→3）</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">统一：f(j) = 2j mod (n−1)，位置 0 与 n−1 为不动点</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（灰色首尾不动，蓝/绿两色交织即「完美外洗牌」）</text>
</svg>
