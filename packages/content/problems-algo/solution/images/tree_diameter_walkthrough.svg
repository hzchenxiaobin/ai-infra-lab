<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：edges = [[0,1],[1,2],[2,3],[1,4],[4,5]]</text>

  <!-- ===== Tree (top) ===== -->
  <!-- edges -->
  <line x1="88" y1="80" x2="112" y2="80" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="148" y1="80" x2="172" y2="80" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="208" y1="80" x2="232" y2="80" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="190" y1="92" x2="190" y2="118" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="268" y1="80" x2="292" y2="80" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="70" cy="80" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="130" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="190" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="190" cy="132" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="190" y="158" text-anchor="middle" font-size="9" fill="#446688">起点 s</text>
  <circle cx="250" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="11" fill="#333">4</text>
  <circle cx="310" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="84" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- ===== Left table: BFS from 0 ===== -->
  <text x="130" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① BFS(0) → A</text>
  <!-- header row: node labels -->
  <rect x="30" y="200" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <rect x="70" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="217" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="106" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="217" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="142" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="217" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="178" y="200" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="217" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="214" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="217" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="250" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="217" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- distance row -->
  <rect x="30" y="226" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="243" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">距离</text>
  <rect x="70" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="243" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="106" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="243" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="142" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="243" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="178" y="226" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="243" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="214" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="243" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="250" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="243" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- result for table 1 -->
  <rect x="60" y="262" width="190" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="155" y="280" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最远 A = 3（距离 3）</text>

  <!-- arrow between tables -->
  <path d="M 280 276 L 300 276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right table: BFS from A=3 ===== -->
  <text x="430" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② BFS(A=3) → 直径</text>
  <!-- header row -->
  <rect x="330" y="200" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="217" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <rect x="370" y="200" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="388" y="217" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="406" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="217" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="442" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="217" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="478" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="496" y="217" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="514" y="200" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="217" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="550" y="200" width="8" height="26" fill="none" filter="url(#rough2)"/>

  <!-- second header line for node 5 -->
  <rect x="330" y="200" width="0" height="0" fill="none"/>

  <!-- distance row -->
  <rect x="330" y="226" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="243" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">距离</text>
  <rect x="370" y="226" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="388" y="243" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <rect x="406" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="243" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="442" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="243" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="478" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="496" y="243" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="514" y="226" width="36" height="26" fill="none" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="243" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- node 5 cell (separate, highlighted) -->
  <rect x="370" y="256" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="388" y="273" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <rect x="406" y="256" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="273" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="452" y="273" font-size="10" fill="#b85450" font-weight="bold">← 最远 B = 5</text>

  <!-- result for table 2 -->
  <rect x="360" y="294" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">直径 = 4 ✓</text>

  <!-- footer -->
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">路径 3 - 2 - 1 - 4 - 5，共 4 条边</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">第一次从 0 出发找到端点 3；第二次从 3 出发即得最长距离 4</text>
</svg>
