<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建树 → 逐查询单点更新 → 取根 maxLen</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">每个查询 O(log n)：改一个叶，沿路径向上 merge 重算</text>

  <!-- ===== Left: steps ===== -->
  <!-- Step 1: build -->
  <rect x="40" y="68" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 建线段树 build</text>
  <text x="140" y="106" text-anchor="middle" font-size="9.5" fill="#555">叶节点：6 字段全 = 1，lc=rc=s[i]</text>
  <text x="140" y="118" text-anchor="middle" font-size="9.5" fill="#888">自底向上 merge，O(n)</text>

  <path d="M 140 126 L 140 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: for each query -->
  <rect x="40" y="146" width="200" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">② 处理每个查询</text>
  <text x="140" y="184" text-anchor="middle" font-size="9.5" fill="#555">for i in 0..k-1:</text>
  <text x="140" y="198" text-anchor="middle" font-size="9.5" fill="#555">  pos = queryIndices[i]</text>
  <text x="140" y="212" text-anchor="middle" font-size="9.5" fill="#555">  ch  = queryCharacters[i]</text>
  <text x="140" y="226" text-anchor="middle" font-size="9.5" fill="#555">  update(1, 0, n-1, pos, ch)</text>

  <path d="M 140 234 L 140 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 3: read root -->
  <rect x="40" y="254" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③ 读根节点 maxLen</text>
  <text x="140" y="292" text-anchor="middle" font-size="9.5" fill="#555">ans[i] = tree[1].maxLen</text>
  <text x="140" y="304" text-anchor="middle" font-size="9.5" fill="#888">根管辖整个 s，maxLen 即全局最长</text>

  <!-- loop arrow back to step 2 -->
  <path d="M 40 189 L 28 189 L 28 199 L 38 199" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <text x="20" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90 20 170)">下一查询</text>

  <path d="M 140 312 L 140 328" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="40" y="330" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="352" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">④ 返回 ans 数组</text>
  <text x="140" y="368" text-anchor="middle" font-size="9.5" fill="#555">长度 k，每次查询一个结果</text>

  <!-- ===== Right: tree illustration ===== -->
  <line x1="270" y1="60" x2="270" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="415" y="78" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">单点更新沿路径上升</text>

  <!-- root node -->
  <rect x="370" y="92" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">根 [0,n-1]</text>

  <!-- level 2 -->
  <path d="M 400 126 L 345 156" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 430 126 L 485 156" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="300" y="156" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="176" text-anchor="middle" font-size="10" fill="#333">左子</text>
  <rect x="440" y="156" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="176" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右子 ★</text>

  <!-- level 3 -->
  <path d="M 470 186 L 440 216" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 500 186 L 530 216" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="396" y="216" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="440" y="234" text-anchor="middle" font-size="9.5" fill="#333">...</text>
  <rect x="498" y="216" width="88" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="542" y="234" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">★</text>

  <!-- leaf -->
  <path d="M 542 244 L 542 262" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="500" y="262" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="542" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">叶 s[pos]</text>
  <text x="542" y="292" text-anchor="middle" font-size="8.5" fill="#888">改成 ch</text>

  <!-- up arrow along path -->
  <path d="M 542 296 L 542 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 542 244 L 542 240 L 485 240 L 485 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 485 186 L 485 180 L 415 180 L 415 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="300" y="306" font-size="9.5" fill="#b85450" font-weight="bold">★ = 受影响节点</text>
  <text x="300" y="320" font-size="9" fill="#888">只有 pos 到根路径上的</text>
  <text x="300" y="332" font-size="9" fill="#888">O(log n) 个节点需重算</text>

  <rect x="300" y="346" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">总复杂度</text>
  <text x="415" y="380" text-anchor="middle" font-size="9.5" fill="#555">build O(n) + k 次 update O(log n)</text>
</svg>
