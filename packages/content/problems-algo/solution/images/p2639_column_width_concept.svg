<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">每个数的字符串长度 = 数位 + (负数加 1 位负号)，每列取 max</text>

  <!-- Column group labels -->
  <text x="118" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 0 列</text>
  <text x="218" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 列</text>
  <text x="318" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 列</text>

  <!-- Grid 3x3 values -->
  <!-- row 0 -->
  <rect x="70" y="72" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−15</text>
  <rect x="170" y="72" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="72" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <!-- row 1 -->
  <rect x="70" y="116" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <rect x="170" y="116" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="270" y="116" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <!-- row 2 -->
  <rect x="70" y="160" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="170" y="160" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="186" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="270" y="160" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="186" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>

  <!-- width annotation per cell (small) -->
  <text x="170" y="222" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">宽度 →</text>
  <text x="118" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="218" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="318" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="118" y="238" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(−15→3)</text>
  <text x="218" y="238" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(1→1)</text>
  <text x="318" y="238" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(3→1)</text>
  <text x="118" y="262" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(15→2)</text>
  <text x="218" y="262" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(7→1)</text>
  <text x="318" y="262" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(12→2)</text>
  <text x="118" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(5→1)</text>
  <text x="218" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(6→1)</text>
  <text x="318" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(−2→2)</text>

  <!-- down arrows per column -->
  <path d="M 118 296 L 118 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 296 L 218 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 296 L 318 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans row highlighted -->
  <rect x="70" y="316" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="118" y="337" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max=3</text>
  <rect x="170" y="316" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="218" y="337" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max=1</text>
  <rect x="270" y="316" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="318" y="337" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max=2</text>

  <!-- right side note box -->
  <rect x="400" y="96" width="200" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="500" y="124" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">宽度公式</text>
  <text x="416" y="152" font-size="11" fill="#555" filter="url(#rough2)">width(x) =</text>
  <text x="432" y="172" font-size="11" fill="#555" filter="url(#rough2)">digits(|x|)</text>
  <text x="432" y="192" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+ 1  若 x &lt; 0 (负号)</text>
  <text x="416" y="220" font-size="11" fill="#555" filter="url(#rough2)">digits(0) = 1 特判</text>
  <text x="416" y="248" font-size="11" fill="#4a7a3a" filter="url(#rough2)">−15 → 2 + 1 = 3</text>
  <text x="416" y="268" font-size="11" fill="#4a7a3a" filter="url(#rough2)">−2  → 1 + 1 = 2</text>
  <text x="416" y="288" font-size="11" fill="#4a7a3a" filter="url(#rough2)">15  → 2 + 0 = 2</text>

  <text x="310" y="354" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">ans = 每列元素字符串长度的最大值；遍历按行、归约按列</text>
</svg>
