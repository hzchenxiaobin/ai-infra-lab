<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "2*3-4*5" 的递归展开树</text>

  <!-- Root -->
  <rect x="250" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"2*3-4*5"</text>

  <!-- three children splits -->
  <text x="100" y="98" font-size="10" fill="#d6a040" font-weight="bold">切 *  (idx1)</text>
  <text x="330" y="98" font-size="10" fill="#d6a040" font-weight="bold">切 -  (idx3)</text>
  <text x="540" y="98" font-size="10" fill="#d6a040" font-weight="bold">切 *  (idx5)</text>

  <path d="M 290 76 L 130 104" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <path d="M 330 76 L 330 104" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <path d="M 370 76 L 540 104" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- Branch 1: left "2", right "3-4*5" -->
  <rect x="70" y="108" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="125" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"2"</text>
  <rect x="130" y="108" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="125" text-anchor="middle" font-size="11" fill="#333">"3-4*5"</text>

  <!-- expand "3-4*5" -->
  <text x="175" y="148" font-size="9" fill="#888">切 -: 左"3" 右"4*5"</text>
  <path d="M 175 134 L 175 152" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <rect x="120" y="156" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="171" text-anchor="middle" font-size="10" fill="#b85450">"3"→3</text>
  <rect x="170" y="156" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="171" text-anchor="middle" font-size="10" fill="#b85450">"4*5"→20</text>
  <path d="M 175 180 L 175 194" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <rect x="120" y="196" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="211" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"3-4*5"→{3-20}={-17}</text>
  <rect x="120" y="196" width="110" height="22" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="211" font-size="9" fill="#888">*(切*亦得-5)</text>

  <!-- combine branch1: 2 * {-17,-5} -->
  <path d="M 175 220 L 175 238" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <rect x="90" y="240" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2×{-17,-5}={-34,-10}</text>

  <!-- Branch 2: "2*3" - "4*5" -->
  <rect x="270" y="108" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="125" text-anchor="middle" font-size="11" fill="#333">"2*3"</text>
  <rect x="335" y="108" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="125" text-anchor="middle" font-size="11" fill="#333">"4*5"</text>
  <path d="M 330 134 L 330 158" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="300" y="148" font-size="9" fill="#888">叶:6</text>
  <text x="365" y="148" font-size="9" fill="#888">叶:20</text>
  <rect x="270" y="160" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6-20={-14}</text>

  <!-- Branch 3: "2*3-4" * "5" -->
  <rect x="470" y="108" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="125" text-anchor="middle" font-size="11" fill="#333">"2*3-4"</text>
  <rect x="570" y="108" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="595" y="125" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"5"</text>
  <text x="515" y="148" font-size="9" fill="#888">切-: 左"2*3"→6 右"4"→4</text>
  <path d="M 515 134 L 515 158" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <rect x="455" y="160" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="515" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"2*3-4"→{6-4}={2}</text>
  <text x="580" y="178" font-size="9" fill="#888">(切*得-2)</text>
  <path d="M 515 188 L 515 232" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <rect x="455" y="234" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="530" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{-2,2}×5={-10,10}</text>

  <!-- final merge -->
  <path d="M 165 268 L 165 300" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <path d="M 330 188 L 330 300" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <path d="M 530 262 L 530 300" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="220" y="304" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="328" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">并集 = {-34,-14,-10,-10,10}</text>

  <!-- bottom callout -->
  <rect x="30" y="360" width="600" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">读图要点</text>
  <text x="40" y="402" font-size="11" fill="#555">① 蓝框=待算子串  红框=纯数字叶(直接 int())  绿框=子串已记忆化的结果集</text>
  <text x="40" y="420" font-size="11" fill="#555">② 黄框=左右结果集两两组合后产出的结果  ③ 三条分支的黄色结果并集即最终答案(顺序无关)</text>
  <text x="40" y="438" font-size="11" fill="#888">"2*3-4" 切 * 得 2*(3-4)=-2，切 - 得 (2*3)-4=2，故其结果集 {-2,2} 已被 memo 缓存</text>
</svg>
