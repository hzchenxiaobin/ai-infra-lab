<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：初始化 → 逐步扩散 → 求和</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(k · n²) ：每步扫描 n² 格 × 8 方向，滚动数组空间 O(n²)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init -->
    <rect x="40" y="64" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="86" font-size="12" fill="#446688" font-weight="bold">① 初始化 dp0</text>
    <text x="170" y="86" font-family="monospace" font-size="10" fill="#555">dp[r][c] = 0；dp[row][col] = 1</text>
    <text x="54" y="104" font-size="9.5" fill="#888">起点概率为 1（确定在起点），其余格子 0</text>
    <text x="54" y="116" font-size="9.5" fill="#888">用二维数组 dp[n][n]，滚动复用上一步结果</text>

    <path d="M 260 124 L 260 138" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: loop over steps -->
    <rect x="40" y="142" width="440" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="164" font-size="12" fill="#d6a040" font-weight="bold">② for step in 0..k-1：逐步扩散</text>
    <text x="54" y="184" font-family="monospace" font-size="10" fill="#555">next[n][n] = 0   // 清空下一步</text>
    <text x="54" y="202" font-family="monospace" font-size="10" fill="#555">for r in 0..n-1, c in 0..n-1:</text>
    <text x="74" y="218" font-family="monospace" font-size="10" fill="#555">if dp[r][c] == 0: continue</text>
    <text x="74" y="234" font-family="monospace" font-size="10" fill="#555">for (dr,dc) in 8_dirs:</text>
    <text x="94" y="250" font-family="monospace" font-size="10" fill="#4a7a3a">nr,nc = r+dr, c+dc</text>
    <text x="94" y="266" font-family="monospace" font-size="10" fill="#4a7a3a">if 0≤nr&lt;n and 0≤nc&lt;n:</text>
    <text x="114" y="282" font-family="monospace" font-size="10" fill="#b85450" font-weight="bold">next[nr][nc] += dp[r][c] / 8</text>

    <path d="M 260 294 L 260 308" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="280" y="304" font-size="9" fill="#888">dp = next （滚动切换）</text>

    <!-- Step 3: sum -->
    <rect x="40" y="312" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="334" font-size="12" fill="#4a7a3a" font-weight="bold">③ 求和：板上概率之和</text>
    <text x="220" y="334" font-family="monospace" font-size="10" fill="#555">ans = Σ dp[r][c]</text>
    <text x="54" y="352" font-size="9.5" fill="#888">k 步后仍留在板上的概率 = 全板概率累加</text>
    <text x="54" y="364" font-size="9.5" fill="#888">离板的概率在扩散时已丢弃，故和 ≤ 1</text>

    <!-- complexity -->
    <rect x="40" y="382" width="440" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="402" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(k · n²)  ·  空间 O(n²)（滚动数组）</text>
    <text x="260" y="418" text-anchor="middle" font-size="10" fill="#888">8 方向常数次遍历；dp 与 next 两张表交替即可</text>
  </g>
</svg>
