<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">奇怪的打印机：一轮涂一段同字符，可覆盖已有字符</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">目标 s = "aba"，最少 2 轮</text>

  <!-- ===== printer rule box ===== -->
  <rect x="30" y="60" width="220" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="80" font-size="11" fill="#3a4a66" font-weight="bold">打印机规则</text>
  <text x="40" y="97" font-size="10" fill="#3a4a66">① 每轮只能涂同一种字符</text>
  <text x="40" y="112" font-size="10" fill="#3a4a66">② 可在任意区间涂色并覆盖</text>

  <!-- ===== target row ===== -->
  <text x="320" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">目标 s = "aba"</text>
  <rect x="290" y="88" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="109" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>
  <rect x="330" y="88" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="109" text-anchor="middle" font-size="13" fill="#7a3a3a">b</text>
  <rect x="370" y="88" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="109" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>

  <!-- ===== Turn 1 ===== -->
  <text x="40" y="172" font-size="12" fill="#446688" font-weight="bold">第 1 轮：涂 "aaa" 覆盖整段</text>
  <rect x="40" y="182" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="203" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>
  <text x="100" y="203" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>
  <text x="140" y="203" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>

  <path d="M 100 216 L 100 232" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Turn 2 ===== -->
  <text x="40" y="250" font-size="12" fill="#b85450" font-weight="bold">第 2 轮：在中间涂 "b" 覆盖原 a</text>
  <rect x="40" y="260" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="281" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>
  <rect x="80" y="260" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="281" text-anchor="middle" font-size="13" fill="#7a3a3a">b</text>
  <rect x="120" y="260" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="281" text-anchor="middle" font-size="13" fill="#6a4a10">a</text>

  <path d="M 160 276 L 196 276" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a">= 目标</text>

  <!-- ===== key insight ===== -->
  <rect x="200" y="160" width="330" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="215" y="184" font-size="12" fill="#3a5a2a" font-weight="bold">💡 核心观察</text>
  <text x="215" y="206" font-size="11" fill="#3a5a2a">若 s[k] == s[j]（k &lt; j），则位置 j 的</text>
  <text x="215" y="222" font-size="11" fill="#3a5a2a">涂色可以并入「涂 s[k] 的那一轮」，</text>
  <text x="215" y="238" font-size="11" fill="#3a5a2a">因为同一轮可覆盖 [k..j] 整段，</text>
  <text x="215" y="254" font-size="11" fill="#3a5a2a">中间 [k+1..j-1] 再被各自覆盖。</text>
  <text x="215" y="280" font-size="11" fill="#7a3a3a" font-weight="bold">→ s[j] 不必单独开一轮（省 1）</text>
  <text x="215" y="304" font-size="10.5" fill="#6a4a10">故 dp[i][j] 可由 dp[i][k] + dp[k+1][j-1]</text>
  <text x="215" y="318" font-size="10.5" fill="#6a4a10">转移而来（k 处那轮顺带涂了 j）。</text>

  <!-- ===== footer ===== -->
  <rect x="30" y="346" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="366" font-size="10.5" fill="#6a4a10" font-weight="bold">模型本质：每轮 = 选一段同字符区间覆盖。求覆盖成 s 的最少轮数 → 区间 DP。</text>
  <text x="45" y="380" font-size="10.5" fill="#6a4a10">相邻相同字符（如 "aa"）一轮即可，可先压缩去重再 DP。</text>
</svg>
