<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fdfcf7"/>

  <text x="250" y="28" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">query(letter) 查询流程</text>
  <path d="M 140 36 Q 250 44 360 36" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- Step 1: query(letter) -->
  <g filter="url(#sk)">
    <rect x="120" y="52" width="160" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="200" y="72" text-anchor="middle" font-size="12" fill="#2b2b2b">query(letter) 进入</text>
  <path d="M 200 82 L 200 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: stream += letter -->
  <g filter="url(#sk)">
    <rect x="110" y="100" width="180" height="30" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="200" y="120" text-anchor="middle" font-size="12" fill="#2b2b2b">stream 追加 letter</text>
  <path d="M 200 130 L 200 144" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: init node & i -->
  <g filter="url(#sk)">
    <rect x="100" y="148" width="200" height="30" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="200" y="168" text-anchor="middle" font-size="12" fill="#2b2b2b">node = root, i = len − 1</text>
  <path d="M 200 178 L 200 192" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Diamond: i >= 0 && step < maxLen? -->
  <g filter="url(#sk)">
    <polygon points="200,196 290,228 200,260 110,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#2b2b2b">i ≥ 0 且</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#2b2b2b">步数 &lt; maxLen?</text>

  <!-- No -> return false -->
  <path d="M 290 228 L 340 228" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="222" text-anchor="middle" font-size="10" fill="#b85450">No</text>
  <g filter="url(#sk)">
    <rect x="345" y="214" width="110" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes down -->
  <text x="212" y="272" font-size="10" fill="#4a8e4a">Yes</text>
  <path d="M 200 260 L 200 274" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step: node = node.ch[stream[i]] -->
  <g filter="url(#sk)">
    <rect x="80" y="278" width="240" height="30" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="200" y="298" text-anchor="middle" font-size="12" fill="#2b2b2b">node = node.ch[ stream[i] ]</text>
  <path d="M 200 308 L 200 322" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Diamond: node null? -->
  <g filter="url(#sk)">
    <polygon points="200,326 280,352 200,378 120,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#2b2b2b">node 为空?</text>

  <!-- Yes -> return false -->
  <path d="M 280 352 L 340 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="346" text-anchor="middle" font-size="10" fill="#b85450">Yes</text>
  <g filter="url(#sk)">
    <rect x="345" y="338" width="110" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No down -->
  <text x="212" y="392" font-size="10" fill="#4a8e4a">No</text>
  <path d="M 200 378 L 200 392" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Diamond: is_end? -->
  <g filter="url(#sk)">
    <polygon points="200,396 270,420 200,444 130,420" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="200" y="424" text-anchor="middle" font-size="11" fill="#2b2b2b">is_end?</text>

  <!-- Yes -> return true -->
  <path d="M 270 420 L 340 420" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="305" y="414" text-anchor="middle" font-size="10" fill="#4a8e4a">Yes</text>
  <g filter="url(#sk)">
    <rect x="345" y="406" width="110" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="400" y="426" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">return true ★</text>

  <!-- No -> loop back: i-- and go back up to first diamond -->
  <path d="M 130 420 L 50 420 L 50 228 L 110 228" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4,3"/>
  <text x="56" y="414" font-size="10" fill="#4a8e4a">No</text>
  <text x="56" y="432" font-size="10" fill="#4a8e4a">i−−</text>
</svg>
