<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=6, threshold=2, queries=[[4,5],[3,4]]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">d 只取 3,4,5,6（d&gt;2）；gcd&gt;2 的边仅 (3,6)</text>

  <!-- Step header -->
  <text x="40" y="68" font-size="11.5" fill="#446688" font-weight="bold">枚举 d 与倍数合并：</text>

  <!-- Row d=3 -->
  <rect x="40" y="78" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="94" font-size="11" fill="#333" font-weight="bold">d=3</text>
  <text x="96" y="94" font-size="10.5" fill="#555">倍数 {3, 6} → union(3, 6)</text>
  <text x="320" y="94" font-size="10" fill="#4a7a3a">✓ 合并</text>
  <text x="96" y="110" font-size="10" fill="#888">gcd(3,6)=3 &gt; 2 ✓</text>

  <!-- Row d=4 -->
  <rect x="40" y="124" width="480" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="140" font-size="11" fill="#333" font-weight="bold">d=4</text>
  <text x="96" y="140" font-size="10.5" fill="#555">倍数 {4} → 仅一个，无 union</text>
  <text x="320" y="140" font-size="10" fill="#888">跳过</text>

  <!-- Row d=5 -->
  <rect x="40" y="166" width="480" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="182" font-size="11" fill="#333" font-weight="bold">d=5</text>
  <text x="96" y="182" font-size="10.5" fill="#555">倍数 {5} → 仅一个，无 union</text>
  <text x="320" y="182" font-size="10" fill="#888">跳过</text>

  <!-- Row d=6 -->
  <rect x="40" y="208" width="480" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="224" font-size="11" fill="#333" font-weight="bold">d=6</text>
  <text x="96" y="224" font-size="10.5" fill="#555">倍数 {6} → 仅一个，无 union</text>
  <text x="320" y="224" font-size="10" fill="#888">跳过</text>

  <!-- Resulting components -->
  <text x="40" y="266" font-size="11.5" fill="#446688" font-weight="bold">合并后的连通分量：</text>

  <!-- Component 1: {3,6} -->
  <rect x="60" y="278" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{3, 6}</text>
  <text x="135" y="312" text-anchor="middle" font-size="10" fill="#888">root=3</text>

  <!-- Component 2: {4} -->
  <rect x="230" y="278" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{4}</text>
  <text x="275" y="312" text-anchor="middle" font-size="10" fill="#888">root=4</text>

  <!-- Component 3: {5} -->
  <rect x="340" y="278" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{5}</text>
  <text x="385" y="312" text-anchor="middle" font-size="10" fill="#888">root=5</text>

  <!-- Component 4: {1} {2} -->
  <rect x="450" y="278" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{1},{2}</text>
  <text x="495" y="312" text-anchor="middle" font-size="10" fill="#888">孤立</text>

  <!-- Queries -->
  <text x="40" y="346" font-size="11.5" fill="#4a7a3a" font-weight="bold">回答查询：</text>

  <!-- Query 1 -->
  <rect x="40" y="358" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="378" font-size="11" fill="#333" font-weight="bold">query [4, 5]</text>
  <text x="56" y="394" font-size="10.5" fill="#555">find(4)=4 ≠ find(5)=5</text>
  <text x="56" y="410" font-size="11" fill="#b85450" font-weight="bold">→ false</text>

  <!-- Query 2 -->
  <rect x="300" y="358" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="316" y="378" font-size="11" fill="#333" font-weight="bold">query [3, 4]</text>
  <text x="316" y="394" font-size="10.5" fill="#555">find(3)=3 ≠ find(4)=4</text>
  <text x="316" y="410" font-size="11" fill="#b85450" font-weight="bold">→ false</text>
</svg>
