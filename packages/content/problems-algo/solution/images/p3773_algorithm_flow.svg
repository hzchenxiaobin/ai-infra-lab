<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟扫描 + 哈希表计数，O(n)</text>

  <!-- start -->
  <rect x="210" y="44" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">runLen = 1，best = 0，cnt = {}</text>
  <path d="M 310 76 L 310 96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- next position -->
  <rect x="215" y="100" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="121" text-anchor="middle" font-size="12" fill="#333">i = 1 … n−1，比较 s[i] 与 s[i−1]</text>
  <path d="M 310 134 L 310 152" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="310,156 430,200 310,244 190,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="12" fill="#333">s[i] == s[i−1] ?</text>

  <!-- yes: extend run -->
  <path d="M 190 200 L 120 200 L 120 248" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="28" y="252" width="184" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="274" text-anchor="middle" font-size="11" fill="#333">runLen++</text>
  <text x="120" y="294" text-anchor="middle" font-size="10" fill="#888">（延长当前 run）</text>

  <!-- no: commit run -->
  <path d="M 430 200 L 500 200 L 500 248" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="192" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="414" y="252" width="176" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="502" y="272" text-anchor="middle" font-size="11" fill="#333">cnt[runLen]++</text>
  <text x="502" y="290" text-anchor="middle" font-size="10" fill="#333">best = max(best, cnt[runLen])</text>
  <text x="502" y="310" text-anchor="middle" font-size="11" fill="#333">runLen = 1（开新 run）</text>

  <!-- merge -->
  <path d="M 120 310 L 120 350 L 223 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 502 328 L 502 350 L 397 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="227" y="330" width="166" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="12" fill="#333">i++，处理下一处</text>

  <!-- loop back -->
  <path d="M 393 362 L 608 362 L 608 117 L 407 117" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="354" font-size="10" fill="#888">下一轮</text>

  <!-- exit -->
  <path d="M 310 370 L 310 392" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="388" font-size="10" fill="#888">i 扫完</text>

  <!-- flush last run -->
  <rect x="150" y="396" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">收尾：提交最后一个 run</text>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#333">cnt[runLen]++ → 更新 best</text>
  <path d="M 310 442 L 310 458" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="235" y="462" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="310" y="482" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 best</text>

  <text x="310" y="514" text-anchor="middle" font-size="10" fill="#888">易错点：最后一个 run 没有「相邻不同」事件触发提交，须手动收尾</text>
</svg>
