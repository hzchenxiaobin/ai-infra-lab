<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：以点 i 为中心，按距离分组，每组 m 个点贡献 m×(m−1) 个回旋镖</text>

  <!-- center point i -->
  <circle cx="180" cy="200" r="8" fill="#d6a040" stroke="#a87020" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="226" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">i（中心）</text>

  <!-- distance circle d1 (orange, 3 points) -->
  <circle cx="180" cy="200" r="60" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="118" y="156" font-size="10" fill="#d6a040">距离 d₁</text>
  <!-- points on d1: j1, j2, k1 -->
  <circle cx="180" cy="140" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="132" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">j₁</text>
  <circle cx="232" cy="236" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="244" y="244" font-size="10" fill="#333" font-weight="bold">j₂</text>
  <circle cx="128" cy="236" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="248" font-size="10" fill="#333" font-weight="bold">j₃</text>

  <!-- distance circle d2 (blue, 2 points) -->
  <circle cx="180" cy="200" r="110" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="60" y="116" font-size="10" fill="#446688">距离 d₂</text>
  <circle cx="80" cy="200" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="190" font-size="10" fill="#333" font-weight="bold">k₁</text>
  <circle cx="290" cy="120" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="116" font-size="10" fill="#333" font-weight="bold">k₂</text>

  <!-- counting panel on the right -->
  <rect x="340" y="60" width="200" height="280" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">以 i 为中心的计数</text>
  <line x1="360" y1="92" x2="520" y2="92" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- d1 row -->
  <rect x="354" y="104" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="384" y="116" font-size="11" fill="#333">d₁：m = 3 个点</text>
  <text x="384" y="134" font-size="11" fill="#d6a040" font-weight="bold">贡献 3×2 = 6</text>
  <text x="384" y="150" font-size="9.5" fill="#888">（j₁,j₂）（j₂,j₁）…6 种</text>

  <!-- d2 row -->
  <rect x="354" y="164" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="384" y="176" font-size="11" fill="#333">d₂：m = 2 个点</text>
  <text x="384" y="194" font-size="11" fill="#446688" font-weight="bold">贡献 2×1 = 2</text>
  <text x="384" y="210" font-size="9.5" fill="#888">（k₁,k₂）（k₂,k₁）2 种</text>

  <!-- formula box -->
  <rect x="354" y="232" width="166" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="437" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">每组：m × (m−1)</text>
  <text x="437" y="268" text-anchor="middle" font-size="10" fill="#888">选 j（m 种）× 选 k（m−1 种）</text>

  <!-- total -->
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">中心 i 合计 = 6 + 2 = 8</text>
  <text x="440" y="314" text-anchor="middle" font-size="9.5" fill="#888">遍历所有点作中心，累加即答案</text>

  <!-- arrow from center to panel -->
  <path d="M 300 200 L 340 200" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="40" y="350" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="368" text-anchor="middle" font-size="10.5" fill="#a87020">距离用平方距离 dx²+dy²，避免开方与浮点误差</text>
  <text x="180" y="382" text-anchor="middle" font-size="10" fill="#888">（i, j, k）中 i 是中心，j、k 等距且 j ≠ k</text>
</svg>
