<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">类型1订单去留：取决于该客户是否有类型0订单</text>

  <!-- Left panel: customer has type 0 -->
  <rect x="24" y="54" width="250" height="264" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">客户 2 — 有类型0订单</text>
  <text x="149" y="98" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 删除她的全部类型1订单</text>

  <text x="75" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">order_id</text>
  <text x="160" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">type</text>

  <rect x="44" y="134" width="62" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="129" y="134" width="62" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="224" y="157" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="44" y="180" width="62" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>
  <rect x="129" y="180" width="62" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="224" y="203" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="44" y="236" width="212" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">类型0订单：始终保留</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">类型1订单：客户有类型0 → 删</text>

  <!-- Right panel: customer only type 1 -->
  <rect x="286" y="54" width="250" height="264" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="411" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">客户 4 — 只有类型1订单</text>
  <text x="411" y="98" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 全部保留</text>

  <text x="337" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">order_id</text>
  <text x="422" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">type</text>

  <rect x="306" y="134" width="62" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">31</text>
  <rect x="391" y="134" width="62" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="486" y="157" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="306" y="180" width="62" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">32</text>
  <rect x="391" y="180" width="62" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="486" y="203" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="306" y="236" width="212" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="412" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">客户无类型0订单</text>
  <text x="412" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">类型1订单：保留</text>

  <!-- Bottom rule box -->
  <rect x="56" y="338" width="448" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">保留 ⟺ ¬ ( type = 1 ∧ 客户存在 type = 0 订单 )</text>
</svg>
