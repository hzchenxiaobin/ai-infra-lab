<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：?zs / ubv?w / ?a</text>

  <!-- ===== 示例 1: ?zs -> azs ===== -->
  <text x="40" y="74" font-size="12" fill="#555" font-weight="bold">示例1</text>
  <!-- input: ? z s -->
  <rect x="130" y="52" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">?</text>
  <rect x="160" y="52" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="76" text-anchor="middle" font-size="14" fill="#333">z</text>
  <rect x="190" y="52" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="76" text-anchor="middle" font-size="14" fill="#333">s</text>
  <!-- arrow -->
  <path d="M 224 70 L 248 70" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="62" text-anchor="middle" font-size="9" fill="#446688">填 a</text>
  <!-- output: a z s -->
  <rect x="252" y="52" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">a</text>
  <rect x="282" y="52" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="76" text-anchor="middle" font-size="14" fill="#333">z</text>
  <rect x="312" y="52" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="76" text-anchor="middle" font-size="14" fill="#333">s</text>
  <!-- note -->
  <text x="40" y="108" font-size="11" fill="#666">i=0 为 '?': 试 'a'，右邻 'z' ≠ 'a' ✓ → 填 'a'，得 "azs"</text>

  <line x1="30" y1="120" x2="530" y2="120" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 2: ubv?w -> ubvaw ===== -->
  <text x="40" y="150" font-size="12" fill="#555" font-weight="bold">示例2</text>
  <!-- input: u b v ? w -->
  <rect x="130" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="152" text-anchor="middle" font-size="14" fill="#333">u</text>
  <rect x="160" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="152" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="190" y="128" width="28" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="152" text-anchor="middle" font-size="14" fill="#333">v</text>
  <rect x="220" y="128" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="152" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">?</text>
  <rect x="250" y="128" width="28" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="152" text-anchor="middle" font-size="14" fill="#333">w</text>
  <!-- arrow -->
  <path d="M 284 146 L 308 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="138" text-anchor="middle" font-size="9" fill="#446688">填 a</text>
  <!-- output: u b v a w -->
  <rect x="312" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="152" text-anchor="middle" font-size="14" fill="#333">u</text>
  <rect x="342" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="152" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="372" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="152" text-anchor="middle" font-size="14" fill="#333">v</text>
  <rect x="402" y="128" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="152" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">a</text>
  <rect x="432" y="128" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="152" text-anchor="middle" font-size="14" fill="#333">w</text>
  <!-- note -->
  <text x="40" y="184" font-size="11" fill="#666">i=3 为 '?': 试 'a'，左 'v'≠'a' 且 右 'w'≠'a' ✓ → 填 'a'，得 "ubvaw"</text>

  <line x1="30" y1="196" x2="530" y2="196" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 示例 3 (highlighted): ?a -> ba ===== -->
  <rect x="30" y="204" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="230" font-size="12" fill="#b85450" font-weight="bold">示例3</text>
  <!-- input: ? a -->
  <rect x="130" y="212" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="236" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">?</text>
  <rect x="160" y="212" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="236" text-anchor="middle" font-size="14" fill="#333">a</text>
  <!-- arrow -->
  <path d="M 194 230 L 218 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="222" text-anchor="middle" font-size="9" fill="#446688">填 b</text>
  <!-- output: b a -->
  <rect x="222" y="212" width="28" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="236" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">b</text>
  <rect x="252" y="212" width="28" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="236" text-anchor="middle" font-size="14" fill="#333">a</text>
  <!-- failed attempt marker -->
  <text x="300" y="228" font-size="11" fill="#b85450" font-weight="bold">试 'a' ✗ (右邻='a')</text>
  <text x="300" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">试 'b' ✓</text>
  <!-- note -->
  <text x="40" y="272" font-size="11" fill="#b85450">i=0 为 '?': 试 'a' → 右邻 'a'=='a' ✗；试 'b' → 右邻 'a'≠'b' ✓ → 填 'b'，得 "ba"</text>

  <!-- Conclusion box -->
  <rect x="80" y="290" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结论：必须同时检查左右邻居</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#555">每个 '?' 选首个与两侧都不同的字母即可</text>
</svg>
