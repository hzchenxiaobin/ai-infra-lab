<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：保留 非递减前缀 + 非递减后缀，删除中间子数组</text>

  <!-- ===== Original array ===== -->
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原数组 arr</text>

  <!-- prefix boxes (green) 1,2,3,10 -->
  <rect x="40" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="86" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="132" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="178" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <!-- middle boxes (red) 4,2 -->
  <rect x="224" y="70" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <rect x="270" y="70" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- suffix boxes (blue) 3,5 -->
  <rect x="316" y="70" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="362" y="70" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- region labels -->
  <text x="131" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">非递减前缀 arr[0..i]</text>
  <text x="269" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删除段</text>
  <text x="361" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">非递减后缀 arr[j..n−1]</text>

  <!-- brace below prefix -->
  <path d="M 40 130 Q 40 138 50 138 L 200 138 Q 222 138 222 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="131" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a">i = 3</text>

  <!-- brace below middle -->
  <path d="M 224 130 Q 224 138 234 138 L 280 138 Q 314 138 314 146" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="269" y="152" text-anchor="middle" font-size="9" fill="#b85450">要删除</text>

  <!-- brace below suffix -->
  <path d="M 316 130 Q 316 138 326 138 L 384 138 Q 406 138 406 146" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="361" y="152" text-anchor="middle" font-size="9" fill="#446688">j = 5</text>

  <!-- arrow: remove middle -->
  <path d="M 269 168 L 269 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="188" text-anchor="middle" font-size="10" fill="#b85450">删除</text>

  <!-- ===== Result array ===== -->
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">剩余数组（须整体非递减）</text>

  <rect x="86" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="132" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="178" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="224" y="232" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="270" y="232" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <text x="200" y="282" text-anchor="middle" font-size="10" fill="#888">前缀尾 3 ≤ 后缀头 3 → 拼接合法</text>

  <!-- ===== Key observation box ===== -->
  <rect x="40" y="298" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键：枚举前缀保留长度 k，找后缀中首个 arr[l] ≥ arr[k]</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">保留 arr[0..k] + arr[l..n−1]，删除 l − k − 1 个元素</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">前缀、后缀各自有序 → 双指针 O(n) 合并</text>
</svg>
