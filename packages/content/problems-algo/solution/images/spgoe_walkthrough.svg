<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：grid 5×3，k=1，答案 6</text>
  <path d="M 200 36 Q 360 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- grid 5 rows x 3 cols, cell 44px, origin (60,60) -->
  <!-- row 0: 0 0 0 -->
  <g font-size="14" filter="url(#sk)">
    <rect x="60" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/><text x="82" y="88" text-anchor="middle" fill="#2e6e2e" font-weight="bold">S</text>
    <rect x="104" y="60" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="126" y="88" text-anchor="middle" fill="#888">0</text>
    <rect x="148" y="60" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="170" y="88" text-anchor="middle" fill="#888">0</text>
  </g>
  <!-- row 1: 1 1 0 -->
  <g font-size="14" filter="url(#sk)">
    <rect x="60" y="104" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="82" y="132" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="104" y="104" width="44" height="44" fill="#fce4ec" stroke="#b85450"/><text x="126" y="132" text-anchor="middle" fill="#b03a3a">1</text>
    <rect x="148" y="104" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="170" y="132" text-anchor="middle" fill="#888">0</text>
  </g>
  <!-- row 2: 0 0 0 -->
  <g font-size="14" filter="url(#sk)">
    <rect x="60" y="148" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="82" y="176" text-anchor="middle" fill="#888">0</text>
    <rect x="104" y="148" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="126" y="176" text-anchor="middle" fill="#888">0</text>
    <rect x="148" y="148" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="170" y="176" text-anchor="middle" fill="#888">0</text>
  </g>
  <!-- row 3: 0 1 1 -->
  <g font-size="14" filter="url(#sk)">
    <rect x="60" y="192" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="82" y="220" text-anchor="middle" fill="#888">0</text>
    <rect x="104" y="192" width="44" height="44" fill="#fce4ec" stroke="#b85450"/><text x="126" y="220" text-anchor="middle" fill="#b03a3a">1</text>
    <rect x="148" y="192" width="44" height="44" fill="#fce4ec" stroke="#b85450"/><text x="170" y="220" text-anchor="middle" fill="#b03a3a">1</text>
  </g>
  <!-- row 4: 0 0 0 -->
  <g font-size="14" filter="url(#sk)">
    <rect x="60" y="236" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="82" y="264" text-anchor="middle" fill="#888">0</text>
    <rect x="104" y="236" width="44" height="44" fill="#eaf6ee" stroke="#bbb"/><text x="126" y="264" text-anchor="middle" fill="#888">0</text>
    <rect x="148" y="236" width="44" height="44" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/><text x="170" y="264" text-anchor="middle" fill="#2e6e2e" font-weight="bold">T</text>
  </g>

  <!-- path overlay: down col0 through obstacle, then across row4 -->
  <!-- S(0,0) -> (1,0)elim -> (2,0) -> (3,0) -> (4,0) -> (4,1) -> (4,2)T -->
  <path d="M 82 104 L 82 148 L 82 192 L 82 236 L 126 258 L 170 258" stroke="#2b6e9e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sk)"/>
  <!-- mark eliminated cell -->
  <g filter="url(#sk)">
    <circle cx="82" cy="126" r="9" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="36" y="130" font-size="10" fill="#b03a3a" font-weight="bold">消除</text>

  <!-- step numbers along path -->
  <g font-size="10" fill="#2b6e9e" font-weight="bold">
    <text x="40" y="86">①</text>
    <text x="40" y="176">③</text>
    <text x="40" y="220">④</text>
    <text x="40" y="264">⑤</text>
    <text x="100" y="252">⑥</text>
  </g>
  <text x="40" y="130" font-size="10" fill="#2b6e9e" font-weight="bold">②</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="180" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="130" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">图例</text>
  <g font-size="10" fill="#444">
    <rect x="54" y="332" width="14" height="14" fill="#e6f4ea" stroke="#4a8e4a" filter="url(#sk)"/>
    <text x="74" y="344">起点 S / 终点 T</text>
    <rect x="54" y="350" width="14" height="14" fill="#fce4ec" stroke="#b85450" filter="url(#sk)"/>
    <text x="74" y="362">障碍 1</text>
    <circle cx="61" cy="378" r="6" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
    <text x="74" y="382">被消除的障碍</text>
  </g>

  <!-- step table on right -->
  <g filter="url(#sk)">
    <rect x="270" y="60" width="430" height="340" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="485" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">逐步行进（BFS 层数 = 步数）</text>
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="288" y="112" font-weight="bold" fill="#2b2b2b">步  位置      k_left  动作</text>
    <text x="288" y="136"> 0  (0,0)        1     起点</text>
    <text x="288" y="158" fill="#b03a3a" font-weight="bold"> 1  (1,0)        0     消除障碍①</text>
    <text x="288" y="180"> 2  (2,0)        0     走空格</text>
    <text x="288" y="202"> 3  (3,0)        0     走空格</text>
    <text x="288" y="224"> 4  (4,0)        0     走空格</text>
    <text x="288" y="246"> 5  (4,1)        0     走空格</text>
    <text x="288" y="268" fill="#2e6e2e" font-weight="bold"> 6  (4,2)        0     到达 T ✓</text>
  </g>
  <path d="M 288 280 L 470 280" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>
  <g font-size="11" fill="#444">
    <text x="288" y="304">BFS 第 steps 层首次到达 T，即返回 steps。</text>
    <text x="288" y="324">每步只走 1 格，steps=6 为最短。</text>
    <text x="288" y="352" fill="#7a5415" font-weight="bold">为何不走右侧 (3,2) 障碍路？</text>
    <text x="288" y="372">同样 6 步且也花 1 次消除，</text>
    <text x="288" y="388">BFS 两条路同层到达，取其一即可。</text>
  </g>
</svg>
