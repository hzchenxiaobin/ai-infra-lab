<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ops = ["5","2","C","D","+"]，求和 = 30</text>

  <!-- table header -->
  <text x="26" y="56" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="80" y="56" font-size="12" fill="#444" font-weight="bold">op</text>
  <text x="170" y="56" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="460" y="56" font-size="12" fill="#444" font-weight="bold">栈状态（左底→右顶）</text>

  <line x1="20" y1="62" x2="624" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 5 -->
  <text x="26" y="82" font-size="11" fill="#333">1</text>
  <text x="80" y="82" font-size="11" fill="#446688" font-weight="bold">"5"</text>
  <text x="170" y="82" font-size="11" fill="#446688">push(5)</text>
  <rect x="460" y="70" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 2: 2 -->
  <text x="26" y="112" font-size="11" fill="#333">2</text>
  <text x="80" y="112" font-size="11" fill="#446688" font-weight="bold">"2"</text>
  <text x="170" y="112" font-size="11" fill="#446688">push(2)</text>
  <rect x="460" y="100" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="502" y="100" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="522" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row 3: C -->
  <text x="26" y="142" font-size="11" fill="#333">3</text>
  <text x="80" y="142" font-size="11" fill="#b85450" font-weight="bold">"C"</text>
  <text x="170" y="142" font-size="11" fill="#b85450" font-weight="bold">pop() → 移除 2</text>
  <rect x="460" y="130" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 4: D -->
  <text x="26" y="172" font-size="11" fill="#333">4</text>
  <text x="80" y="172" font-size="11" fill="#d6a040" font-weight="bold">"D"</text>
  <text x="170" y="172" font-size="11" fill="#446688" font-weight="bold">push(2×5=10)</text>
  <rect x="460" y="160" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="502" y="160" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="522" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- Row 5: + -->
  <text x="26" y="202" font-size="11" fill="#333">5</text>
  <text x="80" y="202" font-size="11" fill="#d6a040" font-weight="bold">"+"</text>
  <text x="170" y="202" font-size="11" fill="#446688" font-weight="bold">push(5+10=15)</text>
  <rect x="460" y="190" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="502" y="190" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="522" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <rect x="544" y="190" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="564" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <line x1="20" y1="216" x2="624" y2="216" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="232" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终求和：5 + 10 + 15 = 30 ⭐</text>
  <text x="320" y="266" text-anchor="middle" font-size="10" fill="#888">"C" 撤销 2、"D" 复制并翻倍 5 得 10、"+" 取前两项 5 与 10 求和得 15</text>

  <!-- insight box -->
  <rect x="60" y="284" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">"前两项"指入栈后的最新两项，不是操作流中的相邻两个 op</text>
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#888">"D"/"+" 只读不弹，"C" 才真删；末尾统一求和，无需边算边累加</text>
</svg>
