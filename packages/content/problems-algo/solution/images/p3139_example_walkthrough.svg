<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,3,3,3,5]，c₁ = 2，c₂ = 1，枚举 T ∈ [5, 8]</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 5，mx = 5，mn = 2，Σ = 16：S = 5T − 16，d = T − 2，p = min(⌊S/2⌋, S−d)</text>

  <!-- 表头 -->
  <rect x="21" y="52" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="61" y="52" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="123" y="52" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="52" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="231" y="52" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="289" y="52" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="323" y="52" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="387" y="52" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="41" y="70" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="92" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">S=5T−16</text>
  <text x="149" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">d=T−2</text>
  <text x="203" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">S−d</text>
  <text x="260" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">⌊S/2⌋</text>
  <text x="306" y="70" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="355" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">零售 S−2p</text>
  <text x="443" y="70" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开销 C</text>

  <!-- 行 1：T=5（最优，高亮） -->
  <rect x="21" y="80" width="478" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="41" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="92" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="149" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="203" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="260" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="306" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="355" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="443" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 ← 最优</text>

  <!-- 行 2：T=6 -->
  <rect x="21" y="114" width="478" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="41" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="92" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="149" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="203" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="306" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="355" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="443" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- 行 3：T=7 -->
  <rect x="21" y="148" width="478" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="41" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="92" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">19</text>
  <text x="149" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="203" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="260" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="306" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="355" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="443" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 + 2 = 11</text>

  <!-- 行 4：T=8 -->
  <rect x="21" y="182" width="478" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="41" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="92" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">24</text>
  <text x="149" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="203" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18</text>
  <text x="260" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="306" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="355" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="443" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>

  <text x="260" y="238" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">红字 = 瓶颈：本例全程 ⌊S/2⌋（总量瓶颈）说了算，T = mx 已是坑底</text>

  <!-- 例 1 -->
  <rect x="30" y="252" width="225" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="142" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">例 1：[4,1]，c₁=5，c₂=2</text>
  <text x="142" y="289" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">T=4 时 S−d = 0 → 配对上界为 0</text>
  <text x="142" y="306" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">一次批发都做不了，全零售 3×5 = 15</text>

  <!-- 例 3 -->
  <rect x="270" y="252" width="225" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">例 3：[3,5,3]，c₁=1，c₂=3</text>
  <text x="382" y="289" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">c₂ = 3 ≥ 2c₁ = 2 → 走全零售分支</text>
  <text x="382" y="306" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">(3×5 − 11) × 1 = 4</text>

  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">先在取模前比较出最小 C，返回时才 % (10⁹ + 7)</text>
</svg>
