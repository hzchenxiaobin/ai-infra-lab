<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后按 1,2,3,… 贪心打包，组大小与组总和都自动严格递增</text>

  <!-- Sorted label -->
  <text x="40" y="56" font-size="11.5" fill="#888">排序后 grades（升序）：</text>

  <!-- Cells: 6 cells, cell=42, x0=40, y=64 -->
  <rect x="40" y="64" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="61" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="82" y="64" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="103" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="124" y="64" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="166" y="64" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>
  <rect x="208" y="64" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="229" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12</text>
  <rect x="250" y="64" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">13</text>

  <!-- Group brackets (cups pointing up) at y=112 -->
  <path d="M40,112 Q40,124 61,124 Q82,124 82,112" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M82,112 Q82,124 124,124 Q166,124 166,112" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M166,112 Q166,124 229,124 Q292,124 292,112" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Group labels -->
  <text x="61" y="142" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">G1：1 人</text>
  <text x="61" y="156" text-anchor="middle" font-size="11" fill="#555">和 = 5</text>
  <text x="124" y="142" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">G2：2 人</text>
  <text x="124" y="156" text-anchor="middle" font-size="11" fill="#555">和 = 6+7=13</text>
  <text x="229" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">G3：3 人</text>
  <text x="229" y="156" text-anchor="middle" font-size="11" fill="#555">和 = 10+12+13=35</text>

  <!-- Strict increase note -->
  <text x="320" y="142" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 人数 1 &lt; 2 &lt; 3</text>
  <text x="320" y="158" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 总和 5 &lt; 13 &lt; 35</text>

  <!-- Reasoning hint -->
  <text x="320" y="176" font-size="10.5" fill="#999">每组元素都 ≥ 上一组，且人数更多 ⇒ 总和必更大</text>

  <!-- Reduction box -->
  <rect x="40" y="196" width="480" height="168" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">归约：组大小严格递增 ⟹ 最小组大小序列恰为 1, 2, 3, …, k</text>

  <!-- Triangular dot arrangement on left -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="252" r="4" fill="#b85450"/>
    <circle cx="100" cy="252" r="4" fill="#b85450"/>
    <circle cx="120" cy="252" r="4" fill="#b85450"/>
    <circle cx="140" cy="252" r="4" fill="#b85450"/>
    <circle cx="95" cy="238" r="4" fill="#d6a040"/>
    <circle cx="115" cy="238" r="4" fill="#d6a040"/>
    <circle cx="135" cy="238" r="4" fill="#d6a040"/>
    <circle cx="110" cy="224" r="4" fill="#4a7a3a"/>
    <circle cx="130" cy="224" r="4" fill="#4a7a3a"/>
    <circle cx="120" cy="210" r="4" fill="#446688"/>
  </g>
  <text x="120" y="276" text-anchor="middle" font-size="10.5" fill="#999">k 层三角形：第 i 行 i 个</text>

  <!-- Equations on right -->
  <text x="170" y="250" font-size="13" fill="#333">k 组至少需要</text>
  <text x="170" y="270" font-size="14" fill="#333" font-weight="bold">1 + 2 + 3 + … + k = k(k+1)/2 个学生</text>

  <line x1="60" y1="290" x2="500" y2="290" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="312" font-size="13" fill="#333">可行性上界：</text>
  <text x="170" y="312" font-size="14" fill="#b85450" font-weight="bold">k(k+1)/2 ≤ n</text>
  <text x="320" y="312" font-size="13" fill="#888">（n 为学生总数）</text>

  <text x="60" y="338" font-size="13" fill="#333">求最大 k：</text>
  <rect x="170" y="322" width="270" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="305" y="340" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">max k = ⌊(√(8n+1) − 1) / 2⌋</text>

  <!-- Arrow from upper groups to reduction -->
  <path d="M 280 178 C 280 188, 280 192, 280 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
