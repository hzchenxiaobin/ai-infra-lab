  <text x="102" y="140" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">5</text>
  <g filter="url(#sk2)"><rect x="128" y="120" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
