  <text x="246" y="140" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="272" y="120" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
