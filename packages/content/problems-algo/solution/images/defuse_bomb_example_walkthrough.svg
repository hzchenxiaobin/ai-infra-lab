<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="780" height="540" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拆炸弹：示例演算（双倍数组 + 滑窗）</text>
  <path d="M 270 42 Q 390 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= Example 1: k=3 ================= -->
  <text x="80" y="78" font-size="14" font-weight="bold" fill="#2b6e9e">示例 1：code=[5,7,1,4], k=3 → 双倍数组 [5,7,1,4,5,7,1,4]</text>
  <text x="80" y="94" font-size="10" fill="#888">蓝=当前位置 i（不参与求和），绿=窗口内 k 个元素</text>

  <!-- index header -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="102" y="112">0</text><text x="150" y="112">1</text><text x="198" y="112">2</text><text x="246" y="112">3</text>
    <text x="294" y="112">4=0</text><text x="342" y="112">5=1</text><text x="390" y="112">6=2</text><text x="438" y="112">7=3</text>
  </g>

  <!-- i=0: anchor 0, window 1,2,3 -->
  <text x="64" y="138" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">i=0</text>
