<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：weight = [900,950,800,1000,2000]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">排序后 [800,900,950,1000,2000]，篮子容量 5000</text>

  <!-- table header -->
  <rect x="40" y="64" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">步骤</text>
  <rect x="120" y="64" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">苹果w</text>
  <rect x="200" y="64" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">total+w</text>
  <rect x="300" y="64" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">≤5000?</text>
  <rect x="380" y="64" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">count</text>
  <rect x="440" y="64" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="83" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">total</text>

  <!-- row 1: 800 -->
  <rect x="40" y="94" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="120" y="94" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">800</text>
  <rect x="200" y="94" width="100" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="114" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">800</text>
  <rect x="300" y="94" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="114" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="380" y="94" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="114" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="440" y="94" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">800</text>

  <!-- row 2: 900 -->
  <rect x="40" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">2</text>
  <rect x="120" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">900</text>
  <rect x="200" y="126" width="100" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1700</text>
  <rect x="300" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="380" y="126" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <rect x="440" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="146" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1700</text>

  <!-- row 3: 950 -->
  <rect x="40" y="158" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="178" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3</text>
  <rect x="120" y="158" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">950</text>
  <rect x="200" y="158" width="100" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="178" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2650</text>
  <rect x="300" y="158" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="380" y="158" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="178" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">3</text>
  <rect x="440" y="158" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="178" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2650</text>

  <!-- row 4: 1000 -->
  <rect x="40" y="190" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="210" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">4</text>
  <rect x="120" y="190" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1000</text>
  <rect x="200" y="190" width="100" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="210" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">3650</text>
  <rect x="300" y="190" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="380" y="190" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">4</text>
  <rect x="440" y="190" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">3650</text>

  <!-- row 5: 2000 -->
  <rect x="40" y="222" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="242" text-anchor="middle" font-size="11" fill="#883a38" font-weight="bold">5</text>
  <rect x="120" y="222" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="242" text-anchor="middle" font-size="12" fill="#883a38" font-weight="bold">2000</text>
  <rect x="200" y="222" width="100" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="12" fill="#883a38" font-weight="bold">5650</text>
  <rect x="300" y="222" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 停</text>
  <rect x="380" y="222" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="242" text-anchor="middle" font-size="12" fill="#a67830" font-weight="bold">4</text>
  <rect x="440" y="222" width="80" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="242" text-anchor="middle" font-size="12" fill="#a67830" font-weight="bold">3650</text>

  <!-- basket visual -->
  <rect x="40" y="274" width="480" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#2a4a66" font-weight="bold">篮子：3650 / 5000（剩余 1350）</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#666">下一个苹果 2000 &gt; 剩余 1350 → 无法再放入</text>

  <!-- result -->
  <rect x="40" y="344" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">结果：count = 4</text>
  <text x="280" y="379" text-anchor="middle" font-size="11" fill="#555">前 4 个轻苹果总重 3650 ≤ 5000，第 5 个 2000 放不下 → 停</text>
</svg>
