<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">上下翻转二叉树：沿左脊下移，逐层重连三指针</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">原左子→新根 · 原根→新右子 · 原右子→新左子</text>

  <!-- ===== 原树 (left) ===== -->
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#888">原二叉树（左脊 1→2→4）</text>
  <g font-size="11">
    <circle cx="130" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="130" y="96" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="95" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="154" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="180" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
    <line x1="118" y1="104" x2="103" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="142" y1="104" x2="170" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="68" cy="212" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="68" y="216" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
    <circle cx="128" cy="212" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="216" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
    <line x1="84" y1="163" x2="74" y2="200" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="106" y1="163" x2="120" y2="200" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <text x="62" y="234" font-size="9" fill="#b85450" font-weight="bold">新根</text>
  <path d="M 62 238 L 66 250" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== 中间箭头 ===== -->
  <path d="M 235 152 L 345 152" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">翻转</text>
  <text x="290" y="166" text-anchor="middle" font-size="9" fill="#888">自底向上</text>

  <!-- ===== 翻转后树 (right) ===== -->
  <text x="450" y="66" text-anchor="middle" font-size="12" fill="#888">翻转后（4 为新根）</text>
  <g font-size="11">
    <circle cx="450" cy="92" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="450" y="96" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="405" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="405" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="495" cy="152" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="495" y="156" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <line x1="438" y1="104" x2="413" y2="140" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="462" y1="104" x2="485" y2="140" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="460" cy="214" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="460" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="532" cy="214" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="532" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <line x1="483" y1="165" x2="453" y2="202" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="508" y1="165" x2="525" y2="202" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- ===== 三条规则 ===== -->
  <rect x="20" y="270" width="540" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="292" font-size="11" fill="#444" font-weight="bold">每个左脊节点 node 的三步重连（node.left 为新根候选）：</text>
  <text x="40" y="312" font-size="11" fill="#444">① node.left.left ← node.right　　原右子（兄弟）→ 新左子</text>
  <text x="40" y="330" font-size="11" fill="#444">② node.left.right ← node　　　　　原根　　　 → 新右子</text>
  <text x="40" y="342" font-size="10" fill="#888">③ node.left = node.right = null　断开旧链接，防环</text>
</svg>
