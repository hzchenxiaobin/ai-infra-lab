<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：prices=[1,9,22,10,19], query=[18,4]</text>

  <!-- sorted row -->
  <text x="30" y="56" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">排序</text>
  <rect x="82" y="40" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="40" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="190" y="40" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="250" y="40" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19</text>
  <rect x="304" y="40" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>
  <path d="M 244 34 L 244 80" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="244" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=18</text>

  <!-- loss row -->
  <text x="30" y="116" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">每块loss</text>
  <rect x="82" y="100" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="100" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="190" y="100" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="250" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <rect x="304" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="382" y="120" font-size="11" fill="#999" filter="url(#rough2)">（右端 2k−p：36−19=17, 36−22=14）</text>

  <!-- option A: j=3 -->
  <rect x="40" y="160" width="280" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="180" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">方案A：左取3 + 右取1</text>
  <text x="56" y="200" font-size="12" fill="#4a7a3a" filter="url(#rough2)">左 pre[3]=1+9+10=20</text>
  <text x="56" y="218" font-size="12" fill="#d6a040" filter="url(#rough2)">右 2k−22=14</text>
  <text x="56" y="240" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">L = 20+14 = 34 ✓ 最小</text>
  <!-- highlight picks -->
  <rect x="82" y="100" width="158" height="30" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="100" width="50" height="30" fill="none" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>

  <!-- option B: j=2 -->
  <rect x="340" y="160" width="230" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="356" y="180" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案B：左取2 + 右取2</text>
  <text x="356" y="200" font-size="12" fill="#4a7a3a" filter="url(#rough2)">左 pre[2]=1+9=10</text>
  <text x="356" y="218" font-size="12" fill="#d6a040" filter="url(#rough2)">右 17+14=31</text>
  <text x="356" y="240" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">L = 10+31 = 41</text>

  <!-- arrow between -->
  <path d="M 320 208 L 340 208" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="120" y="290" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(34, 41) = 34</text>
  <text x="300" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">L(j) 随 j 单峰（凸），三分/二分找最小</text>

  <text x="30" y="372" font-size="11" fill="#999" filter="url(#rough2)">边界 ΔL(j) = prices[j] + prices[n−m+j] − 2k，单调递增 → 凸函数</text>
  <text x="30" y="390" font-size="11" fill="#999" filter="url(#rough2)">j 越大，左端拿越贵的、右端丢越贵的，边际损失递增</text>
</svg>
