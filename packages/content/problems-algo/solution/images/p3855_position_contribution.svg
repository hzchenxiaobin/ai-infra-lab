<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按位贡献：一位一位算总账，不必一个一个数</text>

  <!-- 左：例 1 竖式，列和演示 -->
  <g filter="url(#rough2)">
    <text x="147" y="46" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">例 1 竖式：l=1, r=2, k=2（m=2, S=3）</text>
    <rect x="25" y="52" width="245" height="170" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="94" y="58" width="38" height="112" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="136" y="58" width="38" height="112" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <!-- 4 行数字：11 / 12 / 21 / 22 -->
    <rect x="98" y="62" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="140" y="62" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="113" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="155" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="98" y="90" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="140" y="90" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="113" y="107" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="155" y="107" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="98" y="118" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="140" y="118" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="113" y="135" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="155" y="135" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="98" y="146" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="140" y="146" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="113" y="163" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="155" y="163" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="113" y="184" text-anchor="middle" font-size="10" fill="#8a6d1a">权重 ×10</text>
    <text x="155" y="184" text-anchor="middle" font-size="10" fill="#8a6d1a">权重 ×1</text>
    <text x="147" y="202" text-anchor="middle" font-size="11" fill="#33506b">两列列和都是 6 = S·m^(k−1) = 3×2</text>
    <text x="147" y="217" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">总和 = 6×10 + 6×1 = 6×11 = 66</text>
  </g>

  <!-- 右：对称性观察 -->
  <g filter="url(#rough2)">
    <text x="412" y="46" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">为什么每列和都一样？——对称性</text>
    <rect x="290" y="52" width="245" height="170" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="412" y="76" text-anchor="middle" font-size="11" fill="#2f5d24">固定某个数位 = d，其余 k−1 位互不干扰</text>
    <text x="412" y="94" text-anchor="middle" font-size="11" fill="#2f5d24">每位各 m = r−l+1 种选择</text>
    <text x="412" y="112" text-anchor="middle" font-size="11" fill="#2f5d24">⟹ 数字 d 在每个数位上恰出现 m^(k−1) 次</text>
    <rect x="300" y="124" width="225" height="76" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="412" y="146" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">某位数字总和 = S · m^(k−1)</text>
    <text x="412" y="166" text-anchor="middle" font-size="11" fill="#8a6d1a">S = l+(l+1)+…+r = (l+r)·m/2</text>
    <text x="412" y="188" text-anchor="middle" font-size="10.5" fill="#8a6d1a">次数与 p、d 都无关 → 才能提公因子</text>
  </g>

  <!-- 底：三因子闭式 -->
  <g filter="url(#rough2)">
    <rect x="45" y="238" width="470" height="106" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="260" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">三因子闭式 = 循环数 × 数字和 × 出现次数</text>
    <text x="280" y="286" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">ans = R(k) × S × m^(k−1)   (mod 10⁹+7)</text>
    <text x="280" y="308" text-anchor="middle" font-size="11" fill="#8a3030">R(k) = 10⁰+10¹+…+10^(k−1) = (10^k−1)/9 = 11…1（k 个 1，循环数）</text>
    <text x="280" y="330" text-anchor="middle" font-size="11" fill="#8a3030">自检：例2 → 111×1×4 = 444 ✓；例3 → R(10) ≡ 111111104，×5 → 555555520 ✓</text>
  </g>
</svg>
