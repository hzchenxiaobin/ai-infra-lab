<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 左列：查询流程 -->
  <rect x="30" y="34" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="56" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">查询 [l, r]</text>
  <path d="M 130 68 L 130 90" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="130,92 212,132 130,172 48,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">余数全同？</text>
  <text x="130" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">left[r] ≤ l ?</text>

  <path d="M 212 132 L 240 132" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="243" y="116" width="66" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <path d="M 130 172 L 130 192" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="139" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="30" y="196" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">主席树版本差 root[r+1] − root[l]</text>
  <text x="130" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下走找第 ⌈m/2⌉ 小 med</text>
  <path d="M 130 242 L 130 258" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="262" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="280" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">右拐 ⇒ 左子树整棵记入账本</text>
  <text x="130" y="298" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(cntB, sumB)；叶子补上 med</text>
  <path d="M 130 308 L 130 324" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="328" width="200" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = S − 2·sumL + med·(2·cntL − m)</text>

  <!-- 右列：主席树版本链示意 -->
  <text x="417" y="40" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">主席树：前缀版本链 + 节点共享</text>

  <rect x="298" y="54" width="44" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="71" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">root[0]</text>
  <rect x="358" y="54" width="44" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="71" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">root[1]</text>
  <rect x="418" y="54" width="44" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="71" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">root[2]</text>
  <rect x="478" y="54" width="44" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="71" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">root[3]</text>

  <path d="M 342 66 L 356 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 402 66 L 416 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 66 L 476 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="349" y="90" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">+b[0]</text>
  <text x="409" y="90" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">+b[1]</text>
  <text x="469" y="90" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">+b[2]</text>

  <text x="417" y="114" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">插入 b[i] 只新建一条链（橙），其余全共享（灰）</text>

  <!-- 小树：新链高亮 -->
  <rect x="399" y="124" width="36" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="417" y="141" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新</text>

  <path d="M 417 150 L 342 178" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 417 150 L 492 178" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="324" y="178" width="36" height="26" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="342" y="195" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">共享</text>
  <rect x="474" y="178" width="36" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新</text>

  <path d="M 492 204 L 447 232" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 492 204 L 523 232" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="429" y="232" width="36" height="26" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="447" y="249" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">共享</text>
  <rect x="505" y="232" width="36" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="523" y="249" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新</text>

  <text x="417" y="284" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">节点同时维护 (cnt, sum)：cnt 找第 k 小，sum 算代价</text>

  <rect x="292" y="300" width="250" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">查询：root[r+1] 与 root[l] 同位节点</text>
  <text x="417" y="340" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">逐层作差下走，一趟 O(log D)</text>
  <text x="417" y="358" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ med 与 (cntL, sumL) 同时到手</text>
</svg>
