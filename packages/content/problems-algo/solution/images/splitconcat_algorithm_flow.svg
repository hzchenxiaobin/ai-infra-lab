<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心定向 + 枚举切点串 / 朝向 / 切点位置</text>

  <!-- 开始 -->
  <rect x="210" y="42" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 270 68 L 270 82" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 贪心定向 -->
  <rect x="150" y="84" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 贪心定向</text>
  <text x="270" y="118" text-anchor="middle" font-size="10.5" fill="#444">strs[i] ← max(strs[i], rev(strs[i]))，∀ i</text>
  <path d="M 270 124 L 270 138" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 基线 -->
  <rect x="150" y="140" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="159" text-anchor="middle" font-size="11" fill="#333">② 基线 ans ← strs[0] + ... + strs[n−1]</text>
  <path d="M 270 170 L 270 184" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环框 for i -->
  <rect x="70" y="186" width="400" height="186" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="84" y="200" font-size="11" fill="#446688" font-weight="bold">for i = 0 .. n−1  （枚举切点串）</text>

  <!-- rest -->
  <rect x="160" y="210" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#444">rest ← strs[i+1..n−1] + strs[0..i−1]</text>

  <!-- 中层循环框 for cur -->
  <rect x="100" y="250" width="340" height="112" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="114" y="264" font-size="11" fill="#d6a040" font-weight="bold">for cur ∈ { strs[i], rev(strs[i]) }</text>

  <!-- 内层循环框 for j -->
  <rect x="130" y="282" width="280" height="70" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="144" y="296" font-size="11" fill="#b85450" font-weight="bold">for j = 0 .. |cur|−1</text>

  <!-- cand 计算与更新 -->
  <rect x="146" y="304" width="248" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="321" text-anchor="middle" font-size="10.5" fill="#333">cand ← cur[j:] + rest + cur[:j]</text>
  <text x="270" y="337" text-anchor="middle" font-size="10.5" fill="#b85450">if cand &gt; ans:  ans ← cand</text>

  <!-- 返回 -->
  <path d="M 270 372 L 270 388" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="390" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="409" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
