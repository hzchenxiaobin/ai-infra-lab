<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：两表各统计优秀生（score ≥ 90）数量，CASE WHEN 三分支定胜方</text>

  <!-- ===== NewYork table (left) ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">NewYork 表</text>
  <rect x="70" y="66" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">student_id</text>
  <rect x="150" y="66" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">score</text>

  <rect x="70" y="86" width="80" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="102" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="150" y="86" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">90 ★</text>

  <rect x="70" y="108" width="80" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="150" y="108" width="60" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="124" text-anchor="middle" font-size="10" fill="#333">87</text>

  <rect x="70" y="130" width="80" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="146" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="150" y="130" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">95 ★</text>

  <rect x="80" y="168" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt = COUNT(≥90) = 2</text>

  <!-- ===== California table (right) ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">California 表</text>
  <rect x="350" y="66" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">student_id</text>
  <rect x="430" y="66" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="460" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">score</text>

  <rect x="350" y="86" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="102" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="430" y="86" width="60" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="102" text-anchor="middle" font-size="10" fill="#333">89</text>

  <rect x="350" y="108" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="124" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="430" y="108" width="60" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="124" text-anchor="middle" font-size="10" fill="#333">88</text>

  <rect x="350" y="130" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="146" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="430" y="130" width="60" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="146" text-anchor="middle" font-size="10" fill="#333">78</text>

  <rect x="360" y="168" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt = COUNT(≥90) = 0</text>

  <!-- arrows down to compare -->
  <line x1="145" y1="196" x2="282" y2="244" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <line x1="425" y1="196" x2="338" y2="244" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- compare box -->
  <rect x="210" y="240" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">CASE WHEN n1.cnt vs n2.cnt</text>

  <!-- three branches -->
  <line x1="310" y1="272" x2="180" y2="306" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="310" y1="272" x2="310" y2="306" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="310" y1="272" x2="440" y2="306" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="222" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">&gt;</text>
  <text x="310" y="298" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">=</text>
  <text x="398" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>

  <rect x="110" y="308" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="180" y="325" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">New York University</text>

  <rect x="250" y="308" width="120" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="310" y="325" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold">No Winner</text>

  <rect x="370" y="308" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="440" y="325" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">California University</text>

  <!-- bottom note -->
  <rect x="60" y="356" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="376" font-size="10.5" fill="#d6a040" font-weight="bold">关键点</text>
  <text x="76" y="392" font-size="9.5" fill="#555">① 优秀生 = score ≥ 90（含 90），用 WHERE 过滤后 COUNT(*) 即得计数</text>
  <text x="76" y="406" font-size="9.5" fill="#555">② 两表各自独立的标量 COUNT，借 FROM 子句「单行 × 单行」笛卡尔积合成一行</text>
  <text x="76" y="420" font-size="9.5" fill="#555">③ 一行上用 CASE WHEN 三分支（&gt; / &lt; / =）一次性输出胜方，无需 JOIN</text>
</svg>
