<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：扫描切分 → 递归处理中段 → 降序拼接 → 包回 1…0</text>

  <!-- Step 1: scan & split -->
  <rect x="40" y="50" width="600" height="92" fill="#eef3fb" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="13" fill="#34506e" font-weight="bold">步骤 1：用计数器 balance 扫描，切出顶层特殊子串</text>
  <text x="60" y="94" font-size="11" fill="#555">遇 '1' → balance++ ；遇 '0' → balance−−</text>
  <text x="60" y="112" font-size="11" fill="#555">每当 balance 归 0，s[start..i] 即一个完整特殊子串 → 加入 chunks，start = i+1</text>
  <text x="60" y="130" font-size="11" fill="#b85450" font-weight="bold">关键：count 归 0 的切点 = 顶层相邻特殊子串的边界（不可再分）</text>

  <!-- arrow down -->
  <path d="M 340 146 L 340 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: recurse on middle -->
  <rect x="40" y="166" width="600" height="92" fill="#eef6ef" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="190" font-size="13" fill="#2e6e2e" font-weight="bold">步骤 2：对每个子串 chunk = "1" + middle + "0" 递归处理中段</text>
  <text x="60" y="210" font-size="11" fill="#555">middle = chunk[1:-1]（去掉首 1 末 0 后的内部）</text>
  <text x="60" y="228" font-size="11" fill="#555">递归：biggest = "1" + dfs(middle) + "0"</text>
  <text x="60" y="246" font-size="11" fill="#b85450" font-weight="bold">递归到底：长度 ≤ 2（即 "10" 或空）直接返回，天然最大</text>

  <!-- arrow down -->
  <path d="M 340 260 L 340 276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort & join -->
  <rect x="40" y="280" width="600" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="13" fill="#7a5415" font-weight="bold">步骤 3：同层子串按字典序降序排序后拼接</text>
  <text x="60" y="324" font-size="11" fill="#555">chunks.sort(reverse=True)；返回 "".join(chunks)</text>
  <text x="60" y="344" font-size="11" fill="#b85450" font-weight="bold">理由：相邻交换可生成任意排列 → 直接取字典序最大排列</text>

  <!-- arrow down -->
  <path d="M 340 364 L 340 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- base case + return box -->
  <rect x="40" y="384" width="600" height="60" fill="#fdecee" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="408" font-size="13" fill="#b85450" font-weight="bold">递归出口 & 返回</text>
  <text x="60" y="428" font-size="11" fill="#555">len(s) &le; 2：返回 s（"10" 已是最小特殊串，无可交换项）</text>
  <text x="300" y="428" font-size="11" fill="#2e6e2e" font-weight="bold">dfs(s) = 降序拼接的各 "1"+dfs(中段)+"0"</text>
</svg>
