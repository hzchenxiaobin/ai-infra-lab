<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 value 聚合 weight，哈希表 O(1) 累加</text>

  <!-- ===== items1 (left) ===== -->
  <text x="122" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">items1</text>
  <!-- item [1,1] at x=30 -->
  <rect x="30" y="60" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="44" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="58" y="60" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="72" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- item [4,5] at x=94 -->
  <rect x="94" y="60" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="122" y="60" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="136" y="80" text-anchor="middle" font-size="12" fill="#333">5</text>
  <!-- item [3,8] at x=158 -->
  <rect x="158" y="60" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="186" y="60" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- ===== items2 (right) ===== -->
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">items2</text>
  <!-- item [3,1] at x=350 -->
  <rect x="350" y="60" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="364" y="80" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="378" y="60" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="392" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- item [1,5] at x=414 -->
  <rect x="414" y="60" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="428" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="442" y="60" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="456" y="80" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- small caption: left=value(蓝), right=weight(绿) -->
  <text x="122" y="104" text-anchor="middle" font-size="10" fill="#888">左=value  右=weight</text>
  <text x="410" y="104" text-anchor="middle" font-size="10" fill="#888">左=value  右=weight</text>

  <!-- ===== converging arrows into map box ===== -->
  <path d="M 122 110 L 122 140 L 200 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 410 110 L 410 140 L 360 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="134" font-size="10.5" fill="#888" font-style="italic">逐项累加</text>
  <text x="372" y="134" font-size="10.5" fill="#888" font-style="italic">逐项累加</text>

  <!-- ===== hash map aggregation box ===== -->
  <rect x="100" y="168" width="360" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">map[value] += weight（按 value 聚合）</text>

  <!-- Row1: value 1 -> 1 + 5 = 6  (merged, red) -->
  <rect x="132" y="202" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="178" y="220" text-anchor="middle" font-size="13" fill="#888">→</text>
  <text x="232" y="220" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1 + 5</text>
  <text x="296" y="220" text-anchor="middle" font-size="13" fill="#888">=</text>
  <rect x="378" y="202" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <!-- Row2: value 3 -> 8 + 1 = 9  (merged, red) -->
  <rect x="132" y="234" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="178" y="252" text-anchor="middle" font-size="13" fill="#888">→</text>
  <text x="232" y="252" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8 + 1</text>
  <text x="296" y="252" text-anchor="middle" font-size="13" fill="#888">=</text>
  <rect x="378" y="234" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>

  <!-- Row3: value 4 -> 5  (single source, green) -->
  <rect x="132" y="266" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="178" y="284" text-anchor="middle" font-size="13" fill="#888">→</text>
  <text x="232" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="296" y="284" text-anchor="middle" font-size="13" fill="#888">=</text>
  <rect x="378" y="266" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="284" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- ===== arrow to sorted output ===== -->
  <path d="M 280 300 L 280 324" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="318" font-size="10.5" fill="#888" font-style="italic">取 key 排序</text>

  <!-- ===== sorted output box ===== -->
  <rect x="100" y="326" width="360" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">按 value 升序输出 ret</text>
  <!-- result cells: [[1,6],[3,9],[4,5]] centered -->
  <rect x="188" y="354" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="202" y="372" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="216" y="354" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="230" y="372" text-anchor="middle" font-size="12" fill="#333">6</text>

  <rect x="252" y="354" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="266" y="372" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="280" y="354" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="294" y="372" text-anchor="middle" font-size="12" fill="#333">9</text>

  <rect x="316" y="354" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="344" y="354" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="358" y="372" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- bottom notes -->
  <path d="M 40 404 L 520 404" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="418" font-size="10.5" fill="#555">• value 1、3 在两个数组都出现 → 重量相加（红）；value 4 仅 items1 → 直传（绿）</text>
</svg>
