<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：解析 → 分组 → 过滤</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(N) = 遍历所有字符一次，N 为输入总长度</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: iterate paths -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 遍历每个路径字符串</text>
    <text x="54" y="100" font-size="9.5" fill="#888">for path in paths:  ——  每个字符串形如 "dir f1(c1) f2(c2) ..."</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: split by space -->
    <rect x="40" y="128" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">② 按空格切分</text>
    <text x="180" y="148" font-family="monospace" font-size="10" fill="#555">parts = path.split(' ')</text>
    <text x="54" y="166" font-size="9.5" fill="#888">parts[0] = 目录路径 dir，parts[1:] = 文件条目列表</text>
    <text x="54" y="180" font-size="9.5" fill="#d6a040">同目录下文件名唯一，无需去重</text>

    <path d="M 260 186 L 260 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: parse file entry -->
    <rect x="40" y="204" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="224" font-size="12" fill="#d6a040" font-weight="bold">③ 解析每个 file(content)</text>
    <text x="54" y="242" font-family="monospace" font-size="10" fill="#555">open = entry.index('(')</text>
    <text x="54" y="256" font-family="monospace" font-size="10" fill="#4a7a3a">filename = entry[:open]    content = entry[open+1:-1]</text>
    <text x="54" y="268" font-size="9.5" fill="#888">完整路径 = dir + "/" + filename</text>

    <path d="M 260 274 L 260 288" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: store in hash map -->
    <rect x="40" y="292" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="312" font-size="12" fill="#b85450" font-weight="bold">④ 存入哈希表</text>
    <text x="180" y="312" font-family="monospace" font-size="10" fill="#555">mp[content].append(path)</text>
    <text x="54" y="328" font-size="9.5" fill="#888">以 content 为键，同内容的完整路径归入同一列表</text>

    <path d="M 260 338 L 260 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 5: filter and return -->
    <rect x="40" y="356" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="376" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 过滤 size ≥ 2 的组并返回</text>
    <text x="54" y="392" font-size="9.5" fill="#888">只保留至少两条路径的组，即真正的重复文件组</text>

    <!-- complexity -->
    <rect x="40" y="406" width="440" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="424" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(N)  ·  空间 O(N)（哈希表存储所有路径）</text>
  </g>
</svg>
