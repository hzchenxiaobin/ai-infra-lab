<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：dict = ["abcd","acbd","aacd"]，m = 4
  </text>

  <!-- Table header -->
  <rect x="20" y="44" width="60" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="50" y="60" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">位置 i</text>
  <rect x="82" y="44" width="70" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="117" y="60" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">串 sⱼ</text>
  <rect x="154" y="44" width="50" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="179" y="60" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">s[i]</text>
  <rect x="206" y="44" width="120" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="266" y="60" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">指纹 (去掉 pos i)</text>
  <rect x="328" y="44" width="200" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="428" y="60" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">哈希表状态 / 判定</text>

  <!-- Row 1: i=0, abcd -->
  <rect x="20" y="70" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="82" y="70" width="70" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="117" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abcd</text>
  <rect x="154" y="70" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="179" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="206" y="70" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bcd</text>
  <rect x="328" y="70" width="200" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="428" y="85" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{bcd→a} 新增</text>

  <!-- Row 2: i=0, acbd -->
  <rect x="20" y="94" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="82" y="94" width="70" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="117" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acbd</text>
  <rect x="154" y="94" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="179" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="206" y="94" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cbd</text>
  <rect x="328" y="94" width="200" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="428" y="109" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+{cbd→a} 无碰撞</text>

  <!-- Row 3: i=0, aacd -->
  <rect x="20" y="118" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="82" y="118" width="70" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="117" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aacd</text>
  <rect x="154" y="118" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="179" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="206" y="118" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acd</text>
  <rect x="328" y="118" width="200" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="428" y="133" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+{acd→a} 无碰撞</text>

  <!-- Separator -->
  <line x1="20" y1="148" x2="528" y2="148" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Row 4: i=1, abcd -->
  <rect x="20" y="154" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="169" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="82" y="154" width="70" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="117" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abcd</text>
  <rect x="154" y="154" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="179" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="206" y="154" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acd</text>
  <rect x="328" y="154" width="200" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="428" y="169" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{acd→b} 新增</text>

  <!-- Row 5: i=1, acbd -->
  <rect x="20" y="178" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="193" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="82" y="178" width="70" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="117" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acbd</text>
  <rect x="154" y="178" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="179" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="206" y="178" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="266" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abd</text>
  <rect x="328" y="178" width="200" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="428" y="193" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+{abd→c} 无碰撞</text>

  <!-- Row 6: i=1, aacd — MATCH! -->
  <rect x="20" y="202" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="82" y="202" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="117" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">aacd</text>
  <rect x="154" y="202" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="179" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="206" y="202" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="266" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">acd</text>
  <rect x="328" y="202" width="200" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="428" y="217" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中! b≠a → true ✓</text>

  <!-- Highlight box around the match -->
  <rect x="206" y="154" width="120" height="70" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="165" font-size="10" fill="#4a7a3a" filter="url(#rough2)">指纹相同</text>
  <text x="335" y="178" font-size="10" fill="#4a7a3a" filter="url(#rough2)">"acd"</text>

  <!-- Explanation -->
  <rect x="30" y="244" width="500" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键发现</text>
  <text x="50" y="284" font-size="11" fill="#555" filter="url(#rough2)">
    位置 i=1 时，"abcd" 去掉 pos1 得 "acd"，"aacd" 去掉 pos1 也得 "acd" — 指纹相同！
  </text>
  <text x="50" y="300" font-size="11" fill="#555" filter="url(#rough2)">
    而 s[1] 分别为 b 和 a，字符不同 ⟹ 两串恰好只差一个字符，返回 true。
  </text>

  <!-- Note -->
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    位置 i=0 时三个串的指纹各不相同（bcd / cbd / acd），无碰撞
  </text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    位置 i=1 时第二个串的指纹 abd 不碰撞，第三个串的指纹 acd 与第一个碰撞且字符不同 → 命中
  </text>

  <!-- Complexity note -->
  <rect x="30" y="380" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    实际实现用滚动哈希 O(1) 计算指纹（上表用明文子串仅为直观演示）
  </text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    总时间 O(n·m)，空间 O(n·m)
  </text>

  <!-- Legend -->
  <rect x="30" y="436" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="446" font-size="10" fill="#888" filter="url(#rough2)">当前处理的位置</text>
  <rect x="160" y="436" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="178" y="446" font-size="10" fill="#888" filter="url(#rough2)">指纹匹配</text>
  <rect x="250" y="436" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="268" y="446" font-size="10" fill="#888" filter="url(#rough2)">命中/返回 true</text>
</svg>
