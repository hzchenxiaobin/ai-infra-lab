<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：两趟预处理 + 一趟扫描</text>

  <!-- Step 1: compute inc -->
  <rect x="110" y="58" width="340" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 正向预处理 inc[]（i: 1 → n−1）</text>
  <text x="280" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">nums[i] ≤ nums[i−1] ? inc[i]=inc[i−1]+1 : inc[i]=1</text>

  <path d="M280 120 L280 138" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: compute dec -->
  <rect x="110" y="142" width="340" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 反向预处理 dec[]（i: n−2 → 0）</text>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[i] ≤ nums[i+1] ? dec[i]=dec[i+1]+1 : dec[i]=1</text>

  <path d="M280 204 L280 222" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: scan i in [k, n-k) -->
  <rect x="110" y="226" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 遍历 i ∈ [k, n−k)</text>

  <path d="M280 278 L280 296" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,300 410,348 280,396 150,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">inc[i−1] ≥ k</text>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">且 dec[i+1] ≥ k ?</text>

  <!-- Yes branch -->
  <path d="M410 348 L456 348" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="428" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="456" y="322" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="498" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">加入 i</text>
  <text x="498" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">到 ans</text>

  <!-- No branch -->
  <path d="M280 396 L280 416" stroke="#888" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="296" y="410" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">否</text>

  <!-- loop back to step 3 -->
  <path d="M498 374 L498 436 L280 436 L280 250" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="380" y="430" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i++，继续扫描</text>

  <!-- End -->
  <rect x="110" y="466" width="340" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="496" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 返回 ans（升序自然有序）</text>
</svg>
