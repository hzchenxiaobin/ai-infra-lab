<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 3] 的全部 6 种排列</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bin：1→"1"，2→"10"，3→"11"；无论顺序，总长恒为 5 位</text>

  <!-- 表头 -->
  <rect x="45" y="50" width="430" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="66" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">顺序</text>
  <text x="210" y="66" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">分段拼接</text>
  <text x="325" y="66" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">拼接串</text>
  <text x="425" y="66" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">数值</text>

  <!-- 行 1：[3,1,2] 最大 -->
  <rect x="45" y="74" width="430" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="92" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">[3,1,2]</text>
  <text x="210" y="92" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">"11"+"1"+"10"</text>
  <text x="325" y="92" text-anchor="middle" font-size="10" fill="#2f5424" font-weight="bold" filter="url(#rough2)">11110</text>
  <text x="425" y="92" text-anchor="middle" font-size="10" fill="#2f5424" font-weight="bold" filter="url(#rough2)">30 ★</text>

  <!-- 行 2：[1,3,2] 并列最大 -->
  <rect x="45" y="102" width="430" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="120" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">[1,3,2]</text>
  <text x="210" y="120" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">"1"+"11"+"10"</text>
  <text x="325" y="120" text-anchor="middle" font-size="10" fill="#2f5424" font-weight="bold" filter="url(#rough2)">11110</text>
  <text x="425" y="120" text-anchor="middle" font-size="10" fill="#2f5424" font-weight="bold" filter="url(#rough2)">30 ★</text>

  <!-- 行 3 -->
  <rect x="45" y="130" width="430" height="28" rx="4" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="148" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[3,2,1]</text>
  <text x="210" y="148" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"11"+"10"+"1"</text>
  <text x="325" y="148" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">11101</text>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">29</text>

  <!-- 行 4 -->
  <rect x="45" y="158" width="430" height="28" rx="4" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[1,2,3]</text>
  <text x="210" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"1"+"10"+"11"</text>
  <text x="325" y="176" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">11011</text>
  <text x="425" y="176" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">27</text>

  <!-- 行 5 -->
  <rect x="45" y="186" width="430" height="28" rx="4" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[2,1,3]</text>
  <text x="210" y="204" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"10"+"1"+"11"</text>
  <text x="325" y="204" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">10111</text>
  <text x="425" y="204" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">23</text>

  <!-- 行 6 -->
  <rect x="45" y="214" width="430" height="28" rx="4" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[2,3,1]</text>
  <text x="210" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"10"+"11"+"1"</text>
  <text x="325" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">10111</text>
  <text x="425" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">23</text>

  <!-- 结论框 -->
  <rect x="45" y="250" width="430" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">最大值 = 30（[3,1,2] 与 [1,3,2] 殊途同归）</text>

  <!-- 示例 2 警示框 -->
  <rect x="45" y="292" width="430" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">示例 2 nums = [2,8,16]：最大是 [2,8,16] → "10100010000" = 1296</text>
  <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">数值降序 [16,8,2] 只拼出 1058 ——「大数放前面」的直觉靠不住！</text>
</svg>
