<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">右移 k 位 = 循环错位对齐：新位置 i ← 原下标 (i−k) mod n</text>

  <!-- matched column highlight bands (cols 1, 4, 5) -->
  <g filter="url(#rough2)">
    <rect x="164" y="46" width="52" height="116" fill="#e6f4ea" opacity="0.45" rx="4"/>
    <rect x="308" y="46" width="52" height="116" fill="#e6f4ea" opacity="0.45" rx="4"/>
    <rect x="356" y="46" width="52" height="116" fill="#e6f4ea" opacity="0.45" rx="4"/>
  </g>

  <!-- nums1 row -->
  <g filter="url(#rough2)">
    <text x="40" y="75" font-size="12" fill="#446688">nums1</text>
    <rect x="118" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="358" y="52" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="141" y="76" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="189" y="76" text-anchor="middle" font-size="14" fill="#333">4</text>
    <text x="237" y="76" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="285" y="76" text-anchor="middle" font-size="14" fill="#333">5</text>
    <text x="333" y="76" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="381" y="76" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="189" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="333" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="381" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)">
    <text x="40" y="108" font-size="10" fill="#999">下标</text>
    <text x="141" y="108" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="189" y="108" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="237" y="108" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="285" y="108" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="333" y="108" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="381" y="108" text-anchor="middle" font-size="10" fill="#999">5</text>
  </g>

  <!-- shifted nums2 row (k=3), matched cells highlighted -->
  <g filter="url(#rough2)">
    <text x="40" y="130" font-size="11" fill="#446688">nums2</text>
    <text x="40" y="146" font-size="11" fill="#446688">右移3位</text>
    <rect x="118" y="118" width="46" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="166" y="118" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="214" y="118" width="46" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="262" y="118" width="46" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="310" y="118" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="358" y="118" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="141" y="142" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="189" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5523">4</text>
    <text x="237" y="142" text-anchor="middle" font-size="14" fill="#888">6</text>
    <text x="285" y="142" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="333" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5523">3</text>
    <text x="381" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5523">1</text>
  </g>

  <!-- original nums2 row -->
  <g filter="url(#rough2)">
    <text x="40" y="241" font-size="11" fill="#d6a040">nums2</text>
    <text x="40" y="257" font-size="11" fill="#d6a040">原始</text>
    <rect x="118" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="166" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="214" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="262" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="310" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="358" y="225" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="141" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">2</text>
    <text x="189" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">3</text>
    <text x="237" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">1</text>
    <text x="285" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">2</text>
    <text x="333" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">4</text>
    <text x="381" y="249" text-anchor="middle" font-size="14" fill="#7a5c1e">6</text>
    <text x="141" y="274" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="189" y="274" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="237" y="274" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="285" y="274" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="333" y="274" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="381" y="274" text-anchor="middle" font-size="10" fill="#999">5</text>
  </g>

  <!-- element movement arrows: orig j -> shifted (j+3) mod 6 -->
  <g filter="url(#rough2)">
    <path d="M141,223 C141,196 285,188 285,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M333,223 C333,192 189,184 189,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M381,223 C381,192 237,186 237,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="46" y="188" font-size="11" fill="#446688">元素右移 3 格</text>
    <text x="46" y="204" font-size="11" fill="#446688">越过末尾绕回</text>
  </g>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="45" y="292" width="430" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">matches(k) = #{ i : nums1[i] = nums2[(i−k) mod n] }</text>
    <text x="260" y="338" text-anchor="middle" font-size="12" fill="#555">本例 k = 3：下标 1、4、5 对齐 ✓ → 答案 3</text>
    <text x="260" y="356" text-anchor="middle" font-size="12" fill="#555">枚举全部 k ∈ [0, n) 取最大即可</text>
  </g>
</svg>
