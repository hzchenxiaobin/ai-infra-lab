<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算 3：d₁=2, d₂=4, cnt1=8, cnt2=2 → 答案 M=15</text>

  <text x="40" y="48" font-size="10.5" fill="#888">lcm(2,4)=4。按“能否放入”给 [1..15] 分类：橙=共享池 C（奇数）、绿=仅 arr2、灰=两者都不能</text>

  <!-- 3 行 x 5 列 数格 -->
  <!-- 第 1 行 y=64 -->
  <rect x="40" y="64" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="82" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="82" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="132" y="64" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="174" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="174" y="100" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ arr2</text>

  <rect x="224" y="64" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="266" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <text x="266" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="316" y="64" width="84" height="44" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="358" y="84" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">4</text>
  <text x="358" y="100" text-anchor="middle" font-size="9.5" fill="#888">弃</text>

  <rect x="408" y="64" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <text x="450" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <!-- 第 2 行 y=116 -->
  <rect x="40" y="116" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="82" y="136" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <text x="82" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ arr2</text>

  <rect x="132" y="116" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="174" y="136" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>
  <text x="174" y="152" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="224" y="116" width="84" height="44" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="266" y="136" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">8</text>
  <text x="266" y="152" text-anchor="middle" font-size="9.5" fill="#888">弃</text>

  <rect x="316" y="116" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="358" y="136" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <text x="358" y="152" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="408" y="116" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">10</text>
  <text x="450" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">不用</text>

  <!-- 第 3 行 y=168 -->
  <rect x="40" y="168" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="82" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">11</text>
  <text x="82" y="204" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="132" y="168" width="84" height="44" fill="#eeeeee" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="174" y="188" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">12</text>
  <text x="174" y="204" text-anchor="middle" font-size="9.5" fill="#888">弃</text>

  <rect x="224" y="168" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="266" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">13</text>
  <text x="266" y="204" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <rect x="316" y="168" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="358" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">14</text>
  <text x="358" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a">不用</text>

  <rect x="408" y="168" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">15</text>
  <text x="450" y="204" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ arr1</text>

  <!-- 分配结果 -->
  <text x="40" y="234" font-size="11" fill="#d6a040" font-weight="bold">arr1 = {1,3,5,7,9,11,13,15}（8 个奇数，均不被 2 整除）→ 恰好 8 个 ✓</text>
  <text x="40" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">arr2 = {2,6}（不被 4 整除且不与 arr1 冲突）→ 恰好 2 个 ✓</text>

  <!-- 计数核验 -->
  <rect x="30" y="266" width="480" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="286" font-size="11" fill="#446688" font-weight="bold">可行性核验（M=15）：</text>

  <text x="44" y="306" font-size="10.5" fill="#333">A = 15 − ⌊15/2⌋ = 15 − 7 = 8 ≥ cnt1=8 ✓</text>
  <text x="44" y="322" font-size="10.5" fill="#333">B = 15 − ⌊15/4⌋ = 15 − 3 = 12 ≥ cnt2=2 ✓</text>
  <text x="44" y="338" font-size="10.5" fill="#333">并集 = 15 − ⌊15/4⌋ = 12 ≥ 8+2=10 ✓ ⇒ 可行</text>

  <text x="300" y="306" font-size="10.5" fill="#888">M=14：A=14−7=7 &lt; 8 ⇒ ① 不成立</text>
  <text x="300" y="322" font-size="10.5" fill="#888">⇒ M=14 不可行</text>
  <text x="300" y="338" font-size="11" fill="#b85450" font-weight="bold">⇒ 答案 = 15 ✓</text>

  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#888">橙=共享池 C（奇数，全部喂给 arr1）；绿=仅 arr2 可用；灰=被 lcm=4 整除，两池皆不可入</text>
</svg>
