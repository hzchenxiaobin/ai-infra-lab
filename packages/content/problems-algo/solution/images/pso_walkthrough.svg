<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4, 9, 6, 10] → true</text>

  <!-- table frame -->
  <rect x="30" y="40" width="560" height="180" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="30" y1="74" x2="590" y2="74" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="40" x2="70" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="40" x2="120" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="40" x2="180" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="40" x2="280" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="40" x2="340" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="40" x2="410" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="50" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="95" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">prev</text>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">target = x−prev</text>
  <text x="310" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选 p</text>
  <text x="375" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">新值</text>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">校验</text>

  <!-- row 0 -->
  <rect x="30" y="74" width="560" height="34" fill="#f5fbff" stroke="none" filter="url(#rough2)"/>
  <text x="50" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="95" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="96" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="310" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="375" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="500" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 &gt; 0 ✓</text>

  <!-- row 1 -->
  <text x="50" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="310" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="375" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="500" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2 &gt; 1 ✓</text>

  <!-- row 2 -->
  <rect x="30" y="142" width="560" height="34" fill="#f5fbff" stroke="none" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="310" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="500" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 &gt; 2 ✓</text>

  <!-- row 3 -->
  <text x="50" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="150" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="198" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="310" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="375" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="500" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5 &gt; 3 ✓</text>

  <!-- result -->
  <rect x="30" y="236" width="560" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">结果数组 [1, 2, 3, 5] 严格递增 → return true ⭐</text>

  <!-- counter example -->
  <rect x="30" y="290" width="560" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例：nums = [5, 8, 3] → false</text>
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=2 时 x=3，prev 已被顶到 3，target = 0 ≤ 0 → return False</text>
</svg>
