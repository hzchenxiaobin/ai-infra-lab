<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：dfs(node) 返回 (sum, cnt)，途中维护 maxAvg</text>

  <!-- 1. 入口 -->
  <rect x="210" y="46" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#333">调用 dfs(root)</text>

  <!-- 箭头到判断 -->
  <path d="M 270 78 L 270 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 判断空节点 (菱形) -->
  <polygon points="270,104 350,140 270,176 190,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#888">（叶子的空孩子）</text>

  <!-- 是 -->
  <path d="M 350 140 L 420 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="124" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="144" text-anchor="middle" font-size="11" fill="#333">return (0, 0)</text>

  <!-- 否 -->
  <path d="M 270 176 L 270 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="188" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 3. 递归左 -->
  <rect x="150" y="200" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="11" fill="#333">(lsum, lcnt) = dfs(node.left)</text>

  <path d="M 270 232 L 270 252" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 递归右 -->
  <rect x="150" y="256" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#333">(rsum, rcnt) = dfs(node.right)</text>

  <path d="M 270 288 L 270 308" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 合并 -->
  <rect x="120" y="312" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum = val + lsum + rsum</text>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt = 1 + lcnt + rcnt</text>

  <path d="M 270 356 L 270 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 更新最大 -->
  <rect x="130" y="380" width="280" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#333">maxAvg = max(maxAvg, sum / cnt)</text>

  <path d="M 270 412 L 270 428" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. 返回 -->
  <rect x="200" y="430" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="446" text-anchor="middle" font-size="11" fill="#333">return (sum, cnt)</text>

  <!-- 右侧递归标注 -->
  <text x="470" y="216" font-size="9" fill="#888">先算左子树</text>
  <text x="470" y="272" font-size="9" fill="#888">再算右子树</text>
  <text x="470" y="334" font-size="9" fill="#888">后序合并</text>
  <text x="470" y="398" font-size="9" fill="#888">顺手更新答案</text>
</svg>
