<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">右侧区间：对每个 end_i，找最小的 start_j ≥ end_i（lower_bound）</text>

  <!-- number line: origin x=80, unit=40, values 0..10 -> x = 80 + v*40 -->
  <!-- markers for starts: 1(idx2), 2(idx1), 3(idx0) -->
  <line x1="80" y1="60" x2="480" y2="60" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 480 60 L 472 56 L 472 64 Z" fill="#888" filter="url(#rough2)"/>
  <text x="490" y="64" font-size="10.5" fill="#888">start 轴</text>
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <line x1="80" y1="56" x2="80" y2="66" stroke="#888" stroke-width="1.4"/>
    <text x="80" y="50">0</text>
    <line x1="120" y1="56" x2="120" y2="66" stroke="#888" stroke-width="1.4"/>
    <text x="120" y="50">1</text>
    <line x1="160" y1="56" x2="160" y2="66" stroke="#888" stroke-width="1.4"/>
    <text x="160" y="50">2</text>
    <line x1="200" y1="56" x2="200" y2="66" stroke="#888" stroke-width="1.4"/>
    <text x="200" y="50">3</text>
    <line x1="240" y1="56" x2="240" y2="66" stroke="#888" stroke-width="1.4"/>
    <text x="240" y="50">4</text>
  </g>

  <!-- ===== Row for interval [3,4] (idx0), end=4 -> no start >= 4 -> -1 ===== -->
  <text x="20" y="100" font-size="11.5" fill="#b85450" font-weight="bold">[3,4] idx0</text>
  <rect x="200" y="86" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="10" fill="#b85450">[3,4]</text>
  <!-- end=4 dashed line -->
  <line x1="240" y1="86" x2="240" y2="120" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="246" y="116" font-size="10" fill="#d6a040">end=4</text>
  <!-- no match -->
  <text x="380" y="103" font-size="12" fill="#b85450" font-weight="bold">无 start ≥ 4 → -1</text>

  <!-- ===== Row for interval [2,3] (idx1), end=3 -> first start>=3 is 3(idx0) -> 0 ===== -->
  <text x="20" y="160" font-size="11.5" fill="#446688" font-weight="bold">[2,3] idx1</text>
  <rect x="160" y="146" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="163" text-anchor="middle" font-size="10" fill="#446688">[2,3]</text>
  <line x1="200" y1="146" x2="200" y2="184" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="206" y="180" font-size="10" fill="#d6a040">end=3</text>
  <!-- arrow from end=3 up to start marker 3 (x=200,y=60) -->
  <path d="M 200 70 L 200 142" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- highlight start=3 marker -->
  <circle cx="200" cy="60" r="6" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="163" font-size="12" fill="#4a7a3a" font-weight="bold">start=3(idx0) ≥ 3 → 0</text>

  <!-- ===== Row for interval [1,2] (idx2), end=2 -> first start>=2 is 2(idx1) -> 1 ===== -->
  <text x="20" y="220" font-size="11.5" fill="#446688" font-weight="bold">[1,2] idx2</text>
  <rect x="120" y="206" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="223" text-anchor="middle" font-size="10" fill="#446688">[1,2]</text>
  <line x1="160" y1="206" x2="160" y2="244" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="166" y="240" font-size="10" fill="#d6a040">end=2</text>
  <!-- arrow up to start marker 2 (x=160,y=60) -->
  <path d="M 160 70 L 160 202" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <circle cx="160" cy="60" r="6" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="223" font-size="12" fill="#4a7a3a" font-weight="bold">start=2(idx1) ≥ 2 → 1</text>

  <!-- starts legend: which value belongs to which original idx -->
  <rect x="40" y="268" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="288" font-size="12" fill="#333" font-weight="bold">起点（唯一，排序后）：</text>
  <text x="220" y="288" font-size="12" fill="#446688">start=1→idx2</text>
  <text x="300" y="288" font-size="12" fill="#446688">start=2→idx1</text>
  <text x="380" y="288" font-size="12" fill="#446688">start=3→idx0</text>
  <text x="56" y="302" font-size="10.5" fill="#888">每个 end_i 在这条有序起点轴上做 lower_bound，找到的最小起点即右侧区间</text>

  <!-- key takeaway -->
  <rect x="40" y="324" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心转化：把「找右侧区间」变成「在有序起点数组上做 lower_bound」</text>
  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#555">ans[i] = 起点数组中第一个 start_j ≥ end_i 的原始下标；找不到则 -1</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#888">⚠️ 起点 start_i 各不相同 → start → idx 是一一映射，可直接哈希回查</text>
</svg>
