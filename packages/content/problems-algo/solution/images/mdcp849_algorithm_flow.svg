<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次遍历求最近人距离，再取 max</text>

  <!-- Step 1: init -->
  <rect x="190" y="46" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#444">ans=[n]*n（∞），last=-1</text>

  <path d="M 300 90 L 300 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: forward loop -->
  <rect x="120" y="108" width="360" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 正向扫描 i = 0 → n−1</text>
  <text x="300" y="148" text-anchor="middle" font-size="11" fill="#444">若 seats[i]==1：last = i</text>
  <text x="300" y="166" text-anchor="middle" font-size="11" fill="#444">若 last != −1：ans[i] = i − last</text>
  <text x="300" y="182" text-anchor="middle" font-size="10" fill="#888">（写入「到左侧最近人的距离」）</text>

  <path d="M 300 190 L 300 204" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: reset -->
  <rect x="220" y="208" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 重置 last = −1</text>

  <path d="M 300 246 L 300 260" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: backward loop -->
  <rect x="120" y="264" width="360" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 反向扫描 i = n−1 → 0</text>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#444">若 seats[i]==1：last = i</text>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#444">若 last != −1：ans[i] = min(ans[i], last−i)</text>
  <text x="300" y="338" text-anchor="middle" font-size="10" fill="#888">（取「右侧最近人距离」的较小值）</text>

  <path d="M 300 346 L 300 360" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return max -->
  <rect x="190" y="364" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 max(ans)</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#888">（821 到此为止返回 ans，849 多一步取最大）</text>

  <!-- side notes -->
  <rect x="40" y="108" width="68" height="78" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="74" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">正向</text>
  <text x="74" y="146" text-anchor="middle" font-size="9" fill="#666">左侧</text>
  <text x="74" y="160" text-anchor="middle" font-size="9" fill="#666">最近人</text>
  <text x="74" y="178" text-anchor="middle" font-size="9" fill="#666">i−last</text>

  <rect x="492" y="264" width="68" height="78" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="526" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">反向</text>
  <text x="526" y="302" text-anchor="middle" font-size="9" fill="#666">右侧</text>
  <text x="526" y="316" text-anchor="middle" font-size="9" fill="#666">最近人</text>
  <text x="526" y="334" text-anchor="middle" font-size="9" fill="#666">last−i</text>

  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键三细节：ans 初值 = n（∞）· 反向前重置 last · last≠−1 守卫</text>
  <text x="300" y="448" text-anchor="middle" font-size="10" fill="#888">与 821 完全一致，只末尾把 return ans 换成 return max(ans)</text>
</svg>
