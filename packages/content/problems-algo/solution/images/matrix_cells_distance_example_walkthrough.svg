<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：2×3 矩阵，中心 (1,2)，BFS 逐层扩展</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">格子内：大字=距离 d，角标圆=出队步骤序号</text>

  <!-- Left: 2x3 grid -->
  <g filter="url(#rough2)" font-size="18" font-weight="bold">
    <!-- col headers -->
    <text x="66" y="64" text-anchor="middle" font-size="10" fill="#888">col0</text>
    <text x="118" y="64" text-anchor="middle" font-size="10" fill="#888">col1</text>
    <text x="170" y="64" text-anchor="middle" font-size="10" fill="#888">col2</text>
    <!-- row headers -->
    <text x="28" y="100" text-anchor="middle" font-size="10" fill="#888">row0</text>
    <text x="28" y="152" text-anchor="middle" font-size="10" fill="#888">row1</text>

    <!-- (0,0) d=3 step⑥ pink -->
    <rect x="40" y="76" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="66" y="108" text-anchor="middle" fill="#b85450">3</text>
    <circle cx="84" cy="84" r="8" fill="#b85450"/>
    <text x="84" y="87" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">⑥</text>

    <!-- (0,1) d=2 step④ blue -->
    <rect x="92" y="76" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="118" y="108" text-anchor="middle" fill="#446688">2</text>
    <circle cx="136" cy="84" r="8" fill="#446688"/>
    <text x="136" y="87" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">④</text>

    <!-- (0,2) d=1 step② green -->
    <rect x="144" y="76" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="108" text-anchor="middle" fill="#4a7a3a">1</text>
    <circle cx="188" cy="84" r="8" fill="#4a7a3a"/>
    <text x="188" y="87" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">②</text>

    <!-- (1,0) d=2 step⑤ blue -->
    <rect x="40" y="128" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="66" y="160" text-anchor="middle" fill="#446688">2</text>
    <circle cx="84" cy="136" r="8" fill="#446688"/>
    <text x="84" y="139" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">⑤</text>

    <!-- (1,1) d=1 step③ green -->
    <rect x="92" y="128" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="118" y="160" text-anchor="middle" fill="#4a7a3a">1</text>
    <circle cx="136" cy="136" r="8" fill="#4a7a3a"/>
    <text x="136" y="139" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">③</text>

    <!-- (1,2) d=0 step① orange (center) -->
    <rect x="144" y="128" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="170" y="160" text-anchor="middle" fill="#d6a040">0</text>
    <circle cx="188" cy="136" r="8" fill="#d6a040"/>
    <text x="188" y="139" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">①</text>
  </g>

  <!-- BFS arrows showing expansion order -->
  <g filter="url(#rough2)">
    <!-- ①(1,2) -> ②(0,2): up -->
    <path d="M 170 128 L 170 88" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)"/>
    <!-- ①(1,2) -> ③(1,1): left -->
    <path d="M 144 154 L 144 154 L 120 154" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" transform="translate(-6,0)"/>
    <!-- ②(0,2) -> ④(0,1): left -->
    <path d="M 144 102 L 120 102" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)"/>
    <!-- ③(1,1) -> ⑤(1,0): left -->
    <path d="M 92 154 L 68 154" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)"/>
    <!-- ④(0,1) -> ⑥(0,0): left -->
    <path d="M 92 102 L 68 102" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  </g>

  <!-- Right: step table -->
  <g filter="url(#rough2)" font-size="10">
    <!-- Header -->
    <rect x="230" y="60" width="290" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="248" y="77" text-anchor="middle" fill="#555" font-weight="bold">步</text>
    <text x="296" y="77" text-anchor="middle" fill="#555" font-weight="bold">出队</text>
    <text x="350" y="77" text-anchor="middle" fill="#555" font-weight="bold">d</text>
    <text x="430" y="77" text-anchor="middle" fill="#555" font-weight="bold">入队邻居</text>

    <!-- Step 1 -->
    <rect x="230" y="88" width="290" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" opacity="0.7"/>
    <circle cx="248" cy="101" r="7" fill="#d6a040"/>
    <text x="248" y="104" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">1</text>
    <text x="296" y="105" text-anchor="middle" fill="#333" font-family="monospace">(1,2)</text>
    <text x="350" y="105" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <text x="430" y="105" text-anchor="middle" fill="#4a7a3a" font-family="monospace">(0,2),(1,1)</text>

    <!-- Step 2 -->
    <rect x="230" y="116" width="290" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" opacity="0.6"/>
    <circle cx="248" cy="129" r="7" fill="#4a7a3a"/>
    <text x="248" y="132" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">2</text>
    <text x="296" y="133" text-anchor="middle" fill="#333" font-family="monospace">(0,2)</text>
    <text x="350" y="133" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="430" y="133" text-anchor="middle" fill="#4a7a3a" font-family="monospace">(0,1)</text>

    <!-- Step 3 -->
    <rect x="230" y="144" width="290" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" opacity="0.6"/>
    <circle cx="248" cy="157" r="7" fill="#4a7a3a"/>
    <text x="248" y="160" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">3</text>
    <text x="296" y="161" text-anchor="middle" fill="#333" font-family="monospace">(1,1)</text>
    <text x="350" y="161" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="430" y="161" text-anchor="middle" fill="#4a7a3a" font-family="monospace">(1,0)</text>

    <!-- Step 4 -->
    <rect x="230" y="172" width="290" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.6"/>
    <circle cx="248" cy="185" r="7" fill="#446688"/>
    <text x="248" y="188" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">4</text>
    <text x="296" y="189" text-anchor="middle" fill="#333" font-family="monospace">(0,1)</text>
    <text x="350" y="189" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="430" y="189" text-anchor="middle" fill="#4a7a3a" font-family="monospace">(0,0)</text>

    <!-- Step 5 -->
    <rect x="230" y="200" width="290" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.6"/>
    <circle cx="248" cy="213" r="7" fill="#446688"/>
    <text x="248" y="216" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">5</text>
    <text x="296" y="217" text-anchor="middle" fill="#333" font-family="monospace">(1,0)</text>
    <text x="350" y="217" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="430" y="217" text-anchor="middle" fill="#999" font-family="monospace">—</text>

    <!-- Step 6 -->
    <rect x="230" y="228" width="290" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.6"/>
    <circle cx="248" cy="241" r="7" fill="#b85450"/>
    <text x="248" y="244" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">6</text>
    <text x="296" y="245" text-anchor="middle" fill="#333" font-family="monospace">(0,0)</text>
    <text x="350" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="430" y="245" text-anchor="middle" fill="#999" font-family="monospace">—</text>
  </g>

  <!-- Result box -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="270" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="270" y="288" text-anchor="middle" fill="#d6a040" font-weight="bold">✓ 最终结果 res =</text>
    <text x="270" y="304" text-anchor="middle" fill="#333" font-family="monospace" font-size="11">[(1,2), (0,2), (1,1), (0,1), (1,0), (0,0)]</text>
  </g>

  <!-- Distance sequence -->
  <g filter="url(#rough2)" font-size="10">
    <text x="270" y="332" text-anchor="middle" fill="#888">距离序列 = [0, 1, 1, 2, 2, 3] ✓ 单调不减 → 满足题意</text>
    <text x="270" y="348" text-anchor="middle" fill="#888" font-size="9">虚线箭头 = BFS 扩展方向（从已出队格子扩展到未访问邻居）</text>
  </g>
</svg>
