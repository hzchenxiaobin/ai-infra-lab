<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 搜索：每次比较淘汰一侧子树</text>

  <!-- 目标值 val -->
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#888">目标值</text>
  <rect x="60" y="72" width="56" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val</text>
  <path d="M 118 87 L 254 87" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="80" text-anchor="middle" font-size="10" fill="#d6a040">比较</text>

  <!-- 当前节点 cur -->
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#446688">当前节点 cur</text>
  <circle cx="280" cy="87" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cur</text>

  <!-- 三条分支箭头 -->
  <path d="M 266 104 Q 195 165 112 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 108 L 280 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 104 Q 365 165 448 212" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支条件标签 -->
  <text x="168" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">val &lt; cur.val</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">val = cur.val</text>
  <text x="392" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">val &gt; cur.val</text>

  <!-- ① 走左子树 -->
  <rect x="30" y="220" width="165" height="145" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="112" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 走左子树</text>
  <text x="112" y="268" text-anchor="middle" font-size="10" fill="#555">左子树值全部 &lt; cur.val</text>
  <text x="112" y="284" text-anchor="middle" font-size="10" fill="#555">可能含 val，需深入</text>
  <text x="112" y="310" text-anchor="middle" font-size="10" fill="#b85450">右子树整体 &gt; val</text>
  <text x="112" y="326" text-anchor="middle" font-size="10" fill="#b85450">→ 直接淘汰</text>
  <text x="112" y="350" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">searchBST(cur.left)</text>

  <!-- ② 命中 -->
  <rect x="210" y="220" width="140" height="145" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 命中！</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#555">找到目标节点</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return cur</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#555">返回以 cur 为根</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#555">的整棵子树</text>

  <!-- ③ 走右子树 -->
  <rect x="365" y="220" width="165" height="145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="448" y="244" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 走右子树</text>
  <text x="448" y="268" text-anchor="middle" font-size="10" fill="#555">右子树值全部 &gt; cur.val</text>
  <text x="448" y="284" text-anchor="middle" font-size="10" fill="#555">可能含 val，需深入</text>
  <text x="448" y="310" text-anchor="middle" font-size="10" fill="#b85450">左子树整体 &lt; val</text>
  <text x="448" y="326" text-anchor="middle" font-size="10" fill="#b85450">→ 直接淘汰</text>
  <text x="448" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">searchBST(cur.right)</text>

</svg>
