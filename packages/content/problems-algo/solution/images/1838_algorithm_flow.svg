<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 双指针滑动窗口</text>

  <!-- Step 1: sort -->
  <rect x="160" y="44" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 排序 nums（升序）</text>

  <path d="M260 80 L260 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="150" y="100" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② left=0, s=0, ans=0</text>

  <path d="M260 136 L260 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: for right -->
  <rect x="120" y="156" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ for right = 0 .. n-1：</text>

  <path d="M260 192 L260 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: s += nums[right] -->
  <rect x="130" y="212" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s += nums[right]</text>

  <path d="M260 248 L260 264" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: cost > k ? -->
  <polygon points="260,268 390,312 260,356 130,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价 &gt; k ?</text>
  <text x="260" y="320" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">nums[right]×len − s &gt; k</text>

  <!-- Yes branch: shrink left -->
  <path d="M130 312 L70 312 L70 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="304" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="20" y="364" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="384" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">s -= nums[left]</text>
  <text x="70" y="400" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">left++</text>

  <!-- loop back to decision -->
  <path d="M70 364 L70 340 L130 312" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- No branch -->
  <path d="M390 312 L450 312 L450 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="428" y="304" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- update ans -->
  <rect x="396" y="364" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="386" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">更新 ans</text>

  <path d="M450 398 L450 418" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- right++ loop -->
  <rect x="372" y="422" width="156" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="444" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">right++（下一轮）</text>

  <!-- loop back to for -->
  <path d="M372 439 L300 439 L300 200 L280 200 L280 174" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- end -->
  <path d="M260 356 L260 422" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="180" y="426" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans（最大频数）</text>

  <!-- notes -->
  <text x="260" y="486" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">left 单调前进（均摊 O(n)），while 总收缩 ≤ n 次</text>
  <text x="260" y="500" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">排序 O(n log n) 为瓶颈，扫描 O(n) 均摊</text>
</svg>
