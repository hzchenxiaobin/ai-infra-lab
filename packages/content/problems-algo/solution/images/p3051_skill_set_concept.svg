<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：技能集合包含 —— S(c) ⊇ R（必备三项）⇔ 全部命中</text>

  <!-- ===== Required skills box ===== -->
  <rect x="34" y="52" width="168" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="118" y="74" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">必备技能集合 R</text>
  <rect x="56" y="86" width="124" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="102" text-anchor="middle" font-size="10.5" fill="#333">Python</text>
  <rect x="56" y="118" width="124" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="134" text-anchor="middle" font-size="10.5" fill="#333">Tableau</text>
  <rect x="56" y="150" width="124" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="166" text-anchor="middle" font-size="10.5" fill="#333">PostgreSQL</text>
  <text x="118" y="198" text-anchor="middle" font-size="10" fill="#a07820">|R| = 3</text>

  <!-- ===== Candidate rows ===== -->
  <!-- row template: id box x=232 w=54, chips from x=298, verdict at x=632 end -->

  <!-- 123 : all three -->
  <rect x="232" y="52" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">123</text>
  <rect x="298" y="62" width="54" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="77" text-anchor="middle" font-size="9.5" fill="#333">Python</text>
  <rect x="358" y="62" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="77" text-anchor="middle" font-size="9.5" fill="#333">Tableau</text>
  <rect x="420" y="62" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="77" text-anchor="middle" font-size="9.5" fill="#333">PostgreSQL</text>
  <text x="632" y="78" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 覆盖</text>

  <!-- 147 : three + Java -->
  <rect x="232" y="104" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">147</text>
  <rect x="298" y="114" width="54" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="129" text-anchor="middle" font-size="9.5" fill="#333">Python</text>
  <rect x="358" y="114" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="129" text-anchor="middle" font-size="9.5" fill="#333">Tableau</text>
  <rect x="420" y="114" width="42" height="22" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="441" y="129" text-anchor="middle" font-size="9.5" fill="#777">Java</text>
  <rect x="468" y="114" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="502" y="129" text-anchor="middle" font-size="9.5" fill="#333">PostgreSQL</text>
  <text x="632" y="130" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 覆盖</text>

  <!-- 256 : only Tableau -->
  <rect x="232" y="156" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">256</text>
  <rect x="298" y="166" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="181" text-anchor="middle" font-size="9.5" fill="#333">Tableau</text>
  <text x="632" y="182" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">✗ 缺 2 项</text>

  <!-- 234 : none -->
  <rect x="232" y="208" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">234</text>
  <rect x="298" y="218" width="28" height="22" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="312" y="233" text-anchor="middle" font-size="9.5" fill="#777">R</text>
  <rect x="332" y="218" width="58" height="22" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="361" y="233" text-anchor="middle" font-size="9.5" fill="#777">PowerBI</text>
  <rect x="396" y="218" width="68" height="22" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="233" text-anchor="middle" font-size="9.5" fill="#777">SQL Server</text>
  <text x="632" y="234" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">✗ 缺 3 项</text>

  <!-- 102 : none -->
  <rect x="232" y="260" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="259" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">102</text>
  <rect x="298" y="270" width="80" height="22" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="338" y="285" text-anchor="middle" font-size="9.5" fill="#777">DataAnalysis</text>
  <text x="632" y="286" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">✗ 缺 3 项</text>

  <!-- set inclusion arrow notes -->
  <path d="M206 96 L228 80" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="72" y="238" font-size="10" fill="#888">绿色 = 命中必备技能</text>
  <text x="72" y="254" font-size="10" fill="#888">灰色 = 与判定无关的</text>
  <text x="72" y="270" font-size="10" fill="#888">技能（可多可少）</text>

  <!-- ===== Key points ===== -->
  <rect x="30" y="312" width="600" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="329" font-size="10.5" fill="#333">① 把每人的技能看成集合 S(c)，判定条件就是集合包含：S(c) ⊇ R</text>
  <text x="48" y="345" font-size="10.5" fill="#333">② 集合包含 ⇔ 交集去重计数相等：|S(c) ∩ R| = |R| = 3，多出来的技能（如 Java）不影响</text>
</svg>
