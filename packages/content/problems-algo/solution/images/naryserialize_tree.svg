<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">序列化 N 叉树：每个节点写成「值 孩子数」→ 子树边界显式定界</text>

  <!-- 原树 -->
  <text x="110" y="54" text-anchor="middle" font-size="12" fill="#888">原树（N 叉）</text>
  <circle cx="110" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="55" cy="148" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <circle cx="110" cy="148" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="165" cy="148" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="11" fill="#333">4</text>
  <line x1="98" y1="92" x2="64" y2="136" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="110" y1="95" x2="110" y2="134" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="122" y1="92" x2="156" y2="136" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="32" cy="214" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="32" y="218" text-anchor="middle" font-size="10" fill="#333">5</text>
  <circle cx="78" cy="214" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="218" text-anchor="middle" font-size="10" fill="#333">6</text>
  <line x1="44" y1="160" x2="28" y2="202" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="66" y1="160" x2="72" y2="202" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 箭头 -->
  <path d="M 210 148 L 285 148" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="247" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前序遍历</text>
  <text x="247" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">写 值+孩子数</text>

  <!-- 序列化字符串 -->
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#888">序列化字符串</text>
  <rect x="300" y="64" width="260" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1 3  3 2  5 0  6 0  2 0  4 0</text>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#888">每对 token = (值, 孩子数)</text>

  <!-- 反序列化 -->
  <path d="M 430 122 L 430 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="154" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反序列化：读 值 与 孩子数 k</text>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#555">递归建 k 个孩子</text>

  <path d="M 430 198 L 430 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 重建树 -->
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#888">重建出相同的树</text>
  <circle cx="430" cy="266" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="404" cy="306" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="404" y="310" text-anchor="middle" font-size="9" fill="#333">3</text>
  <circle cx="430" cy="306" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="310" text-anchor="middle" font-size="9" fill="#333">2</text>
  <circle cx="456" cy="306" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="456" y="310" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="421" y1="276" x2="408" y2="296" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="279" x2="430" y2="295" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="439" y1="276" x2="452" y2="296" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="392" cy="340" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="392" y="343" text-anchor="middle" font-size="8" fill="#333">5</text>
  <circle cx="416" cy="340" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="416" y="343" text-anchor="middle" font-size="8" fill="#333">6</text>
  <line x1="400" y1="314" x2="394" y2="332" stroke="#4a7a3a" stroke-width="0.9" filter="url(#rough2)"/>
  <line x1="410" y1="314" x2="414" y2="332" stroke="#4a7a3a" stroke-width="0.9" filter="url(#rough2)"/>

  <!-- 关键洞察 -->
  <rect x="20" y="262" width="250" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="284" font-size="12" fill="#b85450" font-weight="bold">关键：孩子数显式定界</text>
  <text x="34" y="304" font-size="11" fill="#555">→ 无需 null 标记</text>
  <text x="34" y="322" font-size="11" fill="#555">→ 子树边界由 count 决定</text>
  <text x="34" y="340" font-size="11" fill="#555">→ 单序列即可无损重建</text>
</svg>
