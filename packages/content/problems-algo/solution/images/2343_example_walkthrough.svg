<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = ["102","473","251","814"]</text>
  <text x="280" y="38" text-anchor="middle" font-size="10.5" fill="#888">queries = [[1,1],[2,3],[4,2],[1,2]]（查询号从 0 起）</text>

  <!-- Block 1: trim=1 full -->
  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">trim = 1 · pos = 2（末位）</text>

  <text x="44" y="84" font-size="10" fill="#888" filter="url(#rough2)">入序</text>
  <!-- input order [0,1,2,3] cards, each shows idx + 末位 digit -->
  <g filter="url(#rough2)">
    <rect x="179" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="199" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <text x="199" y="96" text-anchor="middle" font-size="9" fill="#888">d=2</text>
    <rect x="233" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="253" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <text x="253" y="96" text-anchor="middle" font-size="9" fill="#888">d=3</text>
    <rect x="287" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="307" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="307" y="96" text-anchor="middle" font-size="9" fill="#888">d=1</text>
    <rect x="341" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="361" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="361" y="96" text-anchor="middle" font-size="9" fill="#888">d=4</text>
  </g>

  <path d="M 280 104 L 280 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="114" font-size="9.5" fill="#666">稳定分桶 by 末位</text>

  <!-- buckets -->
  <g filter="url(#rough2)">
    <rect x="116" y="122" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="151" y="141" text-anchor="middle" font-size="10" fill="#333">桶1 → [2]</text>
    <rect x="202" y="122" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="237" y="141" text-anchor="middle" font-size="10" fill="#333">桶2 → [0]</text>
    <rect x="288" y="122" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="323" y="141" text-anchor="middle" font-size="10" fill="#333">桶3 → [1]</text>
    <rect x="374" y="122" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="409" y="141" text-anchor="middle" font-size="10" fill="#333">桶4 → [3]</text>
  </g>

  <path d="M 280 154 L 280 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="164" font-size="9.5" fill="#666">顺序收集</text>

  <!-- output order1 -->
  <text x="118" y="190" font-size="10" fill="#888" filter="url(#rough2)">order₁</text>
  <g filter="url(#rough2)">
    <rect x="179" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="199" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="233" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="253" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <rect x="287" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="307" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="341" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="361" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  </g>

  <rect x="118" y="212" width="326" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="281" y="227" text-anchor="middle" font-size="10" fill="#b85450">查询(1,1)：k=1 → order₁[0] = 2 → ans[0] = 2 ✓</text>

  <!-- Block 2: trim=2 compact -->
  <rect x="40" y="242" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="259" font-size="10.5" fill="#333" font-weight="bold">trim = 2 · pos = 1</text>
  <text x="52" y="274" font-size="9.5" fill="#555">order₁ [2,0,1,3] 各 idx 倒数第2位 → 稳定分桶 → order₂ = [0,3,2,1]</text>
  <text x="280" y="274" text-anchor="middle" font-size="9.5" fill="#b85450"></text>
  <text x="470" y="259" text-anchor="end" font-size="9.5" fill="#b85450">(4,2)→ans[2]=1；(1,2)→ans[3]=0</text>

  <!-- Block 3: trim=3 compact -->
  <rect x="40" y="290" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="307" font-size="10.5" fill="#333" font-weight="bold">trim = 3 · pos = 0</text>
  <text x="52" y="322" font-size="9.5" fill="#555">order₂ [0,3,2,1] 各 idx 首位 → 稳定分桶 → order₃ = [0,2,1,3]</text>
  <text x="470" y="322" text-anchor="end" font-size="9.5" fill="#b85450">(2,3)→ans[1]=2</text>

  <!-- final -->
  <rect x="40" y="340" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = [2, 2, 1, 0] ✓</text>
</svg>
