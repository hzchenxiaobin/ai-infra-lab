<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">示例演算：num = 3, t = 2</text>

  <!-- 表头 -->
  <rect x="40" y="50" width="440" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="190" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">x</text>
  <text x="290" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">num</text>
  <text x="400" y="70" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">差距 x−num</text>

  <!-- 初始 -->
  <rect x="40" y="82" width="440" height="36" fill="none"
        stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">初始</text>
  <text x="190" y="105" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="290" y="105" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <text x="400" y="105" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">4</text>

  <!-- 操作 1 -->
  <rect x="40" y="120" width="440" height="36" fill="#f6fff0" fill-opacity="0.6"
        stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">操作1</text>
  <text x="170" y="143" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7−1=</text>
  <text x="200" y="143" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="270" y="143" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3+1=</text>
  <text x="300" y="143" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <text x="395" y="143" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">4−2=2</text>

  <!-- 操作 2 -->
  <rect x="40" y="158" width="440" height="36" fill="#f6fff0" fill-opacity="0.6"
        stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">操作2</text>
  <text x="170" y="181" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6−1=</text>
  <text x="200" y="181" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="270" y="181" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4+1=</text>
  <text x="300" y="181" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">5</text>
  <text x="395" y="181" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2−2=0</text>

  <!-- 收敛框 -->
  <rect x="40" y="208" width="440" height="40" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">两步追平 ✓  x = 7 可达成</text>

  <!-- 对照公式 -->
  <rect x="40" y="262" width="440" height="40" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">公式：x_max = num + 2t = 3 + 2×2 = 7 ✓</text>

  <!-- 反例：8 不可达 -->
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">x=8 时初始差距 5 &gt; 2t=4，追不平 ✗</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">故 7 即为最大可达成数字</text>
</svg>
