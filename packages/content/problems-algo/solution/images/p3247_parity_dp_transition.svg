<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶计数 DP：新元素只搬运「和的奇偶」这两桶水</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">even = 偶和子序列数（含空），odd = 奇和子序列数</text>

  <!-- ============ 情形① 偶数元素 ============ -->
  <text x="34" y="70" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 来的是偶数：奇偶不变，两桶各自翻倍</text>

  <rect x="40" y="82" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="103" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">偶 even</text>

  <rect x="40" y="126" width="86" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="147" text-anchor="middle" font-size="11.5" fill="#a07830" filter="url(#rough2)">奇 odd</text>

  <path d="M 128 98 L 186 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 128 142 L 186 142" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="157" y="90" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">×2</text>
  <text x="157" y="134" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">×2</text>

  <rect x="188" y="82" width="96" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="103" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">偶 2·even</text>

  <rect x="188" y="126" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="147" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">奇 2·odd</text>

  <rect x="300" y="82" width="186" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="108" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">选或不选 x，奇偶都不变</text>
  <text x="393" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">每个旧子序列带/不带 x 各一份</text>
  <text x="393" y="148" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">→ 两桶统统 ×2</text>

  <!-- ============ 情形② 奇数元素 ============ -->
  <text x="34" y="188" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 来的是奇数：带上 x 就翻转，两桶对流</text>

  <rect x="40" y="200" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="221" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">偶 even</text>

  <rect x="40" y="256" width="86" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="277" text-anchor="middle" font-size="11.5" fill="#a07830" filter="url(#rough2)">奇 odd</text>

  <!-- 四条转移箭头：不选（直行）、+x（交叉翻转） -->
  <path d="M 128 216 L 300 216" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="214" y="208" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">不选 x（保持偶）</text>
  <path d="M 128 272 L 300 272" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="214" y="296" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">不选 x（保持奇）</text>
  <path d="M 128 232 Q 214 244 300 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 128 264 Q 214 252 300 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="214" y="250" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">带上 x 翻转！</text>

  <rect x="302" y="200" width="110" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="221" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">偶 even+odd</text>

  <rect x="302" y="256" width="110" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="277" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">奇 even+odd</text>

  <rect x="424" y="200" width="66" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="232" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">两桶持平</text>
  <text x="457" y="250" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">= 前缀总数</text>
  <text x="457" y="268" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">= 2^i</text>

  <!-- 结论 -->
  <rect x="34" y="312" width="456" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="336" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">两桶之和恒等于子序列总数 2^(i+1) —— 这正是 hints 里「奇数一来 dp[i][x] = 2^i」的来历</text>
</svg>
