<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双堆分工 —— 前窗堆管最左候选，后窗堆管最右候选</text>

  <!-- Array row: front window | middle | back window -->
  <text x="60" y="62" font-size="11.5" fill="#888">costs 数组：</text>

  <!-- front window (4 boxes) -->
  <rect x="120" y="52" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="73" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="162" y="52" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="73" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="204" y="52" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="73" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="246" y="52" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="73" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- middle (not yet in any heap) -->
  <rect x="288" y="52" width="40" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="73" text-anchor="middle" font-size="12" fill="#888">7</text>

  <!-- back window (4 boxes, drawn right-to-left conceptually but in array order) -->
  <rect x="330" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="73" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="372" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="73" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="414" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="73" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="456" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="73" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- window labels -->
  <text x="203" y="44" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">前 candidates 个</text>
  <text x="476" y="44" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">后 candidates 个</text>
  <text x="308" y="44" text-anchor="middle" font-size="10" fill="#888">中间·待入堆</text>

  <!-- left / right pointers -->
  <text x="308" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">left ↑</text>
  <text x="308" y="116" text-anchor="middle" font-size="10" fill="#888">↑ right（left&gt;right 时中间耗尽）</text>

  <!-- arrows from windows to heaps -->
  <path d="M 200 92 Q 140 120 120 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 476 92 Q 470 120 440 158" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Front heap -->
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">前窗堆 front（小顶堆）</text>
  <rect x="76" y="162" width="88" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(2, 下标3) ← 堆顶</text>
  <rect x="84" y="190" width="72" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="10" fill="#555">(10,2)</text>
  <rect x="92" y="214" width="56" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="9.5" fill="#777">(12,1)…</text>

  <!-- Back heap -->
  <text x="440" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后窗堆 back（小顶堆）</text>
  <rect x="396" y="162" width="88" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(2, 下标5) ← 堆顶</text>
  <rect x="404" y="190" width="72" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="10" fill="#555">(8,8)</text>
  <rect x="412" y="214" width="56" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="9.5" fill="#777">(11,6)…</text>

  <!-- comparison in the middle -->
  <path d="M 164 178 Q 280 200 396 178" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">比堆顶，取较小者</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#b85450">并列（代价相等）→ 取下标小者 = 前窗堆</text>

  <!-- two cases -->
  <rect x="40" y="252" width="230" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：弹出 front 堆顶</text>
  <text x="56" y="294" font-size="10.5" fill="#4a7a3a">代价累加；若 left ≤ right：</text>
  <text x="56" y="310" font-size="10.5" fill="#4a7a3a">front.push(costs[left])，left++</text>
  <text x="56" y="326" font-size="10" fill="#888">→ 前窗右移一格，吞入中间</text>

  <rect x="290" y="252" width="230" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="306" y="274" font-size="12" fill="#d6a040" font-weight="bold">情况 B：弹出 back 堆顶</text>
  <text x="306" y="294" font-size="10.5" fill="#d6a040">代价累加；若 left ≤ right：</text>
  <text x="306" y="310" font-size="10.5" fill="#d6a040">back.push(costs[right])，right--</text>
  <text x="306" y="326" font-size="10" fill="#888">→ 后窗左移一格，吞入中间</text>

  <!-- key insight -->
  <rect x="40" y="344" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="11.5" fill="#446688" font-weight="bold">💡 为什么两个堆就够了？</text>
  <text x="56" y="380" font-size="10.5" fill="#446688">前窗/后窗各维护一个小顶堆 → 每轮 O(log) 取两端候选最小者；弹出后只从同侧补一个，中间区被两端逐步吞并</text>
</svg>
