<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例演算：nums = [1,1,2,1] 的全部 3 种分割</text>

  <!-- Row 1: (i=1, j=2) -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="76" y="52" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="112" y="52" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="148" y="52" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="57" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="93" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="129" y="73" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="165" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="36" y="48" width="39" height="40" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="75" y="48" width="38" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="113" y="48" width="73" height="40" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <text x="56" y="104" text-anchor="middle" font-size="11" fill="#446688">nums1</text>
    <text x="94" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a">nums2</text>
    <text x="150" y="104" text-anchor="middle" font-size="11" fill="#b8860b">nums3</text>
    <text x="214" y="60" font-size="12" font-weight="bold" fill="#333">（i=1，j=2）</text>
    <text x="214" y="78" font-size="11" fill="#4a7a3a">A：lcp[0][1]=1 ≥ 1，且 j=2 ≥ 2 ✓</text>
    <text x="214" y="94" font-size="11" fill="#b85450">B：lcp[1][2]=0 &lt; 1 ✗</text>
    <text x="214" y="112" font-size="12" font-weight="bold" fill="#4a7a3a">美丽分割 ✓</text>
  </g>

  <!-- Row 2: (i=1, j=3) -->
  <g filter="url(#rough2)">
    <rect x="40" y="142" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="76" y="142" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="112" y="142" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="148" y="142" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="57" y="163" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="93" y="163" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="129" y="163" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="165" y="163" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="36" y="138" width="39" height="40" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="75" y="138" width="75" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="150" y="138" width="36" height="40" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <text x="56" y="194" text-anchor="middle" font-size="11" fill="#446688">nums1</text>
    <text x="112" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a">nums2</text>
    <text x="168" y="194" text-anchor="middle" font-size="11" fill="#b8860b">nums3</text>
    <text x="214" y="150" font-size="12" font-weight="bold" fill="#333">（i=1，j=3）</text>
    <text x="214" y="168" font-size="11" fill="#4a7a3a">A：lcp[0][1]=1 ≥ 1，且 j=3 ≥ 2 ✓</text>
    <text x="214" y="184" font-size="11" fill="#b85450">B：lcp[1][3]=1 &lt; 2 ✗</text>
    <text x="214" y="202" font-size="12" font-weight="bold" fill="#4a7a3a">美丽分割 ✓</text>
  </g>

  <!-- Row 3: (i=2, j=3) -->
  <g filter="url(#rough2)">
    <rect x="40" y="232" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="76" y="232" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="112" y="232" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="148" y="232" width="34" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="57" y="253" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="93" y="253" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="129" y="253" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="165" y="253" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="36" y="228" width="77" height="40" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="113" y="228" width="34" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <rect x="147" y="228" width="39" height="40" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="5"/>
    <text x="74" y="284" text-anchor="middle" font-size="11" fill="#446688">nums1</text>
    <text x="130" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a">nums2</text>
    <text x="166" y="284" text-anchor="middle" font-size="11" fill="#b8860b">nums3</text>
    <text x="214" y="240" font-size="12" font-weight="bold" fill="#333">（i=2，j=3）</text>
    <text x="214" y="258" font-size="11" fill="#b85450">A：j=3 &lt; 2×2=4（且 lcp[0][2]=0 &lt; 2）✗</text>
    <text x="214" y="274" font-size="11" fill="#b85450">B：lcp[2][3]=0 &lt; 1 ✗</text>
    <text x="214" y="292" font-size="12" font-weight="bold" fill="#b85450">不美丽 ✗</text>
  </g>

  <!-- summary -->
  <g filter="url(#rough2)">
    <rect x="55" y="316" width="410" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e">答案 = 2 ✓（与示例一致）</text>
    <text x="260" y="370" text-anchor="middle" font-size="11" fill="#555">关键 lcp：lcp[0][1]=1，lcp[0][2]=0，lcp[1][2]=0，lcp[1][3]=1，lcp[2][3]=0</text>
  </g>
</svg>
