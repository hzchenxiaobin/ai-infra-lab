<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums=[5,1,4,1], indexDiff=2, valueDiff=4</text>

  <!-- 步骤 j = 2 -->
  <rect x="30" y="44" width="460" height="128" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="44" y="58" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="79" y="75" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold" filter="url(#rough2)">j = 2</text>

  <text x="130" y="76" font-size="11.5" fill="#333" filter="url(#rough2)">纳入 nums[0]=5 → 前缀 [0,0]：min=(0,5)，max=(0,5)</text>

  <!-- 小格子 -->
  <rect x="130" y="92" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">min=max</text>

  <rect x="210" y="92" width="40" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="111" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>

  <rect x="290" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="310" y="136" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">nums[j]</text>

  <rect x="370" y="92" width="40" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="111" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>

  <rect x="130" y="146" width="330" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="295" y="160" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">低侧 4−5 = −1 ✗    高侧 5−4 = 1 ✗    → 继续</text>

  <!-- 步骤 j = 3 -->
  <rect x="30" y="188" width="460" height="128" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="44" y="202" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="79" y="219" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold" filter="url(#rough2)">j = 3</text>

  <text x="130" y="220" font-size="11.5" fill="#333" filter="url(#rough2)">纳入 nums[1]=1 → 前缀 [0,1]：min=(1,1)，max=(0,5)</text>

  <rect x="130" y="236" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max ✓</text>

  <rect x="210" y="236" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">min ✓</text>

  <rect x="290" y="236" width="40" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="255" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>

  <rect x="370" y="236" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="280" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">nums[j]</text>

  <rect x="130" y="290" width="330" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="295" y="304" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">低侧 1−1 = 0 ✗    高侧 5−1 = 4 ✓    → 返回 [0, 3]</text>

  <!-- 结论 -->
  <rect x="90" y="328" width="340" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer = [0, 3]，与示例 1 一致</text>
</svg>
