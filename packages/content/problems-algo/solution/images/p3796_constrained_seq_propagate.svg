<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">限制沿 diff 双向传播成"上界伞"，逐点取 min 得包络 M</text>

  <!-- 左上：一道限制 = 一把伞 -->
  <text x="140" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">① 一道限制 = 向两侧放宽的伞</text>

  <polyline points="50,54 86,58 122,62 158,66 194,60 230,54" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="36" y="76" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="76" width="28" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="76" width="28" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="76" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="76" width="28" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="76" width="28" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="158" y="94" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">≤1</text>

  <text x="50" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="86" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="122" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="158" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="194" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="230" y="114" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>

  <line x1="158" y1="66" x2="158" y2="76" stroke="#b85450" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="140" y="134" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a[j] ≤ maxVal + D(idx, j)</text>
  <text x="140" y="150" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">D = 两位置之间沿途 diff 之和</text>

  <!-- 右上：要点框 -->
  <rect x="268" y="38" width="232" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="60" font-size="11" fill="#333" filter="url(#rough2)">② 起点 a0 = 0 也是一把伞：</text>
  <text x="294" y="78" font-size="11" fill="#333" filter="url(#rough2)">无限制位置的天花板 = diff 前缀和</text>
  <text x="282" y="100" font-size="11" fill="#333" filter="url(#rough2)">③ M[i] = 所有伞在该位置的最小值</text>
  <text x="282" y="122" font-size="11" fill="#333" filter="url(#rough2)">④ M 本身合法 ⇒ 答案 = max M</text>

  <!-- 下：示例 1 包络图 -->
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">示例 1：三条虚线是"伞"，绿色粗线 = 逐点取 min 的包络 M</text>

  <!-- 图例 -->
  <line x1="62" y1="190" x2="84" y2="190" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="88" y="194" font-size="9.5" fill="#446688" filter="url(#rough2)">前缀伞</text>
  <line x1="62" y1="208" x2="84" y2="208" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="88" y="212" font-size="9.5" fill="#b85450" filter="url(#rough2)">限制伞</text>
  <line x1="62" y1="226" x2="84" y2="226" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="88" y="230" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">M = 逐点 min</text>

  <!-- 前缀伞（蓝虚线）：0,2,4,7,8,12,13,14,15,17 -->
  <polyline points="55,336 102,318 149,300 196,273 243,264 290,228 337,219 384,210 431,201 478,183"
            fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <!-- 限制伞@3（红虚线）：8,6,4,1,2,6,11,12,13,14 -->
  <polyline points="55,264 102,282 149,300 196,327 243,318 290,282 337,237 384,228 431,219 478,210"
            fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- 限制伞@8（红虚线，左侧超出图幅省略）：16,13,12,8,3,2,1,3 -->
  <polyline points="149,192 196,219 243,228 290,264 337,309 384,318 431,327 478,309"
            fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="2,3" filter="url(#rough2)"/>
  <!-- 包络 M（绿粗线）：0,2,4,1,2,6,3,2,1,3 -->
  <polyline points="55,336 102,318 149,300 196,327 243,318 290,282 337,309 384,318 431,327 478,309"
            fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <line x1="45" y1="336" x2="490" y2="336" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="102" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="149" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="196" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="243" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="290" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="337" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="384" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="431" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="478" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>

  <circle cx="55" cy="336" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="196" cy="327" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="431" cy="327" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="290" cy="282" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 313 282 L 299 283" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="345" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">峰值 6 = 答案</text>
</svg>
