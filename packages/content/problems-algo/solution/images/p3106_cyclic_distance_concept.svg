<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：字母成环双向取近 + 预算从左往右花</text>

  <!-- ===== left: alphabet ring ===== -->
  <circle cx="135" cy="228" r="86" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">a … z</text>
  <text x="135" y="238" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首尾相接成环</text>

  <!-- plain letters on the ring -->
  <text x="206" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e</text>
  <text x="206" y="282" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j</text>
  <text x="135" y="319" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">n</text>
  <text x="64" y="282" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">r</text>
  <text x="55" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v</text>
  <text x="115" y="150" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- highlighted x and a -->
  <circle cx="78" cy="164" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="169" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <circle cx="135" cy="142" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="147" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- near path: x -> z -> a, only 3 steps over the seam -->
  <path d="M 68 158 C 84 149, 102 146, 123 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="58" y="120" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">近路：x→z→a 只要 3 步 ✓</text>

  <!-- far path: x -> v -> r -> n -> j -> e -> a, 23 steps -->
  <path d="M 72 178 C 22 234, 48 322, 135 322 C 220 322, 246 214, 148 150" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="344" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">远路：绕行 23 步 ✗</text>

  <!-- formula box -->
  <rect x="30" y="356" width="210" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="372" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">到 'a' 的代价 = min(o, 26−o)</text>
  <text x="135" y="388" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">两条路取短的那条走</text>

  <!-- ===== right panel ===== -->
  <rect x="272" y="44" width="232" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① distance = 逐位代价求和 ≤ k</text>
  <text x="388" y="81" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">预算 k 全局共享，不是每位各一份</text>

  <path d="M 388 92 C 388 96, 388 100, 388 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="106" width="232" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="125" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② 字典序只看第一个不同的位置</text>
  <text x="388" y="143" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">⇒ 预算从左往右花，靠前的先变小</text>

  <path d="M 388 154 C 388 158, 388 162, 388 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="388" y="182" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">③ 每位取「剩余预算买得起」的最小字母</text>

  <!-- position boxes: s -> t -->
  <rect x="276" y="192" width="36" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="294" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="320" y="192" width="36" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <text x="338" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="364" y="192" width="36" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="382" y="228" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">w</text>

  <rect x="408" y="192" width="36" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="426" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c</text>
  <text x="426" y="228" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">c</text>

  <rect x="452" y="192" width="36" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">d</text>
  <text x="470" y="228" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">d</text>

  <text x="388" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s = xaxcd，k = 4 ⇒ t = aawcd（示例 2）</text>

  <!-- strategy box -->
  <rect x="272" y="270" width="232" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">单点策略（rem = 剩余预算）</text>
  <text x="388" y="308" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">min(o, 26−o) ≤ rem → 变 'a'，rem −= cost</text>
  <text x="388" y="326" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">否则 → 朝 'a' 退 rem 步：s[i] − rem</text>
  <text x="388" y="344" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">花光 rem，后面全部原样保留</text>
</svg>
