<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：奇数下标逐位替换</text>

  <!-- Start node -->
  <ellipse cx="270" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: 复制 s，i = 1</text>

  <!-- Arrow down to D1 -->
  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="270,96 360,130 270,164 180,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D1 No -> return s (right) -->
  <path d="M 360 130 L 400 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="122" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="400" y="108" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="10" fill="#333">遍历结束</text>
  <text x="460" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 s</text>

  <!-- D1 Yes -> process (down) -->
  <path d="M 270 164 L 270 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="178" font-size="11" fill="#82b366">是</text>

  <!-- Process box: shift = s[i-1] + (s[i] - '0') -->
  <rect x="150" y="186" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333">读取 s[i-1]（字母）与 s[i]（数字）</text>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">s[i] = s[i-1] + (s[i] - '0')</text>

  <!-- Arrow down to i += 2 -->
  <path d="M 270 242 L 270 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i += 2 box -->
  <rect x="222" y="262" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i += 2</text>

  <!-- Loop back arrow: from i+=2 box up to D1 -->
  <path d="M 270 294 L 270 300 L 460 300 L 460 84 L 270 84 L 270 92" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="296" text-anchor="middle" font-size="10" fill="#888">跳到下一奇数位</text>

  <!-- Summary note 1 -->
  <rect x="60" y="330" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#666">关键 1：i 从 1 出发、步长 2，恰好命中所有奇数下标</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#666">关键 2：偶数位字母原样保留，无需任何处理</text>

  <!-- Summary note 2 -->
  <rect x="60" y="394" width="420" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#666">时间 O(n)：至多遍历 n/2 个奇数位，每位 O(1) 计算</text>
  <text x="270" y="434" text-anchor="middle" font-size="11" fill="#666">空间 O(n)：结果串（C++ 原地修改则 O(1) 额外空间）</text>

  <text x="270" y="460" text-anchor="middle" font-size="10" fill="#888">注：也可用 i 从 0 起、每次处理 (s[i], s[i+1]) 一对，等价</text>
</svg>
