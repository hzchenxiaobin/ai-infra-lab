<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">NOT IN 的 NULL 陷阱：三值逻辑让叶子集体变身 Inner</text>

  <rect x="25" y="44" width="250" height="230" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 踩坑写法</text>
  <text x="38" y="90" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">WHEN N NOT IN</text>
  <text x="38" y="106" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">  (SELECT P FROM Tree)</text>
  <text x="38" y="122" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">THEN 'Leaf'</text>

  <text x="38" y="148" font-size="10.5" fill="#666" filter="url(#rough2)">子查询结果含 NULL：</text>
  <text x="38" y="164" font-size="10" fill="#666" font-family="monospace" filter="url(#rough2)">(2, 2, 8, 8, 5, 5, NULL)</text>

  <text x="38" y="190" font-size="10.5" fill="#666" filter="url(#rough2)">对 N=1：1&lt;&gt;NULL 结果是 NULL（未知）</text>
  <text x="38" y="206" font-size="10.5" fill="#666" filter="url(#rough2)">整条 NOT IN 折叠成 NULL ≠ TRUE</text>
  <text x="38" y="222" font-size="10.5" fill="#666" filter="url(#rough2)">CASE 视为不成立 → 落入 ELSE</text>

  <text x="38" y="252" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">叶子 1 / 3 / 6 / 9 全错判成 Inner</text>

  <rect x="290" y="44" width="245" height="230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="412" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 三种修正</text>

  <text x="302" y="90" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 子查询过滤掉 NULL</text>
  <text x="302" y="106" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">SELECT P FROM Tree</text>
  <text x="302" y="120" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">WHERE P IS NOT NULL</text>

  <text x="302" y="148" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 改用正向 IN 先判 Inner</text>
  <text x="302" y="164" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">WHEN N IN (SELECT P ...)</text>
  <text x="302" y="178" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">THEN 'Inner' ELSE 'Leaf'</text>

  <text x="302" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ EXISTS 相关子查询</text>
  <text x="302" y="222" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">EXISTS (SELECT 1 FROM Tree c</text>
  <text x="302" y="236" font-size="9.5" fill="#333" font-family="monospace" filter="url(#rough2)">  WHERE c.P = t.N)</text>

  <text x="302" y="262" font-size="10" fill="#666" filter="url(#rough2)">c.P = t.N 对 NULL 行永假，天然免疫</text>

  <rect x="25" y="288" width="510" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">三值逻辑：x IN (…, NULL) 命中 = TRUE、未命中 = NULL；NOT 翻转后 NULL 仍是 NULL</text>
</svg>
