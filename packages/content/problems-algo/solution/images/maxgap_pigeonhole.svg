<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">鸽巢原理：最大间距 ≥ 平均间距</text>

  <!-- number line -->
  <line x1="60" y1="120" x2="500" y2="120" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="52" y="124" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">min</text>
  <text x="508" y="124" font-size="11" fill="#446688" font-weight="bold">max</text>

  <!-- n=4 sorted points on the line -->
  <circle cx="90" cy="120" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="200" cy="120" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="340" cy="120" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="470" cy="120" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- gap brackets between adjacent points -->
  <path d="M90 138 L90 146 L200 146 L200 138" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M200 138 L200 146 L340 146 L340 138" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M340 138 L340 146 L470 146 L470 138" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="145" y="160" text-anchor="middle" font-size="10" fill="#888">gap₁</text>
  <text x="270" y="160" text-anchor="middle" font-size="10" fill="#888">gap₂</text>
  <text x="405" y="160" text-anchor="middle" font-size="10" fill="#888">gap₃</text>

  <!-- n-1 = 3 gaps -->
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#333">n 个元素 → n−1 个间距，总和 = max − min</text>

  <!-- average gap formula -->
  <rect x="150" y="196" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">平均间距 = (max − min) / (n − 1)</text>

  <!-- conclusion arrow -->
  <path d="M280 234 L280 246" stroke="#b85450" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="250" width="320" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">最大间距 ≥ 平均间距（鸽巢）</text>

  <!-- two cases panels -->
  <!-- within bucket -->
  <rect x="40" y="300" width="230" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">桶内：间距 &lt; 桶大小</text>
  <line x1="70" y1="348" x2="200" y2="348" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="342" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="85" cy="349" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="115" cy="349" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不可能是最大间距 ✓</text>

  <!-- between buckets -->
  <rect x="290" y="300" width="230" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">桶间：间距 ≥ 桶大小</text>
  <rect x="310" y="342" width="50" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="342" width="50" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="355" cy="349" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="435" cy="349" r="3.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M360 358 L360 366 L430 366 L430 358" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="405" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大间距藏在这里！</text>
</svg>
