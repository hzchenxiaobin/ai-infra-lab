<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 1]，逐元素更新三个桶</text>

  <!-- 表头 -->
  <rect x="16" y="40" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">元素 x</text>
  <rect x="74" y="40" width="108" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">来源 c = cnt[x±1]</text>
  <rect x="182" y="40" width="108" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">来源 s = sum[x±1]</text>
  <rect x="290" y="40" width="108" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">新增 ds = s+c·x+x</text>
  <rect x="398" y="40" width="106" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">桶状态（cnt,sum）</text>

  <!-- 第 1 行：x=1 -->
  <rect x="16" y="74" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="95" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <rect x="74" y="74" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0 + 0 = 0</text>
  <rect x="182" y="74" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0 + 0 = 0</text>
  <rect x="290" y="74" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0+0+1 = 1</text>
  <rect x="398" y="74" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="89" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">桶1: (1, 1)</text>
  <text x="451" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">即 [1]</text>

  <!-- 第 2 行：x=2 -->
  <rect x="16" y="112" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="133" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <rect x="74" y="112" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cnt1+cnt3 = 1</text>
  <rect x="182" y="112" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum1+sum3 = 1</text>
  <rect x="290" y="112" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+1·2+2 = 5</text>
  <rect x="398" y="112" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">桶2: (2, 5)</text>
  <text x="451" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[2], [1,2]</text>

  <!-- 第 3 行：x=1 -->
  <rect x="16" y="150" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="171" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <rect x="74" y="150" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cnt0+cnt2 = 2</text>
  <rect x="182" y="150" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum0+sum2 = 5</text>
  <rect x="290" y="150" width="108" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5+2·1+1 = 8</text>
  <rect x="398" y="150" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">桶1: (4, 9)</text>
  <text x="451" y="179" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+ [2,1],[1,2,1],[1]</text>

  <!-- 答案框 -->
  <rect x="16" y="206" width="488" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = sum[1] + sum[2] = 9 + 5 = 14 ✓</text>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">桶1 的 4 个：[1],[2,1],[1,2,1],[1]（和 9）；桶2 的 2 个：[2],[1,2]（和 5）</text>

  <!-- 逐步累加明细 -->
  <rect x="16" y="264" width="488" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">每个新桶增量的来历（x = 1 第三步为例）</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">续接 [2] → [2,1]（和 3）；续接 [1,2] → [1,2,1]（和 4）；新开 [1]（和 1）</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">新增和 3 + 4 + 1 = 8 = 来源和 5 + 2 个续接 × 值 1 + 自身 1</text>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">ds = s + c·x + x 中的 c·x：被续接的每个序列都长出一个值为 x 的新元素</text>
</svg>
