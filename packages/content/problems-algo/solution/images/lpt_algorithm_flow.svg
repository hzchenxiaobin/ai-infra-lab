<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 从右往左扫描相邻三元组</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(n log n) = 排序 O(n log n) + 扫描 O(n)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: sort -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 排序</text>
    <text x="120" y="84" font-family="monospace" font-size="10" fill="#555">sort(nums.begin(), nums.end())</text>
    <text x="120" y="100" font-size="9" fill="#888">升序排序，O(n log n)。使三角形不等式只需判 a+b&gt;c</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: scan from right -->
    <rect x="40" y="128" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#b85450" font-weight="bold">② 从右往左扫描</text>
    <text x="190" y="148" font-family="monospace" font-size="10" fill="#555">for (i = n-3; i &gt;= 0; --i)</text>
    <text x="54" y="166" font-size="9" fill="#888">c = nums[i+2] 是当前最大边，配 a=nums[i], b=nums[i+1]</text>
    <text x="54" y="180" font-size="9" fill="#d6a040">从最大的 c 开始，首个合法即最大周长</text>

    <path d="M 260 186 L 260 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: check -->
    <rect x="40" y="204" width="440" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="224" font-size="12" fill="#d6a040" font-weight="bold">③ 判断 nums[i] + nums[i+1] &gt; nums[i+2] ?</text>
    <text x="70" y="244" font-family="monospace" font-size="10" fill="#4a7a3a">是 → return nums[i] + nums[i+1] + nums[i+2]   // 最大周长</text>
    <text x="70" y="262" font-family="monospace" font-size="10" fill="#446688">否 → i−−   // c 无法作为最大边，换更小的 c</text>
    <text x="70" y="280" font-size="9" fill="#888">相邻配对是最优：若 a+b ≤ c，任何更小配对也必 ≤ c</text>

    <path d="M 260 296 L 260 310" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: return 0 -->
    <rect x="40" y="314" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="334" font-size="12" fill="#4a7a3a" font-weight="bold">④ 全部扫描完无合法三元组</text>
    <text x="54" y="352" font-size="9" fill="#888">返回 0（无法构成任何面积不为零的三角形）</text>
  </g>
</svg>
