<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建哈希索引 → 双层枚举 (i,j) → 查前驱 k → 取最大值</text>

  <!-- step 1 -->
  <rect x="150" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 建哈希表 idx: value → index</text>
  <text x="270" y="80" text-anchor="middle" font-size="10" fill="#666">arr 严格递增，值唯一，O(1) 反查下标</text>

  <path d="M 270 88 L 270 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="102" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 初始化 dp[i][j] = 2</text>
  <text x="270" y="138" text-anchor="middle" font-size="10" fill="#666">任意两元素天然构成长度 2 的序列</text>

  <path d="M 270 146 L 270 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: main loop -->
  <rect x="40" y="160" width="460" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 双层循环：j ∈ [2, n), i ∈ [1, j)</text>
  <text x="60" y="206" font-size="11" fill="#444">target = arr[j] − arr[i]</text>
  <text x="60" y="226" font-size="11" fill="#444">if target &lt; arr[i] and target ∈ idx:</text>
  <text x="80" y="246" font-size="11" fill="#444">k = idx[target]</text>
  <text x="80" y="266" font-size="11" fill="#b85450" font-weight="bold">dp[i][j] = dp[k][i] + 1</text>
  <text x="80" y="286" font-size="11" fill="#444">ans = max(ans, dp[i][j])</text>
  <text x="340" y="206" font-size="10" fill="#888">前驱值必更小</text>
  <text x="340" y="226" font-size="10" fill="#888">哈希 O(1) 查 k</text>
  <text x="340" y="266" font-size="10" fill="#888">链长 +1</text>
  <text x="340" y="286" font-size="10" fill="#888">维护全局最大</text>

  <path d="M 270 328 L 270 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <rect x="120" y="342" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 ans（若 ans ≥ 3，否则 0）</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#666">斐波那契式要求 n ≥ 3</text>

  <text x="270" y="416" text-anchor="middle" font-size="10" fill="#888">复杂度：时间 O(n²)   空间 O(n²)</text>
</svg>
