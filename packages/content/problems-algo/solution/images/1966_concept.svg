<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：左侧更大 / 右侧更小 → 对手选为 pivot 移除 target</text>

  <!-- Method hint box -->
  <rect x="40" y="40" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="11.5" fill="#7a5a20" filter="url(#rough2)">随机选 pivot：pivot==target→true；pivot&lt;target→移除 pivot 及其左；pivot&gt;target→移除 pivot 及其右</text>

  <!-- ===== Scenario A: left has greater ===== -->
  <text x="40" y="100" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">情形 A：左侧有更大元素 L &gt; target</text>

  <text x="40" y="124" font-size="10.5" fill="#888" filter="url(#rough2)">nums =</text>
  <!-- array cells: [2, 7, 5], target = 5 (index2), L = 7 (index1) -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="84" y="110" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="131" filter="url(#rough2)">2</text>
    <rect x="128" y="110" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="131" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
    <rect x="172" y="110" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="194" y="131" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  </g>
  <!-- labels under cells -->
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">L (左侧更大)</text>
  <text x="194" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">target</text>

  <!-- red shade: remove L and its right (cells index1..2) -->
  <rect x="126" y="106" width="92" height="40" fill="#b85450" fill-opacity="0.18" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="172" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">移除 7 及其右</text>

  <!-- arrow + caption -->
  <path d="M 224 126 L 280 126" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="288" y="112" width="252" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="414" y="131" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7&gt;5 → 移除含 target → 未命中 ✗</text>

  <!-- Divider -->
  <path d="M 40 186 L 540 186" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Scenario B: right has smaller ===== -->
  <text x="40" y="208" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">情形 B：右侧有更小元素 R &lt; target</text>

  <text x="40" y="232" font-size="10.5" fill="#888" filter="url(#rough2)">nums =</text>
  <!-- array cells: [5, 1, 8], target = 5 (index0), R = 1 (index1) -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="84" y="218" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="106" y="239" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
    <rect x="128" y="218" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="239" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="172" y="218" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="194" y="239" filter="url(#rough2)">8</text>
  </g>
  <text x="106" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="150" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">R (右侧更小)</text>

  <!-- red shade: remove R and its left (cells index0..1) -->
  <rect x="82" y="214" width="92" height="40" fill="#b85450" fill-opacity="0.18" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="128" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">移除 1 及其左</text>

  <path d="M 224 234 L 280 234" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="288" y="220" width="252" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="414" y="239" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1&lt;5 → 移除含 target → 未命中 ✗</text>

  <!-- Divider -->
  <path d="M 40 296 L 540 296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Survival condition ===== -->
  <text x="40" y="318" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">存活条件（两情形都不发生）</text>

  <rect x="40" y="332" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保证可找 ⇔ target &gt; 左侧全部 ∧ target &lt; 右侧全部</text>
  <text x="290" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇔ 数组的正确划分点（左全小、右全大，非排序位置）</text>

  <!-- sufficiency hint -->
  <rect x="40" y="406" width="500" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="426" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">充分性：条件成立时，任选 pivot 都无法移除 target</text>
  <text x="290" y="444" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（p&lt;target 必在左 → 移左保 target；p&gt;target 必在右 → 移右保 target）</text>
</svg>
