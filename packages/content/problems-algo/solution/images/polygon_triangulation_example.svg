<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：values = [3, 7, 4, 5]，n = 4</text>

  <!-- ===== Left: quadrilateral with two triangulations ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">四边形两种剖分</text>

  <!-- Quadrilateral vertices: v0 top-left, v1 top-right, v2 bottom-right, v3 bottom-left -->
  <!-- (drawn as 0-1-2-3 clockwise) -->
  <!-- Option A: diagonal 0-2 (k=1) -->
  <text x="130" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a">剖分 A：k=1（对角线 0-2）</text>
  <!-- quad outline -->
  <polygon points="70,90 190,90 190,160 70,160" fill="none" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- diagonal 0-2 -->
  <path d="M 70 90 L 190 160" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- vertices -->
  <circle cx="70" cy="90" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="56" y="84" text-anchor="middle" font-size="9" fill="#446688">0</text>

  <circle cx="190" cy="90" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="204" y="84" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">k=1</text>

  <circle cx="190" cy="160" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="204" y="176" text-anchor="middle" font-size="9" fill="#446688">2</text>

  <circle cx="70" cy="160" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="56" y="176" text-anchor="middle" font-size="9" fill="#446688">3</text>

  <text x="130" y="192" text-anchor="middle" font-size="10" fill="#333">3·7·4 + 3·4·5</text>
  <text x="130" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 84 + 60 = 144 ✓</text>

  <!-- Option B: diagonal 1-3 (k=2) -->
  <text x="130" y="234" text-anchor="middle" font-size="10" fill="#b85450">剖分 B：k=2（对角线 1-3）</text>
  <polygon points="70,250 190,250 190,320 70,320" fill="none" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 190 250 L 70 320" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <circle cx="70" cy="250" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="56" y="244" text-anchor="middle" font-size="9" fill="#446688">0</text>

  <circle cx="190" cy="250" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="204" y="244" text-anchor="middle" font-size="9" fill="#446688">1</text>

  <circle cx="190" cy="320" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="204" y="336" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">k=2</text>

  <circle cx="70" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="56" y="336" text-anchor="middle" font-size="9" fill="#446688">3</text>

  <text x="130" y="352" text-anchor="middle" font-size="10" fill="#333">3·7·5 + 7·4·5</text>
  <text x="130" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 105 + 140 = 245</text>

  <!-- ===== Right: dp table ===== -->
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">dp 表（按长度递增填充）</text>

  <!-- table header row: j=0 1 2 3 -->
  <text x="300" y="84" text-anchor="middle" font-size="10" fill="#888">i\j</text>
  <rect x="316" y="70" width="40" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="86" text-anchor="middle" font-size="10" fill="#666">0</text>
  <rect x="358" y="70" width="40" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="86" text-anchor="middle" font-size="10" fill="#666">1</text>
  <rect x="400" y="70" width="40" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="86" text-anchor="middle" font-size="10" fill="#666">2</text>
  <rect x="442" y="70" width="40" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="86" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- row i=0 -->
  <rect x="284" y="96" width="32" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="10" fill="#666">0</text>
  <rect x="316" y="96" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="112" text-anchor="middle" font-size="10" fill="#ccc">0</text>
  <rect x="358" y="96" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="112" text-anchor="middle" font-size="10" fill="#ccc">0</text>
  <!-- dp[0][2] = 84 (len 3) -->
  <rect x="400" y="96" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="420" y="112" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">84</text>
  <!-- dp[0][3] = 144 (len 4, answer) -->
  <rect x="442" y="96" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="462" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">144</text>

  <!-- row i=1 -->
  <rect x="284" y="122" width="32" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="10" fill="#666">1</text>
  <rect x="316" y="122" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="138" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="358" y="122" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="138" text-anchor="middle" font-size="10" fill="#ccc">0</text>
  <!-- dp[1][3] = 140 (len 3) -->
  <rect x="400" y="122" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="420" y="138" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">140</text>
  <rect x="442" y="122" width="40" height="24" fill="#ffffff" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row i=2 -->
  <rect x="284" y="148" width="32" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="10" fill="#666">2</text>
  <rect x="316" y="148" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="164" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="358" y="148" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="164" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="400" y="148" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="164" text-anchor="middle" font-size="10" fill="#ccc">0</text>
  <rect x="442" y="148" width="40" height="24" fill="#ffffff" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row i=3 -->
  <rect x="284" y="174" width="32" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#666">3</text>
  <rect x="316" y="174" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="190" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="358" y="174" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="190" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="400" y="174" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <rect x="442" y="174" width="40" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="190" text-anchor="middle" font-size="10" fill="#ccc">0</text>

  <!-- computation notes -->
  <rect x="290" y="214" width="230" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="234" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">len = 3（单三角形）</text>
  <text x="405" y="252" text-anchor="middle" font-size="10" fill="#333">dp[0][2] = 3·7·4 = 84（k=1）</text>
  <text x="405" y="268" text-anchor="middle" font-size="10" fill="#333">dp[1][3] = 7·4·5 = 140（k=2）</text>
  <text x="405" y="290" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">len = 4（整个四边形）</text>
  <text x="405" y="308" text-anchor="middle" font-size="10" fill="#333">dp[0][3]: k=1→245, k=2→144</text>

  <!-- answer box -->
  <rect x="290" y="324" width="230" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="405" y="342" text-anchor="middle" font-size="11" fill="#444">dp[0][3] = min(245, 144)</text>
  <text x="405" y="361" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 144</text>

  <!-- legend -->
  <text x="290" y="392" font-size="9" fill="#4a7a3a">■ len=3</text>
  <text x="360" y="392" font-size="9" fill="#b85450">■ 答案格</text>
  <text x="430" y="392" font-size="9" fill="#ccc">■ 0/无效（顶点&lt;3）</text>
</svg>
