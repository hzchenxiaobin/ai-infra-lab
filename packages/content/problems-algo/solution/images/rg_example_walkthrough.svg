  <rect x="385" y="86" width="155" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="100" font-size="8" fill="#333">110+120+130+110+140+150+80</text>
  <text x="395" y="112" font-size="9" fill="#b85450" font-weight="bold">= 840 → 840/7 = 120</text>

  <!-- ============ Window 3: 01-03 ~ 01-09 ============ -->
  <text x="30" y="138" font-size="10" fill="#d6a040" font-weight="bold">窗口3</text>
  <text x="30" y="150" font-size="8" fill="#d6a040">01-03~01-09</text>

  <rect x="90" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-03</text>
  <text x="109" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">120</text>

  <rect x="130" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-04</text>
  <text x="149" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">130</text>

  <rect x="170" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-05</text>
  <text x="189" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">110</text>

  <rect x="210" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-06</text>
  <text x="229" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">140</text>

  <rect x="250" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="269" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-07</text>
  <text x="269" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">150</text>

  <rect x="290" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-08</text>
  <text x="309" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">80</text>

  <rect x="330" y="128" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="349" y="140" text-anchor="middle" font-size="7.5" fill="#d6a040">01-09</text>
  <text x="349" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">110</text>

  <rect x="385" y="128" width="155" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="142" font-size="8" fill="#333">120+130+110+140+150+80+110</text>
  <text x="395" y="154" font-size="9" fill="#b85450" font-weight="bold">= 840 → 840/7 = 120</text>

  <!-- ============ Window 4: 01-04 ~ 01-10 ============ -->
  <text x="30" y="180" font-size="10" fill="#b85450" font-weight="bold">窗口4</text>
  <text x="30" y="192" font-size="8" fill="#b85450">01-04~01-10</text>

  <rect x="90" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-04</text>
  <text x="109" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">130</text>

  <rect x="130" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-05</text>
  <text x="149" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">110</text>

  <rect x="170" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-06</text>
  <text x="189" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">140</text>

  <rect x="210" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-07</text>
  <text x="229" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">150</text>

  <rect x="250" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="269" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-08</text>
  <text x="269" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">80</text>

  <rect x="290" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="182" text-anchor="middle" font-size="7.5" fill="#b85450">01-09</text>
  <text x="309" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">110</text>

  <rect x="330" y="170" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="349" y="182" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">01-10</text>
  <text x="349" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">280</text>

  <rect x="385" y="170" width="155" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="184" font-size="8" fill="#333">130+110+140+150+80+110+280</text>
  <text x="395" y="196" font-size="9" fill="#b85450" font-weight="bold">= 1000 → 1000/7 = 142.86</text>

  <!-- note about day 10 -->
  <path d="M349 170 L349 162 L349 158" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="349" y="156" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">01-10: 两顾客 130+150=280</text>

  <!-- ============ Output table ============ -->
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终输出（4 行，按 visited_on 升序）</text>

  <!-- header -->
  <rect x="60" y="230" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">visited_on</text>
  <rect x="200" y="230" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">amount</text>
  <rect x="300" y="230" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">average_amount</text>

  <!-- row 1 -->
  <rect x="60" y="254" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="269" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2019-01-07</text>
  <rect x="200" y="254" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="250" y="269" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">860</text>
  <rect x="300" y="254" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="360" y="269" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">122.86</text>

  <!-- row 2 -->
  <rect x="60" y="276" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="291" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2019-01-08</text>
  <rect x="200" y="276" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="250" y="291" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">840</text>
  <rect x="300" y="276" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="360" y="291" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">120</text>

  <!-- row 3 -->
  <rect x="60" y="298" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="313" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2019-01-09</text>
  <rect x="200" y="298" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="250" y="313" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">840</text>
  <rect x="300" y="298" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="360" y="313" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">120</text>

  <!-- row 4 -->
  <rect x="60" y="320" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="130" y="335" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2019-01-10</text>
  <rect x="200" y="320" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="250" y="335" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1000</text>
  <rect x="300" y="320" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="360" y="335" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">142.86</text>

  <!-- ============ Key observations ============ -->
  <rect x="20" y="356" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="374" font-size="10" fill="#333">💡 <tspan fill="#446688" font-weight="bold">先聚合再窗口</tspan>：01-10 有两顾客（130+150=280），必须先 GROUP BY 聚合到每天一行，</text>
  <text x="40" y="390" font-size="10" fill="#333">    否则窗口 SUM 会把同一日的多行分别计入，导致重复计算。</text>

  <rect x="20" y="408" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="426" font-size="10" fill="#333">💡 <tspan fill="#d6a040" font-weight="bold">ROWS 6 PRECEDING</tspan> = 当前行 + 前 6 行 = 固定 7 行框架。窗口逐日右移，</text>
  <text x="40" y="442" font-size="10" fill="#333">    旧端出去、新端进来——<tspan fill="#b85450" font-weight="bold">滑动窗口</tspan>而非累积窗口（对比 1308 的 UNBOUNDED PRECEDING）。</text>
</svg>
