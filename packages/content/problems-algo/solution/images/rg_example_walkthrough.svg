<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：10 天数据 → 4 个完整 7 天窗口</text>

  <!-- ============ Window 1: 01-01 ~ 01-07 ============ -->
  <text x="30" y="54" font-size="10" fill="#446688" font-weight="bold">窗口1</text>
  <text x="30" y="66" font-size="8" fill="#446688">01-01~01-07</text>

  <!-- 7 boxes: 38px wide, 2px gap, start x=90 -->
  <rect x="90" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-01</text>
  <text x="109" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">100</text>

  <rect x="130" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-02</text>
  <text x="149" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">110</text>

  <rect x="170" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-03</text>
  <text x="189" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">120</text>

  <rect x="210" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-04</text>
  <text x="229" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">130</text>

  <rect x="250" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="269" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-05</text>
  <text x="269" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">110</text>

  <rect x="290" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-06</text>
  <text x="309" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">140</text>

  <rect x="330" y="44" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="349" y="56" text-anchor="middle" font-size="7.5" fill="#446688">01-07</text>
  <text x="349" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">150</text>

  <!-- result -->
  <rect x="385" y="44" width="155" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="58" font-size="8" fill="#333">100+110+120+130+110+140+150</text>
  <text x="395" y="70" font-size="9" fill="#b85450" font-weight="bold">= 860 → 860/7 = 122.86</text>

  <!-- ============ Window 2: 01-02 ~ 01-08 ============ -->
  <text x="30" y="96" font-size="10" fill="#4a7a3a" font-weight="bold">窗口2</text>
  <text x="30" y="108" font-size="8" fill="#4a7a3a">01-02~01-08</text>

  <rect x="90" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-02</text>
  <text x="109" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="130" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-03</text>
  <text x="149" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">120</text>

  <rect x="170" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-04</text>
  <text x="189" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">130</text>

  <rect x="210" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-05</text>
  <text x="229" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="250" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="269" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-06</text>
  <text x="269" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">140</text>

  <rect x="290" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a">01-07</text>
  <text x="309" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">150</text>

