<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历 + 滚动计数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">prev 记上一个非空行的设备数；遇非空行即累加 prev×cur 并更新 prev</text>

  <!-- ===== Start ===== -->
  <rect x="230" y="58" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <line x1="280" y1="88" x2="280" y2="104" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="150" y="106" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#555">ans = 0, prev = 0  （尚无非空行）</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">long long ans 防溢出（最大 ~500×500×250）</text>
  <line x1="280" y1="148" x2="280" y2="164" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop header ===== -->
  <rect x="180" y="166" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">for each row in bank</text>
  <line x1="280" y1="196" x2="280" y2="212" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Count cur ===== -->
  <rect x="170" y="214" width="220" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#555">cur = 统计本行 '1' 的个数</text>
  <line x1="280" y1="244" x2="280" y2="260" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond: cur == 0 ? ===== -->
  <polygon points="280,262 400,300 280,338 160,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cur == 0 ?</text>
  <text x="280" y="312" text-anchor="middle" font-size="9.5" fill="#888">（空行）</text>

  <!-- ===== Yes branch (right): skip ===== -->
  <line x1="400" y1="300" x2="440" y2="300" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="292" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="286" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="304" text-anchor="middle" font-size="10.5" fill="#b85450">跳过（不动）</text>

  <!-- ===== No branch (left): accumulate ===== -->
  <line x1="160" y1="300" x2="120" y2="300" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="292" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== Decision: prev > 0 ? ===== -->
  <polygon points="80,356 200,356 200,392 80,392" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">if prev &gt; 0:</text>
  <text x="140" y="386" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans += prev × cur</text>

  <!-- ===== Update prev ===== -->
  <line x1="140" y1="392" x2="140" y2="408" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="410" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="428" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">prev = cur</text>

  <!-- ===== Merge: loop back ===== -->
  <path d="M 490 314 L 490 440 L 280 440 L 280 181 L 380 181" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 438 L 140 448 L 280 448 L 280 181 L 380 181" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="300" y="458" font-size="9" fill="#888">继续下一行</text>

  <!-- ===== Return ===== -->
  <rect x="350" y="410" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="410" y="431" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
  <line x1="490" y1="314" x2="490" y2="360" stroke="#888" stroke-width="0" filter="url(#rough2)"/>
</svg>
