<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举向上次数 x，解出 y，组合数累加</text>

  <rect x="205" y="38" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 0</text>

  <path d="M 260 68 L 260 78" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="80" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 0</text>

  <path d="M 260 110 L 260 120" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,122 342,152 260,182 178,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x ≤ 31 ?</text>

  <path d="M 342 152 L 388 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="144" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="390" y="134" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 182 L 260 194" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="192" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="185" y="196" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">y = 2ˣ − k</text>

  <path d="M 260 226 L 260 236" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,238 352,270 260,302 168,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0 ≤ y ≤ x+1 ?</text>

  <path d="M 168 270 L 110 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="139" y="262" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <path d="M 260 302 L 260 314" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="312" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="175" y="316" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += C(x+1, y)</text>

  <rect x="38" y="252" width="72" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="274" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x++</text>

  <path d="M 260 348 L 260 372 L 75 372 L 75 292" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 75 252 L 75 152 L 172 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="142" font-size="10.5" fill="#888" filter="url(#rough2)">循环</text>

  <rect x="30" y="388" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">x 上界：k ≤ 10⁹ &lt; 2³⁰ 且 2ˣ ≤ k + x + 1 ⇒ x ≤ 30，枚举 0..31 保险</text>
</svg>
