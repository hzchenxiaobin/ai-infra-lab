<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#667"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：门转移矩阵与 T/Δ 分解</text>

  <!-- 左上：一条父边上的三扇平行门 -->
  <text x="134" y="46" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一条父边上的门：每步任选一扇通过</text>

  <circle cx="52" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v</text>
  <circle cx="216" cy="110" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">父</text>

  <path d="M64,90 L116,90" stroke="#667" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M152,90 L204,90" stroke="#667" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="82" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="94" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">红门</text>

  <path d="M64,112 L116,112" stroke="#667" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M152,112 L204,112" stroke="#667" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="104" width="34" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="116" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">蓝门</text>

  <path d="M64,134 L116,134" stroke="#667" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M152,134 L204,134" stroke="#667" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="118" y="126" width="34" height="16" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="138" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">白门</text>

  <!-- 规则框 -->
  <rect x="22" y="152" width="224" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="134" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">红门 / 蓝门：卡片颜色<b>保持</b>不变</text>
  <text x="134" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">白门：卡片颜色<b>翻转</b>（红 ↔ 蓝）</text>

  <!-- 矩阵框 -->
  <rect x="22" y="210" width="224" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d4a66" filter="url(#rough2)">一条边 ＝ 转移矩阵 M</text>
  <path d="M42,238 L37,238 L37,272 L42,272" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="46" y="240" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="57" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">s</text>
  <rect x="70" y="240" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="81" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w</text>
  <rect x="46" y="256" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="57" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w</text>
  <rect x="70" y="256" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="81" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">s</text>
  <path d="M96,238 L101,238 L101,272 L96,272" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="112" y="246" text-anchor="start" font-size="9" fill="#333" filter="url(#rough2)">s＝r＋b：保持色的门数</text>
  <text x="112" y="260" text-anchor="start" font-size="9" fill="#333" filter="url(#rough2)">w：切换色的门数</text>
  <text x="112" y="274" text-anchor="start" font-size="9" fill="#556" filter="url(#rough2)">行列都对应颜色 0/1</text>

  <!-- J 族说明 -->
  <rect x="22" y="294" width="224" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="312" text-anchor="middle" font-size="9.5" fill="#2d5a24" filter="url(#rough2)">记 J＝[[0,1],[1,0]]（换色），J²＝I ⇒ M＝sI＋wJ</text>
  <text x="134" y="328" text-anchor="middle" font-size="9.5" fill="#2d5a24" filter="url(#rough2)">同型矩阵族<b>封闭且可交换</b></text>
  <text x="134" y="343" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">任意路径累积矩阵仍是两个数！(s′, w′)</text>

  <!-- 右列：T/Δ 分解 -->
  <rect x="268" y="44" width="232" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d4a66" filter="url(#rough2)">T/Δ 换坐标（关键一步）</text>
  <text x="384" y="79" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">总量 T＝x₀＋x₁：每过一条边 ×(s＋w)</text>
  <text x="384" y="93" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">差值 Δ＝x₀−x₁：每过一条边 ×(s−w)</text>
  <text x="384" y="107" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">初值 T＝1，Δ＝+1（红卡）/ p−1（蓝卡）</text>
  <text x="384" y="119" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s＋w＝门总数；s−w＝保持−切换</text>

  <!-- 恢复方式数 -->
  <rect x="268" y="132" width="232" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">恢复两色方式数（mod p 下 ÷2 ＝ ×2⁻¹）</text>
  <text x="384" y="168" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">到色0：(T＋Δ)/2　　到色1：(T−Δ)/2</text>

  <!-- 答案闭式 -->
  <rect x="268" y="186" width="232" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="384" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">查询答案 ＝ (Tᵤ·Tᵥ ＋ Δᵤ·Δᵥ)·2⁻¹</text>
  <text x="384" y="223" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">展开恰为 Σ_c 方式ᵤ(c)·方式ᵥ(c)</text>
  <text x="384" y="238" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">—— 「两人到 LCA 时同色」的配对计数</text>

  <!-- XOR -->
  <rect x="268" y="256" width="232" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="384" y="271" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个查询先 mod 10⁹＋7，再逐个按位异或</text>
  <text x="384" y="285" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">XOR 只认「模后的整数」，不与加法兼容</text>

  <!-- 零因子警告 -->
  <rect x="268" y="300" width="232" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ s−w 可能为 0（示例 1 就有！）</text>
  <text x="384" y="333" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">前缀积＋逆元还原会失效 ⟹ 必须倍增累乘</text>
  <text x="384" y="345" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（s＋w 也可能 ≡ 0 mod p，同理）</text>
</svg>
