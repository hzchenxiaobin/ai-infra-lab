<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：交替律账本 + 双人票边覆盖</text>

  <!-- ① 交替律 -->
  <text x="36" y="46" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 交替律：同一位上的操作严格交替，次数被（初值，终值）钉死</text>

  <rect x="68" y="58" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="178" y="58" width="44" height="30" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="288" y="58" width="44" height="30" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="398" y="58" width="44" height="30" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="90" y="103" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">初值</text>

  <path d="M 114 73 L 174 73" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="144" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">op1</text>
  <path d="M 224 73 L 284 73" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="254" y="67" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">op2</text>
  <path d="M 334 73 L 394 73" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="364" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">op1</text>

  <text x="466" y="63" font-size="9" fill="#446688" filter="url(#rough2)">op1＝0→1</text>
  <text x="466" y="76" font-size="9" fill="#d6a040" filter="url(#rough2)">op2＝11→00</text>
  <text x="466" y="89" font-size="9" fill="#888" filter="url(#rough2)">（双人票）</text>

  <text x="260" y="112" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">op1 只能踩 0、op2 参与只能踩 1 ⇒ a 与 b 的关系被四类（A/B/C/D）唯一确定</text>

  <!-- ② 边覆盖 -->
  <text x="36" y="140" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② C 位（1→0）必须搭双人票：连续段长 k 配 ⌈k/2⌉ 张</text>

  <!-- 票边弧线 -->
  <path d="M 82 166 C 82 146, 122 146, 122 166" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="82" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="122" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="130" y="157" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">票①</text>

  <path d="M 162 166 C 162 146, 202 146, 202 166" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="162" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="202" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="210" y="157" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">票②</text>

  <path d="M 282 166 C 282 146, 322 146, 322 166" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="282" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="322" cy="166" r="2.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="330" y="157" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">票③</text>

  <!-- 类型格子 -->
  <rect x="62" y="170" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="102" y="170" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="122" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="142" y="170" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="182" y="170" width="40" height="34" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="191" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0→0</text>
  <rect x="222" y="170" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="191" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0→1</text>
  <rect x="262" y="170" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="282" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="302" y="170" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="342" y="170" width="40" height="34" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="191" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0→0</text>
  <rect x="382" y="170" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="191" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0→1</text>
  <rect x="422" y="170" width="40" height="34" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="191" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1→1</text>

  <text x="82" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="122" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="162" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="202" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="242" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="282" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=5</text>
  <text x="322" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=6</text>
  <text x="362" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=7</text>
  <text x="402" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=8</text>
  <text x="442" y="215" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i=9</text>

  <!-- 段括线 -->
  <path d="M 62 222 L 62 228 L 182 228 L 182 222" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="122" y="242" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">C 段 k=3 → 2 张票</text>
  <path d="M 262 222 L 262 228 L 342 228 L 342 222" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="302" y="242" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">C 段 k=2 → 1 张票</text>
  <text x="422" y="242" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">A 位各付 1</text>

  <!-- ③ 总账公式 -->
  <rect x="30" y="252" width="300" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">总代价 = 3 × 票数 + (#A − #C)</text>
  <text x="180" y="290" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">长 k 的 C 段净付 3⌈k/2⌉ − k；孤立 A 位付 1</text>
  <text x="180" y="308" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">⇒ 最小化答案 ⟺ 链上 C 位的最小边覆盖</text>

  <rect x="344" y="252" width="152" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">· 无解 ⟺ n=1 且 1→0</text>
  <text x="420" y="290" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">· n ≥ 2 必有解</text>
  <text x="420" y="308" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">· 答案 ≤ 2n，int 安全</text>

  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1→0 只能搭双人票；账本被交替律钉死后，只剩「买几张票」一个自由度</text>
</svg>
