<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 二分答案 x → 贪心 check</text>

  <!-- 初始化 -->
  <rect x="105" y="36" width="310" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="10.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">排序 start；lo = 0，hi = start[max] + d − start[min]</text>
  <path d="M 260 64 L 260 78" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件菱形 -->
  <polygon points="260,80 350,110 260,140 170,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">lo &lt; hi ?</text>
  <text x="260" y="122" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">(二分未结束)</text>

  <!-- 否 → 返回 -->
  <path d="M 350 110 L 406 110" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="103" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <ellipse cx="464" cy="110" rx="52" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="464" y="114" text-anchor="middle" font-size="11.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">返回 lo</text>

  <!-- 是 → mid -->
  <path d="M 260 140 L 260 154" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="152" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="165" y="156" width="190" height="26" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">mid = (lo + hi + 1) / 2</text>
  <path d="M 260 182 L 260 196" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 框 -->
  <rect x="95" y="198" width="330" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="10.5" fill="#2e4460" font-weight="bold" filter="url(#rough2)">check(x)：last = start[0]，i = 1…n−1 依次取</text>
  <text x="260" y="236" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">pick = max(start[i], last + x)</text>
  <text x="260" y="254" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">pick &gt; start[i] + d ⇒ 不可行；否则 last = pick</text>
  <path d="M 260 260 L 260 274" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 判定菱形 -->
  <polygon points="260,276 350,306 260,336 170,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">check(mid) ?</text>
  <text x="260" y="318" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">(贪心可行吗)</text>

  <!-- 是 → lo = mid -->
  <path d="M 350 306 L 413 306" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="417" y="292" width="90" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="311" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">可行：lo = mid</text>

  <!-- 否 → hi = mid − 1 -->
  <path d="M 170 306 L 142 306" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="26" y="292" width="112" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82" y="311" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">不可行：hi = mid−1</text>

  <!-- 左右回环 -->
  <path d="M 83 292 L 83 110 L 166 110" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 292 L 462 110 L 356 110" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="75" y="205" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 75 205)" filter="url(#rough2)">继续二分</text>
  <text x="470" y="205" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 470 205)" filter="url(#rough2)">继续二分</text>

  <!-- 注记 -->
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单调性：x 可行 ⇒ 更小的 x 都可行（可行域为前缀 [0, X]）→ 二分收敛到最大可行 x</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">check 要点：先排序（交换论证保证区间序 = 取值序）；pick 取「区间下界」与「last + x」的 max</text>
</svg>
