<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：每对切线交点，都给「后切的一方」多收一刀的钱</text>

  <!-- 左侧：3x3 蛋糕网格 -->
  <rect x="52" y="46" width="138" height="138" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="52" y1="92" x2="190" y2="92" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="52" y1="138" x2="190" y2="138" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="98" y1="46" x2="98" y2="184" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="144" y1="46" x2="144" y2="184" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 交点高亮 -->
  <circle cx="98" cy="92" r="4.5" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="144" cy="92" r="4.5" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="98" cy="138" r="4.5" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="144" cy="138" r="4.5" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="36" y="95" text-anchor="end" font-size="11" fill="#a06a10" filter="url(#rough2)">h₀</text>
  <text x="36" y="141" text-anchor="end" font-size="11" fill="#a06a10" filter="url(#rough2)">h₁</text>
  <text x="98" y="200" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v₀</text>
  <text x="144" y="200" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v₁</text>
  <text x="121" y="218" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2 条水平线 × 2 条垂直线</text>
  <text x="121" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">= 4 个交点，各多收一刀</text>

  <!-- 右上：先切贵的（优） -->
  <rect x="222" y="46" width="272" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="66" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">先切贵的 v=5（m=n=2 单线小例）</text>
  <text x="234" y="84" font-size="11" fill="#333" filter="url(#rough2)">v 贯穿整块：5 × 1 = 5</text>
  <text x="234" y="100" font-size="11" fill="#333" filter="url(#rough2)">h 已被竖线断成 2 段：3 × 2 = 6</text>
  <text x="234" y="117" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">合计 11 ✓（交点只付 min(3,5)=3）</text>

  <!-- 右下：先切便宜的（劣） -->
  <rect x="222" y="138" width="272" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="158" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">先切便宜的 h=3</text>
  <text x="234" y="176" font-size="11" fill="#333" filter="url(#rough2)">h 贯穿整块：3 × 1 = 3</text>
  <text x="234" y="192" font-size="11" fill="#333" filter="url(#rough2)">v 已被横线断成 2 段：5 × 2 = 10</text>
  <text x="234" y="209" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">合计 13 ✗（交点付了 max(3,5)=5）</text>

  <!-- 底部总结 -->
  <rect x="40" y="232" width="456" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">总开销 = Σ单价（基准一刀） + Σ交点对（后切一方的单价）</text>
  <text x="268" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每对交点额外付 min(h, v) 是下界，降序执行恰好取到</text>
  <text x="268" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">交换论证：先 h 后 v 与先 v 后 h 的差 = v − h → 谁贵谁先切</text>
  <text x="268" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">直觉：贵刀趁块还完整时只切一次，便宜刀最后多切几次不心疼</text>
</svg>
