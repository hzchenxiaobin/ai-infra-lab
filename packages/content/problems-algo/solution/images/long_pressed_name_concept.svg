<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双指针——i 消费 name，j 消费 typed</text>

  <!-- ===== name 行 ===== -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">name</text>
  <rect x="78" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="122" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">l</text>
  <rect x="166" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">e</text>
  <rect x="210" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">x</text>
  <!-- pointer i at 'a' -->
  <path d="M 99 92 L 99 80" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="99" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i</text>

  <!-- ===== typed 行 ===== -->
  <text x="40" y="148" font-size="11" fill="#888" font-weight="bold">typed</text>
  <rect x="78" y="134" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="122" y="134" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="154" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="166" y="134" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">l</text>
  <rect x="210" y="134" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">e</text>
  <rect x="254" y="134" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="154" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">e</text>
  <rect x="298" y="134" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">x</text>
  <!-- pointer j at second 'a' -->
  <path d="M 143 178 L 143 166" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j</text>

  <!-- ===== 三分支决策 ===== -->
  <rect x="160" y="206" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">比较 name[i] 与 typed[j]</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#888">（typed[j] 的去向只有两种）</text>

  <!-- 分支1: 相等 -->
  <rect x="40" y="270" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">相等 name[i]==typed[j]</text>
  <text x="115" y="306" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i++, j++（消费 name 字符）</text>

  <!-- 分支2: 长按 -->
  <rect x="205" y="270" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">typed[j]==typed[j-1]</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#d6a040">仅 j++（长按重复，跳过）</text>

  <!-- 分支3: 都不满足 -->
  <rect x="370" y="270" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两者皆不满足</text>
  <text x="445" y="306" text-anchor="middle" font-size="10.5" fill="#b85450">返回 false</text>

  <!-- 箭头连接 -->
  <path d="M 220 246 L 130 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 246 L 280 268" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 340 246 L 430 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 底部不变式 -->
  <rect x="40" y="330" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">不变式：typed[j] 要么对应 name[i]，要么是「上一个已匹配字符」的长按</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#446688">结尾要求 i 走完整个 name（typed 多余的尾字符也会被长按分支挡住）</text>
</svg>
