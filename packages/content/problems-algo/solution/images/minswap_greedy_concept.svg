<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：代价 = j 前方剩余数字个数（以 num = "4321", k = 4 为例）</text>

  <!-- Original array -->
  <text x="40" y="74" font-size="11" fill="#888">原数组</text>
  <!-- positions 0,1,2 (digits 4,3,2) = cost contributors (orange) -->
  <rect x="130" y="56" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="184" y="56" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="209" y="82" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="56" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="263" y="82" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- position 3 (digit 1) = chosen (green) -->
  <rect x="292" y="56" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="82" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <text x="155" y="110" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="209" y="110" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="263" y="110" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="317" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j=3 ←候选</text>

  <!-- Arc arrow: '1' moves to front, crossing 3 digits -->
  <path d="M 317 52 C 317 14, 155 14, 155 52" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="236" y="20" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 次相邻交换</text>

  <!-- cost annotation -->
  <text x="406" y="78" font-size="10" fill="#d6a040" font-weight="bold">代价 = 3</text>
  <text x="406" y="92" font-size="10" fill="#888">（前方 3 个剩余数字）</text>

  <!-- Down arrow -->
  <path d="M 280 120 L 280 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Result array -->
  <text x="40" y="178" font-size="11" fill="#888">结果</text>
  <rect x="130" y="160" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="160" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="238" y="160" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="292" y="160" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="406" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">k: 4 → 1</text>

  <!-- Formula box -->
  <rect x="30" y="218" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="240" font-size="12" fill="#446688" font-weight="bold">代价公式</text>
  <text x="50" y="258" font-size="11" fill="#444">cost(j) = BIT.query(j) = 原下标 [0, j−1] 中「尚未使用」的数字个数</text>
  <text x="50" y="274" font-size="11" fill="#444">= 把 num[j] 前移到当前空位所需的相邻交换次数；当 cost ≤ k 即可取用</text>

  <!-- BIT illustration -->
  <text x="40" y="308" font-size="11" fill="#888">BIT</text>
  <rect x="130" y="294" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="314" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="184" y="294" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="314" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="238" y="294" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="314" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="292" y="294" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="317" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="155" y="340" text-anchor="middle" font-size="10" fill="#888">p=1</text>
  <text x="209" y="340" text-anchor="middle" font-size="10" fill="#888">p=2</text>
  <text x="263" y="340" text-anchor="middle" font-size="10" fill="#888">p=3</text>
  <text x="317" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p=4 (已用)</text>

  <text x="406" y="306" font-size="10" fill="#666">1 = 剩余可用</text>
  <text x="406" y="322" font-size="10" fill="#b85450">0 = 已被取走</text>
  <text x="406" y="342" font-size="10" fill="#446688" font-weight="bold">query(j) = 前缀和</text>
</svg>
