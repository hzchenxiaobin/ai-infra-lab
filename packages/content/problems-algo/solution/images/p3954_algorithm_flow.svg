<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">窗口枚举：一趟循环收工</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="52" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 200 68 L 200 82" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="105" y="84" width="190" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← 0, lo ← max(1, n−k)</text>

  <path d="M 200 114 L 200 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="130" width="130" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ← lo</text>

  <path d="M 200 158 L 200 172" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：x <= n+k ? -->
  <polygon points="200,174 275,200 200,226 125,200" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ≤ n+k ?</text>

  <!-- 否 → 返回 -->
  <path d="M 275 200 L 372 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="192" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="430" cy="200" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 是 ↓ -->
  <path d="M 200 226 L 200 248" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="242" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形2：n & x == 0 ? -->
  <polygon points="200,250 280,278 200,306 120,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(n &amp; x) == 0 ?</text>

  <!-- 是 → ans += x -->
  <path d="M 120 278 L 78 278" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="270" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="264" width="60" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += x</text>
  <path d="M 50 292 L 50 332 L 152 332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → x++ -->
  <path d="M 200 306 L 200 318" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="316" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="152" y="320" width="96" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="339" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ← x + 1</text>

  <!-- 回到菱形1 -->
  <path d="M 248 334 L 340 334 L 340 200 L 282 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="326" font-size="11" fill="#666" filter="url(#rough2)">继续扫描</text>

  <text x="430" y="252" font-size="11" fill="#666" filter="url(#rough2)">窗口 ≤ 2k+1 ≤ 201 个</text>
  <text x="430" y="268" font-size="11" fill="#666" filter="url(#rough2)">每个一次按位与</text>
  <text x="430" y="284" font-size="11" fill="#666" filter="url(#rough2)">x = n 恒被剔除</text>
</svg>
