<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + C 段双指针</text>

  <!-- 菱形 1：n==1 且需 1→0？ -->
  <polygon points="280,38 380,62 280,86 180,62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n==1 且需 1→0 ？</text>

  <text x="388" y="54" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 380 62 L 402 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="406" y="47" width="110" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="461" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <text x="290" y="99" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 86 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="102" width="190" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M 280 132 L 280 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 2：i < n ? -->
  <polygon points="280,144 345,168 280,192 215,168" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ？</text>

  <text x="352" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 345 168 L 367 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="371" y="152" width="110" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="426" y="172" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="290" y="205" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 280 192 L 280 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 3：C 位？ -->
  <polygon points="280,210 390,238 280,266 170,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">s1[i]='1' 且 s2[i]='0' ？</text>
  <text x="280" y="251" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（C 位，需票边）</text>

  <text x="158" y="231" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 170 238 L 150 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- C 段处理框 -->
  <rect x="18" y="212" width="128" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82" y="230" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">右扩出 C 段长 k</text>
  <text x="82" y="245" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">ans += 3⌈k/2⌉ − k</text>
  <text x="82" y="260" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">i = j（跳到段尾）</text>

  <!-- C 段回流线 -->
  <path d="M 82 212 L 82 168 L 213 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="290" y="277" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 266 L 280 280" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 4：A 位？ -->
  <polygon points="280,280 390,308 280,336 170,308" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">s1[i]='0' 且 s2[i]='1' ？</text>
  <text x="280" y="321" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（A 位）</text>

  <text x="398" y="300" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 390 308 L 410 308" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- A 位计费框 -->
  <rect x="414" y="290" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="312" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <text x="292" y="352" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">否（B/D 免单）</text>
  <path d="M 280 336 L 280 364" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- A 位汇合线 -->
  <path d="M 470 326 L 470 380 L 344 380" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 前进框 -->
  <rect x="222" y="366" width="116" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- 回流线 -->
  <path d="M 280 394 L 280 408 L 532 408 L 532 200 L 290 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 小结框 -->
  <rect x="105" y="424" width="350" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无解 ⟺ n=1 且 1→0；答案 = Σ(3⌈k/2⌉−k) + #A</text>
  <text x="280" y="461" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">每位至多摊 2，答案 ≤ 2n；一趟 O(n) / O(1)</text>
</svg>
