<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分类讨论：答案表（n × presses）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">开关只看奇偶（按偶数次 = 无效）；前 3 盏决定整串 → 状态上限 8</text>

  <!-- ===== Table grid 4 cols × 4 rows ===== -->
  <!-- columns: header + presses 0,1,2,≥3 ; rows: header + n=1,2,≥3 -->
  <!-- col x centers: 130, 240, 330, 420, 500 ; cell w ~ 80 -->
  <g filter="url(#rough2)">
    <!-- outer frame -->
    <rect x="80" y="64" width="420" height="180" fill="#fff" stroke="#446688" stroke-width="1.6" rx="6"/>

    <!-- header row separator -->
    <line x1="80" y1="104" x2="500" y2="104" stroke="#446688" stroke-width="1.2"/>
    <!-- header col separator -->
    <line x1="180" y1="64" x2="180" y2="244" stroke="#446688" stroke-width="1.2"/>
    <!-- row separators -->
    <line x1="80" y1="150" x2="500" y2="150" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="198" x2="500" y2="198" stroke="#bbb" stroke-width="1"/>
    <!-- col separators -->
    <line x1="290" y1="64" x2="290" y2="244" stroke="#bbb" stroke-width="1"/>
    <line x1="380" y1="64" x2="380" y2="244" stroke="#bbb" stroke-width="1"/>
    <line x1="460" y1="64" x2="460" y2="244" stroke="#bbb" stroke-width="1"/>

    <!-- corner header -->
    <text x="130" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n ＼ presses</text>
    <!-- col headers -->
    <text x="235" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <text x="335" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="420" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <text x="480" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">≥ 3</text>

    <!-- row headers -->
    <text x="130" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">n = 1</text>
    <text x="130" y="180" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">n = 2</text>
    <text x="130" y="228" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">n ≥ 3</text>

    <!-- data cells -->
    <!-- row n=1: 1, 2, 2, 2 -->
    <text x="235" y="132" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">1</text>
    <text x="335" y="132" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
    <text x="420" y="132" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
    <text x="480" y="132" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

    <!-- row n=2: 1, 3, 4, 4 -->
    <text x="235" y="180" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">1</text>
    <text x="335" y="180" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
    <text x="420" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="480" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

    <!-- row n>=3: 1, 4, 7, 8 -->
    <text x="235" y="228" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">1</text>
    <text x="335" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="420" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
    <text x="480" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  </g>

  <!-- highlight the upper bound: 8 = 2^3 (3 independent basis switches) -->
  <rect x="466" y="208" width="30" height="32" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="262" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="60" y="282" font-size="11" fill="#444" font-weight="bold">读法：</text>
    <text x="60" y="300" font-size="10" fill="#555">• presses=0 → 不按，唯一状态（全亮）；• n=1 → 单灯最多 2 态；n=2 → 两灯最多 4 态</text>
    <text x="60" y="316" font-size="10" fill="#555">• n≥3 &amp; presses=2 → 7（唯独缺「全亮」之外的某种组合受限）；presses≥3 → 达到上限 8 = 2³</text>
  </g>
</svg>
