<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 频率表贪心配对</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按值升序处理，每步只剩唯一选择 → 贪心即最优</text>

  <!-- Start: n 奇? -->
  <polygon points="300,56 400,96 300,136 200,96" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">n 为奇?</text>
  <text x="300" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">len % 2 == 1</text>

  <!-- Yes: return [] -->
  <path d="M 400 96 L 480 96" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="88" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="120" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="480" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return []</text>

  <!-- No: down to count freq -->
  <path d="M 300 136 L 300 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="156" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="220" y="164" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="183" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">统计 freq + 排序键</text>
  <text x="300" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">Counter + sorted(keys)</text>

  <!-- Arrow down to loop -->
  <path d="M 300 204 L 300 224" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="210" y="228" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">for v in 升序键</text>

  <!-- Arrow down to freq[v]==0? -->
  <path d="M 300 262 L 300 282" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: freq[v]==0? -->
  <polygon points="300,286 390,326 300,366 210,326" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">freq[v]==0?</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">已被消耗</text>

  <!-- Yes: skip -> loop back (right side up) -->
  <path d="M 390 326 L 470 326 L 470 245 L 390 245" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳过</text>

  <!-- No: down to v==0? -->
  <path d="M 300 366 L 300 388" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="384" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision: v==0? -->
  <polygon points="300,392 390,432 300,472 210,432" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">v == 0?</text>
  <text x="300" y="446" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0×2 仍为 0</text>

  <!-- Yes (v==0): left -> freq[0] 奇? -->
  <path d="M 210 432 L 130 432" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="170" y="424" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <polygon points="130,408 70,432 130,456 190,432" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" transform="translate(0,0)"/>
  <text x="130" y="436" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">奇?</text>
  <path d="M 90 432 L 60 432 L 60 492 L 120 492" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="74" y="424" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是→[]</text>
  <path d="M 170 432 L 220 432 L 220 492 L 270 492" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="472" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶→加 0×c/2</text>

  <!-- No (v>0): right -> check freq[2v] -->
  <path d="M 390 432 L 460 432" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="425" y="424" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <polygon points="540,392 600,432 540,472 480,432" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="428" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2v 不足?</text>
  <text x="540" y="444" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">freq[2v]&lt;c</text>
  <path d="M 540 392 L 540 360 L 470 360 L 470 492 L 410 492" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="496" y="352" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是→[]</text>
  <path d="M 600 432 L 600 492 L 540 492" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="570" y="472" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否→加 v×c</text>

  <!-- Merge to result box -->
  <rect x="120" y="496" width="420" height="20" fill="none" stroke="none"/>
</svg>
