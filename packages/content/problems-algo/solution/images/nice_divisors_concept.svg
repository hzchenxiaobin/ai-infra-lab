<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：好因子数 = 各质因数指数的乘积</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">以 n = 200 = 2³ × 5² 为例，primeFactors = 3 + 2 = 5</text>

  <!-- ===== n decomposition ===== -->
  <rect x="60" y="60" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n = 200 = 2³ × 5²</text>
  <text x="260" y="97" text-anchor="middle" font-size="10" fill="#888">质因数（含重复）= [2, 2, 2, 5, 5]，共 5 个</text>

  <!-- ===== Nice divisor condition ===== -->
  <rect x="60" y="116" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#666">好因子 = 能被每个质因数整除 → 每种质因数至少取 1 个</text>

  <!-- ===== Choice boxes ===== -->
  <text x="80" y="176" font-size="11" fill="#444" font-weight="bold">质因数 2 的指数可选：1, 2, 3 → 3 种</text>
  <rect x="80" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="202" text-anchor="middle" font-size="11" fill="#333">2¹</text>
  <rect x="130" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#333">2²</text>
  <rect x="180" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="11" fill="#333">2³</text>
  <text x="240" y="202" font-size="11" fill="#446688" font-weight="bold">3 种选择</text>

  <text x="80" y="232" font-size="11" fill="#444" font-weight="bold">质因数 5 的指数可选：1, 2 → 2 种</text>
  <rect x="80" y="240" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#333">5¹</text>
  <rect x="130" y="240" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#333">5²</text>
  <text x="190" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">2 种选择</text>

  <!-- ===== Multiply ===== -->
  <line x1="120" y1="278" x2="120" y2="296" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="298" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">好因子数 = 3 × 2 = 6（乘法原理）</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888">好因子 = {10, 20, 40, 50, 100, 200}</text>

  <!-- ===== Generalization ===== -->
  <rect x="60" y="352" width="400" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">推广：n = p₁^a₁ × ⋯ × pₖ^aₖ → 好因子数 = a₁ × a₂ × ⋯ × aₖ</text>
</svg>
