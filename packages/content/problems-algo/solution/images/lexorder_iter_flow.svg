<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a8edb"/>
    </marker>
    <marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">迭代算法流程：每轮三选一决策</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="62" text-anchor="middle" font-size="11" fill="#888">维护游标 cur，共 n 轮，每轮先把 cur 加入结果，再决定下一个 cur</text>

  <!-- ===== Step 0: append cur ===== -->
  <g filter="url(#sk)">
    <rect x="330" y="80" width="200" height="40" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.6"/>
  </g>
  <text x="430" y="106" text-anchor="middle" font-size="13" fill="#333">每轮：<tspan font-weight="bold">res.append(cur)</tspan></text>
  <!-- arrow down to diamond 1 -->
  <path d="M 430 120 L 430 140" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Diamond 1: cur*10 <= n ? ===== -->
  <g filter="url(#sk)">
    <polygon points="430,142 540,182 430,222 320,182" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="430" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">cur × 10 ≤ n ?</text>
  <text x="430" y="196" text-anchor="middle" font-size="10" fill="#a07a2a">有第一个子节点？</text>

  <!-- "是" arrow right to blue box -->
  <path d="M 540 182 L 600 182" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="568" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">是</text>

  <!-- blue action box: cur *= 10 -->
  <g filter="url(#sk)">
    <rect x="600" y="156" width="220" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="710" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">cur ← cur × 10</text>
  <text x="710" y="198" text-anchor="middle" font-size="10.5" fill="#5a8a7a">深入第一个子节点（末位补 0）</text>

  <!-- "否" arrow down to diamond 2 -->
  <path d="M 430 222 L 430 248" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="238" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <!-- ===== Diamond 2: cur%10==9 or cur+1>n ? ===== -->
  <g filter="url(#sk)">
    <polygon points="430,250 560,300 430,350 300,300" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="430" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">cur%10==9</text>
  <text x="430" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">或 cur+1 &gt; n ?</text>
  <text x="430" y="324" text-anchor="middle" font-size="9.5" fill="#a05a5a">没有可用右兄弟？</text>

  <!-- "是" arrow left to orange box -->
  <path d="M 300 300 L 240 300" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="272" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">是</text>

  <!-- orange action box: cur /= 10 (backtrack) -->
  <g filter="url(#sk)">
    <rect x="40" y="276" width="200" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="140" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cur ← cur ÷ 10</text>
  <text x="140" y="314" text-anchor="middle" font-size="10.5" fill="#a07a2a">回溯到父节点</text>

  <!-- loop arrow from orange box back UP to diamond 2 top (re-check while condition) -->
  <path d="M 140 276 Q 140 230 200 230 Q 280 230 300 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#aro)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="200" y="222" text-anchor="middle" font-size="9.5" fill="#a07a2a" font-style="italic">while：重新检查</text>

  <!-- "否" arrow down to green box -->
  <path d="M 430 350 L 430 378" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="368" font-size="11" font-weight="bold" fill="#4a8e4a">否</text>

  <!-- green action box: cur += 1 -->
  <g filter="url(#sk)">
    <rect x="330" y="378" width="200" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="430" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">cur ← cur + 1</text>
  <text x="430" y="416" text-anchor="middle" font-size="10.5" fill="#5a8a5a">转向右兄弟</text>

  <!-- ===== Convergence: all three actions -> next round ===== -->
  <!-- blue box down to convergence -->
  <path d="M 710 208 Q 710 440 530 440" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <!-- green box down to convergence -->
  <path d="M 430 426 L 430 440" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- convergence box -->
  <g filter="url(#sk)">
    <rect x="300" y="440" width="260" height="40" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.6"/>
  </g>
  <text x="430" y="466" text-anchor="middle" font-size="12.5" fill="#333">进入下一轮（共 <tspan font-weight="bold">n</tspan> 轮）</text>

  <!-- ===== Bottom notes: three moves explained ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="496" width="780" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="516" text-anchor="middle" font-size="11" fill="#555">
    <tspan font-weight="bold" fill="#2b6e9e">深入</tspan>（优先）：子节点存在就往下走
    <tspan fill="#888"> · </tspan>
    <tspan font-weight="bold" fill="#d6a040">回溯</tspan>：末位 9 或右兄弟越界 → 回父节点继续找
    <tspan fill="#888"> · </tspan>
    <tspan font-weight="bold" fill="#2e6e2e">右兄弟</tspan>：回溯停止后 +1
  </text>
  <text x="430" y="534" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">
    while 条件用「或」非「且」：cur%10==9 与 cur+1&gt;n 任一成立即无右兄弟，必须回溯
  </text>
</svg>
