<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 条会话分桶 + 空桶 [10-15&gt; 保留为 0</text>

  <!-- ============ Sessions input table (left) ============ -->
  <text x="80" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Sessions（输入）</text>
  <rect x="20" y="58" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="73" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">id</text>
  <text x="90" y="73" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">duration(s)</text>

  <rect x="20" y="80" width="120" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="92" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="90" y="92" text-anchor="middle" font-size="8.5" fill="#333">30</text>

  <rect x="20" y="98" width="120" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="110" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="90" y="110" text-anchor="middle" font-size="8.5" fill="#333">199</text>

  <rect x="20" y="116" width="120" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="128" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="90" y="128" text-anchor="middle" font-size="8.5" fill="#333">299</text>

  <rect x="20" y="134" width="120" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="146" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="90" y="146" text-anchor="middle" font-size="8.5" fill="#333">580</text>

  <rect x="20" y="152" width="120" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="164" text-anchor="middle" font-size="8.5" fill="#333">5</text>
  <text x="90" y="164" text-anchor="middle" font-size="8.5" fill="#333">1000</text>

  <!-- ============ Time axis (middle) ============ -->
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间轴分桶（秒）</text>

  <!-- Axis line -->
  <line x1="170" y1="170" x2="470" y2="170" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrB)"/>

  <!-- Ticks -->
  <line x1="170" y1="165" x2="170" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="9" fill="#446688">0</text>

  <line x1="245" y1="165" x2="245" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="192" text-anchor="middle" font-size="9" fill="#446688">300</text>

  <line x1="320" y1="165" x2="320" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="9" fill="#446688">600</text>

  <line x1="395" y1="165" x2="395" y2="178" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="192" text-anchor="middle" font-size="9" fill="#446688">900</text>

  <!-- Bucket labels above axis -->
  <text x="207" y="160" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">[0-5&gt;</text>
  <text x="282" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[5-10&gt;</text>
  <text x="357" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="440" y="160" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">15 or more</text>

  <!-- Arrows from sessions to buckets -->
  <!-- session 1: 30 -> [0-5> -->
  <path d="M140,89 Q170,100 207,165" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- session 2: 199 -> [0-5> -->
  <path d="M140,107 Q170,120 210,165" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- session 3: 299 -> [0-5> (near boundary) -->
  <path d="M140,125 Q175,135 213,165" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- session 4: 580 -> [5-10> -->
  <path d="M140,143 Q220,145 282,165" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- session 5: 1000 -> 15 or more -->
  <path d="M140,161 Q300,150 440,165" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ============ Bucket count boxes (right side) ============ -->
  <!-- [0-5> count -->
  <rect x="480" y="78" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">[0-5&gt;</text>
  <text x="520" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <text x="520" y="122" text-anchor="middle" font-size="7.5" fill="#888">id:1,2,3</text>

  <!-- [5-10> count -->
  <rect x="480" y="124" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[5-10&gt;</text>
  <text x="520" y="156" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="520" y="168" text-anchor="middle" font-size="7.5" fill="#888">id:4</text>

  <!-- [10-15> count (empty) -->
  <rect x="480" y="170" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="520" y="186" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="520" y="202" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="520" y="214" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">空桶！</text>

  <!-- 15 or more count -->
  <rect x="480" y="216" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="232" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">15 or more</text>
  <text x="520" y="248" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="520" y="260" text-anchor="middle" font-size="7.5" fill="#888">id:5</text>

  <!-- Arrows from axis to count boxes -->
  <path d="M470,170 Q475,100 480,98" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M470,170 Q475,145 480,144" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M470,170 Q475,190 480,190" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M470,170 Q475,235 480,236" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- ============ Result table (bottom) ============ -->
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终结果（守恒校验：3+1+0+1 = 5 ✓）</text>
  <rect x="170" y="298" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="313" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">bin</text>
  <text x="340" y="313" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">total</text>

  <rect x="170" y="320" width="240" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="332" text-anchor="middle" font-size="9" fill="#333">[0-5&gt;</text>
  <text x="340" y="332" text-anchor="middle" font-size="9" fill="#333">3</text>

  <rect x="170" y="338" width="240" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="350" text-anchor="middle" font-size="9" fill="#333">[5-10&gt;</text>
  <text x="340" y="350" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="170" y="356" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="368" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="340" y="368" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>

  <rect x="170" y="374" width="240" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="386" text-anchor="middle" font-size="9" fill="#333">15 or more</text>
  <text x="340" y="386" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- ============ Key notes ============ -->
  <rect x="20" y="408" width="540" height="44" fill="#ffffff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="423" font-size="9" fill="#d6a040" font-weight="bold">⚠ 空桶 [10-15&gt;：</text>
  <text x="150" y="423" font-size="8.5" fill="#333">WHERE 600 ≤ d &lt; 900 不匹配任何行，COUNT(*) 对空集返回 0（非 NULL），行照样输出</text>
  <text x="30" y="438" font-size="9" fill="#446688" font-weight="bold">边界值 299：</text>
  <text x="110" y="438" font-size="8.5" fill="#333">差 1 秒到 300，d &lt; 300 包含 299 → 归入 [0-5&gt;（左闭右开 [0,300) 要卡准）</text>
  <text x="30" y="450" font-size="9" fill="#4a7a3a" font-weight="bold">守恒校验：</text>
  <text x="100" y="450" font-size="8.5" fill="#333">四桶 total 之和 = Sessions 行数（3+1+0+1=5 ✓），区间无重叠无缝隙</text>
</svg>
