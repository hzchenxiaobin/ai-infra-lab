<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：grid = [[0,1,0],[0,1,1],[0,1,0]]</text>

  <!-- 3x3 grid, cell 52, origin (64,56) -->
  <rect x="64" y="56" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="87" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="116" y="56" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="87" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <rect x="168" y="56" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="87" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="64" y="108" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="139" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="116" y="108" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="142" y="139" text-anchor="middle" font-size="14" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="108" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="139" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>

  <rect x="64" y="160" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="191" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="116" y="160" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="191" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <rect x="168" y="160" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="191" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- row sums -->
  <rect x="232" y="68" width="72" height="28" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="268" y="87" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">row[0]=1</text>
  <rect x="232" y="120" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="268" y="139" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">row[1]=2</text>
  <rect x="232" y="172" width="72" height="28" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="268" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">row[2]=1</text>

  <!-- col sums -->
  <rect x="64" y="220" width="52" height="28" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="239" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">col[0]=0</text>
  <rect x="116" y="220" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="142" y="239" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">col[1]=3</text>
  <rect x="168" y="220" width="52" height="28" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="194" y="239" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">col[2]=1</text>

  <!-- contribution table -->
  <rect x="300" y="56" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="73" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1 的格子</text>
  <rect x="376" y="56" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="73" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">row[x]−1</text>
  <rect x="440" y="56" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="472" y="73" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">col[y]−1</text>
  <rect x="504" y="56" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="526" y="73" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="300" y="82" width="76" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="101" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(0,1)</text>
  <rect x="376" y="82" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="408" y="101" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="440" y="82" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="101" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="504" y="82" width="44" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="526" y="101" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>

  <rect x="300" y="112" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="338" y="131" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <rect x="376" y="112" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="408" y="131" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="440" y="112" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="472" y="131" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="504" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="526" y="131" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="300" y="142" width="76" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(1,2)</text>
  <rect x="376" y="142" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="408" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="440" y="142" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="504" y="142" width="44" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="526" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>

  <rect x="300" y="172" width="76" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(2,1)</text>
  <rect x="376" y="172" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="408" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="440" y="172" width="64" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="504" y="172" width="44" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="526" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>

  <!-- total -->
  <rect x="64" y="270" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="179" y="295" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">ans = 0 + 2 + 0 + 0 = 2 ✓</text>

  <!-- the two triangles -->
  <text x="330" y="278" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">两个三角形都以 (1,1) 为拐点：</text>
  <text x="338" y="300" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">① (0,1) – (1,1) – (1,2)</text>
  <text x="338" y="322" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">② (2,1) – (1,1) – (1,2)</text>

  <!-- warning: same column -->
  <rect x="64" y="326" width="484" height="44" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="306" y="344" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">⚠️ 同列的 (0,1),(1,1),(2,1) 不算：三点全在同一列，</text>
  <text x="306" y="362" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">没有任何元素能「与一点同行、与另一点同列」</text>
</svg>
