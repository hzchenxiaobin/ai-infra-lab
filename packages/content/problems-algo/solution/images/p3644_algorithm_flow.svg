<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描，错位元素全 AND</text>

  <!-- 开始 -->
  <ellipse cx="300" cy="58" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 300 78 L 300 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="228" y="94" width="144" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = -1（全 1 位），i = 0</text>
  <path d="M 300 126 L 300 148" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：i < n ? -->
  <polygon points="252,178 300,150 348,178 300,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="300" y="183" text-anchor="middle" font-size="13" fill="#b3541e" filter="url(#rough2)">i &lt; n ?</text>

  <!-- A 否 → 返回 -->
  <path d="M 348 178 L 497 178 L 497 238" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="170" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否（扫完了）</text>
  <rect x="440" y="240" width="115" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="497" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans == -1 ?</text>
  <text x="497" y="280" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0 : 返回 ans</text>

  <!-- A 是 ↓ -->
  <path d="M 300 206 L 300 240" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="228" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 B：nums[i] == i ? -->
  <polygon points="238,272 300,242 362,272 300,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="300" y="277" text-anchor="middle" font-size="12.5" fill="#b3541e" filter="url(#rough2)">nums[i] == i ?</text>

  <!-- B 是：跳过，右侧绕行 -->
  <path d="M 362 272 L 420 272 L 420 403 L 340 403" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="264" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是，跳过它</text>

  <!-- B 否 ↓ -->
  <path d="M 300 302 L 300 326" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="318" font-size="11.5" fill="#b85450" filter="url(#rough2)">否（错位）</text>

  <!-- ans &= nums[i] -->
  <rect x="238" y="328" width="124" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="349" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans &amp;= nums[i]</text>
  <path d="M 300 360 L 300 388" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="270" y="390" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="305" y="409" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i++</text>

  <!-- 回环 -->
  <path d="M 270 404 L 92 404 L 92 178 L 246 178" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="290" font-size="11.5" fill="#446688" filter="url(#rough2)">继续下一个</text>
</svg>
