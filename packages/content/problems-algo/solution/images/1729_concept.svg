<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：按 user_id 分组 + COUNT 计关注者数</text>
  <path d="M 200 36 Q 360 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: Followers table (raw) ===== -->
  <text x="40" y="66" font-size="11" fill="#888">① FROM Followers</text>
  <g filter="url(#rough2)"><rect x="30" y="72" width="200" height="148" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="130" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Followers 表（原始）</text>
  <line x1="30" y1="96" x2="230" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="60" y="110" font-size="10" fill="#888" font-weight="bold">user_id</text>
  <text x="170" y="110" font-size="10" fill="#888" font-weight="bold">follower_id</text>
  <line x1="135" y1="98" x2="135" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows, color-coded by user_id -->
  <text x="62" y="128" font-size="10" fill="#4a8edb">0</text>
  <text x="172" y="128" font-size="10" fill="#4a8edb">1</text>

  <text x="62" y="146" font-size="10" fill="#4a7a3a">1</text>
  <text x="172" y="146" font-size="10" fill="#4a7a3a">0</text>

  <text x="62" y="164" font-size="10" fill="#b85450">2</text>
  <text x="172" y="164" font-size="10" fill="#b85450">0</text>

  <text x="62" y="182" font-size="10" fill="#b85450">2</text>
  <text x="172" y="182" font-size="10" fill="#b85450">1</text>

  <text x="130" y="208" text-anchor="middle" font-size="9" fill="#999">共 4 行</text>

  <!-- Arrow 1: table -> group by -->
  <path d="M 240 146 L 280 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: GROUP BY ===== -->
  <text x="290" y="66" font-size="11" fill="#888">② GROUP BY user_id</text>
  <g filter="url(#rough2)"><rect x="284" y="80" width="170" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="369" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">按 user_id 分组</text>

  <!-- group 0 -->
  <g filter="url(#rough2)"><rect x="296" y="112" width="146" height="30" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.2" rx="4"/></g>
  <text x="310" y="131" font-size="10" fill="#4a8edb" font-weight="bold">user_id=0</text>
  <text x="410" y="131" font-size="10" fill="#4a8edb">{1}</text>

  <!-- group 1 -->
  <g filter="url(#rough2)"><rect x="296" y="150" width="146" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/></g>
  <text x="310" y="169" font-size="10" fill="#4a7a3a" font-weight="bold">user_id=1</text>
  <text x="410" y="169" font-size="10" fill="#4a7a3a">{0}</text>

  <!-- group 2 -->
  <g filter="url(#rough2)"><rect x="296" y="188" width="146" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="310" y="207" font-size="10" fill="#b85450" font-weight="bold">user_id=2</text>
  <text x="310" y="221" font-size="9" fill="#b85450">{0, 1}</text>

  <text x="369" y="258" text-anchor="middle" font-size="9" fill="#888">3 个分组</text>

  <!-- Arrow 2: group by -> count -->
  <path d="M 460 180 L 500 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: COUNT + result ===== -->
  <text x="510" y="66" font-size="11" fill="#888">③ COUNT + ORDER BY</text>
  <g filter="url(#rough2)"><rect x="504" y="80" width="190" height="148" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="599" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果表</text>
  <line x1="504" y1="104" x2="694" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="524" y="118" font-size="10" fill="#888" font-weight="bold">user_id</text>
  <text x="624" y="118" font-size="10" fill="#888" font-weight="bold">followers_count</text>
  <line x1="599" y1="106" x2="599" y2="228" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="528" y="136" font-size="10" fill="#4a8edb">0</text>
  <text x="632" y="136" font-size="10" fill="#4a8edb">1</text>

  <text x="528" y="156" font-size="10" fill="#4a7a3a">1</text>
  <text x="632" y="156" font-size="10" fill="#4a7a3a">1</text>

  <text x="528" y="176" font-size="10" fill="#b85450">2</text>
  <text x="632" y="176" font-size="10" fill="#b85450">2</text>

  <text x="599" y="214" text-anchor="middle" font-size="9" fill="#888">ORDER BY user_id</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="300" width="640" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="324" font-size="12" fill="#a06a10" font-weight="bold">⭐ 主键 (user_id, follower_id) 保证无重复行 → COUNT(follower_id) = COUNT(*) = 组内行数</text>
  <text x="60" y="344" font-size="11" fill="#a06a10">每个 follower_id 在同一 user_id 下只出现一次，无需 COUNT(DISTINCT)。</text>
  <text x="60" y="364" font-size="11" fill="#a06a10">同一 user_id 的多行折叠成一组，COUNT 数行数即关注者个数。</text>
</svg>
