<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：格式固定切两半 + FOIL 展开合并</text>

  <!-- ===== Part 1: Parse "a+bi" ===== -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">① 解析：找到唯一 '+' 切两半</text>

  <!-- the string "1+-1i" with parts highlighted -->
  <rect x="60" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <rect x="94" y="68" width="24" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+</text>
  <text x="106" y="64" text-anchor="middle" font-size="9" fill="#b85450">分隔符</text>

  <rect x="118" y="68" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">-1i</text>

  <!-- arrows down to extracted values -->
  <path d="M 77 98 L 77 112" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 98 L 146 112" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="114" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="77" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a = 1</text>

  <rect x="110" y="114" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="153" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">b = -1 （去 i）</text>

  <text x="300" y="130" font-size="10.5" fill="#888">stoi 自动处理负号，i² = −1</text>

  <!-- ===== Part 2: FOIL expansion ===== -->
  <text x="40" y="168" font-size="12" fill="#4a7a3a" font-weight="bold">② 乘法：FOIL 展开四项，i²=−1 合并</text>

  <!-- (a+bi)(c+di) big formula box -->
  <rect x="40" y="178" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(a + bi)(c + di) = ac + adi + bci + bdi²</text>

  <path d="M 290 208 L 290 222" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- four term boxes -->
  <rect x="40" y="224" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="242" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ac</text>
  <text x="90" y="258" text-anchor="middle" font-size="9.5" fill="#888">实部</text>

  <rect x="150" y="224" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">adi</text>
  <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#888">虚部</text>

  <rect x="260" y="224" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">bci</text>
  <text x="310" y="258" text-anchor="middle" font-size="9.5" fill="#888">虚部</text>

  <rect x="370" y="224" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">bdi²</text>
  <text x="420" y="258" text-anchor="middle" font-size="9.5" fill="#b85450">i²=−1 → 实部</text>

  <!-- combine arrows -->
  <path d="M 90 264 L 90 280" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 264 L 420 280" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 264 L 200 280" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 264 L 310 280" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merged result -->
  <rect x="40" y="282" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="302" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">实部 = ac − bd</text>

  <rect x="300" y="282" width="250" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="302" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">虚部 = (ad + bc)i</text>

  <path d="M 290 312 L 290 326" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final format box -->
  <rect x="80" y="328" width="420" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="349" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果 = to_string(ac−bd) + "+" + to_string(ad+bc) + "i"</text>

  <!-- ===== key insight notes ===== -->
  <rect x="40" y="380" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">格式保证唯一 '+' 分隔</text>
  <text x="160" y="418" text-anchor="middle" font-size="10.5" fill="#555">b&lt;0 时写作 "a+-bi"</text>
  <text x="160" y="434" text-anchor="middle" font-size="10.5" fill="#555">找第一个 '+' 即可切开</text>
  <text x="160" y="448" text-anchor="middle" font-size="10.5" fill="#555">stoi 自动吃负号</text>

  <rect x="300" y="380" width="240" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="400" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i² = −1 是唯一技巧</text>
  <text x="420" y="418" text-anchor="middle" font-size="10.5" fill="#555">bdi² = −bd → 挪入实部</text>
  <text x="420" y="434" text-anchor="middle" font-size="10.5" fill="#555">adi + bci → 虚部合并</text>
  <text x="420" y="448" text-anchor="middle" font-size="10.5" fill="#555">无进位/无借位，纯算术</text>
</svg>
