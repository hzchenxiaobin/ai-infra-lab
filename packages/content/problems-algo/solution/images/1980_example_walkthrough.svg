<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = ["111","011","001"]（n=3）</text>

  <!-- table header -->
  <g font-size="11.5">
    <rect x="40" y="52" width="44" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="62" y="72" text-anchor="middle" fill="#446688" font-weight="bold">i</text>
    <rect x="84" y="52" width="90" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="129" y="72" text-anchor="middle" fill="#446688" font-weight="bold">nums[i]</text>
    <rect x="174" y="52" width="90" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="219" y="72" text-anchor="middle" fill="#d6a040" font-weight="bold">nums[i][i]</text>
    <rect x="264" y="52" width="50" height="30" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="72" text-anchor="middle" fill="#888" font-weight="bold">flip</text>
    <rect x="314" y="52" width="90" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="359" y="72" text-anchor="middle" fill="#b85450" font-weight="bold">answer[i]</text>
    <rect x="404" y="52" width="176" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="492" y="72" text-anchor="middle" fill="#4a7a3a" font-weight="bold">answer ≠ nums[i] 于第 i 位</text>
  </g>

  <!-- row i=0 : nums[0]="111", diag=1, flip=0, ans=0 -->
  <g font-size="12">
    <rect x="40" y="86" width="44" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="62" y="111" text-anchor="middle" fill="#444" font-weight="bold">0</text>
    <rect x="84" y="86" width="90" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="129" y="111" text-anchor="middle" fill="#444">1 1 1</text>
    <rect x="174" y="86" width="90" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="219" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="264" y="86" width="50" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="111" text-anchor="middle" fill="#888">→</text>
    <rect x="314" y="86" width="90" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="359" y="111" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="404" y="86" width="176" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="492" y="111" text-anchor="middle" fill="#3a5a2a">第 0 位：0 ≠ 1 ✓</text>
  </g>

  <!-- row i=1 : nums[1]="011", diag=1, flip=0, ans=0 -->
  <g font-size="12">
    <rect x="40" y="130" width="44" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="62" y="155" text-anchor="middle" fill="#444" font-weight="bold">1</text>
    <rect x="84" y="130" width="90" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="129" y="155" text-anchor="middle" fill="#444">0 1 1</text>
    <rect x="174" y="130" width="90" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="219" y="155" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="264" y="130" width="50" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="155" text-anchor="middle" fill="#888">→</text>
    <rect x="314" y="130" width="90" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="359" y="155" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="404" y="130" width="176" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="492" y="155" text-anchor="middle" fill="#3a5a2a">第 1 位：0 ≠ 1 ✓</text>
  </g>

  <!-- row i=2 : nums[2]="001", diag=1, flip=0, ans=0 -->
  <g font-size="12">
    <rect x="40" y="174" width="44" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="62" y="199" text-anchor="middle" fill="#444" font-weight="bold">2</text>
    <rect x="84" y="174" width="90" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="129" y="199" text-anchor="middle" fill="#444">0 0 1</text>
    <rect x="174" y="174" width="90" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="219" y="199" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="264" y="174" width="50" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="199" text-anchor="middle" fill="#888">→</text>
    <rect x="314" y="174" width="90" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="359" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="404" y="174" width="176" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="492" y="199" text-anchor="middle" fill="#3a5a2a">第 2 位：0 ≠ 1 ✓</text>
  </g>

  <!-- result -->
  <rect x="40" y="228" width="540" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="253" font-size="12.5" fill="#3a5a2a" font-weight="bold">answer = "000"：与 3 个串各在第 i 位不同 ⟹ 不在 nums 中 ✓</text>

  <!-- example 1 mini -->
  <rect x="40" y="284" width="540" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = ["01","10"]（n=2）</text>
  <text x="56" y="326" font-size="11.5" fill="#444">对角线：nums[0][0]='0'，nums[1][1]='0'</text>
  <text x="56" y="344" font-size="11.5" fill="#444">翻转 → answer = "11"（与 "01" 第 0 位不同，与 "10" 第 1 位不同）✓</text>
  <text x="56" y="362" font-size="10.5" fill="#888">注：答案不唯一，"00" 也可，对角线法只是给出一种构造性证明</text>

  <!-- takeaway -->
  <rect x="40" y="388" width="540" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="408" font-size="11" fill="#555" font-weight="bold">观察要点</text>
  <text x="56" y="424" font-size="10.5" fill="#555">对角线法不枚举候选、不查哈希，直接构造一个与所有 n 个串各差一位的串，构造即正确性证明</text>
</svg>
