<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5，生成器逐个产出</text>

  <!-- Table header -->
  <rect x="30" y="44" width="80" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>

  <rect x="110" y="44" width="60" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>

  <rect x="170" y="44" width="130" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">计算</text>

  <rect x="300" y="44" width="100" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">result</text>

  <rect x="400" y="44" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">yield</text>

  <!-- Row 1: init, yield 0! -->
  <rect x="30" y="74" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="11" fill="#333">初始</text>

  <rect x="110" y="74" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>

  <rect x="170" y="74" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="92" text-anchor="middle" font-size="11" fill="#666">result = 1</text>

  <rect x="300" y="74" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="400" y="74" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 (0!)</text>

  <!-- Row 2: i=1 -->
  <rect x="30" y="104" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#333">第1轮</text>

  <rect x="110" y="104" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="170" y="104" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">1 × 1</text>

  <rect x="300" y="104" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="400" y="104" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="122" text-anchor="middle" font-size="11" fill="#333">1 (1!)</text>

  <!-- Row 3: i=2 -->
  <rect x="30" y="134" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333">第2轮</text>

  <rect x="110" y="134" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <rect x="170" y="134" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">1 × 2</text>

  <rect x="300" y="134" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <rect x="400" y="134" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="152" text-anchor="middle" font-size="11" fill="#333">2 (2!)</text>

  <!-- Row 4: i=3 -->
  <rect x="30" y="164" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="11" fill="#333">第3轮</text>

  <rect x="110" y="164" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="170" y="164" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a">2 × 3</text>

  <rect x="300" y="164" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <rect x="400" y="164" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="182" text-anchor="middle" font-size="11" fill="#333">6 (3!)</text>

  <!-- Row 5: i=4 -->
  <rect x="30" y="194" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#333">第4轮</text>

  <rect x="110" y="194" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="170" y="194" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">6 × 4</text>

  <rect x="300" y="194" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">24</text>

  <rect x="400" y="194" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="212" text-anchor="middle" font-size="11" fill="#333">24 (4!)</text>

  <!-- Row 6: i=5 -->
  <rect x="30" y="224" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第5轮</text>

  <rect x="110" y="224" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <rect x="170" y="224" width="130" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">24 × 5</text>

  <rect x="300" y="224" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">120</text>

  <rect x="400" y="224" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">120 (5!)</text>

  <!-- Final output -->
  <line x1="30" y1="270" x2="530" y2="270" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="296" font-size="12" fill="#555" font-weight="bold">生成器产出的完整序列：</text>

  <rect x="30" y="306" width="500" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[1, 1, 2, 6, 24, 120]</text>

  <text x="30" y="362" font-size="10" fill="#888">每轮只做一次乘法（result *= i），共 n 次乘法 + 1 次初始 yield</text>
</svg>
