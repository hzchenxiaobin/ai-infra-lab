<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数法求最小公共元素</text>

  <!-- Step 1: init -->
  <rect x="130" y="42" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化 count[1..U] = 0</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#888">U = 10^4（值域上界）</text>

  <!-- Arrow 1->2 -->
  <path d="M 260 90 L 260 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: count -->
  <rect x="80" y="112" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历 mat 每行每个元素 x</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#555">count[x]++（严格递增 → 每行至多 +1）</text>

  <!-- Arrow 2->3 -->
  <path d="M 260 164 L 260 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: find -->
  <rect x="80" y="186" width="360" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ x 从 1 到 U 顺序扫描</text>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#555">找最小的 count[x] == m</text>

  <!-- Arrow 3->decision -->
  <path d="M 260 238 L 260 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,260 350,300 260,340 170,300" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找到？</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#555">count[x]==m</text>

  <!-- Yes arrow: right -->
  <path d="M 350 300 L 392 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="371" y="294" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <!-- Return x box -->
  <rect x="392" y="282" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="439" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 x</text>

  <!-- No arrow: left -->
  <path d="M 170 300 L 128 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="149" y="294" text-anchor="middle" font-size="9" fill="#b85450">否</text>

  <!-- Return -1 box -->
  <rect x="33" y="282" width="95" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="305" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- Key insight box -->
  <rect x="40" y="362" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#444">💡 顺序扫描保证返回最小的公共元素；扫描结束未找到则返回 -1</text>
</svg>