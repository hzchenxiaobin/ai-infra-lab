<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Alice 08-15..08-18 ∩ Bob 08-16..08-19 → 3</text>

  <!-- Header row -->
  <rect x="40" y="40" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="247" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Alice</text>
  <text x="422" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Bob</text>
  <!-- column dividers -->
  <path d="M 150 40 L 150 164" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 345 40 L 345 164" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Row 1: arrive -->
  <rect x="40" y="68" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="89" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arrive</text>
  <text x="247" y="89" text-anchor="middle" font-size="11.5" fill="#4a7a3a">08-15 → 227</text>
  <text x="422" y="89" text-anchor="middle" font-size="11.5" fill="#446688">08-16 → 228</text>

  <!-- Row 2: leave -->
  <rect x="40" y="100" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">leave</text>
  <text x="247" y="121" text-anchor="middle" font-size="11.5" fill="#4a7a3a">08-18 → 230</text>
  <text x="422" y="121" text-anchor="middle" font-size="11.5" fill="#446688">08-19 → 231</text>

  <!-- Row 3: 区间 -->
  <rect x="40" y="132" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">区间</text>
  <text x="247" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[227, 230]</text>
  <text x="422" y="153" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">[228, 231]</text>

  <!-- Arrow -->
  <path d="M 270 176 L 270 194" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="189" font-size="10.5" fill="#888">cum[8]=212，故 08-15 = 212+15 = 227</text>

  <!-- Compute lines -->
  <text x="80" y="214" font-size="11.5" fill="#333">max(start) = max(227, 228) = <tspan fill="#b85450" font-weight="bold">228</tspan></text>
  <text x="80" y="234" font-size="11.5" fill="#333">min(end)&#160;&#160;= min(230, 231) = <tspan fill="#b85450" font-weight="bold">230</tspan></text>

  <!-- Result box -->
  <rect x="150" y="248" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">ans = 230 − 228 + 1 = 3 ✓</text>

  <!-- Notes -->
  <text x="40" y="316" font-size="10.5" fill="#888">• 闭区间含端点，故求交后 +1（8/16、17、18 共 3 天，端点 228 与 230 均含）</text>
  <text x="40" y="334" font-size="10.5" fill="#888">• 若结果 ≤ 0（如示例 2：Alice [274,304]，Bob [305,365] → 304−305+1=0）→ max(0, ·) 截断</text>
  <text x="40" y="352" font-size="10.5" fill="#888">• 日期→天数是一一映射：同一年非闰年保证 (月,日) 与年内天数严格单调对应</text>
</svg>
