<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举区间内每个数，逐位判定峰谷</text>

  <!-- A: outer enumeration -->
  <rect x="110" y="32" width="180" height="36" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x 从 num1 遍历到 num2</text>
  <path d="M 200 68 L 200 82" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- B: to string -->
  <rect x="125" y="84" width="150" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s ← to_string(x)</text>
  <path d="M 200 118 L 200 132" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- C: inner index -->
  <rect x="125" y="134" width="150" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← 1</text>
  <path d="M 200 168 L 200 184" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- D2: has more inner digits? -->
  <polygon points="200,186 292,224 200,262 108,224" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i + 1 &lt; len(s) ?</text>
  <text x="200" y="237" text-anchor="middle" font-size="9.5" fill="#a87020" filter="url(#rough2)">（还有内部数位？）</text>

  <text x="306" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 292 224 L 346 224" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="350" y="202" width="182" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="441" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本数统计完毕 → 取下一个 x</text>
  <text x="441" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">全部遍历完 → 返回 ans</text>

  <text x="208" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 200 262 L 200 296" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- D3: peak or valley? -->
  <polygon points="200,298 302,336 200,374 98,336" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[i] 是峰或谷？</text>
  <text x="200" y="350" text-anchor="middle" font-size="9.5" fill="#a85450" filter="url(#rough2)">(s[i]−s[i−1])·(s[i]−s[i+1]) &gt; 0</text>

  <text x="312" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 302 336 L 354 336" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="358" y="318" width="134" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← ans + 1</text>

  <text x="208" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 200 374 L 200 404" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- G: advance i -->
  <rect x="145" y="406" width="110" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="428" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- ans++ merges into i++ -->
  <path d="M 425 354 L 425 423 L 259 423" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- i++ loops back to D2 -->
  <path d="M 145 423 L 60 423 L 60 224 L 104 224" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="330" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 330)" filter="url(#rough2)">判定下一个数位</text>

  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">每个数至多 6 位 → 单数 O(1)；区间至多 10⁵ 个数 → 总操作 ~10⁶ 级</text>
</svg>
