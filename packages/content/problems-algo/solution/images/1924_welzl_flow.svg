<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">Welzl 算法流程（迭代版）</text>

  <!-- Step 1: Shuffle -->
  <rect x="170" y="42" width="180" height="35" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">随机打乱点集 P</text>

  <line x1="260" y1="79" x2="260" y2="95" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="170" y="97" width="180" height="35" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C = 点圆(P[0])，半径 = 0</text>

  <line x1="260" y1="134" x2="260" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop -->
  <rect x="130" y="152" width="260" height="35" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i = 1 to n−1</text>

  <line x1="260" y1="189" x2="260" y2="205" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,207 350,245 260,283 170,245" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">P[i] 在 C 内?</text>

  <!-- Yes arrow -->
  <line x1="350" y1="245" x2="410" y2="245" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="238" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="385" y="258" font-size="10" fill="#4a7a3a" filter="url(#rough2)">跳过</text>

  <!-- No arrow -->
  <line x1="260" y1="283" x2="260" y2="299" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="293" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Expand box -->
  <rect x="80" y="301" width="360" height="70" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P[i] 必在最小包围圆边界上</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">C = from1(P[i])，再遍历 j &lt; i</text>
  <text x="260" y="357" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">逐层加入边界点：from2 → from3</text>

  <line x1="260" y1="373" x2="260" y2="389" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="170" y="391" width="180" height="35" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 [cx, cy, r]</text>
</svg>
