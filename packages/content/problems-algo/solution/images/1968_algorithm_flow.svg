<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 分半 → 交错填充 → 返回</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">开始：输入 nums</text>

  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: Sort -->
  <rect x="170" y="104" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">① sort(nums) 升序排序</text>

  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Split -->
  <rect x="150" y="164" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② mid = (n+1) / 2</text>
  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#888">小半 = nums[0..mid-1], 大半 = nums[mid..n-1]</text>

  <path d="M 280 210 L 280 230" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Loop -->
  <rect x="160" y="234" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">③ 遍历 i = 0 → n-1</text>

  <path d="M 280 270 L 280 288" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: i even? -->
  <polygon points="280,292 380,332 280,372 180,332" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i % 2 == 0 ?</text>
  <text x="280" y="344" text-anchor="middle" font-size="9.5" fill="#888">(偶数位)</text>

  <!-- Yes: even -> small half -->
  <path d="M 180 332 L 80 332 L 80 372" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="20" y="376" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">res[i] = nums[i/2]</text>
  <text x="90" y="412" text-anchor="middle" font-size="9.5" fill="#888">(从小半取)</text>

  <!-- No: odd -> large half -->
  <path d="M 380 332 L 480 332 L 480 372" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="324" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <rect x="400" y="376" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="396" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">res[i] = nums[mid+i/2]</text>
  <text x="475" y="412" text-anchor="middle" font-size="9.5" fill="#888">(从大半取)</text>

  <!-- Merge back -->
  <path d="M 90 426 L 90 448 L 280 448" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 475 426 L 475 448 L 280 448" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="280,448 360,478 280,508 200,478" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="476" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="490" text-anchor="middle" font-size="9" fill="#888">(继续?)</text>

  <!-- loop back -->
  <path d="M 360 478 L 400 478 L 400 251 L 402 251" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="406" y="370" font-size="10" fill="#888" transform="rotate(90 406 370)">是, i++</text>

  <!-- No -> return -->
  <path d="M 200 478 L 120 478" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="470" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="40" y="462" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="483" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return res</text>
</svg>
