<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一个哈希表记账，一个大根堆选任务</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">堆里存「快照」，真伪由哈希表裁决 —— 懒删除（lazy deletion）</text>

  <!-- 左：哈希表 -->
  <rect x="18" y="58" width="228" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="132" y="80" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">哈希表 info（唯一事实来源）</text>

  <rect x="34" y="92" width="196" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">101 → (10, u1)</text>
  <rect x="34" y="122" width="196" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="139" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">102 → (8, u2)</text>
  <rect x="34" y="152" width="196" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="169" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">103 → (15, u3)</text>
  <rect x="34" y="182" width="196" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="199" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">104 → (5, u4)</text>

  <text x="132" y="228" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">add 写入 ｜ edit 改值 ｜ rmv 删除</text>
  <text x="132" y="242" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">↑ 三个写操作全只动这里（edit 102: 20→8）</text>

  <!-- 右：大根堆 -->
  <rect x="274" y="58" width="228" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="388" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">大根堆 pq：键 (priority, taskId)</text>

  <!-- 堆：root 过期 -->
  <line x1="388" y1="120" x2="336" y2="138" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="388" y1="120" x2="442" y2="138" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="336" y1="160" x2="312" y2="174" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="442" y1="160" x2="466" y2="174" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="352" y="96" width="72" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(20,102)✗</text>

  <rect x="300" y="138" width="72" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(15,103)</text>
  <rect x="406" y="138" width="72" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(10,101)</text>

  <rect x="276" y="174" width="72" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="190" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(8,102)</text>
  <rect x="430" y="174" width="72" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="190" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(5,104)</text>

  <text x="388" y="228" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">add / edit 压入新快照 ｜ rmv 不动</text>
  <text x="388" y="242" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">✗ = 旧快照：edit 102 后已过期，待 execTop 清理</text>

  <!-- 汇合箭头 -->
  <path d="M 132 252 L 132 264" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 388 252 L 388 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 底部：execTop -->
  <rect x="18" y="268" width="484" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">execTop()：堆顶拿来「验货」</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">校验堆顶 (p, id)：info 里存在 id 且 priority == p ？</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 有效 → 执行：出堆 + 出表，返回 userId</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 过期 → 弹掉，继续验下一个堆顶</text>
  <text x="260" y="374" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">rmv: O(1) ｜ add / edit: O(log n) ｜ execTop: 均摊 O(log n)</text>
</svg>
