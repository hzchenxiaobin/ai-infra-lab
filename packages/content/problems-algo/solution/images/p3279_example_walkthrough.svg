<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：h=6，positions=[0,0,6,3]，"UUDU"</text>

  <!-- 事件表 -->
  <rect x="40" y="38" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="54" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="165" y="54" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">事件（到端点 → 反转）</text>
  <text x="312" y="54" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">ΔA = diff×Δt</text>
  <text x="394" y="54" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">area</text>
  <text x="452" y="54" text-anchor="middle" font-size="11" fill="#2e4460" font-weight="bold" filter="url(#rough2)">diff</text>

  <line x1="40" y1="62" x2="480" y2="62" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1: t=0 -->
  <rect x="40" y="62" width="440" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="62" y="79" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="165" y="79" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始：3 个 U + 1 个 D</text>
  <text x="312" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">—</text>
  <text x="394" y="79" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="452" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+2</text>

  <!-- 行 2: t=3（最大） -->
  <rect x="40" y="88" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="105" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="165" y="105" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活塞3（p=3,U）到顶 → D</text>
  <text x="312" y="105" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+2×3=+6</text>
  <text x="394" y="105" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">15 ✓</text>
  <text x="452" y="105" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 行 3: t=6 -->
  <rect x="40" y="114" width="440" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="62" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="165" y="123" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活塞0/1（p=0,U）到顶 → D</text>
  <text x="165" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活塞2（p=6,D）到底 → U</text>
  <text x="312" y="131" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0×3=0</text>
  <text x="394" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="452" y="131" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">−2</text>

  <!-- 行 4: t=9 -->
  <rect x="40" y="140" width="440" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="62" y="157" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="165" y="157" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活塞3 到底 → U</text>
  <text x="312" y="157" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−2×3=−6</text>
  <text x="394" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="452" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 行 5: t=12 -->
  <rect x="40" y="166" width="440" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="62" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="165" y="175" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活塞0/1 到底 → U；活塞2 到顶 → D</text>
  <text x="165" y="188" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（t=12 = 2h，全部复原）</text>
  <text x="312" y="183" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0×3=0</text>
  <text x="394" y="183" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="452" y="183" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+2</text>

  <text x="260" y="212" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 15 —— 与官方解释吻合</text>

  <!-- 位置快照 -->
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">各临界时刻的活塞位置一览</text>

  <rect x="34" y="250" width="84" height="52" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=0</text>
  <text x="76" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,0,6,3]</text>
  <text x="76" y="297" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">Σ=9</text>

  <rect x="128" y="250" width="84" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="268" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">t=3</text>
  <text x="170" y="283" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">[3,3,3,6]</text>
  <text x="170" y="297" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Σ=15 最大</text>

  <rect x="222" y="250" width="84" height="52" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=6</text>
  <text x="264" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[6,6,0,3]</text>
  <text x="264" y="297" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">Σ=15</text>

  <rect x="316" y="250" width="84" height="52" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="268" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=9</text>
  <text x="358" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3,3,3,0]</text>
  <text x="358" y="297" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">Σ=9</text>

  <rect x="410" y="250" width="84" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="268" text-anchor="middle" font-size="10" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">t=12=2h</text>
  <text x="452" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,0,6,3]</text>
  <text x="452" y="297" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到初始</text>

  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">t=3 时斜率恰好降为 0，随后一路不升——最大值定格在拐点，无需再看区间内部</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">提示：t=6 的三个反弹同时发生，面积只按该时刻统一结算一次，再把三个 ±2 一并累加</text>
</svg>
