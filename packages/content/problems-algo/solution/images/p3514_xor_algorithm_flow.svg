<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：标记单值 → O(n²) 标记对异或 → 笛卡尔积组合 → 计数</text>

  <!-- 开始 -->
  <ellipse cx="160" cy="54" rx="62" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">输入 nums</text>
  <text x="250" y="58" font-size="10" fill="#888" filter="url(#rough2)">n ≤ 1500，元素值 ≤ 1500</text>

  <path d="M 160 74 L 160 88" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 单值 -->
  <rect x="30" y="92" width="280" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="114" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① V ← set(nums)，ans[v] ← true</text>
  <text x="496" y="113" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">初始化 ≤ 1500 步</text>

  <path d="M 160 126 L 160 140" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 对异或 -->
  <rect x="30" y="144" width="280" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="166" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② 双重循环 i&lt;j：pairXor[nums[i]⊕nums[j]] ← true</text>
  <text x="496" y="165" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O(n²) ≈ 1.1×10⁶ 步</text>

  <path d="M 160 178 L 160 192" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="190" font-size="9.5" fill="#888" filter="url(#rough2)">p = 0…2047</text>

  <!-- ③ 判断 + 组合 -->
  <polygon points="160,196 232,230 160,264 88,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="235" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">pairXor[p] 为真？</text>

  <path d="M 232 230 L 268 230" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="272" y="212" width="224" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="235" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">③ 对每个 v ∈ V：ans[p⊕v] ← true</text>
  <text x="384" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≤ 2048 × 1500 ≈ 3×10⁶ 步</text>

  <path d="M 384 212 C 384 192, 262 184, 199 209" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">取下一个 p</text>

  <path d="M 160 264 L 160 286" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="280" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ④ 计数 -->
  <rect x="30" y="290" width="280" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="312" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">④ 统计 ans 中 true 的个数 → 返回</text>
  <text x="496" y="311" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O(2048)</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三步合计 ≈ 4×10⁶ 步：值域封顶让 bool[2048] 替代哈希表</text>
</svg>
