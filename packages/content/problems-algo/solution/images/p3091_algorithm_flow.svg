<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：O(√k) 枚举终值 v</text>

  <!-- start -->
  <rect x="210" y="42" width="100" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 72 L 260 92" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init ans -->
  <rect x="155" y="94" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = k − 1（v=1 纯复制兜底）</text>
  <path d="M 260 124 L 260 144" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init v -->
  <rect x="215" y="146" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v = 1</text>
  <path d="M 260 174 L 260 192" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,194 348,228 260,262 172,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v ≤ ⌊√k⌋+1 ？</text>
  <text x="260" y="241" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（√k 内必有最优）</text>

  <!-- no branch -->
  <path d="M 348 228 L 396 228" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="220" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="400" y="212" width="96" height="32" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="448" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes branch -->
  <path d="M 260 262 L 260 282" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="278" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="196" y="284" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m = ⌈k / v⌉</text>
  <path d="M 260 312 L 260 330" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="332" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(ans, (v−1)+(m−1))</text>
  <path d="M 260 362 L 260 380" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="215" y="382" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v = v + 1</text>

  <!-- loop back -->
  <path d="M 215 396 L 120 396 L 120 228 L 168 228" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="320" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">回到判断</text>

  <!-- side note -->
  <rect x="368" y="286" width="140" height="88" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="438" y="306" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">为什么枚举到 √k 够？</text>
  <text x="438" y="322" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">v &gt; √k 时，令 m = ⌈k/v⌉</text>
  <text x="438" y="338" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">则 f(m) ≤ f(v)（镜像论证）</text>
  <text x="438" y="354" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">大 v 的解翻到小 m 不劣</text>
  <text x="438" y="370" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=10⁵ 时仅约 317 轮</text>
</svg>
