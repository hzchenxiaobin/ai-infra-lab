<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">read(buf, n) 算法流程：缓存判定 + read4 按需调用</text>
  <text x="290" y="44" text-anchor="middle" font-size="10" fill="#888">与 157 相比新增「缓存空？」判定（橙色虚线框）</text>

  <!-- 成员变量说明（右上） -->
  <rect x="410" y="58" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="485" y="74" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">成员变量（跨调用持久）</text>
  <text x="420" y="90" font-size="9" fill="#444">buf4[4] · buf4Ptr · buf4Cnt</text>
  <text x="420" y="104" font-size="9" fill="#888">初始均 0，随 read 调用演进</text>

  <!-- 开始 -->
  <ellipse cx="220" cy="78" rx="38" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <!-- 初始化 -->
  <rect x="154" y="108" width="132" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">total = 0</text>
  <text x="220" y="138" text-anchor="middle" font-size="10" fill="#888">（buf4/Ptr/Cnt 是成员，不重置）</text>

  <path d="M 220 94 L 220 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定: total < n ? -->
  <polygon points="220,154 300,188 220,222 140,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="184" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">total &lt; n ?</text>
  <text x="220" y="198" text-anchor="middle" font-size="9" fill="#888">还要继续读吗</text>

  <path d="M 220 142 L 220 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- N → 结束（返回 total） -->
  <path d="M 300 188 L 370 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="370" y="172" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 total</text>

  <!-- Y → 缓存判定（新增！） -->
  <path d="M 220 222 L 220 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 新增判定框：缓存空？ -->
  <polygon points="220,242 320,282 220,322 120,282" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="220" y="278" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">buf4Ptr ==</text>
  <text x="220" y="292" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">buf4Cnt ?</text>
  <text x="220" y="308" text-anchor="middle" font-size="9" fill="#888">缓存空？</text>
  <!-- 新增标记 -->
  <rect x="328" y="270" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="286" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">158 新增</text>

  <!-- 缓存空 → read4 -->
  <path d="M 220 322 L 220 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="335" font-size="9" fill="#446688" font-weight="bold">是→调 read4</text>

  <rect x="140" y="342" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="358" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">buf4Cnt = read4(buf4)</text>
  <text x="220" y="372" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">buf4Ptr = 0</text>
  <text x="220" y="382" text-anchor="middle" font-size="8" fill="#888">重置指针！从 buf4[0] 写入</text>

  <path d="M 220 382 L 220 398" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- EOF 判定 -->
  <polygon points="220,400 300,432 220,464 140,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="428" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">buf4Cnt == 0 ?</text>
  <text x="220" y="442" text-anchor="middle" font-size="9" fill="#888">EOF？</text>

  <!-- EOF 是 → 返回 -->
  <path d="M 300 432 L 370 432 L 420 432 L 420 204" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="424" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- EOF 否 / 或缓存不空 → 拷贝 -->
  <path d="M 220 464 L 220 478" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="424" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 缓存不空：旁路（从缓存判定 N 直接到拷贝，绕过 read4） -->
  <path d="M 120 282 L 60 282 L 60 488 L 156 488" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="68" y="276" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="64" y="385" font-size="9" fill="#4a7a3a" font-weight="bold">不调 read4</text>
  <text x="64" y="398" font-size="8" fill="#888">直接用缓存</text>

  <!-- 拷贝步骤 -->
  <rect x="158" y="472" width="244" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="488" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">need = min(buf4Cnt − buf4Ptr, n − total)</text>
  <text x="280" y="502" text-anchor="middle" font-size="10" fill="#4a7a3a">拷 buf4[ptr..ptr+need) → buf[total..)</text>
  <text x="280" y="514" text-anchor="middle" font-size="9" fill="#888">buf4Ptr += need · total += need</text>

  <!-- 回循环（右侧绕回） -->
  <path d="M 402 494 L 450 494 L 450 188 L 300 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="460" y="340" font-size="9" fill="#446688" font-weight="bold">回循环</text>
</svg>
