<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 3 的反转前后对比</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">L1 交换 1 次，L3 交换 4 次；偶数层 L0/L2 不变</text>

  <!-- ================= LEFT TREE (before) ================= -->
  <text x="145" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">反转前</text>
  <g font-size="9">
    <!-- edges -->
    <line x1="145" y1="80" x2="93" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="145" y1="80" x2="197" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="93" y1="128" x2="67" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="93" y1="128" x2="119" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="197" y1="128" x2="171" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="197" y1="128" x2="223" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="67" y1="176" x2="54" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="67" y1="176" x2="80" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="119" y1="176" x2="106" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="119" y1="176" x2="132" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="171" y1="176" x2="158" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="171" y1="176" x2="184" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="223" y1="176" x2="210" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="223" y1="176" x2="236" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>

    <!-- L0 -->
    <circle cx="145" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="145" y="78" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <!-- L1 (odd) values 1, 2 -->
    <circle cx="93" cy="124" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="93" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="197" cy="124" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="197" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- L2 (even) 0,0,0,0 -->
    <circle cx="67" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="67" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="119" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="119" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="171" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="171" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="223" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="223" y="176" text-anchor="middle" fill="#446688">0</text>
    <!-- L3 (odd) 1,1,1,1,2,2,2,2 -->
    <circle cx="54" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="54" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="80" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="106" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="106" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="132" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="132" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="158" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="158" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="184" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="184" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="210" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="210" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="236" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="236" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
  </g>
  <text x="145" y="246" text-anchor="middle" font-size="9" fill="#888">层值：L1=[1,2] · L3=[1,1,1,1,2,2,2,2]</text>

  <!-- swap arrows from left tree to right tree -->
  <!-- L1 swap arrow: 1(node at 93) <-> 2(node at 197) ... shown as mid arrow -->
  <path d="M 245 124 L 313 124" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="279" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">swap L1</text>
  <!-- L3 swap arrows (4) -->
  <path d="M 245 220 L 313 220" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 245 232 L 313 232" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="279" y="258" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">swap L3 ×4</text>

  <!-- ================= RIGHT TREE (after) ================= -->
  <text x="415" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">反转后</text>
  <g font-size="9">
    <!-- edges -->
    <line x1="415" y1="80" x2="363" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="415" y1="80" x2="467" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="363" y1="128" x2="337" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="363" y1="128" x2="389" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="467" y1="128" x2="441" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="467" y1="128" x2="493" y2="166" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="337" y1="176" x2="324" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="337" y1="176" x2="350" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="389" y1="176" x2="376" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="389" y1="176" x2="402" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="441" y1="176" x2="428" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="441" y1="176" x2="454" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="493" y1="176" x2="480" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>
    <line x1="493" y1="176" x2="506" y2="214" stroke="#bbb" stroke-width="0.7" filter="url(#rough2)"/>

    <!-- L0 -->
    <circle cx="415" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="415" y="78" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <!-- L1 (odd) values 2, 1 (reversed) -->
    <circle cx="363" cy="124" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="363" y="128" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <circle cx="467" cy="124" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="467" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- L2 (even) 0,0,0,0 -->
    <circle cx="337" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="337" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="389" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="389" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="441" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="441" y="176" text-anchor="middle" fill="#446688">0</text>
    <circle cx="493" cy="172" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="493" y="176" text-anchor="middle" fill="#446688">0</text>
    <!-- L3 (odd) 2,2,2,2,1,1,1,1 (reversed) -->
    <circle cx="324" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="324" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="350" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="350" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="376" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="376" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="402" cy="220" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="402" y="223" text-anchor="middle" fill="#b85450" font-size="7">2</text>
    <circle cx="428" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="428" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="454" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="454" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="480" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
    <circle cx="506" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="506" y="223" text-anchor="middle" fill="#d6a040" font-size="7">1</text>
  </g>
  <text x="415" y="246" text-anchor="middle" font-size="9" fill="#888">层值：L1=[2,1] · L3=[2,2,2,2,1,1,1,1]</text>

  <!-- ===== bottom per-level reversal strips ===== -->
  <g font-size="9">
    <!-- L1 strip -->
    <rect x="30" y="276" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="40" y="297" fill="#d6a040" font-weight="bold">L1*</text>
    <text x="80" y="297" fill="#555">[1, 2]</text>
    <text x="240" y="297" fill="#b85450" font-weight="bold">→ reverse →</text>
    <text x="380" y="297" fill="#555">[2, 1]  （1 次交换）</text>
    <!-- L2 strip -->
    <rect x="30" y="314" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="40" y="332" fill="#446688" font-weight="bold">L2</text>
    <text x="80" y="332" fill="#555">[0, 0, 0, 0]  偶数层，跳过</text>
    <!-- L3 strip -->
    <rect x="30" y="346" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="40" y="367" fill="#b85450" font-weight="bold">L3*</text>
    <text x="80" y="367" fill="#555">[1,1,1,1,2,2,2,2]</text>
    <text x="240" y="367" fill="#b85450" font-weight="bold">→ reverse →</text>
    <text x="370" y="367" fill="#555">[2,2,2,2,1,1,1,1]（4 次）</text>
  </g>

  <!-- final result -->
  <rect x="30" y="390" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[0,2,1,0,0,0,0,2,2,2,2,1,1,1,1]</text>
</svg>
