<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：共用字符 = 各单词频率表的逐元素最小值</text>

  <!-- 表头：字母列 -->
  <rect x="30" y="46" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">单词</text>
  <rect x="110" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="230" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="290" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <rect x="350" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
  <rect x="410" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
  <rect x="470" y="46" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- bella 行 -->
  <rect x="30" y="76" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bella</text>
  <rect x="110" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="94" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="76" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="94" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="76" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="94" text-anchor="middle" font-size="10" fill="#888">freq 表 1</text>

  <!-- label 行 -->
  <rect x="30" y="106" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">label</text>
  <rect x="110" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="106" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="124" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="106" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="124" text-anchor="middle" font-size="10" fill="#888">freq 表 2</text>

  <!-- roller 行 -->
  <rect x="30" y="136" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">roller</text>
  <rect x="110" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="154" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="230" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="410" y="136" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="470" y="136" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="154" text-anchor="middle" font-size="10" fill="#888">freq 表 3</text>

  <!-- min 操作箭头 -->
  <path d="M 290 164 L 290 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="166" width="180" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">逐元素取最小 min(c₁,c₂,c₃)</text>

  <!-- minFreq 行（高亮） -->
  <rect x="30" y="186" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">minFreq</text>
  <rect x="110" y="186" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="205" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="186" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="230" y="186" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ⭐</text>
  <rect x="290" y="186" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 ⭐</text>
  <rect x="350" y="186" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="205" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="186" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="205" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="186" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="205" text-anchor="middle" font-size="10" fill="#888">只留 &gt;0</text>

  <!-- 展开箭头 -->
  <path d="M 290 216 L 290 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="220" width="140" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">展开：按次数重复字母</text>

  <!-- 结果 -->
  <rect x="120" y="244" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="12" fill="#333">e×1 → [e]　　l×2 → [l, l]</text>
  <text x="290" y="281" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果 = [&quot;e&quot;,&quot;l&quot;,&quot;l&quot;]</text>

  <!-- 关键洞察 -->
  <rect x="50" y="306" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="328" font-size="11.5" fill="#d6a040" font-weight="bold">💡 为什么「逐元素最小」就是共用字符？</text>
  <text x="70" y="348" font-size="11" fill="#333">· 字符 c 在「所有单词都出现」⇔ 每个单词的 freq[c] ≥ 1</text>
  <text x="70" y="366" font-size="11" fill="#333">· c 能被「重复使用 k 次」⇔ 每个单词都至少有 k 个 c，即 min(freq) ≥ k</text>
  <text x="70" y="384" font-size="11" fill="#333">· 故 c 的最大共用次数 = min(各单词中 c 的出现次数) = minFreq[c]</text>

  <!-- 复杂度小贴士 -->
  <rect x="50" y="412" width="480" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="11" fill="#555">26 个字母定长 → 每个单词 O(L + 26)，无需哈希表</text>
  <text x="290" y="445" text-anchor="middle" font-size="11" fill="#555">minFreq 数组长度恒为 26 → 空间 O(1)</text>

  <rect x="50" y="470" width="480" height="8" fill="#f5f5f5" stroke="none" rx="4" filter="url(#rough2)"/>
</svg>
