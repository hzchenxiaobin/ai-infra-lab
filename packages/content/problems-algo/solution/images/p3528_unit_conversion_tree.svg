<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b5" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">单位转换 = 以 0 为根的「乘法树」（示例 2）</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">圆内上：单位号 · 绿字：ans（根到该点的路径积）· 红标签：边权 ×w</text>

  <!-- edges -->
  <line x1="243" y1="87" x2="172" y2="136" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="277" y1="87" x2="348" y2="136" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="141" y1="163" x2="99" y2="207" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="169" y1="163" x2="211" y2="207" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="365" y1="169" x2="365" y2="201" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="225" y1="243" x2="225" y2="275" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <line x1="365" y1="243" x2="365" y2="275" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>

  <!-- edge weight labels -->
  <rect x="192" y="102" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×2</text>
  <rect x="297" y="102" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="312" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×3</text>
  <rect x="105" y="176" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×4</text>
  <rect x="175" y="176" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×5</text>
  <rect x="350" y="176" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×2</text>
  <rect x="210" y="250" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×3</text>
  <rect x="350" y="250" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×4</text>

  <!-- root -->
  <circle cx="260" cy="75" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">0</text>
  <text x="260" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=1</text>

  <!-- level 1 -->
  <circle cx="155" cy="148" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=2</text>

  <circle cx="365" cy="148" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="365" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=3</text>

  <!-- level 2 -->
  <circle cx="85" cy="222" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="85" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=8</text>

  <circle cx="225" cy="222" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="225" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=10</text>

  <circle cx="365" cy="222" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="365" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=6</text>

  <!-- level 3 -->
  <circle cx="225" cy="296" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="225" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=30</text>

  <circle cx="365" cy="296" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="365" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=24</text>

  <!-- conclusion -->
  <rect x="70" y="336" width="380" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="359" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans[v] = ans[u] × w (mod 10⁹+7)：父亲的答案「乘」一条边传给孩子</text>
</svg>
