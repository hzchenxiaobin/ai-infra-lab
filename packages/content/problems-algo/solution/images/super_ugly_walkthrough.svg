  <!-- ===== result ===== -->
  <rect x="40" y="314" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">nums = [1, 2, 4, 7, 8, 13, 14, 16, 19, 26, 28, 32] → 答案 = 32</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#888">第 6、9、10 步出现重复：14=7×2=2×7、26=13×2=2×13、28=14×2=4×7</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888">→ 用独立 if 而非 elif，让所有匹配指针同时前进，保证去重</text>
