  <!-- ===== header ===== -->
  <text x="48" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="84" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p[0]</text>
  <text x="119" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">p[1]</text>
  <text x="154" y="71" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">p[2]</text>
  <text x="189" y="71" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p[3]</text>
  <text x="228" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">×2</text>
  <text x="272" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×7</text>
  <text x="316" y="71" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">×13</text>
  <text x="360" y="71" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×19</text>
  <text x="404" y="71" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">next</text>
  <text x="478" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">推进</text>

