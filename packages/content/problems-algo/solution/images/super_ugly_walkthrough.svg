<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=12, primes=[2,7,13,19]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">粉色行 = 出现重复（多个指针同时推进）；红色加粗 = k 路候选中的最小值</text>

  <!-- ===== table frame ===== -->
  <rect x="30" y="54" width="500" height="244" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- highlight rows: i=6 (row 6), i=9 (row 9), i=10 (row 10) -->
  <!-- row height = 20, header height = 24; rows start at y=78 -->
  <!-- row i: y = 78 + (i-1)*20 -->
  <!-- i=6: y=78+5*20=178 -->
  <rect x="31" y="178" width="498" height="20" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <!-- i=9: y=78+8*20=238 -->
  <rect x="31" y="238" width="498" height="20" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <!-- i=10: y=78+9*20=258 -->
  <rect x="31" y="258" width="498" height="20" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="66" y1="54" x2="66" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="101" y1="54" x2="101" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="136" y1="54" x2="136" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="171" y1="54" x2="171" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="206" y1="54" x2="206" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="54" x2="250" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="294" y1="54" x2="294" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="338" y1="54" x2="338" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="382" y1="54" x2="382" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="426" y1="54" x2="426" y2="298" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- header row separator -->
