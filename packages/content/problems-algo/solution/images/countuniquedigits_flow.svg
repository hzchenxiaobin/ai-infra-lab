<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动累加 g(k)，无需存储历史</text>

  <!-- 1 输入 n -->
  <rect x="210" y="46" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333">输入 n（0 ≤ n ≤ 8）</text>
  <path d="M 280 82 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2 判 n==0 -->
  <polygon points="280,94 372,130 280,166 188,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n == 0 ?</text>

  <!-- 是 -> 返回 1 -->
  <path d="M 188 130 L 120 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="123" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="112" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="12" fill="#333">返回 1</text>

  <!-- 否 -> 初始化 -->
  <path d="M 280 166 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="174" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 3 初始化 -->
  <rect x="150" y="178" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333">ans = 10  （f(1) = 0..9 共 10 个）</text>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#333">cur = 9  ；k = 2</text>
  <path d="M 280 228 L 280 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4 diamond k<=n? -->
  <polygon points="280,240 372,276 280,312 188,276" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k ≤ n ?</text>

  <!-- 否 -> 返回 ans -->
  <path d="M 372 276 L 470 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="269" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="258" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="282" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- 是 -> 累加 -->
  <path d="M 280 312 L 280 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="320" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 5 累加 box -->
  <rect x="130" y="324" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333">cur *= (11 − k)   （第 k 位可选数）</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333">ans += cur       （累加 g(k)）</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#888">此时 cur = g(k) = 9×A(9, k−1)</text>

  <!-- k++ -->
  <path d="M 280 382 L 280 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="235" y="394" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k++</text>

  <!-- loop back to diamond -->
  <path d="M 235 409 L 90 409 L 90 276 L 188 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">回到判断</text>

  <!-- footnote -->
  <text x="280" y="452" text-anchor="middle" font-size="11" fill="#888">cur 滚动复用：g(k) = g(k−1) × (11−k)，故只需 O(1) 空间</text>
</svg>
