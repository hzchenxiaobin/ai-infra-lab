<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：FROM → GROUP BY → 双聚合 → ORDER BY</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: FROM Activities -->
  <rect x="150" y="84" width="260" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11.5" fill="#333">FROM Activities</text>

  <path d="M 280 116 L 280 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: GROUP BY sell_date -->
  <rect x="100" y="130" width="360" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#333">GROUP BY sell_date</text>

  <path d="M 280 162 L 280 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: DISTINCT? -->
  <polygon points="280,178 390,222 280,266 170,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">组内 product</text>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">去重 + 排序</text>

  <!-- Two branches -->
  <!-- left: COUNT -->
  <path d="M 170 222 L 100 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">计数</text>
  <rect x="20" y="206" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="222" text-anchor="middle" font-size="9.5" fill="#333">COUNT</text>
  <text x="60" y="234" text-anchor="middle" font-size="9.5" fill="#333">(DISTINCT)</text>

  <!-- right: GROUP_CONCAT -->
  <path d="M 390 222 L 460 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="216" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">拼接</text>
  <rect x="460" y="206" width="80" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="222" text-anchor="middle" font-size="9" fill="#333">GROUP_CONCAT</text>
  <text x="500" y="234" text-anchor="middle" font-size="9" fill="#333">(DISTINCT)</text>

  <!-- Lines converging -->
  <path d="M 60 240 L 60 286 L 200 286" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 500 240 L 500 286 L 360 286" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Dual aggregation box -->
  <rect x="120" y="272" width="320" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#333">COUNT(DISTINCT product) AS num_sold</text>
  <text x="280" y="306" text-anchor="middle" font-size="9.5" fill="#555" font-family="'Comic Sans MS', monospace">GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',')</text>

  <path d="M 280 318 L 280 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: ORDER BY sell_date -->
  <rect x="100" y="332" width="360" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#333">ORDER BY sell_date</text>

  <path d="M 280 364 L 280 376" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="80" y="378" width="400" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#333">SELECT sell_date, num_sold, products</text>

  <path d="M 280 408 L 280 420" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="280" cy="434" rx="50" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#333">输出结果</text>

  <!-- footer note -->
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#888">一次 GROUP BY 同时产出两列：去重计数 + 去重排序拼接</text>
</svg>
