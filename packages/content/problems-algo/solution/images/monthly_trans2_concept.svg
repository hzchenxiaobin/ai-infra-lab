<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心思路：UNION 统一两类记录后按月+国家聚合</text>

  <!-- Transactions table -->
  <text x="50" y="62" font-size="12" fill="#446688" font-weight="bold">Transactions 表</text>
  <g filter="url(#rough2)">
    <rect x="40" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="90" y="68" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="146" y="68" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="260" y="68" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="9.5" fill="#446688" font-weight="bold">
    <text x="65" y="84" text-anchor="middle">id</text>
    <text x="118" y="84" text-anchor="middle">country</text>
    <text x="178" y="84" text-anchor="middle">state</text>
    <text x="235" y="84" text-anchor="middle">amount</text>
    <text x="295" y="84" text-anchor="middle">trans_date</text>
  </g>
  <!-- sample rows -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="92" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="90" y="92" width="56" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="146" y="92" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2"/>
    <rect x="210" y="92" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="260" y="92" width="70" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <text x="65" y="106" text-anchor="middle">101</text>
    <text x="118" y="106" text-anchor="middle">US</text>
    <text x="178" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">approved</text>
    <text x="235" y="106" text-anchor="middle">1000</text>
    <text x="295" y="106" text-anchor="middle">2019-05-18</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="112" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="90" y="112" width="56" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="146" y="112" width="64" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2"/>
    <rect x="210" y="112" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="260" y="112" width="70" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <text x="65" y="126" text-anchor="middle">102</text>
    <text x="118" y="126" text-anchor="middle">US</text>
    <text x="178" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">declined</text>
    <text x="235" y="126" text-anchor="middle">2000</text>
    <text x="295" y="126" text-anchor="middle">2019-05-19</text>
  </g>

  <!-- Chargebacks table -->
  <text x="50" y="160" font-size="12" fill="#d6a040" font-weight="bold">Chargebacks 表</text>
  <g filter="url(#rough2)">
    <rect x="40" y="166" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="110" y="166" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="9.5" fill="#d6a040" font-weight="bold">
    <text x="75" y="182" text-anchor="middle">trans_id</text>
    <text x="150" y="182" text-anchor="middle">trans_date</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="190" width="70" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="110" y="190" width="80" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <text x="75" y="204" text-anchor="middle">102</text>
    <text x="150" y="204" text-anchor="middle">2019-05-29</text>
  </g>

  <!-- JOIN arrow from Chargebacks to Transactions -->
  <path d="M 75 210 L 75 226 L 290 226 L 290 140" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="180" y="222" font-size="9" fill="#d6a040" font-weight="bold">JOIN 取 country + amount</text>

  <!-- UNION box -->
  <rect x="380" y="68" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="490" y="92" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">UNION 统一视图 T</text>
  <text x="490" y="114" text-anchor="middle" font-size="10.5" fill="#555">SELECT * FROM Transactions</text>
  <text x="490" y="130" text-anchor="middle" font-size="10.5" fill="#555">UNION</text>
  <text x="490" y="146" text-anchor="middle" font-size="10.5" fill="#555">SELECT id, country,</text>
  <text x="490" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">'chargeback', amount, c.trans_date</text>

  <!-- arrow from Transactions to UNION -->
  <path d="M 330 100 L 376 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="353" y="94" text-anchor="middle" font-size="9" fill="#446688">原样</text>

  <!-- arrow from JOIN to UNION -->
  <path d="M 290 140 L 330 140 L 330 148 L 376 148" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- Unified T table -->
  <text x="50" y="250" font-size="12" fill="#4a7a3a" font-weight="bold">统一视图 T（UNION 后）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="256" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="80" y="256" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="130" y="256" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="200" y="256" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="250" y="256" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="9" fill="#4a7a3a" font-weight="bold">
    <text x="60" y="271" text-anchor="middle">id</text>
    <text x="105" y="271" text-anchor="middle">country</text>
    <text x="165" y="271" text-anchor="middle">state</text>
    <text x="225" y="271" text-anchor="middle">amount</text>
    <text x="290" y="271" text-anchor="middle">trans_date</text>
  </g>
  <!-- unified rows -->
  <g filter="url(#rough2)" font-size="9" fill="#333">
    <rect x="40" y="278" width="40" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="80" y="278" width="50" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="130" y="278" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2"/>
    <rect x="200" y="278" width="50" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="250" y="278" width="80" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="60" y="291" text-anchor="middle">101</text>
    <text x="105" y="291" text-anchor="middle">US</text>
    <text x="165" y="291" text-anchor="middle" fill="#4a7a3a">approved</text>
    <text x="225" y="291" text-anchor="middle">1000</text>
    <text x="290" y="291" text-anchor="middle">2019-05-18</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#333">
    <rect x="40" y="296" width="40" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="80" y="296" width="50" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="130" y="296" width="70" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2"/>
    <rect x="200" y="296" width="50" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="250" y="296" width="80" height="18" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="60" y="309" text-anchor="middle">102</text>
    <text x="105" y="309" text-anchor="middle">US</text>
    <text x="165" y="309" text-anchor="middle" fill="#b85450">declined</text>
    <text x="225" y="309" text-anchor="middle">2000</text>
    <text x="290" y="309" text-anchor="middle">2019-05-19</text>
  </g>
  <!-- chargeback row highlighted -->
  <g filter="url(#rough2)" font-size="9" fill="#333">
    <rect x="40" y="314" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="80" y="314" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="130" y="314" width="70" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <rect x="200" y="314" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="250" y="314" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <text x="60" y="327" text-anchor="middle">102</text>
    <text x="105" y="327" text-anchor="middle">US</text>
    <text x="165" y="327" text-anchor="middle" fill="#d6a040" font-weight="bold">chargeback</text>
    <text x="225" y="327" text-anchor="middle">2000</text>
    <text x="290" y="327" text-anchor="middle">2019-05-29</text>
  </g>

  <!-- arrow from UNION to unified T -->
  <path d="M 490 168 L 490 190 L 165 190 L 165 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- GROUP BY + HAVING note -->
  <rect x="360" y="250" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">GROUP BY month, country</text>
  <text x="480" y="294" text-anchor="middle" font-size="10.5" fill="#555">SUM(state='approved') → 计数</text>
  <text x="480" y="312" text-anchor="middle" font-size="10.5" fill="#555">SUM(IF(state='approved',amount,0)) → 金额</text>
  <text x="480" y="330" text-anchor="middle" font-size="10.5" fill="#b85450">HAVING approved_amount OR chargeback_amount</text>
  <text x="480" y="344" text-anchor="middle" font-size="9.5" fill="#888">忽略全零行</text>

  <!-- summary -->
  <rect x="40" y="372" width="560" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：chargeback 记录借用原交易的 country + amount</text>
  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#888">UNION 后统一按 (month, country) 聚合，approved 与 chargeback 互不干扰</text>
</svg>
