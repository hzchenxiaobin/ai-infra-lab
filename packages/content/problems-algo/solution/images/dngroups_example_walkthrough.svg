<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：从节点 5 做 BFS 分层 → 4 组</text>

  <!-- ===== Left: layered BFS graph ===== -->
  <rect x="16" y="42" width="388" height="300" rx="10" fill="#f4f8fc" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- group column headers -->
  <text x="80" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">组 1</text>
  <text x="170" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">组 2</text>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">组 3</text>
  <text x="350" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">组 4</text>

  <!-- separators -->
  <path d="M 125 74 L 125 318" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 215 74 L 215 318" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 305 74 L 305 318" stroke="#cdd6e0" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- BFS tree edges (bold) -->
  <path d="M 80 188 L 170 188" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 188 L 260 138" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 188 L 260 238" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 138 L 350 138" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 138 L 350 238" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- non-tree edge (dashed) 4-6 -->
  <path d="M 260 238 L 350 238" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- nodes (id + dist) -->
  <circle cx="80" cy="188" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="80" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#446688">d=0 ★源</text>

  <circle cx="170" cy="188" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">d=1</text>

  <circle cx="260" cy="138" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#d6a040">d=2</text>

  <circle cx="260" cy="238" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#d6a040">d=2</text>

  <circle cx="350" cy="138" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="350" y="116" text-anchor="middle" font-size="10" fill="#b85450">d=3</text>

  <circle cx="350" cy="238" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="243" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="350" y="272" text-anchor="middle" font-size="10" fill="#b85450">d=3</text>

  <text x="210" y="306" text-anchor="middle" font-size="10" fill="#888">粗线 = BFS 树边；虚线 4–6 是非树边（d 差 2↔3=1 ✓）</text>

  <!-- ===== Right: dist table + result ===== -->
  <rect x="416" y="42" width="208" height="300" rx="10" fill="#fffef7" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="520" y="64" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">dist(5, ·) 表</text>

  <!-- table header -->
  <line x1="436" y1="78" x2="604" y2="78" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="92" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">节点</text>
  <text x="570" y="92" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dist</text>
  <line x1="520" y1="74" x2="520" y2="196" stroke="#e6d8a8" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="570" y="110" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="570" y="128" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="470" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="570" y="146" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="570" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="470" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="570" y="182" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="570" y="200" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- result box -->
  <rect x="436" y="216" width="168" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="238" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">最大深度 = 3</text>
  <text x="520" y="258" text-anchor="middle" font-size="11" fill="#444">组数 = 3 + 1 = 4</text>
  <text x="520" y="280" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 达直径上界</text>

  <text x="520" y="316" text-anchor="middle" font-size="10" fill="#888">6 条边 |dist 差| 均为 1</text>
</svg>
