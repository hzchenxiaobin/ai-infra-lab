<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="14" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：特判 k=1 → 按 k 选积木 → 放不下即无解 → 贴积木铺走廊</text>
  <text x="260" y="30" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">k=1 复用 3963 的 L 形走廊；返回 [] 的情形都对应「k 超过该尺寸路径数上限」</text>

  <!-- 开始 -->
  <rect x="92" y="40" width="116" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="57" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">输入 m, n, k</text>

  <path d="M 150 66 L 150 78" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 判定 1：k == 1 ? -->
  <polygon points="150,78 212,103 150,128 88,103" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">k == 1 ?</text>

  <path d="M 212 103 L 238 103" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="225" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="240" y="86" width="232" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="100" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 L 形走廊（同 3963）</text>
  <text x="356" y="114" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">第 0 行全 '.' + 末列全 '.'，恰 1 条</text>

  <path d="M 150 128 L 150 140" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="157" y="138" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 判定 2：单行或单列 ? -->
  <polygon points="150,140 216,164 150,188 84,164" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">单行或单列 ?</text>

  <path d="M 216 164 L 238 164" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="227" y="158" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="240" y="148" width="232" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="162" text-anchor="middle" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">返回 []</text>
  <text x="356" y="176" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">单行 / 单列至多 1 条路径</text>

  <path d="M 150 188 L 150 200" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="157" y="198" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 选积木 -->
  <rect x="84" y="200" width="132" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="213" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">按 k 选积木</text>
  <text x="150" y="224" text-anchor="middle" font-size="9" fill="#33507a" filter="url(#rough2)">（以能放下为准）</text>

  <!-- 积木菜单 -->
  <rect x="240" y="192" width="232" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="206" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">积木菜单</text>
  <text x="356" y="219" text-anchor="middle" font-size="9" fill="#444" filter="url(#rough2)">k=2 → 2×2　　k=3 → 2×3 / 3×2</text>
  <text x="356" y="231" text-anchor="middle" font-size="9" fill="#444" filter="url(#rough2)">k=4 → 2×4 / 4×2 / 3×3 堵两角</text>
  <path d="M 216 214 L 238 214" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <path d="M 150 228 L 150 240" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 判定 3：放得下 ? -->
  <polygon points="150,240 218,264 150,288 82,264" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">放得下 ?</text>

  <path d="M 218 264 L 238 264" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="228" y="258" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="240" y="248" width="232" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="262" text-anchor="middle" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">返回 []</text>
  <text x="356" y="276" text-anchor="middle" font-size="9" fill="#8f3a35" filter="url(#rough2)">k 已超过上限 C(m+n−2, m−1)</text>

  <path d="M 150 288 L 150 302" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="157" y="300" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 构造 + 返回 -->
  <rect x="36" y="302" width="448" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">左上角贴积木 → 从「门」向下铺到底、再向右铺到头（强制走廊）</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">其余格子全部填 '#' → 返回网格，路径数恰好为 k ✓</text>
</svg>
