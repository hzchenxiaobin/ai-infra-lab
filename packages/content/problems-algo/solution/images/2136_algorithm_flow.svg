<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#b85450"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 + 累计模拟取 max</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">ans = max&#8202;k (前 k 枚累计播种天数 + 第 k 枚 growTime)</text>

  <!-- ===== ① 配对 ===== -->
  <rect x="30" y="56" width="560" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="76" font-size="12" fill="#446688" font-weight="bold">① 配对：每枚种子 (plantTime, growTime)</text>
  <g font-size="11">
    <rect x="80" y="88" width="110" height="42" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="135" y="105" text-anchor="middle" fill="#333" font-weight="bold">种子 0</text>
    <text x="135" y="122" text-anchor="middle" fill="#446688">p=1, g=2</text>

    <rect x="230" y="88" width="110" height="42" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="285" y="105" text-anchor="middle" fill="#333" font-weight="bold">种子 1</text>
    <text x="285" y="122" text-anchor="middle" fill="#446688">p=4, g=3</text>

    <rect x="380" y="88" width="110" height="42" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="435" y="105" text-anchor="middle" fill="#333" font-weight="bold">种子 2</text>
    <text x="435" y="122" text-anchor="middle" fill="#446688">p=3, g=1</text>
  </g>

  <line x1="310" y1="142" x2="310" y2="164" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- ===== ② 排序 ===== -->
  <rect x="30" y="172" width="560" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="192" font-size="12" fill="#d6a040" font-weight="bold">② 按 growTime 从大到小排序</text>
  <g font-size="11">
    <rect x="80" y="204" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="135" y="221" text-anchor="middle" fill="#333" font-weight="bold">种子 1</text>
    <text x="135" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">g=3 ↓ 最大</text>

    <line x1="190" y1="225" x2="220" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="230" y="204" width="110" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="285" y="221" text-anchor="middle" fill="#333" font-weight="bold">种子 0</text>
    <text x="285" y="238" text-anchor="middle" fill="#d6a040" font-weight="bold">g=2</text>

    <line x1="340" y1="225" x2="370" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="380" y="204" width="110" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="435" y="221" text-anchor="middle" fill="#333" font-weight="bold">种子 2</text>
    <text x="435" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">g=1 最小</text>
  </g>

  <line x1="310" y1="258" x2="310" y2="280" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- ===== ③ 累计模拟 ===== -->
  <rect x="30" y="288" width="560" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="308" font-size="12" fill="#4a7a3a" font-weight="bold">③ 累计模拟：cur += plantTime[i]；ans = max(ans, cur + growTime[i])</text>

  <!-- iteration rows -->
  <g font-size="11">
    <!-- header -->
    <text x="60" y="332" fill="#888" font-weight="bold">种子</text>
    <text x="170" y="332" fill="#888" font-weight="bold">cur（累计播种）</text>
    <text x="330" y="332" fill="#888" font-weight="bold">开花日 = cur + g</text>
    <text x="480" y="332" fill="#888" font-weight="bold">ans</text>

    <line x1="50" y1="338" x2="560" y2="338" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

    <text x="60" y="356" fill="#b85450" font-weight="bold">种子 1</text>
    <text x="170" y="356" fill="#333">0 + 4 = 4</text>
    <text x="330" y="356" fill="#b85450" font-weight="bold">4 + 3 = 7</text>
    <text x="480" y="356" fill="#333">7</text>

    <text x="60" y="376" fill="#d6a040" font-weight="bold">种子 0</text>
    <text x="170" y="376" fill="#333">4 + 1 = 5</text>
    <text x="330" y="376" fill="#d6a040" font-weight="bold">5 + 2 = 7</text>
    <text x="480" y="376" fill="#333">7</text>

    <text x="60" y="396" fill="#4a7a3a" font-weight="bold">种子 2</text>
    <text x="170" y="396" fill="#333">5 + 3 = 8</text>
    <text x="330" y="396" fill="#4a7a3a" font-weight="bold">8 + 1 = 9</text>
    <text x="480" y="396" fill="#4a7a3a" font-weight="bold">9</text>
  </g>

  <!-- final ans -->
  <rect x="430" y="410" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="427" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans = 9</text>
</svg>
