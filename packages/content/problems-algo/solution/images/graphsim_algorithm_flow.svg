<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建图 → 初始化 → 逐层递推 → 回溯还原路径</text>

  <!-- Step 1: build adjacency -->
  <rect x="160" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="12" fill="#333">① 建邻接表 adj（无向图，双向加边）</text>
  <path d="M 270 88 L 270 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- Step 2: init dp[0] -->
  <rect x="160" y="106" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#333">② 初始化 dp[0][v] = (name≠target[0])</text>
  <path d="M 270 146 L 270 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- Step 3: loop header (diamond) -->
  <polygon points="270,164 360,206 270,248 180,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">③ i = 1 … T−1</text>
  <text x="270" y="216" text-anchor="middle" font-size="9" fill="#888">逐层推进</text>

  <!-- loop body -->
  <path d="M 180 206 L 110 206 L 110 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <rect x="40" y="270" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#333">遍历每个城市 v</text>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#333">遍历 v 的邻居 u 取最小</text>
  <text x="140" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[i][v]=min(dp[i−1][u])+cost</text>
  <text x="140" y="342" text-anchor="middle" font-size="9" fill="#888">prev[i][v]=argmin u</text>

  <!-- loop back arrow -->
  <path d="M 110 346 L 110 360 L 270 360 L 270 248" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="190" y="376" text-anchor="middle" font-size="9" fill="#888">i++</text>

  <!-- exit loop: find min at T-1 -->
  <path d="M 360 206 L 430 206 L 430 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <rect x="360" y="270" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="292" text-anchor="middle" font-size="11" fill="#333">④ 找 dp[T−1][v] 最小者</text>
  <text x="440" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">best = min, v*</text>
  <text x="440" y="322" text-anchor="middle" font-size="9" fill="#888">即终点城市</text>
  <path d="M 440 326 L 440 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- Step 5: backtrack -->
  <rect x="320" y="350" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="372" text-anchor="middle" font-size="11" fill="#333">⑤ 回溯 prev[i][v*]</text>
  <text x="440" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i 从 T−1 倒推到 0</text>
  <text x="440" y="402" text-anchor="middle" font-size="9" fill="#888">逐位填回 path[i]</text>

  <!-- return -->
  <path d="M 440 406 L 440 422" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <rect x="380" y="424" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="443" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return path</text>

  <!-- left side complexity note -->
  <rect x="30" y="380" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="402" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">复杂度</text>
  <text x="150" y="418" text-anchor="middle" font-size="10" fill="#333">时间 O(T·(n+m)) ≈ O(T·n²)</text>
  <text x="150" y="432" text-anchor="middle" font-size="10" fill="#333">空间 O(T·n)（dp + prev）</text>
</svg>
