<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：贪心扫描两例</text>

  <!-- table header -->
  <text x="40" y="58" font-size="11" fill="#444" font-weight="bold">num</text>
  <text x="140" y="58" font-size="11" fill="#444" font-weight="bold">目标</text>
  <text x="210" y="58" font-size="11" fill="#444" font-weight="bold">首个目标字符 c</text>
  <text x="330" y="58" font-size="11" fill="#444" font-weight="bold">替换</text>
  <text x="430" y="58" font-size="11" fill="#444" font-weight="bold">结果</text>
  <line x1="28" y1="66" x2="592" y2="66" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 1 header -->
  <rect x="28" y="74" width="564" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="91" font-size="11" fill="#446688" font-weight="bold">示例1：num = 11891</text>

  <!-- row max1 -->
  <text x="40" y="118" font-size="11" fill="#555">11891</text>
  <text x="140" y="118" font-size="11" fill="#446688" font-weight="bold">max→9</text>
  <text x="210" y="118" font-size="11" fill="#b85450" font-weight="bold">c = '1'（首位≠9）</text>
  <text x="330" y="118" font-size="11" fill="#555">1 → 9（全部）</text>
  <text x="430" y="118" font-size="11" fill="#446688" font-weight="bold">99899</text>

  <!-- row min1 -->
  <text x="40" y="140" font-size="11" fill="#555">11891</text>
  <text x="140" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">min→0</text>
  <text x="210" y="140" font-size="11" fill="#b85450" font-weight="bold">c = '1'（首位≠0）</text>
  <text x="330" y="140" font-size="11" fill="#555">1 → 0（全部）</text>
  <text x="430" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">0890 = 890</text>

  <!-- diff1 -->
  <rect x="380" y="150" width="180" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">差值 = 99899−890 = 99009</text>

  <!-- Example 2 header -->
  <rect x="28" y="196" width="564" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="213" font-size="11" fill="#4a7a3a" font-weight="bold">示例2：num = 90（首位是 9，max 须跳过首位）</text>

  <!-- row max2 -->
  <text x="40" y="240" font-size="11" fill="#555">90</text>
  <text x="140" y="240" font-size="11" fill="#446688" font-weight="bold">max→9</text>
  <text x="210" y="240" font-size="11" fill="#b85450" font-weight="bold">c = '0'（首位'9'跳过）</text>
  <text x="330" y="240" font-size="11" fill="#555">0 → 9（全部）</text>
  <text x="430" y="240" font-size="11" fill="#446688" font-weight="bold">99</text>

  <!-- row min2 -->
  <text x="40" y="262" font-size="11" fill="#555">90</text>
  <text x="140" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">min→0</text>
  <text x="210" y="262" font-size="11" fill="#b85450" font-weight="bold">c = '9'（首位≠0）</text>
  <text x="330" y="262" font-size="11" fill="#555">9 → 0（全部）</text>
  <text x="430" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">00 = 0</text>

  <!-- diff2 -->
  <rect x="380" y="272" width="180" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">差值 = 99−0 = 99</text>

  <!-- key takeaway box -->
  <rect x="28" y="318" width="564" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="342" font-size="12" fill="#444" font-weight="bold">两例对照的要点</text>
  <text x="48" y="362" font-size="11" fill="#555">① max 不是固定「首位→9」：示例2 首位为 9，改它无收益，须跳到首个非 9 的 '0'。</text>
  <text x="48" y="382" font-size="11" fill="#555">② min 恒为「首个非 0 → 0」：输入是整数无前导零，首位必 1~9，故首位即首个非 0。</text>
  <text x="48" y="402" font-size="11" fill="#555">③ 前导零合法：0890 = 890、00 = 0，最小值可被压到极小。</text>
</svg>
