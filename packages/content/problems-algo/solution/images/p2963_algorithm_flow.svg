<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 530" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="530" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建 last 表 → reach 扫描计段 → 快速幂</text>

  <!-- start -->
  <ellipse cx="260" cy="56" rx="42" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">开始</text>
  <path d="M 260 73 L 260 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="120" y="88" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 建 last 表：last[v] ← 值 v 最后出现的下标</text>
  <path d="M 260 120 L 260 138" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="120" y="138" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 初始化 reach = −1，m = 0</text>
  <path d="M 260 170 L 260 188" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="88" y="188" width="384" height="212" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="100" y="208" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">③ 主循环 i = 0 … n−1</text>

  <rect x="120" y="216" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">reach = max(reach, last[nums[i]])</text>
  <path d="M 260 248 L 260 264" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,264 330,306 260,348 190,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">i == reach ?</text>

  <!-- yes branch -->
  <text x="336" y="300" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 330 306 L 366 306" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="366" y="290" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="416" y="310" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">m += 1（段闭合）</text>
  <path d="M 416 290 L 416 232 L 404 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="268" y="366" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 348 L 260 378 L 108 378 L 108 232 L 116 232" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- exit -->
  <path d="M 260 400 L 260 424" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="416" font-size="10" fill="#777" filter="url(#rough2)">循环结束</text>

  <!-- step 4 -->
  <rect x="120" y="424" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ ans = 2^(m−1) mod (10⁹+7)（快速幂）</text>
  <path d="M 260 456 L 260 472" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- end -->
  <ellipse cx="260" cy="492" rx="48" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="497" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">返回 ans</text>
</svg>
