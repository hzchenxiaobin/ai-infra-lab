<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2806e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x → 取整值 → 余额</text>

  <!-- Example 1: x = 9 -->
  <rect x="30" y="46" width="500" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="68" font-size="12" fill="#446688" font-weight="bold">示例1：x = 9</text>

  <rect x="50" y="78" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">9</text>

  <text x="120" y="100" font-size="11" fill="#888">+5</text>
  <path d="M138,95 L168,95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="176" y="78" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="211" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">14</text>

  <text x="256" y="100" font-size="11" fill="#888">÷10 下取整</text>
  <path d="M306,95 L336,95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="344" y="78" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="369" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="404" y="100" font-size="11" fill="#888">×10</text>
  <path d="M424,95 L454,95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="462" y="78" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="490" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>

  <text x="490" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余额 = 100−10 = 90 ✓</text>

  <!-- Example 2: x = 15 -->
  <rect x="30" y="146" width="500" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="168" font-size="12" fill="#d6a040" font-weight="bold">示例2：x = 15（平手点！）</text>

  <rect x="50" y="178" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">15</text>

  <text x="120" y="200" font-size="11" fill="#888">+5</text>
  <path d="M138,195 L168,195" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="176" y="178" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="211" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">20</text>

  <text x="256" y="200" font-size="11" fill="#888">÷10 下取整</text>
  <path d="M306,195 L336,195" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="344" y="178" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="369" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="404" y="200" font-size="11" fill="#888">×10</text>
  <path d="M424,195 L454,195" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="462" y="178" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">20</text>

  <text x="490" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余额 = 100−20 = 80 ✓</text>

  <!-- Example 3: x = 4 -->
  <rect x="30" y="246" width="500" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="268" font-size="12" fill="#4a7a3a" font-weight="bold">示例3：x = 4</text>

  <rect x="50" y="278" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>

  <text x="120" y="300" font-size="11" fill="#888">+5</text>
  <path d="M138,295 L168,295" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="176" y="278" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="211" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">9</text>

  <text x="256" y="300" font-size="11" fill="#888">÷10 下取整</text>
  <path d="M306,295 L336,295" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="344" y="278" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="369" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <text x="404" y="300" font-size="11" fill="#888">×10</text>
  <path d="M424,295 L454,295" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2806e)" filter="url(#rough2)"/>

  <rect x="462" y="278" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="490" y="300" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <text x="490" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余额 = 100−0 = 100 ✓</text>

  <!-- summary note -->
  <rect x="30" y="346" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三步合一：(x+5)/10*10 一行搞定，再 100 减之</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">注意是整除下取整，不是四舍五入浮点（避免精度陷阱）</text>
</svg>
