<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：反转枚举方向——枚举子串而非枚举 1..n</text>

  <!-- ===== Left: naive (red) ===== -->
  <rect x="28" y="48" width="230" height="248" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="143" y="72" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">朴素：枚举 1 → n</text>
  <text x="143" y="88" text-anchor="middle" font-size="10" fill="#888">逐个检查是否为子串</text>

  <!-- loop arrow 1..n -->
  <text x="44" y="114" font-size="11" fill="#333" font-weight="bold">for i = 1..n:</text>
  <text x="44" y="132" font-size="10.5" fill="#666">  bin(i) in s ?</text>

  <!-- number line 1..n -->
  <rect x="44" y="144" width="34" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="86" y="160" text-anchor="middle" font-size="10" fill="#888">...</text>
  <rect x="104" y="144" width="34" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="160" text-anchor="middle" font-size="11" fill="#333">i</text>
  <text x="146" y="160" text-anchor="middle" font-size="10" fill="#888">...</text>
  <rect x="164" y="144" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n≤10⁹</text>

  <!-- cost box -->
  <rect x="44" y="184" width="190" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="139" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">O(n · |s|) ≈ 10⁹ × 1000</text>

  <rect x="44" y="226" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="139" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 超时 TLE</text>

  <text x="143" y="276" text-anchor="middle" font-size="10" fill="#888">n 可达 10⁹，逐个检查不可行</text>

  <!-- ===== Right: reverse (green) ===== -->
  <rect x="282" y="48" width="230" height="248" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="397" y="72" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">反转：枚举子串 → 值</text>
  <text x="397" y="88" text-anchor="middle" font-size="10" fill="#888">收集落在 [1,n] 内的值</text>

  <!-- string s -->
  <text x="298" y="116" font-size="11" fill="#333" font-weight="bold">s =</text>
  <rect x="320" y="100" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="352" y="100" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="384" y="100" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="416" y="100" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="456" y="116" font-size="10" fill="#888">|s|≤1000</text>

  <!-- substrings -->
  <text x="298" y="148" font-size="10.5" fill="#666">子串 → 二进制值:</text>
  <rect x="298" y="156" width="50" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"1"→1</text>
  <rect x="354" y="156" width="56" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"11"→3</text>
  <rect x="416" y="156" width="56" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"10"→2</text>

  <!-- collect into set -->
  <text x="298" y="200" font-size="10.5" fill="#666" font-weight="bold">收集 ∈ [1, n] 的值:</text>
  <ellipse cx="397" cy="210" rx="72" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="397" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">seen = {1, 2, 3}</text>

  <!-- check -->
  <rect x="298" y="238" width="190" height="28" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="393" y="256" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">len(seen) == n ?</text>

  <rect x="298" y="276" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="393" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ O(|s|²) ≈ 10⁶ 秒过</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="28" y="312" width="484" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">子串总数 ≤ |s|(|s|+1)/2 ≈ 500k，远小于 n=10⁹</text>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#888">反转枚举方向后，规模从 O(n) 骤降至 O(|s|²)；跳过前导 0 避免重复，增量建值遇 val&gt;n 即 break</text>
</svg>
