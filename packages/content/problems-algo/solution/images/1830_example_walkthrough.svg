<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "cba"，答案 = 5</text>

  <!-- Subtitle: initial state -->
  <rect x="30" y="42" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="11" fill="#446688">初始：cnt={a:1, b:1, c:1}, rem=3, M = 3!/(1!·1!·1!) = 6</text>

  <!-- Table header -->
  <rect x="30" y="82" width="70" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="65" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="100" y="82" width="60" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="130" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <rect x="160" y="82" width="110" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="215" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">c &lt; s[i]</text>
  <rect x="270" y="82" width="130" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="335" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M_c = M·cnt/rem</text>
  <rect x="400" y="82" width="70" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="435" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>
  <rect x="470" y="82" width="100" height="28" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="520" y="101" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">M 更新</text>

  <!-- Row 0: i=0, s[0]=c -->
  <rect x="30" y="112" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="135" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">0</text>
  <rect x="100" y="112" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <rect x="160" y="112" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="135" text-anchor="middle" font-size="11" fill="#b85450">a(1), b(1)</text>
  <rect x="270" y="112" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="135" text-anchor="middle" font-size="11" fill="#444">6·1/3=2, 6·1/3=2</text>
  <rect x="400" y="112" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="470" y="112" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="520" y="135" text-anchor="middle" font-size="11" fill="#446688">6·1/3=2</text>

  <!-- Row 1: i=1, s[1]=b -->
  <rect x="30" y="150" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="173" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">1</text>
  <rect x="100" y="150" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <rect x="160" y="150" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="173" text-anchor="middle" font-size="11" fill="#b85450">a(1)</text>
  <rect x="270" y="150" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="173" text-anchor="middle" font-size="11" fill="#444">2·1/2=1</text>
  <rect x="400" y="150" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="470" y="150" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="520" y="173" text-anchor="middle" font-size="11" fill="#446688">2·1/2=1</text>

  <!-- Row 2: i=2, s[2]=a -->
  <rect x="30" y="188" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="211" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">2</text>
  <rect x="100" y="188" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <rect x="160" y="188" width="110" height="36" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="211" text-anchor="middle" font-size="11" fill="#999">—（无）</text>
  <rect x="270" y="188" width="130" height="36" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="211" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="400" y="188" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="211" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="470" y="188" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="520" y="211" text-anchor="middle" font-size="11" fill="#446688">1·1/1=1</text>

  <!-- Verification box -->
  <rect x="30" y="240" width="540" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">验证：排列链 cba → cab → bca → bac → acb → abc</text>
  <text x="50" y="282" font-size="11" fill="#555">cba 的字典序排名（0 下标）= 5，即前面有 5 个排列更小</text>
  <text x="50" y="300" font-size="11" fill="#555">每次操作恰好跳到上一个排列 → 操作次数 = 排名 = 5 ✓</text>

  <!-- Note box -->
  <rect x="30" y="322" width="540" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11" fill="#444" font-weight="bold">增量公式推导：</text>
  <text x="50" y="362" font-size="11" fill="#555">M = rem! / ∏cnt[ch]!，放 c 后 M_c = (rem−1)! / ((cnt[c]−1)! · ∏')</text>
  <text x="50" y="378" font-size="11" fill="#555">⇒ M_c = M × cnt[c] / rem（除法用逆元，O(1) 增量更新，无需重算阶乘）</text>
</svg>
