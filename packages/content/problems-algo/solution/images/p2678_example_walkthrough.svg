<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 条记录 → age 75 / 92 / 40 → 计 2 位老人</text>

  <!-- Header row -->
  <rect x="30" y="48" width="500" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="64" font-size="10" fill="#888" font-weight="bold">记录（15 字符）</text>
  <text x="395" y="64" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">年龄</text>
  <text x="445" y="64" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">&gt;60?</text>
  <text x="500" y="64" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">贡献</text>

  <!-- Row 1: 7868190130M7522  age=75  ✓ +1 -->
  <rect x="30" y="78" width="500" height="44" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <!-- phone segment -->
  <rect x="38" y="86" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7868190130</text>
  <!-- gender -->
  <rect x="190" y="86" width="20" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">M</text>
  <!-- age (highlight) -->
  <rect x="212" y="86" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="105" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">75</text>
  <!-- seat -->
  <rect x="254" y="86" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">22</text>
  <!-- arrow -->
  <path d="M 300 100 L 380 100" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- age value -->
  <text x="395" y="105" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">75</text>
  <!-- verdict -->
  <text x="445" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- contribution badge -->
  <rect x="478" y="90" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="500" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Row 2: 5303914400F9211  age=92  ✓ +1 -->
  <rect x="30" y="128" width="500" height="44" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="38" y="136" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5303914400</text>
  <rect x="190" y="136" width="20" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="212" y="136" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">92</text>
  <rect x="254" y="136" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <path d="M 300 150 L 380 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="395" y="155" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">92</text>
  <text x="445" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="478" y="140" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="500" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Row 3: 9273338290F4010  age=40  ✗ +0 -->
  <rect x="30" y="178" width="500" height="44" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="38" y="186" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9273338290</text>
  <rect x="190" y="186" width="20" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="212" y="186" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">40</text>
  <rect x="254" y="186" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <path d="M 300 200 L 380 200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="395" y="205" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">40</text>
  <text x="445" y="205" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <rect x="478" y="190" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+0</text>

  <!-- Bracket pointing at age column header -->
  <path d="M 232 232 L 232 250" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="232" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 高亮 = 年龄位 [11,13)</text>

  <!-- Summary box -->
  <rect x="60" y="282" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">合计 = 1 + 1 + 0 = 2 位老人 ✓</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#888">两位年龄子串字典序 &gt; "60" 即命中（75、92 ✓，40 ✗）</text>
</svg>
