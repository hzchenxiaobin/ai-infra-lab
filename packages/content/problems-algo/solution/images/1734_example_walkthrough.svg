<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：encoded = [3,1]，n = 3
  </text>

  <!-- encoded array on top -->
  <text x="40" y="58" font-size="11" fill="#888" filter="url(#rough2)">encoded</text>
  <rect x="120" y="42" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="40" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[0]</text>
  <rect x="190" y="42" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="215" y="40" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[1] 奇</text>

  <!-- header row -->
  <rect x="30" y="86" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">阶段</text>
  <rect x="86" y="86" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">量</text>
  <rect x="146" y="86" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">来源</text>
  <rect x="316" y="86" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">计算</text>
  <rect x="436" y="86" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="471" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">结果</text>

  <!-- Phase 1: P -->
  <rect x="30" y="112" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="129" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一</text>
  <rect x="86" y="112" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">P</text>
  <rect x="146" y="112" width="170" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1..n 全集异或</text>
  <rect x="316" y="112" width="120" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 ⊕ 2 ⊕ 3</text>
  <rect x="436" y="112" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="471" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- Phase 1: S -->
  <rect x="30" y="138" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="155" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一</text>
  <rect x="86" y="138" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">S</text>
  <rect x="146" y="138" width="170" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">encoded 奇数下标</text>
  <rect x="316" y="138" width="120" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">encoded[1] = 1</text>
  <rect x="436" y="138" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="471" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- Phase 1: arr[0] -->
  <rect x="30" y="164" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="58" y="181" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一</text>
  <rect x="86" y="164" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="181" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">arr[0]</text>
  <rect x="146" y="164" width="170" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">P ⊕ S</text>
  <rect x="316" y="164" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0 ⊕ 1</text>
  <rect x="436" y="164" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="471" y="181" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Phase 2: arr[1] -->
  <rect x="30" y="194" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="211" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">二</text>
  <rect x="86" y="194" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[1]</text>
  <rect x="146" y="194" width="170" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[0] ⊕ encoded[0]</text>
  <rect x="316" y="194" width="120" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 ⊕ 3</text>
  <rect x="436" y="194" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="471" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- Phase 2: arr[2] -->
  <rect x="30" y="220" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="237" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">二</text>
  <rect x="86" y="220" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="237" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[2]</text>
  <rect x="146" y="220" width="170" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="231" y="237" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[1] ⊕ encoded[1]</text>
  <rect x="316" y="220" width="120" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="237" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2 ⊕ 1</text>
  <rect x="436" y="220" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="471" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- arrow to final result -->
  <path d="M471,244 L471,266" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="270" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="293" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">arr = [1, 2, 3] ✓ 是 [1..3] 的排列</text>

  <!-- Insight boxes -->
  <rect x="30" y="318" width="240" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">阶段一：补首元素</text>
  <text x="150" y="356" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">P=0, S=1 → arr[0]=1</text>
  <text x="150" y="374" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">排列全集异或 + 奇下标配对</text>

  <rect x="284" y="318" width="240" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">阶段二：逐项递推</text>
  <text x="404" y="356" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[i+1]=arr[i]⊕encoded[i]</text>
  <text x="404" y="374" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">与 1720 完全相同的解码循环</text>
</svg>
