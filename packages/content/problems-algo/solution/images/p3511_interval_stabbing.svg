<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两个关键观察：只查长度 3~5；坏子数组 = 待戳的区间</text>

  <!-- 观察一：长度 8 拆成 3 + 5 -->
  <text x="260" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">观察① 长度 ≥ 6 的子数组可拆成 3~5 小段（如 8 = 3 + 5）</text>

  <rect x="70" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>
  <rect x="118" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <rect x="166" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">−4</text>
  <rect x="214" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1</text>

  <rect x="262" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">−2</text>
  <rect x="310" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <rect x="358" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">−1</text>
  <rect x="406" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <path d="M 70 96 L 70 102 L 258 102 L 258 96" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="116" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">长度 3，和 = 1 &gt; 0</text>
  <path d="M 262 96 L 262 102 L 450 102 L 450 96" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="116" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">长度 5，和 = 3 &gt; 0</text>

  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">小段全为正 ⟹ 拼成的大段必为正 ⟹ 判定「正数组」只需检查长度 3、4、5 的子数组</text>

  <!-- 观察二：坏子数组 = 待戳区间 -->
  <text x="260" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">观察② 每个坏子数组都得被替换点戳中（nums = [−1,−2,3,−1,2,6]）</text>

  <rect x="77" y="184" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="199" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="105" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">−1</text>

  <rect x="139" y="184" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="199" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#1</text>
  <text x="167" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">−2</text>

  <rect x="201" y="184" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="229" y="199" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">#2</text>
  <text x="229" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="263" y="184" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="291" y="199" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#3</text>
  <text x="291" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">−1</text>

  <rect x="325" y="184" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="199" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#4</text>
  <text x="353" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <rect x="387" y="184" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="199" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#5</text>
  <text x="415" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">6</text>

  <!-- 三个坏区间 -->
  <rect x="77" y="244" width="180" height="18" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="257" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">坏①</text>
  <text x="265" y="257" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">nums[0..2] 和 = 0 ✗</text>

  <rect x="139" y="270" width="180" height="18" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="283" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">坏②</text>
  <text x="327" y="283" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">nums[1..3] 和 = 0 ✗</text>

  <rect x="77" y="296" width="242" height="18" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="309" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">坏③</text>
  <text x="327" y="309" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">nums[0..3] 和 = −1 ✗</text>

  <!-- 落针：从格子 2 向下穿过三个坏区间 -->
  <path d="M 229 232 L 229 326" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="240" y="322" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">在右端点 r = 2 落针：nums[2] ← 10¹⁸</text>

  <!-- 结论框 -->
  <rect x="64" y="340" width="392" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">一根针修复一切：含 10¹⁸ 的子数组和 ≥ 10¹⁸ − 10⁵·10⁹ &gt; 0</text>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个坏区间至少要被一根针戳中 ⟹ 最少针数 = 经典区间选点（按右端点贪心）</text>
</svg>
