<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：频次齐一性 = 一次计数 + 过滤零 + 比较一致</text>

  <!-- ===== Example 1: abacbc (good) ===== -->
  <text x="60" y="58" font-size="12" fill="#555" font-weight="bold">示例 1：s = "abacbc"（好字符串）</text>

  <text x="60" y="84" font-size="11" fill="#888">字符串：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="137" y="90">a</text>
    <rect x="158" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="175" y="90">b</text>
    <rect x="196" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="213" y="90">a</text>
    <rect x="234" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="90">c</text>
    <rect x="272" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="289" y="90">b</text>
    <rect x="310" y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="327" y="90">c</text>
  </g>

  <path d="M 190 104 L 190 126" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="208" y="118" font-size="10.5" fill="#b85450" font-weight="bold">一次扫描计数</text>

  <text x="60" y="146" font-size="11" fill="#888">频次表：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="120" y="132" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="144" y="152">a:2</text>
    <rect x="174" y="132" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="198" y="152">b:2</text>
    <rect x="228" y="132" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="252" y="152">c:2</text>
    <text x="300" y="152" font-size="11" fill="#888">其余 = 0（过滤掉）</text>
  </g>

  <rect x="120" y="172" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">非零频次 {2, 2, 2} 全相等 → true ✓</text>

  <!-- Divider -->
  <path d="M 40 222 L 520 222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: aaabb (bad) ===== -->
  <text x="60" y="248" font-size="12" fill="#555" font-weight="bold">示例 2：s = "aaabb"（非好字符串）</text>

  <text x="60" y="274" font-size="11" fill="#888">字符串：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="260" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="137" y="280">a</text>
    <rect x="158" y="260" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="175" y="280">a</text>
    <rect x="196" y="260" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="213" y="280">a</text>
    <rect x="234" y="260" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="280">b</text>
    <rect x="272" y="260" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="289" y="280">b</text>
  </g>

  <path d="M 190 294 L 190 316" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="208" y="308" font-size="10.5" fill="#b85450" font-weight="bold">一次扫描计数</text>

  <text x="60" y="336" font-size="11" fill="#888">频次表：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="120" y="322" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="144" y="342">a:3</text>
    <rect x="174" y="322" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="198" y="342">b:2</text>
    <text x="246" y="342" font-size="11" fill="#888">其余 = 0（过滤掉）</text>
  </g>

  <rect x="120" y="362" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="383" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非零频次 {3, 2}，3 ≠ 2 → false ✗</text>

  <!-- Core formula -->
  <rect x="60" y="408" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">target = 首个非零频次；其余非零频次须全部 == target</text>
</svg>
