<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：三次 BFS ＋ 一次线性扫描，O(n)</text>

  <!-- ① 建图 -->
  <rect x="36" y="38" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="62" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 建邻接表 g（无向双向加边）</text>
  <path d="M 201 76 L 201 94" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② BFS(0) -->
  <rect x="36" y="98" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="122" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② BFS(0)：距离数组 ＋ 最远点 → a</text>
  <path d="M 201 136 L 201 154" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ BFS(a) -->
  <rect x="36" y="158" width="330" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="176" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">③ BFS(a)：得 dist2 ＋ 最远点 → b</text>
  <text x="201" y="193" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(a, b) 即一条直径</text>
  <path d="M 201 202 L 201 220" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ BFS(b) -->
  <rect x="36" y="224" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="248" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">④ BFS(b)：得 dist3</text>
  <path d="M 201 262 L 201 282" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑤ 判定菱形 -->
  <polygon points="200,286 292,322 200,358 108,322" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⑤ 对每个 i：</text>
  <text x="200" y="332" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">dist2[i] &gt; dist3[i] ?</text>

  <!-- 是 → a -->
  <path d="M 292 322 L 330 322" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="313" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="334" y="302" width="158" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="413" y="319" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[i] = a</text>
  <text x="413" y="334" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（端点 a 更远）</text>

  <!-- 否 → b -->
  <path d="M 200 358 L 200 382" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="228" y="375" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（含并列）</text>
  <rect x="112" y="386" width="176" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="403" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[i] = b</text>
  <text x="200" y="418" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（b 更远或并列，任取皆合法）</text>

  <!-- 右侧批注 1 -->
  <rect x="384" y="98" width="126" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="116" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">两次 BFS 求直径</text>
  <text x="447" y="132" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">从任意点出发的</text>
  <text x="447" y="146" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">最远点必是直径</text>
  <text x="447" y="160" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">端点（引理保证）</text>

  <!-- 右侧批注 2 -->
  <rect x="384" y="224" width="126" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="242" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">为什么用 BFS？</text>
  <text x="447" y="258" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">n = 10⁵ 的链状树，</text>
  <text x="447" y="272" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">递归 DFS 深 10⁵ 会爆栈；</text>
  <text x="447" y="286" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">BFS 迭代稳妥，还演出了</text>
  <text x="447" y="298" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">「每秒扩散一层」的题意</text>
</svg>
