<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并行 = 关键路径（DAG 带权最长路）</text>

  <!-- ===== Section 1: DAG with critical path ===== -->
  <text x="40" y="54" font-size="12" fill="#555" font-weight="bold">课程依赖图（节点=课程，边=先修，红=关键路径）：</text>

  <!-- Edges -->
  <!-- 1 -> 5 (critical red) -->
  <path d="M 80 110 L 260 250" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 2 -> 5 (gray) -->
  <path d="M 80 180 L 260 250" stroke="#bbb" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 3 -> 4 (critical red) -->
  <path d="M 80 250 L 180 250" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 3 -> 5 (gray) -->
  <path d="M 80 250 L 260 250" stroke="#bbb" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 4 -> 5 (critical red) -->
  <path d="M 180 250 L 260 250" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <!-- Node 1 -->
  <circle cx="80" cy="110" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="80" y="92" text-anchor="middle" font-size="10" fill="#888">t=1</text>

  <!-- Node 2 -->
  <circle cx="80" cy="180" r="18" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">2</text>
  <text x="80" y="162" text-anchor="middle" font-size="10" fill="#888">t=2</text>

  <!-- Node 3 -->
  <circle cx="80" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="80" y="232" text-anchor="middle" font-size="10" fill="#888">t=3</text>

  <!-- Node 4 -->
  <circle cx="180" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#888">t=4</text>

  <!-- Node 5 -->
  <circle cx="260" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="260" y="232" text-anchor="middle" font-size="10" fill="#888">t=5</text>

  <!-- Critical path label -->
  <text x="170" y="300" font-size="11" fill="#b85450" font-weight="bold">关键路径：3 → 4 → 5（耗时 3+4+5 = 12）</text>

  <!-- Divider -->
  <path d="M 40 316 L 520 316" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: Key insight ===== -->
  <rect x="40" y="328" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11.5" fill="#333">• 并行免费：可同时修任意多门课，瓶颈只在依赖链长度</text>
  <text x="56" y="370" font-size="11.5" fill="#333">• 课程 v 最早完成 = time[v] + max(先修 u 的最早完成)</text>
  <text x="56" y="386" font-size="12" fill="#446688" font-weight="bold">→ DP on DAG：拓扑序松弛 dist[v]，答案 = max(dist)</text>
</svg>
