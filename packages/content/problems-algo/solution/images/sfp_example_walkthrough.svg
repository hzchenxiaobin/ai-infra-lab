<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：features = ["cooler","lock","touch"]</text>

  <!-- Step 1: response[0] -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">Step 1: response[0]</text>
  <rect x="30" y="64" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#333">"i like cooler cooler"</text>
  <rect x="30" y="92" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="11" fill="#333">去重 → {i, like, cooler} → cnt: cooler=1, like=1, i=1</text>

  <!-- Step 2: response[1] -->
  <text x="30" y="138" font-size="11" fill="#888" font-weight="bold">Step 2: response[1]</text>
  <rect x="30" y="144" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="11" fill="#333">"lock touch cool"</text>
  <rect x="30" y="172" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="11" fill="#333">去重 → {lock, touch, cool} → cnt: cooler=1, lock=1, touch=1, cool=1</text>

  <!-- Step 3: response[2] -->
  <text x="30" y="218" font-size="11" fill="#888" font-weight="bold">Step 3: response[2]</text>
  <rect x="30" y="224" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="11" fill="#333">"locker like touch"</text>
  <rect x="30" y="252" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="269" text-anchor="middle" font-size="11" fill="#333">去重 → {locker, like, touch} → cnt: touch=2, like=2, locker=1</text>

  <!-- Divider -->
  <line x1="30" y1="292" x2="530" y2="292" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- Final cnt for features -->
  <text x="30" y="314" font-size="11" fill="#888" font-weight="bold">最终 cnt（仅 features 相关）:</text>
  <rect x="30" y="322" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="342" text-anchor="middle" font-size="12" fill="#333">cooler → 1</text>
  <rect x="200" y="322" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="342" text-anchor="middle" font-size="12" fill="#333">lock → 1</text>
  <rect x="370" y="322" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">touch → 2</text>

  <!-- Sort arrow -->
  <path d="M 280 360 L 280 374" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#446688">按 cnt 降序，同频保序</text>

  <!-- Output -->
  <rect x="30" y="382" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出：["touch","cooler","lock"]</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#666">touch(2) 最先；cooler 和 lock 同为 1，cooler 在原数组前面故排前</text>
</svg>
