<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：闭包逐代扩张——命中返 k、无新点返 −1，O(U·|S|²)，U = 7³ = 343</text>

  <g filter="url(#rough2)">
    <!-- ① 初始化 -->
    <rect x="60" y="38" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="56" text-anchor="middle" font-size="10.5" fill="#33506b">① S ← 初始点集合（tuple 去重）</text>
    <text x="185" y="72" text-anchor="middle" font-size="10.5" fill="#33506b">t ← tuple(target)，k ← 0</text>

    <path d="M 185 82 L 185 92" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- 判定 1：t ∈ S ? -->
    <polygon points="185,96 248,120 185,144 122,120" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="185" y="124" text-anchor="middle" font-size="10.5" fill="#8a3030">t ∈ S ?</text>

    <text x="266" y="114" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M 248 120 L 316 120" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="320" y="102" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="380" y="124" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">返回 0</text>

    <text x="193" y="158" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M 185 144 L 185 156" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- ② 逐代生成中点 -->
    <rect x="60" y="160" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="178" text-anchor="middle" font-size="10.5" fill="#33506b">② k ← k+1；枚举 S 中所有点对 a ≠ b</text>
    <text x="185" y="194" text-anchor="middle" font-size="10.5" fill="#33506b">nxt ← { ⌊(a+b)/2⌋ }（逐坐标）</text>

    <path d="M 185 204 L 185 214" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- 判定 2：t ∈ nxt ? -->
    <polygon points="185,218 250,242 185,266 120,242" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="185" y="246" text-anchor="middle" font-size="10.5" fill="#8a3030">t ∈ nxt ?</text>

    <text x="266" y="236" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M 250 242 L 316 242" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="320" y="224" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="380" y="246" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">返回 k</text>

    <text x="193" y="280" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M 185 266 L 185 276" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- 判定 3：无新点 ? -->
    <polygon points="185,280 250,304 185,328 120,304" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="185" y="308" text-anchor="middle" font-size="10.5" fill="#8a3030">nxt ⊆ S ?</text>

    <text x="266" y="298" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M 250 304 L 316 304" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="320" y="286" width="130" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="385" y="302" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">返回 −1</text>
    <text x="385" y="315" text-anchor="middle" font-size="8" fill="#8a3030">闭包稳定，永不可达</text>

    <text x="193" y="342" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M 185 328 L 185 340" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- ③ 新点入池 -->
    <rect x="85" y="342" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="185" y="360" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">③ S ← S ∪ nxt：新点入池</text>
    <text x="185" y="376" text-anchor="middle" font-size="10.5" fill="#2f5d24">参与下一代的配对</text>

    <!-- 回边 -->
    <path d="M 85 364 L 30 364 L 30 182 L 56 182" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="52" y="356" text-anchor="middle" font-size="9" fill="#446688">下一代</text>

    <!-- 右侧要点 -->
    <rect x="320" y="336" width="210" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="425" y="354" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">不变量：循环内恒有 t ∉ S</text>
    <text x="425" y="370" text-anchor="middle" font-size="9.5" fill="#2f5d24">⇒ 首次命中 nxt 即最小 k</text>
    <text x="425" y="386" text-anchor="middle" font-size="9.5" fill="#2f5d24">先判命中再判停，顺序安全</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="40" y="414" width="245" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="162" y="432" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">复杂度：每代 O(|S|²) 点对 × ≤ 343 代</text>
    <text x="162" y="448" text-anchor="middle" font-size="9.5" fill="#33506b">最坏 O(U³) ≈ 2×10⁷；实测 ~8 代即稳</text>
    <text x="162" y="464" text-anchor="middle" font-size="9.5" fill="#33506b">空间 O(U)，U = 7³ = 343</text>

    <rect x="300" y="414" width="245" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="422" y="432" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">易错：只拿第 k−1 代新点配对会漏解</text>
    <text x="422" y="448" text-anchor="middle" font-size="9.5" fill="#8a3030">(1,1,1) 需 gen0 × gen1 跨代配对</text>
    <text x="422" y="464" text-anchor="middle" font-size="9.5" fill="#8a3030">配对池必须是历代全部点 S</text>
  </g>
</svg>
