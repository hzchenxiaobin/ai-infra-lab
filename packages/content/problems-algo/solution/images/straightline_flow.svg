<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">叉乘判共线流程：取前两点定方向 → 逐点叉乘 → 全零即共线</text>

  <!-- Step 1: pick p0, p1 -->
  <rect x="170" y="46" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取基准 p0、p1（首两点）</text>
  <path d="M 260 84 L 260 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute dx, dy -->
  <rect x="140" y="100" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333">dx = x1 − x0， dy = y1 − y0</text>
  <path d="M 260 142 L 260 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init i = 2 -->
  <rect x="220" y="158" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333">i = 2</text>
  <path d="M 260 190 L 260 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="260,206 340,244 260,282 180,244" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>

  <!-- No -> return true -->
  <path d="M 340 244 L 430 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="385" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="226" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- Yes -> down to cross product -->
  <path d="M 260 282 L 260 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="292" font-size="11" fill="#446688" font-weight="bold">是</text>

  <!-- compute cross -->
  <rect x="110" y="298" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333">cross = dx·(yᵢ − y0) − dy·(xᵢ − x0)</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888">（p0→p1 与 p0→pᵢ 的叉积）</text>
  <path d="M 260 344 L 260 358" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cross == 0 ? -->
  <polygon points="260,360 340,398 260,436 180,398" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#333">cross == 0 ?</text>

  <!-- No -> return false -->
  <path d="M 340 398 L 430 398" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ⭐</text>
  <rect x="430" y="380" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- Yes -> i++ and loop back -->
  <path d="M 180 398 L 90 398" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="135" y="390" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是</text>
  <path d="M 90 398 L 90 220 L 220 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="300" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="318" text-anchor="middle" font-size="11" fill="#333">i++</text>

  <!-- Legend -->
  <rect x="20" y="40" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="52" font-size="10" fill="#555">变量</text>
  <rect x="20" y="58" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="70" font-size="10" fill="#555">计算</text>
  <rect x="20" y="76" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="10" fill="#555">判定</text>
  <rect x="20" y="94" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="106" font-size="10" fill="#555">返回假</text>
</svg>
