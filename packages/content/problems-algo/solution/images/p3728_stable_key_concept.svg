<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333"
        filter="url(#rough2)">核心观察：两条等式 ⟺ 一个二元组 key 匹配</text>

  <!-- 数组格子 [9,3,3,3,9] -->
  <text x="50" y="70" font-size="12" fill="#446688" filter="url(#rough2)">a =</text>
  <g filter="url(#rough2)">
    <rect x="90" y="48" width="54" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="117" y="69" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="144" y="48" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="171" y="69" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
    <rect x="198" y="48" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="225" y="69" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
    <rect x="252" y="48" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="279" y="69" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
    <rect x="306" y="48" width="54" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="333" y="69" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">9</text>
  </g>
  <!-- 下标标注 -->
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="117" y="96" fill="#4a7a3a">l = 0</text>
    <text x="333" y="96" fill="#4a7a3a">r = 4</text>
  </g>
  <!-- 首尾连线 -->
  <path d="M 117 40 C 160 22, 290 22, 333 40" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="225" y="26" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① 首 = 尾</text>
  <!-- 中间段大括号 -->
  <path d="M 171 84 L 171 90 L 225 96 L 279 90 L 279 84" fill="none" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">② 中间和 3+3+3 = 9</text>
  <text x="420" y="96" font-size="11.5" fill="#b85450" filter="url(#rough2)">两条都要 ✓</text>

  <!-- 移项公式框 -->
  <rect x="40" y="128" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle">
    <text x="260" y="150">② 前缀和改写：pre[r] − pre[l+1] = a[r]</text>
    <text x="260" y="172">移项：<tspan fill="#b85450" font-weight="bold">pre[r] − a[r] = pre[l+1]</tspan>　（l 侧与 r 侧彻底分离！）</text>
  </g>

  <!-- key 匹配 -->
  <g filter="url(#rough2)">
    <rect x="46" y="210" width="196" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="144" y="233" text-anchor="middle" font-size="12.5" fill="#4a7a3a">左端点钥匙</text>
    <text x="144" y="253" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">key_l(l) = ( a[l], pre[l+1] )</text>

    <rect x="278" y="210" width="196" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="376" y="233" text-anchor="middle" font-size="12.5" fill="#d6a040">右端点钥匙</text>
    <text x="376" y="253" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">key_r(r) = ( a[r], pre[r]−a[r] )</text>
  </g>
  <text x="260" y="244" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① + ② 同时成立 ⟺ key_l = key_r（缺一不可，交集！）</text>

  <!-- 命中示例 -->
  <rect x="40" y="300" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#b85450" text-anchor="middle">
    <text x="260" y="319">key_l(0) = (9, pre[1]) = (9, 9)　=　key_r(4) = (9, pre[4]−9) → 命中 [9,3,3,3,9]</text>
    <text x="260" y="338">key_l(1) = (3, pre[2]) = (3, 12) = key_r(3) = (3, pre[3]−3) → 命中 [3,3,3]</text>
  </g>
</svg>
