<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：固定 r，「恰好 k 个不同」把值集合钉死</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <text x="28" y="72" font-size="11" fill="#666">nums =</text>
    <rect x="76"  y="50" width="52" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="132" y="50" width="52" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="188" y="50" width="52" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="244" y="50" width="52" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="300" y="50" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="102" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="158" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="214" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="270" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="326" y="76" text-anchor="middle" font-size="15" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="326" y="42" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">r = 4</text>
    <path d="M326 44 L326 50" stroke="#d6a040" stroke-width="1.6"/>

    <text x="102" y="104" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="158" y="104" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="214" y="104" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="270" y="104" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="326" y="104" text-anchor="middle" font-size="10" fill="#999">4</text>

    <!-- l 轴 -->
    <text x="30" y="126" font-size="10" fill="#666">l 轴</text>
    <line x1="42" y1="132" x2="352" y2="132" stroke="#888" stroke-width="1.4"/>
    <line x1="102" y1="127" x2="102" y2="137" stroke="#888" stroke-width="1.2"/>
    <line x1="158" y1="127" x2="158" y2="137" stroke="#888" stroke-width="1.2"/>
    <line x1="214" y1="127" x2="214" y2="137" stroke="#888" stroke-width="1.2"/>
    <line x1="270" y1="127" x2="270" y2="137" stroke="#888" stroke-width="1.2"/>
    <line x1="326" y1="127" x2="326" y2="137" stroke="#888" stroke-width="1.2"/>

    <!-- 蓝点：last -->
    <circle cx="326" cy="120" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="214" cy="120" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="326" y="112" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">x₁=4</text>
    <text x="214" y="112" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">x₂=2</text>

    <!-- 橙点：f -->
    <circle cx="102" cy="146" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="270" cy="146" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="102" y="164" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">f(1)=0</text>
    <text x="270" y="164" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">f(2)=3</text>

    <!-- 图例 -->
    <circle cx="48" cy="180" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="58" y="184" font-size="9.5" fill="#666">last：l 跨过则 distinct +1</text>
    <circle cx="216" cy="180" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="226" y="184" font-size="9.5" fill="#666">f：从 r 往左数第 m 次出现</text>
  </g>

  <!-- 右侧值信息面板 -->
  <g filter="url(#rough2)">
    <rect x="372" y="46" width="168" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="456" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">值 1：出现于 0, 2</text>
    <text x="456" y="78" text-anchor="middle" font-size="10" fill="#33506b">last = 2（x₂）　f(1) = 0</text>

    <rect x="372" y="92" width="168" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="456" y="108" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">值 2：出现于 1, 3, 4</text>
    <text x="456" y="124" text-anchor="middle" font-size="10" fill="#2f5d24">last = 4（x₁）　f(2) = 3</text>

    <rect x="372" y="138" width="168" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="456" y="160" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">M = min(f(1), f(2)) = 0</text>
  </g>

  <!-- 三重边界合成 -->
  <g filter="url(#rough2)">
    <rect x="76" y="196" width="164" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="212" font-size="11" fill="#2f5d24" font-weight="bold">恰好 2 个不同：l ∈ (x₃, x₂]，x₃ = −1</text>

    <rect x="76" y="228" width="52" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="138" y="244" font-size="11" fill="#8a6d1a" font-weight="bold">每个值 ≥ 2 次 ⟺ l ≤ M = 0</text>

    <rect x="76" y="260" width="52" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="138" y="276" font-size="11" fill="#8a3030" font-weight="bold">交集 = {0} → 子数组 [1,2,1,2,2]，贡献 1</text>
  </g>

  <!-- 洞察框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="296" width="520" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="316" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">非单调性去哪了？</text>
    <text x="280" y="336" text-anchor="middle" font-size="11" fill="#33506b">l ∈ (x₃, x₂] 时，窗口值集合固定为「前 k 近」的 {1, 2}</text>
    <text x="280" y="354" text-anchor="middle" font-size="11" fill="#33506b">频次条件不再随 l 起伏，坍缩为一条左边界 l ≤ M = min f(v)</text>
    <text x="280" y="374" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">贡献 = max(0, min(x₂, M) − x₃) = min(2, 0) − (−1) = 1</text>
  </g>
</svg>
