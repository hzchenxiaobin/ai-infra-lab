<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "111000"，n = 6（偶）</text>
  <text x="310" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t = s+s = "111000111000"，P₀ = "010101010101"，红=不匹配，绿=匹配</text>

  <!-- ===== Window [0,5] ===== -->
  <text x="22" y="74" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口[0,5]</text>
  <text x="22" y="86" font-size="8" fill="#888" filter="url(#rough2)">t="111000"</text>
  <!-- cells: pos 0-5, t=1,1,1,0,0,0 ; P0=0,1,0,1,0,1 ; mismatch: 0,2,3,5 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <!-- pos 0: mismatch -->
    <rect x="110" y="56" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="132" y="68" font-size="8" fill="#aaa">pos 0</text>
    <text x="132" y="84" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="132" y="98" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 1: match -->
    <rect x="156" y="56" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="178" y="68" font-size="8" fill="#aaa">pos 1</text>
    <text x="178" y="84" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="178" y="98" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 2: mismatch -->
    <rect x="202" y="56" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="224" y="68" font-size="8" fill="#aaa">pos 2</text>
    <text x="224" y="84" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="224" y="98" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 3: mismatch -->
    <rect x="248" y="56" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="270" y="68" font-size="8" fill="#aaa">pos 3</text>
    <text x="270" y="84" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="270" y="98" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 4: match -->
    <rect x="294" y="56" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="316" y="68" font-size="8" fill="#aaa">pos 4</text>
    <text x="316" y="84" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="316" y="98" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 5: mismatch -->
    <rect x="340" y="56" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="362" y="68" font-size="8" fill="#aaa">pos 5</text>
    <text x="362" y="84" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="362" y="98" font-size="9" fill="#888">P₀=1</text>
  </g>
  <!-- result -->
  <rect x="400" y="60" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">diff₀ = 4</text>
  <text x="500" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">min(4, 6−4) = 2</text>

  <!-- ===== Window [2,7] ===== -->
  <text x="22" y="128" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口[2,7]</text>
  <text x="22" y="140" font-size="8" fill="#888" filter="url(#rough2)">t="100011"</text>
  <text x="22" y="152" font-size="8" fill="#b85450" filter="url(#rough2)">★官方解</text>
  <!-- cells: pos 2-7, t=1,0,0,0,1,1 ; P0=0,1,0,1,0,1 ; mismatch: 2,3,5,6 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <!-- pos 2: mismatch -->
    <rect x="110" y="112" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="132" y="124" font-size="8" fill="#aaa">pos 2</text>
    <text x="132" y="140" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="132" y="154" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 3: mismatch -->
    <rect x="156" y="112" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="178" y="124" font-size="8" fill="#aaa">pos 3</text>
    <text x="178" y="140" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="178" y="154" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 4: match -->
    <rect x="202" y="112" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="224" y="124" font-size="8" fill="#aaa">pos 4</text>
    <text x="224" y="140" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="224" y="154" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 5: mismatch -->
    <rect x="248" y="112" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="270" y="124" font-size="8" fill="#aaa">pos 5</text>
    <text x="270" y="140" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="270" y="154" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 6: mismatch -->
    <rect x="294" y="112" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="316" y="124" font-size="8" fill="#aaa">pos 6</text>
    <text x="316" y="140" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="316" y="154" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 7: match -->
    <rect x="340" y="112" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="362" y="124" font-size="8" fill="#aaa">pos 7</text>
    <text x="362" y="140" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="362" y="154" font-size="9" fill="#888">P₀=1</text>
  </g>
  <rect x="400" y="116" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">diff₀ = 4</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">min(4, 2) = 2 ✓</text>

  <!-- ===== Window [4,9] ===== -->
  <text x="22" y="184" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口[4,9]</text>
  <text x="22" y="196" font-size="8" fill="#888" filter="url(#rough2)">t="001100"</text>
  <!-- cells: pos 4-9, t=0,0,1,1,1,0 ; P0=0,1,0,1,0,1 ; mismatch: 5,6,8,9 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <!-- pos 4: match -->
    <rect x="110" y="168" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="132" y="180" font-size="8" fill="#aaa">pos 4</text>
    <text x="132" y="196" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="132" y="210" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 5: mismatch -->
    <rect x="156" y="168" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="178" y="180" font-size="8" fill="#aaa">pos 5</text>
    <text x="178" y="196" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="178" y="210" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 6: mismatch -->
    <rect x="202" y="168" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="224" y="180" font-size="8" fill="#aaa">pos 6</text>
    <text x="224" y="196" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="224" y="210" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 7: match -->
    <rect x="248" y="168" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="270" y="180" font-size="8" fill="#aaa">pos 7</text>
    <text x="270" y="196" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="270" y="210" font-size="9" fill="#888">P₀=1</text>
    <!-- pos 8: mismatch -->
    <rect x="294" y="168" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="316" y="180" font-size="8" fill="#aaa">pos 8</text>
    <text x="316" y="196" font-size="14" fill="#333" font-weight="bold">1</text>
    <text x="316" y="210" font-size="9" fill="#888">P₀=0</text>
    <!-- pos 9: mismatch -->
    <rect x="340" y="168" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="362" y="180" font-size="8" fill="#aaa">pos 9</text>
    <text x="362" y="196" font-size="14" fill="#333" font-weight="bold">0</text>
    <text x="362" y="210" font-size="9" fill="#888">P₀=1</text>
  </g>
  <rect x="400" y="172" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">diff₀ = 4</text>
  <text x="500" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">min(4, 2) = 2</text>

  <!-- ===== Summary ===== -->
  <path d="M 310 228 L 310 244" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="100" y="248" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="271" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所有窗口均得 diff₀=4 → 答案 = min(4, 2) = 2 ✓</text>

  <!-- Note about even n -->
  <rect x="40" y="294" width="540" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">⚠ n 为偶数时 diff₀ 不随滑动改变</text>
  <text x="60" y="332" font-size="10" fill="#888" filter="url(#rough2)">原因：t[i] = t[i+n]（倍增），且 P₀[i] = P₀[i+n]（n 偶则 i 与 i+n 同奇偶）</text>
  <text x="60" y="350" font-size="10" fill="#888" filter="url(#rough2)">→ 移出与移入的失配状态相同，diff₀ 恒定，旋转不改善结果。n 奇时 diff₀ 每步 ±1，旋转才有效。</text>
</svg>
