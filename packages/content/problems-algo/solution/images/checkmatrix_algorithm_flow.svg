<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：seen 数组逐行 / 逐列校验</text>

  <!-- Start -->
  <rect x="240" y="46" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 74 L 280 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1: check rows -->
  <rect x="120" y="92" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段一：逐行校验</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#555">for i in 0..n-1:  seen=[false]*(n+1)</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#555">  for j: seen[matrix[i][j]]=true;  末了查 seen[1..n] 全 true</text>
  <path d="M 280 148 L 280 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: row ok? -->
  <polygon points="280,166 360,196 280,226 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">所有行都合法?</text>

  <!-- No -> return false -->
  <path d="M 200 196 L 120 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="50" y="182" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="85" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes -> phase 2 -->
  <path d="M 280 226 L 280 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Phase 2: check cols -->
  <rect x="120" y="244" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段二：逐列校验</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#555">for j in 0..n-1:  seen=[false]*(n+1)</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#555">  for i: seen[matrix[i][j]]=true;  末了查 seen[1..n] 全 true</text>
  <path d="M 280 300 L 280 314" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: col ok? -->
  <polygon points="280,318 360,348 280,378 200,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">所有列都合法?</text>

  <!-- No -> return false -->
  <path d="M 200 348 L 120 348" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="50" y="334" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="85" y="353" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes -> return true -->
  <path d="M 280 378 L 280 396" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="392" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="230" y="400" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
