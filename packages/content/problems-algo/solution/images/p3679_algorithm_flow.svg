<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一遍扫描 + 窗口配额计数</text>

  <!-- 开始框 -->
  <rect x="160" y="38" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">第 i 天到达物品 t = arrivals[i]</text>

  <path d="M260,72 L260,88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 出窗步骤框 -->
  <rect x="88" y="92" width="344" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">出窗：第 i−w 天的物品「被保留」过 → cnt[其类型] −−</text>
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠️ 丢弃过的物品出窗时不能减 cnt（它是幽灵）</text>

  <path d="M260,140 L260,154" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,158 345,196 260,234 175,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">cnt[t] &lt; m ?</text>

  <path d="M175,196 L158,196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M158,196 L158,180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="176" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M345,196 L362,196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M362,196 L362,180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="176" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 保留框 -->
  <rect x="32" y="136" width="126" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">保留 ✓</text>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#3a5f30" filter="url(#rough2)">cnt[t]++ · kept[i] = 1</text>

  <!-- 丢弃框 -->
  <rect x="362" y="136" width="126" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">丢弃 ✗</text>
  <text x="425" y="172" text-anchor="middle" font-size="11" fill="#a04340" filter="url(#rough2)">ans++ · cnt 不动</text>

  <!-- 汇合箭头 -->
  <path d="M95,180 L95,258" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M425,180 L425,258" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M95,258 L425,258" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M260,258 L260,272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="130" y="276" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">i + 1 ≤ n → 处理下一天</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">全部处理完 → 返回 ans</text>

  <!-- 回边 -->
  <path d="M390,299 L462,299" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M462,299 L462,55" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M462,55 L366,55" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="474" y="180" font-size="11" fill="#777" filter="url(#rough2)">下</text>
  <text x="474" y="196" font-size="11" fill="#777" filter="url(#rough2)">一</text>
  <text x="474" y="212" font-size="11" fill="#777" filter="url(#rough2)">天</text>
</svg>
