<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">for...in 短路：有可枚举属性立刻 false，无属性才 true</text>

  <!-- ===== LEFT: empty object {} ===== -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">空对象 obj = {}</text>

  <!-- empty object box -->
  <rect x="70" y="66" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="94" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">{ }</text>

  <!-- for...in tries to enumerate: nothing -->
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">for...in 想枚举属性</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">→ 无可枚举属性</text>

  <!-- arrow down to true -->
  <path d="M 120 156 L 120 182" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- result: true -->
  <rect x="62" y="188" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="214" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <text x="120" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环体一次都不进入</text>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">代价 O(1)</text>

  <!-- ===== divider ===== -->
  <path d="M 280 50 L 280 300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== RIGHT: non-empty object ===== -->
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">非空 obj = {"x":5,"y":42}</text>

  <!-- object with two keys: x (hit, red) and y (skipped, grey) -->
  <rect x="360" y="66" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="94" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x: 5</text>

  <rect x="434" y="66" width="70" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="94" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">y: 42</text>
  <line x1="438" y1="100" x2="500" y2="100" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- for...in hits first key x -->
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">for...in 命中第一个属性</text>
  <path d="M 395 116 L 395 66" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="340" y="92" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">① x</text>

  <text x="469" y="130" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">短路，未触及</text>

  <!-- arrow down to false -->
  <path d="M 440 140 L 440 182" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- result: false -->
  <rect x="382" y="188" width="116" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="214" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <text x="440" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">首个属性即退出</text>
  <text x="440" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">代价 O(1)</text>

  <!-- bottom note -->
  <rect x="60" y="290" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">判定「是否为空」只需知道「有没有键」，不必数清「有几个键」</text>
</svg>
