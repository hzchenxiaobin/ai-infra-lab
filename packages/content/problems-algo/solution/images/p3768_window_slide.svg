<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：窗口右滑一格，逆序对只差两笔账</text>

  <!-- nums 数组 -->
  <text x="52" y="78" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="74" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="151" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="259" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="313" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="97" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="151" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="205" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="259" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="313" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- 旧窗口 -->
  <text x="140" y="40" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">旧窗口 [3,1,2]，inv = 2</text>
  <rect x="70" y="48" width="140" height="48" rx="8" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 新窗口 -->
  <rect x="124" y="46" width="140" height="52" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="194" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新窗口 [1,2,5]，inv = 0</text>

  <!-- 右滑箭头 -->
  <path d="M 230 34 C 292 30, 302 82, 252 114" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">右滑</text>

  <!-- 指向两本账的箭头 -->
  <path d="M 97 92 C 86 118, 76 128, 66 140" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 259 92 C 292 118, 322 128, 344 140" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 账本一：出窗 -->
  <rect x="20" y="142" width="252" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">❶ 出窗 nums[l]=3：数「比我小的」</text>
  <text x="146" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">窗口内 &lt; 3 的：1、2 → 2 个</text>
  <text x="146" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">inv −= 2：对 (3,1)、(3,2) 消失</text>
  <text x="146" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（3 是这些对的左端点）</text>

  <!-- 账本二：进窗 -->
  <rect x="288" y="142" width="252" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">❷ 进窗 nums[r+1]=5：数「比我大的」</text>
  <text x="414" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">窗口内 &gt; 5 的：无 → 0 个</text>
  <text x="414" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">inv += 0：没有新增的逆序对</text>
  <text x="414" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（5 是新对的右端点）</text>

  <!-- BIT 部分 -->
  <text x="280" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">窗口计数存进树状数组（按离散化排名 1..n）</text>

  <text x="140" y="282" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排名1</text>
  <text x="194" y="282" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排名2</text>
  <text x="248" y="282" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排名3</text>
  <text x="302" y="282" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排名4</text>
  <text x="356" y="282" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排名5</text>
  <rect x="118" y="288" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="288" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="288" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="288" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="334" y="288" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="194" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="310" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="302" y="310" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="356" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="62" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">比 a 小 =</text>
  <text x="62" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">query(rank(a)−1)</text>
  <text x="498" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">比 b 大 =</text>
  <text x="498" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(k−1)−query(rank(b))</text>

  <!-- 底部备注 -->
  <rect x="60" y="338" width="440" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">值域高达 10⁹，但只有 n ≤ 10⁵ 个数 → 离散化成排名 1..n</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">BIT 单点加 + 前缀查询，每笔账 O(log n)</text>
</svg>
