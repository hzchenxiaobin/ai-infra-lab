<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">每行选一个元素，最小化 |Σ − target|</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">可达和 DP：逐行维护可达和集合，封顶 target + 70</text>

  <!-- ===== Matrix section ===== -->
  <text x="56" y="88" font-size="11" fill="#666" font-weight="bold">mat</text>

  <!-- Row 0 : pick 1 -->
  <text x="78" y="87" text-anchor="end" font-size="10" fill="#888">row0</text>
  <rect x="100" y="66" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="148" y="66" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="87" text-anchor="middle" font-size="13" fill="#aaa">2</text>
  <rect x="196" y="66" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="87" text-anchor="middle" font-size="13" fill="#aaa">3</text>

  <!-- Row 1 : pick 5 -->
  <text x="78" y="127" text-anchor="end" font-size="10" fill="#888">row1</text>
  <rect x="100" y="106" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="127" text-anchor="middle" font-size="13" fill="#aaa">4</text>
  <rect x="148" y="106" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="127" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="196" y="106" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="127" text-anchor="middle" font-size="13" fill="#aaa">6</text>

  <!-- Row 2 : pick 7 -->
  <text x="78" y="167" text-anchor="end" font-size="10" fill="#888">row2</text>
  <rect x="100" y="146" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="148" y="146" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="167" text-anchor="middle" font-size="13" fill="#aaa">8</text>
  <rect x="196" y="146" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="167" text-anchor="middle" font-size="13" fill="#aaa">9</text>

  <!-- Sum computation -->
  <text x="280" y="100" font-size="12" fill="#444">选中: 1 + 5 + 7 = 13</text>
  <text x="280" y="120" font-size="12" fill="#444">target = 13</text>
  <rect x="276" y="132" width="150" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="151" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">|13 − 13| = 0  ✓</text>

  <!-- ===== Cap insight box ===== -->
  <rect x="40" y="206" width="520" height="176" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="230" font-size="12" fill="#444" font-weight="bold">关键洞察：封顶 cap = target + max_val  (≤ target + 70)</text>

  <!-- Number line -->
  <line x1="80" y1="278" x2="520" y2="278" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- keep zone -->
  <rect x="120" y="274" width="280" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留区间</text>

  <!-- discard zone -->
  <rect x="400" y="274" width="120" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">丢弃</text>

  <!-- ticks -->
  <line x1="120" y1="272" x2="120" y2="284" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="298" text-anchor="middle" font-size="10" fill="#888">0</text>

  <line x1="300" y1="268" x2="300" y2="288" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">target</text>

  <line x1="400" y1="268" x2="400" y2="288" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">target+70</text>

  <!-- proof sketch -->
  <text x="60" y="328" font-size="11" fill="#555">证明：若最优和 S* &gt; target + 70，任选一行将选中值替换为该行最小值，</text>
  <text x="60" y="346" font-size="11" fill="#555">和减少 ≤ 70 → 新和仍 &gt; target 且更近 → 与最优矛盾。∴ S* ≤ target + 70。</text>
  <text x="60" y="368" font-size="10" fill="#888">注：mat[i][j] ∈ [1, 70]，元素全正 → 部分和超过 cap 后只增不减，可即时丢弃。</text>
</svg>
