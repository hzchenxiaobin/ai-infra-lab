<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针计数 + 阈值判定</text>

  <!-- init -->
  <rect x="150" y="40" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0, j = n-1, cnt = 0</text>

  <path d="M 270 72 L 270 94" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop cond diamond: i < j ? -->
  <polygon points="270,98 390,148 270,198 150,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i &lt; j ?</text>
  <text x="270" y="160" text-anchor="middle" font-size="10.5" fill="#555">（还有未检查的对）</text>

  <!-- no -> exit to cnt<=2 -->
  <path d="M 390 148 L 470 148 L 470 410 L 392 410" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="404" y="140" font-size="11" fill="#888">否(结束)</text>

  <!-- yes -> compare -->
  <path d="M 270 198 L 270 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- diamond: s[i] != s[j] ? -->
  <polygon points="270,226 380,266 270,306 160,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">s[i] ≠ s[j] ?</text>

  <!-- yes -> cnt++ -->
  <path d="M 380 266 L 440 266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="260" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="250" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt++</text>

  <!-- no -> nothing, merge down -->
  <path d="M 270 306 L 270 332" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="324" font-size="11" fill="#888">否, 跳过</text>

  <!-- cnt++ rejoin: from cnt box back down to advance -->
  <path d="M 480 282 L 480 340 L 340 340" stroke="#888" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- advance pointers -->
  <rect x="200" y="334" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="355" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++, j--</text>

  <!-- loop back to i<j -->
  <path d="M 200 350 L 90 350 L 90 148 L 150 148" stroke="#888" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="96" y="252" font-size="11" fill="#888">下一对</text>

  <!-- divider -->
  <path d="M 30 392 L 510 392" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="36" y="412" font-size="12.5" fill="#b85450" font-weight="bold">③ 阈值判定</text>

  <!-- decision diamond: cnt <= 2 ? -->
  <polygon points="270,404 380,444 270,484 160,444" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">cnt ≤ 2 ?</text>

  <!-- yes -> true -->
  <path d="M 380 444 L 470 444 L 470 470" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="438" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="472" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="492" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- no -> false -->
  <path d="M 160 444 L 90 444 L 90 470" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="110" y="438" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="18" y="472" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="64" y="492" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- legend -->
  <text x="160" y="540" font-size="11" fill="#888">每对不等 cnt+1；m=cnt≥3 则必败，m≤2 必可成回文</text>
  <text x="160" y="554" font-size="10.5" fill="#888">（m=0 时改一对对称位凑 2 步 / 奇数长改中间位凑 1 步）</text>
</svg>
