<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：示例 1 计数过程</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">matches = [[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]]</text>

  <!-- ===== Top: matches list (two columns compact) ===== -->
  <rect x="24" y="52" width="512" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"
        rx="6" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="9.5" fill="#555">①[1,3]</text>
  <text x="120" y="76" font-size="9.5" fill="#555">②[2,3]</text>
  <text x="200" y="76" font-size="9.5" fill="#555">③[3,6]</text>
  <text x="280" y="76" font-size="9.5" fill="#555">④[5,6]</text>
  <text x="360" y="76" font-size="9.5" fill="#555">⑤[5,7]</text>
  <text x="440" y="76" font-size="9.5" fill="#555">⑥[4,5]</text>
  <text x="40" y="90" font-size="9.5" fill="#555">⑦[4,8]</text>
  <text x="120" y="90" font-size="9.5" fill="#555">⑧[4,9]</text>
  <text x="200" y="90" font-size="9.5" fill="#555">⑨[10,4]</text>
  <text x="280" y="90" font-size="9.5" fill="#555">⑩[10,9]</text>

  <!-- arrow down -->
  <path d="M 280 94 L 280 108" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="106" font-size="9" fill="#888">逐场累加</text>

  <!-- ===== Middle: final loss table (grid) ===== -->
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">最终 loss 表（10 场后）</text>

  <!-- player header row -->
  <rect x="40" y="132" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="4" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">玩家</text>
  <!-- 10 player cells -->
  <g filter="url(#rough2)">
    <rect x="80" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="124" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="168" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="212" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="256" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="300" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="344" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="388" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="432" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="476" y="132" width="44" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="102" y="150" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="146" y="150" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="190" y="150" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="234" y="150" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="278" y="150" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="322" y="150" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <text x="366" y="150" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <text x="410" y="150" text-anchor="middle" font-size="10.5" fill="#333">8</text>
  <text x="454" y="150" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <text x="498" y="150" text-anchor="middle" font-size="10.5" fill="#333">10</text>

  <!-- loss count row header -->
  <rect x="40" y="158" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="4" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">败场</text>
  <!-- loss cells colored by value: 0=red, 1=orange, 2=grey -->
  <g filter="url(#rough2)">
    <rect x="80" y="158" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="124" y="158" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="168" y="158" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="212" y="158" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="256" y="158" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="158" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="344" y="158" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="388" y="158" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="432" y="158" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="476" y="158" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <text x="102" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="146" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="234" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="278" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="322" y="176" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="366" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="410" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="454" y="176" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="498" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- highlight note for player 3 -->
  <text x="190" y="206" text-anchor="middle" font-size="9" fill="#888">③ 玩家3 赢了6 但已输2场 → setdefault 不动</text>

  <!-- ===== Filter arrows ===== -->
  <path d="M 102 188 C 102 215 150 230 200 246" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 234 188 C 234 220 260 235 290 268" stroke="#d6a040" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="150" y="232" font-size="9.5" fill="#b85450" font-weight="bold">败场==0</text>
  <text x="262" y="252" font-size="9.5" fill="#d6a040" font-weight="bold">败场==1</text>

  <!-- ===== Bottom: answer buckets ===== -->
  <!-- answer[0] -->
  <rect x="40" y="248" width="220" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">answer[0]：没输过</text>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1, 2, 10]  ← 排序</text>

  <!-- answer[1] -->
  <rect x="300" y="268" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"
        rx="8" filter="url(#rough2)"/>
  <text x="410" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer[1]：输一场</text>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[4, 5, 7, 8]  ← 排序</text>

  <!-- ignored note -->
  <rect x="120" y="332" width="320" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.3"
        rx="6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#555">败场 ≥ 2（玩家 3、6、9）→ 忽略，不进任何答案</text>

  <!-- ===== Final answer ===== -->
  <rect x="60" y="380" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"
        rx="6" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">
    返回 [[1,2,10], [4,5,7,8]] ✓
  </text>

  <!-- footer -->
  <text x="280" y="430" text-anchor="middle" font-size="9.5" fill="#888">红=败场0 · 橙=败场1 · 灰=败场≥2(忽略)</text>
</svg>
