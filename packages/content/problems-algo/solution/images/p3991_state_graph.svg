<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：排列是节点，前缀反转是边</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1：nums = [2,0,1]，pre = [2,3]，目标 [0,1,2]</text>

  <!-- A: 起点 -->
  <rect x="35" y="150" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">[2,0,1]</text>
  <text x="81" y="200" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">起点 · d=0</text>

  <!-- B: 层1 上 -->
  <rect x="214" y="64" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[0,2,1]</text>
  <text x="316" y="86" font-size="10" fill="#666" filter="url(#rough2)">d=1</text>

  <!-- C: 层1 下 -->
  <rect x="214" y="236" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,0,2]</text>
  <text x="316" y="258" font-size="10" fill="#666" filter="url(#rough2)">d=1</text>

  <!-- D: 层2 上 -->
  <rect x="393" y="64" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,2,0]</text>
  <text x="439" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=2</text>

  <!-- E: 目标 -->
  <rect x="393" y="236" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="258" text-anchor="middle" font-size="13" fill="#2d5a1f" font-weight="bold" filter="url(#rough2)">[0,1,2]</text>
  <text x="439" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标 · d=2 ✓</text>

  <!-- 边 A->B k=2 -->
  <path d="M117,152 L210,92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=2</text>

  <!-- 边 A->C k=3 (答案路径) -->
  <path d="M117,182 L210,246" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="142" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=3</text>

  <!-- 边 B->D k=3 -->
  <path d="M306,81 L389,81" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=3</text>

  <!-- 边 C->E k=2 (答案路径) -->
  <path d="M306,253 L389,253" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="348" y="244" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k=2</text>

  <!-- 中部注释 -->
  <text x="258" y="158" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前 k 位反转是自逆运算（再做一次就还原），</text>
  <text x="258" y="173" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所以每条边都可双向走 —— 无向图</text>
  <text x="258" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">橙色路径 = 答案：k=3 → k=2，共 2 次</text>

  <!-- 底部注释框：示例 2 -->
  <rect x="50" y="303" width="420" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">示例 2 pre=[1,3]：k=1 是空操作，k=3 只令 [1,0,2] ↔ [2,0,1] 互转，</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">可达状态全部搜完仍未遇到 [0,1,2] → BFS 返回 −1</text>
</svg>
