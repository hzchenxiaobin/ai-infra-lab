<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：回文由「左半 + 镜像」唯一决定，只数左半即可</text>

  <!-- ===== Case 1: even length 4 ===== -->
  <text x="44" y="76" font-size="12" fill="#888" font-weight="bold">长度 4（偶）</text>

  <!-- left half boxes -->
  <rect x="120" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- mirror boxes -->
  <rect x="228" y="56" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="272" y="56" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- bracket: left half -->
  <path d="M 120 96 L 120 104 L 208 104 L 208 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="164" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左半 = 2 位</text>

  <!-- mirror arrow -->
  <path d="M 208 70 Q 218 40 228 56" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="220" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">镜像翻转</text>

  <!-- bracket: mirror half -->
  <path d="M 228 96 L 228 104 L 316 104 L 316 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="272" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右半 = 左半整体翻转</text>

  <!-- formula even -->
  <text x="380" y="77" font-size="11" fill="#555">左半 12 → 回文 1221</text>

  <!-- ===== Case 2: odd length 3 ===== -->
  <text x="44" y="186" font-size="12" fill="#888" font-weight="bold">长度 3（奇）</text>

  <rect x="120" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="166" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="228" y="166" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- separator: middle shared -->
  <line x1="186" y1="158" x2="186" y2="206" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="186" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中点共用</text>

  <!-- bracket: left half (incl middle) -->
  <path d="M 120 206 L 120 214 L 208 214 L 208 206" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="164" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左半含中点 = 2 位</text>

  <path d="M 186 180 Q 210 150 228 180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">镜像（丢中点）</text>

  <path d="M 228 206 L 228 214 L 272 214 L 272 206" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="250" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右半 = 翻转去中点</text>

  <text x="380" y="187" font-size="11" fill="#555">左半 12 → 回文 121</text>

  <!-- ===== Summary box ===== -->
  <rect x="60" y="260" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">左半长度 = ⌈n/2⌉ = (n+1)//2 位</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#555">左半范围：10^(L-1) ~ 10^L − 1（首位必非 0，避免前导零）</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">回文总数 = 9 × 10^(L-1) 个</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 q 小 ⇔ 左半 = 10^(L-1) + (q − 1)</text>
</svg>
