  <text x="50"  y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="105" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">入窗</text>
  <text x="165" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">+n−right</text>
  <text x="220" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">累计</text>
  <text x="50"  y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="105" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">q</text>
  <text x="165" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+9</text>
  <text x="220" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="50"  y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="105" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i</text>
  <text x="165" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+7</text>
  <text x="220" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="50"  y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="105" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="165" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+6</text>
  <text x="220" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">22</text>
  <text x="50"  y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="105" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="165" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+5</text>
  <text x="220" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">27</text>
