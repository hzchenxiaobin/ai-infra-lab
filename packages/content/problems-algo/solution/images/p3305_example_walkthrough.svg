  <text x="455" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">q</text>

  <!-- 答案子串括线 -->
  <path d="M 50 100 L 50 108 L 229 108 L 229 100" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="121" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① [0..5] ieaouq</text>
  <path d="M 230 114 L 230 122 L 409 122 L 409 114" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
