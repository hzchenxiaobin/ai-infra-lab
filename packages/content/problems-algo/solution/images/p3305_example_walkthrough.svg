  <text x="137" y="180" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">atLeast(1)：元音齐 + 辅音 ≥ 1</text>
  <g filter="url(#rough2)">
    <rect x="25" y="188" width="225" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="0.8"/>
    <rect x="25" y="205" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="222" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="239" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="256" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="273" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="290" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="25" y="307" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
