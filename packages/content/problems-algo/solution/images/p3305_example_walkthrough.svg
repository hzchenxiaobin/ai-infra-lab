    <rect x="380" y="48" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="410" y="48" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="440" y="48" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="65"  y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="95"  y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <text x="125" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
