  <text x="105" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">o</text>
  <text x="165" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+4</text>
  <text x="220" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">31</text>
  <text x="50"  y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="105" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">u</text>
  <text x="165" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+3</text>
  <text x="220" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">34</text>
  <text x="50"  y="319" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="105" y="319" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="165" y="319" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="220" y="319" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">37</text>
  <text x="50"  y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="105" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">q</text>
  <text x="165" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+2</text>
  <text x="220" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">39</text>
  <text x="137" y="336" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合计 →</text>
  <text x="220" y="336" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">39</text>

  <!-- 右表 atLeast(2) -->
  <text x="382" y="180" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">atLeast(2)：元音齐 + 辅音 ≥ 2</text>
  <g filter="url(#rough2)">
    <rect x="270" y="188" width="225" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="0.8"/>
    <rect x="270" y="205" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="222" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="239" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="256" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="273" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="290" width="225" height="17" fill="#fafafa" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="307" width="225" height="17" fill="#ffffff" stroke="#bbb" stroke-width="0.5"/>
    <rect x="270" y="324" width="225" height="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="295" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="350" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">入窗</text>
  <text x="410" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">+n−right</text>
  <text x="465" y="200" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">累计</text>
  <text x="295" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="350" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">q</text>
  <text x="410" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+8</text>
  <text x="465" y="217" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="295" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="350" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i</text>
  <text x="410" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+7</text>
  <text x="465" y="234" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="295" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="350" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="410" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+6</text>
  <text x="465" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">21</text>
  <text x="295" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="350" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="410" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+5</text>
  <text x="465" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">26</text>
  <text x="295" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="350" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">o</text>
  <text x="410" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+4</text>
  <text x="465" y="285" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="295" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="350" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">u</text>
  <text x="410" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+3</text>
  <text x="465" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">33</text>
  <text x="295" y="319" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="350" y="319" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">q</text>
  <text x="410" y="319" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+2</text>
  <text x="465" y="319" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">35</text>
  <text x="295" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="350" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">q</text>
  <text x="410" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+1</text>
  <text x="465" y="336" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">36</text>
  <text x="382" y="336" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合计 →</text>
  <text x="465" y="336" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">36</text>

  <!-- 结论 -->
  <rect x="90" y="360" width="340" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = 39 − 36 = 3 ✓</text>
  <text x="260" y="404" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">right = 11 连续收缩两次：移出一个 q 后辅音数降为 1 仍 ≥ 1，</text>
  <text x="260" y="417" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">窗口继续合法，于是再计一次 +3（红色行）——shrink 的 while 语义</text>
</svg>
