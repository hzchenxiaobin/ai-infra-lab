    <rect x="170" y="48" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="48" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="230" y="48" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
