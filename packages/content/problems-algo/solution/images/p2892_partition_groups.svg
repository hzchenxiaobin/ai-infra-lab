<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最小长度 ⇔「每段乘积 ≤ k」的最少连续段划分</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 nums = [2,3,3,7,3,5]，k = 20 为例（无 0，无相邻 1）</text>

  <!-- nums row -->
  <text x="52" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">nums:</text>
  <rect x="80" y="88" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="88" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="88" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="248" y="88" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="304" y="88" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="88" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- group brackets -->
  <path d="M 80 150 L 80 138 L 244 138 L 244 150" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="168" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2×3×3 = 18 ≤ 20 ✓</text>
  <path d="M 248 150 L 248 138 L 300 138 L 300 150" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">单元素组 7</text>
  <path d="M 304 150 L 304 138 L 412 138 L 412 150" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="358" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3×5 = 15 ≤ 20 ✓</text>

  <!-- merge annotation + arrow -->
  <text x="480" y="196" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">段内从左到右合并：</text>
  <text x="480" y="214" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">中间乘积 ≤ 段乘积 ≤ k，全部合法</text>
  <line x1="246" y1="182" x2="246" y2="212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result row -->
  <rect x="150" y="218" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <rect x="240" y="218" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="330" y="218" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="362" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <text x="478" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 长度 3</text>

  <!-- formula box -->
  <rect x="70" y="272" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="294" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dp[i] = min{ dp[j−1] + 1 ：nums[j..i] 的乘积 ≤ k }</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">答案 = dp[n]（最少段数；单元素组恒可行，无需操作）</text>

  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">有 0 ⇒ 答案 1；预合并相邻 1 ⇒ 相邻对乘积 ≥ 2 ⇒ 段长 ≤ 2·log₂k + 1，回溯仅 O(log k) 步</text>
</svg>
