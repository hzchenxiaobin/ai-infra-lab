<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：water = "OOHHHH" → "HHOHHO"</text>

  <rect x="20" y="38" width="480" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
  <text x="90" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">线程</text>
  <text x="220" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">操作</text>
  <text x="350" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">h_sem</text>
  <text x="410" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">o_sem</text>
  <text x="470" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">输出</text>

  <line x1="65" y1="38" x2="65" y2="298" stroke="#ddd" stroke-width="1"/>
  <line x1="120" y1="38" x2="120" y2="298" stroke="#ddd" stroke-width="1"/>
  <line x1="320" y1="38" x2="320" y2="298" stroke="#ddd" stroke-width="1"/>
  <line x1="380" y1="38" x2="380" y2="298" stroke="#ddd" stroke-width="1"/>
  <line x1="440" y1="38" x2="440" y2="298" stroke="#ddd" stroke-width="1"/>

  <rect x="20" y="66" width="480" height="24" fill="#fce4ec" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="82" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="90" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O₁</text>
  <text x="220" y="82" text-anchor="middle" font-size="10" fill="#b85450">acquire(o_sem) → 阻塞</text>
  <text x="350" y="82" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="410" y="82" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="470" y="82" text-anchor="middle" font-size="10" fill="#888">""</text>

  <rect x="20" y="90" width="480" height="24" fill="#fce4ec" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="106" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="90" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O₂</text>
  <text x="220" y="106" text-anchor="middle" font-size="10" fill="#b85450">acquire(o_sem) → 阻塞</text>
  <text x="350" y="106" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="410" y="106" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="470" y="106" text-anchor="middle" font-size="10" fill="#888">""</text>

  <rect x="20" y="114" width="480" height="24" fill="#e8f0fe" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="130" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="90" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">H₁</text>
  <text x="220" y="130" text-anchor="middle" font-size="10" fill="#446688">acq(h)→"H"→rel(o)</text>
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="130" text-anchor="middle" font-size="10" fill="#333">"H"</text>

  <rect x="20" y="138" width="480" height="24" fill="#e8f0fe" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="154" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="90" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">H₂</text>
  <text x="220" y="154" text-anchor="middle" font-size="10" fill="#446688">acq(h)→"H"→rel(o)</text>
  <text x="350" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="410" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="470" y="154" text-anchor="middle" font-size="10" fill="#333">"HH"</text>

  <rect x="20" y="162" width="480" height="24" fill="#fce4ec" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="178" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="90" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O₁</text>
  <text x="220" y="178" text-anchor="middle" font-size="10" fill="#b85450">acq(o)×2→"O"→rel(h)×2</text>
  <text x="350" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="410" y="178" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="470" y="178" text-anchor="middle" font-size="10" fill="#333">"HHO"</text>

  <rect x="20" y="186" width="480" height="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="9" fill="#d6a040">▲ 第 1 个分子完成，第 2 个开始</text>

  <rect x="20" y="198" width="480" height="24" fill="#e8f0fe" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="214" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="90" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">H₃</text>
  <text x="220" y="214" text-anchor="middle" font-size="10" fill="#446688">acq(h)→"H"→rel(o)</text>
  <text x="350" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="410" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="214" text-anchor="middle" font-size="10" fill="#333">"HHOH"</text>

  <rect x="20" y="222" width="480" height="24" fill="#e8f0fe" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="238" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="90" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">H₄</text>
  <text x="220" y="238" text-anchor="middle" font-size="10" fill="#446688">acq(h)→"H"→rel(o)</text>
  <text x="350" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="410" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="470" y="238" text-anchor="middle" font-size="10" fill="#333">"HHOHH"</text>

  <rect x="20" y="246" width="480" height="24" fill="#fce4ec" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>
  <text x="45" y="262" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="90" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O₂</text>
  <text x="220" y="262" text-anchor="middle" font-size="10" fill="#b85450">acq(o)×2→"O"→rel(h)×2</text>
  <text x="350" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="470" y="262" text-anchor="middle" font-size="10" fill="#333">"HHOHHO"</text>

  <rect x="20" y="275" width="480" height="3" fill="#d6a040" filter="url(#rough2)"/>

  <rect x="60" y="295" width="400" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ O₁ 唤醒后第 2 个 acquire 仍阻塞，等 H₂ 的 release(o_sem)</text>

  <rect x="30" y="330" width="460" height="34" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#446688">关键：h_sem 从 2→0 限制了每轮只有 2 个 H 通过</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#666">O 线程 release(h_sem)×2 后下一轮 H 才能继续，保证不交错</text>

  <rect x="80" y="375" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#444">最终输出 "HHOHHO" ✓（HHO/OHH 均为合法解）</text>
</svg>
