<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：boxes=[[1,2],[3,3],[3,1],[3,1],[2,4]]</text>
  <text x="280" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">maxBoxes=3, maxWeight=6</text>

  <!-- Precomputed values -->
  <rect x="20" y="50" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="35" y="66" font-size="11" fill="#446688" filter="url(#rough2)">prefixW = [0, 2, 5, 6, 7, 11]</text>
  <text x="35" y="82" font-size="11" fill="#446688" filter="url(#rough2)">p = [0, 0, 1, 1, 1, 2]</text>
  <text x="260" y="74" font-size="11" fill="#b85450" filter="url(#rough2)">g[k] = dp[k−1] − p[k]</text>

  <!-- Table header -->
  <rect x="20" y="100" width="60" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="50" y="116" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">i</text>

  <rect x="84" y="100" width="90" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="129" y="116" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">有效 k 范围</text>

  <rect x="178" y="100" width="120" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="238" y="116" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">deque (g值)</text>

  <rect x="302" y="100" width="60" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="332" y="116" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">min g</text>

  <rect x="366" y="100" width="80" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="406" y="116" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">dp[i]</text>

  <rect x="450" y="100" width="90" height="24" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="495" y="116" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">g[i+1]</text>

  <!-- Row i=0 (init) -->
  <rect x="20" y="128" width="60" height="22" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
  <text x="50" y="143" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="84" y="128" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="129" y="143" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="178" y="128" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1](g=0)</text>
  <rect x="302" y="128" width="60" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="332" y="143" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="366" y="128" width="80" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="406" y="143" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="450" y="128" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="143" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- Row i=1 -->
  <rect x="20" y="154" width="60" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="50" y="169" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="84" y="154" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="129" y="169" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[1, 1]</text>
  <rect x="178" y="154" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1](g=0)</text>
  <rect x="302" y="154" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="332" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="366" y="154" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="450" y="154" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="169" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2−1=1</text>

  <!-- Row i=2 -->
  <rect x="20" y="180" width="60" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="50" y="195" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="84" y="180" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="129" y="195" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[1, 2]</text>
  <rect x="178" y="180" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1, 2](0,1)</text>
  <rect x="302" y="180" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="332" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="366" y="180" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="450" y="180" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="195" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3−1=2</text>

  <!-- Row i=3 -->
  <rect x="20" y="206" width="60" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="50" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="84" y="206" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="129" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[1, 3]</text>
  <rect x="178" y="206" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1, 2, 3](0,1,2)</text>
  <rect x="302" y="206" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="332" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="366" y="206" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="450" y="206" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3−1=2</text>

  <!-- Row i=4 (key: L jumps) -->
  <rect x="20" y="232" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="247" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="84" y="232" width="90" height="22" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <text x="129" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[2, 4] ←弹</text>
  <rect x="178" y="232" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[2, 4](1,2)</text>
  <rect x="302" y="232" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="332" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="366" y="232" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="450" y="232" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="247" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4−2=2</text>

  <!-- Row i=5 (final) -->
  <rect x="20" y="258" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="273" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="84" y="258" width="90" height="22" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <text x="129" y="273" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[3, 5] ←弹</text>
  <rect x="178" y="258" width="120" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="238" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[5](2)</text>
  <rect x="302" y="258" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="332" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="366" y="258" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="406" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <rect x="450" y="258" width="90" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/>
  <text x="495" y="273" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- Annotation for key steps -->
  <rect x="20" y="296" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="35" y="316" font-size="12" fill="#d6a040" filter="url(#rough2)">关键步骤解读：</text>

  <text x="35" y="336" font-size="11" fill="#555" filter="url(#rough2)">▶ i=4: prefixW[4]=7, 7−6=1, w_ptr 从 1 跳到 2</text>
  <text x="45" y="350" font-size="10" fill="#777" filter="url(#rough2)">L=max(1, 4−3+1=2, 2)=2 → 弹出 k=1（过期）</text>

  <text x="35" y="368" font-size="11" fill="#555" filter="url(#rough2)">▶ i=5: prefixW[5]=11, 11−6=5, w_ptr 从 2 跳到 3</text>
  <text x="45" y="382" font-size="10" fill="#777" filter="url(#rough2)">L=max(1, 5−3+1=3, 3)=3 → 弹出 k=2（过期），队首 k=5, g=2</text>

  <!-- Result -->
  <rect x="100" y="400" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">dp[5] = p[5] + 2 + g[5] = 2 + 2 + 2 = 6 ✓</text>
</svg>
