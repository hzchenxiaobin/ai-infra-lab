<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">金字塔转换矩阵：两个底块决定一个顶块</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每行比下行少一个块，居中堆叠；三角形模式 = 左底 + 右底 → 顶</text>

  <!-- ===== Left: Pyramid structure ===== -->
  <text x="40" y="72" font-size="11" fill="#446688" font-weight="bold">金字塔结构（示例 1）</text>

  <!-- Bottom row: B C D (y=210) -->
  <rect x="80" y="210" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="234" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">B</text>

  <rect x="128" y="210" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">C</text>

  <rect x="176" y="210" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="234" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">D</text>

  <!-- Middle row: C E (y=164) -->
  <rect x="104" y="164" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="188" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">C</text>

  <rect x="152" y="164" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="188" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">E</text>

  <!-- Top row: A (y=118) -->
  <rect x="128" y="118" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">A</text>

  <!-- Triangle dashed lines: left B+C→C -->
  <path d="M 102 210 L 126 164" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 150 210 L 126 164" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Triangle dashed lines: right C+D→E -->
  <path d="M 150 210 L 174 164" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 198 210 L 174 164" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Triangle dashed lines: top C+E→A -->
  <path d="M 126 164 L 150 118" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 174 164 L 150 118" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row labels -->
  <text x="45" y="232" font-size="9" fill="#888">底层</text>
  <text x="45" y="186" font-size="9" fill="#888">第2层</text>
  <text x="45" y="140" font-size="9" fill="#888">顶层</text>

  <!-- Pattern labels -->
  <text x="80" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">B+C→C</text>
  <text x="150" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">C+D→E</text>
  <text x="220" y="266" font-size="10" fill="#b85450" font-weight="bold">C+E→A</text>

  <!-- Triangle explanation box -->
  <rect x="30" y="286" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="304" font-size="10" fill="#d6a040" font-weight="bold">三角形模式 "XYZ"：</text>
  <text x="40" y="320" font-size="9" fill="#555">X = 左底块，Y = 右底块</text>
  <text x="40" y="334" font-size="9" fill="#555">Z = 可堆叠在 X、Y 之上的顶块</text>

  <!-- ===== Right: Allowed patterns & transition map ===== -->
  <text x="310" y="72" font-size="11" fill="#446688" font-weight="bold">allowed 列表 → 转换映射</text>

  <!-- Allowed patterns -->
  <rect x="300" y="82" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="328" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">BCC</text>

  <rect x="362" y="82" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">CDE</text>

  <rect x="300" y="114" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="328" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">CEA</text>

  <rect x="362" y="114" width="56" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="132" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">FFF</text>

  <!-- Arrow down -->
  <path d="M 350 150 L 350 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="160" font-size="9" fill="#888">建表</text>

  <!-- Transition map box -->
  <rect x="290" y="168" width="210" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="395" y="186" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">trans 转换映射</text>

  <text x="302" y="204" font-size="10" fill="#555">键 = (左底, 右底)</text>
  <text x="302" y="220" font-size="10" fill="#555">值 = [可放置的顶块列表]</text>

  <line x1="302" y1="228" x2="488" y2="228" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="302" y="244" font-size="10" fill="#446688">(B, C) → [C]</text>
  <text x="302" y="260" font-size="10" fill="#446688">(C, D) → [E]</text>
  <text x="302" y="276" font-size="10" fill="#4a7a3a">(C, E) → [A]</text>
  <text x="302" y="292" font-size="10" fill="#888">(F, F) → [F]</text>

  <!-- Key insight -->
  <rect x="290" y="310" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">同一对底块可有多个候选顶块</text>
  <text x="395" y="340" text-anchor="middle" font-size="9" fill="#888">→ 需要回溯枚举所有组合</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
</svg>
