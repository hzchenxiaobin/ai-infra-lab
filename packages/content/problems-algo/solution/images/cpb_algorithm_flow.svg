<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两趟贪心算法流程</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="62" rx="56" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输入 s, locked</text>
  <path d="M 280 80 L 280 98" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 奇偶判定 菱形 -->
  <polygon points="280,100 360,134 280,168 200,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">n 为奇数？</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">(总闸)</text>
  <!-- yes -> false -->
  <path d="M 360 134 L 430 134" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="392" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="118" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <!-- no -> 第一趟 -->
  <path d="M 280 168 L 280 188" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 第一趟框 -->
  <rect x="80" y="190" width="400" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一趟：i = 0 → n−1（可改位当 ‘(’）</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333">locked[i]==‘0’ 或 s[i]==‘(’ → balance++；否则 balance−−</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">balance &lt; 0 ？ → return false</text>
  <path d="M 280 264 L 280 282" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二趟框 -->
  <rect x="80" y="284" width="400" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第二趟：i = n−1 → 0（可改位当 ‘)’）</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333">locked[i]==‘0’ 或 s[i]==‘)’ → balance++；否则 balance−−</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">balance &lt; 0 ？ → return false</text>
  <path d="M 280 358 L 280 376" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <ellipse cx="280" cy="398" rx="64" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#888" font-style="italic">两趟写法对称：仅「可改位乐观取值」由 ‘(’ 换成 ‘)’、方向反转</text>
</svg>
