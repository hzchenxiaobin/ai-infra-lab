<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="860" height="580" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最短的桥：算法流程图</text>
  <path d="M 290 40 Q 430 46 570 40" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- Phase labels on left -->
  <g filter="url(#sk)">
    <rect x="30" y="70" width="22" height="180" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="41" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#335577" transform="rotate(-90 41 165)">阶段 1 · DFS 定位</text>
  </g>
  <g filter="url(#sk)">
    <rect x="30" y="270" width="22" height="280" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="41" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" transform="rotate(-90 41 410)">阶段 2 · BFS 扩展</text>
  </g>

  <!-- ===== Phase 1: DFS ===== -->
  <!-- Step 1: find first 1 -->
  <g filter="url(#sk)">
    <rect x="80" y="70" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#335577" filter="url(#sk)">遍历网格，找首个 grid[i][j] == 1</text>
  <path d="M 200 110 L 200 130" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: DFS -->
  <g filter="url(#sk)">
    <rect x="80" y="130" width="240" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#335577" filter="url(#sk)">DFS 标记岛 A 全部格子为 2</text>
  <text x="200" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">同时把每个格子加入 queue</text>
  <path d="M 200 180 L 200 200" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: init step -->
  <g filter="url(#sk)">
    <rect x="80" y="200" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="223" text-anchor="middle" font-size="12" fill="#335577" filter="url(#sk)">step = 0</text>
  <path d="M 200 236 L 200 268" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Phase 2: BFS ===== -->
  <!-- Decision: queue empty? -->
  <g filter="url(#sk)">
    <polygon points="200,268 320,308 200,348 80,308" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="200" y="304" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">queue 为空?</text>
  <text x="200" y="320" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">(且未找到岛 B)</text>

  <!-- Yes: error (shouldn't happen, exactly 2 islands) -->
  <path d="M 80 308 L 50 308 L 50 460" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="300" font-size="10" fill="#888" filter="url(#sk)">是</text>

  <!-- No: continue -->
  <path d="M 200 348 L 200 370" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="362" font-size="10" fill="#888" filter="url(#sk)">否</text>

  <!-- size = len(queue) -->
  <g filter="url(#sk)">
    <rect x="80" y="370" width="240" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="200" y="393" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">size = len(queue)  （当前层）</text>
  <path d="M 200 406 L 200 426" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- for each cell in layer -->
  <g filter="url(#sk)">
    <rect x="80" y="426" width="240" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="200" y="449" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">弹出 cell (i, j)，遍历 4 邻居</text>
  <path d="M 200 462 L 200 484" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision: neighbor == 1? -->
  <g filter="url(#sk)">
    <polygon points="200,484 320,514 200,544 80,514" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="200" y="511" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">邻居 == 1?</text>
  <text x="200" y="527" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">(岛 B)</text>

  <!-- Yes: return step -->
  <path d="M 320 514 L 460 514" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="330" y="506" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="460" y="492" width="170" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 step</text>
  <text x="545" y="530" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">= 最短桥长度</text>

  <!-- No: check == 0? -->
  <path d="M 200 544 L 200 558 L 380 558 L 380 514 L 460 514" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="556" font-size="10" fill="#888" filter="url(#sk)">否</text>

  <!-- Right side: neighbor == 0? decision -->
  <g filter="url(#sk)">
    <polygon points="545,430 660,460 545,490 430,460" fill="#fff3e0" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="545" y="457" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#sk)">邻居 == 0?</text>
  <text x="545" y="473" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#sk)">(水)</text>

  <!-- Yes: mark and push -->
  <path d="M 660 460 L 740 460 L 740 449 L 740 449" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="675" y="452" font-size="10" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="680" y="476" width="150" height="56" rx="6" fill="#fff3e0" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="755" y="498" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#sk)">标记为 2（已访问）</text>
  <text x="755" y="516" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#sk)">加入 queue</text>

  <!-- No: skip (visited or out of bounds) -->
  <path d="M 545 490 L 545 540" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="555" y="516" font-size="9" fill="#aaa" filter="url(#sk)">否(跳过)</text>

  <!-- Loop back: after layer done, step++ and back to queue empty check -->
  <!-- from size box area, after processing all cells in layer -->
  <path d="M 380 558 L 380 570 L 370 570" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="392" y="568" font-size="9" fill="#888" filter="url(#sk)">本层处理完</text>

  <!-- step++ then loop back -->
  <g filter="url(#sk)">
    <rect x="560" y="370" width="140" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="630" y="393" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">step++</text>
  <!-- Arrow from step++ back up to queue empty check -->
  <path d="M 630 370 L 630 308 L 320 308" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="640" y="340" font-size="10" fill="#b85450" filter="url(#sk)">回到判断</text>

  <!-- Arrow from mark&push to step++ (indirect: after layer) -->
  <path d="M 755 476 L 755 388 L 700 388" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Notes box ===== -->
  <g filter="url(#sk)">
    <rect x="460" y="70" width="380" height="150" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="650" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键细节</text>
  <g font-size="10.5" fill="#444">
    <text x="478" y="118" filter="url(#sk)">· DFS 只标记<tspan font-weight="bold" fill="#446688">第一个</tspan>岛，第二个岛保持 1</text>
    <text x="478" y="138" filter="url(#sk)">· 标记为 2 兼做 visited，无需额外数组</text>
    <text x="478" y="158" filter="url(#sk)">· <tspan font-weight="bold" fill="#b85450">step</tspan> = 已完全扩展的水层数</text>
    <text x="478" y="178" filter="url(#sk)">  处理 step 层时发现岛 B → 桥 = step</text>
    <text x="478" y="198" filter="url(#sk)">· 找到首个 1 后 <tspan font-weight="bold">break</tspan> 出双重循环</text>
    <text x="478" y="214" filter="url(#sk)">· 题目保证恰有两个岛，故一定能找到</text>
  </g>
</svg>
