<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：自连接物化共听对 → 反连接排除好友 → 分组计数 ≥ 3</text>

  <!-- ===== Listens l1 (left) ===== -->
  <text x="40" y="54" font-size="10" fill="#888">Listens l1（左表）</text>
  <rect x="30" y="60" width="150" height="170" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="9" fill="#446688" font-weight="bold">user  song  day</text>
  <line x1="30" y1="82" x2="180" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="98" font-size="9" fill="#446688">1     10   3/15</text>
  <text x="40" y="114" font-size="9" fill="#446688">1     11   3/15</text>
  <text x="40" y="130" font-size="9" fill="#446688">1     12   3/15</text>
  <text x="40" y="146" font-size="9" fill="#446688">3     10   3/15</text>
  <text x="40" y="162" font-size="9" fill="#446688">3     11   3/15</text>
  <text x="40" y="178" font-size="9" fill="#446688">3     12   3/15</text>
  <text x="40" y="200" font-size="8" fill="#888">... 共 15 行</text>

  <!-- ===== Listens l2 (right) ===== -->
  <text x="410" y="54" font-size="10" fill="#888">Listens l2（右表）</text>
  <rect x="400" y="60" width="160" height="170" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="76" font-size="9" fill="#446688" font-weight="bold">user  song  day</text>
  <line x1="400" y1="82" x2="560" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="410" y="98" font-size="9" fill="#446688">3     10   3/15</text>
  <text x="410" y="114" font-size="9" fill="#446688">3     11   3/15</text>
  <text x="410" y="130" font-size="9" fill="#446688">3     12   3/15</text>
  <text x="410" y="146" font-size="9" fill="#446688">1     10   3/15</text>
  <text x="410" y="162" font-size="9" fill="#446688">1     11   3/15</text>
  <text x="410" y="178" font-size="9" fill="#446688">1     12   3/15</text>
  <text x="410" y="200" font-size="8" fill="#888">... 共 15 行</text>

  <!-- ===== Self-join arrows ===== -->
  <path d="M 180 92 C 280 92, 300 92, 400 92" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 108 C 280 108, 300 108, 400 108" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 124 C 280 124, 300 124, 400 124" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>

  <rect x="210" y="42" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">JOIN ON day, song_id</text>

  <text x="290" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">AND l1.user_id != l2.user_id</text>

  <!-- ===== FriendshipBoth CTE (top right corner) ===== -->
  <rect x="400" y="250" width="180" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="268" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">CTE: FriendshipBoth</text>
  <text x="410" y="284" font-size="9" fill="#888">SELECT u1,u2 FROM F</text>
  <text x="410" y="298" font-size="9" fill="#888">UNION</text>
  <text x="410" y="312" font-size="9" fill="#888">SELECT u2,u1 FROM F</text>
  <text x="410" y="326" font-size="8" fill="#d6a040">(1,2)+(2,1) 双向对称化</text>

  <!-- ===== Self-join result arrow down ===== -->
  <path d="M 105 232 L 105 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== NOT EXISTS box ===== -->
  <rect x="20" y="260" width="180" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE NOT EXISTS</text>
  <text x="110" y="296" text-anchor="middle" font-size="9" fill="#b85450">排除已是好友的</text>
  <text x="110" y="310" text-anchor="middle" font-size="8" fill="#888">(1,2) 被删除</text>

  <!-- Arrow from FriendshipBoth to NOT EXISTS -->
  <path d="M 400 290 C 340 290, 280 290, 200 290" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7" stroke-dasharray="4,3"/>
  <text x="300" y="284" text-anchor="middle" font-size="8" fill="#d6a040">反连接</text>

  <!-- Arrow to GROUP BY -->
  <path d="M 110 322 L 110 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== GROUP BY + HAVING box ===== -->
  <rect x="20" y="350" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="370" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">GROUP BY day, user_x, user_y</text>
  <text x="145" y="386" text-anchor="middle" font-size="9" fill="#446688">HAVING COUNT(DISTINCT song) ≥ 3</text>
  <text x="145" y="400" text-anchor="middle" font-size="8" fill="#888">同日共听 3+ 首不同歌</text>

  <!-- Arrow to result -->
  <path d="M 270 378 L 330 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result table ===== -->
  <rect x="334" y="350" width="140" height="76" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="404" y="368" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">user  recommended</text>
  <line x1="334" y1="374" x2="474" y2="374" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="344" y="388" font-size="9" fill="#446688">1     3</text>
  <text x="344" y="402" font-size="9" fill="#446688">2     3</text>
  <text x="344" y="416" font-size="9" fill="#446688">3     1</text>
  <text x="344" y="430" font-size="8" fill="#888" >... DISTINCT 去重</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="420" width="560" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="441" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">自连接天然双向 → UNION 对称化好友 → NOT EXISTS 行级过滤 → HAVING 组级过滤 → DISTINCT 去重</text>

</svg>
