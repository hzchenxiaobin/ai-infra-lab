    <rect x="180" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="191" y="73" text-anchor="middle" font-size="11" fill="#333">6</text>
    <rect x="206" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="217" y="73" text-anchor="middle" font-size="11" fill="#333">7</text>
    <rect x="232" y="58" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="232" y1="58" x2="254" y2="80" stroke="#b85450" stroke-width="1.2"/><text x="243" y="73" text-anchor="middle" font-size="11" fill="#b85450">8</text>
