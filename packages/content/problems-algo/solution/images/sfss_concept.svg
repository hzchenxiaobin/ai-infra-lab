    <rect x="76" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="87" y="101" text-anchor="middle" font-size="11" fill="#333">17</text>
    <rect x="102" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="102" y1="86" x2="124" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="113" y="101" text-anchor="middle" font-size="11" fill="#b85450">18</text>
    <rect x="128" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="139" y="101" text-anchor="middle" font-size="11" fill="#333">19</text>
    <rect x="154" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="154" y1="86" x2="176" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="165" y="101" text-anchor="middle" font-size="11" fill="#b85450">20</text>
    <rect x="180" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="191" y="101" text-anchor="middle" font-size="11" fill="#333">21</text>
    <rect x="206" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="217" y="101" text-anchor="middle" font-size="11" fill="#333">22</text>
    <rect x="232" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="243" y="101" text-anchor="middle" font-size="11" fill="#333">23</text>
    <rect x="258" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="258" y1="86" x2="280" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="269" y="101" text-anchor="middle" font-size="11" fill="#b85450">24</text>
    <rect x="284" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="284" y1="86" x2="306" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="295" y="101" text-anchor="middle" font-size="11" fill="#b85450">25</text>
    <rect x="310" y="86" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="101" text-anchor="middle" font-size="11" fill="#333">26</text>
    <rect x="336" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="336" y1="86" x2="358" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="347" y="101" text-anchor="middle" font-size="11" fill="#b85450">27</text>
    <rect x="362" y="86" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="362" y1="86" x2="384" y2="108" stroke="#b85450" stroke-width="1.2"/><text x="373" y="101" text-anchor="middle" font-size="11" fill="#b85450">28</text>
