  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="462" y="58" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="484" y="70" font-size="10.5" fill="#4a7a3a">1 = 无质数</text>
    <rect x="462" y="80" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="484" y="92" font-size="10.5" fill="#446688">平方自由·可用</text>
    <rect x="462" y="102" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <line x1="462" y1="102" x2="478" y2="118" stroke="#b85450" stroke-width="1.2"/>
    <text x="484" y="114" font-size="10.5" fill="#b85450">含 p²·淘汰</text>
  </g>

  <!-- 10 primes strip -->
  <text x="20" y="138" font-size="11" fill="#888">10 个质数</text>
  <g filter="url(#rough2)">
    <rect x="110" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="127" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
