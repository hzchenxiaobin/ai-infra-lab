<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：平方自由值 → 10 位质数掩码</text>

  <!-- 1..30 grid: 2 rows x 15 cols, cell 22x22 step 26, start x=50 -->
  <text x="20" y="72" font-size="11" fill="#888">1..30</text>

  <!-- ROW 0: values 1..15 -->
  <g filter="url(#rough2)">
    <rect x="50" y="58" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/><text x="61" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="76" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="87" y="73" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="102" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="113" y="73" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="128" y="58" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><line x1="128" y1="58" x2="150" y2="80" stroke="#b85450" stroke-width="1.2"/><text x="139" y="73" text-anchor="middle" font-size="11" fill="#b85450">4</text>
