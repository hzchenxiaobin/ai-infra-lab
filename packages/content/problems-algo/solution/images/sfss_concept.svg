    <rect x="290" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="307" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="326" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="343" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="362" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="379" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="398" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="415" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="434" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="451" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  </g>
  <text x="478" y="241" font-size="10.5" fill="#4a7a3a">掩码 = 0b111</text>

  <!-- equivalence box -->
  <rect x="30" y="270" width="500" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">子集乘积无平方因子  ⇔  各元素质数掩码两两不相交</text>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔  每步并入新值时  s &amp; m = 0</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#444">转移：ndp[s | m] += dp[s]（仅当 s &amp; m = 0）</text>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a">值 1 的掩码 = 0，与任何状态不相交，可自由挂载</text>
</svg>
