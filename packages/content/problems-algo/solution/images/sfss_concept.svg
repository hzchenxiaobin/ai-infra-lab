    <rect x="362" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="373" y="73" text-anchor="middle" font-size="11" fill="#333">13</text>
    <rect x="388" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="399" y="73" text-anchor="middle" font-size="11" fill="#333">14</text>
    <rect x="414" y="58" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="425" y="73" text-anchor="middle" font-size="11" fill="#333">15</text>
  </g>

