    <rect x="182" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="199" y="144" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="218" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="235" y="144" text-anchor="middle" font-size="11" fill="#333">7</text>
    <rect x="254" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="271" y="144" text-anchor="middle" font-size="10" fill="#333">11</text>
    <rect x="290" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="307" y="144" text-anchor="middle" font-size="10" fill="#333">13</text>
    <rect x="326" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="343" y="144" text-anchor="middle" font-size="10" fill="#333">17</text>
    <rect x="362" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="379" y="144" text-anchor="middle" font-size="10" fill="#333">19</text>
    <rect x="398" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="415" y="144" text-anchor="middle" font-size="10" fill="#333">23</text>
    <rect x="434" y="128" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="451" y="144" text-anchor="middle" font-size="10" fill="#333">29</text>
  </g>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="127" y="164">位0</text><text x="163" y="164">位1</text><text x="199" y="164">位2</text>
    <text x="235" y="164">位3</text><text x="271" y="164">位4</text><text x="307" y="164">位5</text>
    <text x="343" y="164">位6</text><text x="379" y="164">位7</text><text x="415" y="164">位8</text><text x="451" y="164">位9</text>
  </g>

  <!-- example mask: 6 = 2×3 -->
  <text x="20" y="200" font-size="11" fill="#888">6 = 2×3</text>
  <g filter="url(#rough2)">
    <rect x="110" y="190" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="127" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="146" y="190" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="163" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="182" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="199" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="218" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="235" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="254" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="271" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="290" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="307" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="326" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="343" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="362" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="379" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="398" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="415" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
    <rect x="434" y="190" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="451" y="205" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  </g>
  <text x="478" y="205" font-size="10.5" fill="#4a7a3a">掩码 = 0b11</text>

  <!-- example mask: 30 = 2×3×5 -->
  <text x="20" y="236" font-size="11" fill="#888">30 = 2×3×5</text>
  <g filter="url(#rough2)">
    <rect x="110" y="226" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="127" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="146" y="226" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="163" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="182" y="226" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="199" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="218" y="226" width="34" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/><text x="235" y="241" text-anchor="middle" font-size="10" fill="#aaa">0</text>
