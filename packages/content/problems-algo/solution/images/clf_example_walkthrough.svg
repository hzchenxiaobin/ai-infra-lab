<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：深度计数器逐步追踪</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="54" font-size="11" fill="#888" font-weight="bold">示例 1：logs = ["d1/","d2/","../","d21/","./"]</text>

  <!-- initial depth=0 -->
  <circle cx="40" cy="86" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="40" y="112" text-anchor="middle" font-size="9" fill="#888">初始</text>

  <!-- arrows between -->
  <path d="M 54 86 L 92 86" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 86 L 180 86" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 86 L 268 86" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 326 86 L 356 86" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 86 L 444 86" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- op boxes + depth circles: d1/ d2/ ../ d21/ ./ -->
  <!-- op1: d1/ -->
  <rect x="92" y="72" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1/</text>
  <circle cx="121" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- op2: d2/ -->
  <rect x="180" y="72" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d2/</text>
  <circle cx="209" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- op3: ../ -->
  <rect x="268" y="72" width="58" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">../</text>
  <circle cx="297" cy="124" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- op4: d21/ -->
  <rect x="356" y="72" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d21/</text>
  <circle cx="385" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- op5: ./ -->
  <rect x="444" y="72" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">./</text>
  <circle cx="473" cy="124" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- answer for example 1 -->
  <path d="M 488 124 L 520 124" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="520" y="110" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="537" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="537" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a">答案</text>

  <!-- depth label -->
  <text x="30" y="128" font-size="9" fill="#888">depth</text>

  <!-- legend row -->
  <rect x="92" y="150" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="110" y="159" font-size="9" fill="#666">进入子目录</text>
  <rect x="180" y="150" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="198" y="159" font-size="9" fill="#666">回退父目录</text>
  <rect x="268" y="150" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="286" y="159" font-size="9" fill="#666">原地停留</text>

  <!-- Divider -->
  <line x1="30" y1="180" x2="530" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="30" y="204" font-size="11" fill="#888" font-weight="bold">示例 3：logs = ["d1/","../","../","../"]（验证 max 下界保护）</text>

  <!-- initial depth=0 -->
  <circle cx="40" cy="236" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="40" y="262" text-anchor="middle" font-size="9" fill="#888">初始</text>

  <!-- arrows -->
  <path d="M 54 236 L 100 236" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 162 236 L 208 236" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 236 L 316 236" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 378 236 L 424 236" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- op1: d1/ -->
  <rect x="100" y="222" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1/</text>
  <circle cx="131" cy="274" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- op2: ../ -> 0 -->
  <rect x="208" y="222" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">../</text>
  <circle cx="239" cy="274" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- op3: ../ -> 0 (capped!) -->
  <rect x="316" y="222" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">../</text>
  <circle cx="347" cy="274" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="347" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="347" y="298" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">已到底 ⚠</text>

  <!-- op4: ../ -> 0 (capped!) -->
  <rect x="424" y="222" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">../</text>
  <circle cx="455" cy="274" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="455" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="455" y="298" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">已到底 ⚠</text>

  <!-- answer for example 3 -->
  <path d="M 470 274 L 512 274" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="512" y="260" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="529" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- depth label -->
  <text x="30" y="278" font-size="9" fill="#888">depth</text>

  <!-- Note -->
  <rect x="60" y="318" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">⚠️ depth = 0 时再遇 "../" 不变负</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">max(0, depth−1) 保证下界为 0，对应「已在主文件夹则继续停留」</text>

  <!-- Bottom summary -->
  <rect x="60" y="374" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终 depth 值即为返回主文件夹所需的 "../" 次数</text>
</svg>
