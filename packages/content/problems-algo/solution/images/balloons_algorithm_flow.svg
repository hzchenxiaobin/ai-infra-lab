<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：统计 5 字母频率 → 整除需求 → 取最小值</text>

  <!-- Step 0: label -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">第一步：遍历 text 统计频率</text>

  <!-- Start -->
  <ellipse cx="270" cy="72" rx="110" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="12" fill="#333">count[b/a/l/o/n] = 0</text>

  <path d="M 270 90 L 270 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop: for each char -->
  <polygon points="270,106 400,140 270,174 140,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="12" fill="#333">text 中还有</text>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#666">字符 ch ?</text>

  <!-- No -> right to end loop -->
  <path d="M 400 140 L 440 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="132" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Yes -> down -->
  <path d="M 270 174 L 270 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="186" font-size="11" fill="#82b366">是</text>

  <!-- Count box -->
  <rect x="110" y="192" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#333">若 ch ∈ {b,a,l,o,n}：count[ch] ++</text>

  <!-- loop back to diamond -->
  <path d="M 110 207 L 80 207 L 80 140 L 140 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="175" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 175)">下一字符</text>

  <!-- Step 2: label -->
  <text x="40" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">第二步：整除需求 + 取最小值</text>

  <path d="M 440 140 L 440 248 L 430 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Division box -->
  <rect x="60" y="252" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min(</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#444">count[b]÷1, count[a]÷1, count[l]÷2, count[o]÷2, count[n]÷1</text>
  <text x="465" y="272" font-size="12" fill="#333" font-weight="bold">)</text>

  <path d="M 270 310 L 270 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottleneck highlight -->
  <rect x="120" y="328" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">瓶颈字母决定答案（最短缺的那个）</text>

  <path d="M 270 360 L 270 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="270" cy="396" rx="80" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- summary -->
  <text x="270" y="440" text-anchor="middle" font-size="10" fill="#888">时间 O(n)（一次遍历统计）+ O(1) 整除取最小；空间 O(1)（5 个计数器）</text>
</svg>
