<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求 max − min − 2k 与 0 取大</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">开始: 输入 nums, k</text>

  <path d="M 260 76 L 260 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: find max -->
  <rect x="130" y="100" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mx = max(nums)</text>
  <text x="260" y="133" text-anchor="middle" font-size="10" fill="#b85450">遍历一次求最大值</text>

  <path d="M 260 140 L 260 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: find min -->
  <rect x="130" y="164" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mn = min(nums)</text>
  <text x="260" y="197" text-anchor="middle" font-size="10" fill="#446688">遍历一次求最小值</text>

  <path d="M 260 204 L 260 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: mx - mn > 2k ? -->
  <polygon points="260,228 380,262 260,296 140,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#333">mx − mn &gt; 2k ?</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#666">(间距能否完全消除)</text>

  <!-- No -> answer 0 -->
  <path d="M 380 262 L 424 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="254" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="424" y="244" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 0</text>
  <text x="460" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a">可调到同值</text>

  <!-- Yes -> compute diff -->
  <path d="M 260 296 L 260 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="312" font-size="11" fill="#82b366">是</text>

  <rect x="110" y="318" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">diff = mx − mn − 2k</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return diff</text>

  <!-- summary note -->
  <rect x="60" y="380" width="400" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#888">等价写法：return max(0, mx − mn − 2k)，一次遍历 → O(n)</text>
</svg>
