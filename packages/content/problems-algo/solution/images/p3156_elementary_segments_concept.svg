<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：事件点切时间轴，初等区间上覆盖数恒定</text>

  <text x="260" y="43" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">员工 1001：4 个任务 → 8 个事件点 → 7 段初等区间（段内数字 = 覆盖数）</text>

  <!-- 事件点竖虚线 -->
  <path d="M 70 46 L 70 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 97 46 L 97 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 124 46 L 124 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 205 46 L 205 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 232 46 L 232 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 286 46 L 286 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 340 46 L 340 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 475 46 L 475 178" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4,3" opacity="0.75" filter="url(#rough2)"/>

  <!-- 任务条（甘特图） -->
  <rect x="70" y="52" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="97" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任务1</text>

  <rect x="97" y="82" width="108" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="98" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任务2</text>

  <rect x="232" y="112" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="259" y="128" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任务3</text>

  <rect x="340" y="142" width="135" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="407" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任务7</text>

  <!-- 时间轴 -->
  <path d="M 62 182 L 486 182" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="70" y="196" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">08:00</text>
  <text x="97" y="208" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">08:30</text>
  <text x="124" y="196" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">09:00</text>
  <text x="205" y="208" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">10:30</text>
  <text x="232" y="196" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">11:00</text>
  <text x="286" y="208" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">12:00</text>
  <text x="340" y="196" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">13:00</text>
  <text x="475" y="208" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">15:30</text>

  <!-- 初等区间条：覆盖数 -->
  <rect x="70" y="218" width="27" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="83" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="97" y="218" width="27" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="237" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="124" y="218" width="81" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="205" y="218" width="27" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="218" y="237" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <rect x="232" y="218" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="259" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="286" y="218" width="54" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="313" y="237" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <rect x="340" y="218" width="135" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="407" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 段长标注 -->
  <text x="83" y="262" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">30分</text>
  <text x="110" y="274" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">30分</text>
  <text x="164" y="262" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">90分</text>
  <text x="218" y="274" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">空档</text>
  <text x="259" y="262" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">60分</text>
  <text x="313" y="274" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">空档</text>
  <text x="407" y="262" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">150分</text>

  <!-- 引理 -->
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">任务端点都是事件点 ⇒ 没有边界落在段内 ⇒ 每段覆盖数恒定</text>

  <!-- 结论框：并集时长 -->
  <rect x="24" y="298" width="232" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并集时长（重叠只算一次）</text>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">30+30+90+60+150 = 360 分 = 6 小时</text>
  <text x="140" y="350" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">只累加覆盖数 ≥ 1 的段，空档自动出局</text>

  <!-- 结论框：最大并发 -->
  <rect x="272" y="298" width="232" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="388" y="318" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大并发任务数</text>
  <text x="388" y="336" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">max{1, 2, 1, 0, 1, 0, 1} = 2</text>
  <text x="388" y="350" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">08:30–09:00 两层任务重叠</text>
</svg>
