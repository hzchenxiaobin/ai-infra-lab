<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：取反 + tails 二分贪心（求 LNDS = LNIS）</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">tails[k] = 长度 k+1 的非递减子序列的最小结尾（取反后）；相等可接续 ⇒ upper_bound</text>

  <!-- 循环虚线框 -->
  <rect x="95" y="56" width="390" height="322" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">对 nums 中每个元素 x 循环</text>

  <!-- N3: 取反 -->
  <rect x="170" y="92" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">v = −x（非递增 → 非递减）</text>
  <path d="M 290 126 L 290 150" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N4: 二分 -->
  <rect x="120" y="152" width="340" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="173" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i = upper_bound(tails, v)：找第一个 &gt; v</text>
  <path d="M 290 186 L 290 212" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: 判断 -->
  <polygon points="290,212 408,262 290,312 172,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="258" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">i == len(tails)</text>
  <text x="290" y="274" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">（没有 &gt; v 的结尾？）</text>

  <path d="M 172 262 L 122 262" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 408 262 L 458 262" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- B1: append -->
  <rect x="24" y="242" width="98" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="73" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tails.append(v)</text>
  <text x="73" y="273" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">所有结尾 ≤ v，新开一堆</text>

  <!-- B2: replace -->
  <rect x="458" y="242" width="98" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="507" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">tails[i] = v</text>
  <text x="507" y="273" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">给该长度换更小结尾</text>

  <!-- 汇合 -->
  <path d="M 73 282 L 73 330" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 507 282 L 507 330" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 73 330 L 507 330" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290" cy="330" r="4" fill="#666" filter="url(#rough2)"/>
  <path d="M 290 334 L 290 424" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="372" font-size="10" fill="#888" filter="url(#rough2)">元素取完</text>

  <!-- END -->
  <rect x="140" y="426" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="444" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 len(tails) = LNIS 长度</text>
  <text x="290" y="460" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（非递增 ⇔ 取反后非递减）= 答案</text>
</svg>
