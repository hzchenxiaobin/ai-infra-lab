<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">dfs(node) 流程：归并孩子 → 判定 → 纳入自身</text>

  <!-- 1. 判空菱形 -->
  <polygon points="170,46 250,72 170,98 90,72" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">node == null ?</text>
  <line x1="250" y1="72" x2="316" y2="72" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="66" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="320" y="56" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return []</text>

  <line x1="170" y1="98" x2="170" y2="118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="114" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 2. 递归孩子 -->
  <rect x="60" y="120" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="142" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L = dfs(left); R = dfs(right)</text>
  <line x1="170" y1="154" x2="170" y2="170" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 归并取前k小 -->
  <rect x="40" y="172" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">desc = mergeKeepK(L, R, k)  // 后代最小 k 个</text>
  <line x1="170" y1="206" x2="170" y2="220" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 判定菱形 -->
  <polygon points="170,222 300,256 170,290 40,256" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="250" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">len(desc)==k 且</text>
  <text x="170" y="264" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">node.val &gt; desc[-1] ?</text>
  <line x1="300" y1="256" x2="362" y2="256" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="366" y="240" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="414" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans += 1</text>

  <line x1="170" y1="290" x2="170" y2="306" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 纳入自身 -->
  <rect x="40" y="308" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="330" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">desc = mergeKeepK(desc, [node.val], k)</text>

  <line x1="300" y1="325" x2="362" y2="325" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="366" y="308" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="414" y="330" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">return desc</text>
</svg>
