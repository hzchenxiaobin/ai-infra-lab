<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，维护 prev / zeros，遇异号端点更新 ans</text>

  <!-- 初始框 -->
  <rect x="180" y="34" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333">初始化 prev=0, zeros=0, ans=0</text>

  <path d="M 270 72 L 270 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：i < n ? -->
  <polygon points="270,90 376,114 270,138 164,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 164 114 L 110 114" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="138" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="96" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="65" y="112" text-anchor="middle" font-size="11" fill="#333">遍历结束</text>
  <text x="65" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- 是 ↓ -->
  <path d="M 270 138 L 270 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 判定2：forts[i] == 0 ? -->
  <polygon points="270,156 358,182 270,208 182,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">forts[i] == 0 ?</text>

  <!-- 是 → zeros++ -->
  <path d="M 182 182 L 110 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="168" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="187" text-anchor="middle" font-size="12" fill="#333">zeros++</text>

  <!-- 否 ↓ -->
  <path d="M 270 208 L 270 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="220" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 处理框：异号则更新 -->
  <rect x="120" y="228" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#333">若 prev≠0 且 prev≠x：ans = max(ans, zeros)</text>
  <text x="270" y="268" text-anchor="middle" font-size="11.5" fill="#333">prev = x；zeros = 0</text>

  <path d="M 270 278 L 270 294" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="232" y="296" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333">i = i + 1</text>

  <!-- zeros++ 支路汇入 i++ -->
  <path d="M 70 196 L 70 311 L 232 311" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 回环 → 判定1 -->
  <path d="M 308 311 L 470 311 L 470 114 L 376 114" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="304" font-size="10.5" fill="#888">回到 i&lt;n?</text>

  <rect x="40" y="338" width="460" height="20" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#888">一次遍历 O(n)，O(1) 空间：只在遇到非零端点时结算中间的 0</text>
</svg>
