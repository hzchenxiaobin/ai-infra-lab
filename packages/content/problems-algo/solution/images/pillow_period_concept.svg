<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrDn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：往返一次为周期，位置随时间呈三角波（以 n=4 为例）</text>

  <!-- 坐标轴 -->
  <path d="M 90 70 L 90 282" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 282 L 524 282" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="530" y="286" font-size="11" fill="#888">t</text>
  <text x="84" y="66" text-anchor="end" font-size="11" fill="#888">pos</text>

  <!-- 横向辅助线 pos 1..4：pos1->270 pos2->210 pos3->150 pos4->90 -->
  <path d="M 90 90 L 516 90" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 150 L 516 150" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 210 L 516 210" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 270 L 516 270" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" fill="none" filter="url(#rough2)"/>

  <!-- y轴标签 + 圆 -->
  <circle cx="74" cy="270" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="274" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <circle cx="74" cy="210" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <circle cx="74" cy="150" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <circle cx="74" cy="90" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n</text>

  <!-- x轴刻度 0,3,6,9,12 -> x=90 + t*35.5  (90,196,303,409,516) -->
  <!-- 三角波顶点 n=4, T=6: (90,270)(196,90)(303,270)(409,90)(516,270) -->
  <path d="M 90 270 L 196 90 L 303 270 L 409 90 L 516 270" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- 顶点圆 -->
  <circle cx="90" cy="270" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="196" cy="90" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="303" cy="270" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="409" cy="90" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="516" cy="270" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- x轴刻度标签 -->
  <text x="90" y="298" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="196" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n−1</text>
  <text x="303" y="298" text-anchor="middle" font-size="10" fill="#888">2(n−1)</text>
  <text x="409" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3(n−1)</text>
  <text x="516" y="298" text-anchor="middle" font-size="10" fill="#888">4(n−1)</text>

  <!-- 周期括号 1: 90..303 -->
  <path d="M 90 314 L 90 320 L 303 320 L 303 314" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="196" y="336" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">周期 T = 2(n−1)</text>

  <!-- 周期括号 2: 303..516 -->
  <path d="M 303 314 L 303 320 L 516 320 L 516 314" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="409" y="336" text-anchor="middle" font-size="10" fill="#888">重复</text>

  <!-- 上升沿 / 下降沿标注 -->
  <path d="M 130 240 L 175 130" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="120" y="170" font-size="10" fill="#4a7a3a" font-weight="bold">正向 n−1 步</text>

  <path d="M 215 130 L 290 240" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <text x="252" y="170" font-size="10" fill="#b85450" font-weight="bold">反向 n−1 步</text>

  <!-- 公式框 -->
  <rect x="300" y="350" width="216" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)" opacity="0.85"/>
  <text x="408" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">pos = n − |(time mod T) − (n−1)|</text>

  <text x="96" y="365" font-size="10" fill="#888">峰值在 t = n−1 处取到 n，周期后回到 1</text>
</svg>
