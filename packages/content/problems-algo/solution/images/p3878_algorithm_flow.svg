<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单调栈圈领地，按位游标圈禁区，交集数贡献</text>

  <ellipse cx="200" cy="44" rx="32" ry="13.5" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="48" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 200 58 L 200 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="42" y="72" width="336" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 单调栈：left[i] = 上一个 ≥ ，right[i] = 下一个 ＞</text>

  <text x="392" y="90" font-size="8.5" fill="#a0433f" filter="url(#rough2)">⚠️ 相等归最左</text>

  <path d="M 210 100 L 210 112" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="42" y="114" width="336" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="132" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 按位游标：badL[i] / badR[i] = 禁位最近出现位置</text>

  <text x="392" y="132" font-size="8.5" fill="#555" filter="url(#rough2)">O(30n)，30 = 位长</text>

  <path d="M 210 142 L 210 154" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="42" y="154" width="344" height="100" rx="12" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="210" y="168" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对每个下标 i = 0 … n−1</text>

  <rect x="52" y="176" width="220" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="192" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ L = max(left, badL) + 1</text>
  <text x="162" y="208" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">R = min(right, badR) − 1</text>

  <text x="290" y="192" font-size="9" fill="#555" filter="url(#rough2)">领地 ∩ 禁区外</text>
  <text x="290" y="206" font-size="8.5" fill="#888" filter="url(#rough2)">越界的禁区自动被覆盖</text>

  <path d="M 162 218 L 162 226" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="228" width="220" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="245" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ ans += (i−L+1) × (R−i+1)</text>

  <text x="290" y="245" font-size="9" fill="#555" filter="url(#rough2)">左端点 × 右端点 种取法</text>

  <path d="M 52 241 H 42 Q 36 241 36 231 V 187 Q 36 177 46 177 H 50" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="211" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">i+1</text>

  <path d="M 210 254 L 210 264" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="268" width="210" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="286" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return ans（64 位整数）</text>

  <text x="330" y="286" font-size="9" fill="#a0433f" filter="url(#rough2)">ans ≤ n(n+1)/2 ≈ 5×10⁹</text>

  <rect x="16" y="310" width="158" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="325" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">好 ⟺ OR = max ⟺ 位被罩住</text>

  <rect x="186" y="310" width="160" height="22" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="325" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例1 [4,2,3] → 4</text>

  <rect x="358" y="310" width="146" height="22" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="431" y="325" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例2 [1,3,1] → 6</text>

  <text x="260" y="348" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">按位游标：last[b] / nxt[b] —— 位 b 最近一次出现的下标</text>
</svg>
