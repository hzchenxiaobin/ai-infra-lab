<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：n=4, edges 含重边 (1,2)×2</text>

  <!-- Left: graph -->
  <text x="120" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">图</text>
  <!-- nodes: 1(60,110) 2(180,110) 3(60,200) 4(180,200) -->
  <line x1="68" y1="106" x2="172" y2="106" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="68" y1="116" x2="172" y2="116" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="60" y1="118" x2="60" y2="192" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="180" y1="118" x2="180" y2="192" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="68" y1="115" x2="172" y2="195" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="68" y1="195" x2="172" y2="115" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="60" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="180" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="60" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="180" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- Degree table (right of graph) -->
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">度数表</text>
  <rect x="270" y="68" width="110" height="150" rx="4" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="270" y1="92" x2="380" y2="92" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="86" font-size="12" fill="#333" filter="url(#rough2)">节点</text>
  <text x="355" y="86" font-size="12" fill="#333" filter="url(#rough2)">deg</text>
  <text x="285" y="110" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="355" y="110" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="285" y="132" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="355" y="132" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="285" y="154" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="355" y="154" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="285" y="176" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="355" y="176" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Pairs table -->
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">点对 cnt</text>
  <rect x="400" y="68" width="150" height="150" rx="4" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="400" y1="92" x2="550" y2="92" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="86" font-size="12" fill="#333" filter="url(#rough2)">(a,b)</text>
  <text x="500" y="86" font-size="12" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="415" y="110" font-size="12" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="500" y="110" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="415" y="132" font-size="12" fill="#333" filter="url(#rough2)">(1,3)</text>
  <text x="500" y="132" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="415" y="154" font-size="12" fill="#333" filter="url(#rough2)">(1,4)</text>
  <text x="500" y="154" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="415" y="176" font-size="12" fill="#333" filter="url(#rough2)">(2,3)</text>
  <text x="500" y="176" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="415" y="198" font-size="12" fill="#333" filter="url(#rough2)">(2,4)</text>
  <text x="500" y="198" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- Bottom: query answers -->
  <rect x="60" y="250" width="490" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">查询结果（cnt &gt; q 的点对数）</text>

  <!-- q=2 -->
  <text x="90" y="312" font-size="13" fill="#446688" filter="url(#rough2)">q=2：</text>
  <text x="140" y="312" font-size="13" fill="#333" filter="url(#rough2)">6 个点对 cnt 全 &gt; 2 → answer=6</text>
  <!-- q=3 -->
  <text x="90" y="342" font-size="13" fill="#446688" filter="url(#rough2)">q=3：</text>
  <text x="140" y="342" font-size="13" fill="#333" filter="url(#rough2)">除 (3,4) cnt=3 不 &gt; 3，其余 5 个 → answer=5</text>
  <!-- correction note -->
  <text x="90" y="378" font-size="12" fill="#b85450" filter="url(#rough2)">重边修正：(1,2) 的 s=7, c=2；q=2 时 s−c=5&gt;2 不修正，q=3 时 5&gt;3 不修正</text>
  <text x="90" y="398" font-size="12" fill="#b85450" filter="url(#rough2)">（本例 c 较小无需修正；当 q 落在 [s−c, s) 区间时才 total−−）</text>
</svg>
