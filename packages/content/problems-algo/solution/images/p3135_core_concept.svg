<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：保住一段公共子串「核」，两端删光再补齐</text>

  <!-- ===== general model: initial row ===== -->
  <text x="142" y="72" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">initial</text>
  <rect x="150" y="52" width="78" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="189" y="73" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弃 i 个</text>
  <rect x="228" y="52" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留核 L</text>
  <rect x="332" y="52" width="78" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="73" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">弃 m−L−i</text>

  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两端删除共 m − L 次 —— 只看保留长度 L，与核的位置无关</text>

  <!-- dashed core alignment -->
  <line x1="228" y1="84" x2="228" y2="130" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="332" y1="84" x2="332" y2="130" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== general model: target row ===== -->
  <text x="142" y="150" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">target</text>
  <rect x="150" y="130" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="189" y="151" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">补 k 个</text>
  <rect x="228" y="130" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">同一段核 L</text>
  <rect x="332" y="130" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="151" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">补 n−L−k</text>

  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两端补齐共 n − L 次 —— 同样与对齐位置无关</text>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">总操作 = (m − L) + (n − L) = m + n − 2L，L 越大越好</text>

  <!-- ===== example ===== -->
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：initial = "abcde" → target = "cdef"，核 = "cde"（L = 3）</text>

  <!-- initial cells -->
  <text x="142" y="264" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">initial</text>
  <rect x="150" y="246" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="267" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="186" y="246" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="267" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">b</text>
  <rect x="222" y="246" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <rect x="258" y="246" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">d</text>
  <rect x="294" y="246" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">e</text>
  <text x="340" y="264" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 删 a、删 b（2 次）</text>

  <!-- dashed alignment between cores -->
  <line x1="240" y1="278" x2="240" y2="298" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="276" y1="278" x2="276" y2="298" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="312" y1="278" x2="312" y2="298" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- target cells -->
  <text x="142" y="318" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">target</text>
  <rect x="150" y="300" width="72" height="32" fill="none" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="186" y="321" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（k = 0）</text>
  <rect x="222" y="300" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <rect x="258" y="300" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">d</text>
  <rect x="294" y="300" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">e</text>
  <rect x="330" y="300" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="321" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">f</text>
  <text x="376" y="318" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">← 补 f（1 次）</text>

  <!-- formula -->
  <rect x="135" y="342" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = m + n − 2L = 5 + 4 − 2×3 = 3</text>
</svg>
