<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：水域连通块的鱼数之和 = 一次出发能捞到的鱼</text>

  <!-- Legend -->
  <rect x="370" y="44" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="54" font-size="10" fill="#555" filter="url(#rough2)">水域(鱼)</text>
  <rect x="440" y="44" width="16" height="12" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="462" y="54" font-size="10" fill="#555" filter="url(#rough2)">陆地(0)</text>

  <!-- column headers -->
  <text x="80" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">c0</text>
  <text x="120" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">c1</text>
  <text x="160" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">c2</text>
  <text x="200" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">c3</text>

  <!-- Row labels -->
  <text x="48" y="98" text-anchor="end" font-size="9" fill="#bbb" filter="url(#rough2)">r0</text>
  <text x="48" y="138" text-anchor="end" font-size="9" fill="#bbb" filter="url(#rough2)">r1</text>
  <text x="48" y="178" text-anchor="end" font-size="9" fill="#bbb" filter="url(#rough2)">r2</text>
  <text x="48" y="218" text-anchor="end" font-size="9" fill="#bbb" filter="url(#rough2)">r3</text>

  <!-- Grid 4x4, cell 36x36 -->
  <!-- r0: 0 2 1 0  -> comp A(2,1) green, land grey -->
  <rect x="62" y="80" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="102" y="80" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="142" y="80" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="160" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="182" y="80" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- r1: 4 0 0 3  -> comp B(4) blue at c0, comp C(3) orange at c3 -->
  <rect x="62" y="120" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="144" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="102" y="120" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="142" y="120" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="182" y="120" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- r2: 1 0 0 4 -> comp B(1) blue, comp C(4) orange -->
  <rect x="62" y="160" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="184" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="102" y="160" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="142" y="160" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="182" y="160" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="184" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- r3: 0 3 2 0 -> comp D(3,2) red/pink -->
  <rect x="62" y="200" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="224" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="102" y="200" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="142" y="200" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="182" y="200" width="36" height="36" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="224" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- component sum boxes on the right -->
  <text x="260" y="92" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">块A: 2+1 = 3</text>
  <text x="260" y="134" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">块B: 4+1 = 5</text>
  <text x="260" y="176" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">块C: 3+4 = 7 ⭐</text>
  <text x="260" y="218" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">块D: 3+2 = 5</text>

  <!-- arrow to max -->
  <path d="M 350 170 Q 400 170 422 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="410" y="250" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="268" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">取最大</text>
  <text x="475" y="286" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max = 7</text>

  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同色块 = 同一连通块；陆地 0 把水域隔成 4 块，各块鱼数之和 3/5/7/5，取最大 7</text>
</svg>
