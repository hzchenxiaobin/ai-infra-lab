<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 566"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="566" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：高位到低位逐位试填，能保住就保住</text>

  <!-- 输入 -->
  <g filter="url(#rough2)">
    <rect x="195" y="34" width="170" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="55" text-anchor="middle" font-size="12" fill="#8a6d1a">输入 nums, k, m；res = 0</text>
  </g>
  <path d="M 280 66 L 280 86" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <g filter="url(#rough2)">
    <rect x="110" y="90" width="280" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="110" text-anchor="middle" font-size="12.5" fill="#33506b">循环：b = 30 → 0（答案 &lt; 2³¹）</text>
  </g>
  <path d="M 280 122 L 280 142" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 试填 -->
  <g filter="url(#rough2)">
    <rect x="150" y="146" width="260" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="166" text-anchor="middle" font-size="12" fill="#8a6d1a">cand = res | (1 ≪ b) —— 试填第 b 位</text>
  </g>
  <path d="M 280 178 L 280 198" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 代价计算 -->
  <g filter="url(#rough2)">
    <rect x="80" y="202" width="400" height="86" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#33506b">对每个 x = nums[i] 计算 cost(x, cand)：</text>
    <text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#33506b">missing = cand &amp; ~x；为 0 ⇒ cost = 0</text>
    <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#33506b">否则 h = 最高缺失位：v = (x≫(h+1)≪(h+1)) | 2ʰ | (cand&amp;2ʰ−1)</text>
    <text x="280" y="276" text-anchor="middle" font-size="11.5" fill="#33506b">cost = v − x</text>
  </g>
  <path d="M 280 288 L 280 308" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 选 m 求和 -->
  <g filter="url(#rough2)">
    <rect x="140" y="312" width="280" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="332" text-anchor="middle" font-size="12" fill="#8a6d1a">代价升序，取最小 m 个之和 sum</text>
  </g>
  <path d="M 280 344 L 280 364" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <polygon points="280,364 378,402 280,440 182,402" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="407" text-anchor="middle" font-size="12.5" fill="#33506b">sum ≤ k ？</text>
  </g>

  <!-- 是 → 保留 -->
  <path d="M 378 402 L 396 402" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="393" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="402" y="386" width="146" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="475" y="401" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">res ← cand</text>
    <text x="475" y="415" text-anchor="middle" font-size="10.5" fill="#2f5d24">（第 b 位保住）</text>
  </g>

  <!-- 否 → 下一位 -->
  <path d="M 280 440 L 280 462" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="457" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 汇合：下一位 -->
  <g filter="url(#rough2)">
    <rect x="185" y="466" width="190" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="482" text-anchor="middle" font-size="12" fill="#8a3a36">下一位 b − 1</text>
    <text x="280" y="497" text-anchor="middle" font-size="10.5" fill="#8a3a36">（保不住的位记 0）</text>
  </g>
  <path d="M 475 420 L 475 485 L 383 485" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回边 -->
  <path d="M 185 485 L 55 485 L 55 106 L 104 106" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="300" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 46 300)" filter="url(#rough2)">b ≥ 0 继续</text>

  <!-- 出口 -->
  <path d="M 280 504 L 280 524" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="520" font-size="10.5" fill="#888" filter="url(#rough2)">b &lt; 0：31 位试完</text>
  <g filter="url(#rough2)">
    <rect x="200" y="528" width="160" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="549" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 res</text>
  </g>

  <!-- 贪心底气注记 -->
  <g font-size="10.5" fill="#666" filter="url(#rough2)">
    <text x="432" y="76" fill="#33506b" font-weight="bold">为什么能保就保？</text>
    <text x="432" y="93">一个 2ᵇ 的权重抵得过</text>
    <text x="432" y="109">更低位全部之和，且可行</text>
    <text x="432" y="125">性单调 ⟹ 归纳可得</text>
    <text x="432" y="141">res ≡ OPT（见 5.2）</text>
  </g>
</svg>
