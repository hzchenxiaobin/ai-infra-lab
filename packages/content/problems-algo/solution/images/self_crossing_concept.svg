<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">螺旋路径的三种自交模式</text>

  <!-- ============ Case 1: line i crosses line i-3 ============ -->
  <rect x="12" y="44" width="536" height="130" fill="none" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="24" y="64" font-size="12" fill="#b85450" font-weight="bold">Case 1: line i 穿过 line i−3</text>

  <!-- spiral: origin (95,155), scale 20. d=[2,1,1,2] -->
  <!-- N: (95,155)->(95,115) -->
  <line x1="95" y1="155" x2="95" y2="118" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (95,115)->(75,115) -->
  <line x1="93" y1="117" x2="78" y2="117" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- S: (75,115)->(75,135) -->
  <line x1="77" y1="119" x2="77" y2="133" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- E: (75,135)->(115,135) crosses N at (95,135) -->
  <line x1="79" y1="137" x2="113" y2="137" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- vertex labels -->
  <text x="100" y="150" font-size="8.5" fill="#888">0</text>
  <text x="100" y="113" font-size="8.5" fill="#888">1</text>
  <text x="66" y="113" font-size="8.5" fill="#888">2</text>
  <text x="66" y="143" font-size="8.5" fill="#888">3</text>
  <text x="118" y="143" font-size="8.5" fill="#888">4</text>

  <!-- crossing point -->
  <circle cx="95" cy="137" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="104" y="133" font-size="9" fill="#b85450" font-weight="bold">✗</text>

  <!-- dist labels -->
  <text x="104" y="140" font-size="8" fill="#446688">d0=2</text>
  <text x="72" y="110" font-size="8" fill="#446688">d1=1</text>
  <text x="56" y="130" font-size="8" fill="#446688">d2=1</text>
  <text x="86" y="148" font-size="8" fill="#b85450">d3=2</text>

  <!-- condition box -->
  <rect x="210" y="72" width="330" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="222" y="92" font-size="11" fill="#333" font-weight="bold">d = [2, 1, 1, 2],   i = 3</text>
  <text x="222" y="112" font-size="11" fill="#b85450">d[i] ≥ d[i−2]:   2 ≥ 1   ✓</text>
  <text x="222" y="130" font-size="11" fill="#b85450">d[i−1] ≤ d[i−3]:   1 ≤ 2   ✓</text>
  <text x="222" y="146" font-size="9.5" fill="#888">line 3 (E) 穿越 line 0 (N)</text>

  <!-- ============ Case 2: line i touches line i-4 ============ -->
  <rect x="12" y="182" width="536" height="130" fill="none" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="24" y="202" font-size="12" fill="#d6a040" font-weight="bold">Case 2: line i 端点触碰 line i−4</text>

  <!-- spiral: origin (95,295), scale 20. d=[1,1,2,1,1] -->
  <!-- N: (95,295)->(95,275) -->
  <line x1="95" y1="295" x2="95" y2="278" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (95,275)->(75,275) -->
  <line x1="93" y1="277" x2="78" y2="277" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- S: (75,275)->(75,315) -->
  <line x1="77" y1="279" x2="77" y2="313" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- E: (75,315)->(95,315) -->
  <line x1="79" y1="317" x2="93" y2="317" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- N: (95,315)->(95,295) touches origin -->
  <line x1="95" y1="315" x2="95" y2="298" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="100" y="290" font-size="8.5" fill="#888">0</text>
  <text x="100" y="273" font-size="8.5" fill="#888">1</text>
  <text x="66" y="273" font-size="8.5" fill="#888">2</text>
  <text x="66" y="323" font-size="8.5" fill="#888">3</text>
  <text x="100" y="323" font-size="8.5" fill="#888">4</text>

  <!-- touch point -->
  <circle cx="95" cy="295" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="104" y="292" font-size="9" fill="#d6a040" font-weight="bold">●</text>

  <text x="104" y="287" font-size="8" fill="#446688">d0=1</text>
  <text x="72" y="270" font-size="8" fill="#446688">d1=1</text>
  <text x="56" y="300" font-size="8" fill="#446688">d2=2</text>
  <text x="82" y="328" font-size="8" fill="#446688">d3=1</text>
  <text x="104" y="310" font-size="8" fill="#d6a040">d4=1</text>

  <rect x="210" y="210" width="330" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="222" y="230" font-size="11" fill="#333" font-weight="bold">d = [1, 1, 2, 1, 1],   i = 4</text>
  <text x="222" y="250" font-size="11" fill="#d6a040">d[i−1] == d[i−3]:   1 == 1   ✓</text>
  <text x="222" y="268" font-size="11" fill="#d6a040">d[i]+d[i−4] ≥ d[i−2]:   1+1 ≥ 2   ✓</text>
  <text x="222" y="284" font-size="9.5" fill="#888">line 4 (N) 端点落在 line 0 (N) 上</text>

  <!-- ============ Case 3: line i crosses line i-5 ============ -->
  <rect x="12" y="320" width="536" height="145" fill="none" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="24" y="340" font-size="12" fill="#4a7a3a" font-weight="bold">Case 3: line i 穿过 line i−5（螺旋内折）</text>

  <!-- spiral: origin (95,435), scale 15. d=[3,2,4,3,1,2] -->
  <!-- N: (95,435)->(95,390) -->
  <line x1="95" y1="435" x2="95" y2="393" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (95,390)->(65,390) -->
  <line x1="93" y1="392" x2="68" y2="392" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- S: (65,390)->(65,450) -->
  <line x1="67" y1="394" x2="67" y2="448" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- E: (65,450)->(110,450) -->
  <line x1="69" y1="452" x2="108" y2="452" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- N: (110,450)->(110,435) -->
  <line x1="110" y1="450" x2="110" y2="438" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (110,435)->(80,435) crosses N at (95,435) -->
  <line x1="108" y1="437" x2="83" y2="437" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="100" y="432" font-size="8" fill="#888">0</text>
  <text x="100" y="388" font-size="8" fill="#888">1</text>
  <text x="56" y="388" font-size="8" fill="#888">2</text>
  <text x="56" y="458" font-size="8" fill="#888">3</text>
  <text x="115" y="458" font-size="8" fill="#888">4</text>
  <text x="115" y="432" font-size="8" fill="#888">5</text>
  <text x="72" y="432" font-size="8" fill="#888">6</text>

  <!-- crossing point -->
  <circle cx="95" cy="437" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="104" y="433" font-size="9" fill="#4a7a3a" font-weight="bold">✗</text>

  <text x="104" y="417" font-size="7.5" fill="#446688">d0=3</text>
  <text x="68" y="385" font-size="7.5" fill="#446688">d1=2</text>
  <text x="46" y="425" font-size="7.5" fill="#446688">d2=4</text>
  <text x="78" y="463" font-size="7.5" fill="#446688">d3=3</text>
  <text x="118" y="448" font-size="7.5" fill="#446688">d4=1</text>
  <text x="98" y="428" font-size="7.5" fill="#4a7a3a">d5=2</text>

  <rect x="210" y="348" width="330" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="222" y="368" font-size="11" fill="#333" font-weight="bold">d = [3, 2, 4, 3, 1, 2],   i = 5</text>
  <text x="222" y="386" font-size="10" fill="#4a7a3a">d[i−2] ≥ d[i−4]:   3 ≥ 2   ✓</text>
  <text x="222" y="401" font-size="10" fill="#4a7a3a">d[i−1] ≤ d[i−3]:   1 ≤ 4   ✓</text>
  <text x="222" y="416" font-size="10" fill="#4a7a3a">d[i−1]+d[i−5] ≥ d[i−3]:   1+3 ≥ 4   ✓</text>
  <text x="222" y="431" font-size="10" fill="#4a7a3a">d[i]+d[i−4] ≥ d[i−2]:   2+2 ≥ 3   ✓</text>
  <text x="222" y="445" font-size="9.5" fill="#888">line 5 (W) 穿越内层 line 0 (N)</text>
</svg>
