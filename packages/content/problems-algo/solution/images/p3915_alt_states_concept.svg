<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：峰 / 谷两态 ＋ 值域两棵 max 线段树</text>

  <!-- 顶部：交替序列示例 3<5>2<4 -->
  <text x="20" y="40" font-size="9.5" fill="#667" filter="url(#rough2)">示例 2 的交替子序列：</text>

  <rect x="76" y="44" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="172" y="44" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="268" y="44" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="364" y="44" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M128,60 L166,60" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#667" filter="url(#rough2)">＜</text>
  <path d="M224,60 L262,60" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#667" filter="url(#rough2)">＞</text>
  <path d="M320,60 L358,60" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="339" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#667" filter="url(#rough2)">＜</text>

  <text x="100" y="98" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">起步·双态</text>
  <text x="196" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">峰 · A 态</text>
  <text x="292" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">谷 · B 态</text>
  <text x="388" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">峰 · A 态</text>

  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">「严格交替」＝ 峰谷相间；单元素可作双态起步（怎么接都行）</text>

  <text x="260" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">转移只依赖上一个选中值 ⟹ 按值建两棵 max 树（当前 x＝4）</text>

  <!-- 行标签 -->
  <text x="20" y="182" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">A[v] 峰态</text>
  <text x="20" y="196" font-size="8.5" fill="#667" filter="url(#rough2)">下一步须 ↓</text>
  <text x="20" y="264" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B[v] 谷态</text>
  <text x="20" y="278" font-size="8.5" fill="#667" filter="url(#rough2)">下一步须 ↑</text>

  <!-- A 树格子：值 2,3,4,5 -->
  <rect x="170" y="172" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="235" y="172" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="172" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="365" y="172" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- B 树格子：值 2,3,4,5 -->
  <rect x="170" y="254" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="235" y="254" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="254" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="365" y="254" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- 两条交叉转移箭头 -->
  <path d="M263,252 C 280,232 302,216 322,206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="230" text-anchor="end" font-size="9.5" fill="#d6a040" filter="url(#rough2)">v＜x 的谷 ⟹ 升成峰</text>
  <path d="M393,204 C 378,224 352,240 326,250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="238" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">v＞x 的峰 ⟹ 降成谷</text>

  <!-- 图例 -->
  <rect x="428" y="174" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="183" font-size="8.5" fill="#555" filter="url(#rough2)">bestB 查 v＜x</text>
  <rect x="428" y="192" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="201" font-size="8.5" fill="#555" filter="url(#rough2)">bestA 查 v＞x</text>
  <rect x="428" y="210" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="219" font-size="8.5" fill="#555" filter="url(#rough2)">x 的落点</text>

  <!-- 底部要点框 -->
  <rect x="48" y="304" width="424" height="44" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">newA＝max(x, bestB＋x)，newB＝max(x, bestA＋x)；单元素起步 A[x]＝B[x]＝x</text>
  <text x="260" y="339" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">距离 ≥ k：i 的更新延迟 k 步入树，树上永远只有 j ≤ i−k 的状态</text>
</svg>
