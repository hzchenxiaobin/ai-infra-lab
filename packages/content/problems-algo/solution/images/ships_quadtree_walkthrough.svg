<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：矩形 [0,0]-[4,4]，3 艘船</text>

  <!-- Level 0: Root -->
  <rect x="210" y="36" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[0,0]-[4,4] ✓</text>

  <!-- Connecting lines to Level 1 -->
  <path d="M 280 68 L 280 75 L 80 75 L 80 88" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 280 75 L 200 75 L 200 88" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 280 75 L 360 75 L 360 88" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 280 75 L 480 75 L 480 88" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Level 1: 4 children -->
  <!-- Q2: pruned -->
  <rect x="20" y="90" width="120" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="9" fill="#999">Q2 [0,3]-[2,4]</text>
  <text x="80" y="119" text-anchor="middle" font-size="9" fill="#999">✗ return 0</text>

  <!-- Q1: explore -->
  <rect x="140" y="90" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="9" fill="#333">Q1 [3,3]-[4,4]</text>
  <text x="200" y="119" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ hasShips</text>

  <!-- Q3: explore -->
  <rect x="300" y="90" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="9" fill="#333">Q3 [0,0]-[2,2]</text>
  <text x="360" y="119" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ hasShips</text>

  <!-- Q4: pruned -->
  <rect x="420" y="90" width="120" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="106" text-anchor="middle" font-size="9" fill="#999">Q4 [3,0]-[4,2]</text>
  <text x="480" y="119" text-anchor="middle" font-size="9" fill="#999">✗ return 0</text>

  <!-- Lines from Q1 to its children -->
  <path d="M 200 126 L 200 140 L 170 140 L 170 155" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 140 L 230 140 L 230 155" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Lines from Q3 to its children -->
  <path d="M 360 126 L 360 140 L 310 140 L 310 155" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 360 140 L 370 140 L 370 155" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 360 140 L 430 140 L 430 155" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Level 2: Q1's children -->
  <!-- Ship at (3,3) -->
  <rect x="125" y="157" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <circle cx="145" cy="175" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="170" y="173" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[3,3] 🚢</text>
  <text x="170" y="186" text-anchor="middle" font-size="9" fill="#b85450">return 1</text>

  <!-- Q1 other children pruned -->
  <rect x="195" y="157" width="70" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="173" text-anchor="middle" font-size="8" fill="#999">其余3格</text>
  <text x="230" y="186" text-anchor="middle" font-size="9" fill="#999">✗ 0</text>

  <!-- Level 2: Q3's children -->
  <!-- Ship at (2,2) -->
  <rect x="265" y="157" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <circle cx="285" cy="175" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="310" y="173" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[2,2] 🚢</text>
  <text x="310" y="186" text-anchor="middle" font-size="9" fill="#b85450">return 1</text>

  <!-- [0,0]-[1,1] explore -->
  <rect x="325" y="157" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="173" text-anchor="middle" font-size="9" fill="#333">[0,0]-[1,1]</text>
  <text x="370" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ hasShips</text>

  <!-- Q3 other children pruned -->
  <rect x="395" y="157" width="70" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="173" text-anchor="middle" font-size="8" fill="#999">其余2格</text>
  <text x="430" y="186" text-anchor="middle" font-size="9" fill="#999">✗ 0</text>

  <!-- Line from [0,0]-[1,1] to its children -->
  <path d="M 370 193 L 370 207 L 350 207 L 350 222" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 370 207 L 410 207 L 410 222" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Level 3: [0,0]-[1,1]'s children -->
  <!-- Ship at (1,1) -->
  <rect x="305" y="224" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <circle cx="325" cy="242" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="350" y="240" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[1,1] 🚢</text>
  <text x="350" y="253" text-anchor="middle" font-size="9" fill="#b85450">return 1</text>

  <!-- Other children pruned -->
  <rect x="375" y="224" width="70" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="8" fill="#999">其余3格</text>
  <text x="410" y="253" text-anchor="middle" font-size="9" fill="#999">✗ 0</text>

  <!-- Result box -->
  <rect x="120" y="300" width="320" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">汇总：0 (Q2) + 1 (Q1) + 2 (Q3) + 0 (Q4)</text>
  <text x="280" y="342" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">= 3 艘船</text>
  <text x="280" y="360" text-anchor="middle" font-size="9" fill="#888">hasShips 调用：约 10 次（远低于 400 上限）</text>

  <!-- Legend -->
  <rect x="30" y="392" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="403" font-size="9" fill="#555">有船·递归</text>
  <rect x="130" y="392" width="14" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="150" y="403" font-size="9" fill="#555">无船·剪枝</text>
  <rect x="230" y="392" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="250" y="403" font-size="9" fill="#555">单点·找到船</text>
</svg>
