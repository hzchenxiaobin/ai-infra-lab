<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：34₆ 各位和 = 9，10₁₀ 各位和 = 1</text>

  <!-- ===== Example 1: n=34, k=6 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">用例一：n = 34, k = 6</text>

  <!-- table header -->
  <rect x="40" y="70" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="70" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n（进入时）</text>
  <rect x="220" y="70" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n % 6</text>
  <rect x="310" y="70" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">累加 sum</text>
  <rect x="410" y="70" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n /= 6 后</text>

  <!-- row 1: 34 -> %6=4, sum=4, /6=5 -->
  <rect x="40" y="94" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="94" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="11" fill="#333">34</text>
  <rect x="220" y="94" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="310" y="94" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="410" y="94" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row 2: 5 -> %6=5, sum=9, /6=0 -->
  <rect x="40" y="118" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="118" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="220" y="118" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="134" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="310" y="118" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <rect x="410" y="118" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 3 stop -->
  <rect x="40" y="142" width="490" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="285" y="156" text-anchor="middle" font-size="10.5" fill="#888">轮次 3: n=0 → 停止</text>

  <!-- result 1 -->
  <path d="M 360 166 L 360 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="180" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">sum = 9 ✓ （34 = 5×6+4 → "54"，5+4=9）</text>

  <!-- ===== Example 2: n=10, k=10 ===== -->
  <text x="40" y="240" font-size="12" fill="#446688" font-weight="bold">用例二：n = 10, k = 10</text>

  <!-- table header -->
  <rect x="40" y="248" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="248" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n（进入时）</text>
  <rect x="220" y="248" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n % 10</text>
  <rect x="310" y="248" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">累加 sum</text>
  <rect x="410" y="248" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n /= 10 后</text>

  <!-- row 1: 10 -> %10=0, sum=0, /10=1 -->
  <rect x="40" y="272" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="288" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="272" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="220" y="272" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="288" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="310" y="272" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="410" y="272" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2: 1 -> %10=1, sum=1, /10=0 -->
  <rect x="40" y="296" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="312" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="296" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="312" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="296" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="265" y="312" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="310" y="296" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="410" y="296" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="312" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 3 stop -->
  <rect x="40" y="320" width="490" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="285" y="334" text-anchor="middle" font-size="10.5" fill="#888">轮次 3: n=0 → 停止</text>

  <!-- result 2 -->
  <path d="M 360 344 L 360 356" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="358" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">sum = 1 ✓ （10 = "10"，1+0=1）</text>

  <!-- summary note -->
  <rect x="40" y="400" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="418" text-anchor="middle" font-size="10.5" fill="#888">余数 0 也要累加（它是一位合法数码）；最终 sum 即 base-k 各位数字之和</text>
</svg>
