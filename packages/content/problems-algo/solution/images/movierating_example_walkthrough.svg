<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>

  <text x="380" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两段聚合排序各取 Top-1 → Daniel / Frozen 2</text>

  <!-- ===================== Part 1 ===================== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">① 第 1 问：每用户评论数 → ORDER BY cnt DESC, name ASC → LIMIT 1</text>

  <!-- cnt table -->
  <!-- header -->
  <rect x="50" y="70" width="95" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="97" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">name</text>
  <rect x="145" y="70" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cnt</text>

  <!-- row Daniel (tie highlight) -->
  <rect x="50" y="92" width="95" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="97" y="108" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Daniel</text>
  <rect x="145" y="92" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="172" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- row Monica (tie) -->
  <rect x="50" y="114" width="95" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="97" y="130" text-anchor="middle" font-size="10.5" fill="#333">Monica</text>
  <rect x="145" y="114" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- row Maria -->
  <rect x="50" y="136" width="95" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="97" y="152" text-anchor="middle" font-size="10.5" fill="#333">Maria</text>
  <rect x="145" y="136" width="55" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="152" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row James -->
  <rect x="50" y="158" width="95" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="97" y="174" text-anchor="middle" font-size="10.5" fill="#333">James</text>
  <rect x="145" y="158" width="55" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- arrow -->
  <path d="M205 125 L255 125" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="230" y="118" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">cnt DESC</text>
  <text x="230" y="140" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">name ASC</text>
  <text x="230" y="156" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">LIMIT 1</text>

  <!-- result chip -->
  <rect x="260" y="100" width="135" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="16" filter="url(#rough2)"/>
  <text x="327" y="131" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">Daniel</text>

  <!-- tie-break note -->
  <rect x="260" y="160" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">平局：Daniel = Monica = 3</text>
  <text x="360" y="190" text-anchor="middle" font-size="10" fill="#b85450">name ASC → Daniel &lt; Monica ✓</text>

  <!-- ===================== Part 2 ===================== -->
  <text x="40" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">② 第 2 问：2020-02 平均评分 → ORDER BY avg DESC, title ASC → LIMIT 1</text>

  <!-- Feb filter table: 9 rows -->
  <!-- header -->
  <rect x="30" y="246" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">movie</text>
  <rect x="80" y="246" width="45" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">user</text>
  <rect x="125" y="246" width="45" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="147" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">rating</text>
  <rect x="170" y="246" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="207" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">created_at</text>
  <rect x="245" y="246" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="265" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Feb?</text>

  <!-- 9 rows: surviving=green tint, excluded=red tint with strikethrough -->
  <!-- row0: 1,1,3,01-12 ✗ -->
  <rect x="30" y="266" width="255" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="278" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="102" y="278" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="147" y="278" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="207" y="278" text-anchor="middle" font-size="9" fill="#888">2020-01-12</text>
  <text x="265" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <line x1="35" y1="275" x2="280" y2="275" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row1: 1,2,4,02-11 ✓ -->
  <rect x="30" y="284" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="296" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="102" y="296" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="147" y="296" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="207" y="296" text-anchor="middle" font-size="9" fill="#333">2020-02-11</text>
  <text x="265" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row2: 1,3,2,02-12 ✓ -->
  <rect x="30" y="302" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="314" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="102" y="314" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="147" y="314" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="207" y="314" text-anchor="middle" font-size="9" fill="#333">2020-02-12</text>
  <text x="265" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row3: 1,4,1,01-01 ✗ -->
  <rect x="30" y="320" width="255" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="332" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="102" y="332" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="147" y="332" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="207" y="332" text-anchor="middle" font-size="9" fill="#888">2020-01-01</text>
  <text x="265" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <line x1="35" y1="329" x2="280" y2="329" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row4: 2,1,5,02-17 ✓ -->
  <rect x="30" y="338" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="350" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="102" y="350" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="147" y="350" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="207" y="350" text-anchor="middle" font-size="9" fill="#333">2020-02-17</text>
  <text x="265" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row5: 2,2,2,02-01 ✓ -->
  <rect x="30" y="356" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="368" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="102" y="368" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="147" y="368" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="207" y="368" text-anchor="middle" font-size="9" fill="#333">2020-02-01</text>
  <text x="265" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row6: 2,3,2,03-01 ✗ -->
  <rect x="30" y="374" width="255" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="386" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="102" y="386" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="147" y="386" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="207" y="386" text-anchor="middle" font-size="9" fill="#888">2020-03-01</text>
  <text x="265" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <line x1="35" y1="383" x2="280" y2="383" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row7: 3,1,3,02-22 ✓ -->
  <rect x="30" y="392" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="404" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="102" y="404" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="147" y="404" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="207" y="404" text-anchor="middle" font-size="9" fill="#333">2020-02-22</text>
  <text x="265" y="404" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row8: 3,2,4,02-25 ✓ -->
  <rect x="30" y="410" width="255" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="422" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="102" y="422" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="147" y="422" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="207" y="422" text-anchor="middle" font-size="9" fill="#333">2020-02-25</text>
  <text x="265" y="422" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- filter note -->
  <text x="30" y="446" font-size="10" fill="#4a7a3a" font-weight="bold">6 行 ✓ 存活 → JOIN Movies + GROUP BY movie_id + AVG(rating)</text>

  <!-- arrow to avg table -->
  <path d="M300 340 L345 340" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- avg table -->
  <rect x="350" y="280" width="115" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="407" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">title</text>
  <rect x="465" y="280" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">avg_r</text>

  <!-- Avengers 3.0 -->
  <rect x="350" y="302" width="115" height="24" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="318" text-anchor="middle" font-size="10" fill="#333">Avengers</text>
  <rect x="465" y="302" width="90" height="24" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="318" text-anchor="middle" font-size="10" fill="#333">3.0 (4,2)</text>

  <!-- Frozen 2 3.5 (tie highlight) -->
  <rect x="350" y="326" width="115" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="407" y="342" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Frozen 2</text>
  <rect x="465" y="326" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="510" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3.5 (5,2)</text>

  <!-- Joker 3.5 (tie) -->
  <rect x="350" y="350" width="115" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="407" y="366" text-anchor="middle" font-size="10" fill="#333">Joker</text>
  <rect x="465" y="350" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3.5 (3,4)</text>

  <!-- arrow to result -->
  <path d="M560 342 L600 342" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="580" y="334" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">avg DESC</text>
  <text x="580" y="356" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">title ASC</text>
  <text x="580" y="372" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">LIMIT 1</text>

  <!-- result chip -->
  <rect x="605" y="316" width="135" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="16" filter="url(#rough2)"/>
  <text x="672" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">Frozen 2</text>

  <!-- tie-break note -->
  <rect x="490" y="386" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="615" y="402" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">平局：Frozen 2 = Joker = 3.5</text>
  <text x="615" y="416" text-anchor="middle" font-size="10" fill="#b85450">title ASC → Frozen 2 &lt; Joker ✓</text>

  <!-- ===================== UNION ALL final summary ===================== -->
  <rect x="40" y="466" width="680" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="486" font-size="11" fill="#333">两段结果经</text>
  <rect x="135" y="476" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="185" y="491" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">UNION ALL</text>
  <text x="250" y="486" font-size="11" fill="#333">纵向拼接 → 单列</text>
  <rect x="380" y="476" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="491" font-size="10" fill="#446688" font-weight="bold">results</text>
  <line x1="445" y1="478" x2="445" y2="496" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="460" y="491" font-size="10" fill="#b85450" font-weight="bold">Daniel</text>
  <line x1="500" y1="478" x2="500" y2="496" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="515" y="491" font-size="10" fill="#b85450" font-weight="bold">Frozen 2</text>
  <text x="60" y="506" font-size="10" fill="#666">两段各 1 行、异构但同列（字符串），UNION ALL 不去重直接拼接</text>

  <text x="380" y="540" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">验证：Daniel（3=3 平局字典序胜出）+ Frozen 2（3.5=3.5 平局字典序胜出）= 示例输出 ✓</text>
</svg>
