<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：构造 O(m) + getBill O(k)</text>

  <rect x="30" y="48" width="230" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">构造函数 Cashier(...)</text>

  <rect x="55" y="86" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">建 HashMap</text>
  <text x="145" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">product → price</text>

  <path d="M145,124 L145,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="55" y="134" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">count = 0</text>

  <path d="M145,172 L145,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="85" y="182" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="202" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">完成 O(m)</text>

  <text x="145" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">构造时一次性预处理</text>
  <text x="145" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后续查询均为 O(1)</text>

  <rect x="290" y="48" width="240" height="370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="72" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">getBill(product, amount)</text>

  <rect x="320" y="84" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">total = 0</text>

  <path d="M410,116 L410,124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="320" y="126" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="144" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">for each (p, a)：</text>
  <text x="410" y="160" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">total += map[p] × a</text>

  <path d="M410,172 L410,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="320" y="182" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">count++</text>

  <path d="M410,214 L410,226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <polygon points="410,228 480,252 410,276 340,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">count % n</text>
  <text x="410" y="264" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">== 0 ?</text>

  <path d="M340,252 L300,252 L300,290" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="318" y="244" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M480,252 L520,252 L520,290" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="498" y="244" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="250" y="292" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">total *=</text>
  <text x="300" y="326" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(100−d)/100</text>

  <rect x="480" y="292" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不打折</text>

  <path d="M300,338 L300,360 L410,360" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M520,338 L520,360 L410,360" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="350" y="370" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return total</text>

  <text x="410" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count++ 后取模判定</text>

</svg>
