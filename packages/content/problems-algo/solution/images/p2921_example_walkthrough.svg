<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 2 演算：prices = [1,2,3,4,5]，profits = [1,5,3,4,6]（M = 5）</text>
  <text x="374" y="42" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j = 3 ↓</text>

  <!-- 表头行 -->
  <rect x="30" y="50" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="69" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">下标</text>
  <rect x="150" y="50" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="50" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="50" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="50" width="64" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="50" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="69" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="246" y="69" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="310" y="69" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="374" y="69" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="438" y="69" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- prices 行 -->
  <rect x="30" y="78" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="97" text-anchor="middle" font-size="10.5" fill="#446688">prices</text>
  <rect x="150" y="78" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="78" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="78" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="78" width="64" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="78" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="246" y="97" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="310" y="97" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="374" y="97" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="438" y="97" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- profits 行 -->
  <rect x="30" y="106" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="125" text-anchor="middle" font-size="10.5" fill="#446688">profits</text>
  <rect x="150" y="106" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="106" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="106" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="106" width="64" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="106" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="125" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="246" y="125" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="310" y="125" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="374" y="125" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="438" y="125" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- left 行 -->
  <rect x="30" y="134" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="153" text-anchor="middle" font-size="10.5" fill="#446688">left[j]（左扫 →）</text>
  <rect x="150" y="134" width="64" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="134" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="134" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="134" width="64" height="28" fill="#e8f0fe" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="134" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="153" text-anchor="middle" font-size="11" fill="#999" font-style="italic">0</text>
  <text x="246" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="310" y="153" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="374" y="153" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="438" y="153" text-anchor="middle" font-size="11" fill="#333">5</text>
  <path d="M 452 148 L 492 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- right 行 -->
  <rect x="30" y="162" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="181" text-anchor="middle" font-size="10.5" fill="#b85450">right[j]（右扫 ←）</text>
  <rect x="150" y="162" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="162" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="162" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="162" width="64" height="28" fill="#fce4ec" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="162" width="64" height="28" fill="#f5f5f5" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="181" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="246" y="181" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="310" y="181" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="374" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="438" y="181" text-anchor="middle" font-size="11" fill="#999" font-style="italic">0</text>
  <path d="M 492 176 L 452 176" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 候选行 -->
  <rect x="30" y="190" width="120" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="209" text-anchor="middle" font-size="10.5" fill="#446688">候选 = l+p+r</text>
  <rect x="150" y="190" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="190" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="190" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="190" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="190" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="209" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="246" y="209" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="310" y="209" text-anchor="middle" font-size="11" fill="#333">14</text>
  <text x="374" y="209" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">15 ✓</text>
  <text x="438" y="209" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- 底部要点 -->
  <rect x="30" y="232" width="500" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#555">j = 3（价格 4）：left = 5 ← i = 1（价格 2 &lt; 4），right = 6 ← k = 4（价格 5 &gt; 4）</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#555">候选 = 5 + 4 + 6 = 15 ✓——j=2 与 j=3 的 left/right 全同，差在中间元素自身利润（3 vs 4）</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#555">j = 0 的 left = 0（左侧无元素）、j = 4 的 right = 0（右侧无元素）：两端当不了中间人</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#555">0 = 「不存在」哨兵：profits[i] ≥ 1，判 &gt; 0 即可</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#555">示例 1 复核：仅 j = 2 可行（left=2, right=10）→ 2 + 7 + 10 = 19</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#555">示例 3 复核：价格严格递减，左扫全程 left = 0 → 返回 −1</text>
</svg>
