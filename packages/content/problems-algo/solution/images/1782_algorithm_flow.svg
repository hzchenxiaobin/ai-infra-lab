<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：双指针计数 + 重边修正</text>

  <!-- Step 1 -->
  <rect x="70" y="55" width="400" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">① 预处理：遍历 edges，deg[u]++, deg[v]++, edge_cnt[(min,max)]++</text>
  <path d="M270 105 L270 125" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="70" y="130" width="400" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">② 排序：sorted_deg = sort(deg[1..n])（仅一次 O(n log n)）</text>
  <path d="M270 180 L270 200" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 loop -->
  <rect x="40" y="205" width="460" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="270" y="229" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">③ 对每个 query q：</text>

  <!-- 3a two-pointer -->
  <rect x="65" y="240" width="410" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3a 双指针：数 deg[a]+deg[b] &gt; q 的对数 total（O(n)/query）</text>
  <path d="M270 286 L270 300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3b correction -->
  <rect x="65" y="305" width="410" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3b 遍历 edge_cnt：若 s&gt;q 且 s−c≤q 则 total−−（O(m)/query）</text>

  <path d="M270 377 L270 397" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="70" y="402" width="400" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="431" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">④ answers[j] = total，返回 answers</text>
</svg>
