<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "11111222223", k = 3</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">两轮即收敛：len 11 → 4 → 3（≤ k 停）</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#666" font-weight="bold">第 1 轮</text>
  <text x="30" y="90" font-size="9.5" fill="#888">拆分（每组 k=3）</text>

  <!-- groups of "11111222223" -->
  <rect x="30" y="98" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">111</text>
  <rect x="84" y="98" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">112</text>
  <rect x="138" y="98" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">222</text>
  <rect x="192" y="98" width="38" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">23</text>
  <text x="236" y="116" font-size="9" fill="#888">末组 2 位</text>

  <!-- arrows down -->
  <path d="M 55 126 L 55 142" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 109 126 L 109 142" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 163 126 L 163 142" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 211 126 L 211 142" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="55" y="138" text-anchor="middle" font-size="8.5" fill="#888">1+1+1</text>
  <text x="109" y="138" text-anchor="middle" font-size="8.5" fill="#888">1+1+2</text>
  <text x="163" y="138" text-anchor="middle" font-size="8.5" fill="#888">2+2+2</text>
  <text x="211" y="138" text-anchor="middle" font-size="8.5" fill="#888">2+3</text>

  <!-- sums -->
  <rect x="34" y="144" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="88" y="144" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="142" y="144" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="190" y="144" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- merge -->
  <path d="M 133 172 L 133 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="74" y="188" width="118" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"3""4""6""5" → "3465"</text>
  <text x="200" y="205" font-size="9.5" fill="#888">len=4 &gt; 3，继续</text>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="236" font-size="11" fill="#666" font-weight="bold">第 2 轮</text>
  <text x="30" y="252" font-size="9.5" fill="#888">拆分 "3465"</text>

  <rect x="40" y="260" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="279" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">346</text>
  <rect x="88" y="260" width="34" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="279" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="130" y="278" font-size="9" fill="#888">末组 1 位</text>

  <path d="M 62 288 L 62 304" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 105 288 L 105 304" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="300" text-anchor="middle" font-size="8.5" fill="#888">3+4+6=13</text>
  <text x="105" y="300" text-anchor="middle" font-size="8.5" fill="#888">5</text>

  <rect x="40" y="306" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="325" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <rect x="88" y="306" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="325" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <path d="M 83 334 L 83 350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="350" width="102" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="369" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"13""5" → "135"</text>
  <text x="142" y="368" font-size="9.5" fill="#888">len=3 ≤ 3，停 ✓</text>

  <!-- ===== Side panel: summary ===== -->
  <rect x="270" y="60" width="270" height="320" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">演算小结</text>

  <rect x="286" y="96" width="238" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="296" y="113" font-size="10" fill="#333" font-weight="bold">第1轮</text>
  <text x="296" y="128" font-size="9.5" fill="#555">111|112|222|23 → 3,4,6,5 → "3465"</text>

  <rect x="286" y="142" width="238" height="40" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="296" y="159" font-size="10" fill="#333" font-weight="bold">第2轮</text>
  <text x="296" y="174" font-size="9.5" fill="#555">346|5 → 13,5 → "135"</text>

  <rect x="286" y="188" width="238" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="296" y="205" font-size="10" fill="#b85450" font-weight="bold">终止</text>
  <text x="296" y="220" font-size="9.5" fill="#555">len("135")=3 ≤ k=3 → 返回</text>

  <!-- length / S tracking -->
  <text x="296" y="252" font-size="10" fill="#666" font-weight="bold">长度变化</text>
  <rect x="296" y="258" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="273" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <text x="346" y="273" font-size="11" fill="#888">→</text>
  <rect x="358" y="258" width="46" height="22" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="273" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="408" y="273" font-size="11" fill="#888">→</text>
  <rect x="420" y="258" width="46" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443" y="273" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>

  <text x="296" y="300" font-size="10" fill="#666" font-weight="bold">总数字和 S</text>
  <rect x="296" y="306" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="321" text-anchor="middle" font-size="10.5" fill="#333">18</text>
  <text x="346" y="321" font-size="11" fill="#888">→</text>
  <rect x="358" y="306" width="46" height="22" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="321" text-anchor="middle" font-size="10.5" fill="#333">18</text>
  <text x="408" y="321" font-size="11" fill="#888">→</text>
  <rect x="420" y="306" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="443" y="321" text-anchor="middle" font-size="10.5" fill="#333">9</text>

  <text x="405" y="346" text-anchor="middle" font-size="9" fill="#5588bb">一轮 S 不变（组和均一位）</text>
  <text x="405" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">二轮 S 递减（13 含两位）</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="388" width="510" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：按 k 切段、逐段数位求和转字符串、拼回，循环到 len ≤ k</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#555">末组长度 = len % k（为 0 时恰满 k），无需特殊处理</text>
</svg>
