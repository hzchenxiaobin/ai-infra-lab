<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：num = "2908305"，n = 7</text>

  <!-- digit row -->
  <rect x="124" y="46" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="148" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="178" y="46" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="202" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">9</text>
  <rect x="232" y="46" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="256" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="286" y="46" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>
  <rect x="340" y="46" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="364" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="394" y="46" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="418" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="448" y="46" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="472" y="76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>

  <text x="148" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="256" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="364" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="418" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="472" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <!-- row 00 winner -->
  <rect x="56" y="128" width="508" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="64" y="134" width="44" height="28" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00</text>
  <text x="120" y="153" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">i=2, j=5 → 保留 "2900"，代价 = 7 − 2 − 2 = 3 ✓ 最优</text>

  <!-- row 25 -->
  <rect x="56" y="176" width="508" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="64" y="182" width="44" height="28" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="201" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">25</text>
  <text x="120" y="201" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">i=0, j=6 → 保留 "25"，代价 = 7 − 0 − 2 = 5</text>

  <!-- row 50 -->
  <rect x="56" y="224" width="508" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="64" y="230" width="44" height="28" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="249" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">50</text>
  <text x="120" y="249" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">唯一的 '5' 在最右，右侧没有 '0' → 不可行 ✗</text>

  <!-- row 75 -->
  <rect x="56" y="272" width="508" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="64" y="278" width="44" height="28" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="297" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">75</text>
  <text x="120" y="297" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">num 中不存在 '7' → 不可行 ✗</text>

  <!-- fallback row -->
  <rect x="56" y="320" width="508" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="64" y="326" width="52" height="28" rx="6" fill="#fff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="345" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">兜底</text>
  <text x="128" y="345" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">只留一个 '0'：6 次；全删成 0：7 次</text>

  <!-- conclusion -->
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(3, 5, 6, 7) = 3 —— 删 num[3]、num[4]、num[6]，留下 "2900"</text>
</svg>
