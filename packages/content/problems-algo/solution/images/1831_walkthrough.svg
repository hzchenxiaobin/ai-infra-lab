<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：解法 A 逐步执行（DATE 分组 + 元组 IN 筛选）</text>

  <!-- ===== Step 1: Transactions input ===== -->
  <text x="125" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 Transactions</text>
  <rect x="30" y="62" width="190" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="77" font-size="9" fill="#333">trans_id</text>
  <text x="110" y="77" font-size="9" fill="#333">day</text>
  <text x="180" y="77" font-size="9" fill="#333">amount</text>
  <line x1="88" y1="62" x2="88" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="62" x2="160" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="190" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="98" font-size="9" fill="#333">8</text>
  <text x="95" y="98" font-size="8" fill="#4a7a3a">2021-4-3 15:57</text>
  <text x="182" y="98" font-size="9" fill="#4a7a3a" font-weight="bold">57</text>
  <rect x="30" y="104" width="190" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="118" font-size="9" fill="#333">9</text>
  <text x="95" y="118" font-size="8" fill="#d6a040">2021-4-28 08:47</text>
  <text x="182" y="118" font-size="9" fill="#888">21</text>
  <rect x="30" y="124" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="138" font-size="9" fill="#333">1</text>
  <text x="95" y="138" font-size="8" fill="#b85450">2021-4-29 13:28</text>
  <text x="182" y="138" font-size="9" fill="#b85450" font-weight="bold">58</text>
  <rect x="30" y="144" width="190" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="158" font-size="9" fill="#333">5</text>
  <text x="95" y="158" font-size="8" fill="#d6a040">2021-4-28 16:39</text>
  <text x="182" y="158" font-size="9" fill="#d6a040" font-weight="bold">40</text>
  <rect x="30" y="164" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="178" font-size="9" fill="#333">6</text>
  <text x="95" y="178" font-size="8" fill="#b85450">2021-4-29 23:39</text>
  <text x="182" y="178" font-size="9" fill="#b85450" font-weight="bold">58</text>
  <line x1="88" y1="84" x2="88" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="84" x2="160" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow step1 -> step2 -->
  <path d="M125 192 L125 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="215" y="212" font-size="10" fill="#b85450" font-weight="bold">① GROUP BY DATE(day), MAX(amount)</text>

  <!-- ===== Step 2: subquery result (DATE, MAX) ===== -->
  <text x="125" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">子查询：每天的 (date, MAX)</text>
  <rect x="30" y="242" width="190" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="257" font-size="9" fill="#333">DATE(day)</text>
  <text x="150" y="257" font-size="9" fill="#333">MAX(amount)</text>
  <line x1="110" y1="242" x2="110" y2="264" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="264" width="190" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="9" fill="#4a7a3a">2021-4-3</text>
  <text x="150" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">57</text>
  <rect x="30" y="284" width="190" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="9" fill="#d6a040">2021-4-28</text>
  <text x="150" y="298" font-size="9" fill="#d6a040" font-weight="bold">40</text>
  <rect x="30" y="304" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="9" fill="#b85450">2021-4-29</text>
  <text x="150" y="318" font-size="9" fill="#b85450" font-weight="bold">58</text>
  <line x1="110" y1="264" x2="110" y2="324" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow step2 -> step3 (right) -->
  <path d="M220 274 Q300 274 360 274" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② WHERE (DATE,amount) IN</text>
  <text x="290" y="286" text-anchor="middle" font-size="9" fill="#888">逐行判定元组是否 ∈ 子查询</text>

  <!-- ===== Step 3: IN filter verdict ===== -->
  <text x="485" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐行元组匹配判定</text>
  <rect x="370" y="242" width="260" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="385" y="258" font-size="9" fill="#333">子查询集合 = {(4-3,57),(4-28,40),(4-29,58)}</text>
  <line x1="380" y1="264" x2="620" y2="264" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="385" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">id 8: (4-3, 57) ∈ ✓</text>
  <text x="385" y="292" font-size="9" fill="#888">id 9: (4-28, 21) ∗ 不匹配（21≠40）</text>
  <text x="385" y="306" font-size="9" fill="#b85450" font-weight="bold">id 1: (4-29, 58) ∈ ✓</text>
  <text x="385" y="320" font-size="9" fill="#d6a040" font-weight="bold">id 5: (4-28, 40) ∈ ✓</text>

  <!-- Arrow to expanded verdict (down right) -->
  <path d="M485 328 L485 354" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="570" y="348" font-size="9" fill="#888">id 6: (4-29, 58) ∈ ✓ 并列</text>

  <!-- ===== Step 4: final result ===== -->
  <rect x="370" y="358" width="260" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">命中的行：id 8, 1, 5, 6</text>
  <text x="500" y="392" text-anchor="middle" font-size="9" fill="#666">③ ORDER BY transaction_id</text>
  <text x="500" y="408" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">→ 1, 5, 6, 8（升序）</text>

  <!-- Arrow from result to final output -->
  <path d="M370 387 Q300 420 220 430" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Final output table -->
  <text x="125" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <rect x="30" y="418" width="190" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="433" text-anchor="middle" font-size="9" fill="#333">transaction_id</text>
  <rect x="30" y="440" width="47" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="454" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="77" y="440" width="47" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="454" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5</text>
  <rect x="124" y="440" width="47" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="147" y="454" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <rect x="171" y="440" width="49" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="454" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Color legend -->
  <rect x="30" y="470" width="47" height="14" fill="none" stroke="none"/>
  <text x="125" y="484" text-anchor="middle" font-size="8" fill="#888">绿=4-3 组 · 橙=4-28 组 · 红=4-29 组（并列 58）</text>
</svg>
