<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：对撞双指针 + 两端同字符整段删除</text>

  <!-- Start: init -->
  <rect x="170" y="46" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">l = 0,  r = n − 1</text>

  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="372" y="116" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- Decision: l < r and s[l]==s[r] ? -->
  <polygon points="260,114 360,160 260,206 160,160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l &lt; r 且</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[l] == s[r] ?</text>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">两端是否同字符</text>

  <!-- No branch: return -->
  <path d="M 360 160 L 430 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="138" width="76" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">r − l + 1</text>

  <!-- Yes branch: down -->
  <path d="M 260 206 L 260 224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="220" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- c = s[l] -->
  <rect x="200" y="228" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c = s[l]</text>

  <path d="M 260 266 L 260 284" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Left scan: while l<=r and s[l]==c: l++ -->
  <rect x="120" y="288" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左扫：while l ≤ r 且 s[l] == c</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">l += 1</text>

  <path d="M 260 332 L 260 348" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right scan: while l<=r and s[r]==c: r-- -->
  <rect x="120" y="352" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右扫：while l ≤ r 且 s[r] == c</text>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">r −= 1</text>

  <!-- loop back arrow: from right scan up to decision -->
  <path d="M 400 374 L 470 374 L 470 160 L 360 160" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="270" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- Footer -->
  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">l 单调右移、r 单调左移 —— 总复杂度 O(n) / O(1)</text>
  <text x="260" y="448" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">内层用 l ≤ r 守护：全同串扫过头时 l = r+1，第二轮不执行</text>
</svg>
