<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：一遍扫描，镜像即命中
  </text>

  <!-- Table 1: leetcode -->
  <text x="40" y="56" font-size="13" fill="#446688" filter="url(#rough2)">s = "leetcode"</text>
  <!-- header -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="80" y="64" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="140" y="64" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="216" y="64" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="326" y="64" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="81" filter="url(#rough2)">i</text>
    <text x="110" y="81" filter="url(#rough2)">相邻对</text>
    <text x="178" y="81" filter="url(#rough2)">a == b ?</text>
    <text x="271" y="81" filter="url(#rough2)">seen[b][a] ?</text>
    <text x="401" y="81" filter="url(#rough2)">动作</text>
    <!-- row 1 -->
    <rect x="40" y="90" width="40" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="80" y="90" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="140" y="90" width="76" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="216" y="90" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="326" y="90" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="107" filter="url(#rough2)">1</text>
    <text x="110" y="107" filter="url(#rough2)">"le"</text>
    <text x="178" y="107" fill="#999" filter="url(#rough2)">✗</text>
    <text x="271" y="107" fill="#999" filter="url(#rough2)">✗</text>
    <text x="401" y="107" filter="url(#rough2)">记录 "le"</text>
    <!-- row 2: hit -->
    <rect x="40" y="116" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="80" y="116" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="140" y="116" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="216" y="116" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="326" y="116" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="60" y="133" filter="url(#rough2)">2</text>
    <text x="110" y="133" filter="url(#rough2)">"ee"</text>
    <text x="178" y="133" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="271" y="133" fill="#999" filter="url(#rough2)">—</text>
    <text x="401" y="133" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中！return true</text>
  </g>
  <text x="40" y="160" font-size="12" fill="#666" filter="url(#rough2)">↳ "ee" 是回文对：自身就是自己的镜像，出现即答案</text>

  <!-- Table 2: abcba -->
  <text x="40" y="192" font-size="13" fill="#446688" filter="url(#rough2)">s = "abcba"</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="200" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="80" y="200" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="140" y="200" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="216" y="200" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="326" y="200" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="217" filter="url(#rough2)">i</text>
    <text x="110" y="217" filter="url(#rough2)">相邻对</text>
    <text x="178" y="217" filter="url(#rough2)">a == b ?</text>
    <text x="271" y="217" filter="url(#rough2)">seen[b][a] ?</text>
    <text x="401" y="217" filter="url(#rough2)">动作</text>
    <!-- row 1 -->
    <rect x="40" y="226" width="40" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="80" y="226" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="140" y="226" width="76" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="216" y="226" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="326" y="226" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="243" filter="url(#rough2)">1</text>
    <text x="110" y="243" filter="url(#rough2)">"ab"</text>
    <text x="178" y="243" fill="#999" filter="url(#rough2)">✗</text>
    <text x="271" y="243" fill="#999" filter="url(#rough2)">✗</text>
    <text x="401" y="243" filter="url(#rough2)">记录 "ab"</text>
    <!-- row 2 -->
    <rect x="40" y="252" width="40" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="80" y="252" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="140" y="252" width="76" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="216" y="252" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="326" y="252" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="269" filter="url(#rough2)">2</text>
    <text x="110" y="269" filter="url(#rough2)">"bc"</text>
    <text x="178" y="269" fill="#999" filter="url(#rough2)">✗</text>
    <text x="271" y="269" fill="#999" filter="url(#rough2)">✗</text>
    <text x="401" y="269" filter="url(#rough2)">记录 "bc"</text>
    <!-- row 3: hit -->
    <rect x="40" y="278" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="80" y="278" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="140" y="278" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="216" y="278" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="326" y="278" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="60" y="295" filter="url(#rough2)">3</text>
    <text x="110" y="295" filter="url(#rough2)">"cb"</text>
    <text x="178" y="295" fill="#999" filter="url(#rough2)">✗</text>
    <text x="271" y="295" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ "bc"</text>
    <text x="401" y="295" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中！return true</text>
  </g>
  <text x="40" y="322" font-size="12" fill="#666" filter="url(#rough2)">↳ "cb" 的镜像 "bc" 已在 i=2 记录，交叉配对成功</text>

  <!-- Table 3: abcd -->
  <text x="40" y="354" font-size="13" fill="#446688" filter="url(#rough2)">s = "abcd"</text>
  <rect x="40" y="364" width="436" height="34" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="386" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    "ab"、"bc"、"cd" 两两互不为镜像，也无回文对 → 扫描结束，return false
  </text>

  <text x="40" y="424" font-size="12" fill="#666" filter="url(#rough2)">
    ⚠️ 若不先判 a==b，"ee" 这种自镜像对会漏判（判定时它尚未被记录）
  </text>
</svg>
