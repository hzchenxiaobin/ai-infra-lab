<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种查重解法对比</text>

  <!-- Column A: GROUP BY -->
  <rect x="30" y="44" width="160" height="232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">A. GROUP BY + HAVING</text>
  <text x="110" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 推荐</text>
  <rect x="44" y="92" width="132" height="44" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="106" font-size="9" fill="#333">SELECT email</text>
  <text x="52" y="118" font-size="9" fill="#333">FROM Person</text>
  <text x="52" y="130" font-size="9" fill="#333">GROUP BY email</text>
  <rect x="44" y="140" width="132" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="52" y="154" font-size="9" fill="#b85450" font-weight="bold">HAVING COUNT&gt;1</text>
  <text x="52" y="176" font-size="9" fill="#333">分组：压缩行</text>
  <text x="52" y="190" font-size="9" fill="#333">天然去重 ✓</text>
  <text x="52" y="204" font-size="9" fill="#333">O(n) ~ O(n log n)</text>
  <text x="52" y="226" font-size="9" fill="#4a7a3a" font-weight="bold">最简洁直接</text>
  <text x="52" y="240" font-size="9" fill="#4a7a3a" font-weight="bold">语义=按值分组</text>
  <text x="52" y="262" font-size="9" fill="#333">适用：只需返回</text>
  <text x="52" y="274" font-size="9" fill="#333">重复值集合</text>

  <!-- Column B: Self JOIN -->
  <rect x="200" y="44" width="160" height="232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">B. Self JOIN</text>
  <text x="280" y="80" text-anchor="middle" font-size="9" fill="#d6a040">经典等价</text>
  <rect x="214" y="92" width="132" height="64" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="222" y="106" font-size="9" fill="#333">SELECT DISTINCT</text>
  <text x="222" y="118" font-size="9" fill="#333">  p1.email</text>
  <text x="222" y="130" font-size="9" fill="#333">FROM Person p1</text>
  <text x="222" y="142" font-size="9" fill="#333">JOIN Person p2</text>
  <text x="222" y="154" font-size="9" fill="#333">  ON ...</text>
  <rect x="214" y="160" width="132" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="222" y="174" font-size="9" fill="#b85450" font-weight="bold">DISTINCT 必须!</text>
  <text x="222" y="196" font-size="9" fill="#333">配对：行间配对</text>
  <text x="222" y="210" font-size="9" fill="#333">N行→N(N-1)对</text>
  <text x="222" y="224" font-size="9" fill="#333">最坏 O(n²)</text>
  <text x="222" y="246" font-size="9" fill="#d6a040" font-weight="bold">自连接思想入门</text>
  <text x="222" y="260" font-size="9" fill="#d6a040" font-weight="bold">承接 181 自连接</text>
  <text x="222" y="282" font-size="9" fill="#333">适用：DELETE</text>
  <text x="222" y="274" font-size="9" fill="#333">场景（196题）</text>

  <!-- Column C: Window function -->
  <rect x="370" y="44" width="160" height="232" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">C. 窗口函数 COUNT OVER</text>
  <text x="450" y="80" text-anchor="middle" font-size="9" fill="#446688">现代，泛化强</text>
  <rect x="384" y="92" width="132" height="64" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="392" y="106" font-size="9" fill="#333">SELECT DISTINCT</text>
  <text x="392" y="118" font-size="9" fill="#333">  email</text>
  <text x="392" y="130" font-size="9" fill="#333">FROM (</text>
  <text x="392" y="142" font-size="9" fill="#333">  SELECT email,</text>
  <text x="392" y="154" font-size="9" fill="#333">  COUNT() OVER(...)</text>
  <rect x="384" y="160" width="132" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="174" font-size="9" fill="#b85450" font-weight="bold">DISTINCT 必须!</text>
  <text x="392" y="196" font-size="9" fill="#333">窗口：保留全部行</text>
  <text x="392" y="210" font-size="9" fill="#333">每行附组级 COUNT</text>
  <text x="392" y="224" font-size="9" fill="#333">O(n log n)</text>
  <text x="392" y="246" font-size="9" fill="#446688" font-weight="bold">不压缩行</text>
  <text x="392" y="260" font-size="9" fill="#446688" font-weight="bold">可输出明细</text>
  <text x="392" y="282" font-size="9" fill="#333">适用：需保留</text>
  <text x="392" y="274" font-size="9" fill="#333">重复行明细</text>

  <!-- Bottom comparison summary -->
  <rect x="40" y="296" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">去重差异：GROUP BY 天然每组一行，Self JOIN / 窗口函数需 DISTINCT</text>
  <text x="60" y="336" font-size="10" fill="#333">① GROUP BY：N 行同 email → 1 行（压缩），无需 DISTINCT</text>
  <text x="60" y="354" font-size="10" fill="#333">② Self JOIN：N 行 → N(N-1) 有向对，每对都产出 email，必须 DISTINCT 去重</text>
</svg>
