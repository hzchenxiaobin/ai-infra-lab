<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，维护 maxLen 与 count</text>

  <!-- Start: init -->
  <rect x="200" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化 maxLen=0, count=0</text>

  <!-- arrow down -->
  <path d="M 280 82 L 280 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="210" y="100" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历每个 [l, w]</text>

  <!-- arrow down to compute -->
  <path d="M 280 132 L 280 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute k = min(l, w) -->
  <rect x="190" y="150" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k = min(l, w)</text>

  <!-- arrow down to decision -->
  <path d="M 280 186 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: k > maxLen? -->
  <polygon points="280,206 360,246 280,286 200,246" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k &gt; maxLen?</text>
  <text x="280" y="258" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(发现更大值)</text>

  <!-- Yes branch: left -->
  <path d="M 200 246 L 110 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="30" y="228" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">maxLen = k</text>
  <text x="70" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">count = 1</text>

  <!-- No branch: down to second decision -->
  <path d="M 280 286 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="298" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision diamond 2: k == maxLen? -->
  <polygon points="280,306 360,346 280,386 200,346" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">k == maxLen?</text>
  <text x="280" y="358" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(并列最大)</text>

  <!-- Yes: count++ (right) -->
  <path d="M 360 346 L 440 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="440" y="328" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count += 1</text>

  <!-- No: do nothing (left) -->
  <path d="M 200 346 L 130 346" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="340" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="50" y="328" width="80" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">跳过</text>

  <!-- loop back arrow: from left box up and around to loop entry -->
  <!-- left box top (70,228) -> up to y=115 -> right to 210 -->
  <path d="M 70 228 L 70 115 L 210 115" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- right box back: 485,328 -> up to 115 -> left to 350 -->
  <path d="M 485 328 L 485 115 L 350 115" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- skip box back: 90,328 -> up to y=395 -> right to 280 -> up ... actually route around -->
  <path d="M 90 364 L 90 400 L 540 400 L 540 115 L 350 115" stroke="#888" stroke-width="1.1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="190" y="416" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历结束，返回 count</text>
</svg>
