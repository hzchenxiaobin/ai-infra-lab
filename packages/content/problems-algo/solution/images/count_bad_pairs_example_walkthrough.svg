<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 1, 3, 3]</text>

  <!-- Header row -->
  <rect x="20" y="38" width="600" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="240" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d=nums[i]−i</text>
  <text x="340" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">freq[d]前</text>
  <text x="440" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">good +=</text>
  <text x="540" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">freq[d]后</text>

  <!-- Row 0: i=0, nums=4, d=4, freq前=0, good+=0, freq后=1 -->
  <rect x="20" y="68" width="600" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="340" y="86" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="86" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="540" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 1: i=1, nums=1, d=0, freq前=0, good+=0, freq后=1 -->
  <rect x="20" y="98" width="600" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="340" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="540" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 2: i=2, nums=3, d=1, freq前=0, good+=0, freq后=1 -->
  <rect x="20" y="128" width="600" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="146" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="146" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="540" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 3: i=3, nums=3, d=0, freq前=1, good+=1, freq后=2 (highlight) -->
  <rect x="20" y="158" width="600" height="28" fill="#f1f8f1" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="240" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="540" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- note box -->
  <rect x="20" y="200" width="600" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=3 时 d=0 与 i=1 的 d=0 相同 → 命中 1 个好对</text>
  <text x="40" y="238" font-size="11" fill="#444">同一 d 值每多出现一次，就与之前所有同 d 下标各成 1 对好对</text>

  <!-- result box -->
  <rect x="20" y="256" width="600" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终统计</text>
  <text x="40" y="304" font-size="12" fill="#333" font-weight="bold">总对数  total = C(4, 2) = 4×3/2 = 6</text>
  <text x="40" y="324" font-size="12" fill="#333" font-weight="bold">好对数  good = 1</text>
  <text x="40" y="346" font-size="13" fill="#b85450" font-weight="bold">坏数对  = total − good = 6 − 1 = 5  ✓</text>
</svg>
