<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">重新安排行程：欧拉路径 = 走完每条边恰好一次</text>
  <path d="M 215 44 Q 360 52 505 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#666">示例 1：4 张票连成一条链，从 JFK 出发唯一可行行程</text>

  <!-- nodes (chain) -->
  <g filter="url(#rough2)"><rect x="58" y="128" width="74" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="95" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">JFK</text>
  <text x="95" y="196" text-anchor="middle" font-size="10" fill="#d6a040">起点</text>

  <g filter="url(#rough2)"><rect x="198" y="128" width="74" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="235" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">MUC</text>

  <g filter="url(#rough2)"><rect x="338" y="128" width="74" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="375" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">LHR</text>

  <g filter="url(#rough2)"><rect x="478" y="128" width="74" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="515" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">SFO</text>

  <g filter="url(#rough2)"><rect x="618" y="128" width="74" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="655" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a2b28">SJC</text>
  <text x="655" y="196" text-anchor="middle" font-size="10" fill="#b85450">终点·死胡同</text>

  <!-- arrows -->
  <path d="M 134 151 L 194 151" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 274 151 L 334 151" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 151 L 474 151" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 554 151 L 614 151" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ticket labels -->
  <text x="164" y="120" text-anchor="middle" font-size="10" fill="#888">票①</text>
  <text x="304" y="120" text-anchor="middle" font-size="10" fill="#888">票②</text>
  <text x="444" y="120" text-anchor="middle" font-size="10" fill="#888">票③</text>
  <text x="584" y="120" text-anchor="middle" font-size="10" fill="#888">票④</text>

  <!-- note box -->
  <g filter="url(#rough2)"><rect x="110" y="220" width="500" height="60" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="360" y="244" text-anchor="middle" font-size="12" fill="#444">每张票 = 一条有向边，必须全部用、且只用一次</text>
  <text x="360" y="264" text-anchor="middle" font-size="12" fill="#444">→ 这正是「欧拉路径」定义：经过每条边恰好一次的迹</text>
</svg>
