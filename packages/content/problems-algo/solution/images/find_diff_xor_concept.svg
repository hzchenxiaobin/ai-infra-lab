<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">XOR 抵消：成对字符归零，孤立的即是多出的</text>

  <!-- s row -->
  <text x="50" y="82" font-size="13" fill="#888">s:</text>
  <rect x="90" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="138" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="186" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="234" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>

  <!-- t row -->
  <text x="50" y="142" font-size="13" fill="#888">t:</text>
  <rect x="90" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="138" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="186" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="234" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="282" y="122" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="144" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
  <text x="338" y="140" font-size="11" fill="#b85450">← 多出</text>

  <!-- pairing arrows: s chars down to t matching chars -->
  <path d="M 112 94 L 112 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 160 94 L 160 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 208 94 L 208 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 256 94 L 256 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="116" font-size="10" fill="#4a7a3a">成对 → 抵消</text>

  <!-- XOR formula zone -->
  <rect x="40" y="180" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">XOR 全部字符: a⊕b⊕c⊕d ⊕ a⊕b⊕c⊕d⊕e</text>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#555">= (a⊕a) ⊕ (b⊕b) ⊕ (c⊕c) ⊕ (d⊕d) ⊕ e</text>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#555">= 0 ⊕ 0 ⊕ 0 ⊕ 0 ⊕ e = e</text>

  <!-- result -->
  <rect x="170" y="282" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ans = e  →  返回 'e'</text>

  <!-- note -->
  <rect x="40" y="348" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#555">原理: x ⊕ x = 0, x ⊕ 0 = x；XOR 可交换可结合，顺序无关</text>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#555">t 比 s 多一个字符，成对的全部抵消，剩下的就是答案</text>
</svg>
