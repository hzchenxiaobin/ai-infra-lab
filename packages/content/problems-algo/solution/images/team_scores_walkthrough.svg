<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 场比赛 → 拆分 → 求和 → 排序</text>

  <!-- Section 1: matches -> per-team points -->
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一步：每场比赛拆出主队 / 客队积分</text>

  <!-- header row -->
  <rect x="30" y="58" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="73" font-size="9.5" fill="#888" font-weight="bold">match</text>
  <text x="110" y="73" font-size="9.5" fill="#446688" font-weight="bold">host</text>
  <text x="165" y="73" font-size="9.5" fill="#b85450" font-weight="bold">guest</text>
  <text x="225" y="73" font-size="9.5" fill="#4a7a3a" font-weight="bold">hg</text>
  <text x="280" y="73" font-size="9.5" fill="#d6a040" font-weight="bold">gg</text>
  <text x="355" y="73" font-size="9.5" fill="#446688" font-weight="bold">主队积分</text>
  <text x="475" y="73" font-size="9.5" fill="#b85450" font-weight="bold">客队积分</text>

  <!-- M1: host 10 guest 20, 3-0 -> host win 3, guest lose 0 -->
  <rect x="30" y="80" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">M1</text>
  <text x="110" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10</text>
  <text x="165" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <text x="225" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="280" y="94" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="355" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10 → 3（胜）</text>
  <text x="475" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20 → 0（负）</text>

  <!-- M2: host 30 guest 10, 2-2 -> tie 1 each -->
  <rect x="30" y="100" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="114" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">M2</text>
  <text x="110" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">30</text>
  <text x="165" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>
  <text x="225" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="280" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="355" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">30 → 1（平）</text>
  <text x="475" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10 → 1（平）</text>

  <!-- M3: host 10 guest 50, 5-1 -> host win 3, guest lose 0 -->
  <rect x="30" y="120" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">M3</text>
  <text x="110" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10</text>
  <text x="165" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">50</text>
  <text x="225" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="280" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="355" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10 → 3（胜）</text>
  <text x="475" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">50 → 0（负）</text>

  <!-- M4: host 20 guest 30, 1-0 -> host win 3, guest lose 0 -->
  <rect x="30" y="140" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="154" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">M4</text>
  <text x="110" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20</text>
  <text x="165" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30</text>
  <text x="225" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="355" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">20 → 3（胜）</text>
  <text x="475" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30 → 0（负）</text>

  <!-- M5: host 50 guest 30, 1-0 -> host win 3, guest lose 0 -->
  <rect x="30" y="160" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">M5</text>
  <text x="110" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">50</text>
  <text x="165" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30</text>
  <text x="225" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="355" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50 → 3（胜）</text>
  <text x="475" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30 → 0（负）</text>

  <!-- column separators -->
  <line x1="80" y1="58" x2="80" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="135" y1="58" x2="135" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="200" y1="58" x2="200" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="255" y1="58" x2="255" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="58" x2="305" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="425" y1="58" x2="425" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M290 182 L290 204" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="198" font-size="9.5" fill="#4a7a3a">GROUP BY team_id, SUM(points)</text>

  <!-- Section 2: aggregation -->
  <text x="290" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二步：按 team_id 聚合求和（LEFT JOIN 补无比赛队）</text>

  <rect x="80" y="228" width="420" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="243" font-size="9.5" fill="#446688" font-weight="bold">team_id</text>
  <text x="180" y="243" font-size="9.5" fill="#333" font-weight="bold">team_name</text>
  <text x="345" y="243" font-size="9.5" fill="#555" font-weight="bold">各场得分明细</text>
  <text x="475" y="243" font-size="9.5" fill="#b85450" font-weight="bold">合计</text>
  <line x1="150" y1="228" x2="150" y2="250" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="228" x2="270" y2="250" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="445" y1="228" x2="445" y2="250" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="250" width="420" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10</text>
  <text x="210" y="264" text-anchor="middle" font-size="9.5" fill="#333">Leetcode FC</text>
  <text x="345" y="264" text-anchor="middle" font-size="9.5" fill="#555">M1:3 + M2:1 + M3:3</text>
  <text x="475" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>

  <rect x="80" y="270" width="420" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="284" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20</text>
  <text x="210" y="284" text-anchor="middle" font-size="9.5" fill="#333">NewYork FC</text>
  <text x="345" y="284" text-anchor="middle" font-size="9.5" fill="#555">M1:0 + M4:3</text>
  <text x="475" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <rect x="80" y="290" width="420" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="304" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">30</text>
  <text x="210" y="304" text-anchor="middle" font-size="9.5" fill="#333">Atlanta FC</text>
  <text x="345" y="304" text-anchor="middle" font-size="9.5" fill="#555">M2:1 + M4:0 + M5:0</text>
  <text x="475" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <rect x="80" y="310" width="420" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="324" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">40</text>
  <text x="210" y="324" text-anchor="middle" font-size="9.5" fill="#333">Chicago FC</text>
  <text x="345" y="324" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">无比赛 → LEFT JOIN 补 0</text>
  <text x="475" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <rect x="80" y="330" width="420" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="344" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">50</text>
  <text x="210" y="344" text-anchor="middle" font-size="9.5" fill="#333">Toronto FC</text>
  <text x="345" y="344" text-anchor="middle" font-size="9.5" fill="#555">M3:0 + M5:3</text>
  <text x="475" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <line x1="150" y1="250" x2="150" y2="350" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="250" x2="270" y2="350" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="445" y1="250" x2="445" y2="350" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow down to final ordered output -->
  <path d="M290 352 L290 376" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="370" font-size="9.5" fill="#b85450">ORDER BY num_points DESC, team_id ASC</text>

  <!-- Section 3: final output -->
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终输出（积分降序，同分按 team_id 升序）</text>

  <rect x="140" y="398" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="413" font-size="9.5" fill="#446688" font-weight="bold">team_id</text>
  <text x="265" y="413" font-size="9.5" fill="#333" font-weight="bold">team_name</text>
  <text x="400" y="413" font-size="9.5" fill="#b85450" font-weight="bold">num_points</text>
  <line x1="200" y1="398" x2="200" y2="420" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="355" y1="398" x2="355" y2="420" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="140" y="420" width="300" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="431" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">10</text>
  <text x="278" y="431" text-anchor="middle" font-size="9" fill="#333">Leetcode FC</text>
  <text x="400" y="431" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">7</text>

  <rect x="140" y="436" width="300" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="447" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">20</text>
  <text x="278" y="447" text-anchor="middle" font-size="9" fill="#333">NewYork FC</text>
  <text x="400" y="447" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>

  <rect x="140" y="452" width="300" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="463" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">50</text>
  <text x="278" y="463" text-anchor="middle" font-size="9" fill="#333">Toronto FC</text>
  <text x="400" y="463" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>

  <rect x="140" y="468" width="300" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="479" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">30</text>
  <text x="278" y="479" text-anchor="middle" font-size="9" fill="#333">Atlanta FC</text>
  <text x="400" y="479" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>

  <rect x="140" y="484" width="300" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="495" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">40</text>
  <text x="278" y="495" text-anchor="middle" font-size="9" fill="#333">Chicago FC</text>
  <text x="400" y="495" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>

  <line x1="200" y1="420" x2="200" y2="500" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="355" y1="420" x2="355" y2="500" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- tie note -->
  <text x="430" y="447" font-size="9" fill="#d6a040" font-weight="bold">← 同分 3</text>
  <text x="430" y="463" font-size="9" fill="#d6a040" font-weight="bold">  team_id 升序</text>
</svg>
