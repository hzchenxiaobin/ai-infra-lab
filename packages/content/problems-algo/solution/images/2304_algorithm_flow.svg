<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：逐行 DP，每格枚举上一行所有列取最小</text>

  <!-- Step 1: init row 0 -->
  <rect x="60" y="54" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="72" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 初始化</text>
  <text x="78" y="89" font-size="12" fill="#333" filter="url(#rough2)">dp[0][j] = grid[0][j]  （第一行各格代价 = 自身值）</text>

  <line x1="270" y1="98" x2="270" y2="116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop rows -->
  <rect x="60" y="116" width="420" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="134" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 遍历每一行 i = 1 … m-1</text>

  <!-- inner: for each j -->
  <rect x="84" y="144" width="380" height="40" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="161" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">对每个 j = 0 … n-1：</text>
  <text x="100" y="177" font-size="11" fill="#333" filter="url(#rough2)">扫 k=0..n-1 求 best = min(dp[i-1][k] + moveCost[ grid[i-1][k] ][j])</text>

  <!-- inner: store -->
  <rect x="84" y="190" width="380" height="40" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="207" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">写入 dp[i][j]：</text>
  <text x="100" y="223" font-size="11" fill="#333" filter="url(#rough2)">dp[i][j] = grid[i][j] + best  （滚动数组只留两行）</text>

  <line x1="270" y1="236" x2="270" y2="254" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: answer -->
  <rect x="60" y="254" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="272" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 取答案</text>
  <text x="78" y="289" font-size="12" fill="#333" filter="url(#rough2)">答案 = min_j  dp[m-1][j]  （最后一行各格最小者）</text>

  <line x1="270" y1="298" x2="270" y2="316" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="120" y="316" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return 答案</text>

  <!-- right-side complexity note -->
  <text x="492" y="180" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每格 O(n)</text>
  <text x="492" y="196" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">整行 O(n²)</text>
  <text x="492" y="212" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">共 O(m·n²)</text>
</svg>
