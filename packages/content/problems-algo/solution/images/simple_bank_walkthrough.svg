<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：初始 [10, 100, 20, 50, 30]，黄格=本轮变动，红框=校验失败</text>

  <!-- Header row -->
  <rect x="20" y="40" width="560" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="35" y="58" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">步</text>
  <text x="135" y="58" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">操作</text>
  <text x="250" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户1</text>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户2</text>
  <text x="370" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户3</text>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户4</text>
  <text x="490" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户5</text>
  <text x="555" y="58" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">结果</text>

  <!-- Column separators for balances -->
  <line x1="220" y1="40" x2="220" y2="298" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="68" x2="280" y2="298" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="68" x2="340" y2="298" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="68" x2="400" y2="298" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="68" x2="460" y2="298" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="520" y1="40" x2="520" y2="298" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row separators -->
  <line x1="20" y1="108" x2="580" y2="108" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="148" x2="580" y2="148" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="188" x2="580" y2="188" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="228" x2="580" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="268" x2="580" y2="268" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 0: init (y center 88) ===== -->
  <text x="35" y="92" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="30" y="92" font-size="11" fill="#333">init</text>
  <rect x="220" y="68" width="300" height="40" fill="none" stroke="none"/>
  <text x="250" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="310" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">100</text>
  <text x="370" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <text x="430" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">50</text>
  <text x="490" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">30</text>
  <text x="555" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- ===== Row 1: withdraw(3,10) → account3: 20→10 (y center 128) ===== -->
  <text x="35" y="132" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="30" y="132" font-size="11" fill="#333">withdraw(3,10)</text>
  <text x="250" y="132" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="310" y="132" text-anchor="middle" font-size="12" fill="#333">100</text>
  <rect x="340" y="112" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="132" text-anchor="middle" font-size="12" fill="#a87a26" font-weight="bold">10</text>
  <text x="430" y="132" text-anchor="middle" font-size="12" fill="#333">50</text>
  <text x="490" y="132" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="555" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 2: transfer(5,1,20) → acc5: 30→10, acc1: 10→30 (y center 168) ===== -->
  <text x="35" y="172" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="30" y="172" font-size="11" fill="#333">transfer(5,1,20)</text>
  <rect x="220" y="152" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="172" text-anchor="middle" font-size="12" fill="#a87a26" font-weight="bold">30</text>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="#333">100</text>
  <text x="370" y="172" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#333">50</text>
  <rect x="460" y="152" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="172" text-anchor="middle" font-size="12" fill="#a87a26" font-weight="bold">10</text>
  <text x="555" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 3: deposit(5,20) → acc5: 10→30 (y center 208) ===== -->
  <text x="35" y="212" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="30" y="212" font-size="11" fill="#333">deposit(5,20)</text>
  <text x="250" y="212" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="310" y="212" text-anchor="middle" font-size="12" fill="#333">100</text>
  <text x="370" y="212" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#333">50</text>
  <rect x="460" y="192" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="12" fill="#a87a26" font-weight="bold">30</text>
  <text x="555" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 4: transfer(3,4,15) → acc3 余额 10 < 15, false (y center 248) ===== -->
  <text x="35" y="252" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="30" y="252" font-size="11" fill="#333">transfer(3,4,15)</text>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="310" y="252" text-anchor="middle" font-size="12" fill="#333">100</text>
  <rect x="340" y="232" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">10</text>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#333">50</text>
  <text x="490" y="252" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="555" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- ===== Row 5: withdraw(10,50) → 账户10不存在, false (y center 288) ===== -->
  <text x="35" y="292" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="30" y="292" font-size="11" fill="#333">withdraw(10,50)</text>
  <text x="250" y="292" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#333">100</text>
  <text x="370" y="292" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#333">50</text>
  <text x="490" y="292" text-anchor="middle" font-size="12" fill="#333">30</text>
  <text x="555" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- Bottom note -->
  <rect x="40" y="312" width="520" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="11" fill="#555">第 4 步：账户 3 余额 10 &lt; 转账额 15 → 闸门②拦截；第 5 步：账户 10 &gt; n=5 → 闸门①拦截</text>
</svg>
