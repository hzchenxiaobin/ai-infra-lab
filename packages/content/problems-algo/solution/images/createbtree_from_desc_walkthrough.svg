<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="620" fill="#fdfcf7"/>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：5 条边逐条消化 → 根自动浮现</text>
  <path d="M 240 40 Q 460 48 680 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <text x="40" y="68" font-size="12" fill="#666">输入：descriptions = [[20,15,1],[20,17,0],[50,20,1],[50,80,0],[80,19,1]]</text>

  <!-- ===== 表头 ===== -->
  <g filter="url(#sk)"><rect x="30" y="80" width="860" height="24" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="50" y="96" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="120" y="96" font-size="11" fill="#555" font-weight="bold">当前边</text>
  <text x="290" y="96" font-size="11" fill="#555" font-weight="bold">nodes（新增高亮）</text>
  <text x="640" y="96" font-size="11" fill="#555" font-weight="bold">children 集合</text>
  <text x="820" y="96" font-size="11" fill="#555" font-weight="bold">动作</text>

  <!-- 步骤 1 -->
  <g filter="url(#sk)"><rect x="30" y="108" width="860" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/></g>
  <text x="50" y="129" font-size="12" fill="#2b6e9e" font-weight="bold">①</text>
  <text x="120" y="129" font-size="11" fill="#444">[20, 15, 1]</text>
  <text x="290" y="129" font-size="11" fill="#444">{ <tspan fill="#b85450" font-weight="bold">20</tspan>, <tspan fill="#b85450" font-weight="bold">15</tspan> }</text>
  <text x="640" y="129" font-size="11" fill="#2e6e2e">{ 15 }</text>
  <text x="820" y="129" font-size="11" fill="#888">20.left=15</text>

  <!-- 步骤 2 -->
  <g filter="url(#sk)"><rect x="30" y="144" width="860" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/></g>
  <text x="50" y="165" font-size="12" fill="#2b6e9e" font-weight="bold">②</text>
  <text x="120" y="165" font-size="11" fill="#444">[20, 17, 0]</text>
  <text x="290" y="165" font-size="11" fill="#444">{ 20, 15, <tspan fill="#b85450" font-weight="bold">17</tspan> }</text>
  <text x="640" y="165" font-size="11" fill="#2e6e2e">{ 15, 17 }</text>
  <text x="820" y="165" font-size="11" fill="#888">20.right=17</text>

  <!-- 步骤 3 -->
  <g filter="url(#sk)"><rect x="30" y="180" width="860" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="50" y="201" font-size="12" fill="#7a5415" font-weight="bold">③</text>
  <text x="120" y="201" font-size="11" fill="#444">[50, 20, 1]</text>
  <text x="290" y="201" font-size="11" fill="#444">{ <tspan fill="#b85450" font-weight="bold">50</tspan>, 20, 15, 17 }</text>
  <text x="640" y="201" font-size="11" fill="#2e6e2e">{ 15, 17, <tspan fill="#b85450" font-weight="bold">20</tspan> }</text>
  <text x="820" y="201" font-size="11" fill="#888">50.left=20</text>

  <!-- 步骤 4 -->
  <g filter="url(#sk)"><rect x="30" y="216" width="860" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/></g>
  <text x="50" y="237" font-size="12" fill="#2b6e9e" font-weight="bold">④</text>
  <text x="120" y="237" font-size="11" fill="#444">[50, 80, 0]</text>
  <text x="290" y="237" font-size="11" fill="#444">{ 50, 20, 15, 17, <tspan fill="#b85450" font-weight="bold">80</tspan> }</text>
  <text x="640" y="237" font-size="11" fill="#2e6e2e">{ 15, 17, 20, 80 }</text>
  <text x="820" y="237" font-size="11" fill="#888">50.right=80</text>

  <!-- 步骤 5 -->
  <g filter="url(#sk)"><rect x="30" y="252" width="860" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/></g>
  <text x="50" y="273" font-size="12" fill="#2b6e9e" font-weight="bold">⑤</text>
  <text x="120" y="273" font-size="11" fill="#444">[80, 19, 1]</text>
  <text x="290" y="273" font-size="11" fill="#444">{ 50, 20, 15, 17, 80, <tspan fill="#b85450" font-weight="bold">19</tspan> }</text>
  <text x="640" y="273" font-size="11" fill="#2e6e2e">{ 15, 17, 20, 80, 19 }</text>
  <text x="820" y="273" font-size="11" fill="#888">80.left=19</text>

  <!-- 找根 -->
  <g filter="url(#sk)"><rect x="30" y="288" width="860" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="50" y="309" font-size="12" fill="#b85450" font-weight="bold">找根</text>
  <text x="120" y="309" font-size="11" fill="#444">—</text>
  <text x="290" y="309" font-size="11" fill="#444">6 个节点（|nodes|）</text>
  <text x="640" y="309" font-size="11" fill="#2e6e2e">5 个 child（|children|）</text>
  <text x="820" y="309" font-size="11" fill="#b85450" font-weight="bold">根=50 ✓</text>

  <!-- ===== 底部最终树 ===== -->
  <text x="40" y="350" font-size="13" font-weight="bold" fill="#2b6e9e">最终构造结果（层序 = [50, 20, 80, 15, 17, 19]）：</text>

  <!-- root 50 -->
  <circle cx="460" cy="392" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="460" y="398" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">50</text>
  <text x="492" y="388" font-size="11" fill="#b85450" font-weight="bold">← 根</text>
  <text x="492" y="402" font-size="10" fill="#b85450">(∉ children)</text>

  <!-- 50.left -> 20 -->
  <line x1="446" y1="408" x2="406" y2="442" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="412" y="430" font-size="10" fill="#446688" font-weight="bold">L</text>
  <circle cx="394" cy="456" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="394" y="461" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">20</text>

  <!-- 50.right -> 80 -->
  <line x1="474" y1="408" x2="514" y2="442" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="510" y="430" font-size="10" fill="#4a7a3a" font-weight="bold">R</text>
  <circle cx="526" cy="456" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="526" y="461" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">80</text>

  <!-- 20.left -> 15 -->
  <line x1="380" y1="470" x2="350" y2="504" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <circle cx="338" cy="518" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="338" y="523" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">15</text>

  <!-- 20.right -> 17 -->
  <line x1="408" y1="470" x2="436" y2="504" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <circle cx="448" cy="518" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="448" y="523" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">17</text>

  <!-- 80.left -> 19 -->
  <line x1="514" y1="470" x2="486" y2="504" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <circle cx="474" cy="518" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="474" y="523" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">19</text>

  <!-- 步骤 3 标注：20 此前已建 -->
  <path d="M 394 478 Q 250 470 140 232" stroke="#7a5415" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="120" y="556" width="680" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#sk)"/>
  <text x="460" y="576" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">洞察：步骤③ 中 20 既已在 nodes 中，直接复用同一对象 → 任意顺序读边都对</text>
  <text x="460" y="590" text-anchor="middle" font-size="11" fill="#7a5415">|nodes| = 6，|children| = 5 → 差集恰为根 50，无需额外遍历树</text>
</svg>
