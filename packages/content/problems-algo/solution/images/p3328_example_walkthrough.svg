<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：4 个州过双闸门，California 一票未得被拦下</text>

  <rect x="34" y="36" width="106" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">state</text>
  <rect x="142" y="36" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">总数</text>
  <rect x="188" y="36" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">首字母逐行记账</text>
  <rect x="350" y="36" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">count</text>
  <rect x="432" y="36" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">双闸门判定</text>

  <rect x="34" y="60" width="106" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="81" font-size="8.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">Pennsylvania(P)</text>
  <rect x="142" y="60" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="81" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="60" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="75" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">P P P → 1+1+1</text>
  <text x="268" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">全部命中！</text>
  <rect x="350" y="60" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="81" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="432" y="60" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="75" text-anchor="middle" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">3≥3 ✓ 3≥1 ✓</text>
  <text x="477" y="88" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">过 ✓</text>

  <rect x="34" y="98" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="119" font-size="8.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Texas(T)</text>
  <rect x="142" y="98" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="119" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="98" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="113" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">T T T D → 1+1+1+0</text>
  <text x="268" y="126" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">Dallas 不进账但不出局</text>
  <rect x="350" y="98" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="119" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="432" y="98" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="113" text-anchor="middle" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">4≥3 ✓ 3≥1 ✓</text>
  <text x="477" y="126" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">过 ✓</text>

  <rect x="34" y="136" width="106" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="157" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">New York(N)</text>
  <rect x="142" y="136" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="157" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="136" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="151" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">N N B R → 1+1+0+0</text>
  <text x="268" y="164" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">Buffalo/Rochester 不匹配</text>
  <rect x="350" y="136" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="157" text-anchor="middle" font-size="10" fill="#8a6a10" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="432" y="136" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="151" text-anchor="middle" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">4≥3 ✓ 2≥1 ✓</text>
  <text x="477" y="164" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">过 ✓</text>

  <rect x="34" y="174" width="106" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="195" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">California(C)</text>
  <rect x="142" y="174" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="195" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="174" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="189" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">S S S L → 0+0+0+0</text>
  <text x="268" y="202" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">没有 'C' 开头的城市！</text>
  <rect x="350" y="174" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="195" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="432" y="174" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="189" text-anchor="middle" font-size="8.5" fill="#8a3030" filter="url(#rough2)">4≥3 ✓ 0≥1 ✗</text>
  <text x="477" y="202" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">拦下 ✗</text>

  <path d="M 278 216 L 278 232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="228" font-size="9" fill="#446688" filter="url(#rough2)">ORDER BY count DESC, state ASC</text>

  <rect x="34" y="236" width="488" height="120" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="278" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终输出（3 行）</text>
  <text x="52" y="272" font-size="8.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">Pennsylvania</text>
  <text x="140" y="272" font-size="8.5" fill="#333" filter="url(#rough2)">Philadelphia, Pittsburgh, Pottstown</text>
  <text x="504" y="272" text-anchor="end" font-size="9" fill="#8a3030" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="52" y="290" font-size="8.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Texas</text>
  <text x="140" y="290" font-size="8.5" fill="#333" filter="url(#rough2)">Dallas, Taylor, Temple, Tyler</text>
  <text x="504" y="290" text-anchor="end" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="52" y="308" font-size="8.5" fill="#8a6a10" font-weight="bold" filter="url(#rough2)">New York</text>
  <text x="140" y="308" font-size="8.5" fill="#333" filter="url(#rough2)">Buffalo, Newark, New York City, Rochester</text>
  <text x="504" y="308" text-anchor="end" font-size="9" fill="#8a6a10" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 440 268 C 462 258 462 292 444 286" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="392" y="330" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">↑ Pennsylvania 与 Texas 同为 3：平局靠州名升序 P &lt; T 分先后</text>
  <text x="278" y="349" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">串内城市按字典序：输入 Tyler, Temple, Taylor, Dallas → 输出 Dallas, Taylor, Temple, Tyler</text>
</svg>
