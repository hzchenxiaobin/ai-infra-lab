<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：order = [2, 1, 4, 3]</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#888">逐步追踪前驱 p、后继 s 与深度递推</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="54" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步</text>

  <rect x="74" y="54" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">v</text>

  <rect x="128" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前驱 p</text>

  <rect x="188" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">后继 s</text>

  <rect x="248" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="72" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">d[p]</text>

  <rect x="308" y="54" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="72" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">d[s]</text>

  <rect x="368" y="54" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="72" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">depth[v]</text>

  <rect x="472" y="54" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="537" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">BST 结构</text>

  <!-- ===== Row 1: Insert 2 ===== -->
  <rect x="20" y="86" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="104" text-anchor="middle" font-size="11" fill="#888">1</text>

  <rect x="74" y="86" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <rect x="128" y="86" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="104" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <rect x="188" y="86" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="104" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <rect x="248" y="86" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="104" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <rect x="308" y="86" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="104" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <rect x="368" y="86" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="104" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">1</text>

  <rect x="472" y="86" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="537" y="104" text-anchor="middle" font-size="11" fill="#333">2（根）</text>

  <!-- ===== Row 2: Insert 1 ===== -->
  <rect x="20" y="118" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="136" text-anchor="middle" font-size="11" fill="#888">2</text>

  <rect x="74" y="118" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <rect x="128" y="118" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="136" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <rect x="188" y="118" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="216" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="248" y="118" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="136" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <rect x="308" y="118" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="336" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="368" y="118" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="136" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">1+max(0,1)=2</text>

  <rect x="472" y="118" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="537" y="136" text-anchor="middle" font-size="11" fill="#333">2 ← 1</text>

  <!-- ===== Row 3: Insert 4 ===== -->
  <rect x="20" y="150" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="168" text-anchor="middle" font-size="11" fill="#888">3</text>

  <rect x="74" y="150" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="168" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <rect x="128" y="150" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="188" y="150" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="168" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <rect x="248" y="150" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="308" y="150" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="168" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <rect x="368" y="150" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="168" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">1+max(1,0)=2</text>

  <rect x="472" y="150" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="537" y="168" text-anchor="middle" font-size="11" fill="#333">2 → 4</text>

  <!-- ===== Row 4: Insert 3 (key step) ===== -->
  <rect x="20" y="182" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="45" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <rect x="74" y="182" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <rect x="128" y="182" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="188" y="182" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="200" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">4</text>

  <rect x="248" y="182" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="200" text-anchor="middle" font-size="11" fill="#888">1</text>

  <rect x="308" y="182" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="200" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>

  <rect x="368" y="182" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1+max(1,2)=3</text>

  <rect x="472" y="182" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="537" y="200" text-anchor="middle" font-size="11" fill="#333">4 ← 3</text>

  <!-- Arrow indicating s=4 is deeper -->
  <path d="M 336 214 L 336 224" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="336" y="236" text-anchor="middle" font-size="9" fill="#b85450">↑ s 更深 → v 挂在 s 下</text>

  <!-- ===== Result ===== -->
  <rect x="120" y="252" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终 BST：2 → 4 → 3，深度 = 3 ✓</text>

  <!-- ===== Mini tree visualization ===== -->
  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">最终 BST 结构</text>

  <!-- Root 2 -->
  <circle cx="310" cy="328" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="333" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="334" y="332" font-size="9" fill="#888">d=1</text>

  <!-- Left child 1 -->
  <path d="M 298 342 L 268 358" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="258" cy="368" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="372" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- Right child 4 -->
  <path d="M 322 342 L 352 358" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="362" cy="368" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="362" y="373" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="386" y="372" font-size="9" fill="#446688">d=2</text>

  <!-- 4's left child 3 (deepest) -->
  <path d="M 350 384 L 326 394" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="316" cy="404" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="316" y="409" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="340" y="408" font-size="9" fill="#b85450" font-weight="bold">d=3</text>
</svg>
