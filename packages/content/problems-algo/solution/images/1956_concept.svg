<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：曼哈顿菱形 ⟶ (u,v) 轴对齐正方形</text>

  <!-- ===== Left: (x,y) plane with diamond ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">(x, y) 平面：L1 菱形</text>

  <!-- axes -->
  <path d="M 40 300 L 250 300" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 70 330 L 70 120" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="252" y="316" font-size="11" fill="#888">x</text>
  <text x="58" y="116" font-size="11" fill="#888">y</text>

  <!-- Diamond centered at (cx,cy) representing Manhattan ball radius t -->
  <!-- center pixel (140, 210), half-diagonal 50 -->
  <path d="M 140 160 L 190 210 L 140 260 L 90 210 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center point -->
  <circle cx="140" cy="210" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="148" y="206" font-size="11.5" fill="#b85450" font-weight="bold">(x_i, y_i)</text>

  <!-- radius labels along diagonals -->
  <text x="168" y="180" font-size="10.5" fill="#446688">t</text>
  <text x="110" y="240" font-size="10.5" fill="#446688">t</text>

  <!-- a point p inside -->
  <circle cx="120" cy="200" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="96" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">p(a,b)</text>

  <!-- formula under left -->
  <rect x="42" y="346" width="196" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="366" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">感染条件</text>
  <text x="140" y="384" text-anchor="middle" font-size="11.5" fill="#555">|a−x_i| + |b−y_i| ≤ t</text>

  <!-- ===== Middle: transform arrow ===== -->
  <text x="280" y="200" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">令</text>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#555">u = x+y</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#555">v = x−y</text>
  <path d="M 252 248 L 308 248" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- identity box -->
  <rect x="238" y="262" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">恒等式</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a">L1 = L∞</text>

  <!-- ===== Right: (u,v) plane with square ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">(u, v) 平面：L∞ 正方形</text>

  <!-- axes -->
  <path d="M 330 300 L 540 300" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 360 330 L 360 120" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="542" y="316" font-size="11" fill="#888">u</text>
  <text x="348" y="116" font-size="11" fill="#888">v</text>

  <!-- axis-aligned square: center (430,210), side 100 (half=50) -->
  <rect x="380" y="160" width="100" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <!-- center -->
  <circle cx="430" cy="210" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="438" y="206" font-size="11.5" fill="#b85450" font-weight="bold">(u_i, v_i)</text>

  <!-- half-side labels -->
  <text x="428" y="156" text-anchor="middle" font-size="10.5" fill="#446688">t</text>
  <text x="372" y="214" font-size="10.5" fill="#446688">t</text>

  <!-- transformed point p' inside -->
  <circle cx="415" cy="200" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="392" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">p'</text>

  <!-- formula under right -->
  <rect x="332" y="346" width="196" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="366" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">转化为（同一条件）</text>
  <text x="430" y="384" text-anchor="middle" font-size="11" fill="#555">max(|u−u_i|, |v−v_i|) ≤ t</text>

  <!-- bottom note -->
  <path d="M 40 410 L 540 410" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#888">菱形相交 ⟺ 正方形重叠；n 颗正方形重叠 ≥k 即答案</text>
</svg>
