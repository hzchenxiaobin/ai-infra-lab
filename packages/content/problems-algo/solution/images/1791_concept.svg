<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">星形图：一个中心 + n−1 条辐条</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">中心度数 = n−1（出现在每条边），叶子度数 = 1（只出现一次）</text>

  <!-- Star graph: center at (170, 180), leaves around -->
  <!-- Edges (drawn first, behind nodes) -->
  <!-- center (170,180) to leaf1 (90,90) -->
  <line x1="170" y1="180" x2="90" y2="100" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center to leaf2 (260,90) -->
  <line x1="170" y1="180" x2="260" y2="100" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center to leaf3 (90,260) -->
  <line x1="170" y1="180" x2="90" y2="262" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center to leaf4 (260,260) -->
  <line x1="170" y1="180" x2="260" y2="262" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- center to leaf5 (340,180) -->
  <line x1="170" y1="180" x2="335" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Center node (highlighted orange) -->
  <circle cx="170" cy="180" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="170" y="186" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="170" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中心 · 度数 4</text>

  <!-- Leaf nodes (blue) -->
  <circle cx="90" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="12" fill="#333">1</text>

  <circle cx="260" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#333">3</text>

  <circle cx="90" cy="262" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="267" text-anchor="middle" font-size="12" fill="#333">4</text>

  <circle cx="260" cy="262" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" fill="#333">5</text>

  <circle cx="335" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="185" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- Leaf degree annotation -->
  <text x="58" y="92" font-size="9.5" fill="#446688">度数 1</text>

  <!-- Right side: degree table -->
  <text x="385" y="78" font-size="11" fill="#444" font-weight="bold">度数统计</text>

  <rect x="385" y="88" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="103" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="421" y="88" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="103" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n−1</text>

  <rect x="385" y="116" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="131" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="421" y="116" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="131" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="385" y="144" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="159" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="421" y="144" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="159" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="385" y="172" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="187" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="421" y="172" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="187" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="385" y="200" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="215" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="421" y="200" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="215" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="385" y="228" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="243" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="421" y="228" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="243" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="402" y="74" text-anchor="middle" font-size="9" fill="#888">节点</text>
  <text x="446" y="74" text-anchor="middle" font-size="9" fill="#888">度数</text>

  <!-- Key insight box -->
  <rect x="40" y="278" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键观察：中心出现在每一条边里</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#555">→ 任意两条边必有且仅有一个公共端点，那就是中心</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555">→ 只看前两条边即可定位，无需统计全部度数</text>
</svg>
