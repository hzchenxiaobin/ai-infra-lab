<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：选整个数组 ⇒ 单值广播，一步全相等</text>

  <!-- 原数组 -->
  <text x="92" y="90" text-anchor="end" font-size="14" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="104" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="184" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="240" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="296" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 整段括号 -->
  <path d="M 104 114 L 104 122 L 320 122 L 320 114" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="142" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">选整个子数组 l = 0, r = n−1</text>

  <path d="M 212 150 L 212 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- T 框 -->
  <rect x="140" y="170" width="144" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="212" y="193" text-anchor="middle" font-size="14" fill="#b3541e" font-weight="bold" filter="url(#rough2)">T = 5&amp;3&amp;6&amp;5 = 0</text>

  <!-- 广播箭头 -->
  <path d="M 212 206 L 130 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 212 206 L 186 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 212 206 L 238 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 212 206 L 294 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 结果数组 -->
  <rect x="104" y="254" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="254" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="254" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="254" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="279" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="184" y="279" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="240" y="279" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="296" y="279" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="212" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">每个位置 ← 同一个 T ⇒ 一次操作后全部相等！</text>
  <text x="212" y="346" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">T ≤ min(nums)，且可能不在原数组中（如 [1,2] → 0）</text>
</svg>
