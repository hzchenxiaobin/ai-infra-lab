<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建映射 → 单趟扫描 → 查表判定 → 追加跳过</text>

  <!-- Start -->
  <rect x="180" y="40" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">建映射 idx2op；j=0；res=[]</text>
  <path d="M 310 74 L 310 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Dec1: j < n ? -->
  <rect x="230" y="100" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j &lt; n ?</text>
  <!-- No branch -> return -->
  <path d="M 390 120 L 440 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="114" font-size="10" fill="#888">否</text>
  <rect x="440" y="103" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="520" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 join(res)</text>
  <!-- Yes branch -->
  <text x="318" y="152" font-size="10" fill="#888">是</text>
  <path d="M 310 140 L 310 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Dec2: j in idx2op 且 s[j:j+L]==src ? -->
  <rect x="170" y="168" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j 在 idx2op 中 且</text>
  <text x="310" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[j:j+L] == sources[op] ?</text>
  <!-- No branch -> append original -->
  <text x="456" y="186" font-size="10" fill="#888">否</text>
  <path d="M 450 196 L 490 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="176" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="550" y="194" text-anchor="middle" font-size="11" fill="#333">res += s[j]</text>
  <text x="550" y="210" text-anchor="middle" font-size="11" fill="#333">j += 1</text>
  <!-- Yes branch -->
  <text x="318" y="244" font-size="10" fill="#888">是</text>
  <path d="M 310 224 L 310 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes box: append target -->
  <rect x="170" y="252" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="272" text-anchor="middle" font-size="11" fill="#333">res += targets[op]</text>
  <text x="310" y="288" text-anchor="middle" font-size="11" fill="#333">j += len(sources[op])</text>

  <!-- loop back: Yes-box (left side) -->
  <path d="M 170 274 L 120 274 L 120 96 L 308 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="70" y="186" font-size="10" fill="#888">回到 j&lt;n</text>

  <!-- loop back: No-box (right side, x=610 to avoid Return box) -->
  <path d="M 610 198 L 610 96 L 312 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="556" y="150" font-size="10" fill="#888">回到 j&lt;n</text>

  <!-- footer note -->
  <rect x="60" y="330" width="500" height="58" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键细节</text>
  <text x="310" y="370" text-anchor="middle" font-size="11" fill="#333">匹配成功时 j 跳过 len(source) 而非 len(target)；</text>
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#333">所有判定始终基于原串 s，故各操作互不干扰 = "同时"。</text>

  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#888">单趟扫描 O(n) + k 次查表判定，整体 O(n + k·L) / O(k) 额外空间</text>
</svg>
