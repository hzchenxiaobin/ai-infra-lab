<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四步走完，全在 Proxy get 一步里</text>

  <!-- Step 1: call -->
  <rect x="130" y="46" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 调用 obj.&lt;prop&gt;()</text>
  <text x="260" y="84" text-anchor="middle" font-size="10.5" fill="#888">调用方发起属性访问 + 函数调用</text>

  <path d="M 260 96 L 260 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Proxy get intercept -->
  <rect x="110" y="128" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② Proxy get(target, prop) 拦截</text>
  <text x="260" y="168" text-anchor="middle" font-size="10.5" fill="#888">捕获属性名 prop，无论它叫什么</text>

  <path d="M 260 186 L 260 214" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: return closure -->
  <rect x="130" y="218" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ return () =&gt; prop</text>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#888">返回一个闭包，捕获 prop 名</text>

  <path d="M 260 276 L 260 304" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: invoke + return -->
  <rect x="110" y="308" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 调用方执行返回的函数 ()</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 得到 prop 字符串</text>

  <path d="M 260 366 L 260 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="260" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 = 方法名本身</text>
</svg>
