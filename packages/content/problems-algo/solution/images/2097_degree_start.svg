<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">按度数找起点：out − in = 1 即欧拉路径起点</text>
  <path d="M 175 44 Q 360 52 545 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="360" y="76" text-anchor="middle" font-size="12" fill="#666">示例 1 各节点出入度统计</text>

  <!-- degree table -->
  <!-- header -->
  <g filter="url(#rough2)"><rect x="180" y="96" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="230" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">节点</text>
  <g filter="url(#rough2)"><rect x="280" y="96" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="330" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">out</text>
  <g filter="url(#rough2)"><rect x="380" y="96" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="430" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">in</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="530" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">out−in</text>

  <!-- row 11 (start) -->
  <g filter="url(#rough2)"><rect x="180" y="128" width="100" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="230" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">11</text>
  <g filter="url(#rough2)"><rect x="280" y="128" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="148" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="380" y="128" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#444">0</text>
  <g filter="url(#rough2)"><rect x="480" y="128" width="100" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="530" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">+1 ← 起点</text>

  <!-- row 9 -->
  <g filter="url(#rough2)"><rect x="180" y="158" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="230" y="178" text-anchor="middle" font-size="12" fill="#444">9</text>
  <g filter="url(#rough2)"><rect x="280" y="158" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="178" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="380" y="158" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="430" y="178" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="480" y="158" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="530" y="178" text-anchor="middle" font-size="12" fill="#444">0</text>

  <!-- row 4 -->
  <g filter="url(#rough2)"><rect x="180" y="188" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="230" y="208" text-anchor="middle" font-size="12" fill="#444">4</text>
  <g filter="url(#rough2)"><rect x="280" y="188" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="208" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="380" y="188" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="430" y="208" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="480" y="188" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="530" y="208" text-anchor="middle" font-size="12" fill="#444">0</text>

  <!-- row 5 -->
  <g filter="url(#rough2)"><rect x="180" y="218" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="230" y="238" text-anchor="middle" font-size="12" fill="#444">5</text>
  <g filter="url(#rough2)"><rect x="280" y="218" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="238" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="380" y="218" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="430" y="238" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="480" y="218" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="530" y="238" text-anchor="middle" font-size="12" fill="#444">0</text>

  <!-- row 1 (end) -->
  <g filter="url(#rough2)"><rect x="180" y="248" width="100" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="230" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2b28">1</text>
  <g filter="url(#rough2)"><rect x="280" y="248" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="330" y="268" text-anchor="middle" font-size="12" fill="#444">0</text>
  <g filter="url(#rough2)"><rect x="380" y="248" width="100" height="30" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="1"/></g>
  <text x="430" y="268" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="480" y="248" width="100" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="530" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2b28">−1 ← 终点</text>

  <!-- two cases box -->
  <g filter="url(#rough2)"><rect x="40" y="300" width="320" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">半欧拉路径</text>
  <text x="200" y="346" text-anchor="middle" font-size="11" fill="#444">恰一个 out−in=1（起点）</text>
  <text x="200" y="364" text-anchor="middle" font-size="11" fill="#444">恰一个 in−out=1（终点）</text>
  <text x="200" y="378" text-anchor="middle" font-size="11" fill="#888">→ 从起点出发构造</text>

  <g filter="url(#rough2)"><rect x="380" y="300" width="300" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="530" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">欧拉回路</text>
  <text x="530" y="346" text-anchor="middle" font-size="11" fill="#444">所有节点 out = in</text>
  <text x="530" y="364" text-anchor="middle" font-size="11" fill="#444">起点不唯一</text>
  <text x="530" y="378" text-anchor="middle" font-size="11" fill="#888">→ 从任一有出边的点出发</text>
</svg>
