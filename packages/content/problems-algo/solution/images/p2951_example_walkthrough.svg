<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：mountain = [1, 4, 3, 8, 5]</text>

  <!-- array -->
  <rect x="70" y="46" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="92" y="70" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="122" y="46" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="70" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="174" y="46" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <rect x="226" y="46" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="70" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="278" y="46" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="308" y="70" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>

  <!-- index labels -->
  <text x="92" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="146" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="200" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="254" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="308" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="92" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">首，跳过</text>
  <text x="146" y="116" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 ✓</text>
  <text x="200" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">非峰</text>
  <text x="254" y="116" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 ✓</text>
  <text x="308" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">尾，跳过</text>

  <!-- right note -->
  <text x="352" y="64" font-size="11" fill="#666" filter="url(#rough2)">i = 0 与 i = 4 是首尾元素</text>
  <text x="352" y="82" font-size="11" fill="#666" filter="url(#rough2)">直接跳过，枚举范围 [1, 3]</text>

  <!-- table header -->
  <rect x="44" y="136" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="154" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="148" y="154" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">m[i−1] &lt; m[i] ?</text>
  <text x="276" y="154" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">m[i] &gt; m[i+1] ?</text>
  <text x="368" y="154" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">峰？</text>
  <text x="440" y="154" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1 -->
  <rect x="44" y="164" width="440" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="185" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="148" y="185" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1 &lt; 4 ✓</text>
  <text x="276" y="185" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">4 &gt; 3 ✓</text>
  <text x="368" y="185" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="440" y="185" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[1]</text>

  <!-- row 2 -->
  <rect x="44" y="198" width="440" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="219" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="148" y="219" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4 &lt; 3 ✗</text>
  <text x="276" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">短路，不比</text>
  <text x="368" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[1]</text>

  <!-- row 3 -->
  <rect x="44" y="232" width="440" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="253" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="253" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3 &lt; 8 ✓</text>
  <text x="276" y="253" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">8 &gt; 5 ✓</text>
  <text x="368" y="253" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="440" y="253" text-anchor="middle" font-size="12" fill="#334" font-weight="bold" filter="url(#rough2)">[1, 3]</text>

  <!-- column separators -->
  <line x1="84" y1="136" x2="84" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="212" y1="136" x2="212" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="136" x2="340" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="396" y1="136" x2="396" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第二行：左比较已失败，&amp;&amp; 短路，右邻居不必再看</text>

  <!-- final answer -->
  <rect x="150" y="306" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans = [1, 3]（顺序不限）</text>

  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对照示例 1：[2,4,4] 的唯一候选 i=1 因 4 &gt; 4 不成立被剔除，返回 [ ]</text>
</svg>
