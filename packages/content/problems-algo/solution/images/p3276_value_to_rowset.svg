<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：同值折叠——每个值只需记住「它出现在哪些行」</text>

  <!-- 左：网格 -->
  <text x="120" y="46" text-anchor="middle" font-size="11" fill="#7a6a50" filter="url(#rough2)">示例 1 的网格（同色 = 同值）</text>
  <text x="44" y="78" font-size="10" fill="#888" filter="url(#rough2)">r0</text>
  <text x="44" y="108" font-size="10" fill="#888" filter="url(#rough2)">r1</text>
  <text x="44" y="138" font-size="10" fill="#888" filter="url(#rough2)">r2</text>

  <rect x="56" y="58" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="77" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="100" y="58" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="77" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="144" y="58" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="77" text-anchor="middle" font-size="12" fill="#8a6a1c" filter="url(#rough2)">3</text>

  <rect x="56" y="90" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="109" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">4</text>
  <rect x="100" y="90" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="109" text-anchor="middle" font-size="12" fill="#8a6a1c" filter="url(#rough2)">3</text>
  <rect x="144" y="90" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="109" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>

  <rect x="56" y="122" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="100" y="122" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="144" y="122" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>

  <!-- 中间箭头 -->
  <path d="M 192 100 L 234 100" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="90" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">同值折叠</text>

  <!-- 右：值 -> 行集合 -->
  <text x="368" y="46" text-anchor="middle" font-size="11" fill="#7a6a50" filter="url(#rough2)">折叠后：值 → 行集合（bitmask）</text>

  <rect x="252" y="58" width="32" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">1</text>
  <path d="M 288 71 L 306 71" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="75" font-size="11" fill="#333" filter="url(#rough2)">{r0, r2}</text>
  <text x="424" y="75" font-size="11" fill="#888" filter="url(#rough2)">= 101</text>

  <rect x="252" y="90" width="32" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <path d="M 288 103 L 306 103" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="107" font-size="11" fill="#333" filter="url(#rough2)">{r0, r1}</text>
  <text x="424" y="107" font-size="11" fill="#888" filter="url(#rough2)">= 011</text>

  <rect x="252" y="122" width="32" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1c" filter="url(#rough2)">3</text>
  <path d="M 288 135 L 306 135" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="139" font-size="11" fill="#333" filter="url(#rough2)">{r0, r1}</text>
  <text x="424" y="139" font-size="11" fill="#888" filter="url(#rough2)">= 011</text>

  <rect x="252" y="154" width="32" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3833" filter="url(#rough2)">4</text>
  <path d="M 288 167 L 306 167" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="171" font-size="11" fill="#333" filter="url(#rough2)">{r1}</text>
  <text x="424" y="171" font-size="11" fill="#888" filter="url(#rough2)">= 010</text>

  <!-- 底部要点框 1 -->
  <rect x="36" y="196" width="448" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">约束翻译：① 不同行 → 每行至多被占 1 次；② 值互不相同 → 每个值至多选 1 次</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">列完全没有任何约束——格子的列坐标从头到尾用不上！</text>

  <!-- 底部要点框 2 -->
  <rect x="36" y="258" width="448" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">于是问题 = 二分图最大权匹配：左部 = 去重后的值（点权 = 值本身），右部 = 行</text>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">值 v 能连到行 r ⇔ grid[r] 里出现过 v；目标是选出总权最大的「值–行」配对</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">m ≤ 10 → 行的占用情况压成 bitmask（2^m ≤ 1024 种）→ 状压 DP 登场</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">口诀：状态压「小侧」（行），枚举当「大侧」（值，至多 100 个）</text>
</svg>
