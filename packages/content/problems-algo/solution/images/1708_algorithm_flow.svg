<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：双指针扫描 + 跳跃优化
  </text>

  <!-- Start -->
  <ellipse cx="280" cy="48" rx="36" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M280,62 L280,72" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="215" y="74" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = 0,  i = 1</text>
  <path d="M280,100 L280,110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: i <= n-k? -->
  <polygon points="280,112 350,130 280,148 210,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≤ n − k ?</text>
  <!-- No branch -->
  <path d="M350,130 L408,130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="412" y="117" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="477" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">return nums[best:best+k]</text>
  <!-- Yes branch -->
  <path d="M280,148 L280,160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Diamond 2: nums[i] vs nums[best] -->
  <polygon points="280,162 360,180 280,198 200,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums[i] ? nums[best]</text>

  <!-- Left branch: > -->
  <path d="M200,180 L120,180 L120,198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">＞</text>
  <rect x="62" y="200" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = i</text>
  <text x="120" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i += 1</text>

  <!-- Center branch: = -->
  <path d="M280,198 L280,206" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="11" fill="#d6a040" filter="url(#rough2)">＝</text>
  <rect x="196" y="208" width="168" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">逐位比较 j 位后续</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">＞ → best=i, i++</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">＜ → i += j+1 (跳过!)</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全等 → i++</text>

  <!-- Right branch: < -->
  <path d="M360,180 L440,180 L440,198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">＜</text>
  <rect x="382" y="200" width="116" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i += 1</text>

  <!-- Loop back: from left box bottom → left → up → to diamond 1 left point -->
  <path d="M120,240 L120,300 L30,300 L30,130 L210,130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="215" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循</text>
  <text x="38" y="228" font-size="10" fill="#4a7a3a" filter="url(#rough2)">环</text>

  <!-- Insight box -->
  <rect x="150" y="306" width="340" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    跳跃 i+=j+1 使总比较数 ≤ 2n → O(n) 摊还
  </text>
</svg>
