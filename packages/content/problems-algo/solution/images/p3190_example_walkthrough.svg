<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 3, 4]，一趟数出代价</text>

  <!-- 表头 -->
  <rect x="58" y="58" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="58" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="58" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="58" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="354" y="58" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="58" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="82" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="204" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">r = x mod 3</text>
  <text x="299" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">走到最近倍数</text>
  <text x="379" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">代价</text>
  <text x="436" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累计</text>

  <!-- 行 0：x=1 -->
  <rect x="58" y="94" width="48" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="94" width="58" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="94" width="80" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="94" width="110" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="354" y="94" width="50" height="36" fill="#fff8e1" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="94" width="64" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="135" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="204" y="116" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="299" y="116" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 → 0（−1）</text>
  <text x="379" y="116" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="436" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <!-- 行 1：x=2 -->
  <rect x="58" y="130" width="48" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="130" width="58" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="130" width="80" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="130" width="110" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="354" y="130" width="50" height="36" fill="#fff8e1" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="130" width="64" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="135" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="204" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="299" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 → 3（+1）</text>
  <text x="379" y="152" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="436" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <!-- 行 2：x=3（整除，绿色） -->
  <rect x="58" y="166" width="48" height="36" fill="#e6f4ea" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="166" width="58" height="36" fill="#e6f4ea" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="166" width="80" height="36" fill="#e6f4ea" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="166" width="110" height="36" fill="#e6f4ea" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="354" y="166" width="50" height="36" fill="#e6f4ea" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="166" width="64" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="188" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="135" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="204" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="299" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3（不动）</text>
  <text x="379" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="436" y="188" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <!-- 行 3：x=4 -->
  <rect x="58" y="202" width="48" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="202" width="58" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="202" width="80" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="202" width="110" height="36" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="354" y="202" width="50" height="36" fill="#fff8e1" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="202" width="64" height="36" fill="#fff8e1" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="224" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="135" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="204" y="224" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="299" y="224" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4 → 3（−1）</text>
  <text x="379" y="224" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="436" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 结论 -->
  <rect x="58" y="258" width="410" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="263" y="280" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">最终 ans = 3，恰好是「余数非 0 的元素」1、2、4 的个数</text>
  <text x="263" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">与官方示例的三个操作一一对应 ✓</text>
</svg>
