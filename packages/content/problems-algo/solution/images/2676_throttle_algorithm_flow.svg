<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">节流函数执行流程</text>

  <!-- 起始 -->
  <ellipse cx="280" cy="65" rx="60" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">throttled(...) 被调用</text>

  <line x1="280" y1="87" x2="280" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1: 冷却中? -->
  <polygon points="280,112 390,160 280,208 170,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">timeoutInProgress</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== true?</text>

  <!-- 是 -->
  <line x1="390" y1="160" x2="450" y2="160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="153" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="450" y="140" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nextArgs = args</text>
  <text x="500" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">暂存最新参数</text>

  <!-- 否 -->
  <line x1="280" y1="208" x2="280" y2="232" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="222" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 首沿执行 -->
  <rect x="195" y="234" width="170" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">fn(...args)</text>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">立即执行（leading edge）</text>

  <line x1="280" y1="276" x2="280" y2="300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 开启冷却 -->
  <rect x="175" y="302" width="210" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">timeoutInProgress = true</text>
  <text x="280" y="334" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">setTimeout(trigger, t)</text>

  <line x1="280" y1="344" x2="280" y2="372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分隔线 -->
  <line x1="30" y1="370" x2="530" y2="370" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="35" y="385" font-size="10" fill="#999" filter="url(#rough2)">— 以下为 t ms 后定时器到期的异步路径 —</text>

  <!-- 定时器到期 -->
  <ellipse cx="280" cy="400" rx="70" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">trigger() 定时器到期</text>

  <line x1="280" y1="420" x2="280" y2="432" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2: nextArgs? -->
  <polygon points="280,434 390,460 280,476 170,460" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nextArgs?</text>
</svg>
