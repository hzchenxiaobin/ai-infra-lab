<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">安排会议日程算法流程</text>

  <!-- Start -->
  <rect x="200" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">i = 0, j = 0</text>
  <path d="M 260 74 L 260 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While condition -->
  <polygon points="260,86 380,124 260,162 140,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#444">i &lt; len(s1) 且</text>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#444">j &lt; len(s2) ?</text>
  <path d="M 260 164 L 260 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch -> return [] -->
  <path d="M 380 124 L 430 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="118" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="110" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="465" y="129" text-anchor="middle" font-size="11" fill="#333">return []</text>

  <!-- Yes label -->
  <text x="268" y="176" font-size="11" fill="#4a7a3a">是</text>

  <!-- Compute lo, hi -->
  <rect x="110" y="176" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#333">lo = max(s1[i].start, s2[j].start)</text>
  <text x="260" y="207" text-anchor="middle" font-size="11" fill="#333">hi = min(s1[i].end, s2[j].end)</text>
  <path d="M 260 214 L 260 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- If lo <= hi and hi - lo >= duration -->
  <polygon points="260,226 392,266 260,306 128,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#444">lo ≤ hi 且</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#444">hi − lo ≥ duration ?</text>

  <!-- Yes: return [lo, lo+duration] -->
  <path d="M 128 266 L 60 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="260" font-size="11" fill="#4a7a3a">是</text>
  <rect x="20" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="271" text-anchor="middle" font-size="9" fill="#333">return</text>
  <text x="40" y="294" text-anchor="middle" font-size="8" fill="#4a7a3a">[lo,lo+d]</text>

  <!-- No: skip -->
  <path d="M 392 266 L 460 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="260" font-size="11" fill="#b85450">否</text>
  <rect x="440" y="252" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="271" text-anchor="middle" font-size="10" fill="#333">继续</text>

  <!-- Both paths merge down -->
  <path d="M 470 282 L 470 320 L 260 320" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 308 L 260 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compare ends -->
  <path d="M 260 322 L 260 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="260,334 380,364 260,394 140,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#444">s1[i].end &lt;</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#444">s2[j].end ?</text>

  <!-- i++ -->
  <path d="M 140 364 L 70 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="358" font-size="11" fill="#4a7a3a">是</text>
  <rect x="20" y="350" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="45" y="369" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- j++ -->
  <path d="M 380 364 L 450 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="358" font-size="11" fill="#b85450">否</text>
  <rect x="450" y="350" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="369" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j++</text>

  <!-- Loop back arrows -->
  <path d="M 45 350 L 45 124 L 140 124" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 475 350 L 475 124 L 380 124" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Loop back labels -->
  <text x="52" y="240" font-size="10" fill="#446688" transform="rotate(-90 52 240)">回到循环</text>
  <text x="482" y="240" font-size="10" fill="#4a7a3a" transform="rotate(-90 482 240)">回到循环</text>
</svg>
