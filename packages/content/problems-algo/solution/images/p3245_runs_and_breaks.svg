<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">断点分环：极大交替段 → 大小为 k 的组 = Σ (L−k+1)</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">示例 2：colors = [0,0,1,0,1,1]，n = 6（红 = 0，蓝 = 1）</text>

  <!-- 瓷砖条：x = 81,143,205,267,329,391 宽 48 -->
  <rect x="81" y="56" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="143" y="56" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="205" y="56" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="229" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="267" y="56" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="291" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="329" y="56" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="353" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="391" y="56" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="81" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="105" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="167" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="229" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="291" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="353" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="415" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=5</text>

  <!-- 边状态：断点 ✕ 红，交替 ✓ 绿 -->
  <text x="136" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="198" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="260" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="322" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="384" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✕</text>

  <!-- 环回接缝边 e5 -->
  <path d="M 425 100 C 425 142, 95 142, 95 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">接缝边 (5,0)：1≠0 ✓</text>

  <!-- 极大段 A：tiles 1..4 -->
  <rect x="138" y="158" width="244" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#2f5426" filter="url(#rough2)">极大段 A：tiles 1..4 = 0,1,0,1 → L = 4</text>

  <!-- 极大段 B：tiles 5,0 绕回 -->
  <rect x="386" y="158" width="58" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="178" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#rough2)">段B</text>
  <rect x="76" y="158" width="58" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="178" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#rough2)">段B</text>
  <path d="M 415 190 C 415 216, 105 216, 105 190" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#rough2)">段 B 绕回接缝：tiles 5,0 = 1,0 → L = 2</text>

  <!-- 公式框 -->
  <rect x="55" y="232" width="410" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">answer(k) = Σ (L−k+1)·cnt[L] = S(k) − (k−1)·C(k)</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(k)：段长 ≥ k 的段数　S(k)：这些段的长总和</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 两棵「按段长建索引」的 BIT 各做一次区间和 [k, n]</text>

  <!-- 底部注 -->
  <text x="55" y="330" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k=3：段 A 贡献 4−3+1=2；段 B 的 L=2&lt;3 贡献 0 → 答案 2</text>
  <text x="465" y="330" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">整环无断点（m=0）：答案恒为 n，需特判</text>
  <text x="55" y="348" font-size="9.5" fill="#888" filter="url(#rough2)">注：断点 = 相邻同色的边；段是断点之间的弧，m 个断点恰好切出 m 段（长度和 = n）</text>
</svg>
