<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：脏名归一化 → 同名同日分组计数</text>

  <!-- ===== Left: dirty variants ===== -->
  <text x="80" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">脏数据（大小写混乱）</text>

  <rect x="28" y="74" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">LCPHONE</text>

  <rect x="28" y="116" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">LCPhone</text>

  <rect x="28" y="158" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">LcPhOnE</text>

  <!-- arrows to cleaning box -->
  <path d="M 132 90 L 196 130" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <path d="M 132 132 L 196 132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <path d="M 132 174 L 196 134" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== Middle: cleaning operation ===== -->
  <rect x="200" y="86" width="170" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="285" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① 清洗规则</text>
  <text x="285" y="128" text-anchor="middle" font-size="10" fill="#666">TRIM(去首尾空格)</text>
  <text x="285" y="146" text-anchor="middle" font-size="10" fill="#666">UPPER(首字母)</text>
  <text x="285" y="164" text-anchor="middle" font-size="10" fill="#666">+ LOWER(其余字母)</text>

  <!-- arrow to clean result -->
  <path d="M 370 132 L 420 132" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== Right: clean unified name ===== -->
  <text x="478" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">归一化结果</text>

  <rect x="424" y="116" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="478" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Lcphone</text>

  <!-- ===== Bottom: group & count ===== -->
  <path d="M 478 150 L 478 176" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <rect x="120" y="186" width="320" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② GROUP BY (清洗名, sale_date)</text>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#666">同名同日的多条销售记录折叠成一行</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#666">COUNT(*) AS total</text>

  <!-- ===== Output example ===== -->
  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <rect x="150" y="270" width="260" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="285" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_name</text>
  <text x="318" y="285" text-anchor="middle" font-size="9" fill="white" font-weight="bold">sale_date</text>
  <text x="388" y="285" text-anchor="middle" font-size="9" fill="white" font-weight="bold">total</text>

  <rect x="150" y="292" width="260" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="208" y="306" text-anchor="middle" font-size="9" fill="#333">Lcphone</text>
  <text x="318" y="306" text-anchor="middle" font-size="9" fill="#333">2000-01-16</text>
  <text x="388" y="306" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="150" y="312" width="260" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="208" y="326" text-anchor="middle" font-size="9" fill="#333">Lcphone</text>
  <text x="318" y="326" text-anchor="middle" font-size="9" fill="#333">2000-01-17</text>
  <text x="388" y="326" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="50" y="348" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">脏名（红） → 清洗（橙） → 归一化名（绿）</text>
  <text x="280" y="381" text-anchor="middle" font-size="10" fill="#666">MySQL 无 INITCAP，用 CONCAT(UPPER(LEFT(s,1)), LOWER(SUBSTRING(s,2)))</text>
</svg>
