<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集流程：union(行号, ~列号)</text>

  <!-- Step 1: Init -->
  <rect x="180" y="44" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化空并查集</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#666">parent = {}（哈希表，无需预知范围）</text>
  <line x1="270" y1="86" x2="270" y2="106" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop -->
  <rect x="170" y="106" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每块石头 (x, y)</text>
  <line x1="270" y1="140" x2="270" y2="160" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: union -->
  <rect x="150" y="160" width="240" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">union(x, ~y)</text>
  <text x="270" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a">~y 把列号映射到负数，与行号(≥0)不冲突</text>

  <!-- loop back arrow -->
  <path d="M 390 187 Q 440 187 440 123 Q 440 123 370 123" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="158" font-size="10" fill="#888">下一块</text>

  <line x1="270" y1="214" x2="270" y2="238" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Count roots -->
  <rect x="140" y="238" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">统计 find(x) 的不同值个数</text>
  <text x="270" y="274" text-anchor="middle" font-size="10.5" fill="#666">→ 连通分量数 C</text>
  <line x1="270" y1="286" x2="270" y2="306" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Return -->
  <rect x="190" y="306" width="160" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 n − C</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#888">最大移除数</text>

  <!-- Side note: ~y trick -->
  <rect x="20" y="160" width="120" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">~y 技巧</text>
  <text x="80" y="198" text-anchor="middle" font-size="10" fill="#666">~0 = −1</text>
  <text x="80" y="214" text-anchor="middle" font-size="10" fill="#666">~1 = −2</text>
  <text x="80" y="230" text-anchor="middle" font-size="10" fill="#666">~2 = −3</text>
  <text x="80" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">行 ≥ 0, 列 &lt; 0</text>

  <!-- bottom note -->
  <rect x="100" y="360" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#666">find 中「首次见到即插入」省去显式初始化</text>
</svg>
