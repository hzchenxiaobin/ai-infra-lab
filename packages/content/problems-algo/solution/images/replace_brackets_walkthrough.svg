<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "(a)(a)(a)aaa"，map = {a: "yes"}</text>

  <!-- Map reminder -->
  <rect x="220" y="36" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">map = {"a" → "yes"}</text>

  <!-- Step table header -->
  <rect x="30" y="74" width="580" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="89">步骤</text>
    <text x="180" y="89">扫描片段</text>
    <text x="320" y="89">动作</text>
    <text x="470" y="89">res 累积</text>
    <text x="590" y="89">i</text>
  </g>

  <!-- Row 1: (a) -> yes -->
  <rect x="30" y="96" width="580" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="114" fill="#555" font-weight="bold">①</text>
    <text x="180" y="114" fill="#d6a040" font-weight="bold">(a)</text>
    <text x="320" y="114" fill="#555">遇 '(' 收集键 "a" → 查表</text>
    <text x="470" y="114" fill="#4a7a3a" font-weight="bold">"yes"</text>
    <text x="590" y="114" fill="#888">3</text>
  </g>

  <!-- Row 2: (a) -> yes -->
  <rect x="30" y="124" width="580" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="142" fill="#555" font-weight="bold">②</text>
    <text x="180" y="142" fill="#d6a040" font-weight="bold">(a)</text>
    <text x="320" y="142" fill="#555">遇 '(' 收集键 "a" → 查表</text>
    <text x="470" y="142" fill="#4a7a3a" font-weight="bold">"yesyes"</text>
    <text x="590" y="142" fill="#888">6</text>
  </g>

  <!-- Row 3: (a) -> yes -->
  <rect x="30" y="152" width="580" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="170" fill="#555" font-weight="bold">③</text>
    <text x="180" y="170" fill="#d6a040" font-weight="bold">(a)</text>
    <text x="320" y="170" fill="#555">遇 '(' 收集键 "a" → 查表</text>
    <text x="470" y="170" fill="#4a7a3a" font-weight="bold">"yesyesyes"</text>
    <text x="590" y="170" fill="#888">9</text>
  </g>

  <!-- Row 4: a (plain) -->
  <rect x="30" y="180" width="580" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="198" fill="#555" font-weight="bold">④</text>
    <text x="180" y="198" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="320" y="198" fill="#555">普通字符，直接追加</text>
    <text x="470" y="198" fill="#4a7a3a" font-weight="bold">"yesyesyesa"</text>
    <text x="590" y="198" fill="#888">10</text>
  </g>

  <!-- Row 5: a (plain) -->
  <rect x="30" y="208" width="580" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="226" fill="#555" font-weight="bold">⑤</text>
    <text x="180" y="226" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="320" y="226" fill="#555">普通字符，直接追加</text>
    <text x="470" y="226" fill="#4a7a3a" font-weight="bold">"yesyesyesaa"</text>
    <text x="590" y="226" fill="#888">11</text>
  </g>

  <!-- Row 6: a (plain) -->
  <rect x="30" y="236" width="580" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="60" y="254" fill="#555" font-weight="bold">⑥</text>
    <text x="180" y="254" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="320" y="254" fill="#555">普通字符，直接追加</text>
    <text x="470" y="254" fill="#4a7a3a" font-weight="bold">"yesyesyesaaa"</text>
    <text x="590" y="254" fill="#888">12</text>
  </g>

  <!-- Pointer movement note -->
  <rect x="30" y="272" width="580" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">指针移动：每次 (key) 后 i 跳到 ')' 的下一位</text>
  <text x="320" y="306" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">括号外的 'a' 不查表——只替换 ( ) 包裹的键</text>

  <!-- Arrow to final -->
  <path d="M 320 312 L 320 338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="342" width="400" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="365" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出："yesyesyesaaa" ✓</text>

  <!-- Contrast: miss case -->
  <rect x="60" y="392" width="520" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">对照：若 map 中无 "a"，每个 (a) → "?"</text>
  <text x="320" y="424" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">输出变为 "???aaa"</text>
</svg>
