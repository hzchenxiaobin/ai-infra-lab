<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐列取最大 → 累加</text>

  <!-- Step 1: sort each row -->
  <rect x="120" y="48" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 对 nums 每一行执行 sort（升序）</text>

  <path d="M 280 94 L 280 112" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init score -->
  <rect x="170" y="116" width="220" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">② score = 0，j = 0..n-1</text>

  <path d="M 280 154 L 280 172" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop column -->
  <rect x="120" y="176" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 遍历第 j 列：colMax = max(nums[i][j])</text>
  <text x="280" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i = 0..m-1，取该列所有行中的最大值</text>

  <path d="M 280 222 L 280 240" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: accumulate -->
  <rect x="120" y="244" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ score += colMax</text>

  <!-- Loop back arrow: from step4 right side up to step3 right side -->
  <path d="M 440 266 L 470 266 L 470 198 L 440 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="478" y="234" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j &lt; n</text>
  <text x="478" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">回到 ③</text>

  <path d="M 280 290 L 280 308" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: j < n ? -->
  <polygon points="280,310 360,344 280,378 200,344" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">所有列处理完？</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(j == n)</text>

  <!-- Yes -> return -->
  <path d="M 280 378 L 280 392" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="390" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="160" y="396" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return score</text>

  <!-- No label back to loop -->
  <text x="360" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">否 → 继续下一列</text>

  <!-- left side note -->
  <rect x="20" y="176" width="86" height="112" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="63" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键映射</text>
  <text x="63" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序后</text>
  <text x="63" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 j 列 =</text>
  <text x="63" y="246" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">各行的</text>
  <text x="63" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 j 轮删除值</text>
  <text x="63" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐列最大=逐轮最大</text>
</svg>
