<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：位宽 → 左移 → 减一</text>

  <!-- 步骤卡片 ① -->
  <rect x="28" y="64" width="142" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="99" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 求位宽 b</text>
  <text x="99" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b = bit_length(n)</text>
  <text x="99" y="142" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n = 10 → b = 4</text>

  <path d="M 174 112 L 196 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤卡片 ② -->
  <rect x="200" y="64" width="142" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="271" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">② 左移 1 ≪ b</text>
  <text x="271" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">得 2^b = 10000</text>
  <text x="271" y="142" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">= 16</text>

  <path d="M 346 112 L 368 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤卡片 ③（结果，绿色） -->
  <rect x="372" y="64" width="126" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="435" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 减一</text>
  <text x="435" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2^b − 1 = 1111</text>
  <text x="435" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 15 ✓</text>

  <!-- 位串演变带：1010 → 10000 → 1111 -->
  <text x="88" y="188" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n</text>
  <rect x="46" y="196" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="70" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="94" y="196" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="118" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="81" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="105" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="129" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <path d="M 158 208 L 186 208" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="248" y="188" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1 ≪ 4</text>
  <rect x="194" y="196" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="242" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="196" width="22" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="213" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="229" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="253" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="277" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="301" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <path d="M 328 208 L 356 208" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="415" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">− 1 涂满</text>
  <rect x="364" y="196" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="388" y="196" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="412" y="196" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="436" y="196" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="399" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="423" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="447" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 代码框（橙色） -->
  <rect x="70" y="250" width="380" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">return (1 &lt;&lt; n.bit_length()) - 1</text>

  <!-- 底部小注 -->
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2^b 恰是严格大于 n 的最小 2 的幂（n &lt; 2^b），减 1 借位涂成 b 个 1</text>
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">无循环、无分支，一步命中</text>
</svg>
