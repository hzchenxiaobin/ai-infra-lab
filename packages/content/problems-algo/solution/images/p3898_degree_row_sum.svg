<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：顶点 i 的度 = 邻接矩阵第 i 行的行和</text>

  <!-- ============ 左：无向图 ============ -->
  <text x="122" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">无向图 G（示例 2）</text>

  <!-- 边 0-1 -->
  <path d="M 96 118 L 164 118" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough)"/>
  <text x="130" y="108" text-anchor="middle" font-size="10.5" fill="#a07514" filter="url(#rough2)">边 (0,1)</text>

  <!-- 顶点 0（高亮） -->
  <circle cx="80" cy="118" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07514" filter="url(#rough2)">0</text>
  <!-- 顶点 1 -->
  <circle cx="180" cy="118" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">1</text>
  <!-- 顶点 2（孤立） -->
  <circle cx="130" cy="205" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">2</text>

  <!-- 度标注 -->
  <text x="80" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">deg=1</text>
  <text x="180" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">deg=1</text>
  <text x="130" y="239" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">deg=0（孤立点）</text>

  <!-- 左侧说明 -->
  <text x="122" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">边 (0,1) ⇒ matrix[0][1]=matrix[1][0]=1</text>
  <text x="122" y="279" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">两个 1 分落两行，各行只数自己的</text>

  <!-- ============ 右：邻接矩阵 ============ -->
  <text x="336" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">邻接矩阵 matrix</text>

  <!-- 列头 -->
  <text x="297" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="335" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="373" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <!-- 行标 -->
  <text x="272" y="118" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="272" y="156" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="272" y="194" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- 第 0 行（高亮） -->
  <rect x="278" y="94" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="316" y="94" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="354" y="94" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="297" y="118" text-anchor="middle" font-size="12.5" fill="#a07514" filter="url(#rough2)">0</text>
  <text x="335" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="373" y="118" text-anchor="middle" font-size="12.5" fill="#a07514" filter="url(#rough2)">0</text>

  <!-- 第 1 行 -->
  <rect x="278" y="132" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="132" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="132" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="297" y="156" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="335" y="156" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="373" y="156" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>

  <!-- 第 2 行 -->
  <rect x="278" y="170" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="170" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="170" width="38" height="38" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="297" y="194" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="335" y="194" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="373" y="194" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>

  <!-- 行和 -->
  <path d="M 396 113 L 406 113" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="94" width="102" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="461" y="109" text-anchor="middle" font-size="11.5" fill="#a07514" filter="url(#rough2)">行和 0+1+0</text>
  <text x="461" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07514" filter="url(#rough2)">= 1</text>

  <rect x="410" y="142" width="102" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="461" y="159" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">ans[0] = 1 ✓</text>

  <!-- 答案 -->
  <rect x="278" y="222" width="234" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="240" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">三行各自求和 ⇒ ans = [1, 1, 0]</text>

  <!-- 结论框 -->
  <rect x="36" y="292" width="448" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">deg(i) = Σ matrix[i][j]（第 i 行之和）—— 对角线恒 0，无需剔除</text>
  <text x="260" y="331" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">对称 ⇒ 每条边的两个 1 分落两行，行和不会重复计数</text>
</svg>
