<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双单调队列：maxq 取最大，minq 取最小</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">窗口合法性 = max − min ≤ limit；超标则收缩 left</text>

  <!-- ===== Window on array ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">nums[]（窗口 [left, right]）</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="82" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="52" y="102" text-anchor="middle">10</text>
    <text x="52" y="76" text-anchor="middle" font-size="8" fill="#888">[0]</text>

    <rect x="78" y="82" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="100" y="76" text-anchor="middle" font-size="8" fill="#4a7a3a">[1] left</text>

    <rect x="126" y="82" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="148" y="102" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="148" y="76" text-anchor="middle" font-size="8" fill="#888">[2]</text>

    <rect x="174" y="82" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="196" y="102" text-anchor="middle" fill="#4a7a3a">4</text>
    <text x="196" y="76" text-anchor="middle" font-size="8" fill="#888">[3]</text>

    <rect x="222" y="82" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="244" y="102" text-anchor="middle" fill="#4a7a3a">7</text>
    <text x="244" y="76" text-anchor="middle" font-size="8" fill="#888">[4]</text>

    <rect x="270" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="292" y="102" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="292" y="76" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">[5] right</text>

    <!-- window bracket -->
    <path d="M 76 122 L 76 128 L 314 128 L 314 122" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="195" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">当前窗口 [1,2,3,4,5] = {1,2,4,7,2}</text>
  </g>

  <!-- ===== maxq ===== -->
  <text x="30" y="168" font-size="11" fill="#b85450" font-weight="bold">maxq（单调递减，存下标）→ 队头 = 窗口最大</text>
  <g font-size="10">
    <rect x="120" y="176" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="150" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">[4]=7</text>
    <text x="120" y="172" font-size="8" fill="#b85450" font-weight="bold">队头 ← max</text>

    <rect x="184" y="176" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="214" y="196" text-anchor="middle" fill="#446688">[5]=2</text>
    <text x="214" y="172" font-size="8" fill="#446688">队尾</text>

    <text x="260" y="196" font-size="9" fill="#b85450">弹尾条件：nums[back] ≤ nums[i]</text>
  </g>

  <!-- ===== minq ===== -->
  <text x="30" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">minq（单调递增，存下标）→ 队头 = 窗口最小</text>
  <g font-size="10">
    <rect x="120" y="236" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="150" y="256" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[5]=2</text>
    <text x="120" y="232" font-size="8" fill="#4a7a3a" font-weight="bold">队头 ← min</text>

    <text x="200" y="256" font-size="9" fill="#4a7a3a">弹尾条件：nums[back] ≥ nums[i]</text>
    <text x="200" y="270" font-size="9" fill="#888">（2 入队时弹掉了 4,7 等更大的旧值）</text>
  </g>

  <!-- ===== Check ===== -->
  <rect x="30" y="288" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="308" font-size="11" fill="#d6a040" font-weight="bold">合法性判定</text>
  <text x="48" y="324" font-size="10" fill="#555">nums[maxq.front] − nums[minq.front] ≤ limit ?</text>

  <rect x="320" y="288" width="210" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">本例：7 − 2 = 5 ≤ 5 ✓</text>
  <text x="425" y="324" text-anchor="middle" font-size="9" fill="#888">合法，更新 ans = right−left+1</text>

  <!-- ===== Shrink note ===== -->
  <rect x="30" y="344" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="362" font-size="10" fill="#446688" font-weight="bold">超标时收缩 left：</text>
  <text x="48" y="378" font-size="9" fill="#555">while max − min &gt; limit：left++；弹掉两队队头下标 &lt; left 的过期元素；重新判定</text>
  <text x="320" y="370" font-size="9" fill="#888">left 只增不减，总移动 ≤ n → O(n)</text>
</svg>
