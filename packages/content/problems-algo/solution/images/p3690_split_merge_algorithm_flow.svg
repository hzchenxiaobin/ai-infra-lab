<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">BFS 状态空间搜索流程：拆分合并数组</text>

  <!-- D1: start == target ? -->
  <polygon points="190,36 285,64 190,92 95,64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">start == target ?</text>
  <path d="M 285 64 L 393 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="57" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="395" y="46" width="115" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="452" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <path d="M 190 92 L 190 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="199" y="108" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- B1: 初始化 -->
  <rect x="105" y="116" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="131" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">visited = {start}</text>
  <text x="190" y="146" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">队列 q = [(start, 0)]</text>
  <path d="M 190 152 L 190 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: 队列为空 ? -->
  <polygon points="190,166 285,192 190,218 95,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="196" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队列为空 ?</text>
  <path d="M 285 192 L 393 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="185" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="395" y="174" width="115" height="36" fill="#eeeeee" stroke="#888" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="452" y="190" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="452" y="203" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（排列保证可达，不触发）</text>
  <path d="M 190 218 L 190 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="199" y="228" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- B2: 出队 -->
  <rect x="110" y="234" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="254" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">出队队首 (cur, d)</text>
  <path d="M 190 266 L 190 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3: 枚举剪切 -->
  <rect x="95" y="280" width="190" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="298" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">枚举 L ≤ R：剪出块</text>
  <text x="190" y="314" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">piece = cur[L..R]，rest = 其余</text>
  <path d="M 190 328 L 190 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4: 枚举粘贴 -->
  <rect x="95" y="342" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="360" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">枚举粘贴点 i</text>
  <text x="190" y="376" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">nxt = rest[:i] + piece + rest[i:]</text>
  <path d="M 190 382 L 190 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: nxt == target ? -->
  <polygon points="190,396 280,424 190,452 100,424" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="428" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nxt == target ?</text>
  <path d="M 280 424 L 398 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="417" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="406" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="460" y="428" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 d + 1</text>
  <text x="460" y="458" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">★ 首次命中 = 最少操作数</text>
  <path d="M 190 452 L 190 464" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="199" y="462" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- D4: nxt ∈ visited ? -->
  <polygon points="190,466 280,494 190,522 100,494" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="498" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nxt ∈ visited ?</text>
  <path d="M 280 494 L 398 494" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="487" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="479" width="80" height="30" fill="#eeeeee" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="498" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过</text>
  <text x="441" y="521" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">继续枚举下一个</text>
  <path d="M 190 522 L 190 534" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="199" y="532" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- B5: 入队 -->
  <rect x="105" y="536" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="553" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">标记 visited</text>
  <text x="190" y="569" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">入队 (nxt, d + 1)</text>

  <!-- 跳过 → 回到枚举粘贴点 -->
  <path d="M 480 494 L 545 494 L 545 362 L 289 362" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 主回路：入队后回到队首 -->
  <path d="M 105 556 L 46 556 L 46 192 L 91 192" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="596" font-size="9.5" fill="#888" filter="url(#rough2)">后继枚举完 → 回到队首，逐层扩展</text>

  <!-- 规模说明框 -->
  <rect x="390" y="532" width="165" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="552" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">规模封顶</text>
  <text x="400" y="570" font-size="9.5" fill="#666" filter="url(#rough2)">状态 ≤ 6! = 720 个</text>
  <text x="400" y="586" font-size="9.5" fill="#666" filter="url(#rough2)">邻居 O(n³) ≤ 216 个/状态</text>
</svg>
