<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：timeSeries=[1,2,5]，duration=2 → 5</text>

  <!-- ===== top: timeline with effective coverage ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">有效中毒时长（合并后）</text>

  <!-- timeline -->
  <line x1="80" y1="120" x2="500" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="68" y="124" font-size="10" fill="#888">t</text>

  <!-- tick marks: t=1..7 -> x=130,180,230,280,330,380,430 -->
  <line x1="130" y1="116" x2="130" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="10" fill="#666">1</text>
  <line x1="180" y1="116" x2="180" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="10" fill="#666">2</text>
  <line x1="230" y1="116" x2="230" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#666">3</text>
  <line x1="280" y1="116" x2="280" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#666">4</text>
  <line x1="330" y1="116" x2="330" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="140" text-anchor="middle" font-size="10" fill="#666">5</text>
  <line x1="380" y1="116" x2="380" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="140" text-anchor="middle" font-size="10" fill="#666">6</text>
  <line x1="430" y1="116" x2="430" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="10" fill="#666">7</text>

  <!-- effective bar 1: attack@1 contributes 1 -> [130,180] (blue) -->
  <rect x="130" y="86" width="50" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="103" text-anchor="middle" font-size="10" fill="#2a4a66" font-weight="bold">+1</text>
  <!-- effective bar 2: attack@2 contributes 2 -> [180,280] (green) -->
  <rect x="180" y="86" width="100" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="103" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">+2</text>
  <!-- effective bar 3: attack@5 contributes 2 -> [330,430] (orange) -->
  <rect x="330" y="86" width="100" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="103" text-anchor="middle" font-size="10" fill="#a67830" font-weight="bold">+2</text>

  <!-- attack markers (down arrows on timeline) -->
  <text x="130" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">攻击</text>
  <text x="180" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">攻击</text>
  <text x="330" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">攻击</text>

  <!-- ===== bottom: step table ===== -->
  <!-- table frame -->
  <rect x="30" y="180" width="560" height="252" rx="6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="180" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">步骤</text>
  <text x="140" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">i</text>
  <text x="220" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">攻击时刻</text>
  <text x="310" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">gap</text>
  <text x="400" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">贡献</text>
  <text x="510" y="199" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">total</text>

  <!-- column separators -->
  <line x1="105" y1="180" x2="105" y2="432" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="175" y1="180" x2="175" y2="432" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="265" y1="180" x2="265" y2="432" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="180" x2="355" y2="432" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="445" y1="180" x2="445" y2="432" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: init -->
  <text x="70" y="232" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="220" y="232" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="310" y="232" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="510" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <line x1="30" y1="244" x2="590" y2="244" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: i=0 -->
  <text x="70" y="266" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="220" y="266" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">1</text>
  <text x="310" y="266" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">2−1=1</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">min(2,1)=1</text>
  <text x="510" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="40" y="280" font-size="9" fill="#888">攻击@1 被攻击@2 打断，仅 1 秒</text>

  <line x1="30" y1="290" x2="590" y2="290" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: i=1 -->
  <text x="70" y="312" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="140" y="312" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="220" y="312" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="310" y="312" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">5−2=3</text>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">min(2,3)=2</text>
  <text x="510" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="40" y="326" font-size="9" fill="#888">间隔 ≥ duration，贡献满 2 秒</text>

  <line x1="30" y1="336" x2="590" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: i=2 (last) -->
  <text x="70" y="358" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="140" y="358" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="220" y="358" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">5</text>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">duration=2</text>
  <text x="510" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="40" y="372" font-size="9" fill="#888">末次攻击无人打断，贡献满 duration</text>

  <line x1="30" y1="382" x2="590" y2="382" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 5: end -->
  <rect x="30" y="382" width="560" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结束</text>
  <text x="510" y="408" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="310" y="420" text-anchor="middle" font-size="10" fill="#555">合并后中毒秒数 = {1} ∪ {2,3} ∪ {5,6} = 5 ✓</text>
</svg>
