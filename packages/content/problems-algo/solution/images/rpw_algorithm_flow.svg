<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：查找 → 判存在 → 双指针反转前缀</text>

  <!-- Step 1: find -->
  <rect x="200" y="48" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = word.find(ch)</text>

  <!-- arrow down -->
  <path d="M 280 88 L 280 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: decision diamond -->
  <polygon points="280,114 360,158 280,202 200,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i 存在？</text>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#666">(i != npos)</text>

  <!-- No branch: right -->
  <path d="M 360 158 L 430 158" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="138" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">直接返回 word</text>

  <!-- Yes branch: down -->
  <path d="M 280 202 L 280 224" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: init two pointers -->
  <rect x="170" y="228" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left = 0, right = i</text>

  <!-- arrow down -->
  <path d="M 280 268 L 280 290" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop decision -->
  <polygon points="280,294 380,338 280,382 180,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666">（未越过中线）</text>

  <!-- loop body: right -->
  <path d="M 380 338 L 430 338" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="318" width="115" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="487" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">swap</text>
  <text x="487" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left++ right−−</text>

  <!-- loop back arrow: from swap box back up to loop decision -->
  <path d="M 487 318 Q 487 286 430 286 Q 380 286 380 294" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="280" font-size="10" fill="#888">回到判定</text>

  <!-- exit loop: down -->
  <path d="M 280 382 L 280 404" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="398" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 5: return -->
  <rect x="190" y="408" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 word</text>
</svg>
