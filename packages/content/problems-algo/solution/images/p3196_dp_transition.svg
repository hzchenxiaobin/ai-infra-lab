<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">状态机：第 i 个元素是 + 号（keep）还是 − 号（flip）？</text>

  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 i−1 个元素</text>
  <text x="425" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 i 个元素</text>

  <rect x="60" y="92" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="119" text-anchor="middle" font-size="12.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">keep（+ 号）</text>

  <rect x="60" y="252" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="279" text-anchor="middle" font-size="12.5" fill="#8a6a1e" font-weight="bold" filter="url(#rough2)">flip（− 号）</text>

  <rect x="350" y="92" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="119" text-anchor="middle" font-size="12.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">keep（+ 号）</text>

  <rect x="350" y="252" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="279" text-anchor="middle" font-size="12.5" fill="#8a6a1e" font-weight="bold" filter="url(#rough2)">flip（− 号）</text>

  <path d="M 212 114 L 346 114" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+ nums[i]</text>
  <text x="280" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">新段段首 / 段内偶偏移</text>

  <path d="M 212 130 C 260 180, 300 220, 346 256" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="247" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">− nums[i]</text>
  <text x="247" y="174" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">+ 后接 −（奇偏移）</text>

  <path d="M 212 262 C 260 212, 300 172, 346 138" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="247" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">+ nums[i]</text>
  <text x="247" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">− 的下一格必是 +</text>

  <path d="M 212 274 L 346 274" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">相邻两个 −，非法</text>
  <text x="280" y="280" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="40" y="318" width="480" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">初始：keep = nums[0]，flip = −∞（首元素不可翻）；答案 = max(keep, flip)</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">keep ← max(keep, flip) + nums[i]（新段段首 / 段内偶偏移）</text>
  <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">flip ← keep − nums[i]（段内奇偏移，前一格必须是 + 号）</text>
</svg>
