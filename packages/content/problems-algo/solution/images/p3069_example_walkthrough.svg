<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5, 4, 3, 8]，4 次操作逐步推进</text>
  <text x="260" y="41" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿色 = 新追加进 arr1 的元素，橙色 = 新追加进 arr2 的元素</text>

  <!-- header -->
  <text x="66" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="168" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">arr1</text>
  <text x="452" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">arr2</text>

  <!-- row 1 -->
  <text x="66" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 1 次</text>
  <text x="168" y="96" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">规则固定 → arr1</text>
  <rect x="316" y="80" width="30" height="24" fill="#cde8d2" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="96" text-anchor="middle" font-size="12" fill="#2f5d27" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="452" y="96" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">（空）</text>

  <!-- row 2 -->
  <text x="66" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 2 次</text>
  <text x="168" y="130" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">规则固定 → arr2</text>
  <rect x="316" y="114" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="331" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="438" y="114" width="30" height="24" fill="#fde9c8" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="453" y="130" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- row 3 -->
  <text x="66" y="164" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 3 次</text>
  <text x="168" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">尾 5 &gt; 尾 4 → arr1</text>
  <rect x="316" y="148" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="331" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="350" y="148" width="30" height="24" fill="#cde8d2" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="164" text-anchor="middle" font-size="12" fill="#2f5d27" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="438" y="148" width="30" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="453" y="164" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">4</text>

  <!-- row 4 -->
  <text x="66" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 4 次</text>
  <text x="168" y="198" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">尾 3 &lt; 尾 4 → arr2</text>
  <rect x="316" y="182" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="331" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="350" y="182" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="438" y="182" width="30" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="453" y="198" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <rect x="472" y="182" width="30" height="24" fill="#fde9c8" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="487" y="198" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- separator -->
  <path d="M 40 216 L 480 216" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- result -->
  <text x="66" y="246" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">拼接结果</text>
  <text x="150" y="246" font-size="11" fill="#777" filter="url(#rough2)">result = arr1 + arr2 =</text>
  <rect x="300" y="230" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="315" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="334" y="230" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="349" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="368" y="230" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="383" y="246" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="402" y="230" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="246" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="448" y="246" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- takeaway -->
  <rect x="48" y="272" width="424" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">看第 4 次操作：第 3 次把 3 塞进 arr1 后，arr1 的尾从 5 变成了 3，</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">于是第 4 次比较的是 3 与 4（而不是 5 与 4）——「尾巴」是动态的，</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每追加一次就要刷新一次，这正是模拟类题目最易踩的坑</text>
</svg>
