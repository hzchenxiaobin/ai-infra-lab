<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：按绝对值升序 ⇒ 负数降序出现，头插即得升序</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">输入按 |val| 升序；目标按 val 升序</text>

  <!-- ===== Input row (sorted by |val|) ===== -->
  <text x="24" y="80" font-size="11" fill="#446688" font-weight="bold">输入</text>
  <text x="24" y="94" font-size="9" fill="#888">|val|升</text>

  <!-- nodes: 0, 2, -5, 5, 10, -10 ; x = 67,133,199,265,331,397 ; w=56 h=38 y=64 -->
  <rect x="67" y="64" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="95" y="90" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">0</text>
  <rect x="133" y="64" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="90" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">2</text>
  <rect x="199" y="64" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="227" y="90" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">−5</text>
  <rect x="265" y="64" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="90" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">5</text>
  <rect x="331" y="64" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="90" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">10</text>
  <rect x="397" y="64" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="90" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">−10</text>

  <!-- next pointers between input nodes -->
  <path d="M123 83 L131 83" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M189 83 L197 83" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M255 83 L263 83" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M321 83 L329 83" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M387 83 L395 83" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- |val| axis -->
  <text x="95" y="118" text-anchor="middle" font-size="9" fill="#aaa">|0|</text>
  <text x="161" y="118" text-anchor="middle" font-size="9" fill="#aaa">|2|</text>
  <text x="227" y="118" text-anchor="middle" font-size="9" fill="#b85450">|5|</text>
  <text x="293" y="118" text-anchor="middle" font-size="9" fill="#aaa">|5|</text>
  <text x="359" y="118" text-anchor="middle" font-size="9" fill="#aaa">|10|</text>
  <text x="425" y="118" text-anchor="middle" font-size="9" fill="#b85450">|10|</text>
  <text x="260" y="132" text-anchor="middle" font-size="9.5" fill="#888">→ 绝对值递增（给定条件）</text>

  <!-- annotation: two subsequences -->
  <text x="150" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">负数出现顺序：−5, −10（实际值递减）</text>
  <text x="380" y="152" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">非负出现顺序：0,2,5,10（升序）</text>

  <!-- curved action arrows: each negative -> front (head insert) -->
  <path d="M227 102 C 227 170, 165 170, 161 208" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="178" font-size="9.5" fill="#b85450">头插</text>

  <path d="M425 102 C 425 185, 100 185, 95 208" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="180" font-size="9.5" fill="#b85450">头插（逆序搬到最前）</text>

  <!-- ===== Result row (sorted by val) ===== -->
  <text x="24" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">输出</text>
  <text x="24" y="240" font-size="9" fill="#888">val升</text>

  <rect x="67" y="210" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="95" y="236" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">−10</text>
  <rect x="133" y="210" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="236" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">−5</text>
  <rect x="199" y="210" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="227" y="236" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">0</text>
  <rect x="265" y="210" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="236" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">2</text>
  <rect x="331" y="210" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="236" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">5</text>
  <rect x="397" y="210" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="236" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">10</text>

  <path d="M123 229 L131 229" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M189 229 L197 229" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M255 229 L263 229" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M321 229 L329 229" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M387 229 L395 229" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bracket: 负数升序 | 非负升序 -->
  <text x="128" y="266" text-anchor="middle" font-size="9.5" fill="#b85450">负数（逆序后升序）</text>
  <text x="360" y="266" text-anchor="middle" font-size="9.5" fill="#446688">非负数（原地升序）</text>

  <!-- Insight box -->
  <rect x="40" y="280" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么头插法一步到位？</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#555">|val| 升序 ⇒ 负数按实际值降序出现，逐个头插 = 逆序成升序并搬到表头；</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#555">非负数本就升序，原地不动。拼接后即整体升序，O(n) / O(1)。</text>
</svg>
