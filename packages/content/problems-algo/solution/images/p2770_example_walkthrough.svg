<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：target = 2，答案 = 3</text>

  <!-- nums row -->
  <text x="30" y="70" font-size="12" fill="#888">nums:</text>
  <!-- box i=0 val 1 -->
  <rect x="78" y="54" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="105" y="100" text-anchor="middle" font-size="9" fill="#888">0</text>
  <!-- box i=1 val 3 -->
  <rect x="140" y="54" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="74" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="167" y="100" text-anchor="middle" font-size="9" fill="#888">1</text>
  <!-- box i=2 val 6 -->
  <rect x="202" y="54" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="74" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="229" y="100" text-anchor="middle" font-size="9" fill="#888">2</text>
  <!-- box i=3 val 4 -->
  <rect x="264" y="54" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="74" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="291" y="100" text-anchor="middle" font-size="9" fill="#888">3</text>
  <!-- box i=4 val 1 -->
  <rect x="326" y="54" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="74" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="353" y="100" text-anchor="middle" font-size="9" fill="#888">4</text>
  <!-- box i=5 val 2 -->
  <rect x="388" y="54" width="54" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="74" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="415" y="100" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- dp row -->
  <text x="30" y="156" font-size="12" fill="#888">dp[i]:</text>
  <rect x="78" y="140" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="160" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="140" y="140" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="202" y="140" width="54" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="160" text-anchor="middle" font-size="12" fill="#999">−1</text>
  <rect x="264" y="140" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="160" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="326" y="140" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="160" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="388" y="140" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- winning path arrows over nums: 0->1->3->5 -->
  <path d="M 105 54 Q 136 30 167 54" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="136" y="28" text-anchor="middle" font-size="9" fill="#b85450">|3−1|=2</text>
  <path d="M 167 54 Q 229 22 291 54" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="229" y="20" text-anchor="middle" font-size="9" fill="#b85450">|4−3|=1</text>
  <path d="M 291 54 Q 353 22 415 54" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="353" y="20" text-anchor="middle" font-size="9" fill="#b85450">|2−4|=2</text>

  <!-- reasoning box -->
  <rect x="30" y="200" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">逐格转移说明</text>
  <text x="44" y="242" font-size="11" fill="#666">• dp[1]=1：从 0 跳来 |3−1|≤2</text>
  <text x="44" y="258" font-size="11" fill="#666">• dp[2]=−1：|6−1|、|6−3| 均 &gt; 2，不可达</text>
  <text x="44" y="274" font-size="11" fill="#666">• dp[3]=2：从 1 跳来 |4−3|≤2 → dp[1]+1=2</text>
  <text x="280" y="274" font-size="11" fill="#666">• dp[5]=3：从 3 跳来 → dp[3]+1=3</text>

  <!-- conclusion -->
  <rect x="30" y="304" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最优路径 0→1→3→5（值 1→3→4→2），共 3 跳</text>
</svg>
