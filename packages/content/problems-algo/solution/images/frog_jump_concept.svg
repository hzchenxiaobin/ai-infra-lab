<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：上一步跳 k，本步只能跳 k−1 / k / k+1</text>

  <!-- river -->
  <rect x="30" y="180" width="540" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="556" y="174" text-anchor="end" font-size="11" fill="#446688">河水</text>

  <!-- stones -->
  <ellipse cx="80" cy="205" rx="24" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="200" cy="205" rx="24" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="320" cy="205" rx="24" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="560" cy="205" rx="24" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- position labels -->
  <text x="80" y="240" text-anchor="middle" font-size="11" fill="#555">p</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#555">p+k−1</text>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#555">p+k</text>
  <text x="560" y="240" text-anchor="middle" font-size="11" fill="#555">…</text>

  <!-- frog on first stone -->
  <ellipse cx="80" cy="178" rx="14" ry="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">蛙</text>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#d6a040">上次跳 k</text>

  <!-- three jump arcs -->
  <path d="M 100 178 Q 148 118 196 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k−1 ✓</text>

  <path d="M 100 178 Q 208 96 316 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="208" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k ✓</text>

  <path d="M 100 178 Q 268 70 436 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="276" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k+1 ✗（落水）</text>

  <!-- red X at water landing -->
  <path d="M 428 198 L 448 218 M 448 198 L 428 218" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- bottom note -->
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#888">每次跳距 = 上次跳距 k 的 k−1 / k / k+1 三选一（且 &gt; 0），只能落在石头上</text>
</svg>
