<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">GROUP BY email：把"逐行计数"变成"按组聚合"</text>

  <!-- Original Person table -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Person 表（原始行）</text>
  <rect x="70" y="62" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="77" font-size="10" fill="#333">id</text>
  <text x="135" y="77" font-size="10" fill="#333">email</text>
  <line x1="110" y1="62" x2="110" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="70" y="84" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="98" font-size="10" fill="#333">1</text>
  <text x="135" y="98" font-size="10" fill="#333">a@b.com</text>
  <line x1="110" y1="84" x2="110" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="70" y="104" width="100" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="118" font-size="10" fill="#333">2</text>
  <text x="135" y="118" font-size="10" fill="#333">c@d.com</text>
  <line x1="110" y1="104" x2="110" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="70" y="124" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="138" font-size="10" fill="#333">3</text>
  <text x="135" y="138" font-size="10" fill="#333">a@b.com</text>
  <line x1="110" y1="124" x2="110" y2="144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow: GROUP BY -->
  <path d="M180 114 L240 114" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">GROUP BY</text>
  <text x="210" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">email</text>

  <!-- Grouped result -->
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分组后（每组一行）</text>
  <rect x="280" y="62" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="77" font-size="10" fill="#333">email</text>
  <text x="420" y="77" font-size="10" fill="#333">COUNT(*)</text>
  <line x1="360" y1="62" x2="360" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="280" y="84" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="98" font-size="10" fill="#333">a@b.com</text>
  <text x="420" y="98" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="360" y1="84" x2="360" y2="104" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="280" y="104" width="180" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="118" font-size="10" fill="#333">c@d.com</text>
  <text x="420" y="118" font-size="11" fill="#333">1</text>
  <line x1="360" y1="104" x2="360" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow: HAVING -->
  <path d="M370 150 L370 178" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="450" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">HAVING</text>
  <text x="450" y="180" text-anchor="middle" font-size="9" fill="#b85450">COUNT&gt;1</text>

  <!-- Result -->
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（天然去重，每组一行）</text>
  <rect x="230" y="208" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="10" fill="#333">Email</text>
  <rect x="230" y="230" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a@b.com</text>

  <!-- HAVING vs WHERE insight box -->
  <rect x="40" y="278" width="480" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">核心：HAVING 是"组级过滤"，WHERE 是"行级过滤"</text>
  <text x="60" y="318" font-size="10" fill="#333">① WHERE：分组前过滤原始行，不能引用 COUNT 等聚合函数</text>
  <text x="60" y="336" font-size="10" fill="#333">② HAVING：分组后过滤组，专门对聚合结果（COUNT/SUM/AVG）做判断</text>
  <text x="60" y="354" font-size="10" fill="#333">③ 本题"出现次数&gt;1"是对分组后的计数判断 → 必须用 HAVING</text>
  <text x="60" y="372" font-size="10" fill="#b85450" font-weight="bold">④ 误写 WHERE COUNT(*)&gt;1 会报错（WHERE 不可含聚合函数）</text>
</svg>
