<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 逐步演算 (s="adaa")</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">chars="d", vals=[-1000] → 价值数组 [1, -1000, 1, 1]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" font-weight="bold">
    <rect x="20" y="64" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="120" y1="64" x2="120" y2="94" stroke="#446688" stroke-width="1.5"/>
    <line x1="210" y1="64" x2="210" y2="94" stroke="#446688" stroke-width="1.5"/>
    <line x1="360" y1="64" x2="360" y2="94" stroke="#446688" stroke-width="1.5"/>
    <text x="70" y="84" text-anchor="middle">步骤</text>
    <text x="165" y="84" text-anchor="middle">字符</text>
    <text x="285" y="84" text-anchor="middle">v (价值)</text>
    <text x="430" y="84" text-anchor="middle">cur / ans</text>
  </g>

  <!-- 行0 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="20" y="94" width="500" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <line x1="120" y1="94" x2="120" y2="128" stroke="#ccc" stroke-width="1"/>
    <line x1="210" y1="94" x2="210" y2="128" stroke="#ccc" stroke-width="1"/>
    <line x1="360" y1="94" x2="360" y2="128" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="116" text-anchor="middle">0</text>
    <text x="165" y="116" text-anchor="middle">—</text>
    <text x="285" y="116" text-anchor="middle">—</text>
    <text x="430" y="116" text-anchor="middle" fill="#446688">0 / 0</text>
  </g>

  <!-- 行1 a -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="20" y="128" width="500" height="34" fill="#f6fff6" stroke="#ccc" stroke-width="1"/>
    <line x1="120" y1="128" x2="120" y2="162" stroke="#ccc" stroke-width="1"/>
    <line x1="210" y1="128" x2="210" y2="162" stroke="#ccc" stroke-width="1"/>
    <line x1="360" y1="128" x2="360" y2="162" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="150" text-anchor="middle">1</text>
    <text x="165" y="150" text-anchor="middle">a</text>
    <text x="285" y="150" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="430" y="150" text-anchor="middle" fill="#446688">1 / 1</text>
  </g>

  <!-- 行2 d 归零 (高亮红) -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="20" y="162" width="500" height="34" fill="#fff5f7" stroke="#b85450" stroke-width="1.6"/>
    <line x1="120" y1="162" x2="120" y2="196" stroke="#bbb" stroke-width="1"/>
    <line x1="210" y1="162" x2="210" y2="196" stroke="#bbb" stroke-width="1"/>
    <line x1="360" y1="162" x2="360" y2="196" stroke="#bbb" stroke-width="1"/>
    <text x="70" y="184" text-anchor="middle">2</text>
    <text x="165" y="184" text-anchor="middle">d</text>
    <text x="285" y="184" text-anchor="middle" fill="#b85450">-1000</text>
    <text x="430" y="184" text-anchor="middle" fill="#b85450">0 / 1</text>
    <text x="510" y="184" text-anchor="end" font-size="10" fill="#b85450">归零!</text>
  </g>

  <!-- 行3 a -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="20" y="196" width="500" height="34" fill="#f6fff6" stroke="#ccc" stroke-width="1"/>
    <line x1="120" y1="196" x2="120" y2="230" stroke="#ccc" stroke-width="1"/>
    <line x1="210" y1="196" x2="210" y2="230" stroke="#ccc" stroke-width="1"/>
    <line x1="360" y1="196" x2="360" y2="230" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="218" text-anchor="middle">3</text>
    <text x="165" y="218" text-anchor="middle">a</text>
    <text x="285" y="218" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="430" y="218" text-anchor="middle" fill="#446688">1 / 1</text>
  </g>

  <!-- 行4 a 峰值 (高亮) -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="20" y="230" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="120" y1="230" x2="120" y2="264" stroke="#bbb" stroke-width="1"/>
    <line x1="210" y1="230" x2="210" y2="264" stroke="#bbb" stroke-width="1"/>
    <line x1="360" y1="230" x2="360" y2="264" stroke="#bbb" stroke-width="1"/>
    <text x="70" y="252" text-anchor="middle">4</text>
    <text x="165" y="252" text-anchor="middle">a</text>
    <text x="285" y="252" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="430" y="252" text-anchor="middle" font-weight="bold" fill="#b85450">2 / 2</text>
    <text x="510" y="252" text-anchor="end" font-size="10" fill="#d6a040">峰值</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough)">
    <rect x="20" y="276" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="270" y="298" text-anchor="middle" font-size="13" fill="#333">ans = 2, 对应子串 "aa" ✓</text>
  </g>
</svg>
