<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="280" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行匹配 product_id</text>

  <!-- Column headers -->
  <text x="100" y="48" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Sales 行</text>
  <text x="290" y="48" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">匹配 product_id</text>
  <text x="475" y="48" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Product → 结果</text>

  <!-- Panel 1: sale_id=1, product_id=100 -->
  <rect x="20" y="54" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="9" fill="#333">sale_id=1  pid=<tspan font-weight="bold" fill="#d6a040">100</tspan></text>
  <text x="110" y="85" text-anchor="middle" font-size="9" fill="#333">year=2008  price=5000</text>

  <path d="M200 74 L240 74" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="68" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">100=100 ✓</text>

  <rect x="240" y="54" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="9" fill="#333">pid=<tspan font-weight="bold" fill="#d6a040">100</tspan></text>
  <text x="290" y="85" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Nokia</text>

  <path d="M340 74 L380 74" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="380" y="54" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Nokia</text>
  <text x="470" y="85" text-anchor="middle" font-size="9" fill="#333">2008  |  5000</text>

  <!-- Panel 2: sale_id=2, product_id=100 -->
  <rect x="20" y="104" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="120" text-anchor="middle" font-size="9" fill="#333">sale_id=2  pid=<tspan font-weight="bold" fill="#d6a040">100</tspan></text>
  <text x="110" y="135" text-anchor="middle" font-size="9" fill="#333">year=2009  price=5000</text>

  <path d="M200 124 L240 124" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">100=100 ✓</text>

  <rect x="240" y="104" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="#333">pid=<tspan font-weight="bold" fill="#d6a040">100</tspan></text>
  <text x="290" y="135" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Nokia</text>

  <path d="M340 124 L380 124" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="380" y="104" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Nokia</text>
  <text x="470" y="135" text-anchor="middle" font-size="9" fill="#333">2009  |  5000</text>

  <!-- Panel 3: sale_id=7, product_id=200 -->
  <rect x="20" y="154" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="170" text-anchor="middle" font-size="9" fill="#333">sale_id=7  pid=<tspan font-weight="bold" fill="#d6a040">200</tspan></text>
  <text x="110" y="185" text-anchor="middle" font-size="9" fill="#333">year=2011  price=9000</text>

  <path d="M200 174 L240 174" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="168" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">200=200 ✓</text>

  <rect x="240" y="154" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#333">pid=<tspan font-weight="bold" fill="#d6a040">200</tspan></text>
  <text x="290" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Apple</text>

  <path d="M340 174 L380 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="380" y="154" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Apple</text>
  <text x="470" y="185" text-anchor="middle" font-size="9" fill="#333">2011  |  9000</text>

  <!-- Note box: Samsung -->
  <rect x="50" y="212" width="480" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Product 300（Samsung）在 Sales 中无对应行</text>
  <text x="290" y="250" text-anchor="middle" font-size="10" fill="#555">→ 不产生结果行：INNER JOIN 只输出有匹配的行对</text>
  <text x="290" y="262" text-anchor="middle" font-size="9" fill="#555">3 条 Sales 记录全部命中 → 结果恰好 3 行</text>
</svg>
