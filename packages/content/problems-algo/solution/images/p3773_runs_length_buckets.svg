<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：切 runs → 按长度分桶 → 最大的桶就是答案</text>

  <!-- 第一行：字符串字符 -->
  <text x="116" y="69" font-size="13" fill="#555">s =</text>
  <rect x="140" y="46" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="46" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="46" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="46" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="46" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="70" text-anchor="middle" font-size="13" fill="#333">h</text>
  <text x="200" y="70" text-anchor="middle" font-size="13" fill="#333">e</text>
  <text x="240" y="70" text-anchor="middle" font-size="13" fill="#333">l</text>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333">l</text>
  <text x="320" y="70" text-anchor="middle" font-size="13" fill="#333">o</text>

  <!-- 切点：相邻字符不同的位置 -->
  <path d="M 180 36 L 180 92" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 220 36 L 220 92" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 300 36 L 300 92" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="372" y="58" font-size="11" fill="#b85450" font-weight="bold">相邻字符不同 → 切一刀</text>
  <text x="372" y="76" font-size="10" fill="#888">(h|e、e|l、l|o 三处，切点唯一)</text>

  <path d="M 310 98 L 310 112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="110" font-size="10" fill="#888">切分方式唯一</text>

  <!-- 第二行：runs -->
  <rect x="140" y="118" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="118" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="118" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="322" y="118" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="141" text-anchor="middle" font-size="13" fill="#333">h</text>
  <text x="206" y="141" text-anchor="middle" font-size="13" fill="#333">e</text>
  <text x="274" y="141" text-anchor="middle" font-size="13" fill="#333">ll</text>
  <text x="342" y="141" text-anchor="middle" font-size="13" fill="#333">o</text>
  <text x="112" y="172" font-size="11" fill="#888">长度</text>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="206" y="172" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="274" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="342" y="172" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="400" y="132" font-size="11" fill="#555">4 个 runs</text>
  <text x="400" y="150" font-size="11" fill="#555">长度 = [1, 1, 2, 1]</text>

  <path d="M 310 184 L 310 200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="198" font-size="10" fill="#888">按长度放入哈希表</text>

  <!-- 第三行：两个桶 -->
  <rect x="100" y="210" width="200" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="233" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">长度 = 1 的桶</text>
  <rect x="118" y="246" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="246" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="246" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="137" y="268" text-anchor="middle" font-size="12" fill="#333">h</text>
  <text x="181" y="268" text-anchor="middle" font-size="12" fill="#333">e</text>
  <text x="225" y="268" text-anchor="middle" font-size="12" fill="#333">o</text>
  <text x="256" y="268" font-size="12" fill="#d6a040" font-weight="bold">×3</text>
  <text x="200" y="309" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt[1] = 3</text>

  <rect x="330" y="210" width="170" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="233" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">长度 = 2 的桶</text>
  <rect x="376" y="246" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="268" text-anchor="middle" font-size="12" fill="#333">ll</text>
  <text x="460" y="268" font-size="12" fill="#d6a040" font-weight="bold">×1</text>
  <text x="415" y="309" text-anchor="middle" font-size="12" fill="#888">cnt[2] = 1</text>

  <!-- 结论 -->
  <rect x="170" y="350" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = max(3, 1) = 3</text>

  <text x="310" y="414" text-anchor="middle" font-size="10" fill="#888">"hello" 的 runs：h、e、ll、o —— 长度为 1 的最多，共 3 段</text>
</svg>
