<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：长为 k 的窗口，比较两端 arr[mid] 与 arr[mid+k]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">二分的是窗口左边界 mid，每轮在「保留 arr[mid]」或「改取 arr[mid+k]」间二选一</text>

  <!-- number line with x -->
  <text x="60" y="78" text-anchor="middle" font-size="11" fill="#888">数轴</text>
  <line x1="60" y1="96" x2="520" y2="96" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- x target marker -->
  <path d="M 300 70 L 294 82 L 306 82 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">x</text>

  <!-- array cells arr[mid .. mid+k] -->
  <rect x="150" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">arr[mid]</text>

  <rect x="200" y="110" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#333">…</text>
  <rect x="240" y="110" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="11" fill="#333">…</text>
  <rect x="280" y="110" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="131" text-anchor="middle" font-size="11" fill="#333">…</text>

  <rect x="320" y="110" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="131" text-anchor="middle" font-size="11" fill="#333">…</text>

  <rect x="360" y="110" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr[mid+k]</text>

  <!-- window bracket [mid, mid+k-1] -->
  <path d="M 150 150 L 150 158 L 360 158 L 360 150" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [mid, mid+k−1] · 长度 k</text>

  <!-- distance arrows below cells -->
  <text x="175" y="196" text-anchor="middle" font-size="10.5" fill="#446688">距 x</text>
  <path d="M 175 202 L 300 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="237" y="216" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x − arr[mid]</text>

  <text x="385" y="196" text-anchor="middle" font-size="10.5" fill="#b85450">距 x</text>
  <path d="M 300 238 L 385 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="342" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">arr[mid+k] − x</text>

  <!-- decision diamond -->
  <path d="M 280 268 L 360 298 L 280 328 L 200 298 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#333">x−arr[mid]</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#333">≤ arr[mid+k]−x ?</text>

  <!-- left branch: keep arr[mid], high=mid -->
  <path d="M 200 298 L 110 298" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="312" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="331" text-anchor="middle" font-size="10.5" fill="#333">high = mid（保留 arr[mid]）</text>

  <!-- right branch: drop arr[mid], low=mid+1 -->
  <path d="M 360 298 L 450 298" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="450" y="312" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="530" y="331" text-anchor="middle" font-size="10.5" fill="#333">low = mid+1（改取 arr[mid+k]）</text>

  <!-- bottom note -->
  <rect x="40" y="358" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555">单调性：随 mid 右移，x−arr[mid]↓ 且 arr[mid+k]−x↑ → 二段性成立，可二分</text>
</svg>
