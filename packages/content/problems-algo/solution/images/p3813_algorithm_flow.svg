<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描两个计数器，收尾判一次 c &gt; 0</text>

  <!-- ① 初始化 -->
  <rect x="155" y="32" width="190" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="50" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">① v ← 0，c ← 0</text>

  <!-- 顶部说明框 -->
  <rect x="352" y="30" width="158" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="431" y="45" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⌊v/c⌋ 就是整数除法</text>
  <text x="431" y="59" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">非负数：截断 = floor</text>
  <text x="431" y="72" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">c = 0 必须特判</text>

  <path d="M 250 60 L 250 72" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：i < n ? -->
  <polygon points="250,76 338,107 250,138 162,107" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">i &lt; n ?</text>

  <!-- A 否：扫完 → 底部判定 -->
  <path d="M 162 107 L 16 107 L 16 352 L 61 352" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="99" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否 · 扫完</text>

  <!-- A 是 ↓ -->
  <path d="M 250 138 L 250 150" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="149" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 菱形 B：ch 是什么？ -->
  <polygon points="250,152 352,183 250,214 148,183" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="180" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ch = s[i] 是什么？</text>
  <text x="250" y="196" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">（先看是不是字母）</text>

  <!-- B → v++ -->
  <text x="143" y="172" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">元音</text>
  <path d="M 148 183 L 139 183" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="24" y="165" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="187" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">v ← v + 1</text>

  <!-- B → c++ -->
  <text x="368" y="172" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">辅音</text>
  <path d="M 352 183 L 381 183" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="384" y="165" width="112" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="187" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c ← c + 1</text>

  <!-- B 其它 ↓ i++ -->
  <text x="258" y="232" font-size="9.5" fill="#b85450" filter="url(#rough2)">空格/数字 · 跳过</text>
  <path d="M 250 214 L 250 250" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ i++ -->
  <rect x="180" y="252" width="140" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="269" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">③ i ← i + 1</text>

  <!-- v++ / c++ 汇入 i++ -->
  <path d="M 80 201 L 80 265 L 176 265" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 201 L 440 265 L 326 265" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回边 -->
  <path d="M 250 278 L 250 292 L 505 292 L 505 107 L 344 107" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下一位 i</text>

  <!-- 菱形 D：c > 0 ? -->
  <polygon points="135,324 203,352 135,380 67,352" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="356" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">c &gt; 0 ?</text>

  <!-- D 是 → 返回 v/c -->
  <text x="219" y="344" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 203 352 L 234 352" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="238" y="337" width="130" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="303" y="356" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">返回 ⌊v / c⌋</text>

  <!-- D 否 → 返回 0 -->
  <text x="150" y="389" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 135 380 L 135 391 L 430 391 L 430 371" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="378" y="337" width="118" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="437" y="356" text-anchor="middle" font-size="11.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 0</text>
</svg>
