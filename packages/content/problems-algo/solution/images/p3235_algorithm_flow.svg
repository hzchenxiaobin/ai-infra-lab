<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：O(n²) 整数判定 + 并查集</text>

  <!-- 开始 -->
  <rect x="190" y="34" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="53" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 250 64 L 250 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 框1 -->
  <rect x="150" y="84" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="102" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">初始化并查集：节点 0..n−1 = 圆</text>
  <text x="250" y="118" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">n..n+3 = 上 / 右 / 下 / 左边</text>
  <path d="M 250 128 L 250 152" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 框2：圆圆 -->
  <rect x="135" y="152" width="230" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="170" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">圆-圆：枚举所有 i &lt; j</text>
  <text x="250" y="186" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">(xᵢ−xⱼ)² + (yᵢ−yⱼ)² ≤ (rᵢ+rⱼ)² ?</text>
  <text x="250" y="201" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">成立 ⇒ unite(i, j)</text>
  <path d="M 250 208 L 250 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 框3：圆边 -->
  <rect x="135" y="228" width="230" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="246" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">圆-边：cx=clamp(x,0,X)，cy=clamp(y,0,Y)</text>
  <text x="250" y="262" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">四条边逐一代入：距离² ≤ r² ?</text>
  <text x="250" y="277" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">成立 ⇒ unite(圆, 对应边)</text>
  <path d="M 250 284 L 250 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 框4：查代表元 -->
  <rect x="150" y="304" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">查 4 组代表元（同根即连通）</text>
  <text x="250" y="336" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">左-右 / 上-下 / 左-下 / 上-右</text>
  <path d="M 250 344 L 250 352" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 -->
  <polygon points="250,352 322,382 250,412 178,382" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="387" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">任一组同根？</text>

  <!-- false 分支 -->
  <path d="M 178 382 L 108 382 L 108 430" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="136" y="374" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="60" y="430" width="96" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="451" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- true 分支 -->
  <path d="M 322 382 L 412 382 L 412 430" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGr)" fill="none" filter="url(#rough2)"/>
  <text x="364" y="374" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="364" y="430" width="96" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="451" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 侧注1 -->
  <rect x="385" y="152" width="122" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="446" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 全程 64 位整数</text>
  <text x="446" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">平方和最大 4×10¹⁸</text>
  <text x="446" y="201" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">int 相乘必溢出</text>

  <!-- 侧注2 -->
  <rect x="385" y="228" width="122" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="446" y="248" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ clamp 投影不可省</text>
  <text x="446" y="264" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">只认边线段上的接触</text>
  <text x="446" y="277" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">防「延长线相交」误判</text>
</svg>
