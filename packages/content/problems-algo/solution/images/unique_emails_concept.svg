<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">独特电子邮件：local 规范化两条规则</text>

  <!-- Original email row -->
  <text x="36" y="62" font-size="12" fill="#888">原始邮件:</text>
  <rect x="110" y="44" width="410" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">test.email+alex@leetcode.com</text>

  <!-- annotation: split at @ -->
  <path d="M 320 82 L 320 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="96" font-size="11" fill="#888">按 @ 切分</text>

  <!-- Local part box -->
  <text x="36" y="132" font-size="12" fill="#888">local:</text>
  <rect x="110" y="114" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">test.email+alex</text>

  <!-- Domain part box -->
  <text x="332" y="132" font-size="12" fill="#888">domain:</text>
  <rect x="392" y="114" width="128" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">leetcode.com</text>

  <!-- Rule 1: remove dots -->
  <path d="M 210 152 L 210 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="168" font-size="11" fill="#888">规则①去掉所有 .</text>

  <rect x="110" y="176" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="196" text-anchor="middle" font-size="13" fill="#333">testemail+alex</text>

  <!-- Rule 2: cut at + -->
  <path d="M 210 212 L 210 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="228" font-size="11" fill="#888">规则②首个 + 后全删</text>

  <rect x="110" y="236" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">testemail</text>

  <!-- domain unchanged arrow -->
  <path d="M 456 152 L 456 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="468" y="206" font-size="11" fill="#4a7a3a">不变</text>

  <!-- Merge -->
  <path d="M 210 272 L 210 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="288" font-size="11" fill="#888">拼接 @</text>

  <!-- Result -->
  <text x="36" y="320" font-size="12" fill="#888">规范后:</text>
  <rect x="110" y="302" width="410" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="315" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">testemail@leetcode.com</text>

  <!-- Insight box -->
  <rect x="40" y="344" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：仅 local 受影响，. 删除 / + 截断；domain 原样保留</text>
</svg>
