<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心概念：前缀整体 +k ⇔ 恰好改写一个相邻差</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 1 操作 1：nums = [1,4,2]，选长度 2 的前缀 [1,4]，k = −2</text>

  <!-- 前缀花括号 -->
  <path d="M 150 74 Q 218 56 286 74" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀整体 −2</text>

  <!-- 数组格子 -->
  <rect x="150" y="80" width="64" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="101" text-anchor="middle" font-size="13" fill="#2f5424" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="222" y="80" width="64" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="254" y="101" text-anchor="middle" font-size="13" fill="#2f5424" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="294" y="80" width="64" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="101" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="326" y="132" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">末尾元素不动</text>

  <!-- 缝隙 → 差分 的箭头 -->
  <path d="M 218 120 L 218 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 290 120 L 290 166" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 差分标签 -->
  <text x="118" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">差分数组 d</text>
  <text x="118" y="189" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d[i]=nums[i]−nums[i−1]</text>

  <!-- 差分格子 -->
  <rect x="186" y="172" width="64" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="192" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="258" y="172" width="64" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="192" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2 → 0</text>

  <text x="218" y="224" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">两端都在前缀内，同加 k，差不变</text>
  <text x="290" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">跨界对：d[2] −= k</text>
  <text x="290" y="253" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">−2 −(−2) = 0 ★</text>

  <!-- 底部要点框 -->
  <rect x="40" y="260" width="440" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么答案 = 非零相邻差的个数？</text>
  <text x="260" y="297" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">① 全等 ⇔ 所有相邻差为 0，与最终公共值 v 无关</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">② d[i] 只受"长度恰为 i 的前缀操作"改写 → 每个非零差至少 1 次操作</text>
  <text x="260" y="331" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">③ 全长前缀一个差都改不了 → 末尾元素永远不用动（官方 hint）</text>
</svg>
