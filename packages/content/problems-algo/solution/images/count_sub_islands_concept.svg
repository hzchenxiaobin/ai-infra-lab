<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心判定：grid2 岛屿的每个格子都在 grid1 中是陆地？
  </text>
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">
    全是陆地 → 子岛屿（计数 +1） ｜ 存在水域 → 非子岛屿（整岛作废）
  </text>

  <text x="130" y="92" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">grid1</text>
  <text x="430" y="92" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">grid2</text>

  <!-- grid1: 4x4, cell=30, origin (70,110) -->
  <!-- row0: 1 1 0 0 -->
  <rect x="70"  y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 1 0 0 0 -->
  <rect x="70"  y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 0 1 0 -->
  <rect x="70"  y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="170" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row3: 0 0 1 0 -->
  <rect x="70"  y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="200" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- grid1 offending cell marker (2,3) is water -->
  <text x="175" y="190" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="175" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">grid1 此处=0</text>

  <!-- grid2: 4x4, cell=30, origin (370,110) -->
  <!-- row0: 1 1 0 0   (island A green) -->
  <rect x="370" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 1 0 0 0 -->
  <rect x="370" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 0 1 1   (island B red) -->
  <rect x="370" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="170" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="170" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <!-- row3: 0 0 1 0 -->
  <rect x="370" y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="200" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="200" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- island A label -->
  <text x="400" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">岛屿 A</text>
  <path d="M 400 248 L 400 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- island B label + arrow to grid1 gap -->
  <text x="455" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">岛屿 B</text>
  <path d="M 460 188 L 192 188" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">对应格 grid1=0 → 整岛作废</text>

  <!-- outcome boxes -->
  <rect x="55" y="300" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="322" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">✓ 全部对应 grid1=1 → 计数 +1</text>

  <rect x="295" y="300" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="322" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">✗ 任一格 grid1=0 → 不计数</text>

  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    判定以「整岛」为单位：一损俱损，一格失配整岛不计
  </text>
</svg>
