<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">表 "two" (cols=3) 的两块独立状态</text>

  <!-- nextId counter -->
  <rect x="34" y="76" width="184" height="148" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">自增计数器</text>
  <text x="126" y="150" text-anchor="middle" font-size="25" fill="#333" filter="url(#rough2)">nextId = 3</text>
  <text x="126" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">新行 id = nextId，随后 ++</text>
  <text x="126" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删除 / 失败插入均不回退 ✓</text>

  <!-- rows map -->
  <rect x="298" y="76" width="228" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">rows: id → 行数据（仅存活）</text>

  <!-- deleted entry (dashed) -->
  <rect x="314" y="116" width="196" height="38" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330" y="140" font-size="12" fill="#999" filter="url(#rough2)">1   ✗ 已删除（键不存在）</text>

  <!-- alive entry -->
  <rect x="314" y="164" width="196" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="188" font-size="12" fill="#333" filter="url(#rough2)">2 → [fourth,fifth,sixth]</text>

  <text x="412" y="226" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">仅存活行占内存</text>
  <text x="412" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">稀疏时 ≪ 曾插入总数</text>

  <!-- ins arrow: counter -> rows -->
  <path d="M 218 150 C 252 150, 270 150, 312 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="265" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ins</text>
  <text x="265" y="170" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">rows[id]=row</text>

  <!-- rmv self loop on rows -->
  <path d="M 460 266 C 460 302, 372 302, 372 266" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="324" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">rmv: rows.erase(id) — nextId 不变</text>

  <!-- sel/exp read badge -->
  <rect x="34" y="252" width="200" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="278" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">sel / exp：只读 rows</text>

  <path d="M 234 274 C 268 274, 286 210, 312 192" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
