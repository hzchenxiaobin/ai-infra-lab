<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：Bob 路径唯一确定，逐节点比“到达时刻”</text>

  <!-- ===== Tree on the left ===== -->
  <text x="150" y="54" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例树（amount 标在右侧）</text>

  <!-- edges -->
  <g stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <line x1="150" y1="86" x2="150" y2="140"/>
    <line x1="150" y1="164" x2="90" y2="214"/>
    <line x1="150" y1="164" x2="210" y2="214"/>
    <line x1="210" y1="238" x2="210" y2="292"/>
  </g>

  <!-- Bob path edges highlighted orange: 3->1->0 -->
  <g stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)">
    <line x1="210" y1="214" x2="150" y2="164"/>
    <line x1="150" y1="140" x2="150" y2="86"/>
  </g>

  <!-- Alice optimal path highlighted blue: 0->1->3->4 -->
  <g stroke="#446688" stroke-width="3" fill="none" filter="url(#rough2)">
    <line x1="150" y1="86" x2="150" y2="140"/>
    <line x1="150" y1="164" x2="210" y2="214"/>
    <line x1="210" y1="238" x2="210" y2="292"/>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <!-- node 0 -->
    <circle cx="150" cy="74" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="150" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="174" y="78" font-size="11" fill="#666">−2</text>
    <!-- node 1 -->
    <circle cx="150" cy="152" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="150" y="157" text-anchor="middle" font-size="13" fill="#7a4a10">1</text>
    <text x="174" y="156" font-size="11" fill="#666">4</text>
    <!-- node 2 (leaf) -->
    <circle cx="90" cy="226" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="90" y="231" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="114" y="230" font-size="11" fill="#666">2</text>
    <!-- node 3 (bob start) -->
    <circle cx="210" cy="226" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="210" y="231" text-anchor="middle" font-size="13" fill="#b85450">3</text>
    <text x="234" y="230" font-size="11" fill="#666">−4</text>
    <!-- node 4 (leaf) -->
    <circle cx="210" cy="304" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="210" y="309" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="234" y="308" font-size="11" fill="#666">6</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <line x1="40" y1="350" x2="70" y2="350" stroke="#446688" stroke-width="3"/>
    <text x="78" y="354" fill="#446688">Alice 最优路径 0→1→3→4</text>
    <line x1="40" y1="372" x2="70" y2="372" stroke="#d6a040" stroke-width="3"/>
    <text x="78" y="376" fill="#d6a040">Bob 唯一路径 3→1→0</text>
  </g>

  <!-- ===== Three cases panel on the right ===== -->
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每个节点 Alice 的得分判定</text>

  <g filter="url(#rough2)" font-size="12" fill="#333">
    <!-- case 1: alice early -->
    <rect x="328" y="70" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="338" y="90" font-size="11" fill="#4a7a3a" font-weight="bold">depth &lt; bobTime</text>
    <text x="338" y="112">Alice 先到 → 全额 amount</text>
    <!-- case 2: same time -->
    <rect x="328" y="138" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="338" y="158" font-size="11" fill="#d6a040" font-weight="bold">depth == bobTime</text>
    <text x="338" y="180">同时到 → 平分 amount / 2</text>
    <!-- case 3: alice late -->
    <rect x="328" y="206" width="200" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="338" y="226" font-size="11" fill="#b85450" font-weight="bold">depth &gt; bobTime</text>
    <text x="338" y="248">Bob 先开过门 → 0 分</text>
    <!-- case 4: not on bob path -->
    <rect x="328" y="274" width="200" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="338" y="294" font-size="11" fill="#446688" font-weight="bold">不在 Bob 路径</text>
    <text x="338" y="316">Bob 永不路过 → 全额</text>
  </g>

  <!-- arrival time annotation on tree -->
  <g filter="url(#rough2)" font-size="10" fill="#666">
    <text x="150" y="110" text-anchor="middle">A:0 / B:2</text>
    <text x="196" y="178">A:1 / B:1</text>
    <text x="248" y="222">A:2 / B:0</text>
    <text x="248" y="300">A:3 / B:∞</text>
  </g>

  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A=Alice 到达时刻(depth)，B=Bob 到达时刻(距 bob 距离)</text>
</svg>
