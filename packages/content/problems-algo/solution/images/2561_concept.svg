<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：频率均分 → 盈余配对 → 小值当成本，全局最小做中介</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">每个值总数须为偶 → 各留一半；多出的盈余两两交换，成本 = min(小, 2×mn)</text>

  <!-- diff1 row -->
  <text x="36" y="104" font-size="12" fill="#446688" font-weight="bold">diff1（b1 盈余）</text>
  <rect x="200" y="88" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="110" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="280" y="88" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="110" text-anchor="middle" font-size="13" fill="#333">8</text>
  <text x="200" y="140" font-size="9" fill="#446688">↑ 升序</text>

  <!-- diff2 row -->
  <text x="36" y="206" font-size="12" fill="#4a7a3a" font-weight="bold">diff2（b2 盈余）</text>
  <rect x="200" y="190" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="212" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="280" y="190" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="212" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="200" y="242" font-size="9" fill="#4a7a3a">↑ 升序</text>

  <!-- reverse pairing crossed lines -->
  <path d="M 226 124 Q 250 160 306 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 124 Q 282 160 226 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="160" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">反向配对</text>
  <text x="266" y="174" text-anchor="middle" font-size="9" fill="#888">小配大</text>

  <!-- pair cost boxes -->
  <text x="400" y="100" font-size="11" fill="#b85450" font-weight="bold">配对 (2,5)：</text>
  <text x="400" y="118" font-size="10" fill="#555">直接 = min(2,5) = 2</text>
  <text x="400" y="133" font-size="10" fill="#555">中介 = 2×mn = 2×1 = 2</text>
  <rect x="396" y="140" width="160" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="476" y="157" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">成本 = min(2, 2) = 2</text>

  <text x="400" y="194" font-size="11" fill="#b85450" font-weight="bold">配对 (8,1)：</text>
  <text x="400" y="212" font-size="10" fill="#555">直接 = min(8,1) = 1</text>
  <text x="400" y="227" font-size="10" fill="#555">中介 = 2×mn = 2</text>
  <rect x="396" y="234" width="160" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="476" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">成本 = min(1, 2) = 1</text>

  <!-- result -->
  <rect x="396" y="276" width="200" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="301" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 2 + 1 = 3</text>

  <!-- 2mn trick explanation box -->
  <rect x="36" y="300" width="340" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="12" fill="#444" font-weight="bold">为什么"小值当成本"？</text>
  <text x="56" y="346" font-size="11" fill="#555">每次交换付 min(a,b)，大值免费。要让被付的 m 个</text>
  <text x="56" y="362" font-size="11" fill="#555">值尽量小 → 反向配对：小配大，被付的恰为 2m 个</text>
  <text x="56" y="378" font-size="11" fill="#555">盈余里最小的 m 个。</text>
  <text x="56" y="402" font-size="12" fill="#b85450" font-weight="bold">全局最小 mn 做中介：</text>
  <text x="56" y="420" font-size="11" fill="#555">借 mn 跑两趟（a↔mn, b↔mn）花费 2×mn，</text>
  <text x="56" y="436" font-size="11" fill="#555">比直接 min(a,b) 更省时取它 → 每对封顶 2×mn。</text>
</svg>
