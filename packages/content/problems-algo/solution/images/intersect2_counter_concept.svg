<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心直觉：计数而非去重，按"最小频次"取交集</text>

  <!-- nums1 -->
  <text x="30" y="64" font-size="12" fill="#888">nums1 =</text>
  <rect x="90" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="186" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="234" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- arrow to counter -->
  <path d="M 290 63 L 330 63" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="56" text-anchor="middle" font-size="10" fill="#888">统计频次</text>

  <!-- Counter table -->
  <text x="350" y="44" font-size="12" fill="#4a7a3a" font-weight="bold">Counter（值 → 出现次数）</text>
  <rect x="350" y="50" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值</text>
  <text x="475" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">次数</text>
  <line x1="435" y1="50" x2="435" y2="76" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="350" y="78" width="220" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="475" y="94" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="100" width="220" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="116" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="475" y="116" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- nums2 scan -->
  <text x="30" y="160" font-size="12" fill="#888">nums2 =</text>
  <rect x="90" y="144" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="113" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">← 第1个</text>
  <rect x="138" y="144" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="161" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">← 第2个</text>

  <!-- per-step notes -->
  <text x="200" y="152" font-size="11" fill="#4a7a3a">x=2：cnt[2]=2 &gt; 0 ✓ → 加入结果，cnt[2]−1 → 1</text>
  <text x="200" y="172" font-size="11" fill="#4a7a3a">x=2：cnt[2]=1 &gt; 0 ✓ → 加入结果，cnt[2]−1 → 0</text>
  <text x="200" y="192" font-size="10" fill="#888">（若 nums2 还有第3个 2：cnt[2]=0 ✗，跳过）</text>

  <!-- result -->
  <rect x="90" y="214" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="240" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">结果 = [2, 2]  ✓ 取最小频次</text>

  <!-- key insight box -->
  <rect x="30" y="276" width="560" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="12" font-weight="bold" fill="#333">关键：与 349 的区别</text>
  <text x="50" y="318" font-size="11" fill="#555">• 349 去重交集 → 用 set，匹配后 erase（每个值至多出现 1 次）</text>
  <text x="50" y="336" font-size="11" fill="#555">• 350 带重复交集 → 用 Counter 计数，匹配后 cnt−1（每个值出现 min(频次₁, 频次₂) 次）</text>
  <text x="50" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">→ 把"存在性查询"升级为"剩余配额查询"</text>
</svg>
