<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：seller 1 与 seller 3 并列最高</text>

  <text x="170" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">Sales 表（关键字段）</text>

  <rect x="70" y="60" width="200" height="24" fill="#eef2f7" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">seller_id</text>
  <text x="170" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">product_id</text>
  <text x="235" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">price</text>

  <rect x="70" y="84" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2000</text>

  <rect x="70" y="106" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">800</text>

  <rect x="70" y="128" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">800</text>

  <rect x="70" y="150" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="235" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2800</text>

  <path d="M170 176 L170 196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="190" font-size="11" fill="#888" filter="url(#rough2)">GROUP BY seller_id</text>

  <rect x="40" y="200" width="135" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="107" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seller 1</text>
  <text x="107" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2000+800=2800 ★</text>

  <rect x="192" y="200" width="135" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seller 2</text>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">800</text>

  <rect x="345" y="200" width="135" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seller 3</text>
  <text x="412" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2800 ★</text>

  <rect x="70" y="270" width="380" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最大 SUM(price) = 2800，seller 1 与 seller 3 并列</text>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出 seller_id：1, 3</text>
</svg>
