<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：n = 5</text>

  <!-- Step 1: sieve -->
  <rect x="40" y="48" width="520" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="70" font-size="12" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">步骤 ①</tspan>  筛 [1, 5] 的质数</text>
  <!-- mini grid 1..5 -->
  <rect x="200" y="76" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="93" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="240" y="76" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="258" y="93" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="280" y="76" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="298" y="93" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="320" y="76" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="93" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="360" y="76" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="378" y="93" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="410" y="93" font-size="11" fill="#4a7a3a" font-weight="bold">→ p = 3</text>

  <!-- arrow -->
  <path d="M 300 110 L 300 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: p! -->
  <rect x="40" y="132" width="250" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="12" fill="#333"><tspan font-weight="bold" fill="#446688">步骤 ②</tspan>  质数位全排列</text>
  <text x="56" y="174" font-size="13" fill="#333">p! = 3! = 3 × 2 × 1 = <tspan font-weight="bold" fill="#446688">6</tspan></text>

  <!-- Step 3: (n-p)! -->
  <rect x="310" y="132" width="250" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="326" y="154" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">步骤 ③</tspan>  非质数位全排列</text>
  <text x="326" y="174" font-size="13" fill="#333">(n−p)! = 2! = 2 × 1 = <tspan font-weight="bold" fill="#d6a040">2</tspan></text>

  <!-- arrows converge -->
  <path d="M 165 190 Q 165 210 240 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 190 Q 435 210 360 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: multiply -->
  <rect x="120" y="226" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="248" text-anchor="middle" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">步骤 ④</tspan>  相乘取模</text>
  <text x="300" y="266" text-anchor="middle" font-size="14" fill="#333">6 × 2 = 12  mod (10⁹+7) = <tspan font-weight="bold" fill="#d6a040">12</tspan></text>

  <!-- arrow -->
  <path d="M 300 280 L 300 298" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="160" y="304" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">输出：12  ✓</text>
</svg>
