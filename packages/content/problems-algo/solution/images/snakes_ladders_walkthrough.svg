<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <g filter="url(#rough2)">
    <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">蛇梯棋：示例 1 最优路径（4 步）</text>
    <path d="M 120 36 Q 320 42 520 36" stroke="#aaa" stroke-width="1" fill="none"/>
  </g>

  <!-- ===== Staircase path ===== -->

  <!-- [1] start -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="68" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
    <text x="68" y="44" text-anchor="middle" font-size="9" fill="#d6a040">起点</text>
  </g>

  <!-- Arrow 1→2 (dice) -->
  <g filter="url(#rough2)">
    <path d="M 68 90 L 68 128" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
    <text x="82" y="112" font-size="10" fill="#4a8edb" font-weight="bold">①掷骰1</text>
  </g>

  <!-- [2] ladder start -->
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="68" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  </g>

  <!-- Arrow 2→15 (ladder) -->
  <g filter="url(#rough2)">
    <path d="M 96 150 L 196 150" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
    <text x="130" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">梯子→15</text>
  </g>

  <!-- [15] -->
  <g filter="url(#rough2)">
    <rect x="200" y="130" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="228" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">15</text>
  </g>

  <!-- Arrow 15→17 (dice) -->
  <g filter="url(#rough2)">
    <path d="M 228 170 L 228 208" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
    <text x="242" y="192" font-size="10" fill="#4a8edb" font-weight="bold">②掷骰2</text>
  </g>

  <!-- [17] snake start -->
  <g filter="url(#rough2)">
    <rect x="200" y="210" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="228" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">17</text>
  </g>

  <!-- Arrow 17→13 (snake) -->
  <g filter="url(#rough2)">
    <path d="M 256 230 L 356 230" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
    <text x="282" y="224" font-size="10" fill="#b85450" font-weight="bold">蛇→13</text>
  </g>

  <!-- [13] -->
  <g filter="url(#rough2)">
    <rect x="360" y="210" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="388" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">13</text>
  </g>

  <!-- Arrow 13→14 (dice) -->
  <g filter="url(#rough2)">
    <path d="M 388 250 L 388 288" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
    <text x="402" y="272" font-size="10" fill="#4a8edb" font-weight="bold">③掷骰1</text>
  </g>

  <!-- [14] ladder start -->
  <g filter="url(#rough2)">
    <rect x="360" y="290" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="388" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">14</text>
  </g>

  <!-- Arrow 14→35 (ladder) -->
  <g filter="url(#rough2)">
    <path d="M 416 310 L 516 310" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
    <text x="440" y="304" font-size="10" fill="#4a7a3a" font-weight="bold">梯子→35</text>
  </g>

  <!-- [35] -->
  <g filter="url(#rough2)">
    <rect x="520" y="290" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="548" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">35</text>
  </g>

  <!-- Arrow 35→36 (dice) -->
  <g filter="url(#rough2)">
    <path d="M 548 330 L 548 368" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
    <text x="562" y="352" font-size="10" fill="#4a8edb" font-weight="bold">④掷骰1</text>
  </g>

  <!-- [36] end -->
  <g filter="url(#rough2)">
    <rect x="520" y="370" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="548" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">36</text>
    <text x="548" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 4 步到达终点</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <rect x="40" y="400" width="12" height="12" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="58" y="410">起点/终点</text>
    <rect x="130" y="400" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" rx="2"/>
    <text x="148" y="410">梯子起点</text>
    <rect x="220" y="400" width="12" height="12" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="238" y="410">蛇起点</text>
    <rect x="300" y="400" width="12" height="12" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="318" y="410">普通方格</text>
  </g>
</svg>
