<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2762a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2762b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：max − min ≤ 2 即合法；右端固定时左端以左全都合法</text>

  <!-- ===== top: the reduction ===== -->
  <rect x="60" y="44" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">任意两元素 |a − b| ≤ 2  ⟺  max − min ≤ 2</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#d6a040">把「检查所有两两组合」降为「维护两个极值」</text>

  <!-- ===== middle: window with maxq / minq ===== -->
  <text x="60" y="118" font-size="12" fill="#888" font-weight="bold">窗口 [left, right]，双单调队列维护极值</text>

  <!-- array 5 4 2 4 -->
  <g font-size="18" font-weight="bold">
    <rect x="90" y="132" width="50" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="115" y="163" text-anchor="middle" fill="#333">5</text>

    <rect x="140" y="132" width="50" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="165" y="163" text-anchor="middle" fill="#333">4</text>

    <rect x="190" y="132" width="50" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="215" y="163" text-anchor="middle" fill="#b85450">2</text>

    <rect x="240" y="132" width="50" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="265" y="163" text-anchor="middle" fill="#4a7a3a">4</text>
  </g>

  <!-- labels for min and max -->
  <text x="215" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">min=2</text>
  <text x="265" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">max=4</text>

  <!-- window bracket -->
  <path d="M88,190 Q88,198 96,198 L284,198 Q292,198 292,190" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="215" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left=1, right=3：max−min=4−2=2 ≤ 2 ✓</text>

  <!-- ===== bottom: counting trick ===== -->
  <text x="60" y="248" font-size="12" fill="#888" font-weight="bold">计数：以 right 结尾的合法子数组恰有 right−left+1 个</text>

  <!-- show 3 subarrays ending at right=3: [4],[2,4],[4,2,4] -->
  <g font-size="16" font-weight="bold">
    <!-- [4] -->
    <rect x="240" y="266" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="265" y="293" text-anchor="middle" fill="#4a7a3a">4</text>
    <text x="265" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">[4]</text>

    <!-- [2,4] -->
    <rect x="190" y="266" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="215" y="293" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="205" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">[2,4]</text>

    <!-- [4,2,4] -->
    <rect x="140" y="266" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="165" y="293" text-anchor="middle" fill="#4a7a3a">4</text>
    <text x="170" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">[4,2,4]</text>
  </g>

  <!-- arrow: left to right counting -->
  <path d="M150,338 L290,338" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2762a)" filter="url(#rough2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="10" fill="#d6a040">起点 ∈ [left, right]，共 3 个 = right−left+1</text>

  <!-- summary box -->
  <rect x="60" y="366" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">每步 ans += right − left + 1，累计即答案</text>
  <text x="280" y="401" text-anchor="middle" font-size="10" fill="#446688">1438 的双单调队列 + 713 的计数型滑窗</text>
</svg>
