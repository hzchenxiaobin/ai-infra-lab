<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="460" height="420" fill="#fafafa"/>

  <text x="230" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 算法流程：滚动数组递推</text>

  <!-- Start -->
  <ellipse cx="230" cy="52" rx="40" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="56" text-anchor="middle" font-size="12" fill="#446688">开始</text>

  <!-- Arrow start → init -->
  <path d="M 230 66 L 230 78" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="100" y="80" width="260" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化</text>
  <text x="230" y="118" text-anchor="middle" font-size="10" fill="#555">n = min(arrLen, steps+1), dp[0]=1, dp[1..n−1]=0</text>

  <!-- Arrow init → decision -->
  <path d="M 230 128 L 230 140" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 230 144 L 300 170 L 230 196 L 160 170 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s ≤ steps ?</text>

  <!-- No arrow → return -->
  <path d="M 300 170 L 322 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="164" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- Return box -->
  <rect x="322" y="156" width="124" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 dp[0] % MOD</text>

  <!-- Yes arrow → compute -->
  <path d="M 230 196 L 230 210" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="206" font-size="10" fill="#4a7a3a">是</text>

  <!-- Compute box -->
  <rect x="60" y="212" width="340" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">滚动转移（读旧 dp，写新 nd）</text>
  <text x="230" y="252" text-anchor="middle" font-size="10" fill="#555">nd[p] = (dp[p] + dp[p−1] + dp[p+1]) % MOD</text>
  <text x="230" y="269" text-anchor="middle" font-size="10" fill="#888">边界: p=0 无左项, p=n−1 无右项; 完成后 dp = nd</text>

  <!-- Arrow compute → s++ -->
  <path d="M 230 278 L 230 290" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- s++ oval -->
  <ellipse cx="230" cy="306" rx="40" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a">s++</text>

  <!-- Loop back arrow: s++ → left → up → decision -->
  <path d="M 190 306 L 36 306 L 36 170 L 154 170" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="48" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 48 240)">循环回顶</text>

  <!-- Note box -->
  <rect x="60" y="348" width="340" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="230" y="370" text-anchor="middle" font-size="10" fill="#666">时间 O(steps × n), 空间 O(n), n = min(arrLen, steps+1)</text>
  <text x="230" y="388" text-anchor="middle" font-size="10" fill="#888">steps ≤ 500, n ≤ 501 → 最多约 25 万次运算</text>
</svg>
