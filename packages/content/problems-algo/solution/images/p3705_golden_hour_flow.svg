<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333"
        filter="url(#rough2)">算法流程：一趟分组聚合 → 四条件过滤 → 双键降序</text>

  <!-- ① FROM + 行级派生 -->
  <g filter="url(#rough2)">
    <rect x="40" y="42" width="330" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="205" y="59" text-anchor="middle" font-size="11.5" fill="#446688">FROM restaurant_orders（n 行，不做行级过滤）</text>
    <text x="205" y="76" text-anchor="middle" font-size="11" fill="#446688">行级派生 is_peak = HOUR(ts) ∈ [11,14] ∪ [18,21]</text>
  </g>
  <path d="M 205 84 L 205 102" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② GROUP BY -->
  <g filter="url(#rough2)">
    <rect x="40" y="106" width="330" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="205" y="126" text-anchor="middle" font-size="11.5" fill="#446688">GROUP BY customer_id —— n 行折叠成 m 组</text>
  </g>
  <path d="M 205 136 L 205 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 组级聚合 -->
  <g filter="url(#rough2)">
    <rect x="40" y="158" width="330" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="205" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">组级聚合（一趟算齐四个指标）</text>
    <text x="205" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a">COUNT(*) 总单 · SUM(is_peak) 高峰单</text>
    <text x="205" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a">COUNT(评分) 已评单 · AVG(评分) 均分</text>
  </g>
  <path d="M 205 214 L 205 232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 外层过滤 -->
  <g filter="url(#rough2)">
    <rect x="40" y="236" width="330" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="205" y="254" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">派生表外层 WHERE：四条件同时成立</text>
    <text x="205" y="271" text-anchor="middle" font-size="10.5" fill="#d6a040">总单 ≥ 3 · 高峰占比 ≥ 60%</text>
    <text x="205" y="286" text-anchor="middle" font-size="10.5" fill="#d6a040">均分 ≥ 4.0 · 评分率 ≥ 50%（5 组 → 3 行）</text>
  </g>
  <path d="M 205 292 L 205 310" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 排序输出 -->
  <g filter="url(#rough2)">
    <rect x="40" y="314" width="330" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="205" y="330" text-anchor="middle" font-size="11" fill="#446688">ORDER BY average_rating DESC, customer_id DESC</text>
    <text x="205" y="345" text-anchor="middle" font-size="10.5" fill="#446688">→ 输出 103 | 101 | 105（4.67 并列靠 id 破）</text>
  </g>

  <!-- 右侧批注 1：分母口径 -->
  <g filter="url(#rough2)">
    <rect x="392" y="158" width="118" height="56" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" rx="8"/>
    <text x="451" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">分母口径各异！</text>
    <text x="451" y="191" text-anchor="middle" font-size="9" fill="#4a7a3a">AVG 跳过 NULL</text>
    <text x="451" y="205" text-anchor="middle" font-size="9" fill="#4a7a3a">COUNT(*) 不跳</text>
  </g>
  <path d="M 392 186 L 372 186" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧批注 2：WHERE vs HAVING -->
  <g filter="url(#rough2)">
    <rect x="392" y="236" width="118" height="56" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8"/>
    <text x="451" y="254" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">组级条件进不去 WHERE</text>
    <text x="451" y="269" text-anchor="middle" font-size="9" fill="#d6a040">WHERE 先于分组执行</text>
    <text x="451" y="283" text-anchor="middle" font-size="9" fill="#d6a040">→ HAVING 或外层 WHERE</text>
  </g>
  <path d="M 392 264 L 372 264" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- 右上小注 -->
  <text x="451" y="106" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">SQL 执行顺序：</text>
  <text x="451" y="120" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">FROM→WHERE→GROUP</text>
  <text x="451" y="133" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">→HAVING→SELECT→ORDER</text>
</svg>
