<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐字符 OR 入掩码，满 26 位即提前返回</text>

  <!-- Start node -->
  <ellipse cx="270" cy="54" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333">开始: mask = 0</text>

  <!-- Arrow down to D1 -->
  <path d="M 270 72 L 270 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: 还有字符? -->
  <polygon points="270,92 360,124 270,156 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333">还有字符?</text>

  <!-- D1 No -> return false (right) -->
  <path d="M 360 124 L 398 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="116" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="398" y="106" width="125" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="129" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- D1 Yes -> process (down) -->
  <path d="M 270 156 L 270 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="166" font-size="11" fill="#82b366">是</text>

  <!-- Process: mask |= 1 << (c - 'a') -->
  <rect x="170" y="172" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mask |= 1 &lt;&lt; (c − 'a')</text>

  <!-- Arrow down to D2 -->
  <path d="M 270 204 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: mask == FULL? -->
  <polygon points="270,222 360,254 270,286 180,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333">mask ==</text>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#333">FULL ?</text>

  <!-- D2 Yes -> return true (right) -->
  <path d="M 360 254 L 398 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="246" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="398" y="236" width="125" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="259" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- D2 No -> loop back (left and up, dashed) -->
  <path d="M 180 254 L 100 254 L 100 124 L 178 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="248" font-size="10" fill="#888">否</text>
  <text x="100" y="190" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 100 190)">继续下一字符</text>

  <!-- Summary note -->
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#888">关键：mask == FULL 时立即返回 true（提前终止）；循环正常结束则返回 false</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#888">辅助空间 O(1)，全字母句平均在第 26 个不同字母处停止</text>
</svg>
