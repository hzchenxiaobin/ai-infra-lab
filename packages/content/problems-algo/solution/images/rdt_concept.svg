<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三段切分 + 两个局部映射</text>

  <!-- ===== Input string ===== -->
  <text x="40" y="62" font-size="12" fill="#888">输入字符串</text>
  <rect x="40" y="70" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">"20th Oct 2052"</text>

  <!-- split arrow -->
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">split(' ')</text>
  <path d="M 280 132 L 280 148" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Three segments ===== -->
  <text x="40" y="162" font-size="12" fill="#888">三段切分</text>

  <!-- Day segment -->
  <rect x="60" y="170" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#666">Day 段</text>
  <text x="120" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">"20th"</text>

  <!-- Month segment -->
  <rect x="220" y="170" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#666">Month 段</text>
  <text x="280" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">"Oct"</text>

  <!-- Year segment -->
  <rect x="380" y="170" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="190" text-anchor="middle" font-size="11" fill="#666">Year 段</text>
  <text x="440" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">"2052"</text>

  <!-- Arrows down to mapping -->
  <path d="M 120 220 L 120 240" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 220 L 280 240" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 220 L 440 240" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Local mappings ===== -->
  <text x="40" y="252" font-size="12" fill="#888">局部映射</text>

  <!-- Day: strip suffix -->
  <rect x="60" y="258" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">剥末尾 2 字符</text>
  <text x="120" y="296" text-anchor="middle" font-size="11" fill="#666">"20th" → "20"</text>
  <text x="120" y="310" text-anchor="middle" font-size="11" fill="#666">后缀恒为 2 字符</text>

  <!-- Month: hash lookup -->
  <rect x="220" y="258" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">哈希查表</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#666">"Oct" → 10</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#666">12 项小集合</text>

  <!-- Year: no transform -->
  <rect x="380" y="258" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无需变换</text>
  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#666">"2052" 原样</text>
  <text x="440" y="310" text-anchor="middle" font-size="11" fill="#666">已是 4 位</text>

  <!-- Arrows to output -->
  <path d="M 120 314 L 120 326 L 440 326 L 440 314" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 314 L 280 340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="120" y="342" width="320" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">"2052-10-20"（补零拼接）</text>
</svg>
