<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：任何子数组的值 ≤ 全局 max − 全局 min</text>

  <!-- 原数组 -->
  <text x="76" y="68" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="80" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="48" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="48" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="42" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">全局 max</text>
  <text x="255" y="94" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">全局 min</text>

  <path d="M 180 100 L 180 110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 子数组 1：整个数组 -->
  <text x="76" y="137" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">① 整个数组</text>
  <rect x="80" y="118" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="118" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="118" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="118" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="296" y="131" font-size="12.5" fill="#333" filter="url(#rough2)">值 = 5 − 1 = 4</text>
  <text x="296" y="147" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">= 全局极差，达到上界 ✓</text>

  <!-- 子数组 2：nums[1..3] -->
  <text x="76" y="191" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">② nums[1..3]</text>
  <rect x="80" y="172" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="172" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="172" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="296" y="185" font-size="12.5" fill="#333" filter="url(#rough2)">值 = 5 − 1 = 4</text>
  <text x="296" y="201" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同时含 5 和 1，同样取等 ✓</text>

  <!-- 子数组 3：nums[0..1] -->
  <text x="76" y="245" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">③ nums[0..1]</text>
  <rect x="80" y="226" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="226" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="296" y="239" font-size="12.5" fill="#333" filter="url(#rough2)">值 = 4 − 2 = 2</text>
  <text x="296" y="255" font-size="10.5" fill="#b85450" filter="url(#rough2)">&lt; 4，缺 5 或缺 1 必然亏损 ✗</text>

  <!-- 结论框 -->
  <rect x="48" y="278" width="424" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">上界可达 + 同一子数组可选 k 次 ⇒ 答案 = k × (max − min)</text>

  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 子集的最大不超过全集的最大、子集的最小不小于全集的最小——极差被全局极差封顶</text>
</svg>
