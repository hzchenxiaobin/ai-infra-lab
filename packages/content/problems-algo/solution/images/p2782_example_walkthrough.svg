<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=6, categories=[1,1,2,2,3,3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#aaa">（categories 对你的代码隐藏，此处仅为示意）</text>

  <!-- table header -->
  <rect x="20" y="56" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
  <rect x="60" y="56" width="100" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">ask 结果</text>
  <rect x="160" y="56" width="130" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">reps（处理后）</text>
  <rect x="290" y="56" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">计数</text>
  <rect x="340" y="56" width="200" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">说明</text>

  <!-- row 0: i=0 -->
  <rect x="20" y="80" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="60" y="80" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="160" y="80" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="96" text-anchor="middle" font-size="10.5" fill="#333">[0]</text>
  <rect x="290" y="80" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="340" y="80" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="96" font-size="10" fill="#4a7a3a">初始代表</text>

  <!-- row 1: i=1 -->
  <rect x="20" y="104" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="60" y="104" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">ask(1,0)=T</text>
  <rect x="160" y="104" width="130" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="10.5" fill="#333">[0]</text>
  <rect x="290" y="104" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="340" y="104" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="120" font-size="10" fill="#4a7a3a">匹配 → 跳过</text>

  <!-- row 2: i=2 -->
  <rect x="20" y="128" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="60" y="128" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="144" text-anchor="middle" font-size="10" fill="#b85450">ask(2,0)=F</text>
  <rect x="160" y="128" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[0, 2]</text>
  <rect x="290" y="128" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="340" y="128" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="144" font-size="10" fill="#b85450">无匹配 → 新代表</text>

  <!-- row 3: i=3 -->
  <rect x="20" y="152" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="60" y="152" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="9.5" fill="#4a7a3a">ask(3,0)=F (3,2)=T</text>
  <rect x="160" y="152" width="130" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="168" text-anchor="middle" font-size="10.5" fill="#333">[0, 2]</text>
  <rect x="290" y="152" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="340" y="152" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="168" font-size="10" fill="#4a7a3a">匹配 → 跳过</text>

  <!-- row 4: i=4 -->
  <rect x="20" y="176" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="60" y="176" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="192" text-anchor="middle" font-size="9.5" fill="#b85450">ask(4,0)=F (4,2)=F</text>
  <rect x="160" y="176" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[0, 2, 4]</text>
  <rect x="290" y="176" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="340" y="176" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="192" font-size="10" fill="#b85450">无匹配 → 新代表</text>

  <!-- row 5: i=5 -->
  <rect x="20" y="200" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="60" y="200" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a">ask(5,0)=F (5,2)=F (5,4)=T</text>
  <rect x="160" y="200" width="130" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="216" text-anchor="middle" font-size="10.5" fill="#333">[0, 2, 4]</text>
  <rect x="290" y="200" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="216" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="200" width="200" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="216" font-size="10" fill="#4a7a3a">匹配 → 跳过</text>

  <!-- final result -->
  <rect x="20" y="240" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终：reps = [0, 2, 4]，唯一类别数 = 3 ✅</text>

  <!-- ask count analysis -->
  <rect x="20" y="296" width="520" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">询问次数分析</text>
  <text x="40" y="340" font-size="11" fill="#555">• 贪心代表元法：只对比 reps（1+1+2+2+3 = 9 次 ask）</text>
  <text x="40" y="358" font-size="11" fill="#555">• 暴力全对法：对比所有 j &lt; i（0+1+2+3+4+5 = 15 次 ask）</text>
  <text x="40" y="378" font-size="11" fill="#555">• 最坏情况 O(n²)，但平均远优于暴力（k 个类别时 O(n·k)）</text>
  <text x="300" y="378" font-size="10.5" fill="#888">k = 唯一类别数</text>
</svg>
