<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 2]</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[i][s] = 填好前 i+1 位且 arr1[i] = s 的方案数（灰格 = 超出 s ≤ nums[i]）</text>

  <!-- ============ dp 演算表 ============ -->
  <!-- 表头 -->
  <rect x="30" y="58" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="58" y="58" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">nums[i]</text>
  <rect x="110" y="58" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">Δ</text>
  <rect x="142" y="58" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s=0</text>
  <rect x="194" y="58" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s=1</text>
  <rect x="246" y="58" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="272" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s=2</text>
  <rect x="298" y="58" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s=3</text>
  <rect x="350" y="58" width="144" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="422" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">转移式（t 的上界）</text>

  <!-- 行 0 -->
  <rect x="30" y="80" width="28" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="58" y="80" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="80" width="32" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="126" y="99" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <rect x="142" y="80" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="194" y="80" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="246" y="80" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="272" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="298" y="80" width="52" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="99" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="350" y="80" width="144" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="99" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">初始：首位任取</text>

  <!-- 行 1 -->
  <rect x="30" y="110" width="28" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="129" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="110" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="129" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="110" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="129" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="142" y="110" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="129" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="194" y="110" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="110" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="272" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="298" y="110" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="350" y="110" width="144" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="129" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">tmax = s − 1（③更紧）</text>

  <!-- 行 2 -->
  <rect x="30" y="140" width="28" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="58" y="140" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="140" width="32" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="126" y="159" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="142" y="140" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="194" y="140" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="140" width="52" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="272" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="140" width="52" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="159" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="350" y="140" width="144" height="30" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="159" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">tmax = s（②主导）</text>

  <!-- 前缀和转移弧线 1：行0 的 s=0..2 汇入 行1 的 s=3 -->
  <path d="M 220 112 Q 262 112 294 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="262" y="106" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">Σ dp[0][0..2] = 1+1+1</text>

  <!-- 前缀和转移弧线 2：行1 的 s=0..2 汇入 行2 的 s=2 -->
  <path d="M 220 142 Q 244 146 242 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="204" y="150" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">Σ dp[1][0..2] = 0+1+2</text>

  <!-- 答案条 -->
  <rect x="30" y="182" width="464" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="200" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = dp[2][0] + dp[2][1] + dp[2][2] = 0 + 1 + 3 = 4 ✓</text>

  <!-- 死路说明 -->
  <rect x="30" y="218" width="464" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">i=1 的 s=0 被封死：nums 从 2 涨到 3（Δ=+1），arr1 停在 0 意味着</text>
  <text x="262" y="246" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">arr2 要从 ≤2 涨到 3，违反非增 —— tmax = −1 &lt; 0，状态死亡</text>

  <!-- 四个单调数组对 -->
  <rect x="30" y="258" width="226" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="279" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">([0,1,1], [2,2,1])　　([0,1,2], [2,2,0])</text>
  <rect x="268" y="258" width="226" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="279" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">([0,2,2], [2,1,0])　　([1,2,2], [1,1,0])</text>

  <!-- 底部彩蛋 -->
  <rect x="30" y="300" width="464" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="317" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">另一例 [5,5,5,5]：dp 三轮前缀和后为 1,4,10,20,35,56，Σ = 126 ✓</text>
  <text x="262" y="333" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">恰为隔板数 C(9,4) —— nums 全相等时退化为弱递增序列计数，见「扩展」</text>
</svg>
