<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字典树结构：相同子树 → 相同序列化签名 → 全部标记删除</text>

  <!-- root node -->
  <ellipse cx="270" cy="52" rx="24" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="11" fill="#666">root</text>

  <!-- edges root -> a, b -->
  <path d="M 256 64 L 195 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 284 64 L 345 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Dashed highlight boxes for /a and /b subtrees -->
  <rect x="108" y="78" width="150" height="172" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <rect x="282" y="78" width="150" height="172" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>

  <!-- node a -->
  <rect x="160" y="84" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- node b -->
  <rect x="330" y="84" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- edges a -> x, a -> z -->
  <path d="M 172 112 L 142 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 198 112 L 228 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- edges b -> x, b -> z -->
  <path d="M 342 112 L 312 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 368 112 L 398 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node a/x -->
  <rect x="117" y="140" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="159" text-anchor="middle" font-size="12" fill="#333">x</text>

  <!-- node a/z -->
  <rect x="203" y="140" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="159" text-anchor="middle" font-size="12" fill="#333">z</text>

  <!-- node b/x -->
  <rect x="287" y="140" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="159" text-anchor="middle" font-size="12" fill="#333">x</text>

  <!-- node b/z -->
  <rect x="373" y="140" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="159" text-anchor="middle" font-size="12" fill="#333">z</text>

  <!-- edges a/x -> y, b/x -> y -->
  <path d="M 142 168 L 142 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 312 168 L 312 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node a/x/y -->
  <rect x="117" y="196" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="215" text-anchor="middle" font-size="12" fill="#333">y</text>

  <!-- node b/x/y -->
  <rect x="287" y="196" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="215" text-anchor="middle" font-size="12" fill="#333">y</text>

  <!-- equivalence annotation -->
  <text x="183" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">/a 子树</text>
  <text x="270" y="273" text-anchor="middle" font-size="22" fill="#b85450">≡</text>
  <text x="357" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">/b 子树</text>

  <!-- bottom annotation -->
  <rect x="40" y="290" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">后序序列化：serial(node) = 拼接排序后的 name + "(" + serial(child) + ")"</text>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#b85450">serial(/a) = serial(/b) = "x(y())z()" → freq = 2 ≥ 2 → 全部标记删除</text>
</svg>
