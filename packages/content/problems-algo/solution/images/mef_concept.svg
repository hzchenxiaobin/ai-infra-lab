<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三种合法情形：删一个元素后频率全相等</text>

  <!-- Panel 1 -->
  <rect x="24" y="52" width="532" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="13" fill="#446688" filter="url(#rough2)">① maxFreq == 1：每个值各出现一次</text>
  <line x1="52" y1="152" x2="232" y2="152" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <rect x="58" y="138" width="26" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="90" y="138" width="26" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="122" y="138" width="26" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="138" width="26" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="186" y="138" width="26" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <text x="103" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <text x="135" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c</text>
  <text x="167" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>
  <text x="199" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <path d="M252,145 L322,145" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="140" font-size="12" fill="#333" filter="url(#rough2)">删任意一个</text>
  <text x="332" y="158" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 频率仍全为 1</text>

  <!-- Panel 2 -->
  <rect x="24" y="188" width="532" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="214" font-size="13" fill="#446688" filter="url(#rough2)">② 仅一个值频率=1，其余频率=maxFreq</text>
  <line x1="52" y1="288" x2="232" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <rect x="58" y="246" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="90" y="246" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="122" y="246" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="274" width="26" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x</text>
  <text x="103" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">y</text>
  <text x="135" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">z</text>
  <text x="167" y="302" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">w</text>
  <text x="71" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="103" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="135" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="167" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M252,281 L322,281" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="276" font-size="12" fill="#333" filter="url(#rough2)">删掉频率=1 的 w</text>
  <text x="332" y="294" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 全为 maxFreq=3</text>

  <!-- Panel 3 -->
  <rect x="24" y="324" width="532" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="350" font-size="13" fill="#446688" filter="url(#rough2)">③ 仅一个值频率=maxFreq，其余频率=maxFreq−1</text>
  <line x1="52" y1="424" x2="312" y2="424" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <rect x="66" y="368" width="26" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="66" y="368" width="26" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="138" y="382" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="382" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="79" y="442" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x</text>
  <text x="151" y="442" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">y</text>
  <text x="223" y="442" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">z</text>
  <text x="79" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="151" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="223" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <path d="M322,417 L392,417" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="412" font-size="12" fill="#333" filter="url(#rough2)">x 削去顶端一格</text>
  <text x="402" y="430" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 全为 maxFreq−1=3</text>
</svg>
