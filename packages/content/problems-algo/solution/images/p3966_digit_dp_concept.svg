<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：区间拆前缀 F(r) − F(l−1)，对上界逐位「贴紧 → 放开」</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">F(x) = [1, x] 内好整数个数；x 的十进制位从高到低放数，一旦某位放得比上界小，低位全部自由</text>

  <!-- ① 前缀拆分 -->
  <text x="30" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 区间计数 → 两次前缀计数</text>

  <!-- F(l-1) 上括线 -->
  <path d="M 50 72 L 50 78 L 150 78 L 150 72" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">F(l−1) 个（被减掉）</text>

  <!-- 数轴 -->
  <path d="M 50 98 L 470 98" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- [l, r] 绿色区间 -->
  <rect x="185" y="88" width="245" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 刻度 -->
  <path d="M 150 92 L 150 104" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 185 92 L 185 104" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 430 92 L 430 104" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">l−1</text>
  <text x="188" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">l</text>
  <text x="430" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">r</text>
  <text x="308" y="106" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">目标区间</text>

  <!-- F(r) 下括线 -->
  <path d="M 50 130 L 50 136 L 430 136 L 430 130" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">F(r) 个（好整数，含 l 左侧部分）</text>

  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = F(r) − F(l−1)，两次数位 DP 相减即可</text>

  <!-- ② 数位贴上界 -->
  <text x="30" y="188" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 求 F(x)：x = 8642，k = 2（本例恰好每位相邻差 = 2）</text>

  <!-- 已贴上界括线 -->
  <path d="M 60 196 L 60 202 L 150 202 L 150 196" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="194" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">已贴上界（tight）</text>

  <!-- 数位格子 -->
  <rect x="60" y="208" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="234" text-anchor="middle" font-size="15" fill="#33507a" filter="url(#rough2)">8</text>

  <rect x="108" y="208" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="234" text-anchor="middle" font-size="15" fill="#33507a" filter="url(#rough2)">6</text>

  <rect x="156" y="208" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="177" y="234" text-anchor="middle" font-size="15" fill="#8a6d1f" filter="url(#rough2)">4</text>

  <rect x="204" y="208" width="42" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="225" y="234" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">2</text>

  <!-- 相邻差弧线 -->
  <path d="M 81 252 Q 105 268 129 252" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="105" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|8−6|=2 ✓</text>

  <path d="M 129 252 Q 153 268 177 252" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="153" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|6−4|=2 ✓</text>

  <path d="M 177 252 Q 201 268 225 252" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="201" y="276" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">|4−d|≤k ?</text>

  <!-- 当前位说明 -->
  <text x="177" y="292" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">当前位（pos）</text>
  <text x="177" y="306" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">d ∈ {0,…,4}（≤上界）</text>
  <text x="225" y="292" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">后续位</text>
  <text x="228" y="306" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d&lt;4 则 0..9 自由</text>

  <!-- 规则注释框 -->
  <rect x="290" y="196" width="216" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="216" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">放数字 d 的规则：</text>
  <text x="398" y="236" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">① d ≤ (tight ? 上界位 : 9)</text>
  <text x="398" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">② 已开始（started）→ |d − prev| ≤ k</text>
  <text x="398" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">③ d 严格小于上界位 → 后续 tight 解除</text>
  <text x="398" y="292" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">状态：(pos, prev, tight, started)</text>

  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前导 0 不算「已开始」：未 started 时放 0，prev 保持 −1、不检查约束；个位数 1..9 在两次 F 相减时自动抵消</text>
</svg>
