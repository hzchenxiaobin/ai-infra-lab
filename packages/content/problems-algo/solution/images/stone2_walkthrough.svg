<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[2,7,4,1,8,1], S=23, target=11</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">stone</text>

  <rect x="110" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[0]</text>

  <rect x="170" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[4]</text>

  <rect x="230" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[7]</text>

  <rect x="290" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[9]</text>

  <rect x="350" y="44" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="385" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[11]</text>

  <rect x="420" y="44" width="135" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="487" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- Row: 初始 -->
  <rect x="30" y="74" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="90" text-anchor="middle" font-size="10.5" fill="#555">初始</text>
  <rect x="110" y="74" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="74" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="230" y="74" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="290" y="74" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="350" y="74" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="420" y="74" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="90" text-anchor="middle" font-size="10" fill="#888">空集凑出 0</text>

  <!-- Row: 2 -->
  <rect x="30" y="100" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="116" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="100" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="100" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="230" y="100" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="290" y="100" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="350" y="100" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="116" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="420" y="100" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="116" text-anchor="middle" font-size="10" fill="#888">凑出 {2}</text>

  <!-- Row: 7 -->
  <rect x="30" y="126" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="142" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">7</text>
  <rect x="110" y="126" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="126" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="230" y="126" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="290" y="126" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="142" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="350" y="126" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="142" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="420" y="126" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="142" text-anchor="middle" font-size="10" fill="#888">{7},{2,7}</text>

  <!-- Row: 4 (key row - dp[11] hits 11) -->
  <rect x="30" y="152" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="110" y="152" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="152" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="230" y="152" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="290" y="152" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="350" y="152" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11 ⭐</text>
  <rect x="420" y="152" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="168" text-anchor="middle" font-size="10" fill="#888">{7,4}=11 达到 target</text>

  <!-- Row: 1 -->
  <rect x="30" y="178" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="178" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="178" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="230" y="178" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="290" y="178" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="350" y="178" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="194" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <rect x="420" y="178" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="194" text-anchor="middle" font-size="10" fill="#888">已最优，无提升</text>

  <!-- Row: 8 -->
  <rect x="30" y="204" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">8</text>
  <rect x="110" y="204" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="204" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="220" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="230" y="204" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="290" y="204" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="350" y="204" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="220" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <rect x="420" y="204" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="220" text-anchor="middle" font-size="10" fill="#888">8 可凑但 ≤ 11</text>

  <!-- Row: 1 -->
  <rect x="30" y="230" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="230" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="170" y="230" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="246" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="230" y="230" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="290" y="230" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="350" y="230" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="246" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <rect x="420" y="230" width="135" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="246" text-anchor="middle" font-size="10" fill="#888">已最优</text>

  <!-- 结论框 -->
  <rect x="60" y="270" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="293" text-anchor="middle" font-size="12.5" fill="#333">dp[target] = dp[11] = 11（子集 {2,7,1,1} 或 {7,4}）</text>

  <rect x="60" y="312" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = S − 2 × dp[target] = 23 − 22 = 1</text>

  <!-- 示例2验证 -->
  <rect x="60" y="362" width="460" height="64" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">示例 2：[31,26,33,21,40]</text>
  <text x="290" y="398" text-anchor="middle" font-size="10.5" fill="#888">S=151, target=75, dp[75]=73（子集 {40,33}）</text>
  <text x="290" y="414" text-anchor="middle" font-size="10.5" fill="#888">答案 = 151 − 2×73 = 5</text>
</svg>
