<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐用户奖牌时间线 → 是否命中条件</text>

  <!-- ===== Contest axis ===== -->
  <line x1="115" y1="56" x2="530" y2="56" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="70" y="60" text-anchor="middle" font-size="9" fill="#888">contest →</text>
  <!-- contest labels: 190..196 at x = 130 + (c-190)*64 -->
  <text x="130" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">190</text>
  <text x="194" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">191</text>
  <text x="258" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">192</text>
  <text x="322" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">193</text>
  <text x="386" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">194</text>
  <text x="450" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">195</text>
  <text x="514" y="48" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">196</text>

  <!-- ===== User 1: Sarah, y=100. 190 G, 193 G, 195 B, 196 G ; gold=3 -> cond2 ===== -->
  <rect x="20" y="86" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="105" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1 Sarah</text>
  <circle cx="130" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <circle cx="322" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <circle cx="450" cy="100" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="104" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="514" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="514" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <rect x="548" y="86" width="82" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="589" y="105" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 条件② 金×3</text>

  <!-- ===== User 2: Bob, y=160. 190 B,191 G,192 S,194 B,195 S,196 B ; triple 190-192 distinct -> cond1 ===== -->
  <rect x="20" y="146" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="165" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2 Bob</text>
  <!-- highlight triple 190-192 -->
  <rect x="113" y="144" width="158" height="32" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <circle cx="130" cy="160" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="164" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="194" cy="160" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="164" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <circle cx="258" cy="160" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="164" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <circle cx="386" cy="160" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="164" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="450" cy="160" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="164" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <circle cx="514" cy="160" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="514" y="164" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <rect x="548" y="146" width="82" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="589" y="165" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 条件① 连续</text>

  <!-- ===== User 3: Alice, y=220. 191 S,192 B,193 S ; triple 191-193 NOT distinct -> reject ===== -->
  <rect x="20" y="206" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="225" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 Alice</text>
  <rect x="177" y="204" width="158" height="32" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <circle cx="194" cy="220" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="224" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <circle cx="258" cy="220" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="224" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="322" cy="220" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="224" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <rect x="548" y="206" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="589" y="225" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ 三色不齐</text>

  <!-- ===== User 4: Hercy, y=280. 194 G,195 G ; only 2, gold=2 -> reject ===== -->
  <rect x="20" y="266" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="285" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4 Hercy</text>
  <circle cx="386" cy="280" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <circle cx="450" cy="280" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <rect x="548" y="266" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="589" y="285" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ 金×2 不足</text>

  <!-- ===== User 5: Quarz, y=340. 190 S,191 B,192 G,193 B,194 S,196 S ; triple 190-192 distinct -> cond1 ===== -->
  <rect x="20" y="326" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="345" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5 Quarz</text>
  <rect x="113" y="324" width="158" height="32" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <circle cx="130" cy="340" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="344" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <circle cx="194" cy="340" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="344" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="258" cy="340" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">G</text>
  <circle cx="322" cy="340" r="13" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="344" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">B</text>
  <circle cx="386" cy="340" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="344" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <circle cx="514" cy="340" r="13" fill="#eceff1" stroke="#607d8b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="514" y="344" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">S</text>
  <rect x="548" y="326" width="82" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="589" y="345" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 条件① 连续</text>

  <!-- ===== Bottom legend ===== -->
  <rect x="80" y="372" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="387" text-anchor="middle" font-size="9" fill="#666">G=gold  S=silver  B=bronze　绿框=连续三场且三色齐全　结果：Sarah / Bob / Quarz（按 user_id 升序）</text>
</svg>
