<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：x 方向不行，就换 y 方向再试一次</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <ellipse cx="95" cy="55" rx="36" ry="18" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <text x="95" y="60" text-anchor="middle" font-size="13" fill="#333">开始</text>
    <line x1="131" y1="55" x2="158" y2="55" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- check(x) subroutine -->
  <g filter="url(#rough2)">
    <rect x="160" y="32" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <line x1="170" y1="36" x2="170" y2="74" stroke="#446688" stroke-width="1.2"/>
    <line x1="370" y1="36" x2="370" y2="74" stroke="#446688" stroke-width="1.2"/>
    <text x="270" y="60" text-anchor="middle" font-size="12" fill="#2d3f57">check(x)：[sx,ex] 排序 + 扫描数块</text>
    <line x1="270" y1="78" x2="270" y2="92" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="270,94 355,126 270,158 185,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="131" text-anchor="middle" font-size="12.5" fill="#7a5c1e">x 块数 ≥ 3 ?</text>
    <line x1="355" y1="126" x2="404" y2="126" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
    <text x="378" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a">是</text>
    <ellipse cx="452" cy="126" rx="44" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="452" y="131" text-anchor="middle" font-size="12.5" fill="#2d4d22">return true</text>
    <line x1="270" y1="158" x2="270" y2="176" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="282" y="173" font-size="12" fill="#b85450">否</text>
  </g>

  <!-- check(y) subroutine -->
  <g filter="url(#rough2)">
    <rect x="160" y="178" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <line x1="170" y1="182" x2="170" y2="220" stroke="#446688" stroke-width="1.2"/>
    <line x1="370" y1="182" x2="370" y2="220" stroke="#446688" stroke-width="1.2"/>
    <text x="270" y="206" text-anchor="middle" font-size="12" fill="#2d3f57">check(y)：[sy,ey] 排序 + 扫描数块</text>
    <line x1="270" y1="224" x2="270" y2="238" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="270,240 355,272 270,304 185,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="277" text-anchor="middle" font-size="12.5" fill="#7a5c1e">y 块数 ≥ 3 ?</text>
    <line x1="355" y1="272" x2="404" y2="272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
    <text x="378" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a">是</text>
    <ellipse cx="452" cy="272" rx="44" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="452" y="277" text-anchor="middle" font-size="12.5" fill="#2d4d22">return true</text>
    <line x1="270" y1="304" x2="270" y2="322" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="282" y="319" font-size="12" fill="#b85450">否</text>
  </g>

  <!-- false -->
  <g filter="url(#rough2)">
    <ellipse cx="270" cy="348" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="270" y="353" text-anchor="middle" font-size="12.5" fill="#8a3a35">return false</text>
  </g>

  <!-- scan logic note -->
  <g filter="url(#rough2)">
    <rect x="22" y="140" width="128" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 3"/>
    <text x="86" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c1e">扫描逻辑</text>
    <text x="86" y="185" text-anchor="middle" font-size="11" fill="#7a5c1e">s ≥ maxEnd</text>
    <text x="86" y="203" text-anchor="middle" font-size="11" fill="#7a5c1e">→ 开新块 blocks++</text>
    <text x="86" y="225" text-anchor="middle" font-size="11" fill="#7a5c1e">否则并入当前块</text>
    <text x="86" y="243" text-anchor="middle" font-size="11" fill="#7a5c1e">maxEnd 取更大</text>
    <line x1="150" y1="201" x2="158" y2="201" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  </g>
</svg>
