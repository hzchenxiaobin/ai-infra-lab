<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：等长全 1 掩码 + 异或 = 补数（含 n=0 边界）</text>

  <!-- ===== n = 10 = 1010 ===== -->
  <text x="36" y="88" font-size="12.5" fill="#446688" font-weight="bold">n = 10</text>
  <text x="36" y="104" font-size="10" fill="#888">二进制</text>
  <rect x="100" y="68" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="121" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="68" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="171" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="200" y="68" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="221" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="68" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="271" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="304" y="90" font-size="11" fill="#888">有效位 L = 4</text>

  <!-- XOR symbol and mask -->
  <text x="72" y="142" font-size="14" fill="#4a7a3a" font-weight="bold">^</text>
  <text x="36" y="158" font-size="12.5" fill="#d6a040" font-weight="bold">mask=15</text>
  <text x="36" y="174" font-size="10" fill="#888">(1&lt;&lt;4)−1</text>
  <rect x="100" y="138" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="138" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="138" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="138" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="304" y="160" font-size="11" fill="#d6a040" font-weight="bold">低 4 位全 1</text>

  <!-- divider -->
  <line x1="96" y1="190" x2="296" y2="190" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ===== result = 5 = 0101 ===== -->
  <text x="36" y="226" font-size="12.5" fill="#b85450" font-weight="bold">= 5</text>
  <rect x="100" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="150" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="200" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="250" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="304" y="228" font-size="11" fill="#b85450" font-weight="bold">← 4 位全翻转</text>

  <!-- ===== right side: n = 0 edge case ===== -->
  <rect x="346" y="56" width="178" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">边界：n = 0</text>
  <text x="435" y="96" text-anchor="middle" font-size="10" fill="#888">bit_length(0) = 0</text>

  <text x="358" y="124" font-size="11" fill="#446688" font-weight="bold">n</text>
  <rect x="376" y="108" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="358" y="162" font-size="11" fill="#d6a040" font-weight="bold">mask</text>
  <rect x="376" y="146" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="166" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="422" y="166" font-size="9.5" fill="#888">max(1,0)=1</text>

  <text x="358" y="200" font-size="11" fill="#b85450" font-weight="bold">=1</text>
  <rect x="376" y="184" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="204" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="422" y="204" font-size="9.5" fill="#b85450" font-weight="bold">补数 = 1</text>
  <text x="435" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">L 取 max(1, L) 兜底</text>

  <!-- formula box -->
  <rect x="40" y="262" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">补数 = n ^ ((1 &lt;&lt; L) − 1)，L = bit_length(n)，n=0 时 L 兜底为 1</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">异或只翻转 mask=1 的位（有效位），前导零不动；与 476 同法，仅多一个 n=0 兜底</text>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#888">不能直接 ~n：会把 32 位前导零全翻成 1，得到负数 / 巨数</text>
</svg>
