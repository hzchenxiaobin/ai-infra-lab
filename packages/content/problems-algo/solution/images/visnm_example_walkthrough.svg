<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：包含型 vs 重复型</text>

  <!-- ============ Example 1 ============ -->
  <rect x="24" y="40" width="552" height="200" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="60" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：peaks=[[2,2],[6,3],[5,4]] → 输出 2</text>

  <text x="40" y="84" font-size="10.5" fill="#888" filter="url(#rough2)">转区间：</text>
  <rect x="108" y="70" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,4]</text>
  <rect x="178" y="70" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,9]</text>
  <rect x="248" y="70" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,9]</text>

  <text x="360" y="87" font-size="10.5" fill="#888" filter="url(#rough2)">排序后：</text>
  <rect x="416" y="70" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="444" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[0,4]</text>
  <rect x="476" y="70" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="504" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[1,9]</text>
  <rect x="536" y="70" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="556" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[3,9]</text>

  <!-- scan rows -->
  <text x="40" y="124" font-size="10.5" fill="#888" filter="url(#rough2)">扫描：</text>

  <text x="108" y="124" font-size="11" fill="#333" filter="url(#rough2)">[0,4]</text>
  <text x="150" y="124" font-size="10.5" fill="#888" filter="url(#rough2)">cnt=1</text>
  <text x="200" y="124" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4&gt;−∞ ✓ 可见</text>
  <text x="320" y="124" font-size="10.5" fill="#888" filter="url(#rough2)">maxR=4</text>

  <text x="108" y="148" font-size="11" fill="#333" filter="url(#rough2)">[1,9]</text>
  <text x="150" y="148" font-size="10.5" fill="#888" filter="url(#rough2)">cnt=1</text>
  <text x="200" y="148" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9&gt;4 ✓ 可见</text>
  <text x="320" y="148" font-size="10.5" fill="#888" filter="url(#rough2)">maxR=9</text>

  <text x="108" y="172" font-size="11" fill="#333" filter="url(#rough2)">[3,9]</text>
  <text x="150" y="172" font-size="10.5" fill="#888" filter="url(#rough2)">cnt=1</text>
  <text x="200" y="172" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">9&gt;9 ✗ 被包含</text>
  <text x="320" y="172" font-size="10.5" fill="#888" filter="url(#rough2)">maxR=9</text>

  <path d="M108,180 L108,192 L300,192 L300,180" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="204" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">[3,9] ⊆ [1,9]：峰(6,3)落入山(5,4)</text>

  <text x="420" y="170" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2 ✓</text>
  <text x="420" y="188" font-size="9.5" fill="#888" filter="url(#rough2)">可见：峰(2,2)、(5,4)</text>

  <!-- ============ Example 2 ============ -->
  <rect x="24" y="252" width="552" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="272" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2：peaks=[[1,3],[1,3]] → 输出 0</text>

  <text x="40" y="298" font-size="10.5" fill="#888" filter="url(#rough2)">转区间：</text>
  <rect x="108" y="284" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[−2,4]</text>
  <rect x="178" y="284" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[−2,4]</text>

  <text x="280" y="301" font-size="10.5" fill="#888" filter="url(#rough2)">两山同峰，互含</text>

  <text x="40" y="338" font-size="10.5" fill="#888" filter="url(#rough2)">扫描：</text>
  <text x="108" y="338" font-size="11" fill="#333" filter="url(#rough2)">[−2,4]</text>
  <text x="160" y="338" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt=2（重复）</text>
  <text x="280" y="338" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 整组跳过</text>
  <text x="380" y="338" font-size="10.5" fill="#888" filter="url(#rough2)">maxR=4</text>

  <text x="420" y="384" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0 ✓</text>
  <text x="420" y="402" font-size="9.5" fill="#888" filter="url(#rough2)">同峰互相包含，皆不可见</text>

  <text x="40" y="414" font-size="10.5" fill="#888" filter="url(#rough2)">注：重复组即使右端突破 maxR 也判为不可见——峰落入「另一座同形山」</text>

  <text x="300" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">关键：right &gt; maxR 判「不被先前的包含」；cnt==1 判「无同形重复」</text>
</svg>
