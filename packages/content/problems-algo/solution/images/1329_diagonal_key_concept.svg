<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：同一条对角线上的元素 i − j 相同</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">沿右下方向走，i、j 各 +1，故 i − j 恒定 → 用它作对角线编号</text>

  <!-- ===== matrix on the left ===== -->
  <!-- column header j -->
  <g font-size="10" fill="#888">
    <text x="70"  y="82" text-anchor="middle">j=0</text>
    <text x="130" y="82" text-anchor="middle">1</text>
    <text x="190" y="82" text-anchor="middle">2</text>
    <text x="250" y="82" text-anchor="middle">3</text>
  </g>
  <!-- row header i -->
  <g font-size="10" fill="#888">
    <text x="30" y="117" text-anchor="middle">i=0</text>
    <text x="30" y="163" text-anchor="middle">1</text>
    <text x="30" y="209" text-anchor="middle">2</text>
  </g>

  <!-- cells: (i,j,value,key) -->
  <!-- (0,0,3,0) green -->
  <rect x="40" y="90" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <text x="70" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">k=0</text>
  <!-- (0,1,3,-1) blue -->
  <rect x="100" y="90" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <text x="130" y="132" text-anchor="middle" font-size="9" fill="#446688">k=−1</text>
  <!-- (0,2,1,-2) orange -->
  <rect x="160" y="90" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="190" y="132" text-anchor="middle" font-size="9" fill="#d6a040">k=−2</text>
  <!-- (0,3,1,-3) red -->
  <rect x="220" y="90" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="250" y="132" text-anchor="middle" font-size="9" fill="#b85450">k=−3</text>

  <!-- (1,0,2,1) purple -->
  <rect x="40" y="136" width="60" height="46" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="70" y="178" text-anchor="middle" font-size="9" fill="#8e44ad">k=1</text>
  <!-- (1,1,2,0) green -->
  <rect x="100" y="136" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="130" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a">k=0</text>
  <!-- (1,2,1,-1) blue -->
  <rect x="160" y="136" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="190" y="178" text-anchor="middle" font-size="9" fill="#446688">k=−1</text>
  <!-- (1,3,2,-2) orange -->
  <rect x="220" y="136" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="250" y="178" text-anchor="middle" font-size="9" fill="#d6a040">k=−2</text>

  <!-- (2,0,1,2) teal -->
  <rect x="40" y="182" width="60" height="46" fill="#e0f5f3" stroke="#2a8a7a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="70" y="224" text-anchor="middle" font-size="9" fill="#2a8a7a">k=2</text>
  <!-- (2,1,1,1) purple -->
  <rect x="100" y="182" width="60" height="46" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="130" y="224" text-anchor="middle" font-size="9" fill="#8e44ad">k=1</text>
  <!-- (2,2,1,0) green -->
  <rect x="160" y="182" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="210" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="190" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a">k=0</text>
  <!-- (2,3,2,-1) blue -->
  <rect x="220" y="182" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="210" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="250" y="224" text-anchor="middle" font-size="9" fill="#446688">k=−1</text>

  <!-- diagonal direction arrow (down-right) over k=0 diagonal -->
  <path d="M 70 100 L 190 192" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="9" fill="#d6a040" font-weight="bold">右下 ↘</text>

  <!-- ===== legend / sorted result on the right ===== -->
  <text x="430" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">按 k 分组 → 排序</text>

  <g font-size="10">
    <!-- k=2 teal -->
    <rect x="320" y="92" width="16" height="12" fill="#e0f5f3" stroke="#2a8a7a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="103" fill="#333">k=2：[1] → [1]</text>
    <!-- k=1 purple -->
    <rect x="320" y="112" width="16" height="12" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="123" fill="#333">k=1：[2,1] → [1,2]</text>
    <!-- k=0 green -->
    <rect x="320" y="132" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="143" fill="#333">k=0：[3,2,1] → [1,2,3]</text>
    <!-- k=-1 blue -->
    <rect x="320" y="152" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="163" fill="#333">k=−1：[3,1,2] → [1,2,3]</text>
    <!-- k=-2 orange -->
    <rect x="320" y="172" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="183" fill="#333">k=−2：[1,2] → [1,2]</text>
    <!-- k=-3 red -->
    <rect x="320" y="192" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="344" y="203" fill="#333">k=−3：[1] → [1]</text>
  </g>

  <!-- note box -->
  <rect x="40" y="252" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="11" fill="#333">沿对角线右下走一步：i←i+1，j←j+1，则 (i+1)−(j+1) = i−j 不变。</text>
  <text x="60" y="292" font-size="11" fill="#333">故 <tspan font-weight="bold" fill="#b85450">key = i − j</tspan> 唯一标识一条对角线；同 key 的格子归一组，组内排序后写回即可。</text>

  <!-- total diagonals note -->
  <rect x="40" y="324" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="346" font-size="11" fill="#333">对角线总数 = m + n − 1</text>
  <text x="60" y="362" font-size="10" fill="#888">key 取值范围：−(n−1) … +(m−1)</text>

  <rect x="300" y="324" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="346" font-size="11" fill="#333">最长对角线长度 = min(m, n)</text>
  <text x="320" y="362" font-size="10" fill="#888">单条排序 O(min(m,n) log min(m,n))</text>

  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">同色 = 同对角线 = 同 i−j；分组排序互不干扰</text>
</svg>
