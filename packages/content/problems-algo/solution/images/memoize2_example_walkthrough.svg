<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)" font-weight="bold">示例2 vs 示例3 演算：=== 判等的分水岭</text>

  <!-- ===== 示例2 表 ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)" font-weight="bold">示例2：每次新建 {} ，引用互不相同 → 全部未命中</text>

  <!-- 表头 -->
  <rect x="30" y="64" width="510" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">
    <text x="70" y="83" text-anchor="middle">第 i 次</text>
    <text x="190" y="83" text-anchor="middle">实参</text>
    <text x="330" y="83" text-anchor="middle">{} === {} ?</text>
    <text x="470" y="83" text-anchor="middle">calls</text>
  </g>
  <g stroke="#cccccc" stroke-width="1" filter="url(#rough2)">
    <line x1="120" y1="64" x2="120" y2="190"/>
    <line x1="260" y1="64" x2="260" y2="190"/>
    <line x1="400" y1="64" x2="400" y2="190"/>
  </g>

  <!-- 行1 -->
  <rect x="30" y="94" width="510" height="32" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="115" text-anchor="middle">1</text>
    <text x="190" y="115" text-anchor="middle">{a,b}</text>
    <text x="330" y="115" text-anchor="middle">—（首次）</text>
    <text x="470" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- 行2 -->
  <rect x="30" y="126" width="510" height="32" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="147" text-anchor="middle">2</text>
    <text x="190" y="147" text-anchor="middle">{c,d}</text>
    <text x="330" y="147" text-anchor="middle" fill="#b85450">false</text>
    <text x="470" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- 行3 -->
  <rect x="30" y="158" width="510" height="32" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="179" text-anchor="middle">3</text>
    <text x="190" y="179" text-anchor="middle">{e,f}</text>
    <text x="330" y="179" text-anchor="middle" fill="#b85450">false</text>
    <text x="470" y="179" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== 示例3 表 ===== -->
  <text x="280" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">示例3：同一个 o ，引用相同 → 第 2、3 次命中</text>

  <!-- 表头 -->
  <rect x="30" y="228" width="510" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">
    <text x="70" y="247" text-anchor="middle">第 i 次</text>
    <text x="190" y="247" text-anchor="middle">实参</text>
    <text x="330" y="247" text-anchor="middle">o === o ?</text>
    <text x="470" y="247" text-anchor="middle">calls</text>
  </g>
  <g stroke="#cccccc" stroke-width="1" filter="url(#rough2)">
    <line x1="120" y1="228" x2="120" y2="354"/>
    <line x1="260" y1="228" x2="260" y2="354"/>
    <line x1="400" y1="228" x2="400" y2="354"/>
  </g>

  <!-- 行1 -->
  <rect x="30" y="258" width="510" height="32" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="279" text-anchor="middle">1</text>
    <text x="190" y="279" text-anchor="middle">o, o</text>
    <text x="330" y="279" text-anchor="middle">—（首次）</text>
    <text x="470" y="279" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- 行2 命中 -->
  <rect x="30" y="290" width="510" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="311" text-anchor="middle">2</text>
    <text x="190" y="311" text-anchor="middle">o, o</text>
    <text x="330" y="311" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true → 命中</text>
    <text x="470" y="311" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- 行3 命中 -->
  <rect x="30" y="322" width="510" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="343" text-anchor="middle">3</text>
    <text x="190" y="343" text-anchor="middle">o, o</text>
    <text x="330" y="343" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true → 命中</text>
    <text x="470" y="343" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- 结论框 -->
  <rect x="30" y="370" width="510" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="46" y="390" font-size="12" fill="#333" filter="url(#rough)">💡 JSON.stringify 会把两表都判成"命中"——但示例2 应当未命中。</text>
  <text x="46" y="404" font-size="12" fill="#333" filter="url(#rough)">　 只有 Map 键的 ===/SameValueZero 才能区分"新对象 vs 同一对象"。</text>
</svg>
