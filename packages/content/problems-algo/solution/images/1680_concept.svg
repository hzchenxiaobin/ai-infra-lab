<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    拼接二进制 = 左移 bits(i) 位 + 按位或 i
  </text>

  <!-- Band 1: i=1 -->
  <text x="74" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=1</text>
  <text x="74" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">bits=1</text>
  <rect x="150" y="74" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="196" y="96" font-size="12" fill="#888" filter="url(#rough2)">= "1" = 1</text>

  <!-- arrow down to band 2 -->
  <path d="M165,110 L165,128" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="175" y="124" font-size="10" fill="#d6a040" filter="url(#rough2)">&lt;&lt;2 | 10</text>

  <!-- Band 2: i=2 -->
  <text x="74" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=2</text>
  <text x="74" y="164" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">bits=2</text>
  <rect x="150" y="134" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="134" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="134" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="156" font-size="12" fill="#888" filter="url(#rough2)">= "110" = 6</text>

  <!-- arrow down to band 3 -->
  <path d="M197,170 L197,188" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="207" y="184" font-size="10" fill="#d6a040" filter="url(#rough2)">&lt;&lt;2 | 11</text>

  <!-- Band 3: i=3 -->
  <text x="74" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=3</text>
  <text x="74" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">bits=2</text>
  <rect x="150" y="194" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="194" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="194" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="246" y="194" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="278" y="194" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="216" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="216" font-size="12" fill="#888" filter="url(#rough2)">= "11011" = 27</text>

  <!-- legend -->
  <rect x="388" y="74" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="408" y="86" font-size="11" fill="#555" filter="url(#rough2)">i=1 的位</text>
  <rect x="388" y="94" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="408" y="106" font-size="11" fill="#555" filter="url(#rough2)">i=2 的位</text>
  <rect x="388" y="114" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="408" y="126" font-size="11" fill="#555" filter="url(#rough2)">i=3 的位</text>

  <!-- bottom insight -->
  <rect x="48" y="262" width="444" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="285" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    追加 i 的二进制 = 把 ans 左移 bits(i) 位，再按位或 i
  </text>
  <text x="270" y="305" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    bits(i) 只在 i 为 2 的幂时 +1：1→1, 2→2, 3→2, 4→3, 8→4 …
  </text>
  <text x="270" y="323" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    （n=3 时 ans=11011₂=27，与示例 2 一致）
  </text>
</svg>
