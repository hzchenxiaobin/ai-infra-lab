<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fdfcf7"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">划分数字的方案数：DP 状态定义</text>
  <path d="M 170 44 Q 300 52 430 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#888">把字符串切成若干正整数，要求非递减、无前导 0</text>

  <!-- 字符串切分示意 -->
  <text x="60" y="96" font-size="13" fill="#4a8edb" font-weight="bold">示例：num = "327"</text>

  <g filter="url(#sk)">
    <rect x="70" y="108" width="46" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="93" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">3</text>

  <text x="124" y="131" font-size="16" fill="#888">,</text>

  <g filter="url(#sk)">
    <rect x="138" y="108" width="70" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="173" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">27</text>

  <text x="225" y="131" font-size="11" fill="#4a7a3a">← 3 ≤ 27 ✓ 非递减</text>

  <!-- 第二种切分 -->
  <g filter="url(#sk)">
    <rect x="70" y="158" width="120" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="130" y="181" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">327</text>
  <text x="205" y="181" font-size="11" fill="#d6a040">← 整段作为一个数 ✓</text>

  <text x="60" y="218" font-size="11" fill="#888">两种合法方案 → 答案 = 2</text>

  <!-- DP 状态定义框 -->
  <g filter="url(#sk)">
    <rect x="60" y="238" width="480" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="262" font-size="13" fill="#4a8edb" font-weight="bold">状态定义</text>
  <text x="80" y="284" font-size="12" fill="#2b2b2b">dp[i][l] = 切分 num[0..i-1] 前 i 个字符、且最后一个数长度为 l 的方案数</text>
  <text x="80" y="304" font-size="11" fill="#666">最后一个数 = num[i-l .. i-1]，起点 s = i-l</text>
  <text x="80" y="320" font-size="11" fill="#b03a3a">约束：num[s] ≠ '0'（无前导 0）</text>

  <!-- 递推核心 -->
  <g filter="url(#sk)">
    <rect x="60" y="338" width="480" height="50" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="360" font-size="11" fill="#b03a3a" font-weight="bold">递推：前一个数 ≤ 当前数</text>
  <text x="80" y="378" font-size="11" fill="#444">长度更短 → 自动更小；等长 → 字符串比较（用 LCP 加速）</text>
</svg>
