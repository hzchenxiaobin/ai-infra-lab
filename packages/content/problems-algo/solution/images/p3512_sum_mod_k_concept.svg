<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">每次操作总和恰好 −1：向下走到 k 的最近倍数</text>

  <!-- 数组 -->
  <text x="82" y="92" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums</text>

  <rect x="92" y="64" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="120" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>

  <rect x="158" y="64" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="186" y="79" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">#1</text>
  <text x="186" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">9</text>

  <rect x="224" y="64" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#2</text>
  <text x="252" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">7</text>

  <rect x="330" y="70" width="152" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">S = 3+9+7 = 19</text>

  <text x="186" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">减 4 次：9 → 5</text>

  <text x="260" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">选哪个下标都行：每次操作 S 恰好 −1（下标是烟雾弹）</text>

  <!-- 数轴 -->
  <path d="M 46 206 L 480 206" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 80 203.5 L 80 208.5 M 100 203.5 L 100 208.5 M 120 203.5 L 120 208.5 M 140 203.5 L 140 208.5 M 180 203.5 L 180 208.5 M 200 203.5 L 200 208.5 M 220 203.5 L 220 208.5 M 240 203.5 L 240 208.5 M 280 203.5 L 280 208.5 M 300 203.5 L 300 208.5 M 320 203.5 L 320 208.5 M 340 203.5 L 340 208.5 M 380 203.5 L 380 208.5 M 400 203.5 L 400 208.5 M 420 203.5 L 420 208.5" stroke="#9aa7b5" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="100" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k = 5</text>

  <ellipse cx="60" cy="206" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">0</text>

  <ellipse cx="160" cy="206" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>

  <ellipse cx="260" cy="206" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">10</text>

  <ellipse cx="360" cy="206" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="360" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">15</text>
  <text x="356" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≤ S 的最大倍数</text>

  <ellipse cx="460" cy="206" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">20</text>

  <ellipse cx="440" cy="206" rx="11.5" ry="11.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">19</text>
  <text x="438" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">S = 19</text>

  <!-- 向上：不可达 -->
  <path d="M 447 198 C 451 180, 459 180, 462 197" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="496" y="190" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">到不了</text>

  <!-- 向下：红色弧线 -->
  <path d="M 436 218 C 424 252, 372 252, 363 222" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">向下减 4 次：19 → 15（步数 = 余数）</text>

  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿色圆点 = k 的倍数；只能减不能加 ⇒ 唯一去向是 ≤ S 的最大倍数</text>

  <!-- 结论 -->
  <rect x="95" y="302" width="330" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">answer = S mod k</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">本题：19 mod 5 = 4</text>
</svg>
