<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建映射 → 转 A → 双向 BIT 扫描 → 乘法求和</text>

  <!-- Step 1: Build pos2 -->
  <rect x="170" y="42" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 建 pos2 映射：pos2[v] = v 在 nums2 中的下标</text>

  <path d="M 290 82 L 290 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Build A -->
  <rect x="170" y="100" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 构造数组 A：A[i] = pos2[nums1[i]]</text>

  <path d="M 290 140 L 290 154" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Two parallel BIT passes -->
  <text x="290" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 双向 BIT 扫描（树状数组维护值域前缀计数）</text>

  <!-- Left pass -->
  <rect x="40" y="178" width="230" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左→右扫描：求 left[j]</text>
  <text x="155" y="214" text-anchor="middle" font-size="10" fill="#555">BIT 维护已扫过的 A[i] 值</text>

  <rect x="60" y="224" width="190" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="155" y="244" text-anchor="middle" font-size="10" fill="#333">for j = 0 → n−1:</text>

  <rect x="60" y="262" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="155" y="282" text-anchor="middle" font-size="10" fill="#446688">left[j] = query(A[j]−1)</text>

  <rect x="60" y="298" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="155" y="318" text-anchor="middle" font-size="10" fill="#d6a040">update(A[j], +1)</text>

  <text x="155" y="346" text-anchor="middle" font-size="9.5" fill="#888">query(x) = 值 ≤ x 的元素个数</text>

  <!-- Right pass -->
  <rect x="310" y="178" width="230" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">右→左扫描：求 right[j]</text>
  <text x="425" y="214" text-anchor="middle" font-size="10" fill="#555">BIT 维护已扫过的 A[k] 值</text>

  <rect x="330" y="224" width="190" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="244" text-anchor="middle" font-size="10" fill="#333">for j = n−1 → 0:</text>

  <rect x="330" y="262" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="282" text-anchor="middle" font-size="10" fill="#446688">right[j] = total − query(A[j])</text>

  <rect x="330" y="298" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">update(A[j], +1)</text>

  <text x="425" y="346" text-anchor="middle" font-size="9.5" fill="#888">total = 当前 BIT 元素总数</text>

  <!-- converge -->
  <path d="M 155 360 L 155 374 L 425 374 L 425 360" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 374 L 290 388" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Multiply and sum -->
  <rect x="150" y="392" width="280" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">④ 答案 = Σⱼ left[j] × right[j]</text>
  <text x="290" y="430" text-anchor="middle" font-size="10" fill="#888">乘法原理：左选 left[j] 个，右选 right[j] 个，独立相乘</text>

  <!-- complexity note -->
  <rect x="150" y="450" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="472" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">复杂度：O(n log n) 时间 / O(n) 空间</text>

  <text x="290" y="494" text-anchor="middle" font-size="9.5" fill="#aaa" font-style="italic">注：BIT 下标 1-indexed，值域 [0, n−1] 直接做 key，无需离散化</text>
</svg>
