<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">多项式哈希：左端 = p⁰，滑动方向决定乘除</text>

  <!-- Hash formula box -->
  <rect x="40" y="44" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hash(s, p, m) = val(s[0])·p⁰ + val(s[1])·p¹ + … + val(s[k−1])·p^(k−1)  (mod m)</text>
  <text x="310" y="88" text-anchor="middle" font-size="11" fill="#555">最左字符 → 最低位 p⁰；最右字符 → 最高位 p^(k−1)</text>

  <text x="310" y="124" text-anchor="middle" font-size="12" fill="#888">窗口滑动时，各字符的「位权」随位置改变 → 需移位（乘/除 p）</text>

  <!-- Left panel: L -> R -->
  <rect x="30" y="138" width="275" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="167" y="160" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">左 → 右滑动（窗口右移）</text>

  <rect x="50" y="172" width="235" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="192" font-size="11" fill="#333">[ s[i]</text>
  <text x="120" y="192" font-size="11" fill="#555"> s[i+1] … s[i+k−1] ]</text>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="#888">p⁰    p¹      p^(k−1)</text>

  <path d="M 167 214 L 167 236" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="50" y="240" width="235" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="260" font-size="11" fill="#aaa" text-decoration="line-through">s[i]</text>
  <text x="105" y="260" font-size="11" fill="#333"> s[i+1] … s[i+k−1]</text>
  <rect x="200" y="244" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="222" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s[i+k]</text>

  <rect x="50" y="282" width="235" height="44" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="167" y="300" text-anchor="middle" font-size="11" fill="#333">H(i+1) = (H(i) − val(s[i])) · p⁻¹</text>
  <text x="167" y="316" text-anchor="middle" font-size="11" fill="#333">         + val(s[i+k])·p^(k−1)</text>

  <text x="167" y="334" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">需除以 p → 模逆元，✗</text>

  <!-- Right panel: R -> L -->
  <rect x="315" y="138" width="275" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="452" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">右 → 左滑动（窗口左移）</text>

  <rect x="335" y="172" width="235" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="192" font-size="11" fill="#555">[ s[i+1] … s[i+k−1]</text>
  <text x="510" y="192" font-size="11" fill="#333"> s[i+k] ]</text>
  <text x="452" y="208" text-anchor="middle" font-size="10" fill="#888">p⁰      p^(k−2)   p^(k−1)</text>

  <path d="M 452 214 L 452 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="335" y="240" width="235" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="244" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="362" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s[i]</text>
  <text x="392" y="260" font-size="11" fill="#333"> s[i+1] … s[i+k−1]</text>
  <text x="510" y="260" font-size="11" fill="#aaa" text-decoration="line-through">s[i+k]</text>

  <rect x="335" y="282" width="235" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="300" text-anchor="middle" font-size="11" fill="#333">H(i) = val(s[i]) + p · H(i+1)</text>
  <text x="452" y="316" text-anchor="middle" font-size="11" fill="#333">       − val(s[i+k]) · pᵏ</text>

  <text x="452" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">只用乘法 + 减法，✓</text>

  <!-- Recurrence highlight -->
  <rect x="60" y="356" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心递推（右→左）：H(i) = ( val(s[i]) + p·H(i+1) − val(s[i+k])·pᵏ ) mod m</text>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#555">预计算 pk = powerᵏ mod modulo，即可 O(1) 推进每个窗口</text>

  <text x="310" y="424" text-anchor="middle" font-size="11" fill="#888">val('a')=1 … val('z')=26；从右端起累计，到第 k 个字符即得首个完整窗口哈希</text>
  <text x="310" y="446" text-anchor="middle" font-size="11" fill="#888">逆序扫描 + 「最后命中即最左」→ 自然得到下标最小的子串</text>
</svg>
