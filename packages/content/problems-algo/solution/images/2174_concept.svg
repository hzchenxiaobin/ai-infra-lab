<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心操作：选一个值为 1 的格子，清零其所在行与列</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">grid[i][j]==1 时可选 → 将第 i 行和第 j 列所有格子置 0（不是翻转，是清除）</text>

  <!-- ===== Left: Before operation ===== -->
  <text x="36" y="72" font-size="11.5" fill="#446688" font-weight="bold">① 操作前</text>

  <!-- 3x3 grid before -->
  <!-- row 0 -->
  <rect x="36" y="80" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="80" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="80" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- row 1 -->
  <rect x="36" y="114" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- highlighted chosen cell (1,1) -->
  <rect x="80" y="114" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="136" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="124" y="114" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- row 2 -->
  <rect x="36" y="148" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="170" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="80" y="148" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="170" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="148" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="170" text-anchor="middle" font-size="14" fill="#aaa">0</text>

  <!-- row/col highlight labels -->
  <text x="102" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 选 (1,1)，清零第 1 行 + 第 1 列</text>

  <!-- arrow to after -->
  <path d="M 180 131 L 210 131" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="195" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">操作</text>

  <!-- ===== Right: After operation ===== -->
  <text x="230" y="72" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 操作后</text>

  <!-- 3x3 grid after clearing row 1 and col 1 -->
  <rect x="230" y="80" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="274" y="80" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="102" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="318" y="80" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="230" y="114" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="136" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="274" y="114" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="136" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="318" y="114" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="136" text-anchor="middle" font-size="14" fill="#aaa">0</text>

  <rect x="230" y="148" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="170" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="274" y="148" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="170" text-anchor="middle" font-size="14" fill="#aaa">0</text>
  <rect x="318" y="148" width="44" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="170" text-anchor="middle" font-size="14" fill="#aaa">0</text>

  <!-- cleared labels -->
  <path d="M 252 190 L 252 196 L 340 196 L 340 190" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="296" y="210" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">第 1 行 + 第 1 列 → 全 0</text>

  <!-- ===== Bottom left: Monotone property ===== -->
  <line x1="190" y1="226" x2="190" y2="420" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="36" y="240" font-size="11.5" fill="#b85450" font-weight="bold">③ 关键性质：单调下降</text>

  <rect x="36" y="250" width="140" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">操作只清零，不创建 1</text>
  <text x="106" y="288" text-anchor="middle" font-size="10" fill="#555">1 的数量单调递减</text>
  <text x="106" y="304" text-anchor="middle" font-size="10" fill="#555">状态空间有限</text>
  <text x="106" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⟹ BFS 必然终止</text>

  <!-- ===== Bottom right: State compression ===== -->
  <text x="230" y="240" font-size="11.5" fill="#446688" font-weight="bold">④ 状态压缩：位掩码</text>

  <rect x="210" y="250" width="320" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="230" y="270" font-size="10.5" fill="#446688" font-weight="bold">grid → bitmask</text>
  <!-- mini grid -->
  <rect x="240" y="278" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="250" y="291" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="260" y="278" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="291" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="280" y="278" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="290" y="291" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="240" y="296" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="250" y="309" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="260" y="296" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="309" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="280" y="296" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="290" y="309" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="240" y="314" width="20" height="18" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="250" y="327" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <rect x="260" y="314" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="327" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="280" y="314" width="20" height="18" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="290" y="327" text-anchor="middle" font-size="9" fill="#aaa">0</text>

  <!-- arrow -->
  <path d="M 310 311 L 340 311" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bitmask -->
  <rect x="350" y="280" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">state = bitmask</text>
  <text x="430" y="314" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">bit(i*n+j) = grid[i][j]</text>
  <text x="430" y="328" text-anchor="middle" font-size="9.5" fill="#888">m*n ≤ 15 → 最多 2¹⁵ 状态</text>

  <!-- ===== Bottom: BFS summary ===== -->
  <rect x="36" y="360" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="286" y="380" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">BFS 求最短操作序列</text>
  <text x="286" y="396" text-anchor="middle" font-size="10" fill="#555">每步：枚举所有原始为 1 的格子 (i,j) → 清零第 i 行和第 j 列 → 新状态入队</text>
  <text x="286" y="410" text-anchor="middle" font-size="10" fill="#555">state == 0 时返回步数；m·n ≤ 15 保证状态空间 ≤ 2¹⁵ = 32768</text>
</svg>
