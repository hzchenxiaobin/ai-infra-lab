<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三指针算法流程</text>

  <!-- ===== Start ===== -->
  <rect x="165" y="36" width="230" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化: nums[0]=1, p2=p3=p5=0, i=1</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="280,84 352,114 280,144 208,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n ?</text>

  <!-- No branch -->
  <path d="M 352 114 L 420 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="108" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="100" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return nums[n-1]</text>

  <!-- Yes branch -->
  <path d="M 280 144 L 280 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Compute candidates ===== -->
  <rect x="100" y="162" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#446688">next2 = nums[p2]×2,  next3 = nums[p3]×3,  next5 = nums[p5]×5</text>

  <path d="M 280 198 L 280 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Min + assign ===== -->
  <rect x="120" y="212" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#446688">next = min(next2, next3, next5);  nums[i] = next</text>

  <path d="M 280 248 L 280 260" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Three advance boxes ===== -->
  <rect x="44" y="262" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="119" y="283" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">if next==next2: p2++</text>

  <rect x="205" y="262" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">if next==next3: p3++</text>

  <rect x="366" y="262" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="441" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">if next==next5: p5++</text>

  <!-- merge arrows -->
  <path d="M 119 298 L 250 314" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 298 L 280 314" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 441 298 L 310 314" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Increment ===== -->
  <rect x="210" y="316" width="140" height="32" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i++</text>

  <!-- ===== Loop back arrow ===== -->
  <path d="M 210 332 L 36 332 L 36 114 L 206 114" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="226" font-size="10" fill="#888" font-weight="bold">循环</text>

  <!-- ===== Warning note ===== -->
  <rect x="80" y="372" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 三个 if 独立判断（不是 elif！）</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#888">同一值可能由多路同时产生（如 6 = 3×2 = 2×3），所有匹配指针都要前进</text>
</svg>
