<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次 GROUP BY 内完成「聚合 → 相除 → 兜底 → 定精度 → 排序」</text>

  <!-- ============ Box 1: GROUP BY ============ -->
  <rect x="10" y="44" width="100" height="158" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="44" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① GROUP BY</text>
  <text x="60" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ad_id</text>
  <!-- mini: rows -> groups -->
  <rect x="22" y="92" width="76" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="103" text-anchor="middle" font-size="7.5" fill="#446688">1,Clicked</text>
  <rect x="22" y="108" width="76" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="119" text-anchor="middle" font-size="7.5" fill="#4a7a3a">1,Viewed</text>
  <rect x="22" y="124" width="76" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="7.5" fill="#b85450">1,Ignored</text>
  <path d="M60 142 L60 154" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="30" y="158" width="60" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="170" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">ad_id=1 一组</text>
  <text x="60" y="192" text-anchor="middle" font-size="8" fill="#555">按广告归组</text>

  <!-- arrow 1 -> 2 -->
  <path d="M114 123 L132 123" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Box 2: 条件聚合 ============ -->
  <rect x="135" y="44" width="120" height="158" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="135" y="44" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="61" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② 条件聚合</text>
  <rect x="143" y="76" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="89" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">SUM(action='Clicked')</text>
  <text x="195" y="102" text-anchor="middle" font-size="8" fill="#4a7a3a">→ 分子 = 2</text>
  <rect x="143" y="116" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="129" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">SUM(action IN</text>
  <text x="195" y="140" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">('Clicked','Viewed'))</text>
  <text x="195" y="192" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">Ignored 剔除</text>

  <!-- arrow 2 -> 3 -->
  <path d="M259 123 L277 123" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Box 3: 相除 ============ -->
  <rect x="280" y="44" width="100" height="158" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="280" y="44" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="61" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ 相除×100</text>
  <text x="330" y="82" text-anchor="middle" font-size="9" fill="#555">分子/分母</text>
  <text x="330" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 / 3</text>
  <text x="330" y="116" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">× 100</text>
  <text x="330" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 66.666…</text>
  <text x="330" y="158" text-anchor="middle" font-size="8" fill="#555">MySQL / 为小数除</text>
  <text x="330" y="170" text-anchor="middle" font-size="8" fill="#555">PG 需 ×100.0</text>
  <text x="330" y="192" text-anchor="middle" font-size="8" fill="#555">得百分数</text>

  <!-- arrow 3 -> 4 -->
  <path d="M384 123 L402 123" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Box 4: 除零兜底 ============ -->
  <rect x="405" y="44" width="110" height="158" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="405" y="44" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="61" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ 除零兜底</text>
  <rect x="413" y="78" width="94" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">ad 5: 0/0</text>
  <text x="460" y="106" text-anchor="middle" font-size="8.5" fill="#b85450">→ NULL</text>
  <text x="460" y="118" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">→ IFNULL→0</text>
  <text x="460" y="140" text-anchor="middle" font-size="8" fill="#555">跨方言：</text>
  <text x="460" y="152" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">/NULLIF(den,0)</text>
  <text x="460" y="164" text-anchor="middle" font-size="7.5" fill="#446688" font-weight="bold">COALESCE(·,0)</text>
  <text x="460" y="192" text-anchor="middle" font-size="8" fill="#555">防 0/0 崩溃</text>

  <!-- arrow 4 -> 5 -->
  <path d="M519 123 L537 123" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Box 5: ROUND + ORDER ============ -->
  <rect x="540" y="44" width="55" height="158" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="540" y="44" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="567" y="61" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">⑤ 收尾</text>
  <text x="567" y="84" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">ROUND</text>
  <text x="567" y="96" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">(,2)</text>
  <text x="567" y="118" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">66.67</text>
  <text x="567" y="140" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">ORDER</text>
  <text x="567" y="152" text-anchor="middle" font-size="7.5" fill="#446688">ctr DESC</text>
  <text x="567" y="164" text-anchor="middle" font-size="7.5" fill="#446688">ad_id ASC</text>
  <text x="567" y="192" text-anchor="middle" font-size="8" fill="#555">输出</text>

  <!-- ============ Bottom: full SQL one-liner ============ -->
  <rect x="10" y="216" width="580" height="84" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="22" y="234" font-size="9" fill="#446688" font-weight="bold">一条 SQL（解法 A）：</text>
  <text x="22" y="250" font-size="9.5" fill="#333">SELECT ad_id,</text>
  <text x="22" y="263" font-size="9.5" fill="#333">       ROUND(IFNULL(SUM(action='Clicked') / SUM(action IN ('Clicked','Viewed')) * 100, 0), 2) AS ctr</text>
  <text x="22" y="276" font-size="9.5" fill="#333">FROM Ads GROUP BY ad_id ORDER BY ctr DESC, ad_id ASC;</text>
  <text x="22" y="294" font-size="8.5" fill="#777">单层 SELECT 同时聚合 + 相除，无需子查询；IFNULL 兜底除零；ROUND 定两位；双排序键。</text>
</svg>
