<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删 9 ⟺ 九进制计数（数码集 {0..8} 恰是九进制）</text>

  <!-- ===== Left column: 删9序列 ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">删 9 后的序列（十进制读法）</text>
  <rect x="50" y="68" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="11.5" fill="#555">1 2 3 4 5 6 7 8 10 11 ... 18 20 ...</text>

  <!-- strike through 9 -->
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#b85450">9 ❌  19 ❌  29 ❌  ...  90-99 ❌</text>

  <!-- ===== Right column: 九进制计数 ===== -->
  <text x="450" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">九进制计数（数码 0..8）</text>
  <rect x="350" y="68" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="86" text-anchor="middle" font-size="11.5" fill="#555">1 2 3 4 5 6 7 8 10 11 ... 18 20 ...</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#446688">逢九进一：8→10（跳过“9”这位）</text>

  <!-- ===== center bidirectional arrow ===== -->
  <path d="M 250 81 L 350 81" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" marker-start="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">双射</text>

  <!-- ===== mapping table ===== -->
  <rect x="40" y="128" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 n 项 = 把 n 转成九进制，数码串按十进制读出</text>

  <!-- table header -->
  <rect x="60" y="166" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">序号 n</text>
  <rect x="250" y="166" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">九进制写法</text>
  <rect x="430" y="166" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="485" y="183" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案（十进制）</text>

  <!-- rows -->
  <rect x="60" y="194" width="80" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="250" y="194" width="120" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="210" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="430" y="194" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="485" y="210" text-anchor="middle" font-size="11" fill="#333">8</text>

  <rect x="60" y="218" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="250" y="218" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <rect x="430" y="218" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="485" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10（跳过9）</text>

  <rect x="60" y="242" width="80" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#333">17</text>
  <rect x="250" y="242" width="120" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="11" fill="#333">18</text>
  <rect x="430" y="242" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="485" y="258" text-anchor="middle" font-size="11" fill="#333">18</text>

  <rect x="60" y="266" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">18</text>
  <rect x="250" y="266" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">20</text>
  <rect x="430" y="266" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="485" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">20（跳过19）</text>

  <rect x="60" y="290" width="80" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="306" text-anchor="middle" font-size="11" fill="#333">81</text>
  <rect x="250" y="290" width="120" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#333">100</text>
  <rect x="430" y="290" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="485" y="306" text-anchor="middle" font-size="11" fill="#333">100（跳过89-99）</text>

  <!-- ===== key insight notes ===== -->
  <rect x="40" y="328" width="250" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">数码集相同 = 计数规则相同</text>
  <text x="165" y="368" text-anchor="middle" font-size="10.5" fill="#555">删9剩{0..8}共9个数码</text>
  <text x="165" y="382" text-anchor="middle" font-size="10.5" fill="#555">恰是九进制定义，映射恒等</text>

  <rect x="310" y="328" width="250" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="350" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">序号 n = 九进制数码串的值</text>
  <text x="435" y="368" text-anchor="middle" font-size="10.5" fill="#555">答案 = 数码串按十进制字面读</text>
  <text x="435" y="382" text-anchor="middle" font-size="10.5" fill="#555">n≥1 故无需特判0</text>

  <!-- formula -->
  <rect x="40" y="406" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 n 项 = n 的九进制表示，按十进制读出 ⟺ 除 9 取余</text>

  <!-- warning note -->
  <text x="300" y="454" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️ 越高位含9占比越高（90-99全删），逐个枚举必超时 → 必须用进制结构</text>
</svg>
