<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">通配符建图 + BFS 逐层扩展：单词接龙最短路</text>

  <!-- Level labels -->
  <text x="70" y="52" text-anchor="middle" font-size="11" fill="#888">第 0 层</text>
  <text x="190" y="52" text-anchor="middle" font-size="11" fill="#888">第 1 层</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888">第 2 层</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">第 3 层</text>
  <text x="580" y="52" text-anchor="middle" font-size="11" fill="#888">第 4 层</text>

  <!-- Dashed level separators -->
  <line x1="130" y1="60" x2="130" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="255" y1="60" x2="255" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="385" y1="60" x2="385" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="515" y1="60" x2="515" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Edges (drawn before nodes) -->
  <path d="M 93 180 L 167 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 213 174 L 297 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 213 186 L 297 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 343 145 L 427 145" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 343 215 L 427 215" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 473 150 L 557 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 473 210 L 557 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pattern labels on edges -->
  <text x="130" y="172" text-anchor="middle" font-size="9" fill="#b85450">h*t</text>
  <text x="255" y="148" text-anchor="middle" font-size="9" fill="#b85450">*ot</text>
  <text x="255" y="220" text-anchor="middle" font-size="9" fill="#b85450">*ot</text>
  <text x="385" y="138" text-anchor="middle" font-size="9" fill="#b85450">do*</text>
  <text x="385" y="208" text-anchor="middle" font-size="9" fill="#b85450">lo*</text>
  <text x="515" y="155" text-anchor="middle" font-size="9" fill="#b85450">*og</text>

  <!-- Nodes -->
  <!-- hit (level 0, start = green) -->
  <rect x="47" y="167" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hit</text>

  <!-- hot (level 1) -->
  <rect x="167" y="167" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hot</text>

  <!-- dot (level 2) -->
  <rect x="297" y="132" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dot</text>

  <!-- lot (level 2) -->
  <rect x="297" y="202" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lot</text>

  <!-- dog (level 3) -->
  <rect x="427" y="132" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dog</text>

  <!-- log (level 3) -->
  <rect x="427" y="202" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">log</text>

  <!-- cog (level 4, end = orange) -->
  <rect x="557" y="167" width="46" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cog</text>

  <!-- Start/End labels -->
  <text x="70" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">起点</text>
  <text x="580" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">终点</text>

  <!-- Divider line -->
  <line x1="30" y1="270" x2="590" y2="270" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Pattern concept section title -->
  <text x="310" y="296" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">通配符模式：单词的"中间状态"</text>

  <!-- Pattern box *ot -->
  <rect x="80" y="350" width="56" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="370" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">*ot</text>

  <!-- Arrows from pattern to words -->
  <path d="M 136 360 L 214 335" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 136 365 L 214 365" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 136 370 L 214 395" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Word boxes connected by *ot -->
  <rect x="214" y="322" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="339" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hot</text>

  <rect x="214" y="352" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="369" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dot</text>

  <rect x="214" y="382" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="399" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lot</text>

  <!-- Explanation box -->
  <rect x="310" y="322" width="270" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="344" text-anchor="middle" font-size="11" fill="#444">共享 *ot 的单词只差首字母 → 图中相邻</text>
  <text x="445" y="362" text-anchor="middle" font-size="11" fill="#444">BFS 中对当前单词生成 L 个模式</text>
  <text x="445" y="378" text-anchor="middle" font-size="11" fill="#444">一次哈希查询即得全部邻居</text>
  <text x="445" y="394" text-anchor="middle" font-size="10" fill="#888">省去 O(N²) 逐对比较</text>

  <!-- Bottom note -->
  <rect x="60" y="416" width="500" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="438" text-anchor="middle" font-size="12" fill="#444">最短转换序列长度 = endWord 所在层数 + 1 = 4 + 1 = 5</text>
</svg>
