<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：位掩码编码「目标已拼出状态」</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">target 长度 ≤ 15 → 2^15 个状态，BFS 逐层找最少贴纸</text>

  <!-- ===== Target string with bitmask (initial state) ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">target = "thehat"（6 个字符位）</text>

  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="80"  y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="102" y="108" fill="#446688">t</text>
    <rect x="124" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="146" y="108" fill="#446688">h</text>
    <rect x="168" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="190" y="108" fill="#446688">e</text>
    <rect x="212" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="234" y="108" fill="#446688">h</text>
    <rect x="256" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="278" y="108" fill="#446688">a</text>
    <rect x="300" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="322" y="108" fill="#446688">t</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="102" y="138">0</text>
    <text x="146" y="138">0</text>
    <text x="190" y="138">0</text>
    <text x="234" y="138">0</text>
    <text x="278" y="138">0</text>
    <text x="322" y="138">0</text>
  </g>
  <text x="368" y="120" font-size="11" fill="#888" font-weight="bold">mask = 0b000000</text>
  <text x="368" y="136" font-size="10" fill="#aaa">（初始：全部未拼出）</text>

  <!-- arrow down -->
  <path d="M 180 150 L 180 164" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="162" font-size="10" fill="#666">应用贴纸 "with"</text>

  <!-- ===== Sticker box (left) ===== -->
  <rect x="40" y="170" width="200" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="190" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">贴纸 "with"</text>
  <text x="140" y="208" text-anchor="middle" font-size="10.5" fill="#555">原始字符：w, i, t, h</text>
  <text x="140" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">过滤后：t×1, h×1</text>
  <text x="140" y="242" text-anchor="middle" font-size="9.5" fill="#aaa">（w, i 不在 target 中，丢弃）</text>

  <!-- Arrow -->
  <path d="M 244 210 L 286 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== New state (right) ===== -->
  <rect x="290" y="170" width="230" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新状态：位置 0(t), 1(h) 已拼出</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="300" y="200" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="315" y="220" fill="#4a7a3a">t</text>
    <rect x="330" y="200" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="345" y="220" fill="#4a7a3a">h</text>
    <rect x="360" y="200" width="30" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="375" y="220" fill="#bbb">e</text>
    <rect x="390" y="200" width="30" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="405" y="220" fill="#bbb">h</text>
    <rect x="420" y="200" width="30" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="435" y="220" fill="#bbb">a</text>
    <rect x="450" y="200" width="30" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="465" y="220" fill="#bbb">t</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="315" y="246" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="345" y="246" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="375" y="246" fill="#bbb">0</text>
    <text x="405" y="246" fill="#bbb">0</text>
    <text x="435" y="246" fill="#bbb">0</text>
    <text x="465" y="246" fill="#bbb">0</text>
  </g>

  <!-- ===== Key insights ===== -->
  <line x1="20" y1="264" x2="520" y2="264" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="276" width="490" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="12" fill="#d6a040" font-weight="bold">关键洞察：</text>
  <text x="50" y="318" font-size="11" fill="#555">① target 长度 ≤ 15 → 位掩码最多 2^15 = 32768 个状态（状压 DP 甜区）</text>
  <text x="50" y="336" font-size="11" fill="#555">② 每张贴纸 = 一步转移：从 mask 贪心填充最左可用位 → 确定 new_mask</text>
  <text x="50" y="354" font-size="11" fill="#555">③ 所有转移权重 = 1（一张贴纸）→ BFS 首次到达 full_mask 即最少贴纸数</text>
  <text x="50" y="374" font-size="11" fill="#b85450" font-weight="bold">预处理：每个贴纸只保留 target 中出现的字符（过滤无用字母）</text>
</svg>
