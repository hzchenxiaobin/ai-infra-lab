<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">0-1 BFS：双端队列的「两值单调」性质</text>

  <!-- push_front 说明（左上，绿） -->
  <rect x="26" y="46" width="216" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="134" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">进入 0 格：边权 0</text>
  <text x="134" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nd = d（距离没涨）</text>
  <text x="134" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ push_front 插队</text>

  <!-- push_back 说明（右上，橙） -->
  <rect x="278" y="46" width="216" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="66" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">进入 1 格：边权 1</text>
  <text x="386" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">nd = d + 1（距离涨 1）</text>
  <text x="386" y="98" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">→ push_back 排队尾</text>

  <!-- 箭头：push_front → 队首 -->
  <path d="M 100 106 Q 110 140 136 156" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 箭头：push_back → 队尾 -->
  <path d="M 420 106 Q 410 140 384 156" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 双端队列 -->
  <text x="260" y="136" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">deque（示例 3 中某时刻的真实快照）</text>

  <rect x="88" y="158" width="344" height="52" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>

  <!-- d 段（蓝，2 格） -->
  <rect x="96" y="166" width="104" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <text x="148" y="195" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">d = 2</text>

  <!-- d+1 段（橙，4 格） -->
  <rect x="204" y="166" width="112" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(0,2) (2,1)</text>
  <text x="260" y="195" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d+1 = 3</text>

  <rect x="320" y="166" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="182" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(1,2) (2,0)</text>
  <text x="372" y="195" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d+1 = 3</text>

  <!-- front / back 标签 -->
  <path d="M 44 184 L 84 184" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="52" y="176" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">front</text>
  <path d="M 476 184 L 436 184" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="448" y="176" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">back</text>

  <!-- pop_front -->
  <path d="M 96 214 Q 80 238 62 236" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="88" y="252" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop_front：取当前最小距离 d</text>

  <!-- 性质说明 -->
  <rect x="26" y="270" width="468" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">不变式：从 front 到 back，距离非降，且至多两种值 d / d+1</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#2c4a66" filter="url(#rough2)">0 权松弛不涨距离 → 插队首仍 ≤ 队尾的 d+1；1 权松弛涨 1 → 排队尾不会更小</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#2c4a66" filter="url(#rough2)">于是弹出顺序 = 距离非降序，节点第一次被弹出时即得最短距离（免堆的 Dijkstra）</text>
  <text x="260" y="340" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">懒更新：弹出后用当前 dist[i][j] 松弛邻居，陈旧副本自然失效</text>
</svg>
