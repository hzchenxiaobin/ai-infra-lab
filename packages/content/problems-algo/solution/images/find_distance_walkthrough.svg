<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两道例题的三步执行</text>

  <!-- ===== Example 1: p=5, q=0 ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">示例 1：p=5, q=0</text>

  <!-- mini tree 1 -->
  <circle cx="70" cy="90" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <circle cx="45" cy="125" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="45" y="129" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>
  <line x1="62" y1="102" x2="52" y2="115" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="95" cy="125" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="129" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <line x1="78" y1="102" x2="88" y2="115" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="95" cy="160" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <line x1="95" y1="138" x2="95" y2="148" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="146" font-size="8" fill="#b85450" font-weight="bold">p</text>
  <text x="110" y="165" font-size="8" fill="#b85450" font-weight="bold">q</text>

  <!-- steps table for ex1 -->
  <rect x="150" y="72" width="410" height="100" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="90" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="240" y="90" font-size="10" fill="#888" font-weight="bold">操作</text>
  <text x="430" y="90" font-size="10" fill="#888" font-weight="bold">结果</text>
  <line x1="150" y1="96" x2="560" y2="96" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="165" y="114" font-size="10" fill="#333">① 找 LCA</text>
  <text x="240" y="114" font-size="10" fill="#555">dfs(3)：left=5, right=1 都命中</text>
  <text x="440" y="114" font-size="10" fill="#4a7a3a" font-weight="bold">LCA = 3</text>

  <text x="165" y="134" font-size="10" fill="#333">② 量 dp</text>
  <text x="240" y="134" font-size="10" fill="#555">distance(3, 5)：3→5 命中</text>
  <text x="440" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">dp = 1</text>

  <text x="165" y="154" font-size="10" fill="#333">③ 量 dq</text>
  <text x="240" y="154" font-size="10" fill="#555">distance(3, 0)：3→1→0</text>
  <text x="440" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">dq = 2</text>

  <rect x="150" y="162" width="410" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = dp + dq = 1 + 2 = 3 ✓</text>

  <!-- ===== Example 2: p=5, q=7 ===== -->
  <text x="30" y="216" font-size="12" fill="#446688" font-weight="bold">示例 2：p=5, q=7</text>

  <!-- mini tree 2 -->
  <circle cx="70" cy="250" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <circle cx="45" cy="285" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="45" y="289" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>
  <line x1="62" y1="262" x2="52" y2="275" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="60" cy="325" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="329" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <line x1="50" y1="297" x2="57" y2="314" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="40" cy="360" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="364" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">7</text>
  <line x1="55" y1="336" x2="46" y2="349" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="28" y="282" font-size="8" fill="#b85450" font-weight="bold">p</text>
  <text x="28" y="368" font-size="8" fill="#b85450" font-weight="bold">q</text>
  <text x="45" y="308" font-size="8" fill="#4a7a3a" font-weight="bold">LCA</text>

  <!-- steps table for ex2 -->
  <rect x="150" y="232" width="410" height="100" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="250" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="240" y="250" font-size="10" fill="#888" font-weight="bold">操作</text>
  <text x="430" y="250" font-size="10" fill="#888" font-weight="bold">结果</text>
  <line x1="150" y1="256" x2="560" y2="256" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="165" y="274" font-size="10" fill="#333">① 找 LCA</text>
  <text x="240" y="274" font-size="10" fill="#555">dfs(5)：命中 p=5，q 在子树中</text>
  <text x="440" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">LCA = 5</text>

  <text x="165" y="294" font-size="10" fill="#333">② 量 dp</text>
  <text x="240" y="294" font-size="10" fill="#555">distance(5, 5)：根即目标</text>
  <text x="440" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">dp = 0</text>

  <text x="165" y="314" font-size="10" fill="#333">③ 量 dq</text>
  <text x="240" y="314" font-size="10" fill="#555">distance(5, 7)：5→2→7</text>
  <text x="440" y="314" font-size="10" fill="#4a7a3a" font-weight="bold">dq = 2</text>

  <rect x="150" y="322" width="410" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = dp + dq = 0 + 2 = 2 ✓</text>

  <!-- Key insight -->
  <rect x="30" y="370" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">💡 关键对照</text>
  <text x="50" y="410" font-size="10" fill="#555">示例 1：p、q 分居 LCA 两侧 → dp、dq 都 &gt; 0</text>
  <text x="280" y="410" font-size="10" fill="#555">示例 2：p 自身就是 LCA → dp = 0（祖先到自身距离为 0）</text>
</svg>
