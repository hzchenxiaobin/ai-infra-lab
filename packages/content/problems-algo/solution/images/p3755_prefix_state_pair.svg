<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">核心观察：两个条件 ⟺ 状态对 (X, D) 两端相等</text>

  <!-- 数组格子 [3,1,3,2,0] -->
  <text x="44" y="70" font-size="12" fill="#446688" filter="url(#rough2)">nums =</text>
  <g filter="url(#rough2)">
    <rect x="100" y="50" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="128" y="70" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
    <rect x="156" y="50" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="184" y="70" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
    <rect x="212" y="50" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="240" y="70" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
    <rect x="268" y="50" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="296" y="70" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="50" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="352" y="70" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="128" y="95" fill="#d6a040">奇</text>
    <text x="184" y="95" fill="#d6a040">奇</text>
    <text x="240" y="95" fill="#d6a040">奇</text>
    <text x="296" y="95" fill="#4a7a3a">偶</text>
    <text x="352" y="95" fill="#4a7a3a">偶</text>
  </g>

  <!-- 推导框 -->
  <rect x="36" y="108" width="448" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="260" y="128">定义：X_i = 前 i 个数的异或；D_i = 前 i 个数中（偶数个数 − 奇数个数）</text>
    <text x="260" y="147">① 子数组 (l, r] 异或为 0 ⟺ X_l = X_r　　② 偶奇各半 ⟺ D_l = D_r</text>
    <text x="260" y="168" fill="#b85450" font-weight="bold">⟹ 两个条件同时成立 ⟺ 同一个 key：状态对 (X, D) 在两端相等！</text>
  </g>

  <!-- 前缀状态表 -->
  <g filter="url(#rough2)">
    <rect x="144" y="198" width="60" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="384" y="198" width="60" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="84" y="198" width="360" height="80" fill="none" stroke="#446688" stroke-width="1.6" rx="4"/>
    <path d="M 144 198 V 278 M 204 198 V 278 M 264 198 V 278 M 324 198 V 278 M 384 198 V 278" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M 84 220 H 444 M 84 250 H 444" stroke="#446688" stroke-width="1" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="74" y="214" fill="#446688" text-anchor="end">i</text>
    <text x="74" y="239" fill="#446688" text-anchor="end">X</text>
    <text x="74" y="265" fill="#446688" text-anchor="end">D</text>
    <g fill="#333">
      <text x="114" y="214">0</text><text x="174" y="214">1</text><text x="234" y="214">2</text>
      <text x="294" y="214">3</text><text x="354" y="214">4</text><text x="414" y="214">5</text>
      <text x="114" y="239">0</text><text x="234" y="239">2</text><text x="294" y="239">1</text><text x="354" y="239">3</text>
      <text x="114" y="265">0</text><text x="234" y="265">−2</text><text x="294" y="265">−3</text><text x="354" y="265">−2</text>
    </g>
    <g fill="#b85450" font-weight="bold">
      <text x="174" y="239">3</text><text x="414" y="239">3</text>
      <text x="174" y="265">−1</text><text x="414" y="265">−1</text>
    </g>
  </g>

  <!-- 匹配连线 -->
  <path d="M 174 284 Q 294 318 410 286" fill="none" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="294" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(3, −1) 再次出现！</text>

  <!-- 结论框 -->
  <rect x="50" y="322" width="420" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <text x="260" y="341">i = 1 与 i = 5 状态相同 ⟹ 子数组 nums[1..4] = [1, 3, 2, 0]</text>
    <text x="260" y="360" font-weight="bold">长度 = 5 − 1 = 4 ✓（示例 1 答案）</text>
  </g>
</svg>
