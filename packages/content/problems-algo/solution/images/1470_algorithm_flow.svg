<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建 res → 遍历 i 填偶位/奇位 → 返回 res</text>

  <!-- Start -->
  <ellipse cx="180" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 180 70 L 180 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: build res -->
  <rect x="84" y="84" width="192" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11.5" fill="#333">res = 新数组，长度 2n；i = 0</text>

  <path d="M 180 116 L 180 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="180,130 262,170 180,210 98,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="174" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- Yes branch down -->
  <path d="M 180 210 L 180 226" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box: fill even + odd -->
  <rect x="58" y="228" width="244" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="247" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">res[2i] = nums[i]</text>
  <text x="180" y="263" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">res[2i+1] = nums[n + i]</text>

  <path d="M 180 272 L 180 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5: i += 1 -->
  <rect x="130" y="286" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="304" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back: box left -> left -> up -> diamond left point -->
  <path d="M 130 300 L 56 300 L 56 170 L 96 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="164" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- No branch right -->
  <path d="M 262 170 L 304 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="164" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Box6: return res -->
  <rect x="304" y="154" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="174" text-anchor="middle" font-size="11.5" fill="#333">返回 res</text>

  <path d="M 364 186 L 364 198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="364" cy="216" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="220" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- footer note -->
  <rect x="56" y="372" width="448" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#555">一趟遍历 n 次，每次写两个位置 → O(n) 时间、O(n) 空间（结果数组）</text>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#888">无需显式切分 X / Y，下标公式直接定位源与目的</text>
</svg>
