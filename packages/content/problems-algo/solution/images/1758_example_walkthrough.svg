<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "0100" → 逐位比对两种目标</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">diffA = 与「0101…」差异，diffB = 与「1010…」差异</text>

  <!-- Phase 1 header -->
  <text x="30" y="68" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐位比对</text>

  <!-- Header row -->
  <rect x="20" y="76" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="94">i</text>
    <text x="150" y="94">s[i]</text>
    <text x="250" y="94">A[i]</text>
    <text x="350" y="94">A 匹配?</text>
    <text x="450" y="94">B[i]</text>
    <text x="540" y="94">B 匹配?</text>
  </g>

  <!-- Row i=0 -->
  <rect x="20" y="108" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="126" fill="#555" font-weight="bold">0</text>
    <text x="150" y="126" fill="#d6a040" font-weight="bold">0</text>
    <text x="250" y="126" fill="#555" font-weight="bold">0</text>
    <text x="350" y="126" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="450" y="126" fill="#555" font-weight="bold">1</text>
    <text x="540" y="126" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row i=1 -->
  <rect x="20" y="138" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="156" fill="#555" font-weight="bold">1</text>
    <text x="150" y="156" fill="#d6a040" font-weight="bold">1</text>
    <text x="250" y="156" fill="#555" font-weight="bold">1</text>
    <text x="350" y="156" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="450" y="156" fill="#555" font-weight="bold">0</text>
    <text x="540" y="156" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row i=2 -->
  <rect x="20" y="168" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="186" fill="#555" font-weight="bold">2</text>
    <text x="150" y="186" fill="#d6a040" font-weight="bold">0</text>
    <text x="250" y="186" fill="#555" font-weight="bold">0</text>
    <text x="350" y="186" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="450" y="186" fill="#555" font-weight="bold">1</text>
    <text x="540" y="186" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row i=3 HIGHLIGHTED (A fails, B matches) -->
  <rect x="20" y="198" width="560" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="216" fill="#333" font-weight="bold">3</text>
    <text x="150" y="216" fill="#d6a040" font-weight="bold">0</text>
    <text x="250" y="216" fill="#b85450" font-weight="bold">1</text>
    <text x="350" y="216" fill="#b85450" font-weight="bold">✗ 改</text>
    <text x="450" y="216" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="540" y="216" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- Phase 2 header -->
  <text x="30" y="248" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">汇总</text>

  <!-- diffA box -->
  <rect x="200" y="256" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diffA = 1（仅 i=3 不匹配）</text>

  <!-- diffB box -->
  <rect x="200" y="294" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="314" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">diffB = 3 = n − diffA</text>

  <!-- arrow down -->
  <path d="M 320 324 L 320 348" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- min result box -->
  <rect x="170" y="352" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(diffA, diffB) = min(1, 3) = 1 ✓</text>
</svg>
