<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈重建法：# 弹栈，普通字符压栈</text>

  <!-- s string -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">s = "ab#c"</text>
  <rect x="40" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="84" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <rect x="128" y="68" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">#</text>
  <rect x="172" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">c</text>

  <!-- s stack result -->
  <path d="M 192 100 L 192 116" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="114" font-size="10" fill="#888" font-weight="bold">压 c</text>
  <text x="300" y="58" font-size="11" fill="#888" font-weight="bold">栈(自底→顶)</text>
  <rect x="284" y="68" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="328" y="68" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="404" y="88" font-size="12" fill="#4a7a3a" font-weight="bold">→ "ac"</text>

  <!-- # pops b annotation -->
  <path d="M 148 100 L 70 100" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="116" font-size="10" fill="#b85450" font-weight="bold"># 弹出 b</text>

  <!-- t string -->
  <text x="30" y="158" font-size="11" fill="#888" font-weight="bold">t = "ad#c"</text>
  <rect x="40" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="84" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="188" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">d</text>
  <rect x="128" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">#</text>
  <rect x="172" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="188" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">c</text>

  <path d="M 148 200 L 70 200" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="216" font-size="10" fill="#b85450" font-weight="bold"># 弹出 d</text>

  <path d="M 192 200 L 192 216" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="214" font-size="10" fill="#888" font-weight="bold">压 c</text>
  <text x="300" y="158" font-size="11" fill="#888" font-weight="bold">栈(自底→顶)</text>
  <rect x="284" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="328" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="404" y="188" font-size="12" fill="#4a7a3a" font-weight="bold">→ "ac"</text>

  <!-- rules box -->
  <rect x="40" y="248" width="220" height="84" fill="#f8f8f8" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="11" fill="#333" font-weight="bold">栈规则</text>
  <rect x="56" y="276" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="84" y="291" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">字母</text>
  <text x="120" y="291" font-size="10.5" fill="#555">→ 压栈</text>
  <rect x="56" y="304" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="84" y="319" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">#</text>
  <text x="120" y="319" font-size="10.5" fill="#555">→ 弹栈(非空)</text>

  <!-- compare result -->
  <path d="M 260 290 L 300 290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="262" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"ac" == "ac"</text>
  <text x="390" y="306" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">→ true ✓</text>

  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n)　空间 O(n)（存重建结果）</text>
</svg>
