<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反向归约演算：把 (X,Y) 降到 (1,1)</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">偶数则折半；两奇则把较大者换成 (x+y)/2（先翻倍后减的逆）</text>

  <!-- ===== Chain 1: (4,7) true ===== -->
  <text x="40" y="66" font-size="11" fill="#4a7a3a" font-weight="bold">示例 2：(4, 7)，gcd=1=2⁰ → 可达</text>

  <!-- boxes -->
  <rect x="30" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(4,7)</text>

  <path d="M 90 91 L 120 91" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="8" fill="#888">x/2</text>

  <rect x="120" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,7)</text>

  <path d="M 180 91 L 210 91" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="8" fill="#888">x/2</text>

  <rect x="210" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(1,7)</text>

  <path d="M 270 91 L 300 91" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="86" text-anchor="middle" font-size="7" fill="#888">y→(x+y)/2</text>

  <rect x="300" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(1,4)</text>

  <path d="M 360 91 L 390 91" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="86" text-anchor="middle" font-size="8" fill="#888">y/2</text>

  <rect x="390" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(1,2)</text>

  <path d="M 450 91 L 480 91" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="465" y="86" text-anchor="middle" font-size="8" fill="#888">y/2</text>

  <rect x="480" y="74" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(1,1)✓</text>

  <!-- ===== Chain 2: (6,9) false ===== -->
  <text x="40" y="138" font-size="11" fill="#b85450" font-weight="bold">示例 1：(6, 9)，gcd=3（含奇因子）→ 不可达</text>

  <rect x="30" y="146" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(6,9)</text>

  <path d="M 90 163 L 120 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="158" text-anchor="middle" font-size="8" fill="#888">x/2</text>

  <rect x="120" y="146" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(3,9)</text>

  <path d="M 180 163 L 210 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="158" text-anchor="middle" font-size="7" fill="#888">y→(x+y)/2</text>

  <rect x="210" y="146" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(3,6)</text>

  <path d="M 270 163 L 300 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="158" text-anchor="middle" font-size="8" fill="#888">y/2</text>

  <rect x="300" y="146" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(3,3)</text>

  <!-- stuck loop -->
  <path d="M 360 163 C 390 150 410 176 390 168" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卡住</text>
  <text x="400" y="178" text-anchor="middle" font-size="7" fill="#b85450">(3,(3+3)/2)=(3,3)</text>

  <rect x="440" y="146" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇因子 3 ✗</text>

  <!-- ===== Footer explanation ===== -->
  <rect x="40" y="206" width="480" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">为何这样归约？</text>
  <text x="56" y="246" font-size="10" fill="#555">• 折半 (x/2) 是正向「翻倍 x」的逆：若 (x/2,y) 可达，翻倍即得 (x,y)</text>
  <text x="56" y="262" font-size="10" fill="#555">• 两奇换大者 (x,y)→(x,(x+y)/2) 是「翻倍 y 再减 x」两步的逆：</text>
  <text x="72" y="276" font-size="9" fill="#888">  (x,(x+y)/2) →翻倍 y→ (x,x+y) →减 x → (x,y)</text>
  <text x="56" y="294" font-size="10" fill="#b85450" font-weight="bold">• 两奇且相等又非 (1,1) ⟺ gcd 含奇因子 ⟺ 不可达</text>
</svg>
