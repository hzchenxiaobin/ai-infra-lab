<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递推关系：两段 2^(j-1) 拼成一段 2^j</text>

  <g filter="url(#rough2)">
    <rect x="110" y="56" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="170" y="77" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">up[v][j]</text>
    <rect x="110" y="140" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="170" y="161" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">mid = up[v][j-1]</text>
    <rect x="110" y="224" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="170" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v</text>
    <line x1="170" y1="224" x2="170" y2="176" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB2)"/>
    <line x1="170" y1="140" x2="170" y2="92" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB2)"/>
    <text x="180" y="205" font-size="10" fill="#446688">跳 2^(j-1)</text>
    <text x="180" y="121" font-size="10" fill="#446688">跳 2^(j-1)</text>
  </g>

  <path d="M 95 72 Q 80 72 80 82 L 80 232 Q 80 242 95 242" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="58" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" transform="rotate(-90 58 158)">合计 2^j 级</text>

  <g filter="url(#rough2)">
    <rect x="300" y="56" width="220" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="410" y="78" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">递推式</text>
    <text x="410" y="98" text-anchor="middle" font-size="11" fill="#555">up[v][0] = parent[v]</text>
    <text x="410" y="116" text-anchor="middle" font-size="11" fill="#555">up[v][j] = up[up[v][j-1]][j-1]</text>
    <text x="410" y="134" text-anchor="middle" font-size="10" fill="#888">j 从 1 到 LOG-1，逐层填表</text>
    <rect x="300" y="150" width="220" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="410" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为什么正确？</text>
    <text x="410" y="190" text-anchor="middle" font-size="10" fill="#555">2^j = 2^(j-1) + 2^(j-1)</text>
    <text x="410" y="206" text-anchor="middle" font-size="10" fill="#555">先到中点 mid，再从 mid 跳同样远</text>
    <text x="410" y="220" text-anchor="middle" font-size="10" fill="#888">mid = -1 时整段置 -1（越界）</text>
  </g>

  <text x="270" y="262" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">示例 up 表（parent=[-1,0,0,1,1,2,2]）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="272" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="105" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node v</text>
    <rect x="150" y="272" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="205" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">up[v][0] (2^0)</text>
    <rect x="260" y="272" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="315" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">up[v][1] (2^1)</text>
    <rect x="370" y="272" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="425" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">up[v][2] (2^2)</text>

    <rect x="60" y="298" width="90" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="105" y="315" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="150" y="298" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="205" y="315" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="260" y="298" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="315" y="315" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="370" y="298" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="425" y="315" text-anchor="middle" font-size="11" fill="#b85450">-1</text>

    <rect x="60" y="322" width="90" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="105" y="339" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="150" y="322" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="205" y="339" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="260" y="322" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="315" y="339" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="370" y="322" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="425" y="339" text-anchor="middle" font-size="11" fill="#b85450">-1</text>

    <rect x="60" y="346" width="90" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="105" y="363" text-anchor="middle" font-size="11" fill="#333">6</text>
    <rect x="150" y="346" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="205" y="363" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="260" y="346" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="315" y="363" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="370" y="346" width="110" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="425" y="363" text-anchor="middle" font-size="11" fill="#b85450">-1</text>
  </g>
  <text x="270" y="386" text-anchor="middle" font-size="10" fill="#888">up[v][2] = up[up[v][1]][1]，如 up[3][2] = up[0][1] = -1（根无 2^1 祖先）</text>
</svg>
