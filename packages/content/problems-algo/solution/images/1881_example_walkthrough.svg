<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐位扫描找首个"增益点"</text>

  <!-- ============ Positive row ============ -->
  <rect x="24" y="44" width="532" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正数 n = "73", x = 6  ｜  目标：首个 n[i] &lt; 6</text>

  <!-- Step 0: i=0, digit 7, skip -->
  <rect x="44" y="78" width="130" height="100" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="94" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <rect x="87" y="100" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="126" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="109" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7 ≥ 6</text>
  <text x="109" y="167" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">✓ 跳过</text>

  <path d="M 178 128 L 206 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 1: i=1, digit 3, insert -->
  <rect x="210" y="78" width="130" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="94" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 1</text>
  <rect x="253" y="100" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="126" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="275" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3 &lt; 6</text>
  <text x="275" y="167" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 插入</text>

  <path d="M 344 128 L 372 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="376" y="78" width="160" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="456" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle">
    <rect x="396" y="100" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="413" y="126" fill="#446688" font-weight="bold">7</text>
    <rect x="432" y="100" width="34" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="449" y="126" fill="#d6a040" font-weight="bold">6</text>
    <rect x="468" y="100" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="485" y="126" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="456" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= "763"</text>

  <!-- ============ Negative row ============ -->
  <rect x="24" y="206" width="532" height="178" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">负数 n = "-13", x = 2  ｜  目标：首个 n[i] &gt; 2（i 从 1 起，跳过负号）</text>

  <!-- Step 0: i=0, '-', skip -->
  <rect x="34" y="240" width="116" height="92" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="92" y="256" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <rect x="70" y="262" width="44" height="36" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="287" text-anchor="middle" font-size="18" fill="#888" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="92" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">负号</text>
  <text x="92" y="325" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">跳过</text>

  <path d="M 154 286 L 176 286" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 1: i=1, '1', skip -->
  <rect x="180" y="240" width="116" height="92" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="238" y="256" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 1</text>
  <rect x="216" y="262" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="287" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="238" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1 ≤ 2</text>
  <text x="238" y="325" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">✓ 跳过</text>

  <path d="M 300 286 L 322 286" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: i=2, '3', insert -->
  <rect x="326" y="240" width="116" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="384" y="256" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 2</text>
  <rect x="362" y="262" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="287" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="384" y="312" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3 &gt; 2</text>
  <text x="384" y="325" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 插入</text>

  <path d="M 446 286 L 468 286" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="472" y="240" width="86" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="515" y="256" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="478" y="262" width="20" height="36" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="488" y="286" fill="#888" font-weight="bold">-</text>
    <rect x="500" y="262" width="20" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="510" y="286" fill="#446688" font-weight="bold">1</text>
    <rect x="522" y="262" width="20" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="532" y="286" fill="#d6a040" font-weight="bold">2</text>
    <rect x="544" y="262" width="20" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="554" y="286" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="515" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= "-123"</text>

  <!-- bottom note -->
  <rect x="24" y="392" width="532" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">两例对照：跳过条件与目标关系恰好相反，但都是"跳过不增益 → 首个增益点出手"</text>
</svg>
