<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：排序后 x = 0,1,2,3,4,5,6，w = 2（示例 2）</text>

  <!-- number line -->
  <line x1="40" y1="70" x2="600" y2="70" stroke="#888" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- interval 1: [0,2] -->
  <rect x="50" y="52" width="140" height="36" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">矩形① [0,2]</text>

  <!-- interval 2: [3,5] -->
  <rect x="260" y="52" width="140" height="36" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="75" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矩形② [3,5]</text>

  <!-- interval 3: [6,8] -->
  <rect x="470" y="52" width="140" height="36" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="540" y="75" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">矩形③ [6,8]</text>

  <!-- points -->
  <circle cx="50" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="120" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="190" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="260" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="330" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="400" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="470" cy="70" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="50" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="190" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="260" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="330" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="470" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>

  <!-- table -->
  <!-- header -->
  <rect x="30" y="118" width="46" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="76" y="118" width="54" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="103" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="130" y="118" width="118" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="189" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">x &gt; bound ?</text>
  <rect x="248" y="118" width="180" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="338" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="428" y="118" width="60" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="458" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="488" y="118" width="94" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">bound</text>

  <!-- row 0 -->
  <rect x="30" y="148" width="46" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="76" y="148" width="54" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="148" width="118" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 &gt; −1 ✓</text>
  <rect x="248" y="148" width="180" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开矩形① [0, 0+2]</text>
  <rect x="428" y="148" width="60" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="488" y="148" width="94" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- rows 1-2 -->
  <rect x="30" y="178" width="46" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="178" width="54" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="178" width="118" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="248" y="178" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="198" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过（≤ 2 已盖）</text>
  <rect x="428" y="178" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="488" y="178" width="94" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="30" y="208" width="46" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="208" width="54" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="208" width="118" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否（贴边也算盖）</text>
  <rect x="248" y="208" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>
  <rect x="428" y="208" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="488" y="208" width="94" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <rect x="30" y="238" width="46" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="76" y="238" width="54" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="238" width="118" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 &gt; 2 ✓</text>
  <rect x="248" y="238" width="180" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开矩形② [3, 3+2]</text>
  <rect x="428" y="238" width="60" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="488" y="238" width="94" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- rows 4-5 -->
  <rect x="30" y="268" width="46" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="76" y="268" width="54" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="268" width="118" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="248" y="268" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="288" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>
  <rect x="428" y="268" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="488" y="268" width="94" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="30" y="298" width="46" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="76" y="298" width="54" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="130" y="298" width="118" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否（贴边也算盖）</text>
  <rect x="248" y="298" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>
  <rect x="428" y="298" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="488" y="298" width="94" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 6 -->
  <rect x="30" y="328" width="46" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="76" y="328" width="54" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="130" y="328" width="118" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6 &gt; 5 ✓</text>
  <rect x="248" y="328" width="180" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="348" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">开矩形③ [6, 6+2]</text>
  <rect x="428" y="328" width="60" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="488" y="328" width="94" height="30" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <!-- answer -->
  <rect x="130" y="378" width="360" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="400" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 3：x 一共「越界」了 3 次 → 3 个矩形</text>

  <text x="310" y="434" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 x = 2 / x = 5 恰好贴在 bound 上：边界上的点也算被覆盖，判定条件是 x &gt; bound 而非 x ≥ bound</text>
</svg>
