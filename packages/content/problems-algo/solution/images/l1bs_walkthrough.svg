<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：grid = [[1,1,1],[1,0,1],[1,1,1]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">预处理 left / up 两表，再以 (2,2) 为右下角试 k=3</text>

  <!-- ===== grid table ===== -->
  <text x="104" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">grid</text>
  <!-- row0 -->
  <rect x="50" y="74" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="68" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="86" y="74" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="104" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="74" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row1 -->
  <rect x="50" y="104" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="68" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="86" y="104" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="104" y="125" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="122" y="104" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="140" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row2 -->
  <rect x="50" y="134" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="68" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="86" y="134" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="104" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="134" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="148" y="148" font-size="9" fill="#b85450" font-weight="bold">(i,j)</text>

  <!-- ===== left table ===== -->
  <text x="244" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left（向左连续1）</text>
  <!-- row0: 1 2 3 -->
  <rect x="190" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="208" y="95" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="226" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="95" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="262" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- row1: 1 0 1 -->
  <rect x="190" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="208" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="226" y="104" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="125" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="262" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- row2: 1 2 3 -->
  <rect x="190" y="134" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="208" y="155" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="226" y="134" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="155" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="262" y="134" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- ===== up table ===== -->
  <text x="384" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">up（向上连续1）</text>
  <!-- row0: 1 1 1 -->
  <rect x="330" y="74" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="348" y="95" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="366" y="74" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="384" y="95" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="402" y="74" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="95" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- row1: 2 0 2 -->
  <rect x="330" y="104" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="348" y="125" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="366" y="104" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="384" y="125" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="402" y="104" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="125" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- row2: 3 1 3 -->
  <rect x="330" y="134" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="348" y="155" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="366" y="134" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="384" y="155" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="402" y="134" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- arrow down to check -->
  <path d="M 280 168 L 280 192" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="184" font-size="10" fill="#888">右下角 (2,2)，试 k=3</text>

  <!-- ===== check table ===== -->
  <text x="60" y="208" font-size="11" fill="#888" font-weight="bold">边</text>
  <text x="160" y="208" font-size="11" fill="#888" font-weight="bold">条件（顶行=i−k+1=0，左列=j−k+1=0）</text>
  <text x="430" y="208" font-size="11" fill="#888" font-weight="bold">值</text>
  <text x="500" y="208" font-size="11" fill="#888" font-weight="bold">判定</text>

  <!-- row: bottom edge -->
  <rect x="40" y="216" width="500" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下边</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#555">left[2][2] ≥ 3</text>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3 ≥ 3</text>
  <text x="500" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row: right edge -->
  <rect x="40" y="248" width="500" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右边</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#555">up[2][2] ≥ 3</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3 ≥ 3</text>
  <text x="500" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row: top edge -->
  <rect x="40" y="280" width="500" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">上边</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555">left[0][2] ≥ 3</text>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3 ≥ 3</text>
  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row: left edge -->
  <rect x="40" y="312" width="500" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左边</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">up[2][0] ≥ 3</text>
  <text x="430" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3 ≥ 3</text>
  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- conclusion -->
  <rect x="80" y="358" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">四边全满足 → k=3 合法</text>
  <text x="280" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 3，面积 = 3 × 3 = 9</text>

  <!-- footnotes -->
  <text x="40" y="436" font-size="10" fill="#888">k 从大到小试，首个合法即该格最大正方形 → break</text>
  <text x="40" y="452" font-size="10" fill="#446688" font-weight="bold">中心 0 不影响判定：只查四边连续 1 长度</text>
</svg>
