<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三段拼接 → 1~9 全数字判定</text>

  <text x="105" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">n</text>
  <rect x="40" y="68" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="97" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">192</text>

  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2 × n</text>
  <rect x="195" y="68" width="130" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">384</text>

  <text x="415" y="62" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 × n</text>
  <rect x="350" y="68" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="97" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">576</text>

  <path d="M260,120 L260,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="140" font-size="11" fill="#666" filter="url(#rough2)">拼接</text>

  <rect x="40" y="156" width="440" height="44" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">192384576</text>

  <path d="M260,206 L260,236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="226" font-size="11" fill="#666" filter="url(#rough2)">判重</text>

  <g id="digits">
    <rect x="30" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="54" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
    <rect x="82" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">9</text>
    <rect x="134" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
    <rect x="186" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
    <rect x="238" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="262" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">8</text>
    <rect x="290" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="314" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
    <rect x="342" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="366" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
    <rect x="394" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="418" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">7</text>
    <rect x="446" y="242" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="270" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">6</text>
  </g>

  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 9 位 · 无 0 · 1~9 各出现一次 → 迷人</text>

  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判定等价于：排序后等于 "123456789"</text>
</svg>
