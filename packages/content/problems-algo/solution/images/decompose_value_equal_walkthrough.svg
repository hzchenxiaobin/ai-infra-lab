<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三个用例的游程取模全过程</text>

  <text x="30" y="58" font-size="12.5" fill="#4a7a3a" font-weight="bold">例 2 (true)：s = "00011111222"</text>

  <g font-size="13" font-weight="bold" fill="#333">
    <rect x="30" y="68" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="43" y="86" text-anchor="middle">0</text>
    <rect x="56" y="68" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="69" y="86" text-anchor="middle">0</text>
    <rect x="82" y="68" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="86" text-anchor="middle">0</text>
    <rect x="108" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="86" text-anchor="middle">1</text>
    <rect x="134" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="147" y="86" text-anchor="middle">1</text>
    <rect x="160" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="86" text-anchor="middle">1</text>
    <rect x="186" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="86" text-anchor="middle">1</text>
    <rect x="212" y="68" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="225" y="86" text-anchor="middle">1</text>
    <rect x="238" y="68" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="86" text-anchor="middle">2</text>
    <rect x="264" y="68" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="277" y="86" text-anchor="middle">2</text>
    <rect x="290" y="68" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="303" y="86" text-anchor="middle">2</text>
  </g>

  <text x="43" y="108" text-anchor="middle" font-size="9.5" fill="#446688">"000"</text>
  <text x="69" y="108" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="173" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a">"11111"</text>
  <text x="225" y="108" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="277" y="108" text-anchor="middle" font-size="9.5" fill="#d6a040">"222"</text>
  <text x="303" y="108" text-anchor="middle" font-size="9" fill="#888">3</text>

  <rect x="30" y="118" width="78" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="69" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">3%3=0 ✓</text>
  <rect x="118" y="118" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="183" y="132" text-anchor="middle" font-size="10" fill="#d6a040">5%3=2 ⇒ 配1个"2"</text>
  <rect x="258" y="118" width="78" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="297" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">3%3=0 ✓</text>

  <text x="30" y="158" font-size="11" fill="#666">分解：</text>
  <rect x="78" y="146" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="104" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"000"</text>
  <text x="135" y="161" font-size="13" fill="#666">+</text>
  <rect x="148" y="146" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="174" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"111"</text>
  <text x="205" y="161" font-size="13" fill="#666">+</text>
  <rect x="218" y="146" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="238" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"11"</text>
  <text x="263" y="161" font-size="13" fill="#666">+</text>
  <rect x="276" y="146" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="302" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"222"</text>

  <rect x="30" y="176" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">恰好 1 个长度 2 ("11")，其余长度 3 → true ✓</text>

  <text x="30" y="236" font-size="12.5" fill="#b85450" font-weight="bold">例 1 (false)：s = "000111000"</text>

  <g font-size="13" font-weight="bold" fill="#333">
    <rect x="30" y="246" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="43" y="264" text-anchor="middle">0</text>
    <rect x="56" y="246" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="69" y="264" text-anchor="middle">0</text>
    <rect x="82" y="246" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="264" text-anchor="middle">0</text>
    <rect x="108" y="246" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="121" y="264" text-anchor="middle">1</text>
    <rect x="134" y="246" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="147" y="264" text-anchor="middle">1</text>
    <rect x="160" y="246" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="264" text-anchor="middle">1</text>
    <rect x="186" y="246" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="264" text-anchor="middle">0</text>
    <rect x="212" y="246" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="225" y="264" text-anchor="middle">0</text>
    <rect x="238" y="246" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="251" y="264" text-anchor="middle">0</text>
  </g>

  <rect x="30" y="280" width="78" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="69" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a">3%3=0 ✓</text>
  <rect x="118" y="280" width="78" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="157" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a">3%3=0 ✓</text>
  <rect x="206" y="280" width="78" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="245" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a">3%3=0 ✓</text>

  <rect x="30" y="306" width="254" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="157" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">三段都 %3=0，凑不出任何长度 2 → false ✗</text>

  <text x="30" y="372" font-size="12.5" fill="#b85450" font-weight="bold">例 3 (false)：s = "011100022233"</text>

  <g font-size="12" font-weight="bold" fill="#333">
    <rect x="30" y="382" width="22" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="41" y="399" text-anchor="middle">0</text>
    <rect x="52" y="382" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="63" y="399" text-anchor="middle">1</text>
    <rect x="74" y="382" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="85" y="399" text-anchor="middle">1</text>
    <rect x="96" y="382" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="107" y="399" text-anchor="middle">1</text>
    <rect x="118" y="382" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="129" y="399" text-anchor="middle">0</text>
    <rect x="140" y="382" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="399" text-anchor="middle">0</text>
    <rect x="162" y="382" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="399" text-anchor="middle">0</text>
    <rect x="184" y="382" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="195" y="399" text-anchor="middle">2</text>
    <rect x="206" y="382" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="217" y="399" text-anchor="middle">2</text>
    <rect x="228" y="382" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="239" y="399" text-anchor="middle">2</text>
    <rect x="250" y="382" width="22" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="261" y="399" text-anchor="middle">3</text>
    <rect x="272" y="382" width="22" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="283" y="399" text-anchor="middle">3</text>
  </g>

  <path d="M 41 408 L 41 420" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="14" y="424" width="54" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="41" y="439" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">"0" len=1</text>

  <rect x="80" y="424" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="439" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1 % 3 == 1 ✗</text>

  <rect x="30" y="456" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="471" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">首段就是单个 "0"，长度 1 无法被 3 与 2 拼出</text>
  <text x="180" y="485" text-anchor="middle" font-size="11" fill="#888">(即使后面有可用的长度 2，也救不回余 1) → false</text>

  <rect x="350" y="68" width="210" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="455" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">判定速查表</text>
  <text x="368" y="116" font-size="11" fill="#444">• 全段 L%3==0：false</text>
  <text x="368" y="134" font-size="11" fill="#444">  (无长度 2 可用)</text>
  <text x="368" y="158" font-size="11" fill="#444">• L%3==2 段恰 1 个：true</text>
  <text x="368" y="176" font-size="11" fill="#444">• L%3==2 段 ≥ 2 个：false</text>
  <text x="368" y="194" font-size="11" fill="#b85450" font-weight="bold">• 任一段 L%3==1：false</text>
</svg>
