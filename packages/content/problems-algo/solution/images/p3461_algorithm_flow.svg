<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">模拟流程：每轮长度减 1，共 n − 2 轮后只剩两位</text>

  <rect x="195" y="36" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">读入数字串 s</text>

  <path d="M 260 70 L 260 95" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,98 340,138 260,178 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="11" fill="#333">len(s) &gt; 2 ?</text>

  <text x="349" y="131" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 340 138 L 362 138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="365" y="116" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="134" text-anchor="middle" font-size="10" fill="#333">每对相邻数字</text>
  <text x="435" y="151" text-anchor="middle" font-size="10" fill="#333">求和 mod 10 → 新串</text>

  <path d="M 435 116 L 435 53 L 331 53" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="45" text-anchor="middle" font-size="9" fill="#888">新串替换 s，长度减 1</text>

  <text x="268" y="196" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 260 178 L 260 200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="203" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较剩下两位 s[0]、s[1]</text>

  <path d="M 260 239 L 260 256 L 152 256 L 152 267" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="251" font-size="10" fill="#4a7a3a" font-weight="bold">相等</text>
  <path d="M 260 239 L 260 256 L 368 256 L 368 267" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="251" font-size="10" fill="#b85450" font-weight="bold">不等</text>

  <rect x="87" y="270" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="152" y="289" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 true</text>
  <text x="152" y="304" text-anchor="middle" font-size="8.5" fill="#888">（3902 → 292 → 11）</text>

  <rect x="303" y="270" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="368" y="289" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="368" y="304" text-anchor="middle" font-size="8.5" fill="#888">（34789 → … → 48）</text>

  <rect x="40" y="322" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#333">共 n − 2 轮 × 每轮 O(n) = O(n²)；n ≤ 100 时约五千次加法，轻松通过</text>
</svg>
