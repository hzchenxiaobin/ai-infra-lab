<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：转移求和 = 固定列上的滑动窗口和</text>

  <!-- left column: dp[t][j][1] -->
  <text x="105" y="52" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">固定列 j：dp[t][j][1]</text>

  <rect x="70" y="62" width="70" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="83" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">t=5</text>
  <rect x="70" y="100" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="121" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">t=4</text>
  <rect x="70" y="138" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="159" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">t=3</text>
  <rect x="70" y="176" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="197" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">t=2</text>
  <rect x="70" y="214" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t=1</text>
  <rect x="70" y="252" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t=0</text>

  <!-- window bracket -->
  <rect x="58" y="94" width="94" height="120" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="7 5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="300" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">窗口 [i−limit, i−1]</text>
  <text x="105" y="315" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（长度 ≤ limit）</text>

  <!-- right column: s1 -->
  <text x="335" y="52" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">列前缀和 s1[t][j]</text>

  <rect x="300" y="62" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s1[5]</text>
  <rect x="300" y="100" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="121" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">s1[4]</text>
  <rect x="300" y="138" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s1[3]</text>
  <rect x="300" y="176" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s1[2]</text>
  <rect x="300" y="214" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="235" text-anchor="middle" font-size="11" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">s1[1]</text>
  <rect x="300" y="252" width="70" height="32" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s1[0]</text>

  <text x="335" y="300" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">s1[t][j] = Σ(u≤t) dp[u][j][1]</text>
  <text x="335" y="315" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（随主循环逐格维护）</text>

  <!-- converging dashed arrows -->
  <path d="M152,160 C210,180 180,270 210,312" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M370,116 C400,150 350,240 330,312" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M370,230 C395,255 360,290 345,312" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="30" y="312" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="13.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">dp[i][j][0] = s1[i−1][j] − s1[i−limit−1][j]</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">= 窗口 [i−limit, i−1] 内 dp[t][j][1] 之和：一次减法代替 ≤ limit 次加法</text>
  <text x="280" y="383" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（图中取 i=5、limit=3；i−limit−1 &lt; 0 时取 0。dp[i][j][1] 对称地用沿 j 方向的行前缀和 s0）</text>
</svg>
