<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">频率回溯递归树：tiles="AAB"（每选一个字母 = 一个新序列）</text>

  <!-- ====== ROOT ====== -->
  <ellipse cx="330" cy="64" rx="58" ry="18" fill="#eeeeee" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#555">path=""  cnt={A:2,B:1}</text>
  <text x="330" y="84" text-anchor="middle" font-size="9" fill="#888">根（不计入答案）</text>

  <!-- edges root -> L1 -->
  <line x1="300" y1="80" x2="210" y2="116" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="80" x2="450" y2="116" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="100" font-size="11" fill="#446688" font-weight="bold">选 A</text>
  <text x="408" y="100" font-size="11" fill="#d6a040" font-weight="bold">选 B</text>

  <!-- ====== LEVEL 1 ====== -->
  <rect x="160" y="118" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"A"</text>
  <text x="210" y="151" text-anchor="middle" font-size="9" fill="#888">cnt={A:1,B:1}　+1</text>

  <rect x="400" y="118" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"B"</text>
  <text x="450" y="151" text-anchor="middle" font-size="9" fill="#888">cnt={A:2,B:0}　+1</text>

  <!-- edges L1 -> L2 -->
  <line x1="190" y1="158" x2="120" y2="206" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="230" y1="158" x2="250" y2="206" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="186" font-size="10" fill="#446688" font-weight="bold">选 A</text>
  <text x="258" y="186" font-size="10" fill="#d6a040" font-weight="bold">选 B</text>

  <line x1="450" y1="158" x2="450" y2="206" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="186" font-size="10" fill="#446688" font-weight="bold">选 A</text>

  <!-- ====== LEVEL 2 ====== -->
  <rect x="70" y="208" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"AA"</text>
  <text x="120" y="241" text-anchor="middle" font-size="9" fill="#888">cnt={A:0,B:1}　+1</text>

  <rect x="200" y="208" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"AB"</text>
  <text x="250" y="241" text-anchor="middle" font-size="9" fill="#888">cnt={A:1,B:0}　+1</text>

  <rect x="400" y="208" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"BA"</text>
  <text x="450" y="241" text-anchor="middle" font-size="9" fill="#888">cnt={A:1,B:0}　+1</text>

  <!-- edges L2 -> L3 (leaves) -->
  <line x1="120" y1="248" x2="120" y2="296" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="276" font-size="10" fill="#d6a040" font-weight="bold">选 B</text>

  <line x1="250" y1="248" x2="250" y2="296" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="276" font-size="10" fill="#446688" font-weight="bold">选 A</text>

  <line x1="450" y1="248" x2="450" y2="296" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="276" font-size="10" fill="#446688" font-weight="bold">选 A</text>

  <!-- ====== LEVEL 3: leaves (cnt all 0) ====== -->
  <rect x="70" y="298" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"AAB"</text>
  <text x="120" y="331" text-anchor="middle" font-size="9" fill="#4a7a3a">cnt={A:0,B:0}　+1</text>

  <rect x="200" y="298" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ABA"</text>
  <text x="250" y="331" text-anchor="middle" font-size="9" fill="#4a7a3a">cnt={A:0,B:0}　+1</text>

  <rect x="400" y="298" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"BAA"</text>
  <text x="450" y="331" text-anchor="middle" font-size="9" fill="#4a7a3a">cnt={A:0,B:0}　+1</text>

  <!-- ====== counting panel ====== -->
  <rect x="24" y="356" width="612" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="378" font-size="12" fill="#444" font-weight="bold">★ 计数本质：每个非根节点 = 一个合法序列</text>

  <text x="40" y="398" font-size="11" fill="#555">每次"选一个字母"就让 path 延长一位，形成一个新的非空序列 → 立即 +1 计入答案。</text>
  <text x="40" y="414" font-size="11" fill="#555">因此</text>
  <text x="68" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = 递归树中除根以外的节点数</text>
  <text x="300" y="414" font-size="11" fill="#555">＝ "A","AA","AAB","AB","ABA","B","BA","BAA"</text>

  <text x="40" y="434" font-size="11" fill="#b85450" font-weight="bold">"A" 分支：5 个</text>
  <text x="140" y="434" font-size="11" fill="#555">（A, AA, AAB, AB, ABA）</text>
  <text x="320" y="434" font-size="11" fill="#d6a040" font-weight="bold">"B" 分支：3 个</text>
  <text x="420" y="434" font-size="11" fill="#555">（B, BA, BAA）</text>

  <text x="40" y="454" font-size="12" fill="#4a7a3a" font-weight="bold">合计 5 + 3 = 8 ✓</text>
  <text x="200" y="454" font-size="11" fill="#888">→ 同字母在频次表里只剩一条分支，天然不重复</text>
</svg>
