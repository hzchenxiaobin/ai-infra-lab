<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案只依赖 m，且是 m 的 n 次多项式</text>

  <!-- ① 平移不变 -->
  <rect x="14" y="34" width="298" height="86" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="50" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 平移双射：l 无关，只看 m = r−l+1</text>
  <rect x="30" y="58" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="74" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="66" y="58" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="83" y="74" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="102" y="58" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="74" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="145" y="74" font-size="10.5" fill="#666" filter="url(#rough2)">值域 [1,3]，m=3</text>
  <text x="228" y="74" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 种</text>
  <rect x="30" y="88" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="104" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">50</text>
  <rect x="66" y="88" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="83" y="104" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">52</text>
  <rect x="102" y="88" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="104" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">51</text>
  <text x="145" y="104" font-size="10.5" fill="#666" filter="url(#rough2)">值域 [50,52]，m=3</text>
  <text x="228" y="104" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 种</text>
  <text x="163" y="116" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">v ↦ v−l+1 保序 ⟹ 两域锯齿数组一一对应</text>

  <!-- ② 双层分解 -->
  <rect x="14" y="128" width="298" height="112" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="144" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 每个锯齿数组 = 结构层 + 取值层</text>
  <rect x="24" y="152" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="168" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">数组</text>
  <text x="56" y="182" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">[1,3,1]</text>
  <path d="M 92 172 L 108 172" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="112" y="150" width="102" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="163" y="164" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">结构层（与 m 无关）</text>
  <text x="163" y="176" text-anchor="middle" font-size="8.6" fill="#3a5c30" filter="url(#rough2)">位置分 k 个等价类 + 类间全序</text>
  <text x="163" y="188" text-anchor="middle" font-size="8.6" fill="#3a5c30" filter="url(#rough2)">{1,3}&lt;{2}：合法只看结构 ✓</text>
  <path d="M 218 172 L 234 172" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="238" y="150" width="66" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="271" y="164" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">取值层</text>
  <text x="271" y="176" text-anchor="middle" font-size="8.6" fill="#7a5c1a" filter="url(#rough2)">k 个互异值按序分配</text>
  <text x="271" y="188" text-anchor="middle" font-size="9.6" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">C(m,k) 种</text>
  <rect x="24" y="200" width="280" height="32" rx="6" fill="#f0f0f0" stroke="#777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="164" y="214" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">f(m) = Σₖ cₖ·C(m,k)</text>
  <text x="164" y="227" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">cₖ 只数结构 ⟹ 常数；C(m,k) 是 m 的 k 次多项式，k ≤ n</text>

  <!-- ③ 采样与插值曲线 -->
  <rect x="14" y="248" width="298" height="102" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="264" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 采样 n+1 个小点，外插到 m = 10⁹（n=3 示意）</text>
  <path d="M 34 336 L 40 333 L 46 329 L 52 324 L 58 318 L 64 311 L 70 303 L 76 294 L 82 284 L 88 273 L 94 261 L 100 248"
        fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 100 248 L 240 160" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="40" cy="333" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="52" cy="324" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="64" cy="311" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="76" cy="294" r="3.2" fill="#b85450" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="88" cy="273" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="100" cy="248" r="3.2" fill="#446688" filter="url(#rough2)"/>
  <text x="40" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="52" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="64" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="76" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>
  <text x="88" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">5</text>
  <text x="100" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">6</text>
  <text x="58" y="300" font-size="8.4" fill="#666" filter="url(#rough2)">f: 0,2,10,28,60…</text>
  <text x="110" y="238" font-size="8.4" fill="#446688" filter="url(#rough2)">实线 = 采样区间 m ≤ n+1</text>
  <rect x="232" y="146" width="72" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="159" text-anchor="middle" font-size="8.6" fill="#a0433f" font-weight="bold" filter="url(#rough2)">m = 10⁹ ？</text>
  <text x="268" y="170" text-anchor="middle" font-size="8.2" fill="#a0433f" filter="url(#rough2)">拉格朗日一发外插</text>
  <text x="200" y="200" font-size="8.4" fill="#b85450" filter="url(#rough2)">虚线 = 超出采样区间</text>

  <!-- 右侧便签 1 -->
  <rect x="322" y="34" width="184" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="52" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">为什么是「n 次」多项式？</text>
  <text x="414" y="68" text-anchor="middle" font-size="9" fill="#3d5a80" filter="url(#rough2)">k 个等价类 ⟹ k ≤ n</text>
  <text x="414" y="82" text-anchor="middle" font-size="9" fill="#3d5a80" filter="url(#rough2)">C(m,k) 次数恰为 k</text>
  <text x="414" y="100" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">n=3：2C(m,2)+4C(m,3) ✓</text>

  <!-- 右侧便签 2 -->
  <rect x="322" y="120" width="184" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="138" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">n+1 个点钉死整条曲线</text>
  <text x="414" y="154" text-anchor="middle" font-size="9" fill="#3a5c30" filter="url(#rough2)">采样 x = 1, 2, …, n+1</text>
  <text x="414" y="168" text-anchor="middle" font-size="9" fill="#3a5c30" filter="url(#rough2)">每个点是 O(n·x) 的小 DP</text>
  <text x="414" y="182" text-anchor="middle" font-size="9" fill="#3a5c30" filter="url(#rough2)">m ≤ n+1 时直接查表返回</text>

  <!-- 右侧便签 3 -->
  <rect x="322" y="200" width="184" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="218" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">连续整数点 ⟹ 插值 O(n)</text>
  <text x="414" y="234" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">Π(m−j) 用前后缀积拆开</text>
  <text x="414" y="248" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">Π(i−j) = (i−1)!·(K−i)!·(−1)</text>
  <text x="414" y="262" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">除法全走费马小定理逆元</text>

  <!-- 右侧便签 4 -->
  <rect x="322" y="280" width="184" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="298" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">系列三连：同一 DP 三条轴</text>
  <text x="414" y="314" text-anchor="middle" font-size="8.8" fill="#a0433f" filter="url(#rough2)">I  n,m≤2000  前缀和 DP</text>
  <text x="414" y="328" text-anchor="middle" font-size="8.8" fill="#a0433f" filter="url(#rough2)">II n≤10⁹,m≤75  矩阵快速幂</text>
  <text x="414" y="342" text-anchor="middle" font-size="8.8" fill="#a0433f" filter="url(#rough2)">III n≤200,m≤10⁹  采样+插值</text>
</svg>
