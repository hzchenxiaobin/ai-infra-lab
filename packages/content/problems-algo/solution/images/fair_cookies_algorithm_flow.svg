<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：dfs(idx) 逐包试分</text>

  <!-- Step 1: sort descending -->
  <rect x="160" y="42" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cookies 降序排序</text>
  <text x="260" y="75" text-anchor="middle" font-size="10" fill="#888">大包先放，best 早收敛</text>

  <path d="M 260 82 L 260 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: enter dfs(idx) -->
  <rect x="150" y="98" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(idx)：准备分第 idx 个包</text>
  <text x="260" y="133" text-anchor="middle" font-size="11" fill="#555">loads[k] 记录每孩子当前累计</text>

  <path d="M 260 142 L 260 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="260,156 350,196 260,236 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">idx == n ?</text>
  <text x="260" y="208" text-anchor="middle" font-size="10" fill="#888">所有包分完</text>

  <!-- yes branch -->
  <path d="M 350 196 L 410 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <rect x="412" y="176" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">best = min(best,</text>
  <text x="460" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max(loads))</text>

  <!-- no branch -->
  <path d="M 260 236 L 260 252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="248" font-size="11" fill="#555">否</text>

  <!-- Step 4: loop over children -->
  <rect x="120" y="254" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for c in 0..k-1：</text>

  <path d="M 260 294 L 260 306" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: prune check -->
  <polygon points="260,306 360,336 260,366 160,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">loads[c]+cookies[idx]</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">≥ best ?</text>

  <!-- prune yes -->
  <path d="M 160 336 L 110 336" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="134" y="328" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="20" y="320" width="86" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="63" y="340" text-anchor="middle" font-size="10" fill="#b85450">跳过此孩子</text>

  <!-- prune no: recurse -->
  <path d="M 360 336 L 420 336" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="424" y="312" width="88" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="330" text-anchor="middle" font-size="10" fill="#333">loads[c] += bag</text>
  <text x="468" y="344" text-anchor="middle" font-size="10" fill="#333">dfs(idx+1)</text>
  <text x="468" y="356" text-anchor="middle" font-size="10" fill="#333">loads[c] -= bag</text>

  <!-- symmetry note -->
  <rect x="120" y="384" width="280" height="28" fill="#fafafa" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#666">回溯后若 loads[c]==0 → break（空桶对称，只试一个）</text>
</svg>
