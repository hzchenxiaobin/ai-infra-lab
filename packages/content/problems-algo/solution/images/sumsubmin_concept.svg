<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：贡献计数法 —— 每个元素作为最小值"管辖"多少子数组</text>

  <text x="30" y="58" font-size="12" fill="#888">数组 arr = [3, 1, 2, 4]：</text>

  <line x1="70" y1="120" x2="390" y2="120" stroke="#7f8c8d" stroke-width="2.5" filter="url(#rough2)"/>

  <rect x="80" y="72" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="110" y="136" text-anchor="middle" font-size="10" fill="#888">i=0</text>

  <rect x="145" y="72" width="60" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="100" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="175" y="136" text-anchor="middle" font-size="10" fill="#888">i=1</text>

  <rect x="210" y="72" width="60" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i=2 ←聚焦</text>

  <rect x="275" y="72" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="100" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="305" y="136" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <path d="M 175 150 L 175 158 L 145 158 L 145 150" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">左边界 L=1</text>
  <text x="160" y="184" text-anchor="middle" font-size="9" fill="#b85450">(严格更小)</text>

  <path d="M 335 150 L 335 158 L 380 158 L 380 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="358" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右边界 R=4</text>
  <text x="358" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">(更小或相等)</text>

  <text x="30" y="212" font-size="12" fill="#444" font-weight="bold">以 arr[2]=2 为最小值的子数组（共 1×2 = 2 个）：</text>

  <rect x="80" y="228" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="248" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="145" y="228" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="248" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="210" y="228" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="248" text-anchor="middle" font-size="12" fill="#333">4</text>

  <text x="290" y="248" font-size="11" fill="#4a7a3a">[2] 和 [2,4]</text>

  <rect x="430" y="56" width="155" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="508" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">贡献公式</text>
  <line x1="445" y1="84" x2="570" y2="84" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="508" y="104" text-anchor="middle" font-size="12" fill="#333">贡献 = arr[i]</text>
  <text x="508" y="122" text-anchor="middle" font-size="12" fill="#333">× (i−L) × (R−i)</text>
  <text x="508" y="140" text-anchor="middle" font-size="10" fill="#888">L=左严格更小下标</text>
  <text x="508" y="152" text-anchor="middle" font-size="10" fill="#888">R=右更小或相等下标</text>

  <text x="30" y="294" font-size="12" fill="#444" font-weight="bold">为什么左"严格更小"、右"更小或相等"？</text>

  <rect x="50" y="308" width="530" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="328" text-anchor="middle" font-size="11" fill="#444">避免重复元素双重计数。如 arr=[2,2]，左用"严格更小"、右用"更小或相等"，</text>
  <text x="315" y="344" text-anchor="middle" font-size="11" fill="#444">则 arr[0] 管辖 [2]，arr[1] 管辖 [2,2] 和 [2]，子数组 [2,2] 只被 arr[1] 管辖，不重复。</text>

  <rect x="50" y="376" width="530" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="315" y="398" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = Σ arr[i] × (i−left[i]) × (right[i]−i)  mod 10⁹+7</text>
  <text x="315" y="414" text-anchor="middle" font-size="11" fill="#888">每个元素的 left[i]、right[i] 用单调栈 O(n) 预处理</text>
</svg>
