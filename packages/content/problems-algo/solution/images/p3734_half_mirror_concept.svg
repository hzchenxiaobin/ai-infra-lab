<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：回文 = 前半 f +（mid）+ 镜像 rev(f)，与 target 比较的胜负只由前半决定</text>

  <!-- 框1：自由度坍缩 -->
  <rect x="20" y="34" width="480" height="152" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 自由度坍缩：回文排列 ↔ 前半 f 的排列（half = 各字符频次的一半）</text>
  <text x="36" y="82" font-size="10" fill="#666" filter="url(#rough2)">例：s = "baba" → cnt{a:2, b:2} → half{a:1, b:1}（n 偶数，无 mid）</text>

  <text x="124" y="98" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">前半 f = "ba"（自由）</text>
  <text x="196" y="98" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">镜像 rev(f)</text>

  <text x="52" y="121" font-size="10.5" fill="#666" filter="url(#rough2)">t =</text>
  <rect x="88" y="102" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="124" y="102" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="160" y="102" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="196" y="102" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="121" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="140" y="121" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="176" y="121" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>
  <text x="212" y="121" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">b</text>

  <text x="104" y="142" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="140" y="142" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="176" y="142" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="212" y="142" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 104 146 C 104 160, 212 160, 212 146" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 140 146 C 140 156, 176 156, 176 146" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">t[i] = t[n−1−i]</text>

  <text x="252" y="110" font-size="10" fill="#33506b" filter="url(#rough2)">自由度全在 f 上：</text>
  <text x="252" y="128" font-size="10" fill="#33506b" filter="url(#rough2)">half 的每个排列 f</text>
  <text x="252" y="146" font-size="10" fill="#33506b" filter="url(#rough2)">→ 唯一确定一个回文</text>
  <text x="252" y="164" font-size="10" fill="#888" filter="url(#rough2)">"ab"→"abba"，"ba"→"baab"</text>

  <text x="36" y="180" font-size="10" fill="#33506b" filter="url(#rough2)">n 为奇数时再插入正中字符 mid（= 唯一奇频次字符，别无选择）：t = f + mid + rev(f)</text>

  <!-- 框2：两情形分解 -->
  <rect x="20" y="198" width="480" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="222" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② t &gt; target ⟺ 两个互斥情形（例：target = "abba"，h = 2，前缀 target[:h] = "ab"）</text>

  <rect x="36" y="238" width="215" height="72" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="258" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">情形一：f == "ab"（前缀恰可拼出）</text>
  <text x="143" y="276" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">t = "ab" + 镜像 = "abba"，整串直比：</text>
  <text x="143" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">== target，不严格大 ✗ → 转入情形二</text>

  <rect x="269" y="238" width="215" height="72" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形二：f &gt; "ab" 的最小排列 = "ba"</text>
  <text x="376" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">t = "ba" + 镜像 = "baab"</text>
  <text x="376" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">首位 'b' &gt; 'a' 已稳赢 ✓（尾巴任意）</text>

  <text x="36" y="332" font-size="10" fill="#8a6d1f" filter="url(#rough2)">f &lt; target[:h] ⟹ 首个不同位必落在前半且更小 ⟹ t &lt; target 永不可行——可行解必有 f ≥ target[:h]</text>

  <!-- 底部结论 -->
  <rect x="20" y="356" width="480" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">先查情形一（唯一候选、整串比较）；失败再对 half 跑 3720 的「匹配-回退」贪心，</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">求严格大于 target[:h] 的最小 f，镜像拼接 f + mid + rev(f) 即答案</text>
</svg>
