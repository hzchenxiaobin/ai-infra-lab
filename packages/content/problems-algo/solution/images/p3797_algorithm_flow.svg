<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：自底向上逐行递推——每行「先平移、再上行」</text>

  <rect x="140" y="36" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">初始化：dp0[n−1][c] = 可用格 ? 1 : 0</text>
  <text x="260" y="68" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">dp1 清零；算好 D = ⌊√(d²−1)⌋</text>

  <path d="M 260 78 L 260 92" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="94" width="340" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">① 行内平移：pre = dp0 的前缀和</text>
  <text x="260" y="127" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">dp1[c'] = pre[c'+d+1] − pre[c'−d] − dp0[c']（仅当本行 c' 可用）</text>

  <path d="M 260 140 L 260 154" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,158 328,182 260,206 192,182" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r == 0 ?</text>

  <path d="M 328 182 L 350 182" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="339" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="354" y="164" width="152" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">答案 = Σ(dp0+dp1)</text>
  <text x="430" y="194" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（第 0 行，mod 1e9+7）</text>

  <path d="M 260 206 L 260 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="218" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="90" y="224" width="340" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 上行一层：s = dp0 + dp1，pre2 = s 的前缀和</text>
  <text x="260" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">dp0'[c'] = pre2[c'+D+1] − pre2[c'−D]</text>
  <text x="260" y="269" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">（仅当上一行 c' 可用，否则置 0）</text>

  <path d="M 260 276 L 260 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="292" width="220" height="34" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ r ← r−1；dp0 ← dp0'，dp1 清零</text>

  <path d="M 372 309 L 452 309 L 452 116 L 434 116" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="466" y="215" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)"
        transform="rotate(90 466 215)">下一行，回到 ①</text>

  <text x="30" y="344" font-size="10" fill="#666" filter="url(#rough2)">每行两趟 O(m) 前缀和 ⇒ 总时间 O(n·m)，滚动数组空间 O(m)；n = m = 750 不到 60 万格</text>
</svg>
