<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2740f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 扫描相邻差 → 取最小</text>

  <!-- start: read nums -->
  <rect x="210" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">读入 nums</text>

  <path d="M280,86 L280,112" stroke="#446688" stroke-width="2" marker-end="url(#arr2740f)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="190" y="116" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sort(nums)</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">升序排序 O(n log n)</text>

  <path d="M280,160 L280,186" stroke="#446688" stroke-width="2" marker-end="url(#arr2740f)" filter="url(#rough2)"/>

  <!-- init ans = INF -->
  <rect x="210" y="190" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = +∞</text>

  <path d="M280,228 L280,252" stroke="#446688" stroke-width="2" marker-end="url(#arr2740f)" filter="url(#rough2)"/>

  <!-- loop decision -->
  <path d="M280,256 L400,300 L280,344 L160,300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n−1 ?</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#d6a040">遍历相邻对</text>

  <!-- yes branch: update ans -->
  <text x="410" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M400,300 L470,300 L470,256" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2740f)" filter="url(#rough2)"/>
  <rect x="392" y="212" width="156" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d = nums[i+1]−nums[i]</text>
  <text x="470" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a">ans = min(ans, d)</text>
  <!-- loop back to decision -->
  <path d="M548,232 L548,300 L400,300" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arr2740f)" filter="url(#rough2)"/>
  <text x="548" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">i++</text>

  <!-- no branch: return -->
  <text x="120" y="296" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M160,300 L80,300 L80,366" stroke="#b85450" stroke-width="2" marker-end="url(#arr2740f)" filter="url(#rough2)"/>
  <rect x="20" y="370" width="120" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="388" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>
  <text x="80" y="402" text-anchor="middle" font-size="9" fill="#b85450">= 最小相邻间隙</text>

  <!-- side note -->
  <rect x="200" y="368" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="370" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">单次线性扫描即可，无需显式模拟划分</text>
  <text x="370" y="402" text-anchor="middle" font-size="10" fill="#446688">每个切点即一种合法划分，取间隙最小者</text>
</svg>
