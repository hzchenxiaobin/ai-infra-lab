<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 264"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="264" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：number = "--17-5 229 35-39475 "  →  n = 13
  </text>

  <!-- table frame -->
  <g filter="url(#rough2)">
    <!-- header background -->
    <rect x="24" y="54" width="492" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <!-- column dividers -->
    <line x1="70" y1="54" x2="70" y2="200" stroke="#446688" stroke-width="1"/>
    <line x1="190" y1="54" x2="190" y2="200" stroke="#446688" stroke-width="1"/>
    <line x1="370" y1="54" x2="370" y2="200" stroke="#446688" stroke-width="1"/>
    <!-- row dividers -->
    <line x1="24" y1="84" x2="516" y2="84" stroke="#446688" stroke-width="1"/>
    <line x1="24" y1="112" x2="516" y2="112" stroke="#446688" stroke-width="1"/>
    <line x1="24" y1="140" x2="516" y2="140" stroke="#446688" stroke-width="1"/>
    <line x1="24" y1="168" x2="516" y2="168" stroke="#446688" stroke-width="1"/>
    <!-- outer border -->
    <rect x="24" y="54" width="492" height="146" fill="none" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <!-- header text -->
  <g filter="url(#rough2)">
    <text x="47" y="74" text-anchor="middle" font-size="12" fill="#446688">步骤</text>
    <text x="130" y="74" text-anchor="middle" font-size="12" fill="#446688">剩余 (n)</text>
    <text x="280" y="74" text-anchor="middle" font-size="12" fill="#446688">动作</text>
    <text x="443" y="74" text-anchor="middle" font-size="12" fill="#446688">parts（已收集）</text>
  </g>

  <!-- Row 0 -->
  <g filter="url(#rough2)">
    <text x="47" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="130" y="102" text-anchor="middle" font-size="11" fill="#333">1752293539475 (13)</text>
    <text x="280" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a">13 &gt; 4 → 取 "175"</text>
    <text x="443" y="102" text-anchor="middle" font-size="11" fill="#333">["175"]</text>
  </g>

  <!-- Row 1 -->
  <g filter="url(#rough2)">
    <text x="47" y="130" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="130" y="130" text-anchor="middle" font-size="11" fill="#333">2293539475 (10)</text>
    <text x="280" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a">10 &gt; 4 → 取 "229"</text>
    <text x="443" y="130" text-anchor="middle" font-size="11" fill="#333">["175","229"]</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#rough2)">
    <text x="47" y="158" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="130" y="158" text-anchor="middle" font-size="11" fill="#333">3539475 (7)</text>
    <text x="280" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a">7 &gt; 4 → 取 "353"</text>
    <text x="443" y="158" text-anchor="middle" font-size="11" fill="#333">["175","229","353"]</text>
  </g>

  <!-- Row 3: the special 4 -> 2+2 -->
  <g filter="url(#rough2)">
    <text x="47" y="186" text-anchor="middle" font-size="12" fill="#b85450">3</text>
    <text x="130" y="186" text-anchor="middle" font-size="11" fill="#b85450">9475 (4)</text>
    <text x="280" y="186" text-anchor="middle" font-size="11" fill="#b85450">== 4 → 拆 "94","75"</text>
    <text x="443" y="186" text-anchor="middle" font-size="11" fill="#333">[…,"94","75"]</text>
  </g>

  <!-- result bar -->
  <rect x="24" y="214" width="492" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">
    结果 = '-'.join(parts) = "175-229-353-94-75"
  </text>
</svg>
