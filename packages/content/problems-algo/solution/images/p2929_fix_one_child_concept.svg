<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定 x₁ 后，x₂ 落在一段连续区间</text>

  <rect x="100" y="38" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">x₁ + x₂ + x₃ = n，0 ≤ xᵢ ≤ limit</text>

  <rect x="40" y="90" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="109" text-anchor="middle" font-size="12" fill="#333">固定 x₁ = i</text>
  <text x="105" y="126" text-anchor="middle" font-size="10" fill="#d6a040">只枚举这一维</text>
  <path d="M 172 112 L 191 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="195" y="90" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12" fill="#333">剩 m = n − i 颗</text>
  <text x="260" y="126" text-anchor="middle" font-size="10" fill="#d6a040">分给小朋友 2、3</text>
  <path d="M 327 112 L 346 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="350" y="90" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="109" text-anchor="middle" font-size="12" fill="#333">两人子问题</text>
  <text x="415" y="126" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x₂ + x₃ = m</text>

  <text x="44" y="160" font-size="11.5" fill="#555">x₂ 的每条约束各占一条数轴（示意：limit = 4，m = 6）：</text>

  <line x1="150" y1="172" x2="150" y2="336" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="172" x2="270" y2="336" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="172" x2="390" y2="336" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="172" x2="510" y2="336" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="142" y="193" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">0 ≤ x₂ ≤ limit</text>
  <text x="142" y="207" text-anchor="end" font-size="9.5" fill="#999">自身不超限</text>
  <rect x="150" y="180" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="180" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="142" y="229" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">x₂ ≤ m</text>
  <text x="142" y="243" text-anchor="end" font-size="9.5" fill="#999">保证 x₃ ≥ 0</text>
  <rect x="150" y="216" width="360" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="142" y="265" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">x₂ ≥ m − limit</text>
  <text x="142" y="279" text-anchor="end" font-size="9.5" fill="#999">保证 x₃ ≤ limit</text>
  <rect x="150" y="252" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="252" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="142" y="309" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">交集</text>
  <text x="142" y="323" text-anchor="end" font-size="9.5" fill="#999">= 合法区间</text>
  <rect x="150" y="296" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="296" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="296" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="330" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">c(m) = 3</text>

  <text x="150" y="350" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#888">m−limit</text>
  <text x="390" y="350" text-anchor="middle" font-size="10.5" fill="#888">limit</text>
  <text x="510" y="350" text-anchor="middle" font-size="10.5" fill="#888">m</text>

  <rect x="35" y="360" width="450" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#333">每个 x₂ 唯一确定 x₃ = m − x₂ → 区间长度即方案数</text>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c(m) = min(limit, m) − max(0, m − limit) + 1（负则记 0）</text>

  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#888">c(m) 是关于 m 的帐篷函数：m ≤ limit 时为 m+1；m ≤ 2·limit 时为 2·limit−m+1；再大归零</text>
</svg>
