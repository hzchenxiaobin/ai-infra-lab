<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：以 Invoices 为基表逐层 LEFT JOIN</text>

  <!-- Step 1: Invoices as base -->
  <rect x="250" y="50" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Step 1: FROM Invoices i（基表）</text>

  <line x1="360" y1="96" x2="360" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: LEFT JOIN Customers -->
  <rect x="200" y="120" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Step 2: LEFT JOIN Customers c ON i.user_id = c.customer_id</text>

  <line x1="360" y1="166" x2="360" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: LEFT JOIN Contacts -->
  <rect x="180" y="190" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Step 3: LEFT JOIN Contacts co ON i.user_id = co.user_id</text>

  <line x1="360" y1="236" x2="360" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: LEFT JOIN Customers again (trusted check) -->
  <rect x="140" y="260" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="288" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Step 4: LEFT JOIN Customers co2 ON co.contact_email = co2.email</text>

  <line x1="360" y1="306" x2="360" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: GROUP BY + COUNT -->
  <rect x="120" y="330" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Step 5: GROUP BY invoice_id → COUNT(co.contact_name) / COUNT(co2.email)</text>

  <line x1="360" y1="376" x2="360" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: Output -->
  <rect x="160" y="400" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="420" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">SELECT invoice_id, customer_name, price,</text>
  <text x="360" y="436" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">contacts_cnt, trusted_contacts_cnt → ORDER BY invoice_id</text>

  <!-- Side annotations -->
  <text x="590" y="145" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取顾客名</text>
  <text x="590" y="215" font-size="10" fill="#d6a040" filter="url(#rough2)">展开联系人</text>
  <text x="590" y="285" font-size="10" fill="#4a7a3a" filter="url(#rough2)">判定可信</text>
  <text x="590" y="355" font-size="10" fill="#b85450" filter="url(#rough2)">聚合计数</text>

  <!-- Key insight box -->
  <rect x="40" y="460" width="640" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="480" font-size="11" fill="#333" filter="url(#rough2)">💡 COUNT(co.contact_name) 统计所有联系人（非空才计），COUNT(co2.email) 只统计能匹配到</text>
  <text x="60" y="498" font-size="11" fill="#333" filter="url(#rough2)">    顾客邮箱的联系人——两次 JOIN 产物的 COUNT 差异即是「可信」筛选</text>
</svg>
