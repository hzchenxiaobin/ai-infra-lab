<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：上三角全 0 ⇔ 每行尾零数足够</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">主对角线以上的格子必须为 0 → 第 i 行只需末尾 (n−1−i) 个 0 → 尾零数 ≥ n−1−i</text>

  <!-- Left: 3x3 grid with diagonal and above-diagonal region -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">3×3 网格（n=3）：</text>

  <g font-size="12">
    <!-- row 0: cells (0,1)(0,2) above diag → shaded must-be-0 -->
    <rect x="40" y="86" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="56" y="107" text-anchor="middle" fill="#333">×</text>
    <rect x="74" y="86" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="90" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="108" y="86" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="124" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>

    <!-- row 1: cell (1,2) above diag -->
    <rect x="40" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="56" y="141" text-anchor="middle" fill="#333">×</text>
    <rect x="74" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="90" y="141" text-anchor="middle" fill="#333">×</text>
    <rect x="108" y="120" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="124" y="141" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>

    <!-- row 2: nothing above diag -->
    <rect x="40" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="56" y="175" text-anchor="middle" fill="#333">×</text>
    <rect x="74" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="90" y="175" text-anchor="middle" fill="#333">×</text>
    <rect x="108" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="124" y="175" text-anchor="middle" fill="#333">×</text>
  </g>

  <!-- diagonal label -->
  <text x="56" y="202" text-anchor="middle" font-size="9" fill="#446688">主对角线 ↘</text>
  <path d="M 56 206 L 124 206" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- above-diagonal region label -->
  <text x="108" y="220" text-anchor="middle" font-size="10" fill="#b85450">上三角 = 必须为 0</text>

  <!-- arrow to reduction -->
  <path d="M 150 135 L 200 135" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="175" y="128" text-anchor="middle" font-size="9" fill="#666">化简</text>

  <!-- Right: trailing zeros table -->
  <text x="210" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">每行尾零数 tz[i] → 需求 n−1−i：</text>

  <g font-size="11">
    <!-- header -->
    <rect x="210" y="86" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="240" y="103" text-anchor="middle" fill="#333" font-weight="bold">行 i</text>
    <rect x="272" y="86" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="312" y="103" text-anchor="middle" fill="#333" font-weight="bold">尾零 tz[i]</text>
    <rect x="354" y="86" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="397" y="103" text-anchor="middle" fill="#333" font-weight="bold">需求 n−1−i</text>

    <!-- row 0 -->
    <rect x="210" y="112" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="240" y="129" text-anchor="middle" fill="#333">0</text>
    <rect x="272" y="112" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="312" y="129" text-anchor="middle" fill="#333">≥ 2</text>
    <rect x="354" y="112" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="397" y="129" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <!-- row 1 -->
    <rect x="210" y="138" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="240" y="155" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="138" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="312" y="155" text-anchor="middle" fill="#333">≥ 1</text>
    <rect x="354" y="138" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="397" y="155" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <!-- row 2 -->
    <rect x="210" y="164" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="240" y="181" text-anchor="middle" fill="#333">2</text>
    <rect x="272" y="164" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="312" y="181" text-anchor="middle" fill="#333">≥ 0</text>
    <rect x="354" y="164" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="397" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- divider -->
  <path d="M 40 240 L 520 240" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Bottom: greedy matching -->
  <text x="40" y="262" font-size="11" fill="#446688" font-weight="bold">贪心匹配：从上到下逐行，为每个位置找最近的合格行</text>
  <text x="40" y="278" font-size="10" fill="#888">位置 i 需求最高（n−1−i 最大），先分配；找到的第一个合格行上移，交换次数 = 距离</text>

  <!-- position boxes -->
  <g font-size="11">
    <rect x="50" y="296" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="85" y="315" text-anchor="middle" fill="#333">位置 0</text>
    <rect x="50" y="330" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="85" y="349" text-anchor="middle" fill="#333">位置 1</text>
    <rect x="50" y="364" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="85" y="383" text-anchor="middle" fill="#333">位置 2</text>
  </g>

  <!-- requirement labels -->
  <text x="135" y="315" font-size="10" fill="#b85450">需 tz≥2</text>
  <text x="135" y="349" font-size="10" fill="#b85450">需 tz≥1</text>
  <text x="135" y="383" font-size="10" fill="#b85450">需 tz≥0</text>

  <!-- arrows to candidate rows -->
  <path d="M 175 310 L 260 310" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 175 344 L 300 344" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 175 378 L 340 378" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- candidate row pool -->
  <text x="270" y="290" font-size="10" fill="#888">候选行池（按尾零数）</text>
  <g font-size="11">
    <rect x="260" y="296" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="288" y="315" text-anchor="middle" fill="#333">tz=2</text>
    <rect x="300" y="330" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="328" y="349" text-anchor="middle" fill="#333">tz=1</text>
    <rect x="340" y="364" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="368" y="383" text-anchor="middle" fill="#333">tz=0</text>
  </g>

  <!-- result note -->
  <rect x="430" y="320" width="110" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="485" y="340" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">交换相邻行</text>
  <text x="485" y="356" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">= 冒泡上移</text>
</svg>
