<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：每个起点跑两次 Dijkstra，再 O(n) 合并</text>

  <!-- step 0: build graphs -->
  <rect x="115" y="38" width="290" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333">① 建两张邻接表：G₁ 边权 cost，G₂ 边权 cost×tax</text>

  <path d="M 260 74 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="92" y="94" width="336" height="196" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>
  <text x="104" y="112" font-size="11" fill="#666">对每个起点 i = 0 … n−1</text>

  <!-- step 1 -->
  <rect x="125" y="120" width="270" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333">② Dijkstra(G₁, i) → 空手距离 d₁[·]</text>

  <path d="M 260 156 L 260 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="125" y="176" width="270" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="12" fill="#333">③ Dijkstra(G₂, i) → 携带距离 d₂[·]</text>

  <path d="M 260 212 L 260 228" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="105" y="232" width="310" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ ans[i] = minⱼ ( d₁[j] + prices[j] + d₂[j] )</text>
  <text x="260" y="271" text-anchor="middle" font-size="10.5" fill="#666">j 不可达则跳过；j = i 即本地购买 prices[i]</text>

  <!-- loop back -->
  <path d="M 415 257 L 448 257 L 448 138 L 399 138" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="460" y="200" font-size="10.5" fill="#888" transform="rotate(-90 460 200)">下一个起点</text>

  <path d="M 260 282 L 260 298" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="115" y="302" width="290" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 ans</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#666">答案 ≤ prices[i] ≤ 10⁹ 装 int；中间和用 64 位</text>
</svg>
