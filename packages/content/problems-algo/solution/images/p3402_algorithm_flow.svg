<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">逐列自上而下扫：能不动就不动，不够才补到 prev+1</text>

  <!-- Step 1 -->
  <rect x="70" y="40" width="380" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 列独立：对每一列 j 单独处理，ans 累加各列代价</text>
  <path d="M260,72 L260,86" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="100" y="90" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② prev = grid[0][j]，i 从 1 扫到 m−1</text>
  <path d="M260,122 L260,138" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="260,142 356,188 260,234 164,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ grid[i][j] &gt; prev ?</text>

  <!-- no branch: must lift -->
  <text x="168" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M164,188 L146,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="168" width="112" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="184" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">ans += prev+1 − v</text>
  <text x="88" y="200" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">prev = prev + 1</text>
  <text x="100" y="230" font-size="10" fill="#888" filter="url(#rough2)">v=grid[i][j]，补到刚好 prev+1</text>
  <path d="M88,208 L88,249" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes branch: keep -->
  <text x="360" y="178" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M356,188 L374,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="378" y="170" width="104" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">prev = grid[i][j]</text>
  <text x="430" y="201" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">（不花代价）</text>
  <text x="416" y="230" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">已比 prev 大，不用动</text>
  <path d="M430,208 L430,249" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: next row -->
  <rect x="60" y="252" width="400" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++，处理下一行；i &lt; m 则回到 ③ 重新判断</text>
  <path d="M260,282 L260,304" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: next column -->
  <rect x="60" y="308" width="400" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本列扫完，j++；j &lt; n 则回到 ② 取下一列</text>
  <path d="M260,338 L260,354" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- column loop-back -->
  <path d="M460,323 L496,323 L496,106 L426,106" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="316" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">j &lt; n</text>

  <!-- return -->
  <rect x="185" y="358" width="150" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">返回 ans</text>

  <!-- bottom note -->
  <rect x="60" y="398" width="400" height="30" rx="8" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">每格只看一次：时间 O(m·n)，空间 O(1)；答案上界约 6.4×10⁶，int 足够</text>
</svg>
