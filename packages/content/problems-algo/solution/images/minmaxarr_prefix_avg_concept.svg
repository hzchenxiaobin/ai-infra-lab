<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：值只能左移 → 前缀和只增不减 → 答案 = max⌈前缀和 / 长度⌉</text>

  <!-- ===== 操作示意 ===== -->
  <text x="150" y="64" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">操作</text>
  <!-- i-1 box (gains +1) -->
  <rect x="200" y="50" width="74" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="237" y="73" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">i−1 (+1)</text>
  <!-- i box (loses 1) -->
  <rect x="316" y="50" width="74" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="353" y="73" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">i (−1)</text>
  <!-- leftward arrow -->
  <path d="M 316 68 L 278 68" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="297" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 单位左移</text>
  <text x="430" y="64" font-size="11" fill="#4a7a3a" font-weight="bold">总和不变</text>
  <text x="430" y="78" font-size="10.5" fill="#4a7a3a">每个前缀和只能 ↑ 或不变</text>

  <!-- divider -->
  <line x1="30" y1="100" x2="540" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== nums row ===== -->
  <text x="150" y="138" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">nums =</text>
  <text x="165" y="124" text-anchor="middle" font-size="9.5" fill="#888">下标0</text>
  <text x="245" y="124" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="325" y="124" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="405" y="124" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <rect x="130" y="130" width="70" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="210" y="130" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="155" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <rect x="290" y="130" width="70" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="130" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="155" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">6</text>

  <!-- ===== prefix sum row ===== -->
  <text x="150" y="200" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">前缀和 S_k =</text>
  <rect x="130" y="178" width="70" height="32" fill="#eef5fb" stroke="#7a93b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="210" y="178" width="70" height="32" fill="#eef5fb" stroke="#7a93b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">10</text>
  <rect x="290" y="178" width="70" height="32" fill="#eef5fb" stroke="#7a93b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">11</text>
  <rect x="370" y="178" width="70" height="32" fill="#eef5fb" stroke="#7a93b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="405" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">17</text>

  <!-- ===== ceiling row ===== -->
  <text x="150" y="250" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">⌈S_k / k⌉ =</text>
  <rect x="130" y="228" width="70" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="249" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">3</text>
  <rect x="210" y="228" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="290" y="228" width="70" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="249" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <rect x="370" y="228" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="405" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="448" y="250" font-size="11" fill="#b85450" font-weight="bold">红色 = 取 max 的项</text>

  <!-- small formula annotations under ceiling boxes -->
  <text x="165" y="276" text-anchor="middle" font-size="9.5" fill="#888">⌈3/1⌉</text>
  <text x="245" y="276" text-anchor="middle" font-size="9.5" fill="#b85450">⌈10/2⌉</text>
  <text x="325" y="276" text-anchor="middle" font-size="9.5" fill="#888">⌈11/3⌉</text>
  <text x="405" y="276" text-anchor="middle" font-size="9.5" fill="#b85450">⌈17/4⌉</text>

  <!-- divider -->
  <line x1="30" y1="294" x2="540" y2="294" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== answer note box ===== -->
  <rect x="30" y="308" width="500" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max{3, 5, 4, 5} = 5</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333">下界：前缀 [0..k−1] 和 ≥ S_k 且 ≤ k·M → M ≥ ⌈S_k/k⌉</text>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#333">取遍所有 k 的 max 即得下界；该下界可达（见 Q&amp;A）</text>

  <!-- ===== lower bound chain box ===== -->
  <rect x="30" y="384" width="500" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么是前缀「上取整均值」？</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#333">值只能左移 ⇒ 任意前缀和只能变大 ⇒ S_k（原始）≤ S′_k ≤ k·M</text>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#333">⇒ M ≥ S_k / k ⇒ M ≥ ⌈S_k / k⌉；对 k = 1..n 取 max 即答案</text>
</svg>
