<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">逆向撤销：上一步怎么还原？（设 x ≥ y，否则对称交换）</text>
  <text x="260" y="37" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">按 x 与 2y 的大小关系分三种情形，外加一个奇偶死锁</text>

  <!-- 三种情形 -->
  <g filter="url(#rough2)">
    <rect x="16" y="50" width="156" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="94" y="70" text-anchor="middle" font-size="11.5" fill="#33455e" font-weight="bold">x = y（对角线）</text>
    <text x="94" y="88" text-anchor="middle" font-size="10" fill="#33455e">前驱：(0, x) 或 (x, 0)</text>
    <text x="94" y="106" text-anchor="middle" font-size="9.5" fill="#33455e">只能来自含 0 坐标的状态</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="184" y="50" width="152" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="70" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">y &lt; x &lt; 2y</text>
    <text x="260" y="88" text-anchor="middle" font-size="10" fill="#2a5a2a">前驱：(x − y, y)</text>
    <text x="260" y="106" text-anchor="middle" font-size="9.5" fill="#2a5a2a">「累加型」：一步加上 y</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="348" y="50" width="156" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="426" y="70" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">x ≥ 2y</text>
    <text x="426" y="88" text-anchor="middle" font-size="10" fill="#8a6d1f">前驱：(x/2, y)</text>
    <text x="426" y="106" text-anchor="middle" font-size="9.5" fill="#8a6d1f">「翻倍型」：一步翻倍</text>
  </g>

  <!-- 第二行：唯一性 + 死锁 -->
  <g filter="url(#rough2)">
    <rect x="16" y="138" width="316" height="38" fill="#f4f0fa" stroke="#8866aa" stroke-width="1.8" rx="8"/>
    <text x="174" y="162" text-anchor="middle" font-size="10" fill="#5a3d73">非对角线前驱唯一 ⟹ 路径唯一 ⟹ 链长即最小步数</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="348" y="138" width="156" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="426" y="153" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">x ≥ 2y 且 x 为奇数</text>
    <text x="426" y="169" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">⟹ 无前驱，死锁 −1</text>
  </g>

  <!-- 示例 2 逆向走链 -->
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 逆向走链：从目标 (2,3) 撤销回起点 (0,1)</text>
  <g filter="url(#rough2)">
    <rect x="30" y="210" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="60" y="229" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">(2, 3)</text>
  </g>
  <path d="M 94 225 L 166 225" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="205" text-anchor="middle" font-size="9" fill="#2a5a2a" filter="url(#rough2)">y −= x</text>
  <g filter="url(#rough2)">
    <rect x="170" y="210" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="200" y="229" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">(2, 1)</text>
  </g>
  <path d="M 234 225 L 306 225" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="205" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">x ÷= 2</text>
  <g filter="url(#rough2)">
    <rect x="310" y="210" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="340" y="229" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">(1, 1)</text>
  </g>
  <path d="M 374 225 L 432 225" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="403" y="205" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">对角线分支</text>
  <g filter="url(#rough2)">
    <rect x="436" y="210" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="470" y="229" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">(0,1) ✓</text>
  </g>
  <text x="260" y="264" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">共 3 步：累加 1 + 翻倍 1 + 对角线 1（此处 d = s·2⁰，s = 1）</text>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="30" y="280" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="300" text-anchor="middle" font-size="10" fill="#8a6d1f">逆向坐标只减不增 ⟹ 一旦 x &lt; sx 或 y &lt; sy，立即 −1</text>
    <text x="260" y="318" text-anchor="middle" font-size="10" fill="#8a6d1f">链长 O(log)：翻倍每步折半 ≤ 30 步；累加 = 辗转相减，斐波那契级 ≈ 45 步</text>
    <text x="260" y="336" text-anchor="middle" font-size="10" fill="#8a6d1f">对角线分支：起点含 0 时判 d = s·2^k，O(1) 收官</text>
  </g>
</svg>
