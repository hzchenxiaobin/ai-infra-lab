<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针对齐算法流程：跳过 X，校验顺序与方向</text>

  <!-- Step 1: skip X -->
  <rect x="180" y="46" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i、j 各跳过当前的 X</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#888">直到指向 L/R 或到末尾</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: one reached end? -->
  <polygon points="280,110 380,150 280,190 180,150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#333">i 或 j</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333">到末尾?</text>

  <!-- Yes branch -->
  <path d="M 180 150 L 80 150 L 80 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="100" y="142" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="20" y="200" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">两者都到末尾?</text>
  <text x="80" y="236" text-anchor="middle" font-size="10" fill="#888">i==n 且 j==n</text>
  <text x="80" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">→ return true</text>
  <text x="80" y="262" text-anchor="middle" font-size="10" fill="#b85450">否则 → return false</text>

  <!-- No branch -->
  <path d="M 380 150 L 480 150 L 480 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="430" y="142" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: start[i] == end[j]? -->
  <polygon points="480,200 560,240 480,280 400,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="236" text-anchor="middle" font-size="11" fill="#333">start[i]</text>
  <text x="480" y="250" text-anchor="middle" font-size="11" fill="#333">== end[j]?</text>

  <path d="M 400 240 L 360 240" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="380" y="232" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="280" y="222" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="238" text-anchor="middle" font-size="10" fill="#333">顺序不同</text>
  <text x="320" y="252" text-anchor="middle" font-size="10" fill="#b85450">return false</text>

  <!-- Yes: check direction -->
  <path d="M 480 280 L 480 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="498" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: direction check -->
  <polygon points="480,300 580,345 480,390 380,345" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="335" text-anchor="middle" font-size="11" fill="#333">方向合法?</text>
  <text x="480" y="350" text-anchor="middle" font-size="10" fill="#888">L: j≤i, R: j≥i</text>

  <!-- No: return false -->
  <path d="M 580 345 L 580 395 L 500 395" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="588" y="372" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="380" y="398" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="414" text-anchor="middle" font-size="10" fill="#333">方向违规</text>
  <text x="440" y="428" text-anchor="middle" font-size="10" fill="#b85450">return false</text>

  <!-- Yes: advance pointers -->
  <path d="M 380 345 L 200 345 L 200 398" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="280" y="337" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="120" y="398" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++, j++</text>
  <text x="200" y="432" text-anchor="middle" font-size="10" fill="#888">继续对齐下一个 L/R</text>

  <!-- Loop back arrow -->
  <path d="M 200 398 L 200 370 L 100 370 L 100 68 L 180 68" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="220" font-size="10" fill="#888" transform="rotate(-90 110 220)">循环回顶部</text>

  <!-- Final return -->
  <rect x="40" y="460" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="478" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">循环正常结束（i≥n 且 j≥n）→ return true</text>
  <text x="280" y="494" text-anchor="middle" font-size="10" fill="#888">所有 L/R 配对通过校验</text>
</svg>
