<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">chk(x) 判定流程：三步贪心 + 连通性检查</text>
  <text x="260" y="37" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">外层在 [1, 2·max s] 上二分最大的可行 x</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="140" y="46" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="230" y="65" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">初始化并查集（comp = n）</text>
  </g>
  <path d="M 230 76 L 230 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① must 边 -->
  <g filter="url(#rough2)">
    <rect x="130" y="96" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="230" y="113" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">① 逐条加入 must=1 边</text>
    <text x="230" y="131" text-anchor="middle" font-size="9.5" fill="#8a3a36">s &lt; x 或彼此成环 → 立即失败</text>
  </g>
  <path d="M 330 118 L 388 118" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">失败</text>
  <g filter="url(#rough2)">
    <rect x="392" y="102" width="95" height="32" fill="#f7f7f7" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="440" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ false</text>
    <text x="440" y="148" text-anchor="middle" font-size="8.5" fill="#999">must 成环 ⟹ 全局 −1</text>
  </g>
  <path d="M 230 140 L 230 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="152" font-size="9" fill="#446688" font-weight="bold">全部成功</text>

  <!-- ② 免费边 -->
  <g filter="url(#rough2)">
    <rect x="130" y="160" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="230" y="181" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">② 免费加入全部 s ≥ x 的可选边</text>
  </g>
  <path d="M 230 194 L 230 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 付费边 -->
  <g filter="url(#rough2)">
    <rect x="130" y="214" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="230" y="232" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">③ 付费加入 s &lt; x ≤ 2s 的可选边</text>
    <text x="230" y="250" text-anchor="middle" font-size="9.5" fill="#8a6d1f">两端未连通且 used &lt; k 才加，used++</text>
  </g>
  <path d="M 230 260 L 230 276" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <g filter="url(#rough2)">
    <polygon points="230,278 300,308 230,338 160,308" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="230" y="312" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">连通块数 = 1 ?</text>
  </g>
  <path d="M 300 308 L 388 308" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="300" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="392" y="292" width="95" height="32" fill="#f7f7f7" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="440" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ false</text>
  </g>
  <path d="M 230 338 L 230 354" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="350" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- true -->
  <g filter="url(#rough2)">
    <rect x="140" y="358" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="230" y="377" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">✓ true</text>
  </g>

  <!-- 外层二分说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="396" width="420" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="414" text-anchor="middle" font-size="10" fill="#8a6d1f">外层二分：chk(1) = false ⟹ 返回 −1；否则答案 = 最大可行 x（树中最小有效强度）</text>
  </g>
</svg>
