<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">划分法二分流程（在较短数组 nums1 上二分划分位置 i）</text>

  <!-- Start node -->
  <ellipse cx="210" cy="58" rx="190" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="54" text-anchor="middle" font-size="11" fill="#333">开始: 保证 nums1 较短; half = (m+n+1)//2</text>
  <text x="210" y="70" text-anchor="middle" font-size="11" fill="#333">lo = 0, hi = m</text>

  <!-- arrow down -->
  <path d="M 210 82 L 210 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="210,102 318,148 210,194 102,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="144" text-anchor="middle" font-size="12" fill="#333">lo ≤ hi ?</text>
  <text x="210" y="161" text-anchor="middle" font-size="11" fill="#666">继续二分</text>

  <!-- No branch -> compute node (right then down) -->
  <path d="M 318 148 L 560 148 L 560 300 L 492 300" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="140" text-anchor="middle" font-size="11" fill="#b85450">否（退出）</text>

  <!-- Yes branch down -->
  <path d="M 210 194 L 210 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="208" font-size="11" fill="#82b366">是</text>

  <!-- i,j + boundaries rect -->
  <rect x="66" y="216" width="288" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="234" text-anchor="middle" font-size="11" fill="#333">i = (lo+hi)//2 ,  j = half − i</text>
  <text x="210" y="250" text-anchor="middle" font-size="11" fill="#555">L1=nums1[i−1]  R1=nums1[i]  L2=nums2[j−1]  R2=nums2[j]  (边界用 ±∞)</text>

  <!-- arrow down -->
  <path d="M 210 260 L 210 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: valid partition? -->
  <polygon points="210,282 322,330 210,378 98,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="326" text-anchor="middle" font-size="12" fill="#333">L1 ≤ R2 且</text>
  <text x="210" y="344" text-anchor="middle" font-size="12" fill="#333">L2 ≤ R1 ?</text>

  <!-- Yes (valid) -> compute node right -->
  <path d="M 322 330 L 410 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="322" text-anchor="middle" font-size="11" fill="#82b366">是(合法)</text>

  <!-- No -> down -->
  <path d="M 210 378 L 210 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="392" font-size="11" fill="#b85450">否</text>

  <!-- Decision: L1 > R2 ? -->
  <polygon points="210,400 298,438 210,476 122,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="442" text-anchor="middle" font-size="12" fill="#333">L1 &gt; R2 ?</text>

  <!-- Yes (left): hi = i - 1 -->
  <path d="M 122 438 L 70 438" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="430" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="418" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="436" text-anchor="middle" font-size="11" fill="#333">hi = i − 1</text>
  <text x="60" y="452" text-anchor="middle" font-size="10" fill="#b85450">nums1 取多了</text>

  <!-- No (right): lo = i + 1 -->
  <path d="M 298 438 L 340 438" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="344" y="418" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="436" text-anchor="middle" font-size="11" fill="#333">lo = i + 1</text>
  <text x="390" y="452" text-anchor="middle" font-size="10" fill="#b85450">nums1 取少了</text>

  <!-- loop back arrows (dashed) up to lo<=hi decision -->
  <path d="M 60 418 L 60 148 L 102 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 418 L 390 148 L 318 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute median node (right) -->
  <rect x="410" y="288" width="156" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算中位数</text>
  <line x1="422" y1="316" x2="554" y2="316" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="332" font-size="11" fill="#555">left_max = max(L1, L2)</text>
  <text x="422" y="350" font-size="11" fill="#555">奇 → left_max</text>
  <text x="422" y="368" font-size="11" fill="#555">偶 → (max+min)/2</text>

  <!-- final return arrow -->
  <path d="M 488 380 L 488 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="488" cy="432" rx="58" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="436" text-anchor="middle" font-size="12" fill="#333">返回中位数</text>

  <!-- summary note -->
  <rect x="60" y="500" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="518" text-anchor="middle" font-size="11" fill="#4a7a3a">关键：L1&gt;R2 关于 i 单调 ⇒ 二段性；每次 O(1) 判定，共 O(log min(m,n)) 次</text>
</svg>
