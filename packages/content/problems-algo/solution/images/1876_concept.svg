<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：长度为 3 的定长窗口，三字符两两不同即「好子串」</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "xyzzaz" → 4 个窗口中仅 "xyz" 合格 → 答案 1</text>

  <!-- Source string -->
  <text x="44" y="90" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">源串</text>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="172" y="66">0</text>
    <text x="216" y="66">1</text>
    <text x="260" y="66">2</text>
    <text x="304" y="66">3</text>
    <text x="348" y="66">4</text>
    <text x="392" y="66">5</text>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="150" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="93" fill="#446688" font-weight="bold">x</text>
    <rect x="194" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="93" fill="#446688" font-weight="bold">y</text>
    <rect x="238" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="93" fill="#446688" font-weight="bold">z</text>
    <rect x="282" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="93" fill="#446688" font-weight="bold">z</text>
    <rect x="326" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="348" y="93" fill="#446688" font-weight="bold">a</text>
    <rect x="370" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="392" y="93" fill="#446688" font-weight="bold">z</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="135" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">四个定长为 3 的窗口</text>

  <!-- Window i=0: xyz -> good -->
  <text x="44" y="170" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=0</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="110" y="152" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="132" y="175" fill="#4a7a3a" font-weight="bold">x</text>
    <rect x="154" y="152" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="176" y="175" fill="#4a7a3a" font-weight="bold">y</text>
    <rect x="198" y="152" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="220" y="175" fill="#4a7a3a" font-weight="bold">z</text>
  </g>
  <text x="290" y="175" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 三字符两两不同</text>

  <!-- Window i=1: yzz -> bad (z dup) -->
  <text x="44" y="220" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=1</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="110" y="202" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="132" y="225" fill="#446688" font-weight="bold">y</text>
    <rect x="154" y="202" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="176" y="225" fill="#b85450" font-weight="bold">z</text>
    <rect x="198" y="202" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="220" y="225" fill="#b85450" font-weight="bold">z</text>
  </g>
  <text x="290" y="225" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ z 重复（s[i+1]=s[i+2]）</text>

  <!-- Window i=2: zza -> bad (z dup) -->
  <text x="44" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=2</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="110" y="252" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="132" y="275" fill="#b85450" font-weight="bold">z</text>
    <rect x="154" y="252" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="176" y="275" fill="#b85450" font-weight="bold">z</text>
    <rect x="198" y="252" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="275" fill="#446688" font-weight="bold">a</text>
  </g>
  <text x="290" y="275" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ z 重复（s[i]=s[i+1]）</text>

  <!-- Window i=3: zaz -> bad (z dup) -->
  <text x="44" y="320" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=3</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="110" y="302" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="132" y="325" fill="#b85450" font-weight="bold">z</text>
    <rect x="154" y="302" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="325" fill="#446688" font-weight="bold">a</text>
    <rect x="198" y="302" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="220" y="325" fill="#b85450" font-weight="bold">z</text>
  </g>
  <text x="290" y="325" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ z 重复（s[i]=s[i+2]）</text>

  <!-- Result -->
  <rect x="120" y="356" width="360" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="383" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">好子串数 = 1（仅 "xyz"）</text>

  <!-- Note -->
  <rect x="50" y="412" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="435" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">窗口大小固定为 3 → 只需 3 次两两比较，无需哈希表</text>
</svg>
