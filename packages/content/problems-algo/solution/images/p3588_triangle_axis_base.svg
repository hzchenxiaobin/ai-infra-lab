<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGr" markerWidth="8" markerHeight="8" refX="0.5" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：底与高独立取最值</text>

  <text x="95" y="46" font-size="10" fill="#777" filter="url(#rough2)">示例：列 x=2 上有三个点</text>
  <text x="95" y="60" font-size="10" fill="#777" filter="url(#rough2)">全局 Xmin=1，Xmax=8</text>

  <!-- 坐标轴 -->
  <path d="M80,320 L80,64" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M80,320 L484,320" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="90" y="58" font-size="11" fill="#446688" filter="url(#rough2)">y</text>
  <text x="490" y="324" font-size="11" fill="#446688" filter="url(#rough2)">x</text>

  <!-- 刻度 -->
  <path d="M75,278 L85,278" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="282" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <path d="M75,110 L85,110" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="114" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">5</text>
  <path d="M120,317 L120,323" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="334" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <path d="M160,317 L160,323" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="334" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">2</text>
  <path d="M400,317 L400,323" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="334" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">8</text>

  <!-- 列 x=2 虚线 -->
  <path d="M160,102 L160,292" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6" filter="url(#rough2)"/>

  <!-- 三角形（先画填充，再画点） -->
  <polygon points="160,278 160,110 400,152" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>
  <polygon points="160,278 160,110 400,152" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- 底边重描（红） -->
  <path d="M160,110 L160,278" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 灰色散点 -->
  <circle cx="240" cy="278" r="4" fill="#ccc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="200" cy="152" r="4" fill="#ccc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="110" r="4" fill="#ccc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="320" cy="236" r="4" fill="#ccc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 关键点 -->
  <circle cx="160" cy="194" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="198" font-size="9" fill="#888" filter="url(#rough2)">(2,3)</text>

  <circle cx="160" cy="278" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,1)</text>

  <circle cx="160" cy="110" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,5)</text>

  <circle cx="120" cy="236" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="240" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">(1,2)</text>
  <text x="112" y="254" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">Xmin=1</text>

  <circle cx="400" cy="152" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="410" y="146" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">(8,4)</text>
  <text x="410" y="162" font-size="9.5" fill="#d6a040" filter="url(#rough2)">第三点 ✓</text>

  <!-- 底边标注 -->
  <text x="150" y="172" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">底 base</text>
  <text x="150" y="186" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">= 5−1 = 4</text>
  <text x="150" y="212" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">列内 y 极值</text>
  <text x="150" y="224" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">两点连成</text>

  <!-- 高标注 -->
  <path d="M160,328 L160,341" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M400,328 L400,341" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M162,344 L253,344" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M398,344 L307,344" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">高 h = 8−2 = 6</text>

  <!-- 底部结论框 -->
  <rect x="30" y="366" width="460" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2A = 底 × 高 = 4 × 6 = 24 —— 两倍面积天然是整数，无 ½ 无浮点</text>
</svg>
