<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 回溯三大剪枝</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">jobs 降序排列后逐个分配，越早碰壁越早回溯</text>

  <!-- ===== Pruning 1: Sort descending ===== -->
  <rect x="20" y="58" width="500" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">剪枝 ① 降序排列：大任务先分配</text>

  <text x="40" y="98" font-size="10" fill="#666">原始: [1, 2, 4, 7, 8]</text>
  <g font-size="10">
    <rect x="40" y="104" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="52" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="64" y="104" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="118" text-anchor="middle" fill="#333">2</text>
    <rect x="88" y="104" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="118" text-anchor="middle" fill="#333">4</text>
    <rect x="112" y="104" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="124" y="118" text-anchor="middle" fill="#333">7</text>
    <rect x="136" y="104" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="148" y="118" text-anchor="middle" fill="#333">8</text>
  </g>
  <path d="M 175 114 L 205 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="9" fill="#888">排序</text>

  <text x="230" y="98" font-size="10" fill="#b85450" font-weight="bold">降序: [8, 7, 4, 2, 1]</text>
  <g font-size="10">
    <rect x="230" y="104" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="242" y="118" text-anchor="middle" fill="#333">8</text>
    <rect x="254" y="104" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="266" y="118" text-anchor="middle" fill="#333">7</text>
    <rect x="278" y="104" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="290" y="118" text-anchor="middle" fill="#333">4</text>
    <rect x="302" y="104" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="314" y="118" text-anchor="middle" fill="#333">2</text>
    <rect x="326" y="104" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="338" y="118" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="400" y="112" font-size="9" fill="#888">大任务先放，</text>
  <text x="400" y="124" font-size="9" fill="#888">更快触发超限剪枝</text>

  <!-- ===== Pruning 2: Symmetry ===== -->
  <rect x="20" y="174" width="500" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="30" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">剪枝 ② 对称剪枝：相同负载的工人只试一个</text>

  <g font-size="10">
    <text x="40" y="214" font-size="9" fill="#666">W1 负载=5</text>
    <rect x="40" y="220" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="65" y="236" text-anchor="middle" fill="#333">5</text>

    <text x="110" y="214" font-size="9" fill="#666">W2 负载=5</text>
    <rect x="110" y="220" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="236" text-anchor="middle" fill="#333">5</text>

    <text x="180" y="236" font-size="10" fill="#666">← 相同！分给 W1 或 W2 等价</text>
  </g>

  <text x="40" y="258" font-size="10" fill="#4a7a3a">用 seen 集合记录已试过的负载值，重复的直接 skip</text>

  <!-- ===== Pruning 3: Empty worker break ===== -->
  <rect x="20" y="284" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="30" y="302" font-size="11" fill="#d6a040" font-weight="bold">剪枝 ③ 空工人剪枝：空工人失败则后续空工人也失败</text>

  <g font-size="10">
    <text x="40" y="324" font-size="9" fill="#666">W1=0 (空)</text>
    <rect x="40" y="330" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="65" y="346" text-anchor="middle" fill="#333">0</text>

    <path d="M 100 342 L 130 342" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
    <text x="115" y="336" text-anchor="middle" font-size="9" fill="#b85450">失败</text>

    <text x="150" y="324" font-size="9" fill="#666">W2=0 (空)</text>
    <rect x="150" y="330" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="175" y="346" text-anchor="middle" fill="#b85450" text-decoration="line-through">0</text>

    <text x="220" y="336" font-size="9" fill="#888">× 跳过！</text>
    <text x="220" y="350" font-size="9" fill="#888">break</text>
  </g>
  <text x="40" y="378" font-size="10" fill="#d6a040">如果 job 放到空工人后回溯失败 → break，不再试其他空工人</text>
  <text x="40" y="394" font-size="9" fill="#888">（空工人之间完全对称，第一个失败其余也必失败）</text>

  <!-- Bottom summary -->
  <rect x="20" y="418" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="270" y="438" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">三剪枝合力：k^n 暴力 → 实际搜索树极小，n≤12 秒过</text>
</svg>
