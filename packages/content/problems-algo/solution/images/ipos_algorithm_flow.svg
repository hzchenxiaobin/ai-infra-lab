<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建 Trie → 逐起点扫描 → 收集命中</text>

  <!-- Step 1 -->
  <rect x="60" y="46" width="420" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="75" r="14" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="79" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="110" y="68" font-size="12" fill="#333" font-weight="bold">把所有 words 插入 Trie</text>
  <text x="110" y="84" font-size="10.5" fill="#666">insert(word): 逐字符走/建子节点，末尾 is_end = true</text>
  <text x="110" y="98" font-size="10" fill="#888">一次构建 O(Σ|words[i]|)</text>
  <line x1="270" y1="106" x2="270" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="122" width="420" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="151" r="14" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="155" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="110" y="144" font-size="12" fill="#333" font-weight="bold">遍历 text 每个起点 i = 0 … n−1</text>
  <text x="110" y="160" font-size="10.5" fill="#666">node = root, j = i</text>
  <text x="110" y="174" font-size="10" fill="#888">外层循环保证 i 升序 → 结果按起始索引有序</text>
  <line x1="270" y1="182" x2="270" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="198" width="420" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="227" r="14" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="231" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="110" y="220" font-size="12" fill="#333" font-weight="bold">沿 Trie 走 text[i], text[i+1], …</text>
  <text x="110" y="236" font-size="10.5" fill="#666">while j &lt; n and text[j] in node.children:</text>
  <text x="110" y="250" font-size="10.5" fill="#666">　　node = node[text[j]]</text>
  <text x="110" y="264" font-size="10.5" fill="#b85450" font-weight="bold">　　if node.is_end: ans.append([i, j])　← 边走边记</text>
  <line x1="270" y1="278" x2="270" y2="292" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="60" y="294" width="420" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="323" r="14" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="327" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="110" y="316" font-size="12" fill="#333" font-weight="bold">返回 ans</text>
  <text x="110" y="332" font-size="10.5" fill="#666">j 在内层循环中递增 → 同 i 内 j 升序</text>
  <text x="110" y="346" font-size="10" fill="#b85450">天然按 (i, j) 升序，无需排序</text>
  <line x1="270" y1="354" x2="270" y2="368" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="120" y="370" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="393" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回所有索引对 [[i, j], …]</text>

  <!-- Note -->
  <rect x="60" y="416" width="420" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="430" text-anchor="middle" font-size="10" fill="#444">Trie 深度 ≤ max|words[i]|，每个起点最多走 L 步</text>
</svg>
