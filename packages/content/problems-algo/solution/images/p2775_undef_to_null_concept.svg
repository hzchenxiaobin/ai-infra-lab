<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：沿 JSON 文法递归，遇 undefined 即替换为 null，其余结构原样保留</text>

  <!-- 顶部输入 -->
  <rect x="240" y="44" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">obj (对象 / 数组)</text>

  <!-- 三条分派线 -->
  <path d="M 272 78 L 110 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 78 L 280 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 78 L 510 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支1: 原始值/null（递归基） -->
  <rect x="40" y="114" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原始值 / null（递归基）</text>
  <rect x="44" y="158" width="132" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">undefined → null</text>
  <text x="110" y="191" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">null/原始值 原样返回</text>

  <!-- 分支2: 数组 -->
  <rect x="200" y="114" width="160" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Array.isArray</text>
  <rect x="204" y="158" width="152" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">逐元素递归</text>
  <text x="280" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">res[i] = f(obj[i])</text>

  <!-- 分支3: 对象 -->
  <rect x="440" y="114" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">普通对象</text>
  <rect x="444" y="158" width="132" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="176" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">逐值递归</text>
  <text x="510" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">res[k] = f(v)</text>

  <!-- 递归回环箭头 -->
  <path d="M 280 200 C 280 244, 300 256, 300 44" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="188" y="252" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">递归</text>
  <path d="M 510 200 C 510 244, 320 262, 312 44" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="540" y="252" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">递归</text>

  <!-- 示例变换区 -->
  <text x="310" y="278" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)" font-weight="bold">示例：沿结构递归，undefined 叶子替换为 null</text>

  <!-- 输入 -->
  <rect x="40" y="294" width="540" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="316" font-size="11" fill="#d6a040" filter="url(#rough2)" font-weight="bold">输入</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{"a": undefined, "b": ["a", undefined]}</text>

  <path d="M 310 330 L 310 354" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="346" font-size="9" fill="#888" filter="url(#rough2)">递归替换</text>

  <!-- 输出 -->
  <rect x="40" y="358" width="540" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="380" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">输出</text>
  <text x="310" y="380" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{"a": null, "b": ["a", null]}</text>

  <!-- 提示框 -->
  <rect x="40" y="404" width="540" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="424" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">💡 undefined 可出现在「对象值位」与「数组元素位」</text>
  <text x="56" y="444" font-size="11" fill="#555" filter="url(#rough2)">两处都由递归基 obj===undefined → null 统一收口；null 与原始值走兜底分支原样返回。</text>
</svg>
