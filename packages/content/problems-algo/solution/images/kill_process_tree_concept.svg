<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：pid/ppid 描述一棵进程树，杀死 = 删子树</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">ppid[i] 是 pid[i] 的父节点 → 建邻接表 → 从 kill 起遍历整棵子树</text>

  <!-- ===== Top: two arrays ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">输入数组</text>

  <text x="40" y="94" font-size="10" fill="#777">pid</text>
  <rect x="70" y="80" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="110" y="80" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="98" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="150" y="80" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="190" y="80" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="98" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="40" y="126" font-size="10" fill="#777">ppid</text>
  <rect x="70" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="130" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="110" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="150" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="190" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="130" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- arrow from arrays to tree -->
  <path d="M 130 144 L 130 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="160" font-size="9.5" fill="#666">建邻接表 children</text>

  <!-- ===== Middle: tree ===== -->
  <text x="30" y="186" font-size="11" fill="#446688" font-weight="bold">进程树（forest）</text>
  <g font-size="12">
    <!-- root 3 -->
    <circle cx="130" cy="210" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="215" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <!-- 3's children: 1, 5 -->
    <circle cx="80" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="267" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="180" cy="262" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="180" y="267" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="118" y1="222" x2="92" y2="250" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="142" y1="222" x2="168" y2="250" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- 5's child: 10 -->
    <circle cx="180" cy="316" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="180" y="321" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <line x1="180" y1="278" x2="180" y2="300" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

    <!-- kill label -->
    <path d="M 200 262 L 250 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="258" y="258" font-size="11" fill="#b85450" font-weight="bold">kill = 5</text>
    <text x="258" y="272" font-size="9.5" fill="#888">起始杀掉的 PID</text>

    <!-- subtree shade box -->
    <rect x="155" y="240" width="55" height="98" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
    <text x="160" y="234" font-size="9.5" fill="#b85450" font-weight="bold">待杀子树</text>
  </g>

  <!-- ===== Right: explanation ===== -->
  <text x="320" y="186" font-size="11" fill="#444" font-weight="bold">思路三步</text>

  <rect x="320" y="196" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="214" font-size="11" fill="#446688" font-weight="bold">① 建邻接表</text>
  <text x="330" y="230" font-size="9.5" fill="#555">children[ppid[i]].push(pid[i])</text>

  <rect x="320" y="248" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">② 从 kill 遍历子树</text>
  <text x="330" y="282" font-size="9.5" fill="#555">DFS 栈 / BFS 队列皆可</text>

  <rect x="320" y="300" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="318" font-size="11" fill="#d6a040" font-weight="bold">③ 收集访问到的 PID</text>
  <text x="330" y="334" font-size="9.5" fill="#555">即 kill 及其全部后代</text>

  <!-- bottom note -->
  <rect x="30" y="352" width="490" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="367" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">结果 = {5, 10}（kill 自己 + 所有直接/间接子进程）</text>
</svg>
