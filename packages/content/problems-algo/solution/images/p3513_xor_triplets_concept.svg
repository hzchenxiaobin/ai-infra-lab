<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">n ≥ 3：位数卡上界 2^(b+1)，三段构造拼满整个区间</text>

  <!-- nums 数组（[1,5] 的排列） -->
  <text x="82" y="90" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums</text>

  <rect x="92" y="64" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="114" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>

  <rect x="140" y="64" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#1</text>
  <text x="162" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>

  <rect x="188" y="64" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#2</text>
  <text x="210" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">1</text>

  <rect x="236" y="64" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#3</text>
  <text x="258" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">4</text>

  <rect x="284" y="64" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="79" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#4</text>
  <text x="306" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <text x="210" y="126" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">[1, n] 的排列 ⇒ 值集合 = {1, …, n}，答案只依赖 n</text>

  <!-- 参数信息框 -->
  <rect x="348" y="56" width="158" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 5，b = ⌊log₂n⌋ = 2</text>
  <text x="427" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">P = 2^b = 4 ≤ 5 &lt; 8</text>

  <!-- 层标注 -->
  <text x="85" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">{0} 层</text>
  <text x="235" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">单元素层 [1, n]</text>
  <text x="410" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">空洞段 (n, 2^(b+1))</text>

  <!-- 每个点的构造公式 -->
  <text x="85" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1⊕2⊕3</text>
  <text x="235" y="180" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(v, v, v) → v</text>
  <text x="385" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">4⊕1⊕3</text>
  <text x="435" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">4⊕1⊕2</text>

  <!-- 数轴 -->
  <path d="M 56 210 L 472 210" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="85" cy="210" rx="11.5" ry="11.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="85" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">0</text>

  <ellipse cx="135" cy="210" rx="11.5" ry="11.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <ellipse cx="185" cy="210" rx="11.5" ry="11.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>

  <ellipse cx="235" cy="210" rx="11.5" ry="11.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>

  <ellipse cx="285" cy="210" rx="11.5" ry="11.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <ellipse cx="335" cy="210" rx="11.5" ry="11.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>

  <ellipse cx="385" cy="210" rx="11.5" ry="11.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">6</text>

  <ellipse cx="435" cy="210" rx="11.5" ry="11.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">7</text>

  <text x="470" y="234" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">值域上界 2^(b+1) = 8</text>

  <!-- 注释 -->
  <text x="260" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所有元素 ≤ n &lt; 2^(b+1) = 8，异或按位独立不进位 ⇒ 可达值 ⊆ [0, 7]</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三段拼接：{0} ∪ [1, n] ∪ (n, 2^(b+1)) = [0, 2^(b+1))，一个不漏</text>

  <!-- 结论 -->
  <rect x="95" y="280" width="330" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">answer = 2^(b+1) = 大于 n 的最小 2 的幂</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">本题 n = 5 → 2³ = 8；n = 3 → 4，n = 8 → 16</text>
</svg>
