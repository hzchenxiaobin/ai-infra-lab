<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：路径异或前缀 + 子树集合的小并大合并</text>

  <!-- 左：演示树 -->
  <text x="30" y="54" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">演示树：vals = [1,1,2,3]</text>
  <text x="30" y="70" font-size="10" fill="#777" filter="url(#rough2)">par = [-1,0,0,1]</text>

  <!-- 树边 -->
  <path d="M85,122 L54,163" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M98,114 L150,167" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M48,205 L48,250" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 节点 0 -->
  <circle cx="85" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="96" font-size="10.5" fill="#446688" filter="url(#rough2)">xor = 1</text>

  <!-- 节点 1 -->
  <circle cx="48" cy="185" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="74" y="181" font-size="10.5" fill="#446688" filter="url(#rough2)">xor = 0</text>

  <!-- 节点 2 -->
  <circle cx="160" cy="185" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="186" y="181" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">xor = 3</text>

  <!-- 节点 3 -->
  <circle cx="48" cy="272" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="74" y="268" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">xor = 3</text>

  <text x="30" y="316" font-size="10" fill="#b85450" filter="url(#rough2)">节点 2、3 的 xor 都是 3 → 合并时去重</text>

  <!-- 右：集合自底上演化 -->
  <text x="265" y="54" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">集合自底上演化</text>

  <!-- 叶子集合 -->
  <rect x="265" y="66" width="115" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">S(3) = {3}</text>
  <text x="322" y="102" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">叶子新建</text>

  <rect x="390" y="66" width="115" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">S(2) = {3}</text>
  <text x="447" y="102" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">叶子新建</text>

  <path d="M322,110 L322,128" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M447,110 L447,218" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 节点 1 的集合 -->
  <rect x="265" y="130" width="115" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">S(1) = {0,3}</text>
  <text x="322" y="170" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">收养 S(3)</text>
  <text x="322" y="181" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">再插入 xor=0</text>

  <path d="M322,186 L322,218" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 节点 0：小并大 -->
  <rect x="265" y="222" width="240" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">节点 0 合并子集合（小并大）</text>
  <text x="385" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">小的 {3} 插入大的 {0,3}：3 已存在 → 去重</text>
  <text x="385" y="277" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">最后插入 xor[0] = 1</text>

  <path d="M385,286 L385,302" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="265" y="304" width="240" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S(0) = {0, 1, 3} ✓</text>

  <!-- 底部洞察 -->
  <rect x="30" y="356" width="460" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">小并大：值每被搬运一次所在集合至少翻倍 ⇒ 每个值至多搬 O(log n) 次</text>
  <text x="260" y="395" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">xor[u] = xor[par[u]] ⊕ vals[u]：路径异或是树上前缀，从根一趟递推</text>
  <text x="260" y="412" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">容器要求：插入 + 去重 + 第 k 小均 O(log n)（PBDS tree / SortedSet）</text>
</svg>
