<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "A man, a plan, a canal: Panama"</text>

  <!-- Step 1 -->
  <text x="36" y="64" font-size="11" fill="#888" font-weight="bold">步骤 1</text>
  <!-- A -->
  <rect x="70" y="48" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <!-- skipped cells collapsed -->
  <text x="112" y="66" font-size="12" fill="#999">…</text>
  <!-- last a -->
  <rect x="540" y="48" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="553" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <!-- pointers -->
  <path d="M 83 36 L 83 44" stroke="#446688" stroke-width="2" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="83" y="30" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <path d="M 553 92 L 553 84" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="553" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">right</text>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#444">tolower('A') == tolower('a') → 'a' == 'a' ✓ 配对</text>

  <!-- Step 2 -->
  <text x="36" y="148" font-size="11" fill="#888" font-weight="bold">步骤 2</text>
  <!-- m -->
  <rect x="100" y="132" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m</text>
  <text x="142" y="150" font-size="12" fill="#999">…</text>
  <!-- m (right side) -->
  <rect x="510" y="132" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="523" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m</text>
  <path d="M 113 120 L 113 128" stroke="#446688" stroke-width="2" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="113" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <path d="M 523 176 L 523 168" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="523" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">right</text>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#444">left 跳过空格停在 'm'；'m' == 'm' ✓ 配对</text>

  <!-- Step 3 -->
  <text x="36" y="232" font-size="11" fill="#888" font-weight="bold">步骤 3</text>
  <!-- a -->
  <rect x="130" y="216" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="172" y="234" font-size="12" fill="#999">…</text>
  <rect x="480" y="216" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="493" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <path d="M 143 204 L 143 212" stroke="#446688" stroke-width="2" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="143" y="198" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <path d="M 493 260 L 493 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="493" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">right</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#444">'a' == 'a' ✓ 配对（中间空格/逗号/冒号均被跳过）</text>

  <!-- Meet -->
  <text x="36" y="320" font-size="11" fill="#888" font-weight="bold">相遇</text>
  <rect x="280" y="300" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">left ≥ right</text>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#444">全程配对，无任何不匹配 → 返回 true</text>

  <!-- footnote: compare to race a car -->
  <rect x="40" y="370" width="560" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对照 "race a car"：配对到中段 'e' vs 'c' → 'e' ≠ 'c' ✗ 立即返回 false</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#888">双指针可在首个不配对处提前返回，无需扫完整串</text>
</svg>
