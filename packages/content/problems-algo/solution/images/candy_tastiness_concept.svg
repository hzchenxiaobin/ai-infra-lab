<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="brcap" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="none" stroke="#888" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后选 k=3 颗，最大化「相邻最小差」= 甜蜜度</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">price 排序 = [1, 2, 5, 8, 13, 21]</text>

  <!-- ============ Row 1: bad selection ============ -->
  <text x="40" y="92" font-size="12" fill="#b85450" font-weight="bold">选 [1, 2, 5]</text>
  <!-- number line -->
  <line x1="60" y1="120" x2="490" y2="120" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- all 6 positions: 1->80, 2->100, 5->160, 8->220, 13->320, 21->460 -->
  <!-- unselected small gray dots -->
  <circle cx="220" cy="120" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="320" cy="120" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="460" cy="120" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <!-- selected orange dots -->
  <circle cx="80" cy="120" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="100" cy="120" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="160" cy="120" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <text x="100" y="108" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="160" y="108" text-anchor="middle" font-size="10" fill="#b85450">5</text>
  <!-- gap brackets above -->
  <path d="M 80 96 L 80 88 L 100 88 L 100 96" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="10" fill="#b85450">差1</text>
  <path d="M 100 96 L 100 88 L 160 88 L 160 96" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="10" fill="#b85450">差3</text>
  <!-- result -->
  <text x="510" y="124" font-size="11" fill="#b85450" font-weight="bold">min=1 ✗</text>

  <!-- ============ Row 2: optimal selection ============ -->
  <text x="40" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">选 [5, 13, 21]</text>
  <line x1="60" y1="236" x2="490" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- unselected -->
  <circle cx="80" cy="236" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="100" cy="236" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="220" cy="236" r="3.5" fill="#ccc" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <!-- selected green dots -->
  <circle cx="160" cy="236" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="320" cy="236" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="460" cy="236" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
  <text x="320" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">13</text>
  <text x="460" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">21</text>
  <!-- gap brackets -->
  <path d="M 160 212 L 160 204 L 320 204 L 320 212" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">差 8</text>
  <path d="M 320 212 L 320 204 L 460 204 L 460 212" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">差 8</text>
  <text x="510" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">min=8 ✓</text>

  <!-- arrow between rows -->
  <path d="M 280 140 L 280 188" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="170" font-size="10" fill="#888">让最小差尽量大</text>

  <!-- ============ bottom key idea ============ -->
  <rect x="40" y="290" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心观察</text>
  <text x="60" y="336" font-size="11" fill="#444">① 排序后，任意两颗差 = 若干相邻差之和 ≥ 最小相邻差</text>
  <text x="60" y="354" font-size="11" fill="#444">   ⇒ 甜蜜度 = 选出 k 颗中「相邻最小差」，顺序无关，先排序</text>
  <text x="60" y="372" font-size="11" fill="#446688" font-weight="bold">② 设 f(d)=能否选 k 颗使相邻差都 ≥ d，d 越小越宽松 ⇒ 单调 ⇒ 二分答案</text>
</svg>
