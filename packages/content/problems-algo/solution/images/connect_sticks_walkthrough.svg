<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：sticks = [2, 4, 3]</text>

  <!-- Step 0: init -->
  <text x="40" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始堆（小顶堆）：{2, 3, 4}</text>
  <rect x="40" y="66" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="68" y="89" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="104" y="66" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="168" y="66" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="240" y="88" font-size="10.5" fill="#888" filter="url(#rough2)">total = 0</text>

  <path d="M 96 106 Q 96 124 96 142" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="120" y="128" font-size="10.5" fill="#b85450" filter="url(#rough2)">取 2 + 3</text>

  <!-- Step 1 -->
  <text x="40" y="156" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 1 次合并：2 + 3 = 5</text>
  <rect x="40" y="164" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="104" y="164" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="132" y="187" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="180" y="186" font-size="10.5" fill="#b85450" filter="url(#rough2)">total = 5</text>
  <text x="240" y="186" font-size="10" fill="#888" filter="url(#rough2)">堆：{4, 5}</text>

  <path d="M 132 204 Q 132 222 132 240" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="156" y="226" font-size="10.5" fill="#b85450" filter="url(#rough2)">取 4 + 5</text>

  <!-- Step 2 -->
  <text x="40" y="254" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 次合并：4 + 5 = 9</text>
  <rect x="40" y="262" width="80" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="288" text-anchor="middle" font-size="16" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="140" y="284" font-size="10.5" fill="#b85450" filter="url(#rough2)">total = 5 + 9 = 14</text>
  <text x="280" y="284" font-size="10" fill="#888" filter="url(#rough2)">堆：{9}，仅剩 1 根 → 结束</text>

  <!-- result box -->
  <rect x="40" y="316" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 14 ✓</text>

  <!-- Huffman tree visualization -->
  <text x="280" y="392" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对应的哈夫曼合并树（成本 = 加权路径长度）</text>

  <!-- root: 9 -->
  <rect x="252" y="406" width="56" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="429" text-anchor="middle" font-size="14" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- edges -->
  <path d="M 266 442 L 196 478" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 294 442 L 364 478" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- left child: 4 (leaf) -->
  <rect x="168" y="478" width="56" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="501" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="196" y="528" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">深度 1 · 累加 1 次</text>

  <!-- right child: 5 (internal) -->
  <rect x="336" y="478" width="56" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="501" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- edges to 5's children -->
  <path d="M 350 514 L 308 544" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 378 514 L 420 544" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="280" y="544" width="50" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="565" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="400" y="544" width="50" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="565" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="305" y="588" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">深度 2</text>
  <text x="425" y="588" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">深度 2</text>

  <!-- cost annotation on right -->
  <rect x="460" y="478" width="90" height="98" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="505" y="498" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">加权路径和</text>
  <text x="470" y="518" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">4×1 + 2×2</text>
  <text x="470" y="534" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">    + 3×2</text>
  <text x="470" y="552" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">= 4+4+6</text>
  <text x="470" y="568" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 14 ✓</text>
</svg>
