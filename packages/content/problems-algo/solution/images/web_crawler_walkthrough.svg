<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：BFS 逐层发现 URL（带剪枝与去重）</text>

  <!-- ===== Root: ① startUrl ===== -->
  <rect x="195" y="40" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">yahoo.com/news</text>
  <circle cx="205" cy="40" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="205" y="44" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>

  <!-- arrows root -> level 1 -->
  <path d="M 245 72 Q 180 86 72 102" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 265 72 Q 240 86 202 102" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 295 72 Q 320 86 332 102" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 315 72 Q 390 86 462 102" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Level 1 ===== -->
  <!-- ② news/topics (accepted) -->
  <rect x="14" y="106" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="124" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">yahoo.com/</text>
  <text x="72" y="138" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">news/topics</text>
  <circle cx="24" cy="106" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="24" y="110" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>

  <!-- ③ finance (accepted) -->
  <rect x="144" y="106" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="124" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">yahoo.com/</text>
  <text x="202" y="138" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">finance</text>
  <circle cx="154" cy="106" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="154" y="110" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>

  <!-- ✗ https (filtered) -->
  <rect x="274" y="106" width="116" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="124" text-anchor="middle" font-size="9" fill="#b85450" text-decoration="line-through">https://yahoo.com</text>
  <text x="332" y="138" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 协议不同</text>

  <!-- ✗ google (filtered) -->
  <rect x="404" y="106" width="116" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="462" y="124" text-anchor="middle" font-size="9" fill="#b85450" text-decoration="line-through">google.com/news</text>
  <text x="462" y="138" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 主机不同</text>

  <!-- arrows ② -> level 2 -->
  <path d="M 55 148 L 55 168" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 90 148 Q 160 158 210 168" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- arrow ③ -> ⑤ -->
  <path d="M 240 148 Q 310 158 360 168" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Level 2 ===== -->
  <!-- ④ news/topics/tech (new) -->
  <rect x="6" y="172" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="56" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">yahoo.com/</text>
  <text x="56" y="204" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">topics/tech</text>
  <circle cx="16" cy="172" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="16" y="176" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>

  <!-- ✓ /news (already visited) -->
  <rect x="146" y="172" width="100" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="196" y="190" text-anchor="middle" font-size="9" fill="#aaa" font-weight="bold">yahoo.com/news</text>
  <text x="196" y="204" text-anchor="middle" font-size="8.5" fill="#aaa">✓ 已访问，跳过</text>

  <!-- ⑤ finance/markets (new) -->
  <rect x="296" y="172" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="351" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">yahoo.com/</text>
  <text x="351" y="204" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">finance/markets</text>
  <circle cx="306" cy="172" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="306" y="176" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>

  <!-- ===== Summary box ===== -->
  <rect x="30" y="232" width="500" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">发现顺序 ①→⑤，异主机名 2 条边被剪枝，重复边 1 条被去重</text>

  <text x="48" y="278" font-size="10.5" fill="#555">队列演变：</text>
  <rect x="120" y="268" width="400" height="22" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="283" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">[①] → [②③] → [③④] → [④⑤] → [⑤] → []</text>

  <text x="48" y="312" font-size="10.5" fill="#555">最终结果：</text>
  <rect x="120" y="302" width="400" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5 个同主机名 URL：①②③④⑤</text>

  <text x="280" y="342" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">虚线箭头 = 被过滤的边；灰框 = 已访问去重</text>
</svg>
