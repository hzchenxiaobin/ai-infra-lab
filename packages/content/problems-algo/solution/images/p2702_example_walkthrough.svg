<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[3,4,1,7,6], x=4, y=2, x−y=2</text>

  <!-- common header: nums -->
  <text x="30" y="56" font-size="11" fill="#666" font-weight="bold">nums</text>
  <g font-size="12.5" fill="#333" font-weight="bold">
    <rect x="90" y="42" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="60" text-anchor="middle">3</text>
    <rect x="132" y="42" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="152" y="60" text-anchor="middle">4</text>
    <rect x="174" y="42" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="194" y="60" text-anchor="middle">1</text>
    <rect x="216" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="60" text-anchor="middle">7</text>
    <rect x="258" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="60" text-anchor="middle">6</text>
  </g>
  <text x="310" y="60" font-size="10.5" fill="#888">max=7，区间 [0,7]</text>

  <!-- ===== Column A: t=2 (FAIL) ===== -->
  <rect x="20" y="86" width="250" height="316" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)" opacity="0.95"/>
  <text x="145" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">t = 2（不可行 ✗）</text>

  <text x="36" y="132" font-size="11" fill="#333">t·y = 2×2 = 4</text>
  <text x="36" y="150" font-size="11" fill="#555">v − t·y：</text>
  <g font-size="11.5" fill="#333">
    <rect x="120" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="135" y="153" text-anchor="middle">−1</text>
    <rect x="152" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="167" y="153" text-anchor="middle">0</text>
    <rect x="184" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="199" y="153" text-anchor="middle">−3</text>
    <rect x="216" y="138" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="231" y="153" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="248" y="138" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="263" y="153" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <text x="36" y="184" font-size="11" fill="#555">需 cᵢ=⌈·/2⌉：</text>
  <g font-size="11.5" fill="#333">
    <rect x="120" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="135" y="187" text-anchor="middle">0</text>
    <rect x="152" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="167" y="187" text-anchor="middle">0</text>
    <rect x="184" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="199" y="187" text-anchor="middle">0</text>
    <rect x="216" y="172" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="231" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="248" y="172" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="263" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <text x="36" y="220" font-size="12" fill="#333">Σcᵢ = 0+0+0+2+1 = </text>
  <text x="180" y="220" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="200" y="220" font-size="12" fill="#333">&gt; t=2</text>

  <rect x="36" y="234" width="218" height="26" fill="#b85450" opacity="0.18" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="251" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3 步需求 &gt; 2 步预算 → ✗</text>

  <text x="36" y="284" font-size="11" fill="#888">二分动作：l = mid+1 = 3</text>
  <path d="M36 296 L36 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="312" font-size="10.5" fill="#b85450">抬左界</text>

  <!-- ===== Column B: t=3 (PASS) ===== -->
  <rect x="290" y="86" width="250" height="316" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)" opacity="0.95"/>
  <text x="415" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">t = 3（可行 ✓）</text>

  <text x="306" y="132" font-size="11" fill="#333">t·y = 3×2 = 6</text>
  <text x="306" y="150" font-size="11" fill="#555">v − t·y：</text>
  <g font-size="11.5" fill="#333">
    <rect x="390" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="405" y="153" text-anchor="middle">−3</text>
    <rect x="422" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="437" y="153" text-anchor="middle">−2</text>
    <rect x="454" y="138" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="469" y="153" text-anchor="middle">−5</text>
    <rect x="486" y="138" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="501" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="518" y="138" width="14" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="525" y="153" text-anchor="middle">0</text>
  </g>

  <text x="306" y="184" font-size="11" fill="#555">需 cᵢ=⌈·/2⌉：</text>
  <g font-size="11.5" fill="#333">
    <rect x="390" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="405" y="187" text-anchor="middle">0</text>
    <rect x="422" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="437" y="187" text-anchor="middle">0</text>
    <rect x="454" y="172" width="30" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="469" y="187" text-anchor="middle">0</text>
    <rect x="486" y="172" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="501" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="518" y="172" width="14" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="525" y="187" text-anchor="middle">0</text>
  </g>

  <text x="306" y="220" font-size="12" fill="#333">Σcᵢ = 0+0+0+1+0 = </text>
  <text x="450" y="220" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="468" y="220" font-size="12" fill="#333">≤ t=3</text>

  <rect x="306" y="234" width="218" height="26" fill="#4a7a3a" opacity="0.18" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="251" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1 步需求 ≤ 3 步预算 → ✓</text>

  <text x="306" y="284" font-size="11" fill="#888">二分动作：r = mid = 3</text>
  <path d="M306 296 L306 318" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="312" font-size="10.5" fill="#4a7a3a">缩右界</text>

  <!-- convergence bottom -->
  <rect x="60" y="360" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">轨迹：mid=3→r=3，mid=1→l=2，mid=2→l=3</text>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">收敛 l = r = 3，答案 3 ✓</text>
</svg>
