<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：左右移都是循环旋转，可累加为一次净旋转</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">左移/右移互为逆操作，逐次累加取模 ⇒ m 次操作合并为 1 次切片</text>

  <!-- ===== Panel A: left shift by 1 ===== -->
  <text x="40" y="84" font-size="12" fill="#d6a040" font-weight="bold">左移 1 位 (dir=0)</text>
  <text x="40" y="100" font-size="9" fill="#888">移除首字符→追加末尾</text>

  <!-- original a b c d e ; a highlighted -->
  <rect x="140" y="80" width="34" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="157" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="182" y="80" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="199" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="224" y="80" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="241" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="266" y="80" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="308" y="80" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325" y="104" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>

  <!-- curved arrow a -> end -->
  <path d="M 157 116 C 157 138, 332 140, 325 116" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="245" y="146" text-anchor="middle" font-size="9" fill="#d6a040">a 跳到末尾</text>

  <!-- arrow to result -->
  <path d="M 352 97 L 392 97" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result b c d e a -->
  <rect x="400" y="80" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="436" y="80" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="472" y="80" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="488" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="508" y="80" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="524" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="544" y="80" width="32" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- ===== Panel B: right shift by 1 ===== -->
  <text x="40" y="178" font-size="12" fill="#b85450" font-weight="bold">右移 1 位 (dir=1)</text>
  <text x="40" y="194" font-size="9" fill="#888">移除末字符→插到开头</text>

  <!-- original a b c d e ; e highlighted -->
  <rect x="140" y="174" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="157" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="182" y="174" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="199" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="224" y="174" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="241" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="266" y="174" width="34" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="308" y="174" width="34" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="325" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>

  <!-- curved arrow e -> front -->
  <path d="M 325 210 C 332 232, 157 234, 157 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="240" text-anchor="middle" font-size="9" fill="#b85450">e 跳到开头</text>

  <!-- arrow to result -->
  <path d="M 352 191 L 392 191" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result e a b c d -->
  <rect x="400" y="174" width="32" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="436" y="174" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="472" y="174" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="488" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="508" y="174" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="524" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="544" y="174" width="32" height="34" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>

  <!-- divider -->
  <path d="M 40 266 L 580 266" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel C: composition ===== -->
  <text x="310" y="290" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">多次移位 ⇒ 累加为净旋转量 delta（右移 +amount，左移 −amount）</text>

  <!-- shift list table -->
  <text x="40" y="316" font-size="10" fill="#888" font-weight="bold">shift 序列：</text>
  <!-- chips: [0,1] [1,2] [0,2] [1,3] -->
  <rect x="116" y="302" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="318" text-anchor="middle" font-size="10" fill="#333">[0,1]左</text>
  <rect x="178" y="302" width="56" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="206" y="318" text-anchor="middle" font-size="10" fill="#333">[1,2]右</text>
  <rect x="240" y="302" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="268" y="318" text-anchor="middle" font-size="10" fill="#333">[0,2]左</text>
  <rect x="302" y="302" width="56" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="318" text-anchor="middle" font-size="10" fill="#333">[1,3]右</text>

  <!-- delta accumulation -->
  <text x="40" y="350" font-size="10" fill="#888" font-weight="bold">delta 累加：</text>
  <text x="116" y="350" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <path d="M 134 346 L 150 346" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="350" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <path d="M 178 346 L 194 346" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="350" font-size="11" fill="#d6a040" font-weight="bold">−2</text>
  <path d="M 224 346 L 240 346" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="350" font-size="11" fill="#b85450" font-weight="bold">+3</text>
  <path d="M 270 346 L 288 346" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- delta result -->
  <rect x="294" y="336" width="80" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">delta = 1</text>

  <!-- mod n -->
  <path d="M 376 349 L 410 349" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="414" y="336" width="92" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 mod 7 = 1</text>

  <!-- single slice -->
  <path d="M 508 349 L 528 349" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="532" y="336" width="56" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">一次切片</text>

  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#555">⇒ 右移 1 位：<tspan font-family="monospace" fill="#4a7a3a">s[-1:] + s[:-1]</tspan>，无需逐次搬运字符</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="396" width="540" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两个关键观察</text>
  <text x="54" y="436" font-size="10" fill="#555">① <tspan font-weight="bold" fill="#446688">左右移都是循环旋转</tspan>：长度 n 的串，移位 n 位回到原状 ⇒ 可取模，amount 可远大于 n。</text>
  <text x="54" y="450" font-size="10" fill="#555">② <tspan font-weight="bold" fill="#4a7a3a">旋转可叠加</tspan>：左移 a + 右移 b = 净右移 (b−a)，m 次操作合并为一次切片 O(n+m)。</text>
</svg>
