<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">N=2：数值块按 右上→右下→左下→左上 顺序切分</text>

  <!-- 4x4 网格：单元 44px，起点 (60,60) -->
  <!-- 左上象限（粉）12~15 -->
  <rect x="60" y="60" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <rect x="104" y="60" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <rect x="60" y="104" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <rect x="104" y="104" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <!-- 右上象限（绿）0~3 -->
  <rect x="148" y="60" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="60" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="104" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="104" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <!-- 左下象限（橙）8~11 -->
  <rect x="60" y="148" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>
  <rect x="104" y="148" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="60" y="192" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="104" y="192" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <!-- 右下象限（蓝）4~7 -->
  <rect x="148" y="148" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="192" y="148" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="148" y="192" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="192" y="192" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- 象限粗描边 -->
  <rect x="60" y="60" width="88" height="88" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="148" y="60" width="88" height="88" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="60" y="148" width="88" height="88" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="148" y="148" width="88" height="88" rx="6" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 象限名标签 -->
  <text x="48" y="108" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">左上</text>
  <text x="248" y="108" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右上</text>
  <text x="48" y="196" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">左下</text>
  <text x="248" y="196" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">右下</text>

  <!-- 右侧：数值块分配 -->
  <rect x="300" y="60" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="87" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">右上 → 0 ~ 3（最小）</text>
  <path d="M 395 104 L 395 121" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="117" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">全部小于</text>

  <rect x="300" y="124" width="190" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="151" text-anchor="middle" font-size="12.5" fill="#33455e" font-weight="bold" filter="url(#rough2)">右下 → 4 ~ 7</text>
  <path d="M 395 168 L 395 185" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="181" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">全部小于</text>

  <rect x="300" y="188" width="190" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="215" text-anchor="middle" font-size="12.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">左下 → 8 ~ 11</text>
  <path d="M 395 232 L 395 249" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="245" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">全部小于</text>

  <rect x="300" y="252" width="190" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="279" text-anchor="middle" font-size="12.5" fill="#a04848" font-weight="bold" filter="url(#rough2)">左上 → 12 ~ 15（最大）</text>

  <!-- 说明框 -->
  <rect x="285" y="312" width="215" height="40" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="392" y="329" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个象限内部递归同构：</text>
  <text x="392" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再四分、再按此序分块</text>

  <!-- 左下角：N=1 迷你网格 -->
  <rect x="60" y="278" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="86" y="278" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="60" y="304" width="26" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="86" y="304" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="126" y="290" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">N=1：同一套顺序</text>
  <text x="126" y="308" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">1×1 天然特殊（递归出口）</text>
</svg>
