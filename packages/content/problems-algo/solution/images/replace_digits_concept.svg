<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇数位数字 = 前一字母向后偏移</text>

  <!-- Input label -->
  <text x="60" y="78" font-size="11" fill="#888">输入 s：</text>

  <!-- Input row: a 1 c 1 e 1 -->
  <!-- box width 64, gap 12, start x=92 -->
  <!-- i=0 a (even=letter, green) -->
  <rect x="92" y="60" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <text x="124" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a">偶 0 · 字母</text>

  <!-- i=1 1 (odd=digit, orange) -->
  <rect x="168" y="60" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="200" y="118" text-anchor="middle" font-size="10" fill="#d6a040">奇 1 · 数字</text>

  <!-- i=2 c (even=letter, green) -->
  <rect x="244" y="60" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <text x="276" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a">偶 2 · 字母</text>

  <!-- i=3 1 (odd=digit, orange) -->
  <rect x="320" y="60" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="352" y="118" text-anchor="middle" font-size="10" fill="#d6a040">奇 3 · 数字</text>

  <!-- i=4 e (even=letter, green) -->
  <rect x="396" y="60" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="428" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
  <text x="428" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a">偶 4 · 字母</text>

  <!-- i=5 1 (odd=digit, orange) -->
  <rect x="472" y="60" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="504" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="504" y="118" text-anchor="middle" font-size="10" fill="#d6a040">奇 5 · 数字</text>

  <!-- Vertical arrows: even=keep (green straight), odd=shift (orange curved with label) -->
  <!-- i=0 a -> a : keep -->
  <path d="M 124 130 L 124 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="152" font-size="9" fill="#4a7a3a">保留</text>

  <!-- i=1 1 -> b : shift(a,1)=b -->
  <path d="M 200 130 L 200 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="152" font-size="9" fill="#d6a040" font-weight="bold">shift(a,1)</text>

  <!-- i=2 c -> c : keep -->
  <path d="M 276 130 L 276 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="152" font-size="9" fill="#4a7a3a">保留</text>

  <!-- i=3 1 -> d : shift(c,1)=d -->
  <path d="M 352 130 L 352 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="152" font-size="9" fill="#d6a040" font-weight="bold">shift(c,1)</text>

  <!-- i=4 e -> e : keep -->
  <path d="M 428 130 L 428 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="152" font-size="9" fill="#4a7a3a">保留</text>

  <!-- i=5 1 -> f : shift(e,1)=f -->
  <path d="M 504 130 L 504 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="152" font-size="9" fill="#d6a040" font-weight="bold">shift(e,1)</text>

  <!-- Output label -->
  <text x="60" y="198" font-size="11" fill="#888">输出：</text>

  <!-- Output row: a b c d e f -->
  <!-- i=0 a (kept, green light) -->
  <rect x="92" y="180" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="208" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>

  <!-- i=1 b (replaced, orange bold) -->
  <rect x="168" y="180" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="208" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">b</text>

  <!-- i=2 c (kept, green light) -->
  <rect x="244" y="180" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="208" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>

  <!-- i=3 d (replaced, orange bold) -->
  <rect x="320" y="180" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="352" y="208" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">d</text>

  <!-- i=4 e (kept, green light) -->
  <rect x="396" y="180" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="208" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>

  <!-- i=5 f (replaced, orange bold) -->
  <rect x="472" y="180" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="504" y="208" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">f</text>

  <!-- Formula box -->
  <rect x="60" y="248" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">shift 公式：shift(c, x) = 字母 c 向后移 x 位</text>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#666">实现：s[i-1] + (s[i] - '0')   （x = 数字字符的数值）</text>

  <!-- Key idea box -->
  <rect x="60" y="318" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">关键直觉：奇偶交替结构 + 前驱依赖</text>
  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#666">偶数位字母不变，奇数位数字由「前一字母 + 偏移量」替换</text>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#666">只需遍历奇数下标 i，读 s[i-1] 算新字符，O(n) 一次扫描</text>
</svg>
