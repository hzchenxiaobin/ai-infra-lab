<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段算法：预计算短段最优 + DP 组段</text>

  <!-- ===== Phase 1 ===== -->
  <rect x="30" y="42" width="500" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">阶段一：预计算 minLap[x]（单种轮胎连续跑 x 圈的最少耗时）</text>

  <!-- tire loop -->
  <rect x="48" y="78" width="120" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">遍历每种轮胎</text>
  <text x="108" y="110" text-anchor="middle" font-size="10" fill="#666">(f, r)</text>

  <path d="M 168 98 L 196 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate -->
  <rect x="200" y="78" width="140" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加圈耗时</text>
  <text x="270" y="110" text-anchor="middle" font-size="10" fill="#666">total += lap</text>

  <path d="M 340 98 L 368 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- record min -->
  <rect x="372" y="78" width="146" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新 minLap[x]</text>
  <text x="445" y="110" text-anchor="middle" font-size="10" fill="#446688">= min(旧, total)</text>

  <!-- break decision -->
  <path d="M 445 118 L 445 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="142" width="146" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="158" text-anchor="middle" font-size="10" fill="#444">lap ≥ 阈值？</text>
  <text x="445" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是 → break 该轮胎</text>

  <text x="240" y="158" font-size="10" fill="#888">否 → lap *= r，继续下一圈</text>

  <!-- output note -->
  <text x="48" y="180" font-size="11" fill="#4a7a3a">得到 minLap[1..maxX]，maxX ≤ 18（短段表）</text>

  <!-- ===== Phase 2 ===== -->
  <rect x="30" y="204" width="500" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="226" font-size="12" fill="#446688" font-weight="bold">阶段二：DP 组段 —— dp[i] = 跑完 i 圈的最少总时间</text>

  <!-- dp[0] init -->
  <rect x="48" y="240" width="190" height="40" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="143" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化 dp[0] = −changeTime</text>
  <text x="143" y="272" text-anchor="middle" font-size="10" fill="#888">第一段无需先换胎，抵消首次 +changeTime</text>

  <path d="M 143 280 L 143 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transition -->
  <rect x="48" y="304" width="380" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="238" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">转移：枚举最后一段连续跑 x 圈</text>
  <text x="238" y="344" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp[i] = min₁≤ₓ≤min(i,maxX) { dp[i−x] + minLap[x] + changeTime }</text>

  <!-- answer -->
  <rect x="440" y="304" width="80" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="480" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[numLaps]</text>

  <path d="M 428 332 L 438 332" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note bottom -->
  <text x="48" y="382" font-size="11" fill="#444">• 每段 = 一种轮胎连续跑若干圈 + 一次换胎；dp[0]=−changeTime 去掉首段多余的换胎</text>
  <text x="48" y="398" font-size="11" fill="#444">• 内层 x ≤ maxX ≤ 18，故 DP 为 O(numLaps · maxX) ≈ O(1.8×10⁴)</text>
</svg>
