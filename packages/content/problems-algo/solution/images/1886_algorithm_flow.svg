<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：至多 4 次旋转 + 逐次比较</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="50" rx="40" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 68 L 260 82" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k = 0 -->
  <rect x="200" y="82" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = 0</text>
  <path d="M 260 112 L 260 124" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: mat == target? center (260, 150) -->
  <polygon points="260,124 340,150 260,176 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">mat == target?</text>

  <!-- Yes -> right: return true -->
  <path d="M 340 150 L 398 150" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="369" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="398" y="135" width="102" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="449" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- No -> down -->
  <path d="M 260 176 L 260 196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="190" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Diamond: k == 3? center (260, 222) -->
  <polygon points="260,196 330,222 260,248 190,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">k == 3?</text>

  <!-- Yes -> right: return false -->
  <path d="M 330 222 L 398 222" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="398" y="207" width="102" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="449" y="227" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- No -> down -->
  <path d="M 260 248 L 260 270" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="264" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- rotate box -->
  <rect x="150" y="270" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mat = rotate90(mat)</text>
  <path d="M 260 304 L 260 318" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k++ box -->
  <rect x="200" y="318" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = k + 1</text>

  <!-- Loop back arrow: from k++ bottom → left → up → right to mat==target diamond left -->
  <path d="M 260 348 L 260 362 L 60 362 L 60 150 L 178 150" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="70" y="255" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">循环</text>

  <!-- Legend -->
  <path d="M 40 384 L 480 384" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=处理框  橙=判定  绿=返回 true  红=返回 false  虚线=循环回边</text>
</svg>
