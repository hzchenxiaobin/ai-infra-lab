<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组样例的到达分钟与逐分钟判定</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="58" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 1：dist=[1,3,4], speed=[1,1,1] → 答案 3</text>

  <text x="40" y="80" font-size="11" fill="#888">arrival：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="88" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62" y="106">1</text>
    <rect x="88" y="88" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="106">3</text>
    <rect x="136" y="88" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="106">4</text>
  </g>
  <text x="196" y="106" font-size="11" fill="#888">排序后 = [1, 3, 4]</text>

  <text x="40" y="132" font-size="11" fill="#888">槽位：</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="62" y="132">k=0</text>
    <text x="110" y="132">k=1</text>
    <text x="158" y="132">k=2</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="138" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="62" y="156">1</text>
    <rect x="88" y="138" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="156">3</text>
    <rect x="136" y="138" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="158" y="156">4</text>
  </g>
  <g font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="62" y="182" fill="#4a7a3a">1&gt;0 ✓</text>
    <text x="110" y="182" fill="#4a7a3a">3&gt;1 ✓</text>
    <text x="158" y="182" fill="#4a7a3a">4&gt;2 ✓</text>
  </g>
  <text x="40" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">全部合法 → 返回 3</text>

  <!-- Divider 1 -->
  <path d="M 40 216 L 520 216" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="240" font-size="12.5" fill="#b85450" font-weight="bold">示例 2：dist=[1,1,2,3], speed=[1,1,1,1] → 答案 1</text>

  <text x="40" y="262" font-size="11" fill="#888">arrival：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="270" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62" y="288">1</text>
    <rect x="88" y="270" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="288">1</text>
    <rect x="136" y="270" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="288">2</text>
    <rect x="184" y="270" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="206" y="288">3</text>
  </g>
  <text x="244" y="288" font-size="11" fill="#888">排序后 = [1, 1, 2, 3]</text>

  <text x="40" y="314" font-size="11" fill="#888">槽位：</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="62" y="314">k=0</text>
    <text x="110" y="314">k=1</text>
    <text x="158" y="314">k=2</text>
    <text x="206" y="314">k=3</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="320" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="62" y="338">1</text>
    <rect x="88" y="320" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="338">1</text>
    <rect x="136" y="320" width="44" height="26" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="158" y="338" fill="#999">2</text>
    <rect x="184" y="320" width="44" height="26" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="206" y="338" fill="#999">3</text>
  </g>
  <g font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="62" y="364" fill="#4a7a3a">1&gt;0 ✓</text>
    <text x="110" y="364" fill="#b85450">1&gt;1 ✗</text>
    <text x="158" y="364" fill="#999">停</text>
    <text x="206" y="364" fill="#999">停</text>
  </g>
  <text x="40" y="382" font-size="11" fill="#b85450" font-weight="bold">第 1 分钟第 2 个怪物到达 → 返回 1</text>

  <!-- Divider 2 -->
  <path d="M 40 398 L 520 398" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="40" y="422" font-size="12.5" fill="#d6a040" font-weight="bold">示例 3：dist=[3,2,4], speed=[5,3,2] → 答案 1</text>

  <text x="40" y="444" font-size="11" fill="#888">arrival：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="452" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="70" y="470">⌈0.6⌉=1</text>
    <rect x="104" y="452" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="134" y="470">⌈.67⌉=1</text>
    <rect x="168" y="452" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="470">⌈2⌉=2</text>
  </g>
  <text x="244" y="470" font-size="11" fill="#888">排序后 = [1, 1, 2]</text>

  <text x="40" y="496" font-size="11" fill="#888">槽位：</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="70" y="496">k=0</text>
    <text x="134" y="496">k=1</text>
    <text x="198" y="496">k=2</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="502" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="70" y="520">1</text>
    <rect x="104" y="502" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="134" y="520">1</text>
    <rect x="168" y="502" width="60" height="26" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="198" y="520" fill="#999">2</text>
  </g>
  <g font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="70" y="546" fill="#4a7a3a">1&gt;0 ✓</text>
    <text x="134" y="546" fill="#b85450">1&gt;1 ✗</text>
    <text x="198" y="546" fill="#999">停</text>
  </g>
  <text x="40" y="564" font-size="11" fill="#b85450" font-weight="bold">怪物 1 仅 0.667 分钟即到达 → 返回 1</text>

  <!-- summary note -->
  <path d="M 40 584 L 520 584" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="604" font-size="11" fill="#555">• 示例 2/3 答案同为 1：最快到达的怪物截止线 = 1，仅第 0 分钟一次机会</text>
  <text x="40" y="618" font-size="11" fill="#555">• 向上取整把 0.667 归为 1，正确反映「第 0 分钟是唯一合法消灭窗口」</text>
</svg>
