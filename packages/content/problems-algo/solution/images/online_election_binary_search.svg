<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">查询 q(t)：二分找 ≤ t 的最大时刻，取对应 leaders</text>

  <!-- times array -->
  <text x="40" y="64" font-size="12" fill="#888">times:</text>
  <rect x="90" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="146" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="202" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="258" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <rect x="314" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <rect x="370" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">25</text>
  <rect x="426" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">30</text>

  <!-- target -->
  <rect x="150" y="100" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">q(24)  →  找 ≤ 24 的最大时刻</text>

  <!-- binary search steps -->
  <text x="40" y="158" font-size="11" fill="#555" font-weight="bold">轮 1</text>
  <rect x="80" y="142" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="161" text-anchor="middle" font-size="11" fill="#444">mid = 3 → times[3] = 15 ≤ 24 ✓  记 ans = 3，lo = 4</text>

  <text x="40" y="194" font-size="11" fill="#555" font-weight="bold">轮 2</text>
  <rect x="80" y="178" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="11" fill="#444">mid = 5 → times[5] = 25 &gt; 24 ✗  hi = 4</text>

  <text x="40" y="230" font-size="11" fill="#555" font-weight="bold">轮 3</text>
  <rect x="80" y="214" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="233" text-anchor="middle" font-size="11" fill="#444">mid = 4 → times[4] = 20 ≤ 24 ✓  记 ans = 4，lo = 5</text>

  <text x="40" y="266" font-size="11" fill="#555" font-weight="bold">终止</text>
  <rect x="80" y="250" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="11" fill="#333">lo = 5 &gt; hi = 4 → 退出，ans = 4</text>

  <!-- highlight idx4 -->
  <rect x="314" y="48" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="69" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">20</text>
  <path d="M 342 84 L 342 100 L 342 250" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="300" width="380" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 leaders[4] = 0</text>
  <text x="270" y="342" text-anchor="middle" font-size="10.5" fill="#888">等价于 upper_bound(t) − 1，再取 leaders 数组</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">单次查询 O(log n)</text>
</svg>
