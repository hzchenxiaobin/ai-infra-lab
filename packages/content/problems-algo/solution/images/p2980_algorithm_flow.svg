<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描数偶数，攒够两个即收工</text>

  <!-- 开始 -->
  <rect x="100" y="34" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">开始</text>
  <path d="M 140 60 L 140 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cnt = 0 -->
  <rect x="76" y="76" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">cnt = 0（偶数计数）</text>
  <path d="M 140 104 L 140 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取出下一个元素 -->
  <rect x="62" y="120" width="156" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="141" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">取出下一个元素 x</text>
  <path d="M 140 152 L 140 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：x 是偶数？ -->
  <polygon points="140,170 218,198 140,226 62,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">x 是偶数？</text>
  <text x="140" y="211" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">(x &amp; 1) == 0</text>

  <!-- 是 → cnt++ -->
  <path d="M 218 198 L 272 198" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="190" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="276" y="180" width="136" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="194" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">cnt++</text>
  <text x="344" y="209" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">（偶数 +1）</text>

  <!-- 否 → 直接到菱形2 -->
  <path d="M 140 226 L 140 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="234" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- cnt++ 汇入菱形2 -->
  <path d="M 344 216 L 344 268 L 212 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：遍历完？ -->
  <polygon points="140,242 208,268 140,294 72,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">遍历完？</text>
  <text x="140" y="281" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">（还剩元素吗）</text>

  <!-- 否：回环取下一个 -->
  <path d="M 72 268 L 30 268 L 30 136 L 58 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="51" y="260" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">否（取下一个）</text>

  <!-- 是 → 菱形3 -->
  <path d="M 140 294 L 140 320" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="312" font-size="10.5" fill="#888" filter="url(#rough2)">是（扫描结束）</text>

  <!-- 菱形3：cnt >= 2 ? -->
  <polygon points="140,324 206,352 140,380 74,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="349" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cnt ≥ 2 ?</text>
  <text x="140" y="365" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">（偶数够两个吗）</text>

  <!-- 是 → 返回 true -->
  <path d="M 206 352 L 254 352" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="344" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="258" y="336" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="313" y="357" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">返回 true</text>

  <!-- 否 → 返回 false -->
  <path d="M 140 380 L 140 394" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="390" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="84" y="398" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="417" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">返回 false</text>

  <!-- 右上要点框 -->
  <rect x="300" y="60" width="196" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="84" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="398" y="104" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">偶数 ⇔ 最低位为 0</text>
  <text x="398" y="121" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">OR 只会置 1，不会清 0</text>
  <text x="398" y="138" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">全员偶数才保得住 0</text>
  <text x="398" y="155" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">攒够两个偶数可提前返回</text>
</svg>
