<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">循环移位：出界的元素绕到另一头，n 步回到原样</text>

  <!-- Part 1: left shift by 1 -->
  <text x="36" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一行左移 1 位：</text>

  <rect x="60" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="79" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">1</text>
  <rect x="96" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="113" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="149" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="168" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 222 73 L 258 73" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">左移 1 位</text>

  <rect x="270" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="287" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="306" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="323" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="342" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="359" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="378" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="79" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">1</text>

  <path d="M 77 94 C 77 130, 395 130, 395 94" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="236" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 从左边出界，绕回到右边</text>

  <!-- Part 2: period n -->
  <text x="36" y="170" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 4 列 ⇒ 状态以 4 步为周期：</text>

  <text x="92" y="199" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">+0 步</text>
  <rect x="110" y="182" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="122" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="182" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="148" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="162" y="182" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="182" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="92" y="231" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">+1 步</text>
  <rect x="110" y="214" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="122" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="214" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="148" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="162" y="214" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="214" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">1</text>

  <text x="92" y="263" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">+2 步</text>
  <rect x="110" y="246" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="122" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="246" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="148" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="162" y="246" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="174" y="263" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">1</text>
  <rect x="188" y="246" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="92" y="295" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">+3 步</text>
  <rect x="110" y="278" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="122" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="136" y="278" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="148" y="295" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">1</text>
  <rect x="162" y="278" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="188" y="278" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="92" y="327" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+4 步</text>
  <rect x="110" y="310" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="327" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="136" y="310" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="327" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="162" y="310" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="327" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="188" y="310" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="327" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="228" y="327" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">回到原样 ✓</text>

  <!-- reduction box -->
  <rect x="300" y="190" width="190" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="395" y="216" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k = 7 步</text>
  <text x="395" y="242" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">7 mod 4 = 3</text>
  <text x="395" y="268" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">等效于只移 3 步</text>
  <text x="395" y="298" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#rough2)">k 再大也只做一次取模</text>

  <!-- bottom conclusion -->
  <rect x="46" y="348" width="428" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">记 s = k mod n：之后只看偏移量 s，与 k 的大小无关</text>
  <text x="260" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">行与行互相独立 ⇒ 逐行判定，任何一行失配立即 false</text>
</svg>
