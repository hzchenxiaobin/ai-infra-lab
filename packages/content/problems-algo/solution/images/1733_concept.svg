<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：过滤已通好友 + 枚举语言贪心计数
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    示例 2：n=3，4 位用户，4 对好友
  </text>

  <!-- ===== Left: friendship graph ===== -->
  <text x="160" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">
    好友图（语言集标注）
  </text>

  <!-- User 1: top-left, knows {2} -->
  <rect x="65" y="80" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">用户1</text>
  <text x="100" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">语{2}</text>

  <!-- User 2: top-right, knows {1,3} -->
  <rect x="205" y="80" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">用户2</text>
  <text x="240" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">语{1,3}</text>

  <!-- User 3: bottom-right, knows {1,2} -->
  <rect x="205" y="200" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">用户3</text>
  <text x="240" y="236" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">语{1,2}</text>

  <!-- User 4: bottom-left, knows {3} -->
  <rect x="65" y="200" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">用户4</text>
  <text x="100" y="236" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">语{3}</text>

  <!-- Edge (1,2): top, unsatisfied -->
  <path d="M135,105 L205,105" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 无共语</text>

  <!-- Edge (2,3): right, satisfied -->
  <path d="M240,130 L240,200" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="256" y="168" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ 共语1</text>

  <!-- Edge (3,4): bottom, unsatisfied -->
  <path d="M205,225 L135,225" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 无共语</text>

  <!-- Edge (1,4): left, unsatisfied -->
  <path d="M100,130 L100,200" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="82" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- ===== Right: two-phase insight ===== -->
  <rect x="310" y="60" width="230" height="200" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="425" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">两阶段贪心</text>

  <!-- Phase 1 -->
  <rect x="324" y="92" width="202" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">阶段 1：过滤</text>
  <text x="328" y="126" font-size="10" fill="#444" filter="url(#rough2)">已能沟通的好友 → 跳过</text>
  <text x="328" y="140" font-size="10" fill="#444" filter="url(#rough2)">不能沟通的好友 → 保留</text>

  <!-- Phase 2 -->
  <rect x="324" y="156" width="202" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">阶段 2：枚举语言</text>
  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="328" y="190">对每门语言 L（1..n）：</text>
    <text x="328" y="206">  教所有不掌握 L 的</text>
    <text x="328" y="220">  「需教用户」</text>
    <text x="328" y="236">→ 计数取最小值</text>
  </g>
  <rect x="334" y="244" width="182" height="22" fill="#eaf6ee" stroke="#4a8e4a" rx="4" filter="url(#rough2)"/>
  <text x="425" y="259" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">min = 2（教语言3给用户1,3）</text>

  <!-- arrow from phase 1 to phase 2 -->
  <path d="M425,148 L425,154" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Legend ===== -->
  <g font-size="10" filter="url(#rough2)">
    <rect x="50" y="266" width="16" height="12" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="72" y="276" fill="#444">用户</text>
    <line x1="120" y1="272" x2="148" y2="272" stroke="#b85450" stroke-width="2"/>
    <text x="154" y="276" fill="#444">不能沟通</text>
    <line x1="210" y1="272" x2="238" y2="272" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="244" y="276" fill="#444">已能沟通</text>
  </g>

  <!-- ===== Bottom insight ===== -->
  <rect x="30" y="292" width="510" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">
    关键洞察：选定语言后，教谁已被唯一确定
  </text>
  <text x="285" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    ① 只需关心「不能沟通」的好友对 —— 已能沟通的无需干预
  </text>
  <text x="285" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    ② 这些好友对中的用户构成「需教集合」S
  </text>
  <text x="285" y="374" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    ③ 枚举语言 L，代价 = S 中不掌握 L 的人数，取最小即可
  </text>
</svg>
