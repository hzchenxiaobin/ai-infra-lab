<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每个数提供一份「可调裕量」，贪心取最大裕量补差</text>

  <!-- ============ Top: two arrays and diff ============ -->
  <text x="56" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">大和数组 nums1（和 S₁），每个数可下调</text>

  <!-- nums1 cells -->
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="68" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="87">1</text>
    <rect x="96" y="68" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="87">2</text>
    <rect x="132" y="68" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="148" y="87">3</text>
    <rect x="168" y="68" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="184" y="87">4</text>
    <rect x="204" y="68" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="87">5</text>
    <rect x="240" y="68" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="256" y="87">6</text>
  </g>
  <!-- gain arrows for nums1 (down to 1) -->
  <g font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="112">0</text>
    <text x="112" y="112">1</text>
    <text x="148" y="112">2</text>
    <text x="184" y="112">3</text>
    <text x="220" y="112">4</text>
    <text x="256" y="112">5</text>
  </g>
  <text x="300" y="112" font-size="10" fill="#b85450" filter="url(#rough2)">← 裕量 v−1</text>

  <!-- diff arrow -->
  <path d="M 350 82 L 350 150" stroke="#888" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="318" y="108" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">差 diff</text>

  <!-- ============ Bottom: nums2 ============ -->
  <text x="56" y="158" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">小和数组 nums2（和 S₂），每个数可上调</text>

  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="76" y="191">1</text>
    <rect x="96" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="112" y="191">1</text>
    <rect x="132" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="148" y="191">2</text>
    <rect x="168" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="184" y="191">2</text>
    <rect x="204" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="220" y="191">2</text>
    <rect x="240" y="172" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="256" y="191">2</text>
  </g>
  <g font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="214">5</text>
    <text x="112" y="214">5</text>
    <text x="148" y="214">4</text>
    <text x="184" y="214">4</text>
    <text x="220" y="214">4</text>
    <text x="256" y="214">4</text>
  </g>
  <text x="300" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 裕量 6−v</text>

  <!-- divider -->
  <path d="M 40 236 L 520 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Merged gain pool ============ -->
  <text x="56" y="258" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">合并所有裕量 → 降序排列 → 贪心取最大，直到补满 diff</text>

  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="272" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="78" y="291">5</text>
    <rect x="100" y="272" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="118" y="291">5</text>
    <rect x="140" y="272" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="158" y="291">5</text>
    <rect x="180" y="272" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="198" y="291">4</text>
    <rect x="220" y="272" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="238" y="291">4</text>
    <rect x="260" y="272" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="278" y="291">4</text>
    <rect x="300" y="272" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="318" y="291">4</text>
    <rect x="340" y="272" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="358" y="291">3</text>
    <rect x="380" y="272" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="398" y="291">2</text>
    <rect x="420" y="272" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="438" y="291">1</text>
    <rect x="460" y="272" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="478" y="291">0</text>
  </g>

  <!-- accumulate bracket -->
  <path d="M 60 312 L 60 322 L 196 322 L 196 312" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="128" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">取 3 个：5+5+5=15 ≥ diff=11 ✓</text>

  <!-- annotation box -->
  <rect x="350" y="324" width="190" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">裕量是「可变范围」</text>
  <text x="445" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">大和数下调 / 小和数上调</text>
  <text x="445" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两者对补差等价</text>

  <!-- footer -->
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">裕量池总和 &lt; diff 时返回 −1（无解）</text>
</svg>
