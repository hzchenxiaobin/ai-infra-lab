<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M9,1 L0,5 L9,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">单词规律 = 单词 ↔ 字符的双射</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">pattern = "abba"  ↔  s = "dog cat cat dog"</text>

  <text x="40" y="108" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">pattern</text>
  <rect x="70" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="160" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="250" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="340" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>

  <text x="40" y="268" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">words</text>
  <rect x="70" y="248" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dog</text>
  <rect x="160" y="248" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cat</text>
  <rect x="250" y="248" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cat</text>
  <rect x="340" y="248" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dog</text>

  <line x1="100" y1="130" x2="100" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <line x1="190" y1="130" x2="190" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <line x1="280" y1="130" x2="280" y2="246" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrO)" marker-start="url(#arrO)" filter="url(#rough2)"/>
  <text x="298" y="192" font-size="10" fill="#d6a040" filter="url(#rough2)">老 ✓</text>
  <line x1="370" y1="130" x2="370" y2="246" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrO)" marker-start="url(#arrO)" filter="url(#rough2)"/>
  <text x="388" y="192" font-size="10" fill="#d6a040" filter="url(#rough2)">老 ✓</text>

  <rect x="430" y="150" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p→w 单射</text>
  <text x="480" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不同字符不同词</text>
  <rect x="430" y="196" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="480" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w→p 单射</text>
  <text x="480" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不同词不同字符</text>

  <rect x="430" y="248" width="100" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="440" y1="260" x2="460" y2="260" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="264" font-size="9" fill="#666" filter="url(#rough2)">首次：登记</text>
  <line x1="440" y1="276" x2="460" y2="276" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="465" y="280" font-size="9" fill="#666" filter="url(#rough2)">重复：核对</text>

  <rect x="40" y="310" width="480" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 陷阱：pattern="abba", s="dog dog dog dog"</text>
  <text x="60" y="354" font-size="11" fill="#666" filter="url(#rough2)">a→dog ✓，但 b→dog 时 w2p[dog]=a ≠ b，反向冲突 → false</text>
  <text x="60" y="372" font-size="11" fill="#666" filter="url(#rough2)">单表只查 p→w 会漏掉此例（误返回 true），必须双向核对</text>
</svg>
