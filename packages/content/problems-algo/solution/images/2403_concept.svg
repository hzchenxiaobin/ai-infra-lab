<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">法力积累机制：击杀后清零，下一段从 0 重新积累</text>

  <!-- Segment label -->
  <text x="40" y="60" font-size="12" fill="#888">示例段：gain = 2，怪物力量 x = 5</text>

  <!-- power threshold line label -->
  <text x="500" y="92" text-anchor="end" font-size="11" fill="#b85450">力量阈值 x = 5</text>
  <path d="M 60 96 L 500 96" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- Day 1 -->
  <rect x="60" y="100" width="96" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="118" text-anchor="middle" font-size="11" fill="#666">第 1 天</text>
  <text x="108" y="136" text-anchor="middle" font-size="12" fill="#333">+2 法力</text>
  <text x="108" y="156" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">共 2</text>

  <!-- Day 2 -->
  <rect x="170" y="100" width="96" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218" y="118" text-anchor="middle" font-size="11" fill="#666">第 2 天</text>
  <text x="218" y="136" text-anchor="middle" font-size="12" fill="#333">+2 法力</text>
  <text x="218" y="156" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">共 4</text>

  <!-- Day 3 (kill) -->
  <rect x="280" y="100" width="96" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="328" y="118" text-anchor="middle" font-size="11" fill="#666">第 3 天</text>
  <text x="328" y="136" text-anchor="middle" font-size="12" fill="#333">+2 法力</text>
  <text x="328" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">共 6 ≥ 5</text>

  <!-- arrows between days -->
  <path d="M 156 132 L 168 132" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 266 132 L 278 132" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- kill box -->
  <rect x="400" y="108" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">击杀！</text>
  <text x="460" y="146" text-anchor="middle" font-size="11" fill="#666">法力 → 0</text>
  <path d="M 376 132 L 398 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- cost label -->
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">本段耗时 = ⌈5 / 2⌉ = 3 天</text>

  <!-- gain bump note -->
  <rect x="120" y="206" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#3a5a2a">击杀瞬间 gain + 1：2 → 3</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#666">下一段从 0 重新积累，速率变为 3</text>

  <!-- insight box -->
  <rect x="40" y="266" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">归约</text>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333">第 k 次击杀恒用 gain = k（与杀谁无关）</text>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">总天数 = Σ_k ⌈ power[第 k 个杀] / k ⌉</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#666">→ 排列最值问题，n ≤ 17 用状压 DP</text>
</svg>
