<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">示例演算：n=10, restrictions=[[5,3],[2,5],[7,4],[10,3]]</text>

  <!-- ===== Section 1: Restriction tightening table ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">① 限制收紧过程（加 [1,0] 后排序）</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="540" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <g font-size="10" fill="#555" font-weight="bold">
    <text x="120" y="79" text-anchor="middle">id</text>
    <text x="200" y="79" text-anchor="middle">1</text>
    <text x="260" y="79" text-anchor="middle">2</text>
    <text x="320" y="79" text-anchor="middle">5</text>
    <text x="380" y="79" text-anchor="middle">7</text>
    <text x="440" y="79" text-anchor="middle">10</text>
    <text x="540" y="79" text-anchor="middle">说明</text>
  </g>

  <!-- row: original -->
  <g filter="url(#rough2)">
    <rect x="40" y="86" width="540" height="22" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="120" y="101" text-anchor="middle" fill="#888">原始 h</text>
    <text x="200" y="101" text-anchor="middle">0</text>
    <text x="260" y="101" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="320" y="101" text-anchor="middle">3</text>
    <text x="380" y="101" text-anchor="middle">4</text>
    <text x="440" y="101" text-anchor="middle">3</text>
    <text x="540" y="101" text-anchor="middle" fill="#999">—</text>
  </g>

  <!-- row: after forward -->
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="540" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="120" y="123" text-anchor="middle" fill="#4a7a3a" font-weight="bold">正向后</text>
    <text x="200" y="123" text-anchor="middle">0</text>
    <text x="260" y="123" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="320" y="123" text-anchor="middle">3</text>
    <text x="380" y="123" text-anchor="middle">4</text>
    <text x="440" y="123" text-anchor="middle">3</text>
    <text x="540" y="123" text-anchor="middle" fill="#4a7a3a" font-size="9">min(5, 0+1)=1</text>
  </g>

  <!-- row: after backward -->
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="120" y="145" text-anchor="middle" fill="#b85450" font-weight="bold">反向后</text>
    <text x="200" y="145" text-anchor="middle">0</text>
    <text x="260" y="145" text-anchor="middle">1</text>
    <text x="320" y="145" text-anchor="middle">3</text>
    <text x="380" y="145" text-anchor="middle">4</text>
    <text x="440" y="145" text-anchor="middle">3</text>
    <text x="540" y="145" text-anchor="middle" fill="#b85450" font-size="9">紧上界 = 下包络</text>
  </g>

  <!-- ===== Section 2: Final height profile ===== -->
  <text x="40" y="180" font-size="12" fill="#555" font-weight="bold">② 最终高度剖面（各段取峰，峰在建筑 8 = 5）</text>

  <!-- baseline -->
  <line x1="60" y1="420" x2="560" y2="420" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- y-axis -->
  <line x1="60" y1="420" x2="60" y2="240" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="9" fill="#999" text-anchor="end">
    <text x="54" y="424">0</text>
    <text x="54" y="396">1</text>
    <text x="54" y="368">2</text>
    <text x="54" y="340">3</text>
    <text x="54" y="312">4</text>
    <text x="54" y="284">5</text>
  </g>

  <!-- Bars: building i at x = 70 + (i-1)*48, width 40, height scale 28px/unit -->
  <!-- heights = [0,1,2,3,3,4,4,5,4,3], bar top y = 420 - h*28 -->
  <!-- building 1: h=0 -->
  <rect x="70" y="412" width="40" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="90" y="438" text-anchor="middle" font-size="9" fill="#999">1</text>
  <!-- building 2: h=1 (restricted, tightened from 5) -->
  <rect x="118" y="392" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="138" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="138" y="438" text-anchor="middle" font-size="9" fill="#999">2</text>
  <!-- building 3: h=2 -->
  <rect x="166" y="364" width="40" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="186" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="186" y="438" text-anchor="middle" font-size="9" fill="#999">3</text>
  <!-- building 4: h=3 -->
  <rect x="214" y="336" width="40" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="234" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="234" y="438" text-anchor="middle" font-size="9" fill="#999">4</text>
  <!-- building 5: h=3 (restricted) -->
  <rect x="262" y="336" width="40" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="282" y="438" text-anchor="middle" font-size="9" fill="#999">5</text>
  <!-- building 6: h=4 -->
  <rect x="310" y="308" width="40" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="330" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="330" y="438" text-anchor="middle" font-size="9" fill="#999">6</text>
  <!-- building 7: h=4 (restricted) -->
  <rect x="358" y="308" width="40" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="378" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="378" y="438" text-anchor="middle" font-size="9" fill="#999">7</text>
  <!-- building 8: h=5 (PEAK) -->
  <rect x="406" y="280" width="40" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="426" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="426" y="438" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">8</text>
  <!-- building 9: h=4 -->
  <rect x="454" y="308" width="40" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="474" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="474" y="438" text-anchor="middle" font-size="9" fill="#999">9</text>
  <!-- building 10: h=3 (restricted) -->
  <rect x="502" y="336" width="40" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="522" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="522" y="438" text-anchor="middle" font-size="9" fill="#999">10</text>

  <!-- original cap at building 2 (5) shown as faded dashed -->
  <line x1="118" y1="280" x2="158" y2="280" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" filter="url(#rough2)"/>
  <text x="178" y="284" font-size="9" fill="#b85450" opacity="0.7">原cap=5</text>
  <!-- arrow from cap to tightened -->
  <path d="M 138 286 L 138 388" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" opacity="0.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- peak annotation: segment (7,4)->(10,3), d=3 -->
  <g filter="url(#rough2)">
    <rect x="358" y="252" width="184" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
  </g>
  <text x="450" y="267" text-anchor="middle" font-size="10" fill="#5a4a1a">⌊(4+3+3)/2⌋ = 5  (段 7→10)</text>
  <!-- bracket connecting buildings 7-10 at peak level -->
  <path d="M 378 276 L 378 270 L 522 270 L 522 276" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- restriction markers (dots above restricted buildings) -->
  <g filter="url(#rough2)">
    <circle cx="138" cy="388" r="3" fill="#d6a040"/>
    <circle cx="282" cy="332" r="3" fill="#d6a040"/>
    <circle cx="378" cy="304" r="3" fill="#d6a040"/>
    <circle cx="522" cy="332" r="3" fill="#d6a040"/>
  </g>

  <!-- peak star -->
  <text x="426" y="272" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">★</text>

  <!-- ===== Segment peak computation summary (bottom) ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="452" width="540" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" rx="8"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="56" y="470">段(1→2):</text>
    <text x="116" y="470" fill="#555">⌊(0+1+1)/2⌋=1</text>
    <text x="196" y="470">段(2→5):</text>
    <text x="256" y="470" fill="#555">⌊(1+3+3)/2⌋=3</text>
    <text x="336" y="470">段(5→7):</text>
    <text x="396" y="470" fill="#555">⌊(3+4+2)/2⌋=4</text>
    <text x="476" y="470">段(7→10):</text>
    <text x="536" y="470" fill="#d6a040" font-weight="bold">⌊10/2⌋=5</text>
    <text x="200" y="486" fill="#4a7a3a" font-weight="bold">max(1, 3, 4, 5, 3) = 5 ✓</text>
  </g>
</svg>
