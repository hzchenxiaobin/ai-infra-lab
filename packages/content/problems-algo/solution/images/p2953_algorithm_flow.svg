<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 676" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="676" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：切段 + 枚举种类数 m + 定长滑窗，O(26n)</text>

  <ellipse cx="250" cy="54" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="59" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 250 72 L 250 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="86" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="12" fill="#333">① 扫描：相邻差 &gt; 2 处切段，得段 [start, i)</text>

  <path d="M 250 122 L 250 134" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="136" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="158" text-anchor="middle" font-size="12" fill="#333">② 枚举 m = 1..26：win = m·k（win &gt; 段长则换段）</text>

  <path d="M 250 172 L 250 184" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="186" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="208" text-anchor="middle" font-size="12" fill="#333">③ cnt[26] = 0，valid = 0，j = start</text>

  <path d="M 250 222 L 250 234" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="236" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="258" text-anchor="middle" font-size="12" fill="#333">④ j 进窗：cnt[c]++（跨 k / k+1 边界增减 valid）</text>

  <path d="M 250 272 L 250 284" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="286" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="308" text-anchor="middle" font-size="12" fill="#333">⑤ 窗口超长：弹出 word[j−win]，对称修正 valid</text>

  <path d="M 250 322 L 250 338" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="250,340 380,378 250,416 120,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="12" fill="#333">长度 == win 且</text>
  <text x="250" y="390" text-anchor="middle" font-size="12" fill="#333">valid == m？</text>

  <path d="M 380 378 L 424 378" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <rect x="428" y="360" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="382" text-anchor="middle" font-size="12" fill="#333">ans += 1</text>

  <path d="M 480 396 L 480 433 L 260 433" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <path d="M 250 416 L 250 450" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="262" y="436" font-size="11" fill="#b85450">否</text>

  <polygon points="250,450 360,488 250,526 140,488" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="493" text-anchor="middle" font-size="12" fill="#333">j 到段尾？</text>

  <path d="M 140 488 L 48 488 L 48 254 L 106 254" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="66" y="478" text-anchor="middle" font-size="11" fill="#446688">否：j++ 右移</text>

  <path d="M 250 526 L 250 544" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="262" y="540" font-size="11" fill="#b85450">是</text>

  <polygon points="250,546 372,584 250,622 128,584" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="580" text-anchor="middle" font-size="12" fill="#333">还有下一个 m</text>
  <text x="250" y="598" text-anchor="middle" font-size="12" fill="#333">或下一段？</text>

  <path d="M 372 584 L 520 584 L 520 154 L 396 154" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="392" y="574" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <text x="494" y="574" text-anchor="middle" font-size="11" fill="#d6a040">下个 m / 换段</text>

  <path d="M 250 622 L 250 638" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="262" y="634" font-size="11" fill="#b85450">否</text>

  <ellipse cx="250" cy="656" rx="62" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="661" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>
</svg>
