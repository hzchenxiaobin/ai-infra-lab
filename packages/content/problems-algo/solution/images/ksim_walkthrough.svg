<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s1 = "bcaa", s2 = "aabc" → 答案 2</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">BFS 逐层扩展，首个错位 i=0 需 'a'，候选 j ∈ {2, 3}</text>

  <!-- ===== Level 0 ===== -->
  <text x="40" y="92" font-size="11" fill="#888">dist=0</text>
  <rect x="80" y="76" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bcaa</text>

  <!-- swap labels on edges -->
  <path d="M 130 110 L 200 170" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="138" font-size="10" fill="#4a7a3a">swap(0,2)</text>
  <path d="M 150 110 L 380 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="138" font-size="10" fill="#666">swap(0,3)</text>

  <!-- ===== Level 1: left "acba" (optimal branch) ===== -->
  <text x="40" y="192" font-size="11" fill="#888">dist=1</text>
  <rect x="170" y="176" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">acba</text>

  <!-- ===== Level 1: right "acab" (suboptimal branch) ===== -->
  <rect x="350" y="176" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">acab</text>

  <!-- annotations -->
  <text x="220" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a">i=1 需 'a'，候选 j=3</text>
  <text x="400" y="226" text-anchor="middle" font-size="10" fill="#888">i=1 需 'a'，候选 j=2</text>

  <!-- edges to level 2 -->
  <path d="M 220 210 L 220 268" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="244" font-size="10" fill="#4a7a3a">swap(1,3)</text>
  <path d="M 400 210 L 400 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="244" font-size="10" fill="#666">swap(1,2)</text>

  <!-- ===== Level 2 ===== -->
  <text x="40" y="292" font-size="11" fill="#888">dist=2</text>
  <!-- left: aabc == s2 (FOUND) -->
  <rect x="160" y="272" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="294" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">aabc</text>
  <text x="220" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">== s2 ✓ 命中</text>
  <!-- right: aacb (continue) -->
  <rect x="340" y="272" width="120" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="294" text-anchor="middle" font-size="13" fill="#999">aacb</text>
  <text x="400" y="308" text-anchor="middle" font-size="10" fill="#888">≠ s2，继续扩展…</text>

  <!-- ===== Result banner ===== -->
  <rect x="80" y="338" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">BFS 在 dist=2 层命中 s2 → 返回 2</text>
  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a">右侧分支需 dist=3 才到 s2，BFS 保证取最短</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="400" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为什么 BFS 而非 DFS / 贪心？</text>
  <text x="310" y="436" text-anchor="middle" font-size="11" fill="#666">每次交换边权为 1，BFS 首次抵达即最短；DFS 可能先走长路</text>
  <text x="310" y="452" text-anchor="middle" font-size="11" fill="#666">贪心"局部修复"未必全局最优（如右支 swap(0,3) 一眼看似也对齐了 i=0）</text>
</svg>
