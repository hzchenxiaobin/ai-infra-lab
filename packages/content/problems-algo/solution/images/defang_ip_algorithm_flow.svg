<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：逐字符扫描 + 条件追加</text>

  <!-- Start node -->
  <rect x="200" y="48" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：res = ""</text>

  <!-- arrow down -->
  <path d="M 260 84 L 260 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 0 -->
  <rect x="200" y="108" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <!-- arrow down to diamond -->
  <path d="M 260 142 L 260 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < len(address)? -->
  <polygon points="260,166 360,210 260,254 160,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#333">i &lt; len?</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#888">(还有字符)</text>

  <!-- No branch: down to return -->
  <path d="M 260 254 L 260 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="274" font-size="10" fill="#888">否</text>

  <rect x="190" y="288" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 res</text>

  <!-- Yes branch: right to char check -->
  <path d="M 360 210 L 400 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="202" font-size="10" fill="#888">是</text>

  <!-- Diamond: address[i] == '.'? -->
  <polygon points="430,176 480,210 430,244 380,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="214" text-anchor="middle" font-size="10" fill="#333">=='.'?</text>

  <!-- Yes (is dot): up to append [.] -->
  <path d="M 430 176 L 430 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="160" font-size="10" fill="#888">是</text>

  <rect x="378" y="100" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="123" text-anchor="middle" font-size="11" fill="#333">res += "[.]"</text>

  <!-- No (not dot): down to append char -->
  <path d="M 430 244 L 430 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="266" font-size="10" fill="#888">否</text>

  <rect x="372" y="282" width="116" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="305" text-anchor="middle" font-size="11" fill="#333">res += address[i]</text>

  <!-- both branches merge: i++ then loop back -->
  <path d="M 430 136 L 430 120 L 260 120 L 260 108" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 430 318 L 430 338 L 120 338 L 120 126 L 200 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ label on loopback -->
  <rect x="100" y="118" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="134" text-anchor="middle" font-size="10" fill="#666">i++</text>

  <!-- Bottom note -->
  <rect x="60" y="370" width="420" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="394" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">本质：单趟扫描 + 逐字符判定，无需额外数据结构</text>
  <text x="270" y="414" text-anchor="middle" font-size="11" fill="#666">每个字符恰好处理一次，时间 O(n)；结果串最多增长 3 倍长度</text>
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#888">也可一步到位用内置 replace(address, ".", "[.]")</text>
</svg>
