<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三指针求三个有序数组的交集</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">arr1=[1,2,3,4,5]，arr2=[1,2,5,7,9]，arr3=[1,3,4,5,8]</text>

  <!-- arr1 row -->
  <text x="50" y="84" font-size="12" fill="#446688" font-weight="bold">arr1</text>
  <rect x="100" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="90" text-anchor="middle" font-size="13" fill="#446688">1</text>
  <rect x="146" y="70" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="90" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="192" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="90" text-anchor="middle" font-size="13" fill="#446688">3</text>
  <rect x="238" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="13" fill="#446688">4</text>
  <rect x="284" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="90" text-anchor="middle" font-size="13" fill="#446688">5</text>
  <text x="168" y="62" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ i</text>

  <!-- arr2 row -->
  <text x="50" y="140" font-size="12" fill="#4a7a3a" font-weight="bold">arr2</text>
  <rect x="100" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a">1</text>
  <rect x="146" y="126" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="192" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a">5</text>
  <rect x="238" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <rect x="284" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a">9</text>
  <text x="168" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ j</text>

  <!-- arr3 row -->
  <text x="50" y="196" font-size="12" fill="#d6a040" font-weight="bold">arr3</text>
  <rect x="100" y="182" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="202" text-anchor="middle" font-size="13" fill="#d6a040">1</text>
  <rect x="146" y="182" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="202" text-anchor="middle" font-size="13" fill="#d6a040">3</text>
  <rect x="192" y="182" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="202" text-anchor="middle" font-size="13" fill="#d6a040">4</text>
  <rect x="238" y="182" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="13" fill="#d6a040">5</text>
  <rect x="284" y="182" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="202" text-anchor="middle" font-size="13" fill="#d6a040">8</text>
  <text x="214" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ k</text>

  <!-- snapshot values -->
  <rect x="380" y="110" width="150" height="96" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="130" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前指向的值</text>
  <text x="455" y="152" text-anchor="middle" font-size="12" fill="#446688">arr1[i] = 2</text>
  <text x="455" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a">arr2[j] = 2</text>
  <text x="455" y="188" text-anchor="middle" font-size="12" fill="#d6a040">arr3[k] = 4</text>
  <text x="455" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最小 = 2 → 推进 i、j</text>

  <!-- rule boxes -->
  <rect x="40" y="250" width="230" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">三者相等 a==b==c</text>
  <text x="155" y="292" text-anchor="middle" font-size="11" fill="#555">加入结果，i++、j++、k++ 全部前进</text>

  <rect x="290" y="250" width="230" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">否则不相等</text>
  <text x="405" y="292" text-anchor="middle" font-size="11" fill="#555">推进指向最小值的指针（可同时推多个）</text>

  <!-- summary -->
  <rect x="40" y="328" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">不变式：三指针只前进不后退</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">每次推进最小者，绝不跳过任何交集元素 → O(n₁+n₂+n₃) / O(1) 额外空间</text>
</svg>
