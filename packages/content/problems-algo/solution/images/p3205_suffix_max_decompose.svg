<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：把每一跳摊成「单位段」，每段贡献 = 落点值</text>

  <!-- nums 行：7 格 w=44 gap=8，start x=82 -->
  <rect x="82" y="40" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="104" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>

  <rect x="134" y="40" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="156" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>

  <rect x="186" y="40" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>

  <rect x="238" y="40" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="260" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>

  <rect x="290" y="40" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="61" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="312" y="88" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">4</text>

  <rect x="342" y="40" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="364" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>

  <rect x="394" y="40" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="61" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="416" y="88" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">6</text>

  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">跳跃链 0→4→6 按单位长度摊开：段 [t−1, t] 的贡献 = 覆盖它的那一跳的落点值</text>
  <path d="M 260 118 L 260 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 单位段行：6 格 w=56 gap=10，start x=67 -->
  <rect x="67" y="134" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="158" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="95" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=1</text>

  <rect x="133" y="134" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="158" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="161" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=2</text>

  <rect x="199" y="134" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="158" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="227" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=3</text>

  <rect x="265" y="134" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="293" y="158" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="293" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=4</text>

  <rect x="331" y="134" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="158" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="359" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=5</text>

  <rect x="397" y="134" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="158" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="425" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=6</text>

  <!-- 承包括号 -->
  <path d="M 67 194 L 67 204 L 321 204 L 321 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="194" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">跳 0→4 承包：每段 = nums[4] = 9（右侧最大值）</text>

  <path d="M 331 194 L 331 204 L 453 204 L 453 194" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="392" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">跳 4→6 承包：每段 = nums[6] = 3</text>

  <!-- 公式框 -->
  <rect x="45" y="252" width="430" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">上界：落点(t) ≥ t ⟹ 每段贡献 ≤ max(nums[t..n−1])</text>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans ≤ Σ max(nums[t..n−1]) = 9+9+9+9+3+3 = 42</text>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每跳都落在「右侧最大值」⟹ 每段取满上界 ⟹ 42 可达 ✓</text>

  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一句话：ans = 后缀最大值之和，从右往左一趟即可</text>
</svg>
