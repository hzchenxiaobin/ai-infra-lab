<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums1 = [1,2,4,12]，nums2 = [2,4]，k = 3</text>

  <rect x="49" y="273" width="442" height="31" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="49" y="304" width="442" height="31" fill="#e6f4ea" filter="url(#rough2)"/>

  <rect x="48" y="48" width="444" height="288" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="48" y="48" width="444" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <line x1="134" y1="48" x2="134" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="208" y1="48" x2="208" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="312" y1="48" x2="312" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="48" x2="380" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="444" y1="48" x2="444" y2="336" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <line x1="48" y1="112" x2="492" y2="112" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="144" x2="492" y2="144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="176" x2="492" y2="176" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="208" x2="492" y2="208" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="240" x2="492" y2="240" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="272" x2="492" y2="272" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="48" y1="304" x2="492" y2="304" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="91" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(i, j)</text>
  <text x="171" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1[i]</text>
  <text x="260" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2[j]×k</text>
  <text x="346" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">余数</text>
  <text x="412" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数对?</text>
  <text x="468" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="91" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 0)</text>
  <text x="171" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="100" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">6</text>
  <text x="346" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="171" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="132" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <text x="346" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <text x="171" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="260" y="164" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">6</text>
  <text x="346" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="171" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="260" y="196" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <text x="346" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 0)</text>
  <text x="171" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">6</text>
  <text x="346" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="412" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 1)</text>
  <text x="171" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <text x="346" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="412" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="91" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(3, 0)</text>
  <text x="171" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="346" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="412" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="468" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="91" y="324" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(3, 1)</text>
  <text x="171" y="324" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="346" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="412" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="468" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="32" y="352" width="456" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">只有 12 能被 6 与 12 整除：(3,0)、(3,1) 各记一个 ✓ → 答案 2</text>

  <rect x="32" y="398" width="456" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="421" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">对照示例 1（k = 1）：[1,3,4] × [1,3,4] 网格共 9 格，5 格 ✓ → 答案 5</text>
</svg>
