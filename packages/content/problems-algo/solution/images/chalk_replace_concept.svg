<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每轮消耗固定，取余跳过完整轮次</text>

  <!-- Students row -->
  <text x="30" y="70" font-size="12" fill="#888">chalk:</text>
  <rect x="80" y="54" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="150" y="54" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="220" y="54" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="76" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="290" y="54" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Student indices -->
  <text x="110" y="48" text-anchor="middle" font-size="10" fill="#888">学生0</text>
  <text x="180" y="48" text-anchor="middle" font-size="10" fill="#888">学生1</text>
  <text x="250" y="48" text-anchor="middle" font-size="10" fill="#888">学生2</text>
  <text x="320" y="48" text-anchor="middle" font-size="10" fill="#888">学生3</text>

  <!-- Cyclic arrow -->
  <path d="M 320 95 Q 200 130 110 95" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="125" text-anchor="middle" font-size="10" fill="#888">循环往复</text>

  <!-- Round total box -->
  <rect x="80" y="140" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一轮消耗 total</text>
  <text x="180" y="175" text-anchor="middle" font-size="11" fill="#555">total = 3+4+1+2 = 10</text>

  <!-- k arrow -->
  <text x="310" y="160" font-size="12" fill="#888">k =</text>
  <rect x="340" y="146" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">25</text>

  <!-- Modulo step -->
  <rect x="80" y="205" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = k % total = 25 % 10</text>
  <text x="260" y="245" text-anchor="middle" font-size="11" fill="#555">一次性跳过 ⌊25/10⌋ = 2 个完整轮次</text>

  <!-- Arrow down to result -->
  <path d="M 260 255 L 260 270" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="150" y="278" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">rem = 5 &lt; total = 10</text>
  <text x="260" y="315" text-anchor="middle" font-size="11" fill="#555">下一轮内必出现首个不足者</text>

  <!-- Summary -->
  <rect x="40" y="332" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888">周期消耗类问题通用套路：取余压缩周期 → 线性扫描余数</text>
</svg>
