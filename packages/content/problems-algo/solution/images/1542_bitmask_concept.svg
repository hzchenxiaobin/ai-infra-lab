<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：可重排回文 ⇔ 奇偶掩码 popcount ≤ 1</text>

  <!-- substring row "24241" -->
  <text x="36" y="66" font-size="12" fill="#888">子串:</text>
  <rect x="86" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="70" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="126" y="50" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="70" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="166" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="70" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="206" y="50" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="70" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="246" y="50" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="300" y="70" font-size="11" fill="#888">→ 回文 24142</text>

  <!-- frequency line -->
  <text x="36" y="106" font-size="12" fill="#888">频次:</text>
  <text x="92" y="106" font-size="12" fill="#333">2: <tspan font-weight="bold" fill="#4a7a3a">偶</tspan>(2次)</text>
  <text x="200" y="106" font-size="12" fill="#333">4: <tspan font-weight="bold" fill="#4a7a3a">偶</tspan>(2次)</text>
  <text x="308" y="106" font-size="12" fill="#333">1: <tspan font-weight="bold" fill="#b85450">奇</tspan>(1次)</text>
  <rect x="412" y="92" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="472" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">奇位 ≤ 1 个 ✓</text>

  <!-- equivalence chain box -->
  <rect x="40" y="126" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">可交换成回文  ⇔  奇数次字符 ≤ 1 个</text>
  <text x="280" y="174" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔  10 位奇偶掩码 popcount ≤ 1</text>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#444">mask = 0（全偶）或 mask = 2^d（恰一奇）</text>

  <!-- mask visualization: 10 bits -->
  <text x="36" y="244" font-size="12" fill="#888">掩码(10位):</text>
  <g filter="url(#rough2)">
    <rect x="124" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="150" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="176" y="230" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="202" y="230" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="228" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="254" y="230" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="280" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="306" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="332" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="358" y="230" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <text x="137" y="276" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="163" y="276" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="189" y="276" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="215" y="276" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="241" y="276" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="267" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="293" y="276" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="319" y="276" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="345" y="276" text-anchor="middle" font-size="9" fill="#888">5*</text>
  <text x="371" y="276" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="267" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="396" y="234" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="456" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">popcount=1 ✓</text>

  <!-- prefix xor reduction -->
  <rect x="40" y="294" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">子串奇偶掩码 = pref[r+1] ⊕ pref[l]</text>
  <text x="280" y="338" text-anchor="middle" font-size="11.5" fill="#444">欲使结果 popcount ≤ 1：pref[l] = mask 或 mask ⊕ 2^d</text>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#4a7a3a">哈希表存每个掩码的「最早下标」，命中即得最长</text>
</svg>
