<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：逐格累加孤立面 − 逐对减重叠</text>

  <!-- ===== 示例 1: [[1,2],[3,4]] ===== -->
  <rect x="24" y="46" width="632" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="44" y="70" font-size="13" fill="#446688" font-weight="bold">示例 1：grid = [[1,2],[3,4]]</text>

  <!-- mini grid -->
  <rect x="48" y="84" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="103" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="82" y="84" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="99" y="103" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="48" y="112" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="82" y="112" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <!-- 表头 -->
  <text x="150" y="96" font-size="11" fill="#888" font-weight="bold">格子</text>
  <text x="218" y="96" font-size="11" fill="#888" font-weight="bold">v</text>
  <text x="262" y="96" font-size="11" fill="#4a7a3a" font-weight="bold">孤立 4v+2</text>
  <text x="362" y="96" font-size="11" fill="#d6a040" font-weight="bold">右邻 → 扣 2·min</text>
  <text x="482" y="96" font-size="11" fill="#d6a040" font-weight="bold">下邻 → 扣 2·min</text>
  <text x="600" y="96" font-size="11" fill="#b85450" font-weight="bold">净贡献</text>
  <line x1="140" y1="104" x2="640" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 (0,0) v=1 -->
  <text x="150" y="124" font-size="11" fill="#333">(0,0)</text>
  <text x="218" y="124" font-size="11" fill="#333">1</text>
  <text x="262" y="124" font-size="11" fill="#4a7a3a">+6</text>
  <text x="362" y="124" font-size="11" fill="#d6a040">min(1,2)=1 → −2</text>
  <text x="482" y="124" font-size="11" fill="#d6a040">min(1,3)=1 → −2</text>
  <text x="600" y="124" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- 行 (0,1) v=2 -->
  <text x="150" y="146" font-size="11" fill="#333">(0,1)</text>
  <text x="218" y="146" font-size="11" fill="#333">2</text>
  <text x="262" y="146" font-size="11" fill="#4a7a3a">+10</text>
  <text x="362" y="146" font-size="11" fill="#888">（边界，无）</text>
  <text x="482" y="146" font-size="11" fill="#d6a040">min(2,4)=2 → −4</text>
  <text x="600" y="146" font-size="11" fill="#b85450" font-weight="bold">6</text>

  <!-- 行 (1,0) v=3 -->
  <text x="150" y="168" font-size="11" fill="#333">(1,0)</text>
  <text x="218" y="168" font-size="11" fill="#333">3</text>
  <text x="262" y="168" font-size="11" fill="#4a7a3a">+14</text>
  <text x="362" y="168" font-size="11" fill="#d6a040">min(3,4)=3 → −6</text>
  <text x="482" y="168" font-size="11" fill="#888">（边界，无）</text>
  <text x="600" y="168" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <!-- 行 (1,1) v=4 -->
  <text x="150" y="190" font-size="11" fill="#333">(1,1)</text>
  <text x="218" y="190" font-size="11" fill="#333">4</text>
  <text x="262" y="190" font-size="11" fill="#4a7a3a">+18</text>
  <text x="362" y="190" font-size="11" fill="#888">（边界，无）</text>
  <text x="482" y="190" font-size="11" fill="#888">（边界，无）</text>
  <text x="600" y="190" font-size="11" fill="#b85450" font-weight="bold">18</text>

  <line x1="140" y1="200" x2="640" y2="200" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="262" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">孤立和 = 48</text>
  <text x="362" y="222" font-size="11" fill="#d6a040" font-weight="bold">扣除和 = 2+2+4+6 = 14</text>
  <text x="540" y="222" font-size="11" fill="#555">每对只扣一次</text>

  <!-- 结果 -->
  <rect x="220" y="238" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">总面积 = 48 − 14 = 34 ✓</text>
  <text x="360" y="282" text-anchor="middle" font-size="10" fill="#888">（= 净贡献求和 2+6+8+18）</text>

  <!-- ===== 示例 4 简表 ===== -->
  <rect x="24" y="308" width="632" height="146" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="44" y="332" font-size="13" fill="#b85450" font-weight="bold">示例 4：grid = [[2,2,2],[2,1,2],[2,2,2]]</text>

  <!-- mini grid 3x3 -->
  <g font-size="12" fill="#b85450" font-weight="bold">
    <rect x="48" y="346" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="62" y="362" text-anchor="middle">2</text>
    <rect x="76" y="346" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="90" y="362" text-anchor="middle">2</text>
    <rect x="104" y="346" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="118" y="362" text-anchor="middle">2</text>
    <rect x="48" y="370" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="62" y="386" text-anchor="middle">2</text>
    <rect x="76" y="370" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="90" y="386" text-anchor="middle" fill="#446688">1</text>
    <rect x="104" y="370" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="118" y="386" text-anchor="middle">2</text>
    <rect x="48" y="394" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="62" y="410" text-anchor="middle">2</text>
    <rect x="76" y="394" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="90" y="410" text-anchor="middle">2</text>
    <rect x="104" y="394" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="118" y="410" text-anchor="middle">2</text>
  </g>

  <text x="160" y="360" font-size="11" fill="#555">孤立和：8 个塔 v=2 (各 10) + 中心 v=1 (6) = 86</text>
  <text x="160" y="382" font-size="11" fill="#555">相邻 min 之和：水平 4+2+4=10，竖直 4+2+4=10，共 20</text>
  <text x="160" y="404" font-size="11" fill="#555">隐藏面 = 2 × 20 = 40</text>
  <rect x="160" y="418" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">总面积 = 86 − 40 = 46 ✓</text>
</svg>
