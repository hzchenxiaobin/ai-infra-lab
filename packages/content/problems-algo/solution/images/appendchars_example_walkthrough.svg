<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="384" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "coaching", t = "coding"</text>

  <!-- ===== table ===== -->
  <!-- columns: step[30-80] i[80-120] j[120-160] s[i][160-220] t[j][220-280] match[280-350] action[350-510] -->
  <!-- header row y=44-74 -->
  <rect x="30" y="44" width="480" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="100" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="140" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">j</text>
  <text x="190" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <text x="250" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">t[j]</text>
  <text x="315" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">匹配</text>
  <text x="430" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">动作</text>

  <!-- column separators (drawn over all rows) -->
  <line x1="80" y1="44" x2="80" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="44" x2="120" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="44" x2="160" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="44" x2="220" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="44" x2="280" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="44" x2="350" y2="298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows: matched(1,2) green tint #e6f4ea, no-match(3-8) orange tint #fff8e1 -->
  <!-- row 1 y=74-100 -->
  <rect x="30" y="74" width="480" height="26" fill="#e6f4ea" stroke="#cfe8cf" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="91" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="100" y="91" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="91" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="190" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="250" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="315" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="91" font-size="11" fill="#4a7a3a" font-weight="bold">j=1, i=1</text>

  <!-- row 2 y=100-126 -->
  <rect x="30" y="100" width="480" height="26" fill="#e6f4ea" stroke="#cfe8cf" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="117" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="100" y="117" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="117" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="190" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
  <text x="250" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
  <text x="315" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="117" font-size="11" fill="#4a7a3a" font-weight="bold">j=2, i=2</text>

  <!-- rows 3-8 no match, orange -->
  <!-- row 3 -->
  <rect x="30" y="126" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="143" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="143" text-anchor="middle" font-size="11" fill="#999">a</text>
  <text x="250" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="143" font-size="11" fill="#888">i=3（s 跳过 a）</text>

  <!-- row 4 -->
  <rect x="30" y="152" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="169" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="100" y="169" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="140" y="169" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="169" text-anchor="middle" font-size="11" fill="#999">c</text>
  <text x="250" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="169" font-size="11" fill="#888">i=4</text>

  <!-- row 5 -->
  <rect x="30" y="178" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="195" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="100" y="195" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="#999">h</text>
  <text x="250" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="195" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="195" font-size="11" fill="#888">i=5</text>

  <!-- row 6 -->
  <rect x="30" y="204" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="221" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="100" y="221" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="221" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="221" text-anchor="middle" font-size="11" fill="#999">i</text>
  <text x="250" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="221" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="221" font-size="11" fill="#888">i=6</text>

  <!-- row 7 -->
  <rect x="30" y="230" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="247" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="100" y="247" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="140" y="247" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="247" text-anchor="middle" font-size="11" fill="#999">n</text>
  <text x="250" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="247" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="247" font-size="11" fill="#888">i=7</text>

  <!-- row 8 -->
  <rect x="30" y="256" width="480" height="26" fill="#fce4ec" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="273" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="100" y="273" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="140" y="273" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="273" text-anchor="middle" font-size="11" fill="#999">g</text>
  <text x="250" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="315" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="360" y="273" font-size="11" fill="#b85450" font-weight="bold">i=8（s 用尽）</text>

  <!-- outer table border -->
  <rect x="30" y="44" width="480" height="254" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- arrow down to result -->
  <path d="M 270 300 L 270 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="40" y="318" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j = 2 → 返回 |t| − j = 6 − 2 = 4（向 s 末尾追加 "ding"）</text>

  <!-- note -->
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#888">s 只匹配到 t 的前缀 "co"，其后 t[j..] 必须整段追加</text>
</svg>
