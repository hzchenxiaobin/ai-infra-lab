<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：顺序影响成败 → 排序后贪心吸收</text>

  <!-- ① 顺序为何重要：mass=3, asteroids=[5,2] -->
  <text x="40" y="58" font-size="12" fill="#b85450" font-weight="bold">① 反例：顺序不同，结局不同（mass=3, asteroids=[5,2]）</text>

  <!-- 顺序 [5,2] 失败 -->
  <text x="50" y="80" font-size="10" fill="#888">顺序 [5, 2]：</text>
  <!-- planet mass 3 -->
  <rect x="120" y="68" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="172" y="84" font-size="10" fill="#888">撞</text>
  <!-- asteroid 5 -->
  <circle cx="208" cy="81" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="228" y="78" font-size="9" fill="#b85450">3 &lt; 5</text>
  <!-- explosion -->
  <path d="M 250 81 L 278 81" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="78" font-size="11" fill="#b85450" font-weight="bold">💥 行星毁灭 ✗</text>

  <!-- 顺序 [2,5] 成功 -->
  <text x="50" y="118" font-size="10" fill="#888">顺序 [2, 5]：</text>
  <!-- planet mass 3 -->
  <rect x="120" y="106" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="172" y="122" font-size="10" fill="#888">撞</text>
  <!-- asteroid 2 -->
  <circle cx="208" cy="119" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="228" y="116" font-size="9" fill="#4a7a3a">3≥2 → +2</text>
  <path d="M 268 119 L 292 119" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <!-- planet mass 5 -->
  <rect x="296" y="106" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="348" y="122" font-size="10" fill="#888">撞</text>
  <!-- asteroid 5 -->
  <circle cx="384" cy="119" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="404" y="116" font-size="9" fill="#4a7a3a">5≥5 → +5</text>
  <path d="M 444 119 L 468 119" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="488" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">成功 ✓</text>

  <!-- ② 交换论证 -->
  <text x="40" y="160" font-size="12" fill="#d6a040" font-weight="bold">② 交换论证：相邻「大在前 小在后」可安全交换为「小在前 大在后」</text>

  <rect x="40" y="172" width="520" height="92" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- before swap -->
  <text x="56" y="194" font-size="10" fill="#888">交换前（大 x 在前）：</text>
  <rect x="60" y="200" width="40" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="10" fill="#446688">M</text>
  <text x="106" y="214" font-size="9" fill="#888">→</text>
  <circle cx="130" cy="211" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x</text>
  <text x="148" y="208" font-size="9" fill="#4a7a3a">M≥x</text>
  <text x="150" y="222" font-size="9" fill="#888">(有效前提)</text>
  <text x="186" y="214" font-size="9" fill="#888">→</text>
  <rect x="196" y="200" width="40" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="216" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">M+x</text>
  <text x="244" y="214" font-size="9" fill="#888">→</text>
  <circle cx="270" cy="211" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">y</text>

  <!-- swap arrow -->
  <path d="M 150 234 Q 210 250 270 234" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="210" y="252" text-anchor="middle" font-size="9" fill="#d6a040">交换</text>

  <!-- after swap -->
  <text x="312" y="194" font-size="10" fill="#888">交换后（小 y 在前）：</text>
  <rect x="316" y="200" width="40" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="216" text-anchor="middle" font-size="10" fill="#446688">M</text>
  <text x="362" y="214" font-size="9" fill="#888">→</text>
  <circle cx="386" cy="211" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">y</text>
  <text x="404" y="208" font-size="9" fill="#4a7a3a">M≥x&gt;y</text>
  <text x="406" y="222" font-size="9" fill="#888">(必能吞 y)</text>
  <text x="442" y="214" font-size="9" fill="#888">→</text>
  <rect x="452" y="200" width="44" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="474" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">M+y</text>
  <text x="504" y="214" font-size="9" fill="#888">→</text>
  <circle cx="530" cy="211" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">x</text>

  <text x="56" y="256" font-size="10" fill="#555">∵ M ≥ x &gt; y ⇒ 吞 y 后 M+y ≥ M ≥ x ⇒ 仍能吞 x。交换不破坏可行性，故「小在前」总不劣于「大在前」。</text>

  <!-- ③ 结论 -->
  <text x="40" y="290" font-size="12" fill="#4a7a3a" font-weight="bold">③ 结论：排序升序 + 逐个贪心吸收，是「最宽松」的顺序</text>

  <rect x="40" y="302" width="520" height="148" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="12" fill="#444" font-weight="bold">排序 + 贪心 = 本题最优策略</text>
  <text x="60" y="348" font-size="11" fill="#555">· 任意逆序对（大在前）都可交换为「小在前」而不破坏可行性</text>
  <text x="60" y="368" font-size="11" fill="#555">· 反复交换消除所有逆序对 ⇒ 升序排列可行性 ⊇ 任何排列可行性</text>
  <text x="60" y="388" font-size="11" fill="#555">· 即：若存在任意合法顺序，则升序顺序必合法（充要性）</text>
  <text x="60" y="410" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ 算法：sort(asteroids) 升序，逐个比较 mass ≥ a 即吸收，否则 false</text>
  <text x="60" y="432" font-size="10" fill="#888">贪心直觉：先吃软柿子攒质量，再啃硬骨头——每步让 mass 增长尽可能「轻松且充分」</text>
</svg>
