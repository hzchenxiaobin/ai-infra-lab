<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">插入策略：插 pattern[0] 于最左 vs 插 pattern[1] 于最右</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">pattern = "ac"：插入后新增子序列 = 新字符与原 text 中配对字符的组合数</text>

  <!-- ===== Strategy 1: Insert pattern[0] at leftmost ===== -->
  <text x="30" y="78" font-size="12" fill="#b85450" font-weight="bold">策略 1：插入 pattern[0] = 'a' 于最左端</text>

  <!-- inserted a box -->
  <rect x="40" y="90" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="112" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a*</text>
  <text x="62" y="84" text-anchor="middle" font-size="9" fill="#b85450">插入</text>

  <!-- original text boxes -->
  <g font-size="12">
    <rect x="92" y="90" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="112" text-anchor="middle" fill="#446688">a</text>
    <rect x="132" y="90" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="150" y="112" text-anchor="middle" fill="#888">b</text>
    <rect x="172" y="90" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="190" y="112" text-anchor="middle" fill="#888">d</text>
    <rect x="212" y="90" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="230" y="112" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="252" y="90" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="270" y="112" text-anchor="middle" fill="#888">d</text>
    <rect x="292" y="90" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="310" y="112" text-anchor="middle" fill="#888">b</text>
    <rect x="332" y="90" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="350" y="112" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
  </g>

  <!-- pairing arrows from inserted a to each c -->
  <path d="M 62 126 Q 62 150 230 88" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 62 126 Q 62 165 350 88" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="400" y="108" font-size="11" fill="#b85450" font-weight="bold">增量 = cntB = 2</text>
  <text x="400" y="124" font-size="10" fill="#888">新 a 与每个 c 配对</text>

  <!-- ===== Strategy 2: Insert pattern[1] at rightmost ===== -->
  <text x="30" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">策略 2：插入 pattern[1] = 'c' 于最右端</text>

  <!-- original text boxes -->
  <g font-size="12">
    <rect x="40" y="190" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="58" y="212" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="80" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="98" y="212" text-anchor="middle" fill="#888">b</text>
    <rect x="120" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="138" y="212" text-anchor="middle" fill="#888">d</text>
    <rect x="160" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="178" y="212" text-anchor="middle" fill="#888">c</text>
    <rect x="200" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="218" y="212" text-anchor="middle" fill="#888">d</text>
    <rect x="240" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="258" y="212" text-anchor="middle" fill="#888">b</text>
    <rect x="280" y="190" width="36" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="298" y="212" text-anchor="middle" fill="#888">c</text>
  </g>

  <!-- inserted c box -->
  <rect x="320" y="190" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">c*</text>
  <text x="342" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">插入</text>

  <!-- pairing arrow from a to inserted c -->
  <path d="M 58 226 Q 58 250 342 188" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="400" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">增量 = cntA = 1</text>
  <text x="400" y="224" font-size="10" fill="#888">新 c 与每个 a 配对</text>

  <!-- ===== Conclusion ===== -->
  <rect x="30" y="268" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="290" font-size="12" fill="#d6a040" font-weight="bold">最优增量 = max(cntA, cntB) = max(1, 2) = 2</text>
  <text x="48" y="308" font-size="10" fill="#888">选策略 1（插 a 于最左），因为 cntB &gt; cntA → 插入 pattern[0] 增益更大</text>

  <!-- ===== Formula ===== -->
  <rect x="30" y="338" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">答案 = existing（原有子序列数）+ max(cntA, cntB)（最优插入增量）</text>
</svg>
