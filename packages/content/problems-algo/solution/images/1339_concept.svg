<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">删一条边 = 选一棵非根子树：两半和为 S 与 total−S，乘积 = S×(total−S)</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">示例 1：total = 21，切掉节点 2 这条边 → 子树{2,4,5}=11，剩余{1,3,6}=10，乘积 110</text>

  <!-- ===== Left: tree with a cut edge ===== -->
  <text x="160" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 切一条边，树裂成两半</text>

  <g font-size="12">
    <!-- edges (cut edge 1-2 drawn red dashed) -->
    <line x1="160" y1="100" x2="120" y2="158" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <line x1="160" y1="100" x2="200" y2="158" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="120" y1="168" x2="92" y2="226" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="120" y1="168" x2="148" y2="226" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="200" y1="168" x2="200" y2="226" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

    <!-- nodes: orange = cut subtree {2,4,5}, blue = rest {1,3,6} -->
    <circle cx="160" cy="92" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="160" y="97" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="120" cy="163" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="120" y="168" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="200" cy="163" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="168" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="92" cy="233" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="92" y="238" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <circle cx="148" cy="233" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="148" y="238" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <circle cx="200" cy="233" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="238" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
  </g>

  <!-- scissors mark on cut edge -->
  <text x="128" y="128" font-size="13" fill="#b85450" font-weight="bold">✂</text>

  <!-- sum labels -->
  <rect x="40" y="262" width="118" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="99" y="280" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">子树和 S = 11</text>
  <rect x="166" y="262" width="118" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">剩余 total−S = 10</text>
  <text x="160" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">乘积 = 11 × 10 = 110</text>

  <!-- ===== Right: parabola S*(total-S) ===== -->
  <text x="460" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 乘积随 S 变化：抛物线，峰值在 total/2</text>

  <!-- axes -->
  <line x1="340" y1="330" x2="568" y2="330" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="340" y1="330" x2="340" y2="118" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="346" font-size="10" fill="#888">S</text>
  <text x="328" y="124" font-size="10" fill="#888">S·(total−S)</text>
  <text x="332" y="346" font-size="9" fill="#888">0</text>
  <text x="556" y="346" font-size="9" fill="#888">21</text>

  <!-- parabola path: y = S*(21-S), mapped -->
  <path d="M 340 330 L 361 261 L 382 207 L 403 168 L 424 143 L 445 132 L 450 131 L 455 132 L 476 143 L 497 168 L 518 207 L 539 261 L 560 330"
        fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- peak vertical line at total/2 = 10.5 -->
  <line x1="450" y1="131" x2="450" y2="330" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="450" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">total/2</text>

  <!-- subtree-sum dots: 4,5,6,9,11 -->
  <circle cx="382" cy="207" r="3" fill="#888" filter="url(#rough2)"/>
  <circle cx="392" cy="186" r="3" fill="#888" filter="url(#rough2)"/>
  <circle cx="403" cy="168" r="3" fill="#888" filter="url(#rough2)"/>
  <circle cx="434" cy="135" r="3" fill="#888" filter="url(#rough2)"/>
  <!-- max dot S=11 -->
  <circle cx="455" cy="132" r="5" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="128" font-size="10" fill="#b85450" font-weight="bold">S=11 → 110</text>

  <!-- bottom note -->
  <rect x="30" y="350" width="540" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键洞察：每条边对应一棵子树和 S，乘积 = S·(total−S)</text>
  <text x="300" y="383" text-anchor="middle" font-size="10" fill="#666">这是开口向下的抛物线，S 越接近 total/2 乘积越大 → 枚举所有子树和取最大即可</text>
</svg>
