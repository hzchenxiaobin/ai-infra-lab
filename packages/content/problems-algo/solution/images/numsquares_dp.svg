<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">完全平方数：完全背包 DP</text>
  <path d="M 280 40 Q 430 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="740" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="430" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" font-family="monospace">dp[i] = min(dp[i − j·j] + 1)   for j with j·j ≤ i</text>

  <!-- subtitle -->
  <text x="430" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">示例 n=12 → 答案 3（4+4+4）；“硬币”= 完全平方数 {1, 4, 9, 16, …}</text>

  <!-- dp table header (i = 0..12) -->
  <g font-size="10">
    <text x="60" y="156" font-weight="bold" fill="#888">金额 i:</text>
    <text x="120" y="156" text-anchor="middle">0</text>
    <text x="170" y="156" text-anchor="middle">1</text>
    <text x="220" y="156" text-anchor="middle">2</text>
    <text x="270" y="156" text-anchor="middle">3</text>
    <text x="320" y="156" text-anchor="middle">4</text>
    <text x="370" y="156" text-anchor="middle">5</text>
    <text x="420" y="156" text-anchor="middle">6</text>
    <text x="470" y="156" text-anchor="middle">7</text>
    <text x="520" y="156" text-anchor="middle">8</text>
    <text x="570" y="156" text-anchor="middle">9</text>
    <text x="620" y="156" text-anchor="middle">10</text>
    <text x="670" y="156" text-anchor="middle">11</text>
    <text x="720" y="156" text-anchor="middle">12</text>
  </g>

  <!-- dp values -->
  <g font-size="11">
    <!-- i=0 -->
    <g filter="url(#sk)"><rect x="100" y="166" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="120" y="187" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <!-- i=1 -->
    <g filter="url(#sk)"><rect x="150" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="170" y="187" text-anchor="middle" fill="#2b6e9e">1</text>
    <!-- i=2 -->
    <g filter="url(#sk)"><rect x="200" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="220" y="187" text-anchor="middle" fill="#2b6e9e">2</text>
    <!-- i=3 -->
    <g filter="url(#sk)"><rect x="250" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="270" y="187" text-anchor="middle" fill="#2b6e9e">3</text>
    <!-- i=4  (perfect square → 1, orange) -->
    <g filter="url(#sk)"><rect x="300" y="166" width="40" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="320" y="187" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <!-- i=5 -->
    <g filter="url(#sk)"><rect x="350" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="370" y="187" text-anchor="middle" fill="#2b6e9e">2</text>
    <!-- i=6 -->
    <g filter="url(#sk)"><rect x="400" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="420" y="187" text-anchor="middle" fill="#2b6e9e">3</text>
    <!-- i=7 -->
    <g filter="url(#sk)"><rect x="450" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="470" y="187" text-anchor="middle" fill="#2b6e9e">4</text>
    <!-- i=8 -->
    <g filter="url(#sk)"><rect x="500" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="520" y="187" text-anchor="middle" fill="#2b6e9e">2</text>
    <!-- i=9  (perfect square → 1, orange) -->
    <g filter="url(#sk)"><rect x="550" y="166" width="40" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="570" y="187" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <!-- i=10 -->
    <g filter="url(#sk)"><rect x="600" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="620" y="187" text-anchor="middle" fill="#2b6e9e">2</text>
    <!-- i=11 -->
    <g filter="url(#sk)"><rect x="650" y="166" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="670" y="187" text-anchor="middle" fill="#2b6e9e">3</text>
    <!-- i=12  (answer, red) -->
    <g filter="url(#sk)"><rect x="700" y="166" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="720" y="187" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
  </g>

  <text x="720" y="218" text-anchor="middle" font-size="9" fill="#b03a3a">dp[12]=3 (4+4+4)</text>

  <!-- legend for colors -->
  <g font-size="9" fill="#888">
    <g filter="url(#sk)"><rect x="100" y="214" width="12" height="12" rx="2" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
    <text x="118" y="224">= 平方数(答案1)</text>
    <g filter="url(#sk)"><rect x="210" y="214" width="12" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
    <text x="228" y="224">= 目标答案</text>
  </g>

  <!-- ===== Transition illustration ===== -->
  <text x="280" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">dp[12] 的转移：dp[12] = min(dp[11]+1, dp[8]+1, dp[3]+1) = min(4, 3, 4) = 3</text>

  <g font-size="10">
    <!-- dp[11] + 1·1 -->
    <g filter="url(#sk)"><rect x="100" y="272" width="120" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="160" y="290" text-anchor="middle" fill="#2b6e9e">dp[11]=3</text>
    <text x="160" y="304" text-anchor="middle" fill="#888" font-size="9">+ 1·1（j=1）</text>
    <path d="M 222 292 L 360 292" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="290" y="284" text-anchor="middle" font-size="9" fill="#888">3+1=4</text>

    <!-- dp[8] + 2·2 -->
    <g filter="url(#sk)"><rect x="100" y="322" width="120" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="160" y="340" text-anchor="middle" fill="#2b6e9e">dp[8]=2</text>
    <text x="160" y="354" text-anchor="middle" fill="#888" font-size="9">+ 2·2（j=2）</text>
    <path d="M 222 342 L 360 322" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="290" y="330" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">2+1=3 ✓</text>

    <!-- dp[3] + 3·3 -->
    <g filter="url(#sk)"><rect x="100" y="372" width="120" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="160" y="390" text-anchor="middle" fill="#2b6e9e">dp[3]=3</text>
    <text x="160" y="404" text-anchor="middle" fill="#888" font-size="9">+ 3·3（j=3）</text>
    <path d="M 222 382 L 360 342" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="290" y="372" text-anchor="middle" font-size="9" fill="#888">3+1=4</text>

    <!-- result -->
    <g filter="url(#sk)"><rect x="370" y="312" width="110" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="425" y="338" text-anchor="middle" fill="#b03a3a" font-weight="bold">dp[12]=3</text>
  </g>

  <!-- ===== Analogy box: 与 322 同构 ===== -->
  <g filter="url(#sk)">
    <rect x="510" y="252" width="330" height="240" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="675" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">与 322 零钱兑换同构</text>
  <g font-size="10" fill="#444">
    <text x="530" y="300"><tspan font-weight="bold" fill="#4a8edb">322 零钱兑换</tspan></text>
    <text x="540" y="318">coins = 给定数组</text>
    <text x="540" y="334">amount = 目标金额</text>
    <text x="540" y="350">dp[i]=min(dp[i−coin]+1)</text>

    <text x="530" y="378"><tspan font-weight="bold" fill="#4a8e4a">279 完全平方数</tspan></text>
    <text x="540" y="396">“coins” = {1,4,9,…,j²}</text>
    <text x="540" y="412">amount = n</text>
    <text x="540" y="428">dp[i]=min(dp[i−j²]+1)</text>

    <text x="530" y="456" fill="#b03a3a" font-weight="bold">同一套完全背包模板</text>
    <text x="540" y="474" fill="#888">会一道即会一类</text>
  </g>
</svg>
