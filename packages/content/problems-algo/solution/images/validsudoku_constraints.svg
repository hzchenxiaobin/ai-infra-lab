<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">每个格子受三重约束：行 / 列 / 宫</text>

  <!-- constraint bands (semi-transparent, layered) -->
  <!-- row 4 band (blue) -->
  <rect x="108" y="194" width="324" height="36" fill="#446688" fill-opacity="0.16" filter="url(#rough2)"/>
  <!-- col 4 band (green) -->
  <rect x="252" y="50" width="36" height="324" fill="#4a7a3a" fill-opacity="0.16" filter="url(#rough2)"/>
  <!-- 3x3 box (orange) rows 3-5 cols 3-5 -->
  <rect x="216" y="158" width="108" height="108" fill="#d6a040" fill-opacity="0.20" filter="url(#rough2)"/>

  <!-- thin grid lines -->
  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="144" y1="50" x2="144" y2="374"/>
    <line x1="180" y1="50" x2="180" y2="374"/>
    <line x1="288" y1="50" x2="288" y2="374"/>
    <line x1="324" y1="50" x2="324" y2="374"/>
    <line x1="396" y1="50" x2="396" y2="374"/>
    <line x1="108" y1="86" x2="432" y2="86"/>
    <line x1="108" y1="122" x2="432" y2="122"/>
    <line x1="108" y1="230" x2="432" y2="230"/>
    <line x1="108" y1="266" x2="432" y2="266"/>
    <line x1="108" y1="338" x2="432" y2="338"/>
  </g>
  <!-- thick box boundary lines -->
  <g stroke="#888" stroke-width="2" filter="url(#rough2)">
    <line x1="108" y1="50" x2="432" y2="50"/>
    <line x1="108" y1="374" x2="432" y2="374"/>
    <line x1="108" y1="50" x2="108" y2="374"/>
    <line x1="432" y1="50" x2="432" y2="374"/>
    <line x1="216" y1="50" x2="216" y2="374"/>
    <line x1="324" y1="50" x2="324" y2="374"/>
    <line x1="108" y1="158" x2="432" y2="158"/>
    <line x1="108" y1="266" x2="432" y2="266"/>
  </g>

  <!-- target cell (4,4) red emphasis -->
  <rect x="252" y="194" width="36" height="36" fill="none" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">(i,j)</text>

  <!-- row label -->
  <text x="98" y="217" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">行 i</text>
  <path d="M 100 212 L 108 212" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- col label -->
  <text x="270" y="44" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">列 j</text>
  <path d="M 270 46 L 270 50" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- box label -->
  <text x="352" y="150" font-size="12" fill="#d6a040" font-weight="bold">3×3 宫</text>
  <path d="M 348 152 L 324 158" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="60" y="386" width="14" height="14" fill="#446688" fill-opacity="0.16" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="397" font-size="10.5" fill="#555">同一行</text>
  <rect x="190" y="386" width="14" height="14" fill="#4a7a3a" fill-opacity="0.16" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="397" font-size="10.5" fill="#555">同一列</text>
  <rect x="320" y="386" width="14" height="14" fill="#d6a040" fill-opacity="0.20" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="397" font-size="10.5" fill="#555">同一宫</text>
  <rect x="440" y="386" width="14" height="14" fill="none" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="397" font-size="10.5" fill="#555">当前格</text>
</svg>
