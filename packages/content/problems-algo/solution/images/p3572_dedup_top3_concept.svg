<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：同 x 只留最大 y，组代表中取前三大</text>

  <!-- 输入行 -->
  <text x="30" y="59" font-size="11.5" fill="#555" filter="url(#rough2)">输入对</text>
  <rect x="80" y="38" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,5)</text>
  <rect x="130" y="38" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,3)</text>
  <rect x="180" y="38" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,4)</text>
  <rect x="230" y="38" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3,6)</text>
  <rect x="280" y="38" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="335" y="59" font-size="10" fill="#777" filter="url(#rough2)">（示例 1，颜色 = x 值）</text>

  <!-- 箭头 1 -->
  <path d="M185,76 L185,96" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="198" y="90" font-size="10.5" fill="#446688" filter="url(#rough2)">按 x 分桶，桶内只留最大 y</text>

  <!-- 桶 x=1 -->
  <rect x="35" y="105" width="140" height="85" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">x = 1</text>
  <rect x="55" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="138" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="105" y="156" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>
  <path d="M92,160 L118,142" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="141" y="156" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">←淘汰</text>
  <text x="105" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">max = 5</text>

  <!-- 桶 x=2 -->
  <rect x="190" y="105" width="140" height="85" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = 2</text>
  <rect x="210" y="138" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="247" y="138" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M247,160 L273,142" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="156" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">←淘汰</text>
  <text x="260" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">max = 3</text>

  <!-- 桶 x=3 -->
  <rect x="345" y="105" width="140" height="85" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">x = 3</text>
  <rect x="365" y="138" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="415" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">max = 6</text>

  <!-- 箭头 2 -->
  <path d="M260,194 L260,214" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="208" font-size="10.5" fill="#446688" filter="url(#rough2)">组代表取前三大</text>

  <!-- 前三行 -->
  <text x="30" y="243" font-size="11.5" fill="#555" filter="url(#rough2)">前三大</text>
  <rect x="75" y="222" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="92" y="271" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">x=3</text>
  <text x="120" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">+</text>
  <rect x="131" y="222" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="148" y="271" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">x=1</text>
  <text x="176" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">+</text>
  <rect x="185" y="222" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="202" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="202" y="271" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">x=2</text>
  <text x="230" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">=</text>
  <rect x="244" y="222" width="64" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="276" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">14</text>
  <text x="276" y="271" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">答案</text>

  <!-- 陷阱框 -->
  <rect x="330" y="216" width="160" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">陷阱：直接取全局前三大</text>
  <text x="410" y="253" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6+5+4 中 5、4 同属 x=1 ✗</text>
  <text x="410" y="269" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">须换成 x=2 的 3 → 14</text>

  <!-- 底部结论 -->
  <rect x="30" y="292" width="460" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">交换论证：可行解中 x=v 的下标换成组内 y 最大者，互异性不变、和只增不减</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 每个不同 x 值一个组代表，去重后取前三大即最优</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">不同 x 值个数 m &lt; 3 时无解，返回 −1</text>
</svg>
