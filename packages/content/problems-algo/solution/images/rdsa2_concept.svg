<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">快慢双指针：判定条件 nums[fast] != nums[slow − 2]</text>

  <!-- ===== Scenario A: equal → skip ===== -->
  <text x="40" y="62" font-size="12" fill="#888">情况一：已有两份，跳过</text>

  <!-- index labels -->
  <text x="100" y="80" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">slow−2</text>
  <text x="196" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">slow</text>
  <text x="292" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">fast</text>

  <!-- cells row A: [1, 1, 1, 2, 2, 3] -->
  <rect x="76" y="86" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="86" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="86" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="86" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="268" y="86" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="316" y="86" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="107" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="364" y="86" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="107" text-anchor="middle" font-size="14" fill="#999">3</text>

  <!-- pointer arrows A -->
  <path d="M 100 82 L 100 86" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 196 82 L 196 86" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 292 82 L 292 86" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- comparison A -->
  <text x="160" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[slow−2] = 1</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[fast] = 2</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">≠ → 写入 nums[slow] = 2, slow++</text>

  <!-- ===== Scenario B: equal → skip ===== -->
  <text x="40" y="190" font-size="12" fill="#888">情况二：已有两份，跳过</text>

  <!-- index labels B -->
  <text x="100" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">slow−2</text>
  <text x="196" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">slow</text>
  <text x="244" y="208" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">fast</text>

  <!-- cells row B: [1, 1, 1(=slow-2), 2, ...] fast points to 3rd '1' -->
  <rect x="76" y="214" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="214" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="214" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="214" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="268" y="214" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="235" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="316" y="214" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="235" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="364" y="214" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="235" text-anchor="middle" font-size="14" fill="#999">3</text>

  <!-- pointer arrows B -->
  <path d="M 100 210 L 100 214" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 196 210 L 196 214" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 244 210 L 244 214" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- comparison B -->
  <text x="160" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[slow−2] = 1</text>
  <text x="244" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[fast] = 1</text>
  <text x="220" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= → 已有两份，跳过，slow 不动</text>

  <!-- Core idea box -->
  <rect x="40" y="300" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：slow−2 是写入区中同值的最早可能位置</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#666">允许保留两次 → 回看 2 格；与 slow−2 不同则安全写入</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888">推广：允许保留 K 次 → 比较 nums[slow − K]</text>
</svg>
