<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：3×3 维度骨架 + LEFT JOIN 补零</text>

  <!-- ===== Left: Experiments fact table (6 rows) ===== -->
  <text x="55" y="58" font-size="11" fill="#446688" font-weight="bold">Experiments 表（稀疏事实）</text>
  <rect x="20" y="64" width="180" height="170" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- header -->
  <rect x="20" y="64" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="32" y="78" font-size="9" fill="#446688" font-weight="bold">id</text>
  <text x="70" y="78" font-size="9" fill="#446688" font-weight="bold">platform</text>
  <text x="135" y="78" font-size="9" fill="#446688" font-weight="bold">name</text>
  <!-- rows -->
  <text x="32" y="98" font-size="9" fill="#333">4</text>
  <text x="70" y="98" font-size="9" fill="#333">IOS</text>
  <text x="135" y="98" font-size="9" fill="#333">Programming</text>
  <text x="32" y="118" font-size="9" fill="#333">13</text>
  <text x="70" y="118" font-size="9" fill="#333">IOS</text>
  <text x="135" y="118" font-size="9" fill="#333">Sports</text>
  <text x="32" y="138" font-size="9" fill="#333">14</text>
  <text x="70" y="138" font-size="9" fill="#333">Android</text>
  <text x="135" y="138" font-size="9" fill="#333">Reading</text>
  <text x="32" y="158" font-size="9" fill="#333">8</text>
  <text x="70" y="158" font-size="9" fill="#333">Web</text>
  <text x="135" y="158" font-size="9" fill="#333">Reading</text>
  <text x="32" y="178" font-size="9" fill="#333">12</text>
  <text x="70" y="178" font-size="9" fill="#333">Web</text>
  <text x="135" y="178" font-size="9" fill="#333">Reading</text>
  <text x="32" y="198" font-size="9" fill="#333">18</text>
  <text x="70" y="198" font-size="9" fill="#333">Web</text>
  <text x="135" y="198" font-size="9" fill="#333">Programming</text>
  <line x1="20" y1="84" x2="200" y2="84" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="9" fill="#888">仅 6 行 → 只覆盖 9 格中的 5 格</text>

  <!-- arrow from table to grid -->
  <path d="M 205 149 C 235 149, 245 149, 275 149" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="142" text-anchor="middle" font-size="8" fill="#888">挂入</text>

  <!-- ===== Right: 3x3 grid skeleton ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3×3 维度骨架（稠密）</text>

  <!-- column headers -->
  <text x="370" y="78" text-anchor="middle" font-size="9" fill="#888">Reading</text>
  <text x="430" y="78" text-anchor="middle" font-size="9" fill="#888">Sports</text>
  <text x="490" y="78" text-anchor="middle" font-size="9" fill="#888">Programming</text>

  <!-- row headers -->
  <text x="318" y="108" text-anchor="end" font-size="9" fill="#888">Android</text>
  <text x="318" y="148" text-anchor="end" font-size="9" fill="#888">IOS</text>
  <text x="318" y="188" text-anchor="end" font-size="9" fill="#888">Web</text>

  <!-- Android row: Reading=14(filled), Sports=0(empty), Programming=0(empty) -->
  <rect x="340" y="92" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">14</text>
  <rect x="400" y="92" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="460" y="92" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- IOS row: Reading=0, Sports=13, Programming=4 -->
  <rect x="340" y="132" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="400" y="132" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">13</text>
  <rect x="460" y="132" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Web row: Reading=8,12, Sports=0, Programming=18 -->
  <rect x="340" y="172" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">8,12</text>
  <rect x="400" y="172" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="460" y="172" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="248" width="480" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">GROUP BY 只输出有数据的 5 格 → 4 格零次组合消失！</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#666">解法：UNION 枚举全集 → CROSS JOIN 得 9 格骨架 → LEFT JOIN 挂事实行</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">绿格 = 有事实行挂入（COUNT(experiment_id) 得正数）</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">红格 = 无匹配（LEFT JOIN 保留空行，COUNT(列) 得 0）</text>
  <text x="280" y="346" text-anchor="middle" font-size="9" fill="#888">⚠ COUNT(*) 会把红格空行算成 1 → 必须用 COUNT(experiment_id)</text>
</svg>
