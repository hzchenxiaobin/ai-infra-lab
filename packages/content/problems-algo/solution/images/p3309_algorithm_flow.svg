<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：枚举 3! = 6 种排列，逐一拼接取最大</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">C++ 用 next_permutation，Python 用 itertools.permutations</text>

  <!-- 主流程 -->
  <rect x="55" y="52" width="210" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="70" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">输入 nums（长度恒为 3）</text>
  <path d="M 160 80 L 160 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="92" width="210" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">生成下一个排列 (a, b, c)</text>
  <path d="M 160 124 L 160 134" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="136" width="210" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="156" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">v = a</text>
  <text x="160" y="171" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">v = (v &lt;&lt; Lb) | b</text>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">v = (v &lt;&lt; Lc) | c</text>
  <path d="M 160 192 L 160 202" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="204" width="210" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">ans = max(ans, v)</text>
  <path d="M 160 232 L 160 242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="160,244 235,268 160,292 85,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">还有排列</text>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">未枚举？</text>

  <!-- 是：回边 -->
  <path d="M 85 268 L 46 268 L 46 108 L 53 108" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="66" y="262" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="42" y="190" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)" transform="rotate(-90 42 190)">下一个排列</text>

  <!-- 否：到返回 -->
  <path d="M 235 268 L 282 268 L 282 320 L 267 320" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="243" y="262" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="55" y="306" width="210" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="324" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧：为什么只有 6 种 -->
  <rect x="300" y="92" width="200" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">为什么只有 6 种？</text>
  <text x="400" y="127" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">n = 3 ⇒ 全排列 3! = 6 种</text>
  <text x="400" y="142" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">官方 hint 即「数数顺序数」</text>
  <text x="400" y="156" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">全部枚举 = 天然正确</text>

  <!-- 右侧：位运算拼接的妙处 -->
  <rect x="300" y="178" width="200" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位运算拼接的妙处</text>
  <text x="400" y="213" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">(v &lt;&lt; L) | x 一步拼一个数</text>
  <text x="400" y="228" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">免字符串、免 int(s, 2)</text>
  <text x="400" y="243" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">L = x.bit_length()</text>

  <!-- 右侧：易错点 -->
  <rect x="300" y="262" width="200" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="280" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">易错点</text>
  <text x="400" y="297" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">① 别按数值大小排序（见扩展）</text>
  <text x="400" y="312" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">② next_permutation 前先 sort</text>
  <text x="400" y="327" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（否则漏掉起点之前的排列）</text>
</svg>
