<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 408"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="540" height="408" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14.5" fill="#333"
        filter="url(#rough2)">核心观察：脏日剔除 + 分区 (user, action) 内的「date − rn」岛键</text>

  <!-- Section 1: raw timeline -->
  <text x="30" y="46" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① 用户 u 的动作流水（主键含 action ⟹ 同一天可以有多行）</text>

  <!-- day boxes: pitch 48, width 46 -->
  <g filter="url(#rough2)">
    <rect x="31" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="54" y="71" text-anchor="middle" font-size="10" fill="#888">1日</text>
    <text x="54" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="79" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="102" y="71" text-anchor="middle" font-size="10" fill="#888">2日</text>
    <text x="102" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="127" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="150" y="71" text-anchor="middle" font-size="10" fill="#b85450">3日</text>
    <text x="150" y="87" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A+B</text>

    <rect x="175" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="198" y="71" text-anchor="middle" font-size="10" fill="#888">4日</text>
    <text x="198" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="223" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="246" y="71" text-anchor="middle" font-size="10" fill="#888">5日</text>
    <text x="246" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="271" y="56" width="46" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="294" y="71" text-anchor="middle" font-size="10" fill="#999">6日</text>
    <text x="294" y="87" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">∅</text>

    <rect x="319" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="342" y="71" text-anchor="middle" font-size="10" fill="#888">7日</text>
    <text x="342" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="367" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="390" y="71" text-anchor="middle" font-size="10" fill="#888">8日</text>
    <text x="390" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

    <rect x="415" y="56" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="438" y="71" text-anchor="middle" font-size="10" fill="#d6a040">9日</text>
    <text x="438" y="87" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>

    <rect x="463" y="56" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="486" y="71" text-anchor="middle" font-size="10" fill="#d6a040">10日</text>
    <text x="486" y="87" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="150" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">↑ 脏日：cnt=2，整天剔除</text>
    <text x="294" y="108" text-anchor="middle" fill="#888">↑ 空档：无任何操作</text>
    <text x="462" y="108" text-anchor="middle" fill="#d6a040" font-weight="bold">↑ 换动作 → 换分区</text>
  </g>

  <!-- Section 2: island key table -->
  <text x="30" y="130" font-size="12.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">② 分区 (u, A) 内做行号差法——「动作相同」交给分区，差法只管「日期连续」</text>

  <g filter="url(#rough2)">
    <rect x="30" y="140" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="70" y="155" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">日期</text>
    <rect x="110" y="140" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="155" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>
    <rect x="170" y="140" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="200" y="155" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">行号 rn</text>
    <rect x="230" y="140" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="155" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">岛键 d − rn</text>
    <rect x="350" y="140" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="430" y="155" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">所属岛</text>
  </g>

  <!-- r1: day1 island A1 (green) -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="164" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="179" text-anchor="middle" fill="#333">1日</text>
    <rect x="110" y="164" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="179" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="164" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="179" text-anchor="middle" fill="#333">1</text>
    <rect x="230" y="164" width="120" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="290" y="179" text-anchor="middle" fill="#333">0</text>
    <rect x="350" y="164" width="160" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="179" text-anchor="middle" fill="#333">岛 A₁ 起点</text>
  </g>

  <!-- r2: day2 island A1 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="185" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="200" text-anchor="middle" fill="#333">2日</text>
    <rect x="110" y="185" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="200" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="185" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="200" text-anchor="middle" fill="#333">2</text>
    <rect x="230" y="185" width="120" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="290" y="200" text-anchor="middle" fill="#333" font-weight="bold">0 ✓ 不变</text>
    <rect x="350" y="185" width="160" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="430" y="200" text-anchor="middle" fill="#333" font-weight="bold">岛 A₁（长 2）</text>
  </g>

  <!-- r3: dirty day span -->
  <g filter="url(#rough2)">
    <rect x="30" y="206" width="480" height="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="270" y="221" text-anchor="middle" font-size="10.5" fill="#b85450">3日：A + B 两个动作（cnt = 2）→ 脏日整行剔除，日期轴上留下空档</text>
  </g>

  <!-- r4: day4 island A2 (blue) -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="227" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="242" text-anchor="middle" fill="#333">4日</text>
    <rect x="110" y="227" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="242" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="227" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="242" text-anchor="middle" fill="#333">3</text>
    <rect x="230" y="227" width="120" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="242" text-anchor="middle" fill="#333">1 ✗ 跳变</text>
    <rect x="350" y="227" width="160" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="430" y="242" text-anchor="middle" fill="#333">岛 A₂ 起点</text>
  </g>

  <!-- r5: day5 island A2 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="248" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="263" text-anchor="middle" fill="#333">5日</text>
    <rect x="110" y="248" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="263" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="248" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="263" text-anchor="middle" fill="#333">4</text>
    <rect x="230" y="248" width="120" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="290" y="263" text-anchor="middle" fill="#333" font-weight="bold">1 ✓ 不变</text>
    <rect x="350" y="248" width="160" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="430" y="263" text-anchor="middle" fill="#333" font-weight="bold">岛 A₂（长 2）</text>
  </g>

  <!-- r6: empty day span -->
  <g filter="url(#rough2)">
    <rect x="30" y="269" width="480" height="21" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="270" y="284" text-anchor="middle" font-size="10.5" fill="#777">6日：无任何操作 → 日期空档，同样断串</text>
  </g>

  <!-- r7: day7 island A3 (orange) -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="290" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="305" text-anchor="middle" fill="#333">7日</text>
    <rect x="110" y="290" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="305" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="290" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="305" text-anchor="middle" fill="#333">5</text>
    <rect x="230" y="290" width="120" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="290" y="305" text-anchor="middle" fill="#333">2 ✗ 跳变</text>
    <rect x="350" y="290" width="160" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="305" text-anchor="middle" fill="#333">岛 A₃ 起点</text>
  </g>

  <!-- r8: day8 island A3 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="311" width="80" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="70" y="326" text-anchor="middle" fill="#333">8日</text>
    <rect x="110" y="311" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="140" y="326" text-anchor="middle" fill="#333">A</text>
    <rect x="170" y="311" width="60" height="21" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="200" y="326" text-anchor="middle" fill="#333">6</text>
    <rect x="230" y="311" width="120" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="290" y="326" text-anchor="middle" fill="#333" font-weight="bold">2 ✓ 不变</text>
    <rect x="350" y="311" width="160" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="430" y="326" text-anchor="middle" fill="#333" font-weight="bold">岛 A₃（长 2）</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#rough2)" font-size="10.5">
    <text x="30" y="352" fill="#333">💡 9日/10日 的 B 在分区 (u, B) 内自成孤岛（岛键 8、8，长 2）——分组键含 action，跨动作键值碰撞也不合并</text>
    <text x="30" y="370" fill="#4a7a3a" font-weight="bold">三类断点全部归一为「岛键跳变」：脏日剔除 ⟹ 留下空档；空档 ⟹ 日期跳档；换动作 ⟹ 换分区</text>
    <text x="30" y="388" fill="#888">岛键绝对值无意义——只需「同段同键、异段异键」；本例 4 个岛长均为 2 &lt; 5，都不构成行为稳定</text>
  </g>
</svg>
