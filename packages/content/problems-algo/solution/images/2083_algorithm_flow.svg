<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：增量计数，一次遍历 O(n)</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">每遇到字符 c，cnt[c]++ 后 ans += cnt[c]：cnt[c] = 此前同字符数 + 1（含自身）</text>

  <!-- Start node -->
  <rect x="220" y="60" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- Arrow down -->
  <path d="M 280 94 L 280 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init node -->
  <rect x="200" y="110" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="11" fill="#333">cnt[26] = {0}, ans = 0</text>

  <!-- Arrow down -->
  <path d="M 280 144 L 280 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="280,160 380,200 280,240 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">还有字符?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#888">c = s[i]</text>

  <!-- Arrow right: no -->
  <path d="M 380 200 L 420 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="10" fill="#888">否</text>

  <!-- Return node -->
  <rect x="420" y="184" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="470" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Arrow down: yes -->
  <path d="M 280 240 L 280 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="250" font-size="10" fill="#888">是</text>

  <!-- Step 1: cnt[c]++ -->
  <rect x="180" y="256" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11.5" fill="#333">cnt[c] ++（含当前位置）</text>

  <!-- Arrow down -->
  <path d="M 280 290 L 280 304" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: ans += cnt[c] -->
  <rect x="170" y="306" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans += cnt[c]</text>

  <!-- Annotation for step 2 -->
  <rect x="404" y="306" width="146" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="320" text-anchor="middle" font-size="9.5" fill="#888">cnt[c] = 之前同字符数 + 1</text>
  <text x="477" y="334" text-anchor="middle" font-size="9.5" fill="#888">= 以 i 结尾的合法子串数</text>

  <!-- Arrow: back to loop -->
  <path d="M 390 323 L 440 323 L 440 200 L 380 200" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="448" y="264" font-size="9.5" fill="#aaa">回到循环</text>

  <!-- Bottom note -->
  <rect x="40" y="352" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">为何 ans += cnt[c] 而非 cnt[c]-1？</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#555">cnt[c] 含当前位置 → cnt[c] = 配对数（此前每个同字符位置 + 自身单字符子串）</text>
</svg>
