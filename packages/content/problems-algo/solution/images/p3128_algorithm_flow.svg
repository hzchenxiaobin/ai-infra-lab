<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍线性扫描，O(nm)</text>

  <!-- step 1: preprocess -->
  <rect x="30" y="44" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="12" fill="#2c4a6b" filter="url(#rough2)">① 预处理：row[x] ← 第 x 行 1 的个数</text>
  <text x="150" y="82" text-anchor="middle" font-size="12" fill="#2c4a6b" filter="url(#rough2)">col[y] ← 第 y 列 1 的个数</text>

  <line x1="150" y1="94" x2="150" y2="112" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: iterate cells -->
  <rect x="50" y="116" width="200" height="32" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="137" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">② 遍历每个格子 (x, y)</text>

  <line x1="150" y1="148" x2="150" y2="164" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="150,168 222,200 150,232 78,200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">grid[x][y] = 1 ?</text>

  <!-- yes branch -->
  <line x1="150" y1="232" x2="150" y2="250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="246" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="30" y="254" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③ ans += (row[x]−1) × (col[y]−1)</text>

  <line x1="150" y1="298" x2="150" y2="316" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="320" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="341" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">④ 扫描结束，返回 ans</text>

  <!-- no branch -->
  <line x1="222" y1="200" x2="238" y2="200" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="190" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="242" y="184" width="88" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="286" y="205" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">跳过该格</text>

  <!-- right notes -->
  <rect x="342" y="44" width="200" height="84" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="442" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">两遍扫描的分工</text>
  <text x="442" y="88" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 1 遍攒全局计数</text>
  <text x="442" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 2 遍逐格消费贡献</text>

  <rect x="342" y="144" width="200" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="442" y="168" text-anchor="middle" font-size="11.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">⚠️ 全 1 矩阵答案 ≈ 10¹²</text>
  <text x="442" y="190" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">C++/Java 必须 64 位整数</text>

  <rect x="342" y="224" width="200" height="84" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="442" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么单格 O(1)？</text>
  <text x="442" y="268" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">乘法原理：横竖选择独立</text>
  <text x="442" y="288" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">组合数 = 两计数直接相乘</text>

  <text x="442" y="334" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">不枚举配对，只数「两边各有几个」</text>
  <text x="442" y="354" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">贡献法把枚举压成乘法</text>
</svg>
