<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">贪心 + 哈希记录上次完成日：一次遍历</text>

  <!-- ① init -->
  <rect x="170" y="46" width="220" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">day = 1, last = ∅</text>
  <line x1="280" y1="90" x2="280" y2="116" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② pick task (loop target) -->
  <rect x="150" y="120" width="260" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 取下一任务 t = tasks[i]</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按给定顺序逐个处理，i 从 0 到 n−1</text>
  <line x1="280" y1="170" x2="280" y2="194" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ decision diamond -->
  <polygon points="280,196 396,240 280,284 164,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">需要等待冷却？</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t 已做过 且 day−last[t] ≤ space</text>

  <!-- 是: jump -->
  <line x1="164" y1="240" x2="124" y2="240" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="222" width="92" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">day = last[t]</text>
  <text x="76" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+ space + 1</text>

  <!-- 否: keep -->
  <line x1="396" y1="240" x2="436" y2="240" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="440" y="222" width="96" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="488" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">day 不变</text>

  <!-- merge to ④ -->
  <line x1="76" y1="260" x2="76" y2="308" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="488" y1="260" x2="488" y2="308" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="76" y1="308" x2="488" y2="308" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="280" y1="308" x2="280" y2="334" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ complete -->
  <rect x="130" y="338" width="300" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 完成任务 t</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">last[t] = day；day += 1；i += 1</text>
  <line x1="280" y1="388" x2="280" y2="412" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ diamond: done? -->
  <polygon points="280,414 376,448 280,482 184,448" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="453" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i == n ?</text>

  <!-- 否: loop back to ② (far left rail) -->
  <path d="M184,448 L18,448 L18,144 L150,144" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="30" y="298" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="30" y="312" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回 ②</text>

  <!-- 是: return -->
  <line x1="280" y1="482" x2="280" y2="500" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298" y="470" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="160" y="502" width="240" height="30" rx="8" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="521" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">返回 day − 1（用掉的总天数）</text>
</svg>
