<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：用「n 进制编码」把两个数塞进一个格子</text>

  <!-- Goal -->
  <text x="60" y="58" font-size="11.5" fill="#888">目标：ans[i] = nums[nums[i]]，但不另开数组</text>

  <!-- Two source values -->
  <text x="60" y="92" font-size="11.5" fill="#888">两个待存值（都 &lt; n）：</text>

  <!-- a = nums[i] -->
  <rect x="60" y="100" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="106" y="120" text-anchor="middle" font-size="11" fill="#555">原值 a</text>
  <text x="106" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">nums[i]</text>

  <!-- arrow to nums[a] -->
  <path d="M 152 122 L 186 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="169" y="116" text-anchor="middle" font-size="10" fill="#888">a 当下标</text>

  <!-- b = nums[a] -->
  <rect x="188" y="100" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="234" y="120" text-anchor="middle" font-size="11" fill="#555">目标值 b</text>
  <text x="234" y="137" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">nums[a]</text>

  <!-- combine label -->
  <text x="312" y="120" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">+</text>
  <text x="312" y="138" text-anchor="middle" font-size="10" fill="#888">合并</text>

  <!-- encoded cell -->
  <rect x="332" y="100" width="168" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="416" y="120" text-anchor="middle" font-size="11" fill="#555">编码后一格存俩</text>
  <text x="416" y="137" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">a + n × b</text>

  <!-- Divider -->
  <path d="M 40 162 L 520 162" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Decode section -->
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">解码：从一个格子拆回两个值</text>

  <!-- encoded cell center -->
  <rect x="220" y="200" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#555">编码值</text>
  <text x="280" y="237" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">a + n × b</text>

  <!-- arrows down left and right -->
  <path d="M 244 246 L 150 276" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 316 246 L 410 276" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="176" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">% n → a</text>
  <text x="384" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">// n → b</text>

  <!-- a result -->
  <rect x="80" y="284" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="302" text-anchor="middle" font-size="11" fill="#555">余数 = 原值</text>
  <text x="145" y="319" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">encoded % n</text>

  <!-- b result -->
  <rect x="350" y="284" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="415" y="302" text-anchor="middle" font-size="11" fill="#555">商 = 目标值</text>
  <text x="415" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">encoded // n</text>

  <!-- note box -->
  <rect x="60" y="346" width="440" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">前提：所有值 ∈ [0, n−1]（排列保证 a, b &lt; n）</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#b85450">→ a 占「个位」、b 占「n 进制高位」，互不干扰</text>
  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888">两趟扫描：先原地编码，再统一除 n 取商</text>
</svg>
