<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：定单价 r = max(比率) · 选 K 个最小质量</text>

  <!-- Formula box -->
  <rect x="24" y="42" width="492" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="12.5" fill="#4a7a3a" font-weight="bold">关键公式：总工资 = r × Σquality，其中 r ≥ wage[i]/quality[i]（每个工人）</text>
  <text x="40" y="82" font-size="11.5" fill="#4a7a3a">→ 取 r = 组内最大比率，再让 Σquality 最小 ⇒ 排序 + 大顶堆维护 K 个最小质量</text>

  <!-- Left: workers sorted by ratio -->
  <text x="92" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">工人（按比率升序）</text>
  <rect x="42" y="130" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="148" text-anchor="middle" font-size="11" fill="#333">r=0.2 · q=10</text>
  <rect x="42" y="160" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="178" text-anchor="middle" font-size="11" fill="#333">r=0.2 · q=10</text>
  <rect x="42" y="190" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r=1.33 · q=3</text>
  <rect x="42" y="220" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="238" text-anchor="middle" font-size="11" fill="#999">r=7 · q=1</text>

  <text x="150" y="206" font-size="10.5" fill="#d6a040" font-weight="bold">← 当前</text>
  <text x="150" y="220" font-size="10.5" fill="#d6a040" font-weight="bold">   队长</text>

  <!-- arrow eligible -> heap -->
  <path d="M 148 176 L 210 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="166" y="170" font-size="10" fill="#4a7a3a">入堆</text>

  <!-- Middle: max-heap of quality (keep K smallest) -->
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">大顶堆（质量，留 K 小）</text>
  <rect x="230" y="130" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">q=10（堆顶最大）</text>
  <rect x="230" y="160" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="11.5" fill="#666">q=10</text>
  <rect x="230" y="190" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">q=3（刚入）</text>

  <text x="338" y="148" font-size="10.5" fill="#b85450" font-weight="bold">超 K 则弹出</text>

  <!-- arrow heap -> cost -->
  <path d="M 280 222 L 280 244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="290" y="240" font-size="10" fill="#d6a040" font-weight="bold">Σquality</text>

  <!-- Right: cost = r * sumq -->
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">本轮成本候选</text>
  <rect x="190" y="272" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">r(队长) × Σquality</text>

  <text x="380" y="294" font-size="11" fill="#b85450" font-weight="bold">→ 取 min</text>

  <!-- conclusion -->
  <rect x="24" y="322" width="492" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="12" fill="#446688" font-weight="bold">排序保证：遍历到 i 时，ratio[i] 是当前组的最大比率（队长）</text>

  <!-- tip -->
  <rect x="24" y="362" width="492" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="382" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ r 由比率最大的工人决定；质量越大的工人越该被堆踢出（留小质量降 Σ）</text>
</svg>
