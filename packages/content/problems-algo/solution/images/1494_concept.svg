<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：用位掩码编码「已完成课程集合」</text>

  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">先修关系 DAG（示例 1）</text>

  <circle cx="90" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="90" cy="195" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="201" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="220" cy="148" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="350" cy="148" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M112,108 Q165,118 198,140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M112,187 Q165,178 198,156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M242,148 L328,148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="150" y="112" font-size="9" fill="#888" filter="url(#rough2)">先修</text>
  <text x="282" y="140" font-size="9" fill="#888" filter="url(#rough2)">先修</text>

  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">状态 = 已完成课程的位掩码</text>

  <rect x="310" y="72" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">mask</text>
  <rect x="372" y="72" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">已完成</text>
  <rect x="456" y="72" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dp</text>

  <rect x="310" y="102" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="341" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0000</text>
  <rect x="372" y="102" width="84" height="26" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="414" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">∅</text>
  <rect x="456" y="102" width="48" height="26" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <rect x="310" y="132" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0110</text>
  <rect x="372" y="132" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="414" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <rect x="456" y="132" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="310" y="162" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0111</text>
  <rect x="372" y="162" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="414" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2,3}</text>
  <rect x="456" y="162" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="310" y="192" width="62" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1111</text>
  <rect x="372" y="192" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="414" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2,3,4}</text>
  <rect x="456" y="192" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="300" y="232" width="210" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="252" font-size="10" fill="#446688" filter="url(#rough2)">第 j 位 = 1 → 课程 (j+1) 已完成</text>
  <text x="310" y="268" font-size="10" fill="#446688" filter="url(#rough2)">mask = 0110 → bit1,bit2 为 1</text>
  <text x="310" y="284" font-size="10" fill="#446688" filter="url(#rough2)">→ 课程 2、3 已完成</text>

  <rect x="30" y="310" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">dp[mask] = 完成 mask 所示课程集最少需要的学期数</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每学期最多选 k 门「先修已全部完成」的课 → 每步从可选集中挑一个子集</text>
</svg>
