<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">N 叉树前序遍历：根 → 孩子(从左到右)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先访问根，再依次递归每个孩子</text>

  <!-- 根节点 1 -->
  <circle cx="280" cy="82" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="308" y="87" font-size="11" fill="#b85450" font-weight="bold">①</text>

  <!-- 第二层：3, 2, 4 -->
  <circle cx="140" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="165" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="162" y="165" font-size="11" fill="#b85450" font-weight="bold">②</text>

  <circle cx="280" cy="160" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="165" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="302" y="165" font-size="11" fill="#b85450" font-weight="bold">⑤</text>

  <circle cx="420" cy="160" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="442" y="165" font-size="11" fill="#b85450" font-weight="bold">⑥</text>

  <!-- 边 root -> 三个孩子 -->
  <line x1="266" y1="96" x2="152" y2="148" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="100" x2="280" y2="144" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="294" y1="96" x2="408" y2="148" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 第三层：3 的孩子 5, 6 -->
  <circle cx="100" cy="240" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="120" y="245" font-size="11" fill="#b85450" font-weight="bold">③</text>

  <circle cx="180" cy="240" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="200" y="245" font-size="11" fill="#b85450" font-weight="bold">④</text>

  <line x1="128" y1="174" x2="108" y2="228" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="152" y1="174" x2="172" y2="228" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 遍历路径虚线箭头 -->
  <path d="M 280 100 Q 200 130 150 148" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 176 Q 120 200 106 228" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 116 240 L 168 240" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 226 Q 240 190 272 168" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 160 L 408 160" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归骨架说明框 -->
  <rect x="30" y="278" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="302" font-size="12" fill="#333" font-weight="bold">递归骨架（根 → 依次每个孩子）：</text>
  <text x="50" y="324" font-size="12" fill="#555" font-family="monospace">preorder(node): ans.append(node.val);  for c in children: preorder(c)</text>
  <text x="50" y="346" font-size="11" fill="#888">• 先访问根，再从左到右依次递归每个孩子</text>
  <text x="50" y="360" font-size="11" fill="#888">• 是二叉树前序「根→左→右」的自然推广：左右两子 → 任意多个孩子</text>
</svg>
