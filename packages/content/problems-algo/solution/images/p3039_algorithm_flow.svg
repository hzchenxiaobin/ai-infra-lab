<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 求最大频率 → 逆序收集 → 反转</text>

  <!-- start -->
  <rect x="212" y="36" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 64 L 260 80" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- count -->
  <rect x="172" y="82" width="176" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计 cnt[26]（正向一趟）</text>
  <path d="M 260 114 L 260 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- max -->
  <rect x="172" y="132" width="176" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mx = max(cnt)</text>
  <path d="M 260 164 L 260 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init i -->
  <rect x="172" y="182" width="176" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = n − 1（从右往左扫）</text>
  <path d="M 260 214 L 260 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,232 350,266 260,300 170,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i ≥ 0 ?</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">扫完了吗</text>

  <!-- no branch: reverse + return -->
  <path d="M 350 266 L 396 266" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="368" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="398" y="250" width="108" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">反转 ans</text>
  <path d="M 452 282 L 452 298" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="398" y="300" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="321" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes branch down -->
  <path d="M 260 300 L 260 322" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="315" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2 -->
  <polygon points="260,324 366,360 260,396 154,360" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[s[i]] == mx ?</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是幸存字母的最后出现吗</text>

  <!-- yes: collect -->
  <path d="M 366 360 L 398 360" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="382" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="340" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="456" y="356" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收集 s[i]</text>
  <text x="456" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cnt ← −1 去重</text>
  <!-- collect box joins decrement line -->
  <path d="M 456 380 L 456 428 L 312 428" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no: skip -->
  <path d="M 260 396 L 260 408" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="406" font-size="10.5" fill="#b85450" filter="url(#rough2)">否，跳过</text>

  <!-- i-- -->
  <rect x="216" y="410" width="96" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="264" y="430" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i − −</text>

  <!-- loop back -->
  <path d="M 216 425 L 110 425 L 110 266 L 164 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="106" y="350" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">继续逆序扫</text>

  <!-- note box -->
  <rect x="392" y="76" width="116" height="118" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">逆序扫描：</text>
  <text x="450" y="115" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第一次遇到 c</text>
  <text x="450" y="132" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">= c 的最后出现</text>
  <text x="450" y="155" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">cnt=−1 当哨兵，</text>
  <text x="450" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">后面再遇到 c</text>
  <text x="450" y="189" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">自动不等于 mx</text>
</svg>
