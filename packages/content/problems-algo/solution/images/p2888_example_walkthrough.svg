<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：4 行 + 2 行 → 6 行，默认索引出现重复标签</text>

  <!-- df2 rows tint -->
  <rect x="201" y="188" width="258" height="54" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- result table -->
  <rect x="200" y="55" width="260" height="187" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <line x1="200" y1="80" x2="460" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="55" x2="295" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="55" x2="395" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="200" y1="107" x2="460" y2="107" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="200" y1="134" x2="460" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="200" y1="161" x2="460" y2="161" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="200" y1="215" x2="460" y2="215" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="200" y1="188" x2="460" y2="188" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <text x="247" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">student_id</text>
  <text x="345" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">name</text>
  <text x="427" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">age</text>

  <text x="247" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mason</text>
  <text x="427" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="247" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="345" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ava</text>
  <text x="427" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="247" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="345" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Taylor</text>
  <text x="427" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <text x="247" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="345" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="427" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">17</text>
  <text x="247" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="345" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Leo</text>
  <text x="427" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="247" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="345" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="427" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- left source labels -->
  <text x="190" y="99" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">df1 第 0 行</text>
  <text x="190" y="126" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">df1 第 1 行</text>
  <text x="190" y="153" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">df1 第 2 行</text>
  <text x="190" y="180" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">df1 第 3 行</text>
  <text x="190" y="207" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">df2 第 0 行</text>
  <text x="190" y="234" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">df2 第 1 行</text>

  <!-- right index labels -->
  <text x="470" y="99" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">索引 0</text>
  <text x="470" y="126" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">索引 1</text>
  <text x="470" y="153" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">索引 2</text>
  <text x="470" y="180" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">索引 3</text>
  <text x="470" y="207" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">索引 0 ⚠ 重复</text>
  <text x="470" y="234" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">索引 1 ⚠ 重复</text>
  <text x="470" y="189" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">← df1/df2 分界</text>

  <!-- bottom notes -->
  <rect x="60" y="268" width="480" height="127" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 行序固定：df1 全部行在上（原序），df2 全部行在下（原序）</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 默认索引 = 两表原索引拼接 → 0,1,2,3,0,1 出现重复标签</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（此时 .loc[0] 会一次命中两行）</text>
  <text x="300" y="365" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 判题按值比较不受影响；要唯一索引用 ignore_index=True 得 0..5</text>
</svg>
