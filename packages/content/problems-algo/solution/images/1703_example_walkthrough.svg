<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,0,0,0,0,0,1,1], k = 3</text>

  <!-- ===== Step 1: nums ===== -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">① 原数组</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="100" y="44" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="116" y="63" fill="#4a7a3a">1</text>
    <rect x="132" y="44" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="148" y="63" fill="#aaa">0</text>
    <rect x="164" y="44" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="180" y="63" fill="#aaa">0</text>
    <rect x="196" y="44" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="212" y="63" fill="#aaa">0</text>
    <rect x="228" y="44" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="244" y="63" fill="#aaa">0</text>
    <rect x="260" y="44" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="276" y="63" fill="#aaa">0</text>
    <rect x="292" y="44" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="308" y="63" fill="#4a7a3a">1</text>
    <rect x="324" y="44" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="340" y="63" fill="#4a7a3a">1</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="116" y="84">0</text>
    <text x="148" y="84">1</text>
    <text x="180" y="84">2</text>
    <text x="212" y="84">3</text>
    <text x="244" y="84">4</text>
    <text x="276" y="84">5</text>
    <text x="308" y="84">6</text>
    <text x="340" y="84">7</text>
  </g>

  <!-- ===== Step 2: pos & q ===== -->
  <text x="40" y="116" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">② 提取 pos / 计算 q</text>

  <!-- pos row -->
  <text x="50" y="138" font-size="10" fill="#446688" filter="url(#rough2)">pos</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="120" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="140" y="140" fill="#446688">0</text>
    <rect x="200" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="220" y="140" fill="#446688">6</text>
    <rect x="280" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="300" y="140" fill="#446688">7</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="140" y="158">i=0</text>
    <text x="220" y="158">i=1</text>
    <text x="300" y="158">i=2</text>
  </g>

  <!-- q row -->
  <text x="50" y="184" font-size="10" fill="#446688" filter="url(#rough2)">q</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="120" y="168" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="186" fill="#446688">0</text>
    <rect x="200" y="168" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="220" y="186" fill="#d6a040">5</text>
    <rect x="280" y="168" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="300" y="186" fill="#446688">5</text>
  </g>
  <text x="220" y="210" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 中位数 m=1, q[m]=5</text>

  <!-- ===== Step 3: prefix sum ===== -->
  <text x="40" y="236" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">③ 前缀和 P[]</text>
  <text x="50" y="258" font-size="10" fill="#446688" filter="url(#rough2)">P</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="90" y="242" width="36" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="108" y="259" fill="#888">0</text>
    <rect x="126" y="242" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="144" y="259" fill="#446688">0</text>
    <rect x="162" y="242" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="259" fill="#446688">5</text>
    <rect x="198" y="242" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="259" fill="#446688">10</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="108" y="278">P[0]</text>
    <text x="144" y="278">P[1]</text>
    <text x="180" y="278">P[2]</text>
    <text x="216" y="278">P[3]</text>
  </g>

  <!-- ===== Step 4: cost computation ===== -->
  <text x="40" y="306" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">④ 窗口 l=0, r=2, m=1 算代价</text>
  <rect x="50" y="314" width="270" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="334" font-size="10" fill="#555" filter="url(#rough2)">L = m−l = 1,  R = r−m = 1</text>
  <text x="62" y="350" font-size="10" fill="#555" filter="url(#rough2)">left_sum  = P[1]−P[0] = 0</text>
  <text x="62" y="366" font-size="10" fill="#555" filter="url(#rough2)">right_sum = P[3]−P[2] = 10−5 = 5</text>
  <text x="62" y="384" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost = 5 − 0 + 5×(1−1) = 5</text>
  <text x="62" y="400" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k 奇 → L=R → q[m] 项消失 ✓</text>

  <!-- ===== Step 4b: absolute value check ===== -->
  <rect x="340" y="314" width="220" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="352" y="334" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">验证（绝对值定义）</text>
  <text x="352" y="352" font-size="10" fill="#555" filter="url(#rough2)">|0−5| + |5−5| + |5−5|</text>
  <text x="352" y="368" font-size="10" fill="#555" filter="url(#rough2)">= 5 + 0 + 0</text>
  <text x="352" y="388" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 5  ✓</text>
  <text x="352" y="402" font-size="9" fill="#888" filter="url(#rough2)">与公式结果一致</text>

  <!-- ===== Step 5: gathering ===== -->
  <text x="40" y="432" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">⑤ 聚集：c = q[m] = 5 → 目标位置 5, 6, 7</text>

  <!-- before -->
  <text x="40" y="458" font-size="10" fill="#888" filter="url(#rough2)">交换前</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="100" y="442" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="115" y="460" fill="#4a7a3a">1</text>
    <rect x="130" y="442" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="145" y="460" fill="#aaa">0</text>
    <rect x="160" y="442" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="175" y="460" fill="#aaa">0</text>
    <rect x="190" y="442" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="205" y="460" fill="#aaa">0</text>
    <rect x="220" y="442" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="235" y="460" fill="#aaa">0</text>
    <rect x="250" y="442" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="265" y="460" fill="#aaa">0</text>
    <rect x="280" y="442" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="295" y="460" fill="#4a7a3a">1</text>
    <rect x="310" y="442" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="325" y="460" fill="#4a7a3a">1</text>
  </g>

  <!-- movement arrow -->
  <path d="M 115 472 C 115 486, 265 486, 265 498" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="488" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 从位置 0 右移 5 格 → 位置 5</text>

  <!-- after -->
  <text x="40" y="518" font-size="10" fill="#888" filter="url(#rough2)">交换后</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="100" y="502" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="115" y="520" fill="#aaa">0</text>
    <rect x="130" y="502" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="145" y="520" fill="#aaa">0</text>
    <rect x="160" y="502" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="175" y="520" fill="#aaa">0</text>
    <rect x="190" y="502" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="205" y="520" fill="#aaa">0</text>
    <rect x="220" y="502" width="30" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="235" y="520" fill="#aaa">0</text>
    <rect x="250" y="502" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="265" y="520" fill="#4a7a3a">1</text>
    <rect x="280" y="502" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="295" y="520" fill="#4a7a3a">1</text>
    <rect x="310" y="502" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="325" y="520" fill="#4a7a3a">1</text>
  </g>
  <path d="M 252 532 L 252 536 L 328 536 L 328 532" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="290" y="532" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold" filter="url(#rough2)">连续 3 个 1</text>
</svg>
