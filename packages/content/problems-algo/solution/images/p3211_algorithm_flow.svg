<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">回溯流程：剪枝发生在「生成」之前，构造到位即答案</text>

  <!-- 开始 -->
  <rect x="100" y="40" width="170" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">path = ""，进入 dfs()</text>

  <path d="M185,72 L185,94" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：长度判断 -->
  <polygon points="185,96 262,134 185,172 108,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">len(path) == n ?</text>

  <text x="272" y="128" font-size="11" fill="#a06a10" filter="url(#rough2)">是</text>
  <path d="M262,134 L328,134" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收集答案 -->
  <rect x="332" y="116" width="180" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="422" y="131" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans.push_back(path)</text>
  <text x="422" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 收集一个答案（无需检查合法性）</text>

  <path d="M422,152 L422,172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="348" y="174" width="148" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return（回到上一层）</text>

  <text x="193" y="188" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M185,172 L185,196" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举字符 -->
  <rect x="102" y="198" width="166" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举下一字符 c</text>
  <text x="185" y="226" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c ∈ { '0', '1' }</text>

  <path d="M185,232 L185,252" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：剪枝判断 -->
  <polygon points="185,254 285,294 185,334 85,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c == '0' 且</text>
  <text x="185" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">末位 == '0' ?</text>

  <text x="293" y="286" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M285,294 L328,294" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 剪枝 -->
  <rect x="332" y="276" width="180" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="422" y="291" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">跳过这个 c（continue）</text>
  <text x="422" y="307" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">非法分支根本不生成</text>

  <path d="M422,274 L422,215 L276,215" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="208" font-size="10" fill="#b85450" filter="url(#rough2)">换下一个 c</text>

  <text x="193" y="348" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M185,334 L185,354" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归 + 回溯 -->
  <rect x="88" y="356" width="194" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="370" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">追加 c → 递归 dfs()</text>
  <text x="185" y="385" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">递归返回后撤销 c（回溯）</text>

  <path d="M88,373 L58,373 L58,215 L94,215" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10" fill="#888" transform="rotate(-90 50 300)" text-anchor="middle" filter="url(#rough2)">试下一个 c</text>
</svg>
