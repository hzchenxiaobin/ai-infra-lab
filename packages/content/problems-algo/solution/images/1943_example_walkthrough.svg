<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：segments = [[1,4,5],[4,7,7],[1,7,9]]</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888">差分表 {1:+14, 4:+2, 7:−16}，扫描端点输出区间</text>

  <!-- input segments -->
  <text x="40" y="76" font-size="12" fill="#888" font-weight="bold">输入线段</text>
  <rect x="120" y="84" width="120" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="98" text-anchor="middle" font-size="10" fill="#446688">[1,4) 色5</text>
  <rect x="240" y="108" width="180" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">[4,7) 色7</text>
  <rect x="120" y="132" width="300" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#d6a040">[1,7) 色9</text>

  <!-- arrow -->
  <path d="M 340 158 L 340 176" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- diff table -->
  <rect x="40" y="182" width="600" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="204" font-size="12" fill="#b85450" font-weight="bold">差分表（端点 → ±color 累加）</text>
  <g font-size="11" font-family="monospace">
    <rect x="60" y="214" width="160" height="20" rx="3" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="228" text-anchor="middle" fill="#b85450">diff[1] = 5+9 = 14</text>
    <rect x="240" y="214" width="160" height="20" rx="3" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="320" y="228" text-anchor="middle" fill="#b85450">diff[4] = 7−5 = 2</text>
    <rect x="420" y="214" width="180" height="20" rx="3" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="510" y="228" text-anchor="middle" fill="#b85450">diff[7] = −7−9 = −16</text>
  </g>

  <!-- arrow -->
  <path d="M 340 242 L 340 260" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- sweep table -->
  <text x="40" y="276" font-size="12" fill="#888" font-weight="bold">扫描过程</text>

  <!-- header -->
  <g font-size="11">
    <rect x="40" y="284" width="80" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="302" text-anchor="middle" fill="#446688" font-weight="bold">端点 pos</text>
    <rect x="120" y="284" width="120" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="302" text-anchor="middle" fill="#d6a040" font-weight="bold">diff[pos]</text>
    <rect x="240" y="284" width="100" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="290" y="302" text-anchor="middle" fill="#b85450" font-weight="bold">sum（前）</text>
    <rect x="340" y="284" width="140" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="410" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">输出区间</text>
    <rect x="480" y="284" width="160" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="560" y="302" text-anchor="middle" fill="#b85450" font-weight="bold">sum（后）</text>
  </g>

  <!-- row 1: pos=1 -->
  <g font-size="11">
    <rect x="40" y="316" width="80" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="336" text-anchor="middle" fill="#444">1</text>
    <rect x="120" y="316" width="120" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="336" text-anchor="middle" fill="#b85450">+14</text>
    <rect x="240" y="316" width="100" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="290" y="336" text-anchor="middle" fill="#888">0</text>
    <rect x="340" y="316" width="140" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="410" y="336" text-anchor="middle" fill="#888">—（prev=None）</text>
    <rect x="480" y="316" width="160" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="560" y="336" text-anchor="middle" fill="#b85450" font-weight="bold">14</text>
  </g>

  <!-- row 2: pos=4 -->
  <g font-size="11">
    <rect x="40" y="352" width="80" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="372" text-anchor="middle" fill="#444">4</text>
    <rect x="120" y="352" width="120" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="372" text-anchor="middle" fill="#b85450">+2</text>
    <rect x="240" y="352" width="100" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="290" y="372" text-anchor="middle" fill="#b85450" font-weight="bold">14</text>
    <rect x="340" y="352" width="140" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="410" y="372" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,4,14] ✓</text>
    <rect x="480" y="352" width="160" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="560" y="372" text-anchor="middle" fill="#b85450" font-weight="bold">16</text>
  </g>

  <!-- row 3: pos=7 -->
  <g font-size="11">
    <rect x="40" y="388" width="80" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="408" text-anchor="middle" fill="#444">7</text>
    <rect x="120" y="388" width="120" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="408" text-anchor="middle" fill="#b85450">−16</text>
    <rect x="240" y="388" width="100" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="290" y="408" text-anchor="middle" fill="#b85450" font-weight="bold">16</text>
    <rect x="340" y="388" width="140" height="32" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="410" y="408" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[4,7,16] ✓</text>
    <rect x="480" y="388" width="160" height="32" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="560" y="408" text-anchor="middle" fill="#888">0</text>
  </g>

  <!-- result -->
  <rect x="40" y="428" width="600" height="8" fill="#e6f4ea" stroke="none"/>
</svg>
