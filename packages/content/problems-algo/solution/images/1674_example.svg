<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例 1：nums = [1,2,4,3], limit = 4
  </text>

  <!-- Pair boxes -->
  <text x="80" y="56" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">两对</text>
  <rect x="150" y="40" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 3)</text>
  <rect x="304" y="40" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 4)</text>

  <!-- Column geometry: S=2..8, 7 columns -->
  <!-- centers: 130, 178, 226, 274, 322, 370, 418 ; cell w=44, h=28 -->

  <!-- Row label: S -->
  <text x="86" y="104" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">S</text>

  <!-- S header cells -->
  <rect x="108" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="226" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="252" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="300" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="348" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="396" y="88" width="44" height="28" fill="#f5f5f5" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- Row label: diff -->
  <text x="86" y="152" text-anchor="end" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">diff</text>

  <!-- diff cells -->
  <rect x="108" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">+3</text>
  <rect x="156" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">−1</text>
  <rect x="204" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="226" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">−1</text>
  <rect x="252" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">+1</text>
  <rect x="300" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">−1</text>
  <rect x="348" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">+1</text>
  <rect x="396" y="136" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">+1</text>

  <!-- arrow from diff to cost -->
  <text x="275" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↓ 前缀和</text>

  <!-- Row label: cost -->
  <text x="86" y="216" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cost</text>

  <!-- cost cells: 3, 2, [1], 2, [1], 2, 3 — highlight the 1s -->
  <rect x="108" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <!-- highlighted min cell S=4 -->
  <rect x="204" y="200" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="252" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <!-- highlighted min cell S=6 -->
  <rect x="300" y="200" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="322" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="348" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="396" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- Answer box -->
  <rect x="120" y="252" width="280" height="36" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    min = 1  (S = 4 或 S = 6) ✓
  </text>

  <!-- Bottom note -->
  <rect x="50" y="300" width="420" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">
    S=4：对(1,3)不改 + 对(2,4)改4→2 = 1 次
  </text>
</svg>
