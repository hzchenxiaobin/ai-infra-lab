<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">GCD 化简分数：精确表示斜率</text>

  <!-- Problem with floats -->
  <rect x="30" y="46" width="250" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="66" font-size="11" fill="#b85450" font-weight="bold">浮点数的问题</text>
  <text x="45" y="84" font-size="10" fill="#555" font-family="monospace">1/3 = 0.3333...33</text>
  <text x="45" y="100" font-size="10" fill="#555" font-family="monospace">2/6 = 0.3333...33</text>
  <text x="45" y="116" font-size="9" fill="#888">可能相同，但不保证！大分母易出错</text>

  <!-- GCD solution -->
  <rect x="300" y="46" width="250" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="66" font-size="11" fill="#4a7a3a" font-weight="bold">GCD 分数法（精确）</text>
  <text x="315" y="84" font-size="10" fill="#555" font-family="monospace">g = gcd(|dy|, |dx|)</text>
  <text x="315" y="100" font-size="10" fill="#555" font-family="monospace">dy/g, dx/g → 最简分数</text>
  <text x="315" y="116" font-size="9" fill="#888">相同斜率 → 相同键，100% 可靠</text>

  <!-- Arrow -->
  <path d="M 280 86 L 300 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Examples table -->
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">化简示例</text>

  <!-- Table header -->
  <rect x="30" y="166" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">情况</text>
  <text x="160" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dy</text>
  <text x="220" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dx</text>
  <text x="290" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gcd</text>
  <text x="390" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">化简后键</text>
  <text x="490" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">说明</text>

  <!-- Row 1: general -->
  <rect x="30" y="194" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="10" fill="#333">一般</text>
  <text x="160" y="210" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">6</text>
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
  <text x="390" y="210" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" font-family="monospace">(1, 3)</text>
  <text x="490" y="210" text-anchor="middle" font-size="9" fill="#888">dy/dx=1/3</text>

  <!-- Row 2: general neg -->
  <rect x="30" y="220" width="500" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="10" fill="#333">负斜率</text>
  <text x="160" y="236" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">-2</text>
  <text x="220" y="236" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">6</text>
  <text x="290" y="236" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
  <text x="390" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(-1, 3)</text>
  <text x="490" y="236" text-anchor="middle" font-size="9" fill="#888">dx&gt;0 ✓</text>

  <!-- Row 3: vertical -->
  <rect x="30" y="246" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">竖直</text>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">5</text>
  <text x="220" y="262" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">0</text>
  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">5</text>
  <text x="390" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" font-family="monospace">(1, 0)</text>
  <text x="490" y="262" text-anchor="middle" font-size="9" fill="#888">dx=0</text>

  <!-- Row 4: horizontal -->
  <rect x="30" y="272" width="500" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="288" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">水平</text>
  <text x="160" y="288" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">0</text>
  <text x="220" y="288" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">5</text>
  <text x="290" y="288" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">5</text>
  <text x="390" y="288" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" font-family="monospace">(0, 1)</text>
  <text x="490" y="288" text-anchor="middle" font-size="9" fill="#888">dy=0</text>

  <!-- Sign normalization note -->
  <rect x="30" y="306" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="45" y="324" font-size="11" fill="#d6a040" font-weight="bold">符号统一</text>
  <text x="130" y="324" font-size="10" fill="#555" font-family="monospace">if dx &lt; 0: dy = -dy; dx = -dx</text>
  <text x="45" y="340" font-size="9" fill="#888">保证 (-1,-3) 和 (1,3) 映射到同一键 (1,3) — 避免方向不同导致分桶</text>
</svg>
