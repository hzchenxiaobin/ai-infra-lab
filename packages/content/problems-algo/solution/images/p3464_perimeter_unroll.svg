<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">核心观察：正方形边界 → 周长坐标（顺时针一圈，t ∈ [0, 4s)）</text>

  <!-- 左：正方形，四条边着色 -->
  <line x1="70" y1="230" x2="70" y2="90" stroke="#446688" stroke-width="3.5" filter="url(#rough2)"/>
  <line x1="70" y1="90" x2="210" y2="90" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>
  <line x1="210" y1="90" x2="210" y2="230" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <line x1="210" y1="230" x2="70" y2="230" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>

  <!-- 顺时针方向小箭头 -->
  <path d="M70,192 L70,176" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140,90 L156,90" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M210,150 L210,166" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140,230 L124,230" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 边内公式标签 -->
  <text x="78" y="146" font-size="10" fill="#446688" filter="url(#rough2)">左边 x=0</text>
  <text x="78" y="160" font-size="10" fill="#446688" filter="url(#rough2)">t = y</text>
  <text x="140" y="105" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">上边 y=s，t = s+x</text>
  <text x="202" y="146" text-anchor="end" font-size="10" fill="#d6a040" filter="url(#rough2)">右边 x=s</text>
  <text x="202" y="160" text-anchor="end" font-size="10" fill="#d6a040" filter="url(#rough2)">t = 2s+(s−y)</text>
  <text x="140" y="222" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下边 y=0，t = 3s+(s−x)</text>

  <!-- 角点标签 -->
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,0) t=0</text>
  <text x="70" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,s) t=s</text>
  <text x="210" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(s,s) t=2s</text>
  <text x="210" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(s,0) t=3s</text>

  <!-- 对边点对 P、Q 与曼哈顿距离 -->
  <circle cx="70" cy="205" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">P(0,a)</text>
  <circle cx="210" cy="115" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="220" y="112" font-size="11" fill="#d6a040" filter="url(#rough2)">Q(s,b)</text>
  <path d="M74,203 L206,117" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对边点对：L₁ = s+|a−b| ≥ s</text>

  <text x="140" y="272" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（顺时针展开）</text>

  <!-- 右：展开后的周长数轴 -->
  <line x1="280" y1="115" x2="335" y2="115" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <line x1="335" y1="115" x2="390" y2="115" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="390" y1="115" x2="445" y2="115" stroke="#d6a040" stroke-width="4" filter="url(#rough2)"/>
  <line x1="445" y1="115" x2="500" y2="115" stroke="#b85450" stroke-width="4" filter="url(#rough2)"/>

  <circle cx="294" cy="115" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="294" y="99" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">P</text>
  <circle cx="405" cy="115" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="405" y="99" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">Q</text>

  <text x="307" y="133" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左</text>
  <text x="362" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">上</text>
  <text x="417" y="133" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">右</text>
  <text x="472" y="133" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下</text>

  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="335" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s</text>
  <text x="390" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2s</text>
  <text x="445" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3s</text>
  <text x="500" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4s</text>

  <!-- 首尾相接成环 -->
  <path d="M500,122 C514,170 266,170 280,122" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="182" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">首尾相接成环：弧距 = min(Δ, 4s−Δ)</text>

  <!-- 底部结论框 -->
  <rect x="30" y="288" width="460" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="311" font-size="12" fill="#b85450" filter="url(#rough2)">k ≥ 4 时的关键等价：</text>
  <text x="48" y="331" font-size="11" fill="#333" filter="url(#rough2)">① 任意边界点对：L₁ ≤ 短弧长（同边/邻边取等；对边 L₁ = s+|a−b| 更小）</text>
  <text x="48" y="350" font-size="11" fill="#333" filter="url(#rough2)">② 两两弧距 ≥ x ⟹ kx ≤ 4s ⟹ x ≤ 4s/k ≤ s</text>
  <text x="48" y="369" font-size="11" fill="#333" filter="url(#rough2)">③ 对边点对 L₁ = s+|a−b| ≥ s ≥ x，自动安全</text>
  <text x="48" y="388" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⟹ 「两两 L₁ ≥ x」⟺「两两弧距 ≥ x」，二维选点降维成一维环形选点</text>
</svg>
