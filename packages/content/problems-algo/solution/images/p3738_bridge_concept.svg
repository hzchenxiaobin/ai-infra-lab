<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：替换位 i 的自由值 v 把左右两段游程焊接起来</text>

  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">示例 nums = [1,5,2,6,7]，替换 i = 2（原值 2 → 任意整数 v）</text>
  <path d="M 260 46 L 260 54" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <rect x="118" y="56" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="56" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="56" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="56" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="56" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="144" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="202" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="260" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#a87b20" filter="url(#rough2)">v</text>
  <text x="318" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="376" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 下标 -->
  <text x="144" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="260" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="318" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="376" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <text x="202" y="113" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i−1</text>
  <text x="260" y="113" text-anchor="middle" font-size="9.5" fill="#a87b20" filter="url(#rough2)">i</text>
  <text x="318" y="113" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i+1</text>

  <!-- 左右段括号 -->
  <path d="M 118 120 L 118 128 L 228 128 L 228 120" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 292 120 L 292 128 L 402 128 L 402 120" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="173" y="144" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">左段 pref[i−1] = 2</text>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#a87b20" filter="url(#rough2)">占 1 格</text>
  <text x="347" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">右段 suff[i+1] = 2</text>

  <!-- 中部解释框 -->
  <rect x="40" y="158" width="440" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v 需同时接住两侧：nums[i−1] ≤ v ≤ nums[i+1]，即 5 ≤ v ≤ 6</text>
  <text x="260" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">v 是任意整数 ⇒ 只要 nums[i−1] ≤ nums[i+1]，这样的 v 必然存在</text>

  <!-- 替换后结果 -->
  <rect x="152" y="218" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="218" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="218" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="218" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="218" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="172" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="216" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="260" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b20" filter="url(#rough2)">5</text>
  <text x="304" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="348" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取 v = 5：整段非递减，窗口长度 = 2 + 1 + 2 = 5</text>

  <!-- 三个候选框 -->
  <rect x="14" y="282" width="150" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="89" y="302" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">只左拼</text>
  <text x="89" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pref[i−1] + 1</text>
  <text x="89" y="338" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">v ≥ 左邻，恒可行</text>

  <rect x="185" y="282" width="150" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">只右拼</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + suff[i+1]</text>
  <text x="260" y="338" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">v ≤ 右邻，恒可行</text>

  <rect x="356" y="282" width="150" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="431" y="302" text-anchor="middle" font-size="12" fill="#a87b20" filter="url(#rough2)">双拼</text>
  <text x="431" y="320" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">pref[i−1]+1+suff[i+1]</text>
  <text x="431" y="338" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">需 nums[i−1] ≤ nums[i+1]</text>

  <!-- 警告框 -->
  <rect x="40" y="364" width="440" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 若 nums[i−1] &gt; nums[i+1]：区间为空，双拼作废，退化为两个单拼取 max</text>
  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">边界 i=0 / i=n−1 只有单拼——单拼候选最易漏（[3,1,2,4] 替换首元素得 4）</text>
</svg>
