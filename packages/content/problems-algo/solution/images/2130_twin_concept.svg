<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">链表最大孪生和：第 i 个节点 ↔ 第 (n-1-i) 个节点</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">n 为偶数，共有 n/2 对孪生，求各对值之和的最大值</text>

  <!-- ===== 链表节点 + 下标 ===== -->
  <g font-size="14">
    <rect x="110" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="245" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="170" y1="239" x2="208" y2="239" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="214" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="244" y="245" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="274" y1="239" x2="312" y2="239" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="318" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="348" y="245" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="378" y1="239" x2="416" y2="239" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="422" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="452" y="245" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- 下标 -->
  <g font-size="11" fill="#888">
    <text x="140" y="282" text-anchor="middle">i = 0</text>
    <text x="244" y="282" text-anchor="middle">i = 1</text>
    <text x="348" y="282" text-anchor="middle">i = 2</text>
    <text x="452" y="282" text-anchor="middle">i = 3</text>
    <text x="310" y="300" text-anchor="middle" fill="#aaa">n = 4，孪生下标 n-1-i</text>
  </g>

  <!-- ===== 孪生配对弧线 ===== -->
  <!-- (0,3) 大弧，橙色 -->
  <path d="M 140 220 C 140 120, 452 120, 452 220" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="296" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">孪生和 = 5 + 1 = 6</text>

  <!-- (1,2) 小弧，绿色 -->
  <path d="M 244 220 C 244 168, 348 168, 348 220" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="296" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">孪生和 = 4 + 2 = 6</text>

  <!-- 配对端点小圆点 -->
  <circle cx="140" cy="220" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="452" cy="220" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="244" cy="220" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="348" cy="220" r="3" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- ===== 结果 ===== -->
  <rect x="190" y="330" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">max{6, 6} = 6</text>
  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a">最大孪生和</text>
</svg>
