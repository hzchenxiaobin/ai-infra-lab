<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位统计 + 累加贡献</text>

  <!-- start -->
  <rect x="200" y="46" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">total = 0</text>
  <path d="M 260 78 L 260 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop init -->
  <rect x="180" y="94" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">for k in 0 .. 30</text>
  <path d="M 260 126 L 260 140" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count c -->
  <rect x="150" y="142" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 nums 统计第 k 位为 1</text>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">的个数 c = Σ (num &gt;&gt; k) &amp; 1</text>
  <path d="M 260 182 L 260 196" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate -->
  <rect x="130" y="198" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">total += c × (n − c)</text>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#888">第 k 位贡献的差异对数</text>

  <!-- loop back arrow -->
  <path d="M 390 218 Q 430 218 430 110 Q 430 110 340 110" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="166" text-anchor="middle" font-size="10.5" fill="#888">下一</text>
  <text x="446" y="180" text-anchor="middle" font-size="10.5" fill="#888">位 k</text>

  <!-- after loop -->
  <path d="M 260 238 L 260 258" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: k exhausted? -->
  <polygon points="260,260 330,290 260,320 190,290" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">31 位</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">都遍历完?</text>
  <text x="340" y="288" font-size="10.5" fill="#888">否→回循环</text>
  <path d="M 260 320 L 260 338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="332" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- return -->
  <rect x="190" y="340" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return total</text>
</svg>
