<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="620" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：前缀乘 pp 数组的演化</text>

  <text x="30" y="56" font-size="11" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="130" y="56" font-size="11" fill="#446688" filter="url(#rough2)">pp 数组</text>
  <text x="500" y="56" font-size="11" fill="#446688" filter="url(#rough2)">结果</text>

  <line x1="20" y1="64" x2="580" y2="64" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="86" font-size="11" fill="#333" filter="url(#rough2)">add(3)</text>
  <rect x="130" y="72" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="72" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="500" y="87" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="100" x2="580" y2="100" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">add(0)</text>
  <rect x="130" y="108" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="123" font-size="10" fill="#b85450" filter="url(#rough2)">← 重置！清空历史</text>
  <text x="500" y="123" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="136" x2="580" y2="136" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="158" font-size="11" fill="#333" filter="url(#rough2)">add(2)</text>
  <rect x="130" y="144" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="144" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="500" y="159" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="172" x2="580" y2="172" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="194" font-size="11" fill="#333" filter="url(#rough2)">add(5)</text>
  <rect x="130" y="180" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="180" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="180" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <text x="500" y="195" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="208" x2="580" y2="208" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="230" font-size="11" fill="#333" filter="url(#rough2)">add(4)</text>
  <rect x="130" y="216" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="216" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="216" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <rect x="232" y="216" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="500" y="231" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="244" x2="580" y2="244" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="270" font-size="11" fill="#d6a040" filter="url(#rough2)">getProduct(2)</text>
  <text x="135" y="270" font-size="10" fill="#333" filter="url(#rough2)">k=2 &lt; 4=len</text>
  <text x="240" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pp[-1]÷pp[-3]</text>
  <text x="350" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= 40 ÷ 2</text>
  <rect x="480" y="258" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">20 ✓</text>

  <line x1="20" y1="284" x2="580" y2="284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="310" font-size="11" fill="#d6a040" filter="url(#rough2)">getProduct(3)</text>
  <text x="135" y="310" font-size="10" fill="#333" filter="url(#rough2)">k=3 &lt; 4=len</text>
  <text x="240" y="310" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pp[-1]÷pp[-4]</text>
  <text x="350" y="310" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= 40 ÷ 1</text>
  <rect x="480" y="298" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">40 ✓</text>

  <line x1="20" y1="324" x2="580" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="350" font-size="11" fill="#d6a040" filter="url(#rough2)">getProduct(4)</text>
  <text x="135" y="350" font-size="10" fill="#b85450" filter="url(#rough2)">k=4 ≥ 4=len</text>
  <text x="240" y="350" font-size="10" fill="#b85450" filter="url(#rough2)">含 0 → 直接返回</text>
  <rect x="480" y="338" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="353" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0 ✓</text>

  <line x1="20" y1="364" x2="580" y2="364" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="386" font-size="11" fill="#333" filter="url(#rough2)">add(8)</text>
  <rect x="130" y="372" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="387" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="372" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="387" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="372" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="387" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <rect x="232" y="372" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="387" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <rect x="266" y="372" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="387" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">320</text>
  <text x="500" y="387" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <line x1="20" y1="400" x2="580" y2="400" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="426" font-size="11" fill="#d6a040" filter="url(#rough2)">getProduct(2)</text>
  <text x="135" y="426" font-size="10" fill="#333" filter="url(#rough2)">k=2 &lt; 5=len</text>
  <text x="240" y="426" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pp[-1]÷pp[-3]</text>
  <text x="350" y="426" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= 320 ÷ 10</text>
  <rect x="480" y="414" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="429" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">32 ✓</text>

  <rect x="40" y="460" width="520" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="484" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">关键观察小结</text>
  <text x="60" y="508" font-size="11" fill="#333" filter="url(#rough2)">① add 追乘：pp[-1] × num，O(1) 维护前缀乘积</text>
  <text x="60" y="528" font-size="11" fill="#333" filter="url(#rough2)">② add(0) 重置：pp = [1]，丢弃 0 之前所有前缀（含 0 区间恒为 0）</text>
  <text x="60" y="548" font-size="11" fill="#333" filter="url(#rough2)">③ getProduct(k)：k ≥ len(pp) ⇒ 含 0 ⇒ 返回 0；否则 pp[-1] ÷ pp[-k-1]</text>
  <text x="60" y="568" font-size="11" fill="#4a7a3a" filter="url(#rough2)">④ 两个操作均 O(1)，满足进阶要求</text>
  <text x="60" y="588" font-size="11" fill="#888" filter="url(#rough2)">⑤ pp[0]=1 是哨兵，保证 k == n 时除以 pp[0]=1 不越界</text>

</svg>
