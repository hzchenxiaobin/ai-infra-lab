<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两次绝对值 + 两个判断</text>

  <!-- start box -->
  <rect x="200" y="44" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dx = |sx − fx|</text>
  <text x="280" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dy = |sy − fy|</text>

  <line x1="280" y1="88" x2="280" y2="104" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- diamond A -->
  <polygon points="280,106 372,140 280,174 188,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dx==0 且 dy==0 ?</text>
  <text x="280" y="152" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（同格？）</text>

  <!-- A yes -> B -->
  <path d="M 188 140 L 145 140 L 145 194" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="158" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- A no -> C -->
  <path d="M 372 140 L 430 140 L 430 194" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="396" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- diamond B -->
  <polygon points="145,196 225,230 145,264 65,230" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t == 1 ?</text>
  <text x="145" y="244" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（被迫走 1 步？）</text>

  <!-- diamond C -->
  <polygon points="430,196 510,230 430,264 350,230" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(dx,dy) ≤ t ?</text>
  <text x="430" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（够走最短路？）</text>

  <!-- B yes -> red box1 -->
  <path d="M 145 264 L 145 286 L 95 286 L 95 308" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="152" y="280" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="30" y="310" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="331" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">false（回不来）</text>

  <!-- B no -> green box1 -->
  <path d="M 225 230 L 258 230 L 258 308" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="234" y="222" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="185" y="310" width="125" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="247" y="331" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true（t=0 或 ≥2）</text>

  <!-- C yes -> green box2 -->
  <path d="M 430 264 L 430 286 L 392 286 L 392 308" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="437" y="280" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="330" y="310" width="125" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="392" y="331" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true（绕路凑满）</text>

  <!-- C no -> red box2 -->
  <path d="M 510 230 L 528 230 L 528 286 L 480 286 L 480 308" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="516" y="222" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="462" y="310" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="506" y="331" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">false（不够）</text>

  <!-- bottom notes -->
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">同格：t ≠ 1 → true；异格：max(dx, dy) ≤ t → true</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">时间 O(1)、空间 O(1)</text>
</svg>
