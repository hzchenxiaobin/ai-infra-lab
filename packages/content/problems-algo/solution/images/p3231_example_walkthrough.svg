<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,3,1,4,2] 取反后的牌堆演化</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">v = −x；tails[k] = 长度 k+1 的非递减子序列的最小结尾；橙色 = 本步发生变化的堆</text>

  <!-- 列头 -->
  <text x="30" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">步骤</text>
  <text x="82" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x</text>
  <text x="132" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">v = −x</text>
  <text x="180" y="64" font-size="10" fill="#666" filter="url(#rough2)">二分（第一个 &gt; v）</text>
  <text x="374" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tails</text>

  <!-- 行① -->
  <text x="30" y="95" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">①</text>
  <rect x="64" y="74" width="36" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="95" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <rect x="112" y="74" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="95" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−5</text>
  <text x="180" y="95" font-size="10.5" fill="#555" filter="url(#rough2)">无 → 追加</text>
  <rect x="300" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="95" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−5</text>

  <!-- 行② -->
  <text x="30" y="141" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">②</text>
  <rect x="64" y="120" width="36" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="141" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="112" y="120" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="141" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−3</text>
  <text x="180" y="141" font-size="10.5" fill="#555" filter="url(#rough2)">无 → 追加</text>
  <rect x="300" y="120" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="141" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−5</text>
  <rect x="352" y="120" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="141" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−3</text>

  <!-- 行③ -->
  <text x="30" y="187" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">③</text>
  <rect x="64" y="166" width="36" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="187" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="112" y="166" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="187" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−1</text>
  <text x="180" y="187" font-size="10.5" fill="#555" filter="url(#rough2)">无 → 追加</text>
  <rect x="300" y="166" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="187" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−5</text>
  <rect x="352" y="166" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="187" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−3</text>
  <rect x="404" y="166" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="187" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 行④ -->
  <text x="30" y="233" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">④</text>
  <rect x="64" y="212" width="36" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="233" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <rect x="112" y="212" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="233" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−4</text>
  <text x="180" y="233" font-size="10.5" fill="#555" filter="url(#rough2)">−3（下标 1）→ 替换</text>
  <rect x="300" y="212" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="233" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−5</text>
  <rect x="352" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="233" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−4</text>
  <rect x="404" y="212" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="233" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−1</text>

  <!-- 行⑤ -->
  <text x="30" y="279" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">⑤</text>
  <rect x="64" y="258" width="36" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="279" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="112" y="258" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="279" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−2</text>
  <text x="180" y="279" font-size="10.5" fill="#555" filter="url(#rough2)">−1（下标 2）→ 替换</text>
  <rect x="300" y="258" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="279" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−5</text>
  <rect x="352" y="258" width="44" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="279" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">−4</text>
  <rect x="404" y="258" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="279" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>

  <!-- 结果 -->
  <text x="290" y="320" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">len(tails) = 3 ⇒ 答案 = 3</text>

  <!-- 交叉验证面板 -->
  <rect x="22" y="336" width="536" height="90" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">交叉验证：下界与上界在示例上同时兑现</text>

  <rect x="44" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="59" y="387" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="80" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="387" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="116" y="370" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="131" y="387" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="95" y="414" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反链 [5,3,1] ⇒ 至少 3 批</text>

  <path d="M 286 366 L 286 416" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <rect x="308" y="370" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="387" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="340" y="370" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="387" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="372" y="370" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="386" y="387" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="404" y="370" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="387" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="436" y="370" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="387" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="397" y="414" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">链 [3,4] / [1,2] / [5] ⇒ 3 批删空</text>
</svg>
