<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排除测试 + 纳入测试</text>

  <!-- Step 1: sort edges -->
  <rect x="180" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">边按权值排序</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#888">保留原始下标</text>
  <path d="M280,86 L280,100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: base MST -->
  <rect x="180" y="102" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Kruskal 求 base MST 权值</text>
  <text x="280" y="134" text-anchor="middle" font-size="10" fill="#888">标准并查集 + 贪心</text>
  <path d="M280,142 L280,156" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="160" y="158" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">for 每条原始边 i = 0 … m−1</text>
  <path d="M280,194 L280,206" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: exclude test -->
  <polygon points="280,210 400,250 280,290 160,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">排除边 i</text>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跑 Kruskal</text>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#888">权值 &gt; base?</text>

  <!-- yes → critical -->
  <path d="M400,250 L470,250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="470" y="234" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键边</text>
  <text x="510" y="268" text-anchor="middle" font-size="9.5" fill="#888">加入 critical</text>

  <!-- no → include test -->
  <path d="M280,290 L280,306" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="300" font-size="10" fill="#888">否</text>

  <!-- diamond: include test -->
  <polygon points="280,310 400,350 280,390 160,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">强制纳入边 i</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">跑 Kruskal</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">权值 == base?</text>

  <!-- yes → pseudo -->
  <path d="M400,350 L470,350" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="470" y="334" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">伪关键</text>
  <text x="510" y="368" text-anchor="middle" font-size="9.5" fill="#888">加入 pseudo</text>

  <!-- no → neither -->
  <path d="M160,350 L100,350" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="344" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="40" y="334" width="60" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="356" text-anchor="middle" font-size="10.5" fill="#888">跳过</text>

  <!-- loop back arrow -->
  <path d="M70,350 Q40,350 40,176 L160,176" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="9.5" fill="#888">下一条边</text>

  <!-- bottom note -->
  <rect x="80" y="410" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每条边跑两次 Kruskal，共 O(m² · α(n))</text>
  <text x="280" y="442" text-anchor="middle" font-size="10.5" fill="#555">m ≤ 200，完全可接受</text>
</svg>
