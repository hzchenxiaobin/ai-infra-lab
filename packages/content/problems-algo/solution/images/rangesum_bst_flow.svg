<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三分剪枝 DFS</text>

  <!-- 起始：dfs(node) -->
  <rect x="210" y="48" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">调用 dfs(node)</text>

  <line x1="280" y1="84" x2="280" y2="106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="280,110 380,150 280,190 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#7a5a20">node == null?</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#7a5a20">是 → return 0</text>

  <line x1="380" y1="150" x2="430" y2="150" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="11" fill="#666">否</text>
  <line x1="430" y1="150" x2="430" y2="200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三分决策：val < low ? -->
  <polygon points="430,204 540,234 430,264 320,234" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#446688">node.val &lt; low?</text>
  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#666">偏左</text>

  <!-- 是 → 只递归右 -->
  <line x1="320" y1="234" x2="250" y2="234" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="226" font-size="11" fill="#666">是</text>
  <line x1="250" y1="234" x2="250" y2="280" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="284" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="306" text-anchor="middle" font-size="12" fill="#446688">return dfs(node.right)</text>
  <text x="250" y="320" text-anchor="middle" font-size="10" fill="#888">舍弃左子树</text>

  <!-- 否 → 下一判 val > high ? -->
  <line x1="430" y1="264" x2="430" y2="300" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="288" font-size="11" fill="#666">否</text>
  <polygon points="430,304 540,334 430,364 320,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="332" text-anchor="middle" font-size="12" fill="#7a5a20">node.val &gt; high?</text>
  <text x="430" y="348" text-anchor="middle" font-size="10" fill="#666">偏右</text>

  <!-- 是 → 只递归左 -->
  <line x1="320" y1="334" x2="250" y2="334" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="326" font-size="11" fill="#666">是</text>
  <line x1="250" y1="334" x2="250" y2="380" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="384" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="406" text-anchor="middle" font-size="12" fill="#d6a040">return dfs(node.left)</text>
  <text x="250" y="420" text-anchor="middle" font-size="10" fill="#888">舍弃右子树</text>

  <!-- 否 → 命中：累加 + 左右 -->
  <line x1="430" y1="364" x2="430" y2="400" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="388" font-size="11" fill="#666">否</text>
  <rect x="360" y="404" width="180" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return val</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+ dfs(left) + dfs(right)</text>

  <!-- 左侧返回出口汇聚 -->
  <text x="60" y="306" font-size="10" fill="#888" filter="url(#rough2)">↑ 偏左分支</text>
  <text x="60" y="406" font-size="10" fill="#888" filter="url(#rough2)">↑ 偏右分支</text>
</svg>
