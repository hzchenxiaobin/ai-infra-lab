<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三步走：计数 → 过滤 → 取第 k 个</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">arr = [d, b, c, b, c, a]   k = 2</text>

  <!-- ① arr 行 -->
  <text x="50" y="92" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">arr</text>
  <rect x="70" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <rect x="130" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="190" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">c</text>
  <rect x="250" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="310" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">c</text>
  <rect x="370" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>

  <!-- 箭头 ① -->
  <line x1="280" y1="114" x2="280" y2="146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="134" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① 统计频率</text>

  <!-- ② freq 行：4 个键值条目 -->
  <text x="50" y="184" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">freq</text>
  <rect x="70" y="164" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d → 1</text>
  <rect x="180" y="164" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b → 2</text>
  <rect x="290" y="164" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c → 2</text>
  <rect x="400" y="164" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a → 1</text>

  <!-- 箭头 ② -->
  <line x1="280" y1="210" x2="280" y2="242" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="230" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② 按原顺序过滤 freq==1</text>

  <!-- ③ distinct 行：保留 d、a，b、c 划掉 -->
  <text x="50" y="280" text-anchor="end" font-size="13" fill="#d6a040" filter="url(#rough2)">distinct</text>
  <!-- d 保留 -->
  <rect x="100" y="260" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="284" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <!-- b 划掉 -->
  <rect x="170" y="260" width="50" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="284" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">b</text>
  <line x1="172" y1="294" x2="218" y2="262" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- c 划掉 -->
  <rect x="240" y="260" width="50" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="284" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">c</text>
  <line x1="242" y1="294" x2="288" y2="262" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- b 第二个划掉 -->
  <rect x="310" y="260" width="50" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="284" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">b</text>
  <line x1="312" y1="294" x2="358" y2="262" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- c 第二个划掉 -->
  <rect x="380" y="260" width="50" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="284" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">c</text>
  <line x1="382" y1="294" x2="428" y2="262" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- a 保留 -->
  <rect x="450" y="260" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="284" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="125" y="312" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">第 1</text>
  <text x="475" y="312" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">第 2</text>

  <!-- 箭头 ③ -->
  <line x1="475" y1="318" x2="475" y2="350" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="338" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ 取第 k=2 个</text>

  <!-- 结果 -->
  <rect x="430" y="356" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="384" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>

  <!-- 底部小结 -->
  <rect x="60" y="416" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">distinct 列表 = [d, a]，长度 2 ≥ k=2 → 返回 "a"</text>
</svg>
