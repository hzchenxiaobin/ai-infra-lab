<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：一真一假对比</text>

  <!-- ===== Example 1: True ===== -->
  <rect x="20" y="40" width="540" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="30" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：nums = [1,2,2,3,3,4,4,5,5], K = 2 → true</text>

  <!-- Array boxes -->
  <rect x="30" y="66" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="45" y="82" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="62" y="66" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="77" y="82" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="94" y="66" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="109" y="82" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="126" y="66" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="141" y="82" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="158" y="66" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="173" y="82" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="190" y="66" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="82" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="222" y="66" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="237" y="82" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="254" y="66" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="269" y="82" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="286" y="66" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="301" y="82" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- Frequency table -->
  <text x="30" y="110" font-size="10" fill="#888">频次统计：</text>

  <rect x="100" y="98" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="9" fill="#333">值1→1</text>
  <rect x="144" y="98" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值2→2</text>
  <rect x="188" y="98" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="208" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值3→2</text>
  <rect x="232" y="98" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值4→2</text>
  <rect x="276" y="98" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="296" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值5→2</text>

  <text x="330" y="112" font-size="10" fill="#b85450" font-weight="bold">maxFreq = 2</text>

  <!-- Check -->
  <rect x="30" y="130" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="11" fill="#333">len=9 ≥ K × maxFreq = 2 × 2 = 4 ？</text>

  <rect x="420" y="130" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9 ≥ 4 → true ✓</text>

  <!-- Partition -->
  <text x="30" y="176" font-size="10" fill="#888">划分方案：A=[1,2,3,4,5] B=[2,3,4,5]，均 len ≥ 2</text>
  <text x="30" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">结论：可以分成 2 条长度 ≥ K 的严格递增子序列</text>

  <!-- ===== Example 2: False ===== -->
  <rect x="20" y="220" width="540" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="30" y="238" font-size="12" fill="#b85450" font-weight="bold">示例 2：nums = [1,1,1,2,2,2], K = 3 → false</text>

  <!-- Array boxes -->
  <rect x="30" y="246" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="45" y="262" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="62" y="246" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="77" y="262" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="94" y="246" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="109" y="262" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="126" y="246" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="141" y="262" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="158" y="246" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="173" y="262" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="190" y="246" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="262" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- Frequency table -->
  <text x="30" y="290" font-size="10" fill="#888">频次统计：</text>

  <rect x="100" y="278" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="292" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值1→3</text>
  <rect x="144" y="278" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="292" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">值2→3</text>

  <text x="200" y="292" font-size="10" fill="#b85450" font-weight="bold">maxFreq = 3</text>

  <!-- Check -->
  <rect x="30" y="310" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="328" text-anchor="middle" font-size="11" fill="#333">len=6 ≥ K × maxFreq = 3 × 3 = 9 ？</text>

  <rect x="420" y="310" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 &lt; 9 → false ✗</text>

  <!-- Explanation -->
  <text x="30" y="356" font-size="10" fill="#888">3 个 1 → 至少需 3 条序列，每条需 3 个 → 共需 9 个，但只有 6 个</text>
  <text x="30" y="376" font-size="10" fill="#b85450" font-weight="bold">结论：无法分成 3 条长度 ≥ 3 的严格递增子序列</text>

  <!-- Bottom takeaway -->
  <rect x="20" y="400" width="540" height="14" fill="none"/>
  <text x="290" y="412" text-anchor="middle" font-size="10" fill="#555">关键：maxFreq 决定最少序列数，K × maxFreq 是总元素数的下界</text>
</svg>
