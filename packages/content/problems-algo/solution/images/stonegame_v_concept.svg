<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 [i,j] 枚举切分点 k → 三分支贡献</text>

  <!-- ===== interval row ===== -->
  <text x="30" y="74" font-size="12" fill="#888">区间:</text>
  <rect x="80" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="11" fill="#999">…</text>
  <rect x="120" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#333">v[i]</text>
  <rect x="160" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="11" fill="#999">…</text>
  <rect x="200" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#333">v[k]</text>
  <rect x="240" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#333">v[k+1]</text>
  <rect x="280" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#999">…</text>
  <rect x="320" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#333">v[j]</text>
  <rect x="360" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="11" fill="#999">…</text>

  <!-- index labels -->
  <text x="140" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>
  <text x="220" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k</text>
  <text x="260" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k+1</text>
  <text x="340" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>

  <!-- cut line -->
  <path d="M 240 50 L 240 102" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="248" y="46" font-size="10" fill="#d6a040" font-weight="bold">切分</text>

  <!-- brackets -->
  <path d="M 120 44 Q 120 38 128 38 L 232 38 Q 240 38 240 44" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="32" text-anchor="middle" font-size="10" fill="#4a7a3a">leftSum = Σ[i..k]</text>
  <path d="M 240 44 Q 240 38 248 38 L 352 38 Q 360 38 360 44" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="300" y="32" text-anchor="middle" font-size="10" fill="#d6a040">rightSum = Σ[k+1..j]</text>

  <!-- ===== three branch boxes ===== -->
  <!-- branch 1: left < right (green, keep left) -->
  <rect x="30" y="130" width="160" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">leftSum &lt; rightSum</text>
  <text x="110" y="172" text-anchor="middle" font-size="11" fill="#444">丢右行，保留 [i,k]</text>
  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#444">本轮得 leftSum</text>
  <text x="110" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">贡献 = leftSum + dp[i][k]</text>

  <!-- branch 2: left > right (orange, keep right) -->
  <rect x="200" y="130" width="160" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">leftSum &gt; rightSum</text>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#444">丢左行，保留 [k+1,j]</text>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#444">本轮得 rightSum</text>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">贡献 = rightSum + dp[k+1][j]</text>

  <!-- branch 3: left == right (red, alice chooses) -->
  <rect x="370" y="130" width="160" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">leftSum = rightSum</text>
  <text x="450" y="172" text-anchor="middle" font-size="11" fill="#444">Alice 任选保留一边</text>
  <text x="450" y="190" text-anchor="middle" font-size="11" fill="#444">本轮得 leftSum</text>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">贡献 = leftSum + max(...)</text>

  <!-- merge arrows down -->
  <path d="M 110 222 Q 110 242 200 254" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 280 222 L 280 254" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 450 222 Q 450 242 360 254" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">遍历 k 取最大</text>

  <!-- equation box -->
  <rect x="30" y="264" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[i][j] = max over k ∈ [i, j−1] of { 三分支贡献 }</text>

  <!-- footer notes -->
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">边界 dp[i][i] = 0；答案 dp[0][n−1]</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">Bob 永远丢大边，Alice 只能保小边继续玩</text>
</svg>
