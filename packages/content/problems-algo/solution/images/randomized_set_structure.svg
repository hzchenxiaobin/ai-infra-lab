<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单结构各有短板，双结构协同补足</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 动态数组 ===== -->
  <g filter="url(#sk)"><rect x="60" y="84" width="280" height="200" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="200" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">动态数组 vals</text>
  <text x="200" y="128" text-anchor="middle" font-size="10.5" fill="#5a7a9e">[1, 3, 5, 7]  按下标访问</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="80" y="144" width="240" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="200" y="165" text-anchor="middle" fill="#2e6e2e">insert 尾插  O(1) ✓</text>
    <g filter="url(#sk)"><rect x="80" y="184" width="240" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="200" y="205" text-anchor="middle" fill="#2e6e2e">getRandom 取下标  O(1) ✓</text>
    <g filter="url(#sk)"><rect x="80" y="224" width="240" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="200" y="245" text-anchor="middle" fill="#b03a3a" font-weight="bold">remove 中间删  O(n) ✗</text>
  </g>
  <!-- small array sketch -->
  <g font-size="11" fill="#888">
    <g filter="url(#sk)"><rect x="86" y="262" width="34" height="20" rx="3" fill="#fff" stroke="#bbb"/></g>
    <text x="103" y="276" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="120" y="262" width="34" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-dasharray="2 2"/></g>
    <text x="137" y="276" text-anchor="middle" fill="#b03a3a">3</text>
    <g filter="url(#sk)"><rect x="154" y="262" width="34" height="20" rx="3" fill="#fff" stroke="#bbb"/></g>
    <text x="171" y="276" text-anchor="middle">5</text>
    <g filter="url(#sk)"><rect x="188" y="262" width="34" height="20" rx="3" fill="#fff" stroke="#bbb"/></g>
    <text x="205" y="276" text-anchor="middle">7</text>
    <text x="240" y="276" fill="#b03a3a" font-size="9.5">删3→后面全左移</text>
  </g>

  <!-- plus sign -->
  <text x="430" y="195" text-anchor="middle" font-size="34" font-weight="bold" fill="#888" filter="url(#sk)">+</text>

  <!-- ===== Right: 哈希集合 ===== -->
  <g filter="url(#sk)"><rect x="520" y="84" width="280" height="200" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="660" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">哈希集合 set</text>
  <text x="660" y="128" text-anchor="middle" font-size="10.5" fill="#8a6a35">{1, 3, 5, 7}  无顺序</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="540" y="144" width="240" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="660" y="165" text-anchor="middle" fill="#2e6e2e">insert  O(1) ✓</text>
    <g filter="url(#sk)"><rect x="540" y="184" width="240" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="660" y="205" text-anchor="middle" fill="#2e6e2e">remove  O(1) ✓</text>
    <g filter="url(#sk)"><rect x="540" y="224" width="240" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="660" y="245" text-anchor="middle" fill="#b03a3a" font-weight="bold">getRandom 无下标  O(n) ✗</text>
  </g>
  <text x="660" y="276" text-anchor="middle" font-size="9.5" fill="#b03a3a">取不出「第 k 个」→ 无法等概率随机</text>

  <!-- ===== arrows down to combined ===== -->
  <path d="M 200 296 Q 200 340 360 356" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 660 296 Q 660 340 500 356" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Bottom: combined ===== -->
  <g filter="url(#sk)"><rect x="110" y="372" width="640" height="108" rx="12" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="430" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">组合：vals[]  +  idx{ val → 下标 }</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="140" y="416" width="180" height="46" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="230" y="436" text-anchor="middle" fill="#2e6e2e" font-weight="bold">数组管随机访问</text>
    <text x="230" y="453" text-anchor="middle" fill="#555" font-size="10.5">getRandom O(1)</text>
    <g filter="url(#sk)"><rect x="540" y="416" width="180" height="46" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="630" y="436" text-anchor="middle" fill="#2e6e2e" font-weight="bold">哈希表管定位/去重</text>
    <text x="630" y="453" text-anchor="middle" fill="#555" font-size="10.5">insert·remove O(1)</text>
    <text x="430" y="442" text-anchor="middle" font-size="20" fill="#888" filter="url(#sk)">⇄</text>
  </g>

  <text x="430" y="508" text-anchor="middle" font-size="11.5" fill="#7a5415">数组中间删除 O(n) → 用「与末尾交换」压成 O(1)，三操作全 ✓</text>
  <text x="430" y="526" text-anchor="middle" font-size="10.5" fill="#888">不要求保序 → 末尾填补空洞 → pop_back() 天然 O(1)</text>
</svg>
