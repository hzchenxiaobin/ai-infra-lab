<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 定中心 → 升序半串 → 镜像拼接</text>

  <!-- 开始 -->
  <rect x="200" y="34" width="120" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">输入回文 s</text>

  <path d="M 260 62 L 260 78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤① 计数 -->
  <rect x="160" y="78" width="200" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">统计 26 个字母计数 cnt[]</text>

  <path d="M 260 110 L 260 126" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤② 判定分支 -->
  <polygon points="260,126 356,162 260,198 164,162" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">有奇数计数？</text>

  <path d="M 164 162 L 142 162" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="153" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="28" y="146" width="112" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">mid = 该字符</text>

  <path d="M 356 162 L 378 162" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="380" y="146" width="112" height="32" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="166" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">mid = 空串</text>

  <path d="M 84 178 C 84 202, 160 210, 196 214" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 178 C 436 202, 352 210, 324 214" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 198 L 260 214" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤③ 半串 -->
  <rect x="118" y="214" width="284" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">按 a→z 顺序拼 cnt[c]/2 个 c ⇒ 半串 half</text>

  <path d="M 260 248 L 260 264" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤④ 拼接 -->
  <rect x="108" y="264" width="304" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans = half + mid + reverse(half)</text>

  <path d="M 260 298 L 260 314" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="200" y="314" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">输出 ans</text>

  <!-- 侧注 -->
  <rect x="384" y="42" width="128" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="448" y="64" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">计数桶天然有序</text>
  <text x="448" y="82" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">⇒ 半串免排序</text>
  <text x="448" y="100" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">整体 O(n + σ)</text>
  <text x="448" y="114" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">（σ = 26）</text>
</svg>
