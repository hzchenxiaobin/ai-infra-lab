<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 时间序模拟 → 逐 token 分发计数</text>

  <g filter="url(#rough2)">
    <rect x="165" y="28" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13"/>
    <text x="260" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">输入 numberOfUsers, events</text>
    <path d="M 260 54 L 260 64" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="105" y="66" width="310" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="84" text-anchor="middle" font-size="11" fill="#33506b">① 排序：key = (时间戳, OFFLINE 先于 MESSAGE)</text>
    <path d="M 260 94 L 260 104" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="105" y="106" width="310" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="124" text-anchor="middle" font-size="11" fill="#33506b">② mentions = [0]×U；offlineUntil = [0]×U</text>
    <path d="M 260 134 L 260 146" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="20" y="148" width="480" height="170" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="7 5" rx="10"/>
    <text x="260" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">③ 依时间顺序遍历每个事件</text>

    <polygon points="130,178 200,208 130,238 60,208" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="130" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">OFFLINE ?</text>

    <path d="M 200 208 L 224 208" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="212" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">是</text>
    <rect x="228" y="192" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="358" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">offlineUntil[id] ← ts + 60</text>

    <path d="M 130 238 L 130 250" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="142" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">否</text>
    <rect x="35" y="252" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="160" y="271" text-anchor="middle" font-size="11" fill="#33506b">MESSAGE：mentions_string 切分</text>

    <path d="M 285 267 L 305 267" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="309" y="236" width="185" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8"/>
    <text x="401" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">逐 token 分发：</text>
    <text x="401" y="270" text-anchor="middle" font-size="10" fill="#8a6d1f">ALL → 全员 +1</text>
    <text x="401" y="287" text-anchor="middle" font-size="10" fill="#2f5d24">HERE → 在线者 +1</text>
    <text x="401" y="304" text-anchor="middle" font-size="10" fill="#33506b">idX → 用户 X +1（重复各计）</text>

    <path d="M 35 267 L 27 267 L 27 208 L 54 208" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none"/>
    <text x="27" y="196" text-anchor="middle" font-size="8.5" fill="#999">下一事件</text>

    <path d="M 260 318 L 260 328" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="170" y="330" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="260" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">返回 mentions</text>
  </g>
</svg>
