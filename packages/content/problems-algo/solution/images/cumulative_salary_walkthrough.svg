<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：员工 1 / 2 / 3 的累计薪水定位</text>

  <!-- Employee 1 -->
  <text x="40" y="54" font-size="11" fill="#b85450" font-weight="bold">员工 1：5 个月（month 1-5），剔除 month=5，输出 month 1-4</text>

  <!-- header row -->
  <rect x="30" y="62" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="77" font-size="9" fill="#333">month</text>
  <text x="135" y="77" font-size="9" fill="#333">salary</text>
  <text x="230" y="77" font-size="9" fill="#333">帧内求和</text>
  <text x="380" y="77" font-size="9" fill="#333">累计 Salary</text>
  <text x="510" y="77" font-size="9" fill="#333">输出?</text>

  <rect x="30" y="84" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="99" font-size="9.5" fill="#333">1</text>
  <text x="138" y="99" font-size="9.5" fill="#333">20</text>
  <text x="235" y="99" font-size="9.5" fill="#666">[20]</text>
  <text x="385" y="99" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <text x="515" y="99" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="106" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="121" font-size="9.5" fill="#333">2</text>
  <text x="138" y="121" font-size="9.5" fill="#333">30</text>
  <text x="235" y="121" font-size="9.5" fill="#666">[20, 30]</text>
  <text x="385" y="121" font-size="10" fill="#b85450" font-weight="bold">50</text>
  <text x="515" y="121" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="128" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="143" font-size="9.5" fill="#333">3</text>
  <text x="138" y="143" font-size="9.5" fill="#333">40</text>
  <text x="235" y="143" font-size="9.5" fill="#666">[20, 30, 40]</text>
  <text x="385" y="143" font-size="10" fill="#b85450" font-weight="bold">90</text>
  <text x="515" y="143" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="150" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="165" font-size="9.5" fill="#333">4</text>
  <text x="138" y="165" font-size="9.5" fill="#333">60</text>
  <text x="235" y="165" font-size="9.5" fill="#666">[20, 30, 40, 60]</text>
  <text x="385" y="165" font-size="10" fill="#b85450" font-weight="bold">150</text>
  <text x="515" y="165" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="172" width="540" height="22" fill="#eeeeee" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="187" font-size="9.5" fill="#888">5</text>
  <text x="138" y="187" font-size="9.5" fill="#888">50</text>
  <text x="235" y="187" font-size="9.5" fill="#888">— MAX → 剔除</text>
  <text x="385" y="187" font-size="10" fill="#888">—</text>
  <text x="515" y="187" font-size="9.5" fill="#b85450" font-weight="bold">✗</text>
  <line x1="34" y1="183" x2="566" y2="183" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="30" y1="202" x2="570" y2="202" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Employee 2 -->
  <text x="40" y="220" font-size="11" fill="#d6a040" font-weight="bold">员工 2：3 个月（month 1-3），剔除 month=3，输出 month 1-2</text>

  <rect x="30" y="228" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="243" font-size="9" fill="#333">month</text>
  <text x="135" y="243" font-size="9" fill="#333">salary</text>
  <text x="230" y="243" font-size="9" fill="#333">帧内求和</text>
  <text x="380" y="243" font-size="9" fill="#333">累计 Salary</text>
  <text x="510" y="243" font-size="9" fill="#333">输出?</text>

  <rect x="30" y="250" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="265" font-size="9.5" fill="#333">1</text>
  <text x="138" y="265" font-size="9.5" fill="#333">20</text>
  <text x="235" y="265" font-size="9.5" fill="#666">[20]</text>
  <text x="385" y="265" font-size="10" fill="#d6a040" font-weight="bold">20</text>
  <text x="515" y="265" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="272" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="287" font-size="9.5" fill="#333">2</text>
  <text x="138" y="287" font-size="9.5" fill="#333">30</text>
  <text x="235" y="287" font-size="9.5" fill="#666">[20, 30]</text>
  <text x="385" y="287" font-size="10" fill="#d6a040" font-weight="bold">50</text>
  <text x="515" y="287" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="294" width="540" height="22" fill="#eeeeee" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="309" font-size="9.5" fill="#888">3</text>
  <text x="138" y="309" font-size="9.5" fill="#888">40</text>
  <text x="235" y="309" font-size="9.5" fill="#888">— MAX → 剔除</text>
  <text x="385" y="309" font-size="10" fill="#888">—</text>
  <text x="515" y="309" font-size="9.5" fill="#b85450" font-weight="bold">✗</text>
  <line x1="34" y1="305" x2="566" y2="305" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="30" y1="324" x2="570" y2="324" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Employee 3 -->
  <text x="40" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">员工 3：3 个月（month 2-4），剔除 month=4，输出 month 2-3</text>

  <rect x="30" y="350" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="365" font-size="9" fill="#333">month</text>
  <text x="135" y="365" font-size="9" fill="#333">salary</text>
  <text x="230" y="365" font-size="9" fill="#333">帧内求和</text>
  <text x="380" y="365" font-size="9" fill="#333">累计 Salary</text>
  <text x="510" y="365" font-size="9" fill="#333">输出?</text>

  <rect x="30" y="372" width="540" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="387" font-size="9.5" fill="#333">2</text>
  <text x="138" y="387" font-size="9.5" fill="#333">40</text>
  <text x="235" y="387" font-size="9.5" fill="#666">[40]</text>
  <text x="385" y="387" font-size="10" fill="#4a7a3a" font-weight="bold">40</text>
  <text x="515" y="387" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="394" width="540" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="409" font-size="9.5" fill="#333">3</text>
  <text x="138" y="409" font-size="9.5" fill="#333">60</text>
  <text x="235" y="409" font-size="9.5" fill="#666">[40, 60]</text>
  <text x="385" y="409" font-size="10" fill="#4a7a3a" font-weight="bold">100</text>
  <text x="515" y="409" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="416" width="540" height="22" fill="#eeeeee" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="431" font-size="9.5" fill="#888">4</text>
  <text x="138" y="431" font-size="9.5" fill="#888">70</text>
  <text x="235" y="431" font-size="9.5" fill="#888">— MAX → 剔除</text>
  <text x="385" y="431" font-size="10" fill="#888">—</text>
  <text x="515" y="431" font-size="9.5" fill="#b85450" font-weight="bold">✗</text>
  <line x1="34" y1="427" x2="566" y2="427" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="300" y="452" text-anchor="middle" font-size="9.5" fill="#666">↑ 每人最新月被剔除；输出按 id ASC、month DESC 排序</text>
</svg>
