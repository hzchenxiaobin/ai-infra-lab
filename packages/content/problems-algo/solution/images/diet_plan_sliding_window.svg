<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">定长滑窗 + 区间评分：一进一出更新 T，再与 [lower, upper] 比较定得分</text>

  <!-- Row 1: calories array with window W1 -->
  <text x="30" y="74" font-size="12" fill="#888">calories:</text>
  <rect x="80" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="136" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="192" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="248" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="304" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="360" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="108" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="164" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="276" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="332" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="388" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- Window W1 highlight (orange) over [0..2], k=3 -->
  <rect x="77" y="54" width="176" height="38" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">窗口 W₁ [0..2]，k=3，T₁ = 3+1+4 = 8</text>

  <!-- slide arrow -->
  <path d="M 270 138 L 300 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="130" text-anchor="middle" font-size="10" fill="#446688">右移</text>

  <!-- Row 2: same array, window W2 over [1..3] -->
  <rect x="80" y="158" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="136" y="158" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="178" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="192" y="158" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="178" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="248" y="158" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="304" y="158" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="178" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="360" y="158" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="178" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Window W2 highlight (green) over [1..3] -->
  <rect x="133" y="154" width="176" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- left out arrow -->
  <path d="M 108 192 L 108 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="108" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">左出 −3</text>

  <!-- right in arrow -->
  <path d="M 276 192 L 276 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右入 +2</text>

  <!-- W2 label -->
  <text x="249" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 W₂ [1..3]，T₂ = 8 − 3 + 2 = 7</text>

  <!-- sum update formula box -->
  <rect x="100" y="260" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">T = T − calories[i−k] + calories[i]</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#888">每步 O(1) 增量更新，无需重新求和</text>

  <!-- score rules box -->
  <rect x="60" y="316" width="440" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">评分规则（每个窗口评估一次）</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#b85450">T &lt; lower → score −−  （热量过低，扣分）</text>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a">T &gt; upper → score ++  （热量超标，加分）</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#888">lower ≤ T ≤ upper → 不变</text>
</svg>
