<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描标段号，每个查询 O(1) 比较</text>

  <!-- ══════════ 左列：预处理 ══════════ -->
  <rect x="60" y="44" width="150" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 预处理：标段号</text>

  <line x1="135" y1="78" x2="135" y2="92" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="94" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="113" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">block[0] = 0</text>

  <line x1="135" y1="124" x2="135" y2="138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="140" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="159" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">for i = 1 … n−1</text>

  <line x1="135" y1="170" x2="135" y2="186" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="135,188 233,229 135,270 37,229" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="226" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">nums[i] − nums[i−1]</text>
  <text x="135" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">&gt; maxDiff ？</text>

  <!-- 是分支（左，橙）：开新段 -->
  <polyline points="37,229 20,229 20,324" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="26" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="8" y="326" width="118" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="67" y="345" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">block[i] =</text>
  <text x="67" y="363" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">block[i−1] + 1</text>
  <text x="67" y="390" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">（开新段）</text>

  <!-- 否分支（右，绿）：同段延续 -->
  <polyline points="233,229 252,229 252,324" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="247" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="192" y="326" width="120" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="345" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">block[i] =</text>
  <text x="252" y="363" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">block[i−1]</text>
  <text x="252" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（同段延续）</text>

  <!-- 分支汇合 -->
  <line x1="67" y1="374" x2="67" y2="392" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="252" y1="374" x2="252" y2="392" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="67" y1="392" x2="252" y2="392" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="160" y1="392" x2="160" y2="402" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="404" width="152" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="423" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">block[] 就绪</text>

  <!-- ══════════ 右列：查询 ══════════ -->
  <rect x="335" y="44" width="150" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">② 回答 q 个查询</text>

  <line x1="410" y1="78" x2="410" y2="92" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="345" y="94" width="130" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="113" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">取出查询 [u, v]</text>

  <line x1="410" y1="124" x2="410" y2="138" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <polygon points="410,140 495,175 410,210 325,175" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="172" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">block[u] ==</text>
  <text x="410" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">block[v] ？</text>

  <!-- 是/否分叉 -->
  <line x1="410" y1="210" x2="410" y2="222" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="410" y1="222" x2="349" y2="234" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="410" y1="222" x2="471" y2="234" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="364" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="453" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="283" y="236" width="124" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>
  <text x="345" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不同段 · 无路径</text>

  <rect x="413" y="236" width="124" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">true</text>
  <text x="475" y="272" text-anchor="middle" font-size="10" fill="#2a5a2a" filter="url(#rough2)">同段 · 有路径</text>

  <!-- 结果汇合到下一查询 -->
  <line x1="345" y1="280" x2="345" y2="296" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="475" y1="280" x2="475" y2="296" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="345" y1="296" x2="475" y2="296" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="410" y1="296" x2="410" y2="306" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="335" y="308" width="150" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="327" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">处理下一个查询</text>
  <text x="410" y="356" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（共 q 个，每个 O(1)）</text>

  <!-- ══════════ 底部结论框 ══════════ -->
  <rect x="60" y="448" width="440" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">复杂度：预处理 O(n) + q 次 O(1) 查询 = O(n + q)</text>
  <text x="280" y="492" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">空间 O(n)：一个 block[] 数组搞定所有查询</text>
</svg>
