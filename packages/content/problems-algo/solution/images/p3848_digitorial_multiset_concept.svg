<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：阶乘和与数字顺序无关 ⇒ 候选唯一</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">n = 145 的任意排列，各位阶乘和都是同一个 F(S) —— 顺序只改写法，不改和</text>

  <!-- three permutations -->
  <text x="95" y="52" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">原序</text>
  <rect x="70" y="56" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">145</text>

  <text x="260" y="52" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">重排</text>
  <rect x="235" y="56" width="50" height="30" rx="4" fill="#fff" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">451</text>

  <text x="425" y="52" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">重排</text>
  <rect x="400" y="56" width="50" height="30" rx="4" fill="#fff" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="425" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">514</text>

  <!-- converging arrows -->
  <path d="M 100 90 C 140 112, 180 122, 212 128" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 260 90 L 260 124" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 420 90 C 380 112, 340 122, 308 128" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- F box -->
  <rect x="130" y="130" width="260" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">F = 1! + 4! + 5! = 1 + 24 + 120 = 145</text>

  <text x="260" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">哪个排列都一样！若某排列 m 是阶数数字，只能 m = F —— 候选唯一</text>

  <!-- reasoning box -->
  <rect x="48" y="200" width="424" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">判定退化为一次多重集比对：sorted(str(F)) == sorted(str(n)) ？</text>
  <text x="260" y="240" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">相等 ⇒ F 的位数与 n 相同、首位非 0 ⇒ F 本身就是 n 的合法排列且为阶数数字</text>
  <text x="260" y="258" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">不等 ⇒ 不存在任何排列满足（候选已穷尽）—— 充要条件，前导零自动排除</text>
  <text x="260" y="274" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">注：F 未必等于 n —— n = 154 时 F = 145，互为排列照样 true</text>

  <!-- two bottom examples -->
  <rect x="40" y="298" width="215" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="320" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">n = 154 → F = 145</text>
  <text x="147" y="338" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">sorted("145") == sorted("154")</text>
  <text x="147" y="352" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">✓ true（排列 145 即阶数数字）</text>

  <rect x="272" y="298" width="215" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="320" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">n = 10 → F = 1! + 0! = 2</text>
  <text x="379" y="338" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">sorted("2") ≠ sorted("10")</text>
  <text x="379" y="352" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">✗ false（"01" 以零开头也无效）</text>
</svg>
