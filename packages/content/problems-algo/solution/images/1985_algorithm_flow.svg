<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：自定义比较器排序</text>

  <!-- Input box -->
  <rect x="130" y="42" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：nums（字符串数组），k</text>
  <text x="260" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">每个 nums[i] 为不含前导零的大数</text>
  <path d="M 260 82 L 260 98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: define comparator -->
  <rect x="100" y="98" width="320" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 定义大数比较器 cmp(a, b)</text>
  <text x="260" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">len(a) ≠ len(b) → 长者大</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">len(a) = len(b) → 字典序比较</text>
  <path d="M 260 152 L 260 168" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="120" y="168" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 用 cmp 升序排序</text>
  <text x="260" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sort(nums.begin(), nums.end(), cmp)</text>
  <path d="M 260 208 L 260 224" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: return -->
  <rect x="120" y="224" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 返回第 k 大</text>
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return nums[n − k]</text>
  <path d="M 260 264 L 260 280" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output box -->
  <rect x="140" y="280" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：第 k 大字符串</text>

  <!-- complexity note -->
  <rect x="70" y="324" width="380" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">复杂度：O(n log n · L) / O(log n)</text>
</svg>
