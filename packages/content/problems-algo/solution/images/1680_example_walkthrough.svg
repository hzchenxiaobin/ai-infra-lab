<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：n = 5（扩展示例，展示 3 次 shift 递增）
  </text>

  <!-- header row -->
  <rect x="40" y="50" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">i</text>
  <rect x="80" y="50" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">bin(i)</text>
  <rect x="150" y="50" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">2 的幂?</text>
  <rect x="214" y="50" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">shift</text>
  <rect x="264" y="50" width="86" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">ans(十进制)</text>
  <rect x="350" y="50" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">ans(二进制)</text>

  <!-- Row i=1: power of 2, shift 1 -->
  <rect x="40" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="84" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="84" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <rect x="214" y="84" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="264" y="84" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="84" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- Row i=2: power of 2, shift 2 -->
  <rect x="40" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="118" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="150" y="118" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <rect x="214" y="118" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="264" y="118" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="350" y="118" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>

  <!-- Row i=3: not power of 2, shift stays 2 -->
  <rect x="40" y="152" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="152" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="150" y="152" width="64" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="172" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">否</text>
  <rect x="214" y="152" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="264" y="152" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">27</text>
  <rect x="350" y="152" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11011</text>

  <!-- Row i=4: power of 2, shift 3 -->
  <rect x="40" y="186" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="186" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">100</text>
  <rect x="150" y="186" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <rect x="214" y="186" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <rect x="264" y="186" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">220</text>
  <rect x="350" y="186" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11011100</text>

  <!-- Row i=5: not power of 2, shift stays 3 (final answer) -->
  <rect x="40" y="220" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="220" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>
  <rect x="150" y="220" width="64" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="240" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">否</text>
  <rect x="214" y="220" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="264" y="220" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1765</text>
  <rect x="350" y="220" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="240" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">11011100101</text>

  <!-- answer callout -->
  <path d="M307,254 L307,266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="232" y="268" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="307" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">n=5 → ans = 1765 ✓</text>

  <!-- side note -->
  <rect x="40" y="268" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">橙格 = shift 递增的轮次</text>
</svg>
