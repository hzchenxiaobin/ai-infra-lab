  <text x="290" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="370" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="130" y="216" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="236" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6 == 6 → true ✓</text>

  <!-- 表 B: "1234" -->
  <text x="245" y="280" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">示例 1：num = "1234"（n = 4，两桶各 2 个）</text>

  <rect x="80" y="290" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="308" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="130" y="290" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="308" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">字符</text>
  <rect x="185" y="290" width="65" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="308" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">入桶</text>
  <rect x="250" y="290" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">even</text>
  <rect x="330" y="290" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="308" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">odd</text>

  <rect x="80" y="316" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="157" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="318" width="63" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="332" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶</text>
  <text x="290" y="332" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="370" y="332" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>

  <rect x="80" y="340" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="342" width="63" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="356" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">奇</text>
  <text x="290" y="356" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="370" y="356" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="80" y="364" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="380" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="380" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="186" y="366" width="63" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="380" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶</text>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="370" y="380" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2</text>

  <rect x="80" y="388" width="330" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="404" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="157" y="404" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="186" y="390" width="63" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="404" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">奇</text>
  <text x="290" y="404" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="370" y="404" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="130" y="424" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="444" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4 ≠ 6 → false ✗</text>

  <rect x="20" y="464" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="481" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">💡 粗体 = 本行刚更新的计数器；扫描结束只看 even 与 odd 是否相等</text>
</svg>
