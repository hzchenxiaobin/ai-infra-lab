<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两个官方示例各走一遍</text>

  <!-- 表 A: "24123" -->
  <text x="245" y="48" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：num = "24123"（n = 5，偶桶 3 个、奇桶 2 个）</text>

  <rect x="80" y="58" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="130" y="58" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">字符</text>
  <rect x="185" y="58" width="65" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">入桶</text>
  <rect x="250" y="58" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">even</text>
  <rect x="330" y="58" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="76" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">odd</text>

  <rect x="80" y="84" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="157" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="86" width="63" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="100" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶</text>
  <text x="290" y="100" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="370" y="100" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>

  <rect x="80" y="108" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="186" y="110" width="63" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="124" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">奇</text>
