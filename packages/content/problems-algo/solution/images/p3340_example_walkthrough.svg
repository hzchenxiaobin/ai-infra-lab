  <text x="370" y="124" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="80" y="132" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="134" width="63" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="148" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶</text>
  <text x="290" y="148" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="370" y="148" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">4</text>

  <rect x="80" y="156" width="330" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="157" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="158" width="63" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="172" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">奇</text>
  <text x="290" y="172" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="370" y="172" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="80" y="180" width="330" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="157" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="186" y="182" width="63" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
