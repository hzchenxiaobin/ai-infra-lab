<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分数加减本质：滚动通分合并 + 末尾约分</text>

  <!-- Formula section -->
  <text x="24" y="60" font-size="11" fill="#888">合并公式</text>
  <rect x="68" y="46" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="66" text-anchor="middle" font-size="12" fill="#333">num/den</text>
  <text x="148" y="64" font-size="14" fill="#555">+</text>
  <rect x="160" y="46" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="66" text-anchor="middle" font-size="12" fill="#333">a/b</text>
  <text x="214" y="64" font-size="14" fill="#555">=</text>
  <rect x="226" y="46" width="216" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="66" text-anchor="middle" font-size="11" fill="#333">(num·b + a·den) / (den·b)</text>
  <path d="M 446 61 L 480 61" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="56" font-size="9" fill="#888">通分</text>
  <text x="490" y="68" font-size="9" fill="#888">合并</text>

  <!-- Rolling accumulator section -->
  <text x="24" y="106" font-size="11" fill="#888">滚动累加（以 −1/2+1/2+1/3 为例）</text>

  <!-- Row 1 -->
  <text x="24" y="132" font-size="10" fill="#888">①</text>
  <rect x="44" y="114" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="133" text-anchor="middle" font-size="11" fill="#333">0/1</text>
  <text x="106" y="131" font-size="11" fill="#555">+</text>
  <rect x="118" y="114" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="133" text-anchor="middle" font-size="11" fill="#333">−1/2</text>
  <text x="180" y="131" font-size="11" fill="#555">=</text>
  <rect x="192" y="114" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="133" text-anchor="middle" font-size="11" fill="#333">−1/2</text>

  <!-- Row 2 -->
  <text x="24" y="166" font-size="10" fill="#888">②</text>
  <rect x="44" y="148" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="167" text-anchor="middle" font-size="11" fill="#333">−1/2</text>
  <text x="106" y="165" font-size="11" fill="#555">+</text>
  <rect x="118" y="148" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="167" text-anchor="middle" font-size="11" fill="#333">+1/2</text>
  <text x="180" y="165" font-size="11" fill="#555">=</text>
  <rect x="192" y="148" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="167" text-anchor="middle" font-size="11" fill="#333">0/4</text>

  <!-- Row 3 -->
  <text x="24" y="200" font-size="10" fill="#888">③</text>
  <rect x="44" y="182" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="201" text-anchor="middle" font-size="11" fill="#333">0/4</text>
  <text x="106" y="199" font-size="11" fill="#555">+</text>
  <rect x="118" y="182" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="201" text-anchor="middle" font-size="11" fill="#333">+1/3</text>
  <text x="180" y="199" font-size="11" fill="#555">=</text>
  <rect x="192" y="182" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="201" text-anchor="middle" font-size="11" fill="#333">4/12</text>

  <!-- Final reduction -->
  <text x="24" y="242" font-size="11" fill="#888">末尾约分</text>
  <rect x="70" y="228" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="12" fill="#333">4/12</text>
  <path d="M 134 243 L 176 243" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="228" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="248" text-anchor="middle" font-size="11" fill="#333">÷ gcd(4,12) = 4</text>
  <path d="M 314 243 L 356 243" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="228" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1/3</text>

  <!-- Callout -->
  <rect x="40" y="278" width="460" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">为什么不必每步约分？</text>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#555">约束：≤ 10 个分数，分子分母均 ∈ [1, 10]</text>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#555">累积分母 ≤ 10^10 ≪ 2^63，long long 不溢出</text>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#555">→ 末尾一次 gcd 约分即可，代码最简</text>
</svg>
