<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：for...in 短路（O(1)）vs Object.keys 全量计数（O(n)）</text>

  <!-- ===== input obj ===== -->
  <rect x="220" y="42" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">obj (对象|数组)</text>

  <!-- split into two paths -->
  <path d="M 280 80 L 150 110" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 80 L 410 110" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="150" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路径 A</text>
  <text x="410" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">路径 B</text>

  <!-- ===== LEFT PATH A: for...in short circuit ===== -->
  <rect x="70" y="116" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for (const _ in obj)</text>

  <path d="M 150 158 L 150 178" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- decision diamond: found enumerable property? -->
  <path d="M 150 180 L 218 214 L 150 248 L 82 214 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">命中可枚举</text>
  <text x="150" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">属性?</text>

  <!-- yes branch: return false -->
  <path d="M 218 214 L 270 214" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="244" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="276" y="200" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="319" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- no branch: return true -->
  <path d="M 150 248 L 150 272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="166" y="264" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="106" y="276" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <text x="150" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O(1)：首属性即退 / 空则不进循环</text>

  <!-- ===== RIGHT PATH B: Object.keys full count ===== -->
  <rect x="320" y="116" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Object.keys(obj) 枚举全部</text>

  <path d="M 410 158 L 410 178" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- materialize array -->
  <rect x="330" y="182" width="160" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="410" y="205" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">物化成键数组 [k1,k2,...]</text>

  <path d="M 410 220 L 410 240" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- length check -->
  <path d="M 410 242 L 470 270 L 410 298 L 350 270 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="266" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">.length</text>
  <text x="410" y="282" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">=== 0 ?</text>

  <text x="410" y="322" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">O(n)：枚举全部键 + O(n) 空间</text>

  <!-- contrast note -->
  <rect x="40" y="296" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="311" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">进阶 O(1) ✓</text>
  <rect x="440" y="296" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="311" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">进阶 O(1) ✗</text>
</svg>
