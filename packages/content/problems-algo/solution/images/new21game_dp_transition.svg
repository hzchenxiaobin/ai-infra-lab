<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口：dp[x] = S / W，窗口随 x 右移</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例 k=2, W=3，正在计算 dp[3]</text>

  <!-- k boundary marker -->
  <line x1="196" y1="52" x2="196" y2="104" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="196" y="50" text-anchor="middle" font-size="9" fill="#b85450">k=2</text>

  <!-- dp cells row -->
  <rect x="80" y="56" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1.0</text>
  <rect x="140" y="56" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1/3</text>
  <rect x="200" y="56" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4/9</text>
  <rect x="260" y="56" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">?</text>
  <rect x="320" y="56" width="56" height="40" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="80" text-anchor="middle" font-size="13" fill="#ccc">…</text>

  <!-- index labels -->
  <text x="108" y="110" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="168" y="110" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="228" y="110" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="288" y="110" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="348" y="110" text-anchor="middle" font-size="10" fill="#999">4</text>

  <text x="108" y="126" text-anchor="middle" font-size="9" fill="#446688">&lt;k</text>
  <text x="168" y="126" text-anchor="middle" font-size="9" fill="#446688">&lt;k</text>
  <text x="228" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a">≥k</text>
  <text x="288" y="126" text-anchor="middle" font-size="9" fill="#d6a040">算</text>

  <!-- window highlight (dashed red rect around dp[0] and dp[1]) -->
  <rect x="76" y="52" width="124" height="48" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="138" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">窗口 [x−W, x−1] ∩ [0, k−1]</text>

  <!-- S box -->
  <rect x="76" y="156" width="124" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">S = 1 + 1/3 = 4/3</text>

  <!-- arrow from S to dp[3] -->
  <path d="M 200 171 C 240 171 250 100 260 80" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- dp[3] result -->
  <rect x="248" y="138" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="306" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp[3] = S/W = 4/9</text>

  <!-- slide rules box -->
  <rect x="386" y="52" width="150" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="461" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x → x+1 窗口右移</text>
  <line x1="400" y1="82" x2="522" y2="82" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="396" y="102" font-size="10" fill="#446688" font-weight="bold">① 右端加入</text>
  <text x="396" y="118" font-size="10" fill="#444">若 x &lt; k：</text>
  <text x="396" y="132" font-size="10" fill="#444">  S += dp[x]</text>

  <text x="396" y="156" font-size="10" fill="#b85450" font-weight="bold">② 左端移出</text>
  <text x="396" y="172" font-size="10" fill="#444">若 x−W ≥ 0：</text>
  <text x="396" y="186" font-size="10" fill="#444">  S −= dp[x−W]</text>

  <text x="396" y="210" font-size="9" fill="#b85450">⚠ y ≥ k 不加入 S</text>
  <text x="396" y="222" font-size="9" fill="#888">（已停止，不转移）</text>

  <!-- correctness note -->
  <rect x="40" y="266" width="496" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">正确性：循环上界 x ≤ min(n, k−1+W) ⇒ x−W ≤ k−1 &lt; k</text>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#444">被移出的 dp[x−W] 必然曾是 &lt; k 的状态（已加入过 S），不会误删</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#d6a040">每个状态 O(1) 转移，总计 O(min(n, k+W))</text>
</svg>
