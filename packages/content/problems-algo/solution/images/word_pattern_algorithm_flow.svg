<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 550"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="550" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单词规律：split + 双向哈希流程</text>

  <rect x="140" y="50" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">words = s.split();  p2w={}, w2p={}</text>
  <line x1="280" y1="84" x2="280" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,106 400,146 280,186 160,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len(pattern)</text>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== len(words) ?</text>
  <line x1="400" y1="146" x2="450" y2="146" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="425" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="450" y="126" width="95" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="497" y="151" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>
  <line x1="280" y1="186" x2="280" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="170" y="208" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch = pattern[i] ,  w = words[i]</text>
  <line x1="280" y1="242" x2="280" y2="262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,264 360,304 280,344 200,304" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p2w 含 ch ?</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">且 p2w[ch]==w ?</text>
  <line x1="360" y1="304" x2="410" y2="304" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">冲突</text>
  <rect x="410" y="284" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p2w[ch]≠w</text>
  <text x="470" y="318" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return false</text>
  <line x1="280" y1="344" x2="280" y2="364" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="358" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放行</text>

  <polygon points="280,366 360,406 280,446 200,406" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w2p 含 w ?</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">且 w2p[w]==ch ?</text>
  <line x1="360" y1="406" x2="410" y2="406" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="400" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">冲突</text>
  <rect x="410" y="386" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="404" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w2p[w]≠ch</text>
  <text x="470" y="420" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return false</text>
  <line x1="280" y1="446" x2="280" y2="466" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="460" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放行</text>

  <rect x="120" y="468" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="490" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">登记 p2w[ch]=w, w2p[w]=ch;  i++;  i&lt;n ? 回取字符</text>
  <path d="M 120 485 Q 50 485 50 230 Q 50 230 170 230" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="530" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（全程无冲突 → return true）</text>
</svg>
