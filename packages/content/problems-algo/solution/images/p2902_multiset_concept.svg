<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">多重集合：计数维度是「值」不是「元素」</text>

  <!-- nums row -->
  <text x="30" y="64" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="48" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="67" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="126" y="48" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="172" y="48" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="67" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="218" y="48" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="67" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="264" y="48" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="67" text-anchor="middle" font-size="12" fill="#333">7</text>

  <!-- arrow to counter -->
  <path d="M 180 84 Q 200 110 220 108" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="188" y="104" font-size="10" fill="#d6a040">按值计数</text>

  <!-- counter box -->
  <rect x="90" y="112" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="215" y="134" text-anchor="middle" font-size="12" fill="#333">Counter: { 1:1,  2:2,  4:1,  7:1 }</text>

  <!-- group v=2 options -->
  <text x="30" y="182" font-size="12" fill="#888">值 v=2 (c=2) 的组内选项:</text>
  <rect x="60" y="192" width="86" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="103" y="213" text-anchor="middle" font-size="12" fill="#333">选 0 个</text>
  <rect x="170" y="192" width="86" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="213" y="213" text-anchor="middle" font-size="12" fill="#333">选 1 个 → {2}</text>
  <rect x="280" y="192" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="328" y="213" text-anchor="middle" font-size="12" fill="#333">选 2 个 → {2,2}</text>
  <path d="M 146 209 L 170 209" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 256 209 L 280 209" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="392" y="213" font-size="11" fill="#b85450">每种贡献 = 1</text>

  <!-- key insight box -->
  <rect x="30" y="248" width="330" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="195" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">同值的 j 个元素不可区分</text>
  <text x="195" y="290" text-anchor="middle" font-size="11" fill="#b85450">选 j 个 v 的方案数是 1，不是 C(c, j)</text>
  <text x="195" y="303" text-anchor="middle" font-size="11" fill="#b85450">→ 二进制拆分会把答案算大</text>

  <!-- zero factor box -->
  <rect x="30" y="326" width="330" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="195" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">值 0 是特例：不改变和</text>
  <text x="195" y="368" text-anchor="middle" font-size="11" fill="#d6a040">选 0..cnt[0] 个都合法 → 乘法因子 (cnt[0]+1)</text>

  <!-- right note -->
  <rect x="380" y="248" width="118" height="136" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="439" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分组背包视角</text>
  <text x="439" y="296" text-anchor="middle" font-size="10" fill="#555">每个值 = 一个组</text>
  <text x="439" y="316" text-anchor="middle" font-size="10" fill="#555">组间乘法原理</text>
  <text x="439" y="336" text-anchor="middle" font-size="10" fill="#555">组内加法原理</text>
  <text x="439" y="358" text-anchor="middle" font-size="10" fill="#555">不同值 ≤ 199 个</text>
  <text x="439" y="374" text-anchor="middle" font-size="9" fill="#888">= O(√S)</text>
</svg>
