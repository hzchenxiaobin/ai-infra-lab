<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">König 定理：最小顶点覆盖 = 最大匹配</text>

  <!-- ===== Left side: Maximum Matching ===== -->
  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 最大匹配（红边）</text>

  <!-- Left nodes -->
  <ellipse cx="60" cy="90" rx="24" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="94" text-anchor="middle" font-size="9" fill="#333">A</text>
  <ellipse cx="60" cy="140" rx="24" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="144" text-anchor="middle" font-size="9" fill="#333">B</text>
  <ellipse cx="60" cy="190" rx="24" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="9" fill="#333">C</text>

  <!-- Right nodes -->
  <ellipse cx="200" cy="90" rx="24" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="#333">a</text>
  <ellipse cx="200" cy="140" rx="24" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="9" fill="#333">b</text>
  <ellipse cx="200" cy="190" rx="24" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="9" fill="#333">c</text>

  <!-- Non-matching edges (gray) -->
  <line x1="84" y1="90" x2="176" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="84" y1="140" x2="176" y2="90" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="84" y1="190" x2="176" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Matching edges (red, bold) -->
  <line x1="84" y1="90" x2="176" y2="90" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="84" y1="140" x2="176" y2="140" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="84" y1="190" x2="176" y2="190" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">匹配数 = 3</text>

  <!-- ===== Right side: Minimum Vertex Cover ===== -->
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 最小顶点覆盖（橙圈）</text>

  <!-- Left nodes (A highlighted) -->
  <ellipse cx="350" cy="90" rx="24" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="94" text-anchor="middle" font-size="9" fill="#333">A</text>
  <ellipse cx="350" cy="140" rx="24" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="9" fill="#333">B</text>
  <ellipse cx="350" cy="190" rx="24" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="194" text-anchor="middle" font-size="9" fill="#333">C</text>

  <!-- Right nodes (c highlighted) -->
  <ellipse cx="490" cy="90" rx="24" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="94" text-anchor="middle" font-size="9" fill="#333">a</text>
  <ellipse cx="490" cy="140" rx="24" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="144" text-anchor="middle" font-size="9" fill="#333">b</text>
  <ellipse cx="490" cy="190" rx="24" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="490" y="194" text-anchor="middle" font-size="9" fill="#333">c</text>

  <!-- All edges -->
  <line x1="374" y1="90" x2="466" y2="90" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="374" y1="90" x2="466" y2="140" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="374" y1="140" x2="466" y2="90" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="374" y1="190" x2="466" y2="140" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="374" y1="190" x2="466" y2="190" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Highlight rings on cover vertices -->
  <circle cx="350" cy="90" r="20" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="350" cy="140" r="20" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="490" cy="190" r="20" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">覆盖顶点数 = 3</text>

  <!-- ===== Middle: equality ===== -->
  <line x1="250" y1="150" x2="280" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="140" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">=</text>

  <!-- ===== Bottom: Formula box ===== -->
  <rect x="60" y="260" width="440" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">König 定理（二分图专属）</text>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最小顶点覆盖数 = 最大匹配数</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#555">本题：选最少的 1 翻成 0，使所有相邻边被「打断」</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#555">→ 即求二分图最小顶点覆盖 → 转化为求最大匹配</text>
</svg>
