<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：哈希表维护「值→下标」逐操作替换</text>

  <!-- 1. Build map -->
  <rect x="190" y="40" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① 建索引</text>
  <text x="280" y="76" text-anchor="middle" font-size="9.5" fill="#555">遍历 nums，map[nums[i]] = i</text>

  <path d="M 280 86 L 280 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Loop check -->
  <polygon points="280,108 380,152 280,196 180,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">还有操作?</text>
  <text x="280" y="164" text-anchor="middle" font-size="9" fill="#888">(遍历 operations)</text>

  <!-- yes branch down -->
  <text x="288" y="208" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch right -> return -->
  <text x="392" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 380 152 L 450 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="134" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">⑥ 返回</text>
  <text x="498" y="164" text-anchor="middle" font-size="9.5" fill="#4a7a3a">nums</text>

  <!-- 3. take operation -->
  <rect x="200" y="216" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">② 取操作 [old, new]</text>
  <text x="280" y="249" text-anchor="middle" font-size="9.5" fill="#555">old 在数组中，new 不在</text>

  <path d="M 280 256 L 280 272" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. lookup -->
  <rect x="200" y="274" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ 哈希查下标</text>
  <text x="280" y="307" text-anchor="middle" font-size="9.5" fill="#555">idx = map[old]   O(1)</text>

  <path d="M 280 314 L 280 330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. update nums -->
  <rect x="200" y="332" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">④ 更新数组</text>
  <text x="280" y="365" text-anchor="middle" font-size="9.5" fill="#555">nums[idx] = new</text>

  <path d="M 280 372 L 280 386" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. update map -->
  <rect x="200" y="388" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⑤ 更新索引</text>
  <text x="280" y="421" text-anchor="middle" font-size="9.5" fill="#555">erase old / map[new] = idx</text>

  <!-- loop back arrow -->
  <path d="M 200 408 Q 80 408 80 152 Q 80 152 179 152" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="9" fill="#888" transform="rotate(-90 56 284)">处理下一操作</text>
</svg>
