<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按 n/k 切 k 块，块内双指针反转</text>
  <text x="260" y="42" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">n = 6，k = 3 → 每块大小 m = n / k = 2（块大小不是 k！）</text>

  <!-- 块内交换弧 -->
  <path d="M 158 72 Q 180 48 202 72" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 238 72 Q 260 48 282 72" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 318 72 Q 340 48 362 72" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 原数组格子（按块着色） -->
  <rect x="140" y="78" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="78" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="220" y="78" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="260" y="78" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="300" y="78" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="340" y="78" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="280" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="360" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 块标签 -->
  <text x="180" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">块0 [0,1]</text>
  <text x="260" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">块1 [2,3]</text>
  <text x="340" y="128" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">块2 [4,5]</text>

  <!-- 向下箭头 -->
  <path d="M 180 134 L 180 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 134 L 260 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 134 L 340 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果数组格子 -->
  <rect x="140" y="162" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="180" y="162" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="220" y="162" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="260" y="162" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="300" y="162" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="340" y="162" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="360" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>

  <text x="260" y="214" text-anchor="middle" font-size="11.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">结果 = [2, 1, 3, 4, 6, 5]（块内变、块间不变）</text>

  <!-- 要点框 -->
  <rect x="64" y="226" width="392" height="124" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="250" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="84" y="274" font-size="10.5" fill="#555" filter="url(#rough2)">· m = n / k；第 b 块 = 闭区间 [b·m , b·m+m−1]，b = 0 … k−1</text>
  <text x="84" y="297" font-size="10.5" fill="#555" filter="url(#rough2)">· 块内 l、r 相向而行：swap 后 l++ 、r−−，l ≥ r 即停</text>
  <text x="84" y="320" font-size="10.5" fill="#555" filter="url(#rough2)">· 块互不重叠 → 原地完成，O(1) 额外空间</text>
  <text x="84" y="343" font-size="10.5" fill="#555" filter="url(#rough2)">· k = n 时块长 1（数组不变）；k = 1 时整体反转</text>
</svg>
