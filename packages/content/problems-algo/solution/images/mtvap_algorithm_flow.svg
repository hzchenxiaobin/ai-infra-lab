<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：逐段累加切比雪夫距离
  </text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 初始化总时间</text>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">total = 0</text>

  <!-- Arrow 1->2 -->
  <path d="M 150 106 L 150 128" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="130" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 遍历相邻点对</text>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">for i in 1..n−1</text>

  <!-- Arrow 2->3 -->
  <path d="M 150 192 L 150 214" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="216" width="220" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 计算位移分量</text>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dx = x[i] − x[i−1]</text>
  <text x="150" y="274" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dy = y[i] − y[i−1]</text>

  <!-- Arrow 3->4 -->
  <path d="M 150 286 L 150 308" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="310" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="332" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 累加切比雪夫距离</text>
  <text x="150" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">total += max(|dx|, |dy|)</text>

  <!-- loop back arrow -->
  <path d="M 40 338 Q 20 338 20 158 Q 20 158 40 158" fill="none" stroke="#4a7a3a"
        stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(-90 14 250)">下一对</text>

  <!-- Right side: return -->
  <rect x="300" y="310" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ 返回总时间</text>
  <text x="390" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return total</text>

  <!-- arrow from step4 to return (after loop ends) -->
  <path d="M 260 338 L 300 338" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">结束</text>

  <!-- Right top: formula reminder box -->
  <rect x="300" y="50" width="180" height="120" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="390" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">单段距离公式</text>
  <text x="390" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d(A,B)</text>
  <text x="390" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= min(|dx|,|dy|) 对角</text>
  <text x="390" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">  + ||dx|−|dy|| 直线</text>
  <text x="390" y="158" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= max(|dx|, |dy|)</text>

  <!-- complexity note -->
  <rect x="300" y="190" width="180" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="390" y="234" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">时间 O(n)</text>
  <text x="390" y="254" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">空间 O(1)</text>
  <text x="390" y="276" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n 段各 O(1) 计算</text>
</svg>
