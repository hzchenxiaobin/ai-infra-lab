<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：先验 check(q) 堵死 −1，再二分最小可行 k</text>

  <!-- 开始 -->
  <rect x="200" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 66 L 260 80" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check(q) 说明 -->
  <rect x="140" y="84" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">check(q)：全部 q 条查询的覆盖</text>
  <text x="260" y="116" text-anchor="middle" font-size="10.5" fill="#7a5a1a" filter="url(#rough2)">逐位 ≥ nums ？（一次 O(n + q)）</text>
  <path d="M 260 124 L 260 134" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：check(q) 可行？ -->
  <polygon points="155,166 365,166 260,136 260,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(q) 可行？</text>

  <!-- 否 → 返回 -1 -->
  <path d="M 155 166 L 112 166" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="132" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="20" y="150" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="64" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <!-- 是 → 二分初始化 -->
  <path d="M 260 196 L 260 212" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="150" y="216" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">二分初始化：lo = 0，hi = q</text>
  <path d="M 260 246 L 260 258" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：lo < hi ? -->
  <polygon points="162,290 358,290 260,262 260,318" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">lo &lt; hi ?</text>

  <!-- 否 → 返回 lo -->
  <path d="M 358 290 L 400 290" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="378" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="404" y="274" width="94" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="451" y="295" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 lo ✓</text>

  <!-- 是 → mid + check -->
  <path d="M 260 318 L 260 332" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="125" y="336" width="270" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">mid = (lo + hi) / 2，跑一次 check(mid)</text>
  <text x="260" y="367" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">打点 O(mid) + 还原比较 O(n)</text>
  <path d="M 260 372 L 260 384" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：check(mid) 可行？ -->
  <polygon points="150,416 370,416 260,388 260,444" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="405" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(mid)</text>
  <text x="260" y="421" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">可行？</text>

  <!-- 是：hi = mid，左侧回路 -->
  <path d="M 150 416 L 104 416" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="124" y="406" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是：hi = mid</text>
  <path d="M 104 416 L 70 416 L 70 290 L 156 290" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="76" y="356" font-size="9" fill="#2f5d24" filter="url(#rough2)">往左收</text>

  <!-- 否：lo = mid + 1，底部回路汇入 -->
  <path d="M 260 444 L 260 462" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="275" y="458" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否：lo = mid + 1</text>
  <path d="M 260 462 L 90 462 L 90 418" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 底部注 -->
  <text x="260" y="476" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每轮区间砍半：共 O(log q) 次 check，总时间 O((n + q) log q)，额外空间 O(n)</text>
</svg>
