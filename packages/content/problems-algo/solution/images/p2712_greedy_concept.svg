<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心核心：每个相邻差异独立消除，取左/右翻转的最小成本</text>

  <!-- String s = 0 1 0 1 0 1 -->
  <text x="30" y="62" font-size="12" fill="#888">s =</text>
  <rect x="64" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="68" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="104" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="68" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="144" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="68" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="184" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="68" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="224" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="68" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="264" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="68" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- index labels -->
  <text x="84" y="92" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="124" y="92" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="164" y="92" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="204" y="92" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="244" y="92" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="284" y="92" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- boundary markers (differences) with red zigzag -->
  <text x="104" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚡</text>
  <text x="144" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚡</text>
  <text x="184" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚡</text>
  <text x="224" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚡</text>
  <text x="264" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚡</text>

  <!-- Boundary i=1 example: prefix flip vs suffix flip -->
  <text x="30" y="140" font-size="12" fill="#555" font-weight="bold">以边界 i=1 为例（s[1]=1 ≠ s[2]=0）：</text>

  <!-- Option A: prefix flip [0..1], cost = i+1 = 2 -->
  <rect x="30" y="160" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">前缀翻转 [0..i]</text>
  <text x="130" y="198" text-anchor="middle" font-size="11" fill="#555">翻转 s[0..1]，切换边界 1</text>
  <text x="130" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">成本 = i + 1 = 2</text>

  <!-- Option B: suffix flip [2..5], cost = n-i-1 = 4 -->
  <rect x="290" y="160" width="200" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后缀翻转 [i+1..n-1]</text>
  <text x="390" y="198" text-anchor="middle" font-size="11" fill="#555">翻转 s[2..5]，切换边界 1</text>
  <text x="390" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">成本 = n-i-1 = 4</text>

  <!-- min arrow -->
  <path d="M 230 195 L 285 195" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">取最小</text>

  <!-- Result -->
  <rect x="180" y="250" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min(2, 4) = 2</text>

  <!-- Arrows from options to result -->
  <path d="M 130 232 Q 160 245 220 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 390 232 Q 360 245 300 258" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key lemma box -->
  <rect x="20" y="300" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键引理</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#555">翻转范围内部：两侧同时翻转 → 差异状态不变</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#555">只有跨越翻转边界的那个边界被切换 → 各差异边界独立消除</text>
</svg>
