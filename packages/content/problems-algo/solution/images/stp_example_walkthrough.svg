<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0 0 L 8 0 L 4 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：names=[Mary,John,Emma]、heights=[180,165,170] → 答案 [Mary,Emma,John]</text>

  <!-- ===== Stage A: build idx ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">① 构造 idx（初始等于原始下标）</text>

  <g filter="url(#rough2)">
    <!-- header row -->
    <text x="58" y="84" text-anchor="middle" font-size="10" fill="#999">槽位 i</text>
    <text x="130" y="84" text-anchor="middle" font-size="10" fill="#999">idx[i]</text>
    <text x="220" y="84" text-anchor="middle" font-size="10" fill="#999">heights[idx[i]]</text>
    <text x="330" y="84" text-anchor="middle" font-size="10" fill="#999">指向的人</text>

    <!-- row 0 -->
    <rect x="40" y="90" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="58" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="112" y="90" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="130" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="186" y="90" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="220" y="108" text-anchor="middle" font-size="12" fill="#333">180</text>
    <rect x="284" y="90" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="108" text-anchor="middle" font-size="12" fill="#333">Mary</text>

    <!-- row 1 -->
    <rect x="40" y="118" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="58" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="112" y="118" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="130" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="186" y="118" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="220" y="136" text-anchor="middle" font-size="12" fill="#333">165</text>
    <rect x="284" y="118" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="136" text-anchor="middle" font-size="12" fill="#333">John</text>

    <!-- row 2 -->
    <rect x="40" y="146" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="58" y="164" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="112" y="146" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="130" y="164" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="186" y="146" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="220" y="164" text-anchor="middle" font-size="12" fill="#333">170</text>
    <rect x="284" y="146" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="164" text-anchor="middle" font-size="12" fill="#333">Emma</text>
  </g>

  <!-- down arrow -->
  <path d="M 330 178 L 330 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="192" font-size="11" fill="#b85450" font-weight="bold">按身高降序排 idx</text>
  <text x="420" y="206" font-size="10" fill="#888">180 &gt; 170 &gt; 165</text>

  <!-- ===== Stage B: after sort ===== -->
  <text x="40" y="222" font-size="12" fill="#888" font-weight="bold">② 排序后 idx = [0, 2, 1]（身高从高到低）</text>

  <g filter="url(#rough2)">
    <!-- header row -->
    <text x="130" y="248" text-anchor="middle" font-size="10" fill="#999">idx[k]</text>
    <text x="220" y="248" text-anchor="middle" font-size="10" fill="#999">heights[idx[k]]</text>
    <text x="330" y="248" text-anchor="middle" font-size="10" fill="#999">指向的人</text>

    <!-- row 0: idx 0 -> 180 -> Mary -->
    <rect x="112" y="254" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="130" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
    <rect x="186" y="254" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="220" y="272" text-anchor="middle" font-size="12" fill="#333">180</text>
    <rect x="284" y="254" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="272" text-anchor="middle" font-size="12" fill="#333">Mary</text>

    <!-- row 1: idx 2 -> 170 -> Emma -->
    <rect x="112" y="282" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="130" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <rect x="186" y="282" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="220" y="300" text-anchor="middle" font-size="12" fill="#333">170</text>
    <rect x="284" y="282" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="300" text-anchor="middle" font-size="12" fill="#333">Emma</text>

    <!-- row 2: idx 1 -> 165 -> John -->
    <rect x="112" y="310" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="130" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="186" y="310" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="220" y="328" text-anchor="middle" font-size="12" fill="#333">165</text>
    <rect x="284" y="310" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="330" y="328" text-anchor="middle" font-size="12" fill="#333">John</text>
  </g>

  <!-- down arrow -->
  <path d="M 330 342 L 330 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="356" font-size="11" fill="#446688" font-weight="bold">取 names[idx[k]]</text>

  <!-- ===== Stage C: result ===== -->
  <text x="40" y="386" font-size="12" fill="#888" font-weight="bold">③ 答案</text>

  <g filter="url(#rough2)">
    <rect x="112" y="394" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="158" y="414" text-anchor="middle" font-size="12" fill="#333">Mary</text>
    <rect x="206" y="394" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="252" y="414" text-anchor="middle" font-size="12" fill="#333">Emma</text>
    <rect x="300" y="394" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="346" y="414" text-anchor="middle" font-size="12" fill="#333">John</text>
  </g>
</svg>
