<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：310 → 103 与 -7605 → -7650</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">提取数位 → 按符号排序 → 前导零修正 → 拼接结果</text>

  <!-- ===== Example 1: num = 310 (left) ===== -->
  <text x="150" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例 1：num = 310（正数）</text>

  <!-- original digits -->
  <text x="44" y="92" font-size="9.5" fill="#888">数位</text>
  <rect x="60" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="96" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- arrow down: sort ascending -->
  <path d="M 114 114 L 114 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="126" font-size="9.5" fill="#666" font-weight="bold">升序</text>

  <!-- sorted [0, 1, 3] -->
  <rect x="60" y="134" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="96" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="78" y="174" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">前导零!</text>

  <!-- arrow down: fix -->
  <path d="M 114 178 L 114 194" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="134" y="190" font-size="9.5" fill="#b85450" font-weight="bold">修正</text>

  <!-- swap first non-zero to front [1, 0, 3] -->
  <rect x="60" y="198" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="198" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="132" y="198" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="114" y="242" text-anchor="middle" font-size="9.5" fill="#4a7a3a">首个非零(1)换到首位</text>

  <!-- result -->
  <rect x="72" y="252" width="84" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="114" y="273" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">103</text>

  <!-- vertical divider -->
  <line x1="280" y1="60" x2="280" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2: num = -7605 (right) ===== -->
  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">示例 2：num = -7605（负数）</text>

  <!-- |num| digits [7, 6, 0, 5] -->
  <text x="324" y="92" font-size="9.5" fill="#888">|num| 数位</text>
  <rect x="340" y="82" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="376" y="82" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="412" y="82" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="448" y="82" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- arrow down: sort descending -->
  <path d="M 430 114 L 430 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="126" font-size="9.5" fill="#666" font-weight="bold">降序</text>

  <!-- sorted descending [7, 6, 5, 0] -->
  <rect x="340" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="376" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="412" y="134" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="448" y="134" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="430" y="174" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">首位非零 ✓</text>

  <!-- arrow down: reconstruct -->
  <path d="M 430 178 L 430 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="448" y="196" font-size="9.5" fill="#666" font-weight="bold">取负</text>

  <!-- result -->
  <rect x="380" y="214" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="235" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-7650</text>
  <text x="430" y="262" text-anchor="middle" font-size="9.5" fill="#888">降序 → 绝对值最大 → 值最负</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="310" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键对比</text>
  <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#555">正数：升序排列使高位尽可能小 → 若首位为 0，交换首个非零到首位</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#555">负数：降序排列使绝对值尽可能大 → 首位必为最大非零数字，无前导零问题</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">时间 O(n log n)（排序主导），空间 O(n)（字符串存储）</text>
</svg>
