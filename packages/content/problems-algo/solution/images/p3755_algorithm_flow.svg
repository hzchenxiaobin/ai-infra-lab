<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">一趟扫描：哈希记录每个状态 (px, d) 的最早出现</text>

  <!-- 开始 -->
  <rect x="215" y="30" width="90" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 58 L 260 72" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="130" y="76" width="260" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">px = d = ans = 0；map = { (0,0) : −1 }</text>
  <path d="M 260 114 L 260 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="260,132 345,158 260,184 175,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 345 158 L 380 158" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="150" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <rect x="384" y="140" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="439" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
  <path d="M 260 184 L 260 200" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="196" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <!-- 更新状态 -->
  <rect x="150" y="204" width="220" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">px ⊕= x；d += (x 为偶 ? +1 : −1)</text>
  <path d="M 260 242 L 260 256" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 查询判断 -->
  <polygon points="260,260 360,286 260,312 160,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">map 已有</text>
  <text x="260" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(px, d) ?</text>
  <path d="M 360 286 L 384 286" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="370" y="278" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <rect x="388" y="262" width="124" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">map[(px,d)] = i</text>
  <text x="450" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">仅首次记录！</text>
  <path d="M 260 312 L 260 326" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="322" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <!-- 更新答案 -->
  <rect x="140" y="330" width="240" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(ans, i − map[(px,d)])</text>

  <!-- 回环 -->
  <path d="M 260 368 L 260 392" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 450 310 L 450 392 L 264 392" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 260 392 L 88 392 L 88 158 L 171 158" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="386" font-size="11" fill="#666" filter="url(#rough2)">i++，下一轮</text>
</svg>
