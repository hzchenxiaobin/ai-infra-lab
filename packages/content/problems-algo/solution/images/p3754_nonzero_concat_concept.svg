<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：零对数位和零贡献 ⇒ sum = n 的数位和，一趟剥位同时收 x 与 sum</text>

  <!-- 面板一：按位拆开 -->
  <rect x="20" y="38" width="520" height="216" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① n = 10203004 按位拆开：零划掉，非零位压实成 x = 1234</text>

  <!-- 原数 digit boxes：1 0 2 0 3 0 0 4 -->
  <rect x="60" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="72" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="72" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="220" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="72" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="300" y="72" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="340" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="77" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="117" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="157" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="197" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="237" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="277" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="317" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="357" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">4</text>

  <!-- 零位划叉 -->
  <path d="M 108 80 L 126 98 M 126 80 L 108 98" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 188 80 L 206 98 M 206 80 L 188 98" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 268 80 L 286 98 M 286 80 L 268 98" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 308 80 L 326 98 M 326 80 L 308 98" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>

  <!-- 保留位下滑箭头 -->
  <path d="M 77 110 C 77 124, 77 128, 77 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 157 110 C 157 126, 117 126, 117 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 237 110 C 237 130, 157 130, 157 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 357 110 C 357 134, 197 136, 197 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结果 boxes -->
  <rect x="60" y="146" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="100" y="146" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="146" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="180" y="146" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="168" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="117" y="168" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="157" y="168" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">3</text>
  <text x="197" y="168" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">4</text>

  <text x="238" y="167" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">= x = 1234</text>

  <!-- sum 推导 -->
  <text x="36" y="206" font-size="11" fill="#33506b" filter="url(#rough2)">sum = x 的数位和 = 1 + 2 + 3 + 4 = 10</text>
  <text x="36" y="228" font-size="11" fill="#8a6d1f" filter="url(#rough2)">零加进去也白加 ⇒ sum = n 的数位和：剥位时顺手累加，不必等 x 拼好</text>

  <!-- 右侧答案 -->
  <text x="392" y="96" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans = x × sum</text>
  <text x="392" y="120" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 1234 × 10</text>
  <text x="392" y="144" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 12340 ✓</text>
  <text x="392" y="172" font-size="10" fill="#777" filter="url(#rough2)">（滤零 + 压实幂次</text>
  <text x="392" y="188" font-size="10" fill="#777" filter="url(#rough2)">同 3726 的骨架）</text>

  <text x="36" y="248" font-size="10" fill="#33506b" filter="url(#rough2)">「若不存在非零数字则 x = 0」只对 n = 0 发生：n ≥ 1 时最高位 ∈ 1~9 必被保留</text>

  <!-- 面板二：溢出账与边界 -->
  <rect x="20" y="266" width="520" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="288" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 两笔账 —— 一个烟雾弹 + 一颗边界雷</text>
  <text x="36" y="312" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 溢出账：x ≤ 999999999 恰在 int32 内（烟雾弹）；但 x·sum ≤ 999999999 × 81</text>
  <text x="60" y="332" font-size="10.5" fill="#b85450" filter="url(#rough2)">= 80999999919 ≈ 8.1×10¹⁰，超 INT32_MAX（≈2.1×10⁹）近 38 倍 ⇒ 必须 64 位</text>
  <text x="36" y="356" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 边界账：本题允许 n = 0（对照 3726 的 n ≥ 1）⇒ x = sum = 0，答案 0</text>
  <text x="60" y="376" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">算术版循环不执行天然返回 0；字符串版滤后是空串，int('') 直接炸，须特判</text>
</svg>
