<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <rect x="195" y="18" width="170" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="40" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：读入 nums，n = 长度</text>

  <path d="M280,52 L280,73" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,76 360,108 280,140 200,108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n ≤ 2 ？</text>

  <rect x="430" y="90" width="115" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 max(nums)</text>
  <path d="M362,108 L427,108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M280,140 L280,168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="55" y="172" width="450" height="212" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="9 6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">倒序填表：j = n, n−1, …, 3；每个 j 枚举 i = 0, 1, …, j−1</text>

  <polygon points="280,218 378,252 280,286 182,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j ≥ n−1 ？</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（剩余 ≤ 2 个元素）</text>

  <path d="M280,286 Q240,300 185,308" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="292" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M280,286 Q320,300 375,308" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="292" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="75" y="312" width="185" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">一次删光收尾：</text>
  <text x="167" y="351" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dp[i][j] = max(剩余元素)</text>

  <rect x="300" y="312" width="185" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">三种删法转移取 min：</text>
  <text x="392" y="351" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">代价 + dp[幸存者][j+2]</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">删{a,b}+dp[j+1][j+2] │ 删{a,c}+dp[j][j+2] │ 删{b,c}+dp[i][j+2]</text>

  <path d="M280,384 L280,410" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="414" width="380" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">首步单独枚举：三种删法代价 + dp[幸存者 s][3]</text>
  <text x="280" y="455" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">三者取 min，即为答案</text>
</svg>
