<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：root.val = 全树最小值 m，第二小必 &gt; m</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">特殊性质：每个节点的值 = 其子树的最小值（故 root 必为全局最小）</text>

  <!-- ===== Tree [2,2,5,null,null,5,7] ===== -->
  <g font-size="13">
    <!-- root L0 val=2 (global min, red) -->
    <circle cx="280" cy="92" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="280" y="97" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="312" y="84" font-size="10" fill="#b85450">= m</text>

    <!-- L1: left=2 (== m, must descend, red hollow-ish), right=5 (> m, prune, orange) -->
    <circle cx="200" cy="164" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="200" y="169" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="224" y="158" font-size="10" fill="#b85450">= m</text>

    <circle cx="360" cy="164" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="360" y="169" text-anchor="middle" fill="#7a5a20" font-weight="bold">5</text>
    <text x="384" y="158" font-size="10" fill="#d6a040">&gt; m ✂</text>

    <line x1="264" y1="108" x2="216" y2="148" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="296" y1="108" x2="344" y2="148" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>

    <!-- L2 under left=2: null,null (leaf, no candidate) -->
    <rect x="170" y="216" width="30" height="24" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="185" y="232" text-anchor="middle" font-size="10" fill="#aaa">null</text>
    <rect x="210" y="216" width="30" height="24" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="225" y="232" text-anchor="middle" font-size="10" fill="#aaa">null</text>
    <text x="185" y="258" text-anchor="middle" font-size="10" fill="#b85450">叶子= m → 无候选</text>

    <!-- L2 under right=5: 5,7 — 整棵子树被剪枝，灰色虚线 -->
    <circle cx="324" cy="232" r="16" fill="#eee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="324" y="237" text-anchor="middle" font-size="11" fill="#aaa">5</text>

    <circle cx="396" cy="232" r="16" fill="#eee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="396" y="237" text-anchor="middle" font-size="11" fill="#aaa">7</text>

    <line x1="344" y1="178" x2="332" y2="218" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <line x1="376" y1="178" x2="388" y2="218" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>

    <!-- 剪枝标注 -->
    <rect x="300" y="276" width="120" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="360" y="291" text-anchor="middle" font-size="10" fill="#7a5a20">剪枝：整棵子树不访问</text>
  </g>

  <!-- ===== 两条判定规则 ===== -->
  <line x1="20" y1="318" x2="540" y2="318" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="340" font-size="12" fill="#444" font-weight="bold">两条判定规则（m = root.val）</text>

  <!-- 规则 1 -->
  <rect x="30" y="352" width="245" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="372" font-size="12" fill="#b85450" font-weight="bold">① node.val == m</text>
  <text x="48" y="392" font-size="11" fill="#555">该节点是本子树最小值，</text>
  <text x="48" y="408" font-size="11" fill="#555">第二小可能藏在更深处 →</text>
  <text x="48" y="418" font-size="11" fill="#b85450" font-weight="bold">必须继续向下递归</text>

  <!-- 规则 2 -->
  <rect x="290" y="352" width="245" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="308" y="372" font-size="12" fill="#d6a040" font-weight="bold">② node.val &gt; m</text>
  <text x="308" y="392" font-size="11" fill="#555">子树最小值即 node.val，</text>
  <text x="308" y="408" font-size="11" fill="#555">本子树内没有比它更小且&gt;m 的 →</text>
  <text x="308" y="418" font-size="11" fill="#d6a040" font-weight="bold">返回 node.val，停止下探</text>
</svg>
