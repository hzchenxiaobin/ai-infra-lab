<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：piles = [5, 4, 9], k = 2</text>

  <!-- ===== Step 0: Initial ===== -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">初始</text>
  <text x="40" y="74" font-size="10" fill="#aaa">sum = 18</text>

  <!-- bars for [5, 4, 9] -->
  <rect x="40" y="140" width="36" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <rect x="82" y="155" width="36" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="124" y="80" width="36" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="75" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <text x="100" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 选最大 9</text>

  <!-- arrow to step 1 -->
  <line x1="180" y1="150" x2="220" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="143" text-anchor="middle" font-size="9" fill="#888">移除4</text>

  <!-- ===== Step 1: After first operation ===== -->
  <text x="230" y="58" font-size="11" fill="#888" font-weight="bold">操作1后</text>
  <text x="230" y="74" font-size="10" fill="#aaa">sum = 14</text>

  <rect x="230" y="140" width="36" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <rect x="272" y="155" width="36" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="314" y="125" width="36" height="85" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <text x="290" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9→5（移除4）, ↑ 选最大 5</text>

  <!-- arrow to step 2 -->
  <line x1="370" y1="150" x2="410" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="143" text-anchor="middle" font-size="9" fill="#888">移除2</text>

  <!-- ===== Step 2: After second operation ===== -->
  <text x="420" y="58" font-size="11" fill="#888" font-weight="bold">操作2后</text>
  <text x="420" y="74" font-size="10" fill="#aaa">sum = 12</text>

  <rect x="420" y="155" width="36" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="438" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="462" y="155" width="36" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="504" y="125" width="36" height="85" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="522" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <text x="480" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5→3（移除2）, k=0 停止</text>

  <!-- ===== Summary table ===== -->
  <rect x="30" y="250" width="500" height="135" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">操作记录</text>

  <!-- table header -->
  <text x="60" y="294" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="140" y="294" font-size="10" fill="#888" font-weight="bold">选中的堆</text>
  <text x="240" y="294" font-size="10" fill="#888" font-weight="bold">移除量</text>
  <text x="340" y="294" font-size="10" fill="#888" font-weight="bold">操作后 piles</text>
  <text x="470" y="294" font-size="10" fill="#888" font-weight="bold">剩余总和</text>

  <line x1="40" y1="300" x2="520" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="316" font-size="10" fill="#555">初始</text>
  <text x="140" y="316" font-size="10" fill="#aaa">—</text>
  <text x="240" y="316" font-size="10" fill="#aaa">—</text>
  <text x="340" y="316" font-size="10" fill="#555">[5, 4, 9]</text>
  <text x="470" y="316" font-size="10" fill="#555">18</text>

  <text x="60" y="336" font-size="10" fill="#555">第1次</text>
  <text x="140" y="336" font-size="10" fill="#b85450" font-weight="bold">9</text>
  <text x="240" y="336" font-size="10" fill="#b85450" font-weight="bold">floor(9/2)=4</text>
  <text x="340" y="336" font-size="10" fill="#555">[5, 4, 5]</text>
  <text x="470" y="336" font-size="10" fill="#555">14</text>

  <text x="60" y="356" font-size="10" fill="#555">第2次</text>
  <text x="140" y="356" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="240" y="356" font-size="10" fill="#b85450" font-weight="bold">floor(5/2)=2</text>
  <text x="340" y="356" font-size="10" fill="#555">[3, 4, 5]</text>
  <text x="470" y="356" font-size="10" fill="#555">12</text>

  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 12  ✓</text>
</svg>
