<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：第一段固定选「最早结束」的设施</text>

  <rect x="55" y="38" width="410" height="34" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第二段开始 = max(第一段结束 E, 第二段开放) ⇒ E 越小越早</text>

  <!-- 轴 A：选最早结束的陆地设施 -->
  <text x="260" y="98" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">✔ 第一段选 E* = 6（最早结束）</text>
  <path d="M 50 134 L 450 134" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="44" y="152" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="110" y="152" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="230" y="152" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="320" y="152" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="410" y="152" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12</text>

  <rect x="110" y="118" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">陆 2→6</text>
  <rect x="230" y="118" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">水 6→9</text>
  <path d="M 320 112 L 320 160" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="328" y="108" font-size="11" fill="#b85450" filter="url(#rough2)">完成 = 9 ✔</text>

  <!-- 轴 B：选结束较晚的陆地设施 -->
  <text x="260" y="196" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">✘ 第一段选 E = 9（结束较晚）</text>
  <path d="M 50 232 L 450 232" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="44" y="250" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="230" y="250" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="320" y="250" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="410" y="250" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12</text>

  <rect x="230" y="216" width="60" height="30" fill="#ffffff" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">等待…</text>
  <rect x="290" y="216" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="235" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">陆</text>
  <rect x="320" y="216" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">水 9→12</text>
  <path d="M 410 210 L 410 258" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="416" y="206" font-size="11" fill="#b85450" filter="url(#rough2)">完成 = 12 ✘</text>

  <!-- 结论框 -->
  <rect x="30" y="278" width="460" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(E, w) 关于 E 单调不减 ⇒ E 最小对任意第二段都不吃亏</text>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E* = min(start + dur)（注意：不是 start 最小，也不是 dur 最短）</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两个方向（先陆 / 先水）对称各扫一遍，O(n + m)</text>
</svg>
