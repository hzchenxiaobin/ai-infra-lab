<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：位掩码编码 + 子集枚举</text>

  <!-- ===== Step 1: encode ===== -->
  <rect x="40" y="48" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#446688" font-weight="bold">步骤 1：矩阵 → 位掩码 init</text>
  <text x="60" y="88" font-size="11" fill="#555">bit (i*n+j) = mat[i][j]；如 [[0,0],[0,1]] → bit3=1 → init = 0b1000 = 8</text>
  <text x="470" y="78" font-size="11" fill="#446688" font-weight="bold">O(mn)</text>

  <path d="M 280 108 L 280 122" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: precompute flip masks ===== -->
  <rect x="40" y="126" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="148" font-size="12" fill="#d6a040" font-weight="bold">步骤 2：预处理每格的翻转掩码 flip[b]</text>
  <text x="60" y="166" font-size="11" fill="#555">flip[b] = 自身位 | 合法邻居位（十字形），共 N = m*n 个掩码</text>
  <text x="470" y="156" font-size="11" fill="#d6a040" font-weight="bold">O(mn)</text>

  <path d="M 280 186 L 280 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: enumerate loop ===== -->
  <rect x="40" y="204" width="480" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="226" font-size="12" fill="#b85450" font-weight="bold">步骤 3：枚举子集 s ∈ [0, 2^N)</text>

  <!-- inner pseudo -->
  <rect x="64" y="238" width="452" height="78" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="76" y="256" font-size="11" fill="#444" font-family="'Comic Sans MS', monospace">state = init</text>
  <text x="76" y="274" font-size="11" fill="#444" font-family="'Comic Sans MS', monospace">for b in 0..N−1:  if s 的第 b 位为 1 → state ^= flip[b]</text>
  <text x="76" y="292" font-size="11" fill="#444" font-family="'Comic Sans MS', monospace">if state == 0:  ans = min(ans, popcount(s))</text>
  <text x="76" y="310" font-size="10" fill="#888">→ 找到使 init ⊕ (子集 XOR) = 0 的最小翻转数</text>

  <text x="470" y="234" font-size="11" fill="#b85450" font-weight="bold">O(2^N · N)</text>

  <path d="M 280 328 L 280 342" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: answer ===== -->
  <rect x="40" y="346" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 4：返回 ans（未更新则返回 −1 表示无解）</text>
  <text x="60" y="384" font-size="10" fill="#888">N ≤ 9 → 2^9·9 ≈ 4608 次操作，常数级</text>
</svg>
