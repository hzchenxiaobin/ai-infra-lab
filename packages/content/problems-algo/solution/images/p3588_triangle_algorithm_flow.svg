<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟建表，列 / 行分组枚举</text>

  <!-- 开始 -->
  <rect x="130" y="34" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="51" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M170,60 L170,72" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 建表 -->
  <rect x="30" y="74" width="280" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">一趟扫描建表</text>
  <text x="170" y="107" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">col[x]=(minY,maxY)　row[y]=(minX,maxX)</text>
  <text x="170" y="121" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">记录 Xmin, Xmax, Ymin, Ymax</text>
  <path d="M170,126 L170,138" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 取下一列 -->
  <rect x="105" y="140" width="130" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一列 x</text>
  <path d="M170,166 L170,174" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="100,200 170,174 240,200 170,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">base &gt; 0 ?</text>
  <text x="186" y="232" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M170,226 L170,238" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 计算 h -->
  <rect x="75" y="240" width="190" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">h = max(Xmax−x, x−Xmin)</text>
  <text x="170" y="268" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">只取 &gt; 0 的候选</text>
  <path d="M170,274 L170,284" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形 2 -->
  <polygon points="105,308 170,282 235,308 170,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h &gt; 0 ?</text>
  <text x="186" y="340" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M170,334 L170,346" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 更新 best -->
  <rect x="90" y="348" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="366" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = max(best, base·h)</text>

  <!-- 循环回边（右） -->
  <path d="M250,362 L268,362 L268,153 L237,153" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="255" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">下一列</text>

  <!-- 否：左绕（两条汇合） -->
  <path d="M100,200 L85,200 L85,153 L103,153" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M105,308 L85,308 L85,205" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="78" y="185" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="78" y="197" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="78" y="295" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 列取完 → 行分组 -->
  <path d="M268,240 L336,240" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="302" y="233" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">列取完</text>

  <!-- 右侧对称分支（虚线框） -->
  <rect x="340" y="130" width="170" height="210" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="425" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">对称分支：枚举每个行 y</text>
  <text x="425" y="176" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">底 = maxX − minX</text>
  <text x="425" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">h = max(Ymax−y,</text>
  <text x="425" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">        y−Ymin)</text>
  <text x="425" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">best = max(best,</text>
  <text x="425" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">          底·h)</text>
  <text x="425" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">与列枚举完全对称</text>
  <text x="425" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（x ↔ y 互换）</text>
  <text x="425" y="326" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">最优解可能只有水平边</text>

  <!-- 行分组结果并入 -->
  <path d="M425,340 L425,397 L264,397" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 汇总返回 -->
  <path d="M170,376 L170,384" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="386" width="200" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">返回 best</text>
  <text x="160" y="414" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（从未更新则返回 −1）</text>
</svg>
