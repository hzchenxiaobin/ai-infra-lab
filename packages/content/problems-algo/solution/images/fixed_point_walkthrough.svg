<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- ===== Example 1 ===== -->
  <text x="20" y="24" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：arr=[−10,−5,0,3,7] → 返回 3</text>

  <!-- Round 1 -->
  <text x="20" y="52" font-size="11" fill="#446688" font-weight="bold">第 1 轮：lo=0, hi=4 → mid=2</text>
  <rect x="90" y="58" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="78" text-anchor="middle" font-size="12" fill="#333">−10</text>
  <rect x="155" y="58" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="78" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <rect x="220" y="58" width="65" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="285" y="58" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="350" y="58" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="122" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo</text>
  <text x="252" y="104" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="382" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <rect x="440" y="66" width="108" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="494" y="83" text-anchor="middle" font-size="10.5" fill="#446688">arr[2]=0 &lt; 2 → lo=3</text>

  <!-- Round 2 -->
  <text x="20" y="130" font-size="11" fill="#446688" font-weight="bold">第 2 轮：lo=3, hi=4 → mid=3</text>
  <rect x="90" y="136" width="65" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="156" text-anchor="middle" font-size="12" fill="#aaa">−10</text>
  <rect x="155" y="136" width="65" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="156" text-anchor="middle" font-size="12" fill="#aaa">−5</text>
  <rect x="220" y="136" width="65" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="156" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="285" y="136" width="65" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="350" y="136" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="156" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="317" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo/mid</text>
  <text x="382" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <rect x="440" y="144" width="108" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="494" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">arr[3]=3 ≥ 3 → hi=3</text>

  <!-- Result 1 -->
  <rect x="40" y="200" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">收敛 lo=hi=3，arr[3]==3 → return 3 ✅</text>

  <!-- ===== Example 3 ===== -->
  <text x="20" y="268" font-size="13" fill="#b85450" font-weight="bold">示例 3：arr=[−10,−5,3,4,7,9] → 返回 −1</text>

  <!-- Round 1 -->
  <text x="20" y="296" font-size="11" fill="#446688" font-weight="bold">第 1 轮：lo=0, hi=5 → mid=2</text>
  <rect x="80" y="302" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="322" text-anchor="middle" font-size="12" fill="#333">−10</text>
  <rect x="140" y="302" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="322" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <rect x="200" y="302" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="260" y="302" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="320" y="302" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="380" y="302" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="322" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="110" y="348" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo</text>
  <text x="230" y="348" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="410" y="348" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <rect x="460" y="310" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="506" y="327" text-anchor="middle" font-size="10.5" fill="#b85450">arr[2]=3 ≥ 2 → hi=2</text>

  <!-- Round 2 -->
  <text x="20" y="374" font-size="11" fill="#446688" font-weight="bold">第 2 轮：lo=0, hi=2 → mid=1</text>
  <rect x="80" y="380" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="400" text-anchor="middle" font-size="12" fill="#333">−10</text>
  <rect x="140" y="380" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−5</text>
  <rect x="200" y="380" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="400" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="260" y="380" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <rect x="320" y="380" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="400" text-anchor="middle" font-size="12" fill="#aaa">7</text>
  <rect x="380" y="380" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="400" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  <text x="110" y="426" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo</text>
  <text x="170" y="426" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="230" y="426" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <rect x="460" y="388" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="506" y="405" text-anchor="middle" font-size="10.5" fill="#446688">arr[1]=−5 &lt; 1 → lo=2</text>

  <!-- Result 3 -->
  <rect x="40" y="448" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">收敛 lo=hi=2，arr[2]=3 ≠ 2 → return −1</text>
  <text x="280" y="488" text-anchor="middle" font-size="10.5" fill="#888">f 从 −6 跳到 1，跨越 0 却未取零 → 无不动点</text>
</svg>
