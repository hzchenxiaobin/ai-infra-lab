<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,4,1,3,5,5,3]，pattern = [1,0,−1]</text>
  <text x="44" y="46" font-size="11" fill="#555" filter="url(#rough2)">差分符号化：b = [1, 0, −1, 1, 1, 0, −1]，fail = [0, 0, 0]（失配一律跳回 j = 0）</text>

  <!-- b row -->
  <text x="56" y="84" font-size="11.5" fill="#888" filter="url(#rough2)">b =</text>
  <rect x="88" y="58" width="140" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <rect x="272" y="58" width="140" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <rect x="92" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="184" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="230" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="247" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="276" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="368" y="62" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- b indices -->
  <text x="109" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="155" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="201" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="247" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="293" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="339" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="385" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <!-- hit labels -->
  <text x="158" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中①（b[0..2]）</text>
  <text x="342" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中②（b[4..6]）</text>

  <!-- row backgrounds: hit rows green, fallback row orange -->
  <rect x="41" y="216" width="438" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="41" y="268" width="438" height="26" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="41" y="320" width="438" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- table header -->
  <rect x="40" y="140" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="57" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="87" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="215" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作（p = pattern）</text>
  <text x="360" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j（末）</text>
  <text x="435" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>

  <!-- row 0 (baseline 181) -->
  <text x="57" y="181" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="87" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="108" y="181" font-size="9.5" fill="#555" filter="url(#rough2)">c == p[0]，j: 0→1</text>
  <text x="360" y="181" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="435" y="181" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <!-- row 1 (baseline 207) -->
  <text x="57" y="207" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="87" y="207" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="108" y="207" font-size="9.5" fill="#555" filter="url(#rough2)">c == p[1]，j: 1→2</text>
  <text x="360" y="207" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="435" y="207" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <!-- row 2: hit (baseline 233) -->
  <text x="57" y="233" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="87" y="233" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="108" y="233" font-size="9.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">c == p[2]，j: 2→3 = m ✓ 命中，j ← fail[2] = 0</text>
  <text x="360" y="233" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="435" y="233" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- row 3 (baseline 259) -->
  <text x="57" y="259" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="87" y="259" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="108" y="259" font-size="9.5" fill="#555" filter="url(#rough2)">c == p[0]，j: 0→1</text>
  <text x="360" y="259" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="435" y="259" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <!-- row 4: fallback (baseline 285) -->
  <text x="57" y="285" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="87" y="285" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="108" y="285" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c ≠ p[1] → j ← fail[0] = 0；c == p[0]，j: 0→1</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="435" y="285" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- row 5 (baseline 311) -->
  <text x="57" y="311" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="87" y="311" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="108" y="311" font-size="9.5" fill="#555" filter="url(#rough2)">c == p[1]，j: 1→2</text>
  <text x="360" y="311" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="435" y="311" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <!-- row 6: hit (baseline 337) -->
  <text x="57" y="337" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="87" y="337" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="108" y="337" font-size="9.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">c == p[2]，j: 2→3 = m ✓ 命中，j ← fail[2] = 0</text>
  <text x="360" y="337" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="435" y="337" text-anchor="middle" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- table grid lines -->
  <path d="M 40 164 L 480 164" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 72 140 L 72 346 M 102 140 L 102 346 M 330 140 L 330 346 M 390 140 L 390 346" stroke="#b8c4d4" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <path d="M 40 190 L 480 190 M 40 216 L 480 216 M 40 242 L 480 242 M 40 268 L 480 268 M 40 294 L 480 294 M 40 320 L 480 320" stroke="#b8c4d4" stroke-width="0.8" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="140" width="440" height="206" fill="none" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="36" y="366" width="448" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">两次命中 ⟺ 子数组 nums[0..3] = [1,4,4,1] 与 nums[4..7] = [3,5,5,3]，返回 2 ✓</text>
  <text x="260" y="406" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=4 失配回退后，当场用同一个 c 重新对齐——绝不回头重扫 b</text>
</svg>
