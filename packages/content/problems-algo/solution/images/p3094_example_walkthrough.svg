<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n₀ = 31 = 0b11111（popcount = 5 → c2 恒为 25）</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">每位两连问：c1 探测，c2 抵消副作用；每行第 2 次调用后 n 都恢复 31</text>

  <!-- table header -->
  <rect x="55" y="56" width="55" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">位 i</text>
  <rect x="110" y="56" width="85" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 2^i</text>
  <rect x="195" y="56" width="65" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c1</text>
  <rect x="260" y="56" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 次调用后 n</text>
  <rect x="390" y="56" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c2</text>
  <rect x="450" y="56" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row i=0 -->
  <rect x="55" y="88" width="55" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="88" width="85" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="195" y="88" width="65" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="260" y="88" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">30 (11110)</text>
  <rect x="390" y="88" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="88" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">26 &gt; 25 → 位=1 ✓</text>

  <!-- row i=1 -->
  <rect x="55" y="120" width="55" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="120" width="85" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="195" y="120" width="65" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="260" y="120" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">29 (11101)</text>
  <rect x="390" y="120" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="120" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 位=1 ✓</text>

  <!-- row i=2 -->
  <rect x="55" y="152" width="55" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="152" width="85" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="195" y="152" width="65" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="260" y="152" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">27 (11011)</text>
  <rect x="390" y="152" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="152" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 位=1 ✓</text>

  <!-- row i=3 -->
  <rect x="55" y="184" width="55" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="184" width="85" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="195" y="184" width="65" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="260" y="184" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="204" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">23 (10111)</text>
  <rect x="390" y="184" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="184" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 位=1 ✓</text>

  <!-- row i=4 -->
  <rect x="55" y="216" width="55" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="216" width="85" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">16</text>
  <rect x="195" y="216" width="65" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="260" y="216" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15 (01111)</text>
  <rect x="390" y="216" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="216" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 位=1 ✓</text>

  <!-- row i=5 -->
  <rect x="55" y="248" width="55" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="248" width="85" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">32</text>
  <rect x="195" y="248" width="65" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">24</text>
  <rect x="260" y="248" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="268" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">63 (111111)</text>
  <rect x="390" y="248" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <rect x="450" y="248" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">24 &lt; 25 → 位=0 ✗</text>

  <!-- summary box -->
  <rect x="40" y="294" width="540" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="316" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 0b011111 = 31 ✓（位 0~4 为 1，位 5 及以上为 0）</text>
  <text x="310" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">规律：该位=1 → c1 = c2 + 1 = 26；该位=0 → c1 = c2 − 1 = 24</text>
  <text x="310" y="354" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c2 = 30 − popcount(31) = 25 与 i 无关，恰为 commonBits(0) 的 base</text>

  <!-- concrete illustration for i=0 -->
  <text x="46" y="388" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">验证 i = 0 的第 1 次调用（31 vs 1，高位只示 1 位）：</text>

  <text x="118" y="412" font-size="10.5" fill="#333" filter="url(#rough2)">n</text>
  <rect x="134" y="398" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="168" y="398" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="398" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="398" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="398" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="304" y="398" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="415" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="112" y="444" font-size="10.5" fill="#333" filter="url(#rough2)">num</text>
  <rect x="134" y="430" width="28" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="168" y="430" width="28" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="202" y="430" width="28" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="430" width="28" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="270" y="430" width="28" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="304" y="430" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="447" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="148" y="474" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="182" y="474" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="216" y="474" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="250" y="474" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="284" y="474" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="318" y="474" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="368" y="410" font-size="10.5" fill="#333" filter="url(#rough2)">高位还有 24 位 0 vs 0 ✓</text>
  <text x="368" y="430" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c1 = 2 + 24 = 26 ✓</text>
  <text x="368" y="450" font-size="9.5" fill="#999" filter="url(#rough2)">调用后 n := 31 ⊕ 1 = 30</text>
  <text x="368" y="470" font-size="9.5" fill="#999" filter="url(#rough2)">（第 2 次调用又翻回 31）</text>
</svg>
