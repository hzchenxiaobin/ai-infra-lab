<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：三边定三角——余弦定理 + 排序归一</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序 a ≤ b ≤ c 后只需 a + b &gt; c；每个内角由三条边唯一确定</text>

  <!-- ===== left: generic triangle ===== -->
  <path d="M 95 235 L 255 235 L 155 110 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="95" cy="235" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="255" cy="235" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="155" cy="110" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- angle arcs -->
  <path d="M 121 235 A 26 26 0 0 0 106 212" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 229 235 A 26 26 0 0 1 244 212" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 144 133 A 26 26 0 0 0 171 130" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="219" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="223" y="219" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- side labels -->
  <text x="218" y="166" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="110" y="168" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="175" y="252" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- formula box -->
  <rect x="40" y="266" width="240" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">cos A = (b² + c² − a²) / (2bc)</text>
  <text x="160" y="304" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">A = arccos(…) × 180 / π （度）</text>
  <text x="160" y="319" text-anchor="middle" font-size="9" fill="#a08030" filter="url(#rough2)">A + B + C = 180°（自检）</text>

  <!-- ===== divider ===== -->
  <path d="M 300 216 L 500 216" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ===== right panel 1: example 3-4-5 ===== -->
  <text x="400" y="58" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">示例 [3,4,5]：直角三角形</text>
  <path d="M 330 180 L 330 92 L 396 180 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- right angle mark at (330,180) -->
  <path d="M 330 168 L 342 168 L 342 180" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- angle arcs -->
  <path d="M 330 112 A 20 20 0 0 0 342 108" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 376 180 A 20 20 0 0 1 384 164" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- side labels -->
  <text x="316" y="140" text-anchor="end" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="363" y="196" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="382" y="122" text-anchor="start" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">5</text>
  <!-- angle values -->
  <text x="324" y="82" text-anchor="end" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">36.87°</text>
  <text x="404" y="174" text-anchor="start" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">53.13°</text>
  <text x="348" y="162" text-anchor="start" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">90°</text>
  <text x="398" y="206" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">⇒ [36.86990, 53.13010, 90.00000]</text>

  <!-- ===== right panel 2: degenerate case ===== -->
  <text x="400" y="238" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">反例 [2,4,2]：2 + 2 = 4，共线退化</text>
  <path d="M 330 272 L 450 272" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="330" cy="272" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="390" cy="272" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="450" cy="272" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="290" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="290" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="390" y="256" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="398" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">三点共线，面积 = 0 ⇒ 返回 []</text>

  <!-- ===== takeaway box ===== -->
  <rect x="30" y="332" width="460" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="350" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">① 排序 a ≤ b ≤ c ⇒ 只需检查 a + b &gt; c（== 即退化，返回空数组）</text>
  <text x="42" y="366" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">② cos θ = (邻边² + 邻边² − 对边²) / (2 · 邻边 · 邻边)，arccos 后 × 180/π 转成度</text>
  <text x="42" y="381" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">③ 大边对大角 ⇒ 边升序对应角升序，结果仍显式 sort 兜底</text>
</svg>
