<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 478" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="478" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：松弛双闸门 —— 更短 &amp; 赶在消失之前</text>

  <!-- Panel 1: two gates -->
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 每次松弛：候选值 nd = dist[u] + w 要连闯两关</text>

  <rect x="30" y="66" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">nd = d + w</text>

  <path d="M 132 86 L 152 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="158" y="62" width="104" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">闸门 ① 更短？</text>
  <text x="210" y="100" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">nd &lt; dist[v]</text>

  <path d="M 264 86 L 284 86" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="290" y="62" width="118" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="349" y="82" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">闸门 ② 来得及？</text>
  <text x="349" y="100" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">nd &lt; disappear[v]</text>

  <path d="M 410 86 L 428 86" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <rect x="434" y="64" width="74" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="471" y="84" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dist[v] = nd</text>
  <text x="471" y="102" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">入堆</text>

  <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">任一闸门不过 ⇒ 丢弃：经由 u 到 v 的这条方案作废</text>

  <!-- Panel 2: counterexample graph -->
  <text x="137" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 反例：先跑普通 Dijkstra 再过滤</text>

  <path d="M 73 214 L 167 214" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 182 229 L 182 285" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="262" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 58 229 L 58 285" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="42" y="262" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 73 300 L 167 300" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="58" cy="214" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="219" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="182" cy="214" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="182" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="58" cy="300" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="305" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="182" cy="300" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="305" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="40" y="200" text-anchor="end" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">@5</text>
  <text x="204" y="200" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">@1 ←卡点</text>
  <text x="40" y="324" text-anchor="end" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">@5</text>
  <text x="204" y="322" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">@5</text>

  <text x="137" y="342" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">@t = 节点的消失时刻</text>

  <text x="137" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">最短路 0→1→3 = 2：时刻 1 恰好撞上 1 的消失 ✗</text>
  <text x="137" y="376" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">改道 0→2→3 = 4 &lt; @5 ✓ 这才是合法最短</text>

  <!-- Panel 3: comparison -->
  <rect x="276" y="186" width="232" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="392" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">事后过滤：dist[3]=2 &lt; 5 → 答 2</text>
  <text x="392" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">但路径在时刻 1 途经已消失的 1，非法 ✗</text>

  <rect x="276" y="254" width="232" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="392" y="276" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">双闸门：1 被「1 &lt; 1」拦下不中转</text>
  <text x="392" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">绕道 0→2→3 = 4，答案 4 ✓</text>

  <rect x="276" y="322" width="232" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="392" y="340" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">不变量：能入堆 / 被扩展的节点</text>
  <text x="392" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">必满足 dist &lt; disappear</text>

  <!-- Bottom notes -->
  <rect x="12" y="388" width="496" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">正确性：边权为正 ⇒ 堆顶 (d,u) 弹出时 dist[u] 已定型；消失约束只删状态、不添更小值</text>

  <rect x="12" y="432" width="496" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="455" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">边界：到达时刻 = 消失时刻 ⇒ 不可达（示例 ③），两道闸门一律用严格 &lt;</text>
</svg>
