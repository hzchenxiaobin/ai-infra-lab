<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

<text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">判定流程：三个 O(1) 条件，二选一返回</text>
<rect x="42" y="60" width="330" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
<text x="207" y="82" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① 车与后同列，且象不在中间？</text>
<text x="207" y="100" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">同列：a == e</text>
<text x="207" y="114" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">象挡 ⇔ c == a 且 min(b,f) &lt; d &lt; max(b,f)</text>
<path d="M 374 92 L 394 92" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="384" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
<rect x="42" y="148" width="330" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
<text x="207" y="170" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">② 车与后同行，且象不在中间？</text>
<text x="207" y="188" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">同行：b == f</text>
<text x="207" y="202" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">象挡 ⇔ d == b 且 min(a,e) &lt; c &lt; max(a,e)</text>
<path d="M 374 180 L 394 180" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="384" y="174" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
<rect x="42" y="236" width="330" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
<text x="207" y="258" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 象与后同对角线，且车不在线段中间？</text>
<text x="207" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">同线：|c−e| == |d−f|</text>
<text x="207" y="290" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">车挡 ⇔ |a−c|=|b−d| 且 |a−e|=|b−f| 且 min(c,e)&lt;a&lt;max(c,e)</text>
<path d="M 374 268 L 394 268" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="384" y="262" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
<path d="M 207 126 L 207 145" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="216" y="139" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
<path d="M 207 214 L 207 233" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="216" y="227" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
<path d="M 207 302 L 207 317" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="216" y="313" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
<rect x="396" y="60" width="100" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
<text x="446" y="110" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">任一成立</text>
<text x="446" y="150" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return 1</text>
<text x="446" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">一步直吃 ✓</text>
<rect x="100" y="320" width="214" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
<text x="207" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">三个条件都不成立</text>
<text x="207" y="356" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">return 2 —— 两步必达</text>
<rect x="336" y="320" width="164" height="46" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
<text x="418" y="336" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">两步构造（见概念图）</text>
<text x="418" y="350" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">车走 V/H 路线，或</text>
<text x="418" y="362" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">象让路 + 车直吃</text>
</svg>
