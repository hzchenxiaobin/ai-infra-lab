<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：偶数位回文数必被 11 整除</text>

  <text x="40" y="58" font-size="12" fill="#888">例 1：4 位回文 1221</text>

  <rect x="80" y="68" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="68" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="68" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="68" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+</text>
  <text x="155" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−</text>
  <text x="205" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+</text>
  <text x="255" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−</text>

  <rect x="60" y="130" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#444">交错和 = (+1) + (−2) + (+2) + (−1) = 0</text>

  <path d="M 280 172 L 280 192" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="196" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 能被 11 整除 ⇒ 1221 = 11 × 111</text>

  <line x1="40" y1="248" x2="520" y2="248" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="274" font-size="12" fill="#888">例 2：6 位回文 123321</text>

  <rect x="60" y="284" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="284" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="284" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="284" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="236" y="284" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="284" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <text x="81" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+</text>
  <text x="125" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <text x="169" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+</text>
  <text x="213" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <text x="257" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+</text>
  <text x="301" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>

  <rect x="60" y="342" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">交错和 = (1−2+3−3+2−1) = 0</text>
  <text x="210" y="378" text-anchor="middle" font-size="11" fill="#888">对称位两两抵消 ⇒ 所有偶数位回文 &gt; 11 均非质数</text>
</svg>
