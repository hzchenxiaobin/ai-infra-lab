<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [2, 1, 3, 3, 2]，n = 5</text>

  <!-- array cells -->
  <rect x="160" y="38" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="184" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="208" y="38" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="62" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="38" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="304" y="38" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="62" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="352" y="38" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- position labels -->
  <text x="184" y="92" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="232" y="92" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="328" y="92" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="376" y="92" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">4</text>

  <!-- table header -->
  <rect x="60" y="104" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">值 x</text>
  <rect x="110" y="104" width="100" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">位置</text>
  <rect x="210" y="104" width="150" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">间距（含环绕）</text>
  <rect x="360" y="104" width="70" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">max_gap</text>
  <rect x="430" y="104" width="70" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- Row 1: x=2 -->
  <rect x="60" y="134" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="85" y="152" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="110" y="134" width="100" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 4]</text>
  <rect x="210" y="134" width="150" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4−0=4, 0+5−4=1 → [4,1]</text>
  <rect x="360" y="134" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="430" y="134" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="465" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 2: x=1 -->
  <rect x="60" y="164" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="85" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="110" y="164" width="100" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="182" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1]</text>
  <rect x="210" y="164" width="150" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="182" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1+5−1=5 → [5]</text>
  <rect x="360" y="164" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="430" y="164" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="465" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 3: x=3 -->
  <rect x="60" y="194" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="85" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="110" y="194" width="100" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2, 3]</text>
  <rect x="210" y="194" width="150" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3−2=1, 2+5−3=4 → [1,4]</text>
  <rect x="360" y="194" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="430" y="194" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="465" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- answer box -->
  <rect x="140" y="246" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer = min(2, 2, 2) = 2</text>
</svg>
