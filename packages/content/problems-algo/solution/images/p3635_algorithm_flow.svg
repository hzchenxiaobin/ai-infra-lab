<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 前后缀最小值 + 二分切分</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">solve(first, second) —— second 排序建表，枚举 first 二分找切分点；两个方向各跑一遍</text>

  <rect x="160" y="52" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 land / water 两组项目</text>

  <path d="M 240 80 L 240 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="98" width="330" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第二列表按 start 排序，预处理</text>
  <text x="240" y="134" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">preMinDur[]（前缀最小 d）· sufMinFin[]（后缀最小 s+d）</text>

  <path d="M 240 144 L 240 158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="160" width="270" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举第一列表每个项目：f = s + d</text>

  <path d="M 240 188 L 240 196" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,230 240,198 330,230 240,262" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="226" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">二分定位 lo</text>
  <text x="240" y="243" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">最后一个 start ≤ f</text>

  <path d="M 285 214 L 361 188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 285 246 L 361 260" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="365" y="166" width="135" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选①（已开放组）</text>
  <text x="432" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">f + preMinDur[lo]</text>

  <rect x="365" y="242" width="135" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="258" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">候选②（未开放组）</text>
  <text x="432" y="274" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">sufMinFin[lo+1]</text>

  <path d="M 365 186 C 348 236, 338 268, 328 306" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 365 262 C 345 286, 318 296, 300 306" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="145" y="308" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="328" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">best = min(best, 候选①, 候选②)</text>

  <path d="M 145 324 C 85 296, 78 210, 103 174" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="90" y="250" font-size="9" fill="#4a7a3a" transform="rotate(-90 90 250)" text-anchor="middle" filter="url(#rough2)">下一项目</text>

  <path d="M 250 340 L 250 356" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="125" y="358" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="376" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">交换 land ↔ water，整套流程再跑一遍</text>

  <path d="M 250 386 L 250 400" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="125" y="402" width="250" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="421" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = min(两个方向的 best)</text>

  <text x="445" y="372" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">总复杂度</text>
  <text x="445" y="386" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">O((n+m) log(n+m))</text>
</svg>
