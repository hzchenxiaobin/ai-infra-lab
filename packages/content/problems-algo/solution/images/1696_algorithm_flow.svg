<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单调队列优化 DP（每步均摊 O(1)）</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">dp[0]=nums[0] 入队 → 遍历 i=1..n−1：过期出队 → 查询算 dp[i] → 入队弹尾 → 返回 dp[n−1]</text>

  <!-- ===== Start ===== -->
  <ellipse cx="300" cy="72" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 300 88 L 300 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="150" y="98" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化</text>
  <text x="300" y="128" text-anchor="middle" font-size="11" fill="#444">dp[0] ← nums[0]；deque ← [0]；i ← 1</text>
  <path d="M 300 132 L 300 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: expire ===== -->
  <rect x="70" y="142" width="460" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="160" font-size="12" fill="#b85450" font-weight="bold">① 过期出队（左端）</text>
  <text x="84" y="178" font-size="11" fill="#555">while deque 非空 且 deque.front() &lt; i − k：deque.pop_front()</text>
  <text x="446" y="162" font-size="9" fill="#b85450">去掉滑出窗口的</text>
  <path d="M 300 186 L 300 194" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: query + compute dp[i] ===== -->
  <rect x="70" y="196" width="460" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="214" font-size="12" fill="#446688" font-weight="bold">② 查询窗口最大值并计算 dp[i]</text>
  <text x="84" y="231" font-size="11" fill="#555">dp[i] ← nums[i] + dp[deque.front()]   （队列必非空：i−1 在窗口内）</text>
  <text x="430" y="214" font-size="9" fill="#446688">队头即窗口内</text>
  <text x="430" y="226" font-size="9" fill="#446688">dp 最大值</text>
  <text x="430" y="238" font-size="9" fill="#446688">无 max(0,·)</text>
  <path d="M 300 246 L 300 254" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: push ===== -->
  <rect x="70" y="256" width="460" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">③ 入队弹尾（右端）</text>
  <text x="84" y="292" font-size="11" fill="#555">while dp[deque.back()] ≤ dp[i]：deque.pop_back()；deque.push_back(i)</text>
  <text x="446" y="274" font-size="9" fill="#4a7a3a">弹出不可能再</text>
  <text x="446" y="286" font-size="9" fill="#4a7a3a">成为最大的旧值</text>
  <path d="M 300 300 L 300 308" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: i++ ; i < n ? ===== -->
  <polygon points="300,310 376,340 300,370 224,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="336" text-anchor="middle" font-size="11" fill="#444">i ← i + 1</text>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#444">i &lt; n ?</text>

  <!-- Loop back arrow: from left side of diamond up to step 1 -->
  <path d="M 224 340 L 40 340 L 40 164 L 70 164" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="252" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 50 252)">是 → 继续遍历</text>

  <!-- No arrow: down to return -->
  <path d="M 300 370 L 300 378" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <ellipse cx="300" cy="400" rx="78" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">否 → 返回 dp[n−1]</text>

  <!-- ===== Amortized note ===== -->
  <rect x="400" y="430" width="180" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="448" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">均摊 O(n)</text>
  <text x="490" y="462" text-anchor="middle" font-size="9" fill="#555">每元素入队1次出队1次</text>

  <!-- ===== Compare with 1425 note ===== -->
  <rect x="40" y="430" width="340" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="448" font-size="10" fill="#d6a040" font-weight="bold">与 1425 的差异</text>
  <text x="54" y="462" font-size="9" fill="#555">无 max(0,·)（起点固定）· 答案 dp[n−1] 非 max(dp) · 余骨架完全一致</text>
  <text x="54" y="474" font-size="9" fill="#555">可视为 1425 的"固定首尾路径版"</text>
</svg>
