<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：就地复用零节点 + 单趟扫描累加</text>
  <path d="M 200 40 Q 380 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 初始化 ===== -->
  <g filter="url(#sk)"><rect x="240" y="58" width="280" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="380" y="82" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">初始化</text>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#444">tail = head（首个零=填充目标），cur = head.next，sum = 0</text>

  <path d="M 380 116 L 380 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 判断 cur != null ===== -->
  <g filter="url(#sk)"><path d="M 380 140 L 470 180 L 380 220 L 290 180 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="178" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cur != null ?</text>
  <text x="380" y="194" text-anchor="middle" font-size="10" fill="#7a5415">（还有节点要扫）</text>

  <!-- 否 → 返回 -->
  <path d="M 290 180 L 150 180 L 150 250" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="80" y="252" width="140" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="150" y="276" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 head</text>
  <text x="150" y="292" text-anchor="middle" font-size="10" fill="#2e6e2e">（首节点已改写为段和）</text>

  <!-- 是 → 判断 cur.val == 0 -->
  <path d="M 380 220 L 380 248" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="238" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><path d="M 380 250 L 480 295 L 380 340 L 280 295 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="293" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cur.val == 0 ?</text>
  <text x="380" y="309" text-anchor="middle" font-size="10" fill="#7a5415">（撞到右侧分隔零）</text>

  <!-- 否 → 累加 -->
  <path d="M 480 295 L 600 295 L 600 350" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="540" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="540" y="352" width="120" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="600" y="372" text-anchor="middle" font-size="12" fill="#2b2b2b">sum += cur.val</text>
  <text x="600" y="388" text-anchor="middle" font-size="10" fill="#666">（段内累加）</text>

  <!-- 是 → 结算 -->
  <path d="M 380 340 L 380 368" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="358" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><rect x="280" y="370" width="200" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="380" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">tail.val = sum（写段和进零节点）</text>

  <path d="M 380 406 L 380 428" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 cur.next == null -->
  <g filter="url(#sk)"><path d="M 380 430 L 470 470 L 380 510 L 290 470 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="468" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cur.next == null ?</text>
  <text x="380" y="484" text-anchor="middle" font-size="10" fill="#7a5415">（cur 是末尾零？）</text>

  <!-- 是 → 切断跳出 -->
  <path d="M 290 470 L 150 470 L 150 530" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="462" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="80" y="532" width="140" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="150" y="556" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">tail.next = null</text>
  <text x="150" y="574" text-anchor="middle" font-size="10" fill="#b85450">切断残留，break</text>

  <!-- 否 → 串联下一段 -->
  <path d="M 380 510 L 380 538" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="528" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)"><rect x="270" y="540" width="220" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="562" text-anchor="middle" font-size="11" fill="#2b2b2b">tail.next = cur; tail = cur</text>
  <text x="380" y="580" text-anchor="middle" font-size="11" fill="#2b2b2b">sum = 0（为下一段重置）</text>

  <!-- 回到循环顶的箭头 -->
  <path d="M 600 396 L 600 600 L 700 600 L 700 180 L 470 180" stroke="#4a8edb" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 568 L 690 568 L 690 180 L 470 180" stroke="#4a8edb" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="710" y="400" font-size="10" fill="#4a8edb" font-weight="bold">cur = cur.next</text>
  <text x="710" y="414" font-size="10" fill="#4a8edb">（回循环顶）</text>

  <rect x="40" y="586" width="730" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="380" y="604" text-anchor="middle" font-size="11" fill="#7a5415">关键：撞零时"先填段和 → 再判末尾 → 否则串联下一段零并清零 sum"，三步顺序不可乱</text>
</svg>
