<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：ping(1), ping(100), ping(3001), ping(3002)</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">关注第 4 步：窗口右移使 ping(1) 过期，被队首弹出</text>

  <!-- table header -->
  <g font-size="9" fill="#444" font-weight="bold">
    <rect x="16" y="56" width="24" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="28" y="70" text-anchor="middle">步</text>
    <rect x="40" y="56" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="60" y="70" text-anchor="middle">t</text>
    <rect x="80" y="56" width="96" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="128" y="70" text-anchor="middle">窗口[t−3000,t]</text>
    <rect x="176" y="56" width="120" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="236" y="70" text-anchor="middle">入队前队列</text>
    <rect x="296" y="56" width="110" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="351" y="70" text-anchor="middle">弹出</text>
    <rect x="406" y="56" width="120" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="466" y="70" text-anchor="middle">入队后队列</text>
    <rect x="526" y="56" width="36" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="544" y="70" text-anchor="middle">返回</text>
  </g>

  <!-- rows -->
  <g font-size="9" fill="#333">
    <!-- step 1: ping(1) -->
    <rect x="16" y="78" width="24" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="28" y="96" text-anchor="middle">1</text>
    <rect x="40" y="78" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="60" y="96" text-anchor="middle">1</text>
    <rect x="80" y="78" width="96" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="128" y="96" text-anchor="middle">[−2999, 1]</text>
    <rect x="176" y="78" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="236" y="96" text-anchor="middle" font-size="9" fill="#888">[]（空）</text>
    <rect x="296" y="78" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="351" y="96" text-anchor="middle" fill="#4a7a3a">无（队空）</text>
    <rect x="406" y="78" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="466" y="96" text-anchor="middle" font-size="9">[1]</text>
    <rect x="526" y="78" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="544" y="96" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <!-- step 2: ping(100) -->
    <rect x="16" y="108" width="24" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="28" y="126" text-anchor="middle">2</text>
    <rect x="40" y="108" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="60" y="126" text-anchor="middle">100</text>
    <rect x="80" y="108" width="96" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="128" y="126" text-anchor="middle">[−2900, 100]</text>
    <rect x="176" y="108" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="236" y="126" text-anchor="middle" font-size="9">[1]</text>
    <rect x="296" y="108" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="351" y="126" text-anchor="middle" fill="#4a7a3a">无（1≥−2900）</text>
    <rect x="406" y="108" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="466" y="126" text-anchor="middle" font-size="9">[1, 100]</text>
    <rect x="526" y="108" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="544" y="126" text-anchor="middle" fill="#446688" font-weight="bold">2</text>

    <!-- step 3: ping(3001) -->
    <rect x="16" y="138" width="24" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="28" y="156" text-anchor="middle">3</text>
    <rect x="40" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="60" y="156" text-anchor="middle">3001</text>
    <rect x="80" y="138" width="96" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="128" y="156" text-anchor="middle">[1, 3001]</text>
    <rect x="176" y="138" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="236" y="156" text-anchor="middle" font-size="9">[1, 100]</text>
    <rect x="296" y="138" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="351" y="156" text-anchor="middle" fill="#4a7a3a">无（1≥1）</text>
    <rect x="406" y="138" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="466" y="156" text-anchor="middle" font-size="9">[1,100,3001]</text>
    <rect x="526" y="138" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="544" y="156" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <!-- step 4: ping(3002) - KEY -->
    <rect x="16" y="168" width="24" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="28" y="186" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="40" y="168" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="60" y="186" text-anchor="middle">3002</text>
    <rect x="80" y="168" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="128" y="186" text-anchor="middle" fill="#d6a040" font-weight="bold">[2, 3002]</text>
    <rect x="176" y="168" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="236" y="186" text-anchor="middle" font-size="9">[1,100,3001]</text>
    <rect x="296" y="168" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="351" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">弹 1（1&lt;2）</text>
    <rect x="406" y="168" width="120" height="28" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="466" y="186" text-anchor="middle" font-size="9">[100,3001,3002]</text>
    <rect x="526" y="168" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="544" y="186" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- ===== Explanation of step 4 ===== -->
  <line x1="16" y1="210" x2="564" y2="210" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="224" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 4 步是关键：窗口右端从 3001 → 3002，左端从 1 → 2</text>
  <text x="290" y="266" text-anchor="middle" font-size="10" fill="#555">ping(3002) 后窗口 = [2, 3002]，ping(1) 落到窗外（1 &lt; 2）</text>
  <text x="290" y="282" text-anchor="middle" font-size="10" fill="#555">队首 1 &lt; t−3000=2 → popleft 弹出；下一个队首 100 ≥ 2 → 停止</text>
  <text x="290" y="298" text-anchor="middle" font-size="10" fill="#555">队列剩 [100, 3001, 3002]，全部 ≥ 2 且 ≤ 3002 → 返回 3</text>
  <text x="290" y="312" text-anchor="middle" font-size="9" fill="#888">ping(1) 被弹后永不再入队：未来 t 更大 → t−3000 更大 → 1 永远过期</text>

  <!-- ===== Final result ===== -->
  <rect x="30" y="330" width="520" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：[1, 2, 3, 3]</text>
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#555">4 次 ping = 4 次入队 + 1 次出队 = 5 次操作，均摊每次 1.25 步</text>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#555">窗口最宽 3001ms：队列长度上界 = 窗口内 ping 数</text>
  <text x="290" y="404" text-anchor="middle" font-size="9" fill="#888">单调性是均摊 O(1) 的根：每个 ping 至多被弹一次，总出队 ≤ n</text>
</svg>
