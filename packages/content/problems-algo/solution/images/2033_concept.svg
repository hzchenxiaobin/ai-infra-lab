<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：同余一致性 + 中位数最小化绝对偏差</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">±x 保持余数 → 同余才可行 → 归一步数 → 中位数定标</text>

  <!-- ===== Section 1: Modulo consistency ===== -->
  <text x="28" y="70" font-size="11" fill="#666" font-weight="bold">① 同余判定</text>

  <!-- grid cells with mod -->
  <rect x="60" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="82" y="98" text-anchor="middle" font-size="9" fill="#446688">mod2=1</text>

  <rect x="112" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="76" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="134" y="98" text-anchor="middle" font-size="9" fill="#446688">mod2=1</text>

  <rect x="164" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="76" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="186" y="98" text-anchor="middle" font-size="9" fill="#446688">mod2=1</text>

  <rect x="216" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="76" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="238" y="98" text-anchor="middle" font-size="9" fill="#446688">mod2=1</text>

  <!-- equal mod check -->
  <path d="M 270 72 L 296 72" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="58" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">余数全=1 ✓ 可行</text>

  <!-- failure case note -->
  <rect x="430" y="58" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="77" text-anchor="middle" font-size="10" fill="#b85450">余数不同 → −1</text>

  <!-- arrow down -->
  <path d="M 270 108 L 270 126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 2: Reduction to steps ===== -->
  <text x="28" y="146" font-size="11" fill="#666" font-weight="bold">② 归一步数</text>

  <!-- formula -->
  <rect x="80" y="132" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="151" text-anchor="middle" font-size="11.5" fill="#333">b_i = (a_i − r) / x，r = 公共余数</text>

  <!-- b values -->
  <text x="28" y="184" font-size="10.5" fill="#666">步数 b</text>
  <rect x="80" y="168" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="132" y="168" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="168" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="236" y="168" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- sort arrow -->
  <path d="M 296 182 L 322 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="176" font-size="9.5" fill="#888">排序</text>

  <!-- sorted b -->
  <rect x="330" y="168" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="370" y="168" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="410" y="168" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="428" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="450" y="168" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- median label -->
  <polygon points="428,202 424,210 432,210" fill="#b85450" filter="url(#rough2)"/>
  <text x="428" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">中位数 t</text>

  <!-- arrow down -->
  <path d="M 270 208 L 270 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 3: Convex function ===== -->
  <text x="28" y="248" font-size="11" fill="#666" font-weight="bold">③ 凸函数定标</text>

  <!-- axes -->
  <line x1="80" y1="340" x2="500" y2="340" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="80" y1="250" x2="80" y2="340" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="74" y="345" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="504" y="345" font-size="10" fill="#888">t</text>
  <text x="76" y="252" text-anchor="end" font-size="10" fill="#888">f</text>

  <!-- convex curve f(t) = sum|b_i - t|, V-shape with flat bottom -->
  <path d="M 120 270 L 280 310 L 320 310 L 480 270" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- b tick marks on x axis -->
  <line x1="180" y1="336" x2="180" y2="344" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="358" text-anchor="middle" font-size="10" fill="#666">0</text>
  <line x1="260" y1="336" x2="260" y2="344" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#666">1</text>
  <line x1="340" y1="336" x2="340" y2="344" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <line x1="420" y1="336" x2="420" y2="344" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="358" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- median vertical line to minimum -->
  <line x1="340" y1="310" x2="340" y2="340" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="340" cy="310" r="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- minimum label -->
  <text x="340" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">最小值</text>
  <text x="340" y="288" text-anchor="middle" font-size="10" fill="#b85450">中位数 t=2</text>

  <!-- left/right slope annotations -->
  <text x="170" y="288" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↘ 递减</text>
  <text x="170" y="276" text-anchor="middle" font-size="9" fill="#888">(增大 t 减小和)</text>
  <text x="450" y="288" text-anchor="middle" font-size="9.5" fill="#d6a040">递增 ↗</text>
  <text x="450" y="276" text-anchor="middle" font-size="9" fill="#888">(减小 t 减小和)</text>

  <!-- footer -->
  <text x="270" y="384" text-anchor="middle" font-size="10.5" fill="#888">f(t)=Σ|b_i−t| 为凸函数，谷底在中位数；线性代价→中位数，平方代价→均值</text>
</svg>
