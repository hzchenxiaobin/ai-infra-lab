<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从 2 开始的连续质数前缀和（n = 20）</text>

  <!-- 质数行 -->
  <text x="44" y="92" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">质数 p</text>
  <rect x="96" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="93" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="157" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="93" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="218" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="93" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="279" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="93" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="340" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="93" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="404" y="94" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">…</text>

  <!-- 累加箭头 -->
  <path d="M 118 106 L 118 138" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 179 106 L 179 138" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 240 106 L 240 138" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 301 106 L 301 138" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 362 106 L 362 138" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="436" y="126" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐个累加</text>

  <!-- 前缀和行 -->
  <text x="42" y="164" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">前缀和 S</text>
  <rect x="96" y="144" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="157" y="144" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="218" y="144" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="165" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">10</text>
  <rect x="279" y="144" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="301" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">17</text>
  <rect x="340" y="144" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="362" y="165" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">28</text>

  <!-- 注释 -->
  <text x="118" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">质数 ✓</text>
  <text x="179" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">质数 ✓</text>
  <text x="240" y="192" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合数 ✗</text>
  <text x="301" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">答案！</text>
  <text x="362" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">＞20 ✗</text>

  <!-- n=20 截断线 -->
  <path d="M 331 62 L 331 200" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="331" y="54" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">n = 20 界</text>

  <!-- 要点框 -->
  <rect x="70" y="226" width="386" height="114" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">S(k) 严格递增 → 边累加边记最后一个质数和</text>
  <text x="263" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">候选极少：n = 5×10⁵ 时 k ≤ 398（质数只用到 2729）</text>
  <text x="263" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">判 S(k) 素性：查埃氏筛表，O(1)</text>
  <text x="263" y="328" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合法表示唯一形态：S(k) = 2 + 3 + 5 + … + p(k)</text>
</svg>
