<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：小根堆流水线 + 堆顶哨兵</text>

  <!-- min-heap tree -->
  <line x1="150" y1="88" x2="100" y2="140" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="88" x2="200" y2="140" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="140" x2="75" y2="192" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="140" x2="125" y2="192" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶 = 全局最小（= x）</text>
  <circle cx="150" cy="88" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="93" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="100" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="200" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="75" cy="192" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="125" cy="192" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="150" y="232" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">小根堆：O(1) 看最小，O(log n) 弹 / 压</text>

  <!-- merge machine -->
  <path d="M 167 88 L 296 93" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="236" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x、y 依次出堆</text>
  <rect x="300" y="78" width="150" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">合并机器</text>
  <text x="375" y="124" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">new = 2x + y</text>
  <path d="M 375 138 L 375 172 L 240 172 L 216 151" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">压回 new（会再次入局）</text>

  <!-- sentinel strip -->
  <text x="260" y="252" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">终止哨兵：堆顶过线 ⇔ 全体达标</text>
  <path d="M 55 308 L 462 308" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="452" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">元素值</text>
  <line x1="240" y1="272" x2="240" y2="332" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">阈值 k</text>
  <circle cx="95" cy="308" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="140" cy="308" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="190" cy="308" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="290" cy="308" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="340" cy="308" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="400" cy="308" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="95" y="348" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶（最左 = 最小）</text>
  <text x="348" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最左点也过线 ⇒ 全部 ≥ k，停止</text>
</svg>
