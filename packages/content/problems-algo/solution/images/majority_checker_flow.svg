<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：随机采样 + 二分验证</text>

  <!-- Preprocess box -->
  <rect x="80" y="44" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理：遍历 arr，建 值 → 有序下标表（O(n)）</text>

  <!-- Arrow to loop -->
  <path d="M 280 78 L 280 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Dashed loop rect -->
  <rect x="60" y="96" width="440" height="222" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <rect x="240" y="88" width="80" height="18" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">重复 K = 20 次</text>

  <!-- Step 1 -->
  <rect x="110" y="120" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① idx ← random(left, right)</text>

  <path d="M 280 150 L 280 164" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="110" y="168" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② candidate ← arr[idx]</text>

  <path d="M 280 198 L 280 212" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="110" y="216" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ count ← upper_bound(right) − lower_bound(left)</text>

  <path d="M 280 246 L 280 260" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,264 370,292 280,320 190,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">count ≥</text>
  <text x="280" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">threshold ?</text>

  <!-- yes branch → right -->
  <path d="M 370 292 L 430 292" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="384" y="286" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="432" y="278" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="486" y="297" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">return 候选</text>

  <!-- no branch → down -->
  <path d="M 280 320 L 280 336" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="288" y="332" font-size="10" fill="#b85450" filter="url(#rough2)">否，未命中→继续</text>

  <!-- After loop arrow -->
  <path d="M 280 338 L 280 354" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- return -1 box -->
  <rect x="190" y="358" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">K 轮未命中 → return -1</text>
</svg>
