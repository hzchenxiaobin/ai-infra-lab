<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">dropna(subset=['name'])：只看 name 列，缺失整行删</text>

  <!-- Left: input table -->
  <rect x="35" y="62" width="170" height="205" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">students（输入）</text>

  <rect x="43" y="96" width="70" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="96" width="55" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="168" y="96" width="37" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="113" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="140" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="186" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="43" y="124" width="70" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="124" width="55" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="168" y="124" width="37" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">32</text>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="186" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="43" y="152" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="152" width="55" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="168" y="152" width="37" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">217</text>
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">None</text>
  <text x="186" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">19</text>

  <rect x="43" y="180" width="70" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="180" width="55" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="168" y="180" width="37" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">779</text>
  <text x="140" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="186" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <rect x="43" y="208" width="70" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="208" width="55" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="168" y="208" width="37" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">849</text>
  <text x="140" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="186" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>

  <text x="120" y="254" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">name 列缺失 → 整行删除</text>

  <!-- Middle: arrow + dropna box -->
  <path d="M 208 150 L 292 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="198" y="168" width="96" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="246" y="190" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dropna</text>
  <text x="246" y="208" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(subset=</text>
  <text x="246" y="226" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">['name'])</text>

  <text x="246" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">只检查 name 列</text>
  <text x="246" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缺失行整行丢弃</text>

  <!-- Right: result table -->
  <rect x="300" y="62" width="225" height="205" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结果 DataFrame</text>

  <rect x="312" y="96" width="85" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="397" y="96" width="65" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="462" y="96" width="48" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="113" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="429" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="486" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="312" y="124" width="85" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="397" y="124" width="65" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="462" y="124" width="48" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">32</text>
  <text x="429" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="486" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="312" y="152" width="85" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="397" y="152" width="65" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="462" y="152" width="48" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">779</text>
  <text x="429" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="486" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <rect x="312" y="180" width="85" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="397" y="180" width="65" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="462" y="180" width="48" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">849</text>
  <text x="429" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="486" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>

  <text x="412" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 行存活，相对顺序不变</text>
  <text x="412" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">name 全部非缺失</text>

  <!-- Bottom warning -->
  <rect x="55" y="290" width="450" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 高频坑：NaN ≠ NaN</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">students[students['name'] != np.nan] 一行也删不掉</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">NaN 与任何值（含自身）比较皆为 False，判缺失必须用 notna()</text>
</svg>
