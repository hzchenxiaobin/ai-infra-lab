<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：b 从右往左扫描，先查 a 再加 (c,d) 对</text>

  <!-- Step 1: init -->
  <rect x="220" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 cnt = {}，ans = 0</text>
  <path d="M 300 82 L 300 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="170" y="100" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for b = n-1 递减到 0</text>

  <!-- Branch arrows -->
  <path d="M 220 136 L 150 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 136 L 450 162" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: query a -->
  <rect x="40" y="164" width="220" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 查：枚举 a ∈ [0, b)</text>
  <text x="150" y="206" text-anchor="middle" font-size="10" fill="#444">ans += cnt[nums[a]+nums[b]]</text>
  <text x="150" y="226" text-anchor="middle" font-size="10" fill="#888">cnt 里只有 c &gt; b 的对</text>
  <text x="150" y="242" text-anchor="middle" font-size="9" fill="#b85450">命中即累加该差值出现次数</text>

  <!-- Step 3: add (c,d) -->
  <rect x="340" y="164" width="220" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="450" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 建：枚举 d ∈ (b, n)</text>
  <text x="450" y="206" text-anchor="middle" font-size="10" fill="#444">++cnt[nums[d]-nums[b]]</text>
  <text x="450" y="226" text-anchor="middle" font-size="10" fill="#888">把 c=b 的对存入 cnt</text>
  <text x="450" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a">供更小的 b 查询</text>

  <!-- Loop back arrow -->
  <path d="M 450 252 Q 560 252 560 118 L 430 118" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="190" font-size="9" fill="#888" text-anchor="middle">b--</text>

  <!-- Order warning -->
  <rect x="100" y="266" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ 顺序不能反：必须先查后建，否则 c=b 的非法对会混入</text>
  <path d="M 300 302 L 300 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="220" y="320" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Invariant note -->
  <rect x="60" y="370" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">不变式：处理 b 时，cnt 恰好包含所有 c &gt; b 的 (c,d) 对</text>
  <text x="300" y="404" text-anchor="middle" font-size="10" fill="#888">b 右移 → cnt 增；b 左移 → 旧 b 变成新 c 加入 cnt</text>
</svg>
