<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">峰值居中，两翼同奇偶递减（n = 6）</text>
  <text x="260" y="43" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">左翼 1,3,5：与 6 异奇偶、升序 → 峰值 6 → 右翼 4,2：与 6 同奇偶、降序</text>

  <!-- ============ 路径 ============ -->
  <text x="34" y="72" font-size="12" fill="#4a7a3a" filter="url(#rough2)">路径 m = n−1</text>

  <line x1="87" y1="100" x2="132" y2="100" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="167" y1="100" x2="212" y2="100" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="247" y1="100" x2="292" y2="100" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="327" y1="100" x2="372" y2="100" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="407" y1="100" x2="452" y2="100" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="70" cy="100" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="150" cy="100" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="230" cy="100" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="310" cy="100" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="310" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5514" filter="url(#rough2)">6</text>
  <circle cx="390" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="470" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="110" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×3</text>
  <text x="190" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×15</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×30</text>
  <text x="350" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×24</text>
  <text x="430" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×8</text>

  <text x="260" y="160" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">合计 = 3 + 15 + 30 + 24 + 8 = 80</text>

  <line x1="40" y1="176" x2="480" y2="176" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">同一个值序列！环只是多出一条 (1,2) 闭合边</text>

  <!-- ============ 环 ============ -->
  <text x="34" y="220" font-size="12" fill="#446688" filter="url(#rough2)">环 m = n</text>

  <line x1="87" y1="246" x2="132" y2="246" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="167" y1="246" x2="212" y2="246" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="247" y1="246" x2="292" y2="246" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="327" y1="246" x2="372" y2="246" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="407" y1="246" x2="452" y2="246" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="70" cy="246" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="150" cy="246" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="230" cy="246" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="310" cy="246" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="310" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5514" filter="url(#rough2)">6</text>
  <circle cx="390" cy="246" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="470" cy="246" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="110" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×3</text>
  <text x="190" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×15</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×30</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×24</text>
  <text x="430" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×8</text>

  <path d="M 470 272 Q 270 348 70 272" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">首尾闭合：×2</text>

  <text x="260" y="353" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">合计 = 80 + 2 = 82 ✓</text>
</svg>
