<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历单词 → 拼摩斯串 → 存集合 → 返回集合大小</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始，set = ∅</text>
  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each word -->
  <rect x="170" y="104" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取下一个单词 word</text>
  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init code -->
  <rect x="190" y="164" width="180" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333">code = "" （空串）</text>
  <path d="M 280 200 L 280 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner loop: for each char -->
  <rect x="150" y="224" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 word 的每个字符 ch</text>
  <path d="M 280 260 L 280 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Concat -->
  <rect x="120" y="284" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333">code += morse[ ch - 'a' ]</text>

  <!-- inner loop back -->
  <path d="M 440 301 L 470 301 L 470 241 L 410 241" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="478" y="274" font-size="10" fill="#888">字符未完</text>

  <path d="M 280 320 L 280 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add to set -->
  <rect x="150" y="344" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">set.insert(code)</text>

  <!-- outer loop back -->
  <path d="M 410 361 L 470 361 L 470 121 L 390 121" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="478" y="244" font-size="10" fill="#888">单词未完</text>

  <path d="M 150 361 L 90 361 L 90 410 L 200 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="392" font-size="10" fill="#888">单词遍历完</text>

  <!-- Return -->
  <rect x="200" y="394" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 set.size()</text>

  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#888">一遍遍历 O(S)，S 为所有单词字符总数；集合自动去重</text>
</svg>
