<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：4×4 网格，按行分层扩散</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">grid = [[1,1,1,1],[2,2,2,2],[1,1,1,1],[2,2,2,2]]，输出 3</text>

  <!-- ===== 左：4x4 网格 ===== -->
  <!-- cells 44x44, col gap 6, row gap 8 -->
  <!-- row 0 dist=0 黄 -->
  <rect x="40" y="84" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="114" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">→</text>
  <text x="44" y="96" font-size="8" fill="#d6a040">d0</text>
  <text x="44" y="80" font-size="8" fill="#d6a040">起</text>

  <rect x="90" y="84" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="114" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">→</text>
  <text x="94" y="96" font-size="8" fill="#d6a040">d0</text>

  <rect x="140" y="84" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="114" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">→</text>
  <text x="144" y="96" font-size="8" fill="#d6a040">d0</text>

  <rect x="190" y="84" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="114" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">→</text>
  <text x="194" y="96" font-size="8" fill="#d6a040">d0</text>

  <!-- row 1 dist=1 蓝 -->
  <rect x="40" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="166" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">←</text>
  <text x="44" y="148" font-size="8" fill="#446688">d1</text>

  <rect x="90" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="166" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">←</text>
  <text x="94" y="148" font-size="8" fill="#446688">d1</text>

  <rect x="140" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="166" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">←</text>
  <text x="144" y="148" font-size="8" fill="#446688">d1</text>

  <rect x="190" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="166" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">←</text>
  <text x="194" y="148" font-size="8" fill="#446688">d1</text>

  <!-- row 2 dist=2 绿 -->
  <rect x="40" y="188" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="218" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="44" y="200" font-size="8" fill="#4a7a3a">d2</text>

  <rect x="90" y="188" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="218" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="94" y="200" font-size="8" fill="#4a7a3a">d2</text>

  <rect x="140" y="188" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="218" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="144" y="200" font-size="8" fill="#4a7a3a">d2</text>

  <rect x="190" y="188" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="218" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="194" y="200" font-size="8" fill="#4a7a3a">d2</text>

  <!-- row 3 dist=3 红 -->
  <rect x="40" y="240" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="270" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">←</text>
  <text x="44" y="252" font-size="8" fill="#b85450">d3</text>

  <rect x="90" y="240" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="270" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">←</text>
  <text x="94" y="252" font-size="8" fill="#b85450">d3</text>

  <rect x="140" y="240" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="270" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">←</text>
  <text x="144" y="252" font-size="8" fill="#b85450">d3</text>

  <rect x="190" y="240" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="270" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">←</text>
  <text x="194" y="252" font-size="8" fill="#b85450">d3</text>
  <text x="200" y="236" font-size="8" fill="#b85450">终</text>

  <!-- 0 权绿色横向箭头（沿路径走行）-->
  <path d="M 84 106 L 90 106" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 134 106 L 140 106" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 184 106 L 190 106" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 90 158 L 84 158" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 158 L 134 158" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 190 158 L 184 158" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 84 210 L 90 210" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 134 210 L 140 210" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 184 210 L 190 210" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 190 262 L 184 262" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 262 L 134 262" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 90 262 L 84 262" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 1 权橙色向下箭头（跨行，改方向↓）-->
  <path d="M 212 128 L 212 136" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="4 2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="226" y="136" font-size="9" fill="#d6a040" font-weight="bold">+1</text>

  <path d="M 62 180 L 62 188" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="4 2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="48" y="188" font-size="9" fill="#d6a040" font-weight="bold">+1</text>

  <path d="M 212 232 L 212 240" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="4 2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="226" y="240" font-size="9" fill="#d6a040" font-weight="bold">+1</text>

  <!-- ===== 右：分层表 ===== -->
  <text x="290" y="80" font-size="11" fill="#446688" font-weight="bold">0-1 BFS 分层扩散</text>

  <rect x="290" y="88" width="250" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="109" font-size="10" fill="#d6a040" font-weight="bold">d=0</text>
  <text x="332" y="109" font-size="10" fill="#555">第 0 行：顺→ 走到 (0,3)，0 权连通</text>

  <rect x="290" y="126" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="147" font-size="10" fill="#446688" font-weight="bold">d=1</text>
  <text x="332" y="147" font-size="10" fill="#555">第 1 行：改 (0,3)↓ +1，顺← 走满</text>

  <rect x="290" y="164" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="185" font-size="10" fill="#4a7a3a" font-weight="bold">d=2</text>
  <text x="332" y="185" font-size="10" fill="#555">第 2 行：改 (1,0)↓ +1，顺→ 走满</text>

  <rect x="290" y="202" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="223" font-size="10" fill="#b85450" font-weight="bold">d=3</text>
  <text x="332" y="223" font-size="10" fill="#555">第 3 行：改 (2,3)↓ +1，到达终点</text>

  <!-- 答案框 -->
  <rect x="290" y="250" width="250" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = dist[(3,3)] = 3</text>
  <text x="415" y="288" text-anchor="middle" font-size="9" fill="#666">3 次 +1（跨 3 行），行内全 0 权</text>

  <!-- 底部注脚 -->
  <text x="40" y="320" font-size="10" fill="#888">每行内部顺箭头 0 权连通（绿）；跨行需改方向↓，每次 +1（橙虚）</text>
  <text x="40" y="336" font-size="10" fill="#888">deque 单调 → 同层 0 权优先 push_front，跨层 1 权 push_back</text>
</svg>
