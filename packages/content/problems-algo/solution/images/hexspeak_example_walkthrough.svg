<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：替换型 / 纯字母型 / 非法型 三种情况</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="50" width="500" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">num(十进制串)</text>
  <text x="130" y="69" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">hex 串</text>
  <text x="290" y="69" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">逐字符映射</text>
  <text x="460" y="69" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">结果</text>

  <!-- ===== Row 1: num=257 (replace type) ===== -->
  <rect x="30" y="84" width="500" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <rect x="44" y="92" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="72" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"257"</text>

  <rect x="104" y="92" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="132" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"101"</text>

  <!-- per-char mapping -->
  <rect x="190" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="208" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <path d="M 226 106 L 240 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="240" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="258" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>

  <rect x="286" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="304" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <path d="M 322 106 L 336 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="336" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="354" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O</text>

  <rect x="382" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <path d="M 418 106 L 432 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="432" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="450" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>

  <!-- result -->
  <rect x="486" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="504" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"IOI"</text>

  <text x="72" y="138" font-size="9.5" fill="#4a7a3a">替换型 ✓</text>

  <!-- ===== Row 2: num=2989 (all-letter type) ===== -->
  <rect x="30" y="148" width="500" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <rect x="44" y="156" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="72" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"2989"</text>

  <rect x="104" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="132" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"BAD"</text>

  <!-- per-char: B->B, A->A, D->D (all kept) -->
  <rect x="190" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="208" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>
  <path d="M 226 170 L 240 170" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="258" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>

  <rect x="286" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="304" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <path d="M 322 170 L 336 170" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="336" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="354" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>

  <rect x="382" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">D</text>
  <path d="M 418 170 L 432 170" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="432" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="450" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">D</text>

  <rect x="486" y="156" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="504" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"BAD"</text>

  <text x="72" y="202" font-size="9.5" fill="#446688">纯字母型 ✓（0xBAD）</text>

  <!-- ===== Row 3: num=619 (illegal type) ===== -->
  <rect x="30" y="212" width="500" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <rect x="44" y="220" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="72" y="239" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"619"</text>

  <rect x="104" y="220" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="132" y="239" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"26B"</text>

  <!-- per-char: 2 -> ERROR -->
  <rect x="190" y="220" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="208" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 226 234 L 240 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="240" y="220" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="258" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="286" y="220" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="304" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <path d="M 322 234 L 336 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="336" y="220" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="354" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="382" y="220" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>
  <path d="M 418 234 L 432 234" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="432" y="220" width="36" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="450" y="239" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">—</text>

  <rect x="486" y="220" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="504" y="239" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">"ERROR"</text>

  <text x="72" y="266" font-size="9.5" fill="#b85450">非法型 ✗（含 2、6，到 B 前已判非法）</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="282" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">规律：hex 串只含 0/1/A-F 时合法（0→O、1→I、A-F 不变）；</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">出现 2-9 任一数码即返回 "ERROR"，无需继续映射。</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#aaa">2989 = 0xBAD　|　619 = 0x26B　|　257 = 0x101</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#aaa">合法字母表 {A,B,C,D,E,F,I,O} 恰好对应「能读成单词」的大写字母</text>
</svg>
