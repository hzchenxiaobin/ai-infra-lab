<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：citations = [0,1,3,5,6]  (n=5)</text>

  <!-- ===== Part A: 逐下标判定表 ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#888">① 各下标判定（条件单调切换：假→假→真→真→真）</text>

  <!-- table: i | citations[i] | n-i | 满足? | h=n-i  total width 470, x=45 -->
  <!-- col x: 45,105,225,325,425,515 -->
  <rect x="45" y="66" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="105" y1="66" x2="105" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="225" y1="66" x2="225" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="325" y1="66" x2="325" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="425" y1="66" x2="425" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i</text>
  <text x="165" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">citations[i]</text>
  <text x="275" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">n−i</text>
  <text x="375" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">≥ ?</text>
  <text x="470" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">h = n−i</text>

  <!-- row i=0: 0,5,no -->
  <rect x="45" y="96" width="470" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="105" y1="96" x2="105" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="96" x2="225" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="96" x2="325" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="96" x2="425" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="115" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="165" y="115" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="275" y="115" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="375" y="115" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">0≥5 ✗</text>
  <text x="470" y="115" text-anchor="middle" font-size="11.5" fill="#888">—</text>

  <!-- row i=1: 1,4,no -->
  <rect x="45" y="124" width="470" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="105" y1="124" x2="105" y2="152" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="124" x2="225" y2="152" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="124" x2="325" y2="152" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="124" x2="425" y2="152" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="143" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="165" y="143" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="275" y="143" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="375" y="143" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1≥4 ✗</text>
  <text x="470" y="143" text-anchor="middle" font-size="11.5" fill="#888">—</text>

  <!-- row i=2: 3,3,yes (ANSWER) -->
  <rect x="45" y="152" width="470" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="105" y1="152" x2="105" y2="184" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="152" x2="225" y2="184" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="152" x2="325" y2="184" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="152" x2="425" y2="184" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="173" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="165" y="173" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="275" y="173" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="375" y="173" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">3≥3 ✓</text>
  <text x="470" y="173" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3 ←</text>

  <!-- row i=3: 5,2,yes -->
  <rect x="45" y="184" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="105" y1="184" x2="105" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="184" x2="225" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="184" x2="325" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="184" x2="425" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="203" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="165" y="203" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="275" y="203" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="375" y="203" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5≥2 ✓</text>
  <text x="470" y="203" text-anchor="middle" font-size="11.5" fill="#888">2</text>

  <!-- row i=4: 6,1,yes -->
  <rect x="45" y="212" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="105" y1="212" x2="105" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="212" x2="225" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="212" x2="325" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="212" x2="425" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="231" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="165" y="231" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="275" y="231" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="375" y="231" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">6≥1 ✓</text>
  <text x="470" y="231" text-anchor="middle" font-size="11.5" fill="#888">1</text>

  <!-- ===== Part B: 二分过程 ===== -->
  <text x="280" y="266" text-anchor="middle" font-size="11.5" fill="#888">② 二分查找过程（仅 2 轮即锁定 i=2）</text>

  <!-- binary search table: 轮次 | left | right | mid | citations[mid] | n−mid | 动作 -->
  <rect x="30" y="278" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="278" x2="90" y2="308" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="278" x2="150" y2="308" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="278" x2="210" y2="308" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="270" y1="278" x2="270" y2="308" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="370" y1="278" x2="370" y2="308" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="120" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left</text>
  <text x="180" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <text x="240" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="320" y="298" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">c[mid] vs n−mid</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- round 1: 0,5,2, 3≥3 ✓, right=mid=2 -->
  <rect x="30" y="308" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="308" x2="90" y2="338" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="308" x2="150" y2="338" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="308" x2="210" y2="338" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="308" x2="270" y2="338" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="308" x2="370" y2="338" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="328" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="328" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="180" y="328" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="240" y="328" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ≥ 3 ✓</text>
  <text x="450" y="328" text-anchor="middle" font-size="10.5" fill="#4a7a3a">right = 2</text>

  <!-- round 2: 0,2,1, 1≥4 ✗, left=mid+1=2 -->
  <rect x="30" y="338" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="338" x2="90" y2="368" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="338" x2="150" y2="368" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="338" x2="210" y2="368" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="338" x2="270" y2="368" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="338" x2="370" y2="368" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="358" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="358" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="180" y="358" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="240" y="358" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ≥ 4 ✗</text>
  <text x="450" y="358" text-anchor="middle" font-size="10.5" fill="#b85450">left = 2</text>

  <!-- end row -->
  <rect x="30" y="368" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">left==right==2 → 返回 h = n − left = 5 − 2 = 3 ✓</text>

  <!-- note -->
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">线性扫描需 5 步，二分仅 2 步；n 越大 O(log n) 优势越显著</text>
</svg>
