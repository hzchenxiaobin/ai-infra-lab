<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：points = [[1,1],[3,4],[−1,0]]
  </text>

  <!-- ====== Left: coordinate grid with full path ====== -->
  <text x="135" y="54" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    路径示意
  </text>

  <!-- grid lines -->
  <path d="M 60 150 L 60 300 M 90 150 L 90 300 M 120 150 L 120 300 M 150 150 L 150 300 M 180 150 L 180 300 M 210 150 L 210 300"
        fill="none" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 300 L 210 300 M 60 270 L 210 270 M 60 240 L 210 240 M 60 210 L 210 210 M 60 180 L 210 180 M 60 150 L 210 150"
        fill="none" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- axis labels -->
  <text x="55" y="304" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="88" y="304" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="118" y="304" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="148" y="304" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="178" y="304" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="56" y="273" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="56" y="243" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="56" y="213" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="56" y="183" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="56" y="153" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="60" y="146" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">−1</text>
  <text x="216" y="304" font-size="10" fill="#888" filter="url(#rough2)">x</text>

  <!-- Segment 1: (1,1)→(3,4), green, 2 diagonal + 1 vertical -->
  <path d="M 120 270 L 150 240" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 150 240 L 180 210" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 180 210 L 180 180" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Segment 2: (3,4)→(-1,0), red, 4 diagonal -->
  <path d="M 180 180 L 150 210" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 210 L 120 240" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 120 240 L 90 270" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 90 270 L 60 300" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- waypoint dots -->
  <circle cx="120" cy="270" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150" cy="240" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="180" cy="210" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="180" cy="180" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="150" cy="210" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="120" cy="240" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="90" cy="270" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="60" cy="300" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- point labels -->
  <text x="128" y="266" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <text x="188" y="176" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,4)</text>
  <text x="48" y="314" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(−1,0)</text>

  <!-- segment labels -->
  <text x="165" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">段① 3秒</text>
  <text x="110" y="186" font-size="10" fill="#b85450" filter="url(#rough2)">段② 4秒</text>

  <!-- ====== Right: calculation table ====== -->
  <text x="420" y="54" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    逐段计算
  </text>

  <!-- table header -->
  <rect x="270" y="66" width="270" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="84" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">段</text>
  <text x="335" y="84" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">起点→终点</text>
  <text x="445" y="84" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">|dx|,|dy|</text>
  <text x="515" y="84" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">max</text>

  <!-- row 1 -->
  <rect x="270" y="96" width="270" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="118" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="335" y="118" font-size="11" fill="#333" filter="url(#rough2)">(1,1)→(3,4)</text>
  <text x="445" y="118" font-size="11" fill="#333" filter="url(#rough2)">2, 3</text>
  <text x="515" y="118" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="270" y="132" width="270" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="154" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="335" y="154" font-size="11" fill="#333" filter="url(#rough2)">(3,4)→(−1,0)</text>
  <text x="445" y="154" font-size="11" fill="#333" filter="url(#rough2)">4, 4</text>
  <text x="515" y="154" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- total row -->
  <rect x="270" y="172" width="270" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="196" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="445" y="196" font-size="12" fill="#888" filter="url(#rough2)">3 + 4</text>
  <text x="515" y="196" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- breakdown box for segment 1 -->
  <rect x="270" y="224" width="270" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="244" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段①拆解</text>
  <text x="285" y="262" font-size="11" fill="#333" filter="url(#rough2)">min(2,3)=2 对角步</text>
  <text x="285" y="280" font-size="11" fill="#333" filter="url(#rough2)">3−2=1 竖直步 → 共 3 秒</text>

  <!-- breakdown box for segment 2 -->
  <rect x="270" y="300" width="270" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="320" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">段②拆解</text>
  <text x="285" y="338" font-size="11" fill="#333" filter="url(#rough2)">min(4,4)=4 对角步</text>
  <text x="285" y="356" font-size="11" fill="#333" filter="url(#rough2)">4−4=0 直线步 → 共 4 秒</text>

  <!-- bottom note: example 2 -->
  <rect x="40" y="376" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    示例 2：[[3,2],[−2,2]] → dx=5, dy=0 → max(5,0) = 5 秒
  </text>
</svg>
