<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[1,2,3,4,null,null,null,5,null,6], k=2</text>

  <!-- ===== Left: tree with distance labels ===== -->
  <text x="24" y="56" font-size="12" fill="#446688" font-weight="bold">树（标 BFS 距离）</text>

  <!-- edges -->
  <line x1="92" y1="86" x2="70" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="106" y1="86" x2="138" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="66" y1="132" x2="56" y2="166" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="54" y1="180" x2="46" y2="214" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="44" y1="228" x2="38" y2="262" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 1 dist=1 -->
  <circle cx="100" cy="72" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="124" y="76" font-size="9" fill="#446688">d=1</text>
  <!-- 2 dist=0 target -->
  <circle cx="66" cy="118" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="66" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="66" y="142" text-anchor="middle" font-size="9" fill="#d6a040">d=0 (k)</text>
  <!-- 3 dist=2 leaf answer -->
  <circle cx="144" cy="118" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="144" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="170" y="122" font-size="9" fill="#4a7a3a" font-weight="bold">d=2 ✓</text>
  <!-- 4 dist=1 -->
  <circle cx="52" cy="172" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="76" y="176" font-size="9" fill="#446688">d=1</text>
  <!-- 5 dist=2 -->
  <circle cx="42" cy="220" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="66" y="224" font-size="9" fill="#446688">d=2</text>
  <!-- 6 dist=3 leaf not reached -->
  <circle cx="36" cy="272" r="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="36" y="276" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">6</text>
  <text x="60" y="276" font-size="9" fill="#bbb">d=3</text>

  <!-- ===== Right: step table ===== -->
  <text x="300" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">逐层 BFS 记录</text>

  <!-- header -->
  <rect x="290" y="68" width="260" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="306" y="86" font-size="10" fill="#666" font-weight="bold">距离</text>
  <text x="372" y="86" font-size="10" fill="#666" font-weight="bold">本层节点</text>
  <text x="500" y="86" font-size="10" fill="#666" font-weight="bold">含叶?</text>

  <!-- row 0 -->
  <rect x="290" y="96" width="260" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="114" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="372" y="114" font-size="11" fill="#333">2</text>
  <text x="500" y="114" font-size="11" fill="#888">否</text>

  <!-- row 1 -->
  <rect x="290" y="126" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="144" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="372" y="144" font-size="11" fill="#333">1, 4</text>
  <text x="500" y="144" font-size="11" fill="#888">否</text>

  <!-- row 2 (hit) -->
  <rect x="290" y="156" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="306" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="372" y="174" font-size="11" fill="#333">3, 5</text>
  <text x="500" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">3 是叶 ⭐</text>

  <!-- row 3 (skip) -->
  <rect x="290" y="186" width="260" height="28" fill="#f7f7f7" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="306" y="204" font-size="11" fill="#bbb">3</text>
  <text x="372" y="204" font-size="11" fill="#bbb">6</text>
  <text x="500" y="204" font-size="11" fill="#bbb">跳过</text>

  <!-- explanation lines -->
  <text x="300" y="240" font-size="10" fill="#555">· 层 0：target=2 非叶，扩展邻居 {父1, 左子4}</text>
  <text x="300" y="256" font-size="10" fill="#555">· 层 1：1、4 均非叶，扩展 {3, 5}（2 已访问跳过）</text>
  <text x="300" y="272" font-size="10" fill="#555">· 层 2：3 无子→是叶！本层首个含叶→返回 3</text>

  <!-- answer -->
  <rect x="300" y="288" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = 3（最近叶子，距离 2）</text>
  <text x="420" y="322" text-anchor="middle" font-size="9" fill="#666">比向下到 6（距离 3）更近</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">关键：1 是 2 与 3 的"汇聚点"，BFS 经父指针自动找到这条更短路径</text>
</svg>
