<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 492" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="480" height="492" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">upgrade(num, user) 决策流程</text>

  <!-- ===== start ===== -->
  <rect x="150" y="42" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="15" filter="url(#rough2)"/>
  <text x="240" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">upgrade(num, user)</text>

  <path d="M240 72 L240 92" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- ===== diamond 1 ===== -->
  <polygon points="240,92 312,128 240,164 168,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="124" text-anchor="middle" font-size="11" fill="#333">num 未上锁?</text>
  <text x="240" y="138" text-anchor="middle" font-size="9.5" fill="#888">lockUser[num]==-1</text>

  <path d="M240 164 L240 188" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="252" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M312 128 L346 128" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="122" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="346" y="114" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="#b85450">return false</text>

  <!-- ===== diamond 2 ===== -->
  <polygon points="240,188 312,224 240,260 168,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="220" text-anchor="middle" font-size="11" fill="#333">至少 1 个</text>
  <text x="240" y="234" text-anchor="middle" font-size="11" fill="#333">上锁子孙?</text>

  <path d="M240 260 L240 284" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="252" y="276" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M312 224 L346 224" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="218" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="346" y="210" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#b85450">return false</text>

  <!-- ===== diamond 3 ===== -->
  <polygon points="240,284 312,320 240,356 168,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="316" text-anchor="middle" font-size="11" fill="#333">无上锁祖先?</text>
  <text x="240" y="330" text-anchor="middle" font-size="9.5" fill="#888">沿 parent[] 上溯</text>

  <path d="M240 356 L240 378" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="252" y="372" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M312 320 L346 320" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="314" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="346" y="306" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="324" text-anchor="middle" font-size="11" fill="#b85450">return false</text>

  <!-- ===== action rects ===== -->
  <rect x="140" y="378" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="397" text-anchor="middle" font-size="11" fill="#4a7a3a">DFS 子孙：所有上锁者置 -1</text>

  <path d="M240 408 L240 426" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="140" y="426" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="445" text-anchor="middle" font-size="11" fill="#4a7a3a">lockUser[num] = user</text>

  <path d="M240 456 L240 470" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="160" y="470" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="484" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
