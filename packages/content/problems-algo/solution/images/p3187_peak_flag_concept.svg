<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：峰值收进 0/1 数组 p，查询变开区间和</text>

  <!-- nums 行 -->
  <text x="32" y="74" font-size="11" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="76" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="132" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="52" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="74" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="244" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="356" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="381" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- 下标 -->
  <text x="101" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="157" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="213" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="269" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="325" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="381" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <!-- 峰值标记 -->
  <path d="M 205 44 L 221 44 L 213 31 z" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="238" y="42" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">峰!</text>

  <!-- nums → p 箭头 -->
  <path d="M 213 106 L 213 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="226" y="124" font-size="10.5" fill="#446688" filter="url(#rough2)">逐点判定：严格大于左邻 且 严格大于右邻</text>

  <!-- p 行 -->
  <text x="32" y="157" font-size="11" fill="#888" filter="url(#rough2)">p</text>
  <rect x="76" y="136" width="50" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="156" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">×</text>
  <rect x="132" y="136" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="156" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="188" y="136" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="156" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244" y="136" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="156" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="300" y="136" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="156" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="356" y="136" width="50" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="156" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">×</text>
  <text x="414" y="150" font-size="10" fill="#999" filter="url(#rough2)">端点恒 ×</text>
  <text x="414" y="165" font-size="10" fill="#999" filter="url(#rough2)">永不计数</text>

  <!-- 开区间高亮 -->
  <rect x="127" y="130" width="174" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>

  <!-- 蓝色大括号：查询区间 [l, r] -->
  <path d="M 76 189 L 76 195 L 350 195 L 350 189" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="213" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">查询 [1, l=0, r=4]</text>

  <!-- 绿色小括号：开区间 (l, r) -->
  <path d="M 132 222 L 132 228 L 294 228 L 294 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="213" y="245" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开区间 (l, r)：只数这里面的 p</text>

  <!-- 公式框 -->
  <rect x="60" y="254" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">answer = p[l+1] + p[l+2] + ⋯ + p[r−1]</text>
  <text x="260" y="289" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">= p[1] + p[2] + p[3] = 0+1+0 = 1</text>

  <!-- 等价性说明框 -->
  <rect x="40" y="308" width="440" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">i ∈ (l, r) 时左右邻居仍在子数组内 → 子数组峰 ⇔ 全局峰</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">一个全局维护的 p 数组，就能回答所有查询</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 全局峰落在查询端点上也不数：查询 [2,5] 时 nums[2] 不计入</text>
</svg>
