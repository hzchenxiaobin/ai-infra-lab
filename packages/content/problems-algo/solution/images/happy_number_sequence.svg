<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">数字平方和序列：收敛到 1（快乐）vs 进入循环（不快乐）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">f(x) = 各位数字平方和，把数列看成一条「隐式链表」</text>

  <!-- ===== Happy path: 19 -> 82 -> 68 -> 100 -> 1 ===== -->
  <text x="30" y="78" font-size="11" fill="#4a7a3a" font-weight="bold">n = 19（快乐数）</text>
  <g font-size="11">
    <ellipse cx="70" cy="110" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>

    <ellipse cx="170" cy="110" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">82</text>

    <ellipse cx="270" cy="110" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">68</text>

    <ellipse cx="370" cy="110" rx="24" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="370" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">100</text>

    <ellipse cx="470" cy="110" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="470" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <path d="M 92 110 L 146 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 192 110 L 246 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 292 110 L 344 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 394 110 L 446 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <text x="120" y="98" text-anchor="middle" font-size="8" fill="#888">1²+9²</text>
    <text x="220" y="98" text-anchor="middle" font-size="8" fill="#888">8²+2²</text>
    <text x="320" y="98" text-anchor="middle" font-size="8" fill="#888">6²+8²</text>
    <text x="420" y="98" text-anchor="middle" font-size="8" fill="#888">1²+0²+0²</text>

    <text x="470" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">不动点：f(1)=1 ✓</text>
  </g>

  <!-- ===== Unhappy path: 2 -> 4 -> 16 -> 37 -> 58 -> 89 -> 145 -> 42 -> 20 -> (4) ===== -->
  <text x="30" y="178" font-size="11" fill="#b85450" font-weight="bold">n = 2（不快乐数，进入循环）</text>
  <g font-size="11">
    <!-- tail: 2 -->
    <ellipse cx="55" cy="210" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="55" y="214" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <path d="M 73 210 L 96 210" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="84" y="200" text-anchor="middle" font-size="8" fill="#888">2²</text>

    <!-- cycle ring: 4 -> 16 -> 37 -> 58 -> 89 -> 145 -> 42 -> 20 -> back to 4 -->
    <!-- 4 (entry) -->
    <circle cx="130" cy="210" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="130" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <!-- 16 -->
    <circle cx="195" cy="245" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="195" y="249" text-anchor="middle" fill="#b85450" font-weight="bold">16</text>
    <!-- 37 -->
    <circle cx="270" cy="258" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="262" text-anchor="middle" fill="#b85450" font-weight="bold">37</text>
    <!-- 89 -->
    <circle cx="345" cy="245" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="345" y="249" text-anchor="middle" fill="#b85450" font-weight="bold">89</text>
    <!-- 145 -->
    <circle cx="410" cy="210" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="410" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">145</text>
    <!-- 42 -->
    <circle cx="410" cy="150" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="410" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">42</text>
    <!-- 58 -->
    <circle cx="270" cy="150" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">58</text>
    <!-- 20 -->
    <circle cx="130" cy="150" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">20</text>

    <!-- ring arrows -->
    <path d="M 144 222 Q 170 240 180 240" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 213 252 Q 240 258 252 258" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 288 258 Q 315 258 327 252" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 363 240 Q 388 222 392 218" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 410 192 L 410 168" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 392 150 Q 330 150 288 150" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 252 150 Q 190 150 148 150" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 130 168 L 130 192" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <text x="130" y="290" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">入口 4</text>
    <text x="130" y="130" text-anchor="middle" font-size="8" fill="#b85450">环回（20→4）</text>
  </g>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="318" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">序列要么停在 1（不动点），要么进入不含 1 的环——必居其一</text>
  <text x="270" y="356" text-anchor="middle" font-size="9" fill="#555">大数经一次 f 后 ≤ 810，再一次 ≤ 243；[1,243] 内由鸽笼原理必重复或到 1</text>
</svg>
