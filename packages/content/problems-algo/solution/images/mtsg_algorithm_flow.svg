<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">整理字符串算法流程（栈方法）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="80" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: stack = []</text>

  <!-- Arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: loop condition -->
  <polygon points="270,104 360,150 270,196 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">还有字符 c ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(遍历 s)</text>

  <!-- No branch -> return -->
  <path d="M 360 150 L 420 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="470" cy="150" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="154" text-anchor="middle" font-size="12" fill="#333">返回结果</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 2: bad pair check -->
  <polygon points="270,218 380,264 270,310 160,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#333">栈非空 且</text>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#333">栈顶与 c bad pair ?</text>

  <!-- Yes (cancel) -> left -> pop -->
  <path d="M 160 264 L 100 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="11" fill="#b85450">是(抵消)</text>
  <rect x="24" y="244" width="76" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="270" text-anchor="middle" font-size="11" fill="#333">弹出栈顶</text>

  <!-- No -> down -> push -->
  <path d="M 270 310 L 270 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="324" font-size="11" fill="#82b366">否</text>
  <rect x="150" y="332" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="355" text-anchor="middle" font-size="12" fill="#333">c 入栈（追加到栈顶）</text>

  <!-- Loop back arrow -->
  <path d="M 150 350 L 50 350 L 50 150 L 180 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 250)">继续遍历下一字符</text>

  <!-- Summary note -->
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#888">关键：弹出后栈顶暴露，下一字符自动与新栈顶比较</text>
</svg>
