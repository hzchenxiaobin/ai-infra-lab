<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：逐对取键值 → 键转串 → 判撞键 → 覆盖/新增</text>

  <!-- 输入 -->
  <rect x="210" y="44" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：keys[], values[]</text>

  <path d="M 310 80 L 310 104" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="230" y="108" width="160" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">const obj = {};  i = 0</text>

  <path d="M 310 142 L 310 166" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判定 -->
  <polygon points="310,170 410,210 310,250 210,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; keys.length?</text>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（= values.length）</text>

  <!-- 否 → 返回 -->
  <path d="M 410 210 L 530 210" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="202" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">否</text>
  <rect x="530" y="194" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="570" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return obj</text>

  <!-- 是 → 取键值 -->
  <path d="M 310 250 L 310 274" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="266" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">是</text>

  <rect x="210" y="278" width="200" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = String(keys[i]), v = values[i]</text>

  <path d="M 310 312 L 310 336" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 撞键判定 -->
  <polygon points="310,340 420,378 310,416 200,378" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k 已在 obj 中？</text>
  <text x="310" y="390" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(k in obj)</text>

  <!-- 是 → 覆盖 -->
  <path d="M 200 378 L 120 378" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="370" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">是·覆盖</text>
  <rect x="20" y="362" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="383" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj[k] = v (覆盖)</text>

  <!-- 否 → 新增 -->
  <path d="M 420 378 L 500 378" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="370" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">否·新增</text>
  <rect x="500" y="362" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="383" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj[k] = v (新增)</text>

  <!-- 回到循环 i++ -->
  <path d="M 70 362 C 70 300, 160 270, 230 124" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="90" y="320" font-size="10" fill="#888" filter="url(#rough2)">i++</text>
  <path d="M 550 362 C 550 300, 460 270, 390 124" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="320" font-size="10" fill="#888" filter="url(#rough2)">i++</text>

  <text x="310" y="446" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">声明式 Object.fromEntries(zip) 与此流程完全等价，键转换/覆盖由规范内置</text>
</svg>
