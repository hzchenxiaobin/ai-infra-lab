<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每种颜色的包围矩形决定打印先后（覆盖即依赖）</text>

  <!-- ====== 左侧：示例1 的 4×4 网格 ====== -->
  <!-- 网格 cell w=36 h=36, origin (60,70) -->
  <!-- row0: 1 1 1 1 -->
  <rect x="60" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row1: 1 2 2 1 -->
  <rect x="60" y="106" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="106" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="129" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">2</text>
  <rect x="132" y="106" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="129" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">2</text>
  <rect x="168" y="106" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row2: 1 2 2 1 -->
  <rect x="60" y="142" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="142" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="165" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">2</text>
  <rect x="132" y="142" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="165" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">2</text>
  <rect x="168" y="142" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row3: 1 1 1 1 -->
  <rect x="60" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="178" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- 颜色1 的包围矩形 = 整个网格（蓝色粗虚线框，外扩 4px） -->
  <rect x="55" y="65" width="154" height="154" fill="none" stroke="#446688" stroke-width="2.4" stroke-dasharray="6,4" rx="5" filter="url(#rough2)"/>
  <text x="132" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">颜色1 包围矩形</text>

  <!-- 颜色2 的包围矩形 = 中心 2×2（橙色粗框） -->
  <rect x="93" y="103" width="78" height="78" fill="none" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="132" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">颜色2 包围矩形</text>

  <!-- ====== 右侧：依赖规则 ====== -->
  <rect x="270" y="64" width="270" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="86" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">依赖规则</text>
  <text x="282" y="110" font-size="11" fill="#444">打印机后打的覆盖先打的。</text>
  <text x="282" y="128" font-size="11" fill="#444">颜色 A 打印时涂满自己的包围矩形，</text>
  <text x="282" y="146" font-size="11" fill="#444">若矩形内某格最终是颜色 B (B≠A)，</text>
  <text x="282" y="164" font-size="11" fill="#444">说明 B 在 A 之后打印（盖在 A 上）</text>
  <text x="282" y="184" font-size="12" fill="#b85450" font-weight="bold">→ 建有向边 A → B（A 先于 B）</text>
  <text x="282" y="208" font-size="11" fill="#555">本题：颜色1 矩形内有 2 → 边 1→2</text>

  <!-- ====== 底部：依赖图 ====== -->
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">示例 1 的颜色依赖图</text>

  <!-- 节点1 -->
  <ellipse cx="170" cy="310" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 节点2 -->
  <ellipse cx="370" cy="310" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="315" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">2</text>
  <!-- 边 1→2 -->
  <path d="M 196 310 L 344 310" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">先打印</text>

  <!-- 结论 -->
  <rect x="80" y="350" width="400" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">无环 → 拓扑序 [1, 2] 可行 → true</text>
</svg>
