<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：诱导子图 + 两个独立条件</text>

  <!-- 左：原图 -->
  <rect x="25" y="48" width="185" height="135" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="117" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">原图</text>
  <line x1="85" y1="114" x2="101" y2="106" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="133" y1="106" x2="149" y2="114" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="70" cy="122" r="19" fill="white" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="70" y="133" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">1</text>
  <circle cx="117" cy="96" r="19" fill="white" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="107" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">0</text>
  <circle cx="164" cy="122" r="19" fill="white" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="164" y="133" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="117" y="172" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">圆内：上＝编号　下＝值</text>

  <!-- 枚举箭头 -->
  <path d="M212,115 L238,115" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="103" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">枚举子集</text>

  <!-- 右上：S = {0,1,2} -->
  <rect x="245" y="48" width="250" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">S = {0, 1, 2}</text>
  <line x1="306" y1="94" x2="322" y2="90" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="344" y1="90" x2="360" y2="94" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="295" cy="100" r="15" fill="white" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="295" y="110" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">1</text>
  <circle cx="333" cy="86" r="15" fill="white" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="96" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">0</text>
  <circle cx="371" cy="100" r="15" fill="white" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="371" y="110" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="455" y="96" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">和 = 2 偶 ✓</text>
  <text x="455" y="114" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">连通 ✓</text>

  <!-- 右下：S = {0,2} -->
  <rect x="245" y="140" width="250" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="start" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">S = {0, 2}</text>
  <circle cx="300" cy="188" r="15" fill="white" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="198" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">1</text>
  <circle cx="390" cy="188" r="15" fill="white" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="390" y="198" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">1</text>
  <line x1="317" y1="184" x2="373" y2="184" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6" filter="url(#rough2)"/>
  <line x1="339" y1="177" x2="351" y2="189" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="351" y1="177" x2="339" y2="189" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="205" text-anchor="middle" font-size="9" fill="#8a3a34" filter="url(#rough2)">两条边的端点 1 ∉ S，全删</text>
  <text x="458" y="184" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">和 = 2 偶 ✓</text>
  <text x="458" y="202" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不连通 ✗</text>

  <!-- 底部要点 -->
  <rect x="25" y="228" width="470" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">两个条件彼此独立，逐个过滤</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">① 和为偶 ⇔ 值为 1 的节点数为偶数：popcount(s &amp; odd)，O(1) 判定</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 连通 ⇔ 只走「邻居 ∈ S」的边即可遍历全 S：adj[u] &amp; s，免删边建图</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 单点子集是 K₁，天然连通——值为 0 即计入（示例 1 的 {1}）</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">检查顺序 = 剪枝顺序：先 O(1) 奇偶砍一半，再 BFS 判连通</text>
</svg>
