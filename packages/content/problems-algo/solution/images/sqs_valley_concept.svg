<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">平方后呈「山谷形」——最大值必在两端</text>

  <!-- Row 1: original array -->
  <text x="40" y="74" font-size="12" fill="#888">原数组:</text>
  <rect x="100" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−4</text>
  <rect x="160" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="220" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <!-- left / right pointer labels -->
  <text x="128" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ left</text>
  <text x="368" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right ↑</text>

  <!-- Row 2: squared values (valley) -->
  <text x="40" y="148" font-size="12" fill="#888">平方后:</text>
  <rect x="100" y="128" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">16</text>
  <rect x="160" y="128" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="128" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="128" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="340" y="128" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>

  <!-- valley curve annotation -->
  <path d="M 128 178 Q 248 210 368 178" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="248" y="206" text-anchor="middle" font-size="11" fill="#888">两端大、中间小（山谷形）</text>

  <!-- Row 3: result array filled from back -->
  <text x="40" y="252" font-size="12" fill="#888">结果:</text>
  <rect x="100" y="232" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="253" text-anchor="middle" font-size="12" fill="#bbb">?</text>
  <rect x="160" y="232" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="253" text-anchor="middle" font-size="12" fill="#bbb">?</text>
  <rect x="220" y="232" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="253" text-anchor="middle" font-size="12" fill="#bbb">?</text>
  <rect x="280" y="232" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="253" text-anchor="middle" font-size="12" fill="#bbb">?</text>
  <rect x="340" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>

  <!-- fill direction arrow -->
  <path d="M 396 248 L 120 248" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="11" fill="#b85450">← 从末尾往前填（pos: n−1 → 0）</text>

  <!-- Insight box -->
  <rect x="40" y="300" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：比较两端 |nums[left]| 与 |nums[right]|</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#666">较大者的平方填入结果末尾，该端指针内移，O(n) 一次过</text>
</svg>
