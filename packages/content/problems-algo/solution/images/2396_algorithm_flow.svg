<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：O(1) 一票否决，恒返回 false</text>

  <!-- start: input n -->
  <rect x="210" y="42" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n（4 ≤ n ≤ 10⁵）</text>

  <!-- arrow down to decision -->
  <path d="M 280 76 L 280 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: n >= 5 ? -->
  <polygon points="280,100 366,142 280,184 194,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">n ≥ 5 ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">（区间含 b = n−2）</text>

  <!-- left branch: yes -> b = n-2 -> "12" -->
  <path d="M 194 142 L 114 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="30" y="120" width="84" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="72" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b = n − 2</text>
  <text x="72" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n → "12"</text>

  <text x="72" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首位1 ≠ 末位2 ✗</text>

  <!-- right branch: no -> n=4 -> b=2 -> "100" -->
  <path d="M 366 142 L 446 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否(n=4)</text>

  <rect x="446" y="120" width="84" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="488" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">b = 2</text>
  <text x="488" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n → "100"</text>

  <text x="488" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首位1 ≠ 末位0 ✗</text>

  <!-- both branches converge down to a merge point then into result -->
  <path d="M 72 192 V 232 H 276" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 488 192 V 232 H 284" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 232 V 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="200" y="264" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">return false</text>

  <!-- bottom note -->
  <rect x="40" y="324" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#666">无论哪个分支，都只需考查一个进制即可判定「非回文」，</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666">全程 O(1) 时间、O(1) 空间，无需进制转换与回文校验。</text>
</svg>
