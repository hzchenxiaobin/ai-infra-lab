<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：n=5, time=3, change=5</text>

  <!-- ===== Graph ===== -->
  <text x="40" y="50" font-size="12" fill="#555" font-weight="bold">城市图（蓝=最短路径，红=第二短路径）：</text>

  <!-- Edges (drawn before nodes so nodes overlap) -->
  <!-- 1-2: vertical left -->
  <path d="M 100 150 L 60 80" stroke="#ddd" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- 1-3: diagonal, RED (second shortest) -->
  <path d="M 100 150 L 200 80" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 1-4: horizontal, BLUE (shortest) -->
  <path d="M 100 150 L 200 150" stroke="#446688" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 3-4: vertical, RED (second shortest) -->
  <path d="M 200 80 L 200 150" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 4-5: horizontal, both paths share → purple-ish -->
  <path d="M 200 150 L 300 150" stroke="#7b6baa" stroke-width="2.8" fill="none" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="100" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <circle cx="60" cy="80" r="14" fill="#fafafa" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="85" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">2</text>

  <circle cx="200" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <circle cx="200" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <circle cx="300" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- Path labels -->
  <text x="130" y="186" font-size="10.5" fill="#446688" font-weight="bold">蓝：1→4→5 (L=2)</text>
  <text x="260" y="186" font-size="10.5" fill="#b85450" font-weight="bold">红：1→3→4→5 (L+1=3)</text>

  <!-- Divider -->
  <path d="M 40 206 L 520 206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Time computation tables ===== -->
  <text x="280" y="228" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">逐步模拟耗时 f(k)</text>

  <!-- Table header -->
  <rect x="40" y="242" width="480" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">路径</text>
  <text x="150" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">边</text>
  <text x="220" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">到达时刻</text>
  <text x="300" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">灯色</text>
  <text x="380" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">出发时刻</text>
  <text x="470" y="258" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">走边后</text>

  <!-- Row 1: shortest, edge 1→4 -->
  <rect x="40" y="266" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="282" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">最短</text>
  <text x="150" y="282" text-anchor="middle" font-size="10.5" fill="#333">1→4</text>
  <text x="220" y="282" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="300" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">绿</text>
  <text x="380" y="282" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="470" y="282" text-anchor="middle" font-size="10.5" fill="#333">3</text>

  <!-- Row 2: shortest, edge 4→5 -->
  <rect x="40" y="292" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="308" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">最短</text>
  <text x="150" y="308" text-anchor="middle" font-size="10.5" fill="#333">4→5</text>
  <text x="220" y="308" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="300" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">绿</text>
  <text x="380" y="308" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="470" y="308" text-anchor="middle" font-size="10.5" fill="#333">6</text>

  <!-- Result 1 -->
  <rect x="40" y="318" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">f(2) = 6 ← 最短时间</text>

  <!-- Row 3: second shortest, edge 1→3 -->
  <rect x="40" y="346" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="362" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第二短</text>
  <text x="150" y="362" text-anchor="middle" font-size="10.5" fill="#333">1→3</text>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="300" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">绿</text>
  <text x="380" y="362" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="470" y="362" text-anchor="middle" font-size="10.5" fill="#333">3</text>

  <!-- Row 4: second shortest, edge 3→4 -->
  <rect x="40" y="372" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="388" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第二短</text>
  <text x="150" y="388" text-anchor="middle" font-size="10.5" fill="#333">3→4</text>
  <text x="220" y="388" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="300" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">绿</text>
  <text x="380" y="388" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="470" y="388" text-anchor="middle" font-size="10.5" fill="#333">6</text>

  <!-- Row 5: second shortest, edge 4→5 (RED light!) -->
  <rect x="40" y="398" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="414" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第二短</text>
  <text x="150" y="414" text-anchor="middle" font-size="10.5" fill="#333">4→5</text>
  <text x="220" y="414" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <text x="300" y="414" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">红→等</text>
  <text x="380" y="414" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">10</text>
  <text x="470" y="414" text-anchor="middle" font-size="10.5" fill="#333">13</text>

  <!-- Result 2 -->
  <rect x="40" y="424" width="480" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">f(3) = 13 ← 第二短时间（到 4 时红灯，等 4 分钟到 10）</text>
</svg>
