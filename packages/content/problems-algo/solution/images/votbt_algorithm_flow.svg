<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：DFS 收集三元组 + sort + 按列分组</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">(col, row, val) 字典序恰好 = 题目要求的输出顺序</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: DFS -->
    <rect x="40" y="64" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① DFS 遍历，收集三元组</text>
    <text x="54" y="102" font-family="monospace" font-size="10" fill="#555">def dfs(node, row, col):</text>
    <text x="70" y="118" font-family="monospace" font-size="10" fill="#b85450">triples.append((col, row, node.val))</text>
    <text x="70" y="132" font-family="monospace" font-size="10" fill="#446688">dfs(left, row+1, col−1);  dfs(right, row+1, col+1)</text>

    <path d="M 260 136 L 260 150" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: sort -->
    <rect x="40" y="154" width="440" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="174" font-size="12" fill="#4a7a3a" font-weight="bold">② sort：按 (col, row, val) 字典序</text>
    <text x="54" y="192" font-family="monospace" font-size="10" fill="#4a7a3a">triples.sort()</text>
    <text x="54" y="208" font-size="10" fill="#888">col 升序（左→右列）→ row 升序（上→下）→ val 升序（同位按值）</text>

    <path d="M 260 224 L 260 238" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: group by col -->
    <rect x="40" y="242" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="262" font-size="12" fill="#d6a040" font-weight="bold">③ 按列分组</text>
    <text x="54" y="280" font-family="monospace" font-size="10" fill="#b85450">for col, row, val in triples:</text>
    <text x="70" y="296" font-family="monospace" font-size="10" fill="#d6a040">if col != cur_col: result.append([]); cur_col = col</text>
    <text x="70" y="310" font-family="monospace" font-size="10" fill="#4a7a3a">result[−1].append(val)</text>

    <path d="M 260 312 L 260 326" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: return -->
    <rect x="40" y="330" width="440" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="350" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
    <text x="110" y="350" font-family="monospace" font-size="10" fill="#555">return result;   // [[4],[2],[1,5,6],[3],[7]]</text>
    <text x="110" y="366" font-family="monospace" font-size="9" fill="#888">DFS O(n) + sort O(n log n) → 总 O(n log n)，空间 O(n)</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="396" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为什么 314 能免 sort 而 987 不能？</text>
  <text x="260" y="432" text-anchor="middle" font-size="10" fill="#666">314 第三键 = 左右顺序（BFS 天然给）；987 第三键 = val（遍历给不了）</text>
</svg>
