<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">多余的时间怎么凑？——奇偶自由，只留一个例外</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">异格时：t ≥ d 的每个整数秒都恰好可达</text>

  <!-- Panel A: +1 second -->
  <rect x="24" y="56" width="248" height="164" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 多 1 秒：一步拆成两步</text>

  <!-- mini grid 4x3, cell 30, origin (70,92) -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="92" x2="70" y2="182"/>
    <line x1="100" y1="92" x2="100" y2="182"/>
    <line x1="130" y1="92" x2="130" y2="182"/>
    <line x1="160" y1="92" x2="160" y2="182"/>
    <line x1="190" y1="92" x2="190" y2="182"/>
    <line x1="70" y1="92" x2="190" y2="92"/>
    <line x1="70" y1="122" x2="190" y2="122"/>
    <line x1="70" y1="152" x2="190" y2="152"/>
    <line x1="70" y1="182" x2="190" y2="182"/>
  </g>

  <circle cx="85" cy="167" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">S</text>
  <circle cx="115" cy="137" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="141" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">G</text>

  <!-- green direct diagonal: 1 sec -->
  <line x1="91" y1="161" x2="109" y2="143" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="76" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 秒</text>

  <!-- orange two-step: 2 sec -->
  <path d="M 91 174 L 116 174 L 116 147" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="103" y="168" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">横</text>
  <text x="123" y="162" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">竖</text>
  <text x="142" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2 秒</text>

  <text x="148" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">斜走 (0,0)→(1,1) 拆成「横 + 竖」两步，时长 +1</text>
  <text x="148" y="214" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（纯直线路径则把一步直走换成「侧移 + 斜回」）</text>

  <!-- Panel B: +2 seconds -->
  <rect x="288" y="56" width="248" height="164" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 多 2 秒：邻格踱步</text>

  <rect x="352" y="120" width="36" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="436" y="120" width="36" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">B</text>

  <path d="M 390 126 Q 412 106 434 126" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="412" y="112" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">去</text>
  <path d="M 434 150 Q 412 170 390 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="412" y="176" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">回</text>

  <text x="412" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">中途去邻格打个转再回来，+2 秒</text>
  <text x="412" y="214" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">可叠加任意次：+2、+4、+6 …</text>

  <!-- Panel C: the only exception -->
  <rect x="24" y="232" width="512" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 唯一例外：起点 = 终点 且 t = 1 → false</text>

  <rect x="56" y="268" width="36" height="36" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="290" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">S=F</text>
  <rect x="100" y="268" width="36" height="36" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <line x1="94" y1="286" x2="100" y2="286" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="152" y="284" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">第 1 秒必须离开</text>
  <text x="152" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 秒后回不来 ✗</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#4a7a3a">
    <text x="290" y="282" text-anchor="middle">✓ t = 0：原地不动</text>
    <text x="290" y="300" text-anchor="middle">✓ t = 2：去—回</text>
    <text x="290" y="318" text-anchor="middle">✓ t = 3：斜+横+竖 走三角形</text>
  </g>
  <g filter="url(#rough2)">
    <text x="470" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ t ≥ 2 都行</text>
    <text x="470" y="300" text-anchor="middle" font-size="10" fill="#666">再叠加踱步 +2</text>
    <text x="470" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">唯独 t = 1 ✗</text>
  </g>
</svg>
