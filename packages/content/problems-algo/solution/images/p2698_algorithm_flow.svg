<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2698b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：回溯分割的递归树（以 canSplit("1296", 0, 36) 为例）</text>

  <!-- Edges (under nodes) -->
  <path d="M300,74 L180,108" stroke="#888" stroke-width="1.6" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M180,136 L120,172" stroke="#888" stroke-width="1.6" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M180,136 L320,172" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M120,200 L75,237" stroke="#888" stroke-width="1.6" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M120,200 L185,237" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M320,200 L320,237" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr2698b)" filter="url(#rough2)"/>
  <path d="M75,265 L75,301" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr2698b)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <!-- Root -->
  <rect x="245" y="46" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">起始 t=36, s="1296"</text>

  <!-- "1" → t=35 -->
  <rect x="125" y="108" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">切"1" → t=35</text>

  <!-- "2" → t=33 -->
  <rect x="65" y="172" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">切"2" → t=33</text>

  <!-- "29" → t=6 (winning) -->
  <rect x="265" y="172" width="110" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">切"29" → t=6</text>

  <!-- "9" → t=24 -->
  <rect x="20" y="237" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="255" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">切"9" → t=24</text>

  <!-- "96" pruned -->
  <rect x="125" y="237" width="120" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="255" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">"96"=96&gt;33 剪枝</text>

  <!-- "6" → t=0 ✓ winning -->
  <rect x="265" y="237" width="110" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">切"6" → t=0 ✓</text>

  <!-- "6" dead end -->
  <rect x="20" y="301" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="319" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">终止 t=18≠0 ✗</text>

  <!-- Legend -->
  <rect x="400" y="237" width="150" height="92" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="256" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">图例</text>
  <rect x="412" y="266" width="16" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="275" font-size="10" fill="#4a7a3a">命中路径</text>
  <rect x="412" y="282" width="16" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="291" font-size="10" fill="#d6a040">剪枝(val&gt;t)</text>
  <rect x="412" y="298" width="16" height="10" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="307" font-size="10" fill="#b85450">死路回溯</text>
  <text x="475" y="322" text-anchor="middle" font-size="9" fill="#888">回溯 = 死路后回退尝试下一段</text>
</svg>
