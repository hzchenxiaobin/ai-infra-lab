<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：4×4 矩阵，从 (0,3) 走到出界</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">7 次 get 调用即定最左 1 列；红框=见 1 记列，蓝框=见 0 下移</text>

  <!-- ===== Left: 4x4 grid with step path ===== -->
  <text x="170" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">访问路径（角标为步序）</text>

  <!-- col labels -->
  <g font-size="10" fill="#888">
    <text x="108" y="92" text-anchor="middle">j=0</text>
    <text x="164" y="92" text-anchor="middle">j=1</text>
    <text x="220" y="92" text-anchor="middle">j=2</text>
    <text x="276" y="92" text-anchor="middle">j=3</text>
  </g>
  <!-- row labels -->
  <g font-size="10" fill="#888">
    <text x="48" y="142" text-anchor="middle">i=0</text>
    <text x="48" y="198" text-anchor="middle">i=1</text>
    <text x="48" y="254" text-anchor="middle">i=2</text>
    <text x="48" y="310" text-anchor="middle">i=3</text>
  </g>

  <!-- row0: 0 0 1 1 ; visited: (0,1)step3 blue, (0,2)step2 red, (0,3)step1 red -->
  <rect x="80" y="110" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="110" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="164" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="110" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="110" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="276" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row1: 0 1 1 1 ; visited: (1,0)step5 blue, (1,1)step4 red -->
  <rect x="80" y="166" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row2: 0 0 0 1 ; visited: (2,0)step6 blue -->
  <rect x="80" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="164" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="222" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row3: 0 0 0 0 ; visited: (3,0)step7 blue -->
  <rect x="80" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="164" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>

  <!-- step number badges on visited cells (top-left corner) -->
  <!-- step1 (0,3) -->
  <circle cx="260" cy="122" r="8" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <!-- step2 (0,2) -->
  <circle cx="204" cy="122" r="8" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="204" y="126" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <!-- step3 (0,1) -->
  <circle cx="148" cy="122" r="8" fill="#446688" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="148" y="126" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>
  <!-- step4 (1,1) -->
  <circle cx="148" cy="178" r="8" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="148" y="182" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>
  <!-- step5 (1,0) -->
  <circle cx="92" cy="178" r="8" fill="#446688" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="182" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>
  <!-- step6 (2,0) -->
  <circle cx="92" cy="234" r="8" fill="#446688" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="238" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">6</text>
  <!-- step7 (3,0) -->
  <circle cx="92" cy="290" r="8" fill="#446688" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="294" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">7</text>

  <!-- path arrows between steps -->
  <!-- 1->2 (0,3)->(0,2): left -->
  <path d="M 260 138 L 232 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 2->3 (0,2)->(0,1): left -->
  <path d="M 204 138 L 176 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 3->4 (0,1)->(1,1): down -->
  <path d="M 164 150 L 164 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 4->5 (1,1)->(1,0): left -->
  <path d="M 148 194 L 120 194" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 5->6 (1,0)->(2,0): down -->
  <path d="M 108 206 L 108 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 6->7 (2,0)->(3,0): down -->
  <path d="M 108 262 L 108 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 7 -> out -->
  <path d="M 108 318 L 108 342" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="136" y="336" font-size="9" fill="#4a7a3a">出界</text>

  <text x="170" y="362" text-anchor="middle" font-size="9" fill="#888">红框/红圈=见 1 记列并左移；蓝框=见 0 下移</text>

  <!-- ===== Right: step table ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步记录</text>

  <!-- table header -->
  <rect x="340" y="88" width="40" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="103" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">步</text>
  <rect x="380" y="88" width="74" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="417" y="103" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">(r,c)</text>
  <rect x="454" y="88" width="34" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="471" y="103" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">get</text>
  <rect x="488" y="88" width="86" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="531" y="103" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">动作 / ans</text>

  <!-- rows: y = 112 + k*26 -->
  <!-- step1 -->
  <rect x="340" y="112" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="127" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="380" y="112" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="127" text-anchor="middle" font-size="9" fill="#333">(0,3)</text>
  <rect x="454" y="112" width="34" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="127" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="488" y="112" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="127" text-anchor="middle" font-size="9" fill="#b85450">ans=3, c−−</text>
  <!-- step2 -->
  <rect x="340" y="138" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="153" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="380" y="138" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="153" text-anchor="middle" font-size="9" fill="#333">(0,2)</text>
  <rect x="454" y="138" width="34" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="153" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="488" y="138" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="153" text-anchor="middle" font-size="9" fill="#b85450">ans=2, c−−</text>
  <!-- step3 -->
  <rect x="340" y="164" width="40" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <rect x="380" y="164" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="179" text-anchor="middle" font-size="9" fill="#333">(0,1)</text>
  <rect x="454" y="164" width="34" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="179" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="488" y="164" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="179" text-anchor="middle" font-size="9" fill="#446688">r++</text>
  <!-- step4 -->
  <rect x="340" y="190" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="205" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <rect x="380" y="190" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="205" text-anchor="middle" font-size="9" fill="#333">(1,1)</text>
  <rect x="454" y="190" width="34" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="205" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="488" y="190" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="205" text-anchor="middle" font-size="9" fill="#b85450">ans=1, c−−</text>
  <!-- step5 -->
  <rect x="340" y="216" width="40" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="231" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">5</text>
  <rect x="380" y="216" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="231" text-anchor="middle" font-size="9" fill="#333">(1,0)</text>
  <rect x="454" y="216" width="34" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="231" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="488" y="216" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="231" text-anchor="middle" font-size="9" fill="#446688">r++</text>
  <!-- step6 -->
  <rect x="340" y="242" width="40" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="257" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6</text>
  <rect x="380" y="242" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="257" text-anchor="middle" font-size="9" fill="#333">(2,0)</text>
  <rect x="454" y="242" width="34" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="257" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="488" y="242" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="257" text-anchor="middle" font-size="9" fill="#446688">r++</text>
  <!-- step7 -->
  <rect x="340" y="268" width="40" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="283" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">7</text>
  <rect x="380" y="268" width="74" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="283" text-anchor="middle" font-size="9" fill="#333">(3,0)</text>
  <rect x="454" y="268" width="34" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="471" y="283" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="488" y="268" width="86" height="22" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="531" y="283" text-anchor="middle" font-size="9" fill="#446688">r++</text>
  <!-- end row -->
  <rect x="340" y="294" width="234" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="457" y="309" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(4,0) 出界 → 结束，共 7 次 get</text>

  <!-- conclusion box -->
  <rect x="340" y="324" width="234" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 ans = 1</text>
  <text x="457" y="360" text-anchor="middle" font-size="9" fill="#888">第 1 列是最左含 1 的列</text>

  <!-- ===== Bottom: call-count comparison ===== -->
  <rect x="30" y="384" width="560" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">get 调用次数对比（rows=4, cols=4）</text>
  <text x="46" y="426" font-size="10" fill="#555">• 暴力全扫：4×4 = 16 次；逐行二分：4×⌈log₂4⌉ = 8 次；右上角走法：7 次（= rows+cols−1）。</text>
  <text x="46" y="442" font-size="10" fill="#555">• 规模放大到 100×100：暴力 10⁴（超 1000 上限）、二分 700、走法 199 —— 走法恒为最优 O(rows+cols)。</text>
</svg>
