<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- Step 1: init set -->
  <rect x="140" y="50" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① S = set(nums)  把初始位置全加入集合</text>

  <!-- arrow -->
  <path d="M260,98 L260,124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: loop decision -->
  <polygon points="260,128 360,178 260,228 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">还有操作</text>
  <text x="260" y="192" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">(moveFrom, moveTo) ?</text>

  <!-- yes branch left -->
  <text x="120" y="178" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M160,178 L100,178 L100,250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- erase + insert box -->
  <rect x="20" y="252" width="160" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">S.erase(moveFrom[i])</text>
  <text x="100" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">S.insert(moveTo[i])</text>
  <text x="100" y="312" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">源消失，目的加入</text>

  <!-- loop back arrow: from box up to diamond -->
  <path d="M100,252 L100,200 L160,200" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- no branch right -->
  <text x="395" y="178" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M360,178 L430,178 L430,250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3: sort & return -->
  <rect x="340" y="252" width="170" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 排序集合元素</text>
  <text x="425" y="300" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回升序列表</text>

  <!-- arrow -->
  <path d="M425,320 L425,352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="335" y="354" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="380" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出 [5, 6, 8, 9]</text>

  <!-- note bottom -->
  <text x="120" y="358" font-size="11" fill="#888" filter="url(#rough2)">erase 再 insert 顺序安全：</text>
  <text x="120" y="374" font-size="11" fill="#888" filter="url(#rough2)">from==to 时删后补回，仍存在</text>
</svg>
