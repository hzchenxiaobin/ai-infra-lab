<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">1650 算法流程：双指针走相交链表</text>

  <!-- start -->
  <rect x="170" y="52" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="20" filter="url(#rough2)"/>
  <text x="270" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">初始化：a = p, b = q</text>

  <path d="M 270 92 L 270 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,126 372,184 270,242 168,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a == b ?</text>

  <!-- Yes -> return -->
  <path d="M 372 184 L 416 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="418" y="162" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">return a</text>
  <text x="472" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">即 LCA</text>

  <!-- No -> process -->
  <path d="M 270 242 L 270 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="110" y="276" width="320" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a = (a == null) ? q : a.parent</text>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b = (b == null) ? p : b.parent</text>

  <!-- loop back -->
  <path d="M 110 311 L 60 311 L 60 184 L 168 184" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="248" font-size="11" fill="#446688" filter="url(#rough2)">循环</text>

  <!-- note -->
  <rect x="70" y="376" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不变式：两指针各走 |p链|+|q链| 步</text>
  <text x="270" y="412" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">必在公共后缀起点（LCA）同步相遇</text>
</svg>
