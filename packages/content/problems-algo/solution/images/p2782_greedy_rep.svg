<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心代表元法流程</text>

  <!-- reps list -->
  <text x="20" y="58" font-size="11" fill="#888">代表元列表 reps：</text>
  <rect x="130" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="180" y="62" font-size="10" fill="#888">← 初始：元素 0 是第一个代表</text>

  <!-- diamond: for each i from 1 to n-1 -->
  <polygon points="270,90 360,130 270,170 180,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i = 1 … n−1</text>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#888">遍历每个元素</text>

  <!-- arrow down -->
  <line x1="270" y1="170" x2="270" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop: for each rep r in reps -->
  <rect x="120" y="192" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="11.5" fill="#333">对每个代表 r ∈ reps：</text>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#446688">询问 haveSameCategory(i, r)</text>

  <!-- arrow down -->
  <line x1="270" y1="236" x2="270" y2="252" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: same category? -->
  <polygon points="270,256 360,296 270,336 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">存在匹配 r？</text>
  <text x="270" y="308" text-anchor="middle" font-size="10" fill="#888">haveSameCategory = True</text>

  <!-- left branch: yes → skip, next i -->
  <path d="M180,296 L80,296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="290" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="282" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="301" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跳过</text>
  <text x="50" y="326" text-anchor="middle" font-size="9.5" fill="#4a7a3a">已有同类</text>
  <text x="50" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a">→ 下一个 i</text>

  <!-- right branch: no → add to reps -->
  <path d="M360,296 L430,296" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="290" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="282" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="301" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">加入 reps</text>
  <text x="475" y="326" text-anchor="middle" font-size="9.5" fill="#b85450">新类别！</text>
  <text x="475" y="338" text-anchor="middle" font-size="9.5" fill="#b85450">reps.append(i)</text>

  <!-- result -->
  <rect x="30" y="360" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果 = len(reps) = 唯一类别数</text>
</svg>
