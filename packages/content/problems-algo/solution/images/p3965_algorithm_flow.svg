<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="230" y="14" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="32" text-anchor="middle" font-size="12.5" fill="#33475e" filter="url(#rough2)">开始</text>

  <path d="M 280 42 L 280 58" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 ① -->
  <rect x="170" y="58" width="220" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#33475e" filter="url(#rough2)">① 建 children 邻接表（父→子）</text>

  <path d="M 280 90 L 280 106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 ② -->
  <rect x="160" y="106" width="240" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#33475e" filter="url(#rough2)">② 从根 0 BFS 得 order（父先于子）</text>

  <path d="M 280 138 L 280 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 ③ -->
  <rect x="160" y="154" width="240" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#33475e" filter="url(#rough2)">③ 逆序遍历 order：u = order[i]</text>

  <path d="M 280 186 L 280 197" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判断：叶子？ -->
  <polygon points="280,196 372,232 280,268 188,232" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12.5" fill="#33475e" filter="url(#rough2)">u 是叶子？</text>

  <!-- 是 → 叶子分支 -->
  <path d="M 372 232 L 396 232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="384" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="398" y="214" width="138" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="467" y="236" text-anchor="middle" font-size="11.5" fill="#3a5f30" filter="url(#rough2)">f[u] = baseTime[u]</text>

  <!-- 否 → 非叶子分支 -->
  <path d="M 280 268 L 280 290" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="292" y="284" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="158" y="290" width="244" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#8a5a00" filter="url(#rough2)">earliest = min(孩子f)，latest = max(孩子f)</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#8a5a00" filter="url(#rough2)">f[u] = latest + (latest − earliest) + bt</text>

  <!-- 汇合 -->
  <path d="M 467 250 L 467 366 L 288 366" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 280 344 L 280 360" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <circle cx="280" cy="366" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- 循环回边 -->
  <path d="M 268 366 L 100 366 L 100 170 L 160 170" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="168" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">未处理完 → 下一个 u</text>

  <!-- 结束 -->
  <path d="M 280 366 L 280 380" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="292" y="377" font-size="10.5" fill="#666" filter="url(#rough2)">全部处理完</text>
  <rect x="195" y="380" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a35" filter="url(#rough2)">④ 返回 finish[0]</text>
</svg>
