<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">距离 K：树加父指针 → 无向图，从 target 做 BFS</text>

  <!-- ===== 左面板：原树（只能向下） ===== -->
  <text x="190" y="52" text-anchor="middle" font-size="12" fill="#888">原树：边只能向下走</text>

  <!-- 边（有向，向下） -->
  <line x1="190" y1="70" x2="135" y2="135" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="190" y1="70" x2="245" y2="135" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="135" y1="135" x2="105" y2="200" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="135" y1="135" x2="165" y2="200" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="245" y1="135" x2="225" y2="200" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="245" y1="135" x2="285" y2="200" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="200" x2="135" y2="265" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="200" x2="195" y2="265" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="190" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="75" text-anchor="middle" font-size="12" fill="#333">3</text>
  <circle cx="135" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <circle cx="245" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <circle cx="105" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="205" text-anchor="middle" font-size="11" fill="#333">6</text>
  <circle cx="165" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="205" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="225" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225" y="205" text-anchor="middle" font-size="11" fill="#333">0</text>
  <circle cx="285" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="205" text-anchor="middle" font-size="11" fill="#333">8</text>
  <circle cx="135" cy="265" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="270" text-anchor="middle" font-size="11" fill="#333">7</text>
  <circle cx="195" cy="265" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="270" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- target 标记 -->
  <text x="135" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-style="italic">target</text>

  <!-- ===== 中间箭头 ===== -->
  <path d="M 330 150 L 410 150" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="370" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">DFS</text>
  <text x="370" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a">加父指针</text>

  <!-- ===== 右面板：无向图 + BFS 分层 ===== -->
  <text x="590" y="52" text-anchor="middle" font-size="12" fill="#888">无向图：可上可下，BFS 逐层着色</text>

  <!-- 无向边（无箭头） -->
  <line x1="590" y1="70" x2="535" y2="135" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="590" y1="70" x2="645" y2="135" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="535" y1="135" x2="505" y2="200" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="535" y1="135" x2="565" y2="200" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="645" y1="135" x2="625" y2="200" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="645" y1="135" x2="685" y2="200" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="565" y1="200" x2="535" y2="265" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="565" y1="200" x2="595" y2="265" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 节点（按层着色） -->
  <!-- 3: layer1 绿 -->
  <circle cx="590" cy="70" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="75" text-anchor="middle" font-size="12" fill="#333">3</text>
  <!-- 5: layer0 红 target -->
  <circle cx="535" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="535" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <!-- 1: layer2 橙（答案） -->
  <circle cx="645" cy="135" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="645" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- 6: layer1 绿 -->
  <circle cx="505" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="205" text-anchor="middle" font-size="11" fill="#333">6</text>
  <!-- 2: layer1 绿 -->
  <circle cx="565" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="205" text-anchor="middle" font-size="11" fill="#333">2</text>
  <!-- 0: layer3 灰 -->
  <circle cx="625" cy="200" r="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="625" y="205" text-anchor="middle" font-size="11" fill="#888">0</text>
  <!-- 8: layer3 灰 -->
  <circle cx="685" cy="200" r="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="685" y="205" text-anchor="middle" font-size="11" fill="#888">8</text>
  <!-- 7: layer2 橙（答案） -->
  <circle cx="535" cy="265" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="535" y="270" text-anchor="middle" font-size="11" fill="#333">7</text>
  <!-- 4: layer2 橙（答案） -->
  <circle cx="595" cy="265" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="595" y="270" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- ===== 图例 / 说明框 ===== -->
  <rect x="40" y="300" width="700" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="390" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">BFS 从 target=5 逐层扩展（k=2）</text>

  <!-- 图例条目 -->
  <circle cx="70" cy="348" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="352" font-size="11" fill="#555">层 0：{5} = target（起点）</text>

  <circle cx="70" cy="372" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="376" font-size="11" fill="#555">层 1：{3, 6, 2}（父 + 左 + 右）</text>

  <circle cx="70" cy="396" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="400" font-size="11" fill="#555">层 2：{1, 7, 4} ← k=2 的答案</text>

  <circle cx="400" cy="348" r="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="418" y="352" font-size="11" fill="#555">层 3：{0, 8}（超过 k，不收集）</text>

  <text x="400" y="378" font-size="11" fill="#555">每个节点最多 3 个邻居：</text>
  <text x="410" y="396" font-size="11" fill="#888">left（左孩子）/ right（右孩子）/ parent（父）</text>
  <text x="410" y="414" font-size="11" fill="#888">visited 集合防止来回往返</text>
</svg>
