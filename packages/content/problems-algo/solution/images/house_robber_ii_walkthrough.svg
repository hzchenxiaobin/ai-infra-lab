<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[1,2,3,1] 两段线性 DP</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">情况 A 在 [1,2,3] 得 4；情况 B 在 [2,3,1] 得 3 → max=4</text>

  <!-- ===== Case A: [1,2,3] ===== -->
  <rect x="30" y="58" width="480" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="50" y="80" font-size="12" fill="#446688" font-weight="bold">情况 A：nums[0..2] = [1, 2, 3]</text>

  <g font-size="11">
    <!-- nums row -->
    <text x="50" y="110" font-size="10" fill="#446688" font-weight="bold">nums:</text>
    <rect x="95" y="96" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="120" y="114" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="96" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="195" y="114" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="245" y="96" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="270" y="114" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <!-- f row -->
    <text x="50" y="150" font-size="10" fill="#b85450" font-weight="bold">f(i):</text>
    <rect x="95" y="136" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="120" y="154" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="120" y="176" text-anchor="middle" font-size="8" fill="#446688">初值</text>
    <rect x="170" y="136" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="195" y="154" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="195" y="176" text-anchor="middle" font-size="8" fill="#446688">max(1,2)</text>
    <rect x="245" y="136" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="270" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="270" y="176" text-anchor="middle" font-size="7" fill="#4a7a3a">max(2, 1+3)</text>

    <!-- dep arrows -->
    <path d="M 220 149 L 243 149" stroke="#4a7a3a" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 120 164 Q 195 186 270 164" stroke="#4a7a3a" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <rect x="360" y="140" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="161" text-anchor="middle" font-family="monospace" font-size="12" fill="#4a7a3a" font-weight="bold">robA = 4</text>
  <text x="425" y="186" text-anchor="middle" font-size="9" fill="#888">偷原下标 0+2 (1+3)</text>

  <!-- ===== Case B: [2,3,1] ===== -->
  <rect x="30" y="210" width="480" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="50" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">情况 B：nums[1..3] = [2, 3, 1]</text>

  <g font-size="11">
    <text x="50" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">nums:</text>
    <rect x="95" y="248" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="120" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="170" y="248" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="195" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="245" y="248" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="270" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="50" y="302" font-size="10" fill="#b85450" font-weight="bold">f(i):</text>
    <rect x="95" y="288" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="120" y="306" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="120" y="328" text-anchor="middle" font-size="8" fill="#4a7a3a">初值</text>
    <rect x="170" y="288" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="195" y="306" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="195" y="328" text-anchor="middle" font-size="8" fill="#4a7a3a">max(2,3)</text>
    <rect x="245" y="288" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="270" y="306" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="270" y="328" text-anchor="middle" font-size="7" fill="#d6a040">max(3, 2+1)</text>

    <path d="M 220 301 L 243 301" stroke="#d6a040" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 120 316 Q 195 338 270 316" stroke="#d6a040" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <rect x="360" y="292" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="313" text-anchor="middle" font-family="monospace" font-size="12" fill="#d6a040" font-weight="bold">robB = 3</text>
  <text x="425" y="338" text-anchor="middle" font-size="9" fill="#888">偷原下标 1 (3)</text>

  <!-- ===== Final answer ===== -->
  <rect x="30" y="362" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终结果：ans = max(robA, robB) = max(4, 3) = 4</text>
  <text x="270" y="400" text-anchor="middle" font-size="10" fill="#555">最优方案：情况 A，偷原数组第 0、2 家（1 + 3 = 4）</text>
</svg>
