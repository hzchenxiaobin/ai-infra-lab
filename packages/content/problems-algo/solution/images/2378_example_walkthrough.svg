<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：选 {0-1(5), 2-3(6)}，权和 = 11</text>

  <!-- ===== edges drawn first (under nodes) ===== -->
  <!-- 0-1 chosen (green) -->
  <line x1="280" y1="78" x2="105" y2="195" stroke="#4a7a3a" stroke-width="3.2" filter="url(#rough2)"/>
  <!-- 0-2 not chosen (gray) -->
  <line x1="280" y1="78" x2="410" y2="195" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- 2-3 chosen (green) -->
  <line x1="410" y1="215" x2="335" y2="322" stroke="#4a7a3a" stroke-width="3.2" filter="url(#rough2)"/>
  <!-- 2-4 not chosen (gray) -->
  <line x1="410" y1="215" x2="490" y2="322" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== edge weight labels ===== -->
  <!-- 0-1 : 5 ✓ -->
  <rect x="158" y="124" width="40" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="178" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <!-- 0-2 : 10 -->
  <rect x="335" y="124" width="34" height="20" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">10</text>
  <!-- 2-3 : 6 ✓ -->
  <rect x="350" y="252" width="40" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 ✓</text>
  <!-- 2-4 : 4 -->
  <rect x="448" y="252" width="34" height="20" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="465" y="266" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>

  <!-- ===== nodes ===== -->
  <!-- node 0 (root, answer) -->
  <circle cx="280" cy="78" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- node 1 -->
  <circle cx="105" cy="195" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- node 2 -->
  <circle cx="410" cy="195" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- node 3 -->
  <circle cx="335" cy="322" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- node 4 -->
  <circle cx="490" cy="322" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- ===== dp annotations (dp0 | dp1) ===== -->
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">root: dp₀=11 ★（dp₁ 不用）</text>

  <rect x="40" y="222" width="88" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp₀=0 | dp₁=5</text>

  <rect x="438" y="158" width="98" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="487" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp₀=6 | dp₁=10</text>

  <rect x="268" y="350" width="92" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="367" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp₀=0 | dp₁=6</text>

  <rect x="446" y="350" width="92" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="492" y="367" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp₀=0 | dp₁=4</text>

  <!-- caption -->
  <text x="170" y="300" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 选 0-1(5)：端点 0,1 占用</text>
  <text x="170" y="316" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 选 2-3(6)：端点 2,3 占用</text>
  <text x="170" y="332" font-size="10" fill="#888" filter="url(#rough2)">四端点互异 → 合法匹配</text>
</svg>
