<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程（在答案 x 上二分）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="120" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: L=lcm(a,b), lo=1, hi=n·min(a,b)</text>

  <!-- arrow down -->
  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo < hi? -->
  <polygon points="270,106 376,154 270,202 164,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">lo &lt; hi ?</text>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#666">(区间未收敛)</text>

  <!-- No branch -> end -->
  <path d="M 376 154 L 452 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="146" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="154" rx="44" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="150" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="486" y="164" text-anchor="middle" font-size="11" fill="#333">lo % MOD</text>

  <!-- Yes branch down -->
  <path d="M 270 202 L 270 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="216" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="140" y="224" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#333">mid = lo + (hi − lo) / 2  （候选答案）</text>

  <!-- arrow down -->
  <path d="M 270 258 L 270 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute cnt -->
  <rect x="120" y="280" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="12" fill="#333">cnt = ⌊mid/a⌋ + ⌊mid/b⌋ − ⌊mid/L⌋</text>
  <text x="270" y="314" text-anchor="middle" font-size="10" fill="#888">（mid 以内神奇数个数，容斥计数 O(1)）</text>

  <!-- arrow down -->
  <path d="M 270 322 L 270 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cnt >= n? -->
  <polygon points="270,344 380,392 270,440 160,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" fill="#333">cnt &gt;= n ?</text>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#666">(mid 够第 n 个吗)</text>

  <!-- Yes (enough) -> try smaller -->
  <path d="M 160 392 L 100 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="384" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="372" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="390" text-anchor="middle" font-size="11" fill="#333">答案偏大</text>
  <text x="56" y="406" text-anchor="middle" font-size="11" fill="#555">hi = mid</text>

  <!-- No (not enough) -> try bigger -->
  <path d="M 380 392 L 440 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="384" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="442" y="372" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="390" text-anchor="middle" font-size="11" fill="#333">答案偏小</text>
  <text x="484" y="406" text-anchor="middle" font-size="11" fill="#555">lo = mid + 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 56 372 L 56 154 L 164 154" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="260" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 46 260)">继续二分</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 484 372 L 484 154 L 376 154" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#888">关键：f(x) 单调不减 → 满足二段性；每次 O(1) 容斥计数，共 O(log(n·min)) 次</text>
</svg>
