<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">公交路线 BFS：站点 = 路线间的换乘枢纽</text>

  <!-- ===== Route 0 ===== -->
  <text x="50" y="82" font-size="11" fill="#446688" font-weight="bold">路线 0</text>

  <rect x="90" y="64" width="50" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="115" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">起点</text>

  <rect x="155" y="64" width="50" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="220" y="64" width="50" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="85" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <text x="245" y="110" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">共享站</text>

  <!-- ===== Route 1 ===== -->
  <text x="50" y="152" font-size="11" fill="#446688" font-weight="bold">路线 1</text>

  <rect x="90" y="134" width="50" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="155" y="134" width="50" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="155" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="180" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">终点</text>

  <rect x="220" y="134" width="50" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="155" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <text x="245" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">共享站</text>

  <!-- Transfer arrow between the two stop-7 boxes -->
  <path d="M 245 96 L 245 134" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="118" font-size="11" fill="#d6a040" font-weight="bold">换乘</text>

  <!-- Divider -->
  <line x1="30" y1="202" x2="530" y2="202" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== stop → routes mapping ===== -->
  <text x="150" y="224" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">stop → routes 映射</text>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#888">一次哈希查询得全部可换乘路线</text>

  <!-- Mapping rows -->
  <g font-size="12">
    <rect x="60" y="250" width="60" height="26" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="90" y="268" text-anchor="middle" fill="#333">stop 1</text>
    <text x="140" y="268" font-size="12" fill="#888">→</text>
    <rect x="160" y="250" width="60" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="190" y="268" text-anchor="middle" fill="#4a7a3a">{0}</text>

    <rect x="60" y="282" width="60" height="26" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="90" y="300" text-anchor="middle" fill="#333">stop 7</text>
    <text x="140" y="300" font-size="12" fill="#888">→</text>
    <rect x="160" y="282" width="60" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="190" y="300" text-anchor="middle" fill="#d6a040" font-weight="bold">{0,1}</text>
    <text x="232" y="300" font-size="10" fill="#d6a040" font-weight="bold">← 枢纽</text>

    <rect x="60" y="314" width="60" height="26" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="90" y="332" text-anchor="middle" fill="#333">stop 6</text>
    <text x="140" y="332" font-size="12" fill="#888">→</text>
    <rect x="160" y="314" width="60" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="190" y="332" text-anchor="middle" fill="#b85450">{1}</text>
  </g>

  <!-- ===== Analogy box ===== -->
  <rect x="300" y="250" width="230" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="272" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">与 127 单词接龙同构</text>
  <text x="415" y="292" text-anchor="middle" font-size="10" fill="#666">127: word → pattern → words</text>
  <text x="415" y="308" text-anchor="middle" font-size="10" fill="#666">815: route → stop → routes</text>
  <text x="415" y="326" text-anchor="middle" font-size="10" fill="#888">站点 ≈ 通配符模式</text>

  <!-- ===== Bottom note ===== -->
  <rect x="60" y="370" width="440" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#444">BFS 在「路线」上搜索，每层 = 多坐一趟公交</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">路线数 ≤ 500，远小于站点总数 ≤ 10^5</text>
  <text x="280" y="425" text-anchor="middle" font-size="10" fill="#888">搜索空间大幅压缩</text>
</svg>
