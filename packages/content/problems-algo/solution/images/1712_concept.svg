<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：两个分界点 i、j 切三段，前缀和把不等式线性化</text>

  <!-- ===== Three subarrays ===== -->
  <text x="50" y="62" font-size="11" fill="#888" filter="url(#rough2)">数组 nums（非负 → 前缀和 P 单调不减）</text>

  <!-- left block -->
  <g filter="url(#rough2)">
    <rect x="50" y="72" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="100" y="90" text-anchor="middle" font-size="11" fill="#446688">left</text>
    <text x="100" y="106" text-anchor="middle" font-size="10" fill="#888">nums[0..i-1]</text>
  </g>
  <!-- divider i -->
  <path d="M 154 66 L 154 124" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="154" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">分界 i</text>

  <!-- mid block -->
  <g filter="url(#rough2)">
    <rect x="160" y="72" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="220" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a">mid</text>
    <text x="220" y="106" text-anchor="middle" font-size="10" fill="#888">nums[i..j-1]</text>
  </g>
  <!-- divider j -->
  <path d="M 284 66 L 284 124" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="284" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">分界 j</text>

  <!-- right block -->
  <g filter="url(#rough2)">
    <rect x="290" y="72" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="350" y="90" text-anchor="middle" font-size="11" fill="#d6a040">right</text>
    <text x="350" y="106" text-anchor="middle" font-size="10" fill="#888">nums[j..n-1]</text>
  </g>

  <text x="418" y="98" font-size="10" fill="#aaa" filter="url(#rough2)">三段非空 →</text>
  <text x="418" y="112" font-size="10" fill="#aaa" filter="url(#rough2)">1 ≤ i ≤ n−2</text>

  <!-- ===== Sums under each block ===== -->
  <path d="M 100 120 L 100 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 120 L 220 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 120 L 350 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="48" y="142" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="100" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leftSum = P[i]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="158" y="142" width="124" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="220" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">midSum = P[j]−P[i]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="288" y="142" width="124" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="350" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rightSum = P[n]−P[j]</text>
  </g>

  <!-- ===== Two inequalities ===== -->
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">好分割条件：leftSum ≤ midSum ≤ rightSum</text>

  <!-- inequality 1 -->
  <rect x="40" y="206" width="235" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="226" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">① leftSum ≤ midSum</text>
  <line x1="52" y1="232" x2="263" y2="232" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="250" font-size="10" fill="#555" filter="url(#rough2)">P[i] ≤ P[j] − P[i]</text>
  <text x="52" y="266" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ P[j] ≥ 2·P[i]</text>
  <text x="52" y="278" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j 的下界 jmin（首个满足）</text>

  <!-- inequality 2 -->
  <rect x="285" y="206" width="235" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="297" y="226" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② midSum ≤ rightSum</text>
  <line x1="297" y1="232" x2="508" y2="232" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="297" y="250" font-size="10" fill="#555" filter="url(#rough2)">P[j]−P[i] ≤ P[n]−P[j]</text>
  <text x="297" y="266" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 2·P[j] ≤ P[n]+P[i]</text>
  <text x="297" y="278" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j 的上界 jmax（末个满足）</text>

  <!-- ===== For fixed i, j in a window ===== -->
  <rect x="40" y="298" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="318" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">固定 i：合法 j 落在区间 [jmin, jmax]，方案数 = jmax − jmin + 1</text>
  <text x="52" y="336" font-size="10" fill="#555" filter="url(#rough2)">P 单调不减 → 两个界都可用二分 / 双指针在 P 上定位</text>
  <text x="52" y="350" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">对 i 求和即总方案数</text>

  <!-- ===== Monotonicity → two pointers ===== -->
  <rect x="40" y="366" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="386" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">单调性是 O(n) 的根源：</text>
  <text x="52" y="402" font-size="10" fill="#555" filter="url(#rough2)">i 增大 → P[i] 增大 → 2·P[i] 增大 → jmin 右移； (P[n]+P[i])/2 增大 → jmax 右移</text>
  <text x="52" y="418" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">jmin、jmax 单调不减 → 双指针各扫一遍，总 O(n)</text>

  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">非负 → 前缀和单调 → 不等式变成 P 上的区间 → 双指针线性扫描</text>
  <text x="280" y="472" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">（若允许负数则单调性破坏，双指针失效，只能二分 O(n log n)）</text>
</svg>
