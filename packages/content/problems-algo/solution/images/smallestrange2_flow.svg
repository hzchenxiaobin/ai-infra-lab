<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举分割点求最小分数</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: sort(nums); ans = nums[n−1] − nums[0]</text>

  <path d="M 270 76 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init i -->
  <rect x="190" y="98" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0</text>

  <path d="M 270 130 L 270 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n-1? -->
  <polygon points="270,154 376,188 270,222 164,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12" fill="#333">i &lt; n − 1 ?</text>
  <text x="270" y="200" text-anchor="middle" font-size="10" fill="#666">(还有分割点)</text>

  <!-- No -> end -->
  <path d="M 376 188 L 420 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="180" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="472" cy="188" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="192" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes -> down -->
  <path d="M 270 222 L 270 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="238" font-size="11" fill="#82b366">是</text>

  <!-- Compute high -->
  <rect x="130" y="244" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">high = max(nums[i] + k, nums[n−1] − k)</text>

  <path d="M 270 280 L 270 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute low -->
  <rect x="130" y="298" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">low = min(nums[0] + k, nums[i+1] − k)</text>

  <path d="M 270 334 L 270 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update ans -->
  <rect x="130" y="352" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = min(ans, high − low)</text>

  <path d="M 270 388 L 270 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="210" y="406" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>

  <!-- loop-back -->
  <path d="M 270 438 L 270 452 L 60 452 L 60 188 L 164 188" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="300" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 300)">下一个分割点</text>

  <!-- summary -->
  <text x="270" y="470" text-anchor="middle" font-size="11" fill="#888">排序 O(n log n) + 扫描 O(n) → 总 O(n log n)</text>
</svg>
