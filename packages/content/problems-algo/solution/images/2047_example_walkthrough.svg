<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算："!this  1-s b8d!"</text>

  <!-- Token 1: !this -->
  <circle cx="30" cy="65" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="30" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- char boxes: ! t h i s -->
  <rect x="62" y="50" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">!</text>

  <rect x="91" y="50" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">t</text>

  <rect x="120" y="50" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">h</text>

  <rect x="149" y="50" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i</text>

  <rect x="178" y="50" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s</text>

  <!-- arrow to reason -->
  <path d="M 212 65 L 238 65" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- reason box -->
  <rect x="242" y="52" width="290" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="387" y="69" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">规则3: 标点 ! 在首位，不在末尾</text>

  <!-- Token 2: 1-s -->
  <circle cx="30" cy="115" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="30" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="62" y="100" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="91" y="100" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-</text>

  <rect x="120" y="100" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s</text>

  <path d="M 154 115 L 238 115" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="242" y="102" width="290" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="387" y="119" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">规则1: 含数字 1</text>

  <!-- Token 3: b8d! -->
  <circle cx="30" cy="165" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="30" y="169" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="62" y="150" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <rect x="91" y="150" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="120" y="150" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <rect x="149" y="150" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">!</text>

  <path d="M 183 165 L 238 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="242" y="152" width="290" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="387" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">规则1: 含数字 8</text>

  <!-- Result -->
  <rect x="140" y="200" width="280" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="221" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 个 token 全部无效 → 返回 0</text>

  <!-- Note: Example 1 comparison -->
  <rect x="40" y="248" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">对比示例 1："cat and  dog"</text>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 个 token 全部通过三条规则 → 返回 3</text>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（每个 token 仅含小写字母，无数字、无连字符、无标点）</text>
</svg>
