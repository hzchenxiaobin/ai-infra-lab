<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">II 版核心：任意查询都从根 0「中转」</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">圆内：单位号 · 绿字：fromRoot（1 个 0 型 = 多少个该型）· 红框：边权 ×w · 橙箭头：查询 (6,1) 的行走方向</text>

  <!-- undirected edges -->
  <line x1="263" y1="104" x2="137" y2="166" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="114" x2="280" y2="156" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="297" y1="104" x2="423" y2="166" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="266" y1="188" x2="209" y2="244" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="290" y1="191" x2="320" y2="241" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="440" y1="194" x2="440" y2="238" stroke="#9aa7b5" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- query path 6 -> 3 -> 0 -> 1 (orange, directed) -->
  <line x1="440" y1="238" x2="440" y2="200" stroke="#d6a040" stroke-width="3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <line x1="423" y1="166" x2="301" y2="108" stroke="#d6a040" stroke-width="3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <line x1="263" y1="104" x2="143" y2="162" stroke="#d6a040" stroke-width="3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- edge weight labels -->
  <rect x="185" y="126" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×2</text>
  <rect x="265" y="126" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×6</text>
  <rect x="345" y="126" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×8</text>
  <rect x="222" y="207" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="237" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×2</text>
  <rect x="290" y="207" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="305" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×4</text>
  <rect x="405" y="207" width="30" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×3</text>

  <!-- reverse-walk annotations -->
  <text x="468" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">÷3</text>
  <text x="360" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">÷8</text>

  <!-- root -->
  <circle cx="280" cy="95" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">0</text>
  <text x="280" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=1</text>

  <!-- level 1 -->
  <circle cx="120" cy="175" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=2</text>

  <circle cx="280" cy="175" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=6</text>

  <circle cx="440" cy="175" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="440" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=8</text>

  <!-- level 2 -->
  <circle cx="195" cy="257" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="195" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=12</text>

  <circle cx="330" cy="257" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="330" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=24</text>

  <circle cx="440" cy="257" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="440" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">=24</text>

  <!-- query endpoints -->
  <text x="470" y="262" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="90" y="180" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#b85450" filter="url(#rough2)">b</text>

  <!-- callout -->
  <rect x="45" y="298" width="470" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">查询 (6,1)：路径 6 → 3 → 0 → 1，沿途 ÷3、÷8、×2</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">= fromRoot[1] ÷ fromRoot[6] = 2/24 = 1/12 ≡ 83333334 (mod 10⁹+7)</text>

  <!-- formula -->
  <rect x="45" y="352" width="470" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一般地：answer(a,b) = fromRoot[b] × fromRoot[a]⁻¹（逆元：x⁻¹ = x^(M−2)）</text>
</svg>
