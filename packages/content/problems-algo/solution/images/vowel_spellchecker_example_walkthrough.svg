<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：wordlist = ["KiTe","kite","hare","Hare"]</text>

  <!-- ===== 建表结果 ===== -->
  <text x="30" y="54" font-size="12" fill="#444" font-weight="bold">建表（按出现顺序，②③ 只留首次）：</text>

  <!-- exact 表 -->
  <text x="30" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">① exact 表</text>
  <rect x="100" y="64" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="128" y="80" text-anchor="middle" font-size="10" fill="#333">KiTe</text>
  <rect x="160" y="64" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="182" y="80" text-anchor="middle" font-size="10" fill="#333">kite</text>
  <rect x="208" y="64" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="10" fill="#333">hare</text>
  <rect x="256" y="64" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="278" y="80" text-anchor="middle" font-size="10" fill="#333">Hare</text>
  <text x="310" y="80" font-size="10" fill="#888">键=原串，值=原串</text>

  <!-- case 表 -->
  <text x="30" y="110" font-size="11" fill="#d6a040" font-weight="bold">② case 表</text>
  <text x="100" y="110" font-size="10" fill="#333">"kite" → </text>
  <rect x="148" y="98" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="176" y="114" text-anchor="middle" font-size="10" fill="#333">KiTe</text>
  <text x="220" y="110" font-size="10" fill="#888">(首次=KiTe，kite 被跳过)</text>

  <text x="100" y="134" font-size="10" fill="#333">"hare" → </text>
  <rect x="148" y="122" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="10" fill="#333">hare</text>
  <text x="200" y="138" font-size="10" fill="#888">(首次=hare，Hare 被跳过)</text>

  <!-- vowel 表 -->
  <text x="30" y="166" font-size="11" fill="#b85450" font-weight="bold">③ vowel 表</text>
  <text x="100" y="166" font-size="10" fill="#333">"k*t*" → </text>
  <rect x="148" y="154" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="170" text-anchor="middle" font-size="10" fill="#333">KiTe</text>
  <text x="220" y="170" font-size="10" fill="#888">(kite→k*t* 同键，被跳过)</text>

  <text x="100" y="190" font-size="10" fill="#333">"h*r*" → </text>
  <rect x="148" y="178" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="10" fill="#333">hare</text>
  <text x="200" y="194" font-size="10" fill="#888">(Hare→h*r* 同键，被跳过)</text>

  <!-- 分隔线 -->
  <line x1="30" y1="214" x2="570" y2="214" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== 查询表头 ===== -->
  <text x="30" y="234" font-size="12" fill="#444" font-weight="bold">逐个查询：</text>

  <rect x="30" y="242" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="258" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">query</text>
  <rect x="184" y="242" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="224" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">①精确?</text>
  <rect x="268" y="242" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="308" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">②小写?</text>
  <rect x="352" y="242" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③元音?</text>
  <rect x="436" y="242" width="130" height="22" fill="#eeeeee" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="501" y="258" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">→ answer</text>

  <!-- 行数据 -->
  <g font-size="10" fill="#333">
    <!-- row 1 kite -->
    <text x="105" y="280" text-anchor="middle">kite</text>
    <text x="224" y="280" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="308" y="280" text-anchor="middle" fill="#ccc">—</text>
    <text x="392" y="280" text-anchor="middle" fill="#ccc">—</text>
    <text x="501" y="280" text-anchor="middle" fill="#4a7a3a" font-weight="bold">kite</text>

    <!-- row 2 Kite -->
    <text x="105" y="298" text-anchor="middle">Kite</text>
    <text x="224" y="298" text-anchor="middle" fill="#ccc">✗</text>
    <text x="308" y="298" text-anchor="middle" fill="#d6a040">✓ "kite"</text>
    <text x="392" y="298" text-anchor="middle" fill="#ccc">—</text>
    <text x="501" y="298" text-anchor="middle" fill="#d6a040" font-weight="bold">KiTe</text>

    <!-- row 3 KiTe -->
    <text x="105" y="316" text-anchor="middle">KiTe</text>
    <text x="224" y="316" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="308" y="316" text-anchor="middle" fill="#ccc">—</text>
    <text x="392" y="316" text-anchor="middle" fill="#ccc">—</text>
    <text x="501" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">KiTe</text>

    <!-- row 4 Hare -->
    <text x="105" y="334" text-anchor="middle">Hare</text>
    <text x="224" y="334" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="308" y="334" text-anchor="middle" fill="#ccc">—</text>
    <text x="392" y="334" text-anchor="middle" fill="#ccc">—</text>
    <text x="501" y="334" text-anchor="middle" fill="#4a7a3a" font-weight="bold">Hare</text>

    <!-- row 5 HARE -->
    <text x="105" y="352" text-anchor="middle">HARE</text>
    <text x="224" y="352" text-anchor="middle" fill="#ccc">✗</text>
    <text x="308" y="352" text-anchor="middle" fill="#d6a040">✓ "hare"</text>
    <text x="392" y="352" text-anchor="middle" fill="#ccc">—</text>
    <text x="501" y="352" text-anchor="middle" fill="#d6a040" font-weight="bold">hare</text>

    <!-- row 6 Hear -->
    <text x="105" y="370" text-anchor="middle">Hear</text>
    <text x="224" y="370" text-anchor="middle" fill="#ccc">✗</text>
    <text x="308" y="370" text-anchor="middle" fill="#ccc">✗</text>
    <text x="392" y="370" text-anchor="middle" fill="#ccc">✗ "h**r"</text>
    <text x="501" y="370" text-anchor="middle" fill="#888" font-weight="bold">""</text>

    <!-- row 7 keti -->
    <text x="105" y="388" text-anchor="middle">keti</text>
    <text x="224" y="388" text-anchor="middle" fill="#ccc">✗</text>
    <text x="308" y="388" text-anchor="middle" fill="#ccc">✗</text>
    <text x="392" y="388" text-anchor="middle" fill="#b85450">✓ "k*t*"</text>
    <text x="501" y="388" text-anchor="middle" fill="#b85450" font-weight="bold">KiTe</text>

    <!-- row 8 keet -->
    <text x="105" y="406" text-anchor="middle">keet</text>
    <text x="224" y="406" text-anchor="middle" fill="#ccc">✗</text>
    <text x="308" y="406" text-anchor="middle" fill="#ccc">✗</text>
    <text x="392" y="406" text-anchor="middle" fill="#ccc">✗ "k**t"</text>
    <text x="501" y="406" text-anchor="middle" fill="#888" font-weight="bold">""</text>
  </g>

  <!-- ===== 关键 ===== -->
  <rect x="30" y="420" width="540" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="440" font-size="10" fill="#555"><tspan font-weight="bold" fill="#d6a040">看点：</tspan>"keti"→"k*t*" 命中③；"keet"→"k**t" 与 "k*t*" 不同键，元音个数不同也算不匹配 → 返回 ""</text>
</svg>
