<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针求首个够长交集</text>

  <!-- slots1 label -->
  <text x="36" y="68" font-size="12" fill="#446688" font-weight="bold">人1:</text>

  <!-- slots1 intervals (schematic, not to scale): [10,50] [60,120] [140,210] -->
  <rect x="70" y="54" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="54" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="54" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="50" font-size="9" fill="#888">[10,50]</text>
  <text x="220" y="50" font-size="9" fill="#888">[60,120]</text>
  <text x="375" y="50" font-size="9" fill="#888">[140,210]</text>

  <!-- slots2 label -->
  <text x="36" y="108" font-size="12" fill="#4a7a3a" font-weight="bold">人2:</text>

  <!-- slots2 intervals: [0,15] [60,70] -->
  <rect x="60" y="94" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="94" width="25" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="90" font-size="9" fill="#888">[0,15]</text>
  <text x="172" y="90" font-size="9" fill="#888">[60,70]</text>

  <!-- Intersection highlight: [60,70] -->
  <rect x="160" y="94" width="25" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)" opacity="0.75"/>

  <!-- Duration window box: [60, 68] -->
  <text x="36" y="160" font-size="12" fill="#d6a040" font-weight="bold">会议:</text>
  <rect x="160" y="146" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="184" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[60,68]</text>

  <!-- pointer i (at slots1[1] = [60,120]) -->
  <path d="M 220 44 L 220 50" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="214" y="40" font-size="11" fill="#446688" font-weight="bold">i</text>

  <!-- pointer j (at slots2[1] = [60,70]) -->
  <path d="M 172 84 L 172 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="166" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>

  <!-- annotation arrow from duration to intersection -->
  <path d="M 180 146 L 180 120" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="136" font-size="9" fill="#b85450">取前 duration</text>

  <!-- Divider -->
  <path d="M 30 210 L 530 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula section -->
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">每步操作</text>

  <!-- Step 1: compute intersection -->
  <rect x="50" y="252" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#444">① lo = max(s1[i].start, s2[j].start), hi = min(s1[i].end, s2[j].end)</text>

  <!-- Step 2: check duration -->
  <rect x="50" y="288" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#444">② lo ≤ hi 且 hi − lo ≥ duration → 返回 [lo, lo+duration]</text>

  <!-- Step 3: advance pointer -->
  <rect x="50" y="324" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#444">③ 否则 s1[i].end &lt; s2[j].end → i++; 否则 j++</text>
</svg>
