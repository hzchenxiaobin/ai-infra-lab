<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">方法二流程：索引递增生成下一个组合</text>
  <path d="M 150 36 Q 280 44 410 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start: next() called -->
  <g filter="url(#sk)"><ellipse cx="280" cy="62" rx="70" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">next() 被调用</text>
  <path d="M 280 78 L 280 100" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 1: generate current string -->
  <g filter="url(#sk)"><rect x="180" y="100" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">① 拼出当前串 s = chars[idx[0..k-1]]</text>
  <path d="M 280 134 L 280 156" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: scan from right -->
  <g filter="url(#sk)"><rect x="160" y="156" width="240" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">② j = k−1 往左找 idx[j] &lt; n−k+j</text>
  <path d="M 280 190 L 280 210" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision -->
  <g filter="url(#sk)"><polygon points="280,210 360,250 280,290 200,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">找到</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">可增位 j ?</text>

  <!-- Yes branch -->
  <path d="M 200 250 L 120 250 L 120 300" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="242" font-size="10" fill="#4a8e4a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="40" y="300" width="160" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">③ idx[j]++</text>
  <text x="120" y="338" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">④ idx[j+1..] = prev+1</text>
  <text x="120" y="354" text-anchor="middle" font-size="10" fill="#888">逐位重置，恢复紧凑</text>
  <path d="M 120 358 L 120 400 L 200 400" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- No branch -->
  <path d="M 360 250 L 440 250 L 440 300" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="242" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="370" y="300" width="140" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="440" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">已到最后组合</text>
  <text x="440" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">标记 done = true</text>
  <text x="440" y="358" text-anchor="middle" font-size="10" fill="#888">hasNext → false</text>
  <path d="M 440 358 L 440 400 L 360 400" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Return s -->
  <g filter="url(#sk)"><ellipse cx="280" cy="400" rx="80" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 s（步骤①的串）</text>

  <!-- side note -->
  <g filter="url(#sk)"><rect x="40" y="420" width="470" height="30" rx="6" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="55" y="440" font-size="10" fill="#666">★ 关键：先拼串再推进——返回的是调用前的组合，推进是为下次 next() 做准备</text>
</svg>
