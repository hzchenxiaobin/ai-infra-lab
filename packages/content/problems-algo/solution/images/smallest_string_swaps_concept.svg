<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心：交换对定义连通分量，分量内字符可任意排列</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">s = "dcab", pairs = [[0,3],[1,2]]</text>

  <!-- pair arcs above boxes -->
  <path d="M 180 82 Q 270 40 360 82" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="268" y="38" text-anchor="middle" font-size="9.5" fill="#446688">(0,3)</text>
  <path d="M 240 82 Q 270 60 300 82" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="322" y="60" font-size="9.5" fill="#4a7a3a">(1,2)</text>

  <!-- Original string boxes -->
  <rect x="156" y="82" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">d</text>
  <text x="180" y="136" text-anchor="middle" font-size="9.5" fill="#888">idx 0</text>

  <rect x="216" y="82" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">c</text>
  <text x="240" y="136" text-anchor="middle" font-size="9.5" fill="#888">idx 1</text>

  <rect x="276" y="82" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">a</text>
  <text x="300" y="136" text-anchor="middle" font-size="9.5" fill="#888">idx 2</text>

  <rect x="336" y="82" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">b</text>
  <text x="360" y="136" text-anchor="middle" font-size="9.5" fill="#888">idx 3</text>

  <!-- Component grouping boxes -->
  <rect x="40" y="152" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">分量 {0, 3}（蓝色）</text>
  <text x="150" y="190" text-anchor="middle" font-size="10.5" fill="#555">字符 [d, b] → 排序 → [b, d]</text>

  <rect x="280" y="152" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">分量 {1, 2}（绿色）</text>
  <text x="390" y="190" text-anchor="middle" font-size="10.5" fill="#555">字符 [c, a] → 排序 → [a, c]</text>

  <!-- Arrow down -->
  <line x1="270" y1="202" x2="270" y2="220" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result boxes -->
  <rect x="156" y="224" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="250" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">b</text>

  <rect x="216" y="224" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="250" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">a</text>

  <rect x="276" y="224" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">c</text>

  <rect x="336" y="224" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="250" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">d</text>

  <text x="270" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">回填后 = "bacd"</text>

  <!-- Key idea box -->
  <rect x="30" y="300" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">并查集求连通分量 → 各分量内字符排序 → 回填原位</text>
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">同分量内任意位置可互换（交换闭包 = 全排列）</text>
</svg>
