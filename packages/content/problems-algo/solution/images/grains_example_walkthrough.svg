<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：hens=[3,6,7]，grains=[2,4,7,9]，T=2 的贪心分配</text>

  <!-- ===== reference number line ===== -->
  <line x1="60" y1="62" x2="570" y2="62" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="50" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="226" y="50" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="278" y="50" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="382" y="50" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="434" y="50" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="538" y="50" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- ===== Row 1: hen1 @3 eats grain2 ===== -->
  <text x="40" y="108" font-size="11" fill="#446688" font-weight="bold">鸡1</text>
  <line x1="60" y1="110" x2="570" y2="110" stroke="#eee" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- grain4 (rejected) -->
  <circle cx="278" cy="110" r="7" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="292" y="106" font-size="9" fill="#bbb">cost(2,4)=3&gt;2 ✗</text>
  <!-- grain2 eaten -->
  <circle cx="174" cy="110" r="8" fill="#d6a040" stroke="#9a6a20" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="102" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">✓</text>
  <!-- hen1 -->
  <circle cx="226" cy="110" r="11" fill="#446688" stroke="#2a3a55" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <!-- arc hen -> grain2 -->
  <path d="M 218 100 Q 196 80 182 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="10" fill="#b85450">cost=1 ✓</text>

  <!-- ===== Row 2: hen2 @6 eats grain4 ===== -->
  <text x="40" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">鸡2</text>
  <line x1="60" y1="172" x2="570" y2="172" stroke="#eee" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- grain7 (rejected) -->
  <circle cx="434" cy="172" r="7" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="448" y="168" font-size="9" fill="#bbb">cost(4,7)=4&gt;2 ✗</text>
  <!-- grain4 eaten -->
  <circle cx="278" cy="172" r="8" fill="#d6a040" stroke="#9a6a20" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="278" y="164" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">✓</text>
  <!-- hen2 -->
  <circle cx="382" cy="172" r="11" fill="#4a7a3a" stroke="#2c4a22" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="176" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">6</text>
  <!-- arc hen2 -> grain4 -->
  <path d="M 374 162 Q 326 142 286 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="140" text-anchor="middle" font-size="10" fill="#b85450">cost=2 ✓</text>

  <!-- ===== Row 3: hen3 @7 eats grain7,9 ===== -->
  <text x="40" y="232" font-size="11" fill="#b85450" font-weight="bold">鸡3</text>
  <line x1="60" y1="234" x2="570" y2="234" stroke="#eee" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- grain7 eaten (same pos as hen) -->
  <circle cx="434" cy="234" r="8" fill="#d6a040" stroke="#9a6a20" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- grain9 eaten -->
  <circle cx="538" cy="234" r="8" fill="#d6a040" stroke="#9a6a20" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="538" y="226" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">✓</text>
  <!-- hen3 -->
  <circle cx="434" cy="234" r="11" fill="#b85450" stroke="#7a3030" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="238" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">7</text>
  <!-- arc hen3 -> grain9 (passes grain7) -->
  <path d="M 446 224 Q 490 204 530 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="202" text-anchor="middle" font-size="10" fill="#b85450">cost=9−7=2 ✓</text>
  <text x="434" y="258" text-anchor="middle" font-size="9" fill="#888">先吃同位 grain7（0 秒）再右行至 9</text>

  <!-- ===== result ===== -->
  <rect x="150" y="290" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="308" text-anchor="middle" font-size="12" fill="#444">三只鸡各负责连续一段，最大耗时 = 2</text>
  <text x="310" y="324" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">→ T=2 可行；T=1 时 grain2/4 难两全 → 答案 2</text>
</svg>
