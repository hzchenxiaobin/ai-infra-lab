<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">滚动哈希：O(1) 滑窗更新，批量计算所有长度 L 窗口的指纹</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">多项式哈希 + 滑窗递推，避免每个窗口都从零计算 O(L)</text>

  <!-- Window 1: [a0, a1, a2] L=3 -->
  <text x="40" y="82" font-size="12" fill="#888" font-weight="bold">窗口 1</text>
  <g font-size="13">
    <rect x="100" y="66" width="56" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="128" y="89" text-anchor="middle" fill="#446688">a₀</text>
    <rect x="158" y="66" width="56" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="186" y="89" text-anchor="middle" fill="#446688">a₁</text>
    <rect x="216" y="66" width="56" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="244" y="89" text-anchor="middle" fill="#446688">a₂</text>
    <rect x="274" y="66" width="56" height="36" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="302" y="89" text-anchor="middle" fill="#bbb">a₃</text>
    <rect x="332" y="66" width="56" height="36" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="360" y="89" text-anchor="middle" fill="#bbb">a₄</text>
  </g>
  <!-- hash formula for window 1 -->
  <rect x="90" y="112" width="260" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">h = a₀·B² + a₁·B + a₂  (mod M)</text>

  <!-- Arrow: slide window -->
  <path d="M 310 160 L 310 178" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="174" font-size="11" fill="#b85450" font-weight="bold">滑窗右移</text>

  <!-- Window 2: [a1, a2, a3] -->
  <text x="40" y="202" font-size="12" fill="#888" font-weight="bold">窗口 2</text>
  <g font-size="13">
    <rect x="100" y="186" width="56" height="36" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="128" y="209" text-anchor="middle" fill="#bbb">a₀</text>
    <rect x="158" y="186" width="56" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="186" y="209" text-anchor="middle" fill="#d6a040">a₁</text>
    <rect x="216" y="186" width="56" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="244" y="209" text-anchor="middle" fill="#d6a040">a₂</text>
    <rect x="274" y="186" width="56" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="302" y="209" text-anchor="middle" fill="#d6a040">a₃</text>
    <rect x="332" y="186" width="56" height="36" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="360" y="209" text-anchor="middle" fill="#bbb">a₄</text>
  </g>
  <!-- hash formula for window 2 -->
  <rect x="90" y="232" width="260" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="251" text-anchor="middle" font-size="11" fill="#4a7a3a">h' = a₁·B² + a₂·B + a₃  (mod M)</text>

  <!-- Rolling update formula box -->
  <rect x="40" y="278" width="540" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="302" font-size="13" fill="#b85450" font-weight="bold">O(1) 递推公式（免去从头算 O(L)）</text>
  <text x="60" y="324" font-size="12" fill="#444">step 1: 去头 — h ← (h − a₀ · B^(L−1)) mod M</text>
  <text x="60" y="344" font-size="12" fill="#444">step 2: 移位 + 入尾 — h ← (h × B + a₃) mod M</text>

  <!-- Double hash note -->
  <rect x="40" y="370" width="540" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="394" font-size="12" fill="#446688" font-weight="bold">双哈希防碰撞：两组 (B, M) 同时计算，哈希对 (h₁, h₂) 作为指纹</text>
  <text x="60" y="414" font-size="11" fill="#888">B₁=100003, M₁=10⁹+7  |  B₂=100019, M₂=10⁹+9  →  碰撞概率 ≈ 1/(M₁·M₂) ≈ 10⁻¹⁸</text>
</svg>
