<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：配对 → 降序排序 → 扫描贪心选取
  </text>

  <!-- ===== Step 1: 配对 ===== -->
  <rect x="60" y="46" width="400" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ① items[i] = (values[i], labels[i])
  </text>

  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: 排序 ===== -->
  <rect x="60" y="110" width="400" height="44" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ② sort(items, by value 降序)
  </text>

  <path d="M 260 154 L 260 172" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 初始化 ===== -->
  <rect x="60" y="174" width="400" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ③ cnt = {}, picked = 0, ans = 0
  </text>

  <path d="M 260 218 L 260 236" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="232" font-size="10.5" fill="#888" filter="url(#rough2)">遍历每个 (v, l)</text>

  <!-- ===== 决策菱形 1: picked == numWanted? ===== -->
  <polygon points="260,238 360,278 260,318 160,278" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    picked ==
  </text>
  <text x="260" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    numWanted?
  </text>

  <!-- Yes 分支：终止 -->
  <path d="M 360 278 L 430 278" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="262" width="70" height="32" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">break</text>

  <!-- No 分支：继续 -->
  <path d="M 260 318 L 260 336" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="332" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ===== 决策菱形 2: cnt[l] < useLimit? ===== -->
  <polygon points="260,338 380,380 260,422 140,380" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    cnt[l] &lt;
  </text>
  <text x="260" y="393" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    useLimit?
  </text>

  <!-- Yes 分支：选入 -->
  <path d="M 380 380 L 430 380" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="354" width="78" height="52" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="469" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans += v</text>
  <text x="469" y="386" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">picked++</text>
  <text x="469" y="400" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt[l]++</text>

  <!-- No 分支：跳过 -->
  <path d="M 140 380 L 90 380" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="22" y="364" width="68" height="32" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="385" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过</text>

  <!-- 回环箭头：继续下一个 -->
  <path d="M 56 396 L 56 460 L 260 460 L 260 338" stroke="#888" stroke-width="1.2"
        fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="476" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下一个物品</text>

  <!-- ===== 返回结果 ===== -->
  <path d="M 465 406 L 465 498 L 260 498" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="486" width="200" height="40" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="512" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    return ans
  </text>
</svg>
