<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,0,0,2,0,0,4]</text>

  <!-- Header row -->
  <rect x="20" y="38" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新增</text>
  <text x="480" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- Row 0: i=0, x=1 -->
  <rect x="20" y="68" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="170" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="380" y="86" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="480" y="86" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row 1: i=1, x=3 -->
  <rect x="20" y="98" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="116" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="380" y="116" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="480" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row 2: i=2, x=0 (zero run start) -->
  <rect x="20" y="128" width="560" height="28" fill="#f1f8f1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 3: i=3, x=0 -->
  <rect x="20" y="158" width="560" height="28" fill="#f1f8f1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2</text>
  <text x="480" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 4: i=4, x=2 (break) -->
  <rect x="20" y="188" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="206" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Row 5: i=5, x=0 -->
  <rect x="20" y="218" width="560" height="28" fill="#f1f8f1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="480" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 6: i=6, x=0 -->
  <rect x="20" y="248" width="560" height="28" fill="#f1f8f1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="170" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2</text>
  <text x="480" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Row 7: i=7, x=4 -->
  <rect x="20" y="278" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="296" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="170" y="296" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="480" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- segment note box -->
  <rect x="20" y="318" width="560" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两段连续 0 各自独立计数</text>
  <text x="40" y="356" font-size="11" fill="#444">段1: 下标 2–3，k=2 → 2×3/2 = 3 个；  段2: 下标 5–6，k=2 → 2×3/2 = 3 个</text>

  <!-- bottom callout -->
  <rect x="20" y="372" width="560" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终 ans = 6 ✓ = 3 + 3</text>
</svg>
