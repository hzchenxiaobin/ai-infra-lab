<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建集合 → 遍历 stones 逐字查集合 → 命中累计</text>

  <!-- 1. 建集合 -->
  <rect x="190" y="48" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">jewelSet = set(jewels)</text>
  <text x="360" y="73" font-size="11" fill="#888">O(|j|)</text>

  <!-- arrow -->
  <path d="M 270 90 L 270 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 2. 初始化 -->
  <rect x="200" y="116" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="139" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">count = 0</text>

  <!-- arrow -->
  <path d="M 270 154 L 270 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 3. for loop -->
  <rect x="170" y="178" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="203" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for ch in stones:</text>

  <!-- arrow -->
  <path d="M 270 220 L 270 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 4. decision diamond -->
  <polygon points="270,246 360,296 270,346 180,296" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ch ∈ jewelSet?</text>
  <text x="270" y="308" text-anchor="middle" font-size="10.5" fill="#888">O(1) 哈希查询</text>

  <!-- Yes branch: count++ -->
  <text x="392" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 296 L 410 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="414" y="278" width="92" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count++</text>

  <!-- No branch: skip -->
  <text x="120" y="290" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 180 296 L 130 296" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="40" y="278" width="88" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="84" y="302" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">跳过</text>

  <!-- loop back arrow: from count++ and skip back up to for loop -->
  <path d="M 460 278 C 460 232, 380 222, 320 200" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="420" y="248" font-size="10" fill="#888">下一个 ch</text>
  <path d="M 84 278 C 84 232, 180 222, 220 200" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- arrow: loop ends -> return -->
  <path d="M 270 346 L 270 372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="284" y="364" font-size="10" fill="#888">遍历结束</text>

  <!-- 5. return -->
  <rect x="190" y="376" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="399" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return count</text>
</svg>
