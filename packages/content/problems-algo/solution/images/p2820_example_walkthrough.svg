<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：投票权重 → 汇总 → 输出</text>

  <text x="60" y="52" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">每票权重表（过滤 null 后）</text>

  <rect x="50" y="58" width="460" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="100" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">voter</text>
  <text x="250" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">candidate</text>
  <text x="420" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">vote</text>

  <rect x="50" y="80" width="460" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Charles</text>
  <text x="250" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ryan</text>
  <text x="420" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>

  <rect x="50" y="100" width="460" height="20" fill="#fafafa" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Charles</text>
  <text x="250" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Christine</text>
  <text x="420" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>

  <rect x="50" y="120" width="460" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Charles</text>
  <text x="250" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Kathy</text>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>

  <rect x="50" y="140" width="460" height="20" fill="#fafafa" filter="url(#rough2)"/>
  <text x="100" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Benjamin</text>
  <text x="250" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Christine</text>
  <text x="420" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="160" width="460" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Anthony</text>
  <text x="250" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ryan</text>
  <text x="420" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="180" width="460" height="20" fill="#fafafa" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Edward</text>
  <text x="250" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ryan</text>
  <text x="420" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="200" width="460" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Evelyn</text>
  <text x="250" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Kathy</text>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="220" width="460" height="20" fill="#fafafa" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Arthur</text>
  <text x="250" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Christine</text>
  <text x="420" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 280 246 L 280 276" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="264" font-size="11" fill="#999" filter="url(#rough2)">GROUP BY candidate, SUM(vote)</text>

  <rect x="50" y="278" width="460" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="130" y="293" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">candidate</text>
  <text x="320" y="293" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">total</text>

  <rect x="50" y="300" width="460" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="130" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Ryan</text>
  <text x="320" y="315" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2.33</text>

  <rect x="50" y="322" width="460" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="130" y="337" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Christine</text>
  <text x="320" y="337" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2.33</text>

  <rect x="50" y="344" width="460" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="130" y="359" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Kathy</text>
  <text x="320" y="359" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1.33</text>

  <path d="M 280 372 L 280 398" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="388" font-size="11" fill="#999" filter="url(#rough2)">rk=1，ORDER BY candidate</text>

  <rect x="110" y="400" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：Christine, Ryan</text>
  <text x="280" y="435" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">并列第一（各 2.33 票），按名字升序</text>

  <text x="60" y="462" font-size="10" fill="#999" filter="url(#rough2)">注：Kathy、Terry 弃权已被 WHERE candidate IS NOT NULL 过滤</text>
</svg>
