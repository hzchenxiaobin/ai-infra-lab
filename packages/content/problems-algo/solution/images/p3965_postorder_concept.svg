<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">后序自底向上：先算孩子，父节点只聚合 min / max</text>

  <!-- 树边（父→子，实线灰） -->
  <line x1="217" y1="101" x2="131" y2="171" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="253" y1="101" x2="339" y2="171" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="355" y1="206" x2="355" y2="259" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 自底向上汇报（红色虚线箭头） -->
  <path d="M 368 256 L 368 212" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 340 170 L 262 108" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 133 168 L 210 108" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="364" y="240" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">f=1</text>
  <text x="287" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f=3</text>
  <text x="171" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f=8</text>

  <!-- 节点 -->
  <circle cx="235" cy="85" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475e" filter="url(#rough2)">0</text>
  <text x="235" y="122" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bt=5</text>

  <circle cx="115" cy="185" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5f30" filter="url(#rough2)">1</text>
  <text x="115" y="220" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bt=8</text>

  <circle cx="355" cy="185" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475e" filter="url(#rough2)">2</text>
  <text x="384" y="160" font-size="10.5" fill="#666" filter="url(#rough2)">bt=2</text>

  <circle cx="355" cy="280" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5f30" filter="url(#rough2)">3</text>
  <text x="355" y="315" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bt=1</text>

  <!-- 处理次序徽章 -->
  <circle cx="317" cy="268" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="318" cy="215" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="219" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
  <circle cx="80" cy="158" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <circle cx="196" cy="85" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="89" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 各节点 finish -->
  <rect x="390" y="268" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="284" text-anchor="middle" font-size="11.5" fill="#3a5f30" filter="url(#rough2)">f=1</text>

  <rect x="392" y="172" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="188" text-anchor="middle" font-size="11.5" fill="#3a5f30" filter="url(#rough2)">f=3</text>

  <rect x="150" y="172" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="188" text-anchor="middle" font-size="11.5" fill="#3a5f30" filter="url(#rough2)">f=8</text>

  <rect x="272" y="72" width="74" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a00" filter="url(#rough2)">f=18</text>

  <!-- 根节点聚合注释 -->
  <text x="16" y="55" font-size="11" fill="#555" filter="url(#rough2)">根 0 的孩子 finish = {8, 3}</text>
  <text x="16" y="72" font-size="11" fill="#555" filter="url(#rough2)">→ earliest = 3，latest = 8</text>
  <text x="16" y="89" font-size="11" fill="#555" filter="url(#rough2)">own = (8−3) + 5 = 10</text>

  <!-- 公式框 -->
  <rect x="55" y="324" width="410" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#6b4a00" filter="url(#rough2)">叶子：f = bt　　非叶子：f = latest + (latest − earliest) + bt</text>
</svg>
