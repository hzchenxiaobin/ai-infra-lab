<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：相邻差为 1 的连续段 → 一个区间，断点处切分</text>

  <!-- nums row -->
  <text x="30" y="74" font-size="12" fill="#888">nums:</text>

  <!-- run [0,1,2] blue -->
  <rect x="80" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="136" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="192" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- run [4,5] green -->
  <rect x="248" y="58" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="304" y="58" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- run [7] orange -->
  <rect x="360" y="58" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>

  <!-- index labels -->
  <text x="108" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="164" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="276" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="332" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="388" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- break markers: between 2 and 4 (x=248), between 5 and 7 (x=360) -->
  <!-- break 1: 2 -> 4, diff = 2 -->
  <path d="M 248 44 L 248 54" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">断点</text>
  <text x="248" y="132" text-anchor="middle" font-size="9.5" fill="#b85450">4 ≠ 2+1</text>

  <!-- break 2: 5 -> 7, diff = 2 -->
  <path d="M 360 44 L 360 54" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">断点</text>
  <text x="360" y="132" text-anchor="middle" font-size="9.5" fill="#b85450">7 ≠ 5+1</text>

  <!-- run brackets -->
  <rect x="78" y="54" width="172" height="38" fill="none" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="246" y="54" width="116" height="38" fill="none" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="358" y="54" width="60" height="38" fill="none" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>

  <!-- arrows down to result -->
  <path d="M 164 150 L 164 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 304 150 L 304 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 388 150 L 388 178" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result ranges -->
  <rect x="100" y="184" width="128" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"0-&gt;2"</text>

  <rect x="240" y="184" width="128" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"4-&gt;5"</text>

  <rect x="324" y="184" width="128" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"7"</text>

  <!-- single vs range note -->
  <rect x="40" y="244" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="268" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">单元素 → "x"</text>
  <text x="155" y="292" text-anchor="middle" font-size="11" fill="#333">start == nums[i−1]</text>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#888">只输出起点本身</text>

  <rect x="290" y="244" width="230" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="268" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">连续段 → "x-&gt;y"</text>
  <text x="405" y="292" text-anchor="middle" font-size="11" fill="#333">start != nums[i−1]</text>
  <text x="405" y="312" text-anchor="middle" font-size="11" fill="#888">输出 "起点-&gt;终点"</text>
</svg>
