<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两条平行路线 + 非对称换乘成本</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">常规↔特快换乘不对称：上去要钱，下来免费</text>

  <!-- Regular route label -->
  <text x="30" y="100" font-size="11" fill="#446688" font-weight="bold">常规</text>
  <text x="30" y="114" font-size="9.5" fill="#888">regular</text>

  <!-- Express route label -->
  <text x="30" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">特快</text>
  <text x="30" y="240" font-size="9.5" fill="#888">express</text>

  <!-- Regular route line -->
  <path d="M 90 95 L 510 95" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- Express route line -->
  <path d="M 90 221 L 510 221" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- Regular stations: 0,1,2,3 at x=90,230,370,510 y=95 -->
  <circle cx="90" cy="95" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="230" cy="95" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="370" cy="95" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="510" cy="95" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Express stations: 0,1,2,3 at x=90,230,370,510 y=221 -->
  <circle cx="90" cy="221" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="230" cy="221" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="370" cy="221" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="510" cy="221" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Regular segment costs (above regular line) -->
  <text x="160" y="84" text-anchor="middle" font-size="10.5" fill="#446688">a₁</text>
  <text x="300" y="84" text-anchor="middle" font-size="10.5" fill="#446688">a₂</text>
  <text x="440" y="84" text-anchor="middle" font-size="10.5" fill="#446688">a₃</text>

  <!-- Express segment costs (below express line) -->
  <text x="160" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a">b₁</text>
  <text x="300" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a">b₂</text>
  <text x="440" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a">b₃</text>

  <!-- Switch at station 1: regular → express (down, orange, expressCost) -->
  <path d="M 230 112 L 230 204" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="246" y="148" width="86" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="289" y="163" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">+expressCost</text>

  <!-- Switch at station 2: express → regular (up, green, free) -->
  <path d="M 370 204 L 370 112" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="386" y="148" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="414" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">免费</text>

  <!-- Start marker -->
  <text x="90" y="68" text-anchor="middle" font-size="9.5" fill="#888">起点</text>

  <!-- Bottom note -->
  <rect x="60" y="262" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">非对称换乘 → 需要两个状态分别记录</text>
  <text x="280" y="297" text-anchor="middle" font-size="10.5" fill="#555">f[i]：到站 i 时在常规线；g[i]：到站 i 时在特快线</text>
</svg>
