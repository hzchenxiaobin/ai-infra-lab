<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：取列 → fillna → 写回 → 返回</text>

  <!-- Row 1 -->
  <rect x="25" y="58" width="150" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 输入 products</text>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3 列，quantity 可能有 NaN</text>

  <path d="M 180 90 L 213 90" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="58" width="150" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 取单列</text>
  <text x="295" y="104" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">products['quantity'] → Series</text>

  <path d="M 375 90 L 408 90" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="415" y="58" width="130" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ 向量化替换</text>
  <text x="480" y="104" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">.fillna(0)</text>

  <!-- Snake down -->
  <path d="M 480 125 L 480 158" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Detail panel: inside fillna -->
  <rect x="25" y="160" width="180" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">③ 的内部：逐元素判定</text>

  <polygon points="110,192 142,220 110,248 78,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">是 NaN？</text>

  <path d="M 95 243 L 72 258" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="38" y="262" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="279" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是 → 填 0</text>

  <path d="M 125 243 L 148 258" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="114" y="262" width="76" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="279" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否 → 原样</text>

  <!-- Row 2 (right to left) -->
  <rect x="415" y="160" width="130" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">④ 列赋值写回</text>
  <text x="480" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">df['quantity'] = 新列</text>

  <path d="M 408 192 L 375 192" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="220" y="160" width="150" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⑤ 返回 products</text>
  <text x="295" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行数·行序·其它列不变</text>

  <!-- Bottom warning -->
  <rect x="40" y="320" width="480" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 写回的标准姿势</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">products['quantity'].fillna(0, inplace=True) 已废弃（链式 inplace 不生效）</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">标准姿势：右调用返回新列 + 左列赋值写回</text>
</svg>
