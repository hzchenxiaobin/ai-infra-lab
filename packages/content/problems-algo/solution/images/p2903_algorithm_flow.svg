<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 前缀最值</text>

  <rect x="150" y="42" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">minIdx = maxIdx = 0, j = indexDiff</text>

  <path d="M 260 78 L 260 96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,100 345,132 260,164 175,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j &lt; n ?</text>

  <path d="M 345 132 L 400 132" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="126" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="404" y="116" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">[−1,−1]</text>

  <path d="M 260 164 L 260 182" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="178" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="110" y="186" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = j − indexDiff；用 nums[k] 更新 minIdx / maxIdx</text>

  <path d="M 260 222 L 260 240" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,244 360,278 260,312 160,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[j] − nums[minIdx]</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≥ valueDiff ?</text>

  <path d="M 360 278 L 412 278" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="272" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="416" y="262" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="460" y="282" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[minIdx, j]</text>

  <path d="M 260 312 L 260 330" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="326" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="260,334 360,368 260,402 160,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[maxIdx] − nums[j]</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≥ valueDiff ?</text>

  <path d="M 360 368 L 412 368" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="362" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="416" y="352" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="460" y="372" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[maxIdx, j]</text>

  <path d="M 260 402 L 260 420" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="416" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="180" y="424" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j++，回到循环</text>

  <path d="M 180 440 Q 100 440 100 300 Q 100 132 172 132" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
