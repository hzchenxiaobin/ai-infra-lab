<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：正序记长度 + 逆序定位</text>

  <!-- 步骤① -->
  <rect x="90" y="38" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 正序扫 s：lens[i] = 前 i 个操作后的长度</text>

  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 越界判定菱形 -->
  <polygon points="260,86 328,112 260,138 192,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k ≥ lens[n] ?</text>

  <path d="M 328 112 L 392 112" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="394" y="98" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 '.'</text>

  <path d="M 260 138 L 260 154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="150" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 步骤② -->
  <rect x="150" y="156" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② i 从 n−1 倒序扫描</text>

  <path d="M 260 184 L 260 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 字符分类菱形 -->
  <polygon points="260,202 320,226 260,250 200,226" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s[i] = ?</text>

  <!-- 分发箭头 -->
  <path d="M 250 248 C 200 258, 120 252, 74 261" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 255 250 C 230 258, 205 255, 192 261" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 265 250 C 290 258, 315 255, 306 261" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 248 C 320 258, 400 252, 421 261" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 四列撤销规则 -->
  <rect x="18" y="262" width="106" height="52" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="71" y="278" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">字母 c</text>
  <text x="71" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k == lens[i] ?</text>
  <text x="71" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⇒ 返回 c ✅</text>

  <rect x="136" y="262" width="106" height="52" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="189" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">'#' 复制</text>
  <text x="189" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k ≥ lens[i] ?</text>
  <text x="189" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⇒ k −= lens[i]</text>

  <rect x="254" y="262" width="106" height="52" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="307" y="278" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">'%' 反转</text>
  <text x="307" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">镜像：</text>
  <text x="307" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k = lens[i]−1−k</text>

  <rect x="372" y="262" width="106" height="52" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="278" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">'*' 删尾</text>
  <text x="425" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">只删最后一个</text>
  <text x="425" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⇒ k 不变</text>

  <!-- 汇聚条 -->
  <path d="M 71 314 L 71 332" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 189 314 L 189 332" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 307 314 L 307 332" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 314 L 425 332" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="18" y="332" width="460" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="248" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">未命中 ⇒ i−− 继续倒序；合法 k 必在某字母命中（lens[0]=0 兜底返回 '.'）</text>

  <!-- 循环回边 -->
  <path d="M 478 344 C 506 338, 508 190, 372 171" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="497" y="256" font-size="9" fill="#999" transform="rotate(-90 497 256)" text-anchor="middle" filter="url(#rough2)">循环</text>
</svg>
