<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">环分解：L2 = [7,6,5,4] 的最少交换求法</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">值互不相同 → 排序唯一 → 置换可分解为不相交环</text>

  <!-- ===== Step 1: original & sorted ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">① 原数组 与 排序后目标</text>
  <g font-size="11">
    <!-- original row -->
    <text x="30" y="100" fill="#888">原:</text>
    <rect x="70" y="86" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="95" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <rect x="122" y="86" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="147" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="174" y="86" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="199" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="226" y="86" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="251" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="60" y="103" text-anchor="end" font-size="8" fill="#888">i=0</text>
    <text x="112" y="103" text-anchor="end" font-size="8" fill="#888">i=1</text>
    <text x="164" y="103" text-anchor="end" font-size="8" fill="#888">i=2</text>
    <text x="216" y="103" text-anchor="end" font-size="8" fill="#888">i=3</text>

    <!-- sorted row -->
    <text x="30" y="134" fill="#4a7a3a">目标:</text>
    <rect x="70" y="120" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="95" y="137" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="122" y="120" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="147" y="137" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="174" y="120" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="199" y="137" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="226" y="120" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="251" y="137" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
  </g>

  <!-- arrow step1 -> step2 -->
  <path d="M 290 110 L 320 110" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 2: target position map ===== -->
  <text x="330" y="74" font-size="11" fill="#446688" font-weight="bold">② 元素 → 目标位置</text>
  <g font-size="10">
    <text x="330" y="98" fill="#b85450">7 在目标中位于 i=3</text>
    <text x="330" y="114" fill="#b85450">6 在目标中位于 i=2</text>
    <text x="330" y="130" fill="#b85450">5 在目标中位于 i=1</text>
    <text x="330" y="146" fill="#b85450">4 在目标中位于 i=0</text>
  </g>

  <!-- ===== Step 3: cycles ===== -->
  <text x="30" y="180" font-size="11" fill="#446688" font-weight="bold">③ 沿目标位置走环</text>
  <g font-size="10">
    <!-- positions 0 1 2 3 as circles -->
    <circle cx="80" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="220" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <text x="80" y="246" text-anchor="middle" font-size="8" fill="#888">放 7</text>

    <circle cx="170" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="220" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="170" y="246" text-anchor="middle" font-size="8" fill="#888">放 6</text>

    <circle cx="260" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="220" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="260" y="246" text-anchor="middle" font-size="8" fill="#888">放 5</text>

    <circle cx="350" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="350" y="220" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="350" y="246" text-anchor="middle" font-size="8" fill="#888">放 4</text>

    <!-- arrows: 0 -> 3 (7 should go to pos 3) -->
    <path d="M 96 210 Q 223 188 334 210" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="223" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7→pos3</text>
    <!-- 3 -> 0 (4 should go to pos 0) -->
    <path d="M 334 224 Q 223 250 96 224" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="223" y="258" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4→pos0</text>
    <!-- 1 -> 2 (6 should go to pos 2) -->
    <path d="M 186 210 Q 215 196 244 210" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="215" y="200" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">6→pos2</text>
    <!-- 2 -> 1 (5 should go to pos 1) -->
    <path d="M 244 224 Q 215 238 186 224" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="215" y="236" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">5→pos1</text>
  </g>

  <!-- ===== cycle summary on right ===== -->
  <g font-size="10">
    <rect x="400" y="186" width="150" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
    <text x="475" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">两个环</text>
    <text x="412" y="224" fill="#b85450">环①：0→3→0（长2）</text>
    <text x="412" y="240" fill="#d6a040">环②：1→2→1（长2）</text>
    <text x="412" y="256" fill="#555">交换 = (2−1)+(2−1) = 2</text>
  </g>

  <!-- ===== bottom formula ===== -->
  <rect x="30" y="286" width="520" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">通用公式：最少交换 = n − 环的个数</text>
  <text x="50" y="330" font-size="10" fill="#555">• n = 该层节点数；环的个数 = 置换中不相交环的数量</text>
  <text x="50" y="346" font-size="10" fill="#555">• 长 k 的环：沿环逐一交换，前 k−1 次把 k−1 个元素放对，最后一个自动归位</text>
  <text x="50" y="362" font-size="10" fill="#555">• 已在正确位置（自环，k=1）的元素：交换数贡献 0，但计入环的个数</text>
  <text x="50" y="378" font-size="10" fill="#b85450" font-weight="bold">• 本例：n=4，2 个环 → 4 − 2 = 2 次交换</text>
  <text x="50" y="394" font-size="9" fill="#888">⚠️ 值互不相同是「排序唯一 / 置换确定」的前提；有重复值时需用更复杂的最少交换计数</text>
</svg>
