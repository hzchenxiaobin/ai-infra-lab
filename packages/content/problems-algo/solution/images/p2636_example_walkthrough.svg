<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：n=2，functions = [f₀(300ms), f₁(400ms), f₂(200ms)]</text>

  <!-- time axis -->
  <line x1="60" y1="270" x2="600" y2="270" stroke="#bbb" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="606" y="274" font-size="11" fill="#888" filter="url(#rough2)">t</text>
  <!-- ticks -->
  <line x1="60" y1="266" x2="60" y2="274" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <line x1="210" y1="266" x2="210" y2="274" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">300</text>
  <line x1="310" y1="266" x2="310" y2="274" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">400</text>
  <line x1="410" y1="266" x2="410" y2="274" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">500</text>

  <!-- slot A label -->
  <text x="50" y="100" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">槽位 A</text>
  <!-- f0 bar 0 -> 300 -->
  <rect x="60" y="80" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">f₀ running (300ms)</text>
  <!-- f2 bar 300 -> 500 -->
  <rect x="210" y="80" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">f₂ running (200ms)</text>
  <!-- f0 resolve tick -->
  <line x1="210" y1="78" x2="210" y2="118" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="70" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="210" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">resolve → 补 f₂</text>
  <!-- f2 resolve tick -->
  <line x1="410" y1="78" x2="410" y2="118" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="410" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">completed=3 == 3</text>

  <!-- slot B label -->
  <text x="50" y="200" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">槽位 B</text>
  <!-- f1 bar 0 -> 400 -->
  <rect x="60" y="180" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">f₁ running (400ms)</text>
  <!-- idle 400 -> 500 -->
  <rect x="310" y="180" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="360" y="202" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">空闲</text>
  <!-- f1 resolve tick -->
  <line x1="310" y1="178" x2="310" y2="218" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="310" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">completed=2，无待执行 → 等最后</text>

  <!-- final resolve marker -->
  <rect x="436" y="148" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="516" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ pool resolve()</text>
  <path d="M 410 98 L 436 150" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- total bracket -->
  <path d="M 60 312 L 60 320 L 410 320 L 410 312" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="235" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总耗时 = max(300, 400) + 200 = 500ms</text>
</svg>
