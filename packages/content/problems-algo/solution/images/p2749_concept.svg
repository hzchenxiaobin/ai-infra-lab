<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">操作 → 方程变形 → 范围判定</text>

  <!-- Box 1: operation description -->
  <rect x="60" y="44" width="420" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k 次操作：每次选 i ∈ [0, 60]，从 num1 减去 2^i + num2</text>

  <!-- Arrow 1 -->
  <path d="M270,88 L270,112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: equation -->
  <rect x="50" y="116" width="440" height="42" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num1 − Σ 2^i − k·num2 = 0</text>

  <!-- Arrow 2 + label -->
  <path d="M270,160 L270,184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="176" font-size="11" fill="#666" filter="url(#rough2)">变形</text>

  <!-- Box 3: target definition -->
  <rect x="50" y="188" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Σ 2^i = num1 − k·num2 =: target</text>

  <!-- Arrow 3 + label -->
  <path d="M270,232 L270,258" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="250" font-size="11" fill="#666" filter="url(#rough2)">写成 k 个 2 的幂之和</text>

  <!-- Range check section -->
  <text x="270" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">判定条件</text>

  <!-- Left endpoint: popcount -->
  <rect x="30" y="292" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">popcount(target)</text>
  <text x="105" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最少项数</text>

  <!-- Right endpoint: target -->
  <rect x="360" y="292" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="435" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最多项数（全拆成 1）</text>

  <!-- Range bar connecting endpoints -->
  <rect x="180" y="312" width="180" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- k marker on the bar -->
  <circle cx="270" cy="317" r="12" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="317" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>

  <!-- Formula -->
  <text x="270" y="378" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">popcount(target) ≤ k ≤ target</text>

  <!-- Note -->
  <text x="270" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">拆分 2^i = 2·2^(i−1) 可在区间内连续调整项数（每拆一次 +1）</text>
  <text x="270" y="420" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">从二进制最少项拆到全 1 最多项，中间每个项数都可达</text>
</svg>
