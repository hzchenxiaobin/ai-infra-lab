<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">Kadane 算法流程</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="260" cy="62" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="67" text-anchor="middle" font-size="14" fill="#333">开始</text>
  </g>
  <path d="M260 80 L260 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建价值表 -->
  <g filter="url(#rough2)">
    <rect x="150" y="98" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="260" y="116" text-anchor="middle" font-size="13" fill="#333">建字符价值表 val[26]</text>
    <text x="260" y="132" text-anchor="middle" font-size="11" fill="#888">默认 a=1..z=26, 再用 chars/vals 覆盖</text>
  </g>
  <path d="M260 140 L260 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="170" y="158" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="260" y="183" text-anchor="middle" font-size="14" fill="#333">cur = 0, ans = 0</text>
  </g>
  <path d="M260 198 L260 216" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 菱形 -->
  <g filter="url(#rough2)">
    <path d="M260 220 L350 256 L260 292 L170 256 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="252" text-anchor="middle" font-size="13" fill="#333">还有字符 c?</text>
    <text x="260" y="268" text-anchor="middle" font-size="11" fill="#888">遍历 s</text>
  </g>

  <!-- 否: 向右出去到返回 -->
  <path d="M350 256 L408 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="410" y="238" width="95" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="457" y="263" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>
  </g>

  <!-- 是: 向下 -->
  <path d="M260 292 L260 308" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="304" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 取价值 -->
  <g filter="url(#rough2)">
    <rect x="180" y="310" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="260" y="333" text-anchor="middle" font-size="13" fill="#333">v = val[c - 'a']</text>
  </g>
  <path d="M260 346 L260 360" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 状态转移 -->
  <g filter="url(#rough2)">
    <rect x="140" y="362" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="260" y="383" text-anchor="middle" font-size="13" fill="#333">cur=max(0,cur+v); ans=max(ans,cur)</text>
  </g>

  <!-- 回到循环 (左侧绕回) -->
  <path d="M140 378 L70 378 L70 256 L168 256" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="78" y="320" font-size="11" fill="#888" filter="url(#rough2)">下一字符</text>

</svg>
