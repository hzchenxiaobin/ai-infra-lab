<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [7,12,9,8,9,15]，k = 4</text>

  <!-- 表头 -->
  <text x="62" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">位 i</text>
  <text x="103" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="133" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="163" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="193" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="223" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="253" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="290" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="349" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt ≥ 4？</text>
  <text x="435" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans（二进制）</text>

  <!-- 行高亮：i=0 与 i=3 -->
  <rect x="36" y="64" width="448" height="26" fill="#fff8e1" rx="4" filter="url(#rough2)"/>
  <rect x="36" y="142" width="448" height="26" fill="#fff8e1" rx="4" filter="url(#rough2)"/>

  <!-- 行 i=0 -->
  <text x="62" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="88" y="64" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="103" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="118" y="64" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="133" y="82" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="148" y="64" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="163" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="178" y="64" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="193" y="82" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="208" y="64" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="223" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="238" y="64" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="253" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="349" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 置位</text>
  <text x="435" y="82" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0001</text>

  <!-- 行 i=1 -->
  <text x="62" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="88" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="103" y="108" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="118" y="90" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="133" y="108" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="148" y="90" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="163" y="108" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="178" y="90" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="193" y="108" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="208" y="90" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="108" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="238" y="90" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="253" y="108" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="108" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="349" y="108" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗ 跳过</text>
  <text x="435" y="108" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0001</text>

  <!-- 行 i=2 -->
  <text x="62" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="88" y="116" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="103" y="134" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="118" y="116" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="133" y="134" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="148" y="116" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="163" y="134" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="178" y="116" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="193" y="134" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="208" y="116" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="134" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="238" y="116" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="253" y="134" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="349" y="134" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗ 跳过</text>
  <text x="435" y="134" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0001</text>

  <!-- 行 i=3 -->
  <text x="62" y="160" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="88" y="142" width="30" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="160" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="118" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="133" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="148" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="163" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="178" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="193" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="208" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="223" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="238" y="142" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="253" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="160" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="349" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 置位</text>
  <text x="435" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1001</text>

  <!-- 行 i=4~31 -->
  <text x="62" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4~31</text>
  <rect x="88" y="168" width="180" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全部为 0（nums[i] &lt; 2³¹，无更高位）</text>
  <text x="290" y="186" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="349" y="186" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗ 跳过</text>
  <text x="435" y="186" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">1001</text>

  <!-- 结果横幅 -->
  <rect x="36" y="212" width="448" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">ans 逐步点亮：i=0 时 0001₂ → i=3 时 1001₂，其余位保持 0</text>
  <text x="260" y="260" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans = 1001₂ = 8 + 1 = 9 ✓（与示例 1 一致）</text>
</svg>
