<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM Users → SELECT 字符串函数组合 → ORDER BY user_id</text>

  <!-- Step 1: FROM -->
  <rect x="20" y="54" width="160" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① FROM Users</text>
  <text x="100" y="94" text-anchor="middle" font-size="9.5" fill="#333">读取全部用户行</text>
  <text x="100" y="110" text-anchor="middle" font-size="9" fill="#888">user_id | name</text>

  <path d="M182 88 L218 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: SELECT string functions -->
  <rect x="220" y="54" width="260" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="350" y="76" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">② SELECT 字符串函数</text>
  <text x="350" y="94" text-anchor="middle" font-size="9.5" fill="#333">user_id,</text>
  <text x="350" y="110" text-anchor="middle" font-size="9" fill="#333">CONCAT(UPPER(SUBSTRING(name,1,1)), LOWER(SUBSTRING(name,2))) AS name</text>

  <path d="M482 88 L518 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: ORDER BY -->
  <rect x="520" y="54" width="100" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="570" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ ORDER BY</text>
  <text x="570" y="94" text-anchor="middle" font-size="9.5" fill="#333">user_id</text>
  <text x="570" y="110" text-anchor="middle" font-size="9" fill="#888">升序排列</text>

  <!-- Arrow down to result -->
  <path d="M350 124 L350 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="180" y="152" width="340" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="350" y="174" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果（user_id | name）</text>

  <!-- Table header -->
  <rect x="210" y="182" width="120" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="9.5" fill="#888">user_id</text>
  <rect x="330" y="182" width="120" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="198" text-anchor="middle" font-size="9.5" fill="#888">name</text>

  <!-- Result rows -->
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="390" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Alice</text>
  <text x="270" y="242" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="390" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Bob</text>

  <!-- SQL execution order -->
  <rect x="20" y="152" width="140" height="100" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="90" y="174" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">SQL 执行顺序</text>
  <text x="35" y="194" font-size="9.5" fill="#555">FROM → SELECT</text>
  <text x="35" y="210" font-size="9.5" fill="#555">→ ORDER BY</text>
  <text x="35" y="226" font-size="9" fill="#888">SELECT 中的函数</text>
  <text x="35" y="240" font-size="9" fill="#888">在 FROM 后逐行计算</text>

  <!-- Function decomposition -->
  <rect x="20" y="270" width="600" height="136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">SELECT 表达式拆解（由内向外执行）</text>

  <rect x="40" y="304" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="320" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">第 1 层（最内）</text>
  <text x="120" y="336" text-anchor="middle" font-size="9" fill="#333">SUBSTRING(name, 1, 1)</text>

  <rect x="220" y="304" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">第 2 层</text>
  <text x="300" y="336" text-anchor="middle" font-size="9" fill="#333">UPPER(...) / LOWER(...)</text>

  <rect x="400" y="304" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="320" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">第 3 层（最外）</text>
  <text x="480" y="336" text-anchor="middle" font-size="9" fill="#333">CONCAT(..., ...)</text>

  <!-- Arrows between layers -->
  <path d="M200 324 L218 324" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M380 324 L398 324" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#333">函数嵌套由内向外：先 SUBSTRING 拆分 → 再 UPPER/LOWER 转换大小写 → 最后 CONCAT 拼接</text>
  <text x="320" y="390" text-anchor="middle" font-size="9.5" fill="#888">SUBSTRING(name, 2) 省略长度参数 → 取从第 2 个字符到末尾的全部子串</text>
</svg>
