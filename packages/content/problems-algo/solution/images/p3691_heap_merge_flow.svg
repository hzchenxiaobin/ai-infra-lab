<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：ST 表 O(1) 查值 + 大根堆弹 k 次</text>

  <!-- ① 稀疏表预处理 -->
  <rect x="110" y="40" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 稀疏表预处理 ST-max / ST-min</text>
  <text x="260" y="71" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">O(n log n) 建表 ⇒ 之后 O(1) 查询 v(l, r)</text>

  <path d="M 260 78 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 种子入堆 -->
  <rect x="105" y="90" width="310" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 种子入堆：每个 l 推入 (v(l, n−1), l, n−1)</text>

  <path d="M 260 120 L 260 132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="56" y="132" width="408" height="156" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="151" font-size="11" fill="#888" filter="url(#rough2)">重复 k 次</text>

  <!-- 弹堆顶 -->
  <rect x="92" y="162" width="196" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">弹出堆顶 (v, l, r)</text>
  <text x="190" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += v</text>

  <path d="M 288 184 L 308 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 r > l ? -->
  <polygon points="356,152 402,184 356,216 310,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r &gt; l ?</text>

  <!-- 是：推入前一个候选 -->
  <path d="M 356 216 L 356 234" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="364" y="230" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="276" y="234" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="255" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">推入 (v(l, r−1), l, r−1)</text>

  <!-- 回推后回到弹堆顶 -->
  <path d="M 276 251 L 190 251 L 190 210" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 否：此行列尽，直接回弹堆顶 -->
  <path d="M 356 152 L 356 142 L 190 142 L 190 160" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="273" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否：r = l，此行列尽</text>

  <!-- ③ 返回 -->
  <path d="M 260 288 L 260 300" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="300" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 返回 ans（long long）</text>

  <!-- 底部说明 -->
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⚠️ 堆顶弹到 0 ⇒ 剩余候选全为 0，可提前收工（值非负）</text>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k ≤ n(n+1)/2 ⇒ 堆永远不会被弹空</text>
</svg>
