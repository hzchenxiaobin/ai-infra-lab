    </marker>
  </defs>

  <rect width="560" height="436" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：8 行 → 逐行判周五 → 分桶求和 → 排序输出</text>

