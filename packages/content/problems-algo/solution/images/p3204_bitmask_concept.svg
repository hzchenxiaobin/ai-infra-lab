<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="392" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：位掩码的集合语义——「与」是交集，「或」是并集</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">permissions 的每个二进制位 = 一个独立权限开关：1 拥有 / 0 没有</text>

  <!-- 8 个位格子：bit7..bit0，值 5 = 00000101 -->
  <rect x="122" y="56" width="42" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="78" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="164" y="56" width="42" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="78" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="206" y="56" width="42" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="78" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="248" y="56" width="42" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="78" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>

  <rect x="290" y="56" width="42" height="34" fill="#fff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="78" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="332" y="56" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="56" width="42" height="34" fill="#fff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="78" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="416" y="56" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="143" y="103" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit7</text>
  <text x="185" y="103" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit6</text>
  <text x="227" y="103" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit5</text>
  <text x="269" y="103" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit4</text>
  <text x="311" y="103" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">bit3</text>
  <text x="353" y="103" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">bit2</text>
  <text x="395" y="103" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">bit1</text>
  <text x="437" y="103" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">bit0</text>

  <text x="206" y="117" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">未用到的高位恒为 0</text>
  <text x="311" y="117" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">值 8</text>
  <text x="353" y="117" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">值 4</text>
  <text x="395" y="117" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">值 2</text>
  <text x="437" y="117" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">值 1</text>

  <text x="290" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">如用户 1：permissions = 5 = 0101₂ → 拥有 {bit2(值4), bit0(值1)}，缺 bit3 和 bit1</text>

  <!-- 集合 ⇔ 位运算 对偶 -->
  <rect x="40" y="154" width="248" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="164" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">「所有用户都拥有」 ⇔ 按位与 &amp;</text>
  <text x="164" y="196" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">集合语言：∩ 交集（人人都有才保留）</text>
  <text x="164" y="212" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">逐位规则：该位所有用户全 1 → 结果为 1</text>
  <text x="164" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">SQL：BIT_AND(permissions)</text>

  <rect x="292" y="154" width="248" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">「任一用户拥有」 ⇔ 按位或 |</text>
  <text x="416" y="196" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">集合语言：∪ 并集（有人有就保留）</text>
  <text x="416" y="212" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">逐位规则：该位至少一个用户为 1 → 结果为 1</text>
  <text x="416" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">SQL：BIT_OR(permissions)</text>

  <rect x="40" y="252" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⚠️ 为什么与/或恰好对上交/并？</text>
  <text x="290" y="288" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">一个用户的权限集合 =「取值为 1 的那些位」；逐位 AND 恰好保留人人都有的位（交集），</text>
  <text x="290" y="304" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">逐位 OR 恰好保留至少一人有的位（并集）——位运算就是压缩版集合运算</text>

  <rect x="40" y="330" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">💡 别把位掩码当普通数字聚合：SUM(permissions)、AVG(permissions) 毫无意义，</text>
  <text x="290" y="366" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">BIT_AND / BIT_OR / BIT_COUNT 才是位掩码列的「求和」——聚合前先问列的语义</text>
</svg>
