<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：翻转奇偶 = 减一个「更小的奇数」，最小奇数定成败</text>

  <!-- 新约束框 -->
  <rect x="36" y="28" width="448" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="45" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">II 版新约束：nums1[i] − nums1[j] ≥ 1 ⟹ 减数必须严格更小（减大数得负差的路被堵死）</text>

  <!-- 法则 chips -->
  <rect x="64" y="60" width="138" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="133" y="75" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">减偶数 → 奇偶不变</text>
  <rect x="214" y="60" width="138" height="22" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="283" y="75" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">减奇数 → 奇偶翻转</text>
  <text x="360" y="75" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 翻转奇偶的唯一途径</text>

  <!-- 分支箭头 -->
  <path d="M 140 84 L 140 92" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 379 84 L 379 92" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左面板：目标全奇 -->
  <rect x="28" y="94" width="225" height="186" rx="10" fill="#f6f9fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="38" y="104" width="205" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="119" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">目标 A：全奇（有奇数时的主攻）</text>

  <rect x="62" y="136" width="38" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="81" y="154" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="136" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="123" y="154" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="146" y="136" width="38" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="154" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="81" y="170" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="123" y="170" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="165" y="170" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <text x="38" y="188" font-size="10" fill="#333" filter="url(#rough2)">奇位(1,7)：操作一照抄</text>
  <text x="38" y="204" font-size="10" fill="#333" filter="url(#rough2)">偶位(4)：翻转须减「更小的奇数」</text>
  <text x="38" y="220" font-size="10" fill="#333" filter="url(#rough2)">4 − min奇(1) = 3，差 3 ≥ 1 ✓</text>

  <rect x="38" y="230" width="205" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums2 = [1,3,7] → 全奇 ✓</text>
  <text x="140" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">前提：每个偶数都大于最小奇数</text>

  <!-- 右面板：目标全偶 -->
  <rect x="267" y="94" width="225" height="186" rx="10" fill="#fdf9ef" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="277" y="104" width="205" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="119" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">目标 B：全偶（近乎不可达）</text>

  <rect x="312" y="136" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="331" y="154" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="354" y="136" width="38" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="373" y="154" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="331" y="170" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="373" y="170" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>

  <text x="277" y="188" font-size="10" fill="#333" filter="url(#rough2)">奇位(3)想变偶：须减更小的奇数</text>
  <text x="277" y="204" font-size="10" fill="#333" filter="url(#rough2)">可 3 自己就是最小奇数 → 卡死 ✗</text>
  <text x="277" y="220" font-size="10" fill="#333" filter="url(#rough2)">最小奇数自身永远无法翻转</text>

  <rect x="277" y="230" width="205" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="379" y="246" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">仅当数组不含奇数时才可行</text>
  <text x="379" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">[2,3]：全偶失败，全奇也失败 → false</text>

  <!-- 汇合箭头 -->
  <path d="M 140 282 L 226 306" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 379 282 L 294 306" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="30" y="304" width="460" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">合成判据：全偶 ⟹ true；含奇数 ⟹ min(nums1) 为奇数才 true</text>
  <text x="260" y="341" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">一行代码：all(x % 2 == 0) or min(nums1) % 2 == 1</text>
</svg>
