<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前缀和奇偶性：奇偶不同 ⟺ 子数组和为奇数</text>

  <!-- arr row -->
  <text x="40" y="74" font-size="12" fill="#888">arr:</text>
  <rect x="95" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="120" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>

  <!-- prefix row -->
  <text x="40" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="45" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="95" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="145" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="195" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333">9</text>

  <text x="70" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[0]</text>
  <text x="120" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[1]</text>
  <text x="170" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[2]</text>
  <text x="220" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[3]</text>

  <!-- parity row: 0=偶(green), 1=奇(orange) -->
  <text x="40" y="214" font-size="12" fill="#888">% 2 :</text>
  <rect x="45" y="198" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <rect x="95" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>
  <rect x="145" y="198" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶</text>
  <rect x="195" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇</text>

  <!-- arcs: different parity pairs → odd sum -->
  <!-- p[0]偶 ↔ p[1]奇 → [1] sum=1 -->
  <path d="M 70 230 Q 70 244 95 244 L 120 230" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="95" y="256" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[1]→1 ✓</text>

  <!-- p[1]奇 ↔ p[2]偶 → [3] sum=3 -->
  <path d="M 120 230 Q 120 270 145 270 L 170 230" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="145" y="282" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">[3]→3 ✓</text>

  <!-- p[2]偶 ↔ p[3]奇 → [5] sum=5 -->
  <path d="M 170 230 Q 170 244 195 244 L 220 230" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="195" y="256" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[5]→5 ✓</text>

  <!-- p[0]偶 ↔ p[3]奇 → [1,3,5] sum=9 (big arc) -->
  <path d="M 70 230 Q 70 300 145 300 L 220 230" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="145" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">[1,3,5]→9 ✓</text>

  <!-- equation box -->
  <rect x="290" y="198" width="210" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="395" y="220" text-anchor="middle" font-size="11" fill="#333">sum(i,j) = p[j+1] − p[i]</text>
  <text x="395" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇数和 ⟺ p[j+1] 与 p[i]</text>
  <text x="395" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇偶性不同</text>
  <text x="395" y="284" text-anchor="middle" font-size="10" fill="#888">偶−奇=奇 | 奇−偶=奇</text>

  <!-- summary -->
  <rect x="40" y="328" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">答案 = 异奇偶前缀和对数 = 偶数个数 × 奇数个数</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#888">本题：偶 2 个 × 奇 2 个 = 4 ✓</text>
</svg>
