<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一次查询的三种情况（归一化：x = min(a,b)，y = max(a,b)）</text>

  <!-- ============ 情况 ① ============ -->
  <rect x="18" y="70" width="62" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="49" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">情况 ①</text>

  <rect x="140" y="60" width="40" height="52" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="153" cy="51" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="153" y="54.5" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">A</text>
  <circle cx="169" cy="51" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="169" y="54.5" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="160" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x = y</text>

  <text x="214" y="76" font-size="12" fill="#333" filter="url(#rough2)">x == y：两人已在同一栋楼</text>
  <text x="214" y="97" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 = x（示例 [2,2] → 2）</text>

  <!-- ============ 情况 ② ============ -->
  <rect x="18" y="154" width="62" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="49" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">情况 ②</text>

  <rect x="130" y="158" width="36" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="126" width="36" height="76" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="148" cy="150" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="148" y="153.5" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">A</text>
  <circle cx="228" cy="118" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="121.5" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="148" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x</text>
  <text x="228" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">y</text>

  <path d="M 158 144 Q 186 106 216 114" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="292" y="156" font-size="12" fill="#333" filter="url(#rough2)">heights[x] &lt; heights[y]：x 可直接走到 y</text>
  <text x="292" y="177" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 = y（示例 [1,6] → 6）</text>

  <!-- ============ 情况 ③ ============ -->
  <rect x="18" y="268" width="62" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="49" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">情况 ③</text>

  <!-- 阈值虚线 h -->
  <path d="M 108 252 L 420 252" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="424" y="256" font-size="11" fill="#d6a040" filter="url(#rough2)">h = heights[x]</text>

  <!-- 楼群，基线 y=342 -->
  <rect x="120" y="252" width="36" height="90" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="284" width="36" height="58" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="296" width="36" height="46" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="294" y="232" width="36" height="110" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="352" y="288" width="36" height="54" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 46 342 L 420 342" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="138" cy="244" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="138" y="247.5" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">A</text>
  <circle cx="196" cy="276" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="196" y="279.5" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">B</text>

  <path d="M 146 238 Q 220 194 300 226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 270 Q 252 244 302 224" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="254" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="312" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="138" y="358" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x</text>
  <text x="196" y="358" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">y</text>
  <text x="312" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">t（最左达标）</text>

  <!-- 底部注释 -->
  <rect x="26" y="368" width="468" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">情况③ heights[x] ≥ heights[y]：x 到不了 y，两人只能一起向右走</text>
  <text x="260" y="395" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">→ 找最左 t &gt; y 使 heights[t] &gt; h（h = heights[x]），即「y 右侧第一个更大」的批量带阈值版</text>
</svg>
