<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：因子成对出现 (i, n/i)，以 √n 为界，只需扫到 √n</text>

  <!-- ===== n = 12 box at top ===== -->
  <rect x="248" y="44" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n = 12</text>

  <!-- column headers -->
  <text x="140" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">小因子 i ≤ √n</text>
  <text x="140" y="120" text-anchor="middle" font-size="10" fill="#888">（升序，前向扫描）</text>

  <text x="420" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">大因子 n/i</text>
  <text x="420" y="120" text-anchor="middle" font-size="10" fill="#888">（降序，需反序）</text>

  <!-- √n divider -->
  <line x1="280" y1="100" x2="280" y2="300" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <rect x="244" y="296" width="72" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">√12 ≈ 3.46</text>

  <!-- ===== Pair row 1: i=1 ↔ 12 ===== -->
  <rect x="116" y="140" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="161" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="396" y="140" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="161" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">12</text>

  <path d="M 164 156 Q 280 156 396 156" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="9" fill="#888">配对 1×12=12</text>

  <!-- ===== Pair row 2: i=2 ↔ 6 ===== -->
  <rect x="116" y="190" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="211" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="396" y="190" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="211" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">6</text>

  <path d="M 164 206 Q 280 206 396 206" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="9" fill="#888">配对 2×6=12</text>

  <!-- ===== Pair row 3: i=3 ↔ 4 ===== -->
  <rect x="116" y="240" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="261" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="396" y="240" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="261" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>

  <path d="M 164 256 Q 280 256 396 256" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="9" fill="#888">配对 3×4=12</text>

  <!-- arrow down to conclusion -->
  <path d="M 280 330 Q 280 342 280 352" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: scan range + order ===== -->
  <rect x="40" y="356" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">① 只扫 i = 1..⌊√n⌋</text>
  <text x="56" y="394" font-size="10.5" fill="#555">⌊√12⌋ = 3 → 仅 3 次试除</text>
  <text x="56" y="410" font-size="10.5" fill="#555">每次同时锁定一对因子</text>

  <rect x="290" y="356" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="306" y="376" font-size="11" fill="#d6a040" font-weight="bold">② 升序 = 小因子 + 反序大因子</text>
  <text x="306" y="394" font-size="10.5" fill="#555">[1,2,3] + reverse([12,6,4])</text>
  <text x="306" y="410" font-size="10.5" fill="#555">= [1,2,3,4,6,12] ✓</text>
</svg>
