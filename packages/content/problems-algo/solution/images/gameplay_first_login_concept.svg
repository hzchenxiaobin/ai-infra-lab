<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">GROUP BY + MIN：按 player_id 分桶，每桶取最小 event_date</text>

  <!-- Activity table (left) -->
  <text x="100" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Activity（源表）</text>
  <rect x="30" y="64" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="82" font-size="10" fill="#333">player_id</text>
  <text x="130" y="82" font-size="10" fill="#333">event_date</text>
  <line x1="100" y1="64" x2="100" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="92" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="107" font-size="10" fill="#333">1</text>
  <text x="130" y="107" font-size="10" fill="#333">2016-03-01</text>
  <line x1="100" y1="92" x2="100" y2="114" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="114" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="129" font-size="10" fill="#333">1</text>
  <text x="130" y="129" font-size="10" fill="#999">2016-05-02</text>
  <line x1="100" y1="114" x2="100" y2="136" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="136" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="151" font-size="10" fill="#333">2</text>
  <text x="130" y="151" font-size="10" fill="#333">2017-06-25</text>
  <line x1="100" y1="136" x2="100" y2="158" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="158" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="173" font-size="10" fill="#333">3</text>
  <text x="130" y="173" font-size="10" fill="#333">2016-03-02</text>
  <line x1="100" y1="158" x2="100" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="180" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="195" font-size="10" fill="#333">3</text>
  <text x="130" y="195" font-size="10" fill="#999">2018-07-03</text>
  <line x1="100" y1="180" x2="100" y2="202" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- group brackets -->
  <path d="M175 103 L185 103 L185 125 L175 125" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M175 147 L185 147 L185 147 L175 147" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M175 169 L185 169 L185 191 L175 191" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- arrows to result -->
  <path d="M190 114 L360 114" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M190 147 L360 147" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M190 180 L360 180" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="275" y="108" text-anchor="middle" font-size="9.5" fill="#b85450">MIN → 2016-03-01</text>
  <text x="275" y="141" text-anchor="middle" font-size="9.5" fill="#4a7a3a">MIN → 2017-06-25</text>
  <text x="275" y="174" text-anchor="middle" font-size="9.5" fill="#d6a040">MIN → 2016-03-02</text>

  <!-- Result table (right) -->
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结果（每玩家一行）</text>
  <rect x="370" y="64" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="82" font-size="10" fill="#333">player_id</text>
  <text x="460" y="82" font-size="10" fill="#333">first_login</text>
  <line x1="435" y1="64" x2="435" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="92" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="108" font-size="10" fill="#333">1</text>
  <text x="460" y="108" font-size="10" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="435" y1="92" x2="435" y2="116" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="116" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="132" font-size="10" fill="#333">2</text>
  <text x="460" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <line x1="435" y1="116" x2="435" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="140" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="156" font-size="10" fill="#333">3</text>
  <text x="460" y="156" font-size="10" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <line x1="435" y1="140" x2="435" y2="164" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Callout -->
  <rect x="80" y="250" width="400" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">GROUP BY 的两步合一</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#333">① GROUP BY player_id：同 player_id 的行进同一桶</text>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#333">② MIN(event_date)：每桶取最小日期 = 首次登录</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">非分组列必须套聚合函数才能 SELECT</text>
</svg>
