<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逆序一趟，边填答案边维护后缀最大值</text>

  <!-- Step 1: init -->
  <rect x="200" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">maxRight = -1</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop condition (diamond) -->
  <polygon points="280,104 360,140 280,176 200,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333">i ≥ 0 ?</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#333">(逆序未结束)</text>

  <!-- No branch -> return -->
  <path d="M 360 140 L 470 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="124" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="145" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch -> step 3 -->
  <path d="M 280 176 L 280 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: ans[i] = maxRight -->
  <rect x="180" y="200" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#333">ans[i] = maxRight</text>
  <path d="M 280 234 L 280 254" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: maxRight = max(maxRight, arr[i]) -->
  <rect x="150" y="258" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333">maxRight = max(maxRight, arr[i])</text>
  <path d="M 280 292 L 280 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: i-- -->
  <rect x="220" y="316" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#333">i = i - 1</text>

  <!-- loop back arrow -->
  <path d="M 220 333 L 110 333 L 110 140 L 200 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="240" font-size="11" fill="#888" font-weight="bold">回到判定</text>

  <!-- Bottom note -->
  <rect x="50" y="368" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="388" font-size="11" fill="#555">关键顺序：先用旧 maxRight 填答案，再用 arr[i] 更新 maxRight——</text>
  <text x="64" y="402" font-size="11" fill="#555">先填后更，保证 ans[i] 严格来自「右侧」而非包含自身。</text>
</svg>
