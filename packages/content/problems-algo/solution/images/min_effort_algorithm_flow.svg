<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案 + BFS 连通性判定（在阈值 t 上二分）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=0, hi=max−min, ans=hi</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,104 372,150 270,196 168,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> end -->
  <path d="M 372 150 L 452 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="150" y="218" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2  （候选阈值 t）</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- BFS check -->
  <rect x="96" y="274" width="348" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="293" text-anchor="middle" font-size="12" fill="#333">BFS/DFS：从 (0,0) 出发，只走 |Δh| ≤ mid 的边</text>
  <text x="270" y="309" text-anchor="middle" font-size="11" fill="#666">check(mid) = 能否到达 (m−1, n−1)？</text>

  <!-- arrow down -->
  <path d="M 270 318 L 270 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: reachable? -->
  <polygon points="270,340 384,388 270,436 156,388" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="12" fill="#333">check(mid) ?</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#666">(能到达终点吗)</text>

  <!-- Yes (feasible) -> try smaller -->
  <path d="M 156 388 L 96 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="380" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="12" y="368" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="386" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="54" y="402" text-anchor="middle" font-size="11" fill="#555">hi = mid − 1</text>

  <!-- No (unreachable) -> try bigger -->
  <path d="M 384 388 L 444 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="380" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="444" y="368" width="84" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="394" text-anchor="middle" font-size="11" fill="#333">lo = mid + 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 54 368 L 54 150 L 168 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 46 250)">阈值偏大，试更小</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 486 368 L 486 150 L 372 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 494 250)">阈值偏小，试更大</text>

  <!-- summary note -->
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#888">关键：reachable(t) 单调不减 → 二段性；每次 O(mn) BFS 判连通，共 O(log(maxDiff)) 次</text>
</svg>
