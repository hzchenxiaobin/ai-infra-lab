<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：26 字母 → 固定长度频率数组（直接寻址）</text>

  <!-- Definition box -->
  <rect x="60" y="42" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">几乎相等 ⟺ ∀ c ∈ {a..z}: |freq₁(c) − freq₂(c)| ≤ 3</text>

  <!-- Array label -->
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">freq[26]：直接寻址表（下标 = c − 'a'）</text>

  <!-- 26 cells a..z -->
  <g filter="url(#rough2)">
    <rect x="46" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="55" y="126" text-anchor="middle" font-size="9.5" fill="#333">a</text>
    <rect x="64" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="73" y="126" text-anchor="middle" font-size="9.5" fill="#333">b</text>
    <rect x="82" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="91" y="126" text-anchor="middle" font-size="9.5" fill="#333">c</text>
    <rect x="100" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="109" y="126" text-anchor="middle" font-size="9.5" fill="#333">d</text>
    <rect x="118" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="127" y="126" text-anchor="middle" font-size="9.5" fill="#333">e</text>
    <rect x="136" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="145" y="126" text-anchor="middle" font-size="9.5" fill="#333">f</text>
    <rect x="154" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="163" y="126" text-anchor="middle" font-size="9.5" fill="#333">g</text>
    <rect x="172" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="181" y="126" text-anchor="middle" font-size="9.5" fill="#333">h</text>
    <rect x="190" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="199" y="126" text-anchor="middle" font-size="9.5" fill="#333">i</text>
    <rect x="208" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="217" y="126" text-anchor="middle" font-size="9.5" fill="#333">j</text>
    <rect x="226" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="235" y="126" text-anchor="middle" font-size="9.5" fill="#333">k</text>
    <rect x="244" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="253" y="126" text-anchor="middle" font-size="9.5" fill="#333">l</text>
    <rect x="262" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="271" y="126" text-anchor="middle" font-size="9.5" fill="#333">m</text>
    <rect x="280" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="289" y="126" text-anchor="middle" font-size="9.5" fill="#333">n</text>
    <rect x="298" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="307" y="126" text-anchor="middle" font-size="9.5" fill="#333">o</text>
    <rect x="316" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="325" y="126" text-anchor="middle" font-size="9.5" fill="#333">p</text>
    <rect x="334" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="343" y="126" text-anchor="middle" font-size="9.5" fill="#333">q</text>
    <rect x="352" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="361" y="126" text-anchor="middle" font-size="9.5" fill="#333">r</text>
    <rect x="370" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="379" y="126" text-anchor="middle" font-size="9.5" fill="#333">s</text>
    <rect x="388" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="397" y="126" text-anchor="middle" font-size="9.5" fill="#333">t</text>
    <rect x="406" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="415" y="126" text-anchor="middle" font-size="9.5" fill="#333">u</text>
    <rect x="424" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="433" y="126" text-anchor="middle" font-size="9.5" fill="#333">v</text>
    <rect x="442" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="451" y="126" text-anchor="middle" font-size="9.5" fill="#333">w</text>
    <rect x="460" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="469" y="126" text-anchor="middle" font-size="9.5" fill="#333">x</text>
    <rect x="478" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="487" y="126" text-anchor="middle" font-size="9.5" fill="#333">y</text>
    <rect x="496" y="108" width="18" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="505" y="126" text-anchor="middle" font-size="9.5" fill="#333">z</text>
  </g>

  <!-- Array sub-label -->
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">长度恒为 26，与字符串长度 n 无关 → O(1) 空间</text>

  <!-- Threshold label -->
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">阈值判定：|Δ| 落在 [−3, +3]（绿）合法，超出（红）非法</text>

  <!-- Threshold band -->
  <g filter="url(#rough2)">
    <rect x="80" y="200" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="105" y="216" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">非法</text>
    <rect x="130" y="200" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="280" y="216" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">合法区间 [−3, +3]</text>
    <rect x="430" y="200" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="455" y="216" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">非法</text>

    <!-- tick marks -->
    <line x1="80" y1="222" x2="80" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="130" y1="222" x2="130" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="180" y1="222" x2="180" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="230" y1="222" x2="230" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="280" y1="222" x2="280" y2="232" stroke="#666" stroke-width="1.6"/>
    <line x1="330" y1="222" x2="330" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="380" y1="222" x2="380" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="430" y1="222" x2="430" y2="230" stroke="#666" stroke-width="1.2"/>
    <line x1="480" y1="222" x2="480" y2="230" stroke="#666" stroke-width="1.2"/>

    <!-- tick labels -->
    <text x="80" y="244" text-anchor="middle" font-size="9" fill="#555">−4</text>
    <text x="130" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">−3</text>
    <text x="180" y="244" text-anchor="middle" font-size="9" fill="#555">−2</text>
    <text x="230" y="244" text-anchor="middle" font-size="9" fill="#555">−1</text>
    <text x="280" y="244" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">0</text>
    <text x="330" y="244" text-anchor="middle" font-size="9" fill="#555">1</text>
    <text x="380" y="244" text-anchor="middle" font-size="9" fill="#555">2</text>
    <text x="430" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="480" y="244" text-anchor="middle" font-size="9" fill="#555">4</text>
  </g>

  <!-- Caption -->
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">26 个字母各自独立判定；全部 |Δ| ≤ 3 才返回 true</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字母表大小 |Σ| = 26 为常数 → 数组即完美哈希，无需 HashMap</text>
  <text x="280" y="320" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（对比：242 字母异位词 = 阈值取 0 的特例）</text>
</svg>
