<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遇 ')' 弹栈至 '(' 并原样压回</text>

  <!-- Start -->
  <rect x="200" y="42" width="140" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始：stk = []</text>
  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="215" y="88" width="110" height="26" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#333">取字符 c = s[i++]</text>
  <path d="M 270 114 L 270 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c == ')' ? -->
  <polygon points="270,130 332,160 270,190 208,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c == ')' ?</text>
  <text x="270" y="174" text-anchor="middle" font-size="9" fill="#888">否 / 是</text>

  <!-- No branch arrow -->
  <path d="M 208 160 L 182 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch arrow -->
  <path d="M 332 160 L 358 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- No box: 字母或 '(' 压栈 -->
  <rect x="30" y="200" width="150" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">字母 或 '('</text>
  <line x1="40" y1="230" x2="170" y2="230" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="105" y="252" text-anchor="middle" font-size="11" fill="#333">压栈</text>
  <text x="105" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">stk.push(c)</text>

  <!-- Yes box: 弹栈至 '(' -->
  <rect x="360" y="200" width="150" height="86" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="220" text-anchor="middle" font-size="11" fill="#333">弹栈至 '(' 收集 tmp</text>
  <line x1="370" y1="228" x2="500" y2="228" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="435" y="246" text-anchor="middle" font-size="11" fill="#333">丢弃 '('</text>
  <text x="435" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">原样压回 tmp</text>
  <text x="435" y="282" text-anchor="middle" font-size="9" fill="#888">(已是反转结果)</text>

  <!-- converge arrows -->
  <path d="M 105 286 L 105 308 L 270 308" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 435 286 L 435 308 L 270 308" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 308 L 270 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="270,324 326,348 270,372 214,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>

  <!-- 是: loop back up -->
  <path d="M 326 348 L 512 348 L 512 101 L 327 101" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="524" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(90 524 225)">是 → 取下一字符</text>

  <!-- 否: 返回 -->
  <path d="M 270 372 L 270 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="386" width="150" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="401" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否 → 返回 join(stk)</text>
</svg>
