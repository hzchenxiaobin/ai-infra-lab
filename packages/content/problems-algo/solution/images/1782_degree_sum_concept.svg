<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：cnt(a,b) = deg[a] + deg[b] − c(a,b)</text>

  <!-- Node a -->
  <circle cx="135" cy="180" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="186" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <!-- Node b -->
  <circle cx="385" cy="180" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="186" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">b</text>

  <!-- Stubs from a (3 = deg[a]) -->
  <line x1="135" y1="180" x2="55" y2="110" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="135" y1="180" x2="45" y2="180" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="135" y1="180" x2="55" y2="250" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="100" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">deg[a]=3</text>

  <!-- Stubs from b (4 = deg[b]) -->
  <line x1="385" y1="180" x2="465" y2="110" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="385" y1="180" x2="475" y2="160" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="385" y1="180" x2="475" y2="200" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="385" y1="180" x2="465" y2="250" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">deg[b]=4</text>

  <!-- Multi-edge a-b (c=2, highlighted red) -->
  <line x1="155" y1="172" x2="363" y2="172" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="155" y1="190" x2="363" y2="190" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">c(a,b)=2 重边（在 deg 和里被算两次）</text>

  <!-- Formula box -->
  <rect x="60" y="295" width="400" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">deg[a] + deg[b] = 3 + 4 = 7</text>
  <text x="260" y="345" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">cnt = 7 − 2 = 5（与 a 或 b 相连的边数）</text>
</svg>
