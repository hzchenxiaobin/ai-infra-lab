<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 镜像配对：dfs(L,R) 奇数层换值，再「镜像交叉」下钻</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">初始 dfs(root.left, root.right, 1)：L、R 镜像对称，配对天然覆盖整层</text>

  <!-- ===== edges to root ===== -->
  <line x1="270" y1="62" x2="175" y2="110" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="62" x2="365" y2="110" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <!-- root context -->
  <circle cx="270" cy="58" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">root</text>
  <text x="270" y="78" text-anchor="middle" font-size="8" fill="#446688">L0 不动</text>

  <!-- ===== L1: L & R (odd -> swap) ===== -->
  <text x="40" y="118" font-size="9" fill="#d6a040" font-weight="bold">L1* 奇</text>
  <circle cx="175" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L</text>
  <circle cx="365" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">R</text>
  <!-- swap arc L<->R (red, double) -->
  <path d="M 161 109 Q 270 86 379 109" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 379 115 Q 270 100 161 115" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">swap(L.val, R.val)</text>

  <!-- ===== L2: children (even -> no swap, pair & descend) ===== -->
  <text x="40" y="190" font-size="9" fill="#446688" font-weight="bold">L2 偶</text>
  <line x1="175" y1="127" x2="115" y2="180" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="175" y1="127" x2="235" y2="180" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="127" x2="305" y2="180" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="127" x2="425" y2="180" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <!-- L's children (blue) -->
  <circle cx="115" cy="184" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="188" text-anchor="middle" font-size="8" fill="#446688">L.left</text>
  <circle cx="235" cy="184" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="188" text-anchor="middle" font-size="8" fill="#446688">L.right</text>
  <!-- R's children (green) -->
  <circle cx="305" cy="184" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a">R.left</text>
  <circle cx="425" cy="184" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a">R.right</text>

  <!-- cross-pairing arcs at L2 (gray: pair & descend, NO swap) -->
  <path d="M 121 196 Q 270 232 419 196" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 419 200 Q 270 224 121 200" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 241 196 Q 270 214 299 196" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 299 200 Q 270 216 241 200" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="9" fill="#888">外层 dfs(L.left, R.right) · 内层 dfs(L.right, R.left)</text>

  <!-- ===== L3: grandchildren (odd -> swap) ===== -->
  <text x="40" y="270" font-size="9" fill="#d6a040" font-weight="bold">L3* 奇</text>
  <!-- children of L.left & R.right (outer pair) -->
  <line x1="115" y1="196" x2="95" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="196" x2="135" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="425" y1="196" x2="405" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="425" y1="196" x2="445" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="95" cy="266" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="135" cy="266" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="405" cy="266" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="445" cy="266" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- outer swap arcs -->
  <path d="M 87 270 Q 270 300 453 270" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 127 272 Q 270 290 413 272" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- children of L.right & R.left (inner pair) -->
  <line x1="235" y1="196" x2="215" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="235" y1="196" x2="255" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="196" x2="285" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="305" y1="196" x2="325" y2="260" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="215" cy="266" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="255" cy="266" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="285" cy="266" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="325" cy="266" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- inner swap arcs -->
  <path d="M 207 270 Q 270 286 333 270" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 247 272 Q 270 280 293 272" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== bottom legend ===== -->
  <rect x="30" y="316" width="480" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">镜像交叉 = L.left↔R.right（外）、L.right↔R.left（内）</text>
  <text x="50" y="356" font-size="10" fill="#555">• dfs(L,R,depth)：if depth 奇 → swap(L.val, R.val)</text>
  <text x="50" y="372" font-size="10" fill="#555">• 然后递归 dfs(L.left, R.right, depth+1) 与 dfs(L.right, R.left, depth+1)</text>
  <text x="50" y="388" font-size="10" fill="#555">• 镜像配对逐层覆盖每个对称位置 → 整层反转；完美树保证 L/R 子树同形</text>
</svg>
