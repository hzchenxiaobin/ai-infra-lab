<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="400" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 a + 无零判定</text>

  <rect x="185" y="36" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="250" y="56" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 n</text>
  <path d="M 250 66 L 250 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="195" y="86" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a = 1</text>
  <path d="M 250 116 L 250 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 250 134 L 336 162 L 250 190 L 164 162 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a &lt; n ?</text>
  <text x="346" y="158" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 336 162 L 380 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="382" y="148" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无解（不应发生）</text>

  <text x="262" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 250 190 L 250 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="208" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b = n − a</text>
  <path d="M 250 238 L 250 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 250 256 L 376 286 L 250 316 L 124 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">hasZero(a) 或 hasZero(b)?</text>

  <text x="386" y="282" font-size="11" fill="#b85450" font-weight="bold">是（含零）</text>
  <path d="M 376 286 L 420 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="422" y="272" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="452" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a++</text>
  <path d="M 452 300 L 452 162 L 340 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="262" y="326" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 250 316 L 250 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="336" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="250" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 [a, b]</text>

  <rect x="40" y="372" width="420" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="386" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">hasZero(x)：逐位 x%10==0 则返回 true，x/=10 直到 x==0</text>
</svg>
