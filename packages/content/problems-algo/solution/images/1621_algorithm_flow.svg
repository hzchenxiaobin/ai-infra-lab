<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理阶乘 + O(1) 查询 C(n+k-1, 2k)</text>

  <!-- Step 1 -->
  <rect x="150" y="48" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 令 N = n + k − 1</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">组合数上界，最大 ≤ 1998</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="112" width="320" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 预处理阶乘 fact[0..N]</text>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">fact[i] = fact[i−1] · i  mod p</text>

  <path d="M 280 162 L 280 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="184" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 预处理逆阶乘 inv_fact[0..N]</text>
  <text x="280" y="220" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">inv_fact[N] = fact[N]^(p−2) mod p  （费马小定理）</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">倒推：inv_fact[i−1] = inv_fact[i] · i  mod p</text>

  <path d="M 280 242 L 280 260" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 (highlight) -->
  <rect x="70" y="264" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">④ 返回 fact[N] · inv_fact[2k] · inv_fact[N−2k] mod p</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= C(n+k−1, 2k)</text>

  <!-- Side annotations -->
  <g filter="url(#rough2)">
    <rect x="430" y="120" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
  </g>
  <g font-size="9" fill="#b85450">
    <text x="485" y="136" text-anchor="middle" filter="url(#rough2)">O(n) 一趟</text>
    <text x="485" y="150" text-anchor="middle" filter="url(#rough2)">N ≤ 1998</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="430" y="276" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
  </g>
  <g font-size="9" fill="#b85450">
    <text x="485" y="292" text-anchor="middle" filter="url(#rough2)">O(1) 查询</text>
    <text x="485" y="306" text-anchor="middle" filter="url(#rough2)">三数组乘法</text>
  </g>

  <!-- Bottom note -->
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p = 10⁹ + 7 为素数 → 可用费马小定理求模逆</text>
</svg>
