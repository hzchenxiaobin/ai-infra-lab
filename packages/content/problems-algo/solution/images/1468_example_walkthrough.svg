<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三家公司分级定税率 + 税后工资逐行计算</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">先 GROUP BY 求每公司 max(salary) 定档 → CASE 映射 tax_rate → 每员工 salary × (1 − rate) 取整</text>

  <!-- ============ Company 1 column (red, 49%) ============ -->
  <rect x="20" y="60" width="190" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="80" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">公司 1</text>
  <text x="115" y="98" text-anchor="middle" font-size="10" fill="#555">max(salary) = 21300</text>
  <text x="115" y="115" text-anchor="middle" font-size="10" fill="#555">落入档位 ③ (&gt;10000)</text>
  <text x="115" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">tax_rate = 0.49</text>

  <!-- Table header -->
  <rect x="20" y="144" width="190" height="20" fill="#b85450" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">employee</text>
  <text x="115" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">salary</text>
  <text x="175" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">after</text>

  <!-- Rows -->
  <rect x="20" y="164" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="10" fill="#555">Tony</text>
  <text x="115" y="178" text-anchor="middle" font-size="10" fill="#555">2000</text>
  <text x="175" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1020</text>

  <rect x="20" y="184" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60" y="198" text-anchor="middle" font-size="10" fill="#555">Pronub</text>
  <text x="115" y="198" text-anchor="middle" font-size="10" fill="#555">21300</text>
  <text x="175" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10863</text>

  <rect x="20" y="204" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="10" fill="#555">Tyrrox</text>
  <text x="115" y="218" text-anchor="middle" font-size="10" fill="#555">10800</text>
  <text x="175" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5508</text>

  <text x="115" y="240" text-anchor="middle" font-size="9" fill="#888" font-style="italic">2000×0.51=1020</text>

  <!-- ============ Company 2 column (green, 0%) ============ -->
  <rect x="215" y="60" width="190" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">公司 2</text>
  <text x="310" y="98" text-anchor="middle" font-size="10" fill="#555">max(salary) = 700</text>
  <text x="310" y="115" text-anchor="middle" font-size="10" fill="#555">落入档位 ① (&lt;1000)</text>
  <text x="310" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">tax_rate = 0</text>

  <rect x="215" y="144" width="190" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">employee</text>
  <text x="310" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">salary</text>
  <text x="370" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">after</text>

  <rect x="215" y="164" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="255" y="178" text-anchor="middle" font-size="10" fill="#555">Pam</text>
  <text x="310" y="178" text-anchor="middle" font-size="10" fill="#555">300</text>
  <text x="370" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">300</text>

  <rect x="215" y="184" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="255" y="198" text-anchor="middle" font-size="10" fill="#555">Bassem</text>
  <text x="310" y="198" text-anchor="middle" font-size="10" fill="#555">450</text>
  <text x="370" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">450</text>

  <rect x="215" y="204" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="255" y="218" text-anchor="middle" font-size="10" fill="#555">Hermione</text>
  <text x="310" y="218" text-anchor="middle" font-size="10" fill="#555">700</text>
  <text x="370" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">700</text>

  <text x="310" y="240" text-anchor="middle" font-size="9" fill="#888" font-style="italic">salary×1.0=salary</text>

  <!-- ============ Company 3 column (orange, 24%) ============ -->
  <rect x="410" y="60" width="190" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">公司 3</text>
  <text x="505" y="98" text-anchor="middle" font-size="10" fill="#555">max(salary) = 7777</text>
  <text x="505" y="115" text-anchor="middle" font-size="10" fill="#555">落入档位 ② [1000,10000]</text>
  <text x="505" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">tax_rate = 0.24</text>

  <rect x="410" y="144" width="190" height="20" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">employee</text>
  <text x="505" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">salary</text>
  <text x="565" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">after</text>

  <rect x="410" y="164" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="450" y="178" text-anchor="middle" font-size="10" fill="#555">Bocaben</text>
  <text x="505" y="178" text-anchor="middle" font-size="10" fill="#555">100</text>
  <text x="565" y="178" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">76</text>

  <rect x="410" y="184" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="450" y="198" text-anchor="middle" font-size="10" fill="#555">Ognjen</text>
  <text x="505" y="198" text-anchor="middle" font-size="10" fill="#555">2200</text>
  <text x="565" y="198" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1672</text>

  <rect x="410" y="204" width="190" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="450" y="218" text-anchor="middle" font-size="10" fill="#555">Nyancat</text>
  <text x="505" y="218" text-anchor="middle" font-size="10" fill="#555">3300</text>
  <text x="565" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2508</text>

  <!-- Morninngcat highlighted row - rounding case -->
  <rect x="410" y="224" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="9" fill="#b85450">Mornin..</text>
  <text x="505" y="238" text-anchor="middle" font-size="10" fill="#555">7777</text>
  <text x="565" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5911</text>

  <text x="505" y="260" text-anchor="middle" font-size="9" fill="#b85450" font-style="italic">7777×0.76=5910.52</text>
  <text x="505" y="272" text-anchor="middle" font-size="9" fill="#b85450" font-style="italic">→ ROUND → 5911 ⚠</text>

  <!-- Separator -->
  <line x1="20" y1="296" x2="600" y2="296" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Phase summary -->
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">阶段一：GROUP BY company_id 求每公司 max(salary) → CASE 映射 tax_rate</text>

  <!-- Phase 1 mini table -->
  <rect x="120" y="328" width="380" height="22" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="343" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">company_id</text>
  <text x="320" y="343" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">max(salary)</text>
  <text x="450" y="343" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">tax_rate</text>

  <rect x="120" y="350" width="380" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="180" y="364" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="320" y="364" text-anchor="middle" font-size="10" fill="#555">21300</text>
  <text x="450" y="364" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0.49</text>

  <rect x="120" y="370" width="380" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="180" y="384" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="320" y="384" text-anchor="middle" font-size="10" fill="#555">700</text>
  <text x="450" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <rect x="120" y="390" width="380" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="180" y="404" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="320" y="404" text-anchor="middle" font-size="10" fill="#555">7777</text>
  <text x="450" y="404" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0.24</text>

  <!-- Phase 2 description -->
  <text x="310" y="430" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">阶段二：JOIN 回 Salaries → ROUND(salary × (1 − tax_rate), 0)</text>

  <!-- Legend / note -->
  <rect x="20" y="448" width="580" height="42" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="463" font-size="10" fill="#444" font-weight="bold">💡 关键观察：</text>
  <text x="40" y="476" font-size="10" fill="#555">• 税率按公司级 max 定档，同公司全员共用一档（如公司 1 三人都是 0.49）</text>
  <text x="40" y="487" font-size="10" fill="#555">• Morninngcat 7777×0.76=5910.52，MySQL ROUND 半数远离零 → 5911（非 5910）</text>
</svg>
