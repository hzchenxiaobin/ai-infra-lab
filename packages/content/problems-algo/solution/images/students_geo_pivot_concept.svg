<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">行转列 Pivot：长格式 → 每个洲一列的宽格式</text>

  <!-- Left: Long format table -->
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">长格式（输入 student）</text>

  <!-- header -->
  <rect x="30" y="66" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">name</text>
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">continent</text>

  <!-- America rows -->
  <rect x="30" y="96" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="112" text-anchor="middle" font-size="10" fill="#333">Jane</text>
  <text x="140" y="112" text-anchor="middle" font-size="10" fill="#446688">America</text>

  <rect x="30" y="122" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="138" text-anchor="middle" font-size="10" fill="#333">Sarah</text>
  <text x="140" y="138" text-anchor="middle" font-size="10" fill="#446688">America</text>

  <rect x="30" y="148" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="164" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="140" y="164" text-anchor="middle" font-size="10" fill="#446688">America</text>

  <!-- Asia rows -->
  <rect x="30" y="174" width="160" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="190" text-anchor="middle" font-size="10" fill="#333">Aamir</text>
  <text x="140" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">Asia</text>

  <rect x="30" y="200" width="160" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="216" text-anchor="middle" font-size="10" fill="#333">Adam</text>
  <text x="140" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">Asia</text>

  <rect x="30" y="226" width="160" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="10" fill="#333">Aman</text>
  <text x="140" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">Asia</text>

  <!-- Europe rows -->
  <rect x="30" y="252" width="160" height="24" fill="#fff" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="268" text-anchor="middle" font-size="10" fill="#333">Jesus</text>
  <text x="140" y="268" text-anchor="middle" font-size="10" fill="#d6a040">Europe</text>

  <rect x="30" y="278" width="160" height="24" fill="#fff" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="70" y="294" text-anchor="middle" font-size="10" fill="#333">Jose</text>
  <text x="140" y="294" text-anchor="middle" font-size="10" fill="#d6a040">Europe</text>

  <!-- Arrow -->
  <path d="M 210 180 L 300 180" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="170" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Pivot</text>
  <text x="255" y="196" text-anchor="middle" font-size="9" fill="#888">行转列</text>

  <!-- Right: Wide format table -->
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">宽格式（输出报告）</text>

  <!-- header -->
  <rect x="310" y="66" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">America</text>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Asia</text>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Europe</text>

  <!-- Row 1 -->
  <rect x="310" y="96" width="200" height="28" fill="#fff" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#446688">Jane</text>
  <text x="410" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a">Aamir</text>
  <text x="470" y="114" text-anchor="middle" font-size="10" fill="#d6a040">Jesus</text>

  <!-- Row 2 -->
  <rect x="310" y="126" width="200" height="28" fill="#fff" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="10" fill="#446688">Sarah</text>
  <text x="410" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a">Adam</text>
  <text x="470" y="144" text-anchor="middle" font-size="10" fill="#d6a040">Jose</text>

  <!-- Row 3 -->
  <rect x="310" y="156" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="350" y="174" text-anchor="middle" font-size="10" fill="#446688">Tom</text>
  <text x="410" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">Aman</text>
  <text x="470" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">null</text>

  <!-- NULL highlight box -->
  <rect x="450" y="152" width="40" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="200" text-anchor="middle" font-size="9" fill="#b85450">↑ 补 NULL</text>

  <!-- bottom note boxes -->
  <rect x="30" y="320" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">长格式：一个洲一列值</text>
  <text x="150" y="356" text-anchor="middle" font-size="9" fill="#555">每行一个学生，continent 作为分类列</text>
  <text x="150" y="370" text-anchor="middle" font-size="9" fill="#888">行数 = 学生总数</text>

  <rect x="290" y="320" width="240" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">宽格式：一个洲一列</text>
  <text x="410" y="356" text-anchor="middle" font-size="9" fill="#555">每列按字母序排列，不足补 NULL</text>
  <text x="410" y="370" text-anchor="middle" font-size="9" fill="#888">行数 = 各洲最大学生数</text>
</svg>
