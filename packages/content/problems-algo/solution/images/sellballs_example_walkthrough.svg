<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：inventory = [2,5], orders = 4</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">二分得阈值 T = 2 → 批量削平 color1 到 3，再补 1 个价值 2</text>

  <!-- ===== 左：两堆球 ===== -->
  <text x="160" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始堆（价值=堆高）</text>

  <!-- 价值坐标 -->
  <g font-size="10" fill="#888">
    <text x="86" y="303" text-anchor="end">1</text>
    <text x="86" y="277" text-anchor="end" fill="#4a7a3a" font-weight="bold">2=T</text>
    <text x="86" y="251" text-anchor="end">3</text>
    <text x="86" y="225" text-anchor="end">4</text>
    <text x="86" y="199" text-anchor="end">5</text>
  </g>

  <!-- 阈值虚线 -->
  <line x1="88" y1="261" x2="232" y2="261" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- color0 inv=2, x=120 -->
  <rect x="100" y="274" width="40" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="261" width="40" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="120" y="312" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">color0</text>
  <text x="120" y="326" text-anchor="middle" font-size="10" fill="#888">inv=2</text>

  <!-- color1 inv=5, x=200 -->
  <rect x="180" y="274" width="40" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="261" width="40" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="183" width="40" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">color1</text>
  <text x="200" y="190" text-anchor="middle" font-size="10" fill="#888">inv=5</text>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">color1</text>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#888">inv=5</text>

  <!-- 基线 -->
  <line x1="88" y1="300" x2="232" y2="300" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 橙段标注：价值 3,4,5 批量卖 -->
  <path d="M 220 222 Q 250 222 262 210" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="230" y="244" font-size="10" fill="#d6a040" font-weight="bold">削平卖 5,4,3</text>

  <!-- 绿段标注：价值 2 补齐 -->
  <text x="148" y="269" font-size="10" fill="#4a7a3a" font-weight="bold">补 1 个 ×2</text>

  <!-- ===== 右：卖出序列表 ===== -->
  <text x="420" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">卖出序列（贪心：每次取最高）</text>

  <!-- 表头 -->
  <rect x="300" y="92" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold">
    <text x="320" y="109">步</text>
    <text x="380" y="109">卖颜色</text>
    <text x="440" y="109">价值</text>
    <text x="500" y="109">累计</text>
  </g>

  <!-- 行1: 5 -->
  <rect x="300" y="120" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="320" y="137">①</text>
    <text x="380" y="137">color1</text>
    <text x="440" y="137" fill="#d6a040" font-weight="bold">5</text>
    <text x="500" y="137">5</text>
  </g>

  <!-- 行2: 4 -->
  <rect x="300" y="148" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="320" y="165">②</text>
    <text x="380" y="165">color1</text>
    <text x="440" y="165" fill="#d6a040" font-weight="bold">4</text>
    <text x="500" y="165">9</text>
  </g>

  <!-- 行3: 3 -->
  <rect x="300" y="176" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="320" y="193">③</text>
    <text x="380" y="193">color1</text>
    <text x="440" y="193" fill="#d6a040" font-weight="bold">3</text>
    <text x="500" y="193">12</text>
  </g>

  <!-- 分组括号：批量 -->
  <path d="M 548 122 L 556 122 L 556 200 L 548 200" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="562" y="165" font-size="9" fill="#d6a040" font-weight="bold">批量</text>

  <!-- 行4: 2 -->
  <rect x="300" y="204" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="320" y="221">④</text>
    <text x="380" y="221">color0/1</text>
    <text x="440" y="221" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="500" y="221">14</text>
  </g>
  <text x="562" y="221" font-size="9" fill="#4a7a3a" font-weight="bold">补齐</text>

  <!-- ===== 底部结论框 ===== -->
  <rect x="120" y="350" width="340" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">批量削平：color1 由 5→2，卖价值 5+4+3 = 12（3 个）</text>
  <text x="290" y="390" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">阈值补齐：剩 4−3=1 个，每个价值 2 → +2</text>
  <text x="290" y="408" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">合计 = 12 + 2 = 14 ✓</text>
</svg>
