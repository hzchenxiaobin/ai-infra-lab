<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：康托尔对角线法</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">answer[i] = flip(nums[i][i]) → 与每个 nums[i] 在第 i 位必不同</text>

  <!-- column labels -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="194" y="72">j=0</text>
    <text x="244" y="72">j=1</text>
    <text x="294" y="72">j=2</text>
  </g>

  <!-- row labels -->
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="160" y="100">nums[0]</text>
    <text x="160" y="138">nums[1]</text>
    <text x="160" y="176">nums[2]</text>
  </g>

  <!-- matrix cells: example 3 nums=["111","011","001"] -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- row 0: 1 1 1 -->
    <rect x="170" y="82" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="194" y="106" font-weight="bold" fill="#d6a040">1</text>
    <rect x="220" y="82" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="244" y="106">1</text>
    <rect x="270" y="82" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="106">1</text>
    <!-- row 1: 0 1 1 -->
    <rect x="170" y="120" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="194" y="144">0</text>
    <rect x="220" y="120" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="244" y="144" font-weight="bold" fill="#d6a040">1</text>
    <rect x="270" y="120" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="144">1</text>
    <!-- row 2: 0 0 1 -->
    <rect x="170" y="158" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="194" y="182">0</text>
    <rect x="220" y="158" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="244" y="182">0</text>
    <rect x="270" y="158" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="294" y="182" font-weight="bold" fill="#d6a040">1</text>
  </g>

  <!-- diagonal translucent line through (0,0)(1,1)(2,2) -->
  <path d="M 180 92 L 308 188" stroke="#b85450" stroke-width="5" fill="none" opacity="0.18" filter="url(#rough2)"/>

  <!-- right-side note for matrix -->
  <text x="340" y="100" font-size="11" fill="#d6a040" font-weight="bold">对角线</text>
  <text x="340" y="116" font-size="11" fill="#d6a040" font-weight="bold">nums[i][i]</text>
  <text x="340" y="138" font-size="10.5" fill="#888">橙色列即第 i 个</text>
  <text x="340" y="152" font-size="10.5" fill="#888">串的第 i 位</text>

  <!-- arrow down: take diagonal -->
  <path d="M 244 200 L 244 224" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="262" y="218" font-size="10.5" fill="#888">取对角线</text>

  <!-- diagonal bits row -->
  <text x="120" y="248" font-size="11" fill="#888" text-anchor="end">nums[i][i]</text>
  <g font-size="13" text-anchor="middle">
    <rect x="170" y="232" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="194" y="254" font-weight="bold" fill="#d6a040">1</text>
    <rect x="220" y="232" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="244" y="254" font-weight="bold" fill="#d6a040">1</text>
    <rect x="270" y="232" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="294" y="254" font-weight="bold" fill="#d6a040">1</text>
  </g>

  <!-- arrow down: flip -->
  <path d="M 244 270 L 244 294" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="262" y="288" font-size="10.5" fill="#b85450" font-weight="bold">逐位翻转</text>

  <!-- answer row -->
  <text x="120" y="318" font-size="11" fill="#888" text-anchor="end">answer[i]</text>
  <g font-size="13" text-anchor="middle">
    <rect x="170" y="302" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="194" y="324" font-weight="bold" fill="#b85450">0</text>
    <rect x="220" y="302" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="244" y="324" font-weight="bold" fill="#b85450">0</text>
    <rect x="270" y="302" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="294" y="324" font-weight="bold" fill="#b85450">0</text>
  </g>
  <text x="340" y="324" font-size="12" fill="#b85450" font-weight="bold">= "000"</text>

  <!-- explanation box -->
  <rect x="40" y="352" width="480" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="374" font-size="11.5" fill="#3a5a2a" font-weight="bold">为什么一定不在 nums 中？</text>
  <text x="56" y="392" font-size="11" fill="#555">answer[i] ≠ nums[i][i]，故 answer 与 nums[i] 在第 i 位不同 ⟹ answer ≠ nums[i]（∀i）</text>
  <text x="56" y="406" font-size="11" fill="#555">n 个串每个都被「对角线」卡掉一位 ⟹ answer ∉ nums，构造即证明，无需哈希查重</text>
</svg>
