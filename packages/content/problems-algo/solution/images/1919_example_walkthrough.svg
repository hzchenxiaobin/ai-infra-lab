<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三对好友逐一判定</text>

  <!-- Table header -->
  <g font-size="11" fill="#555" font-weight="bold" text-anchor="middle">
    <rect x="30" y="46" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="65" y="63">好友对</text>
    <rect x="104" y="46" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="144" y="63">共同日</text>
    <rect x="188" y="46" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="63">user1 / user2 集合</text>
    <rect x="312" y="46" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="347" y="63">|A∩B|</text>
    <rect x="386" y="46" width="144" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="458" y="63">判定</text>
  </g>

  <!-- Row 1: (1,2) similar -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="76" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="65" y="103" font-weight="bold">(1, 2)</text>
    <rect x="104" y="76" width="80" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="144" y="103">03-15</text>
    <rect x="188" y="76" width="120" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="92">{10,11,12}</text>
    <text x="248" y="110">{10,11,12}</text>
    <rect x="312" y="76" width="70" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="347" y="103" font-weight="bold">3</text>
    <rect x="386" y="76" width="144" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="458" y="97" fill="#4a7a3a" font-weight="bold">3=3=3</text>
    <text x="458" y="113" fill="#4a7a3a" font-weight="bold">相似 ✓</text>
  </g>

  <!-- Row 2: (2,4) not similar -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="126" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="65" y="153" font-weight="bold">(2, 4)</text>
    <rect x="104" y="126" width="80" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="144" y="153">03-15</text>
    <rect x="188" y="126" width="120" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="142">{10,11,12}</text>
    <text x="248" y="160">{10,11,13}</text>
    <rect x="312" y="126" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="347" y="153" font-weight="bold" fill="#d6a040">2</text>
    <rect x="386" y="126" width="144" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="458" y="147" fill="#b85450" font-weight="bold">2≠3</text>
    <text x="458" y="163" fill="#b85450" font-weight="bold">不相似 ✗</text>
  </g>

  <!-- Row 3: (2,5) no shared day -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="176" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="65" y="203" font-weight="bold">(2, 5)</text>
    <rect x="104" y="176" width="80" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="144" y="200" fill="#888">无共同日</text>
    <text x="144" y="214" fill="#888" font-size="10">(2→15, 5→16)</text>
    <rect x="188" y="176" width="120" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="195">{10,11,12}</text>
    <text x="248" y="213" fill="#888" font-size="10">集合相同但跨日</text>
    <rect x="312" y="176" width="70" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="347" y="203" fill="#888">—</text>
    <rect x="386" y="176" width="144" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="458" y="197" fill="#b85450" font-weight="bold">无同日</text>
    <text x="458" y="213" fill="#b85450" font-weight="bold">不相似 ✗</text>
  </g>

  <!-- Divider -->
  <path d="M 30 234 L 530 234" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Analysis notes -->
  <text x="30" y="256" font-size="12" fill="#555" font-weight="bold">关键分析：</text>

  <rect x="30" y="268" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="288" font-size="11" fill="#333">✓ (1,2)：同在 03-15，集合完全一致 {10,11,12}，公共 3 = 各自 3 → 命中</text>

  <rect x="30" y="310" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="330" font-size="11" fill="#333">✗ (2,4)：同在 03-15，但 user4 多了「13」少了「12」，公共仅 {10,11}=2 ≠ 3 → 排除</text>

  <rect x="30" y="352" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="372" font-size="11" fill="#333">✗ (2,5)：两人听的歌完全相同，但日期不同（无共同日）→ 日期维度是判定关键</text>

  <!-- Final result -->
  <rect x="120" y="394" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最终输出：user1_id=1, user2_id=2</text>
</svg>
