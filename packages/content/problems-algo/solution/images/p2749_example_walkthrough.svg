<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算</text>

  <!-- Example 1 header -->
  <text x="20" y="56" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① num1 = 3, num2 = −2</text>

  <!-- Column headers -->
  <text x="45" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k</text>
  <text x="120" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">target</text>
  <text x="215" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">popcount</text>
  <text x="300" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">≥k?</text>
  <text x="380" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">≤k?</text>
  <text x="470" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">结果</text>

  <!-- Row 1: k=1 -->
  <rect x="20" y="82" width="50" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="82" width="80" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="170" y="82" width="90" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="215" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 (101)</text>
  <rect x="270" y="82" width="60" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="82" width="80" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="470" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>

  <!-- Row 2: k=2 -->
  <rect x="20" y="116" width="50" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="116" width="80" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="170" y="116" width="90" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="215" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 (111)</text>
  <rect x="270" y="116" width="60" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="116" width="80" height="30" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="136" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="470" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>

  <!-- Row 3: k=3 (highlighted) -->
  <rect x="20" y="150" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="80" y="150" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="170" y="150" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2 (1001)</text>
  <rect x="270" y="150" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="150" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="470" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return 3!</text>

  <!-- Note for example 1 -->
  <text x="270" y="198" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">9 = 2² + 2² + 2⁰ = 4 + 4 + 1，恰好 3 项</text>

  <!-- Separator -->
  <line x1="20" y1="220" x2="520" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="20" y="248" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">② num1 = 5, num2 = 7</text>

  <rect x="20" y="258" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">target = 5 − 7k</text>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">对所有 k ≥ 1 均为负数 → target ≥ k 恒不成立</text>

  <text x="270" y="328" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ return −1</text>

  <!-- Summary note -->
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键：方程变形将搜索问题 → popcount 判定问题，O(1) per k</text>
</svg>
