<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：每个空座到最近人的距离 = min(左, 右)，取所有空座的最大值</text>

  <!-- index labels -->
  <text x="92" y="62" font-size="10" fill="#888">下标</text>
  <rect x="124" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="63" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="168" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="212" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="234" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="256" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="63" text-anchor="middle" font-size="10" fill="#888">3</text>
  <rect x="300" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="322" y="63" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="344" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="388" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="63" text-anchor="middle" font-size="10" fill="#888">6</text>
  <rect x="432" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="454" y="63" text-anchor="middle" font-size="10" fill="#888">7</text>

  <!-- seat cells -->
  <text x="92" y="108" font-size="11" fill="#888">座位</text>
  <rect x="124" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="168" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="212" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="256" y="88" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="300" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="344" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="388" y="88" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="432" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- region brackets -->
  <!-- left edge region: indices 0-2 -->
  <path d="M 126 128 L 126 138 L 254 138 L 254 128" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左端段 L=3</text>
  <rect x="132" y="166" width="116" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="11" fill="#333">贴左端坐 → 贡献 3</text>

  <!-- middle region: indices 4-5 -->
  <path d="M 302 128 L 302 138 L 386 138 L 386 128" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="344" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中间段 L=2</text>
  <rect x="286" y="166" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="344" y="184" text-anchor="middle" font-size="11" fill="#333">坐正中 → 贡献 (2+1)//2=1</text>

  <!-- right edge region: index 7 -->
  <path d="M 434 128 L 434 138 L 474 138 L 474 128" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="454" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右端段 L=1</text>
  <rect x="396" y="166" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="454" y="184" text-anchor="middle" font-size="11" fill="#333">贴右端坐 → 贡献 1</text>

  <!-- best seat marker on index 0 -->
  <path d="M 146 80 L 142 70 L 150 70 z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="146" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最优座位</text>

  <!-- answer -->
  <rect x="172" y="214" width="256" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = max(3, 1, 1) = 3</text>

  <!-- two-pass note -->
  <rect x="40" y="264" width="520" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">两次遍历法（与 821 同模板）</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#444">正向(左→右)维护「左侧最近人」算 i−last ；反向(右→左)维护「右侧最近人」算 last−i</text>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#444">每个位置取 min 得「最近人距离」，最后整体取 max 即答案</text>

  <text x="40" y="348" font-size="11" fill="#888">关键：贴边座位只有一侧有人，</text>
  <text x="40" y="366" font-size="11" fill="#4a7a3a" font-weight="bold">→ 另一侧用 ∞ 占位，min 自动取到真实距离，无需特判。</text>
  <text x="40" y="386" font-size="11" fill="#888">821 求每个位置的最近距离「原样返回」，849 只把聚合换成 max —— 主体逐字相同。</text>
</svg>
