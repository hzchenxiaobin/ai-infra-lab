<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：参数累积进桶，凑够 fn.length 就触发原函数</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">curry(fn) 返回一个「同型函数」，每收一批参数并入收集器，够数即触发</text>

  <!-- fn box -->
  <rect x="20" y="64" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原函数 fn</text>
  <text x="95" y="102" text-anchor="middle" font-size="12" fill="#333">fn.length = 3</text>

  <!-- arrow from fn to curry -->
  <path d="M 170 88 L 210 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="80" text-anchor="middle" font-size="10" fill="#888">curry</text>

  <!-- curried return box -->
  <rect x="210" y="64" width="190" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="305" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">curried(...args)</text>
  <text x="305" y="102" text-anchor="middle" font-size="11" fill="#888">每次调用收一批参数，并入 collected</text>

  <!-- collected bucket -->
  <text x="440" y="78" font-size="12" fill="#888" font-weight="bold">收集器 collected</text>
  <rect x="430" y="88" width="48" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="478" y="88" width="48" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="526" y="88" width="48" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- arrows from curried into bucket slots -->
  <path d="M 400 88 L 426 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="495,160 575,200 495,240 415,200" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">够 3 个？</text>
  <text x="495" y="214" text-anchor="middle" font-size="10" fill="#888">length ≥ fn.length</text>

  <!-- arrow from bucket to decision -->
  <path d="M 500 136 L 500 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch: return same-type function -->
  <text x="345" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">否（不够）</text>
  <path d="M 415 200 L 360 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="190" y="176" width="170" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 同型函数</text>
  <text x="275" y="214" text-anchor="middle" font-size="11" fill="#333">继续收下一批参数</text>

  <!-- loop back arrow from same-type fn to curried -->
  <path d="M 275 176 L 275 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="235" y="150" font-size="10" fill="#4a7a3a">链条续接</text>

  <!-- yes branch: trigger fn -->
  <text x="505" y="262" font-size="11" fill="#b85450" font-weight="bold">是（够）</text>
  <path d="M 495 240 L 495 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="370" y="280" width="250" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="302" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">触发 fn(...collected)</text>
  <text x="495" y="320" text-anchor="middle" font-size="11" fill="#888">链条终止，吐出原函数结果</text>

  <!-- arrow back to fn box showing the trigger invokes fn -->
  <path d="M 370 296 L 95 296 L 95 116" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="200" y="288" font-size="10" fill="#b85450">fn.apply(this, collected)</text>

  <!-- key insight -->
  <rect x="40" y="346" width="540" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一句话：累积变参 + 凑够即触发 + 递归返回同型函数</text>
  <text x="310" y="380" text-anchor="middle" font-size="11" fill="#888">每层复用同一段「累积—判长—触发/续接」逻辑，层数由「何时凑够」动态决定</text>
</svg>
