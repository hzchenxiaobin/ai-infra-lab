<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟计数 → 奇偶检查 → 差值求和 ÷ 4</text>

  <ellipse cx="190" cy="44" rx="36" ry="15" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="49" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 190 59 L 190 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="72" width="280" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 统一计数：cnt[v] = cnt1[v] − cnt2[v]</text>

  <path d="M 190 100 L 190 112" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="116" width="262" height="118" rx="12" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="190" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对每个出现过的值 v</text>

  <polygon points="190,140 276,164 190,188 104,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="168" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">cnt[v] 为奇数？</text>

  <path d="M 276 164 L 326 164" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="157" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">是</text>

  <rect x="330" y="150" width="96" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="168" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">return −1</text>

  <path d="M 190 188 L 190 200" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="start" font-size="9.5" fill="#333" filter="url(#rough2)">否</text>

  <rect x="90" y="202" width="200" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="219" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">diff += |cnt[v]|</text>

  <path d="M 90 215 H 70 Q 62 215 62 205 V 174 Q 62 164 72 164 H 98" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="192" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">下一个 v</text>

  <path d="M 190 234 L 190 246" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="250" width="200" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="269" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return diff / 4（必整除）</text>

  <text x="414" y="196" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">奇 ⟺ cnt1[v]+cnt2[v] 为奇</text>
  <text x="414" y="210" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">⇒ 无法平分</text>

  <text x="300" y="268" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">全部为偶 ⇒ Σdiff 必为 4 的倍数</text>

  <rect x="30" y="300" width="145" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="316" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">示例 1 [10,20]/[20,10]</text>
  <text x="102" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diff = 0 → 返回 0</text>

  <rect x="187" y="300" width="145" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="259" y="316" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">示例 2 [10,10]/[20,20]</text>
  <text x="259" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Σdiff = 4 → 返回 1</text>

  <rect x="344" y="300" width="145" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="316" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">示例 3 [10,20]/[30,40]</text>
  <text x="416" y="332" text-anchor="middle" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">值 10 总数 1 奇 → −1</text>

  <text x="260" y="356" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">值域 1..8×10⁴ ⇒ 计数数组 O(V)；值域发散 ⇒ 哈希表 O(distinct)</text>
</svg>
