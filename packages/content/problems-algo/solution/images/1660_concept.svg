<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：错误 right 指针指向同层节点，BFS 逐层检测</text>

  <!-- ===== 左侧：错误二叉树 ===== -->
  <text x="170" y="56" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">错误树（5.right → 6，同层）</text>

  <g font-size="13">
    <!-- 树连线 -->
    <line x1="170" y1="98" x2="120" y2="148" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="170" y1="98" x2="220" y2="148" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="112" y1="172" x2="80" y2="228" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="128" y1="172" x2="160" y2="228" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="212" y1="172" x2="200" y2="228" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="228" y1="172" x2="260" y2="228" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>

    <!-- 错误的 right 指针（红色虚线弧） -->
    <path d="M 168 232 Q 185 265 198 232" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

    <!-- L0: 1 -->
    <circle cx="170" cy="82" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="170" y="87" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <!-- L1: 2, 3 -->
    <circle cx="120" cy="158" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="120" y="163" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="220" cy="158" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="220" y="163" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <!-- L2: 4, 5(错误节点), 6, 7 -->
    <circle cx="72" cy="240" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="72" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>

    <circle cx="160" cy="240" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
    <text x="160" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>

    <circle cx="200" cy="240" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="200" y="245" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>

    <circle cx="262" cy="240" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="262" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
  </g>

  <!-- 深度标签 -->
  <g font-size="10" fill="#999">
    <text x="30" y="87" text-anchor="middle">d=0</text>
    <text x="30" y="163" text-anchor="middle">d=1</text>
    <text x="30" y="245" text-anchor="middle">d=2</text>
  </g>

  <!-- 错误指针标注 -->
  <text x="185" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5.right→6 同层！</text>

  <!-- ===== 右侧：BFS 检测原理 ===== -->
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">BFS 逐层检测原理</text>

  <!-- 说明框 1 -->
  <rect x="350" y="72" width="250" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="92" font-size="11" fill="#2a4a6a" font-weight="bold">① BFS 按层处理</text>
  <text x="365" y="108" font-size="10" fill="#2a4a6a">处理第 d 层时，所有第 d 层</text>
  <text x="365" y="121" font-size="10" fill="#2a4a6a">节点已在 seen 集合中</text>

  <!-- 说明框 2 -->
  <rect x="350" y="140" width="250" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="160" font-size="11" fill="#7a5a20" font-weight="bold">② 检查 right 子节点</text>
  <text x="365" y="176" font-size="10" fill="#7a5a20">right 子节点应在第 d+1 层</text>
  <text x="365" y="189" font-size="10" fill="#7a5a20">→ 不应在 seen 中</text>

  <!-- 说明框 3 -->
  <rect x="350" y="208" width="250" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="228" font-size="11" fill="#8a3a36" font-weight="bold">③ right ∈ seen → 错误！</text>
  <text x="365" y="244" font-size="10" fill="#8a3a36">right 指向了同层节点（d 层）</text>
  <text x="365" y="257" font-size="10" fill="#8a3a36">→ 该节点即错误节点</text>

  <!-- 说明框 4 -->
  <rect x="350" y="276" width="250" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="296" font-size="11" fill="#3a5a2a" font-weight="bold">④ 移除错误子树</text>
  <text x="365" y="312" font-size="10" fill="#3a5a2a">将父节点指向该节点的</text>
  <text x="365" y="325" font-size="10" fill="#3a5a2a">指针置 null → 返回 root</text>

  <!-- 底部箭头连接 -->
  <line x1="475" y1="128" x2="475" y2="140" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="475" y1="196" x2="475" y2="208" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="475" y1="264" x2="475" y2="276" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部总结 -->
  <rect x="20" y="350" width="580" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">关键不变量</text>
  <text x="310" y="394" text-anchor="middle" font-size="11" fill="#7a5a20">BFS 处理第 d 层节点时，seen 集合 = 第 0~d 层所有节点</text>
  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#7a5a20">正常 right 子节点在第 d+1 层 → 不在 seen 中；若在 seen 中 → 指向同层 → 错误</text>
</svg>
