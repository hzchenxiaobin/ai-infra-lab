<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按下标奇偶分成两桶，各桶求和再比较</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个下标 i 只属于一个桶（i &amp; 1 判定）⇒ 一次遍历同步累加两个计数器</text>

  <!-- 字符串格子 -->
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">num = "24123"（下标从 0 开始，0 算偶数）：</text>

  <rect x="90" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="150" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="210" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="270" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="330" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="110" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 0 · 偶</text>
  <text x="170" y="128" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">下标 1 · 奇</text>
  <text x="230" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 2 · 偶</text>
  <text x="290" y="128" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">下标 3 · 奇</text>
  <text x="350" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 4 · 偶</text>

  <!-- 分桶箭头 -->
  <path d="M 110 138 C 100 158, 130 168, 145 180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 230 138 C 220 158, 195 168, 175 180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 350 138 C 345 160, 220 170, 190 180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 170 138 C 185 160, 315 168, 330 180" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 138 C 300 160, 325 168, 340 180" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两个桶 -->
  <rect x="45" y="186" width="160" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="208" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶数下标桶 even</text>
  <text x="125" y="228" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2 + 1 + 3</text>
  <text x="125" y="248" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">= 6</text>

  <rect x="315" y="186" width="160" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="208" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">奇数下标桶 odd</text>
  <text x="395" y="228" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">4 + 2</text>
  <text x="395" y="248" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">= 6</text>

  <!-- 比较 -->
  <text x="260" y="228" text-anchor="middle" font-size="16" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">= ?</text>

  <rect x="105" y="272" width="310" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6 == 6 → 平衡，返回 true ✓</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="322" width="480" height="66" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="342" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 判的是下标 i 的奇偶，不是数字本身的奇偶！</text>
  <text x="34" y="358" font-size="10" fill="#333" filter="url(#rough2)">C++ 累加前先 num[i] − '0'：'7' 的 ASCII 是 55，不是 7；</text>
  <text x="34" y="374" font-size="10" fill="#333" filter="url(#rough2)">n 为奇数时偶桶比奇桶多一个元素，直接比 ASCII 和会差出 48，老实转数字最稳。</text>
</svg>
