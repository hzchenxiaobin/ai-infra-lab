<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word 的全部 2⁴=16 个广义缩写</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">掩码位 i=1 表示缩写 word[i]，连续 1 合并为一个数字</text>

  <!-- 表头：两列各 4 字段 -->
  <g filter="url(#rough2)">
    <!-- 左列表头 -->
    <rect x="20" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="50" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">掩码</text>
    <rect x="84" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">K/A 模式</text>
    <rect x="198" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="238" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">缩写</text>

    <!-- 右列表头 -->
    <rect x="330" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="360" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">掩码</text>
    <rect x="394" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="449" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">K/A 模式</text>
    <rect x="508" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="548" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">缩写</text>
  </g>

  <!-- ===== 左列 8 行 (mask 0000~0111) ===== -->
  <g font-size="11" filter="url(#rough2)">
    <!-- row 1: 0000 KKKK word -->
    <rect x="20" y="92" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="108" text-anchor="middle" fill="#555">0000</text>
    <rect x="84" y="92" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4"/>
    <text x="139" y="108" text-anchor="middle" fill="#4a7a3a">K K K K</text>
    <rect x="198" y="92" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">word</text>

    <!-- row 2: 0001 AKKK 1ord -->
    <rect x="20" y="120" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="136" text-anchor="middle" fill="#555">0001</text>
    <rect x="84" y="120" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="136" text-anchor="middle" fill="#d6a040">A K K K</text>
    <rect x="198" y="120" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">1ord</text>

    <!-- row 3: 0010 KAKK w1rd -->
    <rect x="20" y="148" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="164" text-anchor="middle" fill="#555">0010</text>
    <rect x="84" y="148" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="164" text-anchor="middle" fill="#d6a040">K A K K</text>
    <rect x="198" y="148" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">w1rd</text>

    <!-- row 4: 0011 AAKK 2rd -->
    <rect x="20" y="176" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="192" text-anchor="middle" fill="#555">0011</text>
    <rect x="84" y="176" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="192" text-anchor="middle" fill="#d6a040">A A K K</text>
    <rect x="198" y="176" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="192" text-anchor="middle" fill="#b85450" font-weight="bold">2rd</text>

    <!-- row 5: 0100 KKAK wo1d -->
    <rect x="20" y="204" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="220" text-anchor="middle" fill="#555">0100</text>
    <rect x="84" y="204" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="220" text-anchor="middle" fill="#d6a040">K K A K</text>
    <rect x="198" y="204" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">wo1d</text>

    <!-- row 6: 0101 AKAK 1o1d -->
    <rect x="20" y="232" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="248" text-anchor="middle" fill="#555">0101</text>
    <rect x="84" y="232" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="248" text-anchor="middle" fill="#d6a040">A K A K</text>
    <rect x="198" y="232" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">1o1d</text>

    <!-- row 7: 0110 KAAK w2d -->
    <rect x="20" y="260" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="276" text-anchor="middle" fill="#555">0110</text>
    <rect x="84" y="260" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="276" text-anchor="middle" fill="#d6a040">K A A K</text>
    <rect x="198" y="260" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="276" text-anchor="middle" fill="#b85450" font-weight="bold">w2d</text>

    <!-- row 8: 0111 AAAK 3d -->
    <rect x="20" y="288" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="50" y="304" text-anchor="middle" fill="#555">0111</text>
    <rect x="84" y="288" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="139" y="304" text-anchor="middle" fill="#d6a040">A A A K</text>
    <rect x="198" y="288" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="238" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">3d</text>
  </g>

  <!-- ===== 右列 8 行 (mask 1000~1111) ===== -->
  <g font-size="11" filter="url(#rough2)">
    <!-- row 1: 1000 KKKA wor1 -->
    <rect x="330" y="92" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="108" text-anchor="middle" fill="#555">1000</text>
    <rect x="394" y="92" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="108" text-anchor="middle" fill="#d6a040">K K K A</text>
    <rect x="508" y="92" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">wor1</text>

    <!-- row 2: 1001 AKKA 1or1 -->
    <rect x="330" y="120" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="136" text-anchor="middle" fill="#555">1001</text>
    <rect x="394" y="120" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="136" text-anchor="middle" fill="#d6a040">A K K A</text>
    <rect x="508" y="120" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">1or1</text>

    <!-- row 3: 1010 KAKA w1r1 -->
    <rect x="330" y="148" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="164" text-anchor="middle" fill="#555">1010</text>
    <rect x="394" y="148" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="164" text-anchor="middle" fill="#d6a040">K A K A</text>
    <rect x="508" y="148" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">w1r1</text>

    <!-- row 4: 1011 AAKA 2r1 -->
    <rect x="330" y="176" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="192" text-anchor="middle" fill="#555">1011</text>
    <rect x="394" y="176" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="192" text-anchor="middle" fill="#d6a040">A A K A</text>
    <rect x="508" y="176" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="192" text-anchor="middle" fill="#b85450" font-weight="bold">2r1</text>

    <!-- row 5: 1100 KKAA wo2 -->
    <rect x="330" y="204" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="220" text-anchor="middle" fill="#555">1100</text>
    <rect x="394" y="204" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="220" text-anchor="middle" fill="#d6a040">K K A A</text>
    <rect x="508" y="204" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">wo2</text>

    <!-- row 6: 1101 AKAA 1o2 -->
    <rect x="330" y="232" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="248" text-anchor="middle" fill="#555">1101</text>
    <rect x="394" y="232" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="248" text-anchor="middle" fill="#d6a040">A K A A</text>
    <rect x="508" y="232" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">1o2</text>

    <!-- row 7: 1110 KAAA w3 -->
    <rect x="330" y="260" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="276" text-anchor="middle" fill="#555">1110</text>
    <rect x="394" y="260" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="276" text-anchor="middle" fill="#d6a040">K A A A</text>
    <rect x="508" y="260" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="276" text-anchor="middle" fill="#b85450" font-weight="bold">w3</text>

    <!-- row 8: 1111 AAAA 4 -->
    <rect x="330" y="288" width="60" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.1" rx="4"/>
    <text x="360" y="304" text-anchor="middle" fill="#555">1111</text>
    <rect x="394" y="288" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <text x="449" y="304" text-anchor="middle" fill="#d6a040">A A A A</text>
    <rect x="508" y="288" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="548" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- 底部说明 -->
  <rect x="40" y="332" width="560" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="354" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键观察：</text>
  <text x="60" y="372" font-size="11" fill="#333" filter="url(#rough2)">① 掩码 1 的连续段长度 = 写入的数字（如 0110 的 "11" → 2，即 "w2d"）</text>
  <text x="60" y="390" font-size="11" fill="#333" filter="url(#rough2)">② 数字不会出现前导零：每段至少 1 个字符被缩写，计数 ≥ 1</text>
  <text x="60" y="408" font-size="11" fill="#333" filter="url(#rough2)">③ 结果数 = 2ⁿ（与子集 78 同构：每个字符选/不选，此处 K=选、A=不选但聚合计数）</text>
  <text x="60" y="426" font-size="11" fill="#333" filter="url(#rough2)">④ 全 K = 原词；全 A = 单个数字 n；两者互为两极</text>
  <text x="60" y="446" font-size="10" fill="#666" filter="url(#rough2)">输出顺序可任意；上表按掩码递增列出便于核对</text>
</svg>
