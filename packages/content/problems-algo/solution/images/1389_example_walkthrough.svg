<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [0,1,2,3,4]，index = [0,1,2,2,1]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">红=新插入，橙=被挤开右移，蓝=不动</text>

  <!-- header -->
  <rect x="30" y="62" width="560" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="128" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">nums[i]</text>
  <text x="200" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">index[i]</text>
  <text x="392" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">插入后 target</text>

  <!-- ====== Row 0: insert 0 @ 0 → [0] ====== -->
  <rect x="30" y="92" width="560" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="108" y="100" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="180" y="100" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="270" y="98" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="291" y="119" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>

  <!-- ====== Row 1: insert 1 @ 1 → [0,1] ====== -->
  <rect x="30" y="136" width="560" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="108" y="144" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="180" y="144" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="270" y="142" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="291" y="163" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <rect x="316" y="142" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="337" y="163" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- ====== Row 2: insert 2 @ 2 → [0,1,2] ====== -->
  <rect x="30" y="180" width="560" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="108" y="188" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="180" y="188" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="270" y="186" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="291" y="207" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <rect x="316" y="186" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="337" y="207" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="362" y="186" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="383" y="207" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- ====== Row 3: insert 3 @ 2 → [0,1,3,2] ====== -->
  <rect x="30" y="224" width="560" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="108" y="232" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="180" y="232" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="270" y="230" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="291" y="251" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <rect x="316" y="230" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="337" y="251" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="362" y="230" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="383" y="251" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="408" y="230" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="429" y="251" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <!-- shift note -->
  <path d="M 383 268 L 429 268" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="406" y="282" text-anchor="middle" font-size="9" fill="#d6a040">2 被挤右移</text>

  <!-- ====== Row 4: insert 4 @ 1 → [0,4,1,3,2] ====== -->
  <rect x="30" y="294" width="560" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="108" y="302" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="180" y="302" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="270" y="300" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="291" y="321" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <rect x="316" y="300" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="337" y="321" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <rect x="362" y="300" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="383" y="321" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="408" y="300" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="429" y="321" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <rect x="454" y="300" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="475" y="321" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <!-- shift note -->
  <path d="M 337 338 L 475 338" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="406" y="352" text-anchor="middle" font-size="9" fill="#d6a040">1,3,2 整体右移一位</text>

  <!-- ====== Result ====== -->
  <path d="M 310 360 L 310 372" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="376" width="380" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终结果 target = [0, 4, 1, 3, 2]</text>
  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#888">第 4 步把 4 插到下标 1 ⇒ 后插元素排到先插元素之前</text>

  <rect x="60" y="432" width="500" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="446" text-anchor="middle" font-size="10" fill="#446688">每步 insert 都挤开右侧 ⇒ O(n²)；约束 index[i]≤i 保证全程无越界</text>
</svg>
