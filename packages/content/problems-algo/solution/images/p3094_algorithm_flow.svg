<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：30 个位 × 每位两连问 = 60 次 API 调用</text>

  <!-- start -->
  <rect x="230" y="40" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="61" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M 310 76 L 310 92" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="310,96 380,128 310,160 240,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; 30 ?</text>

  <path d="M 380 128 L 458 128" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="419" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">否</text>

  <rect x="462" y="112" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="522" y="133" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <path d="M 310 160 L 310 176" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="172" font-size="10" fill="#999" filter="url(#rough2)">是</text>

  <!-- c1 -->
  <rect x="215" y="180" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c1 = commonBits(1 &lt;&lt; i)</text>

  <path d="M 310 212 L 310 228" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- c2 -->
  <rect x="215" y="232" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c2 = commonBits(1 &lt;&lt; i)</text>
  <text x="310" y="260" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">同参再问一次：副作用自消，n 复原</text>

  <path d="M 310 264 L 310 280" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="310,284 385,316 310,348 235,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="321" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c1 &gt; c2 ?</text>

  <path d="M 385 316 L 448 316" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="452" y="298" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="522" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans |= 1 &lt;&lt; i</text>
  <text x="522" y="328" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">差值 +1 → 初始该位为 1</text>

  <path d="M 310 348 L 310 364" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="360" font-size="10" fill="#b85450" filter="url(#rough2)">否（差值 −1 → 该位为 0，跳过）</text>

  <!-- i++ -->
  <rect x="250" y="368" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="388" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++</text>

  <!-- loop back -->
  <path d="M 250 383 L 160 383 L 160 128 L 236 128" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">回到循环</text>

  <!-- annotations -->
  <rect x="40" y="408" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="424" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">不变式：每轮两连问结束时 n 已恢复原值，30 轮探测互不干扰；上界取 30（2^30 越界不可靠）</text>
</svg>
