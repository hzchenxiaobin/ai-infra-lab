<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">删边使各连通块价值相等：total=18，target=6 → 3 块 → 切 2 边</text>

  <!-- ===== component backgrounds ===== -->
  <!-- {0} blue -->
  <rect x="42" y="138" width="76" height="64" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- {1,2,3} green -->
  <rect x="178" y="138" width="224" height="180" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- {4} orange -->
  <rect x="462" y="138" width="76" height="64" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== edges ===== -->
  <!-- 1-2 and 1-3 : kept (solid) -->
  <line x1="220" y1="175" x2="220" y2="295" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <line x1="220" y1="175" x2="360" y2="175" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <!-- 0-1 and 3-4 : cut (dashed red) -->
  <line x1="102" y1="175" x2="198" y2="175" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <line x1="382" y1="175" x2="478" y2="175" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">切</text>
  <text x="430" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">切</text>

  <!-- ===== nodes ===== -->
  <circle cx="80" cy="175" r="22" fill="#fff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>

  <circle cx="220" cy="175" r="22" fill="#fff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <circle cx="220" cy="295" r="22" fill="#fff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <circle cx="360" cy="175" r="22" fill="#fff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <circle cx="500" cy="175" r="22" fill="#fff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">6</text>

  <!-- ===== component value labels ===== -->
  <text x="80" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">{0} = 6</text>
  <text x="290" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{1,2,3} = 6</text>
  <text x="500" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">{4} = 6</text>

  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每块价值 = 块内 nums 之和；sub[u] 恰等于 target 时切断该边</text>
</svg>
