<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">GCD 的结合律：逐元素折叠求全局 GCD</text>

  <!-- Input array -->
  <text x="30" y="58" font-size="11" fill="#888">nums:</text>
  <rect x="70" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="63" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="122" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="63" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="174" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="63" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="226" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="12" fill="#333">23</text>

  <!-- Step 1: gcd(12, 5) -->
  <path d="M 94 72 L 94 92 L 146 92 L 146 72" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="100" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="121" text-anchor="middle" font-size="12" fill="#333">gcd(12,5)</text>

  <path d="M 160 116 L 200 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="210" y="100" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="235" y="121" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <text x="235" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">gcd=1，可提前返回 true</text>

  <!-- Step 2: if continued, gcd(1, 7) -->
  <path d="M 235 132 L 235 152 L 198 152 L 198 72" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="155" font-size="10" fill="#aaa">(若不提前返回)</text>

  <path d="M 235 132 L 235 165 L 235 165" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- General formula box -->
  <rect x="60" y="180" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">结合律：gcd(a, b, c) = gcd(gcd(a, b), c)</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#666">→ 用累加器 g 逐元素折叠：g = gcd(g, nums[i])</text>

  <!-- Flow -->
  <text x="30" y="252" font-size="11" fill="#888" font-weight="bold">流程：</text>

  <rect x="70" y="240" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#333">g = nums[0]</text>

  <path d="M 130 253 L 160 253" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="165" y="240" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="258" text-anchor="middle" font-size="11" fill="#333">g == 1 ? return true</text>

  <path d="M 275 253 L 305 253" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="310" y="240" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="258" text-anchor="middle" font-size="11" fill="#333">g = gcd(g, x)</text>

  <path d="M 360 240 L 360 225 L 220 225 L 220 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="9" fill="#888">循环下一个元素</text>

  <path d="M 410 253 L 440 253" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="445" y="240" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="258" text-anchor="middle" font-size="11" fill="#b85450">return g==1</text>

  <!-- Early termination note -->
  <rect x="60" y="290" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 优化：折叠过程中 g 一旦变为 1 即可提前返回 true</text>

  <!-- Complexity -->
  <rect x="60" y="340" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">时间 O(n · log(max))，空间 O(1) — 欧几里得算法单次 O(log max)</text>
</svg>
