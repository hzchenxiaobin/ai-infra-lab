<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：4325 → 59 与 687 → 75</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">提取数位 → 升序排序 → 下标奇偶交替拼接 → 求和</text>

  <!-- ===== Example 1: num = 4325 (left) ===== -->
  <text x="140" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例 1：num = 4325（均衡 2+2）</text>

  <text x="36" y="101" text-anchor="end" font-size="9.5" fill="#888">数位</text>
  <rect x="44" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="116" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <path d="M 116 114 L 116 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="126" font-size="9.5" fill="#666" font-weight="bold">排序</text>

  <!-- sorted [2,3,4,5] with index labels -->
  <rect x="44" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="62" y="174" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">d₀→num1</text>
  <rect x="80" y="134" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="98" y="174" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">d₁→num2</text>
  <rect x="116" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="134" y="174" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">d₂→num1</text>
  <rect x="152" y="134" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="170" y="174" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">d₃→num2</text>

  <path d="M 116 180 L 116 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="192" font-size="9.5" fill="#666" font-weight="bold">拼接</text>

  <!-- num1=24, num2=35 -->
  <rect x="52" y="200" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="88" y="200" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="124" y="218" font-size="12" fill="#333" font-weight="bold">+</text>
  <rect x="134" y="200" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="170" y="200" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <text x="116" y="246" text-anchor="middle" font-size="10.5" fill="#888">num1 = 24（取 d₀,d₂）</text>
  <text x="116" y="260" text-anchor="middle" font-size="10.5" fill="#888">num2 = 35（取 d₁,d₃）</text>

  <rect x="56" y="270" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="116" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">24 + 35 = 59</text>

  <!-- vertical divider -->
  <line x1="292" y1="60" x2="292" y2="320" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2: num = 687 (right) ===== -->
  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例 2：num = 687（均衡 2+1）</text>

  <text x="326" y="101" text-anchor="end" font-size="9.5" fill="#888">数位</text>
  <rect x="334" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="370" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="406" y="82" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <path d="M 406 114 L 406 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="126" font-size="9.5" fill="#666" font-weight="bold">排序</text>

  <!-- sorted [6,7,8] -->
  <rect x="334" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="352" y="174" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">d₀→num1</text>
  <rect x="370" y="134" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="388" y="174" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">d₁→num2</text>
  <rect x="406" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="424" y="174" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">d₂→num1</text>

  <path d="M 406 180 L 406 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="192" font-size="9.5" fill="#666" font-weight="bold">拼接</text>

  <!-- num1=68, num2=7 -->
  <rect x="342" y="200" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="378" y="200" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="414" y="218" font-size="12" fill="#333" font-weight="bold">+</text>
  <rect x="424" y="200" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <text x="406" y="246" text-anchor="middle" font-size="10.5" fill="#888">num1 = 68（取 d₀,d₂）</text>
  <text x="406" y="260" text-anchor="middle" font-size="10.5" fill="#888">num2 = 7（取 d₁）</text>

  <rect x="346" y="270" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">68 + 7 = 75</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="330" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：升序排序后，偶下标全给 num1、奇下标全给 num2</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#888">n 偶则两数等长；n 奇则 num1 多收末位（最低权重配最大数位）</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888">前导零允许 → 0 落到高位贡献为 0，无需特判</text>
</svg>
