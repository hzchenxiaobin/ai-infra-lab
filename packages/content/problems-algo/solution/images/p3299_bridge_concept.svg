<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：nums[i] 是一座「桥」——出场次数 = 左选法 × 右选法</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献法：ans = Σ nums[i] × c[i]，只需数清每个元素的出场次数</text>

  <!-- 数组行 -->
  <text x="260" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">示例：nums = [1, 4, 2, 3]，盯住 i = 2（红色的 2）</text>
  <rect x="112" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="182" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="66" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="322" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="88" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="205" y="88" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="275" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="345" y="88" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 跳接弧线 -->
  <path d="M 135 102 C 160 128, 250 128, 273 104" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="134" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">差 +1（可隔着 4 跳）</text>
  <path d="M 277 104 C 292 124, 328 124, 343 103" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="132" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">差 +1</text>
  <path d="M 207 104 C 245 160, 305 160, 343 104" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="275" y="166" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">差 −1（递减那条路，同理）</text>

  <!-- 桥分解 -->
  <rect x="28" y="180" width="150" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="103" y="200" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">左半段（以 2 结尾）</text>
  <text x="103" y="218" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">空 ∅ 或 [1, 2]</text>
  <text x="103" y="234" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">非空选法 L↑ = 1</text>

  <text x="228" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">桥</text>
  <rect x="205" y="194" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 180 211 L 201 211" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 253 211 L 274 211" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="180" width="150" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="353" y="200" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">右半段（以 2 开头）</text>
  <text x="353" y="218" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">空 ∅ 或 [2, 3]</text>
  <text x="353" y="234" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">非空选法 R↑ = 1</text>

  <!-- 乘法原理 -->
  <rect x="36" y="252" width="448" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">含 2 的递增子序列 = (L↑+1) × (R↑+1) = 2 × 2 = 4 个（左右独立选取 → 乘法原理）</text>

  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">左右选法独立组合，拼出的 4 条递增子序列：</text>
  <rect x="56" y="312" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="332" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">空+空 [2]</text>
  <rect x="162" y="312" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">左+空 [1,2]</text>
  <rect x="268" y="312" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="332" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">空+右 [2,3]</text>
  <rect x="374" y="312" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="332" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">左+右 [1,2,3]</text>

  <!-- 总结公式 -->
  <rect x="28" y="352" width="464" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">c[i] = (L↑+1)(R↑+1) + (L↓+1)(R↓+1) <tspan fill="#b85450">− 1</tspan></text>
  <text x="260" y="387" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">递减方向同理；<tspan fill="#b85450">−1</tspan> 去掉单身 [nums[i]]——它在两个方向各被数一次</text>
</svg>
