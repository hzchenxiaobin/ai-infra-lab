<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每格挂一个「可达异或值集合」，值域只有 2¹⁰</text>

  <!-- Band 1 -->
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">① 值域坍缩：路径千千万，异或结果只有 1024 种</text>

  <text x="98" y="58" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">grid=[[1,2],[3,4]] 与各格可达集</text>

  <rect x="30" y="62" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="80" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="62" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">{1}</text>

  <rect x="102" y="62" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="80" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="134" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">{3}</text>

  <rect x="30" y="118" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="136" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="62" y="155" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">{2}</text>

  <rect x="102" y="118" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="134" y="136" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="134" y="155" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">{6,7}</text>

  <path d="M 94 85 L 101 85" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 62 108 L 62 116" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 94 141 L 101 141" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 134 108 L 134 116" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="62" width="300" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="82" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">0 ≤ grid[i][j] ≤ 1023 = 2¹⁰ − 1</text>

  <path d="M 355 94 L 355 102" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="102" font-size="9" fill="#555" filter="url(#rough2)">值域坍缩</text>

  <rect x="205" y="104" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="124" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">任意路径的异或值 ∈ [0, 1024)</text>

  <rect x="205" y="146" width="300" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="149" width="9" height="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="258" y="149" width="9" height="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="318" y="149" width="9" height="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="386" y="149" width="9" height="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="452" y="149" width="9" height="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="209" y="174" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="501" y="174" font-size="9" fill="#888" filter="url(#rough2)">1023</text>
  <text x="355" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">dp[i][j] ⊆ 1024 个槽位 —— 集合本身当状态</text>

  <!-- Band 2 -->
  <text x="260" y="210" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">② 转移：上方集合 ∪ 左方集合，再整体 ⊕ 当前格值 g</text>

  <rect x="58" y="218" width="404" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">dp[i][j] = { x ⊕ g : x ∈ dp[i−1][j] ∪ dp[i][j−1] }</text>

  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 (1,1)：({3} ∪ {2}) ⊕ 4 = {7, 6} ⇒ 该格最小 6 ✓</text>

  <!-- Band 3 -->
  <text x="260" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">③ 为什么不能像「最小路径和」只存 min？—— XOR 不保序</text>

  <rect x="46" y="292" width="214" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="153" y="312" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">min{x} ⊕ g ≠ min{x ⊕ g}</text>
  <text x="153" y="332" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">例：{4,5} 各 ⊕ 7 → {3,2}，min 从 4 换成 2</text>

  <rect x="280" y="292" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="312" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">最优路径可能带着非 min 值走向终点：</text>
  <text x="390" y="332" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5 ⊕ 7 = 2 &lt; 4 ⊕ 7 = 3</text>
</svg>
