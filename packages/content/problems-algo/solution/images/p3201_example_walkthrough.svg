<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,1,1,2,1,2]，奇偶序列 1,0,1,1,0,1,0</text>

  <rect x="60" y="40" width="385" height="222" fill="#ffffff" stroke="#555" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="165" y="40" width="140" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="53" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">k=0：相邻和为偶</text>
  <rect x="305" y="40" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375" y="53" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k=1：相邻和为奇</text>

  <rect x="60" y="58" width="385" height="22" fill="#f4f4f2" filter="url(#rough2)"/>
  <text x="77" y="73" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i</text>
  <text x="112" y="73" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">x</text>
