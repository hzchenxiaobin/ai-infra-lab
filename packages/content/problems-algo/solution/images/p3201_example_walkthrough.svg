  <text x="112" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="147" y="97" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
