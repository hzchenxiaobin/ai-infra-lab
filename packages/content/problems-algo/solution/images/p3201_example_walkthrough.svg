  <text x="445" y="276" text-anchor="end" font-size="9" fill="#777" filter="url(#rough2)">绿格＝本行刚更新的 f[p]，红格＝最终答案</text>

  <rect x="40" y="284" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">k=0 轮末 f=[3, 4]：恰好是偶数个数 3、奇数个数 4 → 全偶 / 全奇</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">k=1 轮末 f=[6, 5]：最长交替 6（以偶结尾）→ [1, 2, 1, 2, 1, 2]</text>

  <rect x="40" y="342" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(全奇 4, 全偶 3, 交替 6) = 6 ✓</text>
