<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr=[4,9,3], target=10, 二分 value ∈ [0, 9]</text>

  <!-- ====== Sorted arr + prefix ====== -->
  <text x="40" y="54" font-size="11" fill="#888" font-weight="bold">排序后：</text>

  <!-- arr boxes: [3, 4, 9] -->
  <g filter="url(#rough2)">
    <rect x="110" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="150" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="190" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="170" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="210" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
  <text x="160" y="104" text-anchor="middle" font-size="10" fill="#aaa">arr (sorted), max=9</text>

  <!-- prefix boxes: [0, 3, 7, 16] -->
  <text x="300" y="54" font-size="11" fill="#888" font-weight="bold">前缀和：</text>
  <g filter="url(#rough2)">
    <rect x="360" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="404" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="448" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="492" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <text x="382" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="426" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="470" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="514" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">16</text>

  <!-- divider -->
  <path d="M 40 110 L 520 110" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Binary search steps ====== -->
  <text x="40" y="132" font-size="11" fill="#888" font-weight="bold">二分过程：</text>

  <!-- Step 1: [0,9] mid=4 -->
  <rect x="20" y="144" width="120" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 1 轮 [0,9]</text>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#444">mid = 4</text>
  <text x="80" y="198" text-anchor="middle" font-size="10.5" fill="#b85450">S=7+4×1=11≥10</text>
  <text x="80" y="214" text-anchor="middle" font-size="10.5" fill="#555">hi = 3 ✓</text>

  <path d="M 140 185 L 168 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: [0,3] mid=1 -->
  <rect x="170" y="144" width="120" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">第 2 轮 [0,3]</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#444">mid = 1</text>
  <text x="230" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a">S=0+1×3=3&lt;10</text>
  <text x="230" y="214" text-anchor="middle" font-size="10.5" fill="#555">lo = 2</text>

  <path d="M 290 185 L 318 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 3: [2,3] mid=2 -->
  <rect x="320" y="144" width="120" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="164" text-anchor="middle" font-size="11" fill="#3a5a3a" font-weight="bold">第 3 轮 [2,3]</text>
  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#444">mid = 2</text>
  <text x="380" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a">S=0+2×3=6&lt;10</text>
  <text x="380" y="214" text-anchor="middle" font-size="10.5" fill="#555">lo = 3</text>

  <path d="M 440 185 L 468 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: [3,3] mid=3 -->
  <rect x="470" y="144" width="80" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="164" text-anchor="middle" font-size="11" fill="#3a5a3a" font-weight="bold">[3,3]</text>
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#444">mid=3</text>
  <text x="510" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a">S=3+3×2=9</text>
  <text x="510" y="214" text-anchor="middle" font-size="9.5" fill="#555">&lt;10, lo=4</text>

  <!-- divider -->
  <path d="M 40 240 L 520 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Comparison ====== -->
  <text x="40" y="264" font-size="11" fill="#888" font-weight="bold">双候选比较（lo=4 &gt; hi=3，循环结束）：</text>

  <!-- lo=4 candidate -->
  <rect x="60" y="278" width="200" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">lo = 4</text>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#555">S(4) = 11（首个 ≥ target）</text>
  <text x="160" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">|11 − 10| = 1</text>

  <!-- hi=3 candidate -->
  <rect x="300" y="278" width="200" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">hi = 3</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#555">S(3) = 9（末个 &lt; target）</text>
  <text x="400" y="338" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">|10 − 9| = 1</text>

  <!-- tie note -->
  <rect x="120" y="360" width="320" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">差距相等（1 = 1）→ 平手取较小值 → 返回 hi = 3</text>

  <!-- result -->
  <rect x="170" y="404" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">答案 = 3</text>
</svg>
