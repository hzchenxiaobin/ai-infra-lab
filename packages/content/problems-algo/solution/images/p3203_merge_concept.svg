<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">合并后的直径只有三种候选</text>

  <text x="110" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">树 1</text>
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">树 2</text>

  <line x1="125" y1="200" x2="62" y2="130" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="125" y1="200" x2="62" y2="270" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="125" y1="200" x2="188" y2="128" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <line x1="355" y1="200" x2="302" y2="140" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="355" y1="200" x2="302" y2="260" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="355" y1="200" x2="420" y2="200" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="420" y1="200" x2="482" y2="200" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <line x1="62" y1="130" x2="125" y2="200" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="125" y1="200" x2="188" y2="128" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="302" y1="140" x2="355" y2="200" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <line x1="355" y1="200" x2="302" y2="260" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <line x1="62" y1="270" x2="125" y2="200" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="355" y1="200" x2="420" y2="200" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="420" y1="200" x2="482" y2="200" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>

  <line x1="140" y1="200" x2="340" y2="200" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">新边 +1</text>

  <circle cx="125" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="205" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <circle cx="62" cy="130" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="135" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <circle cx="62" cy="270" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="275" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>
  <circle cx="188" cy="128" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">z</text>

  <circle cx="355" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="205" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="302" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="302" y="145" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <circle cx="302" cy="260" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="302" y="265" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">e</text>
  <circle cx="420" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f</text>
  <circle cx="482" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="482" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g</text>

  <text x="112" y="102" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 两端都在树 1：≤ d₁</text>
  <text x="290" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 两端都在树 2：≤ d₂</text>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 跨越新边（必经 a—b，两侧各自尽量长）：ecc₁(a) + 1 + ecc₂(b)</text>

  <rect x="70" y="330" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">合并后直径 = max(d₁, d₂, ecc₁(a)+1+ecc₂(b))</text>
</svg>
