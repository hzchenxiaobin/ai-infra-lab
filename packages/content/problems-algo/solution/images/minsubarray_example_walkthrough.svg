<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target = 7,  nums = [2,3,1,2,4,3]</text>

  <!-- ===================== Panel 0: 初始 ===================== -->
  <rect x="10" y="40" width="132" height="340" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="132" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始</text>

  <!-- nums cells (6 cells, w=18, start x=22) -->
  <text x="16" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="22" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="31" y="93" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="40" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="49" y="93" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="58" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="76" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85" y="93" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="94" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103" y="93" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="112" y="78" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="121" y="93" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="16" y="124" font-size="10" fill="#888">入窗：</text>
  <text x="76" y="124" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="16" y="148" font-size="10" fill="#888">sum：</text>
  <text x="76" y="148" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="16" y="172" font-size="10" fill="#888">命中：</text>
  <text x="76" y="172" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <rect x="20" y="186" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = ∞</text>

  <text x="76" y="244" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">预备：left=0</text>
  <text x="76" y="260" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">sum=0, 窗口空</text>
  <text x="76" y="296" text-anchor="middle" font-size="9.5" fill="#888">right 即将从 0 起步</text>

  <!-- ===================== Panel 1: right=3, ans=4 ===================== -->
  <rect x="148" y="40" width="132" height="340" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="148" y="40" width="132" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="214" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right=3 ★</text>

  <!-- nums cells, panel base x=148, cells start x=160 -->
  <text x="154" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="160" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="169" y="93" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="178" y="78" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="93" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="196" y="78" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="205" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="214" y="78" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <rect x="232" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="241" y="93" text-anchor="middle" font-size="10" fill="#999">4</text>
  <rect x="250" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="259" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>

  <!-- window highlight [1..3] -->
  <rect x="176" y="74" width="58" height="30" fill="none" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>

  <text x="154" y="124" font-size="10" fill="#888">入窗：</text>
  <text x="214" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2</text>
  <text x="154" y="148" font-size="10" fill="#888">sum：</text>
  <text x="214" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8 → 6</text>
  <text x="154" y="172" font-size="10" fill="#888">命中：</text>
  <text x="214" y="172" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>

  <rect x="158" y="186" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="214" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 4</text>

  <rect x="154" y="228" width="120" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="214" y="246" text-anchor="middle" font-size="9.5" fill="#333">左缩：−2 → sum=6</text>
  <text x="214" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040">left: 0 → 1</text>
  <text x="214" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">窗口 [1..3], sum=6&lt;7</text>
  <text x="214" y="312" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">停止左缩</text>

  <!-- ===================== Panel 2: right=4, ans=3 ===================== -->
  <rect x="286" y="40" width="132" height="340" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="286" y="40" width="132" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="352" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right=4 ★</text>

  <text x="292" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="298" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="93" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="316" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="334" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="343" y="93" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="352" y="78" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="361" y="93" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="370" y="78" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="379" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <rect x="388" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="397" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>

  <!-- window highlight [3..4] -->
  <rect x="350" y="74" width="40" height="30" fill="none" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>

  <text x="292" y="124" font-size="10" fill="#888">入窗：</text>
  <text x="352" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+4</text>
  <text x="292" y="148" font-size="10" fill="#888">sum：</text>
  <text x="352" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">10 → 6</text>
  <text x="292" y="172" font-size="10" fill="#888">命中：</text>
  <text x="352" y="172" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓ ✓</text>

  <rect x="296" y="186" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="352" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 3</text>

  <rect x="292" y="228" width="120" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="352" y="246" text-anchor="middle" font-size="9.5" fill="#333">−3→7(✓) → −1→6</text>
  <text x="352" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040">left: 1 → 3</text>
  <text x="352" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">连缩两次</text>
  <text x="352" y="312" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">窗口 [3..4]</text>

  <!-- ===================== Panel 3: right=5, ans=2 ===================== -->
  <rect x="424" y="40" width="132" height="340" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="424" y="40" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right=5 ★</text>

  <text x="430" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="436" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="93" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="454" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="463" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="472" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="93" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="490" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="499" y="93" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="508" y="78" width="18" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="517" y="93" text-anchor="middle" font-size="10" fill="#999">4</text>
  <rect x="526" y="78" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="535" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- window highlight [5..5] -->
  <rect x="524" y="74" width="22" height="30" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>

  <text x="430" y="124" font-size="10" fill="#888">入窗：</text>
  <text x="490" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+3</text>
  <text x="430" y="148" font-size="10" fill="#888">sum：</text>
  <text x="490" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9 → 3</text>
  <text x="430" y="172" font-size="10" fill="#888">命中：</text>
  <text x="490" y="172" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓ ✓</text>

  <rect x="434" y="186" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 2</text>

  <rect x="430" y="228" width="120" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="490" y="246" text-anchor="middle" font-size="9.5" fill="#333">−2→7(✓) → −4→3</text>
  <text x="490" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040">left: 3 → 5</text>
  <text x="490" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" font-style="italic">最短窗口 [4..5]</text>
  <text x="490" y="312" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">= [4,3] 长度 2</text>

  <!-- bottom summary -->
  <rect x="10" y="392" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">最终 ans = 2，对应子数组 [4, 3]</text>
</svg>
