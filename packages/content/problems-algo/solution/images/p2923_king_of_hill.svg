<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">打擂台：一个矩阵单元定胜负</text>

  <!-- 左上说明框 -->
  <rect x="48" y="44" width="170" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="133" y="62" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">一次比较 =</text>
  <text x="133" y="78" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">一次 O(1) 矩阵查询</text>

  <!-- 擂主 -->
  <path d="M 92 112 L 92 100 L 99 106 L 104 96 L 109 106 L 116 100 L 116 112 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="118" width="112" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="104" y="142" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">擂主 c</text>
  <text x="104" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">当前最强候选</text>

  <!-- 挑战者 -->
  <rect x="360" y="118" width="112" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="416" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">挑战者 j</text>
  <text x="416" y="160" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">依次上擂 (j = 1..n−1)</text>

  <!-- 判定菱形 -->
  <path d="M 255 103 L 317 147 L 255 191 L 193 147 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="142" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">grid[j][c]</text>
  <text x="255" y="160" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">== 1 ?</text>

  <path d="M 160 147 L 189 147" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 147 L 321 147" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 上分支：是 -->
  <text x="268" y="96" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 255 103 L 255 66 L 322 66" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="44" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="62" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">王冠易主</text>
  <text x="411" y="80" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">champion = j</text>

  <!-- 下分支：否 -->
  <text x="268" y="206" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 255 191 L 255 236 L 300 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="304" y="214" width="192" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="232" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">擂主守擂：champion 不变</text>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（由完全性，此时必有 c 强于 j）</text>

  <!-- 分隔线 -->
  <path d="M 40 278 L 480 278" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 不变量说明 -->
  <rect x="40" y="290" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">循环不变量：处理完 0..j 后，擂主是前 j+1 支队伍中的最强者</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">j 击败擂主 ⇒ 由传递性 j 也强于擂主曾击败的所有人，归纳链不断</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">循环结束 ⇒ 擂主即全场最大元，直接返回</text>
</svg>
