<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Lisp 表达式的四种形式</text>

  <!-- Form 1: integer -->
  <rect x="40" y="50" width="230" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="72" font-size="12" fill="#446688" font-weight="bold">① 整数</text>
  <text x="52" y="89" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">-5 / 0 / 42</text>

  <!-- Form 2: variable -->
  <rect x="290" y="50" width="230" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">② 变量</text>
  <text x="302" y="89" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">x  /  y2  /  foo</text>

  <!-- Form 3: add -->
  <rect x="40" y="112" width="230" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="134" font-size="12" fill="#d6a040" font-weight="bold">③ add</text>
  <text x="52" y="151" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">(add e1 e2) → e1+e2</text>

  <!-- Form 4: mult -->
  <rect x="290" y="112" width="230" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="134" font-size="12" fill="#d6a040" font-weight="bold">④ mult</text>
  <text x="302" y="151" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">(mult e1 e2) → e1*e2</text>

  <!-- Form 5: let -->
  <rect x="40" y="174" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="12" fill="#b85450" font-weight="bold">⑤ let（绑定 + 最终表达式）</text>
  <text x="52" y="216" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">(let v1 e1 v2 e2 ... vn en expr)</text>

  <!-- Token split note -->
  <rect x="40" y="248" width="480" height="62" fill="#f4f4f4" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="268" font-size="12" fill="#444" font-weight="bold">Token 化：把 ( ) 当独立 token</text>
  <text x="52" y="286" font-size="11" fill="#666" font-family="'Comic Sans MS', monospace">(add 1 2)  →  (  add  1  2  )</text>
  <text x="52" y="302" font-size="11" fill="#888">括号不与操作名分开，须单独拆出</text>

  <!-- footer -->
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#888">遇 ( 递归求子表达式，遇 ) 返回；原子一步出值</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#888">自相似结构 → 递归下降天然匹配</text>
</svg>
