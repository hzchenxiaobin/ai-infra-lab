<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">每排贪心决策流程（位掩码判定）</text>
  <path d="M 290 42 Q 450 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">用 10 位掩码 mask 记每排已占座位；L=0b11110(2-5) M=0b1111000(4-7) R=0b111100000(6-9)</text>

  <!-- 起点 -->
  <g filter="url(#sk)">
    <rect x="370" y="84" width="160" height="40" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="450" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5588" filter="url(#sk)">取出一排状态 mask</text>
  <path d="M 450 124 L 450 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 决策菱形 1: L 与 R 都空闲? -->
  <g filter="url(#sk)">
    <path d="M 450 150 L 580 200 L 450 250 L 320 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="450" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">(mask &amp; L)==0</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">且 (mask &amp; R)==0 ?</text>

  <!-- 是 → 2 组 -->
  <path d="M 580 200 L 660 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="192" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="660" y="178" width="170" height="44" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="745" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">该排放 2 组</text>
  <text x="745" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">L + R 互不重叠</text>

  <!-- 否 → 决策 2 -->
  <path d="M 320 200 L 230 200 L 230 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="268" y="192" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <path d="M 230 284 L 360 334 L 230 384 L 100 334 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="230" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#sk)">L / M / R</text>
  <text x="230" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#sk)">任一空闲 ?</text>

  <!-- 是 → 1 组 -->
  <path d="M 360 334 L 470 334" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="326" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="470" y="312" width="170" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="555" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">该排放 1 组</text>
  <text x="555" y="350" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">取任一空闲块</text>

  <!-- 否 → 0 组 -->
  <path d="M 230 384 L 230 432" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="416" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="145" y="432" width="170" height="40" rx="6" fill="#eeeeee" stroke="#999" stroke-width="1.8"/>
  </g>
  <text x="230" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#sk)">该排放 0 组</text>

  <!-- 汇总说明 -->
  <g filter="url(#sk)">
    <rect x="520" y="392" width="350" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="695" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">汇总到答案</text>
  <text x="532" y="438" font-size="11" fill="#444" filter="url(#sk)">ans = (n − 有预约的排数) × 2</text>
  <text x="532" y="458" font-size="11" fill="#444" filter="url(#sk)">      + Σ 每个有预约排的贪心结果</text>
  <text x="532" y="480" font-size="11" fill="#b85450" filter="url(#sk)">未出现在 map 的排 = 全空 → 恒为 2 组</text>

  <path d="M 745 222 L 745 388" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 640 334 L 520 392" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 315 452 L 520 444" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
</svg>
