  <!-- island labels -->
  <text x="91" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">岛屿A</text>
  <text x="259" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">岛屿B</text>
  <text x="175" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">岛屿C</text>

  <!-- callout: max area = 8 -->
  <g filter="url(#rough2)">
    <rect x="360" y="150" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="435" y="176" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">最大面积 = 8</text>
  <path d="M 360 170 Q 330 168 322 165" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <g filter="url(#rough2)"><rect x="360" y="80" width="20" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="388" y="92" font-size="11" fill="#444">岛屿B（面积8，最大）</text>
  <g filter="url(#rough2)"><rect x="360" y="104" width="20" height="16" rx="3" fill="#e8f0fe" stroke="#446688"/></g>
  <text x="388" y="116" font-size="11" fill="#444">岛屿A（面积3）</text>
  <g filter="url(#rough2)"><rect x="360" y="128" width="20" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/></g>
