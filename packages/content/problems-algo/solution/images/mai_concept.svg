  <g filter="url(#rough2)"><rect x="360" y="208" width="20" height="16" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="388" y="220" font-size="11" fill="#444">水 '0'</text>

  <!-- core idea box -->
  <g filter="url(#rough2)">
    <rect x="360" y="248" width="390" height="108" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="376" y="272" font-size="13" font-weight="bold" fill="#444">核心观察</text>
  <text x="376" y="294" font-size="12" fill="#444">遍历网格，遇到 1 就 DFS 探索整个连通块，</text>
  <text x="376" y="312" font-size="12" fill="#444">「沉岛」标记已访问，DFS 返回该块格子数 = 面积；</text>
  <text x="376" y="330" font-size="12" fill="#444">每求出一个面积就更新全局最大值 max_area。</text>
  <text x="376" y="348" font-size="11" fill="#888">与 200 岛屿数量同模板：计数 → 求最大面积。</text>
</svg>
