<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：逐天 入堆 → 清腐烂 → 吃堆顶
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,70 L270,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="180" y="88" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">heap=[], ans=0, d=0</text>
  <path d="M270,118 L270,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: d<n or heap非空? -->
  <polygon points="270,136 350,166 270,196 190,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d &lt; n 或</text>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">heap 非空?</text>

  <!-- no branch -> return -->
  <path d="M350,166 L408,166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="158" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="412" y="150" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="468" y="172" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M270,196 L270,210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="206" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- push if apples[d]>0 -->
  <rect x="150" y="214" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 d&lt;n 且 apples[d]&gt;0：push(d+days[d], apples[d])</text>
  <path d="M270,244 L270,256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- clean rotten -->
  <rect x="120" y="260" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">while heap 顶.腐烂日 ≤ d：pop（清腐烂）</text>
  <path d="M270,290 L270,302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- eat -->
  <rect x="120" y="306" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 heap 非空：ans++；堆顶数量−1，归零则 pop</text>

  <!-- loop back: from right of eat box up to diamond -->
  <path d="M420,321 L488,321 L488,166 L352,166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="246" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d++</text>
  <text x="496" y="260" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到</text>
  <text x="496" y="274" font-size="10" fill="#4a7a3a" filter="url(#rough2)">判定</text>

  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    O((n+T) log n)；T = 最后一个腐烂日
  </text>
</svg>
