<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：找朋友 → JOIN 页面 → 排除己有</text>

  <!-- ===== ① 找朋友（UNION） ===== -->
  <rect x="50" y="44" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="62" font-size="11.5" fill="#446688" font-weight="bold">① 找出用户 1 的全部好友（UNION 合并双向）</text>
  <text x="64" y="80" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">SELECT user2 AS friend FROM Friendship WHERE user1 = </text>
  <text x="430" y="80" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="64" y="96" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">UNION SELECT user1 AS friend FROM Friendship WHERE user2 = </text>
  <text x="468" y="96" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="64" y="110" font-size="10" fill="#888">→ 朋友集合 = {2, 3, 4}（两个方向合并去重）</text>

  <path d="M 290 118 L 290 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ② JOIN Likes 取候选页面 ===== -->
  <rect x="50" y="140" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="158" font-size="11.5" fill="#4a7a3a" font-weight="bold">② JOIN Likes：获取朋友喜欢的页面</text>
  <text x="64" y="176" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">JOIN Likes l ON l.user_id = f.friend</text>
  <text x="64" y="190" font-size="10" fill="#888">→ 候选页面 = {23, 77, 24, 77}（含重复，DISTINCT 去重）</text>

  <path d="M 290 198 L 290 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ③ 排除用户已喜欢的页面 ===== -->
  <rect x="50" y="220" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="238" font-size="11.5" fill="#d6a040" font-weight="bold">③ 排除用户 1 已喜欢的页面</text>
  <text x="64" y="256" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">WHERE l.page_id NOT IN (SELECT page_id FROM Likes WHERE user_id = </text>
  <text x="520" y="256" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="64" y="270" font-size="10" fill="#888">→ 排除 page 88（用户 1 已喜欢），候选 {23, 77, 24} 均不在其中</text>

  <path d="M 290 278 L 290 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ④ DISTINCT 输出 ===== -->
  <rect x="50" y="300" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="318" font-size="11.5" fill="#b85450" font-weight="bold">④ DISTINCT 输出推荐页面</text>
  <text x="64" y="336" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">SELECT DISTINCT page_id</text>

  <path d="M 290 346 L 290 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 输出预览 ===== -->
  <text x="40" y="378" font-size="11" fill="#888">输出结果</text>
  <rect x="230" y="366" width="120" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="230" y1="390" x2="350" y2="390" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="383" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">page_id</text>
  <text x="290" y="406" text-anchor="middle" font-size="10.5" fill="#333">77</text>
  <text x="290" y="420" text-anchor="middle" font-size="9.5" fill="#888">23, 24 ...</text>

  <!-- 右侧关键提示 -->
  <text x="370" y="378" font-size="10" fill="#888">💡 UNION 天然</text>
  <text x="370" y="392" font-size="10" fill="#888">　去重好友</text>
  <text x="370" y="406" font-size="10" fill="#888">　DISTINCT</text>
  <text x="370" y="420" font-size="10" fill="#888">　去重页面</text>
</svg>
