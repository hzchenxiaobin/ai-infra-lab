<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：栈构造表达式树（buildTree）</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="200" y="44" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15"/>
  </g>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始，stack = []</text>

  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <g filter="url(#rough2)">
    <rect x="180" y="92" width="160" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">遍历每个 token t</text>

  <path d="M 260 122 L 260 138" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: 是数字? -->
  <g filter="url(#rough2)">
    <polygon points="260,138 340,180 260,222 180,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">t 是数字?</text>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(非运算符)</text>

  <!-- Yes branch (left) -->
  <path d="M 180 180 L 96 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="24" y="160" width="72" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="60" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">new NumberNode</text>
  <text x="60" y="193" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">push</text>

  <!-- No branch (right) -->
  <path d="M 340 180 L 424 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否(运算符)</text>
  <g filter="url(#rough2)">
    <rect x="424" y="150" width="100" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="474" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">right = pop()</text>
  <text x="474" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">left  = pop()</text>
  <text x="474" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">建 OpNode, push</text>

  <!-- Merge down -->
  <path d="M 60 202 L 60 252 L 260 252" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 474 212 L 474 252 L 260 252" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 252 L 260 270" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back / more tokens? -->
  <g filter="url(#rough2)">
    <polygon points="260,270 330,300 260,330 190,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有 token?</text>

  <!-- Yes -> back to loop -->
  <path d="M 330 300 L 470 300 L 470 107 L 340 107" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是，继续</text>

  <!-- No -> end -->
  <path d="M 190 300 L 120 300 L 120 358" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="44" y="358" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15"/>
  </g>
  <text x="124" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 stack[-1]（根节点）</text>

  <!-- Insight box -->
  <rect x="240" y="350" width="280" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="258" y="370" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">关键不变式</text>
  <text x="258" y="388" font-size="11" fill="#555" filter="url(#rough2)">• 栈中每个元素都是一棵已建好的子树</text>
  <text x="258" y="404" font-size="11" fill="#555" filter="url(#rough2)">• 运算符弹出右、左两元 → 子树拼成新树</text>
  <text x="258" y="420" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">先弹的是右子，后弹的是左子（顺序不可颠倒）</text>
</svg>
