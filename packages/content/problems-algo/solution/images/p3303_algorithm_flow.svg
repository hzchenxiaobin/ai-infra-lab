<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 455"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="455" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三阶段流水线：两次「拼接 + Z」建表，一趟扫窗口</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个窗口 O(1) 判定：L1 = pre[i]，L2 = suf[i+m−1]，L1 + L2 ≥ m − 1 ？</text>

  <!-- 输入 -->
  <rect x="200" y="50" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="68.5" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">读入 s、pattern</text>

  <path d="M 240 78 C 222 92, 115 82, 115 98" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 78 C 298 92, 405 82, 405 98" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左列：pre -->
  <rect x="30" y="100" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="116" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 拼接 t1 = pattern + '#' + s</text>
  <text x="115" y="131" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">分隔符不在字母表，Z 值封顶 m</text>
  <path d="M 115 140 L 115 152" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="152" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="167" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Z 函数线性扫描 → z1</text>
  <text x="115" y="181" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">最右匹配匣，均摊 O(n+m)</text>
  <path d="M 115 188 L 115 200" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="200" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pre[i] = z1[m+1+i]</text>
  <text x="115" y="233" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">s[i:] 与 pattern 前缀</text>
  <text x="115" y="245" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">的最长匹配（左端覆盖）</text>

  <!-- 中间：易错点 -->
  <rect x="207" y="112" width="116" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="132" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">⚠ 易错点</text>
  <text x="265" y="150" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">判定写 ≥ 别写 ==</text>
  <text x="265" y="164" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">全配时 L1+L2 ≥ m</text>
  <text x="265" y="178" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">m=1 时 ≥ 0 恒真</text>
  <text x="265" y="196" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">（官方 hint 的</text>
  <text x="265" y="210" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">等式只覆盖「恰一</text>
  <text x="265" y="224" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">个错配」，照抄会</text>
  <text x="265" y="238" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">漏完全匹配解）</text>

  <!-- 右列：suf -->
  <rect x="330" y="100" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="116" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 双翻转拼接</text>
  <text x="415" y="131" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">t2 = rev(pattern)+'#'+rev(s)</text>
  <path d="M 415 140 L 415 152" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="152" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="167" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Z 函数线性扫描 → z2</text>
  <text x="415" y="181" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">后缀匹配翻转后变前缀匹配</text>
  <path d="M 415 188 L 415 200" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="200" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="218" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf[i] = z2[m+1+(n−1−i)]</text>
  <text x="415" y="233" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">以 s[i] 结尾与 pattern</text>
  <text x="415" y="245" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">后缀的最长匹配（右端覆盖）</text>

  <!-- 汇入扫描循环 -->
  <path d="M 115 244 L 115 288 L 171 288" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 244 L 415 288 L 349 288" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体边界 -->
  <rect x="100" y="262" width="270" height="170" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="106" y="380" font-size="9.5" fill="#999" transform="rotate(-90 106 380)" filter="url(#rough2)">（扫描循环）</text>

  <rect x="175" y="272" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ for i = 0 … n−m 扫窗口</text>

  <path d="M 260 304 L 260 316" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,318 350,352 260,386 170,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">L1 + L2 ≥ m − 1 ？</text>
  <text x="260" y="364" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">空隙 ≤ 1 即几乎相等</text>

  <path d="M 350 352 L 370 352" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="374" y="336" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="428" y="356" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 i ✓</text>

  <path d="M 260 386 L 260 398" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="396" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="210" y="400" width="100" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i++，下一窗口</text>

  <!-- 回边 -->
  <path d="M 210 413 L 150 413 L 150 288 L 171 288" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 出口 -->
  <path d="M 310 413 L 366 413" fill="none" stroke="#a07830" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="406" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i 走完仍无命中</text>
  <rect x="370" y="398" width="112" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="426" y="417" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <text x="260" y="450" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两张 Z 表一趟建好，之后每个窗口只读两个数、比一次大小 —— 这就是线性复杂度</text>
</svg>
