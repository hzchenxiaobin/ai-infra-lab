<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三元组的三道"距离关卡"与剪枝</text>

  <!-- Array label -->
  <text x="30" y="74" font-size="11" fill="#888">arr =</text>

  <!-- Array boxes: [3, 0, 1, 1, 9, 7] -->
  <!-- i=0 val=3 (highlighted blue) -->
  <rect x="70" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="93" y="102" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">i</text>

  <!-- i=1 val=0 (highlighted orange) -->
  <rect x="124" y="56" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="147" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">j</text>

  <!-- i=2 val=1 (highlighted green) -->
  <rect x="178" y="56" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="201" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">k</text>

  <!-- i=3 val=1 -->
  <rect x="232" y="56" width="46" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="77" text-anchor="middle" font-size="13" fill="#888">1</text>
  <text x="255" y="102" text-anchor="middle" font-size="9" fill="#bbb">3</text>

  <!-- i=4 val=9 -->
  <rect x="286" y="56" width="46" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="77" text-anchor="middle" font-size="13" fill="#888">9</text>
  <text x="309" y="102" text-anchor="middle" font-size="9" fill="#bbb">4</text>

  <!-- i=5 val=7 -->
  <rect x="340" y="56" width="46" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="363" y="77" text-anchor="middle" font-size="13" fill="#888">7</text>
  <text x="363" y="102" text-anchor="middle" font-size="9" fill="#bbb">5</text>

  <!-- Condition arrows between highlighted boxes -->
  <!-- Cond 1: |arr[i]-arr[j]| <= a  (between i=0 and j=1) -->
  <path d="M 93 130 L 93 146 L 147 146 L 147 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="134" width="72" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="147" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">|3−0|=3 ≤ a=7 ✓</text>

  <!-- Cond 2: |arr[j]-arr[k]| <= b  (between j=1 and k=2) -->
  <path d="M 147 160 L 147 176 L 201 176 L 201 160" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="138" y="164" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="174" y="177" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">|0−1|=1 ≤ b=2 ✓</text>

  <!-- Cond 3: |arr[i]-arr[k]| <= c  (between i=0 and k=2, arching over) -->
  <path d="M 93 130 Q 147 210 201 130" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104" y="196" width="86" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="147" y="209" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">|3−1|=2 ≤ c=3 ✓</text>

  <!-- Result tag -->
  <rect x="380" y="56" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">三元组 (0,1,2)</text>
  <text x="440" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">三关全过 → ✓</text>

  <!-- Divider -->
  <line x1="30" y1="232" x2="530" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="30" y="246" width="500" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="268" font-size="12" fill="#444" font-weight="bold">剪枝直觉：三道关卡依次检查，尽早淘汰</text>
  <text x="50" y="290" font-size="11" fill="#666">① 条件1只依赖 (i, j)：不满足则跳过整个 k 循环，省 O(n) 次</text>
  <text x="50" y="310" font-size="11" fill="#666">② 条件2只依赖 (j, k)：不满足则跳过条件3，省一次比较</text>
  <text x="50" y="332" font-size="11" fill="#666">③ 条件3依赖 (i, k)：最后检查，作为最终判定</text>
  <text x="50" y="354" font-size="12" fill="#b85450" font-weight="bold">→ 检查顺序 1→2→3，失败越早省得越多</text>
</svg>
