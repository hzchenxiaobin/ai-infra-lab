<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：time = [1,2,3], totalTrips = 5</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">答案区间 [1, min(time)×T] = [1, 1×5] = [1, 5]</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="58" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">轮次</text>
  <text x="120" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">[lo, hi]</text>
  <text x="180" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">mid</text>
  <text x="245" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">⌊mid/1⌋</text>
  <text x="305" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">⌊mid/2⌋</text>
  <text x="365" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">⌊mid/3⌋</text>
  <text x="420" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">total</text>
  <text x="490" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">≥5?</text>

  <!-- ===== Row 1: [1,5] mid=3 ===== -->
  <rect x="30" y="90" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="110" text-anchor="middle" font-size="11" fill="#333">第1轮</text>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#333">[1, 5]</text>
  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="245" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="305" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="365" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="420" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="490" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- action arrow for row 1 -->
  <path d="M 536 106 L 548 106" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: [1,2] mid=1 ===== -->
  <rect x="30" y="126" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="146" text-anchor="middle" font-size="11" fill="#333">第2轮</text>
  <text x="120" y="146" text-anchor="middle" font-size="11" fill="#333">[1, 2]</text>
  <text x="180" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="245" y="146" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="305" y="146" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="365" y="146" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- action arrow for row 2 -->
  <path d="M 536 142 L 548 142" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: [2,2] mid=2 ===== -->
  <rect x="30" y="162" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="182" text-anchor="middle" font-size="11" fill="#333">第3轮</text>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#333">[2, 2]</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="245" y="182" text-anchor="middle" font-size="11" fill="#b85450">2</text>
  <text x="305" y="182" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="365" y="182" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- action arrow for row 3 -->
  <path d="M 536 178 L 548 178" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: loop ends ===== -->
  <rect x="30" y="198" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="11" fill="#333">第4轮</text>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#333">lo=3&gt;hi=2</text>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="245" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="305" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="365" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="490" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结束</text>

  <!-- ===== Action annotations on the right ===== -->
  <rect x="30" y="244" width="500" height="64" fill="#fafafa" stroke="none"/>
  <text x="40" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold">第1轮：</text>
  <text x="92" y="262" font-size="10.5" fill="#555">total = 3+1+1 = 5 ≥ 5 → 可行，记 ans=3，去左半 [1,2] 找更小</text>
  <text x="40" y="280" font-size="10.5" fill="#b85450" font-weight="bold">第2轮：</text>
  <text x="92" y="280" font-size="10.5" fill="#555">total = 1+0+0 = 1 &lt; 5 → 时间不够，去右半 [2,2]</text>
  <text x="40" y="298" font-size="10.5" fill="#b85450" font-weight="bold">第3轮：</text>
  <text x="92" y="298" font-size="10.5" fill="#555">total = 2+1+0 = 3 &lt; 5 → 时间不够，lo = 3</text>

  <!-- ===== Result box ===== -->
  <rect x="80" y="324" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo=3 &gt; hi=2，循环结束，返回 ans = 3</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#666">3 个公交车在 t=3 时分别完成 3、1、1 趟，共 5 趟</text>

  <!-- final answer -->
  <text x="280" y="398" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">ans = 3 ✓</text>

  <!-- legend -->
  <rect x="40" y="406" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="58" y="415" font-size="9.5" fill="#555">可行</text>
  <rect x="100" y="406" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="118" y="415" font-size="9.5" fill="#555">不可行</text>
</svg>
