<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 1]</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">查 2^0..2^2，首个不在集合的幂即答案</text>

  <!-- ===== Step 1: build set ===== -->
  <text x="30" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 构造集合 S = {1, 2}</text>

  <!-- ===== Step 2: scan powers table ===== -->
  <text x="30" y="104" font-size="11.5" fill="#446688" font-weight="bold">② 逐个 2^k 在 S 中查询：</text>

  <!-- table header -->
  <rect x="30" y="114" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <rect x="110" y="114" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2^k</text>
  <rect x="210" y="114" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是否 ∈ S</text>
  <rect x="330" y="114" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">说明</text>

  <!-- row k=0 -->
  <rect x="30" y="140" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="160" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="140" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="210" y="140" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">在 ✓</text>
  <rect x="330" y="140" width="240" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="160" font-size="10.5" fill="#444">1 可表达（nums 本身就有 1）</text>

  <!-- row k=1 -->
  <rect x="30" y="170" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="170" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="190" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="210" y="170" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">在 ✓</text>
  <rect x="330" y="170" width="240" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="190" font-size="10.5" fill="#444">2 可表达（nums 也有 2）</text>

  <!-- row k=2 -> answer -->
  <rect x="30" y="200" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="110" y="200" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <rect x="210" y="200" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">不在 ✗</text>
  <rect x="330" y="200" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="336" y="221" font-size="10.5" fill="#b85450" font-weight="bold">无法凑出 bit2 ⟹ 返回 4</text>

  <!-- arrow to answer -->
  <path d="M 160 232 L 160 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="40" y="264" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 4 ✓（与示例 1 一致）</text>

  <!-- ===== Side note: why 1..3 all expressible ===== -->
  <rect x="40" y="322" width="540" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="342" font-size="11" fill="#446688" font-weight="bold">为何 1,2,3 都可表达？</text>
  <text x="50" y="358" font-size="10" fill="#444">1∈S ⟹ 1 可表达；  2∈S ⟹ 2 可表达；  3=2^1|2^0=2|1 ⟹ 3 可表达（两纯净幂 OR）。</text>
  <text x="50" y="374" font-size="10" fill="#444">一般地：2^0..2^m 都在 S ⟹ 1..2^(m+1)-1 全可表达，下一个断点正是 2^(m+1)。</text>
  <text x="50" y="386" font-size="10" fill="#b85450" font-weight="bold">故「最小不可表达」必是某个缺失的 2^k。</text>
</svg>
