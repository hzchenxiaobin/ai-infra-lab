<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有效的山脉数组：先严格上升 ↗，再严格下降 ↘</text>

  <!-- ===== Valid mountain array: [1, 3, 5, 4, 2] ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 有效山脉数组  arr = [1, 3, 5, 4, 2]</text>

  <!-- Base line -->
  <line x1="120" y1="240" x2="440" y2="240" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Bars: width 52, gap 8, start x=134 -->
  <!-- Bar 0: val=1, climbing -->
  <rect x="134" y="216" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="234" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- Bar 1: val=3, climbing -->
  <rect x="194" y="168" width="52" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- Bar 2: val=5, PEAK -->
  <rect x="254" y="120" width="52" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">5</text>
  <!-- peak crown marker -->
  <path d="M 272 112 L 280 100 L 288 112" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">山顶 i=2</text>
  <!-- Bar 3: val=4, descending -->
  <rect x="314" y="144" width="52" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <!-- Bar 4: val=2, descending -->
  <rect x="374" y="192" width="52" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Index labels below base -->
  <text x="160" y="256" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="220" y="256" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="340" y="256" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- Zone brackets -->
  <!-- Climbing zone bracket -->
  <path d="M 134 270 L 134 276 L 246 276 L 246 270" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">严格上升</text>
  <text x="190" y="304" text-anchor="middle" font-size="9" fill="#666">arr[0]&lt;arr[1]&lt;arr[2]</text>
  <!-- Peak label -->
  <path d="M 254 270 L 254 276 L 306 276 L 306 270" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">山顶</text>
  <!-- Descending zone bracket -->
  <path d="M 314 270 L 314 276 L 426 276 L 426 270" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="370" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">严格下降</text>
  <text x="370" y="304" text-anchor="middle" font-size="9" fill="#666">arr[2]&gt;arr[3]&gt;arr[4]</text>

  <!-- Separator -->
  <line x1="40" y1="322" x2="520" y2="322" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Invalid cases ===== -->
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非山脉数组的常见情况</text>

  <!-- Case 1: Plateau [3, 5, 5] -->
  <text x="110" y="360" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">平台（相邻相等）</text>
  <text x="110" y="374" text-anchor="middle" font-size="10" fill="#888">[3, 5, 5]</text>
  <!-- mini bars: base y=410, scale 6px/unit, width 30, gap 3 -->
  <line x1="65" y1="410" x2="155" y2="410" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="68" y="392" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83" y="406" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="101" y="380" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="400" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="134" y="380" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="400" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <!-- equal marker -->
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold"></text>
  <path d="M 131 370 L 134 366 L 137 370" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="117" y="428" text-anchor="middle" font-size="9" fill="#b85450">5 = 5 不严格</text>

  <!-- Case 2: Only climbing [1, 2, 3] -->
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">只升不降（无山顶）</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">[1, 2, 3]</text>
  <line x1="235" y1="410" x2="325" y2="410" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="238" y="404" width="30" height="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="253" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="271" y="398" width="30" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="286" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="304" y="392" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="319" y="406" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="280" y="428" text-anchor="middle" font-size="9" fill="#b85450">山顶在末尾，无下降段</text>

  <!-- Case 3: Only descending [5, 4, 3] -->
  <text x="450" y="360" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">只降不升（无山脚）</text>
  <text x="450" y="374" text-anchor="middle" font-size="10" fill="#888">[5, 4, 3]</text>
  <line x1="405" y1="410" x2="495" y2="410" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="408" y="392" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="423" y="406" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="441" y="398" width="30" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="456" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <rect x="474" y="404" width="30" height="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="489" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="450" y="428" text-anchor="middle" font-size="9" fill="#b85450">山顶在开头，无上升段</text>
</svg>
