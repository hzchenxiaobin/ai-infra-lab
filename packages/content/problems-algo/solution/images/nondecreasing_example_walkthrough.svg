<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两例对照</text>

  <!-- ===== Example 1: [4,2,3] -> true ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">例 1：nums = [4,2,3] → true（下降在头部，修法 A 即可）</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="30" y="68" width="500" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="55" y="83" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
    <text x="100" y="83" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">i</text>
    <text x="200" y="83" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">数组状态</text>
    <text x="360" y="83" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">判定 / 修法</text>
    <text x="485" y="83" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cnt</text>
  </g>

  <!-- step 1: i=1, 2<4 decrease, A -->
  <g filter="url(#rough2)">
    <rect x="30" y="90" width="500" height="34" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="111" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="100" y="111" text-anchor="middle" font-size="10" fill="#333">1</text>
    <!-- array cells -->
    <rect x="150" y="96" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="164" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
    <rect x="180" y="96" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="194" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
    <rect x="210" y="96" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="224" y="111" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="360" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2&lt;4 降 ★</text>
    <text x="430" y="111" text-anchor="middle" font-size="9.5" fill="#4a7a3a">i&lt;2 → A</text>
    <text x="485" y="111" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <!-- step 2: array modified [2,2,3], i=2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="124" width="500" height="34" fill="#e6f4ea" stroke="#a0c0a0" stroke-width="0.8"/>
    <text x="55" y="145" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="100" y="145" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="150" y="130" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="164" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="180" y="130" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="194" y="145" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <rect x="210" y="130" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="224" y="145" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="360" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3≥2 正常</text>
    <text x="430" y="145" text-anchor="middle" font-size="9.5" fill="#888">—</text>
    <text x="485" y="145" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <!-- result 1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="162" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结束：cnt=1 ≤ 1 → 返回 true ✓</text>
  </g>

  <!-- divider -->
  <path d="M 30 200 L 530 200" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Example 2: [3,4,2,3] -> false ===== -->
  <text x="40" y="226" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">例 2：nums = [3,4,2,3] → false（修法 B 引发连锁下降）</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="30" y="238" width="500" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="55" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
    <text x="100" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">i</text>
    <text x="200" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">数组状态</text>
    <text x="360" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">判定 / 修法</text>
    <text x="485" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cnt</text>
  </g>

  <!-- step 1: i=1, 4>=3 normal -->
  <g filter="url(#rough2)">
    <rect x="30" y="260" width="500" height="34" fill="#e8f0fe" stroke="#c0d0e8" stroke-width="0.8"/>
    <text x="55" y="281" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="100" y="281" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="150" y="266" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="164" y="281" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <rect x="180" y="266" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="194" y="281" text-anchor="middle" font-size="10" fill="#446688">4</text>
    <rect x="210" y="266" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="224" y="281" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <rect x="240" y="266" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="254" y="281" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="360" y="281" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4≥3 正常</text>
    <text x="430" y="281" text-anchor="middle" font-size="9.5" fill="#888">—</text>
    <text x="485" y="281" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <!-- step 2: i=2, 2<4 decrease, B -->
  <g filter="url(#rough2)">
    <rect x="30" y="294" width="500" height="34" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="315" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="100" y="315" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="150" y="300" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="164" y="315" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <rect x="180" y="300" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="194" y="315" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
    <rect x="210" y="300" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="224" y="315" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
    <rect x="240" y="300" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="254" y="315" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="360" y="315" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2&lt;4 降 ★</text>
    <text x="430" y="315" text-anchor="middle" font-size="9.5" fill="#a07820">2&lt;3 → B</text>
    <text x="485" y="315" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <!-- step 3: array modified [3,4,4,3], i=3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="328" width="500" height="34" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="349" text-anchor="middle" font-size="10" fill="#333">3</text>
    <text x="100" y="349" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="150" y="334" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="164" y="349" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <rect x="180" y="334" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="194" y="349" text-anchor="middle" font-size="10" fill="#446688">4</text>
    <rect x="210" y="334" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="224" y="349" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">4</text>
    <rect x="240" y="334" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="254" y="349" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
    <text x="360" y="349" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3&lt;4 降 ★</text>
    <text x="430" y="349" text-anchor="middle" font-size="9.5" fill="#b85450">cnt=2</text>
    <text x="485" y="349" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- result 2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="366" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="280" y="383" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt=2 &gt; 1 → 立即返回 false ✗</text>
  </g>

  <!-- footer insight -->
  <rect x="30" y="404" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">对比洞察：修法选择 + 就地修改 共同决定结果</text>
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#555">例 1 下降在头部（i=1，无 i−2 约束）→ 修法 A 压低前驱，后续不再下降</text>
  <text x="280" y="466" text-anchor="middle" font-size="10.5" fill="#555">例 2 下降在中部且 nums[i]&lt;nums[i−2] → 修法 B 抬高当前，但抬高的 4 压住后继 3</text>
  <text x="280" y="484" text-anchor="middle" font-size="10.5" fill="#555">→ 就地修改让后续扫描基于修正值，暴露「修复引发的连锁下降」</text>
  <text x="280" y="498" text-anchor="middle" font-size="10" fill="#888">这正是「只数原始下降次数」会误判 [3,4,2,3] 为 true 的原因</text>
</svg>
