<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [4,1,5,20,3]，答案 = 3</text>

  <!-- preprocess line -->
  <rect x="40" y="42" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="66" font-size="11" fill="#333">预处理：奇数 1→2、5→10、3→6，得</text>
  <text x="248" y="66" font-size="12" fill="#d6a040" font-weight="bold">[4, 2, 10, 20, 6]</text>
  <text x="360" y="66" font-size="11" fill="#666">，min = 2，全部入堆</text>

  <!-- ===== Steps table ===== -->
  <text x="40" y="102" font-size="11" fill="#446688" font-weight="bold">贪心折半过程（堆按降序展示）</text>

  <!-- header -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="110" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="63" y="126" text-anchor="middle" fill="#446688" font-weight="bold">轮次</text>
    <rect x="86" y="110" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="161" y="126" text-anchor="middle" fill="#446688" font-weight="bold">堆(降序)</text>
    <rect x="236" y="110" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="258" y="126" text-anchor="middle" fill="#446688" font-weight="bold">max</text>
    <rect x="280" y="110" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="302" y="126" text-anchor="middle" fill="#446688" font-weight="bold">min</text>
    <rect x="324" y="110" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="346" y="126" text-anchor="middle" fill="#446688" font-weight="bold">dev</text>
    <rect x="368" y="110" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="390" y="126" text-anchor="middle" fill="#446688" font-weight="bold">ans</text>
    <rect x="412" y="110" width="128" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="476" y="126" text-anchor="middle" fill="#446688" font-weight="bold">动作</text>
  </g>

  <!-- row init: 20,10,6,4,2 | 20 | 2 | 18 | 18 | 20÷2→10 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="134" width="46" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="63" y="151" text-anchor="middle" fill="#333">初始</text>
    <rect x="86" y="134" width="150" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="161" y="151" text-anchor="middle" fill="#333">20, 10, 6, 4, 2</text>
    <rect x="236" y="134" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="258" y="151" text-anchor="middle" fill="#b85450" font-weight="bold">20</text>
    <rect x="280" y="134" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="302" y="151" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="134" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="346" y="151" text-anchor="middle" fill="#333">18</text>
    <rect x="368" y="134" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="390" y="151" text-anchor="middle" fill="#4a7a3a" font-weight="bold">18</text>
    <rect x="412" y="134" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="476" y="151" text-anchor="middle" fill="#333">20 ÷2 → 10</text>
  </g>

  <!-- row 1: 10,10,6,4,2 | 10 | 2 | 8 | 8 | 10÷2→5 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="160" width="46" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="63" y="177" text-anchor="middle" fill="#333">1</text>
    <rect x="86" y="160" width="150" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="161" y="177" text-anchor="middle" fill="#333">10, 10, 6, 4, 2</text>
    <rect x="236" y="160" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="258" y="177" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <rect x="280" y="160" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="302" y="177" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="160" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="346" y="177" text-anchor="middle" fill="#333">8</text>
    <rect x="368" y="160" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="390" y="177" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="412" y="160" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="476" y="177" text-anchor="middle" fill="#333">10 ÷2 → 5</text>
  </g>

  <!-- row 2: 10,6,5,4,2 | 10 | 2 | 8 | 8 | 10÷2→5 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="186" width="46" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="63" y="203" text-anchor="middle" fill="#333">2</text>
    <rect x="86" y="186" width="150" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="161" y="203" text-anchor="middle" fill="#333">10, 6, 5, 4, 2</text>
    <rect x="236" y="186" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="258" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <rect x="280" y="186" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="302" y="203" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="186" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="346" y="203" text-anchor="middle" fill="#333">8</text>
    <rect x="368" y="186" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="390" y="203" text-anchor="middle" fill="#333">8</text>
    <rect x="412" y="186" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="476" y="203" text-anchor="middle" fill="#333">10 ÷2 → 5</text>
  </g>

  <!-- row 3: 6,5,5,4,2 | 6 | 2 | 4 | 4 | 6÷2→3 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="212" width="46" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="63" y="229" text-anchor="middle" fill="#333">3</text>
    <rect x="86" y="212" width="150" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="161" y="229" text-anchor="middle" fill="#333">6, 5, 5, 4, 2</text>
    <rect x="236" y="212" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="258" y="229" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="280" y="212" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="302" y="229" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="212" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="346" y="229" text-anchor="middle" fill="#333">4</text>
    <rect x="368" y="212" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="390" y="229" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="412" y="212" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="476" y="229" text-anchor="middle" fill="#333">6 ÷2 → 3</text>
  </g>

  <!-- row 4: 5,5,4,3,2 | 5(奇) | 2 | 3 | 3 | stop -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="238" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="63" y="255" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="86" y="238" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="161" y="255" text-anchor="middle" fill="#d6a040" font-weight="bold">5, 5, 4, 3, 2</text>
    <rect x="236" y="238" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="258" y="255" text-anchor="middle" fill="#b85450" font-weight="bold">5✦</text>
    <rect x="280" y="238" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="302" y="255" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="324" y="238" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="346" y="255" text-anchor="middle" fill="#333">3</text>
    <rect x="368" y="238" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="390" y="255" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="412" y="238" width="128" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="476" y="255" text-anchor="middle" fill="#b85450" font-weight="bold">max 为奇，停止</text>
  </g>

  <!-- final config box -->
  <text x="40" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">最终可达配置：[4, 2, 5, 5, 3]，max − min = 5 − 2 = 3 ✓</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="302" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="63" y="323" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="86" y="302" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="109" y="323" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="132" y="302" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="155" y="323" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="178" y="302" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="201" y="323" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="224" y="302" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="247" y="323" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="109" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a">min</text>
    <text x="178" y="346" text-anchor="middle" font-size="10" fill="#b85450">max</text>
  </g>

  <!-- observation -->
  <rect x="300" y="302" width="250" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">观察</text>
  <text x="314" y="342" font-size="11" fill="#333">20→10→5：一路折半到奇数 5 停；</text>
  <text x="314" y="358" font-size="11" fill="#333">沿途 dev 依次 18→8→8→4→3，</text>
  <text x="314" y="374" font-size="11" fill="#333">取最小值 3 即答案。</text>

  <!-- footer -->
  <text x="290" y="424" text-anchor="middle" font-size="11" fill="#888">每个元素只沿自己的「÷2 链」下行，所有中间状态都是真实可达配置 → 记录的 dev 必然可达</text>
  <text x="290" y="444" text-anchor="middle" font-size="10" fill="#aaa">✦ 表示奇数，无法再 ÷2；该元素折半链终止</text>
</svg>
