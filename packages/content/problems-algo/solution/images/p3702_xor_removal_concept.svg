<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：S = 保留 ⊕ 删除（删除即翻转）</text>

  <text x="157" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">全体 n 个元素</text>

  <rect x="80" y="62" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="62" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="188" y="62" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <path d="M131,60 L183,98" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="258" y="83" font-size="12" fill="#666" filter="url(#rough2)">S = 1⊕2⊕3 = 0</text>

  <text x="157" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删去 2 ↑</text>
  <path d="M157,108 L157,100" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="126" width="330" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">保留子序列的异或 = S ⊕ 被删元素的异或</text>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩余 [1,3] 的异或 = 0 ⊕ 2 = 2 ≠ 0 ✓</text>

  <rect x="20" y="204" width="150" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="228" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">S ≠ 0</text>
  <text x="95" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一个都不删</text>
  <text x="95" y="276" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">答案 = n</text>

  <rect x="185" y="204" width="150" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">S = 0，有非零元素</text>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删 1 个非零 x</text>
  <text x="260" y="276" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">答案 = n − 1</text>

  <rect x="350" y="204" width="150" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">全是 0</text>
  <text x="425" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任何子序列异或都为 0</text>
  <text x="425" y="276" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">答案 = 0</text>

  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">一趟扫描：答案 = S≠0 ? n : (有非零 ? n−1 : 0)</text>
</svg>
