<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：strength = [1, 3, 1, 2]</text>

  <text x="30" y="52" font-size="11" fill="#666" font-weight="bold">① 前缀和 P（P[0]=0, P[k]=Σ前k个）</text>
  <rect x="30" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="52" y="100" text-anchor="middle" font-size="8.5" fill="#888">P0</text>
  <rect x="76" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="98" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="98" y="100" text-anchor="middle" font-size="8.5" fill="#888">P1</text>
  <rect x="122" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="79" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="144" y="100" text-anchor="middle" font-size="8.5" fill="#888">P2</text>
  <rect x="168" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="79" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="190" y="100" text-anchor="middle" font-size="8.5" fill="#888">P3</text>
  <rect x="214" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="236" y="79" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="236" y="100" text-anchor="middle" font-size="8.5" fill="#888">P4</text>

  <text x="280" y="79" font-size="10" fill="#888">strength: [1,3,1,2]</text>

  <text x="310" y="52" font-size="11" fill="#666" font-weight="bold">② 前缀和的前缀和 PP（PP[k]=ΣP[0..k−1]）</text>
  <rect x="310" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="332" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP0</text>
  <rect x="356" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="378" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="378" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP1</text>
  <rect x="402" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="424" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP2</text>
  <rect x="448" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="470" y="79" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="470" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP3</text>
  <rect x="494" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="516" y="79" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="516" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP4</text>
  <rect x="540" y="60" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="559" y="79" text-anchor="middle" font-size="12" fill="#333">17</text>
  <text x="559" y="100" text-anchor="middle" font-size="8.5" fill="#888">PP5</text>

  <text x="30" y="130" font-size="11" fill="#666" font-weight="bold">③ 单调栈定边界后逐元素结算（左 L 严格更小 / 右 R 更小或相等）</text>

  <rect x="30" y="140" width="540" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="161" font-size="9.5" fill="#888" font-weight="bold">i</text>
  <text x="70" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">val</text>
  <text x="110" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">L</text>
  <text x="150" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">R</text>
  <text x="220" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">子数组之和总和 sumS</text>
  <text x="360" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">val×sumS</text>
  <text x="460" y="161" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">说明</text>

  <rect x="30" y="176" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="195" font-size="10" fill="#333">0</text>
  <text x="70" y="195" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="110" y="195" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="220" y="195" text-anchor="middle" font-size="9.5" fill="#555">1·(PP3−PP1)−2·(PP1−PP0)=5−0=5</text>
  <text x="360" y="195" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="460" y="195" text-anchor="middle" font-size="8.5" fill="#888">[1],[1,3]</text>

  <rect x="30" y="208" width="540" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="227" font-size="10" fill="#333">1</text>
  <text x="70" y="227" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="110" y="227" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="150" y="227" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="220" y="227" text-anchor="middle" font-size="9.5" fill="#555">1·(PP3−PP2)−1·(PP2−PP1)=4−1=3</text>
  <text x="360" y="227" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9</text>
  <text x="460" y="227" text-anchor="middle" font-size="8.5" fill="#888">[3]</text>

  <rect x="30" y="240" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="259" font-size="10" fill="#333">2</text>
  <text x="70" y="259" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="110" y="259" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <text x="150" y="259" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="220" y="259" text-anchor="middle" font-size="9.5" fill="#555">3·(PP5−PP3)−2·(PP3−PP0)=36−10=26</text>
  <text x="360" y="259" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">26</text>
  <text x="460" y="259" text-anchor="middle" font-size="8.5" fill="#888">6个子数组</text>

  <rect x="30" y="272" width="540" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="291" font-size="10" fill="#333">3</text>
  <text x="70" y="291" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="110" y="291" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="291" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="220" y="291" text-anchor="middle" font-size="9.5" fill="#555">1·(PP5−PP4)−1·(PP4−PP3)=7−5=2</text>
  <text x="360" y="291" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="460" y="291" text-anchor="middle" font-size="8.5" fill="#888">[2]</text>

  <path d="M 360 304 L 360 326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="320" font-size="9.5" fill="#b85450">求和</text>

  <rect x="180" y="330" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="356" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5 + 9 + 26 + 4 = 44 ✓</text>

  <rect x="30" y="386" width="540" height="120" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="406" font-size="11" fill="#444" font-weight="bold">关键验算（i=2, val=1, 管辖 6 个子数组）</text>
  <text x="40" y="424" font-size="9.5" fill="#555">左端点 l∈[0,2]，右端点 r∈[2,3]，组合 3×2=6 个：</text>
  <text x="40" y="440" font-size="9.5" fill="#555">[1,3,1]=5, [1,3,1,2]=7, [3,1]=4, [3,1,2]=6, [1]=1, [1,2]=3</text>
  <text x="40" y="456" font-size="9.5" fill="#555">子数组之和总和 = 5+7+4+6+1+3 = 26 → val×sumS = 1×26 = 26 ✓</text>
  <text x="40" y="476" font-size="9.5" fill="#888">公式 O(1) 算出 26，与枚举 6 个子数组逐一求和一致</text>
  <text x="40" y="498" font-size="9.5" fill="#aaa">注：i=0(val=1) 因右遇相等值 1 被截断在 R=2，只管辖 [1],[1,3]，不与 i=2 重复</text>
</svg>
