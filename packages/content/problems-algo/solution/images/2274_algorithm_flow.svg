<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 三类空隙 → 取 max</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">排序 O(n log n) 后一趟扫描 O(n)，空间 O(1)</text>

  <!-- step 1: sort -->
  <rect x="120" y="60" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333">① 对 special 升序排序</text>
  <path d="M 270 96 L 270 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: head gap -->
  <rect x="120" y="116" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11.5" fill="#333">② ans = special[0] − bottom（头段空隙）</text>
  <path d="M 270 152 L 270 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: loop adjacent specials -->
  <polygon points="270,172 392,214 270,256 148,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333">还有相邻特殊楼层？</text>
  <text x="270" y="226" text-anchor="middle" font-size="11" fill="#333">i = 1..n−1</text>

  <!-- branch: yes -->
  <text x="148" y="206" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <path d="M 148 214 L 96 214 L 96 262" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="264" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="284" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">中间段空隙</text>
  <text x="110" y="302" text-anchor="middle" font-size="11" fill="#333">gap = special[i]−special[i−1]−1</text>
  <text x="110" y="316" text-anchor="middle" font-size="10.5" fill="#333">ans = max(ans, gap)</text>

  <!-- loop back to decision -->
  <path d="M 110 264 L 110 214 L 148 214" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- branch: no -->
  <text x="392" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 392 214 L 444 214 L 444 262" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="360" y="264" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">尾段空隙</text>
  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#333">gap = top − special[last]</text>
  <text x="450" y="316" text-anchor="middle" font-size="10.5" fill="#333">ans = max(ans, gap)</text>

  <!-- merge -->
  <path d="M 110 322 L 110 348 L 270 348" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 322 L 450 348 L 270 348" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 348 L 270 368" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step: return max -->
  <rect x="110" y="370" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">③ return ans（三类空隙的最大值）</text>

  <!-- footer note -->
  <rect x="40" y="418" width="460" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="10.5" fill="#333">等价写法：在 special 前后加哨兵 bottom−1 / top+1，相邻隔板之差 −1 取 max</text>
</svg>
