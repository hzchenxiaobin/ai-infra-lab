<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [12, 5, 7, 23]</text>

  <!-- Step table header -->
  <rect x="40" y="44" width="60" height="24" fill="#ddd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步骤</text>
  <rect x="104" y="44" width="70" height="24" fill="#ddd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">当前元素</text>
  <rect x="178" y="44" width="90" height="24" fill="#ddd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">gcd 计算</text>
  <rect x="272" y="44" width="50" height="24" fill="#ddd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="297" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">g 结果</text>
  <rect x="326" y="44" width="200" height="24" fill="#ddd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">说明</text>

  <!-- Step 0: init -->
  <rect x="40" y="72" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="88" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <rect x="104" y="72" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="88" text-anchor="middle" font-size="10" fill="#333">12</text>
  <rect x="178" y="72" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="88" text-anchor="middle" font-size="10" fill="#333">g = 12</text>
  <rect x="272" y="72" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="88" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <rect x="326" y="72" width="200" height="24" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="88" text-anchor="middle" font-size="10" fill="#888">累加器初始化</text>

  <!-- Step 1: gcd(12, 5) -->
  <rect x="40" y="100" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="116" text-anchor="middle" font-size="10" fill="#333">①</text>
  <rect x="104" y="100" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="116" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="178" y="100" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="116" text-anchor="middle" font-size="10" fill="#333">gcd(12, 5)</text>
  <rect x="272" y="100" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="326" y="100" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=1 → 提前返回 true ✓</text>

  <!-- Arrow showing the flow -->
  <path d="M 297 96 L 297 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Verification equation -->
  <rect x="40" y="140" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">验证：取 5 和 7（都是 nums 的元素），gcd(5,7)=1</text>
  <text x="280" y="174" text-anchor="middle" font-size="11" fill="#444">5×3 + 7×(−2) = 15 − 14 = 1 ✓ → 是好数组</text>

  <!-- Second example: [3, 6] -->
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">反例：nums = [3, 6]</text>

  <rect x="40" y="220" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <rect x="104" y="220" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="236" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="178" y="220" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="236" text-anchor="middle" font-size="10" fill="#333">g = 3</text>
  <rect x="272" y="220" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="326" y="220" width="200" height="24" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="236" text-anchor="middle" font-size="10" fill="#888">累加器初始化</text>

  <rect x="40" y="248" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="264" text-anchor="middle" font-size="10" fill="#333">①</text>
  <rect x="104" y="248" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="264" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="178" y="248" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="264" text-anchor="middle" font-size="10" fill="#333">gcd(3, 6)</text>
  <rect x="272" y="248" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="326" y="248" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">g=3≠1 → 返回 false ✗</text>

  <path d="M 297 244 L 297 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Explanation -->
  <rect x="40" y="288" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3x + 6y = 3(x + 2y)，结果恒为 3 的倍数</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#b85450">无法表示 1 → 不是好数组</text>

  <!-- Summary -->
  <rect x="40" y="344" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">💡 子集选取不影响判定：全局 GCD=1 ⟺ 存在某子集 GCD=1</text>
</svg>
