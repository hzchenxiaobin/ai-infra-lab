<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：(()())(()) → ()()()</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">逐字符扫描，balance 跟踪深度，绿色保留 / 红色跳过</text>

  <!-- ===== Step numbers ===== -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="71" y="62">①</text>
    <text x="113" y="62">②</text>
    <text x="155" y="62">③</text>
    <text x="197" y="62">④</text>
    <text x="239" y="62">⑤</text>
    <text x="281" y="62">⑥</text>
    <text x="323" y="62">⑦</text>
    <text x="365" y="62">⑧</text>
    <text x="407" y="62">⑨</text>
    <text x="449" y="62">⑩</text>
  </g>

  <!-- ===== Row labels ===== -->
  <g filter="url(#rough2)" font-size="10" fill="#666" font-weight="bold">
    <text x="18" y="84">字符</text>
    <text x="18" y="118">balance</text>
    <text x="18" y="146">动作</text>
    <text x="18" y="178">结果</text>
  </g>

  <!-- ===== Character boxes (color-coded) ===== -->
  <!-- col 0: ( — skip red | col 1: ( — keep green | col 2: ) — keep green ... -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <!-- col 0: ( skip -->
    <rect x="52" y="70" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="71" y="90" fill="#b85450">(</text>
    <!-- col 1: ( keep -->
    <rect x="94" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="113" y="90" fill="#4a7a3a">(</text>
    <!-- col 2: ) keep -->
    <rect x="136" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="155" y="90" fill="#4a7a3a">)</text>
    <!-- col 3: ( keep -->
    <rect x="178" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="197" y="90" fill="#4a7a3a">(</text>
    <!-- col 4: ) keep -->
    <rect x="220" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="239" y="90" fill="#4a7a3a">)</text>
    <!-- col 5: ) skip -->
    <rect x="262" y="70" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="281" y="90" fill="#b85450">)</text>
    <!-- col 6: ( skip -->
    <rect x="304" y="70" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="323" y="90" fill="#b85450">(</text>
    <!-- col 7: ( keep -->
    <rect x="346" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="365" y="90" fill="#4a7a3a">(</text>
    <!-- col 8: ) keep -->
    <rect x="388" y="70" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="407" y="90" fill="#4a7a3a">)</text>
    <!-- col 9: ) skip -->
    <rect x="430" y="70" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="449" y="90" fill="#b85450">)</text>
  </g>

  <!-- ===== Balance values (after processing) ===== -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#446688" font-weight="bold">
    <text x="71" y="118">1</text>
    <text x="113" y="118">2</text>
    <text x="155" y="118">1</text>
    <text x="197" y="118">2</text>
    <text x="239" y="118">1</text>
    <text x="281" y="118" fill="#b85450">0</text>
    <text x="323" y="118">1</text>
    <text x="365" y="118">2</text>
    <text x="407" y="118">1</text>
    <text x="449" y="118" fill="#b85450">0</text>
  </g>

  <!-- ===== Action markers ===== -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="71" y="146" fill="#b85450">✗ 跳过</text>
    <text x="113" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="155" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="197" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="239" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="281" y="146" fill="#b85450">✗ 跳过</text>
    <text x="323" y="146" fill="#b85450">✗ 跳过</text>
    <text x="365" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="407" y="146" fill="#4a7a3a">✓ 保留</text>
    <text x="449" y="146" fill="#b85450">✗ 跳过</text>
  </g>

  <!-- ===== Primitive separator (dashed vertical line between col 5 and 6) ===== -->
  <path d="M 300 66 L 300 156" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">原语边界</text>

  <!-- ===== Result building row ===== -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <!-- col 0: skip → nothing -->
    <text x="71" y="178" fill="#ccc">·</text>
    <!-- col 1: keep ( -->
    <text x="113" y="178" fill="#4a7a3a">(</text>
    <!-- col 2: keep ) -->
    <text x="155" y="178" fill="#4a7a3a">)</text>
    <!-- col 3: keep ( -->
    <text x="197" y="178" fill="#4a7a3a">(</text>
    <!-- col 4: keep ) -->
    <text x="239" y="178" fill="#4a7a3a">)</text>
    <!-- col 5: skip → nothing -->
    <text x="281" y="178" fill="#ccc">·</text>
    <!-- col 6: skip → nothing -->
    <text x="323" y="178" fill="#ccc">·</text>
    <!-- col 7: keep ( -->
    <text x="365" y="178" fill="#4a7a3a">(</text>
    <!-- col 8: keep ) -->
    <text x="407" y="178" fill="#4a7a3a">)</text>
    <!-- col 9: skip → nothing -->
    <text x="449" y="178" fill="#ccc">·</text>
  </g>

  <!-- ===== Final result box ===== -->
  <rect x="140" y="200" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果</text>
  <text x="260" y="234" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">"()()()"</text>

  <!-- ===== Key observations ===== -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="256" width="460" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="46" y="276" fill="#d6a040" font-weight="bold">💡 关键观察</text>
    <text x="46" y="292" fill="#555">① 步骤①⑥⑦⑩的 balance 在处理前后经过 0——这些括号是外层，跳过（红色 ✗）。</text>
    <text x="46" y="308" fill="#555">② 步骤②③④⑤⑧⑨的 balance 始终 &gt; 0——这些括号在原语内部，保留（绿色 ✓）。</text>
    <text x="46" y="324" fill="#555">③ balance=0 的位置（步骤⑥后、步骤⑩后）即为原语边界，自然分隔原语①和原语②。</text>
  </g>
</svg>
