<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="470" fill="#fafafa"/>
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">负数标记法流程：一趟扫描即时收集重复</text>

  <!-- Phase label -->
  <rect x="30" y="40" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">仅需一趟（对比 448 两趟）</text>

  <!-- init -->
  <rect x="110" y="72" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 i = 0, res = []</text>
  <text x="230" y="108" text-anchor="middle" font-size="10.5" fill="#555">n = len(nums)</text>

  <path d="M 230 116 L 230 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- loop check diamond -->
  <polygon points="230,136 340,176 230,216 120,176" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="190" text-anchor="middle" font-size="10.5" fill="#777">还有元素？</text>

  <!-- No -> done -->
  <path d="M 340 176 L 410 176 L 410 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="168" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes down -->
  <path d="M 230 216 L 230 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="232" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- compute v -->
  <rect x="130" y="242" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">v = |nums[i]|</text>

  <path d="M 230 276 L 230 292" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- decision: nums[v-1] sign -->
  <polygon points="230,296 360,336 230,376 100,336" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[v−1] 符号?</text>
  <text x="230" y="350" text-anchor="middle" font-size="10" fill="#777">已标记 or 未标记</text>

  <!-- left branch: already negative -> duplicate -->
  <path d="M 100 336 L 60 336 L 60 396" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="68" y="328" font-size="10.5" fill="#b85450" font-weight="bold">&lt; 0</text>

  <rect x="20" y="398" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="95" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v 之前已见过</text>
  <text x="95" y="434" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">res.append(v)</text>

  <!-- right branch: positive -> mark -->
  <path d="M 360 336 L 400 336 L 400 396" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="328" font-size="10.5" fill="#4a7a3a" font-weight="bold">&gt; 0</text>

  <rect x="290" y="398" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="365" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">首次见到 v</text>
  <text x="365" y="434" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[v−1] = −nums[v−1]</text>

  <!-- i += 1 and loop back -->
  <path d="M 230 376 L 230 386" stroke="#888" stroke-width="2" fill="none"/>
  <rect x="170" y="388" width="120" height="0" fill="none"/>

  <!-- done -->
  <rect x="320" y="360" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="380" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i += 1</text>
  <text x="380" y="396" text-anchor="middle" font-size="10.5" fill="#555">回到循环顶</text>
  <path d="M 380 404 L 380 420 L 230 420 L 230 176 L 120 176" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="270" y="436" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="350" y="455" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 res（所有重复数）</text>
  <path d="M 410 404 L 410 436" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
</svg>
