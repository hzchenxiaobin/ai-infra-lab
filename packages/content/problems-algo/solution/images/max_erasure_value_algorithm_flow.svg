<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：变长滑动窗口 + 哈希集合</text>
  <path d="M 220 40 Q 360 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Start ===== -->
  <g filter="url(#sk2)"><rect x="250" y="58" width="220" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="360" y="82" text-anchor="middle" font-size="12" fill="#2b4a6a" font-weight="bold">开始：left=0, sum=0, max=0, seen=∅</text>

  <!-- arrow down -->
  <path d="M 360 100 L 360 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Loop entry ===== -->
  <g filter="url(#sk2)"><rect x="250" y="126" width="220" height="36" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="360" y="148" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">for right = 0 to n−1</text>

  <!-- arrow down -->
  <path d="M 360 166 L 360 188" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Decision diamond: nums[right] in seen? ===== -->
  <g filter="url(#sk2)">
    <path d="M 360 190 L 470 235 L 360 280 L 250 235 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#a03a3a" font-weight="bold">nums[right]</text>
  <text x="360" y="246" text-anchor="middle" font-size="12" fill="#a03a3a" font-weight="bold">∈ seen ?</text>

  <!-- Yes label + arrow to right -->
  <text x="486" y="232" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <path d="M 470 235 L 540 235" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- ===== Shrink box (right side) ===== -->
  <g filter="url(#sk2)"><rect x="540" y="206" width="150" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="615" y="226" text-anchor="middle" font-size="11" fill="#a03a3a" font-weight="bold">收缩左端</text>
  <text x="615" y="242" text-anchor="middle" font-size="10" fill="#a03a3a">seen.erase(nums[left])</text>
  <text x="615" y="256" text-anchor="middle" font-size="10" fill="#a03a3a">sum −= nums[left]; left++</text>

  <!-- arrow from shrink back up to diamond (loop) -->
  <path d="M 615 206 L 615 160 L 470 160 L 470 190" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="544" y="154" font-size="9" fill="#b85450">循环至无重复</text>

  <!-- No label + arrow down -->
  <text x="370" y="298" font-size="12" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 360 280 L 360 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Add to window ===== -->
  <g filter="url(#sk2)"><rect x="250" y="306" width="220" height="48" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="360" y="326" text-anchor="middle" font-size="11" fill="#2e5e2e" font-weight="bold">加入窗口</text>
  <text x="360" y="344" text-anchor="middle" font-size="11" fill="#2e5e2e">seen.insert(nums[right]); sum += nums[right]</text>

  <!-- arrow down -->
  <path d="M 360 358 L 360 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Update max ===== -->
  <g filter="url(#sk2)"><rect x="250" y="382" width="220" height="36" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="360" y="404" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">max = max(max, sum)</text>

  <!-- loop back arrow: from update max, curve left back up to "for right" -->
  <path d="M 250 400 L 150 400 L 150 144 L 248 144" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="92" y="276" font-size="10" fill="#446688">right++ 继续</text>

  <!-- ===== Return ===== -->
  <path d="M 360 422 L 360 444" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="250" y="446" width="220" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="360" y="470" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">return max</text>
</svg>
