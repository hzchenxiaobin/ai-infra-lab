<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">观察 1：前缀的前缀仍是前缀 ⟹ 一个 match[i] 管住整段转移</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">words = ["abc", "aaaaa", "bcdef"] 插成 Trie：每条从根出发的路径，都是一个有效字符串</text>

  <!-- ============ Trie ============ -->
  <!-- root -->
  <circle cx="58" cy="150" r="6" fill="#555" filter="url(#rough2)"/>
  <text x="52" y="172" font-size="10" fill="#777" filter="url(#rough2)">root</text>

  <!-- 共享边 root -> a -->
  <path d="M 64 144 Q 88 118 107 110" stroke="#555" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- root -> b（bcdef 蓝枝） -->
  <path d="M 62 156 Q 88 184 106 194" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- 节点：共享 a -->
  <circle cx="118" cy="106" r="12" fill="#ffffff" stroke="#555" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="110" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- aaaa 绿枝 -->
  <path d="M 128 98 Q 152 82 166 81" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="178" cy="80" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">a</text>
  <path d="M 190 80 L 224 80" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="238" cy="80" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">a</text>
  <path d="M 250 80 L 284 80" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="298" cy="80" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="84" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">a</text>
  <path d="M 310 80 L 344 80" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="358" cy="80" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="358" y="84" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="378" y="84" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ aaaaa</text>

  <!-- abc 橙枝 -->
  <path d="M 126 114 Q 152 128 166 128" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="178" cy="128" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="132" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>
  <path d="M 190 128 L 224 128" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="238" cy="128" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="132" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="258" y="132" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ abc</text>

  <!-- bcdef 蓝枝 -->
  <circle cx="118" cy="198" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="202" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <path d="M 130 198 L 164 198" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="178" cy="198" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="202" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <path d="M 190 198 L 224 198" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="238" cy="198" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="202" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">d</text>
  <path d="M 250 198 L 284 198" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="298" cy="198" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="202" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">e</text>
  <path d="M 310 198 L 344 198" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="358" cy="198" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="358" y="202" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="378" y="202" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">→ bcdef</text>

  <text x="200" y="230" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">判「target[i:] 能匹配多远」= 从根出发沿 target 逐字符走，走到没有孩子为止</text>

  <!-- ============ target 格子 ============ -->
  <rect x="71" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="119" y="240" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="167" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="215" y="240" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="264" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="263" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="311" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="332" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="359" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="407" y="240" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="428" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="92" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="140" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="188" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="236" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="284" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="332" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="380" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="428" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- match[0]=2 弧 -->
  <path d="M 92 296 Q 116 320 138 296" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="116" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">match[0]=2：aa ✓</text>

  <!-- match[1]=3 弧 -->
  <path d="M 142 296 Q 188 348 232 296" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="188" y="358" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">match[1]=3：abc ✓</text>

  <!-- match[3]=0 -->
  <text x="322" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">match[3]=0：c 开头无路 ✗</text>

  <!-- 结论框 -->
  <rect x="55" y="344" width="410" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">前缀的前缀仍是前缀：match[i] 走到头，段长 1..match[i] 任选</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">一次 Trie 行走 = 整段区间转移：dp[j] ← dp[i]+1，j ∈ (i, i+match[i]]</text>
</svg>
