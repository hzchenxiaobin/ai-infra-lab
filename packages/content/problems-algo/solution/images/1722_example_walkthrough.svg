<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <text x="440" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：source = [1,2,3,4]，target = [2,1,4,5]，allowedSwaps = [[0,1],[2,3]]
  </text>

  <!-- Step 1: initial arrays -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始数组（下标 0..3）</text>

  <text x="40" y="84" font-size="10" fill="#888" filter="url(#rough2)">source</text>
  <rect x="80" y="68" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="68" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="184" y="68" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="68" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <text x="40" y="116" font-size="10" fill="#888" filter="url(#rough2)">target</text>
  <rect x="80" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="236" y="100" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <text x="300" y="88" font-size="9" fill="#888" filter="url(#rough2)">idx</text>
  <text x="105" y="148" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="157" y="148" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="209" y="148" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="261" y="148" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>

  <!-- swap edges overlay -->
  <path d="M105,64 Q131,52 157,64" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M209,64 Q235,52 261,64" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- Step 2: Union-Find -->
  <text x="400" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 并查集合并</text>

  <rect x="400" y="74" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="416" y="94" font-size="10" fill="#555" filter="url(#rough2)">union(0,1) → 分量 {0,1}</text>
  <text x="416" y="110" font-size="10" fill="#555" filter="url(#rough2)">union(2,3) → 分量 {2,3}</text>
  <text x="416" y="126" font-size="10" fill="#888" filter="url(#rough2)">两个连通分量，互不相连</text>

  <!-- arrow down -->
  <path d="M440,144 L440,168" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 3: frequency matching for component {0,1} -->
  <text x="40" y="186" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 分量 {0,1}：src={1,2} vs tgt={2,1}</text>

  <rect x="40" y="198" width="380" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.4"/>
  <text x="56" y="218" font-size="10" fill="#555" filter="url(#rough2)">值 1：src 1 个，tgt 1 个 → min = 1 ✓</text>
  <text x="56" y="234" font-size="10" fill="#555" filter="url(#rough2)">值 2：src 1 个，tgt 1 个 → min = 1 ✓</text>
  <text x="56" y="250" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">匹配 = 1+1 = 2 = |C| → 距离 0</text>

  <!-- Step 3b: frequency matching for component {2,3} -->
  <text x="450" y="186" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 分量 {2,3}：src={3,4} vs tgt={4,5}</text>

  <rect x="450" y="198" width="390" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.4"/>
  <text x="466" y="218" font-size="10" fill="#555" filter="url(#rough2)">值 3：src 1 个，tgt 0 个 → min = 0</text>
  <text x="466" y="234" font-size="10" fill="#555" filter="url(#rough2)">值 4：src 1 个，tgt 1 个 → min = 1 ✓</text>
  <text x="466" y="250" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">值 5：src 0 个，tgt 1 个 → min = 0；匹配=1，距离=2−1=1</text>

  <!-- arrow down -->
  <path d="M440,268 L440,292" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: optimal arrangement -->
  <text x="40" y="310" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 最优排列后：source → [2,1,4,3]</text>

  <text x="40" y="332" font-size="10" fill="#888" filter="url(#rough2)">source'</text>
  <rect x="80" y="316" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="316" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="316" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="236" y="316" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="320" y="332" font-size="10" fill="#888" filter="url(#rough2)">target</text>
  <rect x="360" y="316" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="385" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="412" y="316" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="437" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="464" y="316" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="489" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="516" y="316" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="541" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- mismatch markers -->
  <text x="105" y="362" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="157" y="362" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="209" y="362" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="261" y="362" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- result -->
  <rect x="40" y="384" width="800" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="408" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    汉明距离 = 0 + 1 = 1（仅下标 3 处 source'=3 ≠ target=5）
  </text>
</svg>
