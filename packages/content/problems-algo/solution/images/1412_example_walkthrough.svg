<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐考试分析极端学生 → 汇总判定中游</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">每场考试按分数排序，标出 max / min / 中游，最后汇总每位学生</text>

  <!-- Exam 10 -->
  <rect x="40" y="56" width="260" height="86" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="11" fill="#444" font-weight="bold">考试 10</text>
  <text x="280" y="74" text-anchor="end" font-size="10" fill="#b85450">极端 = {1, 3}</text>
  <rect x="59" y="82" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">70</text>
  <text x="94" y="126" text-anchor="middle" font-size="8" fill="#446688">stu1 · min</text>
  <rect x="135" y="82" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">80</text>
  <text x="170" y="126" text-anchor="middle" font-size="8" fill="#4a7a3a">stu2 · ✓</text>
  <rect x="211" y="82" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="246" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">90</text>
  <text x="246" y="126" text-anchor="middle" font-size="8" fill="#b85450">stu3 · max</text>

  <!-- Exam 20 -->
  <rect x="320" y="56" width="260" height="86" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="74" font-size="11" fill="#444" font-weight="bold">考试 20</text>
  <text x="560" y="74" text-anchor="end" font-size="10" fill="#d6a040">极端 = {1}</text>
  <rect x="415" y="82" width="70" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">80</text>
  <text x="450" y="126" text-anchor="middle" font-size="8" fill="#d6a040">stu1 · 独自</text>
  <text x="450" y="138" text-anchor="middle" font-size="8" fill="#d6a040">既max又min</text>

  <!-- Exam 30 -->
  <rect x="40" y="152" width="260" height="86" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="170" font-size="11" fill="#444" font-weight="bold">考试 30</text>
  <text x="280" y="170" text-anchor="end" font-size="10" fill="#b85450">极端 = {1, 4}</text>
  <rect x="59" y="178" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">70</text>
  <text x="94" y="222" text-anchor="middle" font-size="8" fill="#446688">stu1 · min</text>
  <rect x="135" y="178" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">80</text>
  <text x="170" y="222" text-anchor="middle" font-size="8" fill="#4a7a3a">stu3 · ✓</text>
  <rect x="211" y="178" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="246" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">90</text>
  <text x="246" y="222" text-anchor="middle" font-size="8" fill="#b85450">stu4 · max</text>

  <!-- Exam 40 -->
  <rect x="320" y="152" width="260" height="86" rx="8" fill="none" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="170" font-size="11" fill="#444" font-weight="bold">考试 40</text>
  <text x="560" y="170" text-anchor="end" font-size="10" fill="#b85450">极端 = {1, 4}</text>
  <rect x="339" y="178" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="374" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">60</text>
  <text x="374" y="222" text-anchor="middle" font-size="8" fill="#446688">stu1 · min</text>
  <rect x="415" y="178" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">70</text>
  <text x="450" y="222" text-anchor="middle" font-size="8" fill="#4a7a3a">stu2 · ✓</text>
  <rect x="491" y="178" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="526" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">80</text>
  <text x="526" y="222" text-anchor="middle" font-size="8" fill="#b85450">stu4 · max</text>

  <!-- Summary table -->
  <text x="310" y="260" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">学生汇总表</text>

  <!-- Table header -->
  <rect x="40" y="270" width="540" height="24" rx="0" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">stu_id</text>
  <text x="130" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">name</text>
  <text x="220" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">参加考试</text>
  <text x="370" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">极端详情</text>
  <text x="520" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">中游?</text>

  <!-- Row: stu 1 -->
  <rect x="40" y="294" width="540" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="130" y="310" text-anchor="middle" font-size="10" fill="#555">Daniel</text>
  <text x="220" y="310" text-anchor="middle" font-size="10" fill="#555">10, 20, 30, 40</text>
  <text x="370" y="310" text-anchor="middle" font-size="10" fill="#b85450">是（全极端）</text>
  <text x="520" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row: stu 2 -->
  <rect x="40" y="318" width="540" height="24" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="130" y="334" text-anchor="middle" font-size="10" fill="#555">Jade</text>
  <text x="220" y="334" text-anchor="middle" font-size="10" fill="#555">10, 40</text>
  <text x="370" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a">否（每次中游）</text>
  <text x="520" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row: stu 3 -->
  <rect x="40" y="342" width="540" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#555">Stella</text>
  <text x="220" y="358" text-anchor="middle" font-size="10" fill="#555">10, 30</text>
  <text x="370" y="358" text-anchor="middle" font-size="10" fill="#b85450">是（ex10 max）</text>
  <text x="520" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row: stu 4 -->
  <rect x="40" y="366" width="540" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="382" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="130" y="382" text-anchor="middle" font-size="10" fill="#555">Jonathan</text>
  <text x="220" y="382" text-anchor="middle" font-size="10" fill="#555">30, 40</text>
  <text x="370" y="382" text-anchor="middle" font-size="10" fill="#b85450">是（ex30/40 max）</text>
  <text x="520" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row: stu 5 -->
  <rect x="40" y="390" width="540" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="406" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">5</text>
  <text x="130" y="406" text-anchor="middle" font-size="10" fill="#999">Will</text>
  <text x="220" y="406" text-anchor="middle" font-size="10" fill="#999">未参加</text>
  <text x="370" y="406" text-anchor="middle" font-size="10" fill="#999">—（未参加考试）</text>
  <text x="520" y="406" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">✗</text>

  <!-- Result -->
  <rect x="40" y="426" width="540" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="448" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 最终结果（ORDER BY student_id）</text>
  <text x="60" y="468" font-size="11" fill="#555">student_id = 2, student_name = 'Jade' —— 唯一参加了考试且从未考过最高分或最低分的学生</text>
</svg>
