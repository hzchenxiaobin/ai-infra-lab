<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">两个前缀条件，都归结为后缀 LCP 表的一次查表</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums = [1,1,2,1] 的一种分割（i = 1，j = 2）</text>

  <!-- array boxes -->
  <g filter="url(#rough2)">
    <rect x="100" y="58" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="146" y="58" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="192" y="58" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="238" y="58" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="121" y="81" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="167" y="81" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="213" y="81" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="259" y="81" text-anchor="middle" font-size="14" fill="#333">1</text>
    <path d="M144,52 L144,100" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <path d="M236,52 L236,100" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <text x="144" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">i</text>
    <text x="236" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">j</text>
    <text x="121" y="114" text-anchor="middle" font-size="12" fill="#446688">nums1</text>
    <text x="190" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a">nums2</text>
    <text x="259" y="114" text-anchor="middle" font-size="12" fill="#b8860b">nums3</text>
  </g>

  <!-- condition A -->
  <g filter="url(#rough2)">
    <rect x="22" y="132" width="228" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="136" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">条件 A：nums1 是 nums2 的前缀</text>
    <text x="136" y="180" text-anchor="middle" font-size="13" fill="#446688">⟺ j ≥ 2i 且 lcp[0][i] ≥ i</text>
    <text x="136" y="206" text-anchor="middle" font-size="11" fill="#b85450">长度检查 j ≥ 2i 不能省！</text>
  </g>

  <!-- OR badge -->
  <g filter="url(#rough2)">
    <circle cx="260" cy="176" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="181" text-anchor="middle" font-size="13" fill="#8a6d1a">或</text>
  </g>

  <!-- condition B -->
  <g filter="url(#rough2)">
    <rect x="270" y="132" width="228" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="384" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d4d22">条件 B：nums2 是 nums3 的前缀</text>
    <text x="384" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a">⟺ lcp[i][j] ≥ j − i</text>
    <text x="384" y="206" text-anchor="middle" font-size="11" fill="#555">长度条件被 lcp 上界自动蕴含</text>
  </g>

  <!-- lcp table summary -->
  <g filter="url(#rough2)">
    <rect x="30" y="236" width="460" height="154" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e">后缀 LCP 表：一次 O(n²) 预处理，判定全程 O(1)</text>
    <text x="260" y="288" text-anchor="middle" font-size="12" fill="#555">lcp[i][j] = 后缀 nums[i..n) 与 nums[j..n) 的最长公共前缀长度</text>
    <text x="260" y="314" text-anchor="middle" font-size="13" fill="#446688">lcp[i][j] = nums[i]==nums[j] ? lcp[i+1][j+1] + 1 : 0</text>
    <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">边界 lcp[n][·] = 0，i、j 从 n−1 倒序填表（718 同款递推）</text>
    <text x="260" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a">lcp[i][j] ≤ n−j（后缀 j 的长度）⟹ 条件 B 无需再判长度</text>
  </g>
</svg>
