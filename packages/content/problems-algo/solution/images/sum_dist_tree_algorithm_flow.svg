<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两趟 DFS：后序求 count/dist，前序换根递推 ans</text>

  <!-- ===== DFS1: post-order ===== -->
  <rect x="40" y="50" width="460" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">第一趟 dfs1(u, parent)：后序遍历</text>
  <text x="60" y="92" font-size="11" fill="#333">cnt[u] = 1; dist[u] = 0</text>
  <text x="60" y="110" font-size="11" fill="#333">for v in adj[u], v ≠ parent:</text>
  <text x="80" y="128" font-size="11" fill="#333">dfs1(v, u)  ← 先递归子节点</text>
  <text x="80" y="146" font-size="11" fill="#333">cnt[u] += cnt[v]</text>
  <text x="80" y="162" font-size="11" fill="#333">dist[u] += dist[v] + cnt[v]  ← 子树每个节点多走 1 步</text>

  <path d="M 270 170 L 270 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Root answer -->
  <rect x="150" y="190" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[0] = dist[0]  （根节点答案已知）</text>

  <path d="M 270 224 L 270 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== DFS2: pre-order reroot ===== -->
  <rect x="40" y="244" width="460" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="12" fill="#446688" font-weight="bold">第二趟 dfs2(u, parent)：前序换根</text>
  <text x="60" y="286" font-size="11" fill="#333">for v in adj[u], v ≠ parent:</text>
  <text x="80" y="304" font-size="11" fill="#333">ans[v] = ans[u] − cnt[v] + (n − cnt[v])</text>
  <text x="80" y="322" font-size="11" fill="#333">dfs2(v, u)  ← 再递归子节点</text>
  <text x="80" y="340" font-size="11" fill="#888">子树节点近 1 步、子树外节点远 1 步</text>

  <!-- summary -->
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#888">每条边访问两次 → O(n) 时间；递归栈 = 树高 → O(h) 空间</text>
</svg>
