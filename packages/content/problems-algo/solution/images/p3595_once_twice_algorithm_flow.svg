<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描跑「模 3 电路」，终态掩码求和</text>

  <!-- ============ 主流程 ============ -->
  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="140" y="34" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14"/>
    <text x="220" y="53" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">开始：ones = twos = 0</text>
  </g>
  <path d="M 220 64 L 220 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个 x -->
  <g filter="url(#rough2)">
    <rect x="130" y="80" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="220" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取下一个 x，b = 1 &lt;&lt; x</text>
  </g>
  <path d="M 220 112 L 220 122" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有元素？ -->
  <g filter="url(#rough2)">
    <polygon points="220,124 284,156 220,188 156,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="220" y="160" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">还有元素？</text>
  </g>

  <!-- 否 → 求和返回 -->
  <path d="M 284 156 L 324 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="328" y="128" width="172" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="414" y="144" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">求和并返回</text>
    <text x="414" y="160" text-anchor="middle" font-size="9.5" fill="#2a5a2a">s1 ← ones 置位下标之和</text>
    <text x="414" y="173" text-anchor="middle" font-size="9.5" fill="#2a5a2a">s2 ← twos 置位下标之和</text>
    <text x="414" y="186" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">return [s1, s2] ✓</text>
  </g>

  <!-- 是 ↓ 电路 -->
  <path d="M 220 188 L 220 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="199" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">是</text>

  <!-- 五行电路 -->
  <g filter="url(#rough2)">
    <rect x="96" y="204" width="248" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="220" y="222" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">模 3 转移电路（只动第 x 位）</text>
    <text x="220" y="240" text-anchor="middle" font-size="10.5" fill="#333">twos |= ones &amp; b</text>
    <text x="220" y="254" text-anchor="middle" font-size="10.5" fill="#333">ones ^= b</text>
    <text x="220" y="268" text-anchor="middle" font-size="10.5" fill="#b85450">threes = ones &amp; twos</text>
    <text x="220" y="282" text-anchor="middle" font-size="10.5" fill="#333">ones &amp;= ~threes</text>
    <text x="220" y="296" text-anchor="middle" font-size="10.5" fill="#333">twos &amp;= ~threes</text>
  </g>

  <!-- 回环：取下一个 x -->
  <path d="M 96 255 L 56 255 L 56 96 L 126 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 44 176)" x="44" y="176" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">取下一个 x</text>

  <!-- ============ 逐值视角拆解框 ============ -->
  <g filter="url(#rough2)">
    <rect x="356" y="204" width="148" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8"/>
    <text x="430" y="222" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">逐值视角</text>
    <text x="366" y="240" font-size="9" fill="#333">每个值 v 一台小状态机：</text>
    <text x="366" y="258" font-size="9" fill="#333">(0,0)→(1,0)→(0,1)→(0,0)</text>
    <text x="366" y="276" font-size="9" fill="#333">threes = ones &amp; twos</text>
    <text x="366" y="292" font-size="9" fill="#333">即「满 3」探测器</text>
    <text x="366" y="302" font-size="8" fill="#666">按位独立 ⇒ 全体值并行推进</text>
  </g>

  <!-- ============ 底部注解 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="352" width="400" height="32" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="8"/>
    <text x="260" y="366" text-anchor="middle" font-size="8.5" fill="#666">每个元素只花常数次掩码运算；一趟扫完，「恰好一次 / 恰好两次」的值集合同时就位，</text>
    <text x="260" y="378" text-anchor="middle" font-size="8.5" fill="#666">出现 3 次的值在电路里自动归零，无需任何额外判断</text>
  </g>
</svg>
