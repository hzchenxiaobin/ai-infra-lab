<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：createCounter(10)，连调 3 次</text>

  <!-- column headers -->
  <text x="80" y="70" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">步</text>
  <text x="180" y="70" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">操作</text>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">调用前 n</text>
  <text x="440" y="70" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">返回值</text>
  <text x="540" y="70" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">调用后 n</text>

  <!-- header underline -->
  <line x1="40" y1="80" x2="570" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- setup row -->
  <rect x="40" y="92" width="530" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="180" y="116" text-anchor="middle" font-size="12" fill="#333">createCounter(10)</text>
  <text x="320" y="116" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="440" y="116" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="540" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <!-- call 1 -->
  <rect x="40" y="142" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="180" y="166" text-anchor="middle" font-size="12" fill="#333">counter()</text>
  <text x="320" y="166" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10 ⭐</text>
  <text x="540" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>

  <!-- arrow 1->2 -->
  <path d="M 540 182 L 540 138 M 540 138 L 320 138" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call 2 -->
  <rect x="40" y="192" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="216" text-anchor="middle" font-size="12" fill="#333">counter()</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="440" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">11 ⭐</text>
  <text x="540" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>

  <!-- arrow 2->3 -->
  <path d="M 540 232 L 540 188 M 540 188 L 320 188" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call 3 -->
  <rect x="40" y="242" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="266" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="180" y="266" text-anchor="middle" font-size="12" fill="#333">counter()</text>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="440" y="266" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">12 ⭐</text>
  <text x="540" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13</text>

  <!-- summary -->
  <rect x="40" y="300" width="530" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出序列：[10, 11, 12] —— 每次取「当前 n」，再自增</text>
  <text x="305" y="338" text-anchor="middle" font-size="11" fill="#888">关键在「先取后增」：返回的是旧值，n 在返回后才前进</text>

  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#888">类比 n++（后置自增）：表达式的值是旧 n，副作用是 n 加 1</text>
</svg>
