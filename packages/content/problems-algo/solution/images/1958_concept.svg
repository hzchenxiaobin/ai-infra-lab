<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：好线段 = [放置色, 对方色+, 放置色]，8 方向单向探测</text>

  <!-- ===== Left: good segment pattern ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">好线段结构（以放置 B 为例）</text>

  <!-- 4 cells: B W W B -->
  <rect x="40" y="72" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="100" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">B</text>

  <rect x="92" y="72" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="100" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">W</text>

  <rect x="144" y="72" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="100" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">W</text>

  <rect x="196" y="72" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="100" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">B</text>

  <!-- Direction arrow under cells -->
  <path d="M 44 124 L 236 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="140" y="120" text-anchor="middle" font-size="10.5" fill="#d6a040">放置格为端点，向某方向延伸</text>

  <!-- Labels below cells -->
  <text x="62" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">端点</text>
  <text x="62" y="156" text-anchor="middle" font-size="10" fill="#d6a040">(放置色)</text>
  <text x="114" y="142" text-anchor="middle" font-size="11" fill="#555">对方色</text>
  <text x="166" y="142" text-anchor="middle" font-size="11" fill="#555">对方色</text>
  <text x="218" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">端点</text>
  <text x="218" y="156" text-anchor="middle" font-size="10" fill="#446688">(同色)</text>

  <!-- Length bracket -->
  <path d="M 44 176 Q 44 186 54 186 L 226 186 Q 236 186 236 176" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">长度 ≥ 3 · 中间全为对方色 · 无空格</text>

  <!-- Pattern formula -->
  <rect x="40" y="214" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="234" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">[color, opp, opp, …, color]</text>

  <!-- ===== Right: 8 directions ===== -->
  <text x="420" y="56" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">8 方向逐一探测</text>

  <!-- center placed cell -->
  <rect x="398" y="102" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">B</text>

  <!-- 8 direction arrows from cell border -->
  <!-- N -->
  <path d="M 420 102 L 420 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- S -->
  <path d="M 420 146 L 420 172" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- E -->
  <path d="M 442 124 L 478 124" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- W -->
  <path d="M 398 124 L 362 124" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- NE -->
  <path d="M 440 104 L 466 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- NW -->
  <path d="M 400 104 L 374 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- SE -->
  <path d="M 440 144 L 466 170" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- SW -->
  <path d="M 400 144 L 374 170" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- direction labels -->
  <text x="420" y="68" text-anchor="middle" font-size="10" fill="#888">上</text>
  <text x="420" y="186" text-anchor="middle" font-size="10" fill="#888">下</text>
  <text x="486" y="128" text-anchor="middle" font-size="10" fill="#888">右</text>
  <text x="354" y="128" text-anchor="middle" font-size="10" fill="#888">左</text>

  <!-- success box -->
  <rect x="316" y="200" width="208" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">任一方向命中 ⟹ return true</text>

  <text x="316" y="246" font-size="10.5" fill="#888">端点语义 ⟹ 单向射线（只走一个方向）</text>

  <!-- ===== Bottom: bad examples strip ===== -->
  <path d="M 30 268 L 530 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">四种失败情形（该方向不构成好线段）</text>

  <!-- Case 1: first empty -->
  <rect x="44" y="300" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="57" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <rect x="72" y="300" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="85" y="318" text-anchor="middle" font-size="12" fill="#bbb">·</text>
  <text x="71" y="342" text-anchor="middle" font-size="10.5" fill="#b85450">首格为空 ✗</text>

  <!-- Case 2: first same color -->
  <rect x="168" y="300" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <rect x="196" y="300" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="209" y="318" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <text x="195" y="342" text-anchor="middle" font-size="10.5" fill="#b85450">首格同色 ✗</text>

  <!-- Case 3: hits empty after opp -->
  <rect x="280" y="300" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="293" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <rect x="308" y="300" width="26" height="26" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="321" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">W</text>
  <rect x="336" y="300" width="26" height="26" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="349" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">W</text>
  <rect x="364" y="300" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="377" y="318" text-anchor="middle" font-size="12" fill="#bbb">·</text>
  <text x="335" y="342" text-anchor="middle" font-size="10.5" fill="#b85450">遇空格终止 ✗</text>

  <!-- Case 4: hits boundary -->
  <rect x="436" y="300" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="449" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <rect x="464" y="300" width="26" height="26" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="477" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">W</text>
  <path d="M 504 296 L 504 330" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="510" y="318" font-size="13" fill="#b85450" font-weight="bold">⊥</text>
  <text x="465" y="342" text-anchor="middle" font-size="10.5" fill="#b85450">越出边界 ✗</text>

  <!-- footer note -->
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">只要存在一组 [color, opp+, color] 即合法；八方向全未命中才返回 false</text>
</svg>
