<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：贪心放桶过程</text>

  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：hamsters = "H..H"</text>

  <rect x="80" y="66" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="84" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="106" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>

  <rect x="136" y="66" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="162" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="162" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="192" y="66" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="218" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="248" y="66" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="84" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="274" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <path d="M 162 110 L 110 110" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <path d="M 218 110 L 270 110" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="380" y="72" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2  ✅</text>

  <text x="40" y="128" font-size="10" fill="#666" filter="url(#rough2)">i=0 放右(1)；i=3 右越界→放左(2)</text>

  <line x1="40" y1="142" x2="520" y2="142" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="162" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：hamsters = ".H.H."</text>

  <rect x="80" y="170" width="52" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="106" y="194" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="136" y="170" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="188" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="162" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <rect x="192" y="170" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="218" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="248" y="170" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="188" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="274" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <rect x="304" y="170" width="52" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="194" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">.</text>

  <path d="M 218 214 L 162 214" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <path d="M 218 214 L 274 214" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="380" y="176" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 1  ✅</text>

  <text x="40" y="232" font-size="10" fill="#666" filter="url(#rough2)">i=1 放右(2)；i=3 已被桶2喂→跳过</text>

  <line x1="40" y1="246" x2="520" y2="246" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="266" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：hamsters = ".HHH."</text>

  <rect x="80" y="274" width="52" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="106" y="298" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="136" y="274" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="292" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="162" y="308" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <rect x="192" y="274" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="218" y="308" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">2 ✗</text>

  <rect x="248" y="274" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="292" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="274" y="308" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <rect x="304" y="274" width="52" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="298" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="380" y="280" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return -1  ✗</text>

  <text x="40" y="332" font-size="10" fill="#666" filter="url(#rough2)">i=2 的 H：左邻=H(1)、右邻=H(3) → 两侧均非空位 → 无解</text>

  <rect x="40" y="348" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心右放：能共享就共享，不能共享才独占，两侧皆空不可则 -1</text>
</svg>
