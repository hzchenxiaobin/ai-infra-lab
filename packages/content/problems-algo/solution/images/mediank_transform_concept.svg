<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：变换为 +1/−1/0，中位=k ⟺ 含 k 子数组和 ∈ {0,1}</text>

  <text x="30" y="50" font-size="12" fill="#888">示例：nums = [3, 2, 1, 4, 5]，k = 4</text>
  <text x="470" y="50" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">k 的下标 p = 3</text>

  <rect x="160" y="58" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="82" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="208" y="58" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="82" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="256" y="58" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="304" y="58" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <rect x="352" y="58" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="82" text-anchor="middle" font-size="14" fill="#333">5</text>

  <text x="184" y="110" text-anchor="middle" font-size="10.5" fill="#446688">&lt;k</text>
  <text x="232" y="110" text-anchor="middle" font-size="10.5" fill="#446688">&lt;k</text>
  <text x="280" y="110" text-anchor="middle" font-size="10.5" fill="#446688">&lt;k</text>
  <text x="328" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">=k</text>
  <text x="376" y="110" text-anchor="middle" font-size="10.5" fill="#d6a040">&gt;k</text>

  <path d="M184 96 L184 122" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M232 96 L232 122" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280 96 L280 122" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M328 96 L328 122" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M376 96 L376 122" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="126" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">−1</text>
  <rect x="208" y="126" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">−1</text>
  <rect x="256" y="126" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">−1</text>
  <rect x="304" y="126" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="352" y="126" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">+1</text>

  <text x="280" y="178" text-anchor="middle" font-size="10.5" fill="#888">变换规则：&lt;k → −1，= k → 0，&gt;k → +1（k 自身贡献 0）</text>

  <rect x="30" y="192" width="500" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">中位数 = k 的充要条件</text>

  <text x="48" y="240" font-size="12" fill="#333">子数组含 k，记 a = 个数(&lt;k)，b = 个数(&gt;k)，则 L = a + b + 1。</text>
  <text x="48" y="260" font-size="12" fill="#333">排序后 k 位于下标 a；中位取 ⌊(L−1)/2⌋，故 a = ⌊(a+b)/2⌋：</text>
  <text x="60" y="282" font-size="12" fill="#4a7a3a">L 奇（a+b 偶）：a = b ⟹ b − a = 0</text>
  <text x="60" y="302" font-size="12" fill="#b85450">L 偶（取靠左）：b = a + 1 ⟹ b − a = 1</text>
  <text x="48" y="326" font-size="12" fill="#555" font-weight="bold">变换和 = (+1)·b + (−1)·a = b − a</text>

  <rect x="80" y="340" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⟹ 中位 = k ⟺ 含 k 且变换和 ∈ {0, 1}</text>
</svg>
