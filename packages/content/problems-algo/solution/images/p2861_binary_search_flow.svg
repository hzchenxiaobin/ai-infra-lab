<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：全局二分答案 + O(nk) 判定</text>

  <!-- init -->
  <rect x="230" y="32" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo = 0，hi = 2×10⁸</text>
  <path d="M 310 66 L 310 73" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <polygon points="310,74 415,102 310,130 205,102" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo &lt; hi ?</text>
  <path d="M 310 130 L 310 146" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="143" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- mid -->
  <rect x="220" y="148" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mid = (lo + hi + 1) / 2</text>
  <path d="M 310 182 L 310 200" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check -->
  <rect x="195" y="202" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">check(mid)：逐机器算 mid 份的花费</text>
  <path d="M 310 238 L 310 254" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- feasible? -->
  <polygon points="310,258 425,288 310,318 195,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任一台机器</text>
  <text x="310" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">花费 ≤ budget ?</text>

  <path d="M 195 288 L 167 288" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="280" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="50" y="268" width="115" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="107" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo = mid</text>
  <text x="107" y="301" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">向右收紧</text>

  <path d="M 425 288 L 453 288" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="280" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="455" y="268" width="115" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="512" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hi = mid − 1</text>
  <text x="512" y="301" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">向左收缩</text>

  <!-- output -->
  <path d="M 415 102 L 471 102" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="94" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="475" y="82" width="125" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="537" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出 lo</text>
  <text x="537" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 最大合金数</text>

  <!-- loop back: both branches merge and return to condition -->
  <path d="M 107 308 L 107 330" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 512 308 L 512 330 L 111 330" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 107 330 L 40 330 L 40 102 L 201 102" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="345" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">两分支汇合，回到条件判断继续二分</text>

  <!-- note box -->
  <rect x="40" y="356" width="540" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="377" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">check(mid)：money = Σ max(0, mid·comp[i][j] − stock[j]) × cost[j]，任一台 money ≤ budget 即返回真</text>
  <text x="310" y="399" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ mid·comp 最高约 2×10¹⁰ 已爆 int → C++ 用 long long；mid 上取整防 lo = mid 死循环</text>
</svg>
