<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按 v % space 同余分组 → 每组摧毁数 = 组大小（seed 取组内最小）→ 最大组的最小值即答案</text>

  <!-- nums row: [3,7,8,1,1,5], space=2 -->
  <text x="34" y="62" font-size="12" fill="#888">nums=</text>
  <text x="430" y="62" font-size="12" fill="#888">space=2</text>
  <!-- 3(r=1) 7(r=1) 8(r=0) 1(r=1) 1(r=1) 5(r=1) -->
  <rect x="100" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="63" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="140" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="63" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="180" y="40" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="63" text-anchor="middle" font-size="14" fill="#333">8</text>
  <rect x="220" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="63" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="260" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="63" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="300" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="63" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- Arrow 1 -->
  <path d="M 200 80 L 200 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="210" y="95" font-size="11" fill="#446688">① 按 v % space 分组（同余即在同一等差序列上）</text>

  <!-- Group card r=1 (left, max group) -->
  <rect x="30" y="108" width="300" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="130" font-size="12.5" fill="#446688" font-weight="bold">余数 r = 1（奇）</text>
  <text x="282" y="130" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">★ 最大组</text>
  <!-- chips -->
  <rect x="44" y="142" width="34" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="82" y="142" width="34" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="160" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="120" y="142" width="34" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="158" y="142" width="34" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="196" y="142" width="34" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="160" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="240" y="160" font-size="11" fill="#888">（5 个）</text>
  <text x="44" y="190" font-size="12.5" fill="#333">组大小 cnt = <tspan font-weight="bold" fill="#4a7a3a">5</tspan>　即最多可摧毁 5 个</text>
  <rect x="44" y="200" width="266" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="177" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最小值 min = 1  ← 取它作 seed 即摧毁整组</text>

  <!-- Group card r=0 (right) -->
  <rect x="346" y="108" width="184" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="130" font-size="12.5" fill="#d6a040" font-weight="bold">余数 r = 0（偶）</text>
  <rect x="360" y="142" width="34" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="160" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="402" y="160" font-size="11" fill="#888">（1 个）</text>
  <text x="360" y="190" font-size="12.5" fill="#333">组大小 cnt = <tspan font-weight="bold" fill="#b85450">1</tspan></text>
  <rect x="360" y="200" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="435" y="220" text-anchor="middle" font-size="12" fill="#d6a040">最小值 min = 8</text>

  <!-- Arrow 2 -->
  <path d="M 280 242 L 280 262" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="257" font-size="11" fill="#4a7a3a">② 每组摧毁目标数 = 组大小；seed 取组内最小即满足 x ≥ seed 的全部</text>

  <!-- Arrow 3 -->
  <path d="M 280 300 L 280 320" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="315" font-size="11" fill="#4a7a3a">③ 最大组中 min = 1；若多组并列最大，取它们 min 的最小</text>

  <!-- Result -->
  <rect x="180" y="324" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 1 ✓</text>

  <!-- Notes -->
  <text x="30" y="392" font-size="10.5" fill="#888">• 摧毁规则 nums[i]+c·space 正是公差为 space 的等差序列；同组 ⇔ 同余；seed 取组最小则 x ≥ seed 全覆盖</text>
  <text x="30" y="410" font-size="10.5" fill="#888">• 平局规则在 seed 值上取最小，故在「最大组集合」里比各组的 min</text>
</svg>
