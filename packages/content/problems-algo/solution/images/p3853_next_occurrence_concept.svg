<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：目标合并对 = 最小左端点 × 下一个出现位置</text>
  <text x="260" y="34" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 s = "abaca"，k = 2（第一轮）</text>
  <rect x="452" y="8" width="52" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="23" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">k = 2</text>

  <!-- string cells -->
  <rect x="130" y="88" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="176" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="88" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="268" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="199" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="245" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="291" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="337" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="153" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="199" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="245" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="291" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="337" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>

  <!-- next-occurrence arc 0 -> 2 -->
  <path d="M 153 84 Q 199 46 245 84" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="199" y="56" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">下一个 'a'：距离 2 ≤ 2 ✓ 首个命中</text>

  <!-- nxt markers -->
  <text x="153" y="168" text-anchor="middle" font-size="9" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">nxt=2 ✓</text>
  <text x="199" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">nxt=−</text>
  <text x="245" y="168" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">nxt=4 ✓</text>
  <text x="291" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">nxt=−</text>
  <text x="337" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">nxt=−</text>

  <!-- merge strip -->
  <rect x="56" y="184" width="408" height="52" rx="10" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">本轮合并 (0, nxt[0] = 2)：删除下标 2（右侧全体左移）</text>
  <text x="260" y="224" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⟹ "abca"：'a' 对距离变 3 &gt; 2，b、c 无对 ⟹ 终止</text>

  <!-- rules box -->
  <rect x="30" y="252" width="282" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="274" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">两条规则 + 一个易错</text>
  <text x="42" y="294" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① 左端点 i 可发起 ⟺ nxt[i] − i ≤ k</text>
  <text x="42" y="308" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">（更远的出现位置只会更远，不必看）</text>
  <text x="42" y="326" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② 目标对 = 从左第一个命中：左端点最小</text>
  <text x="42" y="340" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">优先，右端点恰取 nxt[i]，自动最小</text>
  <text x="42" y="358" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">③ 本轮还有合法对 (2,4)，但须先并 (0,2)</text>
  <text x="42" y="372" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">——顺序即语义（见题解 5.1）</text>

  <!-- hash box -->
  <rect x="325" y="252" width="165" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="274" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">哈希表建 nxt[]</text>
  <text x="335" y="294" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">从右往左扫一遍</text>
  <text x="335" y="310" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">last[c] = c 右侧最近下标</text>
  <text x="335" y="326" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">nxt[i] = last[t[i]]</text>
  <text x="335" y="342" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">（先读后写）</text>
  <text x="335" y="360" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">一趟 O(n)</text>
  <text x="335" y="374" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">至多 26 个键</text>
</svg>
