<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：多源扩散 = 多源 BFS × 同层取 max</text>

  <!-- 时间标签 -->
  <text x="87" y="41" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">t = 0</text>
  <text x="259" y="41" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">t = 1</text>
  <text x="431" y="41" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">t = 2</text>

  <!-- 网格 A：t=0 两个源 -->
  <rect x="28" y="48" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="47" y="72" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="68" y="48" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="87" y="72" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="108" y="48" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="127" y="72" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="28" y="88" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="47" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="68" y="88" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="87" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="108" y="88" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="127" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="28" y="128" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="47" y="152" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="68" y="128" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="87" y="152" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="108" y="128" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="152" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 网格 B：t=1 第一圈（frontier 橙描边） -->
  <rect x="200" y="48" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="219" y="72" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="240" y="48" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="259" y="72" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="48" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="299" y="72" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="200" y="88" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="219" y="112" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="240" y="88" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="259" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="280" y="88" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="299" y="112" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="128" width="38" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="219" y="152" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="240" y="128" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="259" y="152" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280" y="128" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="152" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 网格 C：t=2 冲突格取 max（橙底） -->
  <rect x="372" y="48" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="391" y="72" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="412" y="48" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="431" y="72" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="452" y="48" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="471" y="72" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="372" y="88" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="391" y="112" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="412" y="88" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="431" y="112" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="452" y="88" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="471" y="112" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="372" y="128" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="391" y="152" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="412" y="128" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="431" y="152" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="452" y="128" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="471" y="152" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 网格间箭头 -->
  <path d="M 152 107 L 194 107" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="173" y="99" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">扩散</text>
  <path d="M 324 107 L 366 107" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="99" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">扩散</text>

  <!-- 网格说明 -->
  <text x="87" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">源：颜色 1 与 2</text>
  <text x="259" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">橙描边 = 新着色（扩散者）</text>
  <text x="431" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">橙底 = 同步冲突 → 取 max</text>

  <!-- 观察① -->
  <rect x="20" y="210" width="236" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="32" y="232" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">观察①：只需处理「新一圈」</text>
  <text x="32" y="252" font-size="9.8" fill="#444" filter="url(#rough2)">格子着色后的下一步，未着色邻居必然</text>
  <text x="32" y="268" font-size="9.8" fill="#444" filter="url(#rough2)">全部被染上 ⇒ 此后再无扩散对象，</text>
  <text x="32" y="284" font-size="9.8" fill="#444" filter="url(#rough2)">每个格子只「有效扩散」一次。</text>
  <text x="32" y="300" font-size="9.8" fill="#444" filter="url(#rough2)">⇒ 队列只存新着色的一圈（frontier），</text>
  <text x="32" y="316" font-size="9.8" fill="#444" filter="url(#rough2)">正好是多源 BFS 的分层处理。</text>

  <!-- 观察② -->
  <rect x="264" y="210" width="236" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="232" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">观察②：max 按时间步，非先到先得</text>
  <text x="276" y="252" font-size="9.8" fill="#555" filter="url(#rough2)">3×1 反例：源 (0,0)=1、(2,0)=5，中间格</text>
  <text x="276" y="268" font-size="9.8" fill="#555" filter="url(#rough2)">同一时间步收到 1 与 5，应取 5；</text>
  <text x="276" y="284" font-size="9.8" fill="#555" filter="url(#rough2)">FIFO 多源 BFS 谁先出队谁占格 → 错。</text>
  <text x="276" y="300" font-size="9.8" fill="#555" filter="url(#rough2)">⇒ 出队只「提案」，整层收集完</text>
  <text x="276" y="316" font-size="9.8" fill="#555" filter="url(#rough2)">逐格取 max 再统一提交。</text>
</svg>
