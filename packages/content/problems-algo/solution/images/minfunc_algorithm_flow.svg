<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历统计加法次数与最大位宽</text>

  <!-- start -->
  <ellipse cx="280" cy="60" rx="64" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 nums</text>

  <path d="M 280 80 L 280 100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="102" width="220" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333">add_ops = 0，max_bits = 0</text>

  <path d="M 280 140 L 280 160" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="80" y="162" width="400" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">对每个 x ∈ nums：</text>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#333">若 x &gt; 0：</text>
  <text x="280" y="224" text-anchor="middle" font-size="11.5" fill="#333">add_ops += popcount(x)        ← 每个 1 位算一次 add</text>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#333">max_bits = max(max_bits, bit_length(x))   ← 记最大位宽</text>

  <path d="M 280 254 L 280 274" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute ans -->
  <rect x="110" y="276" width="340" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans = add_ops + max(0, max_bits − 1)</text>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#555">全 0 时 max_bits = 0，乘法项取 0</text>

  <path d="M 280 330 L 280 350" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <ellipse cx="280" cy="372" rx="72" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- complexity note -->
  <rect x="60" y="404" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#555">时间 O(n log M)，M ≤ 10⁹（≤ 30 位）；空间 O(1)</text>
</svg>
