<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：记忆化求 power + 复合键排序</text>

  <!-- 主流程：power(x) 的判定 -->
  <!-- B1: power(x) 入口 -->
  <rect x="170" y="48" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">power(x)</text>

  <!-- 箭头 B1 → D1 -->
  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 菱形：x == 1? 中心 (260,118) -->
  <polygon points="260,100 308,118 260,136 212,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x == 1 ?</text>

  <!-- D1 是 → 返回 0（右侧） -->
  <path d="M 308 118 L 372 118" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="372" y="101" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="432" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0（基准）</text>

  <!-- D1 否 → D2 -->
  <path d="M 260 136 L 260 154" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="150" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- D2 菱形：memo 命中? 中心 (260,172) -->
  <polygon points="260,154 318,172 260,190 202,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">memo 有 x?</text>

  <!-- D2 是 → 返回 memo[x]（右侧） -->
  <path d="M 318 172 L 372 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="372" y="155" width="130" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="437" y="177" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 memo[x]（命中）</text>

  <!-- D2 否 → B4 -->
  <path d="M 260 190 L 260 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="204" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- B4: next = x偶 ? x/2 : 3x+1 -->
  <rect x="140" y="208" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nxt = (x 偶) ? x/2 : 3x+1</text>

  <!-- 箭头 B4 → B5 -->
  <path d="M 260 242 L 260 260" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B5: memo[x] = 1 + power(nxt) -->
  <rect x="120" y="260" width="280" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">memo[x] = 1 + power(nxt)；返回</text>

  <!-- 递归回边：B5 右侧虚线箭头回到 B1 -->
  <path d="M 400 277 C 460 277 460 65 350 65" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="470" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic" filter="url(#rough2)">递归</text>
  <text x="470" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic" filter="url(#rough2)">调用</text>

  <!-- 分隔线 -->
  <path d="M 40 320 L 480 320" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">▼ 主程序：排序取第 k 个</text>

  <!-- 底部横向流水线：4 个方框 -->
  <!-- 框1 -->
  <rect x="20" y="338" width="150" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="360" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">对每个 x∈[lo,hi]</text>
  <text x="95" y="376" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">调用 power(x)</text>
  <!-- 箭头 -->
  <path d="M 170 363 L 184 363" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 框2 -->
  <rect x="184" y="338" width="110" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="239" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">收集</text>
  <text x="239" y="376" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(power, x) 列表</text>
  <!-- 箭头 -->
  <path d="M 294 363 L 308 363" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 框3 -->
  <rect x="308" y="338" width="110" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">按 (power,x)</text>
  <text x="363" y="376" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">升序排序</text>
  <!-- 箭头 -->
  <path d="M 418 363 L 432 363" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 框4：返回第 k 个（高亮） -->
  <rect x="432" y="338" width="72" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="468" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="376" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">v[k-1]</text>

  <!-- 底部说明 -->
  <text x="260" y="412" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">复合键 (power, x) 字典序升序：权重小的在前，并列时数值小的在前</text>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">记忆化保证每个中间值只算一次；排序 O(n log n)，n = hi-lo+1 ≤ 1000</text>
  <text x="260" y="452" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">菱形=判定　蓝=计算　绿=命中/基准　红=递归/结果</text>
</svg>
