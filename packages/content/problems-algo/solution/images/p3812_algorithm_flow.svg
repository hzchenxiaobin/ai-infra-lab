<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 622"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="622" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：BFS 建序 + 逆序剥叶，被迫决策一遍过</text>

  <!-- 输入 -->
  <g filter="url(#rough2)">
    <rect x="205" y="38" width="150" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="59" text-anchor="middle" font-size="12.5" fill="#8a6d1a">输入 n, edges, start, target</text>
  </g>
  <path d="M 280 70 L 280 90" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建图 + BFS -->
  <g filter="url(#rough2)">
    <rect x="130" y="94" width="300" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="114" text-anchor="middle" font-size="12.5" fill="#33506b">建邻接表（邻居, 边下标）+ BFS 从 0 出发</text>
    <text x="280" y="133" text-anchor="middle" font-size="11.5" fill="#33506b">记录 parent[v] / pedge[v] / order</text>
  </g>
  <path d="M 280 144 L 280 164" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 逆序扫描 -->
  <g filter="url(#rough2)">
    <rect x="130" y="168" width="300" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="188" text-anchor="middle" font-size="12.5" fill="#8a6d1a">逆序扫描 v ← order[n−1 … 0]</text>
    <text x="280" y="207" text-anchor="middle" font-size="11.5" fill="#8a6d1a">深层先处理 = 自底向上剥叶</text>
  </g>
  <path d="M 280 218 L 280 238" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环回边（E → C），先画在底下 -->
  <path d="M 405 514 L 487 514 L 487 193 L 434 193" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="497" y="400" font-size="11" fill="#446688" filter="url(#rough2)">下一个 v</text>

  <!-- 决策 1 -->
  <g filter="url(#rough2)">
    <polygon points="280,242 400,290 280,338 160,290" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="295" text-anchor="middle" font-size="12.5" fill="#33506b">need[v] = 1 ?</text>
  </g>
  <path d="M 400 290 L 487 290" stroke="#7a8aa0" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="410" y="280" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="480" y="248" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">这条边不翻</text>
  <path d="M 280 338 L 280 362" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="354" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 决策 2 -->
  <g filter="url(#rough2)">
    <polygon points="280,366 395,414 280,462 165,414" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="419" text-anchor="middle" font-size="12.5" fill="#33506b">v = 0（根）?</text>
  </g>
  <path d="M 165 414 L 145 414" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="404" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="18" y="392" width="125" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="80" y="412" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">返回 [−1]</text>
    <text x="80" y="429" text-anchor="middle" font-size="10.5" fill="#8a3030">（无解）</text>
  </g>
  <path d="M 280 462 L 280 486" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="478" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 动作框 -->
  <g filter="url(#rough2)">
    <rect x="155" y="490" width="250" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="510" text-anchor="middle" font-size="12" fill="#2f5d24">ans ← pedge[v]（翻通往父亲的边）</text>
    <text x="280" y="529" text-anchor="middle" font-size="12" fill="#2f5d24">need[parent[v]] ⊕= 1（影响上传）</text>
  </g>

  <!-- 收尾 -->
  <path d="M 280 538 L 280 562" stroke="#7a8aa0" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="556" font-size="10.5" fill="#666" filter="url(#rough2)">order 扫完（含根）</text>
  <g filter="url(#rough2)">
    <rect x="195" y="566" width="170" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="591" text-anchor="middle" font-size="13" fill="#2f5d24">sort(ans) 后返回</text>
  </g>
</svg>
