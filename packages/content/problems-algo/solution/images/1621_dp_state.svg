<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 状态机：逐点扫描，两状态转移（先关后开）</text>

  <!-- State A: no open segment -->
  <rect x="80" y="130" width="160" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">无开放线段</text>
  <text x="160" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp0[j]</text>
  <text x="160" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">已放 j 条完整线段</text>

  <!-- State B: one open segment -->
  <rect x="320" y="130" width="160" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="158" text-anchor="middle" font-size="13" fill="#a6780f" font-weight="bold" filter="url(#rough2)">有开放线段</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp1[j]</text>
  <text x="400" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">起点已定，终点待定</text>

  <!-- A -> A self loop (skip) -->
  <path d="M 110 130 C 110 96, 210 96, 210 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">跳过点 i</text>

  <!-- A -> B (open) top arrow -->
  <path d="M 240 156 L 320 156" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开新线段</text>
  <text x="280" y="140" text-anchor="middle" font-size="9" fill="#6a8a5a" filter="url(#rough2)">(起点=i)</text>

  <!-- B -> A (close) bottom arrow -->
  <path d="M 320 196 L 240 196" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关闭</text>
  <text x="280" y="224" text-anchor="middle" font-size="9" fill="#a55" filter="url(#rough2)">(终点=i)</text>

  <!-- B -> B self loop (keep open) -->
  <path d="M 350 220 C 350 254, 450 254, 450 220" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#a6780f" filter="url(#rough2)">保持开放（穿过 i）</text>

  <!-- Combined close+open highlight arc (over the top) -->
  <path d="M 360 130 C 360 60, 460 60, 460 130" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="455" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关+开</text>
  <text x="455" y="90" text-anchor="middle" font-size="8" fill="#a55" filter="url(#rough2)">端点重合</text>

  <!-- Base note -->
  <rect x="60" y="270" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">先关后开：base[j] = dp0[j] + dp1[j−1]（刚关闭的并入无开放池，再决定是否开）</text>
  <text x="280" y="302" text-anchor="middle" font-size="9" fill="#a55" filter="url(#rough2)">同一点 i 可既是上一条终点、又是下一条起点 → 端点可重合</text>

  <!-- Transition formulas -->
  <rect x="60" y="324" width="440" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="344" font-size="11" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">转移式（处理点 i 后）</text>
  <text x="80" y="364" font-size="11" fill="#333" filter="url(#rough2)">new_dp0[j] = base[j]                         （不开新线段）</text>
  <text x="80" y="382" font-size="11" fill="#333" filter="url(#rough2)">new_dp1[j] = base[j] + dp1[j]            （开新线段 / 保持开放）</text>
  <text x="80" y="398" font-size="9" fill="#6a8a5a" filter="url(#rough2)">答案 = dp0[k]（扫完 n 点，无开放，恰好 k 条）</text>
</svg>
