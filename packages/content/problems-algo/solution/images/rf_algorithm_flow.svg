<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：过滤 → 收集 → 排序 → 提取</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="50" rx="46" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 65 L 260 78" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For box -->
  <rect x="150" y="80" width="220" height="34" fill="#f4f4f4" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">遍历每个餐馆 r</text>

  <path d="M 260 114 L 260 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,124 360,156 260,188 160,156" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#rough2)">满足全部过滤条件？</text>
  <text x="260" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(AND)</text>

  <!-- No path (right) -->
  <path d="M 360 156 L 408 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="416" y="153" font-size="9.5" fill="#b03a3a" filter="url(#rough2)">跳过</text>

  <!-- Yes path (down) -->
  <path d="M 260 188 L 260 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="246" y="198" font-size="10" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Collect box -->
  <rect x="150" y="204" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">收集 (rating, id)</text>

  <!-- Loop back (left, dashed) -->
  <path d="M 150 221 L 80 221 L 80 97 L 150 97" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="160" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 64 160)" filter="url(#rough2)">下一个 r</text>

  <!-- Exit loop (down) -->
  <path d="M 260 238 L 260 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="246" font-size="9.5" fill="#888" filter="url(#rough2)">遍历结束</text>

  <!-- Sort box -->
  <rect x="130" y="252" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold" filter="url(#rough2)">排序：rating ↓, id ↓</text>

  <path d="M 260 286 L 260 298" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Extract box -->
  <rect x="150" y="300" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold" filter="url(#rough2)">提取 id 列表</text>

  <path d="M 260 334 L 260 344" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return oval -->
  <ellipse cx="260" cy="360" rx="46" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回</text>
</svg>
