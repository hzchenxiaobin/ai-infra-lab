<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定边 (i, j)，枚举第三个顶点 k 切分多边形</text>

  <!-- ===== Big triangle (i, k, j) = (0, 2, 4) filled orange ===== -->
  <polygon points="130,250 200,100 285,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Left sub-polygon chain 0-1-2 (green) -->
  <path d="M 130 250 L 95 170 L 200 100" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- Right sub-polygon chain 2-3-4 (green) -->
  <path d="M 200 100 L 310 168 L 285 250" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- base edge (i, j) = (0, 4) blue emphasis -->
  <path d="M 130 250 L 285 250" stroke="#446688" stroke-width="2.8" fill="none" filter="url(#rough2)"/>

  <!-- Vertices: circles + value labels -->
  <!-- v0 = i -->
  <circle cx="130" cy="250" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="108" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>

  <!-- v1 -->
  <circle cx="95" cy="170" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="70" y="160" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- v2 = k -->
  <circle cx="200" cy="100" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="200" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=2</text>

  <!-- v3 -->
  <circle cx="310" cy="168" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="335" y="160" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- v4 = j -->
  <circle cx="285" cy="250" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="285" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="308" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j=4</text>

  <!-- labels inside regions -->
  <text x="205" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">三角形 (i,k,j)</text>
  <text x="205" y="231" text-anchor="middle" font-size="10" fill="#b85450">values[i]·values[k]·values[j]</text>

  <text x="115" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">左子问题</text>
  <text x="115" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[i][k]</text>

  <text x="300" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右子问题</text>
  <text x="300" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[k][j]</text>

  <!-- arrow down -->
  <path d="M 280 296 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="40" y="318" width="480" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">状态转移（区间 DP，求最小值）</text>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[i][j] = min&#123; values[i]·values[k]·values[j] + dp[i][k] + dp[k][j] &#125;</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">枚举与边 (i,j) 构成三角形的第三个顶点 k，切成两个独立子多边形</text>
</svg>
