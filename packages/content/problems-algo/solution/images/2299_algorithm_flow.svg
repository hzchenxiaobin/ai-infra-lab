<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 606" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="606" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：长度判断 → 遍历分类置标志 + 查重复 → 标志全真</text>

  <!-- Start -->
  <ellipse cx="240" cy="52" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="57" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="240" y1="70" x2="240" y2="90" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- len < 8 ? diamond -->
  <polygon points="240,92 338,116 240,140 142,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">len &lt; 8 ?</text>
  <!-- 是 → return false -->
  <text x="346" y="110" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="338" y1="116" x2="352" y2="116" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="352" y="100" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <!-- 否 ↓ -->
  <text x="250" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="240" y1="140" x2="240" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="110" y="160" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">lower=upper=digit=special=false；prev=''</text>

  <line x1="240" y1="200" x2="240" y2="224" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="90" y="226" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">取字符 c（遍历 password）</text>

  <line x1="240" y1="260" x2="240" y2="278" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- c == prev ? diamond -->
  <polygon points="240,280 330,300 240,320 150,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="304" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">c == prev ?</text>
  <!-- 是 → return false -->
  <text x="338" y="294" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="330" y1="300" x2="344" y2="300" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="344" y="284" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="402" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <!-- 否 ↓ -->
  <text x="250" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="240" y1="320" x2="240" y2="338" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- classify box -->
  <rect x="70" y="340" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="360" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">按类型置标志</text>
  <text x="240" y="378" text-anchor="middle" font-size="10.5" fill="#888">a–z→lower；A–Z→upper；0–9→digit；特殊→special</text>

  <line x1="240" y1="390" x2="240" y2="408" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update box -->
  <rect x="140" y="410" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="430" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prev ← c</text>

  <line x1="240" y1="442" x2="240" y2="460" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有字符? diamond -->
  <polygon points="240,462 320,480 240,498 160,480" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="484" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">还有字符?</text>
  <!-- 是 → loop back -->
  <text x="150" y="472" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 160 480 L 44 480 L 44 243 L 86 243" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="234" font-size="10.5" fill="#4a7a3a" font-weight="bold">下一轮</text>
  <!-- 否 ↓ -->
  <text x="250" y="516" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="240" y1="498" x2="240" y2="516" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4 标志全 true ? diamond -->
  <polygon points="240,518 330,536 240,554 150,536" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="540" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4 标志全 true?</text>
  <!-- 否 → return false -->
  <text x="338" y="530" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="330" y1="536" x2="344" y2="536" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="344" y="520" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="402" y="540" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <!-- 是 ↓ -->
  <text x="250" y="570" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="240" y1="554" x2="240" y2="572" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <rect x="170" y="572" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="592" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
