<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：自增 id → base62 短码 → 双向哈希表</text>

  <text x="40" y="64" font-size="11.5" fill="#888" font-weight="bold">encode(longUrl)</text>
  <rect x="40" y="74" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="10.5" fill="#446688">https://leetcode.com/problems/...</text>

  <path d="M 240 91 L 300 91" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="300" y="74" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="345" y="91" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">分配 id</text>
  <text x="345" y="104" text-anchor="middle" font-size="10" fill="#d6a040">id = 12345</text>

  <path d="M 390 91 L 450 91" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="450" y="74" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="495" y="91" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">base62(id)</text>
  <text x="495" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a">"3d7"</text>

  <path d="M 495 108 L 495 138 L 140 138 L 140 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="158" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">http://tinyurl.com/3d7</text>

  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888">shortUrl = prefix + code</text>

  <text x="40" y="218" font-size="11.5" fill="#888" font-weight="bold">decode(shortUrl)</text>
  <rect x="40" y="228" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">http://tinyurl.com/3d7</text>

  <path d="M 240 245 L 300 245" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="300" y="228" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="345" y="245" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">取尾部 code</text>
  <text x="345" y="258" text-anchor="middle" font-size="10" fill="#d6a040">"3d7"</text>

  <path d="M 390 245 L 450 245" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="450" y="228" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="495" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">base62⁻¹</text>
  <text x="495" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">id = 12345</text>

  <path d="M 495 262 L 495 292 L 140 292 L 140 312" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="312" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="334" text-anchor="middle" font-size="10.5" fill="#446688">https://leetcode.com/problems/...</text>

  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#888">urlMap[id] → longUrl</text>

  <rect x="36" y="360" width="488" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="384" font-size="12" fill="#4a7a3a" font-weight="bold">为什么用自增 id + base62？</text>
  <text x="56" y="404" font-size="11" fill="#555">• 无碰撞：每个 id 唯一，短码天然唯一，无需重试或去重</text>
  <text x="56" y="422" font-size="11" fill="#555">• 短：base62 让 6 位短码可表 62⁶ ≈ 568 亿条，远超实际需求</text>
</svg>
