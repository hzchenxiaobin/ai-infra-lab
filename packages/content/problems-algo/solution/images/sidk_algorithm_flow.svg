<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：余数递推法求可被 K 整除的最小全 1 数</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="58" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="78" x2="260" y2="94" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- read k -->
  <rect x="180" y="98" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入 k（正整数）</text>

  <line x1="260" y1="132" x2="260" y2="148" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: k%2==0 or k%5==0 ? -->
  <polygon points="260,152 366,196 260,240 154,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">k%2==0 或</text>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">k%5==0 ?</text>

  <!-- Yes branch: right to return -1 -->
  <text x="374" y="192" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="366" y1="196" x2="396" y2="196" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="178" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return −1</text>

  <!-- No branch: down -->
  <text x="268" y="256" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <line x1="260" y1="240" x2="260" y2="258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init: remainder=0, L=0 -->
  <rect x="140" y="262" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">remainder = 0, L = 0</text>

  <line x1="260" y1="296" x2="260" y2="312" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop body: L++, remainder = (remainder*10+1) % k -->
  <rect x="100" y="316" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">L++, remainder = (remainder·10+1) % k</text>

  <line x1="260" y1="350" x2="260" y2="366" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: remainder == 0 ? -->
  <polygon points="260,370 350,406 260,442 170,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">remainder</text>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== 0 ?</text>

  <!-- Yes branch: right to return L -->
  <text x="358" y="402" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="350" y1="406" x2="396" y2="406" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="388" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="411" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return L</text>

  <!-- No branch: loop back up to loop body -->
  <text x="140" y="402" font-size="11" fill="#888" font-weight="bold">否</text>
  <line x1="170" y1="406" x2="100" y2="406" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="406" x2="100" y2="333" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="333" x2="96" y2="333" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="372" font-size="10" fill="#888" text-anchor="middle">循环</text>
  <text x="70" y="386" font-size="10" fill="#888" text-anchor="middle">至多 k 次</text>

  <!-- End oval -->
  <ellipse cx="444" cy="470" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="475" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- side note: pigeonhole -->
  <rect x="140" y="452" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="470" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">鸽笼原理保证</text>
  <text x="230" y="484" text-anchor="middle" font-size="10" fill="#888">gcd(k,10)=1 时 ≤ k 步必命中</text>
</svg>
