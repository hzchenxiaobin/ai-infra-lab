<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：取商累加，取模替换，循环到 0</text>

  <!-- ===== Start: ops = 0 ===== -->
  <rect x="200" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">开始：ops = 0</text>

  <!-- arrow down -->
  <path d="M 260 72 L 260 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: num1>0 && num2>0 ? ===== -->
  <polygon points="260,90 360,128 260,166 160,128" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num1 &gt; 0</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">且 num2 &gt; 0 ?</text>

  <!-- No branch: return ops -->
  <path d="M 360 128 L 420 128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="122" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="420" y="112" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="463" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ops</text>

  <!-- Yes branch down -->
  <path d="M 260 166 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="178" font-size="10" fill="#888">是</text>

  <!-- ===== Decision 2: num1 >= num2 ? ===== -->
  <polygon points="260,186 350,220 260,254 170,220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num1 ≥ num2 ?</text>

  <!-- Yes branch (left): ops += num1/num2; num1 %= num2 -->
  <path d="M 170 220 L 110 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="20" y="200" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="218" text-anchor="middle" font-size="10" fill="#333">ops += num1/num2</text>
  <text x="65" y="234" text-anchor="middle" font-size="10" fill="#333">num1 %= num2</text>

  <!-- No branch (right): ops += num2/num1; num2 %= num1 -->
  <path d="M 350 220 L 410 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="410" y="200" width="90" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="218" text-anchor="middle" font-size="10" fill="#333">ops += num2/num1</text>
  <text x="455" y="234" text-anchor="middle" font-size="10" fill="#333">num2 %= num1</text>

  <!-- Loop back: from both boxes up to Decision 1 -->
  <!-- left box up -->
  <path d="M 65 200 L 65 128 L 160 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <!-- right box up -->
  <path d="M 455 200 L 455 128" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="468" y="165" font-size="9.5" fill="#888">循环</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="276" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为什么必然终止？</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#555">每轮较大数 ← 较大数 % 较小数，结果严格小于较小数</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555">→ 较大数严格递减且非负，有限步内某个数归 0</text>
</svg>
