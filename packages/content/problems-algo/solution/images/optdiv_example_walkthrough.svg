<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1000, 100, 10, 2]</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">最优值 = 1000×10×2 / 100 = 200，表达式 "1000/(100/10/2)"</text>

  <!-- ===== table ===== -->
  <!-- header -->
  <rect x="30" y="60" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">方案</text>

  <rect x="140" y="60" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">表达式</text>

  <rect x="340" y="60" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">计算</text>

  <rect x="520" y="60" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="555" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">值</text>

  <!-- row 1: 无括号 -->
  <rect x="30" y="96" width="110" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="121" text-anchor="middle" font-size="11" fill="#555">无括号</text>

  <rect x="140" y="96" width="200" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="121" text-anchor="middle" font-size="11.5" fill="#333" font-family="'Comic Sans MS',monospace">1000/100/10/2</text>

  <rect x="340" y="96" width="180" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="121" text-anchor="middle" font-size="11" fill="#888" font-family="'Comic Sans MS',monospace">((1000/100)/10)/2</text>

  <rect x="520" y="96" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="555" y="121" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0.5</text>

  <!-- row 2: 括后两段 -->
  <rect x="30" y="140" width="110" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="165" text-anchor="middle" font-size="11" fill="#555">括后两段</text>

  <rect x="140" y="140" width="200" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="165" text-anchor="middle" font-size="11.5" fill="#333" font-family="'Comic Sans MS',monospace">1000/100/(10/2)</text>

  <rect x="340" y="140" width="180" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="165" text-anchor="middle" font-size="11" fill="#888" font-family="'Comic Sans MS',monospace">1000/100/5</text>

  <rect x="520" y="140" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="555" y="165" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- row 3: 括中段 -->
  <rect x="30" y="184" width="110" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="209" text-anchor="middle" font-size="11" fill="#555">括中段</text>

  <rect x="140" y="184" width="200" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="209" text-anchor="middle" font-size="11.5" fill="#333" font-family="'Comic Sans MS',monospace">1000/(100/10)/2</text>

  <rect x="340" y="184" width="180" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="209" text-anchor="middle" font-size="11" fill="#888" font-family="'Comic Sans MS',monospace">(1000/10)/2</text>

  <rect x="520" y="184" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="555" y="209" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">50</text>

  <!-- row 4: 全包 (highlight) -->
  <rect x="30" y="228" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全包 ✓</text>

  <rect x="140" y="228" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="'Comic Sans MS',monospace">1000/(100/10/2)</text>

  <rect x="340" y="228" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="'Comic Sans MS',monospace">1000/((100/10)/2)</text>

  <rect x="520" y="228" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="555" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">200</text>

  <!-- arrow from 全包 row down to insight -->
  <path d="M 555 272 L 555 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== insight: why 全包 wins ===== -->
  <rect x="30" y="300" width="560" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">全包 = 分子 1000×10×2（最大）/ 分母 100（最小）</text>
  <text x="310" y="338" text-anchor="middle" font-size="10.5" fill="#555">其他方案少翻一个 → 分子变小；或把已翻的落回分母 → 分母变大</text>

  <!-- ===== conclusion ===== -->
  <rect x="30" y="360" width="560" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结论：a₀/(a₁/a₂/.../aₙ₋₁) 恒为最优 —— 除 a₁ 外全进分子</text>
</svg>
