<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：fn = (x) => x > 0</text>

  <!-- Input box -->
  <rect x="110" y="36" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">输入：[-1, [-1,-1,5,-1,10], -1, [-1], [-5]]</text>

  <!-- 5 processing columns -->
  <!-- Col 1: -1 -->
  <rect x="22" y="84" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1</text>
  <text x="60" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">primitive</text>
  <text x="60" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn(-1)=false</text>
  <rect x="22" y="148" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="165" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 移除</text>

  <!-- Col 2: [-1,-1,5,-1,10] -->
  <rect x="112" y="84" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="102" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[-1,-1,5,-1,10]</text>
  <text x="170" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">array → 递归</text>
  <text x="170" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">筛得 [5, 10]</text>
  <text x="170" y="154" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn(arr)=false</text>
  <rect x="112" y="160" width="116" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="170" y="177" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 保留 [5,10]</text>
  <text x="170" y="194" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">非空 → 保留</text>

  <!-- Col 3: -1 -->
  <rect x="242" y="84" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1</text>
  <text x="280" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">primitive</text>
  <text x="280" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn(-1)=false</text>
  <rect x="242" y="148" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="165" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 移除</text>

  <!-- Col 4: [-1] -->
  <rect x="332" y="84" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="370" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[-1]</text>
  <text x="370" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">array → 递归</text>
  <text x="370" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">筛得 [] 空</text>
  <text x="370" y="154" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn=false+空</text>
  <rect x="332" y="160" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="370" y="177" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 移除</text>

  <!-- Col 5: [-5] -->
  <rect x="422" y="84" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="460" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[-5]</text>
  <text x="460" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">array → 递归</text>
  <text x="460" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">筛得 [] 空</text>
  <text x="460" y="154" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn=false+空</text>
  <rect x="422" y="160" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="460" y="177" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 移除</text>

  <!-- Arrows down to merge -->
  <path d="M 60 172 L 60 210 L 290 210" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 184 L 170 210 L 290 210" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 172 L 280 210 L 290 210" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 370 184 L 370 210 L 290 210" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 460 184 L 460 210 L 290 210" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <path d="M 290 210 L 290 234" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Top-level decision -->
  <rect x="160" y="236" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">顶层 filtered = [[5,10]]，fn(顶层)=false，非空 → 保留</text>

  <path d="M 290 266 L 290 290" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output box -->
  <rect x="190" y="292" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="314" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：[[5, 10]]</text>

  <!-- Note -->
  <rect x="34" y="340" width="512" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="10" fill="#555" filter="url(#rough2)">要点：[-1] 和 [-5] 递归筛选后为空数组 + fn 返回 false → 整体移除；[5,10] 非空 → 保留</text>
</svg>
