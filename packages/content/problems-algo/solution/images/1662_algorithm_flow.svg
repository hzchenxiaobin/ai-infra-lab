<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针逐字符比对</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="40" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="94" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333">i = 0, ci = 0, j = 0, cj = 0</text>

  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision1: both have chars? -->
  <polygon points="270,148 380,190 270,232 160,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#333">i &lt; n₁ 且 j &lt; n₂ ?</text>
  <text x="270" y="202" text-anchor="middle" font-size="9.5" fill="#888">两串都还有字符</text>

  <!-- No branch -> return -->
  <path d="M 380 190 L 440 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="182" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="372" y="176" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return i == n₁ &amp;&amp; j == n₂</text>

  <!-- Yes branch -> compare -->
  <path d="M 270 232 L 270 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Compare box -->
  <rect x="150" y="254" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#333">c₁ = word1[i][ci],  c₂ = word2[j][cj]</text>

  <path d="M 270 288 L 270 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision2: chars match? -->
  <polygon points="270,308 370,348 270,388 170,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#333">c₁ == c₂ ?</text>
  <text x="270" y="360" text-anchor="middle" font-size="9.5" fill="#888">字符相同？</text>

  <!-- No branch -> return false -->
  <path d="M 370 348 L 440 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="340" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="380" y="334" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="355" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes branch -> advance -->
  <path d="M 270 388 L 270 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="400" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Advance box -->
  <rect x="100" y="408" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="10.5" fill="#333">ci++; 若 ci == word1[i].size() → i++, ci = 0</text>
  <text x="270" y="440" text-anchor="middle" font-size="10.5" fill="#333">cj++; 若 cj == word2[j].size() → j++, cj = 0</text>

  <!-- Loop back arrow -->
  <path d="M 100 428 L 50 428 L 50 190 L 160 190" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="310" font-size="9" fill="#4a7a3a" font-weight="bold">循环</text>
</svg>
