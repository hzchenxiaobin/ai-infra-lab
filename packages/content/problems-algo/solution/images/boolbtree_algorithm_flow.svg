<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：后序 DFS，按节点值分派</text>

  <!-- entry -->
  <rect x="220" y="46" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#333">dfs(node)</text>
  <path d="M 270 78 L 270 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: leaf? -->
  <polygon points="270,100 360,140 270,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">无孩子？</text>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#8a6a20">（叶子）</text>

  <!-- yes branch -->
  <path d="M 180 140 L 120 140 L 120 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrT)" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="50" y="192" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="214" text-anchor="middle" font-size="11" fill="#333">返回 node.val == 1</text>

  <!-- no branch -->
  <path d="M 360 140 L 420 140 L 420 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="392" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- decision: val==2? -->
  <polygon points="420,192 500,232 420,272 340,232" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#446688">node.val</text>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#446688">== 2 ?</text>

  <!-- yes -> OR -->
  <path d="M 340 232 L 250 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="224" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是(OR)</text>

  <rect x="110" y="250" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="270" text-anchor="middle" font-size="11" fill="#333">返回 dfs(left)</text>
  <text x="180" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">|| dfs(right)</text>

  <!-- no -> AND -->
  <path d="M 420 272 L 420 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="448" y="300" font-size="10" fill="#b85450" font-weight="bold">否(AND)</text>

  <rect x="350" y="322" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="342" text-anchor="middle" font-size="11" fill="#333">返回 dfs(left)</text>
  <text x="420" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&amp;&amp; dfs(right)</text>

  <!-- key insight footer -->
  <rect x="40" y="384" width="460" height="28" fill="none" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="10" fill="#888">关键：先递归求出左右子树的布尔值，再用本节点运算符合并（后序）</text>
</svg>
