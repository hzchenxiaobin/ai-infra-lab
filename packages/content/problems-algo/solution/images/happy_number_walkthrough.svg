<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 19，2 轮判定 fast == 1（快乐数）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">f(19)=82，f(82)=68，f(68)=100，f(100)=1</text>

  <!-- ===== Step table header ===== -->
  <line x1="20" y1="62" x2="520" y2="62" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="9" fill="#444" font-weight="bold">
    <rect x="20" y="70" width="60" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="50" y="84" text-anchor="middle">轮次</text>
    <rect x="80" y="70" width="110" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="135" y="84" text-anchor="middle">slow（走 1 步）</text>
    <rect x="190" y="70" width="130" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="255" y="84" text-anchor="middle">fast（走 2 步）</text>
    <rect x="320" y="70" width="180" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="410" y="84" text-anchor="middle">判定</text>
  </g>

  <g font-size="9" fill="#333">
    <!-- init -->
    <rect x="20" y="92" width="60" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="50" y="107" text-anchor="middle">初始</text>
    <rect x="80" y="92" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="135" y="107" text-anchor="middle" fill="#446688">19</text>
    <rect x="190" y="92" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="255" y="107" text-anchor="middle" fill="#b85450">19</text>
    <rect x="320" y="92" width="180" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="410" y="107" text-anchor="middle" fill="#888">同起点，先动再判</text>

    <!-- iter 1 -->
    <rect x="20" y="116" width="60" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="50" y="131" text-anchor="middle">第 1 轮</text>
    <rect x="80" y="116" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="135" y="131" text-anchor="middle" fill="#446688">82</text>
    <rect x="190" y="116" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="255" y="131" text-anchor="middle" fill="#b85450">68</text>
    <rect x="320" y="116" width="180" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="410" y="131" text-anchor="middle" fill="#888">82 ≠ 68，继续</text>

    <!-- iter 2 -->
    <rect x="20" y="140" width="60" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="50" y="155" text-anchor="middle">第 2 轮</text>
    <rect x="80" y="140" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="135" y="155" text-anchor="middle" fill="#446688">68</text>
    <rect x="190" y="140" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="1" filter="url(#rough2)"/>
    <text x="255" y="155" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="320" y="140" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="410" y="155" text-anchor="middle" fill="#4a7a3a" font-weight="bold">fast == 1 → 快乐 ✓</text>
  </g>

  <!-- ===== Digit-square-sum chain visual ===== -->
  <text x="30" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">序列链：19 → 82 → 68 → 100 → 1（不动点）</text>
  <g font-size="10">
    <ellipse cx="70" cy="216" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>
    <ellipse cx="170" cy="216" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">82</text>
    <ellipse cx="270" cy="216" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">68</text>
    <ellipse cx="370" cy="216" rx="22" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="370" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">100</text>
    <ellipse cx="470" cy="216" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="470" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <path d="M 90 216 L 148 216" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 190 216 L 248 216" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 290 216 L 346 216" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 392 216 L 448 216" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- ===== Unhappy cycle note ===== -->
  <rect x="30" y="250" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">不快乐数最终都进入唯一环</text>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4</text>
  <text x="270" y="304" text-anchor="middle" font-size="9" fill="#555">枚举 [1, 243] 可验证：非快乐数必落入此 8 元环，快乐数必到 1</text>

  <!-- ===== Footnote ===== -->
  <rect x="30" y="324" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">判定只需两种结果：fast 到 1（快乐）/ slow==fast 成环（不快乐）</text>
  <text x="270" y="360" text-anchor="middle" font-size="9" fill="#555">floyd 法无需哈希集合，空间 O(1)；与 141/142/287 同构</text>
  <text x="270" y="372" text-anchor="middle" font-size="9" fill="#555">唯一区别：「next」从 node.next / nums[i] 换成数位平方和 f(x)</text>
</svg>
