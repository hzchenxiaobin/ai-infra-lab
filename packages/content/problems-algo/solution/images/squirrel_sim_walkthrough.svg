<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5×7 网格，tree=[2,2]，squirrel=[4,4]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">nuts = [[3,0], [2,5]]</text>

  <!-- ===== Table header ===== -->
  <!-- columns: nut | d(tree,nut) | 2×往返 | d(sq,nut) | 节省 -->
  <rect x="40" y="62" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">坚果 j</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d(tree,nut)</text>
  <text x="268" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2×往返</text>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d(sq,nut)</text>
  <text x="466" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">节省=d_t−d_s</text>

  <!-- ===== Row 1: nut [3,0] ===== -->
  <rect x="40" y="96" width="480" height="32" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="117" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">[3,0]</text>
  <text x="180" y="117" text-anchor="middle" font-size="11.5" fill="#333">|2−3|+|2−0| = 3</text>
  <text x="268" y="117" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="360" y="117" text-anchor="middle" font-size="11.5" fill="#333">|4−3|+|4−0| = 5</text>
  <text x="466" y="117" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">3 − 5 = −2</text>

  <!-- ===== Row 2: nut [2,5]  (chosen, highlight) ===== -->
  <rect x="40" y="130" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="151" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">[2,5] ⭐</text>
  <text x="180" y="151" text-anchor="middle" font-size="11.5" fill="#333">|2−2|+|2−5| = 3</text>
  <text x="268" y="151" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="360" y="151" text-anchor="middle" font-size="11.5" fill="#333">|4−2|+|4−5| = 3</text>
  <text x="466" y="151" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3 − 3 = 0</text>

  <!-- ===== Computation box ===== -->
  <rect x="40" y="180" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">套公式计算</text>

  <text x="60" y="228" font-size="11.5" fill="#444">① 公共往返 S = 6 + 6 = 12</text>
  <text x="60" y="248" font-size="11.5" fill="#444">② maxSave = max(−2, 0) = 0   （选 [2,5] 作第一颗）</text>
  <text x="60" y="266" font-size="12" fill="#b85450" font-weight="bold">③ ans = S − maxSave = 12 − 0 = 12  ⭐</text>

  <!-- ===== Path verification box ===== -->
  <rect x="40" y="286" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">手动验证路径</text>
  <text x="60" y="330" font-size="11" fill="#444">第一颗：鼠[4,4] →果[2,5] (3) → 树[2,2] (3) = 6</text>
  <text x="60" y="348" font-size="11" fill="#444">第二颗：树[2,2] → 果[3,0] → 树[2,2] = 2×3 = 6</text>
  <text x="60" y="362" font-size="11" fill="#b85450" font-weight="bold">合计 = 6 + 6 = 12  ✓ 与公式一致</text>
</svg>
