<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分组聚合 → HAVING 对标全国均值 → 升序输出</text>

  <!-- ① FROM -->
  <rect x="56" y="44" width="188" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">FROM Listings</text>
  <text x="150" y="76" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">11 行明细</text>

  <path d="M 150 84 L 150 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② GROUP BY -->
  <rect x="56" y="100" width="188" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">GROUP BY city</text>
  <text x="150" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">按城市分桶 → 4 组</text>

  <path d="M 150 140 L 150 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 组内 AVG -->
  <rect x="56" y="156" width="188" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">每组 AVG(price)</text>
  <text x="150" y="188" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">城市均价：Σprice ÷ 套数</text>

  <path d="M 150 196 L 150 210" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ④ HAVING 菱形 -->
  <polygon points="150,212 240,244 150,276 60,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">HAVING</text>
  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">城市均价 ＞ 全国均价 ?</text>

  <!-- 否分支 -->
  <path d="M 60 244 L 30 244" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="44" y="236" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="30" y="260" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">淘汰该组</text>

  <!-- 是分支 -->
  <path d="M 150 276 L 150 290" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="162" y="288" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ⑤ SELECT + ORDER BY -->
  <rect x="56" y="292" width="188" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">SELECT city</text>
  <text x="150" y="324" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ORDER BY city 升序</text>

  <path d="M 244 312 L 296 312" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="300" y="290" width="206" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="403" y="310" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输出 city 列</text>
  <text x="403" y="328" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">Chicago、LosAngeles</text>

  <!-- 标量子查询 -->
  <rect x="300" y="150" width="206" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="170" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">标量子查询（非相关）</text>
  <text x="403" y="188" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">(SELECT AVG(price)</text>
  <text x="403" y="204" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)"> FROM Listings)</text>
  <text x="403" y="224" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">= 5,574,304.91</text>
  <text x="403" y="240" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">不引用外层列 → 只算一次</text>

  <path d="M 300 198 C 272 200, 254 218, 242 238" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrY)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="212" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">基准</text>

  <!-- FROM → 子查询 虚线 -->
  <path d="M 244 64 C 310 64, 390 92, 402 146" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="352" y="82" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">子查询独立扫一遍全表</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 聚合比较必须写在 HAVING（WHERE 阶段还没有组）；ORDER BY city 升序别忘写</text>
</svg>
