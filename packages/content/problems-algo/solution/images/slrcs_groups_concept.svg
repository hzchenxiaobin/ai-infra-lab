<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：压缩成「连续段」，一次交换只能桥接 1 个异字符</text>

  <!-- Example 1: aaabaaa, gap = 1, bridgeable -->
  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">可桥接（gap=1）：</text>
  <text x="40" y="84" font-size="11" fill="#888">text:</text>
  <!-- 7 cells aaabaaa -->
  <rect x="90" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="128" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="166" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="204" y="68" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="242" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="280" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="318" y="68" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- group brackets: a:3  b:1  a:3 -->
  <path d="M 90 112 Q 90 120 96 120 L 196 120 Q 204 120 204 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="147" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:3</text>
  <path d="M 204 112 Q 204 120 210 120 L 234 120 Q 242 120 242 112" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="223" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b:1</text>
  <path d="M 242 112 Q 242 120 248 120 L 350 120 Q 356 120 356 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="299" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:3</text>

  <!-- swap arrow on b -->
  <text x="223" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">换掉它 → 桥接</text>

  <!-- Example 2: aaabbaaa, gap = 2, NOT bridgeable -->
  <text x="40" y="174" font-size="12" fill="#888" font-weight="bold">不可桥接（gap=2）：</text>
  <text x="40" y="196" font-size="11" fill="#888">text:</text>
  <rect x="90" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="128" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="166" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="204" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="242" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="280" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="318" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="356" y="180" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <path d="M 90 224 Q 90 232 96 232 L 196 232 Q 204 232 204 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="147" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:3</text>
  <path d="M 204 224 Q 204 232 210 232 L 272 232 Q 280 232 280 224" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="242" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b:2</text>
  <path d="M 280 224 Q 280 232 286 232 L 388 232 Q 394 232 394 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="337" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a:3</text>

  <text x="242" y="170" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">换 1 个仍剩 1 个 → 断开</text>

  <!-- three cases formula box -->
  <rect x="30" y="268" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">三种取值情形（cnt[c] = 字符 c 的总数）</text>
  <line x1="50" y1="298" x2="510" y2="298" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="318" font-size="10.5" fill="#444" font-weight="bold">A 单段延长：</text>
  <text x="150" y="318" font-size="10.5" fill="#555">cnt[c] &gt; len ? len+1 : len</text>
  <text x="320" y="318" font-size="10" fill="#888">（有富余同字符可借一个续到端点）</text>

  <text x="44" y="340" font-size="10.5" fill="#444" font-weight="bold">B 桥接合并：</text>
  <text x="150" y="340" font-size="10.5" fill="#555">相邻同段 gap=1 → merged = len₁+len₂</text>
  <text x="320" y="340" font-size="10" fill="#888">（换掉中间异字符）</text>

  <text x="44" y="362" font-size="10.5" fill="#b85450" font-weight="bold">+1 判定：</text>
  <text x="150" y="362" font-size="10.5" fill="#555">cnt[c] &gt; merged ? merged+1 : merged</text>
  <text x="320" y="362" font-size="10" fill="#888">（还有第三个 c 可再续 1 位）</text>

  <text x="44" y="382" font-size="10" fill="#4a7a3a" font-style="italic">关键：一次交换只能填 1 个空位，故 gap 必须恰好为 1</text>
</svg>
