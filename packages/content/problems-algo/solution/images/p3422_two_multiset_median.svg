<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：窗口劈两半维护，中位数代价 O(1) 结算</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">示例 1 的窗口 [-3, 2, 1] → 排序 [-3, 1, 2]，劈成较小半 / 较大半</text>

  <!-- 窗口单元格 -->
  <text x="212" y="52" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">lo（较小半）</text>
  <text x="299" y="52" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">hi（较大半）</text>

  <rect x="186" y="58" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="212" y="82" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−3</text>

  <rect x="244" y="58" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="302" y="58" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="328" y="82" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="128" y="66" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">新元素 x</text>
  <path d="M 96 77 L 182 77" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="212" y="112" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">|lo| = 1，s_lo = −3</text>
  <text x="299" y="112" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">|hi| = 2，s_hi = 3</text>

  <text x="412" y="128" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">中位数 m = min(hi)</text>
  <path d="M 360 122 L 274 98" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 代价公式卡 -->
  <rect x="16" y="140" width="488" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">两边之和随窗口增量维护 → 代价 O(1) 结算</text>
  <text x="260" y="173" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">cost = (s_hi − m·|hi|) + (m·|lo| − s_lo)</text>
  <text x="260" y="189" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">= (3 − 1×2) + (1×1 − (−3)) = 1 + 4 = 5</text>

  <!-- 左下：为什么是中位数 -->
  <rect x="16" y="206" width="238" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="226" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">为什么目标是中位数？</text>
  <text x="135" y="243" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">cost(t) = Σ|x − t| 分段线性且凸</text>
  <text x="135" y="260" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">t 处斜率 = 左侧元素数 − 右侧元素数</text>
  <text x="135" y="277" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">中位数左侧斜率 ≤ 0，右侧 ≥ 0</text>
  <text x="135" y="294" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">⇒ 最小代价在中位数处取得</text>
  <text x="135" y="309" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">偶数 k：两个中位数之间任取皆可</text>

  <!-- 右下：总答案取 min -->
  <rect x="270" y="206" width="234" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="226" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">总答案 = 各窗口 cost 取 min</text>
  <text x="387" y="243" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">只需磨平一个窗口 → 挑最便宜的</text>
  <text x="387" y="260" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">示例 1 的四个窗口 cost：</text>
  <text x="387" y="277" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">[7, 5, 6, 10]</text>
  <text x="387" y="294" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">ans = 5：把 [-3,2,1] 磨成 [1,1,1]</text>
  <text x="387" y="309" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">相邻窗口一进一出 → 滑动维护</text>

  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">示例 1：nums = [4,-3,2,1,-4,6]，k = 3 → 答案 5</text>
</svg>
