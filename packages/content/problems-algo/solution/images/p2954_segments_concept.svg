<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">切段示意（n = 10，sick = [2,6]）：边界段 vs 内部段</text>

  <!-- direction labels -->
  <text x="100" y="46" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">唯一</text>
  <text x="240" y="46" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每秒：吃左端 or 吃右端</text>
  <text x="400" y="46" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">唯一</text>

  <!-- infection direction arrows -->
  <path d="M 134 54 L 74 54" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 184 54 L 222 54" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 296 54 L 258 54" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 346 54 L 452 54" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- children row -->
  <rect x="60" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="64" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="64" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="80" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="86" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">病</text>
  <text x="200" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="320" y="86" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">病</text>
  <text x="360" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="400" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="440" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="120" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="160" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="200" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="240" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="280" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="320" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="360" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="400" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="440" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">9</text>

  <!-- segment pills -->
  <rect x="64" y="122" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="13" filter="url(#rough2)"/>
  <text x="100" y="139" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">首段 L=2</text>
  <rect x="184" y="122" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="13" filter="url(#rough2)"/>
  <text x="240" y="139" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">内部段 L=3</text>
  <rect x="352" y="122" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="13" filter="url(#rough2)"/>
  <text x="400" y="139" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">末段 L=3</text>

  <!-- interior segment explanation -->
  <rect x="26" y="164" width="468" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="186" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">内部段（两侧都有病源）</text>
  <text x="42" y="206" font-size="11" fill="#333" filter="url(#rough2)">剩余块左右两端每秒都是候选 → 每步 2 选 1（吃左 or 吃右）</text>
  <text x="42" y="224" font-size="11" fill="#333" filter="url(#rough2)">只剩最后 1 人时被迫 → 内部序 = 2^(L−1) 种（L=3 → 4 种）</text>

  <!-- boundary segment explanation -->
  <rect x="26" y="254" width="468" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="276" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">边界段（只有一侧有病源）</text>
  <text x="42" y="296" font-size="11" fill="#333" filter="url(#rough2)">只有挨着病源的那端能被吃，吃完才解锁下一个</text>
  <text x="42" y="314" font-size="11" fill="#333" filter="url(#rough2)">顺序完全确定 → 内部序 = 1 种</text>

  <!-- bottom strip -->
  <rect x="46" y="346" width="428" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">段内计数：边界段 1 种；内部段 2^(L−1) 种</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本图 3 段，S = 6 个健康孩子；段间如何穿插 → 下一张图</text>
</svg>
