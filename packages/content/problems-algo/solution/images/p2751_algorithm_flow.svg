<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa" filter="url(#rough2)"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：排序 → 栈遍历 → 编号还原</text>

  <!-- Step 1 -->
  <rect x="160" y="46" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">Step 1 按位置排序</text>
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">idx = 下标按 positions 升序</text>

  <line x1="270" y1="92" x2="270" y2="116" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 decision -->
  <polygon points="270,116 380,168 270,220 160,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">Step 2 遍历 idx</text>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">directions[i] ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（R / L 分支）</text>

  <!-- R branch: left -->
  <line x1="160" y1="168" x2="110" y2="168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R</text>
  <rect x="20" y="150" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">直接入栈</text>
  <text x="65" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">stk.push(i)</text>

  <!-- L branch: right -->
  <line x1="380" y1="168" x2="430" y2="168" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">L</text>

  <!-- L collision loop -->
  <rect x="430" y="150" width="100" height="76" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">while 碰撞</text>
  <text x="480" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">栈顶是 R ?</text>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">比较 healths</text>
  <text x="480" y="216" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">扣血/弹出</text>

  <!-- loop arrow back -->
  <path d="M480,226 Q480,250 460,250 Q440,250 440,228" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- L survives? -->
  <line x1="430" y1="188" x2="380" y2="250" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="240" y="240" width="150" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">存活？写回 healths[i]</text>

  <line x1="270" y1="220" x2="270" y2="238" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="65" y1="190" x2="65" y2="238" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="65" y1="238" x2="270" y2="238" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <line x1="270" y1="278" x2="270" y2="300" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="294" font-size="10" fill="#888" filter="url(#rough2)">遍历完</text>

  <!-- Step 3 -->
  <rect x="150" y="300" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">Step 3 收集栈中幸存者</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(原编号 i, 最终健康度)</text>

  <line x1="270" y1="346" x2="270" y2="370" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="130" y="370" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Step 4 按原编号排序 → 输出健康度</text>
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sort(res, by i) → [healths[i]]</text>

  <text x="270" y="436" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两次排序：位置排序模拟碰撞 / 编号排序满足输出</text>
</svg>
