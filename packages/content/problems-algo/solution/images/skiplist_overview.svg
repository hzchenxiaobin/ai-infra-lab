  <g filter="url(#sk)"><rect x="40" y="310" width="680" height="92" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="60" y="334" font-size="13" font-weight="bold" fill="#444">核心思想：</text>
  <text x="60" y="356" font-size="11" fill="#444">底层 L0 = 完整有序链表；每层以概率 p 抽样升层，形成「快速通道」。</text>
  <text x="60" y="374" font-size="11" fill="#444">搜索从最高层出发，遇 next &gt; target 则下降 —— 像坐地铁快线到站换慢线。</text>
  <text x="60" y="392" font-size="11" fill="#7a5415">★ 期望高度 O(log n)，search / add / erase 均 O(log n)</text>
