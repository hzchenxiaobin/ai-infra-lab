<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：三状态对向收缩</text>

  <!-- Init box -->
  <rect x="180" y="48" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=0, j=n−1, ans=0</text>

  <path d="M280,86 L280,108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < j ? -->
  <polygon points="280,110 350,150 280,190 210,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; j ?</text>

  <!-- Yes branch (right): concat -->
  <text x="360" y="144" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="370" y="128" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p=10^d(b)</text>
  <text x="440" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans+=a·p+b; i++; j−−</text>
  <!-- loop back up to diamond1 -->
  <path d="M370,150 L350,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M440,128 C440,100 320,96 280,110" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <text x="288" y="208" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M280,190 L280,212" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Diamond 2: i == j ? -->
  <polygon points="280,214 350,254 280,294 210,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i == j ?</text>

  <!-- Yes (left): single element -->
  <text x="200" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="232" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans+=nums[i]; i++</text>
  <!-- loop back up to diamond1 -->
  <path d="M200,254 L210,254" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M120,232 C120,150 210,130 210,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- No (down): return -->
  <text x="288" y="312" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M280,294 L280,310" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="190" y="312" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">return ans</text>
</svg>
