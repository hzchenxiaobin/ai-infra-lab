<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：每段左侧的零节点 = 段和的免费容器</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#666">原链表 head = 0 → 3 → 1 → 0 → 4 → 5 → 2 → 0</text>

  <!-- ===== 原链表 ===== -->
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#2b6e9e">① 原链表：零节点是"分隔符"，每段夹在两个零之间</text>

  <g filter="url(#sk)"><rect x="40" y="116" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="68" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="120" y="116" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="148" y="140" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="200" y="116" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="228" y="140" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="280" y="116" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="308" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="360" y="116" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="388" y="140" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="440" y="116" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="468" y="140" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">5</text>
  <g filter="url(#sk)"><rect x="520" y="116" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="548" y="140" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="600" y="116" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="628" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="680" y="140" font-size="11" fill="#888">→ null</text>

  <path d="M 96 136 L 116 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 176 136 L 196 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 256 136 L 276 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 336 136 L 356 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 416 136 L 436 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 496 136 L 516 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 576 136 L 596 136" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 段标注 -->
  <path d="M 68 162 L 68 178" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="148" y="174" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">第 1 段：3 + 1</text>
  <path d="M 68 178 L 308 178" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 308 162 L 308 178" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <path d="M 308 196 L 308 212" stroke="#7a5415" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="468" y="208" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">第 2 段：4 + 5 + 2</text>
  <path d="M 308 212 L 628 212" stroke="#7a5415" stroke-width="1" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 628 162 L 628 212" stroke="#7a5415" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- ===== 复用箭头 ===== -->
  <text x="50" y="250" font-size="13" font-weight="bold" fill="#b85450">② 复用：把每段左侧零节点改写为段和（val: 0 → 段和）</text>

  <path d="M 68 162 Q 60 220 76 285" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="30" y="222" font-size="10" fill="#b85450" font-weight="bold">填 3+1=4</text>

  <path d="M 308 162 Q 400 230 308 285" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="222" font-size="10" fill="#b85450" font-weight="bold">填 4+5+2=11</text>

  <!-- ===== 结果链表 ===== -->
  <g filter="url(#sk)"><rect x="40" y="296" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="68" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="280" y="296" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="308" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">11</text>
  <text x="360" y="320" font-size="11" fill="#888">→ null</text>

  <path d="M 96 316 Q 188 300 280 316" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="68" y="354" text-anchor="middle" font-size="10" fill="#888">原第 1 个 0</text>
  <text x="68" y="368" text-anchor="middle" font-size="10" fill="#888">（head）</text>
  <text x="308" y="354" text-anchor="middle" font-size="10" fill="#888">原第 2 个 0</text>
  <text x="308" y="368" text-anchor="middle" font-size="10" fill="#888">（复用）</text>

  <text x="50" y="402" font-size="12" fill="#2b2b2b" font-weight="bold">结果链表 = [4, 11]，全部由"原零节点"改写而来，零额外分配</text>

  <rect x="40" y="418" width="840" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="460" y="438" text-anchor="middle" font-size="11" fill="#7a5415">洞察：每段左侧必贴一个零节点 → 它正是"承载段和"的免费容器，无需 new 节点</text>
</svg>
