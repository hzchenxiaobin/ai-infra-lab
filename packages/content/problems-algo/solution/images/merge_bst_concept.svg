<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：根值 ∉ 叶值集合 → 最终根；叶值 = 根值 → 合并目标</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">trees = [[2,1],[3,2,5],[5,4]]，三棵小 BST 的根值与叶值关系</text>

  <!-- ===== Three input trees ===== -->
  <text x="280" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入：三棵 BST（每棵 ≤ 3 节点，根值唯一）</text>

  <!-- Tree0: root=2, left=1 -->
  <g font-size="12" filter="url(#rough2)">
    <circle cx="70" cy="104" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70" y="109" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="45" cy="152" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="45" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <path d="M 62 116 L 50 140" stroke="#446688" stroke-width="1.3" fill="none"/>
  </g>
  <text x="70" y="180" text-anchor="middle" font-size="10" fill="#888">Tree0 根=2 叶={1}</text>

  <!-- Tree1: root=3, left=2, right=5 -->
  <g font-size="12" filter="url(#rough2)">
    <circle cx="200" cy="104" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="200" y="109" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="175" cy="152" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="175" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="225" cy="152" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="225" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <path d="M 192 116 L 180 140" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 208 116 L 220 140" stroke="#446688" stroke-width="1.3" fill="none"/>
  </g>
  <text x="200" y="180" text-anchor="middle" font-size="10" fill="#888">Tree1 根=3 叶={2,5}</text>

  <!-- Tree2: root=5, left=4 -->
  <g font-size="12" filter="url(#rough2)">
    <circle cx="340" cy="104" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="340" y="109" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <circle cx="315" cy="152" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="315" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <path d="M 332 116 L 320 140" stroke="#446688" stroke-width="1.3" fill="none"/>
  </g>
  <text x="340" y="180" text-anchor="middle" font-size="10" fill="#888">Tree2 根=5 叶={4}</text>

  <!-- legend -->
  <g font-size="9" filter="url(#rough2)">
    <rect x="420" y="96" width="120" height="56" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="4"/>
    <circle cx="434" cy="110" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="446" y="113" fill="#555">根节点</text>
    <circle cx="434" cy="128" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="446" y="131" fill="#555">叶节点</text>
    <circle cx="434" cy="146" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="446" y="149" fill="#555">最终根</text>
  </g>

  <!-- ===== Analysis section ===== -->
  <line x1="30" y1="200" x2="530" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分析：根值 vs 叶值集合</text>

  <!-- leaf_vals box -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="236" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="140" y="252" text-anchor="middle" fill="#d6a040" font-weight="bold">leaf_vals = {1, 2, 4, 5}</text>
    <text x="140" y="268" text-anchor="middle" font-size="9" fill="#888">所有树的叶值汇总</text>
  </g>

  <!-- root vals check -->
  <g font-size="10" filter="url(#rough2)">
    <!-- Tree0 root=2 -->
    <rect x="270" y="236" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="284" y="251" fill="#b85450" font-weight="bold">根 2 ∈ leaf_vals</text>
    <text x="440" y="251" fill="#b85450">→ 非最终根 ✗</text>

    <!-- Tree1 root=3 -->
    <rect x="270" y="260" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="284" y="275" fill="#4a7a3a" font-weight="bold">根 3 ∉ leaf_vals</text>
    <text x="440" y="275" fill="#4a7a3a" font-weight="bold">→ 最终根 ✓</text>

    <!-- Tree2 root=5 -->
    <rect x="270" y="284" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="284" y="299" fill="#b85450" font-weight="bold">根 5 ∈ leaf_vals</text>
    <text x="440" y="299" fill="#b85450">→ 非最终根 ✗</text>
  </g>

  <!-- ===== Merge arrows ===== -->
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合并方向：叶值匹配根值 → 用该树替换叶子</text>

  <g font-size="10" filter="url(#rough2)">
    <!-- arrow: Tree1 leaf 2 -> Tree0 root 2 -->
    <text x="100" y="356" fill="#4a7a3a" font-weight="bold">叶 2 = Tree0 根 2</text>
    <path d="M 175 340 Q 120 340 80 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="5,3"/>

    <!-- arrow: Tree1 leaf 5 -> Tree2 root 5 -->
    <text x="300" y="356" fill="#4a7a3a" font-weight="bold">叶 5 = Tree2 根 5</text>
    <path d="M 225 340 Q 280 340 330 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
  </g>

  <!-- result box -->
  <rect x="40" y="372" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终根 = Tree1（根值 3 不被任何叶子匹配）</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#555">从 Tree1 出发 DFS：遇到叶值匹配根值 → 替换 → 递归新子树</text>
</svg>
