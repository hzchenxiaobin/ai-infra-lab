<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,1,9,6]，modulo = 3，k = 0</text>

  <!-- table header -->
  <rect x="40" y="46" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">元素 x</text>
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="210" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="275" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">need</text>
  <text x="385" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">命中 cnt[need]</text>
  <text x="510" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0: init -->
  <rect x="40" y="76" width="520" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">初始</text>
  <text x="150" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="210" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="275" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="385" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt = {0:1}</text>
  <text x="510" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 1: x=3 -->
  <rect x="40" y="110" width="520" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="132" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0（无键 1）</text>
  <text x="510" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2: x=1 -->
  <rect x="40" y="144" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓ → 子数组 [1]</text>
  <text x="510" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 3: x=9 -->
  <rect x="40" y="178" width="520" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="385" y="200" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0（无键 2）</text>
  <text x="510" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 4: x=6 -->
  <rect x="40" y="212" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="385" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓ → 子数组 [3,1,9,6]</text>
  <text x="510" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- footnote: map evolution -->
  <text x="40" y="270" font-size="11" fill="#999" filter="url(#rough2)">每行结尾把 s%modulo 写回 cnt：依次 {0:1,1:1} → {0:1,1:2} → {0:1,1:2,2:1} → {0:2,1:2,2:1}</text>
  <text x="40" y="288" font-size="11" fill="#999" filter="url(#rough2)">need = (s − k + modulo) % modulo，本例 k = 0 即 need = s % 3</text>

  <!-- hits explanation -->
  <rect x="50" y="304" width="500" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两次命中的来源</text>
  <text x="300" y="350" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x=1 时 s=1 匹配此前的 s₁=1 → 子数组 [1]，cnt=0，0%3=0 ✓</text>
  <text x="300" y="372" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x=6 时 s=3 匹配此前的 s₀=0 → 子数组 [3,1,9,6]，cnt=3，3%3=0 ✓</text>
  <text x="300" y="394" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终答案 ans = 2</text>
</svg>
