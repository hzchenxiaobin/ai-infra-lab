<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐秒传递轨迹 + 取余定位</text>

  <!-- ===== 示例 1：n=4, time=5 ===== -->
  <text x="60" y="54" font-size="12" fill="#446688" font-weight="bold">示例 1：n = 4, time = 5</text>

  <!-- 时间轴标签 t=0..5 -->
  <!-- 6 个格子，宽 56，间隔 12，从 x=60 起 -->
  <!-- 格子中心：60+28=88, 88+68=156, 224, 292, 360, 428 -->
  <!-- t 标签 -->
  <text x="88" y="80" text-anchor="middle" font-size="10" fill="#888">t=0</text>
  <text x="156" y="80" text-anchor="middle" font-size="10" fill="#888">t=1</text>
  <text x="224" y="80" text-anchor="middle" font-size="10" fill="#888">t=2</text>
  <text x="292" y="80" text-anchor="middle" font-size="10" fill="#888">t=3</text>
  <text x="360" y="80" text-anchor="middle" font-size="10" fill="#888">t=4</text>
  <text x="428" y="80" text-anchor="middle" font-size="10" fill="#888">t=5</text>

  <!-- 格子 -->
  <rect x="60" y="88" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="88" y="116" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>

  <rect x="128" y="88" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="156" y="116" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>

  <rect x="196" y="88" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="224" y="116" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">3</text>

  <rect x="264" y="88" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="292" y="116" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>

  <rect x="332" y="88" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="360" y="116" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">3</text>

  <rect x="400" y="88" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="428" y="116" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 箭头连接 -->
  <path d="M 116 110 L 128 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 110 L 196 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 110 L 264 110" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 110 L 332 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 388 110 L 400 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 反向标注 -->
  <text x="292" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 到达队尾 n=4，方向反转</text>
  <text x="428" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ 5 秒后</text>

  <!-- 取余计算 -->
  <rect x="60" y="160" width="396" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.75"/>
  <text x="258" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">取余定位（不逐秒模拟）</text>
  <text x="258" y="194" text-anchor="middle" font-size="11" fill="#333">T = 6, t = 5 mod 6 = 5,  pos = 4 − |5 − 3| = 4 − 2 = <tspan font-weight="bold" fill="#4a7a3a">2</tspan> ✓</text>

  <!-- ===== 示例 2：n=3, time=2 ===== -->
  <text x="60" y="226" font-size="12" fill="#446688" font-weight="bold">示例 2：n = 3, time = 2</text>

  <text x="88" y="252" text-anchor="middle" font-size="10" fill="#888">t=0</text>
  <text x="180" y="252" text-anchor="middle" font-size="10" fill="#888">t=1</text>
  <text x="272" y="252" text-anchor="middle" font-size="10" fill="#888">t=2</text>

  <rect x="60" y="260" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="88" y="288" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>

  <rect x="152" y="260" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>

  <rect x="244" y="260" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>

  <path d="M 116 282 L 152 282" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 282 L 244 282" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="260" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.75"/>
  <text x="430" y="278" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">取余定位</text>
  <text x="430" y="294" text-anchor="middle" font-size="11" fill="#333">T=4, t=2 mod 4=2, pos=3−|2−2|=<tspan font-weight="bold" fill="#4a7a3a">3</tspan> ✓</text>

  <!-- 总结 -->
  <rect x="40" y="324" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">关键：往返一次 = 周期 2(n−1)，取余后位置是一段折线（三角波）</text>
  <text x="290" y="357" text-anchor="middle" font-size="10" fill="#555">峰值在 t = n−1 取到 n；端点折回 = n − |t − (n−1)|</text>
</svg>
