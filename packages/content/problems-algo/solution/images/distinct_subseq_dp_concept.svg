<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">不同的子序列：字符匹配时「用 + 跳」两路汇总</text>
  <path d="M 220 44 Q 390 52 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="58" text-anchor="middle" font-size="11" fill="#888">示例 s="baba", t="ba" —— 匹配格子有两条来源，不匹配格子只有一条</text>

  <!-- 列标题 t: "", b, a -->
  <text x="148" y="82" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s↓ t→</text>
  <text x="202" y="82" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">""</text>
  <text x="266" y="82" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">b</text>
  <text x="330" y="82" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">a</text>

  <!-- 行标题 s: "", b, a, b, a -->
  <text x="148" y="112" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">""</text>
  <text x="148" y="148" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">b</text>
  <text x="148" y="184" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">a</text>
  <text x="148" y="220" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">b</text>
  <text x="148" y="256" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">a</text>

  <!-- 第 0 行: 边界 dp[0][0]=1, dp[0][j]=0 -->
  <g filter="url(#sk)"><rect x="170" y="94" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="202" y="118" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="234" y="94" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="266" y="118" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="298" y="94" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="330" y="118" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">0</text>

  <!-- 第 1 行 (b): 1, 1, 0 -->
  <g filter="url(#sk)"><rect x="170" y="130" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="202" y="154" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="234" y="130" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="266" y="154" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="298" y="130" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="330" y="154" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>

  <!-- 第 2 行 (a): 1, 1, 1 -->
  <g filter="url(#sk)"><rect x="170" y="166" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="202" y="190" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="234" y="166" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="266" y="190" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="298" y="166" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="330" y="190" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>

  <!-- 第 3 行 (b): 1, 2, 1 — dp[3][2] 不匹配，蓝高亮 + 单箭头 -->
  <g filter="url(#sk)"><rect x="170" y="202" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="202" y="226" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="234" y="202" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="266" y="226" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <!-- 不匹配格 dp[3][2]: b≠a -->
  <g filter="url(#sk)"><rect x="298" y="202" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="330" y="226" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>
  <!-- 不匹配箭头：上方 dp[2][2] → dp[3][2] -->
  <path d="M 330 198 L 330 202" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="346" y="198" font-size="10" fill="#4a8edb">只能跳</text>

  <!-- 第 4 行 (a): 1, 2, 3 — dp[4][2] 匹配，绿高亮 + 双箭头 -->
  <g filter="url(#sk)"><rect x="170" y="238" width="64" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="202" y="262" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="234" y="238" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="266" y="262" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">2</text>
  <!-- 匹配格 dp[4][2]: a==a -->
  <g filter="url(#sk)"><rect x="298" y="238" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="330" y="262" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">3</text>
  <!-- 匹配箭头 1：左上 dp[3][1] → dp[4][2]（用 a 配对） -->
  <path d="M 298 220 Q 312 228 322 238" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)" stroke-dasharray="4,2"/>
  <text x="300" y="234" font-size="10" fill="#4a8e4a" font-weight="bold">用 a</text>
  <!-- 匹配箭头 2：上方 dp[3][2] → dp[4][2]（跳过 s 的 a） -->
  <path d="M 330 234 L 330 238" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4,2"/>
  <text x="346" y="238" font-size="10" fill="#c98a2b" font-weight="bold">跳 s 的 a</text>

  <!-- 右侧：状态转移方程 -->
  <g filter="url(#sk)">
    <rect x="420" y="94" width="320" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="580" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">状态转移方程</text>

  <text x="440" y="146" font-size="12" fill="#4a8e4a" font-weight="bold">字符匹配 s[i-1] == t[j-1]：</text>
  <text x="456" y="166" font-family="monospace" font-size="12" fill="#2b2b2b">dp[i][j] = dp[i-1][j-1] + dp[i-1][j]</text>
  <text x="456" y="184" font-size="10" fill="#4a8e4a">↖ 用 s[i-1] 配对 t[j-1]</text>
  <text x="456" y="198" font-size="10" fill="#c98a2b">↑ 跳过 s[i-1]，留给别的位置配</text>

  <text x="440" y="226" font-size="12" fill="#b03a3a" font-weight="bold">字符不匹配 s[i-1] != t[j-1]：</text>
  <text x="456" y="246" font-family="monospace" font-size="12" fill="#2b2b2b">dp[i][j] = dp[i-1][j]</text>
  <text x="456" y="262" font-size="10" fill="#b03a3a">↑ s[i-1] 无法配 t[j-1]，只能跳过</text>

  <!-- 底部：边界与答案 -->
  <g filter="url(#sk)">
    <rect x="80" y="294" width="660" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="100" y="318" font-size="12" fill="#2b2b2b" font-weight="bold">边界与答案</text>
  <text x="100" y="342" font-size="11" fill="#c98a2b" font-weight="bold">dp[i][0] = 1</text>
  <text x="200" y="342" font-size="11" fill="#444">空串 t 唯一方案：什么都不选</text>
  <text x="100" y="364" font-size="11" fill="#c98a2b" font-weight="bold">dp[0][j] = 0 (j>0)</text>
  <text x="200" y="364" font-size="11" fill="#444">空串 s 无法配出非空 t</text>
  <text x="440" y="342" font-size="11" fill="#b03a3a" font-weight="bold">答案 = dp[m][n]</text>
  <text x="540" y="342" font-size="11" fill="#444">s[0..m-1] 配出 t[0..n-1] 的方案数</text>
  <text x="440" y="364" font-size="11" fill="#888">m = len(s), n = len(t)</text>
</svg>
