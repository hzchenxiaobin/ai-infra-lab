<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：读元数据，不扫数据</text>

  <!-- Step 1: input -->
  <rect x="36" y="80" width="120" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 输入</text>
  <text x="96" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">players</text>
  <text x="96" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pd.DataFrame</text>

  <path d="M 160 128 L 200 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: .shape -->
  <rect x="204" y="80" width="132" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 读 .shape</text>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">拿到 (10, 5)</text>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">属性访问 · O(1)</text>

  <path d="M 340 128 L 380 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: list() -->
  <rect x="384" y="80" width="140" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="104" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ list() 转换</text>
  <text x="454" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">tuple → list</text>
  <text x="454" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">匹配返回类型</text>

  <!-- output box -->
  <path d="M 454 180 L 454 210" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="404" y="214" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">④ 输出 [10, 5]</text>
  <text x="454" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[行数, 列数]</text>

  <!-- metadata vs data blocks -->
  <rect x="36" y="290" width="230" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="312" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">元数据区（瞬间读取）</text>
  <rect x="56" y="326" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="86" y="341" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">行数 10</text>
  <rect x="122" y="326" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="341" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">列数 5</text>
  <rect x="188" y="326" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="341" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">axes/索引</text>
  <text x="151" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">.shape 只是到这里查一下</text>

  <rect x="294" y="290" width="230" height="88" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="409" y="312" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">数据块（无需扫描）</text>
  <text x="409" y="336" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">10 × 5 = 50 个元素躺在内存里</text>
  <text x="409" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">求数量 ≠ 读内容，别去遍历它</text>
</svg>
