<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：6 条平方距离排序后校验</text>

  <!-- ============ Left: Example 1 (valid) ============ -->
  <rect x="20" y="44" width="250" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 1：✓ true（正方形）</text>

  <text x="32" y="88" font-size="10.5" fill="#333">点：[0,0] [1,1] [1,0] [0,1]</text>

  <text x="32" y="110" font-size="10" fill="#555" font-weight="bold">6 条平方距离：</text>
  <text x="32" y="126" font-family="monospace" font-size="10" fill="#333">(0,0)-(1,1)=2   (0,0)-(1,0)=1</text>
  <text x="32" y="140" font-family="monospace" font-size="10" fill="#333">(0,0)-(0,1)=1   (1,1)-(1,0)=1</text>
  <text x="32" y="154" font-family="monospace" font-size="10" fill="#333">(1,1)-(0,1)=1   (1,0)-(0,1)=2</text>

  <text x="32" y="178" font-size="10" fill="#555" font-weight="bold">排序后：</text>
  <rect x="32" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="68" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="86" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="104" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="140" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="158" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="184" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="194" y="198" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="212" y="184" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="32" y="220" font-size="9" fill="#888">↑ 4 条边(=1)   ↑ 2 条对角线(=2)</text>

  <text x="32" y="244" font-size="10" fill="#555" font-weight="bold">校验：</text>
  <text x="32" y="260" font-family="monospace" font-size="10" fill="#4a7a3a">a) 1 &gt; 0            ✓</text>
  <text x="32" y="276" font-family="monospace" font-size="10" fill="#4a7a3a">b) 4 边等 &amp; 2 对角等  ✓</text>
  <text x="32" y="292" font-family="monospace" font-size="10" fill="#4a7a3a">c) 2 == 2×1         ✓</text>

  <rect x="32" y="306" width="216" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ return true</text>

  <text x="32" y="356" font-size="9" fill="#888">边长²=1，对角线²=2=2×1</text>
  <text x="32" y="370" font-size="9" fill="#888">勾股成立 ⇒ 4 个角都是直角</text>

  <!-- ============ Right: Example 2 (invalid) ============ -->
  <rect x="290" y="44" width="250" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">示例 2：✗ false（非正方形）</text>

  <text x="302" y="88" font-size="10.5" fill="#333">点：[0,0] [1,1] [1,0] [0,12]</text>

  <text x="302" y="110" font-size="10" fill="#555" font-weight="bold">6 条平方距离：</text>
  <text x="302" y="126" font-family="monospace" font-size="10" fill="#333">(0,0)-(1,1)=2    (0,0)-(1,0)=1</text>
  <text x="302" y="140" font-family="monospace" font-size="10" fill="#333">(0,0)-(0,12)=144 (1,1)-(1,0)=1</text>
  <text x="302" y="154" font-family="monospace" font-size="10" fill="#333">(1,1)-(0,12)=122 (1,0)-(0,12)=145</text>

  <text x="302" y="178" font-size="10" fill="#555" font-weight="bold">排序后：</text>
  <rect x="302" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="338" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="356" y="198" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="374" y="184" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="392" y="198" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="410" y="184" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="428" y="198" text-anchor="middle" font-size="10" fill="#333">122</text>
  <rect x="446" y="184" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="464" y="198" text-anchor="middle" font-size="10" fill="#333">144</text>
  <rect x="482" y="184" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="500" y="198" text-anchor="middle" font-size="10" fill="#333">145</text>
  <text x="302" y="220" font-size="9" fill="#888">↑ 出现 4 种不同值，无法凑成 4+2</text>

  <text x="302" y="244" font-size="10" fill="#555" font-weight="bold">校验：</text>
  <text x="302" y="260" font-family="monospace" font-size="10" fill="#4a7a3a">a) 1 &gt; 0            ✓</text>
  <text x="302" y="276" font-family="monospace" font-size="10" fill="#b85450">b) 1≠2≠122…        ✗ 失败</text>
  <text x="302" y="292" font-family="monospace" font-size="9" fill="#888">前 4 个不等 ⇒ 不是 4 等边</text>

  <rect x="302" y="306" width="216" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ return false</text>

  <text x="302" y="356" font-size="9" fill="#888">第 4 个点 [0,12] 远离其余 3 点</text>
  <text x="302" y="370" font-size="9" fill="#888">距离分布散乱，构不成正方形</text>
</svg>
