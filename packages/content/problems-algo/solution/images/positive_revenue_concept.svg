<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：year = 2021 且 revenue &gt; 0 → 即为正收入客户</text>

  <!-- ===== Left: Customers table ===== -->
  <text x="135" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Customers 表（7 行）</text>
  <!-- header -->
  <rect x="20" y="60" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="76" font-size="8.5" fill="#446688" font-weight="bold">customer_id</text>
  <text x="135" y="76" font-size="9" fill="#446688" font-weight="bold">year</text>
  <text x="205" y="76" font-size="9" fill="#446688" font-weight="bold">revenue</text>
  <line x1="90" y1="60" x2="90" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: 1, 2018, 50 — year not 2021 -->
  <rect x="20" y="84" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="50" y="97" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="135" y="97" text-anchor="middle" font-size="8.5" fill="#888">2018</text>
  <text x="205" y="97" text-anchor="middle" font-size="8.5" fill="#888">50</text>
  <text x="260" y="97" font-size="8" fill="#888">✗ 年份</text>
  <line x1="90" y1="84" x2="90" y2="102" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="84" x2="170" y2="102" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 2: 1, 2021, 30 — PASS -->
  <rect x="20" y="102" width="230" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="115" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="135" y="115" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2021</text>
  <text x="205" y="115" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="260" y="115" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 保留</text>
  <line x1="90" y1="102" x2="90" y2="120" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="102" x2="170" y2="120" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 3: 1, 2020, 70 — year not 2021 -->
  <rect x="20" y="120" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="50" y="133" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="135" y="133" text-anchor="middle" font-size="8.5" fill="#888">2020</text>
  <text x="205" y="133" text-anchor="middle" font-size="8.5" fill="#888">70</text>
  <text x="260" y="133" font-size="8" fill="#888">✗ 年份</text>
  <line x1="90" y1="120" x2="90" y2="138" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="120" x2="170" y2="138" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 4: 2, 2021, -50 — year ok but revenue <=0 -->
  <rect x="20" y="138" width="230" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="151" text-anchor="middle" font-size="8.5" fill="#b85450">2</text>
  <text x="135" y="151" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2021</text>
  <text x="205" y="151" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">-50</text>
  <text x="260" y="151" font-size="8" fill="#b85450" font-weight="bold">✗ 负收入</text>
  <line x1="90" y1="138" x2="90" y2="156" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="138" x2="170" y2="156" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 5: 3, 2018, 10 — year not 2021 -->
  <rect x="20" y="156" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="50" y="169" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <text x="135" y="169" text-anchor="middle" font-size="8.5" fill="#888">2018</text>
  <text x="205" y="169" text-anchor="middle" font-size="8.5" fill="#888">10</text>
  <text x="260" y="169" font-size="8" fill="#888">✗ 年份</text>
  <line x1="90" y1="156" x2="90" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="156" x2="170" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 6: 3, 2016, 50 — year not 2021 -->
  <rect x="20" y="174" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="50" y="187" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <text x="135" y="187" text-anchor="middle" font-size="8.5" fill="#888">2016</text>
  <text x="205" y="187" text-anchor="middle" font-size="8.5" fill="#888">50</text>
  <text x="260" y="187" font-size="8" fill="#888">✗ 年份</text>
  <line x1="90" y1="174" x2="90" y2="192" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="174" x2="170" y2="192" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 7: 4, 2021, 20 — PASS -->
  <rect x="20" y="192" width="230" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="205" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="135" y="205" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2021</text>
  <text x="205" y="205" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="260" y="205" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 保留</text>
  <line x1="90" y1="192" x2="90" y2="210" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="192" x2="170" y2="210" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- arrow to result -->
  <path d="M135 218 L135 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="155" y="232" font-size="8" fill="#d6a040" font-weight="bold">过滤</text>

  <!-- ===== Middle: two filters ===== -->
  <rect x="20" y="244" width="110" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="262" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">条件①</text>
  <text x="75" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">year=2021</text>

  <rect x="140" y="244" width="110" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="262" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">条件②</text>
  <text x="195" y="280" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">revenue&gt;0</text>

  <!-- arrow to result -->
  <path d="M135 300 L135 322" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="155" y="314" font-size="8" fill="#b85450" font-weight="bold">AND</text>

  <!-- ===== Bottom-left: result ===== -->
  <rect x="20" y="326" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">两条件同时满足的客户</text>
  <text x="135" y="370" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">customer_id = {1, 4}</text>

  <!-- ===== Right: SQL snippet ===== -->
  <rect x="290" y="60" width="290" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SQL 核心逻辑</text>
  <line x1="305" y1="86" x2="565" y2="86" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="104" font-size="9.5" fill="#4a7a3a" font-family="monospace">SELECT customer_id</text>
  <text x="305" y="120" font-size="9.5" fill="#4a7a3a" font-family="monospace">FROM Customers</text>
  <text x="305" y="136" font-size="9.5" fill="#d6a040" font-family="monospace">WHERE year = 2021</text>
  <text x="305" y="152" font-size="9.5" fill="#b85450" font-family="monospace">  AND revenue &gt; 0;</text>
  <text x="305" y="170" font-size="8.5" fill="#888">↑ 两个谓词用 AND 连接，缺一不可</text>

  <!-- ===== Right: key insights ===== -->
  <rect x="290" y="190" width="290" height="166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察</text>

  <text x="305" y="230" font-size="9.5" fill="#333">• <tspan fill="#446688" font-weight="bold">复合主键 (customer_id, year)</tspan></text>
  <text x="305" y="246" font-size="9.5" fill="#333">  同一客户每年最多一行，无需去重</text>
  <text x="305" y="264" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">绿色行</tspan>：year=2021 且 revenue&gt;0 → 保留</text>
  <text x="305" y="280" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">红色行</tspan>：year=2021 但 revenue≤0 → 排除</text>
  <text x="305" y="296" font-size="9.5" fill="#333">• <tspan fill="#888">灰色行</tspan>：year≠2021 → 排除（不看收入）</text>
  <text x="305" y="314" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">AND 短路</tspan>：year≠2021 的行不再判 revenue</text>
  <text x="305" y="332" font-size="9.5" fill="#333">• 收入为 <tspan fill="#b85450" font-weight="bold">0</tspan> 也不算正收入（严格 &gt; 0）</text>
  <text x="305" y="350" font-size="9.5" fill="#333">• 客户 3 无 2021 记录 → 自然不在结果中</text>

  <!-- SQL snippet at bottom -->
  <rect x="20" y="392" width="560" height="40" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="410" font-size="9.5" fill="#446688" font-family="monospace">SELECT customer_id FROM Customers WHERE year = 2021 AND revenue &gt; 0;</text>
  <text x="35" y="425" font-size="8.5" fill="#888">一行 WHERE 双条件过滤 — SQL 最基础的行级筛选骨架</text>
</svg>
