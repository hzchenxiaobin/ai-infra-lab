<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：定长窗口滑动 + 频率哈希表</text>

  <!-- ===== Window i=0 : [1,2,3] ===== -->
  <text x="40" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 i=0：nums[0..2] = [1, 2, 3]</text>

  <!-- array cells, 7 cells width 42 starting x=40 -->
  <g filter="url(#rough2)">
    <!-- window highlight 0..2 -->
    <rect x="36" y="74" width="134" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4"/>
    <!-- cells -->
    <rect x="40" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="61" y="99" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="84" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="105" y="99" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="128" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="149" y="99" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="172" y="78" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="193" y="99" text-anchor="middle" font-size="13" fill="#999">2</text>
    <rect x="216" y="78" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="237" y="99" text-anchor="middle" font-size="13" fill="#999">2</text>
    <rect x="260" y="78" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="281" y="99" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="304" y="78" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="325" y="99" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="61" y="126" text-anchor="middle" font-size="8.5" fill="#888">0</text>
    <text x="105" y="126" text-anchor="middle" font-size="8.5" fill="#888">1</text>
    <text x="149" y="126" text-anchor="middle" font-size="8.5" fill="#888">2</text>
    <text x="193" y="126" text-anchor="middle" font-size="8.5" fill="#ccc">3</text>
    <text x="237" y="126" text-anchor="middle" font-size="8.5" fill="#ccc">4</text>
    <text x="281" y="126" text-anchor="middle" font-size="8.5" fill="#ccc">5</text>
    <text x="325" y="126" text-anchor="middle" font-size="8.5" fill="#ccc">6</text>
  </g>

  <!-- freq map box for i=0 -->
  <g filter="url(#rough2)">
    <rect x="380" y="74" width="220" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" fill-opacity="0.35"/>
    <text x="490" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">频率哈希表 freq</text>
    <text x="410" y="112" font-size="11" fill="#333">1 → 1</text>
    <text x="410" y="128" font-size="11" fill="#333">2 → 1</text>
    <text x="410" y="144" font-size="11" fill="#333">3 → 1</text>
    <rect x="510" y="100" width="78" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="549" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">|map| = 3</text>
    <text x="549" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ans[0] = 3</text>
  </g>

  <!-- ===== Slide arrow ===== -->
  <text x="320" y="178" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口整体右移 1：左端出窗 nums[0]=1，右端入窗 nums[3]=2</text>
  <path d="M150 190 L250 190" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">slide →</text>

  <!-- ===== Window i=1 : [2,3,2] ===== -->
  <text x="40" y="218" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 i=1：nums[1..3] = [2, 3, 2]</text>

  <g filter="url(#rough2)">
    <rect x="80" y="230" width="134" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4"/>
    <rect x="40" y="234" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="61" y="255" text-anchor="middle" font-size="13" fill="#999" text-decoration="line-through">1</text>
    <rect x="84" y="234" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="105" y="255" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="128" y="234" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="149" y="255" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="172" y="234" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="193" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="216" y="234" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="237" y="255" text-anchor="middle" font-size="13" fill="#999">2</text>
    <rect x="260" y="234" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="281" y="255" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="304" y="234" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="325" y="255" text-anchor="middle" font-size="13" fill="#999">3</text>
  </g>
  <!-- out/in labels -->
  <text x="61" y="284" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">出窗</text>
  <text x="193" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">入窗</text>

  <!-- freq map box for i=1 : remove 1 (delete), add 2 (2->2) -->
  <g filter="url(#rough2)">
    <rect x="380" y="230" width="220" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" fill-opacity="0.35"/>
    <text x="490" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">频率哈希表 freq（更新后）</text>
    <text x="410" y="268" font-size="11" fill="#999" text-decoration="line-through">1 → 0（删除）</text>
    <text x="410" y="284" font-size="11" fill="#333">2 → <tspan fill="#b85450" font-weight="bold">2</tspan></text>
    <text x="410" y="300" font-size="11" fill="#333">3 → 1</text>
    <rect x="510" y="256" width="78" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="549" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">|map| = 2</text>
    <text x="549" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ans[1] = 2</text>
  </g>

  <!-- update arrows: remove 1, add 2 -->
  <path d="M61 268 Q 200 300 405 268" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.8"/>
  <path d="M193 268 Q 300 250 405 284" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.8"/>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="334" width="560" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键：窗口每次只平移 1 格 → 只变动两个元素（一出一入）</text>
  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① 出窗元素 freq 减 1，若降为 0 则从表中删除该键</text>
  <text x="320" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 入窗元素 freq 加 1（不存在则插入为 1）</text>
  <text x="320" y="406" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 当前窗口的数字种类数 = 哈希表的大小 |map|</text>
  <text x="320" y="422" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每次窗口更新 O(1) → 总共 n−k+1 个窗口 → 整体 O(n)</text>
</svg>
