<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points=[[3,3],[5,-1],[-2,4],[1,1],[0,1]], k=3</text>

  <!-- ============ Round 1 ============ -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">第 1 轮：lo=0, hi=4, k=3, pivot = d²([3,3]) = 18</text>
  <text x="40" y="72" font-size="11" fill="#888">划分前（按 d² 标注）：</text>

  <!-- initial array row, x base 90, cells 70 wide -->
  <rect x="90" y="80" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[3,3]</text>
  <text x="125" y="112" text-anchor="middle" font-size="10" fill="#888">d²=18</text>

  <rect x="162" y="80" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="98" text-anchor="middle" font-size="11" fill="#333">[5,-1]</text>
  <text x="197" y="112" text-anchor="middle" font-size="10" fill="#888">d²=26</text>

  <rect x="234" y="80" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="98" text-anchor="middle" font-size="11" fill="#333">[-2,4]</text>
  <text x="269" y="112" text-anchor="middle" font-size="10" fill="#888">d²=20</text>

  <rect x="306" y="80" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="98" text-anchor="middle" font-size="11" fill="#333">[1,1]</text>
  <text x="341" y="112" text-anchor="middle" font-size="10" fill="#888">d²=2</text>

  <rect x="378" y="80" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="98" text-anchor="middle" font-size="11" fill="#333">[0,1]</text>
  <text x="413" y="112" text-anchor="middle" font-size="10" fill="#888">d²=1</text>

  <!-- down arrow -->
  <path d="M 280 124 L 280 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="134" font-size="10" fill="#888">i/j 收拢交换</text>

  <!-- after partition row -->
  <text x="40" y="156" font-size="11" fill="#888">划分后（[lo..j] ≤ pivot，[j+1..hi] ≥ pivot）：</text>

  <!-- left finalized cells (green) -->
  <rect x="90" y="164" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0,1]</text>
  <text x="125" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">d²=1 ✓</text>

  <rect x="162" y="164" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,1]</text>
  <text x="197" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">d²=2 ✓</text>

  <!-- right cells (pending, orange) -->
  <rect x="234" y="164" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="182" text-anchor="middle" font-size="11" fill="#333">[-2,4]</text>
  <text x="269" y="196" text-anchor="middle" font-size="10" fill="#888">d²=20</text>

  <rect x="306" y="164" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="182" text-anchor="middle" font-size="11" fill="#333">[5,-1]</text>
  <text x="341" y="196" text-anchor="middle" font-size="10" fill="#888">d²=26</text>

  <rect x="378" y="164" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="182" text-anchor="middle" font-size="11" fill="#333">[3,3]</text>
  <text x="413" y="196" text-anchor="middle" font-size="10" fill="#888">d²=18</text>

  <!-- j marker -->
  <text x="197" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ j=1</text>
  <text x="125" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">已定 2 个</text>

  <!-- decision box round1 -->
  <rect x="40" y="226" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#444">leftLen=2，k=3 &gt; 2 → 递归右半 [2..4]，k' = 3 − 2 = 1</text>

  <!-- ============ Round 2 ============ -->
  <text x="40" y="290" font-size="12" fill="#446688" font-weight="bold">第 2 轮：lo=2, hi=4, k=1, pivot = d²([-2,4]) = 20</text>

  <!-- subarray row (positions 2,3,4) -->
  <rect x="234" y="300" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[-2,4]</text>
  <text x="269" y="332" text-anchor="middle" font-size="10" fill="#888">d²=20</text>

  <rect x="306" y="300" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="318" text-anchor="middle" font-size="11" fill="#333">[5,-1]</text>
  <text x="341" y="332" text-anchor="middle" font-size="10" fill="#888">d²=26</text>

  <rect x="378" y="300" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="318" text-anchor="middle" font-size="11" fill="#333">[3,3]</text>
  <text x="413" y="332" text-anchor="middle" font-size="10" fill="#888">d²=18</text>

  <path d="M 340 344 L 340 358" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- after round2 partition -->
  <rect x="234" y="362" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[3,3]</text>
  <text x="269" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a">d²=18 ✓</text>

  <rect x="306" y="362" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="380" text-anchor="middle" font-size="11" fill="#333">[5,-1]</text>
  <text x="341" y="394" text-anchor="middle" font-size="10" fill="#888">d²=26</text>

  <rect x="378" y="362" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="380" text-anchor="middle" font-size="11" fill="#333">[-2,4]</text>
  <text x="413" y="394" text-anchor="middle" font-size="10" fill="#888">d²=20</text>

  <text x="269" y="412" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ j=2</text>

  <!-- decision box round2 -->
  <rect x="40" y="422" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">leftLen=1，k=1 == 1 → 完成！答案 = [[0,1],[1,1],[3,3]]</text>
</svg>
