<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行（奇数）末位保留 vs 4 行（偶数）全交换</text>

  <!-- ===== Example 1: 5 rows (odd) ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 1：n = 5（奇数）</text>
  <text x="120" y="68" text-anchor="middle" font-size="10" fill="#555">max_id = 5</text>

  <!-- header -->
  <rect x="40" y="78" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="85" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">MOD</text>
  <rect x="110" y="78" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="93" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">new_id</text>
  <rect x="190" y="78" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">student</text>

  <!-- rows -->
  <text x="55" y="116" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="85" y="116" text-anchor="middle" font-size="10" fill="#333">奇</text>
  <text x="145" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="230" y="116" text-anchor="middle" font-size="10" fill="#333">Abbot</text>

  <text x="55" y="136" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="85" y="136" text-anchor="middle" font-size="10" fill="#333">偶</text>
  <text x="145" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="230" y="136" text-anchor="middle" font-size="10" fill="#333">Doris</text>

  <text x="55" y="156" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="85" y="156" text-anchor="middle" font-size="10" fill="#333">奇</text>
  <text x="145" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#333">Emerson</text>

  <text x="55" y="176" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="85" y="176" text-anchor="middle" font-size="10" fill="#333">偶</text>
  <text x="145" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="230" y="176" text-anchor="middle" font-size="10" fill="#333">Green</text>

  <text x="55" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="85" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇末</text>
  <text x="145" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="230" y="196" text-anchor="middle" font-size="10" fill="#333">Jeames</text>

  <!-- result for ex1 -->
  <rect x="40" y="214" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ORDER BY new_id 后输出</text>
  <text x="155" y="248" text-anchor="middle" font-size="10" fill="#555">1:Doris 2:Abbot 3:Green 4:Emerson 5:Jeames</text>

  <!-- ===== Example 2: 4 rows (even) ===== -->
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 2：n = 4（偶数）</text>
  <text x="390" y="68" text-anchor="middle" font-size="10" fill="#555">max_id = 4</text>

  <rect x="310" y="78" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="355" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">MOD</text>
  <rect x="380" y="78" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="93" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">new_id</text>
  <rect x="460" y="78" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">student</text>

  <text x="325" y="116" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="355" y="116" text-anchor="middle" font-size="10" fill="#333">奇</text>
  <text x="415" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="500" y="116" text-anchor="middle" font-size="10" fill="#333">Abbot</text>

  <text x="325" y="136" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="355" y="136" text-anchor="middle" font-size="10" fill="#333">偶</text>
  <text x="415" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="500" y="136" text-anchor="middle" font-size="10" fill="#333">Doris</text>

  <text x="325" y="156" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="355" y="156" text-anchor="middle" font-size="10" fill="#333">奇</text>
  <text x="415" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="500" y="156" text-anchor="middle" font-size="10" fill="#333">Emerson</text>

  <text x="325" y="176" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="355" y="176" text-anchor="middle" font-size="10" fill="#333">偶</text>
  <text x="415" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="500" y="176" text-anchor="middle" font-size="10" fill="#333">Green</text>

  <rect x="310" y="194" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ORDER BY new_id 后输出</text>
  <text x="425" y="228" text-anchor="middle" font-size="10" fill="#555">1:Doris 2:Abbot 3:Green 4:Emerson</text>

  <!-- bottom insight -->
  <rect x="40" y="290" width="440" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键洞察：奇偶判定 + 末位兜底</text>
  <text x="55" y="334" font-size="11" fill="#555">• 奇数 id：默认 id+1，但若 id = max_id（末位奇数）则保留 id</text>
  <text x="55" y="354" font-size="11" fill="#555">• 偶数 id：一律 id−1（偶数永远有前驱，不会是末位）</text>
  <text x="55" y="374" font-size="11" fill="#b85450" font-weight="bold">• 末位兜底只需处理「奇数总数」情形：max_id 为奇 ⟹ 最后一人无下家</text>
  <text x="55" y="392" font-size="11" fill="#4a7a3a">• max_id 为偶 ⟹ 最后一对 (偶−1, 偶) 正常交换，无需兜底</text>
</svg>
