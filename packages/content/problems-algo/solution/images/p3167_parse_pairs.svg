<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：「字符 + 多位数」成对解析，频率累加进 26 个计数桶</text>

  <text x="36" y="54" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">compressed = "a3c9b2c1"</text>

  <!-- char boxes: letters blue, digits orange -->
  <rect x="36" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="49" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="64" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="77" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="92" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="120" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="133" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="148" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="176" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="204" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="232" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- pair frames -->
  <rect x="32" y="110" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="63" y="131" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(a, 3)</text>
  <rect x="88" y="110" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="119" y="131" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(c, 9)</text>
  <rect x="144" y="110" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(b, 2)</text>
  <rect x="200" y="110" width="62" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="231" y="131" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(c, 1)</text>

  <!-- i / j pointer sketch -->
  <text x="272" y="78" font-size="11" fill="#888" filter="url(#rough2)">← i 指字母</text>
  <text x="272" y="94" font-size="11" fill="#888" filter="url(#rough2)">← j 吃数字串</text>

  <!-- arrows into bucket panel -->
  <path d="M 63 144 C 63 168, 100 170, 120 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 119 144 C 119 166, 140 172, 152 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 175 144 C 175 168, 180 172, 186 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 231 144 C 231 170, 220 172, 214 184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bucket panel -->
  <rect x="36" y="186" width="230" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="151" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">26 个计数桶（字母即下标）</text>
  <text x="60" y="232" font-size="13" fill="#333" filter="url(#rough2)">cnt[a] = 3</text>
  <text x="60" y="252" font-size="13" fill="#333" filter="url(#rough2)">cnt[b] = 2</text>
  <text x="60" y="272" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[c] = 9 + 1 = 10</text>

  <!-- arrow to output -->
  <path d="M 266 234 C 290 234, 296 234, 312 234" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- output box -->
  <rect x="316" y="200" width="172" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="402" y="228" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"a3b2c10"</text>
  <text x="402" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">按 a..z 遍历桶，非零即拼「字母+总数」</text>

  <rect x="36" y="306" width="452" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">频率是多位数（1 ~ 10⁴，无前导 0）——必须内层循环 x = x×10 + d 逐位累积</text>

  <rect x="36" y="354" width="452" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="262" y="378" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入频率 ≤ 10⁴，但输出总数无此限制（如 c 的 10）——输出位数由总和决定</text>
</svg>
