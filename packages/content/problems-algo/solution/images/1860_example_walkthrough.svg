<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：memory1 = 8, memory2 = 11</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐秒贪心分配 → 第 6 秒两根都 &lt; 6 → 崩溃，返回 [6, 0, 4]</text>

  <!-- Header row: y=58..92 -->
  <rect x="60" y="58" width="70" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">秒 i</text>
  <rect x="130" y="58" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">较大者</text>
  <rect x="250" y="58" width="80" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">分配</text>
  <rect x="330" y="58" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mem1 余</text>
  <rect x="450" y="58" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="510" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mem2 余</text>

  <!-- Row 1: i=1, target=mem2, -1, mem1=8, mem2=10 (changed) -->
  <rect x="60" y="94" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="115" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="94" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">内存条 2</text>
  <rect x="250" y="94" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="115" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="330" y="94" width="120" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="115" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">8</text>
  <rect x="450" y="94" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="115" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- Row 2: i=2, target=mem2, -2, mem1=8, mem2=8 (changed) -->
  <rect x="60" y="128" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="128" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">内存条 2</text>
  <rect x="250" y="128" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="330" y="128" width="120" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="149" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">8</text>
  <rect x="450" y="128" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- Row 3: i=3, tie -> mem1, -3, mem1=5 (changed), mem2=8 -->
  <rect x="60" y="162" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="183" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="162" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="183" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">内存条 1·平手</text>
  <rect x="250" y="162" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="183" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="330" y="162" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="183" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="450" y="162" width="120" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="183" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">8</text>

  <!-- Row 4: i=4, target=mem2, -4, mem1=5, mem2=4 (changed) -->
  <rect x="60" y="196" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="217" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="196" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">内存条 2</text>
  <rect x="250" y="196" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="217" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−4</text>
  <rect x="330" y="196" width="120" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="217" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="450" y="196" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Row 5: i=5, target=mem1, -5, mem1=0 (changed), mem2=4 -->
  <rect x="60" y="230" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="251" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="130" y="230" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="251" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">内存条 1</text>
  <rect x="250" y="230" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="251" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5</text>
  <rect x="330" y="230" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="251" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="450" y="230" width="120" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="251" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- Row 6: i=6, crash, mem1=0, mem2=4 -->
  <rect x="60" y="264" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="130" y="264" width="120" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">崩溃</text>
  <rect x="250" y="264" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">—</text>
  <rect x="330" y="264" width="120" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="450" y="264" width="120" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="510" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- crash note: 4 < 6 -->
  <text x="510" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">max(0,4)=4 &lt; 6 → 崩溃</text>

  <!-- answer box -->
  <path d="M 320 332 L 320 322" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="200" y="334" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="356" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案：[6, 0, 4]</text>

  <!-- footer -->
  <text x="320" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿色 = 分给内存条 2；蓝色 = 分给内存条 1（含平手）；高亮列 = 本秒被扣除的内存条</text>
  <text x="320" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 3 秒 8 == 8 平手 → 取内存条 1；第 6 秒 max(0,4) &lt; 6 → 程序退出</text>
</svg>
