<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">四路分工：current 计数器协调四个线程</text>

  <!-- shared counter box -->
  <rect x="210" y="46" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#333">共享计数器 current</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 → 2 → ... → n</text>

  <!-- four thread boxes -->
  <rect x="20" y="116" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Thread A</text>
  <text x="80" y="154" text-anchor="middle" font-size="10" fill="#446688">number()</text>
  <text x="80" y="167" text-anchor="middle" font-size="9.5" fill="#888">i%3≠0 &amp; i%5≠0</text>

  <rect x="154" y="116" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="214" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Thread B</text>
  <text x="214" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a">fizz()</text>
  <text x="214" y="167" text-anchor="middle" font-size="9.5" fill="#888">i%3==0 &amp; i%5≠0</text>

  <rect x="288" y="116" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="348" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Thread C</text>
  <text x="348" y="154" text-anchor="middle" font-size="10" fill="#b85450">buzz()</text>
  <text x="348" y="167" text-anchor="middle" font-size="9.5" fill="#888">i%5==0 &amp; i%3≠0</text>

  <rect x="422" y="116" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="482" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Thread D</text>
  <text x="482" y="154" text-anchor="middle" font-size="10" fill="#d6a040">fizzbuzz()</text>
  <text x="482" y="167" text-anchor="middle" font-size="9.5" fill="#888">i%15==0</text>

  <!-- arrows from counter to each thread -->
  <path d="M 240 90 L 80 114" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 90 L 214 114" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 90 L 348 114" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 320 90 L 482 114" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- timeline title -->
  <text x="280" y="200" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">输出时间线（n = 15）</text>

  <!-- timeline boxes: 1 2 Fizz 4 Buzz Fizz 7 8 Fizz Buzz 11 Fizz 13 14 FizzBuzz -->
  <rect x="20" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="37" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <rect x="56" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <rect x="92" y="216" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Fizz</text>

  <rect x="132" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <rect x="168" y="216" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="237" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Buzz</text>

  <rect x="208" y="216" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Fizz</text>

  <rect x="248" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <rect x="284" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

  <rect x="320" y="216" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Fizz</text>

  <rect x="360" y="216" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="237" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Buzz</text>

  <rect x="400" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">11</text>

  <rect x="436" y="216" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Fizz</text>

  <rect x="476" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="493" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">13</text>

  <rect x="512" y="216" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="529" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">14</text>

  <rect x="20" y="254" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="275" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">FizzBuzz</text>

  <!-- explanation box -->
  <rect x="30" y="302" width="500" height="84" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">核心：每个线程用谓词等待自己的整除条件</text>
  <text x="48" y="342" font-size="10.5" fill="#333">• number 线程：wait( current%3≠0 &amp;&amp; current%5≠0 ) → 打印 current</text>
  <text x="48" y="360" font-size="10.5" fill="#333">• fizz 线程：wait( current%3==0 &amp;&amp; current%5≠0 ) → 打印 "Fizz"</text>
  <text x="48" y="375" font-size="10.5" fill="#333">• buzz / fizzbuzz 同理，各守一类整除条件，打印后 current++ 并 notify_all</text>
</svg>
