  <rect x="420" y="48" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输出累计</text>

