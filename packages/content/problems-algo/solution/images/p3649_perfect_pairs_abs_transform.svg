<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：|a±b| 只取决于绝对值</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">设 x = |a|，y = |b|，不妨 x ≤ y</text>

  <rect x="22" y="56" width="230" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="137" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">同号：a = 3, b = 2</text>
  <text x="137" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|a − b| = 1</text>
  <text x="137" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|a + b| = 5</text>

  <rect x="268" y="56" width="230" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="383" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">异号：a = 3, b = −2</text>
  <text x="383" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|a − b| = 5</text>
  <text x="383" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|a + b| = 1</text>

  <path d="M 248 100 L 272 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 274 118 L 250 118" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">同一对值!</text>

  <rect x="55" y="156" width="410" height="46" fill="#ffffff" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">无论同号异号，都有</text>
  <text x="260" y="194" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">{|a − b|, |a + b|} = {y − x, x + y}</text>

  <path d="M 155 202 L 155 216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 202 L 365 216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="218" width="200" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件① min 型</text>
  <text x="155" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y − x ≤ x  ⟹  y ≤ 2x</text>

  <rect x="265" y="218" width="200" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="365" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件② max 型</text>
  <text x="365" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x + y ≥ y  ⟹  恒成立 ✓</text>

  <path d="M 155 272 L 155 286" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 272 L 365 286" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="288" width="410" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">完美对  ⟺  y ≤ 2x</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">较大绝对值 ≤ 较小绝对值的 2 倍</text>
</svg>
