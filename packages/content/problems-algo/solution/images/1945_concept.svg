<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：拼接串的数位和 = 各段数位和之和</text>

  <!-- ===== String row ===== -->
  <text x="40" y="58" font-size="12" fill="#555" font-weight="bold">示例：s = "zbax"</text>

  <text x="40" y="84" font-size="11" fill="#888">字符串：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="100" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="120" y="90">z</text>
    <rect x="146" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="166" y="90">b</text>
    <rect x="192" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="212" y="90">a</text>
    <rect x="238" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="90">x</text>
  </g>

  <!-- arrows down -->
  <path d="M 120 104 L 120 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 166 104 L 166 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 212 104 L 212 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 258 104 L 258 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="310" y="118" font-size="10.5" fill="#888">字母表位置：a=1, b=2, …, z=26</text>

  <!-- ===== Value row ===== -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="100" y="128" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="120" y="146">26</text>
    <rect x="146" y="128" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="166" y="146">2</text>
    <rect x="192" y="128" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="212" y="146">1</text>
    <rect x="238" y="128" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="146">24</text>
  </g>

  <!-- ===== Diverge: two paths ===== -->
  <text x="40" y="178" font-size="11" fill="#888">求第一次数位和 R₁：</text>

  <!-- Left path: brute (concatenate) -->
  <rect x="30" y="188" width="240" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="208" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">暴力：先拼接成大数</text>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#555">"26"+"2"+"1"+"24" → "262124"</text>
  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#555">数位和：2+6+2+1+2+4</text>
  <rect x="90" y="258" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 17</text>

  <!-- Right path: optimized (per-letter digit sum) -->
  <rect x="290" y="188" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">优化：逐字母求数位和</text>
  <text x="410" y="228" text-anchor="middle" font-size="11" fill="#555">(2+6)+(2)+(1)+(2+4)</text>
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#555">= 8 + 2 + 1 + 6</text>
  <rect x="350" y="258" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 17 ✓</text>

  <!-- equality note -->
  <text x="280" y="248" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">=</text>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="304" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">数位和对拼接具有加法性：digit_sum(A⌢B) = digit_sum(A) + digit_sum(B)</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#555">故 R₁ = Σ digit_sum(val(c))，无需构造大整数</text>

  <!-- ===== Bound analysis ===== -->
  <rect x="40" y="356" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">规模上界：n ≤ 100，每字母数位和 ≤ 10（'s'=19 → 1+9）</text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#555">R₁ ≤ 100 × 10 = 1000，后续 k−1 轮数位和均为小数运算（≤ 4 位）</text>

  <!-- footer -->
  <text x="280" y="436" text-anchor="middle" font-size="10.5" fill="#888">k ≤ 10，每轮 O(log R) = O(1)，总复杂度 O(n + k)</text>
</svg>
