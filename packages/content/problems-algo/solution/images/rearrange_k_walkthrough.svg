<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：aabbcc, k=3 → abcabc</text>
  <path d="M 290 44 Q 450 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="450" y="72" text-anchor="middle" font-size="11.5" fill="#666">频次 a:2, b:2, c:2；逐格执行「释放→弹堆顶→入冷却」，6 格走完得 abcabc</text>

  <!-- ===== 顶部结果条 ===== -->
  <text x="80" y="104" font-size="12" font-weight="bold" fill="#2e6e2e">最终结果：</text>
  <g filter="url(#sk)">
    <g stroke="#4a7a3a" stroke-width="1.4">
      <rect x="160" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
      <rect x="202" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
      <rect x="244" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
      <rect x="286" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
      <rect x="328" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
      <rect x="370" y="88" width="40" height="32" rx="4" fill="#bfe0bf"/>
    </g>
  </g>
  <text x="180" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="222" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="264" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="306" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="348" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="390" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="180" y="138" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="222" y="138" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="264" y="138" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="306" y="138" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="348" y="138" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="390" y="138" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <!-- ===== 表头 ===== -->
  <g filter="url(#sk)"><rect x="40" y="152" width="820" height="30" rx="5" fill="#446688" stroke="#446688"/></g>
  <g font-size="12" font-weight="bold" fill="#fff">
    <text x="74" y="172" text-anchor="middle">i</text>
    <text x="170" y="172" text-anchor="middle">释放冷却</text>
    <text x="370" y="172" text-anchor="middle">就绪堆（按次数）</text>
    <text x="560" y="172" text-anchor="middle">取堆顶</text>
    <text x="740" y="172" text-anchor="middle">入冷却 (余,ch,解锁)</text>
  </g>

  <!-- ===== Row i=0 ===== -->
  <g filter="url(#sk)"><rect x="40" y="186" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
  <text x="170" y="213" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="370" y="207" text-anchor="middle" font-size="11.5" fill="#333">a:2  b:2  c:2</text>
  <text x="370" y="223" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=a</text>
  <g filter="url(#sk)"><rect x="535" y="196" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="740" y="213" text-anchor="middle" font-size="11.5" fill="#7a5415">(1, a, 3)</text>

  <!-- ===== Row i=1 ===== -->
  <g filter="url(#sk)"><rect x="40" y="234" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="170" y="261" text-anchor="middle" font-size="11.5" fill="#888">无（3>1）</text>
  <text x="370" y="255" text-anchor="middle" font-size="11.5" fill="#333">b:2  c:2</text>
  <text x="370" y="271" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=b</text>
  <g filter="url(#sk)"><rect x="535" y="244" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="740" y="261" text-anchor="middle" font-size="11.5" fill="#7a5415">(1, b, 4)</text>

  <!-- ===== Row i=2 ===== -->
  <g filter="url(#sk)"><rect x="40" y="282" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="170" y="309" text-anchor="middle" font-size="11.5" fill="#888">无（3>2）</text>
  <text x="370" y="303" text-anchor="middle" font-size="11.5" fill="#333">c:2</text>
  <text x="370" y="319" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=c</text>
  <g filter="url(#sk)"><rect x="535" y="292" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="740" y="309" text-anchor="middle" font-size="11.5" fill="#7a5415">(1, c, 5)</text>

  <!-- ===== Row i=3 ===== -->
  <g filter="url(#sk)"><rect x="40" y="330" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="170" y="357" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">a 解锁 (3≤3)</text>
  <text x="370" y="351" text-anchor="middle" font-size="11.5" fill="#333">a:1</text>
  <text x="370" y="367" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=a</text>
  <g filter="url(#sk)"><rect x="535" y="340" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="357" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="740" y="357" text-anchor="middle" font-size="11.5" fill="#888">余 0，不入</text>

  <!-- ===== Row i=4 ===== -->
  <g filter="url(#sk)"><rect x="40" y="378" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4</text>
  <text x="170" y="405" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">b 解锁 (4≤4)</text>
  <text x="370" y="399" text-anchor="middle" font-size="11.5" fill="#333">b:1</text>
  <text x="370" y="415" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=b</text>
  <g filter="url(#sk)"><rect x="535" y="388" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="740" y="405" text-anchor="middle" font-size="11.5" fill="#888">余 0，不入</text>

  <!-- ===== Row i=5 ===== -->
  <g filter="url(#sk)"><rect x="40" y="426" width="820" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="74" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="170" y="453" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">c 解锁 (5≤5)</text>
  <text x="370" y="447" text-anchor="middle" font-size="11.5" fill="#333">c:1</text>
  <text x="370" y="463" text-anchor="middle" font-size="10" fill="#b03a3a">堆顶=c</text>
  <g filter="url(#sk)"><rect x="535" y="436" width="50" height="26" rx="4" fill="#bfe0bf" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="560" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="740" y="453" text-anchor="middle" font-size="11.5" fill="#888">余 0，不入</text>

  <!-- ===== 底部说明 ===== -->
  <g filter="url(#sk)"><rect x="40" y="482" width="820" height="60" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="60" y="504" font-size="12" font-weight="bold" fill="#2b2b2b">观察</text>
  <text x="60" y="522" font-size="11.5" fill="#444">• a/b/c 在 i=0、1、2 各用一次后进冷却，分别于 i=3、4、5 解锁回归——刚好错开 k=3 格</text>
  <text x="60" y="538" font-size="11.5" fill="#444">• 每次解锁时堆里恰好只剩这一种字符，所以「释放→弹堆顶」无缝衔接，6 格零 idle</text>
</svg>
