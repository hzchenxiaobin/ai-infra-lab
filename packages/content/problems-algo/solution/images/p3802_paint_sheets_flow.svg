<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 516"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="516" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">临界点分段：段内 f 恒为常数，× 段长累加</text>

  <!-- 输入 -->
  <g filter="url(#rough2)">
    <rect x="225" y="34" width="110" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="55" text-anchor="middle" font-size="13" fill="#8a6d1a">输入 n, limit</text>
  </g>
  <path d="M 280 66 L 280 86" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收集临界点 -->
  <g filter="url(#rough2)">
    <rect x="110" y="90" width="340" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="110" text-anchor="middle" font-size="12.5" fill="#33506b">排序 limit；收集临界点</text>
    <text x="280" y="129" text-anchor="middle" font-size="11.5" fill="#33506b">C = {1, n−1} ∪ {L+1} ∪ {n−L}，只留 [1, n−1]</text>
  </g>
  <path d="M 280 142 L 280 162" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序去重 -->
  <g filter="url(#rough2)">
    <rect x="160" y="166" width="240" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="187" text-anchor="middle" font-size="12.5" fill="#33506b">排序去重：c₁ &lt; c₂ &lt; … &lt; c_K</text>
  </g>
  <path d="M 280 198 L 280 218" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体：取段求值 -->
  <g filter="url(#rough2)">
    <rect x="125" y="222" width="310" height="68" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="241" text-anchor="middle" font-size="11.5" fill="#8a6d1a">第 k 段 [lo, hi] = [cₖ, cₖ₊₁ − 1]（末段 hi = n−1）</text>
    <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#8a6d1a">A = num_ge(lo)，B = num_ge(n − lo)（二分）</text>
    <text x="280" y="278" text-anchor="middle" font-size="12" fill="#8a6d1a">f = (A·B − min(A, B)) mod p</text>
  </g>
  <g filter="url(#rough2)">
    <text x="498" y="241" text-anchor="middle" font-size="10.5" fill="#666">num_ge(t) =</text>
    <text x="498" y="256" text-anchor="middle" font-size="10.5" fill="#666">m − lower_bound</text>
    <text x="498" y="271" text-anchor="middle" font-size="10.5" fill="#666">(limit, t)</text>
  </g>
  <path d="M 280 290 L 280 310" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 累加 -->
  <g filter="url(#rough2)">
    <rect x="170" y="314" width="220" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="336" text-anchor="middle" font-size="12" fill="#8a6d1a">ans ← ans + f × (hi − lo + 1)</text>
  </g>
  <path d="M 280 348 L 280 368" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有下一段？ -->
  <g filter="url(#rough2)">
    <polygon points="280,368 375,406 280,444 185,406" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="411" text-anchor="middle" font-size="12.5" fill="#33506b">还有下一段？</text>
  </g>
  <path d="M 185 406 L 100 406 L 100 256 L 121 256" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="396" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 280 444 L 280 466" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="460" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="210" y="470" width="140" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="491" text-anchor="middle" font-size="13" fill="#2f5d24">返回 ans mod p</text>
  </g>
</svg>
