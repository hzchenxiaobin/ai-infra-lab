<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：阶段一预处理 fail + 阶段二流式匹配主循环</text>

  <!-- start -->
  <ellipse cx="260" cy="50" rx="36" ry="16" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 66 L 260 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 1 -->
  <rect x="125" y="80" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：预处理 fail 数组（pattern 自匹配，O(m)）</text>
  <path d="M 260 110 L 260 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- read next bit -->
  <rect x="125" y="124" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c ← stream.next()（i ← 当前读入下标）</text>
  <path d="M 260 154 L 260 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: mismatch? -->
  <polygon points="260,168 350,198 260,228 170,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &gt; 0 且 c ≠ pattern[j]？</text>
  <text x="356" y="190" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 198 L 386 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="386" y="184" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j ← fail[j−1]</text>
  <path d="M 438 184 C 440 156, 320 156, 288 170" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="242" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 228 L 260 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: match advance? -->
  <polygon points="260,244 350,274 260,304 170,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c == pattern[j]？</text>
  <text x="356" y="266" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 274 L 384 274" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="384" y="260" width="104" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="279" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">j ← j + 1</text>
  <path d="M 436 288 C 436 314, 330 314, 290 328" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="318" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 304 L 260 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 3: hit? -->
  <polygon points="260,324 345,352 260,380 175,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j == m ？</text>
  <text x="268" y="392" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 380 L 260 392" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="180" y="394" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="13" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">返回 i − m + 1</text>

  <!-- loop back: no hit, continue reading -->
  <text x="166" y="340" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 175 352 C 96 352, 96 139, 123 139" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="86" y="248" font-size="9.5" fill="#999" filter="url(#rough2)">继续</text>
  <text x="86" y="262" font-size="9.5" fill="#999" filter="url(#rough2)">读流</text>

  <!-- amortized note -->
  <rect x="352" y="394" width="152" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="428" y="407" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">摊还 O(1)/比特</text>
  <text x="428" y="421" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">总回退 ≤ 总前进 ≤ n</text>
</svg>
