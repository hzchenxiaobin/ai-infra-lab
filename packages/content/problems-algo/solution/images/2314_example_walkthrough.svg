<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="290" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三座城市的最高气温与"首日"</text>

  <!-- ===== Table ===== -->
  <!-- columns: city_id [20-90], degree序列 [90-250], MAX(degree) [250-330], 最高气温日期 [330-530], 首日 MIN(day) [530-740] -->
  <rect x="20" y="50" width="720" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">city_id</text>
  <text x="170" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">该城 degree 序列</text>
  <text x="290" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">MAX(degree)</text>
  <text x="430" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">出现最高气温的日期</text>
  <text x="635" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">首日 = MIN(day)</text>
  <line x1="90" y1="50" x2="90" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="50" x2="250" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="50" x2="330" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="50" x2="530" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row city 1 (green) -->
  <rect x="20" y="76" width="720" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="98" text-anchor="middle" font-size="9" fill="#333">-12, 5, 24</text>
  <text x="290" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">24</text>
  <text x="430" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a">2022-07-07</text>
  <text x="635" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2022-07-07</text>
  <line x1="90" y1="76" x2="90" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="76" x2="250" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="76" x2="330" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="76" x2="530" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row city 2 (orange) - the tie case -->
  <rect x="20" y="112" width="720" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="170" y="134" text-anchor="middle" font-size="9" fill="#333">37, 37</text>
  <text x="290" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">37</text>
  <text x="430" y="128" text-anchor="middle" font-size="9" fill="#d6a040">2022-08-07,</text>
  <text x="430" y="141" text-anchor="middle" font-size="9" fill="#d6a040">2022-08-17</text>
  <text x="635" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2022-08-07 ←</text>
  <line x1="90" y1="112" x2="90" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="112" x2="250" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="112" x2="330" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="112" x2="530" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row city 3 (red) - negative max -->
  <rect x="20" y="148" width="720" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="170" y="170" text-anchor="middle" font-size="9" fill="#333">-7, -6</text>
  <text x="290" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-6</text>
  <text x="430" y="170" text-anchor="middle" font-size="9" fill="#b85450">2022-12-07</text>
  <text x="635" y="170" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2022-12-07</text>
  <line x1="90" y1="148" x2="90" y2="184" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="148" x2="250" y2="184" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="148" x2="330" y2="184" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="148" x2="530" y2="184" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- output table -->
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出（按 city_id 升序）</text>
  <rect x="260" y="214" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="229" text-anchor="middle" font-size="9" fill="#333">city_id</text>
  <text x="420" y="229" text-anchor="middle" font-size="9" fill="#333">day</text>
  <line x1="340" y1="214" x2="340" y2="236" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="260" y="236" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="249" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="420" y="249" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2022-07-07</text>
  <rect x="260" y="254" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="267" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="420" y="267" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2022-08-07</text>
  <rect x="260" y="272" width="240" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="420" y="284" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2022-12-07</text>
</svg>
