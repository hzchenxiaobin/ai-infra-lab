<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abacaba" → 4 段</text>

  <!-- Table: columns: i | c | seen(前) | 动作 | 段 | ans -->
  <!-- header -->
  <rect x="20" y="40" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="80" y="58" font-size="11" fill="#446688" font-weight="bold">c</text>
  <text x="140" y="58" font-size="11" fill="#446688" font-weight="bold">seen(前)</text>
  <text x="260" y="58" font-size="11" fill="#446688" font-weight="bold">动作</text>
  <text x="390" y="58" font-size="11" fill="#446688" font-weight="bold">当前段</text>
  <text x="490" y="58" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- vertical separators -->
  <line x1="60" y1="40" x2="60" y2="330" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="40" x2="110" y2="330" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="40" x2="240" y2="330" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="40" x2="370" y2="330" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="40" x2="470" y2="330" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: i=0 c=a seen=∅ add seg=a ans=1 -->
  <rect x="20" y="68" width="520" height="28" fill="#fff" stroke="#e6e6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="86" font-size="11" fill="#333">0</text>
  <text x="80" y="86" font-size="11.5" fill="#333" font-weight="bold">a</text>
  <text x="140" y="86" font-size="11" fill="#888">∅</text>
  <text x="260" y="86" font-size="11" fill="#4a7a3a">add(a)</text>
  <text x="390" y="86" font-size="11" fill="#446688" font-weight="bold">"a"</text>
  <text x="490" y="86" font-size="11" fill="#333">1</text>

  <!-- row 1: i=1 c=b seen={a} add seg=ab ans=1 -->
  <rect x="20" y="96" width="520" height="28" fill="#fff" stroke="#e6e6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="114" font-size="11" fill="#333">1</text>
  <text x="80" y="114" font-size="11.5" fill="#333" font-weight="bold">b</text>
  <text x="140" y="114" font-size="11" fill="#888">{a}</text>
  <text x="260" y="114" font-size="11" fill="#4a7a3a">add(b)</text>
  <text x="390" y="114" font-size="11" fill="#446688" font-weight="bold">"ab"</text>
  <text x="490" y="114" font-size="11" fill="#333">1</text>

  <!-- row 2: i=2 c=a seen={a,b} CUT seg=ab✓|a ans=2 -->
  <rect x="20" y="124" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="142" font-size="11" fill="#333">2</text>
  <text x="80" y="142" font-size="11.5" fill="#b85450" font-weight="bold">a</text>
  <text x="140" y="142" font-size="11" fill="#888">{a,b}</text>
  <text x="260" y="142" font-size="11" fill="#b85450" font-weight="bold">重复→切！另起</text>
  <text x="390" y="142" font-size="11" fill="#446688" font-weight="bold">"ab"✓|"a"</text>
  <text x="490" y="142" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- row 3: i=3 c=c seen={a} add seg=ac ans=2 -->
  <rect x="20" y="152" width="520" height="28" fill="#fff" stroke="#e6e6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="170" font-size="11" fill="#333">3</text>
  <text x="80" y="170" font-size="11.5" fill="#333" font-weight="bold">c</text>
  <text x="140" y="170" font-size="11" fill="#888">{a}</text>
  <text x="260" y="170" font-size="11" fill="#4a7a3a">add(c)</text>
  <text x="390" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">"ac"</text>
  <text x="490" y="170" font-size="11" fill="#333">2</text>

  <!-- row 4: i=4 c=a seen={a,c} CUT seg=ac✓|a ans=3 -->
  <rect x="20" y="180" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="198" font-size="11" fill="#333">4</text>
  <text x="80" y="198" font-size="11.5" fill="#b85450" font-weight="bold">a</text>
  <text x="140" y="198" font-size="11" fill="#888">{a,c}</text>
  <text x="260" y="198" font-size="11" fill="#b85450" font-weight="bold">重复→切！另起</text>
  <text x="390" y="198" font-size="11" fill="#4a7a3a" font-weight="bold">"ac"✓|"a"</text>
  <text x="490" y="198" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- row 5: i=5 c=b seen={a} add seg=ab ans=3 -->
  <rect x="20" y="208" width="520" height="28" fill="#fff" stroke="#e6e6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="226" font-size="11" fill="#333">5</text>
  <text x="80" y="226" font-size="11.5" fill="#333" font-weight="bold">b</text>
  <text x="140" y="226" font-size="11" fill="#888">{a}</text>
  <text x="260" y="226" font-size="11" fill="#4a7a3a">add(b)</text>
  <text x="390" y="226" font-size="11" fill="#d6a040" font-weight="bold">"ab"</text>
  <text x="490" y="226" font-size="11" fill="#333">3</text>

  <!-- row 6: i=6 c=a seen={a,b} CUT seg=ab✓|a ans=4 -->
  <rect x="20" y="236" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="254" font-size="11" fill="#333">6</text>
  <text x="80" y="254" font-size="11.5" fill="#b85450" font-weight="bold">a</text>
  <text x="140" y="254" font-size="11" fill="#888">{a,b}</text>
  <text x="260" y="254" font-size="11" fill="#b85450" font-weight="bold">重复→切！另起</text>
  <text x="390" y="254" font-size="11" fill="#d6a040" font-weight="bold">"ab"✓|"a"</text>
  <text x="490" y="254" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <!-- outer border bottom -->
  <rect x="20" y="40" width="520" height="224" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="110" y="290" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">结果："ab" | "ac" | "ab" | "a" = 4 段</text>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#888">切点均由「重复字符 a」逼出：i=2 复 i=0；i=4 复 i=2；i=6 复 i=4</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">每段恰好包含「到下一个重复为止」的全部字符 → 段数最少</text>
</svg>
