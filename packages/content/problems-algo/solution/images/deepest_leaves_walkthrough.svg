<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2,3,4,5,null,6,7,null,null,null,null,8]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">4 轮 while = 4 层，每层 sum 重置，最后一层 sum=15 即答案</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#b85450" font-weight="bold">轮 1（深度0）：queue=[1], size=1</text>
  <g font-size="10">
    <rect x="30" y="84" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="78" y="100" font-size="9" fill="#888">→ 出队 1，入队 2, 3</text>
    <text x="250" y="100" font-size="9" fill="#333">sum: 0 →</text>
    <rect x="295" y="86" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="312" y="101" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
    <rect x="345" y="84" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="380" y="101" text-anchor="middle" font-size="9" fill="#b85450">ans=1</text>
    <text x="425" y="100" font-size="8" fill="#888">（暂存）</text>
  </g>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="130" font-size="11" fill="#446688" font-weight="bold">轮 2（深度1）：queue=[2,3], size=2</text>
  <g font-size="10">
    <rect x="30" y="140" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="46" y="156" text-anchor="middle" fill="#446688" font-size="9">2</text>
    <rect x="64" y="140" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="80" y="156" text-anchor="middle" fill="#446688" font-size="9">3</text>
    <text x="106" y="156" font-size="9" fill="#888">→ 出队 2（入4,5）、出队 3（入6）</text>
    <text x="270" y="156" font-size="9" fill="#333">sum: 0 → 2 →</text>
    <rect x="335" y="142" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="352" y="157" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">5</text>
    <rect x="380" y="140" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="415" y="157" text-anchor="middle" font-size="9" fill="#446688">ans=5</text>
    <text x="460" y="156" font-size="8" fill="#888">（覆盖）</text>
  </g>

  <!-- ===== Round 3 ===== -->
  <text x="30" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">轮 3（深度2）：queue=[4,5,6], size=3</text>
  <g font-size="10">
    <rect x="30" y="196" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="45" y="212" text-anchor="middle" fill="#4a7a3a" font-size="9">4</text>
    <rect x="62" y="196" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="77" y="212" text-anchor="middle" fill="#4a7a3a" font-size="9">5</text>
    <rect x="94" y="196" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="109" y="212" text-anchor="middle" fill="#4a7a3a" font-size="9">6</text>
    <text x="132" y="212" font-size="9" fill="#888">→ 出队 4（入7）、5（无）、6（入8）</text>
    <text x="320" y="212" font-size="9" fill="#333">sum: 0 → 4 → 9 →</text>
    <rect x="408" y="198" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="425" y="213" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">15</text>
    <text x="450" y="212" font-size="8" fill="#888">（覆盖）</text>
  </g>

  <!-- ===== Round 4 ===== -->
  <text x="30" y="242" font-size="11" fill="#d6a040" font-weight="bold">轮 4（深度3）：queue=[7,8], size=2</text>
  <g font-size="10">
    <rect x="30" y="252" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="46" y="268" text-anchor="middle" fill="#b85450" font-size="9">7</text>
    <rect x="64" y="252" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="80" y="268" text-anchor="middle" fill="#b85450" font-size="9">8</text>
    <text x="106" y="268" font-size="9" fill="#888">→ 出队 7、8（均无子节点）</text>
    <text x="280" y="268" font-size="9" fill="#333">sum: 0 → 7 →</text>
    <rect x="345" y="254" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="362" y="269" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">15</text>
    <rect x="390" y="252" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="435" y="269" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">ans=15 ✓</text>
  </g>

  <!-- ===== Round 5: end ===== -->
  <text x="30" y="298" font-size="11" fill="#888" font-weight="bold">轮 5：queue=[]，while 结束</text>
  <rect x="30" y="306" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="320" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="80" y="320" font-size="9" fill="#888">→ 退出 while，返回 sum = 15</text>

  <!-- ===== key insight ===== -->
  <line x1="20" y1="346" x2="520" y2="346" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="362" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：每层开始 sum 归零，循环结束时 sum 恰为最后一层之和</text>
  <text x="270" y="400" text-anchor="middle" font-size="10" fill="#555">无需事先知道最大深度——BFS 天然按层推进，最后一层自动“覆盖”前面的 sum</text>

  <rect x="30" y="416" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">对照 DFS：需显式记录 maxDepth，遇更深节点才重置 sum</text>
  <text x="270" y="454" text-anchor="middle" font-size="10" fill="#555">BFS 的“逐层覆盖”省去了 maxDepth 的维护，写法更短</text>
</svg>
