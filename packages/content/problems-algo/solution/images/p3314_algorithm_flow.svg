<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：每个 y 只需常数次位运算</text>
  <text x="310" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">O(n) 一遍扫完——正是 3315（nums[i] ≤ 10⁹ 版）所需要的复杂度</text>

  <!-- 开始 -->
  <rect x="185" y="56" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="77" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 nums，取出 y = nums[i]</text>
  <path d="M 310 90 L 310 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判偶菱形 -->
  <polygon points="310,112 440,160 310,208 180,160" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">y 是偶数？</text>
  <text x="310" y="172" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">（质数中即 y = 2）</text>

  <!-- 是 → -1 -->
  <path d="M 440 160 L 486 160" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="152" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="492" y="138" width="104" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="544" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans[i] = −1</text>
  <text x="544" y="173" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">末尾 0 个 1</text>
  <text x="544" y="196" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">无位可清</text>

  <!-- 否 -->
  <path d="M 310 208 L 310 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（奇数）</text>

  <!-- 求 lowbit -->
  <rect x="170" y="232" width="280" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="250" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">low = (y+1) &amp; −(y+1)</text>
  <text x="310" y="268" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">low = 2^t，t 是末尾连续 1 的个数</text>
  <path d="M 310 276 L 310 296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 清位 -->
  <rect x="140" y="300" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">ans[i] = y − (low &gt;&gt; 1)</text>
  <text x="310" y="340" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">清掉「末尾连续 1」的最高一个</text>
  <path d="M 310 348 L 310 368" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 自检 -->
  <rect x="155" y="372" width="310" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">自检恒成立：ans[i] | (ans[i]+1) == y ✓</text>

  <text x="310" y="432" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">处理下一个 y —— 示例：11→9、13→12、31→15、2→−1</text>
</svg>
