<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按位分解：n 在每一位切成 high / cur / low 三段，按 cur 分情况计数</text>

  <!-- Number 2 0 1 3, position labels 千百十个, 4 boxes w=56 step=62 start x=160 y=58 -->
  <!-- 2 (thousands) -->
  <rect x="160" y="58" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="86" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <text x="188" y="118" text-anchor="middle" font-size="10" fill="#888">千位</text>
  <!-- 0 (hundreds) -->
  <rect x="222" y="58" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="86" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <text x="250" y="118" text-anchor="middle" font-size="10" fill="#888">百位</text>
  <!-- 1 (tens) highlighted -->
  <rect x="284" y="58" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="86" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <text x="312" y="118" text-anchor="middle" font-size="10" fill="#888">十位 (cur)</text>
  <!-- 3 (ones) -->
  <rect x="346" y="58" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="86" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>
  <text x="374" y="118" text-anchor="middle" font-size="10" fill="#888">个位</text>

  <!-- n=2013 label -->
  <text x="150" y="86" text-anchor="end" font-size="12" fill="#555">n = 2 0 1 3</text>

  <!-- Split brackets for tens position: high=[2 0], cur=[1], low=[3], factor=10 -->
  <!-- high bracket -->
  <path d="M 160 130 Q 160 138 168 138 L 270 138 Q 278 138 278 130" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">high = 20</text>
  <!-- cur bracket -->
  <path d="M 284 130 Q 284 140 290 140 L 316 140 Q 322 140 322 130" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cur=1</text>
  <!-- low bracket -->
  <path d="M 346 130 Q 346 138 354 138 L 388 138 Q 396 138 396 130" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">low = 3</text>
  <!-- factor label -->
  <text x="430" y="86" font-size="11" fill="#888">factor = 10¹ = 10</text>

  <!-- Three cases header -->
  <text x="310" y="182" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">按当前位 cur 的取值分三种情况（统计该位出现 1 的次数）</text>

  <!-- Case 1: cur == 0 -->
  <rect x="40" y="196" width="180" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur = 0</text>
  <text x="130" y="236" text-anchor="middle" font-size="13" fill="#333">high × factor</text>
  <text x="130" y="254" text-anchor="middle" font-size="10" fill="#888">高位取 0..high−1，各 factor 个</text>

  <!-- Case 2: cur == 1 -->
  <rect x="230" y="196" width="200" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">cur = 1  ← 本例</text>
  <text x="330" y="236" text-anchor="middle" font-size="13" fill="#333">high × factor + low + 1</text>
  <text x="330" y="254" text-anchor="middle" font-size="10" fill="#888">高位 0..high−1 各 factor 个</text>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="#888">+ 高位=high 时低位 0..low</text>

  <!-- Case 3: cur >= 2 -->
  <rect x="440" y="196" width="160" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cur ≥ 2</text>
  <text x="520" y="236" text-anchor="middle" font-size="13" fill="#333">(high + 1) × factor</text>
  <text x="520" y="254" text-anchor="middle" font-size="10" fill="#888">高位取 0..high，各 factor 个</text>

  <!-- Computation for tens position of n=2013 -->
  <rect x="40" y="284" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">本例（十位 cur=1）：20 × 10 + 3 + 1 = 204</text>
  <text x="320" y="322" text-anchor="middle" font-size="10" fill="#888">十位为 1 的数：2010, 2011, 2012, 2013 共 4 个？错——是高位 0..19 各 10 个 + 高位 20 时 0..3 共 204 个</text>

  <!-- All four positions summary for n=2013 -->
  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">n = 2013 四个位逐位累加：</text>
  <rect x="40" y="360" width="560" height="64" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#333">个位 cur=3 → (201+1)×1 = 202　|　十位 cur=1 → 20×10+3+1 = 204</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#333">百位 cur=0 → 2×100 = 200　|　千位 cur=2 → (0+1)×1000 = 1000</text>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合计 = 202 + 204 + 200 + 1000 = 1606 ✓</text>
</svg>
