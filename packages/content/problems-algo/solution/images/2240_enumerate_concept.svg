<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：固定钢笔数 x → 剩余钱整除 cost2 → 铅笔选法 = Y + 1</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">示例：total=20, cost1=10, cost2=5，合法 (x,y) 满足 10x+5y ≤ 20</text>

  <!-- ===== Left: 2D grid of (x,y) ===== -->
  <text x="180" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案网格（绿=合法）</text>

  <!-- column headers x=0,1,2 -->
  <text x="150" y="104" text-anchor="middle" font-size="11" fill="#555">x=0</text>
  <text x="210" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x=1</text>
  <text x="270" y="104" text-anchor="middle" font-size="11" fill="#555">x=2</text>

  <!-- row headers y=0..4 -->
  <text x="104" y="135" text-anchor="end" font-size="11" fill="#555">y=0</text>
  <text x="104" y="177" text-anchor="end" font-size="11" fill="#555">y=1</text>
  <text x="104" y="219" text-anchor="end" font-size="11" fill="#555">y=2</text>
  <text x="104" y="261" text-anchor="end" font-size="11" fill="#bbb">y=3</text>
  <text x="104" y="303" text-anchor="end" font-size="11" fill="#bbb">y=4</text>

  <!-- col x=0: all 5 valid -->
  <rect x="120" y="110" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="152" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="194" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="236" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="278" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- col x=1: y=0,1,2 valid; y=3,4 invalid -->
  <rect x="180" y="110" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="152" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="194" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="236" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="278" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- col x=2: only y=0 valid -->
  <rect x="240" y="110" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="152" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="194" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="236" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="278" width="60" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- highlight column x=1 -->
  <rect x="178" y="108" width="64" height="214" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" rx="5" filter="url(#rough2)"/>

  <!-- budget line through boundary edges: (150,320)->(210,236)->(270,152) -->
  <path d="M 150 322 L 210 236 L 270 152" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="300" y="156" font-size="10" fill="#d6a040" font-weight="bold">预算线</text>
  <text x="300" y="170" font-size="9" fill="#888">10x+5y=20</text>

  <!-- axis labels -->
  <text x="210" y="346" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">钢笔数 x →</text>
  <text x="86" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" transform="rotate(-90 86 200)">铅笔数 y ↓</text>

  <!-- column count annotations -->
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="210" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="392" text-anchor="middle" font-size="10" fill="#888">每列合法格数 = Y+1，合计 5+3+1=9</text>

  <!-- ===== Right: formula box ===== -->
  <rect x="360" y="110" width="222" height="232" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="471" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">固定 x 推 y 的公式</text>

  <text x="376" y="164" font-size="12" fill="#333">rem = total − x·cost1</text>
  <text x="376" y="186" font-size="12" fill="#333">Y = ⌊ rem / cost2 ⌋</text>
  <text x="376" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">该 x 的选法 = Y + 1</text>

  <line x1="376" y1="222" x2="566" y2="222" stroke="#446688" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="376" y="246" font-size="12" fill="#333">ans = Σ (Y_x + 1)</text>
  <text x="376" y="266" font-size="10" fill="#888">x = 0 … ⌊total/cost1⌋</text>

  <!-- swap note -->
  <rect x="372" y="282" width="198" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="471" y="302" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">优化：令 cost1 ≥ cost2</text>
  <text x="471" y="320" text-anchor="middle" font-size="10" fill="#888">外层枚举更贵的笔，迭代最少</text>

  <!-- arrow from highlight column to formula -->
  <path d="M 244 200 L 360 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="302" y="194" text-anchor="middle" font-size="10" fill="#b85450">x=1: rem=10</text>
  <text x="302" y="206" text-anchor="middle" font-size="10" fill="#b85450">Y=⌊10/5⌋=2 → 3</text>
</svg>
