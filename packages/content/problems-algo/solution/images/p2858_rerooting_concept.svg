<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">换根 DP 核心：根从 u 移到孩子 v，只有连接边 (u,v) 的代价在变</text>

  <!-- ================= 左：情况 A 原边 u→v ================= -->
  <text x="145" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">情况 A：原边 u → v（顺着旧根）</text>

  <line x1="93" y1="110" x2="163" y2="110" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="128" y="98" text-anchor="middle" font-size="11" fill="#446688">u→v</text>

  <circle cx="75" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="114" text-anchor="middle" font-size="12" fill="#333">u</text>
  <circle cx="185" cy="110" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="114" text-anchor="middle" font-size="12" fill="#333">v</text>

  <ellipse cx="185" cy="168" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="185" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">v 的子树</text>

  <text x="145" y="212" text-anchor="middle" font-size="11" fill="#446688">u 为根：u→v 顺方向 → 代价 0</text>
  <text x="145" y="232" text-anchor="middle" font-size="11" fill="#b85450">v 为根：v→u 逆方向 → 代价 1（反转）</text>

  <rect x="45" y="246" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[v] = ans[u] + 1</text>

  <!-- ================= 右：情况 B 原边 v→u ================= -->
  <text x="415" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">情况 B：原边 v → u（指着旧根）</text>

  <line x1="437" y1="110" x2="367" y2="110" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="402" y="98" text-anchor="middle" font-size="11" fill="#446688">v→u</text>

  <circle cx="345" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="114" text-anchor="middle" font-size="12" fill="#333">u</text>
  <circle cx="455" cy="110" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="114" text-anchor="middle" font-size="12" fill="#333">v</text>

  <ellipse cx="455" cy="168" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="455" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">v 的子树</text>

  <text x="415" y="212" text-anchor="middle" font-size="11" fill="#b85450">u 为根：u→v 逆方向 → 代价 1（反转）</text>
  <text x="415" y="232" text-anchor="middle" font-size="11" fill="#446688">v 为根：v→u 顺方向 → 代价 0</text>

  <rect x="315" y="246" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[v] = ans[u] − 1</text>

  <!-- 分隔虚线 -->
  <line x1="280" y1="52" x2="280" y2="288" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- 底部公式框 -->
  <rect x="40" y="300" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">换根只改一条边的角色：ans[v] = ans[u] − w(u→v) + w(v→u)</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#555">w(a→b)：从 a 走向 b 逆着原边记 1（须反转），顺着记 0</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">每条边只有两个方向，w(u→v) + w(v→u) = 1 ⟹ 每次换根恰好 ±1</text>
</svg>
