<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">亲密字符串：算法流程图</text>

  <!-- Start -->
  <rect x="140" y="44" width="120" height="28" fill="#f8f8f8" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 s, goal</text>
  <path d="M 200 72 L 200 86" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: length equal -->
  <rect x="120" y="86" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="112" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">len(s) == len(goal) ?</text>
  <text x="316" y="100" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 107 L 360 107" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="360" y="94" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <text x="210" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 200 128 L 200 146" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: s == goal -->
  <rect x="120" y="146" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">s == goal ?</text>
  <text x="296" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 167 L 320 167" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 200 188 L 200 206" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2b: has duplicate -->
  <rect x="320" y="146" width="170" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">存在重复字符 ?</text>
  <text x="350" y="202" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 188 L 360 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="210" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="229" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>
  <text x="478" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 450 188 L 500 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="440" y="210" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="500" y="229" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- P1: collect diffs -->
  <rect x="120" y="206" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="229" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">收集不同位置 diff[]</text>
  <path d="M 200 242 L 200 262" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: count == 2 -->
  <rect x="120" y="262" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="288" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">diff 数量 == 2 ?</text>
  <text x="316" y="276" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 283 L 360 283" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="360" y="270" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="289" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <text x="210" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 200 304 L 200 322" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D4: cross match -->
  <rect x="80" y="322" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s[d0] == goal[d1] 且</text>
  <text x="200" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s[d1] == goal[d0] ?</text>
  <text x="338" y="338" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 320 345 L 360 345" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="360" y="331" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <text x="210" y="382" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 200 368 L 200 388" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- final true -->
  <rect x="140" y="388" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="408" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <text x="300" y="438" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n)　空间 O(1)（除收集下标外）</text>
</svg>
