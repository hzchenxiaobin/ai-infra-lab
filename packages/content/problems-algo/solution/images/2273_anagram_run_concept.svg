<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：等价类（排序签名）相同的连续段折叠为首个</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">σ(w)=sorted(w)；相邻 σ 相同即互为字母异位词，整段只留第一个</text>

  <!-- ===== words row ===== -->
  <text x="26" y="86" font-size="10.5" fill="#666">words</text>
  <text x="92" y="74" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="172" y="74" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="252" y="74" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="332" y="74" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="412" y="74" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- run 1: abba / baba / bbaa (blue) -->
  <rect x="72" y="80" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">abba</text>
  <rect x="152" y="80" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">baba</text>
  <rect x="232" y="80" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bbaa</text>
  <!-- run 2: cd / cd (green) -->
  <rect x="312" y="80" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cd</text>
  <rect x="392" y="80" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cd</text>

  <!-- ===== signature row ===== -->
  <text x="26" y="140" font-size="10.5" fill="#666">σ(w)</text>
  <rect x="72" y="120" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="112" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aabb</text>
  <rect x="152" y="120" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="192" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aabb</text>
  <rect x="232" y="120" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="272" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">aabb</text>
  <rect x="312" y="120" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cd</text>
  <rect x="392" y="120" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="432" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cd</text>

  <!-- run braces -->
  <path d="M 72 150 Q 72 160 92 162 L 292 162 Q 312 160 312 150" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连续段 1：σ 全为 aabb</text>
  <path d="M 312 150 Q 312 160 332 162 L 472 162 Q 492 160 492 150" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连续段 2：σ 全为 cd</text>

  <!-- ===== collapse arrows: each run → its first element ===== -->
  <path d="M 192 188 L 192 208" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 402 188 L 402 208" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="208" y="204" font-size="9.5" fill="#b85450" font-weight="bold">折叠</text>
  <text x="418" y="204" font-size="9.5" fill="#b85450" font-weight="bold">折叠</text>

  <!-- ===== result row ===== -->
  <text x="26" y="240" font-size="10.5" fill="#666">结果</text>
  <rect x="112" y="218" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="152" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">abba</text>
  <rect x="352" y="218" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="392" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cd</text>
  <text x="152" y="262" text-anchor="middle" font-size="9" fill="#888">段 1 首个</text>
  <text x="392" y="262" text-anchor="middle" font-size="9" fill="#888">段 2 首个</text>

  <!-- ===== key insight box ===== -->
  <rect x="48" y="282" width="464" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：删除只发生在「相邻且 σ 相同」之间，不同 σ 的段永不合并</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666">→ 每个 σ 连续段独立折叠为首个，结果与操作顺序无关</text>

  <!-- footer link to 26 -->
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">同构于「删除有序数组重复项」(26)：把 26 的 key 由元素值换成 σ(w)</text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#888">res[-1] 即「上一个未被删除者」，逐个比较 σ 决定去留</text>
</svg>
