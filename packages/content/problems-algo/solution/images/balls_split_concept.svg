<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：把每种颜色的球拆分到两个盒子</text>

  <!-- Source balls row -->
  <text x="40" y="62" font-size="12" fill="#888">所有球:</text>
  <!-- color 0: 2 red balls -->
  <circle cx="100" cy="58" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="126" cy="58" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="88" text-anchor="middle" font-size="10" fill="#b85450">颜色0 ×2</text>
  <!-- color 1: 1 blue ball -->
  <circle cx="172" cy="58" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="88" text-anchor="middle" font-size="10" fill="#446688">颜色1 ×1</text>
  <!-- color 2: 1 green ball -->
  <circle cx="218" cy="58" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a">颜色2 ×1</text>

  <!-- Split arrows -->
  <text x="270" y="62" text-anchor="middle" font-size="11" fill="#d6a040">↓ 每种颜色拆分 aᵢ / (balls[i]−aᵢ)</text>

  <!-- Box 1 -->
  <rect x="50" y="120" width="200" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">盒子 1 (n 个球)</text>
  <!-- a0=1 red, a1=1 blue, a2=0 green -->
  <circle cx="90" cy="170" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="120" cy="170" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#666">a = (1, 1, 0)</text>
  <text x="150" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">颜色数 = 2</text>

  <!-- Box 2 -->
  <rect x="290" y="120" width="200" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">盒子 2 (n 个球)</text>
  <!-- 1 red, 0 blue, 1 green -->
  <circle cx="330" cy="170" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="360" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#666">剩余 = (1, 0, 1)</text>
  <text x="390" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">颜色数 = 2</text>

  <!-- equal check -->
  <path d="M 250 175 L 290 175" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">=</text>

  <!-- ways formula box -->
  <rect x="50" y="252" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">该拆分对应的排列数 = ∏ C(balls[i], aᵢ)</text>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#666">本例 = C(2,1) × C(1,1) × C(1,0) = 2 × 1 × 1 = 2</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#888">颜色数相同(2=2) → 计入 favorable</text>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#888">概率 = favorable / total</text>
</svg>
