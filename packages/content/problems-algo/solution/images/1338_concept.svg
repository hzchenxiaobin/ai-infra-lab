<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：统计频率 → 降序排序 → 贪心选最大的</text>

  <!-- 原数组 -->
  <text x="40" y="58" font-size="12" fill="#666" font-weight="bold">原数组 arr（n = 10，目标 ≥ n/2 = 5）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="57" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="74" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="91" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="108" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="125" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="142" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="159" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="176" y="66" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="193" y="86" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="210" y="66" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="227" y="86" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="244" y="66" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="261" y="86" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="278" y="66" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="295" y="86" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="312" y="66" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="329" y="86" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="346" y="66" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="363" y="86" text-anchor="middle" font-size="12" fill="#333">7</text>
  </g>

  <!-- arrow 原数组 → 频率统计 -->
  <path d="M210 100 L210 124" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="118" font-size="11" fill="#446688" font-weight="bold">① 哈希计数</text>

  <!-- 频率统计表 -->
  <text x="40" y="142" font-size="12" fill="#666" font-weight="bold">频率统计</text>
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="40" y="150" width="90" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="62" y="168" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">值</text>
    <rect x="130" y="150" width="90" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="175" y="168" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">出现次数</text>
    <!-- 行: 3 → 4 -->
    <rect x="40" y="176" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="85" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="130" y="176" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="175" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <!-- 行: 5 → 3 -->
    <rect x="40" y="202" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="85" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
    <rect x="130" y="202" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="175" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <!-- 行: 2 → 2 -->
    <rect x="40" y="228" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="85" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="130" y="228" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="175" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <!-- 行: 7 → 1 -->
    <rect x="40" y="254" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="85" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
    <rect x="130" y="254" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="175" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- arrow 频率 → 排序后柱状图 -->
  <path d="M225 210 L300 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="262" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 降序</text>

  <!-- 排序后柱状图 + 贪心累加 -->
  <text x="300" y="142" font-size="12" fill="#666" font-weight="bold">按频率降序排列 + 贪心累加</text>
  <!-- 基线 -->
  <line x1="300" y1="280" x2="520" y2="280" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="294" y="284" text-anchor="end" font-size="10" fill="#888">0</text>
  <!-- 目标线 n/2 = 5 -->
  <line x1="300" y1="232" x2="520" y2="232" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="524" y="236" font-size="10" fill="#b85450" font-weight="bold">≥5</text>

  <!-- 柱1: freq=4 (值3) 高48 -->
  <rect x="312" y="232" width="34" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="329" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="329" y="296" text-anchor="middle" font-size="10" fill="#666">值3</text>

  <!-- 柱2: freq=3 (值5) 高36，选中 -->
  <rect x="356" y="244" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="373" y="296" text-anchor="middle" font-size="10" fill="#666">值5</text>

  <!-- 柱3: freq=2 (值2) 高24，未选 -->
  <rect x="400" y="256" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="417" y="250" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
  <text x="417" y="296" text-anchor="middle" font-size="10" fill="#aaa">值2</text>

  <!-- 柱4: freq=1 (值7) 高12，未选 -->
  <rect x="444" y="268" width="34" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="461" y="262" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="461" y="296" text-anchor="middle" font-size="10" fill="#aaa">值7</text>

  <!-- 累加标注 -->
  <text x="329" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">sum=4</text>
  <text x="329" y="330" text-anchor="middle" font-size="10" fill="#b85450">&lt;5 继续</text>
  <text x="373" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sum=7</text>
  <text x="373" y="330" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">≥5 ✓</text>

  <!-- 答案框 -->
  <rect x="350" y="350" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="373" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 2</text>

  <!-- 贪心说明 -->
  <path d="M373 338 L400 350" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="11" fill="#555" font-weight="bold">③ 贪心：每次选当前最大频率</text>
  <text x="40" y="336" font-size="11" fill="#555">累加到 ≥ n/2 即停，集合最小</text>
</svg>
