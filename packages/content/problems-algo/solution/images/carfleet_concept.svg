<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">车队核心：将 (位置, 速度) 转为到终点时间，按时间单调性统计车队</text>

  <!-- ===== Road section ===== -->
  <text x="40" y="56" font-size="12" fill="#888">道路（target = 12）:</text>

  <!-- Road line -->
  <line x1="80" y1="110" x2="480" y2="110" stroke="#aaa" stroke-width="2" filter="url(#rough2)"/>

  <!-- Target flag -->
  <line x1="480" y1="78" x2="480" y2="110" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">终点</text>
  <text x="480" y="126" text-anchor="middle" font-size="10" fill="#b85450">12</text>

  <!-- Start label -->
  <text x="80" y="126" text-anchor="middle" font-size="10" fill="#999">0</text>

  <!-- Cars at physical positions -->
  <!-- pos=0, spd=1 -->
  <rect x="62" y="88" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="103" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0,1</text>
  <text x="80" y="142" text-anchor="middle" font-size="10" fill="#d6a040">t=12</text>

  <!-- pos=3, spd=3 -->
  <rect x="162" y="88" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="103" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3,3</text>
  <text x="180" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">t=3</text>

  <!-- pos=5, spd=1 -->
  <rect x="229" y="88" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="103" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5,1</text>
  <text x="247" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">t=7</text>

  <!-- pos=8, spd=4 -->
  <rect x="329" y="88" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="103" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8,4</text>
  <text x="347" y="142" text-anchor="middle" font-size="10" fill="#446688">t=1</text>

  <!-- pos=10, spd=2 -->
  <rect x="395" y="88" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="103" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10,2</text>
  <text x="413" y="142" text-anchor="middle" font-size="10" fill="#446688">t=1</text>

  <!-- Formula -->
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#888">t = (target − pos) / speed</text>

  <!-- ===== Processing section ===== -->
  <text x="40" y="190" font-size="12" fill="#888">按位置降序遍历（离终点近的先处理）:</text>
  <path d="M 510 200 L 90 200" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Time boxes (processing order: pos desc) -->
  <!-- t(10)=1 -->
  <rect x="60" y="210" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t = 1.0</text>
  <text x="100" y="200" text-anchor="middle" font-size="9" fill="#999">pos=10</text>

  <!-- t(8)=1 -->
  <rect x="150" y="210" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t = 1.0</text>
  <text x="190" y="200" text-anchor="middle" font-size="9" fill="#999">pos=8</text>

  <!-- t(5)=7 -->
  <rect x="240" y="210" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t = 7.0</text>
  <text x="280" y="200" text-anchor="middle" font-size="9" fill="#999">pos=5</text>

  <!-- t(3)=3 -->
  <rect x="330" y="210" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t = 3.0</text>
  <text x="370" y="200" text-anchor="middle" font-size="9" fill="#999">pos=3</text>

  <!-- t(0)=12 -->
  <rect x="420" y="210" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t = 12</text>
  <text x="460" y="200" text-anchor="middle" font-size="9" fill="#999">pos=0</text>

  <!-- Action labels -->
  <text x="100" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 新车队</text>
  <text x="190" y="258" text-anchor="middle" font-size="10" fill="#888">并入</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 新车队</text>
  <text x="370" y="258" text-anchor="middle" font-size="10" fill="#888">并入</text>
  <text x="460" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 新车队</text>

  <!-- Fleet group boxes -->
  <rect x="55" y="272" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">车队 1（领队 t=1）</text>

  <rect x="235" y="272" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="325" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">车队 2（领队 t=7）</text>

  <rect x="415" y="272" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">车队 3（t=12）</text>

  <!-- ===== Key insight ===== -->
  <rect x="50" y="330" width="460" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键观察</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#444">遍历时维护 max_t = 当前领队（最慢）的到终点时间</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#444">t &gt; max_t → 新车队（后车更慢，追不上）；t ≤ max_t → 并入（追上了）</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">本质：统计时间序列中「严格大于前缀最大值」的个数</text>
</svg>
