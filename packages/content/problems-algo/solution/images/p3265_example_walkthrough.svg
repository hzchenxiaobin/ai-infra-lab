<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [3, 12, 30, 17, 21]</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">S(x) 只列关键变体，… 表示其余（每个 S 至多 1 + 21 个）</text>

  <!-- 表头 -->
  <rect x="32" y="46" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="46" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="46" width="228" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="46" width="136" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="46" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="46" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="78" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="210" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">S(x) 关键变体</text>
  <text x="392" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">命中 seen</text>
  <text x="482" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 0 -->
  <rect x="32" y="72" width="28" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="72" width="228" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="72" width="136" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="72" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="78" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="104" y="93" font-size="10" fill="#333" filter="url(#rough2)">3, 30, 300, 3000, …, 3000000</text>
  <text x="392" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="482" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <rect x="32" y="106" width="28" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="106" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="106" width="228" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="106" width="136" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="106" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="78" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12</text>
  <text x="104" y="127" font-size="10" fill="#333" filter="url(#rough2)">12, 21, 102, 120, 201, …</text>
  <text x="392" y="127" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="482" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 2（命中） -->
  <rect x="32" y="140" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="140" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="140" width="228" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="140" width="136" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="140" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="78" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">30</text>
  <text x="104" y="161" font-size="10" fill="#2f5d24" filter="url(#rough2)">30, 3, 300, 3000, …</text>
  <text x="392" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[3] = 1</text>
  <text x="482" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 3 -->
  <rect x="32" y="174" width="28" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="174" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="174" width="228" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="174" width="136" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="174" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="78" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">17</text>
  <text x="104" y="195" font-size="10" fill="#333" filter="url(#rough2)">17, 71, 107, 710, …</text>
  <text x="392" y="195" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="482" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 4（命中） -->
  <rect x="32" y="208" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="208" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="208" width="228" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="208" width="136" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="208" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="229" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="78" y="229" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">21</text>
  <text x="104" y="229" font-size="10" fill="#2f5d24" filter="url(#rough2)">21, 12, 120, 201, …</text>
  <text x="392" y="229" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[12] = 1</text>
  <text x="482" y="229" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 两种命中类型 -->
  <rect x="32" y="254" width="228" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="146" y="273" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">命中① 前导 0 型</text>
  <text x="146" y="292" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">S(30) ∋ 3：末两位「30」→「03」= 3</text>
  <rect x="268" y="254" width="236" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="273" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">命中② 纯换位型</text>
  <text x="386" y="292" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">S(21) ∋ 12：末两位「21」↔「12」</text>

  <!-- 结论 -->
  <rect x="32" y="316" width="472" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="268" y="337" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 2 ✓ 示例 2 全 1 数组：S 含自身，累计 0+1+2+3+4 = 10 ✓</text>
</svg>
