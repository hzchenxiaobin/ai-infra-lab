<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：heights = [2,1,1,2,1,2,2], V = 4, K = 3 → [2,2,2,3,2,2,2]</text>

  <!-- ============ Panel 1: drop 1 -> idx 2 ============ -->
  <rect x="10" y="38" width="260" height="215" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">第 1 滴</text>
  <text x="140" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左扫 → idx 2</text>
  <text x="140" y="84" text-anchor="middle" font-size="10" fill="#888">[2,1,2,2,1,2,2]</text>

  <!-- terrain -->
  <rect x="34" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="58" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="82" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="106" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water (new) at idx2 -->
  <rect x="82" y="187" width="24" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- index labels -->
  <text x="46" y="227" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="70" y="227" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="94" y="227" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="118" y="227" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="142" y="227" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="166" y="227" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="190" y="227" text-anchor="middle" font-size="9" fill="#888">6</text>

  <text x="118" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">K</text>
  <circle cx="118" cy="174" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 114 178 Q 104 172 96 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ============ Panel 2: drop 2 -> idx 1 ============ -->
  <rect x="280" y="38" width="260" height="215" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">第 2 滴</text>
  <text x="410" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左扫 → idx 1</text>
  <text x="410" y="84" text-anchor="middle" font-size="10" fill="#888">[2,2,2,2,1,2,2]</text>

  <rect x="314" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="338" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="362" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="201" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="434" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="458" y="187" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water old idx2 -->
  <rect x="362" y="187" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water new idx1 -->
  <rect x="338" y="187" width="24" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="326" y="227" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="350" y="227" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="374" y="227" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="398" y="227" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="422" y="227" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="446" y="227" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="470" y="227" text-anchor="middle" font-size="9" fill="#888">6</text>

  <text x="398" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">K</text>
  <circle cx="398" cy="174" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 394 178 Q 372 170 354 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ============ Panel 3: drop 3 -> idx 4 (right) ============ -->
  <rect x="10" y="263" width="260" height="215" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="279" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">第 3 滴</text>
  <text x="140" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左失败 → 右扫 → idx 4</text>
  <text x="140" y="309" text-anchor="middle" font-size="10" fill="#888">[2,2,2,2,2,2,2]</text>

  <rect x="34" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="58" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="82" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="106" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water old idx1, idx2 -->
  <rect x="58" y="412" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="82" y="412" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water new idx4 -->
  <rect x="130" y="412" width="24" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="46" y="452" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="70" y="452" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="94" y="452" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="118" y="452" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="142" y="452" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="166" y="452" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="190" y="452" text-anchor="middle" font-size="9" fill="#888">6</text>

  <text x="118" y="405" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">K</text>
  <circle cx="118" cy="399" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 122 403 Q 132 397 140 415" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Panel 4: drop 4 -> stay (rise) ============ -->
  <rect x="280" y="263" width="260" height="215" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="279" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">第 4 滴</text>
  <text x="410" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">左右皆失败 → 原地上升</text>
  <text x="410" y="309" text-anchor="middle" font-size="10" fill="#888">[2,2,2,3,2,2,2]</text>

  <rect x="314" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="338" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="362" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="426" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="434" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="458" y="412" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water old idx1, idx2, idx4 -->
  <rect x="338" y="412" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="362" y="412" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="412" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water new idx3 (rises above terrain) -->
  <rect x="386" y="398" width="24" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="326" y="452" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="350" y="452" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="374" y="452" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="398" y="452" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="422" y="452" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="446" y="452" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="470" y="452" text-anchor="middle" font-size="9" fill="#888">6</text>

  <text x="398" y="391" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">K↑</text>
  <circle cx="398" cy="380" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 398 386 L 398 396" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="150" y="486" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="495" font-size="10" fill="#666">地形</text>
  <rect x="220" y="486" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="495" font-size="10" fill="#666">已有水</text>
  <rect x="300" y="486" width="14" height="10" fill="#e8f0fe" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="495" font-size="10" fill="#666">本滴新增</text>
</svg>
