<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">run 计数：run[j] ≥ k ⇔ 以 j 结尾的窗口交替</text>

  <text x="70" y="96" font-size="11" fill="#555" filter="url(#rough2)">a = colors + colors[:k−1]，k = 3，n = 5</text>

  <!-- 递推框 -->
  <rect x="330" y="40" width="180" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">run[j] = run[j−1]+1（a[j]≠a[j−1]）</text>
  <text x="420" y="82" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">run[j] = 1（a[j]=a[j−1]，切断）</text>

  <!-- 链 a = [0,1,0,1,0,0,1]，7 块瓷砖 -->
  <rect x="70" y="112" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <rect x="126" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="182" y="112" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <rect x="238" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="294" y="112" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="316" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <rect x="350" y="112" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <rect x="406" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 下标标签 -->
  <text x="92" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="148" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="204" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="260" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="316" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=4</text>
  <text x="372" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=5</text>
  <text x="428" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=6</text>

  <!-- 阈值线 k = 3（基线 y=308，单位高 24 → 3×24=72 → y=236） -->
  <path d="M56,236 L464,236" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="60" y="228" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">k = 3</text>

  <!-- run 柱：1,2,3,4,5,1,2 -->
  <rect x="70" y="284" width="44" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="126" y="260" width="44" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="182" y="236" width="44" height="72" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="204" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <rect x="238" y="212" width="44" height="96" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <rect x="294" y="188" width="44" height="120" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="316" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <rect x="350" y="284" width="44" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="406" y="260" width="44" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 基线 -->
  <path d="M60,308 L460,308" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 底部注释 -->
  <text x="70" y="336" font-size="11" fill="#b85450" filter="url(#rough2)">j=5：a[5]=a[4]=0（接缝同色）→ run 归 1</text>
  <text x="490" y="336" text-anchor="end" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">run ≥ k 命中 3 次 → 答案 = 3</text>
</svg>
