<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：chalk = [3,4,1,2], k = 25</text>

  <!-- Step 1: total -->
  <rect x="30" y="42" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="12" fill="#333">① total = 3 + 4 + 1 + 2 =</text>
  <rect x="240" y="50" width="50" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <!-- Step 2: rem -->
  <rect x="30" y="92" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="116" font-size="12" fill="#333">② rem = 25 % 10 =</text>
  <rect x="200" y="100" width="50" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="270" y="116" font-size="11" fill="#888">（跳过 2 完整轮次，省 20 步模拟）</text>

  <!-- Step 3: linear scan header -->
  <text x="30" y="156" font-size="12" fill="#555" font-weight="bold">③ 最后一轮线性扫描：</text>

  <!-- Column headers -->
  <text x="60" y="178" text-anchor="middle" font-size="11" fill="#888">i</text>
  <text x="150" y="178" text-anchor="middle" font-size="11" fill="#888">chalk[i]</text>
  <text x="250" y="178" text-anchor="middle" font-size="11" fill="#888">进入时 rem</text>
  <text x="370" y="178" text-anchor="middle" font-size="11" fill="#888">判定</text>
  <text x="470" y="178" text-anchor="middle" font-size="11" fill="#888">结果</text>

  <!-- Divider -->
  <path d="M 30 184 L 510 184" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=0 -->
  <rect x="30" y="190" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="150" y="212" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="250" y="212" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="370" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">5 ≥ 3 → 扣</text>
  <text x="470" y="212" text-anchor="middle" font-size="12" fill="#333">rem=2</text>

  <!-- Row i=1 (answer) -->
  <rect x="30" y="228" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="250" y="250" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="370" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 &lt; 4 → 不足!</text>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 1 ⭐</text>

  <!-- Answer callout -->
  <path d="M 470 262 L 470 285" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="290" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 学生 1</text>
  <text x="435" y="326" text-anchor="middle" font-size="10" fill="#888">仅需 2 步线性扫描</text>

  <!-- Contrast box: brute force -->
  <rect x="30" y="290" width="290" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="308" text-anchor="middle" font-size="11" fill="#555">对比：暴力模拟需走 10 步</text>
  <text x="175" y="324" text-anchor="middle" font-size="10" fill="#888">k=10^9 时暴力需 ~10^9 步 → 超时</text>

  <!-- Footnote -->
  <text x="30" y="356" font-size="10" fill="#aaa">取余把 O(k) 模拟压缩为 O(n) 扫描，这是周期消耗问题的通用优化</text>
</svg>
