<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 x₁，每步 O(1) 区间计数</text>

  <rect x="140" y="36" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="190" y="55" text-anchor="middle" font-size="11" fill="#333">开始 (n, limit)</text>

  <path d="M 190 64 L 190 80" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="84" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="11" fill="#333">lo = max(0, n − 2·limit)</text>
  <text x="190" y="117" text-anchor="middle" font-size="11" fill="#333">hi = min(limit, n)</text>

  <path d="M 190 124 L 190 140" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="110" y="144" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="11" fill="#333">x₁ = lo，ans = 0</text>

  <path d="M 190 176 L 190 192" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="190,196 280,230 190,264 100,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="235" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x₁ ≤ hi ?</text>

  <path d="M 190 264 L 190 284" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="201" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="115" y="288" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="308" text-anchor="middle" font-size="11" fill="#333">m = n − x₁</text>

  <path d="M 190 320 L 190 336" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="340" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="356" text-anchor="middle" font-size="11" fill="#333">ans += min(limit, m)</text>
  <text x="190" y="373" text-anchor="middle" font-size="11" fill="#333">− max(0, m − limit) + 1</text>

  <path d="M 190 380 L 190 396" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="145" y="400" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="419" text-anchor="middle" font-size="11" fill="#333">x₁++</text>

  <path d="M 145 415 L 48 415 L 48 186 L 180 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 280 230 L 366 230" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="370" y="210" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="435" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <rect x="350" y="270" width="155" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="427" y="290" text-anchor="middle" font-size="10.5" fill="#333">n &gt; 3·limit 时</text>
  <text x="427" y="306" text-anchor="middle" font-size="10.5" fill="#333">lo &gt; hi，循环不执行</text>
  <text x="427" y="322" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">自动返回 0</text>

  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#888">循环 ≤ min(n, limit) + 1 次，每步 O(1) → 总时间 O(min(n, limit))</text>
</svg>
