<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：子查询首登 → LEFT JOIN 次日 → COUNT 比率 → ROUND</text>

  <!-- Step 1: subquery GROUP BY MIN -->
  <rect x="40" y="50" width="220" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 子查询：首登定位</text>
  <text x="150" y="88" text-anchor="middle" font-size="9.5" fill="#666">SELECT player_id,</text>
  <text x="150" y="100" text-anchor="middle" font-size="9.5" fill="#666">MIN(event_date) AS first_login</text>

  <!-- Step 2: LEFT JOIN DATE_ADD -->
  <rect x="320" y="50" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② LEFT JOIN 次日判定</text>
  <text x="430" y="88" text-anchor="middle" font-size="9.5" fill="#666">b.event_date = DATE_ADD(</text>
  <text x="430" y="100" text-anchor="middle" font-size="9.5" fill="#666">a.first_login, INTERVAL 1 DAY)</text>

  <path d="M260 80 L320 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: COUNT ratio -->
  <rect x="40" y="150" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ COUNT 比率统计</text>
  <text x="150" y="188" text-anchor="middle" font-size="9.5" fill="#666">COUNT(b.player_id)  ← 留存数</text>
  <text x="150" y="200" text-anchor="middle" font-size="9.5" fill="#666">/ COUNT(a.player_id) ← 总数</text>

  <!-- Step 4: ROUND -->
  <rect x="320" y="150" width="220" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ ROUND 四舍五入</text>
  <text x="430" y="190" text-anchor="middle" font-size="9.5" fill="#666">ROUND(比率, 2)</text>
  <text x="430" y="202" text-anchor="middle" font-size="9.5" fill="#666">AS fraction</text>

  <path d="M430 110 L430 130 L150 130 L150 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M260 180 L320 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- JOIN result detail box -->
  <rect x="30" y="235" width="520" height="210" fill="#fcfcf6" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="257" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">LEFT JOIN 后的中间结果（关键步骤 ② ③ 细节）</text>

  <text x="70" y="280" font-size="10" fill="#555" font-weight="bold">a（首登子查询）LEFT JOIN b（Activity 次日匹配）</text>
  <rect x="50" y="286" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="301" font-size="9" fill="#333">a.player_id</text>
  <text x="170" y="301" font-size="9" fill="#333">a.first_login</text>
  <text x="285" y="301" font-size="9" fill="#333">b.event_date(次日)</text>
  <text x="395" y="301" font-size="9" fill="#333">留存?</text>
  <line x1="150" y1="286" x2="150" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="286" x2="270" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="286" x2="380" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="310" width="400" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="325" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="210" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="325" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2016-03-02</text>
  <text x="410" y="325" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 留存</text>
  <line x1="150" y1="310" x2="150" y2="332" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="270" y1="310" x2="270" y2="332" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="380" y1="310" x2="380" y2="332" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="50" y="332" width="400" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="347" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="210" y="347" text-anchor="middle" font-size="9" fill="#333">2017-06-25</text>
  <text x="325" y="347" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">NULL</text>
  <text x="410" y="347" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 未留存</text>
  <line x1="150" y1="332" x2="150" y2="354" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="270" y1="332" x2="270" y2="354" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="380" y1="332" x2="380" y2="354" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="50" y="354" width="400" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="369" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="210" y="369" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <text x="325" y="369" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">NULL</text>
  <text x="410" y="369" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 未留存</text>
  <line x1="150" y1="354" x2="150" y2="376" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="270" y1="354" x2="270" y2="376" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="380" y1="354" x2="380" y2="376" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- ratio annotation -->
  <rect x="50" y="392" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">COUNT(b)=1</text>
  <text x="200" y="410" text-anchor="middle" font-size="11" fill="#888">÷</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">COUNT(a)=3</text>
  <text x="360" y="410" text-anchor="middle" font-size="11" fill="#888">=</text>
  <text x="420" y="410" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0.33</text>
  <text x="250" y="426" text-anchor="middle" font-size="9" fill="#666">非NULL计数 = 留存数；左表全计 = 总人数</text>
</svg>
