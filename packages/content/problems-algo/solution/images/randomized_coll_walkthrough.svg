<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#fdfcf7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：允许重复下双结构的演变</text>
  <path d="M 300 46 Q 450 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g font-size="11" fill="#888" font-weight="bold">
    <text x="80" y="84">操作</text>
    <text x="220" y="84">vals（数组，可重复）</text>
    <text x="600" y="84">idx（val → 下标集合）</text>
    <text x="840" y="84" text-anchor="end">返回</text>
  </g>
  <path d="M 60 92 L 850 92" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- Row 1: insert(1) -->
  <text x="80" y="118" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(1)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="106" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="240" y="123" text-anchor="middle" fill="#2b6e9e">1</text>
  </g>
  <text x="600" y="123" font-size="11.5" fill="#346">{1 : {0}}</text>
  <text x="840" y="123" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="400" y="123" font-size="10" fill="#888">尾插，下标 0 加入 idx[1]</text>

  <!-- Row 2: insert(3) -->
  <text x="80" y="156" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(3)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="144" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="240" y="161" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="260" y="144" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="280" y="161" text-anchor="middle" fill="#2b6e9e">3</text>
  </g>
  <text x="600" y="161" font-size="11.5" fill="#346">{1 : {0},  3 : {1}}</text>
  <text x="840" y="161" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="400" y="161" font-size="10" fill="#888">尾插，下标 1 加入 idx[3]</text>

  <!-- Row 3: insert(1) duplicate highlight -->
  <g filter="url(#sk)"><rect x="60" y="178" width="790" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="80" y="198" font-size="12.5" fill="#7a5415" font-weight="bold">insert(1)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="186" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="240" y="203" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="260" y="186" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="280" y="203" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="300" y="186" width="40" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="320" y="203" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
  </g>
  <text x="600" y="203" font-size="11.5" fill="#7a5415" font-weight="bold">{1 : {0, 2},  3 : {1}}</text>
  <text x="840" y="203" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="400" y="203" font-size="10" fill="#7a5415" font-weight="bold">← 重复允许！下标 2 加入 idx[1]</text>

  <!-- Row 4: insert(5) -->
  <text x="80" y="236" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(5)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="224" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="240" y="241" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="260" y="224" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="280" y="241" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="300" y="224" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="320" y="241" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="340" y="224" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="360" y="241" text-anchor="middle" fill="#2b6e9e">5</text>
  </g>
  <text x="600" y="241" font-size="11.5" fill="#346">{1 : {0,2},  3 : {1},  5 : {3}}</text>
  <text x="840" y="241" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="400" y="241" font-size="10" fill="#888">尾插，下标 3 加入 idx[5]</text>

  <!-- Row 5: remove(3) the highlight -->
  <g filter="url(#sk)"><rect x="60" y="258" width="790" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="80" y="288" font-size="12.5" fill="#7a5415" font-weight="bold">remove(3)</text>
  <!-- before -->
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="272" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="240" y="289" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="260" y="272" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="280" y="289" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="300" y="272" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="320" y="289" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="340" y="272" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="360" y="289" text-anchor="middle" fill="#2b6e9e">5</text>
  </g>
  <!-- arrow: last 5 -> pos 1 -->
  <path d="M 360 280 Q 372 302 288 288" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="384" y="298" font-size="9.5" fill="#7a5415">末尾5搬到下标1</text>
  <!-- after -->
  <text x="220" y="322" font-size="9.5" fill="#888">→ 结果:</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="270" y="310" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="290" y="327" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="310" y="310" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="330" y="327" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="350" y="310" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="370" y="327" text-anchor="middle" fill="#2e6e2e">1</text>
  </g>
  <text x="600" y="282" font-size="11" fill="#346">前: {1:{0,2}, 3:{1}, 5:{3}}</text>
  <text x="600" y="300" font-size="11" fill="#7a5415" font-weight="bold">后: {1:{0,2}, 5:{1}}</text>
  <text x="600" y="318" font-size="10" fill="#b03a3a">idx[3] 空 → 删键；idx[5] 从{3}改成{1}</text>
  <text x="840" y="300" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- Row 6: getRandom -->
  <g filter="url(#sk)"><rect x="60" y="344" width="790" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="80" y="372" font-size="12.5" fill="#2e6e2e" font-weight="bold">getRandom()</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="358" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="240" y="375" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="260" y="358" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="280" y="375" text-anchor="middle" fill="#2e6e2e">5</text>
    <g filter="url(#sk)"><rect x="300" y="358" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="320" y="375" text-anchor="middle" fill="#2e6e2e">1</text>
  </g>
  <text x="600" y="372" font-size="11" fill="#346">{1:{0,2}, 5:{1}}</text>
  <text x="600" y="390" font-size="11" fill="#2e6e2e" font-weight="bold">P(1)=2/3, P(5)=1/3</text>
  <text x="840" y="372" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">1 / 5</text>
  <text x="400" y="372" font-size="10" fill="#888">rand()%3 ∈ {0,1,2} → 各 1/3</text>
  <text x="400" y="390" font-size="10" fill="#2e6e2e">1 出现两次 → 概率 2/3</text>

  <!-- Row 7: remove(1) -->
  <g filter="url(#sk)"><rect x="60" y="412" width="790" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="80" y="442" font-size="12.5" fill="#7a5415" font-weight="bold">remove(1)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="220" y="426" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="240" y="443" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="260" y="426" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="280" y="443" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="300" y="426" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="320" y="443" text-anchor="middle" fill="#2b6e9e">1</text>
  </g>
  <text x="220" y="462" font-size="9.5" fill="#888">i 取 idx[1]={0,2} 中的 0</text>
  <text x="384" y="442" font-size="9.5" fill="#7a5415">末尾1搬到下标0</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="430" y="426" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="450" y="443" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="470" y="426" width="40" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="490" y="443" text-anchor="middle" fill="#2e6e2e">5</text>
  </g>
  <text x="600" y="442" font-size="11" fill="#346">前: {1:{0,2}, 5:{1}}</text>
  <text x="600" y="460" font-size="11" fill="#7a5415" font-weight="bold">后: {1:{0}, 5:{1}}</text>
  <text x="600" y="478" font-size="10" fill="#888">val==last(都=1)：idx[1]删2加0→净剩{0}</text>
  <text x="840" y="442" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="500" width="790" height="78" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">关键：重复值在下标集合中各占一席，remove 只摘一个</text>
  <text x="450" y="544" text-anchor="middle" font-size="11" fill="#542">vals 长度 == 所有 idx[v] 集合大小之和 == 元素总个数 → getRandom 天然按频次</text>
  <text x="450" y="562" text-anchor="middle" font-size="10.5" fill="#b03a3a">val==last 边界：先 idx[val].erase(i)，再处理搬运 → 顺序自洽</text>
  <text x="450" y="578" text-anchor="middle" font-size="10" fill="#888">insert O(1) · remove O(1) · getRandom O(1)</text>
</svg>
