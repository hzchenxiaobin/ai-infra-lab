<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：特殊子串 = 字母「全部出现」张成的最短区间</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">例：s = "abcdbaefab"（n = 10）</text>

  <!-- 主字符串格子 -->
  <g filter="url(#rough2)">
    <rect x="90"  y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="128" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="166" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="204" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="242" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="280" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="318" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="356" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="394" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="432" y="50" width="38" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <text x="109" y="72" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="147" y="72" text-anchor="middle" font-size="15" fill="#333">b</text>
    <text x="185" y="72" text-anchor="middle" font-size="15" fill="#333">c</text>
    <text x="223" y="72" text-anchor="middle" font-size="15" fill="#333">d</text>
    <text x="261" y="72" text-anchor="middle" font-size="15" fill="#333">b</text>
    <text x="299" y="72" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="337" y="72" text-anchor="middle" font-size="15" fill="#333">e</text>
    <text x="375" y="72" text-anchor="middle" font-size="15" fill="#333">f</text>
    <text x="413" y="72" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="451" y="72" text-anchor="middle" font-size="15" fill="#333">b</text>
    <!-- 下标 -->
    <text x="109" y="100" text-anchor="middle" font-size="8.5" fill="#999">0</text>
    <text x="147" y="100" text-anchor="middle" font-size="8.5" fill="#999">1</text>
    <text x="185" y="100" text-anchor="middle" font-size="8.5" fill="#999">2</text>
    <text x="223" y="100" text-anchor="middle" font-size="8.5" fill="#999">3</text>
    <text x="261" y="100" text-anchor="middle" font-size="8.5" fill="#999">4</text>
    <text x="299" y="100" text-anchor="middle" font-size="8.5" fill="#999">5</text>
    <text x="337" y="100" text-anchor="middle" font-size="8.5" fill="#999">6</text>
    <text x="375" y="100" text-anchor="middle" font-size="8.5" fill="#999">7</text>
    <text x="413" y="100" text-anchor="middle" font-size="8.5" fill="#999">8</text>
    <text x="451" y="100" text-anchor="middle" font-size="8.5" fill="#999">9</text>
  </g>

  <!-- 首现 / 末现标记行 -->
  <text x="80" y="122" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">首现 ▲</text>
  <g filter="url(#rough2)" fill="#4a7a3a" font-size="11">
    <text x="105" y="120" text-anchor="middle">▲</text>
    <text x="143" y="120" text-anchor="middle">▲</text>
    <text x="181" y="120" text-anchor="middle">▲</text>
    <text x="219" y="120" text-anchor="middle">▲</text>
    <text x="333" y="120" text-anchor="middle">▲</text>
    <text x="371" y="120" text-anchor="middle">▲</text>
  </g>
  <text x="80" y="137" text-anchor="end" font-size="9.5" fill="#d6a040" filter="url(#rough2)">末现 ●</text>
  <g filter="url(#rough2)" fill="#d6a040" font-size="10">
    <text x="181" y="135" text-anchor="middle">●</text>
    <text x="219" y="135" text-anchor="middle">●</text>
    <text x="333" y="135" text-anchor="middle">●</text>
    <text x="371" y="135" text-anchor="middle">●</text>
    <text x="409" y="135" text-anchor="middle">●</text>
    <text x="447" y="135" text-anchor="middle">●</text>
  </g>

  <!-- 案例 1：从 'c' 出发 -->
  <text x="42" y="166" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c='c'：[2,2] 内部只有 c，稳定</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="118" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="146" y="172" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="174" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="202" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="230" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="258" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="286" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="314" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="342" y="172" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <text x="104" y="189" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="132" y="189" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="160" y="189" text-anchor="middle" font-size="12" fill="#333">c</text>
    <text x="188" y="189" text-anchor="middle" font-size="12" fill="#333">d</text>
    <text x="216" y="189" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="244" y="189" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="272" y="189" text-anchor="middle" font-size="12" fill="#333">e</text>
    <text x="300" y="189" text-anchor="middle" font-size="12" fill="#333">f</text>
    <text x="328" y="189" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="356" y="189" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="385" y="186" font-size="11" fill="#2f5d24" font-weight="bold">最短区间 [2,2] ✓</text>
  </g>

  <!-- 案例 2：从 'a' 出发 -->
  <text x="42" y="216" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">c='a'：[0,8] 吸收末现 b(9) → [0,9]</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="118" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="146" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="174" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="202" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="230" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="258" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="286" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="314" y="222" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="342" y="222" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <text x="104" y="239" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="132" y="239" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="160" y="239" text-anchor="middle" font-size="12" fill="#333">c</text>
    <text x="188" y="239" text-anchor="middle" font-size="12" fill="#333">d</text>
    <text x="216" y="239" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="244" y="239" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="272" y="239" text-anchor="middle" font-size="12" fill="#333">e</text>
    <text x="300" y="239" text-anchor="middle" font-size="12" fill="#333">f</text>
    <text x="328" y="239" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="356" y="239" text-anchor="middle" font-size="12" fill="#333">b</text>
    <path d="M 314 210 L 342 210" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none"/>
    <text x="385" y="236" font-size="11" fill="#8f3a35" font-weight="bold">覆盖整串 → 排除 ✗</text>
  </g>

  <!-- 案例 3：从 'b' 出发 -->
  <text x="42" y="266" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">c='b'：扫到 s[5]='a'，首现[a]=0 &lt; l=1</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="272" width="28" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="3"/>
    <rect x="118" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="146" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="174" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="202" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="230" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3"/>
    <rect x="258" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="286" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="314" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="342" y="272" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="104" y="289" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="132" y="289" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="160" y="289" text-anchor="middle" font-size="12" fill="#333">c</text>
    <text x="188" y="289" text-anchor="middle" font-size="12" fill="#333">d</text>
    <text x="216" y="289" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="244" y="289" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold">a</text>
    <text x="272" y="289" text-anchor="middle" font-size="12" fill="#333">e</text>
    <text x="300" y="289" text-anchor="middle" font-size="12" fill="#333">f</text>
    <text x="328" y="289" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="356" y="289" text-anchor="middle" font-size="12" fill="#333">b</text>
    <path d="M 244 268 L 244 262 L 110 262 L 110 268" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" stroke-dasharray="3 2"/>
    <text x="385" y="286" font-size="11" fill="#8f3a35" font-weight="bold">左侧越界 → 作废 ✗</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="322" width="215" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="147" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">每个字母至多 1 个最短区间</text>
    <text x="147" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">候选区间 ≤ 26 个（互异左端点）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="272" y="322" width="215" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="379" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">按右端点排序，贪心选互不重叠</text>
    <text x="379" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">cnt ≥ k ⇒ 返回 true</text>
  </g>
</svg>
