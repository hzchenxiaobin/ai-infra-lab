<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例 1 演算：fire[i][j] 与人路径 → max wait = 3</text>

  <!-- ===== LEFT: 5x7 grid with fire times ===== -->
  <text x="130" y="48" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">网格 + 火势到达时间</text>

  <!-- Grid: 5 rows x 7 cols, cell=28px, origin (30, 58) -->
  <!-- Row 0: 0 2 0 0 0 0 0  → fire: 6 ▓ 4 3 2 1 2 -->
  <rect x="30" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6</text>
  <rect x="58" y="58" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="72" y="76" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="86" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="114" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="128" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <rect x="142" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="156" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <rect x="170" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="184" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="198" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="212" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>

  <!-- Row 1: 0 0 0 2 2 1 0 → fire: 5 4 3 ▓ ▓ 0 1 -->
  <rect x="30" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="104" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">5</text>
  <rect x="58" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="72" y="104" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="86" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="104" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <rect x="114" y="86" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="128" y="104" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="142" y="86" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="156" y="104" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="170" y="86" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="184" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
  <rect x="198" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="212" y="104" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>

  <!-- Row 2: 0 2 0 0 1 2 0 → fire: 6 ▓ 2 1 0 ▓ 2 -->
  <rect x="30" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6</text>
  <rect x="58" y="114" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="72" y="132" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="86" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <rect x="114" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="128" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="142" y="114" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="156" y="132" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
  <rect x="170" y="114" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="184" y="132" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="198" y="114" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="212" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>

  <!-- Row 3: 0 0 2 2 2 0 2 → fire: 7 8 ▓ ▓ ▓ 14 ▓ -->
  <rect x="30" y="142" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="160" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">7</text>
  <rect x="58" y="142" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="72" y="160" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">8</text>
  <rect x="86" y="142" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="160" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="114" y="142" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="128" y="160" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="142" y="142" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="156" y="160" text-anchor="middle" font-size="9" fill="#fff">▓</text>
  <rect x="170" y="142" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="184" y="160" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">14</text>
  <rect x="198" y="142" width="28" height="28" fill="#555" stroke="#333" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="212" y="160" text-anchor="middle" font-size="9" fill="#fff">▓</text>

  <!-- Row 4: 0 0 0 0 0 0 0 → fire: 8 9 10 11 12 13 14 -->
  <rect x="30" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="188" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">8</text>
  <rect x="58" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="72" y="188" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">9</text>
  <rect x="86" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="188" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">10</text>
  <rect x="114" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="128" y="188" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">11</text>
  <rect x="142" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="156" y="188" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">12</text>
  <rect x="170" y="170" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="184" y="188" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">13</text>
  <rect x="198" y="170" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="212" y="188" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">14</text>

  <!-- Person path: (0,0)→(1,0)→(2,0)→(3,0)→(3,1)→(4,1)→(4,2)→(4,3)→(4,4)→(4,5)→(4,6) -->
  <!-- Highlight path cells with blue outline -->
  <rect x="30" y="58" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="30" y="86" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="30" y="114" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="30" y="142" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="58" y="142" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="58" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="86" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="114" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="142" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="170" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <rect x="198" y="170" width="28" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>

  <!-- S and H labels -->
  <text x="44" y="54" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">S</text>
  <text x="212" y="206" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">H(安全屋)</text>

  <!-- Legend -->
  <rect x="30" y="216" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="45" y="225" font-size="8" fill="#666">火源</text>
  <rect x="70" y="216" width="10" height="10" fill="#555" stroke="#333" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="85" y="225" font-size="8" fill="#666">墙</text>
  <rect x="105" y="216" width="10" height="10" fill="none" stroke="#446688" stroke-width="2" rx="1" filter="url(#rough2)"/>
  <text x="120" y="225" font-size="8" fill="#666">人路径</text>

  <!-- ===== RIGHT: Constraint table ===== -->
  <text x="420" y="48" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">路径约束分析（wait = w）</text>

  <!-- Table header -->
  <rect x="280" y="58" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="73" font-size="8.5" fill="#446688" font-weight="bold">格子</text>
  <text x="350" y="73" font-size="8.5" fill="#446688" font-weight="bold">人到达</text>
  <text x="410" y="73" font-size="8.5" fill="#446688" font-weight="bold">火到达</text>
  <text x="470" y="73" font-size="8.5" fill="#446688" font-weight="bold">约束</text>

  <!-- Table rows: key cells only -->
  <rect x="280" y="82" width="260" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="96" font-size="8.5" fill="#333">(0,0)</text>
  <text x="350" y="96" font-size="8.5" fill="#333">w</text>
  <text x="410" y="96" font-size="8.5" fill="#b85450">6</text>
  <text x="470" y="96" font-size="8.5" fill="#555">w&lt;6</text>

  <rect x="280" y="104" width="260" height="20" fill="#f9f9f9" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="118" font-size="8.5" fill="#333">(1,0)</text>
  <text x="350" y="118" font-size="8.5" fill="#333">w+1</text>
  <text x="410" y="118" font-size="8.5" fill="#b85450">5</text>
  <text x="470" y="118" font-size="8.5" fill="#d6a040" font-weight="bold">w≤3 ★</text>

  <rect x="280" y="126" width="260" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="140" font-size="8.5" fill="#333">(2,0)</text>
  <text x="350" y="140" font-size="8.5" fill="#333">w+2</text>
  <text x="410" y="140" font-size="8.5" fill="#b85450">6</text>
  <text x="470" y="140" font-size="8.5" fill="#d6a040" font-weight="bold">w≤3 ★</text>

  <rect x="280" y="148" width="260" height="20" fill="#f9f9f9" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="162" font-size="8.5" fill="#333">(3,0)</text>
  <text x="350" y="162" font-size="8.5" fill="#333">w+3</text>
  <text x="410" y="162" font-size="8.5" fill="#b85450">7</text>
  <text x="470" y="162" font-size="8.5" fill="#d6a040" font-weight="bold">w≤3 ★</text>

  <rect x="280" y="170" width="260" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="184" font-size="8.5" fill="#333">(3,1)</text>
  <text x="350" y="184" font-size="8.5" fill="#333">w+4</text>
  <text x="410" y="184" font-size="8.5" fill="#b85450">8</text>
  <text x="470" y="184" font-size="8.5" fill="#d6a040" font-weight="bold">w≤3 ★</text>

  <rect x="280" y="192" width="260" height="20" fill="#f9f9f9" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="295" y="206" font-size="8.5" fill="#333">...</text>
  <text x="350" y="206" font-size="8.5" fill="#333">...</text>
  <text x="410" y="206" font-size="8.5" fill="#333">...</text>
  <text x="470" y="206" font-size="8.5" fill="#333">...</text>

  <rect x="280" y="214" width="260" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="228" font-size="8.5" fill="#4a7a3a" font-weight="bold">(4,6)H</text>
  <text x="350" y="228" font-size="8.5" fill="#4a7a3a" font-weight="bold">w+10</text>
  <text x="410" y="228" font-size="8.5" fill="#b85450">14</text>
  <text x="470" y="228" font-size="8.5" fill="#4a7a3a">w≤4</text>

  <!-- Conclusion -->
  <rect x="280" y="246" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="264" text-anchor="middle" font-size="9.5" fill="#444" font-weight="bold">中间格约束：w+dist &lt; fire → w ≤ 3</text>
  <text x="410" y="280" text-anchor="middle" font-size="9.5" fill="#444" font-weight="bold">安全屋约束：w+10 ≤ 14 → w ≤ 4</text>
  <text x="410" y="292" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">取交集 → max wait = 3 ✓</text>

  <!-- ===== Bottom: Key insight ===== -->
  <rect x="30" y="320" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：中间格严格不等（人时 &lt; fire），安全屋非严格（人时 ≤ fire）</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#555">瓶颈在中间格 (1,0)：人 w+1 到达，火 5 到达 → w+1 &lt; 5 → w ≤ 3</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#555">安全屋宽松一格（w≤4），但被中间格卡住 → 最终答案 3</text>
</svg>
