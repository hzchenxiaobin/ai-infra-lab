<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → GROUP BY → MAX → ORDER BY</text>

  <!-- Step 1 -->
  <rect x="20" y="64" width="140" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="86" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① FROM Bikes</text>
  <text x="90" y="104" text-anchor="middle" font-size="8" fill="#666">读取 6 行骑行记录</text>
  <text x="90" y="118" text-anchor="middle" font-size="8" fill="#888">（含 ride_id/车号/起止）</text>

  <!-- arrow 1->2 -->
  <path d="M 160 95 L 178 95" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="180" y="64" width="160" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② GROUP BY bike_number</text>
  <text x="260" y="104" text-anchor="middle" font-size="8" fill="#666">同车骑行归一组</text>
  <text x="260" y="118" text-anchor="middle" font-size="8" fill="#b85450">6 行 → 3 组</text>

  <!-- arrow 2->3 -->
  <path d="M 340 95 L 358 95" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="360" y="64" width="170" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ MAX(end_time)</text>
  <text x="445" y="104" text-anchor="middle" font-size="8" fill="#666">组内取最大 end_time</text>
  <text x="445" y="118" text-anchor="middle" font-size="8" fill="#888">AS end_time（命名）</text>

  <!-- arrow 3->4 -->
  <path d="M 530 95 L 548 95" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="550" y="64" width="180" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="640" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ ORDER BY bike_number</text>
  <text x="640" y="104" text-anchor="middle" font-size="8" fill="#666">按车号升序输出</text>
  <text x="640" y="118" text-anchor="middle" font-size="8" fill="#888">W00300→W00455→W00576</text>

  <!-- arrow down to result -->
  <path d="M 640 126 L 640 156 L 380 156 L 380 176" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result table label -->
  <text x="380" y="172" text-anchor="middle" font-size="9" fill="#888" font-weight="bold"></text>

  <!-- Result table -->
  <rect x="200" y="180" width="360" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">bike_number</text>
  <text x="450" y="196" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">end_time</text>

  <rect x="200" y="204" width="360" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">W00300</text>
  <text x="450" y="218" text-anchor="middle" font-size="8" fill="#333">2012-03-25 10:50:00</text>

  <rect x="200" y="224" width="360" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="450" y="238" text-anchor="middle" font-size="8" fill="#333">2012-03-26 17:40:00</text>

  <rect x="200" y="244" width="360" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">W00576</text>
  <text x="450" y="258" text-anchor="middle" font-size="8" fill="#333">2012-03-28 02:50:00</text>

  <!-- note -->
  <rect x="40" y="290" width="680" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="380" y="310" text-anchor="middle" font-size="9" fill="#666">SQL 子句执行顺序：FROM → WHERE（本题无）→ GROUP BY → 聚合函数 MAX → SELECT → ORDER BY</text>
  <text x="380" y="328" text-anchor="middle" font-size="9" fill="#b85450">先有 3 组，才能「组内取最大」；MAX 是组级聚合，必须在 GROUP BY 之后求值</text>
</svg>
