<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：滚动哈希 + 哈希集合，O(n) 判定</text>

  <!-- Start -->
  <ellipse cx="200" cy="50" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="54" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 200 65 L 200 74" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="70" y="76" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="97" text-anchor="middle" font-size="11" fill="#333">val=0; mask=(1&lt;&lt;k)−1; need=1&lt;&lt;k; seen=∅</text>

  <path d="M 200 110 L 200 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: n-k+1 < need ? -->
  <polygon points="200,120 290,156 200,192 110,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#333">n−k+1 &lt; need ?</text>

  <!-- Yes branch right -> return false -->
  <path d="M 290 156 L 340 156" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="150" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="340" y="140" width="110" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="160" text-anchor="middle" font-size="11.5" fill="#333">return false</text>
  <path d="M 395 172 L 395 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="395" cy="200" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="204" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- No branch down -->
  <text x="208" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 200 192 L 200 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- val update box (loop body start) -->
  <rect x="60" y="208" width="280" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">val = ((val&lt;&lt;1) | (s[i]−'0')) &amp; mask</text>

  <path d="M 200 244 L 200 252" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: i >= k-1 ? -->
  <polygon points="200,254 282,282 200,310 118,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="11" fill="#333">i ≥ k−1 ?</text>

  <!-- Yes branch right -> seen.add(val) -->
  <path d="M 282 282 L 330 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="330" y="266" width="150" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="286" text-anchor="middle" font-size="11.5" fill="#333">seen.add(val)</text>
  <!-- merge back down to main flow -->
  <path d="M 405 298 L 405 318 L 200 318" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- No branch down -->
  <text x="208" y="304" font-size="11" fill="#888">否</text>
  <path d="M 200 310 L 200 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond3: |seen| == need ? -->
  <polygon points="200,324 296,352 200,380 104,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#333">|seen| == need ?</text>

  <!-- Yes branch right -> return true -->
  <path d="M 296 352 L 340 352" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="336" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="356" text-anchor="middle" font-size="11.5" fill="#333">return true</text>
  <path d="M 395 368 L 395 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="395" cy="396" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="400" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- No branch down -->
  <text x="208" y="374" font-size="11" fill="#888">否</text>
  <path d="M 200 380 L 200 392" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i += 1 box -->
  <rect x="150" y="394" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="414" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <path d="M 200 424 L 200 432" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond4: i < n ? -->
  <polygon points="200,434 272,462 200,490 128,462" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="466" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>

  <!-- Yes branch left -> loop back to val box -->
  <path d="M 128 462 L 44 462 L 44 226 L 56 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="70" y="456" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="48" y="218" font-size="10" fill="#4a7a3a">回到循环体</text>

  <!-- No branch down -> return false -->
  <text x="208" y="484" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 200 490 L 200 498" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="500" width="100" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="520" text-anchor="middle" font-size="11.5" fill="#333">return false</text>

  <!-- footer notes -->
  <rect x="470" y="208" width="120" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="228" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">要点</text>
  <text x="530" y="246" text-anchor="middle" font-size="10" fill="#888">循环体每步 O(1)</text>
  <text x="530" y="262" text-anchor="middle" font-size="10" fill="#888">总时间 O(n)</text>
  <text x="530" y="278" text-anchor="middle" font-size="10" fill="#888">提前剪枝：</text>
  <text x="530" y="292" text-anchor="middle" font-size="10" fill="#888">n−k+1 &lt; 2^k → false</text>
  <text x="530" y="308" text-anchor="middle" font-size="10" fill="#888">滚动哈希：</text>
  <text x="530" y="322" text-anchor="middle" font-size="10" fill="#888">左移加位再 mask</text>
  <text x="530" y="340" text-anchor="middle" font-size="10" fill="#888">k ≤ 20 → int 安全</text>
</svg>
