<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：差分建表 → 前缀和还原 → 排序 → 贪心配对求和</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① 差分标记</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#666">diff[l]+=1, diff[r+1]-=1</text>
  <text x="130" y="106" text-anchor="middle" font-size="10" fill="#999">O(m)，m = 请求数</text>

  <!-- arrow -->
  <path d="M 220 78 L 250 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="250" y="50" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">② 前缀和还原</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#666">cnt[i] = Σ diff[0..i]</text>
  <text x="340" y="106" text-anchor="middle" font-size="10" fill="#999">O(n)，得每个位置频次</text>

  <!-- arrow down -->
  <path d="M 340 106 L 340 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="160" y="130" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">③ 排序 cnt 和 nums</text>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#666">sort(cnt), sort(nums)（均升序）</text>
  <text x="270" y="186" text-anchor="middle" font-size="10" fill="#999">O(n log n)，排序主导复杂度</text>

  <!-- arrow down -->
  <path d="M 270 186 L 270 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="100" y="210" width="340" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">④ 同序相乘求和 + 取余</text>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#666">ans = Σ nums[i] × cnt[i]  (mod 10⁹+7)</text>
  <text x="270" y="266" text-anchor="middle" font-size="10" fill="#999">O(n)，大数配大权重（排序不等式）</text>

  <!-- arrow down to result -->
  <path d="M 270 266 L 270 290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="160" y="290" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">返回 ans（最大查询和）</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#999">总复杂度 O(n log n + m) / O(n)</text>

  <!-- 关键提示框 -->
  <rect x="40" y="350" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心转化链：</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#666">区间查询 → 差分标记频次 → 排序 → 同序配对求和</text>
</svg>
