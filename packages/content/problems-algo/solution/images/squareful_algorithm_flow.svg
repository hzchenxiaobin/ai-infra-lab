<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">平方数组：回溯算法流程</text>

  <!-- Sort -->
  <rect x="130" y="38" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序 nums；初始化 used / path</text>
  <path d="M230,68 L230,82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- backtrack -->
  <rect x="160" y="84" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">backtrack(path)</text>
  <path d="M230,112 L230,126" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: path.size()==n? -->
  <polygon points="230,128 300,158 230,188 160,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">path.size()==n?</text>
  <path d="M300,158 L376,158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="378" y="142" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="438" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans++; return</text>
  <text x="244" y="180" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <path d="M230,188 L230,202" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for loop -->
  <rect x="160" y="204" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i = 0 .. n-1</text>
  <path d="M230,232 L230,246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: used[i]? -->
  <polygon points="230,248 290,274 230,300 170,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">used[i]?</text>
  <path d="M290,274 L376,274" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="378" y="258" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="433" y="279" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过 continue</text>
  <path d="M230,300 L230,314" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 同层重复? -->
  <polygon points="230,316 300,346 230,376 160,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="343" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">同层重复?</text>
  <text x="230" y="357" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">!used[i-1]</text>
  <path d="M300,346 L376,346" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="340" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="378" y="330" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="443" y="351" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过(去重剪枝)</text>
  <path d="M230,376 L230,390" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 和非平方? -->
  <polygon points="230,392 300,418 230,444 160,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="415" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">path 非空 &amp;&amp;</text>
  <text x="230" y="429" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">和非平方?</text>
  <path d="M300,418 L376,418" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="412" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="378" y="402" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="443" y="423" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过(合法剪枝)</text>

  <!-- No -> 选入/递归/撤销 -->
  <path d="M230,444 L230,456" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="458" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="480" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">选入 used=true; push → 递归 → 撤销 used=false; pop</text>

  <!-- Loop back arrow from bottom box to for-loop -->
  <path d="M90,475 Q50,475 50,350 Q50,218 158,218" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="30" y="350" font-size="10" fill="#446688" filter="url(#rough2)">回循环</text>
</svg>
