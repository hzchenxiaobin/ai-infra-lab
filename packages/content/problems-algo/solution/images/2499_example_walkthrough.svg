<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums1=[2,2,2,1,3]，nums2=[1,2,2,3,3] → 10</text>

  <!-- ===== top arrays (positions 0..4) ; x=70,150,230,310,390 w=46 ===== -->
  <text x="62" y="66" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums1</text>
  <text x="62" y="96" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums2</text>
  <!-- nums1 row y=52 -->
  <g filter="url(#rough2)">
    <rect x="70" y="52" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="93" y="71" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="150" y="52" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="173" y="71" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">2</text>
    <rect x="230" y="52" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="253" y="71" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">2</text>
    <rect x="310" y="52" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="333" y="71" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="390" y="52" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="413" y="71" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">3</text>
  </g>
  <!-- nums2 row y=82 -->
  <g filter="url(#rough2)">
    <rect x="70" y="82" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="93" y="101" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="150" y="82" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="173" y="101" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">2</text>
    <rect x="230" y="82" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="253" y="101" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">2</text>
    <rect x="310" y="82" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="333" y="101" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="390" y="82" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="413" y="101" text-anchor="middle" font-size="12" fill="#7a4a10" font-weight="bold">3</text>
  </g>
  <!-- index labels -->
  <g filter="url(#rough2)" font-size="10" fill="#888">
    <text x="93" y="124" text-anchor="middle">0</text>
    <text x="173" y="124" text-anchor="middle">1</text>
    <text x="253" y="124" text-anchor="middle">2</text>
    <text x="333" y="124" text-anchor="middle">3</text>
    <text x="413" y="124" text-anchor="middle">4</text>
  </g>
  <text x="470" y="80" font-size="10" fill="#d6a040" filter="url(#rough2)">橙=坏</text>
  <text x="470" y="96" font-size="10" fill="#446688" filter="url(#rough2)">(相等)</text>

  <!-- ===== step list ===== -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <!-- ① -->
    <rect x="40" y="136" width="480" height="26" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="54" y="154"><tspan fill="#446688" font-weight="bold">①</tspan> 坏位置 B={1,2,4}（nums1[i]=nums2[i]），m=3，sum_B=1+2+4=7</text>
    <!-- ② -->
    <rect x="40" y="166" width="480" height="26" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1"/>
    <text x="54" y="184"><tspan fill="#d6a040" font-weight="bold">②</tspan> freq={2:2, 3:1}，maxFreq=2，主导值 d=2</text>
    <!-- ③ -->
    <rect x="40" y="196" width="480" height="26" rx="5" fill="#fafafa" stroke="#b85450" stroke-width="1"/>
    <text x="54" y="214"><tspan fill="#b85450" font-weight="bold">③</tspan> 2·maxFreq=4 &gt; m=3 → overflow=4−3=1，需 1 个对 d 合法的好位置</text>
    <!-- ④ -->
    <rect x="40" y="226" width="480" height="40" rx="5" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/>
    <text x="54" y="244"><tspan fill="#4a7a3a" font-weight="bold">④</tspan> 合法好位置：j=3（nums1[3]=1≠2，nums2[3]=3≠2 ✓）</text>
    <text x="74" y="260" font-size="11" fill="#888">j=0 不合法（nums1[0]=2=d）；j=4 是坏位置。共 1 个 ≥ overflow=1 ✓</text>
    <!-- ⑤ -->
    <rect x="40" y="270" width="480" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="54" y="288"><tspan fill="#b85450" font-weight="bold">⑤</tspan> 答案 = sum_B + 最小 1 个好下标 = 7 + 3 = <tspan fill="#b85450" font-weight="bold">10</tspan></text>
  </g>

  <!-- ===== swap result ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="308" width="480" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="56" y="330" font-size="12" fill="#2f5a22" font-weight="bold">对应交换方案（代价同 = 10）</text>
    <text x="56" y="350" font-size="12" fill="#333">交换 (1,4) 代价 5；交换 (2,3) 代价 5；总代价 5+5=10</text>
    <text x="56" y="372" font-size="12" fill="#333">结果 nums1 = [2, 3, 1, 2, 2]</text>
    <text x="56" y="392" font-size="11" fill="#555">逐位核对：2≠1 ✓  3≠2 ✓  1≠2 ✓  2≠3 ✓  2≠3 ✓</text>
  </g>

  <!-- bottom result chips -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="120" y="418" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="440" text-anchor="middle" fill="#446688">sum_B = 7</text>
    <rect x="250" y="418" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="310" y="440" text-anchor="middle" fill="#2f5a22">+ 好下标 3</text>
    <rect x="380" y="418" width="100" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="430" y="440" text-anchor="middle" fill="#b85450" font-weight="bold">= 10 ✓</text>
  </g>
</svg>
