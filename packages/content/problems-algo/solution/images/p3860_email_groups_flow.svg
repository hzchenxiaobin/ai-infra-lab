<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：规范化 + 哈希集合一趟去重</text>

  <!-- 开始 -->
  <rect x="196" y="32" width="128" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：set = ∅</text>

  <path d="M 260 58 L 260 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取邮件 -->
  <rect x="176" y="70" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取出下一封 email</text>

  <path d="M 260 96 L 260 106" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转小写 -->
  <rect x="176" y="108" width="168" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">整体转小写（local+域名）</text>

  <path d="M 260 134 L 260 144" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 切分 -->
  <rect x="176" y="146" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">按 '@' 切成 local / domain</text>

  <path d="M 260 172 L 260 182" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 清洗 local -->
  <rect x="176" y="184" width="168" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">local：截 '+ 后缀' 再删 '.'</text>

  <path d="M 260 210 L 260 220" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 拼规范形 -->
  <rect x="176" y="222" width="168" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">canonical = local + "@" + domain</text>

  <path d="M 260 248 L 260 258" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入集合 -->
  <rect x="176" y="260" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">set.insert(canonical)</text>

  <path d="M 260 286 L 260 296" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,298 322,322 260,346 198,322" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">还有邮件？</text>

  <!-- 循环回边 -->
  <path d="M 198 322 L 90 322 L 90 83 L 174 83" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 返回 -->
  <path d="M 322 322 L 420 322 L 420 340" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="356" y="342" width="128" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="354" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 set.size()</text>
</svg>
