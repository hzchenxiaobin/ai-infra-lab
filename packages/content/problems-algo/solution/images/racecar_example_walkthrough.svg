<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例：target = 6，最优指令 AAARA（共 5 步）</text>

  <!-- number line -->
  <line x1="40" y1="120" x2="520" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 520 120 L 512 116 L 512 124 Z" fill="#446688" filter="url(#rough2)"/>

  <!-- position ticks 0..7 -->
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <line x1="60" y1="114" x2="60" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="115" y1="114" x2="115" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="170" y1="114" x2="170" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="225" y1="114" x2="225" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="280" y1="114" x2="280" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="335" y1="114" x2="335" y2="126" stroke="#446688" stroke-width="1.5"/>
    <line x1="390" y1="114" x2="390" y2="126" stroke="#b85450" stroke-width="2.2"/>
    <line x1="445" y1="114" x2="445" y2="126" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="60" y="142" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#bbb">2</text>
  <text x="225" y="142" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#bbb">4</text>
  <text x="335" y="142" text-anchor="middle" font-size="11" fill="#bbb">5</text>
  <text x="390" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="445" y="142" text-anchor="middle" font-size="11" fill="#555">7</text>

  <!-- target flag on 6 -->
  <line x1="390" y1="86" x2="390" y2="114" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 390 86 L 408 90 L 390 94 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="396" y="82" font-size="11" fill="#b85450" font-weight="bold">target</text>

  <!-- path nodes & arrows -->
  <!-- node 0 -->
  <circle cx="60" cy="100" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="60" y="74" text-anchor="middle" font-size="9" fill="#888">s=1</text>

  <!-- arrow 0->1 labeled A -->
  <path d="M 71 100 Q 88 78 104 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="88" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- node 1 -->
  <circle cx="115" cy="100" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="115" y="74" text-anchor="middle" font-size="9" fill="#888">s=2</text>

  <!-- arrow 1->3 labeled A -->
  <path d="M 126 100 Q 175 72 214 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="175" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- node 3 -->
  <circle cx="225" cy="100" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="225" y="74" text-anchor="middle" font-size="9" fill="#888">s=4</text>

  <!-- arrow 3->7 labeled A (overshoot) -->
  <path d="M 236 100 Q 340 64 434 100" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="340" y="68" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">A（过头）</text>

  <!-- node 7 -->
  <circle cx="445" cy="100" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="445" y="74" text-anchor="middle" font-size="9" fill="#888">s=8</text>

  <!-- R self loop on 7 -->
  <path d="M 445 88 Q 460 76 470 88" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="478" y="80" font-size="10" fill="#b85450" font-weight="bold">R</text>
  <text x="445" y="166" text-anchor="middle" font-size="9" fill="#b85450">s=−1</text>

  <!-- arrow 7->6 labeled A (backward) -->
  <path d="M 434 104 Q 412 124 401 104" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="416" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">A</text>

  <!-- node 6 (target reached) -->
  <circle cx="390" cy="100" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="390" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>

  <!-- dp computation box -->
  <rect x="40" y="190" width="480" height="220" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">DP 求解过程</text>

  <!-- dp table -->
  <g filter="url(#rough2)">
    <rect x="70" y="232" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="130" y="232" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="180" y="232" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="250" y="232" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="70" y="260" width="60" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="130" y="260" width="50" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="180" y="260" width="70" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="250" y="260" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="70" y="294" width="60" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="130" y="294" width="50" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="180" y="294" width="70" height="34" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <rect x="250" y="294" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
  <text x="155" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <text x="215" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2^k−1</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[t]</text>

  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="155" y="282" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="215" y="282" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1（直达）</text>

  <text x="100" y="316" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="215" y="316" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="340" y="313" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3+1+dp[7−6]</text>
  <text x="340" y="327" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 4+1 = 5</text>

  <!-- annotation -->
  <rect x="70" y="348" width="430" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="368" font-size="11" fill="#444">• t=6：2^3−1=7 &gt; 6，走「过头」分支</text>
  <text x="85" y="384" font-size="11" fill="#444">• 过头量 = 7−6 = 1 → 归约为子问题 dp[1]</text>
  <text x="85" y="395" font-size="10" fill="#888">  dp[1]=1（一个 A 直达），故 dp[6] = 3(A) + 1(R) + 1(A) = 5</text>
</svg>
