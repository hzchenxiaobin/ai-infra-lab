<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两个计数器追踪「未配对」的括号</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">balance = 多出的 '('，need = 缺少的 '('</text>

  <!-- ===== balance counter ===== -->
  <text x="40" y="80" font-size="12" fill="#446688" font-weight="bold">计数器 ①：balance（待闭合的左括号）</text>
  <rect x="40" y="90" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="110" font-family="monospace" font-size="11" fill="#446688">读 '('  →  balance++   （又多一个待闭合）</text>
  <text x="58" y="128" font-family="monospace" font-size="11" fill="#4a7a3a">读 ')' 且 balance&gt;0  →  balance--   （与栈顶 '(' 配对消掉）</text>
  <text x="58" y="142" font-size="10" fill="#888">栈空时遇到 ')' 无法消，转交给计数器 ②</text>

  <!-- ===== need counter ===== -->
  <text x="40" y="168" font-size="12" fill="#b85450" font-weight="bold">计数器 ②：need（已浪费的右括号，需补 '('）</text>
  <rect x="40" y="178" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="198" font-family="monospace" font-size="11" fill="#b85450">读 ')' 且 balance==0  →  need++   （此 ')' 前面没有 '(' 可配）</text>
  <text x="58" y="216" font-family="monospace" font-size="11" fill="#555">扫完后：balance 个 '(' 还缺 ')',  need 个 ')' 还缺 '('</text>
  <text x="58" y="230" font-size="10" fill="#888">最终答案 = balance + need</text>

  <!-- ===== equivalence to stack ===== -->
  <rect x="40" y="252" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 balance 等价于「栈深度」，need 等价于「栈空时硬弹的次数」</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#555">只有一种括号 → 用一个 int 替代栈，空间从 O(n) 降到 O(1)</text>

  <!-- ===== arrow from concept to result ===== -->
  <path d="M 280 308 L 280 326" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="328" width="320" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = balance + need（最少添加数）</text>
</svg>
