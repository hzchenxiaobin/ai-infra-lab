<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：x &amp;gt; y &amp;amp;&amp;amp; x &amp;lt; y ... → x &gt; y &amp;&amp; x &lt; y ...</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">重点观察步骤 4、5：两处连续 &amp;amp; 各自独立匹配，产出的 &amp; 不回扫</text>

  <!-- header row -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="30" y="58" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="52" y="78" text-anchor="middle">步骤</text>
    <rect x="74" y="58" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="97" y="78" text-anchor="middle">i</text>
    <rect x="120" y="58" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="185" y="78" text-anchor="middle">输入片段</text>
    <rect x="250" y="58" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="325" y="78" text-anchor="middle">匹配</text>
    <rect x="400" y="58" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="445" y="78" text-anchor="middle">输出</text>
    <rect x="490" y="58" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="535" y="78" text-anchor="middle">i 跳到</text>
  </g>

  <!-- Row 1: i=0, x -->
  <g font-size="11">
    <rect x="30" y="92" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="111" text-anchor="middle" fill="#666" font-weight="bold">1</text>
    <rect x="74" y="92" width="46" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="97" y="111" text-anchor="middle" fill="#666">0</text>
    <rect x="120" y="92" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="185" y="111" text-anchor="middle" fill="#666">x</text>
    <rect x="250" y="92" width="150" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="325" y="111" text-anchor="middle" fill="#999">—</text>
    <rect x="400" y="92" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="445" y="111" text-anchor="middle" fill="#666">x</text>
    <rect x="490" y="92" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="535" y="111" text-anchor="middle" fill="#666">1</text>
  </g>

  <!-- Row 2: i=1, &gt; -->
  <g font-size="11">
    <rect x="30" y="122" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="141" text-anchor="middle" fill="#666" font-weight="bold">2</text>
    <rect x="74" y="122" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="97" y="141" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="120" y="122" width="130" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="185" y="141" text-anchor="middle" fill="#446688" font-weight="bold">&amp;gt;</text>
    <rect x="250" y="122" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="325" y="141" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;gt; → &gt;</text>
    <rect x="400" y="122" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="445" y="141" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&gt;</text>
    <rect x="490" y="122" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="535" y="141" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <!-- Row 3: i=5, " y " literal -->
  <g font-size="11">
    <rect x="30" y="152" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="171" text-anchor="middle" fill="#666" font-weight="bold">3</text>
    <rect x="74" y="152" width="46" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="97" y="171" text-anchor="middle" fill="#666">5–7</text>
    <rect x="120" y="152" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="185" y="171" text-anchor="middle" fill="#666">" y "</text>
    <rect x="250" y="152" width="150" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="325" y="171" text-anchor="middle" fill="#999">—</text>
    <rect x="400" y="152" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="445" y="171" text-anchor="middle" fill="#666">" y "</text>
    <rect x="490" y="152" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="535" y="171" text-anchor="middle" fill="#666">8</text>
  </g>

  <!-- Row 4: i=8, &amp; (KEY) -->
  <g font-size="11">
    <rect x="30" y="182" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="52" y="201" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="74" y="182" width="46" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="97" y="201" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <rect x="120" y="182" width="130" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="185" y="201" text-anchor="middle" fill="#b85450" font-weight="bold">&amp;amp;</text>
    <rect x="250" y="182" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="325" y="201" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;amp; → &amp;</text>
    <rect x="400" y="182" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="445" y="201" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;</text>
    <rect x="490" y="182" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="535" y="201" text-anchor="middle" fill="#b85450" font-weight="bold">13</text>
  </g>

  <!-- Row 5: i=13, &amp; (KEY) -->
  <g font-size="11">
    <rect x="30" y="212" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="52" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="74" y="212" width="46" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="97" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">13</text>
    <rect x="120" y="212" width="130" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="185" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">&amp;amp;</text>
    <rect x="250" y="212" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="325" y="231" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;amp; → &amp;</text>
    <rect x="400" y="212" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="445" y="231" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;</text>
    <rect x="490" y="212" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="535" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">18</text>
  </g>

  <!-- Row 6: i=18, " x " literal -->
  <g font-size="11">
    <rect x="30" y="242" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="261" text-anchor="middle" fill="#666" font-weight="bold">6</text>
    <rect x="74" y="242" width="46" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="97" y="261" text-anchor="middle" fill="#666">18–20</text>
    <rect x="120" y="242" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="185" y="261" text-anchor="middle" fill="#666">" x "</text>
    <rect x="250" y="242" width="150" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="325" y="261" text-anchor="middle" fill="#999">—</text>
    <rect x="400" y="242" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="445" y="261" text-anchor="middle" fill="#666">" x "</text>
    <rect x="490" y="242" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="535" y="261" text-anchor="middle" fill="#666">21</text>
  </g>

  <!-- Row 7: i=21, &lt; -->
  <g font-size="11">
    <rect x="30" y="272" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="291" text-anchor="middle" fill="#666" font-weight="bold">7</text>
    <rect x="74" y="272" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="97" y="291" text-anchor="middle" fill="#446688" font-weight="bold">21</text>
    <rect x="120" y="272" width="130" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="185" y="291" text-anchor="middle" fill="#446688" font-weight="bold">&amp;lt;</text>
    <rect x="250" y="272" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="325" y="291" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&amp;lt; → &lt;</text>
    <rect x="400" y="272" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="445" y="291" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&lt;</text>
    <rect x="490" y="272" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="535" y="291" text-anchor="middle" fill="#4a7a3a" font-weight="bold">25</text>
  </g>

  <!-- Row 8: i=25, " y is always false" -->
  <g font-size="11">
    <rect x="30" y="302" width="44" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="52" y="321" text-anchor="middle" fill="#666" font-weight="bold">8</text>
    <rect x="74" y="302" width="46" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="97" y="321" text-anchor="middle" fill="#666">25+</text>
    <rect x="120" y="302" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="185" y="321" text-anchor="middle" fill="#666" font-size="9">" y is always false"</text>
    <rect x="250" y="302" width="150" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="325" y="321" text-anchor="middle" fill="#999">—</text>
    <rect x="400" y="302" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="445" y="321" text-anchor="middle" fill="#666" font-size="9">" y is..."</text>
    <rect x="490" y="302" width="90" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="535" y="321" text-anchor="middle" fill="#666">结束</text>
  </g>

  <!-- link between step 4 and 5 -->
  <path d="M 535 210 L 560 210 L 560 224 L 580 224" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="566" y="206" font-size="8" fill="#b85450">i=13=下一个&amp;amp;起点</text>

  <!-- result note -->
  <rect x="30" y="342" width="580" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="364" font-size="12" fill="#446688" font-weight="bold">最终输出（拼接 res）：</text>
  <text x="50" y="384" font-size="12" fill="#444" font-weight="bold">x &gt; y &amp;&amp; x &lt; y is always false</text>
  <text x="50" y="404" font-size="10" fill="#666">步骤 4 输出的 &amp; 进 res 不回扫；i 跳到 13 正好是第二个 &amp;amp; 起点 → 两次独立匹配，互不干扰</text>
  <text x="50" y="418" font-size="10" fill="#b85450" font-weight="bold">若用链式 replace（&amp;amp; 先）：&amp;amp;&amp;amp; 碰巧不变，但换 &amp;amp;quot; 就会翻车 → 单趟扫描结构性正确 ✓</text>
</svg>
