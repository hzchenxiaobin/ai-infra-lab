<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定位车 → 四方向直线扫描 → 统计可吃卒</text>

  <!-- Step 1: 找车 -->
  <rect x="180" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333">遍历棋盘找 'R' 位置 (rx,ry)</text>
  <line x1="260" y1="80" x2="260" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: 初始化 -->
  <rect x="190" y="94" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333">count = 0；四方向数组</text>
  <line x1="260" y1="128" x2="260" y2="140" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: 遍历四方向 -->
  <polygon points="260,142 360,176 260,210 160,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#333">四个方向</text>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#333">都扫完了?</text>
  <line x1="260" y1="210" x2="260" y2="224" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="220" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <line x1="360" y1="176" x2="398" y2="176" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="376" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="160" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="446" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 count</text>

  <!-- Step 4: 沿方向逐格走 -->
  <rect x="150" y="226" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333">沿该方向 step 逐格前进</text>
  <line x1="260" y1="260" x2="260" y2="272" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: 判定格子内容 -->
  <polygon points="260,274 380,310 260,346 140,310" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#333">当前格 board[nx][ny]</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#333">是什么?</text>

  <!-- 三分支 -->
  <!-- '.' -->
  <line x1="200" y1="338" x2="120" y2="362" stroke="#888" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="356" font-size="10" fill="#888">'.'</text>
  <rect x="40" y="362" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="382" text-anchor="middle" font-size="11" fill="#446688">继续下一格</text>

  <!-- 'p' -->
  <line x1="260" y1="346" x2="260" y2="362" stroke="#888" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="358" font-size="10" fill="#4a7a3a" font-weight="bold">'p'</text>
  <rect x="200" y="362" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count++ 停止</text>

  <!-- 'B' 或边界 -->
  <line x1="320" y1="338" x2="400" y2="362" stroke="#888" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="372" y="356" font-size="10" fill="#b85450" font-weight="bold">'B'/越界</text>
  <rect x="360" y="362" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">停止 不计</text>

  <!-- 回环箭头：继续下一格 → 回到方向遍历 -->
  <path d="M 100 362 Q 60 320 60 270 Q 60 176 160 176" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="42" y="270" font-size="9" fill="#446688">同方向续走</text>

  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">每方向遇首个棋子即停，最坏 4×8 = 32 步</text>
</svg>
