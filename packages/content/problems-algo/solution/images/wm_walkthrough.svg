<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：JOIN 后逐行体积 → 分组求和</text>

  <!-- ===== JOIN result table header ===== -->
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold">步骤①② JOIN + 逐行体积 row_volume = units × W × L × H</text>

  <!-- Column headers -->
  <rect x="40" y="66" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">name</text>
  <text x="150" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">product</text>
  <text x="230" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">units</text>
  <text x="310" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">W×L×H</text>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">row_volume</text>
  <text x="535" y="82" text-anchor="middle" font-size="10" fill="#888">组</text>

  <!-- Row 1: LCHouse1 p=1 -->
  <rect x="40" y="90" width="520" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="105" text-anchor="middle" font-size="10" fill="#333">LCHouse1</text>
  <text x="150" y="105" text-anchor="middle" font-size="10" fill="#333">LC-TV(1)</text>
  <text x="230" y="105" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="310" y="105" text-anchor="middle" font-size="10" fill="#d6a040">5×50×40</text>
  <text x="430" y="105" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10000</text>
  <text x="535" y="105" text-anchor="middle" font-size="10" fill="#446688">①</text>

  <!-- Row 2: LCHouse1 p=2 -->
  <rect x="40" y="112" width="520" height="22" fill="#f6faff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="127" text-anchor="middle" font-size="10" fill="#333">LCHouse1</text>
  <text x="150" y="127" text-anchor="middle" font-size="10" fill="#333">KeyChain(2)</text>
  <text x="230" y="127" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="310" y="127" text-anchor="middle" font-size="10" fill="#d6a040">5×5×5</text>
  <text x="430" y="127" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1250</text>
  <text x="535" y="127" text-anchor="middle" font-size="10" fill="#446688">①</text>

  <!-- Row 3: LCHouse1 p=3 -->
  <rect x="40" y="134" width="520" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="149" text-anchor="middle" font-size="10" fill="#333">LCHouse1</text>
  <text x="150" y="149" text-anchor="middle" font-size="10" fill="#333">Phone(3)</text>
  <text x="230" y="149" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="310" y="149" text-anchor="middle" font-size="10" fill="#d6a040">2×10×10</text>
  <text x="430" y="149" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1000</text>
  <text x="535" y="149" text-anchor="middle" font-size="10" fill="#446688">①</text>

  <!-- Row 4: LCHouse2 p=1 -->
  <rect x="40" y="156" width="520" height="22" fill="#f6faff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="171" text-anchor="middle" font-size="10" fill="#333">LCHouse2</text>
  <text x="150" y="171" text-anchor="middle" font-size="10" fill="#333">LC-TV(1)</text>
  <text x="230" y="171" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="310" y="171" text-anchor="middle" font-size="10" fill="#d6a040">5×50×40</text>
  <text x="430" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20000</text>
  <text x="535" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a">②</text>

  <!-- Row 5: LCHouse2 p=2 -->
  <rect x="40" y="178" width="520" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="193" text-anchor="middle" font-size="10" fill="#333">LCHouse2</text>
  <text x="150" y="193" text-anchor="middle" font-size="10" fill="#333">KeyChain(2)</text>
  <text x="230" y="193" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="310" y="193" text-anchor="middle" font-size="10" fill="#d6a040">5×5×5</text>
  <text x="430" y="193" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">250</text>
  <text x="535" y="193" text-anchor="middle" font-size="10" fill="#4a7a3a">②</text>

  <!-- Row 6: LCHouse3 p=4 -->
  <rect x="40" y="200" width="520" height="22" fill="#f6faff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="215" text-anchor="middle" font-size="10" fill="#333">LCHouse3</text>
  <text x="150" y="215" text-anchor="middle" font-size="10" fill="#333">T-Shirt(4)</text>
  <text x="230" y="215" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="310" y="215" text-anchor="middle" font-size="10" fill="#d6a040">4×10×20</text>
  <text x="430" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">800</text>
  <text x="535" y="215" text-anchor="middle" font-size="10" fill="#b85450">③</text>

  <!-- arrow down -->
  <path d="M 300 224 L 300 246" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="240" font-size="10" fill="#666">GROUP BY name + SUM</text>

  <!-- ===== Step 3: grouped sums ===== -->
  <text x="40" y="262" font-size="11" fill="#b85450" font-weight="bold">步骤③④ GROUP BY name + SUM(row_volume) → volume</text>

  <!-- Group 1: LCHouse1 -->
  <rect x="40" y="270" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="288" font-size="10" fill="#446688" font-weight="bold">LCHouse1</text>
  <text x="110" y="288" font-size="10" fill="#888">① 组：10000 + 1250 + 1000</text>
  <text x="70" y="304" font-size="10" fill="#b85450" font-weight="bold">volume = 12250</text>

  <!-- Group 2: LCHouse2 -->
  <rect x="40" y="314" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="332" font-size="10" fill="#4a7a3a" font-weight="bold">LCHouse2</text>
  <text x="110" y="332" font-size="10" fill="#888">② 组：20000 + 250</text>
  <text x="70" y="348" font-size="10" fill="#b85450" font-weight="bold">volume = 20250</text>

  <!-- Group 3: LCHouse3 -->
  <rect x="40" y="358" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="376" font-size="10" fill="#b85450" font-weight="bold">LCHouse3</text>
  <text x="110" y="376" font-size="10" fill="#888">③ 组：800</text>
  <text x="70" y="392" font-size="10" fill="#b85450" font-weight="bold">volume = 800</text>

  <!-- Note -->
  <rect x="40" y="412" width="520" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#444">核对：LCHouse1 = 1×10000 + 10×125 + 5×200 = 12250 ✓</text>
  <text x="300" y="444" text-anchor="middle" font-size="10" fill="#888">单件体积 = W×L×H；row_volume = units × 单件体积</text>
</svg>
