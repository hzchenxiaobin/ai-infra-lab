<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：单趟扫描 + 分类讨论
  </text>

  <!-- Start -->
  <rect x="230" y="48" width="100" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="170" y="100" width="220" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历每个区间 [a, b)</text>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(已有序且不相交，无需排序/合并)</text>
  <path d="M 280 140 L 280 158" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: no overlap? -->
  <polygon points="280,160 410,210 280,260 150,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a ≥ y 或</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b ≤ x ?</text>

  <!-- Yes branch -> keep [a,b) -->
  <path d="M 410 210 L 470 210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="196" width="6" height="28" fill="none"/>
  <rect x="460" y="196" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">加入 [a, b)</text>

  <!-- No branch -->
  <path d="M 280 260 L 280 280" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="276" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- left piece decision -->
  <polygon points="280,282 390,322 280,362 170,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a &lt; x ?</text>
  <path d="M 170 322 L 120 322" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="308" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">加入 [a, x)</text>

  <!-- right piece decision -->
  <path d="M 280 362 L 280 380" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,382 390,412 280,442 170,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b &gt; y ?</text>
  <path d="M 390 412 L 440 412" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="440" y="398" width="100" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="418" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">加入 [y, b)</text>

  <!-- loop back arrow to loop box -->
  <path d="M 505 226 Q 505 96 390 120" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="170" font-size="10" fill="#888" filter="url(#rough2)">下一段</text>

  <!-- End -->
  <rect x="230" y="424" width="100" height="0" fill="none"/>
</svg>
