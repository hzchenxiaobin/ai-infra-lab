<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：质数值与质数索引一一对应，两组独立排列</text>

  <!-- n=5 label -->
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#888">以 n = 5 为例</text>

  <!-- ===== Values row (数值 1..5) ===== -->
  <text x="70" y="92" font-size="12" fill="#888">数值</text>
  <!-- box w=56 h=42 gap=12 start x=136 -->
  <!-- 1 non-prime orange -->
  <rect x="136" y="70" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <!-- 2 prime green -->
  <rect x="204" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- 3 prime green -->
  <rect x="272" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <!-- 4 non-prime orange -->
  <rect x="340" y="70" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <!-- 5 prime green -->
  <rect x="408" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>

  <!-- legend -->
  <rect x="478" y="74" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="498" y="86" font-size="10" fill="#4a7a3a">质数</text>
  <rect x="478" y="92" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="498" y="104" font-size="10" fill="#d6a040">非质数</text>

  <!-- ===== Middle: two independent permutation annotations ===== -->
  <!-- green annotation: 质数 3 个 -->
  <rect x="60" y="128" width="250" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="149" font-size="12" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">质数 3 个</tspan> → 任意排列到质数索引位 <tspan font-weight="bold">3!</tspan></text>

  <!-- orange annotation: 非质数 2 个 -->
  <rect x="330" y="128" width="230" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="342" y="149" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">非质数 2 个</tspan> → 任意排列到非质数索引位 <tspan font-weight="bold">2!</tspan></text>

  <!-- down arrows to positions row -->
  <path d="M 185 164 L 185 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 445 164 L 445 196" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- ===== Positions row (位置 1..5, 1-indexed) ===== -->
  <text x="42" y="232" font-size="12" fill="#888">位置(1起)</text>
  <!-- pos 1 non-prime-index orange -->
  <rect x="136" y="204" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="222" text-anchor="middle" font-size="11" fill="#888">索引1</text>
  <text x="164" y="238" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">非质</text>
  <!-- pos 2 prime-index green -->
  <rect x="204" y="204" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="222" text-anchor="middle" font-size="11" fill="#888">索引2</text>
  <text x="232" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">质</text>
  <!-- pos 3 prime-index green -->
  <rect x="272" y="204" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="11" fill="#888">索引3</text>
  <text x="300" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">质</text>
  <!-- pos 4 non-prime-index orange -->
  <rect x="340" y="204" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="222" text-anchor="middle" font-size="11" fill="#888">索引4</text>
  <text x="368" y="238" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">非质</text>
  <!-- pos 5 prime-index green -->
  <rect x="408" y="204" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="222" text-anchor="middle" font-size="11" fill="#888">索引5</text>
  <text x="436" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">质</text>

  <!-- key insight box -->
  <rect x="60" y="268" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="285" text-anchor="middle" font-size="12" fill="#333">质数索引集合 = 质数集合 → 两组个数相同（都为 p）</text>
  <text x="300" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">质数位 p 个、非质数位 (n−p) 个，各自全排列后相乘</text>

  <!-- ===== Result ===== -->
  <rect x="60" y="328" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="13" fill="#333">答案 = p! × (n − p)!  mod (10⁹ + 7)</text>
  <text x="300" y="370" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">n=5：3! × 2! = 6 × 2 = 12 ✓</text>

  <!-- note bottom -->
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#888">⚠️ 索引从 1 开始，1 既不是质数也不是质数索引</text>
</svg>
