<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="380" fill="#fdfcf7"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：2×2 'b' 块的 DFS 判环（4 步闭合）</text>
  <path d="M 160 36 Q 290 44 420 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: current (1,1), arrow -> (1,2) ===== -->
  <text x="64" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">步骤 1</text>
  <!-- cells: (1,1) current visited; others unvisited -->
  <g filter="url(#sk)"><rect x="20" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="42" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="64" y="76" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="86" y="104" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="20" y="120" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="42" y="148" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="64" y="120" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="86" y="148" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <!-- tree edge (1,1)->(1,2) -->
  <path d="M 50 98 L 78 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="42" y="172" text-anchor="middle" font-size="9" fill="#555">(1,1) 当前</text>
  <text x="42" y="184" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">树边→(1,2)</text>

  <!-- progress arrow -->
  <path d="M 112 130 L 148 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- ===== Step 2: current (1,2), parent (1,1); arrow -> (2,2) ===== -->
  <text x="204" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">步骤 2</text>
  <g filter="url(#sk)"><rect x="160" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="182" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="204" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="226" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="160" y="120" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="182" y="148" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="204" y="120" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="226" y="148" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <!-- tree edge (1,2)->(2,2) -->
  <path d="M 226 110 L 226 138" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="226" y="172" text-anchor="middle" font-size="9" fill="#555">(1,2) 当前</text>
  <text x="226" y="184" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">树边→(2,2)</text>
  <text x="182" y="184" text-anchor="middle" font-size="9" fill="#888">父=(1,1)</text>

  <!-- progress arrow -->
  <path d="M 252 130 L 288 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- ===== Step 3: current (2,2), parent (1,2); arrow -> (2,1) ===== -->
  <text x="344" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">步骤 3</text>
  <g filter="url(#sk)"><rect x="300" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="322" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="344" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="366" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="300" y="120" width="44" height="44" rx="3" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="322" y="148" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="344" y="120" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="366" y="148" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <!-- tree edge (2,2)->(2,1) -->
  <path d="M 358 142 L 330 142" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="366" y="172" text-anchor="middle" font-size="9" fill="#555">(2,2) 当前</text>
  <text x="366" y="184" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">树边→(2,1)</text>
  <text x="322" y="184" text-anchor="middle" font-size="9" fill="#888">父=(1,2)</text>

  <!-- progress arrow -->
  <path d="M 392 130 L 428 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- ===== Step 4: current (2,1), parent (2,2); back edge -> (1,1) ===== -->
  <text x="484" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">步骤 4</text>
  <g filter="url(#sk)"><rect x="440" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="462" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="484" y="76" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="506" y="104" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="440" y="120" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="462" y="148" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="484" y="120" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="506" y="148" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <!-- back edge (2,1)->(1,1): vertical up on left column -->
  <path d="M 462 138 L 462 110" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="462" y="172" text-anchor="middle" font-size="9" fill="#555">(2,1) 当前</text>
  <text x="506" y="172" text-anchor="middle" font-size="9" fill="#888">父=(2,2)</text>
  <text x="462" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">回边→环!</text>

  <!-- ===== Bottom: legend + summary ===== -->
  <g filter="url(#sk)"><rect x="30" y="210" width="520" height="148" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>

  <text x="50" y="234" font-size="12" font-weight="bold" fill="#444">DFS 路径回溯：</text>
  <text x="50" y="256" font-size="11" fill="#444">(1,1) → (1,2) → (2,2) → (2,1) ──回边──▶ (1,1)</text>
  <text x="50" y="276" font-size="11" fill="#555">四步闭合，环长 = 4，合法。</text>

  <text x="50" y="304" font-size="11" font-weight="bold" fill="#b85450">第 4 步关键：</text>
  <text x="50" y="322" font-size="11" fill="#444">从 (2,1) 向上看 (1,1) ——已访问，且 (1,1) ≠ 父 (2,2)</text>
  <text x="50" y="340" font-size="11" fill="#444">→ 这是一条回边，闭合出长度为 4 的环，立即返回 true。</text>

  <!-- legend -->
  <g filter="url(#sk)"><rect x="380" y="248" width="18" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="404" y="259" font-size="10" fill="#444">已访问</text>
  <g filter="url(#sk)"><rect x="380" y="268" width="18" height="14" rx="2" fill="#e6f4ea" stroke="#d6a040" stroke-width="2"/></g>
  <text x="404" y="279" font-size="10" fill="#444">当前格子</text>
  <line x1="380" y1="294" x2="398" y2="294" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="404" y="298" font-size="10" fill="#444">树边</text>
  <line x1="380" y1="312" x2="398" y2="312" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="404" y="316" font-size="10" fill="#444">回边(→环)</text>
</svg>
