<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">从右向左单调栈：栈存"3"候选，s3 记最大"2"候选</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">栈递减（底→顶），x 大于栈顶则弹出栈顶当"2"，x 当"3"</text>

  <!-- ===== scan direction arrow ===== -->
  <text x="40" y="78" font-size="11" fill="#888" font-weight="bold">扫描方向</text>
  <path d="M 470 84 L 130 84" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="10" fill="#888">从右向左（先遇"2"位置，后遇"3"位置）</text>

  <!-- ===== current element x ===== -->
  <text x="40" y="124" font-size="11" fill="#d6a040" font-weight="bold">当前 x = nums[i]</text>
  <rect x="120" y="108" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="152" y="135" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">x</text>
  <text x="152" y="166" text-anchor="middle" font-size="9" fill="#d6a040">位置 i（更靠左）</text>

  <!-- ===== decision: x < s3 ? ===== -->
  <path d="M 190 128 L 232 128" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="240,108 300,128 240,148" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="258" y="125" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x &lt; s3 ?</text>
  <text x="258" y="138" text-anchor="middle" font-size="8" fill="#b85450">判"1"</text>

  <!-- yes branch: return true -->
  <path d="M 300 128 L 350 128" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="325" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="354" y="108" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="439" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x 当"1"，s3 当"2"</text>
  <text x="439" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ return true</text>

  <!-- no branch: down to pop/push -->
  <path d="M 258 152 L 258 188" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="174" font-size="9" fill="#666" font-weight="bold">否</text>

  <!-- ===== while pop ===== -->
  <rect x="150" y="192" width="216" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="258" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while 栈非空 且 x &gt; 栈顶：</text>
  <text x="258" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a">s3 = 栈顶.pop()　← 栈顶当"2"，x 当"3"</text>

  <!-- ===== Stack ===== -->
  <text x="40" y="270" font-size="11" fill="#b85450" font-weight="bold">栈（存"3"候选）</text>
  <text x="40" y="284" font-size="9" fill="#888">底→顶递减</text>

  <!-- stack base label -->
  <text x="160" y="288" font-size="9" fill="#888">底</text>
  <!-- stack cells (decreasing bottom to top): 4, 2 -->
  <rect x="120" y="292" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="312" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="208" y="312" font-size="9" fill="#888">大</text>

  <rect x="120" y="324" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="344" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="208" y="344" font-size="9" fill="#888">小←栈顶</text>
  <text x="160" y="368" text-anchor="middle" font-size="9" fill="#888">栈顶最小，x 比它大就弹出</text>

  <!-- pop arrow from stack top to s3 -->
  <path d="M 200 339 Q 280 360 360 372" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">弹出 → 当"2"</text>

  <!-- ===== s3 box ===== -->
  <text x="380" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">s3（最大"2"候选）</text>
  <text x="380" y="284" font-size="9" fill="#888">= max(被弹元素)</text>
  <rect x="380" y="292" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="324" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">s3</text>
  <text x="440" y="356" text-anchor="middle" font-size="9" fill="#4a7a3a">取最大放宽"1"的门槛</text>

  <!-- push x back to stack -->
  <path d="M 152 166 Q 100 220 140 290" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="232" font-size="9" fill="#d6a040" font-weight="bold">push(x)</text>
  <text x="96" y="244" font-size="8" fill="#d6a040">x 成新"3"候选</text>

  <!-- ===== summary ===== -->
  <rect x="30" y="386" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="406" font-size="10" fill="#4a7a3a" font-weight="bold">两张信息源：① 栈内元素 = "3"候选　② 被弹出的 s3 = "2"候选</text>
  <text x="50" y="422" font-size="10" fill="#555">x 比 s3 小 → x 是"1"；x 比栈顶大 → 弹栈顶当"2"、x 当"3"，s3 取弹出的最大</text>
</svg>
