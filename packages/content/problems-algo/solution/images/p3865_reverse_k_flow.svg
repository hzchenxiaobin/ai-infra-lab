<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层逐块，内层双指针 swap 收缩</text>

  <!-- 开始 -->
  <rect x="196" y="40" width="128" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：m = n / k</text>

  <path d="M 260 66 L 260 80" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取块定界 -->
  <rect x="176" y="84" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取块 b：l = b·m，r = l + m − 1</text>

  <path d="M 260 110 L 260 124" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：l < r ? -->
  <polygon points="260,128 326,150 260,172 194,150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">l &lt; r ?</text>

  <!-- 是：swap -->
  <path d="M 194 150 L 166 150" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="36" y="135" width="126" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="147" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">swap(nums[l], nums[r])</text>
  <text x="99" y="159" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">l++ ，r−−</text>

  <!-- 内层回边 -->
  <path d="M 99 135 L 99 112 L 260 112 L 260 124" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：下一块判断 -->
  <path d="M 260 172 L 260 190" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="186" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 菱形2：还有块？ -->
  <polygon points="260,194 324,216 260,238 196,216" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">还有块？</text>

  <!-- 外层回边 -->
  <path d="M 324 216 L 436 216 L 436 97 L 350 97" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 260 238 L 260 254" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="250" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="196" y="258" width="128" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 nums</text>

  <!-- 底部注释 -->
  <rect x="60" y="298" width="400" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="317" font-size="10.5" fill="#a0433f" filter="url(#rough2)">· 复杂度：swap 合计约 n/2 次 → O(n) 时间、O(1) 空间</text>
  <text x="78" y="336" font-size="10.5" fill="#a0433f" filter="url(#rough2)">· 不变量：[l..r] 外侧已就位，l ≥ r 时整块反转完毕</text>
</svg>
