<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：paths = [["London","New York"],["New York","Lima"],["Lima","Sao Paulo"]]</text>

  <!-- ===== Phase 1 ===== -->
  <rect x="40" y="42" width="560" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="59" font-size="12" fill="#446688" font-weight="bold">阶段①　建集合：把每条 path 的 cityAi 加入 starts</text>

  <!-- header -->
  <text x="60" y="88" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="110" y="88" font-size="11" fill="#888" font-weight="bold">path[i]</text>
  <text x="370" y="88" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="490" y="88" font-size="11" fill="#888" font-weight="bold">starts</text>
  <line x1="44" y1="94" x2="596" y2="94" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="114" font-size="11.5" fill="#333">0</text>
  <text x="110" y="114" font-size="11.5" fill="#333">[London, New York]</text>
  <text x="370" y="114" font-size="11.5" fill="#4a7a3a">+ London</text>
  <text x="490" y="114" font-size="11.5" fill="#333">{London}</text>
  <line x1="44" y1="122" x2="596" y2="122" stroke="#e2e2e2" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="60" y="142" font-size="11.5" fill="#333">1</text>
  <text x="110" y="142" font-size="11.5" fill="#333">[New York, Lima]</text>
  <text x="370" y="142" font-size="11.5" fill="#4a7a3a">+ New York</text>
  <text x="490" y="142" font-size="11.5" fill="#333">{London, New York}</text>
  <line x1="44" y1="150" x2="596" y2="150" stroke="#e2e2e2" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="60" y="170" font-size="11.5" fill="#333">2</text>
  <text x="110" y="170" font-size="11.5" fill="#333">[Lima, Sao Paulo]</text>
  <text x="370" y="170" font-size="11.5" fill="#4a7a3a">+ Lima</text>
  <text x="490" y="170" font-size="11.5" fill="#333">{London, NY, Lima}</text>

  <!-- arrow down to phase 2 -->
  <path d="M 320 184 L 320 198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2 ===== -->
  <rect x="40" y="202" width="560" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="219" font-size="12" fill="#4a7a3a" font-weight="bold">阶段②　查终点：扫每条 path 的 cityBi，找不在 starts 里的</text>

  <!-- header -->
  <text x="60" y="248" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="110" y="248" font-size="11" fill="#888" font-weight="bold">cityBi</text>
  <text x="270" y="248" font-size="11" fill="#888" font-weight="bold">∈ starts ?</text>
  <text x="410" y="248" font-size="11" fill="#888" font-weight="bold">动作</text>
  <text x="540" y="248" font-size="11" fill="#888" font-weight="bold">结果</text>
  <line x1="44" y1="254" x2="596" y2="254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="274" font-size="11.5" fill="#333">0</text>
  <text x="110" y="274" font-size="11.5" fill="#333">New York</text>
  <text x="270" y="274" font-size="11.5" fill="#b85450">是</text>
  <text x="410" y="274" font-size="11.5" fill="#888">跳过</text>
  <text x="540" y="274" font-size="11.5" fill="#888">—</text>
  <line x1="44" y1="282" x2="596" y2="282" stroke="#e2e2e2" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="60" y="302" font-size="11.5" fill="#333">1</text>
  <text x="110" y="302" font-size="11.5" fill="#333">Lima</text>
  <text x="270" y="302" font-size="11.5" fill="#b85450">是</text>
  <text x="410" y="302" font-size="11.5" fill="#888">跳过</text>
  <text x="540" y="302" font-size="11.5" fill="#888">—</text>
  <line x1="44" y1="310" x2="596" y2="310" stroke="#e2e2e2" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- r2 (highlighted: found) -->
  <rect x="44" y="316" width="552" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="110" y="334" font-size="11.5" fill="#333" font-weight="bold">Sao Paulo</text>
  <text x="270" y="334" font-size="11.5" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="410" y="334" font-size="11.5" fill="#4a7a3a" font-weight="bold">命中终点</text>
  <text x="540" y="334" font-size="11.5" fill="#d6a040" font-weight="bold">"Sao Paulo"</text>

  <!-- result box -->
  <rect x="120" y="362" width="400" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">终点 = "Sao Paulo"（唯一不在 starts 中的 cityBi）</text>
  <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#888">输入顺序恰好与路径顺序一致，但算法不依赖此假设（见下方示例 2）</text>

  <!-- footer note for example 2 -->
  <rect x="40" y="426" width="560" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="446" font-size="11.5" fill="#446688" font-weight="bold">对照示例 2：paths = [["B","C"],["D","B"],["C","A"]]</text>
  <text x="56" y="464" font-size="11" fill="#555">starts = {B, D, C}；扫 cityBi：C∈starts(跳)、B∈starts(跳)、A∉starts ⟹ 返回 "A"</text>
  <text x="56" y="479" font-size="10.5" fill="#888">输入中 D→B 这条排在第二，路径顺序被打乱——集合法只看「是否作为出发站」，与输入顺序无关</text>
</svg>
