<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：单趟计数 + 一步公式</text>

  <!-- Side note -->
  <rect x="390" y="48" width="155" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="467" y="70" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">顺序无关：</text>
  <text x="467" y="86" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">终点只由 L、R、U</text>
  <text x="467" y="102" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">三个计数决定</text>

  <!-- Start -->
  <rect x="235" y="46" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 280 78 L 280 96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Scan -->
  <rect x="170" y="100" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">单趟扫描 i = 0 … n−1</text>

  <path d="M 280 136 L 280 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="280,156 366,196 280,236 194,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">moves[i] ?</text>

  <!-- Branch arrows + labels -->
  <path d="M 194 196 Q 140 196, 138 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 236 L 280 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 366 196 Q 420 196, 422 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="158" y="186" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">'L'</text>
  <text x="298" y="248" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">'_'</text>
  <text x="400" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">'R'</text>

  <!-- Counter boxes -->
  <rect x="85" y="254" width="105" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="137" y="276" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L++（向左）</text>

  <rect x="228" y="254" width="105" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">U++（自由）</text>

  <rect x="370" y="254" width="105" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">R++（向右）</text>

  <!-- Converge arrows -->
  <path d="M 137 288 Q 137 322, 240 330" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 288 L 280 322" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 288 Q 422 322, 320 330" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="160" y="336" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = |L − R| + U</text>

  <path d="M 280 374 L 280 390" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="225" y="394" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
</svg>
