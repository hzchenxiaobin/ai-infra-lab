<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">祖父节点值为偶数的节点和：跳一代判定</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">祖父 = 父亲的父亲；祖父值为偶数 → 把当前节点值累加</text>

  <!-- ===== Tree ===== -->
  <g font-size="12">
    <!-- edges -->
    <line x1="300" y1="80" x2="195" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="300" y1="80" x2="410" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="195" y1="150" x2="125" y2="218" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="195" y1="150" x2="235" y2="218" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="410" y1="150" x2="350" y2="218" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="410" y1="150" x2="470" y2="218" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="125" y1="230" x2="90" y2="298" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="235" y1="230" x2="210" y2="298" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="235" y1="230" x2="290" y2="298" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="470" y1="230" x2="495" y2="298" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- grandparent→grandchild dashed arrows (skip a generation) -->
    <path d="M 300 80 Q 80 180 125 218" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 3" filter="url(#rough2)" marker-end="url(#arr)"/>
    <path d="M 410 150 Q 560 230 495 298" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 3" filter="url(#rough2)" marker-end="url(#arr)"/>

    <!-- depth 0: root 6 (even → grandparent trigger) -->
    <circle cx="300" cy="72" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="300" y="77" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>

    <!-- depth 1: 7 (odd, not trigger), 8 (even, trigger) -->
    <circle cx="195" cy="142" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="195" y="147" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <circle cx="410" cy="142" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="410" y="147" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>

    <!-- depth 2: 2,7,1,3 (gp=6 even → summed, red) -->
    <circle cx="125" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="125" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <circle cx="235" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="235" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <circle cx="350" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="350" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <circle cx="470" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="470" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <!-- depth 3: 9(gp=7 odd), 1(gp=7 odd), 4(gp=7 odd), 5(gp=8 even → summed) -->
    <circle cx="90" cy="306" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="90" y="311" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <circle cx="210" cy="306" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="311" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="290" cy="306" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="290" y="311" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <circle cx="495" cy="306" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="495" y="311" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- annotations -->
  <text x="300" y="100" text-anchor="middle" font-size="9" fill="#d6a040">偶数祖父</text>
  <text x="410" y="170" text-anchor="middle" font-size="9" fill="#d6a040">偶数祖父</text>
  <text x="125" y="256" text-anchor="middle" font-size="9" fill="#b85450">+2</text>
  <text x="235" y="256" text-anchor="middle" font-size="9" fill="#b85450">+7</text>
  <text x="350" y="256" text-anchor="middle" font-size="9" fill="#b85450">+1</text>
  <text x="470" y="256" text-anchor="middle" font-size="9" fill="#b85450">+3</text>
  <text x="495" y="336" text-anchor="middle" font-size="9" fill="#b85450">+5</text>

  <!-- sum bracket -->
  <text x="300" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 + 7 + 1 + 3 + 5 = 18</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="380" width="170" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <circle cx="52" cy="404" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="52" y="408" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">6</text>
  <text x="72" y="408" font-size="10" fill="#333">偶数值节点</text>
  <text x="72" y="424" font-size="9" fill="#888">作为祖父时触发累加</text>
  <path d="M 42 442 L 60 442" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="72" y="446" font-size="9" fill="#888">祖父→孙（跨代）</text>

  <rect x="215" y="380" width="170" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <circle cx="237" cy="404" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="237" y="408" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>
  <text x="257" y="408" font-size="10" fill="#333">被累加节点</text>
  <text x="257" y="424" font-size="9" fill="#888">祖父值为偶数</text>
  <text x="257" y="440" font-size="9" fill="#888">→ ans += N</text>

  <rect x="400" y="380" width="170" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <circle cx="422" cy="404" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="408" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">N</text>
  <text x="442" y="408" font-size="10" fill="#333">普通节点</text>
  <text x="442" y="424" font-size="9" fill="#888">祖父不存在或</text>
  <text x="442" y="440" font-size="9" fill="#888">祖父值为奇数</text>
</svg>
