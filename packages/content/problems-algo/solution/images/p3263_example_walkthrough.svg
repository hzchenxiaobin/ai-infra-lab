<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：head = [1,2,3,4,3,2,1]，ans 逐轮生长</text>

  <!-- 表头 -->
  <rect x="40" y="52" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="71" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">轮次</text>
  <text x="160" y="71" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">curr 指向</text>
  <text x="270" y="71" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">动作</text>
  <text x="402" y="71" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans（逐轮生长）</text>

  <!-- 终止行高亮 -->
  <rect x="41" y="304" width="438" height="28" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <path d="M40,80 L480,80" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,108 L480,108" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,136 L480,136" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,164 L480,164" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,192 L480,192" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,220 L480,220" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,248 L480,248" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,276 L480,276" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,304 L480,304" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M40,332 L480,332" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <path d="M105,52 L105,332" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M215,52 L215,332" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M325,52 L325,332" stroke="#b8c0c8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="52" width="440" height="280" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <text x="72" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始</text>
  <text x="160" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">head</text>
  <text x="270" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">出发准备</text>
  <text x="402" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[ ]</text>

  <text x="72" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点 1</text>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 1，前进</text>
  <text x="402" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>

  <text x="72" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点 2</text>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 2，前进</text>
  <text x="402" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>

  <text x="72" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点 3</text>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 3，前进</text>
  <text x="402" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3]</text>

  <text x="72" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点 4</text>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 4，前进</text>
  <text x="402" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3,4]</text>

  <text x="72" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">节点 3</text>
  <text x="270" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 3，前进</text>
  <text x="402" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3,4,3]</text>

  <text x="72" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="160" y="266" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">节点 2</text>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 2，前进</text>
  <text x="402" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3,4,3,2]</text>

  <text x="72" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">节点 1</text>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收 1，前进</text>
  <text x="402" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3,4,3,2,1]</text>

  <text x="72" y="322" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">终止</text>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">∅</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">判空退出</text>
  <text x="402" y="322" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">返回 [1,2,3,4,3,2,1]</text>

  <!-- 注释 -->
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红色行：值 3、2、1 与前 3 轮重复——照收不误，ans 装的是节点序列，不是去重值域</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 8 次判空（curr = ∅）触发退出：全程恰好 7 轮，指针只进不退</text>
</svg>
