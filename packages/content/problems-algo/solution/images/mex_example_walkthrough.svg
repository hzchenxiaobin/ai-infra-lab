<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <!-- ============ Panel 1: Example 1 ============ -->
  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：value = 5，nums = [1,−10,7,13,6,8]</text>
  <text x="290" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">余数映射：1→r1   −10→r0   7→r2   13→r3   6→r1   8→r3</text>

  <!-- cnt header -->
  <text x="100" y="70" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt[r]=</text>
  <text x="182" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="236" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="344" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="398" y="70" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <!-- residue header -->
  <text x="100" y="86" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">r=</text>
  <text x="182" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="236" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="290" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="344" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="398" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>

  <!-- level 0 -->
  <rect x="158" y="92" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="212" y="92" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="266" y="92" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="92" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="374" y="92" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4 ✗</text>

  <!-- level 1 -->
  <rect x="158" y="134" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5 ✗</text>
  <rect x="212" y="134" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="266" y="134" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7 ✗</text>
  <rect x="320" y="134" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="374" y="134" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">9 ✗</text>

  <text x="290" y="194" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">min_cnt = 0，首个空余数 r = 4 → MEX = 0 × 5 + 4 = 4 ✓</text>

  <!-- divider -->
  <path d="M40,214 L540,214" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ============ Panel 2: Example 2 ============ -->
  <text x="290" y="238" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2：value = 7，同一 nums</text>
  <text x="290" y="258" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">余数映射：1→r1   −10→r4   7→r0   13→r6   6→r6   8→r1</text>

  <!-- cnt header -->
  <text x="96" y="278" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt[r]=</text>
  <text x="142" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="192" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="242" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="292" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="342" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="392" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="442" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <!-- residue header -->
  <text x="96" y="294" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">r=</text>
  <text x="142" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="192" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="242" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="292" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="342" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="392" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="442" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">6</text>

  <!-- level 0 -->
  <rect x="120" y="300" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="300" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="300" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <rect x="270" y="300" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 ✗</text>
  <rect x="320" y="300" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="370" y="300" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5 ✗</text>
  <rect x="420" y="300" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- level 1 -->
  <rect x="120" y="338" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="360" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7 ✗</text>
  <rect x="170" y="338" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="220" y="338" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="360" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">9 ✗</text>
  <rect x="270" y="338" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="360" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10 ✗</text>
  <rect x="320" y="338" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="360" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">11 ✗</text>
  <rect x="370" y="338" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="360" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">12 ✗</text>
  <rect x="420" y="338" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>

  <text x="290" y="394" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">min_cnt = 0，首个空余数 r = 2 → MEX = 0 × 7 + 2 = 2 ✓</text>
</svg>
