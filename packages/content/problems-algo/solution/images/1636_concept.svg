<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按频率升序排序：统计频次 → 自定义排序键 (freq↑, val↓) → 展开</text>

  <!-- 输入数组 -->
  <text x="100" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 nums</text>
  <rect x="30" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="110" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="150" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="190" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="230" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- 统计频次箭头 -->
  <path d="M135 100 L135 128" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="175" y="118" font-size="9.5" fill="#446688" font-weight="bold">统计频次</text>

  <!-- 频率表 -->
  <rect x="30" y="130" width="260" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">频率表 freq（哈希计数）</text>
  <rect x="50" y="160" width="80" height="24" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="176" text-anchor="middle" font-size="10" fill="#888">值</text>
  <rect x="130" y="160" width="80" height="24" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="10" fill="#888">频次</text>
  <rect x="50" y="184" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="199" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="184" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="199" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="50" y="206" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="221" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="130" y="206" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="221" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="50" y="228" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="243" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <rect x="130" y="228" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="243" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 排序键说明 -->
  <path d="M295 185 L345 185" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="177" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">排序</text>

  <rect x="350" y="130" width="260" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">自定义排序键</text>
  <text x="480" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">key = (freq[x], -x)</text>
  <rect x="370" y="182" width="220" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="197" font-size="9.5" fill="#4a7a3a">第 1 键：freq ↑ 升序</text>
  <rect x="370" y="204" width="220" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="219" font-size="9.5" fill="#b85450">第 2 键：-x ↑ = val ↓ 降序</text>
  <text x="480" y="236" text-anchor="middle" font-size="9" fill="#888">同频次时数值大的排前</text>

  <!-- 排序后展开 -->
  <path d="M160 244 L160 272" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="262" font-size="9.5" fill="#b85450" font-weight="bold">按排序键展开</text>

  <!-- 输出数组 -->
  <text x="100" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 ans</text>
  <rect x="30" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="70" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="316" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="110" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="316" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="150" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="190" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="316" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="230" y="296" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="316" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 频次分组标注 -->
  <path d="M50 328 L50 348" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M50 348 L250 348" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M250 348 L250 328" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="50" y="362" font-size="9" fill="#4a7a3a">freq=1</text>
  <text x="150" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">freq=2</text>
  <text x="250" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">freq=3</text>

  <!-- 底部要点 -->
  <rect x="30" y="380" width="580" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">核心要点</text>
  <text x="50" y="420" font-size="10.5" fill="#333">① 用哈希表统计每个值的出现频次，O(n) 一次遍历</text>
  <text x="50" y="436" font-size="10.5" fill="#333">② 排序键为二元组 (freq, -val)：频次升序优先，同频次时数值降序</text>
  <text x="370" y="420" font-size="10.5" fill="#333">③ -val 技巧：对 val 取负</text>
  <text x="370" y="436" font-size="10.5" fill="#333">   把"降序"统一成"升序"</text>
</svg>
