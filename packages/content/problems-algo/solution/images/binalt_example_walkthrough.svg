<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：异或 + 判全 1</text>

  <!-- ===== Case 1: n=5 (101) → true ===== -->
  <text x="40" y="54" font-size="11.5" fill="#4a7a3a" font-weight="bold">例1: n=5</text>

  <!-- n = 101 -->
  <text x="40" y="76" font-size="11" fill="#333" font-weight="bold">n</text>
  <rect x="170" y="60" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="77" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="208" y="60" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="77" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="246" y="60" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="77" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <text x="290" y="76" font-size="10.5" fill="#4a7a3a" font-weight="bold">1,0,1 相邻皆异</text>

  <path d="M 188 84 Q 188 90 188 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="94" font-size="10" fill="#888">⊕(n&gt;&gt;1)</text>

  <!-- x = 111 -->
  <text x="40" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">x</text>
  <rect x="170" y="100" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="117" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="208" y="100" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="117" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="246" y="100" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="117" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="290" y="116" font-size="10.5" fill="#4a7a3a" font-weight="bold">全 1（=7）</text>

  <path d="M 188 124 Q 188 130 188 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="134" font-size="10" fill="#888">+1</text>

  <!-- x+1 = 1000 -->
  <text x="40" y="156" font-size="11" fill="#d6a040" font-weight="bold">x+1</text>
  <rect x="170" y="140" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="157" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="208" y="140" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="157" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="246" y="140" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="157" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="284" y="140" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="157" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="328" y="156" font-size="10.5" fill="#d6a040" font-weight="bold">进位穿透全 1→单 1</text>

  <line x1="170" y1="168" x2="320" y2="168" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">&amp;</text>

  <!-- result = 0000 -->
  <text x="40" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <rect x="170" y="176" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="193" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="208" y="176" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="193" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="246" y="176" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="193" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="284" y="176" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="193" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="328" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">== 0 → true ✓</text>

  <!-- divider -->
  <line x1="40" y1="214" x2="500" y2="214" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Case 2: n=11 (1011) → false ===== -->
  <text x="40" y="238" font-size="11.5" fill="#b85450" font-weight="bold">例2: n=11</text>

  <!-- n = 1011 -->
  <text x="40" y="260" font-size="11" fill="#333" font-weight="bold">n</text>
  <rect x="170" y="244" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="261" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="208" y="244" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="261" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="246" y="244" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="261" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="244" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="261" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="260" font-size="10.5" fill="#b85450" font-weight="bold">末两位同为 1</text>

  <path d="M 188 268 Q 188 274 188 280" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="278" font-size="10" fill="#888">⊕(n&gt;&gt;1)</text>

  <!-- x = 1110 (has 0 gap at bit0) -->
  <text x="40" y="300" font-size="11" fill="#b85450" font-weight="bold">x</text>
  <rect x="170" y="284" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="301" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="208" y="284" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="301" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="246" y="284" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="301" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="284" y="284" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="301" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">0</text>
  <text x="328" y="300" font-size="10.5" fill="#b85450" font-weight="bold">有 0 缺口（=14）</text>

  <path d="M 188 308 Q 188 314 188 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="318" font-size="10" fill="#888">+1</text>

  <!-- x+1 = 1111 -->
  <text x="40" y="340" font-size="11" fill="#d6a040" font-weight="bold">x+1</text>
  <rect x="170" y="324" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="341" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="208" y="324" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="341" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="246" y="324" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="341" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="284" y="324" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="341" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="328" y="340" font-size="10.5" fill="#d6a040" font-weight="bold">只填最低 0，高位 1 保留</text>

  <line x1="170" y1="352" x2="320" y2="352" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="356" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">&amp;</text>

  <!-- result = 1110 ≠ 0 -->
  <text x="40" y="376" font-size="11" fill="#b85450" font-weight="bold">结果</text>
  <rect x="170" y="360" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="377" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="208" y="360" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="377" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="246" y="360" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="377" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="360" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="302" y="377" text-anchor="middle" font-size="12.5" fill="#4a7a3a">0</text>
  <text x="328" y="376" font-size="11" fill="#b85450" font-weight="bold">≠ 0 → false ✗</text>

  <!-- bottom note -->
  <rect x="50" y="406" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">全 1 ⟺ x+1 是 2 的幂 ⟺ x &amp; (x+1) == 0</text>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#888">有 0 缺口时 +1 只填最低 0，高位 1 不动，AND 必非 0</text>
</svg>
