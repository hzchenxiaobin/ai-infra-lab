<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个用例覆盖「无占位符 / 全填满 / 填一个+追加一个」</text>

  <!-- ===== Example 1 ===== -->
  <rect x="30" y="46" width="500" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="68" font-size="12" fill="#446688" font-weight="bold">示例 1：args 无占位符 —— 全部 newArgs 追加到尾部</text>
  <text x="44" y="90" font-size="12" fill="#446688">args    = [ 2, 4, 6 ]</text>
  <text x="44" y="108" font-size="12" fill="#4a7a3a">newArgs = [ 8, 10 ]</text>
  <text x="44" y="128" font-size="12" fill="#333">→ combined = [2, 4, 6, 8, 10] → fn(...a)=a → <tspan fill="#b85450" font-weight="bold">[2,4,6,8,10]</tspan></text>

  <!-- ===== Example 2 ===== -->
  <rect x="30" y="150" width="500" height="92" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：两个占位符按序填满，无剩余 newArgs</text>
  <text x="44" y="194" font-size="12" fill="#446688">args    = [ 1, 2, <tspan fill="#d6a040" font-weight="bold">_</tspan>, 4, <tspan fill="#d6a040" font-weight="bold">_</tspan>, 6 ]</text>
  <text x="44" y="212" font-size="12" fill="#4a7a3a">newArgs = [ 3, 5 ]</text>
  <text x="44" y="232" font-size="12" fill="#333">→ combined = [1, 2, 3, 4, 5, 6] → <tspan fill="#b85450" font-weight="bold">[1,2,3,4,5,6]</tspan></text>

  <!-- ===== Example 3 ===== -->
  <rect x="30" y="254" width="500" height="92" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="276" font-size="12" fill="#d6a040" font-weight="bold">示例 3：填一个占位符 + 追加一个剩余（fn 真正计算）</text>
  <text x="44" y="298" font-size="12" fill="#446688">args    = [ <tspan fill="#d6a040" font-weight="bold">_</tspan>, 5 ]</text>
  <text x="44" y="316" font-size="12" fill="#4a7a3a">newArgs = [ 5, 20 ]</text>
  <text x="44" y="336" font-size="12" fill="#333">→ combined = [5, 5, 20] → b+a-c = 5+5-20 = <tspan fill="#b85450" font-weight="bold">-10</tspan></text>

  <!-- Bottom note -->
  <rect x="30" y="360" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <text x="44" y="382" font-size="11" fill="#666">三个用例恰好分别触发「只追加 / 只填充 / 填充+追加」三条路径，</text>
  <text x="44" y="400" font-size="11" fill="#666">合起来完整覆盖占位符部分应用的全部语义分支。</text>
</svg>
