<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 3 时间线（t = 70ms）</text>

  <!-- 时间轴 -->
  <line x1="30" y1="230" x2="560" y2="230" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="565" y="235" font-size="11" fill="#446688" filter="url(#rough2)">ms</text>

  <!-- 刻度 50,75,90,120,140,190,260,300,370 -->
  <g font-size="10" fill="#446688">
    <line x1="50" y1="225" x2="50" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="50" y="253" text-anchor="middle" filter="url(#rough2)">50</text>
    <line x1="75" y1="225" x2="75" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="75" y="253" text-anchor="middle" filter="url(#rough2)">75</text>
    <line x1="90" y1="225" x2="90" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="90" y="253" text-anchor="middle" filter="url(#rough2)">90</text>
    <line x1="120" y1="225" x2="120" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="253" text-anchor="middle" filter="url(#rough2)">120</text>
    <line x1="140" y1="225" x2="140" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="253" text-anchor="middle" filter="url(#rough2)">140</text>
    <line x1="190" y1="225" x2="190" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="253" text-anchor="middle" filter="url(#rough2)">190</text>
    <line x1="260" y1="225" x2="260" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="253" text-anchor="middle" filter="url(#rough2)">260</text>
    <line x1="300" y1="225" x2="300" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="253" text-anchor="middle" filter="url(#rough2)">300</text>
    <line x1="370" y1="225" x2="370" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="370" y="253" text-anchor="middle" filter="url(#rough2)">370</text>
  </g>

  <!-- 冷却窗口 1: [50,120] -->
  <rect x="50" y="135" width="70" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="85" y="155" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cooldown 1</text>
  <text x="85" y="170" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">(70ms)</text>

  <!-- 冷却窗口 2: [120,190] -->
  <rect x="120" y="135" width="70" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="155" y="155" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cooldown 2</text>

  <!-- 冷却窗口 3: [190,260] -->
  <rect x="190" y="135" width="70" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="225" y="155" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cooldown 3</text>
  <text x="225" y="170" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">空转结束</text>

  <!-- 冷却窗口 4: [300,370] -->
  <rect x="300" y="135" width="70" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="335" y="155" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cooldown 4</text>
  <text x="335" y="170" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">空转结束</text>

  <!-- 调用 -->
  <g font-size="9">
    <!-- call@50 [1] 首沿 -->
    <rect x="22" y="70" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">call[1]</text>
    <line x1="50" y1="94" x2="50" y2="135" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- call@75 [2] 暂存 -->
    <rect x="47" y="100" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="75" y="113" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">call[2]</text>
    <line x1="75" y1="120" x2="75" y2="135" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

    <!-- call@90 [8] 覆盖暂存 -->
    <rect x="62" y="100" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="90" y="113" text-anchor="middle" font-size="8" font-weight="bold" fill="#d6a040" filter="url(#rough2)">call[8]</text>
    <line x1="90" y1="120" x2="90" y2="135" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="105" y="113" font-size="8" fill="#d6a040" filter="url(#rough2)">←覆盖[2]</text>

    <!-- 尾沿执行@120 [8] -->
    <rect x="92" y="265" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="120" y="281" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">exec[8]</text>
    <line x1="120" y1="238" x2="120" y2="265" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- call@140 [5,7] 暂存 -->
    <rect x="112" y="100" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="140" y="113" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">call[5,7]</text>
    <line x1="140" y1="120" x2="140" y2="135" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

    <!-- 尾沿执行@190 [5,7] -->
    <rect x="162" y="265" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="190" y="281" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">exec[5,7]</text>
    <line x1="190" y1="238" x2="190" y2="265" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- call@300 [9,4] 首沿 -->
    <rect x="272" y="70" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="300" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">call[9,4]</text>
    <line x1="300" y1="94" x2="300" y2="135" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 首沿执行@50 -->
    <rect x="22" y="265" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="50" y="281" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">exec[1]</text>
    <line x1="50" y1="238" x2="50" y2="265" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 首沿执行@300 -->
    <rect x="272" y="265" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="300" y="281" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">exec[9,4]</text>
    <line x1="300" y1="238" x2="300" y2="265" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>

  <!-- 注解 -->
  <text x="85" y="335" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">[2]被[8]覆盖</text>
  <text x="85" y="349" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">尾沿只执行[8]</text>

  <!-- 图例 -->
  <rect x="30" y="365" width="540" height="28" fill="none" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="372" width="12" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="381" font-size="9" fill="#333" filter="url(#rough2)">exec = fn 实际执行</text>
  <rect x="160" y="372" width="12" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="178" y="381" font-size="9" fill="#333" filter="url(#rough2)">call = 冷却中被暂存（只留最后一个）</text>
  <rect x="400" y="372" width="12" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="418" y="381" font-size="9" fill="#333" filter="url(#rough2)">cooldown = 冷却窗口</text>
</svg>
