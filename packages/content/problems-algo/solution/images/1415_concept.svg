<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：开心串的字典序树（n=3 为例）</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">逐位分段：首位 3 组 × 2^(n−1)，后续每位 2 组 × 2^(剩余−1)</text>

  <!-- Root -->
  <g filter="url(#rough2)">
    <rect x="278" y="58" width="44" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root</text>
  </g>

  <!-- Edges root -> level1 -->
  <g stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)">
    <path d="M 300 80 L 95 110"/>
    <path d="M 300 80 L 295 110"/>
    <path d="M 300 80 L 495 110"/>
  </g>

  <!-- Level 1: a, b, c -->
  <g filter="url(#rough2)">
    <rect x="77" y="110" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="95" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
    <rect x="277" y="110" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="295" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
    <rect x="477" y="110" width="36" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="495" y="127" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  </g>

  <!-- Edges level1 -> level2 -->
  <g stroke="#aaa" stroke-width="1.1" fill="none" filter="url(#rough2)">
    <path d="M 95 134 L 45 175"/>
    <path d="M 95 134 L 145 175"/>
    <path d="M 295 134 L 245 175"/>
    <path d="M 295 134 L 345 175"/>
    <path d="M 495 134 L 445 175"/>
    <path d="M 495 134 L 545 175"/>
  </g>

  <!-- Level 2 nodes -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <rect x="29" y="175" width="32" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="45" y="189" text-anchor="middle" fill="#446688">ab</text>
    <rect x="129" y="175" width="32" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="145" y="189" text-anchor="middle" fill="#446688">ac</text>
    <rect x="229" y="175" width="32" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="245" y="189" text-anchor="middle" fill="#4a7a3a">ba</text>
    <rect x="329" y="175" width="32" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="345" y="189" text-anchor="middle" fill="#4a7a3a">bc</text>
    <rect x="429" y="175" width="32" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="445" y="189" text-anchor="middle" fill="#d6a040">ca</text>
    <rect x="529" y="175" width="32" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="545" y="189" text-anchor="middle" fill="#d6a040">cb</text>
  </g>

  <!-- Edges level2 -> leaves -->
  <g stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)">
    <path d="M 45 195 L 20 240"/>
    <path d="M 45 195 L 70 240"/>
    <path d="M 145 195 L 120 240"/>
    <path d="M 145 195 L 170 240"/>
    <path d="M 245 195 L 220 240"/>
    <path d="M 245 195 L 270 240"/>
    <path d="M 345 195 L 320 240"/>
    <path d="M 345 195 L 370 240"/>
    <path d="M 445 195 L 420 240"/>
    <path d="M 445 195 L 470 240"/>
    <path d="M 545 195 L 520 240"/>
    <path d="M 545 195 L 570 240"/>
  </g>

  <!-- Leaves -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="6" y="240" width="28" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="20" y="253" text-anchor="middle" fill="#446688">aba</text>
    <rect x="56" y="240" width="28" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="70" y="253" text-anchor="middle" fill="#446688">abc</text>
    <rect x="106" y="240" width="28" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="120" y="253" text-anchor="middle" fill="#446688">aca</text>
    <rect x="156" y="240" width="28" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="170" y="253" text-anchor="middle" fill="#446688">acb</text>
    <rect x="206" y="240" width="28" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="220" y="253" text-anchor="middle" fill="#4a7a3a">bab</text>
    <rect x="256" y="240" width="28" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="270" y="253" text-anchor="middle" fill="#4a7a3a">bac</text>
    <rect x="306" y="240" width="28" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="320" y="253" text-anchor="middle" fill="#4a7a3a">bca</text>
    <rect x="356" y="240" width="28" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="370" y="253" text-anchor="middle" fill="#4a7a3a">bcb</text>
    <rect x="406" y="237" width="30" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="420" y="253" text-anchor="middle" fill="#b85450" font-weight="bold">cab</text>
    <rect x="456" y="240" width="28" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="470" y="253" text-anchor="middle" fill="#d6a040">cac</text>
    <rect x="506" y="240" width="28" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="520" y="253" text-anchor="middle" fill="#d6a040">cba</text>
    <rect x="556" y="240" width="28" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="570" y="253" text-anchor="middle" fill="#d6a040">cbc</text>
  </g>

  <!-- Grouping brackets level 1 -->
  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 6 268 L 6 280 L 184 280 L 184 268"/>
    <path d="M 206 268 L 206 280 L 384 280 L 384 268"/>
    <path d="M 406 268 L 406 280 L 584 280 L 584 268"/>
  </g>
  <g font-size="11" filter="url(#rough2)">
    <text x="95" y="296" text-anchor="middle" fill="#666">a??：4 个 = 2^(n−1)</text>
    <text x="295" y="296" text-anchor="middle" fill="#666">b??：4 个</text>
    <text x="495" y="296" text-anchor="middle" fill="#d6a040" font-weight="bold">c??：4 个（第 9 个 = cab）</text>
  </g>

  <!-- Formula box -->
  <rect x="20" y="314" width="580" height="114" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="336" font-size="12" fill="#d6a040" font-weight="bold">逐位定位公式（与 60 题 康托尔展开 同构）</text>
  <text x="40" y="356" font-size="12" fill="#444">总数 = 3 · 2^(n−1)；若 k &gt; 总数 → 返回 ""</text>
  <text x="40" y="376" font-size="12" fill="#444">首位：idx = (k−1) // 2^(n−1)，候选 = [a, b, c]</text>
  <text x="40" y="396" font-size="12" fill="#444">后续位：idx = (k−1) // 2^(剩余−1)，候选 = [ch ≠ 前一个字符]</text>
  <text x="40" y="416" font-size="11" fill="#888">取候选[idx] 后，k %= 2^(剩余−1) 滚到子段，循环 n 次即得答案</text>
</svg>
