<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：3 个 term → 排序 → CASE 格式化 → 拼接</text>

  <!-- ===== Example 1 input Terms ===== -->
  <text x="40" y="50" font-size="10.5" fill="#888">输入 Terms 表（顺序任意）：</text>

  <!-- input row 1 -->
  <rect x="40" y="56" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="50" y="72" font-size="10" fill="#446688" font-weight="bold">power=2, factor=1</text>
  <!-- input row 2 -->
  <rect x="200" y="56" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="210" y="72" font-size="10" fill="#b85450" font-weight="bold">power=1, factor=-4</text>
  <!-- input row 3 -->
  <rect x="360" y="56" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="370" y="72" font-size="10" fill="#4a7a3a" font-weight="bold">power=0, factor=2</text>

  <!-- Arrow down -->
  <path d="M 280 84 L 280 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="97" font-size="9.5" fill="#666">① ORDER BY power DESC</text>

  <!-- ===== Formatting table ===== -->
  <rect x="30" y="108" width="500" height="170" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header -->
  <rect x="32" y="110" width="496" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">power</text>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">factor</text>
  <text x="250" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">sign</text>
  <text x="330" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">CASE 分支</text>
  <text x="460" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">term 字符串</text>

  <line x1="110" y1="110" x2="110" y2="278" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="190" y1="110" x2="190" y2="278" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="110" x2="290" y2="278" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="110" x2="400" y2="278" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: power=2, factor=1 (blue) -->
  <rect x="32" y="136" width="496" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="70" y="163" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="163" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="250" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+</text>
  <text x="330" y="158" text-anchor="middle" font-size="9.5" fill="#446688">power &gt; 1</text>
  <text x="330" y="172" text-anchor="middle" font-size="9" fill="#888">+ABS(1)+"X^"+2</text>
  <text x="460" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+1X^2</text>

  <!-- Row 2: power=1, factor=-4 (red) -->
  <rect x="32" y="182" width="496" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="70" y="209" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="209" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">-4</text>
  <text x="250" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-</text>
  <text x="330" y="204" text-anchor="middle" font-size="9.5" fill="#b85450">power = 1</text>
  <text x="330" y="218" text-anchor="middle" font-size="9" fill="#888">-ABS(4)+"X"（省 ^1）</text>
  <text x="460" y="209" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">-4X</text>

  <!-- Row 3: power=0, factor=2 (green) -->
  <rect x="32" y="228" width="496" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="70" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="150" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="250" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="330" y="250" text-anchor="middle" font-size="9.5" fill="#4a7a3a">power = 0</text>
  <text x="330" y="264" text-anchor="middle" font-size="9" fill="#888">+ABS(2)（省 X^0）</text>
  <text x="460" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+2</text>

  <!-- Arrow down to concatenation -->
  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="295" font-size="9.5" fill="#666">② GROUP_CONCAT SEPARATOR ""</text>

  <!-- ===== Concatenation visualization ===== -->
  <rect x="30" y="306" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="44" y="332" font-size="12.5" fill="#d6a040" font-weight="bold">+1X^2</text>
  <text x="104" y="332" font-size="12" fill="#888">+</text>
  <text x="120" y="332" font-size="12.5" fill="#d6a040" font-weight="bold">-4X</text>
  <text x="168" y="332" font-size="12" fill="#888">+</text>
  <text x="184" y="332" font-size="12.5" fill="#d6a040" font-weight="bold">+2</text>
  <text x="220" y="332" font-size="12" fill="#888">=</text>
  <text x="236" y="332" font-size="13" fill="#b85450" font-weight="bold">+1X^2-4X+2</text>
  <text x="478" y="332" font-size="9.5" fill="#888">无分隔符拼接</text>

  <!-- Arrow down -->
  <path d="M 280 352 L 280 370" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="295" y="365" font-size="9.5" fill="#b85450">③ 追加 "=0"</text>

  <!-- ===== Final output ===== -->
  <rect x="110" y="376" width="340" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">equation = "+1X^2-4X+2=0"</text>

  <!-- ===== Divider ===== -->
  <path d="M 40 432 L 520 432" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 compact verification ===== -->
  <text x="280" y="452" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">示例 2 验证：首项 factor 为负 → 开头即 "-"（不省略符号）</text>

  <rect x="40" y="462" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="483" font-size="10" fill="#888">Terms:</text>
  <text x="100" y="483" font-size="10.5" fill="#333">(4,-4)</text>
  <text x="150" y="483" font-size="10" fill="#888">,</text>
  <text x="160" y="483" font-size="10.5" fill="#333">(2,1)</text>
  <text x="205" y="483" font-size="10" fill="#888">,</text>
  <text x="215" y="483" font-size="10.5" fill="#333">(1,-1)</text>
  <text x="250" y="483" font-size="10" fill="#888">→ 降序:</text>
  <text x="300" y="483" font-size="10.5" fill="#d6a040" font-weight="bold">-4X^4</text>
  <text x="340" y="483" font-size="10.5" fill="#d6a040" font-weight="bold">+1X^2</text>
  <text x="380" y="483" font-size="10.5" fill="#d6a040" font-weight="bold">-1X</text>

  <rect x="110" y="500" width="340" height="0" fill="none"/>

  <text x="280" y="510" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">equation = "-4X^4+1X^2-1X=0"</text>
</svg>
