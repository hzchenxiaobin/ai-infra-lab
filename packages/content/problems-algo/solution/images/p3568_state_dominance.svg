<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：状态 (x, y, mask, e) 与支配剪枝</text>

  <!-- 左：网格 -->
  <text x="98" y="45" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝线：5 步直达</text>

  <rect x="30" y="52" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="47" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">S</text>
  <rect x="64" y="52" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="52" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="52" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="86" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="47" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">X</text>
  <rect x="64" y="86" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="86" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">L</text>
  <rect x="132" y="86" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="120" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="47" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">R</text>
  <rect x="64" y="120" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="120" width="34" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="120" width="34" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="149" cy="137" r="4.5" fill="#b85450" filter="url(#rough2)"/>

  <path d="M 47 69 L 149 69 L 149 128" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="98" y="172" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">红点格会被多条路线到达</text>

  <!-- 左下：为什么带 e -->
  <rect x="30" y="192" width="140" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="11.5" fill="#a07818" filter="url(#rough2)">为什么要带 e ？</text>
  <text x="100" y="234" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同一格、同一进度，</text>
  <text x="100" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">能量不同 ⇒ 能走的</text>
  <text x="100" y="266" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">后续完全不同</text>

  <!-- 右：状态构成 -->
  <rect x="196" y="44" width="298" height="204" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="68" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">BFS 状态 (x, y, mask, e)</text>

  <rect x="208" y="80" width="274" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(x, y) 位置 —— 共 m·n ≤ 400 种</text>
  <rect x="208" y="112" width="274" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mask 已收垃圾（位掩码）—— 2^L ≤ 1024 种</text>
  <rect x="208" y="144" width="274" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">e 剩余能量 —— 0..energy ≤ 51 种</text>
  <rect x="208" y="176" width="274" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="345" y="193" text-anchor="middle" font-size="11.5" fill="#a07818" filter="url(#rough2)">步数不入状态 —— BFS 分层隐含</text>

  <rect x="196" y="258" width="298" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="345" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">踏入 'L' ⇒ mask 置 1（再来已是空地）</text>
  <text x="345" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">踏入 'R' ⇒ e 回满 energy（R 上 e 恒为满）</text>

  <!-- 底：支配剪枝 -->
  <rect x="24" y="312" width="472" height="136" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">支配剪枝：best[x][y][mask] = 该 (x, y, mask) 入队过的最大 e</text>

  <rect x="36" y="346" width="148" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="364" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">先到 · 步 5 · e = E−5</text>
  <text x="110" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首访：记入 best</text>

  <rect x="186" y="346" width="148" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">后到 · 步 7 · e = E−7</text>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">e ≤ best ⇒ 剪掉！</text>

  <rect x="336" y="346" width="148" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="364" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">后到 · 步 8 · e = E−3</text>
  <text x="410" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">e &gt; best ⇒ 入队（绕 R）</text>

  <text x="260" y="406" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">依据：从同一格出发沿同一条后续路线，初始能量高的一方全程能量不低于另一方</text>
  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（每步 −1 保序、入 R 同时回满）⇒「步数不晚 + e 不低」者可完全替代另一方</text>
</svg>
