<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">位守恒 + AM-GM → 最小乘积公式</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">交换不改每位 1 的总数；和固定时积最小当最不均</text>

  <!-- left: bit counting -->
  <rect x="34" y="64" width="270" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="86" font-size="13" fill="#446688" font-weight="bold">① 位守恒</text>
  <text x="50" y="108" font-size="11" fill="#444">[1, 2^p−1] 共 2^p−1 个数</text>
  <text x="50" y="128" font-size="11" fill="#444">每个位 i 的 1 总数 = 2^(p−1)</text>
  <text x="50" y="148" font-size="11" fill="#444">（[0,2^p−1] 中各半，0 贡献 0）</text>

  <text x="50" y="174" font-size="11" fill="#b85450" font-weight="bold">2^p−1 = 111..111 用掉每位 1 个</text>
  <text x="50" y="194" font-size="11" fill="#444">每位剩余 = 2^(p−1) − 1 个 1</text>

  <text x="50" y="220" font-size="11" fill="#4a7a3a">剩余 2^p−2 个数重新分配这些 1</text>
  <text x="50" y="240" font-size="10" fill="#888">分配方案须每位计数恰好匹配</text>

  <!-- arrow -->
  <path d="M 314 159 L 344 159" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- right: extreme distribution -->
  <rect x="352" y="64" width="234" height="190" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="86" font-size="13" fill="#4a7a3a" font-weight="bold">② 极端分配（AM-GM）</text>

  <g font-size="11">
    <rect x="368" y="98" width="120" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="428" y="112" text-anchor="middle" fill="#b85450" font-weight="bold">2^p−1 ×1</text>
    <text x="428" y="126" text-anchor="middle" font-size="9" fill="#888">111..111</text>

    <rect x="368" y="140" width="120" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="428" y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">2^p−2 ×(2^(p−1)−1)</text>
    <text x="428" y="168" text-anchor="middle" font-size="9" fill="#888">111..110</text>

    <rect x="368" y="182" width="120" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="428" y="196" text-anchor="middle" fill="#446688" font-weight="bold">1 ×(2^(p−1)−1)</text>
    <text x="428" y="210" text-anchor="middle" font-size="9" fill="#888">000..001</text>
  </g>

  <text x="500" y="112" font-size="10" fill="#888">最大值保留</text>
  <text x="500" y="158" font-size="10" fill="#888">高位聚 1</text>
  <text x="500" y="200" font-size="10" fill="#888">仅留 1 位</text>

  <text x="368" y="234" font-size="10" fill="#4a7a3a">计数：1+2·(2^(p−1)−1)=2^p−1 ✓</text>

  <!-- bottom: AM-GM reasoning -->
  <rect x="34" y="270" width="552" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="13" fill="#444" font-weight="bold">③ AM-GM 论证：为何极端化使乘积最小</text>
  <text x="50" y="316" font-size="11" fill="#444">配对 (x, 2^p−1−x) 固定和 = 2^p−1；积 x·(2^p−1−x) 为凹函数，</text>
  <text x="50" y="332" font-size="11" fill="#444">在端点 x=1 处取最小值 2^p−2。位交换可同时让所有对达到此极端。</text>

  <!-- final formula -->
  <rect x="34" y="354" width="552" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = (2^p − 1) · (2^p − 2)^(2^(p−1) − 1)  mod (10^9+7)</text>
  <text x="310" y="404" text-anchor="middle" font-size="11" fill="#888">对数 = 2^(p−1)−1；用快速幂 O(log exp) 求解</text>
</svg>
