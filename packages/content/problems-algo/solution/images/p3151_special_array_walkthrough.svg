<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三组输入的判定轨迹</text>

  <text x="118" y="58" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① nums = [2, 1, 4]</text>

  <rect x="118" y="66" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="147" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <rect x="194" y="66" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="223" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇</text>

  <rect x="270" y="66" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="299" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="299" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <circle cx="185" cy="93" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <circle cx="261" cy="93" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="185" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2⊕1=3，末位 1 ✓</text>
  <text x="261" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1⊕4=5，末位 1 ✓</text>

  <rect x="412" y="80" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="100" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <text x="118" y="178" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② nums = [4, 3, 1, 6]</text>

  <rect x="118" y="186" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="212" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="147" y="230" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <rect x="194" y="186" width="58" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="212" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="223" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">奇</text>

  <rect x="270" y="186" width="58" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="212" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="299" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">奇</text>

  <rect x="346" y="186" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="375" y="212" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="375" y="230" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <circle cx="185" cy="213" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <circle cx="261" cy="213" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="261" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <circle cx="337" cy="213" r="9" fill="#ffffff" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="337" y="217" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">?</text>

  <text x="185" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4⊕3=7，末位 1 ✓</text>
  <text x="261" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3⊕1=2，末位 0 ✗</text>
  <text x="337" y="262" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">不再检查</text>

  <rect x="412" y="200" width="66" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="220" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <text x="240" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">首个违规即返回——后面的 (1,6) 根本不看（提前退出）</text>

  <text x="118" y="322" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ nums = [1]</text>

  <rect x="118" y="330" width="58" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="356" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="147" y="374" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇</text>

  <text x="200" y="364" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">没有相邻对 → 条件「空真」</text>

  <rect x="412" y="341" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="361" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
</svg>
