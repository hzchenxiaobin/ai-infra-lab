<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n=7 递归分解树（绿色 = 命中缓存）</text>

  <!-- Level 0: n=7 -->
  <rect x="240" y="38" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[7]</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#888">拆分 i=1,3,5</text>

  <!-- Level 1: splits (1,5), (3,3), (5,1) -->
  <line x1="262" y1="82" x2="130" y2="102" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="280" y1="82" x2="280" y2="102" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="298" y1="82" x2="430" y2="102" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="70" y="102" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="130" y="119" text-anchor="middle" font-size="11" fill="#333">i=1 → (1, 5)</text>

  <rect x="225" y="102" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="11" fill="#333">i=3 → (3, 3)</text>

  <rect x="370" y="102" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="430" y="119" text-anchor="middle" font-size="11" fill="#333">i=5 → (5, 1)</text>

  <!-- Level 2: subproblems -->
  <line x1="100" y1="126" x2="75" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="160" y1="126" x2="135" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="260" y1="126" x2="235" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="126" x2="325" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="126" x2="395" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="460" y1="126" x2="495" y2="148" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- n=1 (leaf) -->
  <rect x="40" y="148" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[1]</text>
  <text x="70" y="184" text-anchor="middle" font-size="9" fill="#d6a040">= [叶]</text>

  <!-- n=5 (new) -->
  <rect x="100" y="148" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="135" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[5]</text>
  <text x="135" y="184" text-anchor="middle" font-size="9" fill="#b85450">首次计算</text>

  <!-- n=3 (new) -->
  <rect x="200" y="148" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="235" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[3]</text>
  <text x="235" y="184" text-anchor="middle" font-size="9" fill="#b85450">首次计算</text>

  <!-- n=3 (cached!) -->
  <rect x="290" y="148" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[3]</text>
  <text x="325" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">命中缓存 ✓</text>

  <!-- n=5 (cached!) -->
  <rect x="360" y="148" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="395" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[5]</text>
  <text x="395" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">命中缓存 ✓</text>

  <!-- n=1 (leaf) -->
  <rect x="460" y="148" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="490" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[1]</text>
  <text x="490" y="184" text-anchor="middle" font-size="9" fill="#d6a040">= [叶]</text>

  <!-- Level 3: dp[5] and dp[3] expansions -->
  <line x1="135" y1="172" x2="135" y2="202" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="235" y1="172" x2="235" y2="202" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- dp[5] expands to (1,3) and (3,1) -->
  <rect x="70" y="202" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="135" y="218" text-anchor="middle" font-size="10" fill="#555">i=1→(1,3) ; i=3→(3,1)</text>

  <!-- dp[3] expands to (1,1) -->
  <rect x="180" y="202" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="235" y="218" text-anchor="middle" font-size="10" fill="#555">i=1 → (1, 1)</text>

  <!-- Level 4: dp[3] and dp[1] leaves -->
  <line x1="135" y1="224" x2="135" y2="248" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="235" y1="224" x2="235" y2="248" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="75" y="248" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="135" y="264" text-anchor="middle" font-size="10" fill="#555">dp[3]→dp[1]×2 ; dp[1]×2</text>

  <rect x="175" y="248" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="235" y="264" text-anchor="middle" font-size="10" fill="#555">dp[1] × 2（两个叶节点）</text>

  <!-- Summary box -->
  <rect x="40" y="292" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果数 = 卡塔兰数 C₃ = 5 棵</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#555">dp[1]×1 × dp[5]×2 + dp[3]×1 × dp[3]×1 + dp[5]×2 × dp[1]×1 = 2+1+2 = 5</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[3]、dp[5] 各只计算 1 次，缓存命中直接复用</text>
</svg>
