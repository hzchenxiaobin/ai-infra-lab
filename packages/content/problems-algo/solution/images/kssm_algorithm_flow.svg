<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：小顶堆 k 路归并求第 k 小</text>

  <!-- Box 1 -->
  <rect x="110" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333">① 每行首元素 (val, row, 0) 入小顶堆</text>

  <path d="M 260 86 L 260 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: loop check -->
  <rect x="110" y="104" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="13" fill="#333">② 循环 k 次：</text>
  <text x="260" y="141" text-anchor="middle" font-size="12" fill="#555">弹出堆顶 (val, r, c)</text>

  <path d="M 260 150 L 260 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: c+1 < n ? -->
  <path d="M 260 168 L 330 188 L 260 208 L 190 188 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#333">c + 1 &lt; n ?</text>

  <!-- yes branch -->
  <text x="345" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 330 188 L 360 188 L 360 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="232" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#333">入堆 (matrix[r][c+1], r, c+1)</text>

  <!-- no branch -->
  <text x="150" y="184" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 190 188 L 150 188 L 150 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="232" width="160" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#888">该行已耗尽，跳过</text>

  <!-- merge back -->
  <path d="M 150 264 L 150 282 L 360 282 L 360 264" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- loop back arrow to box 2 -->
  <path d="M 260 282 L 260 300 L 460 300 L 460 126 L 412 126" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="468" y="216" font-size="10" fill="#b85450" font-weight="bold">未到</text>
  <text x="468" y="230" font-size="10" fill="#b85450" font-weight="bold">k 次</text>

  <!-- after loop -->
  <path d="M 260 282 L 260 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="298" font-size="10" fill="#888">已 k 次</text>

  <!-- Box final -->
  <rect x="110" y="308" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③ 返回第 k 次弹出的 val</text>

  <!-- complexity note -->
  <rect x="60" y="356" width="400" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#b85450">时间 O(k log n)，空间 O(n)；堆里始终只存每行当前指针</text>
</svg>
