<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 钉死 x → 一趟扫 y → 兜底无解</text>

  <!-- step 1 -->
  <rect x="36" y="44" width="216" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="61" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 统计频率</text>
  <text x="144" y="77" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">扫一遍 nums：freq[x] += 1</text>

  <path d="M 144 86 L 144 101" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="36" y="103" width="216" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="120" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">② x ← min(nums)</text>
  <text x="144" y="136" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">反证钉死：有解时 x 恒为最小值</text>

  <path d="M 144 145 L 144 160" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="36" y="162" width="216" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="179" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ y 从 x+1 升序扫描</text>
  <text x="144" y="195" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">只看出现过的值（freq[y] &gt; 0）</text>

  <path d="M 144 204 L 144 221" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="144,224 216,254 144,284 72,254" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="258" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold" filter="url(#rough2)">freq[y] ≠ freq[x] ?</text>

  <!-- yes branch -->
  <path d="M 216 254 L 282 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="246" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="284" y="234" width="176" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="372" y="251" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 [x, y]</text>
  <text x="372" y="266" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第一个异频的 y 就是最小 y</text>

  <!-- no branch -->
  <path d="M 144 284 L 144 302" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="153" y="297" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="36" y="302" width="170" height="32" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="121" y="322" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">y ← 下一个值，回到 ③</text>

  <!-- loop back arrow -->
  <path d="M 208 318 C 264 318, 264 183, 254 183" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- exhaust note -->
  <path d="M 121 336 L 121 346" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="354" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">y 扫完仍无 → 返回 [-1,-1]（v₁ 无搭档 ⇒ 全员同频）</text>

  <!-- pitfalls box -->
  <rect x="284" y="44" width="200" height="172" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⚠️ 三个易错点</text>
  <text x="296" y="88" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① v₁ 无搭档时别换更大</text>
  <text x="296" y="103" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">的 x 再试——反证已说明</text>
  <text x="296" y="118" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">全员同频，换谁都失败</text>
  <text x="296" y="142" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② x 是 min(nums)，不是</text>
  <text x="296" y="157" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">nums[0]（首元素 ≠ 最小值）</text>
  <text x="296" y="181" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">③ 扫值域记得跳过未出</text>
  <text x="296" y="196" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">现的值：freq[y] &gt; 0</text>

  <!-- complexity box -->
  <rect x="284" y="292" width="200" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="312" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">时间 O(n + U)，空间 O(U)</text>
  <text x="384" y="328" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">（U = 100 值域；哈希版 O(n + k log k)）</text>
  <text x="384" y="347" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">一趟扫描，无嵌套循环</text>
</svg>
