<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：删边随 t 只增不减，连通块数单调上升</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">f(t) = 移除所有 time ≤ t 的边后的连通块数 · 以示例 2 为例：n=3, edges=[[0,1,2],[1,2,4]], k=3</text>

  <!-- ============ Panel 1: 边随时间消失 ============ -->
  <text x="34" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 边随时间逐条消失</text>

  <g filter="url(#rough2)">
    <line x1="93" y1="99" x2="137" y2="91" stroke="#446688" stroke-width="2.5"/>
    <line x1="163" y1="91" x2="207" y2="99" stroke="#446688" stroke-width="2.5"/>
    <ellipse cx="80" cy="102" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="150" cy="88" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="220" cy="102" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="80" y="106" text-anchor="middle" font-size="10" fill="#2a5a2a">0</text>
    <text x="150" y="92" text-anchor="middle" font-size="10" fill="#2a5a2a">1</text>
    <text x="220" y="106" text-anchor="middle" font-size="10" fill="#2a5a2a">2</text>
    <text x="112" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">time=2</text>
    <text x="190" y="78" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">time=4</text>
    <text x="150" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a">t &lt; 2：1 个分量 {0,1,2}</text>
  </g>

  <path d="M 250 100 L 292 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="84" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">t ↑</text>
  <text x="271" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">删 time≤t</text>

  <g filter="url(#rough2)">
    <line x1="359" y1="106" x2="393" y2="89" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="419" y1="89" x2="453" y2="106" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="378" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
    <text x="434" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
    <ellipse cx="346" cy="110" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="406" cy="84" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="466" cy="110" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="346" y="114" text-anchor="middle" font-size="10" fill="#2a5a2a">0</text>
    <text x="406" y="88" text-anchor="middle" font-size="10" fill="#2a5a2a">1</text>
    <text x="466" y="114" text-anchor="middle" font-size="10" fill="#2a5a2a">2</text>
    <text x="406" y="142" text-anchor="middle" font-size="10" fill="#b85450">t = 4：3 个分量 {0} {1} {2}</text>
  </g>

  <!-- ============ Panel 2: 单调阶梯图 ============ -->
  <text x="34" y="170" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② f(t) 单调不减 ⟹ 二分第一个 f(t) ≥ k 的 t</text>

  <g filter="url(#rough2)">
    <line x1="90" y1="260" x2="460" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="90" y1="220" x2="460" y2="220" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="90" y1="180" x2="460" y2="180" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>

    <path d="M 90 282 L 90 178" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 90 282 L 472 282" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="480" y="286" font-size="10" fill="#888">t</text>
    <text x="80" y="264" text-anchor="end" font-size="10" fill="#666">1</text>
    <text x="80" y="224" text-anchor="end" font-size="10" fill="#666">2</text>
    <text x="80" y="184" text-anchor="end" font-size="10" fill="#666">3</text>
    <text x="110" y="298" text-anchor="middle" font-size="9.5" fill="#666">0</text>
    <text x="190" y="298" text-anchor="middle" font-size="9.5" fill="#666">1</text>
    <text x="270" y="298" text-anchor="middle" font-size="9.5" fill="#666">2</text>
    <text x="350" y="298" text-anchor="middle" font-size="9.5" fill="#666">3</text>
    <text x="430" y="298" text-anchor="middle" font-size="9.5" fill="#666">4</text>
    <text x="34" y="228" font-size="9.5" fill="#888" transform="rotate(-90 34 228)">连通块数 f(t)</text>

    <path d="M 110 260 L 270 260 L 270 220 L 430 220 L 430 180 L 460 180" fill="none" stroke="#4a7a3a" stroke-width="2.5"/>
    <ellipse cx="110" cy="260" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="270" cy="220" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="430" cy="180" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <text x="186" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">f=1</text>
    <text x="346" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">f=2</text>
    <text x="447" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">f=3</text>

    <text x="276" y="244" font-size="8.5" fill="#888">t=2：边(0,1)消失</text>
    <text x="372" y="206" font-size="8.5" fill="#888">t=4：边(1,2)消失</text>

    <line x1="90" y1="180" x2="430" y2="180" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="104" y="172" font-size="10.5" fill="#b85450" font-weight="bold">k = 3</text>

    <line x1="430" y1="180" x2="430" y2="282" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3"/>
    <ellipse cx="430" cy="180" rx="5" ry="5" fill="#d6a040" stroke="#8a6d1f" stroke-width="1.5"/>
    <text x="430" y="318" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">答案 t = 4</text>
  </g>

  <!-- ============ Panel 3: check 定义 ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="336" width="440" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">check(t)：并查集只合并 time &gt; t 的边，comp = n − 成功合并次数，判定 comp ≥ k</text>
    <text x="260" y="376" text-anchor="middle" font-size="10" fill="#33455e">t 增大 ⟹ 删除集合只扩不缩 ⟹ f(t) 单调不减 ⟹ 在 [0, max time] 上二分最小 t（答案 ∈ {0} ∪ {time}）</text>
  </g>
</svg>
