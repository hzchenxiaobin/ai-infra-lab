<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：判可行 → 定目标 → 2n 状态 BFS</text>

  <ellipse cx="260" cy="42" rx="60" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">开始</text>

  <path d="M 260 57 L 260 66" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="68" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">① 一趟扫描：判循环递增 / 循环递减</text>

  <path d="M 260 98 L 260 108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,110 352,138 260,166 168,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">两者皆非？</text>

  <path d="M 352 138 L 386 138" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="366" y="130" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="388" y="122" width="112" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="142" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 166 L 260 176" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="175" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="125" y="178" width="270" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">② 定位目标状态（p = 0 的下标）</text>
  <text x="260" y="208" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">循环递增 → (0, p)；循环递减 → (1, n−1−p)</text>
  <text x="404" y="192" font-size="8.5" fill="#888" filter="url(#rough2)">n ≤ 2 时两族都含目标，</text>
  <text x="404" y="204" font-size="8.5" fill="#888" filter="url(#rough2)">两个距离取 min</text>

  <path d="M 260 216 L 260 226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="228" width="300" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">③ 在 2n 个状态 (t, s) 上 BFS，起点 (0,0)</text>
  <text x="260" y="258" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">左旋：(t,s) → (t, (s+1) mod n)</text>
  <text x="260" y="271" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">反转：(t,s) → (1−t, (n−s) mod n)</text>
  <text x="420" y="245" font-size="8.5" fill="#888" filter="url(#rough2)">每条边 = 1 次操作</text>
  <text x="420" y="257" font-size="8.5" fill="#888" filter="url(#rough2)">BFS 层序 = 最少操作数</text>

  <path d="M 260 276 L 260 286" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="288" width="220" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">④ 答案 = dist(目标状态)</text>

  <path d="M 260 318 L 260 328" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <ellipse cx="260" cy="343" rx="60" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">结束</text>
</svg>
