<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：等长切块 + 每块互为重排 → 块长 L 必是 n 的约数</text>

  <text x="260" y="45" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">s = "abcbcacabbaccba"，n = 15，总计数 cnt = {a:5, b:5, c:5}</text>

  <!-- 原字符串分块 -->
  <rect x="115" y="54" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">abc</text>

  <rect x="181" y="54" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bca</text>

  <rect x="247" y="54" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="76" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cab</text>

  <rect x="313" y="54" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">bac</text>

  <rect x="379" y="54" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="408" y="76" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cba</text>

  <text x="144" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="210" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="276" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="342" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="408" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">12</text>

  <!-- 箭头到排序行 -->
  <path d="M 265 106 L 265 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="278" y="118" font-size="10" fill="#446688" filter="url(#rough2)">块内字母排序对齐</text>

  <!-- 排序后全等 -->
  <rect x="115" y="126" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="181" y="126" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="247" y="126" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="313" y="126" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="379" y="126" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>

  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每块计数向量 = {a:1, b:1, c:1} = cnt ÷ k（k = 5 块），互为 anagram ⟺ 计数全等</text>

  <!-- 观察一 -->
  <rect x="55" y="182" width="410" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">观察一：anagram 不改变长度 → n = k × L → L 必须整除 n</text>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">候选 L 只在 15 的约数 {1, 3, 5, 15} 里挑，n ≤ 10⁵ 时约数至多 128 个</text>

  <!-- 观察二 -->
  <rect x="55" y="242" width="410" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">观察二：k × need[c] = cnt[c] → 每块每种字母恰 cnt[c]/k = 5/5 = 1 个</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">除不尽的候选 O(26) 直接淘汰，昂贵的 O(n) 切块留给幸存者</text>

  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">观察三：L = n（整串一块）永远合法 → 升序枚举约数，首个通过校验的 L 即最小答案</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「先 O(26) 预检、后 O(n) 切块」——便宜的检查先做，是剪枝的黄金次序</text>
</svg>
