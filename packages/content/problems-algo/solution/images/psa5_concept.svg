<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="600" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：JOIN 取单价 → 金额=数量×单价 → 按用户求和 → 按消费额降序输出（并列按 user_id 升序）</text>

  <!-- ===== Sales 表 (5 rows) ===== -->
  <text x="120" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Sales 表（销售记录）</text>
  <rect x="20" y="58" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="73" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="84" y="73" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="140" y="73" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="190" y="73" text-anchor="middle" font-size="9" fill="#446688">quantity</text>
  <rect x="62" y="80" width="44" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="95" text-anchor="middle" font-size="9" fill="#333">1</text><text x="84" y="95" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text><text x="140" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="190" y="95" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="40" y="111" text-anchor="middle" font-size="9" fill="#333">2</text><text x="84" y="111" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text><text x="140" y="111" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="190" y="111" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="40" y="127" text-anchor="middle" font-size="9" fill="#333">3</text><text x="84" y="127" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text><text x="140" y="127" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="190" y="127" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="40" y="143" text-anchor="middle" font-size="9" fill="#333">4</text><text x="84" y="143" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text><text x="140" y="143" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="190" y="143" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="40" y="159" text-anchor="middle" font-size="9" fill="#333">5</text><text x="84" y="159" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text><text x="140" y="159" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="190" y="159" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="62" y1="58" x2="62" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="106" y1="58" x2="106" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="174" y1="58" x2="174" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="20" y1="80" x2="220" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="20" y="58" width="200" height="112" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- ===== Product 表 (3 rows) ===== -->
  <text x="500" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Product 表（单价）</text>
  <rect x="400" y="58" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="73" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="550" y="73" text-anchor="middle" font-size="9" fill="#4a7a3a">price</text>
  <rect x="400" y="80" width="100" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="95" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text><text x="550" y="95" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="450" y="111" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text><text x="550" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">25</text>
  <text x="450" y="127" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text><text x="550" y="127" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">15</text>
  <line x1="500" y1="58" x2="500" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="80" x2="600" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="400" y="58" width="200" height="76" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- JOIN bridge -->
  <path d="M220 114 L396 114" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="308" y="107" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">JOIN ON / USING</text>
  <text x="308" y="128" text-anchor="middle" font-size="8" fill="#d6a040">product_id</text>

  <!-- Down to amount table -->
  <path d="M310 180 L310 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="194" text-anchor="start" font-size="9" fill="#d6a040" font-weight="bold">金额 = quantity × price</text>

  <!-- ===== Amount table (5 rows) ===== -->
  <text x="310" y="214" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">② JOIN 后每笔销售的金额（行内乘积）</text>
  <rect x="120" y="222" width="380" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="236" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="225" y="236" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="290" y="236" text-anchor="middle" font-size="9" fill="#446688">qty</text>
  <text x="345" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">price</text>
  <text x="445" y="236" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">amount = qty×price</text>
  <rect x="417" y="242" width="56" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="256" text-anchor="middle" font-size="9" fill="#333">1</text><text x="225" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="290" y="256" text-anchor="middle" font-size="9" fill="#333">10</text><text x="345" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text><text x="445" y="256" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <text x="160" y="272" text-anchor="middle" font-size="9" fill="#333">2</text><text x="225" y="272" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="290" y="272" text-anchor="middle" font-size="9" fill="#333">1</text><text x="345" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">25</text><text x="445" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">25</text>
  <text x="160" y="288" text-anchor="middle" font-size="9" fill="#333">3</text><text x="225" y="288" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="290" y="288" text-anchor="middle" font-size="9" fill="#333">3</text><text x="345" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text><text x="445" y="288" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">45</text>
  <text x="160" y="304" text-anchor="middle" font-size="9" fill="#333">4</text><text x="225" y="304" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="290" y="304" text-anchor="middle" font-size="9" fill="#333">2</text><text x="345" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text><text x="445" y="304" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">30</text>
  <text x="160" y="320" text-anchor="middle" font-size="9" fill="#333">5</text><text x="225" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="290" y="320" text-anchor="middle" font-size="9" fill="#333">3</text><text x="345" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a">25</text><text x="445" y="320" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">75</text>
  <line x1="195" y1="222" x2="195" y2="332" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="260" y1="222" x2="260" y2="332" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="320" y1="222" x2="320" y2="332" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="222" x2="370" y2="332" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="417" y1="222" x2="417" y2="332" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="120" y1="242" x2="500" y2="242" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="120" y="222" width="380" height="110" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Down to grouped -->
  <path d="M310 342 L310 362" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="356" text-anchor="start" font-size="9" fill="#4a7a3a" font-weight="bold">GROUP BY user_id + SUM(amount)</text>

  <!-- ===== Grouped (3 users) ===== -->
  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">③ 按用户分组求和（spending）</text>
  <rect x="190" y="384" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="398" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="370" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">spending</text>
  <rect x="316" y="404" width="108" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="418" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="370" y="418" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">125</text>
  <text x="250" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="370" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <text x="250" y="454" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="370" y="454" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <line x1="310" y1="384" x2="310" y2="462" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="190" y1="404" x2="430" y2="404" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="190" y="384" width="240" height="78" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Down to sorted output -->
  <path d="M310 472 L310 492" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="486" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold">ORDER BY spending DESC, user_id ASC</text>

  <!-- ===== Final sorted output (3 rows) ===== -->
  <text x="310" y="506" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">④ 排序输出（并列 75 按 user_id 升序 → 102 在 103 前）</text>
  <rect x="190" y="514" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="528" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="370" y="528" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">spending</text>
  <rect x="316" y="534" width="108" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="548" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="370" y="548" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">125</text>
  <text x="250" y="566" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="370" y="566" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <text x="250" y="584" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="370" y="584" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <line x1="310" y1="514" x2="310" y2="592" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="190" y1="534" x2="430" y2="534" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="190" y="514" width="240" height="78" fill="none" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
</svg>
