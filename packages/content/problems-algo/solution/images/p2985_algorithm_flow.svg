<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描双 SUM → 相除 → ROUND 判定进位</text>

  <!-- ① FROM Orders -->
  <rect x="16" y="60" width="104" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">FROM</text>
  <text x="68" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Orders</text>

  <text x="68" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">压缩表 n 行</text>
  <text x="68" y="162" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两个累加器并行</text>

  <!-- ② 两个 SUM -->
  <rect x="150" y="36" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="56" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">SUM(item_count × occ)</text>
  <text x="250" y="76" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">累加器① 总商品数 → 8900</text>

  <rect x="150" y="100" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="120" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">SUM(order_occurrences)</text>
  <text x="250" y="140" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">累加器② 总订单数 → 3300</text>

  <path d="M 122 80 C 132 72, 138 66, 146 62" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 122 106 C 132 114, 138 120, 146 124" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 相除 -->
  <rect x="386" y="56" width="118" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">8900 ÷ 3300</text>
  <text x="445" y="100" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">= 2.6969…</text>
  <text x="445" y="118" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">精确小数除法</text>

  <path d="M 352 60 C 364 60, 372 70, 382 80" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 352 124 C 364 124, 372 114, 382 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ④ ROUND 判定菱形 -->
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ROUND(2.6969…, 2)</text>
  <polygon points="260,188 345,220 260,252 175,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">第 3 位小数</text>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">6 ≥ 5 ?</text>

  <path d="M 445 134 C 445 166, 330 172, 266 186" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <rect x="16" y="202" width="130" height="38" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="81" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否 → 不进位</text>
  <text x="81" y="234" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（如 2.64 → 2.64）</text>
  <path d="M 173 220 L 150 220" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="212" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 是分支 → 输出 -->
  <text x="272" y="268" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是：向上进位</text>
  <path d="M 260 254 L 260 278" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="282" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">average_items_per_order = 2.70</text>
  <text x="270" y="324" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（本题第 3 位是 6，走「是」分支）</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ ROUND 四舍五入 ≠ TRUNCATE 截断（后者得 2.69）</text>
</svg>
