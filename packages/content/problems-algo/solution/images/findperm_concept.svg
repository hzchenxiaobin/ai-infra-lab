<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：D 连续段翻转 = 字典序最小排列</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">初始 [1,2,…,n] 已是全序最小，只需把每个 D 连续段翻转</text>

  <!-- ===== signature row ===== -->
  <text x="40" y="82" font-size="11" fill="#888" font-weight="bold">签名 s</text>
  <g font-size="11" fill="#888" font-weight="bold">
    <text x="110" y="82" text-anchor="middle">D</text>
    <text x="170" y="82" text-anchor="middle">D</text>
    <text x="230" y="82" text-anchor="middle">I</text>
    <text x="290" y="82" text-anchor="middle">D</text>
    <text x="350" y="82" text-anchor="middle">I</text>
    <text x="410" y="82" text-anchor="middle">I</text>
  </g>

  <!-- ===== initial array [1..7] ===== -->
  <text x="40" y="120" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <g font-size="14">
    <rect x="86" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="110" y="120" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="146" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="170" y="120" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="206" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="230" y="120" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="266" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="290" y="120" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <rect x="326" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="350" y="120" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="386" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="410" y="120" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="446" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="470" y="120" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- D segment brackets above initial -->
  <path d="M 110 88 Q 110 74 170 74 Q 230 74 230 88" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">D 段① [0..2]</text>

  <path d="M 290 88 Q 290 74 350 74" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">D 段② [3..4]</text>

  <!-- ===== arrow down ===== -->
  <path d="M 280 142 L 280 162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="156" font-size="10" fill="#888">翻转 D 段</text>

  <!-- ===== result array ===== -->
  <text x="40" y="196" font-size="11" fill="#b85450" font-weight="bold">结果</text>
  <g font-size="14">
    <!-- D段① 翻转后: 3,2,1 (red highlight) -->
    <rect x="86" y="172" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="146" y="172" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="170" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="206" y="172" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="230" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- I kept: 4 (neutral) -->
    <rect x="266" y="172" width="48" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="290" y="196" text-anchor="middle" fill="#999" font-weight="bold">5</text>
    <!-- D段② 翻转后: 5,4 (red highlight) -->
    <rect x="326" y="172" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="350" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <!-- I kept: 6,7 (neutral) -->
    <rect x="386" y="172" width="48" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="410" y="196" text-anchor="middle" fill="#999" font-weight="bold">6</text>
    <rect x="446" y="172" width="48" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="196" text-anchor="middle" fill="#999" font-weight="bold">7</text>
  </g>

  <!-- ===== index axis ===== -->
  <g font-size="9.5" fill="#888">
    <text x="110" y="222" text-anchor="middle">0</text>
    <text x="170" y="222" text-anchor="middle">1</text>
    <text x="230" y="222" text-anchor="middle">2</text>
    <text x="290" y="222" text-anchor="middle">3</text>
    <text x="350" y="222" text-anchor="middle">4</text>
    <text x="410" y="222" text-anchor="middle">5</text>
    <text x="470" y="222" text-anchor="middle">6</text>
  </g>

  <!-- ===== summary box ===== -->
  <rect x="30" y="244" width="500" height="162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="11.5" fill="#d6a040" font-weight="bold">为什么这是字典序最小？</text>

  <text x="50" y="288" font-size="10.5" fill="#555">• 初始 [1,2,…,n] 本就是所有排列中字典序最小的</text>
  <text x="50" y="306" font-size="10.5" fill="#555">• I 关系天然满足（递增），无需改动；只需修复 D 关系</text>
  <text x="50" y="324" font-size="10.5" fill="#555">• D 连续段 [i..j+1] 需递减，原值 {i+1,…,j+2} 翻转即递减</text>
  <text x="50" y="342" font-size="10.5" fill="#555">• 翻转不改变该段的值集合，只重排为递减——最小改动</text>
  <text x="50" y="360" font-size="10.5" fill="#555">• 段间由 I 隔开，翻转互不干扰；左段最大值仍 &lt; 右段最小值</text>
  <text x="50" y="380" font-size="10.5" fill="#b85450" font-weight="bold">例 DDIIDII → [3,2,1,5,4,6,7]：D 段①[1,2,3]→[3,2,1]，D 段②[4,5]→[5,4]</text>
  <text x="50" y="396" font-size="10.5" fill="#4a7a3a" font-weight="bold">验证：3&gt;2&gt;1&lt;5&gt;4&lt;6&lt;7 ✓ 对应 D D I D I I ✓</text>
</svg>
