<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：低 v 位「整块平移」，一条位运算搬完一轮转移</text>

  <rect x="16" y="36" width="158" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 重复值无效</text>
  <text x="95" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">加入 v 后 x ≥ v，</text>
  <text x="95" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同值第二次取必违反 v &gt; x</text>

  <rect x="182" y="36" width="158" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="261" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 序列必严格递增</text>
  <text x="261" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一值 &gt; 当前总和 ≥ 上一值</text>
  <text x="261" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">⇒ 升序做 0-1 背包</text>

  <rect x="348" y="36" width="158" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="427" y="56" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 转移窗口 [v, 2v)</text>
  <text x="427" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取 v 需 x &lt; v（mask 的职责）</text>
  <text x="427" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">源 [0,v) → 新 [v,2v)</text>

  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">以 v=6 为例：mask 圈出读区 [0,6)，左移 6 位落进写区 [6,12)</text>

  <rect x="13" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="47" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="81" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="115" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="149" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="183" y="138" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="217" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="251" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="285" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="319" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="353" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="387" y="138" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="421" y="138" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="455" y="138" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <text x="30" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="64" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="98" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="132" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="166" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="234" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="268" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">7</text>
  <text x="302" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">8</text>
  <text x="336" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">9</text>
  <text x="370" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">10</text>
  <text x="404" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">11</text>
  <text x="438" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">12</text>
  <text x="472" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">13</text>

  <text x="115" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">读：x &lt; v 才能取 v</text>
  <text x="310" y="136" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">写：x + v</text>
  <text x="455" y="136" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">≥ 2v 不可能</text>

  <path d="M 115 194 Q 215 216 318 194" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="216" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">« 6：批量执行 x → x+6</text>

  <rect x="16" y="240" width="490" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="261" y="263" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">f |= ( f &amp; (2^v − 1) ) &lt;&lt; v</text>
  <text x="261" y="287" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">mask：低 v 位全 1，圈出合法起点　·　&lt;&lt;v：批量平移　·　|=：取或不取，并集</text>

  <rect x="16" y="314" width="490" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="261" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案上界：最后一步取最大值 m 前有 x ≤ m−1 ⇒ 总奖励 ≤ 2m−1 ≤ 99999</text>
  <text x="261" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">10^5 个 bit（12.5 KB）装下整个状态集：C++ bitset&lt;100000&gt; / Python 一个大整数</text>
  <text x="261" y="380" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">上界是紧的：v 取遍 1..50000 时，先取 49999 再取 50000 → 恰好 99999</text>
</svg>
