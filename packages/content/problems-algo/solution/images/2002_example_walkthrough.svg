<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：leetcodecom → "ete" × "cdc" = 9</text>

  <!-- index labels -->
  <g font-size="9" fill="#888">
    <text x="78" y="56" text-anchor="middle">0</text>
    <text x="118" y="56" text-anchor="middle">1</text>
    <text x="158" y="56" text-anchor="middle">2</text>
    <text x="198" y="56" text-anchor="middle">3</text>
    <text x="238" y="56" text-anchor="middle">4</text>
    <text x="278" y="56" text-anchor="middle">5</text>
    <text x="318" y="56" text-anchor="middle">6</text>
    <text x="358" y="56" text-anchor="middle">7</text>
    <text x="398" y="56" text-anchor="middle">8</text>
    <text x="438" y="56" text-anchor="middle">9</text>
    <text x="478" y="56" text-anchor="middle">10</text>
  </g>

  <!-- string "leetcodecom" -->
  <g font-size="14">
    <rect x="60" y="64" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="78" y="86" text-anchor="middle" fill="#666">l</text>
    <rect x="100" y="64" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="118" y="86" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="140" y="64" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="158" y="86" text-anchor="middle" fill="#666">e</text>
    <rect x="180" y="64" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="198" y="86" text-anchor="middle" fill="#446688" font-weight="bold">t</text>
    <rect x="220" y="64" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="238" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="260" y="64" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="86" text-anchor="middle" fill="#666">o</text>
    <rect x="300" y="64" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="318" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d</text>
    <rect x="340" y="64" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="358" y="86" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="380" y="64" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="398" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="420" y="64" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="438" y="86" text-anchor="middle" fill="#666">o</text>
    <rect x="460" y="64" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="478" y="86" text-anchor="middle" fill="#666">m</text>
  </g>

  <!-- extracted subsequences -->
  <rect x="70" y="118" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="135" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① "ete" = 下标 {1, 3, 7}</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#666">len = 3，回文 ✓</text>

  <rect x="290" y="118" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">② "cdc" = 下标 {4, 6, 8}</text>
  <text x="380" y="150" text-anchor="middle" font-size="10" fill="#666">len = 3，回文 ✓</text>

  <!-- disjoint check -->
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{1,3,7} ∩ {4,6,8} = ∅  →  不相交 ✓</text>

  <!-- multiplication -->
  <rect x="150" y="195" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">3 × 3 = 9</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#666">len[m1] × len[m2]</text>

  <!-- candidate table -->
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">候选回文子序列对（部分）</text>

  <!-- table header -->
  <rect x="40" y="285" width="480" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="301" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">子序列①</text>
  <text x="200" y="301" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">len</text>
  <text x="290" y="301" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">子序列②</text>
  <text x="380" y="301" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">len</text>
  <text x="470" y="301" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">乘积</text>

  <!-- row 1 -->
  <rect x="40" y="309" width="480" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="324" text-anchor="middle" font-size="10" fill="#446688">"e"(1)</text>
  <text x="200" y="324" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="290" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a">"cdc"(4,6,8)</text>
  <text x="380" y="324" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="324" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- row 2 (max) -->
  <rect x="40" y="331" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="110" y="346" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">"ete"(1,3,7)</text>
  <text x="200" y="346" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="290" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"cdc"(4,6,8)</text>
  <text x="380" y="346" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="470" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9 ← max</text>

  <!-- row 3 -->
  <rect x="40" y="353" width="480" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="368" text-anchor="middle" font-size="10" fill="#446688">"ede"(1,6,7)</text>
  <text x="200" y="368" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a">"oco"(5,8,9)</text>
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="368" text-anchor="middle" font-size="10" fill="#333">9</text>

  <!-- row 4 -->
  <rect x="40" y="375" width="480" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="390" text-anchor="middle" font-size="10" fill="#446688">"eee"(1,2,7)</text>
  <text x="200" y="390" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="290" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a">"cdc"(4,6,8)</text>
  <text x="380" y="390" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="390" text-anchor="middle" font-size="10" fill="#333">9</text>

  <!-- bottom note -->
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">最长回文子序列长度 = 3，两个不相交的 len-3 回文 → 最大乘积 9</text>
</svg>
