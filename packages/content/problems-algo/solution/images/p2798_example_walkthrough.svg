<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW2798" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：hours = [0,1,2,3,4], target = 2 → 3</text>

  <!-- Table header -->
  <rect x="40" y="50" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步 i</text>
  <rect x="130" y="50" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hours[i]</text>
  <rect x="250" y="50" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="315" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">≥ 2 ?</text>
  <rect x="380" y="50" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt</text>

  <!-- Row 0 -->
  <rect x="40" y="86" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="130" y="86" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="250" y="86" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 0&lt;2</text>
  <rect x="380" y="86" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- Row 1 -->
  <rect x="40" y="122" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="144" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="130" y="122" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="122" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 1&lt;2</text>
  <rect x="380" y="122" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- Row 2 -->
  <rect x="40" y="158" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="130" y="158" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="250" y="158" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="315" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 2≥2</text>
  <rect x="380" y="158" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 3 -->
  <rect x="40" y="194" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="216" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="130" y="194" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="194" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="315" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 3≥2</text>
  <rect x="380" y="194" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row 4 -->
  <rect x="40" y="230" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="252" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="130" y="230" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="250" y="230" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="315" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 4≥2</text>
  <rect x="380" y="230" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- cnt growth arrow -->
  <path d="M 430 122 L 430 252" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrW2798)" filter="url(#rough2)"/>
  <text x="496" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cnt 单调↑</text>

  <!-- result box -->
  <rect x="120" y="286" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">扫描结束 → 返回 cnt = 3</text>

  <!-- note -->
  <rect x="40" y="346" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11" fill="#666">绿色行 = 命中（≥2），cnt 自增；红色行 = 未命中，cnt 不变</text>
  <text x="60" y="388" font-size="11" fill="#4a7a3a" font-weight="bold">i=2 的 hours[2]=2 恰好等于 target，因「至少」取 ≥ 也算命中</text>
</svg>
