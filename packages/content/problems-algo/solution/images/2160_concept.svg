<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：排序后最小两位放十位，最大两位放个位</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">四位数字拆成两个两位数，和 = 10×(十位之和) + (个位之和)</text>

  <!-- ===== Step 1: num = 2932, extract digits ===== -->
  <text x="60" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 提取数位</text>

  <rect x="60" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="104" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="148" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="44" y="103" text-anchor="end" font-size="10.5" fill="#888">2932</text>

  <!-- arrow down to sort -->
  <path d="M 148 118 L 148 138" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="132" font-size="10" fill="#666" font-weight="bold">排序</text>

  <!-- ===== Step 2: sorted digits [2,2,3,9] ===== -->
  <text x="60" y="158" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 升序排列：d₀ ≤ d₁ ≤ d₂ ≤ d₃</text>

  <rect x="60" y="166" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="82" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">d₀</text>
  <rect x="104" y="166" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="126" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">d₁</text>
  <rect x="148" y="166" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="170" y="214" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">d₂</text>
  <rect x="192" y="166" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <text x="214" y="214" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">d₃</text>

  <!-- bracket: smallest two → tens -->
  <path d="M 60 224 L 60 232 L 148 232 L 148 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="104" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最小两位 → 十位（×10）</text>

  <!-- bracket: largest two → ones -->
  <path d="M 148 224 L 148 232 L 236 232 L 236 224" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="192" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">最大两位 → 个位（×1）</text>

  <!-- arrow down to pairing -->
  <path d="M 148 252 L 148 270" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="266" font-size="10" fill="#666" font-weight="bold">配对</text>

  <!-- ===== Step 3: new1 = 23, new2 = 29 ===== -->
  <text x="60" y="288" font-size="11.5" fill="#446688" font-weight="bold">③ 交叉配对成两个两位数</text>

  <!-- new1 = d0*10 + d2 = 23 -->
  <rect x="60" y="296" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="317" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="104" y="296" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="317" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="156" y="316" font-size="13" fill="#333" font-weight="bold">+</text>

  <!-- new2 = d1*10 + d3 = 29 -->
  <rect x="172" y="296" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="317" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="216" y="296" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="317" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <text x="148" y="346" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">23 + 29 = 52</text>

  <!-- vertical divider -->
  <line x1="310" y1="60" x2="310" y2="360" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: 2+2 vs 1+3 comparison ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">为什么必须 2+2 拆分？</text>

  <!-- 2+2 split -->
  <rect x="330" y="88" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 + 2 拆分（最优）</text>
  <text x="430" y="126" text-anchor="middle" font-size="10.5" fill="#555">权重 = 10 + 10 + 1 + 1 = 22</text>
  <text x="430" y="144" text-anchor="middle" font-size="10.5" fill="#555">和 = 10×(d₀+d₁) + (d₂+d₃)</text>

  <!-- 1+3 split -->
  <rect x="330" y="170" width="200" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 + 3 拆分（更差）</text>
  <text x="430" y="208" text-anchor="middle" font-size="10.5" fill="#555">权重 = 100 + 10 + 1 + 1 = 112</text>
  <text x="430" y="226" text-anchor="middle" font-size="10.5" fill="#555">和 = 100×d₀ + 10×d₁ + d₂ + d₃</text>

  <!-- difference -->
  <path d="M 430 244 L 430 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="330" y="268" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="288" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">差值 = 90 × d₀ ≥ 0</text>
  <text x="430" y="304" text-anchor="middle" font-size="10" fill="#888">d₀ = 0 时相等，否则 2+2 严格更优</text>

  <!-- conclusion box -->
  <rect x="330" y="326" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结论：排序 + 交叉配对</text>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#555">new1 = d₀×10 + d₂</text>
  <text x="430" y="375" text-anchor="middle" font-size="10" fill="#555">new2 = d₁×10 + d₃</text>
</svg>
