<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：从任意点出发，最远点必为直径端点</text>

  <!-- ===== Tree edges ===== -->
  <!-- branch edge 1-0 (light, not on diameter) -->
  <line x1="210" y1="200" x2="210" y2="262" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- diameter path edges (highlighted red) -->
  <path d="M 88 200 L 352 200" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Tree nodes ===== -->
  <!-- 3 (endpoint A) -->
  <circle cx="70" cy="200" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="70" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">A（端点）</text>

  <!-- 2 -->
  <circle cx="140" cy="200" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- 1 (bend point) -->
  <circle cx="210" cy="200" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- 0 (starting point s) -->
  <circle cx="210" cy="280" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="210" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">s（任意起点）</text>

  <!-- 4 -->
  <circle cx="280" cy="200" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- 5 (endpoint B) -->
  <circle cx="350" cy="200" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="350" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">B（端点）</text>

  <!-- ===== Step 1 arrow: from 0 up to 3 ===== -->
  <path d="M 196 264 Q 150 232 88 214" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">① BFS(s) → A</text>

  <!-- ===== Step 2 label on diameter path ===== -->
  <text x="210" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② BFS(A) → B，dist=4</text>

  <!-- edge count labels -->
  <text x="105" y="220" text-anchor="middle" font-size="9" fill="#b85450">1</text>
  <text x="175" y="220" text-anchor="middle" font-size="9" fill="#b85450">1</text>
  <text x="245" y="220" text-anchor="middle" font-size="9" fill="#b85450">1</text>
  <text x="315" y="220" text-anchor="middle" font-size="9" fill="#b85450">1</text>

  <!-- ===== Summary box ===== -->
  <rect x="40" y="328" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">直径 = dist(A, B) = 4 条边</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#555">从任意 s 出发 → 最远点 A 必是端点 → 再从 A 出发即得直径</text>
</svg>
