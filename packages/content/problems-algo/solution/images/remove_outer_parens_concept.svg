<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">原始分解：每个原语去掉最外层括号</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">(()())(()) = 原语①(()()) + 原语②(()) → 去外层 → ()()()</text>

  <!-- ===== Original string: 10 chars, box w=34 gap=2, start x=81 ===== -->
  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- pos 0: ( — outermost red -->
    <rect x="81" y="62" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="98" y="83" text-anchor="middle" fill="#b85450">(</text>
    <!-- pos 1: ( — inner green -->
    <rect x="117" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="134" y="83" text-anchor="middle" fill="#4a7a3a">(</text>
    <!-- pos 2: ) — inner green -->
    <rect x="153" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="83" text-anchor="middle" fill="#4a7a3a">)</text>
    <!-- pos 3: ( — inner green -->
    <rect x="189" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="206" y="83" text-anchor="middle" fill="#4a7a3a">(</text>
    <!-- pos 4: ) — inner green -->
    <rect x="225" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="242" y="83" text-anchor="middle" fill="#4a7a3a">)</text>
    <!-- pos 5: ) — outermost red -->
    <rect x="261" y="62" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="278" y="83" text-anchor="middle" fill="#b85450">)</text>
    <!-- pos 6: ( — outermost red -->
    <rect x="297" y="62" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="314" y="83" text-anchor="middle" fill="#b85450">(</text>
    <!-- pos 7: ( — inner green -->
    <rect x="333" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="350" y="83" text-anchor="middle" fill="#4a7a3a">(</text>
    <!-- pos 8: ) — inner green -->
    <rect x="369" y="62" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="386" y="83" text-anchor="middle" fill="#4a7a3a">)</text>
    <!-- pos 9: ) — outermost red -->
    <rect x="405" y="62" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="422" y="83" text-anchor="middle" fill="#b85450">)</text>
  </g>

  <!-- ===== Primitive grouping brackets ===== -->
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <!-- Primitive 1: pos 0-5, x=81 to 295 -->
    <path d="M 81 100 L 81 106 L 295 106 L 295 100" stroke="#446688" stroke-width="1.4" fill="none"/>
    <text x="188" y="122" text-anchor="middle" fill="#446688" font-weight="bold">原语 ① (()())</text>
    <!-- Primitive 2: pos 6-9, x=297 to 439 -->
    <path d="M 297 100 L 297 106 L 439 106 L 439 100" stroke="#446688" stroke-width="1.4" fill="none"/>
    <text x="368" y="122" text-anchor="middle" fill="#446688" font-weight="bold">原语 ② (())</text>
  </g>

  <!-- ===== Arrow down ===== -->
  <g filter="url(#rough2)">
    <path d="M 260 138 L 260 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="270" y="155" font-size="11" fill="#888">去掉外层括号（红色）</text>
  </g>

  <!-- ===== Result string: 6 chars, box w=34 gap=2, start x=153 ===== -->
  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <rect x="153" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="191" text-anchor="middle" fill="#4a7a3a">(</text>
    <rect x="189" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="206" y="191" text-anchor="middle" fill="#4a7a3a">)</text>
    <rect x="225" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="242" y="191" text-anchor="middle" fill="#4a7a3a">(</text>
    <rect x="261" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="278" y="191" text-anchor="middle" fill="#4a7a3a">)</text>
    <rect x="297" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="314" y="191" text-anchor="middle" fill="#4a7a3a">(</text>
    <rect x="333" y="170" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="350" y="191" text-anchor="middle" fill="#4a7a3a">)</text>
  </g>

  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果: "()()()" = ()() + ()</text>

  <!-- ===== Legend ===== -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="110" y="240" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="140" y="254" fill="#b85450">外层括号（删除）</text>
    <rect x="280" y="240" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="310" y="254" fill="#4a7a3a">内部括号（保留）</text>
  </g>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="278" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="11" fill="#d6a040" font-weight="bold">💡 关键洞察</text>
  <text x="56" y="314" font-size="11" fill="#555">原语 = 平衡度从 0 升到 1 再降回 0 的一段。0→1 的 '(' 是原语开头，1→0 的 ')' 是原语结尾——</text>
  <text x="56" y="328" font-size="11" fill="#555">这两个就是外层括号，跳过即可，无需显式切分原语。</text>
</svg>
