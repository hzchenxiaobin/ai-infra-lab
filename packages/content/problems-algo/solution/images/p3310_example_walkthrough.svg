<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例对照：一条「入侵边」决定两种命运</text>

  <!-- 左面板：示例 1 -->
  <text x="135" y="48" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：n=4，k=1</text>
  <ellipse cx="130" cy="100" rx="85" ry="45" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 93 100 L 167 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 65 167 L 71 120" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 196 167 L 189 120" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="75" cy="100" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="105" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="185" cy="100" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="105" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="60" cy="185" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="200" cy="185" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="52" cy="78" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="52" y="82" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="130" y="138" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">S = {1,2}</text>
  <path d="M 43 143 L 53 153 M 53 143 L 43 153" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 207 143 L 217 153 M 217 143 L 207 153" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="135" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">BFS 从 1 出发：S = {1, 2}</text>
  <text x="135" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">扫边：(0,1)、(3,2) 都是圈外→圈内 —— 否决</text>
  <rect x="35" y="264" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="285" text-anchor="middle" font-size="11" fill="#7a3530" font-weight="bold" filter="url(#rough2)">返回 [0,1,2,3]（全保留）</text>

  <!-- 右面板：示例 2 -->
  <text x="385" y="48" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：n=5，k=0</text>
  <ellipse cx="348" cy="152" rx="82" ry="80" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 315 167 L 375 192" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 308 139 L 348 107" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 363 111 L 385 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 465 122 L 473 198" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="300" cy="155" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="355" cy="95" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="100" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="390" cy="200" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="205" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="460" cy="105" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="110" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="475" cy="215" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="220" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="278" cy="132" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="278" y="136" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="385" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">BFS 从 0 出发：标记 2、1，S = {0,1,2}</text>
  <text x="385" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">扫边：(3,4) 两端都在圈外 —— 不拦</text>
  <rect x="285" y="264" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="285" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 [3,4]（删光 S）</text>

  <!-- 底部说明 -->
  <rect x="34" y="306" width="452" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">同一套两趟扫描，差别只在「有没有圈外→圈内的边」</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">示例 3（0→1→2→0 全染红）：S = 全部方法，没有圈外 ⇒ 自然返回 [ ]</text>
</svg>
