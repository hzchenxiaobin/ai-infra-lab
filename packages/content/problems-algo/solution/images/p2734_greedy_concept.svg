<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2734c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：跳过前导 a，从首个非 a 起递减到遇 a 止</text>

  <!-- operation rule -->
  <rect x="30" y="44" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="11" fill="#446688" font-weight="bold">操作规则：子串中每个字符 → 字母表前驱</text>
  <rect x="40" y="70" width="96" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="88" y="83" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b→a 变小 ✓</text>
  <rect x="150" y="70" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="83" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a→z 变大 ✗</text>
  <text x="276" y="83" font-size="10" fill="#888">⇒ 前导 a 跳过，遇 a 即停</text>

  <!-- string example acbbc -->
  <text x="30" y="126" font-size="12" fill="#888" font-weight="bold">示例：s = "acbbc"</text>

  <!-- index 0: a, skip -->
  <rect x="30" y="134" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="52" y="160" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">a</text>
  <text x="52" y="188" text-anchor="middle" font-size="9" fill="#b85450">跳过</text>

  <!-- index 1-4: decrease -->
  <rect x="74" y="134" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="96" y="160" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="118" y="134" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="162" y="134" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="184" y="160" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="206" y="134" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="228" y="160" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="162" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">递减区：首个非 a 起，到末尾（无 a 阻挡）</text>

  <!-- arrow down -->
  <path d="M162,198 L162,228" stroke="#446688" stroke-width="2" marker-end="url(#arr2734c)" filter="url(#rough2)"/>
  <text x="178" y="220" font-size="10" fill="#446688">每个 −1</text>

  <!-- result -->
  <text x="30" y="250" font-size="12" fill="#888" font-weight="bold">结果</text>
  <rect x="30" y="256" width="44" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="282" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">a</text>
  <rect x="74" y="256" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="96" y="282" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">b</text>
  <rect x="118" y="256" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="140" y="282" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">a</text>
  <rect x="162" y="256" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="184" y="282" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">a</text>
  <rect x="206" y="256" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="228" y="282" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">b</text>

  <rect x="30" y="306" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 "abaab" ✓</text>

  <!-- reasoning box -->
  <rect x="300" y="134" width="240" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">为何这样贪心？</text>
  <text x="312" y="178" font-size="10" fill="#d6a040">① 字典序看最左不同位</text>
  <text x="312" y="196" font-size="10" fill="#d6a040">② 前导 a 碰不得（a→z 更差）</text>
  <text x="312" y="214" font-size="10" fill="#d6a040">③ 首个非 a 减 1 = 最靠左改进</text>
  <text x="312" y="232" font-size="10" fill="#d6a040">④ 继续到遇 a：每减一个更小</text>
  <text x="312" y="250" font-size="10" fill="#d6a040">⑤ 遇 a 必停（a→z 反弹变差）</text>
  <text x="312" y="276" font-size="10" fill="#b85450" font-weight="bold">全 a 特例：必操作一次</text>
  <text x="312" y="294" font-size="10" fill="#b85450">⇒ 改最后一个 a→z 损害最小</text>
  <text x="312" y="316" font-size="9" fill="#888">（"aa"→"az"，不是 "za"）</text>

  <!-- bottom note -->
  <rect x="30" y="346" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="366" font-size="10" fill="#446688" font-weight="bold">一句话：找最左的「非 a 连续段」整体减 1；没有非 a 就把末位 a 改成 z。</text>
  <text x="40" y="384" font-size="9" fill="#888">子串必须连续——遇到 a 即断开，不能跨 a 续减（跨 a 会把 a 变 z，得不偿失）。</text>
</svg>
