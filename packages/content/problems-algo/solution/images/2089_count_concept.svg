<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：排序后 target 的位置只由「比它小的个数」决定</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">无需真正排序，数一遍 &lt; target 与 == target 的个数即可定位</text>

  <!-- Original array label -->
  <text x="28" y="74" font-size="10.5" fill="#666">nums =</text>
  <text x="470" y="74" text-anchor="end" font-size="10.5" fill="#666">target = 2</text>

  <!-- Original array cards: [1, 2, 5, 2, 3] -->
  <!-- 1 -> less (blue) -->
  <rect x="70" y="58" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="95" y="104" text-anchor="middle" font-size="9.5" fill="#446688">&lt; 2</text>

  <!-- 2 -> equal (green) -->
  <rect x="130" y="58" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="155" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a">== 2</text>

  <!-- 5 -> greater (orange) -->
  <rect x="190" y="58" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="215" y="104" text-anchor="middle" font-size="9.5" fill="#d6a040">&gt; 2</text>

  <!-- 2 -> equal (green) -->
  <rect x="250" y="58" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="275" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a">== 2</text>

  <!-- 3 -> greater (orange) -->
  <rect x="310" y="58" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="335" y="104" text-anchor="middle" font-size="9.5" fill="#d6a040">&gt; 2</text>

  <!-- Down arrows to count boxes -->
  <path d="M 95 110 L 95 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 110 L 145 132" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 110 L 155 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 275 110 L 175 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 335 110 L 145 132" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Three count boxes -->
  <rect x="56" y="134" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="152" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">less</text>
  <text x="96" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="146" y="134" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="186" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">equal</text>
  <text x="186" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="236" y="134" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">greater</text>
  <text x="276" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Formula box -->
  <rect x="40" y="190" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">排序后 target 的下标区间</text>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#555">[ less, less + equal − 1 ] = [ 1, 1 + 2 − 1 ] = [ 1, 2 ]</text>

  <!-- Sorted array -->
  <text x="28" y="262" font-size="10.5" fill="#666">排序后：</text>

  <!-- sorted cards: [1, 2, 2, 3, 5] with target positions highlighted -->
  <rect x="70" y="250" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="95" y="296" text-anchor="middle" font-size="9.5" fill="#888">idx 0</text>

  <rect x="130" y="250" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="272" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="155" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">idx 1 ✓</text>

  <rect x="190" y="250" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="272" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="215" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">idx 2 ✓</text>

  <rect x="250" y="250" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="275" y="296" text-anchor="middle" font-size="9.5" fill="#888">idx 3</text>

  <rect x="310" y="250" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="335" y="296" text-anchor="middle" font-size="9.5" fill="#888">idx 4</text>

  <!-- Bottom insight -->
  <rect x="40" y="312" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#333">「比 target 小」的个数 = target 起始下标 → 一次遍历计数，O(n) 定位</text>
</svg>
