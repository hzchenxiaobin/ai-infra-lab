<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：四步走</text>

  <!-- Step 1 -->
  <rect x="150" y="44" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 按时间戳排序全部记录</text>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">zip(timestamp,user,site) → sort</text>
  <path d="M 280 80 L 280 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="96" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 按用户分组 → 各自访问序列</text>
  <text x="280" y="124" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">user → [site0, site1, ...]</text>
  <path d="M 280 132 L 280 146" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="120" y="148" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">③ 每用户生成 C(m,3) 三元组</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">用 set 去重 → 每模式该用户只 +1</text>
  <path d="M 280 194 L 280 208" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="120" y="210" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">④ 选计数最大的模式</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">并列 → 取字典序最小</text>
  <path d="M 280 256 L 280 270" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="170" y="272" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">返回 [s1, s2, s3]</text>

  <!-- side notes -->
  <rect x="40" y="148" width="64" height="44" fill="#fafafa" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="72" y="168" text-anchor="middle" font-size="9" fill="#8a3a3a" filter="url(#rough2)">m&lt;3</text>
  <text x="72" y="182" text-anchor="middle" font-size="9" fill="#8a3a3a" filter="url(#rough2)">跳过</text>

  <!-- bottom key note -->
  <rect x="40" y="330" width="480" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">关键不变式：patternCount[p] = 命中 p 的「不同用户数」</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">同一用户多次产生同一 p 也只计一次（set 去重）</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">三元组选下标 i&lt;j&lt;k 保证时间顺序</text>
</svg>
