<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：奇偶折叠 → 末位状态机 → 逐位转移</text>

  <!-- 步骤1 -->
  <rect x="30" y="44" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 数奇偶：cntE = ⌊m/2⌋，cntO = ⌈m/2⌉</text>
  <text x="130" y="75" text-anchor="middle" font-size="9" fill="#6a86a3" filter="url(#rough2)">[1, m] 里奇数可能比偶数多一个</text>

  <path d="M 130 84 L 130 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="30" y="102" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="118" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 初始化：dp[0][偶] = cntE，dp[0][奇] = cntO</text>
  <text x="130" y="133" text-anchor="middle" font-size="9" fill="#6a86a3" filter="url(#rough2)">首位无相邻对，j 从 0 起步</text>

  <path d="M 130 142 L 130 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤3：循环 -->
  <rect x="30" y="160" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="181" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 逐位填第 2 … n 个位置</text>
  <path d="M 230 168 Q 252 160 252 150 Q 252 170 232 178" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 循环体：分支 -->
  <path d="M 130 194 L 130 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：新位填什么 -->
  <polygon points="130,214 190,244 130,274 70,244" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="241" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">新位填</text>
  <text x="130" y="255" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">奇 or 偶？</text>

  <!-- 左分支：填奇 -->
  <path d="M 70 244 L 46 244 L 46 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="52" y="238" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇 ×cntO</text>
  <rect x="14" y="298" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="89" y="315" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">nd[j][奇] += (e+o)·cntO</text>
  <text x="89" y="331" text-anchor="middle" font-size="9" fill="#5c8a4e" filter="url(#rough2)">新对必不是偶偶，j 不动</text>

  <!-- 右分支：填偶 -->
  <path d="M 190 244 L 240 244 L 240 264" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="204" y="238" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶 ×cntE</text>

  <!-- 内层菱形：上一位是偶？ -->
  <polygon points="240,268 288,292 240,316 192,292" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="289" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">上一位</text>
  <text x="240" y="301" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是偶？</text>

  <!-- 偶→偶：j+1 -->
  <path d="M 288 292 L 322 292 L 322 284" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="282" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="264" width="176" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="418" y="281" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">nd[j+1][偶] += e·cntE</text>
  <text x="418" y="296" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶偶对 +1（唯一推进 j 的边）</text>

  <!-- 奇→偶：j 不动 -->
  <path d="M 240 316 L 240 336 L 316 336 L 316 308" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="248" y="331" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="330" y="312" width="176" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="326" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">nd[j][偶] += o·cntE</text>
  <text x="418" y="339" text-anchor="middle" font-size="9" fill="#6a86a3" filter="url(#rough2)">奇偶相邻，j 不动</text>

  <!-- 右上：步骤4 输出 -->
  <rect x="330" y="44" width="176" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="64" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">④ 输出答案</text>
  <text x="418" y="81" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">(dp[k][偶] + dp[k][奇])</text>
  <text x="418" y="94" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">mod 10⁹ + 7</text>

  <!-- 右中：复杂度框 -->
  <rect x="330" y="120" width="176" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="418" y="140" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="418" y="157" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">时间 O(n·k) ≈ 5.6×10⁵</text>
  <text x="418" y="172" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">空间 O(k)（滚动数组）</text>

  <!-- 循环回边 -->
  <path d="M 418 100 Q 418 108 400 108 L 240 108 Q 236 108 234 160" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="104" font-size="9" fill="#a07830" filter="url(#rough2)">填完 n 位后跳出</text>

  <!-- 底部提示 -->
  <rect x="170" y="358" width="180" height="0" fill="none" filter="url(#rough2)"/>
</svg>
