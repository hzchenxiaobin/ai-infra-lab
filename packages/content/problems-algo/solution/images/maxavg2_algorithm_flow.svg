<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：外层浮点二分 + 内层 check 判定</text>

  <!-- ====== 外层：初始化 ====== -->
  <rect x="120" y="40" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#333">lo = min(nums)，hi = max(nums)</text>
  <path d="M 280 78 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== 外层：二分循环头 ====== -->
  <rect x="150" y="104" width="260" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">for iter in [0, 100)</text>
  <path d="M 280 136 L 280 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== mid 取值 ====== -->
  <rect x="160" y="162" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#333">mid = (lo + hi) / 2</text>
  <path d="M 280 194 L 280 214" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== 进入 check(mid) ====== -->
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#888" font-style="italic">调用 check(mid)</text>

  <!-- ====== check 内部框 ====== -->
  <rect x="40" y="218" width="480" height="190" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <rect x="40" y="218" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">check(mid)：是否存在长度 ≥ k 子数组 avg ≥ mid</text>

  <!-- check step 1 -->
  <rect x="70" y="254" width="420" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10.5" fill="#333">sum = Σ(nums[0..k−1] − mid)，minPre = 0，preLag = 0</text>
  <path d="M 280 284 L 280 298" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- check step 2 -->
  <rect x="70" y="302" width="420" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333">for i in [k, n−1]：preLag += B[i−k]，minPre = min(minPre, preLag)</text>
  <path d="M 280 332 L 280 346" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check decision -->
  <path d="M 280 350 L 370 380 L 280 410 L 190 380 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#333">sum ≥ minPre</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#333">？</text>

  <!-- check yes → return true -->
  <path d="M 280 410 L 280 428" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="422" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="210" y="430" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- check no → continue loop / return false -->
  <path d="M 370 380 L 460 380 L 460 320 L 490 320" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="372" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="475" y="312" font-size="9" fill="#888" font-style="italic">继续</text>

  <text x="70" y="398" font-size="9.5" fill="#888" font-style="italic">扫完未命中 → return false</text>

  <!-- ====== 回到外层：根据 check 结果 ====== -->
  <path d="M 280 456 L 280 462" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- outer decision -->
  <path d="M 140 468 L 140 490" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="462" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="145" y="480" text-anchor="middle" font-size="10.5" fill="#333">✓ true → lo = mid</text>

  <rect x="330" y="462" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="415" y="480" text-anchor="middle" font-size="10.5" fill="#333">✗ false → hi = mid</text>

  <!-- loop back arrow -->
  <path d="M 145 492 L 145 504 L 280 504 L 280 104" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 492 L 415 504 L 280 504" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- final return -->
  <text x="510" y="124" font-size="10" fill="#888" font-style="italic">100 次</text>
  <text x="510" y="138" font-size="10" fill="#888" font-style="italic">后返回 lo</text>
</svg>
