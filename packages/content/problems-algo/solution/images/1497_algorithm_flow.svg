<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：统计余数频次 → 检查 cnt[0] 偶 → 循环检查互补计数 → 全过返回 true</text>

  <!-- Start -->
  <ellipse cx="230" cy="46" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="50" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 230 62 L 230 74" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: count remainders -->
  <rect x="70" y="76" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="97" text-anchor="middle" font-size="11.5" fill="#333">① 统计 cnt[0..k−1]，余数 r = ((x % k) + k) % k</text>
  <path d="M 230 110 L 230 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: cnt[0] even ? -->
  <polygon points="230,124 320,150 230,176 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="154" text-anchor="middle" font-size="11.5" fill="#333">② cnt[0] 为偶数？</text>
  <!-- No -> return false -->
  <path d="M 320 150 L 418 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="144" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="136" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="155" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <!-- Yes down -->
  <path d="M 230 176 L 230 192" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box2: r = 1 -->
  <rect x="170" y="194" width="120" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="213" text-anchor="middle" font-size="11.5" fill="#333">③ r = 1</text>
  <path d="M 230 222 L 230 234" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: r <= k/2 ? -->
  <polygon points="230,234 322,262 230,290 138,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="266" text-anchor="middle" font-size="11.5" fill="#333">④ r ≤ ⌊k/2⌋ ？</text>
  <!-- No -> return true -->
  <path d="M 322 262 L 418 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="256" font-size="10.5" fill="#b85450" font-weight="bold">否(完)</text>
  <rect x="420" y="248" width="120" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="267" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true</text>
  <!-- Yes down -->
  <path d="M 230 290 L 230 308" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="304" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond3: pairing condition satisfied ? -->
  <polygon points="230,308 345,338 230,368 115,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="342" text-anchor="middle" font-size="11.5" fill="#333">⑤ 配对条件满足？</text>
  <!-- No -> return false -->
  <path d="M 345 338 L 418 338" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="332" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="324" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="343" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <!-- Yes down -->
  <path d="M 230 368 L 230 390" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box3: r += 1 -->
  <rect x="170" y="392" width="120" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="411" text-anchor="middle" font-size="11.5" fill="#333">r += 1</text>

  <!-- loop back: box3 left -> left -> up -> diamond2 left point -->
  <path d="M 170 406 L 50 406 L 50 262 L 136 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="54" y="256" font-size="10.5" fill="#4a7a3a">回到 ④</text>

  <!-- bottom note: pairing condition explanation -->
  <rect x="56" y="432" width="488" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#555">配对条件：r == k−r 时（k 偶中点）要求 cnt[r] 为偶数；否则要求 cnt[r] == cnt[k−r]</text>
  <text x="300" y="465" text-anchor="middle" font-size="10" fill="#888">循环只到 ⌊k/2⌋：r 与 k−r 对称，查一半即覆盖全部互补对</text>
</svg>
