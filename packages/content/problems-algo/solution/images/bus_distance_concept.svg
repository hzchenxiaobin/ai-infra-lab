<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环形公交路线：两站间只有两条路</text>

  <!-- Ring (dashed circle) -->
  <ellipse cx="260" cy="185" rx="135" ry="105" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- Clockwise arc highlight (0->1->2): top-right to bottom-right -->
  <path d="M 260 80 A 135 105 0 0 1 395 185 A 135 105 0 0 1 260 290" fill="none" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <!-- Counterclockwise arc highlight (0->3->2): top-left to bottom-left -->
  <path d="M 260 80 A 135 105 0 0 0 125 185 A 135 105 0 0 0 260 290" fill="none" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)" marker-end="url(#arrR)"/>

  <!-- Stops -->
  <!-- Stop 0 (top) start -->
  <circle cx="260" cy="80" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="260" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">start</text>

  <!-- Stop 1 (right) -->
  <circle cx="395" cy="185" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Stop 2 (bottom) destination -->
  <circle cx="260" cy="290" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dest</text>

  <!-- Stop 3 (left) -->
  <circle cx="125" cy="185" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="190" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- Edge distance labels -->
  <!-- distance[0]=1, edge 0->1 (top-right) -->
  <text x="365" y="115" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- distance[1]=2, edge 1->2 (bottom-right) -->
  <text x="365" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- distance[2]=3, edge 2->3 (bottom-left) -->
  <text x="155" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <!-- distance[3]=4, edge 3->0 (top-left) -->
  <text x="155" y="115" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- Direction arrows text -->
  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">顺时针</text>
  <text x="90" y="150" text-anchor="middle" font-size="10" fill="#b85450">逆时针</text>

  <!-- Bottom summary boxes -->
  <rect x="40" y="328" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="346" text-anchor="middle" font-size="11" fill="#333">顺时针 = 1 + 2 = 3 ✓</text>

  <rect x="280" y="328" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="346" text-anchor="middle" font-size="11" fill="#333">逆时针 = 4 + 3 = 7</text>
</svg>
