<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同源字符串检测：双指针对齐 + 差值 k 模型</text>

  <!-- ===== Original string bar (shared) ===== -->
  <text x="30" y="56" font-size="11" fill="#888">原字符串 T（隐式，无需还原）:</text>
  <rect x="30" y="62" width="560" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="77" text-anchor="middle" font-size="10" fill="#8a6d20">? ? ? ? ? ? ? ? ? ? ? ? ? ? ? …</text>

  <!-- ===== Case 1: k=0 aligned ===== -->
  <text x="30" y="108" font-size="12" fill="#446688" font-weight="bold">情况一：k = 0（齐头并进）</text>

  <!-- s1 pointer -->
  <rect x="150" y="116" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="131" text-anchor="middle" font-size="10" fill="#333">s1[i]</text>
  <line x1="165" y1="138" x2="165" y2="104" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- s2 pointer at same position -->
  <rect x="150" y="150" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="165" text-anchor="middle" font-size="10" fill="#333">s2[j]</text>
  <line x1="165" y1="150" x2="165" y2="104" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="210" y="135" font-size="9" fill="#555">↑ 指向同一字符</text>
  <text x="210" y="165" font-size="9" fill="#555">字母必须匹配</text>

  <!-- aligned markers -->
  <path d="M 120 140 L 148 128" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 142 L 148 162" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Case 2: k>0 s1 ahead ===== -->
  <text x="350" y="108" font-size="12" fill="#b85450" font-weight="bold">情况二：k &gt; 0（s1 领先 k）</text>

  <!-- original string segment -->
  <rect x="340" y="120" width="260" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="360" y="134" font-size="9" fill="#b85450">s2 已消费</text>
  <text x="470" y="134" font-size="9" fill="#b85450" font-weight="bold">← k 个待匹配字符（数字消费，未知）→</text>

  <!-- s1 pointer ahead -->
  <rect x="570" y="116" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="585" y="131" text-anchor="middle" font-size="10" fill="#333">s1[i]</text>

  <!-- s2 pointer behind -->
  <rect x="340" y="150" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="165" text-anchor="middle" font-size="10" fill="#333">s2[j]</text>

  <!-- s2 catches up arrow -->
  <path d="M 375 161 L 560 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="450" y="190" font-size="9" fill="#4a7a3a">s2 追赶（字母无约束 / 数字减少 k）</text>

  <!-- s1 frozen -->
  <text x="575" y="152" font-size="8" fill="#b85450">✗ s1 冻结</text>

  <!-- ===== Case 3: k<0 s2 ahead ===== -->
  <text x="30" y="220" font-size="12" fill="#d6a040" font-weight="bold">情况三：k &lt; 0（s2 领先 |k|）</text>

  <rect x="30" y="232" width="260" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="246" font-size="9" fill="#d6a040">s1 已消费</text>
  <text x="155" y="246" font-size="9" fill="#d6a040" font-weight="bold">← |k| 个待匹配字符（数字消费）→</text>

  <!-- s2 pointer ahead -->
  <rect x="260" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="243" text-anchor="middle" font-size="10" fill="#333">s2[j]</text>

  <!-- s1 pointer behind -->
  <rect x="30" y="262" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="277" text-anchor="middle" font-size="10" fill="#333">s1[i]</text>

  <!-- s1 catches up arrow -->
  <path d="M 65 273 L 250 242" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="300" font-size="9" fill="#446688">s1 追赶（字母无约束 / 数字增加 k）</text>

  <text x="265" y="264" font-size="8" fill="#d6a040">✗ s2 冻结</text>

  <!-- ===== Right side: why ahead side can't move ===== -->
  <rect x="330" y="220" width="270" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="240" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为什么领先方冻结？</text>
  <text x="465" y="258" text-anchor="middle" font-size="9" fill="#555">k=0 时 s1 消费字母 → s2 必匹配 → k 仍=0</text>
  <text x="465" y="274" text-anchor="middle" font-size="9" fill="#555">k=0 时 s1 消费数字 → k&gt;0（字符未知）</text>
  <text x="465" y="290" text-anchor="middle" font-size="9" fill="#555">→ 领先的 k 个字符全来自数字</text>
  <text x="465" y="306" text-anchor="middle" font-size="9" fill="#555">→ 追赶方用字母匹配，无矛盾</text>
  <text x="465" y="324" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">若领先方再消费字母 → 字符已知 → 需验证 → 模型不充分</text>

  <!-- ===== Bottom: state summary ===== -->
  <rect x="30" y="350" width="570" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="370" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">状态 dfs(i, j, k) —— i∈[0,n1], j∈[0,n2], k∈[-998, 998]</text>
  <text x="315" y="388" text-anchor="middle" font-size="10" fill="#555">k=0: 双方各消费一个 token（字母须匹配，数字产生差值）</text>
  <text x="315" y="404" text-anchor="middle" font-size="10" fill="#555">k&gt;0: 仅 s2 追赶　|　k&lt;0: 仅 s1 追赶　|　终止: i=n1, j=n2, k=0</text>
</svg>
