<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 1432219, k = 3</text>

  <!-- Table outer frame -->
  <rect x="20" y="44" width="560" height="372" fill="none" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="20" y="44" width="560" height="30" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="39" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="81" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text>
  <text x="162" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">栈(处理前)</text>
  <text x="325" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>
  <text x="450" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <text x="525" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">栈(处理后)</text>

  <!-- Column separators -->
  <line x1="58" y1="44" x2="58" y2="416" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="104" y1="44" x2="104" y2="416" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="44" x2="220" y2="416" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="44" x2="430" y2="416" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="44" x2="470" y2="416" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row separators (8 rows of height 43 from y=74) -->
  <line x1="20" y1="117" x2="580" y2="117" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="160" x2="580" y2="160" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="203" x2="580" y2="203" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="246" x2="580" y2="246" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="289" x2="580" y2="289" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="332" x2="580" y2="332" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="375" x2="580" y2="375" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: c=1 -->
  <text x="39" y="100" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="81" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="162" y="100" text-anchor="middle" font-size="11" fill="#999">[ ]</text>
  <text x="228" y="100" font-size="10" fill="#666">栈空 → 1 入栈</text>
  <text x="450" y="100" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="525" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1]</text>

  <!-- Row 2: c=4 -->
  <text x="39" y="143" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="81" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="162" y="143" text-anchor="middle" font-size="11" fill="#666">[1]</text>
  <text x="228" y="143" font-size="10" fill="#666">栈顶 1 ≯ 4 → 4 入栈</text>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="525" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,4]</text>

  <!-- Row 3: c=3, pop 4 -->
  <text x="39" y="186" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="81" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="162" y="186" text-anchor="middle" font-size="11" fill="#666">[1,4]</text>
  <text x="228" y="186" font-size="10" fill="#666">栈顶 4 &gt; 3 → </text>
  <text x="316" y="186" font-size="10" fill="#b85450" font-weight="bold">弹 4</text>
  <text x="344" y="186" font-size="10" fill="#666"> (k=2)；1 ≯ 3 → 3 入栈</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="525" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3]</text>

  <!-- Row 4: c=2, pop 3 -->
  <text x="39" y="229" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="81" y="229" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="162" y="229" text-anchor="middle" font-size="11" fill="#666">[1,3]</text>
  <text x="228" y="229" font-size="10" fill="#666">栈顶 3 &gt; 2 → </text>
  <text x="316" y="229" font-size="10" fill="#b85450" font-weight="bold">弹 3</text>
  <text x="344" y="229" font-size="10" fill="#666"> (k=1)；1 ≯ 2 → 2 入栈</text>
  <text x="450" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="525" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2]</text>

  <!-- Row 5: c=2, no pop -->
  <text x="39" y="272" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="81" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="162" y="272" text-anchor="middle" font-size="11" fill="#666">[1,2]</text>
  <text x="228" y="272" font-size="10" fill="#666">栈顶 2 ≯ 2 → 2 入栈</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="525" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,2]</text>

  <!-- Row 6: c=1, pop 2 (k used up) -->
  <text x="39" y="315" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="81" y="315" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="162" y="315" text-anchor="middle" font-size="11" fill="#666">[1,2,2]</text>
  <text x="228" y="315" font-size="10" fill="#666">栈顶 2 &gt; 1 → </text>
  <text x="316" y="315" font-size="10" fill="#b85450" font-weight="bold">弹 2</text>
  <text x="344" y="315" font-size="10" fill="#666"> (k=0)；k=0 停止弹</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="525" y="315" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,1]</text>

  <!-- Row 7: c=9, push -->
  <text x="39" y="358" text-anchor="middle" font-size="11" fill="#888">7</text>
  <text x="81" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="162" y="358" text-anchor="middle" font-size="11" fill="#666">[1,2,1]</text>
  <text x="228" y="358" font-size="10" fill="#666">k=0 不再弹 → 9 入栈</text>
  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="525" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,1,9]</text>

  <!-- Row 8: 收尾 -->
  <rect x="20" y="375" width="560" height="41" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="39" y="400" text-anchor="middle" font-size="10" fill="#888">收尾</text>
  <text x="81" y="400" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="162" y="400" text-anchor="middle" font-size="11" fill="#666">[1,2,1,9]</text>
  <text x="228" y="400" font-size="10" fill="#666">k=0 无需截尾；去前导零(无) →</text>
  <text x="525" y="400" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">"1219"</text>

  <!-- bottom note -->
  <text x="300" y="432" text-anchor="middle" font-size="10" fill="#888">红色 = 被弹栈的高位偏大数字及 k 的减少；绿色 = 当前栈状态</text>
</svg>
