<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">美丽条件：禁止长度 2、3 的回文 ⟺ 禁止所有 ≥2 回文</text>

  <!-- Top: the local constraints -->
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#888">局部约束：每个字符 ≠ 前一个、≠ 前两个</text>

  <!-- char boxes: a b c d a ... -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="99" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
    <rect x="108" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="99" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
    <rect x="156" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="178" y="99" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
    <rect x="204" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="226" y="99" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
    <rect x="252" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="274" y="99" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
    <text x="300" y="99" font-size="14" fill="#888">...</text>
  </g>

  <!-- len-2 arrows (adjacent must differ): between b and c, d and a -->
  <path d="M 130 64 L 178 64" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="154" y="58" text-anchor="middle" font-size="9" fill="#b85450">≠（禁 len2 回文）</text>
  <path d="M 226 64 L 274 64" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- len-3 arrows (2-apart must differ): between a and c, b and d, c and a -->
  <path d="M 82 128 L 178 128" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="9" fill="#d6a040">≠（禁 len3 回文）</text>
  <path d="M 130 128 L 226 128" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 128 L 274 128" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="40" y1="170" x2="520" y2="170" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- Bottom: why longer palindromes are implied -->
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#888">长回文必含 len2/len3 中心 → 禁短即禁长</text>

  <!-- length-4 palindrome x y y x -->
  <g filter="url(#rough2)">
    <rect x="60" y="206" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="80" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x</text>
    <rect x="104" y="206" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="124" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">y</text>
    <rect x="148" y="206" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="168" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">y</text>
    <rect x="192" y="206" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="212" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x</text>
  </g>
  <!-- brace under middle two -->
  <path d="M 104 252 Q 124 264 144 252" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="278" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中间 y=y 即 len2 回文</text>
  <text x="126" y="296" text-anchor="middle" font-size="9" fill="#888">长度4回文 ⟹ 含len2回文</text>

  <!-- length-5 palindrome x y z y x -->
  <g filter="url(#rough2)">
    <rect x="320" y="206" width="36" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="338" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x</text>
    <rect x="360" y="206" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="378" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">y</text>
    <rect x="400" y="206" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="418" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">z</text>
    <rect x="440" y="206" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="458" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">y</text>
    <rect x="480" y="206" width="36" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="498" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x</text>
  </g>
  <path d="M 360 252 Q 418 268 478 252" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="278" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">两端 y=y 即 len3 回文</text>
  <text x="418" y="296" text-anchor="middle" font-size="9" fill="#888">长度5回文 ⟹ 含len3回文</text>

  <!-- bottom takeaway -->
  <rect x="40" y="318" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">只需检查局部：s[i] ≠ s[i-1] 且 s[i] ≠ s[i-2]</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#555">所有 ≥2 回文都被这两条局部约束间接禁止</text>
  <text x="280" y="376" text-anchor="middle" font-size="9" fill="#888">k≥4 保证至少 4 个字母，去掉前两个后仍 ≥2 可选</text>
</svg>
