<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：s 当队列、t 当栈，栈顶 ≤ 后缀最小值即出栈</text>

  <!-- s row: queue, consume from left -->
  <text x="58" y="78" font-size="13" fill="#446688" filter="url(#rough2)">s（队列）：</text>
  <g filter="url(#rough2)">
    <rect x="118" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="156" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="194" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="137" y="80" text-anchor="middle">b</text>
    <text x="175" y="80" text-anchor="middle">a</text>
    <text x="213" y="80" text-anchor="middle">c</text>
  </g>
  <!-- index -->
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="137" y="108" text-anchor="middle">0</text>
    <text x="175" y="108" text-anchor="middle">1</text>
    <text x="213" y="108" text-anchor="middle">2</text>
  </g>
  <!-- take front arrow -->
  <path d="M104 75 L82 75" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="68" font-size="11" fill="#446688" filter="url(#rough2)">取队首</text>

  <!-- op1: s front -> t tail (push) -->
  <path d="M137 96 L137 150" stroke="#446688" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="128" font-size="11" fill="#446688" filter="url(#rough2)">操作一：压入 t 尾</text>

  <!-- t row: stack, top = right end -->
  <text x="58" y="178" font-size="13" fill="#4a7a3a" filter="url(#rough2)">t（栈）：</text>
  <g filter="url(#rough2)">
    <rect x="118" y="156" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="156" y="156" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="137" y="180" text-anchor="middle">b</text>
    <text x="175" y="180" text-anchor="middle">a</text>
  </g>
  <text x="200" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">← 栈顶</text>
  <path d="M200 188 L222 188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- op2: t top -> paper (pop) -->
  <path d="M175 196 L175 250" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="184" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">操作二：栈顶写纸</text>

  <!-- answer paper -->
  <text x="58" y="278" font-size="13" fill="#d6a040" filter="url(#rough2)">纸（答案）：</text>
  <g filter="url(#rough2)">
    <rect x="138" y="256" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="176" y="256" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="214" y="256" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="3 3"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="157" y="280" text-anchor="middle">a</text>
    <text x="195" y="280" text-anchor="middle">b</text>
    <text x="233" y="280" text-anchor="middle">?</text>
  </g>

  <!-- suffix min array -->
  <text x="320" y="78" font-size="13" fill="#446688" filter="url(#rough2)">后缀最小值 suf：</text>
  <g filter="url(#rough2)">
    <rect x="430" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="468" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="506" y="56" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="544" y="56" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="449" y="80" text-anchor="middle">a</text>
    <text x="487" y="80" text-anchor="middle">a</text>
    <text x="525" y="80" text-anchor="middle">c</text>
    <text x="563" y="80" text-anchor="middle">{</text>
  </g>
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="449" y="108" text-anchor="middle">0</text>
    <text x="487" y="108" text-anchor="middle">1</text>
    <text x="525" y="108" text-anchor="middle">2</text>
    <text x="563" y="108" text-anchor="middle">3</text>
  </g>
  <text x="449" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">min(s[0:])</text>
  <text x="563" y="126" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">哨兵 'z'+1</text>

  <!-- decision rule box -->
  <rect x="40" y="320" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="343" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">决策：当 t 非空且 t.top ≤ suf[i+1] → 弹栈写纸（栈顶不劣于任何剩余字符）</text>

  <rect x="40" y="362" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="385" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">否则 → 从 s 取队首压入 t（剩余中有更小字符，须先把它推到栈顶）</text>
</svg>
