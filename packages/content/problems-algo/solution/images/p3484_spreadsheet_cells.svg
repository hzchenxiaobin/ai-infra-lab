<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">稀疏存储：哈希表只记「写过的格子」</text>

  <text x="120" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">电子表格（26 列 A–Z × rows 行）</text>

  <!-- 列标 -->
  <text x="72" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">A</text>
  <text x="120" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">B</text>
  <text x="168" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">C</text>
  <text x="204" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">…</text>
  <!-- 行标 -->
  <text x="32" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="32" y="136" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="32" y="172" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <text x="32" y="208" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>

  <!-- 空格子 -->
  <rect x="96" y="76" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="76" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="112" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="112" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="148" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="148" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="148" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="184" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="184" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="184" width="48" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- A1 高亮 -->
  <rect x="48" y="76" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="99" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">10</text>
  <!-- B2 高亮 -->
  <rect x="96" y="112" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="13" fill="#8a6206" filter="url(#rough2)">15</text>

  <text x="120" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只有 A1、B2 被写过，其余全空</text>

  <!-- 汇聚箭头 -->
  <path d="M 212 130 L 282 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="247" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">只存写过的</text>

  <!-- 哈希表 -->
  <rect x="292" y="62" width="192" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="388" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cells 哈希表</text>
  <rect x="308" y="100" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">"A1"</text>
  <text x="372" y="118" font-size="12" fill="#333" filter="url(#rough2)">→ 10</text>
  <rect x="308" y="140" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="158" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">"B2"</text>
  <text x="372" y="158" font-size="12" fill="#333" filter="url(#rough2)">→ 15</text>

  <!-- 底部说明 -->
  <rect x="40" y="276" width="440" height="74" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ 未写过的格子不占内存，getValue 查询缺省取 0</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ setCell / resetCell：字符串直接当键，连坐标解析都省了</text>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⚠ 操作总数 ≤ 10⁴ ≪ 26 × rows 个格子：写操作天然稀疏</text>
</svg>
