<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：同一对角线 i+j 相同，自下而上(i 降序)输出</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">桶号 = i+j 定全局序；行号降序定桶内序，无需排序</text>

  <!-- ===== Left: 3x3 grid ===== -->
  <text x="150" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 1 网格（颜色按对角线 i+j 分组）</text>

  <!-- col labels j -->
  <g font-size="10" fill="#888">
    <text x="90" y="92" text-anchor="middle">j=0</text>
    <text x="150" y="92" text-anchor="middle">j=1</text>
    <text x="210" y="92" text-anchor="middle">j=2</text>
  </g>
  <!-- row labels i -->
  <g font-size="10" fill="#888">
    <text x="46" y="130" text-anchor="middle">i=0</text>
    <text x="46" y="190" text-anchor="middle">i=1</text>
    <text x="46" y="250" text-anchor="middle">i=2</text>
  </g>

  <!-- cells: x=60+j*60, y=96+i*60, size 60x60 -->
  <!-- (0,0) s=0 green -->
  <rect x="60" y="96" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="112" y="110" text-anchor="end" font-size="9" fill="#4a7a3a">0</text>
  <!-- (0,1) s=1 blue -->
  <rect x="120" y="96" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <text x="172" y="110" text-anchor="end" font-size="9" fill="#446688">1</text>
  <!-- (0,2) s=2 orange -->
  <rect x="180" y="96" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="132" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>
  <text x="232" y="110" text-anchor="end" font-size="9" fill="#d6a040">2</text>
  <!-- (1,0) s=1 blue -->
  <rect x="60" y="156" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <text x="112" y="170" text-anchor="end" font-size="9" fill="#446688">1</text>
  <!-- (1,1) s=2 orange -->
  <rect x="120" y="156" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>
  <text x="172" y="170" text-anchor="end" font-size="9" fill="#d6a040">2</text>
  <!-- (1,2) s=3 red -->
  <rect x="180" y="156" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="192" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="232" y="170" text-anchor="end" font-size="9" fill="#b85450">3</text>
  <!-- (2,0) s=2 orange -->
  <rect x="60" y="216" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="252" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">7</text>
  <text x="112" y="230" text-anchor="end" font-size="9" fill="#d6a040">2</text>
  <!-- (2,1) s=3 red -->
  <rect x="120" y="216" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <text x="172" y="230" text-anchor="end" font-size="9" fill="#b85450">3</text>
  <!-- (2,2) s=4 green -->
  <rect x="180" y="216" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="252" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="232" y="230" text-anchor="end" font-size="9" fill="#4a7a3a">4</text>

  <!-- corner i+j label note -->
  <text x="150" y="294" text-anchor="middle" font-size="9" fill="#888">↖ 角标 = i+j（桶号）</text>

  <!-- within-diagonal order arrows (bottom -> top, i descending) -->
  <!-- s=1: (1,0)->(0,1) -->
  <path d="M 108 178 L 132 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- s=2: (2,0)->(1,1)->(0,2) -->
  <path d="M 108 238 L 132 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 168 178 L 192 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- s=3: (2,1)->(1,2) -->
  <path d="M 168 238 L 192 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="150" y="312" text-anchor="middle" font-size="9" fill="#b85450">红色箭头：同对角线内 i 由大到小（自下而上）</text>

  <!-- ===== Right: diagonal groups ===== -->
  <text x="460" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">按桶号 i+j 分组（自下而上）</text>

  <!-- group rows: y = 108, 144, 180, 216, 252 -->
  <!-- s=0 -->
  <text x="300" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">s=0:</text>
  <rect x="334" y="112" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- s=1 -->
  <text x="300" y="162" font-size="11" fill="#446688" font-weight="bold">s=1:</text>
  <rect x="334" y="148" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <path d="M 370 160 L 386 160" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="390" y="148" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- s=2 -->
  <text x="300" y="198" font-size="11" fill="#d6a040" font-weight="bold">s=2:</text>
  <rect x="334" y="184" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <path d="M 370 196 L 386 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="390" y="184" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <path d="M 426 196 L 442 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="446" y="184" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="463" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- s=3 -->
  <text x="300" y="234" font-size="11" fill="#b85450" font-weight="bold">s=3:</text>
  <rect x="334" y="220" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <path d="M 370 232 L 386 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="390" y="220" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <!-- s=4 -->
  <text x="300" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">s=4:</text>
  <rect x="334" y="256" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- concatenate arrow -->
  <text x="460" y="298" text-anchor="middle" font-size="10" fill="#888">↓ 按桶号顺序拼接</text>

  <!-- final output -->
  <rect x="300" y="306" width="280" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[1, 4, 2, 7, 5, 3, 8, 6, 9]</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="350" width="560" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两个关键观察</text>
  <text x="56" y="392" font-size="11" fill="#555">① <tspan font-weight="bold" fill="#446688">同一对角线 ⇔ i+j 相同</tspan>：沿左下→右上走一步 i+1, j−1，i+j 守恒。i+j 即天然桶号，定对角线全局顺序。</text>
  <text x="56" y="410" font-size="11" fill="#555">② <tspan font-weight="bold" fill="#4a7a3a">自底向上遍历 ⇒ 桶内 i 降序</tspan>：i 从 R−1 到 0 处理，大行号先入桶，同桶内天然 i 由大到小（自下而上）。</text>
  <text x="56" y="428" font-size="10" fill="#888">⇒ 两重有序性都由遍历顺序给出，无需排序/比较，整体 O(n) 一趟完成</text>
</svg>
