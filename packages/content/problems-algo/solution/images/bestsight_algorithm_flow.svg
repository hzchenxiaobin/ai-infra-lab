<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一次扫描算法流程（维护左贡献最大值 maxLeft）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: maxLeft = values[0]+0, ans = −∞</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init j -->
  <rect x="150" y="104" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">j = 1</text>

  <!-- arrow down -->
  <path d="M 270 134 L 270 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: j < n? -->
  <polygon points="270,156 370,196 270,236 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">j &lt; n ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#666">(还有右景点)</text>

  <!-- No branch -> end -->
  <path d="M 370 196 L 452 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="196" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="200" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 236 L 270 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="250" font-size="11" fill="#82b366">是</text>

  <!-- compute candidate -->
  <rect x="110" y="258" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#333">candidate = maxLeft + values[j] − j</text>

  <!-- arrow down -->
  <path d="M 270 292 L 270 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update ans -->
  <rect x="150" y="314" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, candidate)</text>

  <!-- arrow down -->
  <path d="M 270 344 L 270 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update maxLeft -->
  <rect x="110" y="366" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxLeft = max(maxLeft, values[j] + j)</text>

  <!-- arrow down -->
  <path d="M 270 400 L 270 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j++ -->
  <rect x="200" y="420" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="12" fill="#333">j = j + 1</text>

  <!-- loop back arrow from j++ up to decision -->
  <path d="M 340 434 L 510 434 L 510 196 L 370 196" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="316" font-size="10" fill="#888" transform="rotate(-90 520 316)">继续扫描</text>
</svg>
