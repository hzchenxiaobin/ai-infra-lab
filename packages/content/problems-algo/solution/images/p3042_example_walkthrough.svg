<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：words = ["a","aba","ababa","aa"]，共 C(4,2) = 6 对</text>

  <!-- table outer -->
  <rect x="44" y="48" width="432" height="232" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="44" y="48" width="432" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="77" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(i, j)</text>
  <text x="149" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p = words[i]</text>
  <text x="232" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s = words[j]</text>
  <text x="307" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀?</text>
  <text x="369" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀?</text>
  <text x="438" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">计数</text>

  <!-- vertical lines -->
  <path d="M 110 48 L 110 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 188 48 L 188 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 276 48 L 276 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 338 48 L 338 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 400 48 L 400 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- horizontal lines -->
  <path d="M 44 110 L 476 110" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 44 144 L 476 144" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 44 178 L 476 178" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 44 212 L 476 212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 44 246 L 476 246" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: (0,1) -->
  <text x="77" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="149" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"a"</text>
  <text x="232" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aba"</text>
  <text x="307" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="369" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="98" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- row 2: (0,2) -->
  <text x="77" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 2)</text>
  <text x="149" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"a"</text>
  <text x="232" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"ababa"</text>
  <text x="307" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="369" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="132" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- row 3: (0,3) -->
  <text x="77" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 3)</text>
  <text x="149" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"a"</text>
  <text x="232" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="307" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="369" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- row 4: (1,2) -->
  <text x="77" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="149" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aba"</text>
  <text x="232" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"ababa"</text>
  <text x="307" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="369" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- row 5: (1,3) -->
  <text x="77" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 3)</text>
  <text x="149" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aba"</text>
  <text x="232" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="307" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="369" y="234" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="438" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+0</text>

  <!-- row 6: (2,3) -->
  <text x="77" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <text x="149" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"ababa"</text>
  <text x="232" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="307" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="369" y="268" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="438" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+0</text>

  <!-- summary box -->
  <rect x="44" y="294" width="432" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">双 ✓ 才计数：(0,1)、(0,2)、(0,3)、(1,2) 共 4 对 → ans = 4</text>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,3) 前缀 "ab" ≠ "aa" 即短路；(2,3) k=5 &gt; m=2 装不下 —— 单向 i &lt; j，(j,i) 不必再看</text>
</svg>
