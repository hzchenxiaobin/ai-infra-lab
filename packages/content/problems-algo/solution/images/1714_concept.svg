<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    查询 [x, y]：从下标 x 起，每隔步长 y 取一个元素求和
  </text>

  <!-- Array label -->
  <text x="48" y="60" font-size="11" fill="#888" filter="url(#rough2)">数组 nums（示例查询 [0, 3]）</text>

  <!-- 8 cells, width 46, start x=70 -->
  <!-- cell 0 (highlight) -->
  <rect x="70" y="68" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <!-- cell 1 -->
  <rect x="116" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="93" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">1</text>
  <!-- cell 2 -->
  <rect x="162" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="93" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">2</text>
  <!-- cell 3 (highlight) -->
  <rect x="208" y="68" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <!-- cell 4 -->
  <rect x="254" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="93" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
  <!-- cell 5 -->
  <rect x="300" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="93" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">5</text>
  <!-- cell 6 (highlight) -->
  <rect x="346" y="68" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <!-- cell 7 -->
  <rect x="392" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="93" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">7</text>

  <!-- index labels -->
  <text x="93" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">x</text>
  <text x="231" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">x+y</text>
  <text x="369" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">x+2y</text>

  <!-- step arrows below -->
  <path d="M93,136 L228,136" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M234,136 L366,136" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">步长 y = 3</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">和 = 0 + 3 + 6 = 9</text>

  <!-- divider -->
  <path d="M40,182 L520,182" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- Left strategy: small y -->
  <rect x="40" y="196" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="218" text-anchor="middle" font-size="12" fill="#2a5a1a" filter="url(#rough2)">小步长 y ≤ B</text>
  <text x="155" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">预处理表 pre[y][x]</text>
  <text x="155" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pre[y][x] = nums[x] + pre[y][x+y]</text>
  <text x="155" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">查询：O(1) 直接查表</text>
  <text x="155" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">预处理开销 O(n·B)</text>

  <!-- Right strategy: large y -->
  <rect x="290" y="196" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">大步长 y &gt; B</text>
  <text x="405" y="238" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">直接遍历累加</text>
  <text x="405" y="254" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">i = x, x+y, x+2y, … &lt; n</text>
  <text x="405" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">项数 ≤ n/B = O(√n)</text>
  <text x="405" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">无需预处理</text>

  <!-- branch arrows from a center node -->
  <path d="M280,176 L160,194" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M280,176 L400,194" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">按 y 分流</text>

  <!-- Bottom insight -->
  <rect x="40" y="312" width="480" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#7a3a3a" filter="url(#rough2)">取 B = √n 平衡两端</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#7a3a3a" filter="url(#rough2)">预处理 O(n√n) + 查询 O(q√n) = O((n+q)√n)</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">暴力 O(n·q) → 根号优化，量级从 10⁹ 降到 10⁷</text>
</svg>
