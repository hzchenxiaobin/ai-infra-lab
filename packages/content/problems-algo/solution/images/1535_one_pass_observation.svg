<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：冠军单调递增，一轮扫描后冠军 = 全局最大值</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">败者移到队尾 → 挑战者按原序依次出场 → 冠军只会被更大者替换</text>

  <!-- ===== 上半：单遍扫描中冠军的变化 ===== -->
  <text x="28" y="68" font-size="10.5" fill="#666">单遍扫描</text>
  <text x="28" y="82" font-size="10" fill="#888">i: 0 → 1 → 2 → … → n−1</text>

  <!-- champion trajectory: 2 → 3 → 5 → 6 → 7 -->
  <rect x="70" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 114 88 L 134 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="80" text-anchor="middle" font-size="9" fill="#888">3&gt;2</text>

  <rect x="138" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <path d="M 182 88 L 202 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="80" text-anchor="middle" font-size="9" fill="#888">5&gt;3</text>

  <rect x="206" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <path d="M 250 88 L 270 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="9" fill="#888">6&gt;5</text>

  <rect x="274" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <path d="M 318 88 L 338 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="80" text-anchor="middle" font-size="9" fill="#888">7&gt;6</text>

  <rect x="342" y="72" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <text x="402" y="88" font-size="10" fill="#d6a040" font-weight="bold">= max(arr)</text>
  <text x="402" y="100" font-size="9.5" fill="#888">全局最大值</text>

  <!-- note: champion monotone increase -->
  <rect x="60" y="112" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="10.5" fill="#333">冠军只在遇到更大元素时才更换 → 连胜计数从 1 重新累计</text>

  <!-- ===== 下半：两种情况 ===== -->
  <!-- Case A: k 较小 -->
  <rect x="40" y="150" width="210" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">情况 A：k ≤ n−1</text>
  <text x="145" y="188" text-anchor="middle" font-size="10.5" fill="#555">扫描途中某冠军连胜</text>
  <text x="145" y="202" text-anchor="middle" font-size="10.5" fill="#555">达 k 次 → 立即返回</text>
  <text x="145" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k = 2：冠军 5 连胜 2 → 返回 5</text>
  <text x="145" y="236" text-anchor="middle" font-size="9.5" fill="#888">至多 n−1 步内必命中</text>

  <!-- Case B: k 较大 -->
  <rect x="270" y="150" width="210" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">情况 B：k &gt; n−1</text>
  <text x="375" y="188" text-anchor="middle" font-size="10.5" fill="#555">一轮扫完无人达 k 连胜</text>
  <text x="375" y="202" text-anchor="middle" font-size="10.5" fill="#555">但冠军已是全局最大值</text>
  <text x="375" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">max 后续必全胜 → 返回 max</text>
  <text x="375" y="236" text-anchor="middle" font-size="9.5" fill="#888">k = 10：返回 7（示例 2 思路）</text>

  <!-- ===== 底部总结 ===== -->
  <rect x="40" y="262" width="440" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么只需一轮？</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#555">败者移到队尾后，要等其余 n−2 个元素全部出过场才会再次轮到</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#555">→ 一轮内每个元素恰好挑战一次；二轮起冠军恒为 max，全胜</text>

  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888">结论：O(n) 单遍扫描 + 连胜计数，无需真正搬移元素 / 无需队列</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#aaa">对比朴素模拟（队列 dequeue/enqueue）：O(k) 可能达 10⁹ 步 → TLE</text>
</svg>
