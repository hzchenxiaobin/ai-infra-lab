<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 444"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="444" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：乘积是完全平方数 ⟺ 两数的「无平方因子核」相同</text>

  <!-- ① 拆数 -->
  <rect x="20" y="34" width="520" height="136" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="54" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 拆数：唯一分解 x = a²·s，s 无平方因子 = 奇数次素因子之积</text>

  <rect x="36" y="64" width="152" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="82" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">8 = 2³ = 2²·2</text>
  <text x="112" y="100" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">核 = 2</text>

  <rect x="204" y="64" width="152" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">18 = 2·3² = 3²·2</text>
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">核 = 2</text>

  <rect x="372" y="64" width="152" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="82" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">12 = 2²·3</text>
  <text x="448" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">核 = 3</text>

  <text x="36" y="128" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">核 2 × 核 2 ⟹ 8·18 = 144 = 12² ✓ 完全平方</text>
  <text x="36" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">核 2 × 核 3 ⟹ 8·12 = 96 ✗（素因子 2 的总次数 3+2=5 为奇）</text>

  <!-- ② 换问法：树 -->
  <rect x="20" y="182" width="520" height="134" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="202" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 换问法：t_i = 祖先中「核 = sq(nums[i])」的个数（示例 1：核全是 2）</text>

  <text x="105" y="216" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">根</text>
  <circle cx="105" cy="248" r="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="245" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">值 2</text>
  <text x="105" y="259" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">核 2</text>
  <text x="105" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>

  <path d="M 132 248 L 198 248" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <circle cx="225" cy="248" r="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="245" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">值 8</text>
  <text x="225" y="259" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">核 2</text>
  <text x="225" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>

  <path d="M 252 248 L 318 248" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <circle cx="345" cy="248" r="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="245" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">值 2</text>
  <text x="345" y="259" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">核 2</text>
  <text x="345" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>

  <rect x="430" y="222" width="102" height="60" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="481" y="240" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">t₁ = 1</text>
  <text x="481" y="256" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">t₂ = 2</text>
  <text x="481" y="274" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 3</text>

  <text x="36" y="308" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">每个节点只问一句：祖先里核与我相同的有几个？——乘法与平方检验全部消失</text>

  <!-- ③ DFS 维护 cnt -->
  <rect x="20" y="328" width="520" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="348" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ DFS：路径 = 祖先集合，cnt[核] 进入 +1 / 退出 −1</text>

  <text x="36" y="376" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">进入 0：cnt[2] 0→1（根不计 t）</text>
  <text x="36" y="394" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">进入 1：读 cnt[2]=1 ⇒ t₁=1，再 1→2</text>
  <text x="36" y="412" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">进入 2：读 cnt[2]=2 ⇒ t₂=2，再 2→3</text>

  <text x="310" y="376" font-size="10.5" fill="#7a3b37" font-weight="bold" filter="url(#rough2)">退出 u：cnt[sq(u)] −1（回溯）</text>
  <text x="310" y="394" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">不回溯 ⇒ 兄弟子树残留路径上，</text>
  <text x="310" y="412" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">「旁亲」被错算成祖先</text>
</svg>
