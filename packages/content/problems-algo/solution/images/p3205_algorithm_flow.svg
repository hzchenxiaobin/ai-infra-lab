<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：从右往左一趟，维护后缀最大值</text>

  <ellipse cx="170" cy="52" rx="36" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 170 67 L 170 76" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="80" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans ← 0；mx ← 0</text>

  <path d="M 170 108 L 170 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,122 232,150 170,178 108,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i ≥ 1 ?</text>

  <text x="248" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 232 150 L 356 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="412" cy="150" rx="54" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="155" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="180" y="196" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 178 L 170 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="196" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx ← max(mx, nums[i])</text>

  <path d="M 170 226 L 170 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="240" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans ← ans + mx（段 [i−1,i] 贡献）</text>

  <path d="M 170 270 L 170 280" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="284" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="303" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← i − 1</text>

  <path d="M 100 298 L 44 298 L 44 150 L 104 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="230" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 38 230)">回到循环判断</text>

  <!-- 旁注：不变式 -->
  <rect x="322" y="196" width="180" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">循环不变式</text>
  <text x="412" y="237" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mx = max(nums[i..n−1])</text>
  <text x="412" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans = Σ max(nums[t..n−1])</text>

  <rect x="322" y="278" width="180" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="298" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">要还原具体跳跃路径？</text>
  <text x="412" y="315" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">单调栈一遍扫描：栈内</text>
  <text x="412" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">从底到顶 + 起点 0</text>
  <text x="412" y="345" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">即最优落点链</text>

  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n)，空间 O(1)——只滚动两个变量</text>
</svg>
