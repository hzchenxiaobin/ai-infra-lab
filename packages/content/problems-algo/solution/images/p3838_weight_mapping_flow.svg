<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层逐词、内层逐字符，一趟拼接出答案</text>

  <!-- 开始 -->
  <ellipse cx="230" cy="46" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="51" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 230 62 L 230 72" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 取词 -->
  <rect x="130" y="76" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="97" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 取下一个单词 word</text>

  <path d="M 230 110 L 230 120" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 求和 -->
  <rect x="130" y="124" width="200" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="145" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② w ← Σ weights[c − 'a']</text>

  <path d="M 230 158 L 230 168" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 取模 -->
  <rect x="130" y="172" width="200" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="193" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ r ← w % 26 ∈ [0, 25]</text>

  <path d="M 230 206 L 230 216" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 映射拼接 -->
  <rect x="130" y="220" width="200" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="241" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 结果追加 'z' − r</text>

  <path d="M 230 254 L 230 264" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 -->
  <polygon points="230,268 300,298 230,328 160,298" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="302" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">词表扫完？</text>

  <!-- 否：回到 ① -->
  <path d="M 160 298 L 84 298 L 84 93 L 124 93" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="290" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- 是：返回 -->
  <path d="M 300 298 L 354 298" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="288" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="360" y="280" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="302" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回拼接结果</text>

  <!-- 右侧注释 -->
  <text x="440" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每词恰出一字符</text>

  <rect x="372" y="112" width="136" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">单串权重上界</text>
  <text x="440" y="153" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">10 × 100 = 1000</text>
  <text x="440" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">int 足够，无溢出</text>

  <text x="440" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">答案长度 = 单词数 n</text>
</svg>
