<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：CASE WHEN 分流到两个半年桶，AVG 各自忽略 NULL</text>

  <text x="26" y="54" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">司机 2（Bob）：两个桶都有行程</text>

  <rect x="20" y="62" width="136" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1月 · 100.0 / 9.0</text>

  <rect x="20" y="100" width="136" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4月 · 250.0 / 22.0</text>

  <rect x="20" y="138" width="136" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10月 · 200.0 / 15.0</text>

  <rect x="232" y="58" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上半年 AVG</text>
  <text x="298" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11.2374…</text>

  <rect x="232" y="136" width="132" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下半年 AVG</text>
  <text x="298" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13.3333…</text>

  <path d="M 158 77 L 228 78" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 158 115 Q 194 106 226 94" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 158 153 L 228 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="398" y="94" width="106" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">差 = 2.0960…</text>
  <text x="451" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&gt; 0 → 保留 ✓</text>
  <text x="451" y="149" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(2.10)</text>

  <path d="M 366 80 Q 384 92 396 108" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 366 158 Q 384 150 396 138" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 30 214 L 490 214" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <text x="26" y="244" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">司机 3（Carol）：下半年桶是空的 → NULL</text>

  <rect x="20" y="254" width="136" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3月 · 80.0 / 8.5</text>

  <rect x="20" y="292" width="136" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5月 · 90.0 / 9.2</text>

  <rect x="232" y="262" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上半年 AVG</text>
  <text x="298" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9.5948…</text>

  <rect x="232" y="330" width="132" height="44" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="298" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">下半年 AVG</text>
  <text x="298" y="365" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">NULL（无行程）</text>

  <path d="M 158 269 Q 194 268 226 276" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 158 307 Q 194 302 226 292" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="398" y="298" width="106" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">NULL − 9.59</text>
  <text x="451" y="335" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= NULL</text>
  <text x="451" y="355" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">WHERE 过滤 ✗</text>

  <path d="M 366 284 Q 384 292 396 304" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 366 352 L 396 344" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">AVG 只数非 NULL（分母自动正确）；缺半年 ⇒ NULL ⇒ NULL &gt; 0 不为真 ⇒ 自动剔除</text>
</svg>
