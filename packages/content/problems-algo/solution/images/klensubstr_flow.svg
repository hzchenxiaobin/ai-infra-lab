<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定长 K 滑动窗口 + distinct 增量维护</text>

  <!-- Start -->
  <rect x="225" y="46" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 freq / distinct</text>

  <path d="M 280 80 L 280 96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="200" y="98" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for right = 0 .. n−1</text>

  <path d="M 280 132 L 280 148" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Add right char -->
  <rect x="150" y="150" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">右扩：freq[s[right]]++</text>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#666">若 freq 0→1，distinct++</text>

  <path d="M 280 192 L 280 206" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: window full? -->
  <polygon points="280,208 380,250 280,292 180,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口已满?</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#666">right &gt;= K−1</text>

  <!-- No branch: continue loop -->
  <path d="M 380 250 L 430 250 L 430 114 L 360 114" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="244" font-size="11" fill="#888">否</text>
  <text x="436" y="184" font-size="11" fill="#888">窗口未满</text>
  <text x="436" y="198" font-size="11" fill="#888">继续右扩</text>

  <!-- Yes branch -->
  <path d="M 280 292 L 280 306" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="302" font-size="11" fill="#888">是</text>

  <!-- Check distinct == K -->
  <rect x="150" y="308" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">若 distinct == K：ans++</text>
  <text x="280" y="341" text-anchor="middle" font-size="11" fill="#666">（窗口无重复，计入答案）</text>

  <!-- Slide left -->
  <path d="M 150 328 L 110 328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="308" width="86" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="63" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">左缩出窗</text>
  <text x="63" y="341" text-anchor="middle" font-size="10" fill="#666">freq 1→0 则</text>
  <text x="63" y="352" text-anchor="middle" font-size="10" fill="#666">distinct−−</text>

  <!-- loop back from left-shrink to for -->
  <path d="M 63 308 L 63 86 L 200 114" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)" stroke-dasharray="5 3"/>
  <text x="72" y="200" font-size="10" fill="#999">回循环</text>
</svg>
