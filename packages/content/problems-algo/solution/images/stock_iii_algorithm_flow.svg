<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：四变量滚动，一遍遍历 O(n)</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">k=2 固定 → 无需退化判断，4 个变量直接滚</text>

  <!-- ===== start ===== -->
  <rect x="195" y="60" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输入 prices</text>
  <line x1="270" y1="90" x2="270" y2="106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== n==0 guard ===== -->
  <rect x="200" y="108" width="140" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="10" fill="#444">n == 0 ? 返回 0</text>
  <line x1="270" y1="134" x2="270" y2="150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== init box ===== -->
  <rect x="120" y="152" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="173" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">初始化 buy1 = buy2 = −∞,  sell1 = sell2 = 0</text>
  <line x1="270" y1="186" x2="270" y2="202" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== loop header ===== -->
  <rect x="130" y="204" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历每天价格 p = prices[i]</text>
  <line x1="270" y1="234" x2="270" y2="248" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 4 update steps ===== -->
  <rect x="100" y="250" width="340" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="9" fill="#888">依次更新（同日买卖收益为 0，无需快照）</text>
  <g font-size="10" font-weight="bold">
    <text x="120" y="286" fill="#b85450">buy1  = max(buy1,  −p)</text>
    <text x="120" y="304" fill="#446688">sell1 = max(sell1, buy1 + p)</text>
    <text x="120" y="322" fill="#b85450">buy2  = max(buy2,  sell1 − p)</text>
    <text x="120" y="340" fill="#4a7a3a">sell2 = max(sell2, buy2 + p)</text>
  </g>

  <!-- loop back arrow -->
  <path d="M 440 265 Q 470 265, 470 219 L 410 219" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="244" text-anchor="middle" font-size="9" fill="#999">下一天</text>

  <!-- ===== return ===== -->
  <line x1="270" y1="350" x2="270" y2="366" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="368" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 sell2</text>
</svg>
