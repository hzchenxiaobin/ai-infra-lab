<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">book(start, end) 算法流程</text>

  <!-- Start -->
  <rect x="220" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">调用 book(s, e)</text>
  <line x1="280" y1="76" x2="280" y2="98" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: scan overlaps -->
  <rect x="120" y="100" width="320" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">① 扫描 overlaps（双重段表）</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#666">对每段 [os, oe)：若 max(os, s) &lt; min(oe, e)？</text>
  <text x="280" y="153" text-anchor="middle" font-size="10.5" fill="#888">→ 新事件与该双重段相交</text>

  <!-- Decision: intersects? -->
  <polygon points="280,180 380,210 280,240 180,210" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">存在相交？</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">(即会三重预订)</text>

  <!-- Yes branch: reject -->
  <line x1="180" y1="210" x2="100" y2="210" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <line x1="100" y1="210" x2="100" y2="270" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="272" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="100" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不更新任何表</text>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- No branch: proceed -->
  <line x1="380" y1="210" x2="460" y2="210" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="460" y1="210" x2="460" y2="262" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 2: update overlaps -->
  <rect x="300" y="264" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="284" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">② 扫描 booked</text>
  <text x="420" y="302" text-anchor="middle" font-size="10.5" fill="#666">对每个 [bs, be)：取交</text>
  <text x="420" y="318" text-anchor="middle" font-size="10.5" fill="#666">[max(bs,s), min(be,e)) → 加入 overlaps</text>

  <line x1="420" y1="326" x2="420" y2="348" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: push to booked -->
  <rect x="300" y="350" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="365" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">③ booked.push_back([s, e))</text>
  <text x="420" y="380" text-anchor="middle" font-size="10.5" fill="#888">入库新事件</text>

  <line x1="420" y1="390" x2="420" y2="410" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="350" y="412" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="420" y="428" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Footer note -->
  <text x="200" y="395" font-size="10.5" fill="#888">关键：拒绝时不污染两张表 → 状态始终一致</text>
</svg>
