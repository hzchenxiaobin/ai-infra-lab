<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按成本排序后，i 的合法搭档是一个前缀</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1（budget = 8）：卡片按成本升序，上排 = 成本（蓝），下排 = 容量（绿）</text>

  <!-- 左侧行标签 -->
  <g filter="url(#rough2)" font-size="11">
    <text x="36" y="90" text-anchor="end" fill="#33506b">成本</text>
    <text x="36" y="118" text-anchor="end" fill="#2f5d24">容量</text>
  </g>

  <!-- 机器卡片（按成本升序）：(3,7) (4,1) (5,2) (8,5) -->
  <!-- 卡 0：合法搭档（绿色） -->
  <g filter="url(#rough2)">
    <rect x="44" y="66" width="52" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="70" y="92" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">3</text>
    <text x="70" y="120" text-anchor="middle" font-size="13" fill="#2f5d24">7</text>
    <text x="70" y="144" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  </g>
  <!-- 卡 1：固定的 i（橙色） -->
  <g filter="url(#rough2)">
    <circle cx="132" cy="54" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="132" y="58" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">i</text>
    <rect x="106" y="66" width="52" height="62" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="132" y="92" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">4</text>
    <text x="132" y="120" text-anchor="middle" font-size="13" fill="#8a6d1a">1</text>
    <text x="132" y="144" text-anchor="middle" font-size="10" fill="#888">下标 1</text>
  </g>
  <!-- 卡 2、3：不合法搭档 -->
  <g filter="url(#rough2)">
    <rect x="168" y="66" width="52" height="62" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="194" y="92" text-anchor="middle" font-size="14" fill="#556">5</text>
    <text x="194" y="120" text-anchor="middle" font-size="13" fill="#556">2</text>
    <text x="194" y="144" text-anchor="middle" font-size="10" fill="#888">下标 2</text>
    <text x="213" y="80" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="230" y="66" width="52" height="62" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="256" y="92" text-anchor="middle" font-size="14" fill="#556">8</text>
    <text x="256" y="120" text-anchor="middle" font-size="13" fill="#556">5</text>
    <text x="256" y="144" text-anchor="middle" font-size="10" fill="#888">下标 3</text>
    <text x="275" y="80" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- 搭档前缀括线 -->
  <g filter="url(#rough2)">
    <path d="M 44 154 L 44 160 L 96 160 L 96 154" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="70" y="174" text-anchor="middle" font-size="10.5" fill="#2f5d24">搭档前缀 [0, q]，q = 0</text>
  </g>

  <!-- 推导注记 -->
  <g filter="url(#rough2)" font-size="11" fill="#444">
    <text x="160" y="196" text-anchor="middle">rem = budget − cost(i) = 8 − 4 = 4</text>
    <text x="160" y="213" text-anchor="middle">搭档须 cost &lt; 4 ⟹ r = 0（5、8 均 ≥ 4）</text>
  </g>

  <!-- 候选框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="226" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="164" y="248" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">候选 = cap(i) + prefMax[q] = 1 + 7 = 8 ✓</text>
  </g>

  <!-- 单台框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="270" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="290" text-anchor="middle" font-size="11.5" fill="#33506b">单台也顺手：t = 最右 cost &lt; budget 的下标</text>
    <text x="164" y="308" text-anchor="middle" font-size="11.5" fill="#33506b">budget = 8 ⟹ t = 2，ans = prefMax[2] = 7</text>
  </g>

  <!-- 边界框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="328" width="240" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="164" y="347" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">边界与成本并列：</text>
    <text x="164" y="364" text-anchor="middle" font-size="10.5" fill="#8a3030">budget ≤ 最小成本 ⟹ 一台都买不起 → 0</text>
    <text x="164" y="381" text-anchor="middle" font-size="10.5" fill="#8a3030">成本并列（示例 3）：r 可能 ≥ i，</text>
    <text x="164" y="396" text-anchor="middle" font-size="10.5" fill="#8a3030">q = min(r, i−1) 防止和自己配对</text>
  </g>

  <!-- 右侧要点面板 -->
  <g filter="url(#rough2)">
    <rect x="308" y="56" width="252" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="434" y="78" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">① 排序 ⟹ 成本条件是前缀</text>
    <text x="434" y="97" text-anchor="middle" font-size="10.5" fill="#33506b">cost[k] &lt; budget − cost[i]</text>
    <text x="434" y="113" text-anchor="middle" font-size="10.5" fill="#33506b">在有序数组上是前缀 [0, r]，</text>
    <text x="434" y="129" text-anchor="middle" font-size="10.5" fill="#33506b">二分或单调指针皆可定位</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="308" y="144" width="252" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="434" y="166" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">② 前缀只关心最大容量</text>
    <text x="434" y="185" text-anchor="middle" font-size="10.5" fill="#2f5d24">prefMax[i] = max(cap[0..i])</text>
    <text x="434" y="201" text-anchor="middle" font-size="10.5" fill="#2f5d24">一遍预聚合；搭档是谁不重要，</text>
    <text x="434" y="217" text-anchor="middle" font-size="10.5" fill="#2f5d24">容量最大就行</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="308" y="232" width="252" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="434" y="254" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">③ 阈值单调 ⟹ 双指针滑动</text>
    <text x="434" y="273" text-anchor="middle" font-size="10.5" fill="#8a6d1a">i 右移 → rem 递减 → r 只左移，</text>
    <text x="434" y="289" text-anchor="middle" font-size="10.5" fill="#8a6d1a">p 从 n−1 单向滑，均摊 O(n)</text>
    <text x="434" y="305" text-anchor="middle" font-size="10.5" fill="#8a6d1a">（不滑也行：每个 i 二分）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="308" y="320" width="252" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="434" y="342" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">④ 下标条件防重复配对</text>
    <text x="434" y="361" text-anchor="middle" font-size="10.5" fill="#8a3030">搭档还须 k &lt; i：q = min(r, i−1)；</text>
    <text x="434" y="377" text-anchor="middle" font-size="10.5" fill="#8a3030">每对只在下标较大的一台处</text>
    <text x="434" y="393" text-anchor="middle" font-size="10.5" fill="#8a3030">枚举一次——不重不漏</text>
  </g>
</svg>
