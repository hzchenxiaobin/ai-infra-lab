<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：技能恰好相等 ⇒ 分桶独立，桶内取 Top-k</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1：workers = [1,2,3,4,5]，tasks = [[1,100],[2,400],[3,100],[3,400]]</text>

  <!-- workers row -->
  <text x="40" y="67" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">工人</text>
  <rect x="70" y="50" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="68" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="126" y="50" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="68" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="182" y="50" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="68" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="238" y="50" width="44" height="26" rx="4" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <rect x="294" y="50" width="44" height="26" rx="4" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316" y="68" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <text x="352" y="60" font-size="9" fill="#999" filter="url(#rough2)">工人 4、5：</text>
  <text x="352" y="72" font-size="9" fill="#999" filter="url(#rough2)">对应技能桶是空的 → 闲着</text>

  <!-- big arrow down: grouping -->
  <path d="M 200 84 L 200 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="212" y="99" font-size="9.5" fill="#33506b" filter="url(#rough2)">按技能分桶（恰好相等才可接单）</text>

  <!-- bucket 1 -->
  <rect x="45" y="110" width="130" height="94" rx="8" fill="#ffffff" stroke="#9db4c9" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">技能 1（工人 1 人）</text>
  <rect x="85" y="138" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="11" fill="#2d5523" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="110" y="186" text-anchor="middle" font-size="8.5" fill="#4a6b3f" filter="url(#rough2)">整桶认领 ✓</text>

  <!-- bucket 2 -->
  <rect x="195" y="110" width="130" height="94" rx="8" fill="#ffffff" stroke="#9db4c9" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">技能 2（工人 1 人）</text>
  <rect x="235" y="138" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#2d5523" font-weight="bold" filter="url(#rough2)">400</text>
  <text x="260" y="186" text-anchor="middle" font-size="8.5" fill="#4a6b3f" filter="url(#rough2)">整桶认领 ✓</text>

  <!-- bucket 3 -->
  <rect x="345" y="110" width="135" height="94" rx="8" fill="#ffffff" stroke="#9db4c9" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="128" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">技能 3（工人 1 人）</text>
  <rect x="360" y="138" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="154" text-anchor="middle" font-size="11" fill="#2d5523" font-weight="bold" filter="url(#rough2)">400</text>
  <text x="415" y="153" font-size="8.5" fill="#2d5523" filter="url(#rough2)">取第 1 大</text>
  <rect x="360" y="168" width="50" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="184" text-anchor="middle" font-size="11" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="415" y="183" font-size="8.5" fill="#7a2f2b" filter="url(#rough2)">第 k+1 大</text>

  <!-- leftover flows to pool -->
  <path d="M 385 192 L 385 218" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- pool -->
  <rect x="345" y="222" width="135" height="46" rx="8" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="412" y="240" text-anchor="middle" font-size="10.5" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">剩余池</text>
  <text x="412" y="258" text-anchor="middle" font-size="10" fill="#7a2f2b" filter="url(#rough2)">{ 100 }</text>

  <!-- extra worker -->
  <rect x="45" y="222" width="150" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">额外工人（技能不限）</text>
  <text x="120" y="258" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">只接一单：收剩余最大</text>

  <!-- pool -> extra worker -->
  <path d="M 345 245 L 198 245" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="271" y="237" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+100</text>

  <!-- result -->
  <rect x="45" y="288" width="435" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="310" text-anchor="middle" font-size="11" fill="#2d5523" font-weight="bold" filter="url(#rough2)">常规 100 + 400 + 400 = 900，额外 +100</text>
  <text x="262" y="330" text-anchor="middle" font-size="9.5" fill="#4a6b3f" filter="url(#rough2)">ans = 1000；每桶取前 min(c_s, m_s) 大，额外工人收剩余最大</text>
</svg>
