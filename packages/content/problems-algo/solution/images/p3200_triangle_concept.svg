<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：行颜色由行号奇偶决定 → 全局只有两种方案</text>

  <!-- 红顶方案 -->
  <text x="150" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">红顶方案（奇红偶蓝）</text>
  <text x="48" y="80" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行1 奇</text>
  <text x="48" y="116" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行2 偶</text>
  <text x="48" y="152" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行3 奇</text>
  <text x="48" y="188" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行4 偶</text>

  <circle cx="150" cy="76" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="130" cy="112" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="112" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="110" cy="148" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="148" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="148" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="90" cy="184" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="130" cy="184" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="184" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="210" cy="184" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 蓝顶方案 -->
  <text x="370" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">蓝顶方案（奇蓝偶红）</text>
  <text x="268" y="80" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行1 奇</text>
  <text x="268" y="116" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行2 偶</text>
  <text x="268" y="152" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行3 奇</text>
  <text x="268" y="188" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">行4 偶</text>

  <circle cx="370" cy="76" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="350" cy="112" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="390" cy="112" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="330" cy="148" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="148" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="410" cy="148" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="310" cy="184" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="350" cy="184" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="390" cy="184" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="430" cy="184" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 互换箭头 -->
  <path d="M 232 128 L 288 128" stroke="#d6a040" stroke-width="1.8" fill="none" marker-start="url(#arrOrange)" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">顶色互换</text>
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">整树反转</text>

  <!-- 公式框 -->
  <rect x="50" y="222" width="420" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇数行共 k 行：1 + 3 + ⋯ + (2k−1) = k² 个球</text>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶数行共 m 行：2 + 4 + ⋯ + 2m = m(m+1) 个球</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 两笔账都随高度 h 单调递增 → 能放就放，停下即最优</text>

  <!-- 底部提示 -->
  <rect x="50" y="328" width="420" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">别把「逐行选色」当搜索题：第 1 行颜色一定，全树锁死</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">两种方案 = 同一个 calc 参数对调，各自贪心取 max</text>
</svg>
