<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="386" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描分桶 → 枚举 6 对 (a, b) 查表算代价</text>

  <!-- step 1 -->
  <rect x="160" y="38" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历每个格子 (r, c)　m = n/2</text>
  <path d="M 260 70 L 260 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,88 352,118 260,148 168,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">属于 Y ？</text>

  <!-- condition note -->
  <rect x="366" y="92" width="148" height="56" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="440" y="110" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">r ≤ m：</text>
  <text x="440" y="125" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">c = r 或 c = n−1−r</text>
  <text x="440" y="140" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">或 r ≥ m 且 c = m</text>

  <!-- branches -->
  <path d="M 168 118 C 140 128 142 142 142 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="142" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 352 118 C 380 128 378 142 378 164" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="364" y="142" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="52" y="166" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="142" y="187" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cntY[grid[r][c]] += 1</text>
  <rect x="288" y="166" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="378" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cntO[grid[r][c]] += 1</text>

  <!-- merge -->
  <path d="M 142 200 C 142 212 200 214 222 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 378 200 C 378 212 340 214 318 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="140" y="220" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">枚举全部 (a, b)，a ≠ b —— 只有 3×2 = 6 对</text>
  <path d="M 280 254 L 280 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cost formula -->
  <rect x="75" y="270" width="370" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cost(a, b) = (yTot − cntY[a]) + (oTot − cntO[b])</text>
  <path d="M 260 306 L 260 320" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="155" y="322" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 6 个 cost 的最小值</text>

  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个桶互不干扰 —— Y 内代价与 Y 外代价独立计算，直接相加。</text>
</svg>
