<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#fdfcf7"/>
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 3 逆向演算：3×3，从全淹倒序补陆，第 3 天桥接贯通</text>
  <path d="M 300 38 Q 440 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Grid 1: day 9 all water. origin (24, 70), cell=30 ===== -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)"><rect x="24" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="39" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="54" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="69" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="84" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="99" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="24" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="39" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="54" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="69" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="84" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="99" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="24" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="39" y="150" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="54" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="69" y="150" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="84" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="99" y="150" fill="#b85450" font-weight="bold">W</text>
  </g>
  <text x="69" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">第 9 天</text>
  <text x="69" y="194" text-anchor="middle" font-size="10.5" fill="#5a5a5a">全淹 · 顶底断</text>

  <!-- arrow 1->2 -->
  <path d="M 122 115 L 150 115" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="136" y="108" text-anchor="middle" font-size="9.5" fill="#5a5a5a">补4格</text>

  <!-- ===== Grid 2: day 5. origin (154, 70), cell=30 ===== -->
  <!-- W W L / W W L / L L W -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)"><rect x="154" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="169" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="184" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="199" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="214" y="70" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="229" y="90" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="154" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="169" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="184" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="199" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="214" y="100" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="229" y="120" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="154" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="169" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="184" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="199" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="214" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="229" y="150" fill="#b85450" font-weight="bold">W</text>
  </g>
  <text x="199" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">第 5 天</text>
  <text x="199" y="194" text-anchor="middle" font-size="10.5" fill="#5a5a5a">两簇分离 · 顶底断</text>

  <!-- arrow 2->3 -->
  <path d="M 252 115 L 280 115" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="266" y="108" text-anchor="middle" font-size="9.5" fill="#5a5a5a">+(0,0)</text>

  <!-- ===== Grid 3: day 4. origin (284, 70), cell=30 ===== -->
  <!-- L W L / W W L / L L W -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)"><rect x="284" y="70" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="299" y="90" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="314" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="329" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="344" y="70" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="359" y="90" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="284" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="299" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="314" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" stroke-dasharray="3 2"/></g>
    <text x="329" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="344" y="100" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="359" y="120" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="284" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="299" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="314" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="329" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="344" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="359" y="150" fill="#b85450" font-weight="bold">W</text>
  </g>
  <text x="329" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">第 4 天</text>
  <text x="329" y="194" text-anchor="middle" font-size="10.5" fill="#5a5a5a">(1,1) 仍水 · 顶底断</text>

  <!-- arrow 3->4 -->
  <path d="M 382 115 L 410 115" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="396" y="108" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">+(1,1)</text>

  <!-- ===== Grid 4: day 3 connected. origin (414, 70), cell=30 ===== -->
  <!-- L W L / W L L / L L W ; bridge (1,1) -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)"><rect x="414" y="70" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="429" y="90" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="444" y="70" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="459" y="90" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="474" y="70" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="489" y="90" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="414" y="100" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="429" y="120" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="444" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.8" rx="3"/></g>
    <text x="459" y="120" fill="#d6a040" font-weight="bold">+</text>
    <g filter="url(#sk)"><rect x="474" y="100" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="489" y="120" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="414" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="429" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="444" y="130" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <text x="459" y="150" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="474" y="130" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="489" y="150" fill="#b85450" font-weight="bold">W</text>
  </g>
  <!-- bridge path arrows on grid4 -->
  <path d="M 489 100 L 489 130" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 474 115 L 459 115" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 459 130 L 459 160" stroke="#d6a040" stroke-width="0" fill="none"/>
  <!-- 顶/底 mini labels -->
  <text x="459" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#34506e">↑顶</text>
  <text x="459" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#34506e">↓底</text>
  <text x="459" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">第 3 天 ✓ 贯通</text>
  <text x="459" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">return i = 3</text>

  <!-- ===== right: step table ===== -->
  <g filter="url(#sk)">
    <rect x="540" y="64" width="320" height="300" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="700" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">逆向补陆步骤（i 从 8 → 0）</text>
  <text x="556" y="112" font-size="11.5" fill="#444" font-weight="bold">i  补回格(0-idx)  连通?</text>
  <text x="556" y="134" font-size="11" fill="#666">8   (2,0) 底行     ✗</text>
  <text x="556" y="152" font-size="11" fill="#666">7   (2,1) 底行     ✗</text>
  <text x="556" y="170" font-size="11" fill="#666">6   (1,2) 中行     ✗</text>
  <text x="556" y="188" font-size="11" fill="#666">5   (0,2) 顶行     ✗</text>
  <text x="556" y="206" font-size="11" fill="#666">4   (0,0) 顶行     ✗</text>
  <text x="556" y="226" font-size="11.5" fill="#d6a040" font-weight="bold">3   (1,1) 中行     ✓ 桥接!</text>
  <text x="556" y="252" font-size="11" fill="#444">(1,1) 的四邻中：</text>
  <text x="556" y="270" font-size="11" fill="#666">· (1,2)∈顶簇(经(0,2)通顶)</text>
  <text x="556" y="288" font-size="11" fill="#666">· (2,1)∈底簇(通底)</text>
  <text x="556" y="306" font-size="11" fill="#444">→ union 后顶底同根</text>
  <text x="556" y="328" font-size="11.5" fill="#2e6e2e" font-weight="bold">第 3 天能过，第 4 天不能</text>
  <text x="556" y="346" font-size="11.5" fill="#2e6e2e" font-weight="bold">→ 答案 = 3</text>

  <!-- bottom note -->
  <text x="440" y="424" text-anchor="middle" font-size="11" fill="#5a5a5a">★ = 陆地贯通路径；W = 水；+ = 本轮补回的桥接格（橙色）</text>
</svg>
