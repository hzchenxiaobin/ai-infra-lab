<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Trie 最短词根匹配：遇 is_end 即短路返回</text>
  <path d="M 220 40 Q 380 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#888">dictionary = ["cat","bat","rat"] → 建一棵前缀树</text>

  <!-- ===== Dictionary box (left) ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="80" width="140" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">词典 dictionary</text>
  <g filter="url(#sk)">
    <rect x="50" y="112" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="50" y="140" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="50" y="168" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="128">cat</text>
    <text x="100" y="156">bat</text>
    <text x="100" y="184">rat</text>
  </g>

  <path d="M 172 140 L 208 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="132" text-anchor="middle" font-size="9" fill="#888">insert</text>

  <!-- ===== Trie tree (center) ===== -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="110" rx="24" ry="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="300" y="114" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">root</text>

  <path d="M 288 124 L 200 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="232" y="142" font-size="10" fill="#888">b</text>
  <path d="M 300 128 L 300 168" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="310" y="150" font-size="10" fill="#2e8b57" font-weight="bold">c</text>
  <path d="M 312 124 L 400 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="142" font-size="10" fill="#888">r</text>

  <g filter="url(#sk)"><circle cx="194" cy="184" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="194" y="188" text-anchor="middle" font-size="11" fill="#4a8edb">b</text>
  <g filter="url(#sk)"><circle cx="300" cy="184" r="15" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">c</text>
  <g filter="url(#sk)"><circle cx="406" cy="184" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="406" y="188" text-anchor="middle" font-size="11" fill="#4a8edb">r</text>

  <path d="M 194 199 L 194 236" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="204" y="220" font-size="10" fill="#888">a</text>
  <path d="M 300 199 L 300 236" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="310" y="220" font-size="10" fill="#2e8b57" font-weight="bold">a</text>
  <path d="M 406 199 L 406 236" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="220" font-size="10" fill="#888">a</text>

  <g filter="url(#sk)"><circle cx="194" cy="252" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="194" y="256" text-anchor="middle" font-size="11" fill="#4a8edb">a</text>
  <g filter="url(#sk)"><circle cx="300" cy="252" r="15" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="300" y="256" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">a</text>
  <g filter="url(#sk)"><circle cx="406" cy="252" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="406" y="256" text-anchor="middle" font-size="11" fill="#4a8edb">a</text>

  <path d="M 194 267 L 194 304" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="204" y="288" font-size="10" fill="#888">t</text>
  <path d="M 300 267 L 300 304" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="310" y="288" font-size="10" fill="#2e8b57" font-weight="bold">t</text>
  <path d="M 406 267 L 406 304" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="288" font-size="10" fill="#888">t</text>

  <g filter="url(#sk)"><circle cx="194" cy="320" r="17" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="194" y="324" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">t★</text>
  <g filter="url(#sk)"><circle cx="300" cy="320" r="17" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/></g>
  <text x="300" y="324" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">t★</text>
  <g filter="url(#sk)"><circle cx="406" cy="320" r="17" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="406" y="324" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">t★</text>

  <text x="300" y="354" text-anchor="middle" font-size="9" fill="#2e8b57">★ = 词根结尾（is_end = true）</text>

  <!-- ===== Right: cattle matching ===== -->
  <text x="602" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">待替换词："cattle"</text>
  <g filter="url(#sk)">
    <rect x="500" y="112" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <rect x="534" y="112" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <rect x="568" y="112" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/>
    <rect x="602" y="112" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="636" y="112" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="670" y="112" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="517" y="134" fill="#2e6e2e">c</text>
    <text x="551" y="134" fill="#2e6e2e">a</text>
    <text x="585" y="134" fill="#2e6e2e">t</text>
    <text x="619" y="134" fill="#a03040">t</text>
    <text x="653" y="134" fill="#a03040">l</text>
    <text x="687" y="134" fill="#a03040">e</text>
  </g>

  <text x="517" y="162" text-anchor="middle" font-size="9" fill="#2e8b57">c→</text>
  <text x="551" y="162" text-anchor="middle" font-size="9" fill="#2e8b57">a→</text>
  <text x="585" y="162" text-anchor="middle" font-size="9" fill="#2e8b57" font-weight="bold">t★ 命中!</text>
  <text x="653" y="162" text-anchor="middle" font-size="9" fill="#a03040">不再继续</text>

  <g filter="url(#sk)">
    <rect x="500" y="184" width="204" height="44" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="602" y="202" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">第 3 步遇 is_end → 短路返回</text>
  <text x="602" y="220" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">"cattle" → "cat"</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="384" width="680" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="380" y="402" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 「最短词根」天然由 Trie 的「逐字符深入 + 首个 is_end 即返回」保证：</text>
  <text x="380" y="416" text-anchor="middle" font-size="10" fill="#2b6e9e">越短的词根在路径上越早遇到 is_end，无需对所有词根排序或比较长度</text>
</svg>
