<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：奇偶判定路径 与 LCM 公式路径 殊途同归</text>

  <!-- ====== Input n ====== -->
  <rect x="210" y="40" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" fill="#333">输入正整数 n</text>

  <!-- arrow down to diamond -->
  <path d="M 270 80 L 270 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Decision diamond: n 偶数? ====== -->
  <polygon points="270,106 360,156 270,206 180,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n 偶数？</text>
  <text x="270" y="168" text-anchor="middle" font-size="10.5" fill="#888">(n &amp; 1) == 0</text>

  <!-- Yes branch (left) -->
  <path d="M 180 156 L 110 156 L 110 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="190" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="208" text-anchor="middle" font-size="12" fill="#333">已含因子 2</text>
  <text x="110" y="223" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return n</text>

  <!-- No branch (right) -->
  <path d="M 360 156 L 430 156 L 430 188" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="392" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <rect x="370" y="190" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="208" text-anchor="middle" font-size="12" fill="#333">缺因子 2，补 2</text>
  <text x="430" y="223" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">return 2n (n&lt;&lt;1)</text>

  <!-- both converge down to answer -->
  <path d="M 110 230 L 110 270 L 250 270" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 430 230 L 430 270 L 290 270" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 270 L 270 288" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Answer ====== -->
  <rect x="180" y="290" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">lcm(2,n) = 2n / gcd(2,n)</text>

  <!-- ====== LCM formula path (bottom note) ====== -->
  <rect x="50" y="332" width="440" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="348" text-anchor="middle" font-size="10.5" fill="#888">通用路径：lcm(2,n) = 2n / gcd(2,n)，gcd 用辗转相除；本题 gcd(2,n) 即奇偶，故与上面判定等价</text>
</svg>
