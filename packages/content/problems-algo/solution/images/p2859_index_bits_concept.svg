<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：置位定义在「下标」上，不在元素值上</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums = [5,10,1,5,2]，k = 1 —— 找出 popcount(i) = 1 的下标，累加其对应元素</text>

  <!-- 左侧行标签 -->
  <text x="92" y="88" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">元素值</text>
  <text x="92" y="120" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">下标 i</text>
  <text x="92" y="147" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">二进制</text>
  <text x="92" y="179" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">置位数</text>

  <!-- 列 0：i=0 未命中 -->
  <rect x="100" y="64" width="64" height="36" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="132" y="120" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="106" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="124" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="142" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="100" y="164" width="64" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="11" filter="url(#rough2)"/>
  <text x="132" y="179" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0 个</text>

  <!-- 列 1：i=1 命中 -->
  <rect x="200" y="64" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="232" y="120" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <rect x="206" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="224" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="242" y="132" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="250" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="164" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="11" filter="url(#rough2)"/>
  <text x="232" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 个</text>

  <!-- 列 2：i=2 命中 -->
  <rect x="300" y="64" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="332" y="120" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <rect x="306" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="324" y="132" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="332" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="342" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="300" y="164" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="11" filter="url(#rough2)"/>
  <text x="332" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 个</text>

  <!-- 列 3：i=3 未命中 -->
  <rect x="400" y="64" width="64" height="36" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="432" y="120" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <rect x="406" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="414" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="424" y="132" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="432" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="442" y="132" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="450" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="164" width="64" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="11" filter="url(#rough2)"/>
  <text x="432" y="179" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2 个</text>

  <!-- 列 4：i=4 命中 -->
  <rect x="500" y="64" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="532" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="532" y="120" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <rect x="506" y="132" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="514" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="524" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="542" y="132" width="16" height="22" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="550" y="147" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="500" y="164" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="11" filter="url(#rough2)"/>
  <text x="532" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 个</text>

  <!-- 命中列下落箭头 -->
  <path d="M 232 188 L 232 210" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 188 L 332 210" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 532 188 L 532 210" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和结论框 -->
  <rect x="80" y="212" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="232" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">命中下标 1、2、4 ⟹ nums[1] + nums[2] + nums[4]</text>
  <text x="310" y="250" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 10 + 1 + 2 = 13</text>

  <text x="310" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 审题陷阱：数的是下标 i 的二进制里的 1，不是元素值 nums[i] 里的！</text>
  <text x="310" y="312" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">边界：k = 0 ⟹ 仅下标 0 命中；n ≤ 1000 &lt; 2¹⁰ ⟹ 下标至多 9 个置位，k = 10 时答案为 0</text>
</svg>
