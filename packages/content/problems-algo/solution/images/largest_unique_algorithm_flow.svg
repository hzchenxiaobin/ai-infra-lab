<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数一遍 + 从高到低扫一遍</text>

  <!-- Phase 1 label -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">阶段一：遍历 A，建立频率表 cnt[0..1000]</text>

  <!-- Start -->
  <ellipse cx="270" cy="78" rx="130" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333">开始: cnt[0..1000] = {0}</text>

  <path d="M 270 96 L 270 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more elements? -->
  <polygon points="270,108 388,138 270,168 152,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">还有元素</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#666">A[i] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 168 L 270 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="180" font-size="11" fill="#82b366">是</text>

  <!-- Count box -->
  <rect x="150" y="188" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="207" text-anchor="middle" font-size="12" fill="#333">cnt[ A[i] ] ++ ；i++</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 150 202 L 64 202 L 64 138 L 152 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="170" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 170)">下一个</text>

  <!-- No -> right then down to phase 2 -->
  <path d="M 388 138 L 432 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Phase 2 label -->
  <text x="40" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：从 x = 1000 往下扫，首个 cnt[x]==1 即返回</text>

  <!-- connector from phase1 No down to init -->
  <path d="M 432 138 L 432 268 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init x = 1000 -->
  <rect x="170" y="252" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="271" text-anchor="middle" font-size="12" fill="#333">x = 1000</text>

  <path d="M 270 280 L 270 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: x >= 0 ? -->
  <polygon points="270,292 388,322 270,352 152,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#333">x ≥ 0 ?</text>

  <!-- Yes -> down -->
  <path d="M 270 352 L 270 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="360" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 3: cnt[x]==1 ? -->
  <polygon points="270,364 388,394 270,424 152,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12" fill="#333">cnt[x] == 1 ?</text>

  <!-- Yes -> right to return x -->
  <path d="M 388 394 L 470 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="386" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="490" cy="394" rx="34" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 x</text>

  <!-- No -> left x-- then loop back to diamond2 -->
  <path d="M 152 394 L 100 394 L 100 322 L 152 322" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="358" text-anchor="middle" font-size="10" fill="#888">否，x--</text>

  <!-- Diamond2 No -> left to return -1 -->
  <path d="M 152 322 L 100 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- End -1 -->
  <ellipse cx="62" cy="322" rx="40" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 -1</text>

  <!-- summary -->
  <text x="270" y="456" text-anchor="middle" font-size="10" fill="#888">阶段一 O(n) + 阶段二 O(1001) → 总 O(n)；空间 O(1001) = O(1)</text>
</svg>
