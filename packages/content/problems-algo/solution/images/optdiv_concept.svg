<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：分子最大化 + 分母最小化</text>

  <!-- ===== Part 1: original chain ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">① 原始除法链：a0 必分子、a1 必分母，其余可上翻</text>

  <!-- role labels above boxes -->
  <text x="115" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">分子</text>
  <text x="215" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">分母</text>
  <text x="315" y="74" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">可上翻</text>
  <text x="415" y="74" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">可上翻</text>

  <!-- a0 / a1 / a2 / a3 -->
  <rect x="90" y="80" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a₀</text>

  <text x="165" y="101" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <rect x="190" y="80" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="101" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a₁</text>

  <text x="265" y="101" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <rect x="290" y="80" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="101" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a₂</text>

  <text x="365" y="101" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <rect x="390" y="80" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="101" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a₃</text>

  <text x="475" y="98" font-size="10.5" fill="#888">... 可推广到 aₙ₋₁</text>

  <!-- arrow down with label -->
  <path d="M 290 122 L 290 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="124" width="170" height="20" fill="#fafafa" stroke="none"/>
  <text x="305" y="139" font-size="10.5" fill="#555">把 a₁..末尾 用一对括号包起来</text>

  <!-- ===== Part 2: parenthesized ===== -->
  <text x="40" y="164" font-size="12" fill="#446688" font-weight="bold">② 加括号：a₀ / ( a₁ / a₂ / a₃ )</text>

  <rect x="90" y="174" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a₀</text>

  <text x="165" y="195" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <text x="190" y="196" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">(</text>

  <rect x="200" y="174" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="195" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a₁</text>

  <text x="275" y="195" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <rect x="300" y="174" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="195" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a₂</text>

  <text x="375" y="195" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">/</text>

  <rect x="400" y="174" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="195" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a₃</text>

  <text x="460" y="196" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">)</text>

  <!-- arrow down: flip -->
  <path d="M 290 216 L 290 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="218" width="190" height="20" fill="#fafafa" stroke="none"/>
  <text x="305" y="233" font-size="10.5" fill="#555">÷ 分数 = × 倒数，a₂,a₃ 翻入分子</text>

  <!-- ===== Part 3: expanded result ===== -->
  <text x="40" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">③ 展开：分子最大、分母最小</text>

  <rect x="60" y="268" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a₀ × a₂ × a₃ / a₁</text>

  <!-- two result boxes -->
  <rect x="60" y="316" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分子 = a₀ · a₂ · a₃</text>
  <text x="200" y="354" text-anchor="middle" font-size="10.5" fill="#555">除 a₁ 外全部进分子 → 最大</text>

  <rect x="360" y="316" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">分母 = a₁</text>
  <text x="440" y="354" text-anchor="middle" font-size="10.5" fill="#555">结构下界，无法更小</text>

  <!-- ===== insight notes ===== -->
  <rect x="40" y="384" width="245" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="162" y="404" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a₀ 无前导 /</text>
  <text x="162" y="422" text-anchor="middle" font-size="10.5" fill="#555">最左操作数，翻不到分母</text>
  <text x="162" y="438" text-anchor="middle" font-size="10.5" fill="#555">恒在分子，无法移走</text>

  <rect x="300" y="384" width="245" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="404" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a₁ 跟第一个 /</text>
  <text x="422" y="422" text-anchor="middle" font-size="10.5" fill="#555">是 a₀ 与右侧整段的分界</text>
  <text x="422" y="438" text-anchor="middle" font-size="10.5" fill="#555">必在分母，至少留它一个</text>
</svg>
