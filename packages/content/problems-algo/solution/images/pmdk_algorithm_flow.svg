<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：余数状态 DP</text>

  <!-- start -->
  <rect x="220" y="50" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="20" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M300 90 L300 112" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="140" y="116" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">初始化 dp[0][0][grid[0][0] % k] = 1</text>
  <text x="300" y="156" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">（起点只有一条路径，余数即格子值 mod k）</text>
  <path d="M300 166 L300 188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <path d="M300 188 L430 188 L430 214" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="218" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="505" y="237" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">遍历 i=0..m-1</text>
  <text x="505" y="252" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">j=0..n-1（跳过 0,0）</text>

  <!-- inner transition -->
  <path d="M430 238 L370 238" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="210" width="280" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="231" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">g = grid[i][j] % k</text>
  <text x="230" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">对 r=0..k-1：</text>
  <text x="230" y="263" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">dp[j][r] = dp[上][pr] + dp[左][pr], pr=(r-g+k)%k</text>

  <!-- back edge to loop -->
  <path d="M230 268 L230 300 L505 300 L505 258" fill="none" stroke="#4a7a3a" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">下一个 (i,j)</text>

  <!-- after loop -->
  <path d="M505 300 L505 338 L300 338" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="320" font-size="11" fill="#888" filter="url(#rough2)">遍历完</text>

  <!-- answer -->
  <rect x="150" y="342" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">返回 dp[m-1][n-1][0]</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">（终点处余数为 0 的方案数 = 能被 k 整除的路径数）</text>
  <path d="M300 392 L300 412" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="220" y="416" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="20" filter="url(#rough2)"/>
  <text x="300" y="439" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- note -->
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全程对 10⁹+7 取模；pr 计算在 C++ 中需 ((r-g)%k+k)%k 防负</text>
</svg>
