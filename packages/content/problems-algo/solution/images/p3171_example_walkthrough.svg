<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,4,5]，k = 3 → 答案 0</text>

  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每轮：S ← { v | x : v ∈ S } ∪ { x }，ans ← min(ans, min |v − k|)</text>

  <rect x="40" y="70" width="455" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="44" width="455" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="40" y="44" width="455" height="162" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <path d="M 40 70 L 495 70 M 40 104 L 495 104 M 40 138 L 495 138 M 40 172 L 495 172" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 70 44 L 70 206 M 105 44 L 105 206 M 210 44 L 210 206 M 375 44 L 375 206 M 440 44 L 440 206" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="55" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="87" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="157" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">旧集合</text>
  <text x="292" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">新集合 = {v|x} ∪ {x}</text>
  <text x="407" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min|v−k|</text>
  <text x="467" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="55" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="87" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">∅</text>
  <text x="292" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="407" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="467" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="55" y="125" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="87" y="125" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="125" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="292" y="125" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1|2, 2} = {2, 3}</text>
  <text x="407" y="125" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="467" y="125" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="55" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="87" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="157" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <text x="292" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{2|4, 3|4, 4} = {4, 6, 7}</text>
  <text x="407" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="467" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="55" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="87" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="157" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{4, 6, 7}</text>
  <text x="292" y="193" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{5, 7, 7, 5} → {5, 7}</text>
  <text x="407" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="467" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="32" y="222" width="456" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第 3 行的去重视角（列表恒降序）：</text>
  <text x="260" y="263" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">[7, 6, 4] → 追加哨兵 0 → [7, 6, 4, 0] → 全体 |= 5 → [7, 7, 5, 5]</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">→ 相邻去重 → [7, 5]（长度恒 ≤ 30，不会越滚越宽）</text>

  <rect x="32" y="308" width="456" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 1 时 1|2 = 3 恰好等于 k ⇒ 绝对差 0</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">已触理论下界，后续轮次可提前退出（参考代码中的 break）</text>
</svg>
