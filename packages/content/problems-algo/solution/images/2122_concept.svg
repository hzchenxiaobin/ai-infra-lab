<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：固定间距 2k 配对，最小值锁定 lower</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">arr ± k → lower / higher → 打乱为 nums → 排序后枚举 2k 贪心配对</text>

  <!-- Row 1: arr -->
  <text x="56" y="80" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">arr</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="190" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="214" y="83" fill="#446688" font-weight="bold">3</text>
    <rect x="244" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="268" y="83" fill="#446688" font-weight="bold">7</text>
    <rect x="298" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="322" y="83" fill="#446688" font-weight="bold">11</text>
  </g>
  <text x="372" y="80" font-size="11" fill="#888" filter="url(#rough2)">k = 1</text>

  <!-- Arrows: arr -> lower (left-down, -k) and arr -> higher (right-down, +k) -->
  <path d="M 214 96 L 150 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 322 96 L 430 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="170" y="114" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−k</text>
  <text x="386" y="114" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+k</text>

  <!-- Row 2: lower (green) left, higher (orange) right -->
  <text x="56" y="146" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lower</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="124" y="128" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="148" y="149" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="176" y="128" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="200" y="149" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="228" y="128" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="252" y="149" fill="#4a7a3a" font-weight="bold">10</text>
  </g>
  <text x="300" y="146" font-size="10.5" fill="#888" filter="url(#rough2)">arr−k</text>

  <text x="378" y="146" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">higher</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="404" y="128" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="428" y="149" fill="#d6a040" font-weight="bold">4</text>
    <rect x="456" y="128" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="480" y="149" fill="#d6a040" font-weight="bold">8</text>
    <rect x="508" y="128" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="532" y="149" fill="#d6a040" font-weight="bold">12</text>
  </g>
  <text x="566" y="146" font-size="10.5" fill="#888" filter="url(#rough2)">arr+k</text>

  <!-- Merge arrows: lower + higher -> nums -->
  <path d="M 200 162 L 200 184 L 320 184 L 320 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 480 162 L 480 184 L 320 184" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="332" y="180" font-size="10" fill="#888" filter="url(#rough2)">合并打乱</text>

  <!-- Row 3: nums (shuffled) -->
  <text x="56" y="216" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="200" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="144" y="221" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="172" y="200" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="196" y="221" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="224" y="200" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="248" y="221" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="276" y="200" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="300" y="221" fill="#d6a040" font-weight="bold">4</text>
    <rect x="328" y="200" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="352" y="221" fill="#d6a040" font-weight="bold">8</text>
    <rect x="380" y="200" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="404" y="221" fill="#d6a040" font-weight="bold">12</text>
  </g>
  <text x="448" y="216" font-size="10.5" fill="#888" filter="url(#rough2)">（2n 个）</text>

  <!-- Sort arrow -->
  <path d="M 262 236 L 262 256" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="276" y="252" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">排序</text>

  <!-- Row 4: sorted nums with pair coloring -->
  <text x="56" y="276" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">排序后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="260" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="144" y="281" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="172" y="260" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="196" y="281" fill="#d6a040" font-weight="bold">4</text>
    <rect x="224" y="260" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="248" y="281" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="276" y="260" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="300" y="281" fill="#d6a040" font-weight="bold">8</text>
    <rect x="328" y="260" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="352" y="281" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="380" y="260" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="404" y="281" fill="#d6a040" font-weight="bold">12</text>
  </g>

  <!-- Pair brackets and 2k gap labels -->
  <g filter="url(#rough2)">
    <path d="M 120 300 L 120 308 L 220 308 L 220 300" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="170" y="322" font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">2k</text>
    <path d="M 224 300 L 224 308 L 324 308 L 324 300" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="274" y="322" font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">2k</text>
    <path d="M 328 300 L 328 308 L 428 308 L 428 300" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="378" y="322" font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">2k</text>
  </g>

  <!-- Annotation: min(nums) is lower -->
  <rect x="80" y="336" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">min(nums) = arr_min − k → 必为 lower</text>
  <text x="320" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2k = nums[j] − nums[0]，枚举每个候选 k 做贪心匹配</text>

  <!-- Result row: arr = lower + k -->
  <text x="56" y="404" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="190" y="388" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="214" y="409" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="244" y="388" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="268" y="409" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="298" y="388" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="322" y="409" fill="#4a7a3a" font-weight="bold">11</text>
  </g>
  <text x="372" y="404" font-size="10.5" fill="#888" filter="url(#rough2)">= lower + k = 中点</text>
  <path d="M 144 296 L 144 332 L 214 332 L 214 386" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 404 296 L 404 332 L 322 332 L 322 386" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Note box -->
  <rect x="40" y="436" width="560" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="456" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">与 2007（双倍数组）的对照</text>
  <text x="56" y="476" font-size="10" fill="#333" filter="url(#rough2)">① 2007 配对间距 = v 本身（每对不同），本题间距 = 2k（全局固定）→ 需先确定 k；</text>
  <text x="56" y="492" font-size="10" fill="#333" filter="url(#rough2)">② 两者共享「排序后最小未配对必为 lower」的贪心骨架，本题多一层「枚举候选 k」；</text>
  <text x="56" y="508" font-size="10" fill="#333" filter="url(#rough2)">③ k 必须为正整数 → 2k 为正偶数，奇数差直接剪枝。</text>
  <text x="56" y="524" font-size="10" fill="#333" filter="url(#rough2)">④ 本题无 0 自环问题（lower=arr−k，higher=arr+k，k&gt;0 时 lower≠higher）。</text>
</svg>
