<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定左端点 i，右端点 j 每扩一格，d 至多 +1</text>

  <!-- row 1: i=0, j=0 -->
  <text x="95" y="82" font-size="12" fill="#446688" filter="url(#rough2)">j = 0</text>
  <path d="M 172 44 L 172 54" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="40" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j</text>
  <rect x="150" y="58" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="58" width="44" height="38" fill="#f4f4f2" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="82" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="250" y="58" width="44" height="38" fill="#f4f4f2" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="82" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="172" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <text x="330" y="82" font-size="12" fill="#333" filter="url(#rough2)">集合 {1}</text>
  <text x="450" y="82" font-size="12" fill="#333" filter="url(#rough2)">d = 1</text>
  <text x="525" y="82" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d² = 1</text>

  <!-- row 2: i=0, j=1 -->
  <text x="95" y="202" font-size="12" fill="#446688" filter="url(#rough2)">j = 1</text>
  <path d="M 222 164 L 222 174" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j</text>
  <rect x="150" y="178" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="178" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="202" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="250" y="178" width="44" height="38" fill="#f4f4f2" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="202" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="172" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <text x="330" y="202" font-size="12" fill="#333" filter="url(#rough2)">集合 {1,2}</text>
  <text x="450" y="202" font-size="12" fill="#333" filter="url(#rough2)">d = 2</text>
  <text x="525" y="202" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d² = 4</text>

  <!-- row 3: i=0, j=2 -->
  <text x="95" y="322" font-size="12" fill="#446688" filter="url(#rough2)">j = 2</text>
  <path d="M 272 284 L 272 294" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="280" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j</text>
  <rect x="150" y="298" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="322" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="298" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="322" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="250" y="298" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="322" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="172" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <text x="330" y="322" font-size="12" fill="#333" filter="url(#rough2)">集合 {1,2}</text>
  <text x="450" y="322" font-size="12" fill="#333" filter="url(#rough2)">d = 2</text>
  <text x="525" y="322" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d² = 4</text>
  <text x="330" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">↑ 新来的 1 是老面孔，集合没变大</text>

  <text x="310" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 扩张一格 = 集合至多收编一个新成员：新面孔 d+1，老面孔 d 不变；每步顺手累加 d²</text>
</svg>
