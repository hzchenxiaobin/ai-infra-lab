<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="530" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：0-1 BFS 双端队列</text>

  <!-- 开始 -->
  <rect x="150" y="38" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dist[0][0] = grid[0][0]，(0,0) 入队</text>

  <path d="M 260 74 L 260 92" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1：队列非空？ -->
  <polygon points="260,94 346,126 260,158 174,126" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">队列非空？</text>
  <text x="248" y="90" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 260 158 L 260 176" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 弹出队首 -->
  <rect x="165" y="178" width="190" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">pop_front 得 (i,j)，d = dist[i][j]</text>

  <path d="M 260 210 L 260 228" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 遍历邻居 -->
  <rect x="150" y="230" width="220" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">对 (i,j) 的上下左右邻居 (ni,nj)：</text>

  <path d="M 260 262 L 260 280" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 计算 nd -->
  <rect x="165" y="282" width="190" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">越界则跳过；nd = d + grid[ni][nj]</text>

  <path d="M 260 312 L 260 330" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形2：nd < dist？ -->
  <polygon points="260,332 350,364 260,396 170,364" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">nd &lt; dist[ni][nj]？</text>
  <text x="248" y="328" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="356" y="356" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 否：绕回下一个邻居 -->
  <path d="M 350 364 Q 430 364 430 246 L 370 246" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="442" y="310" font-size="9" fill="#b85450" filter="url(#rough2)">换下一个邻居</text>

  <!-- 是：更新 -->
  <path d="M 260 396 L 260 414" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="170" y="416" width="180" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">dist[ni][nj] = nd</text>

  <!-- 分支 -->
  <path d="M 260 446 L 130 446 L 130 468" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 446 L 390 446 L 390 468" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="30" y="470" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="487" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">grid[ni][nj] = 0</text>
  <text x="130" y="502" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ push_front 插队首</text>

  <rect x="290" y="470" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="487" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">grid[ni][nj] = 1</text>
  <text x="390" y="502" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">→ push_back 排队尾</text>

  <!-- 回到队列非空 -->
  <path d="M 30 490 Q 12 490 12 300 Q 12 126 172 126" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 队空 → 终判 -->
  <path d="M 346 126 Q 430 126 430 110" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 430 110 L 430 176" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="360" y="104" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（队空）</text>

  <polygon points="430,178 502,210 430,242 358,210" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="207" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">dist[m-1][n-1]</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">&lt; health ？</text>

  <path d="M 430 242 L 430 260 L 396 282" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 430 242 L 430 260 L 464 282" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="262" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="444" y="262" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="348" y="284" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="398" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="428" y="284" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="478" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <text x="130" y="522" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（终点弹出后即可提前 return）</text>
</svg>
