<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">数位 DP 流程：状态 (进位 c, aEnd, bEnd) 逐位转移</text>

  <!-- 开始 -->
  <rect x="145" y="36" width="230" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化：dp[0][未结束][未结束] = 1</text>

  <path d="M 260 68 L 260 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取位 -->
  <rect x="140" y="88" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取 n 的第 i 位 d（从个位 i = 0 起）</text>

  <path d="M 260 122 L 260 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举 -->
  <rect x="120" y="142" width="280" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举状态 (c, aEnd, bEnd) × 数字对 (da, db)</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">未结束 → 数字取 1~9；已结束 → 只能取 0</text>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">活跃的一方可再选「到此为止 / 继续」</text>

  <path d="M 260 206 L 260 220" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定 1：个位匹配 -->
  <polygon points="185,252 260,224 335,252 260,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">da + db + c</text>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">的个位 = d ?</text>

  <!-- 否 → 丢弃 -->
  <text x="348" y="244" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 335 252 L 376 252" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="380" y="236" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="416" y="256" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">丢弃</text>
  <path d="M 416 236 L 416 174 L 404 174" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 是 → 转移 -->
  <text x="271" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 280 L 260 298" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="115" y="302" width="290" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp'[c'][aEnd'][bEnd'] += dp[c][aEnd][bEnd]</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">新进位 c' = (da + db + c) ÷ 10（取 0 或 1）</text>

  <path d="M 260 350 L 260 366" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定 2：还有下一位 -->
  <polygon points="185,412 260,384 335,412 260,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有下一位 ?</text>
  <text x="260" y="424" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">（i + 1 &lt; 位数 L）</text>

  <!-- 是 → 循环回取位 -->
  <text x="170" y="404" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 185 412 L 66 412 L 66 105 L 134 105" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 54 255)" x="54" y="255" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i ← i + 1</text>

  <!-- 否 → 终态 -->
  <text x="271" y="454" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 440 L 260 456" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="105" y="460" width="310" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="480" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">终态判定：进位 = 0 且 a、b 均已结束</text>
  <text x="260" y="498" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">答案 = dp[0][已结束][已结束]</text>

  <path d="M 260 508 L 260 520" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="205" y="524" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="543" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回答案</text>
</svg>
