<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：降序排序 → 每个位置前缀和同时最大化</text>

  <!-- 原始数组 -->
  <text x="40" y="68" font-size="13" fill="#666" filter="url(#rough2)">原始 nums：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="153" y="72" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="178" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="201" y="72" text-anchor="middle" font-size="13" fill="#333">-1</text>
    <rect x="226" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="249" y="72" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="274" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="297" y="72" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="322" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="345" y="72" text-anchor="middle" font-size="13" fill="#333">-3</text>
    <rect x="370" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="393" y="72" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="418" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="441" y="72" text-anchor="middle" font-size="13" fill="#333">-3</text>
  </g>

  <!-- 箭头 -->
  <path d="M290,94 L290,118" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="112" font-size="12" fill="#446688" filter="url(#rough2)">降序排序</text>

  <!-- 排序后数组 -->
  <text x="40" y="142" font-size="13" fill="#666" filter="url(#rough2)">降序排列：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="153" y="146" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="178" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="201" y="146" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="226" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="249" y="146" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="274" y="126" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="297" y="146" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="322" y="126" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="345" y="146" text-anchor="middle" font-size="13" fill="#333">-1</text>
    <rect x="370" y="126" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="393" y="146" text-anchor="middle" font-size="13" fill="#333">-3</text>
    <rect x="418" y="126" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="441" y="146" text-anchor="middle" font-size="13" fill="#333">-3</text>
  </g>
  <text x="472" y="146" font-size="11" fill="#4a7a3a" filter="url(#rough2)">正数区</text>
  <text x="472" y="160" font-size="11" fill="#446688" filter="url(#rough2)">零</text>

  <!-- 前缀和柱状图 -->
  <text x="40" y="190" font-size="13" fill="#666" filter="url(#rough2)">前缀和 prefix：</text>
  <line x1="120" y1="320" x2="470" y2="320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="120" y1="200" x2="120" y2="320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="324" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <!-- 柱子，每个宽 40，间距 6，从 x=132 起。max prefix=6 → 高度比例：1单位=22px -->
  <!-- prefix: 3,5,6,6,5,2,-1 -->
  <g filter="url(#rough2)">
    <rect x="135" y="254" width="40" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="155" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a">3</text>
    <rect x="181" y="210" width="40" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="201" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a">5</text>
    <rect x="227" y="188" width="40" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3"/>
    <text x="247" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a">6</text>
    <rect x="273" y="188" width="40" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="293" y="182" text-anchor="middle" font-size="12" fill="#446688">6</text>
    <rect x="319" y="210" width="40" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="339" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a">5</text>
    <rect x="365" y="276" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="385" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
    <!-- -1 在零线下方 -->
    <rect x="411" y="320" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="431" y="356" text-anchor="middle" font-size="12" fill="#b85450">-1</text>
  </g>

  <!-- 标记正数 -->
  <path d="M135,242 Q290,232 385,264" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="295" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">前 6 个前缀和 &gt; 0 ✓</text>

  <!-- 答案 -->
  <rect x="200" y="378" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">最大分数 = 6</text>

  <text x="290" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">降序排列使前缀和先升后降，正数区恒为正，负数区递减直至穿零即停</text>
</svg>
