<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 6]</text>

  <!-- table frame -->
  <rect x="30" y="48" width="580" height="316" fill="none" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="48" width="580" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="48" x2="170" y2="364" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="48" x2="320" y2="364" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="48" x2="450" y2="364" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="245" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">处理 (i, nums[i])</text>
  <text x="385" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">质因子 / 操作</text>
  <text x="540" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">连通分量</text>

  <!-- row 1: i=0 -->
  <rect x="30" y="80" width="580" height="58" fill="#e8f0fe" stroke="none" opacity="0.45" filter="url(#rough2)"/>
  <text x="100" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i=0</text>
  <text x="245" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v=2</text>
  <text x="385" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">质因子 {2}</text>
  <text x="385" y="118" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">seen[2]=0</text>
  <text x="540" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}{1}{2}</text>

  <!-- row 2: i=1 -->
  <line x1="30" y1="138" x2="610" y2="138" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="245" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v=3</text>
  <text x="385" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">质因子 {3}</text>
  <text x="385" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">seen[3]=1</text>
  <text x="540" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}{1}{2}</text>

  <!-- row 3: i=2 (highlight) -->
  <line x1="30" y1="196" x2="610" y2="196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="196" width="580" height="64" fill="#fff8e1" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <text x="100" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="245" y="226" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v=6</text>
  <text x="385" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">质因子 {2, 3}</text>
  <text x="385" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">union(2,0) 经 p=2</text>
  <text x="385" y="250" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">union(2,1) 经 p=3</text>
  <text x="540" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{0,1,2}</text>

  <!-- row 4: check -->
  <line x1="30" y1="260" x2="610" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">检查</text>
  <text x="245" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">—</text>
  <text x="385" y="290" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">find(0)==find(1)==find(2)</text>
  <text x="540" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ true</text>

  <!-- arrow rows down -->
  <path d="M 320 300 L 320 318" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- final badge -->
  <rect x="200" y="324" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全图单一连通分量 ⇒ 可互相遍历</text>

  <!-- bottom note -->
  <rect x="30" y="372" width="580" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对比示例 [3,9,5]：下标 2 的质因子 {5} 与 {0,1} 无共享 ⇒ {0,1} 与 {2} 分离 ⇒ false</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">本质即把“两两 gcd 连边”替换为“经质因子哈希合并”，复杂度由 O(n²) 降至近线性</text>
</svg>
