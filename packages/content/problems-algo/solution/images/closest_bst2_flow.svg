<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双栈迭代器算法流程</text>

  <!-- Init pred -->
  <rect x="120" y="44" width="340" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="11" fill="#333">初始化前驱栈：从 root 沿搜索路径，val &lt; target 则压栈并走右，否则走左</text>

  <path d="M 290 76 L 290 90" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init succ -->
  <rect x="120" y="92" width="340" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#333">初始化后继栈：从 root 沿搜索路径，val ≥ target 则压栈并走左，否则走右</text>

  <path d="M 290 124 L 290 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="180" y="140" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#333">result = [ ]，循环 k 次</text>

  <path d="M 290 170 L 290 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pred empty? -->
  <polygon points="290,188 430,228 290,268 150,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#333">pred 栈为空？</text>

  <!-- Yes: take succ -->
  <path d="M 430 228 L 470 228" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="220" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="212" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="520" y="233" text-anchor="middle" font-size="10" fill="#333">取 succ + 补充</text>

  <path d="M 290 268 L 290 282" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="278" font-size="10" fill="#4a7a3a">否</text>

  <!-- Decision: succ empty? -->
  <polygon points="290,286 430,326 290,366 150,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="11" fill="#333">succ 栈为空？</text>

  <!-- Yes: take pred -->
  <path d="M 430 326 L 470 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="318" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="310" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="520" y="331" text-anchor="middle" font-size="10" fill="#333">取 pred + 补充</text>

  <path d="M 290 366 L 290 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="376" font-size="10" fill="#4a7a3a">否</text>

  <!-- Decision: compare tops -->
  <polygon points="290,384 440,424 290,464 140,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="10" fill="#333">|target−pred.top|</text>
  <text x="290" y="432" text-anchor="middle" font-size="10" fill="#333">≤ |succ.top−target|？</text>

  <!-- Yes: take pred -->
  <path d="M 140 424 L 80 424" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="416" font-size="10" fill="#4a7a3a">是</text>
  <rect x="10" y="408" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="45" y="422" text-anchor="middle" font-size="9" fill="#333">取 pred</text>
  <text x="45" y="434" text-anchor="middle" font-size="9" fill="#333">压左子树右脊</text>

  <!-- No: take succ -->
  <path d="M 440 424 L 470 424" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="416" font-size="10" fill="#b85450">否</text>
  <rect x="470" y="408" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505" y="422" text-anchor="middle" font-size="9" fill="#333">取 succ</text>
  <text x="505" y="434" text-anchor="middle" font-size="9" fill="#333">压右子树左脊</text>

  <!-- Append to result -->
  <path d="M 290 464 L 290 478" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="480" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="499" text-anchor="middle" font-size="11" fill="#333">result.push(val)</text>

  <!-- Loop back -->
  <path d="M 520 228 L 520 156 L 400 156" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 326 L 520 156 L 400 156" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 45 408 L 45 156 L 180 156" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 505 408 L 505 156 L 400 156" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="514" text-anchor="middle" font-size="9" fill="#b85450">↑ 回到循环（k 次后结束，返回 result）</text>
</svg>
