<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：质因子分解 + 并查集 + 逐位比对</text>

  <!-- step 1: sieve -->
  <rect x="40" y="46" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="12" fill="#333" font-weight="bold">① 线性/埃氏筛求 SPF</text>
  <text x="60" y="80" font-size="10.5" fill="#666">spf[x] = x 的最小质因子，x ≤ M = max(nums)，O(M log log M)</text>
  <text x="430" y="72" font-size="10.5" fill="#888">M ≤ 10⁵</text>
  <line x1="280" y1="88" x2="280" y2="106" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: init UF -->
  <rect x="40" y="106" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="start" font-size="12" fill="#333" font-weight="bold">② 初始化并查集 parent[0..M]，parent[i]=i</text>
  <line x1="280" y1="144" x2="280" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: loop factorize + union -->
  <rect x="40" y="162" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="182" font-size="12" fill="#333" font-weight="bold">③ 遍历 nums 中每个 x：</text>
  <text x="60" y="200" font-size="10.5" fill="#555">while v &gt; 1: p = spf[v]; union(x, p); v /= p 直到 v 不含 p</text>
  <text x="60" y="218" font-size="10.5" fill="#b85450" font-weight="bold">质因子 p 充当中转，使共享 p 的所有数进入同一集合</text>
  <text x="60" y="232" font-size="10" fill="#888">只需对去重后的值做（set(nums)），避免重复分解</text>
  <line x1="280" y1="238" x2="280" y2="256" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: sort copy -->
  <rect x="40" y="256" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="280" font-size="12" fill="#333" font-weight="bold">④ sorted_nums = sort(nums)（目标排列）</text>
  <line x1="280" y1="294" x2="280" y2="312" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5: check decision -->
  <path d="M 280 312 L 420 348 L 280 384 L 140 348 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">find(nums[i]) ==</text>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">find(sorted[i]) ?</text>

  <!-- yes / no branches -->
  <text x="100" y="344" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 140 348 L 60 348 L 60 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="34" y="410" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="426" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <text x="445" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="420" y1="348" x2="500" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="346" font-size="10" fill="#888">i++</text>
  <path d="M 510 348 L 510 312 L 420 312" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="280" y1="384" x2="280" y2="408" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="408" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全部通过 → return true</text>
</svg>
