<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：nums = {1,2,3}，head = 1→2→3→4→5</text>

  <!-- Row 0：初始 -->
  <text x="20" y="62" font-size="11.5" fill="#555" filter="url(#rough2)">初始：</text>
  <text x="20" y="78" font-size="11.5" fill="#555" filter="url(#rough2)">curr 停在 dummy</text>

  <rect x="175" y="54" width="46" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="72" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dummy</text>
  <path d="M223,68 L231,68" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="233" y="54" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="251" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <path d="M271,68 L279,68" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="281" y="54" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="299" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M319,68 L327,68" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="329" y="54" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="347" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <path d="M367,68 L375,68" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="377" y="54" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <path d="M415,68 L423,68" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="425" y="54" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <path d="M188,88 L198,100 L208,88 Z" fill="#446688" filter="url(#rough2)"/>
  <text x="198" y="114" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">curr</text>

  <!-- Row 1：连续命中 -->
  <text x="20" y="166" font-size="11.5" fill="#555" filter="url(#rough2)">①②③ 连续命中：</text>
  <text x="20" y="182" font-size="11.5" fill="#555" filter="url(#rough2)">连跳 1,2,3，</text>
  <text x="20" y="198" font-size="11.5" fill="#b85450" filter="url(#rough2)">curr 原地不动</text>

  <rect x="175" y="158" width="46" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dummy</text>

  <rect x="233" y="158" width="36" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="251" y="176" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <rect x="281" y="158" width="36" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="299" y="176" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <rect x="329" y="158" width="36" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="176" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>

  <rect x="377" y="158" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <path d="M415,172 L423,172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <rect x="425" y="158" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="251" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="299" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="347" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✕</text>

  <path d="M198,152 C 225,124 355,124 388,154" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="295" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">dummy.next 越过 1,2,3 直指 4</text>

  <path d="M188,192 L198,204 L208,192 Z" fill="#446688" filter="url(#rough2)"/>
  <text x="198" y="218" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">curr 还在 dummy</text>

  <!-- Row 2：前进 -->
  <text x="20" y="270" font-size="11.5" fill="#555" filter="url(#rough2)">④⑤ 4,5 ∉ s：</text>
  <text x="20" y="286" font-size="11.5" fill="#555" filter="url(#rough2)">curr 前进 4→5</text>

  <rect x="175" y="262" width="46" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dummy</text>
  <path d="M223,276 L231,276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>

  <rect x="233" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="251" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <path d="M271,276 L279,276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <rect x="281" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="299" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <path d="M288,296 L299,308 L310,296 Z" fill="#446688" filter="url(#rough2)"/>
  <text x="299" y="322" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">curr</text>

  <!-- Row 3：终态 -->
  <text x="20" y="370" font-size="11.5" fill="#555" filter="url(#rough2)">curr.next = ∅：</text>
  <text x="20" y="386" font-size="11.5" fill="#555" filter="url(#rough2)">循环结束</text>

  <rect x="200" y="356" width="150" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="275" y="379" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">返回 4 → 5</text>

  <path d="M358,374 L392,374" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="370" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">共 3 次跳过 +</text>
  <text x="440" y="384" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">3 次前进</text>

  <text x="260" y="418" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">curr 始终只前进不后退：连续命中的节点由同一位置的 curr 反复跳过</text>
</svg>
