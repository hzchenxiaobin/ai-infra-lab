<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：si 是 s 的后缀，score(si) = LCP(后缀, 前缀) = Z[i]</text>

  <!-- ====== Prefix reference row ====== -->
  <text x="80" y="72" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">前缀 s</text>
  <text x="80" y="86" text-anchor="end" font-size="9.5" fill="#888">= "babab"</text>
  <!-- 5 boxes w=44, start x=120 -->
  <rect x="120" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="78" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="164" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="78" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="208" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="78" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="252" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="78" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="296" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="78" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <!-- index labels -->
  <text x="142" y="104" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="186" y="104" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="230" y="104" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="274" y="104" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="318" y="104" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <!-- divider -->
  <path d="M 40 118 L 520 118" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- hint -->
  <text x="280" y="134" text-anchor="middle" font-size="10.5" fill="#888">构造时每步「往前面加一个字符」→ 先加的字符落在末尾 → si = s[n−i:]（后缀）</text>

  <!-- ====== Row i=0 (s5) ====== -->
  <text x="80" y="166" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">s5 = s[0:]</text>
  <rect x="120" y="150" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="172" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="164" y="150" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="172" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="208" y="150" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="252" y="150" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="172" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="296" y="150" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="172" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="372" y="172" font-size="11" fill="#b85450" font-weight="bold">全部匹配 → Z[0]=5</text>

  <!-- ====== Row i=2 (s3) ====== -->
  <text x="80" y="218" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">s3 = s[2:]</text>
  <rect x="120" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="224" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="164" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="224" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="208" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="224" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="372" y="224" font-size="11" fill="#b85450" font-weight="bold">前 3 位匹配 → Z[2]=3</text>
  <!-- note: suffix chars are s[2]s[3]s[4] aligned under prefix[0..2] -->
  <text x="230" y="250" text-anchor="middle" font-size="9" fill="#a87020">↑ 后缀 "bab" 对齐前缀，比到自身末尾</text>

  <!-- ====== Row i=4 (s1) ====== -->
  <text x="80" y="282" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">s1 = s[4:]</text>
  <rect x="120" y="266" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="288" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="372" y="288" font-size="11" fill="#b85450" font-weight="bold">前 1 位匹配 → Z[4]=1</text>

  <!-- i=1, i=3 give 0 -->
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#888">s2 = s[1:] = "ab"（首字 a≠b）、s4 = s[3:] = "ab"（首字 a≠b）→ Z[1]=Z[3]=0</text>

  <!-- divider -->
  <path d="M 40 332 L 520 332" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Z array row ====== -->
  <text x="80" y="362" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">Z 数组</text>
  <rect x="120" y="346" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="366" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">5</text>
  <rect x="164" y="346" width="44" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="366" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="208" y="346" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="366" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">3</text>
  <rect x="252" y="346" width="44" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="274" y="366" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="296" y="346" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="366" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">1</text>

  <!-- ====== Answer box ====== -->
  <rect x="120" y="394" width="316" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="278" y="417" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">答案 = Σ Z[i] = 5+0+3+0+1 = 9</text>
</svg>
