<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：n % 3 决定尾部结构，避免 1-块
  </text>

  <!-- Row 1: n % 3 == 0 -->
  <text x="36" y="84" font-size="13" fill="#4a7a3a" filter="url(#rough2)">n%3==0</text>
  <g filter="url(#rough2)">
    <rect x="110" y="66" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="130" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="156" y="66" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="176" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="202" y="66" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="222" y="86" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="254" y="86" font-size="14" fill="#888">…</text>
    <text x="296" y="86" font-size="12" fill="#4a7a3a">全 3-块，无尾部</text>
  </g>

  <!-- Row 2: n % 3 == 2 -->
  <text x="36" y="148" font-size="13" fill="#446688" filter="url(#rough2)">n%3==2</text>
  <g filter="url(#rough2)">
    <rect x="110" y="130" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="150" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="156" y="130" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="150" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="206" y="150" font-size="14" fill="#888">…</text>
    <rect x="232" y="130" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="150" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="288" y="150" font-size="12" fill="#446688">尾 2 → 一个 2-块</text>
  </g>

  <!-- Row 3: n % 3 == 1 (the special case) -->
  <text x="36" y="212" font-size="13" fill="#b85450" filter="url(#rough2)">n%3==1</text>
  <g filter="url(#rough2)">
    <rect x="110" y="194" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="130" y="214" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="156" y="194" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="176" y="214" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="206" y="214" font-size="14" fill="#888">…</text>
    <!-- forbidden 1-block -->
    <rect x="232" y="194" width="22" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="243" y="214" text-anchor="middle" font-size="12" fill="#b85450">1</text>
    <text x="264" y="208" font-size="12" fill="#b85450">禁止 1-块！</text>
    <text x="264" y="222" font-size="11" fill="#b85450">借前 3 凑成 4</text>
  </g>

  <!-- transformation: borrow 1 from preceding 3 to make 4 -> 2+2 -->
  <g filter="url(#rough2)">
    <path d="M176,226 L176,250" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="184" y="244" font-size="11" fill="#b85450">借</text>
    <!-- merged 4 block -->
    <rect x="140" y="256" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="186" y="276" text-anchor="middle" font-size="12" fill="#b85450">4 (=3+1)</text>
    <path d="M186,288 L186,308" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <!-- split into 2 + 2 -->
    <rect x="140" y="314" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="162" y="334" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="188" y="314" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="210" y="334" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="244" y="334" font-size="12" fill="#d6a040">拆成 2 + 2</text>
  </g>

  <!-- bottom note -->
  <rect x="300" y="256" width="220" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    唯一特例：余 1 时
  </text>
  <text x="410" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    不能留 1-块 →
  </text>
  <text x="410" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    借前 3 凑 4 → 拆 2+2
  </text>
</svg>
