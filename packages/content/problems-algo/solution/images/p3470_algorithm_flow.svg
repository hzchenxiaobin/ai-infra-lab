<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理 → 逐位试放 → 计数跳段 / 落位</text>

  <rect x="185" y="32" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">预处理饱和阶乘 fact[0..n]</text>
  <path d="M 260 58 L 260 66" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,68 358,86 260,104 162,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k &gt; 总排列数？</text>
  <path d="M 358 86 L 396 86" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="377" y="78" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="72" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="445" y="90" text-anchor="middle" font-size="10.5" fill="#a03934" font-weight="bold" filter="url(#rough2)">返回 []</text>
  <path d="M 260 104 L 260 116" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="269" y="113" font-size="9" fill="#55677d" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="150" y="120" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 i 位：候选 c 从小到大试放</text>
  <text x="260" y="147" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">条件：未使用，且奇偶 ≠ 前一位（首位不受限）</text>
  <path d="M 260 154 L 260 162" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="164" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">计算以「前缀 + c」开头的排列数 ways</text>
  <text x="260" y="191" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">槽位匹配 ⇒ ⌊rem/2⌋!·⌈rem/2⌉!，否则 0</text>
  <path d="M 260 198 L 260 206" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,208 352,226 260,244 168,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k &gt; ways？</text>
  <path d="M 352 226 L 386 226" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="369" y="218" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="390" y="212" width="112" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="446" y="224" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k −= ways</text>
  <text x="446" y="236" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">换下一个候选</text>
  <path d="M 446 212 L 446 137 L 374 137" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 260 244 L 260 254" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="269" y="252" font-size="9" fill="#55677d" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="175" y="258" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="255" y="271" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">落位 c</text>
  <text x="255" y="284" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">used[c]=1，prev ← 奇偶(c)</text>
  <path d="M 175 273 L 88 273 L 88 137 L 146 137" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="203" font-size="9" fill="#55677d" filter="url(#rough2)">还有位置</text>
  <text x="96" y="216" font-size="9" fill="#55677d" filter="url(#rough2)">进入第 i+1 位</text>
  <path d="M 335 273 L 361 273" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="349" y="265" text-anchor="middle" font-size="8.5" fill="#55677d" filter="url(#rough2)">放满</text>
  <rect x="365" y="258" width="115" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="422" y="271" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 res</text>
  <text x="422" y="284" text-anchor="middle" font-size="9.5" fill="#4a6b3f" filter="url(#rough2)">第 k 个排列</text>

  <g filter="url(#rough2)">
    <rect x="40" y="300" width="460" height="46" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="270" y="317" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">ways 只依赖位置 i 与候选的奇偶性，与候选数值无关</text>
    <text x="270" y="334" text-anchor="middle" font-size="9.5" fill="#55677d">可用除法一次算出跳过个数 + 树状数组选第 t 小未用数，优化到 O(n log n)；本题 n ≤ 100 不必</text>
  </g>
</svg>
