<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两次剥叶算法流程</text>

  <!-- 1: build graph -->
  <rect x="150" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建邻接表 g[] 与度数组 deg[]</text>
  <text x="270" y="79" text-anchor="middle" font-size="10.5" fill="#666">读入 edges，两端 deg 各 +1</text>
  <line x1="270" y1="86" x2="270" y2="106" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2: init queue -->
  <rect x="120" y="106" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">队列初始化：所有 deg==1 且 coins==0 的叶入队</text>
  <text x="270" y="139" text-anchor="middle" font-size="10.5" fill="#666">阶段①：删无币叶</text>
  <line x1="270" y1="146" x2="270" y2="166" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3: BFS loop -->
  <rect x="100" y="166" width="340" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">BFS 出队 u：标记删除，对邻居 v 执行 deg[v]−−</text>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333">若 v 变叶(deg==1) 且 coins[v]==0 → v 入队</text>
  <text x="270" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">反复直至队列为空</text>
  <path d="M 440 200 Q 478 200 478 178 Q 478 156 356 166" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="486" y="184" font-size="10" fill="#888">循环</text>
  <line x1="270" y1="216" x2="270" y2="236" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4: two layers -->
  <rect x="90" y="236" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段②：剥两层叶（距离 2 可收币）</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#333">每轮：快照当前所有叶 → 删除 → 邻居 deg−−</text>
  <text x="270" y="286" text-anchor="middle" font-size="10" fill="#666">第 1 轮删带币叶；第 2 轮删暴露出的父节点</text>
  <line x1="270" y1="286" x2="270" y2="306" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5: answer -->
  <rect x="120" y="306" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">剩余节点数 R</text>
  <text x="270" y="343" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 max(0, (R − 1) × 2)</text>

  <rect x="60" y="372" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为何 × 2？树中走遍所有边并回到起点</text>
  <text x="270" y="408" text-anchor="middle" font-size="10.5" fill="#666">每条边必经「去 + 回」两次；R 个节点 → R−1 条边</text>
</svg>
