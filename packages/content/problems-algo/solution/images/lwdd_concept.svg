<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删除若干字符 = 是 s 的子序列</text>

  <!-- s row label -->
  <text x="34" y="80" font-size="12" fill="#888">s:</text>

  <!-- s = a b p c p l e a, kept: a(0) p(2) p(4) l(5) e(6) green; deleted: b(1) c(3) a(7) gray -->
  <!-- idx 0: a kept -->
  <rect x="70" y="60" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <!-- idx 1: b deleted -->
  <rect x="120" y="60" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="142" y="82" text-anchor="middle" font-size="13" fill="#999">b</text>
  <path d="M 124 90 L 160 62" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- idx 2: p kept -->
  <rect x="170" y="60" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <!-- idx 3: c deleted -->
  <rect x="220" y="60" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="82" text-anchor="middle" font-size="13" fill="#999">c</text>
  <path d="M 224 90 L 260 62" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- idx 4: p kept -->
  <rect x="270" y="60" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <!-- idx 5: l kept -->
  <rect x="320" y="60" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <!-- idx 6: e kept -->
  <rect x="370" y="60" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="392" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <!-- idx 7: a deleted -->
  <rect x="420" y="60" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="82" text-anchor="middle" font-size="13" fill="#999">a</text>
  <path d="M 424 90 L 460 62" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- indices -->
  <text x="92" y="108" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="142" y="108" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="192" y="108" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="242" y="108" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="292" y="108" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="342" y="108" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="392" y="108" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="442" y="108" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- big down arrow with note -->
  <path d="M 260 120 L 260 150" stroke="#7a7a7a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="124" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="200" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">删除 b, c, a</text>
  <text x="320" y="139" font-size="10" fill="#888" font-style="italic">（保持剩余顺序）</text>

  <!-- result row: apple -->
  <text x="28" y="184" font-size="12" fill="#888">结果:</text>
  <rect x="150" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <rect x="250" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <rect x="300" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <rect x="350" y="166" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="404" y="188" font-size="12" fill="#446688" font-weight="bold">= "apple"</text>

  <!-- equation box -->
  <rect x="40" y="226" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">word 可由 s 删除若干字符得到</text>
  <text x="260" y="270" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⟺  word 是 s 的子序列</text>

  <!-- implication -->
  <rect x="40" y="296" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#333">不枚举 s 的 2^|s| 个子序列</text>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a">而是对每个 word 做 O(|s|) 子序列判定</text>
</svg>
