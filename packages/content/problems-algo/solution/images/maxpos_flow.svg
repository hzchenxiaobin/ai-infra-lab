<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：正/负长度双状态 DP</text>

  <!-- 初始化 -->
  <rect x="220" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">pos = neg = ans = 0</text>

  <path d="M 280 78 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读入 num -->
  <rect x="225" y="104" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333">读入 num = nums[i]</text>

  <path d="M 280 138 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判 num > 0 -->
  <path d="M 280 158 L 360 200 L 280 242 L 200 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="11" fill="#5a4a20">num &gt; 0 ?</text>
  <text x="370" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- num > 0 分支 -->
  <path d="M 360 200 L 430 200 L 430 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="355" y="236" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="435" y="256" text-anchor="middle" font-size="11" fill="#333">pos = pos + 1</text>
  <text x="435" y="273" text-anchor="middle" font-size="11" fill="#333">neg = neg&gt;0 ? neg+1 : 0</text>

  <!-- 否 -> num < 0 -->
  <path d="M 200 200 L 130 200 L 130 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="196" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <path d="M 130 236 L 70 278 L 130 320 L 190 278 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="275" text-anchor="middle" font-size="11" fill="#5a4a20">num &lt; 0 ?</text>
  <text x="200" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- num < 0 分支：互换 -->
  <path d="M 190 278 L 250 278 L 250 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="312" width="170" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="255" y="332" text-anchor="middle" font-size="11" fill="#333">new_pos = neg&gt;0 ? neg+1 : 0</text>
  <text x="255" y="349" text-anchor="middle" font-size="11" fill="#333">new_neg = pos + 1；互换</text>

  <!-- 否 -> num == 0 -->
  <path d="M 70 278 L 40 278 L 40 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="274" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="-10" y="316" width="110" height="44" fill="#f0f0f0" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="45" y="336" text-anchor="middle" font-size="11" fill="#333">num == 0：</text>
  <text x="45" y="352" text-anchor="middle" font-size="11" fill="#333">pos = neg = 0</text>

  <!-- 三路汇合到 ans 更新 -->
  <path d="M 435 284 L 435 400" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 255 360 L 255 400" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 45 360 L 45 400 L 435 400" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 255 400 L 255 400" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 280 400 L 280 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="416" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, pos)</text>

  <!-- 循环回边 -->
  <path d="M 370 433 Q 510 433 510 121 L 340 121" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="280" font-size="10" fill="#888" transform="rotate(90 520 280)">下一轮 i+1</text>

  <text x="280" y="468" text-anchor="middle" font-size="11" fill="#888">遍历结束返回 ans（过程中 pos 的最大值）</text>
</svg>
