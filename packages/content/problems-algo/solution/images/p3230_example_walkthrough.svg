<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：cnt 平票 → max_date 大者胜（两次都是 C）</text>

  <text x="115" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">客户 101 的 P 表</text>

  <rect x="30" y="56" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cat</text>
  <text x="110" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="165" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">max_date</text>

  <rect x="30" y="76" width="180" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">A</text>
  <text x="110" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-01</text>

  <rect x="30" y="95" width="180" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">B</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-15</text>

  <rect x="30" y="114" width="180" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="127" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="110" y="127" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="165" y="127" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">02-10</text>

  <text x="120" y="150" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">cnt 全 1 → 平票，02-10 最近 → C ✓</text>

  <text x="375" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">客户 102 的 P 表</text>

  <rect x="290" y="56" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cat</text>
  <text x="370" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="425" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">max_date</text>

  <rect x="290" y="76" width="180" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">A</text>
  <text x="370" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-01</text>

  <rect x="290" y="95" width="180" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="370" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="425" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">01-22</text>

  <text x="380" y="131" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">又平票，01-22 最近 → C ✓</text>

  <path d="M 40 168 L 480 168" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <rect x="28" y="180" width="224" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">客户 101：五个数值指标</text>
  <text x="140" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">total = 100+150+200 = 450.00</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt = 3 · uniq = 3（A,B,C）</text>
  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">avg = 450 / 3 = 150.00</text>
  <text x="140" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">loyalty = 3×10 + 450/100 = 34.50</text>

  <rect x="268" y="180" width="224" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">客户 102：五个数值指标</text>
  <text x="380" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">total = 100+200 = 300.00</text>
  <text x="380" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt = 2 · uniq = 2（A,C）</text>
  <text x="380" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">avg = 300 / 2 = 150.00</text>
  <text x="380" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">loyalty = 2×10 + 300/100 = 23.00</text>

  <path d="M 140 272 L 140 290 L 260 290 L 260 300" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 380 272 L 380 290 L 262 290 L 262 300" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">输出（loyalty_score 降序）</text>

  <rect x="28" y="324" width="464" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">cust</text>
  <text x="118" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="178" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="232" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">uniq</text>
  <text x="292" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">avg</text>
  <text x="352" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">top</text>
  <text x="430" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">loyalty</text>

  <rect x="28" y="344" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="118" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">450.00</text>
  <text x="178" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="232" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="292" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">150.00</text>
  <text x="352" y="358" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="430" y="358" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">34.50</text>

  <rect x="28" y="364" width="464" height="20" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <text x="118" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">300.00</text>
  <text x="178" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="232" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="292" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">150.00</text>
  <text x="352" y="378" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="430" y="378" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">23.00</text>

  <text x="260" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">34.50 &gt; 23.00 → 101 在前；若 loyalty 也平，customer_id 升序决胜负</text>
  <text x="260" y="420" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">avg 两客户同为 150.00 但 loyalty 不同——忠诚度看的是频次×10 的权重</text>
</svg>
