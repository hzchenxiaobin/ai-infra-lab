<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：nums = [9,3,1,2,6,3]，k = 3 → 4 个子数组</text>
  <text x="270" y="40" text-anchor="middle" font-size="10" fill="#888">每行固定起点 i，向右扩展 j 记录前缀 gcd；绿=命中 k，红=k∤g 终止，蓝=g&gt;k 继续</text>

  <!-- ====== Header row ====== -->
  <rect x="30" y="50" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <rect x="74" y="50" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前缀 gcd 序列（从 j=i 起逐个扩展）</text>
  <rect x="398" y="50" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">命中（g=3）</text>

  <!-- row height 30, start y=82 -->
  <!-- ====== Row i=0: 9 -> 3 -> 1 ; hit [9,3] ====== -->
  <text x="50" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="84" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
  <line x1="152" y1="97" x2="166" y2="97" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="84" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="212" y1="97" x2="226" y2="97" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="84" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="102" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="282" y="102" font-size="9.5" fill="#b85450" font-weight="bold">终止</text>
  <rect x="398" y="84" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="102" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[9,3]</text>

  <!-- ====== Row i=1: 3 -> 1 ; hit [3] ====== -->
  <text x="50" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="116" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="152" y1="129" x2="166" y2="129" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="116" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="222" y="134" font-size="9.5" fill="#b85450" font-weight="bold">终止</text>
  <rect x="398" y="116" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[3]</text>

  <!-- ====== Row i=2: 1 ; hit — ====== -->
  <text x="50" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="148" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="160" y="166" font-size="9.5" fill="#b85450" font-weight="bold">3∤1 终止</text>
  <rect x="398" y="148" width="112" height="26" fill="#f4f7fb" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="166" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <!-- ====== Row i=3: 2 ; hit — ====== -->
  <text x="50" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="180" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="198" font-size="9.5" fill="#b85450" font-weight="bold">3∤2 终止</text>
  <rect x="398" y="180" width="112" height="26" fill="#f4f7fb" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="198" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <!-- ====== Row i=4: 6 -> 3 ; hit [6,3] ====== -->
  <text x="50" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="110" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <line x1="152" y1="225" x2="166" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="222" y="230" font-size="9.5" fill="#4a7a3a" font-weight="bold">到此结束</text>
  <rect x="398" y="212" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[6,3]</text>

  <!-- ====== Row i=5: 3 ; hit [3] ====== -->
  <text x="50" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="110" y="244" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="160" y="262" font-size="9.5" fill="#4a7a3a" font-weight="bold">末元素命中</text>
  <rect x="398" y="244" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[3]</text>

  <!-- ====== Total row ====== -->
  <rect x="30" y="290" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="312" font-size="11.5" fill="#d6a040" font-weight="bold">合计</text>
  <text x="100" y="312" font-size="11" fill="#333" font-weight="bold">4 个子数组：</text>
  <rect x="200" y="298" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[9,3]</text>
  <rect x="262" y="298" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[3]</text>
  <rect x="316" y="298" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[6,3]</text>
  <rect x="378" y="298" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[3]</text>
  <text x="436" y="314" font-size="11" fill="#b85450" font-weight="bold">= ans = 4</text>
  <text x="270" y="333" text-anchor="middle" font-size="9.5" fill="#888">注：i=2,3 一进循环首元素就 k∤g，立刻终止，几乎不耗时</text>
</svg>
