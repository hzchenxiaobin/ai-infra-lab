<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">n = 8：只需跟踪 head / step / rem / left 四个量</text>

  <!-- 行 1：初始 -->
  <text x="52" y="72" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="80" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="114" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="148" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="216" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="250" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="284" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="52" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="95" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="129" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">2</text>
    <text x="163" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">3</text>
    <text x="197" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">4</text>
    <text x="231" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">5</text>
    <text x="265" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">6</text>
    <text x="299" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">7</text>
    <text x="333" y="69" text-anchor="middle" font-size="11" fill="#2f5d24">8</text>
  </g>
  <text x="440" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">head=1 · step=1 · rem=8</text>

  <!-- 行 2：操作 1，从左删 -->
  <text x="52" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作1</text>
  <g filter="url(#rough2)">
    <rect x="80" y="106" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="114" y="106" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="148" y="106" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="106" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="216" y="106" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="250" y="106" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="284" y="106" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="106" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="95" y="123" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="129" y="123" text-anchor="middle" font-size="11" fill="#b85450">2</text>
    <text x="163" y="123" text-anchor="middle" font-size="11" fill="#2f5d24">3</text>
    <text x="197" y="123" text-anchor="middle" font-size="11" fill="#b85450">4</text>
    <text x="231" y="123" text-anchor="middle" font-size="11" fill="#2f5d24">5</text>
    <text x="265" y="123" text-anchor="middle" font-size="11" fill="#b85450">6</text>
    <text x="299" y="123" text-anchor="middle" font-size="11" fill="#2f5d24">7</text>
    <text x="333" y="123" text-anchor="middle" font-size="11" fill="#b85450">8</text>
    <path d="M 122 100 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 190 100 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 258 100 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 326 100 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="440" y="118" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">→ [1,3,5,7]</text>
  <text x="440" y="133" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">head=1 · step=2 · rem=4</text>

  <!-- 行 3：操作 2，从右删 -->
  <text x="52" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作2</text>
  <g filter="url(#rough2)">
    <rect x="80" y="160" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="114" y="160" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="148" y="160" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="160" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="216" y="160" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="250" y="160" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="284" y="160" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="160" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="95" y="177" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text x="163" y="177" text-anchor="middle" font-size="11" fill="#2f5d24">3</text>
    <text x="231" y="177" text-anchor="middle" font-size="11" fill="#b85450">5</text>
    <text x="299" y="177" text-anchor="middle" font-size="11" fill="#2f5d24">7</text>
    <path d="M 88 154 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 224 154 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="440" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">→ [3,7]</text>
  <text x="440" y="187" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">head=3 · step=4 · rem=2</text>

  <!-- 行 4：操作 1，从左删 -->
  <text x="52" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作1</text>
  <g filter="url(#rough2)">
    <rect x="80" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="114" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="148" y="214" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="182" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="216" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="250" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="284" y="214" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="318" y="214" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="163" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">3</text>
    <text x="299" y="231" text-anchor="middle" font-size="11" fill="#b85450">7</text>
    <path d="M 292 208 l 14 14 m 0 -14 l -14 14" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="440" y="231" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 3</text>

  <!-- 底部规则框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="262" width="228" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="281" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">剩余序列永远是等差数列</text>
    <text x="140" y="298" text-anchor="middle" font-size="10" fill="#33506b">head + k·step，k = 0..rem−1</text>
    <text x="140" y="314" text-anchor="middle" font-size="10" fill="#33506b">每轮：step ×2，rem → ⌈rem/2⌉</text>
    <text x="140" y="330" text-anchor="middle" font-size="10" fill="#33506b">轮数 = O(log n)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="266" y="262" width="228" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="380" y="281" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">head 何时变？</text>
    <text x="380" y="298" text-anchor="middle" font-size="10" fill="#8a6d1f">从左删：保留位置 1 → 不变</text>
    <text x="380" y="314" text-anchor="middle" font-size="10" fill="#8a6d1f">从右删：rem 偶 → head += step</text>
    <text x="380" y="330" text-anchor="middle" font-size="10" fill="#8a6d1f">从右删：rem 奇 → 不变</text>
  </g>
</svg>
