<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">幻方定义：k×k 方格，每行 / 每列 / 两条对角线的和 全部等于 S</text>

  <!-- ===== 3x3 magic square with concrete values ===== -->
  <!-- cells: x0=110, y0=80, size=48 -->
  <!-- row0: 5 1 6  -> 12 -->
  <!-- row1: 5 4 3  -> 12 -->
  <!-- row2: 2 7 3  -> 12 -->

  <!-- Row sums labels (right side) -->
  <text x="270" y="100" font-size="11" fill="#888">行和</text>
  <text x="270" y="148" font-size="11" fill="#888">行和</text>
  <text x="270" y="196" font-size="11" fill="#888">行和</text>

  <!-- Col sums labels (bottom) -->
  <text x="134" y="240" text-anchor="middle" font-size="10" fill="#888">列和</text>
  <text x="182" y="240" text-anchor="middle" font-size="10" fill="#888">列和</text>
  <text x="230" y="240" text-anchor="middle" font-size="10" fill="#888">列和</text>

  <!-- 9 cells -->
  <rect x="110" y="80" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>

  <rect x="158" y="80" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="206" y="80" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">6</text>

  <rect x="110" y="128" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="158" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>

  <rect x="158" y="128" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="158" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>

  <rect x="206" y="128" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="158" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <rect x="110" y="176" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="206" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <rect x="158" y="176" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="206" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>

  <rect x="206" y="176" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="206" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <!-- Row sum results -->
  <path d="M 254 104 L 288 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="92" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 12</text>

  <path d="M 254 152 L 288 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="140" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 12</text>

  <path d="M 254 200 L 288 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="188" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 12</text>

  <!-- Col sum results -->
  <path d="M 134 224 L 134 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="106" y="260" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="275" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">= 12</text>

  <path d="M 182 224 L 182 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="154" y="260" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="275" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">= 12</text>

  <path d="M 230 224 L 230 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="202" y="260" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="275" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">= 12</text>

  <!-- Diagonals: main diagonal line -->
  <line x1="120" y1="90" x2="244" y2="214" stroke="#b85450" stroke-width="2.5" opacity="0.55" filter="url(#rough2)"/>
  <!-- anti diagonal line -->
  <line x1="244" y1="90" x2="120" y2="214" stroke="#d6a040" stroke-width="2.5" opacity="0.6" filter="url(#rough2)"/>

  <!-- Diagonal labels -->
  <rect x="360" y="92" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="110" font-size="11" fill="#b85450" font-weight="bold">主对角线 (↘)</text>
  <text x="370" y="126" font-size="11" fill="#444">5 + 4 + 3 = 12 ✓</text>

  <rect x="360" y="148" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="166" font-size="11" fill="#d6a040" font-weight="bold">副对角线 (↙)</text>
  <text x="370" y="182" font-size="11" fill="#444">6 + 4 + 2 = 12 ✓</text>

  <!-- ===== Prefix sum idea ===== -->
  <line x1="30" y1="306" x2="530" y2="306" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="330" font-size="12" fill="#888">行/列和用前缀和 O(1) 查询：</text>

  <rect x="30" y="340" width="245" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="360" font-size="11" fill="#446688" font-weight="bold">rowPrefix[i][j]</text>
  <text x="44" y="378" font-size="10" fill="#555">= 第 i 行前 j 个元素之和</text>
  <text x="44" y="398" font-size="10" fill="#4a7a3a">行 i 在 [c, c+k) 的和</text>
  <text x="44" y="414" font-size="11" fill="#333" font-weight="bold">= rowPrefix[i][c+k] − rowPrefix[i][c]</text>
  <text x="44" y="430" font-size="10" fill="#888">O(1) 查询，免去每次重新累加</text>

  <rect x="290" y="340" width="245" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="360" font-size="11" fill="#4a7a3a" font-weight="bold">colPrefix[i][j]</text>
  <text x="304" y="378" font-size="10" fill="#555">= 第 j 列前 i 个元素之和</text>
  <text x="304" y="398" font-size="10" fill="#4a7a3a">列 j 在 [r, r+k) 的和</text>
  <text x="304" y="414" font-size="11" fill="#333" font-weight="bold">= colPrefix[r+k][j] − colPrefix[r][j]</text>
  <text x="304" y="430" font-size="10" fill="#888">两条对角线规模仅 O(k)，直接累加即可</text>
</svg>
