<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "1317", k = 2000, m = 4</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每行枚举最后一段 s[j..i−1]，累加 dp[j] 得 dp[i]</text>

  <!-- ===== Table header ===== -->
  <g>
    <rect x="40" y="58" width="44" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="62" y="75" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
    <rect x="84" y="58" width="300" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="234" y="75" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">最后一段候选（j → 段 = 值）</text>
    <rect x="384" y="58" width="96" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="432" y="75" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">Σ dp[j] = dp[i]</text>
  </g>

  <!-- ===== Row i=0 (init) ===== -->
  <g>
    <rect x="40" y="86" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="62" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <rect x="84" y="86" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="94" y="106" font-size="10" fill="#555">（空串初值，递推起点）</text>
    <rect x="384" y="86" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="432" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- ===== Row i=1 ===== -->
  <g>
    <rect x="40" y="120" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="62" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="84" y="120" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="94" y="140" font-size="10" fill="#333">j=0 → "1" = 1</text>
    <rect x="384" y="120" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="432" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[0] = 1</text>
  </g>

  <!-- ===== Row i=2 ===== -->
  <g>
    <rect x="40" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="62" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="84" y="154" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="94" y="174" font-size="10" fill="#333">j=1 → "3" = 3 ;  j=0 → "13" = 13</text>
    <rect x="384" y="154" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="432" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1+1 = 2</text>
  </g>

  <!-- ===== Row i=3 ===== -->
  <g>
    <rect x="40" y="188" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="62" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <rect x="84" y="188" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="94" y="208" font-size="10" fill="#333">j=2 → "1"=1 ;  j=1 → "31"=31 ;  j=0 → "131"=131</text>
    <rect x="384" y="188" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="432" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2+1+1 = 4</text>
  </g>

  <!-- ===== Row i=4 (answer, emphasized) ===== -->
  <g>
    <rect x="40" y="222" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="62" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
    <rect x="84" y="222" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="94" y="244" font-size="10" fill="#333">j=3→"7"=7 ; j=2→"17"=17 ; j=1→"317"=317 ; j=0→"1317"=1317≤k</text>
    <rect x="384" y="222" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="432" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4+2+1+1</text>
    <text x="432" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">= 8</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="60" y="268" width="400" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="76" y="274" width="11" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="92" y="283" font-size="9" fill="#555">初值</text>
  <rect x="130" y="274" width="11" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="146" y="283" font-size="9" fill="#555">L&lt;m 段</text>
  <rect x="190" y="274" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="206" y="283" font-size="9" fill="#555">含 L=m 候选</text>
  <rect x="270" y="274" width="11" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="286" y="283" font-size="9" fill="#555">i=n 答案</text>

  <!-- ===== Result note ===== -->
  <rect x="60" y="300" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">dp[4] = 4+2+1+1 = 8（示例 3 ✓）</text>
  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#888">验证示例 2：s="1000",k=10,m=2 → i=4 段长≤2 全为 "0"/"00"（前导0）→ dp[4]=0 ✓</text>
</svg>
