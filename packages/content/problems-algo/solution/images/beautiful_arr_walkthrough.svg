<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n = 3 的状态转移 DAG（节点 = mask，边 = 放某数字）</text>

  <!-- level labels -->
  <text x="30" y="66" font-size="11" fill="#888">放了0个</text>
  <text x="30" y="146" font-size="11" fill="#888">放了1个</text>
  <text x="30" y="238" font-size="11" fill="#888">放了2个</text>
  <text x="30" y="338" font-size="11" fill="#888">放了3个</text>

  <!-- Level 0: 000 -->
  <rect x="240" y="48" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">000 (dp=1)</text>

  <!-- Level 1: 001, 010, 100 -->
  <rect x="80" y="128" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">001 (1)</text>
  <rect x="240" y="128" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">010 (1)</text>
  <rect x="400" y="128" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100 (1)</text>

  <!-- edges level0 -> level1 -->
  <path d="M 260 88 L 140 126" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="108" font-size="10" fill="#4a7a3a">放1</text>
  <path d="M 280 88 L 280 126" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="110" font-size="10" fill="#4a7a3a">放2</text>
  <path d="M 300 88 L 420 126" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="108" font-size="10" fill="#4a7a3a">放3</text>

  <!-- Level 2: 011, 101, 110 -->
  <rect x="80" y="220" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">011 (2)</text>
  <rect x="240" y="220" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101 (1)</text>
  <rect x="400" y="220" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">110 (1)</text>

  <!-- edges level1 -> level2 -->
  <path d="M 120 168 L 120 218" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="196" font-size="10" fill="#4a7a3a">放2 ✓</text>
  <path d="M 260 168 L 140 218" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="196" font-size="10" fill="#4a7a3a">放1 ✓</text>
  <path d="M 300 168 L 260 218" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="196" font-size="10" fill="#4a7a3a">放1 ✓</text>
  <path d="M 300 168 L 420 218" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="196" font-size="10" fill="#4a7a3a">放2 ✓</text>

  <!-- Level 3: 111 -->
  <rect x="240" y="320" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">111 (3) ⭐</text>

  <!-- edges level2 -> level3 -->
  <path d="M 140 260 L 260 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">放3 ×2</text>
  <path d="M 440 260 L 300 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">放1 ×1</text>

  <!-- rejected edge 101 -> 111 (放2 invalid at pos3) -->
  <path d="M 280 260 L 280 318" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288" y="294" font-size="10" fill="#b85450">放2 ✗</text>

  <!-- footnote -->
  <rect x="40" y="378" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="11" fill="#555">dp[111] = 2（来自 011 放3）+ 1（来自 110 放1）= 3 种优美排列</text>
</svg>
