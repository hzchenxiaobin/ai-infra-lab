<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    Trie + DFS：只走 is_end=true 的节点
  </text>

  <circle cx="290" cy="70" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root</text>
  <text x="290" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">is_end ✓</text>

  <path d="M278,82 Q230,100 175,128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="100" font-size="11" fill="#d6a040" filter="url(#rough2)">a</text>

  <circle cx="160" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="160" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M148,155 Q120,180 95,210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="185" font-size="11" fill="#d6a040" filter="url(#rough2)">p</text>

  <circle cx="85" cy="220" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p</text>
  <text x="85" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M75,238 Q60,270 55,305" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="275" font-size="11" fill="#d6a040" filter="url(#rough2)">p</text>

  <circle cx="50" cy="315" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p</text>
  <text x="50" y="347" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M45,335 Q40,360 42,385" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="365" font-size="11" fill="#d6a040" filter="url(#rough2)">l</text>

  <circle cx="45" cy="395" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="399" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <text x="45" y="427" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M68,392 Q150,360 230,335" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="360" font-size="11" fill="#d6a040" filter="url(#rough2)">e</text>

  <circle cx="245" cy="330" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="245" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="245" y="358" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">apple★</text>

  <path d="M68,400 Q170,400 265,345" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="415" font-size="11" fill="#d6a040" filter="url(#rough2)">y</text>

  <circle cx="285" cy="395" r="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="399" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y</text>
  <text x="285" y="423" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">apply</text>

  <path d="M310,400 Q380,380 410,345" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="360" font-size="11" fill="#d6a040" filter="url(#rough2)">b</text>

  <circle cx="420" cy="335" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="339" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="420" y="363" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">end✗</text>

  <text x="420" y="312" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 断路</text>

  <rect x="370" y="55" width="200" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="76" font-size="11" fill="#333" filter="url(#rough2)">DFS 规则：</text>
  <text x="385" y="94" font-size="10.5" fill="#555" filter="url(#rough2)">• 只递归 is_end=true 的子节点</text>
  <text x="385" y="110" font-size="10.5" fill="#555" filter="url(#rough2)">• children 按字典序遍历</text>
  <text x="385" y="126" font-size="10.5" fill="#555" filter="url(#rough2)">• len &gt; 才更新（保最小序）</text>
</svg>
