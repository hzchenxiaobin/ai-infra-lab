<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [12, 21, 45, 33, 54]，从右往左扫</text>

  <!-- table header -->
  <rect x="40" y="52" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="240" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target=rev</text>
  <text x="370" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">min_idx（处理后）</text>
  <text x="535" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- row i=4 -->
  <rect x="40" y="84" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="102" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="150" y="102" text-anchor="middle" font-size="11" fill="#333">54</text>
  <text x="240" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">45</text>
  <text x="370" y="102" text-anchor="middle" font-size="11" fill="#333">{54:4}</text>
  <text x="535" y="102" text-anchor="middle" font-size="11" fill="#888">∞</text>

  <!-- row i=3 -->
  <rect x="40" y="114" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#333">33</text>
  <text x="240" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">33</text>
  <text x="370" y="132" text-anchor="middle" font-size="11" fill="#333">{54:4, 33:3}</text>
  <text x="535" y="132" text-anchor="middle" font-size="11" fill="#888">∞</text>

  <!-- row i=2 (hit) -->
  <rect x="40" y="144" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="162" text-anchor="middle" font-size="11" fill="#333">45</text>
  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">54</text>
  <text x="370" y="162" text-anchor="middle" font-size="11" fill="#333">{54:4, 33:3, 45:2}</text>
  <text x="535" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row i=1 -->
  <rect x="40" y="174" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#333">21</text>
  <text x="240" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <text x="370" y="192" text-anchor="middle" font-size="11" fill="#333">{…, 21:1}</text>
  <text x="535" y="192" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row i=0 (hit, min) -->
  <rect x="40" y="204" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="240" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">21</text>
  <text x="370" y="222" text-anchor="middle" font-size="11" fill="#333">{…, 12:0}</text>
  <text x="535" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ⭐</text>

  <!-- notes -->
  <line x1="40" y1="252" x2="580" y2="252" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="278" font-size="12" fill="#444" font-weight="bold">逐步说明：</text>
  <text x="48" y="300" font-size="11" fill="#333">• i=4: target=rev(54)=45，min_idx 空，无配对；登记 {54:4}</text>
  <text x="48" y="320" font-size="11" fill="#333">• i=3: target=rev(33)=33，右侧无 33；登记 {33:3}</text>
  <text x="48" y="340" font-size="11" fill="#333">• i=2: target=rev(45)=54，min_idx[54]=4 → 距离 4−2=2，ans=2 ✓</text>
  <text x="48" y="360" font-size="11" fill="#333">• i=1: target=rev(21)=12，右侧无 12；登记 {21:1}</text>
  <text x="48" y="380" font-size="11" fill="#b85450" font-weight="bold">• i=0: target=rev(12)=21，min_idx[21]=1 → 距离 1−0=1，ans=1 ⭐ 最终答案</text>
</svg>
