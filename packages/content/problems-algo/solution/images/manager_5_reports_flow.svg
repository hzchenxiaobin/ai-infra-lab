<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：子查询先找「≥5 下属」的 managerId，外层再 IN 取 name</text>

  <!-- Step 1: FROM Employee -->
  <rect x="60" y="48" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="67" font-size="10" fill="#b85450" font-weight="bold">① FROM</text>
  <text x="130" y="67" font-size="10" fill="#333">Employee —— 数据源：6 行员工记录</text>

  <path d="M280 80 L280 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY managerId -->
  <rect x="60" y="98" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="117" font-size="10" fill="#b85450" font-weight="bold">② GROUP BY</text>
  <text x="160" y="117" font-size="10" fill="#333">managerId —— 按「直属经理」分桶：101 桶 5 行 / NULL 桶 1 行</text>

  <path d="M280 130 L280 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: HAVING COUNT >= 5 -->
  <rect x="60" y="148" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="167" font-size="10" fill="#b85450" font-weight="bold">③ HAVING</text>
  <text x="140" y="167" font-size="10" fill="#d6a040" font-weight="bold">COUNT(managerId) ≥ 5 —— 仅留 101 桶（5 ≥ 5 ✓），NULL 桶丢弃</text>

  <path d="M280 180 L280 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT managerId (subquery result) -->
  <rect x="60" y="198" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="217" font-size="10" fill="#b85450" font-weight="bold">④ SELECT</text>
  <text x="140" y="217" font-size="10" fill="#333">managerId —— 子查询产出候选集合 {101}</text>

  <!-- Separator: subquery feeds outer -->
  <line x1="60" y1="240" x2="500" y2="240" stroke="#b85450" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">↓ 子查询结果 {101} 传入外层 WHERE id IN (...)</text>

  <!-- Step 5: outer FROM + WHERE -->
  <rect x="60" y="262" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="281" font-size="10" fill="#b85450" font-weight="bold">⑤ WHERE</text>
  <text x="130" y="281" font-size="10" fill="#333">id IN (101) —— 在 Employee 中定位 id=101 的行（John）</text>

  <path d="M280 294 L280 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 6: SELECT name -->
  <rect x="60" y="312" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="331" font-size="10" fill="#b85450" font-weight="bold">⑥ SELECT</text>
  <text x="140" y="331" font-size="10" fill="#333">name —— 输出 John</text>

  <path d="M280 344 L280 366" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="180" y="370" width="200" height="60" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">最终输出</text>
  <rect x="240" y="396" width="80" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">John</text>

  <!-- Side note: execution order reminder -->
  <rect x="60" y="436" width="440" height="18" fill="none" stroke="none"/>
  <text x="280" y="450" text-anchor="middle" font-size="9" fill="#888">逻辑顺序：FROM → WHERE → GROUP BY → HAVING → SELECT（本题无外层 WHERE/GROUP BY，由子查询承担）</text>
</svg>
