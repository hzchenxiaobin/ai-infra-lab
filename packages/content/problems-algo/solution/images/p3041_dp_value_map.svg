<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序后，元素 x 只有「保持 x」「升到 x+1」两个落点</text>

  <!-- sorted array -->
  <text x="52" y="64" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">排序后：</text>
  <rect x="118" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="162" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="206" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="250" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="294" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="346" y="64" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">重复值也留着</text>

  <!-- element x -->
  <rect x="230" y="104" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">元素 x</text>

  <!-- branch arrows -->
  <path d="M 246 140 C 216 156, 172 160, 136 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 274 140 C 304 156, 348 160, 384 174" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- keep box -->
  <rect x="48" y="176" width="172" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="134" y="197" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保持：落在值 x</text>
  <!-- bump box -->
  <rect x="300" y="176" width="172" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="386" y="197" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">升 1：落在值 x+1</text>

  <!-- transition formulas -->
  <text x="134" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f[x] ← f[x−1] + 1</text>
  <text x="134" y="252" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">接上「以 x−1 结尾」的段</text>
  <text x="386" y="234" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">f[x+1] ← f[x] + 1</text>
  <text x="386" y="252" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">接上「以 x 结尾」的段</text>

  <!-- f definition -->
  <rect x="48" y="268" width="424" height="46" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">f[v]：以值 v 结尾的最长连续段长度（段内每个元素占一个不同值）</text>
  <text x="260" y="305" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">答案 = max f[v]，一轮 O(1)，无需回头找前驱</text>

  <!-- warning -->
  <rect x="48" y="328" width="424" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠️ 「连续」= 值互不相同：[1,1,2,3] 不合法（1 重复）</text>
  <text x="260" y="371" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">两个同值 x 想同时入选：一个保持、一个 +1 —— 恰好分工到 f[x] 与 f[x+1] 两格</text>
</svg>
