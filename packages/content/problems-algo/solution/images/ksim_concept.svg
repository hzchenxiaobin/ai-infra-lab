<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：固定首个错位 i → 只扩展"修复 i"的交换</text>

  <!-- ===== s1 row ===== -->
  <text x="60" y="64" font-size="12" fill="#888">s1</text>
  <rect x="90" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="132" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="174" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="216" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>

  <!-- index labels -->
  <text x="110" y="92" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="152" y="92" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="194" y="92" text-anchor="middle" font-size="10" fill="#999">j=2</text>
  <text x="236" y="92" text-anchor="middle" font-size="10" fill="#999">j=3</text>

  <!-- ===== s2 row ===== -->
  <text x="60" y="124" font-size="12" fill="#888">s2</text>
  <rect x="90" y="110" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="130" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="174" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="130" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="216" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="130" text-anchor="middle" font-size="13" fill="#333">c</text>

  <!-- first mismatch marker -->
  <text x="110" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 首个错位</text>
  <text x="300" y="124" font-size="11" fill="#b85450">s1[0]='b' ≠ s2[0]='a'</text>

  <!-- ===== Branching illustration ===== -->
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#888">为修复位置 i=0，必须把某个 s1[j]=='a' 换到位置 0</text>

  <!-- arrow from i=0 down -->
  <path d="M 110 158 L 110 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- arrow from j=2 down -->
  <path d="M 194 92 L 194 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- arrow from j=3 down -->
  <path d="M 236 92 L 236 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Two branches ===== -->
  <rect x="110" y="206" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">交换 (0, 2)</text>
  <text x="195" y="238" text-anchor="middle" font-size="12" fill="#333">→ "acba"</text>

  <rect x="320" y="206" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">交换 (0, 3)</text>
  <text x="405" y="238" text-anchor="middle" font-size="12" fill="#333">→ "acab"</text>

  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#888">只扩展这两条分支，其余 j（s1[j]≠'a'）一律剪掉</text>

  <!-- ===== Pruning note ===== -->
  <rect x="40" y="290" width="520" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为什么只看首个错位就够？</text>
  <text x="300" y="326" text-anchor="middle" font-size="11" fill="#666">任何最优交换序列都可重排：让"修复最早错位 i"的那次交换先执行</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="350" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#444">效果：分支因子从 O(n²) 降到 O(频率)，BFS 在 O(n·L²·状态数) 内收敛</text>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#888">L ≤ 20，每层只对首个错位枚举 j，配合 visited 去重</text>
</svg>
