<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：7 次操作追踪队列状态</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">窗口 = 300 秒；ts − front ≥ 300 时弹出队首</text>

  <!-- column headers -->
  <text x="40" y="72" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="80" y="72" font-size="10" fill="#888" font-weight="bold">调用</text>
  <text x="210" y="72" font-size="10" fill="#888" font-weight="bold">队列（队首→队尾）</text>
  <text x="470" y="72" font-size="10" fill="#888" font-weight="bold">判定 / 返回</text>

  <line x1="20" y1="78" x2="580" y2="78" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: hit(1) -->
  <circle cx="35" cy="104" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="108" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="70" y="108" font-size="11" fill="#333">hit(1)</text>
  <rect x="180" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="470" y="108" font-size="10" fill="#888">push 1</text>

  <!-- Step 2: hit(2) -->
  <circle cx="35" cy="146" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="150" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="70" y="150" font-size="11" fill="#333">hit(2)</text>
  <rect x="180" y="134" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="134" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="470" y="150" font-size="10" fill="#888">push 2</text>

  <!-- Step 3: hit(3) -->
  <circle cx="35" cy="188" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="192" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="70" y="192" font-size="11" fill="#333">hit(3)</text>
  <rect x="180" y="176" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="195" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="176" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="176" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="470" y="192" font-size="10" fill="#888">push 3</text>

  <!-- Step 4: getHits(4) -->
  <circle cx="35" cy="230" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="234" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="70" y="234" font-size="11" fill="#333">getHits(4)</text>
  <rect x="180" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="237" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="237" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="470" y="230" font-size="10" fill="#555">4−1=3 &lt; 300</text>
  <text x="470" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">return 3</text>

  <!-- Step 5: hit(300) -->
  <circle cx="35" cy="272" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="276" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="70" y="276" font-size="11" fill="#333">hit(300)</text>
  <rect x="180" y="260" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="279" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="260" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="279" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="260" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="300" y="260" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="279" text-anchor="middle" font-size="11" fill="#333">300</text>
  <text x="470" y="276" font-size="10" fill="#888">push 300</text>

  <!-- Step 6: getHits(300) -->
  <circle cx="35" cy="314" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="318" text-anchor="middle" font-size="10" fill="#333">⑥</text>
  <text x="70" y="318" font-size="11" fill="#333">getHits(300)</text>
  <rect x="180" y="302" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="321" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="302" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="321" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="302" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="300" y="302" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="321" text-anchor="middle" font-size="11" fill="#333">300</text>
  <text x="470" y="314" font-size="10" fill="#555">300−1=299 &lt; 300</text>
  <text x="470" y="328" font-size="10" fill="#4a7a3a" font-weight="bold">return 4</text>

  <!-- separator before step 7 -->
  <line x1="20" y1="338" x2="580" y2="338" stroke="#eee" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- Step 7: getHits(301) -->
  <circle cx="35" cy="372" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="35" y="376" text-anchor="middle" font-size="10" fill="#333">⑦</text>
  <text x="70" y="376" font-size="11" fill="#333">getHits(301)</text>

  <!-- expired 1 (red, struck through) -->
  <rect x="160" y="358" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="377" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <line x1="163" y1="362" x2="197" y2="382" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="352" text-anchor="middle" font-size="9" fill="#b85450">弹出</text>

  <!-- pop arrow -->
  <line x1="202" y1="372" x2="218" y2="372" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- remaining queue -->
  <rect x="222" y="358" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="377" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="262" y="358" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="377" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="302" y="358" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="377" text-anchor="middle" font-size="11" fill="#333">300</text>

  <text x="470" y="362" font-size="10" fill="#555">301−1=300 ≥ 300</text>
  <text x="470" y="376" font-size="10" fill="#b85450" font-weight="bold">pop 1</text>
  <text x="470" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">return 3</text>

  <!-- key insight box -->
  <rect x="20" y="412" width="560" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="434" font-size="11" fill="#d6a040" font-weight="bold">关键对比：</text>
  <text x="34" y="452" font-size="10" fill="#555">④ getHits(4)：4−1=3 &lt; 300，队列不动，返回 3</text>
  <text x="34" y="468" font-size="10" fill="#555">⑥ getHits(300)：300−1=299 &lt; 300，队首 1 仍在窗口内，返回 4</text>
  <text x="34" y="484" font-size="10" fill="#555">⑦ getHits(301)：301−1=300 ≥ 300，队首 1 过期弹出，返回 3</text>
  <text x="34" y="506" font-size="10" fill="#b85450" font-weight="bold">⚠️ 300 是分水岭：差值 &lt; 300 留，≥ 300 弹（窗口 (t−300, t] 左开右闭）</text>
</svg>
