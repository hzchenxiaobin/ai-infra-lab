<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 枚举 x + 二分计数</text>

  <!-- Start -->
  <rect x="195" y="46" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入 nums</text>
  <path d="M 270 86 L 270 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Sort step -->
  <rect x="175" y="114" width="190" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对 nums 升序排序</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#888">O(n log n)</text>
  <path d="M 270 156 L 270 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Loop init -->
  <rect x="195" y="182" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x = 0 .. n</text>
  <path d="M 270 220 L 270 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Binary search box -->
  <rect x="150" y="244" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="263" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">pos = bisect_left(nums, x)</text>
  <text x="270" y="280" text-anchor="middle" font-size="10.5" fill="#888">首个 ≥ x 的位置；cnt = n − pos</text>
  <path d="M 270 290 L 270 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Decision diamond: cnt == x ? -->
  <polygon points="270,316 370,360 270,404 170,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt == x</text>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">?</text>

  <!-- Yes branch (left) -->
  <path d="M 170 360 L 90 360 L 90 396" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="120" y="352" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="400" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="90" y="423" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return x</text>

  <!-- No branch (right) -->
  <path d="M 370 360 L 430 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="384" y="352" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- No: loop back or end -->
  <rect x="430" y="340" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">x++</text>
  <text x="480" y="372" text-anchor="middle" font-size="10" fill="#888">继续枚举</text>

  <!-- Loop back arrow -->
  <path d="M 480 340 L 480 200 L 345 200" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Final return -1 -->
  <rect x="430" y="396" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="480" y="419" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return −1</text>
  <text x="480" y="436" text-anchor="middle" font-size="9.5" fill="#888">枚举完无解</text>
</svg>
