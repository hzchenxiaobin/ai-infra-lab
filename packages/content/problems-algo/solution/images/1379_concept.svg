<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="460" height="470" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">同步遍历两棵树：比对指针身份，命中即返回配对节点</text>
  <text x="230" y="42" text-anchor="middle" font-size="11" fill="#888">original 与 cloned 结构完全一致 → 同步走，(o,c) 永远同位</text>

  <text x="60" y="66" font-size="12" fill="#446688" font-weight="bold">original（target 指针在此树）</text>

  <g font-size="12">
    <line x1="230" y1="92" x2="190" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="230" y1="92" x2="270" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="270" y1="140" x2="245" y2="190" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="270" y1="140" x2="295" y2="190" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

    <circle cx="230" cy="84" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="230" y="88" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <circle cx="190" cy="148" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="190" y="152" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <circle cx="270" cy="148" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="270" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <circle cx="245" cy="198" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="245" y="202" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <circle cx="295" cy="198" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="295" y="202" text-anchor="middle" fill="#446688" font-weight="bold">19</text>
  </g>
  <text x="270" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ target 指针指向此节点</text>

  <path d="M 230 99 L 230 265" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="240" y="182" font-size="9" fill="#d6a040">同步</text>
  <path d="M 270 162 L 270 330" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="280" y="244" font-size="9" fill="#b85450">命中</text>

  <text x="60" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">cloned（答案在这棵树）</text>

  <g font-size="12">
    <line x1="230" y1="288" x2="190" y2="336" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="230" y1="288" x2="270" y2="336" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="270" y1="336" x2="245" y2="386" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="270" y1="336" x2="295" y2="386" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

    <circle cx="230" cy="280" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="230" y="284" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="190" cy="344" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="190" y="348" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="270" cy="344" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="270" y="348" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="245" cy="394" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="245" y="398" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <circle cx="295" cy="394" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="295" y="398" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>
  </g>
  <text x="270" y="422" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ 配对节点，返回此引用</text>

  <rect x="20" y="436" width="420" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="453" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">if (o is target) return c —— 指针身份比较，全程不读 .val</text>
</svg>
