<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "aaaabbbbcccc" 两轮上升下降扫描</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">freq(a,b,c) = (4,4,4)，每轮上升取 a,b,c 各一、下降取 c,b,a 各一</text>

  <!-- ====== Initial freq ====== -->
  <text x="60" y="80" font-size="12" fill="#d6a040" font-weight="bold">初始频次</text>
  <g font-size="9" fill="#888">
    <text x="180" y="80" text-anchor="middle">a</text>
    <text x="240" y="80" text-anchor="middle">b</text>
    <text x="300" y="80" text-anchor="middle">c</text>
  </g>
  <g font-size="15">
    <rect x="156" y="86" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="180" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="216" y="86" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="240" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="276" y="86" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="300" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
  </g>

  <path d="M 320 132 L 320 150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="146" font-size="10" fill="#666">第 1 轮开始</text>

  <!-- ====== Round 1 upward ====== -->
  <rect x="40" y="156" width="560" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="178" font-size="12" fill="#446688" font-weight="bold">第 1 轮 · 上升段 a→z</text>
  <text x="60" y="192" font-size="10" fill="#888">取走 a, b, c 各一个</text>

  <!-- taken letters -->
  <g font-size="14">
    <rect x="180" y="200" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="219" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="214" y="200" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="229" y="219" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="248" y="200" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="263" y="219" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
  </g>
  <text x="300" y="222" font-size="12" fill="#446688">→ result = "abc"</text>

  <!-- remaining freq after round1 upward -->
  <text x="430" y="178" font-size="10" fill="#888">剩余 freq</text>
  <g font-size="11">
    <rect x="430" y="186" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="447" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="468" y="186" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="485" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="506" y="186" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="523" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>
  <text x="430" y="226" font-size="9" fill="#888">(a=3, b=3, c=3)</text>

  <!-- ====== Round 1 downward ====== -->
  <rect x="40" y="246" width="560" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="268" font-size="12" fill="#b85450" font-weight="bold">第 1 轮 · 下降段 z→a</text>
  <text x="60" y="282" font-size="10" fill="#888">取走 c, b, a 各一个</text>

  <g font-size="14">
    <rect x="180" y="290" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="309" text-anchor="middle" fill="#b85450" font-weight="bold">c</text>
    <rect x="214" y="290" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="229" y="309" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <rect x="248" y="290" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="263" y="309" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
  </g>
  <text x="300" y="312" font-size="12" fill="#b85450">→ result = "abccba"</text>

  <text x="430" y="268" font-size="10" fill="#888">剩余 freq</text>
  <g font-size="11">
    <rect x="430" y="276" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="447" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="468" y="276" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="485" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="506" y="276" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="523" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>
  <text x="430" y="316" font-size="9" fill="#888">(a=2, b=2, c=2)</text>

  <path d="M 320 332 L 320 350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="346" font-size="10" fill="#666">第 2 轮开始</text>

  <!-- ====== Round 2 upward ====== -->
  <rect x="40" y="356" width="560" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="12" fill="#446688" font-weight="bold">第 2 轮 · 上升段 a→z</text>
  <text x="60" y="392" font-size="10" fill="#888">取走 a, b, c 各一个</text>

  <g font-size="14">
    <rect x="180" y="400" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="419" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="214" y="400" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="229" y="419" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="248" y="400" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="263" y="419" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
  </g>
  <text x="300" y="422" font-size="12" fill="#446688">→ result = "abccbaabc"</text>

  <text x="430" y="378" font-size="10" fill="#888">剩余 freq</text>
  <g font-size="11">
    <rect x="430" y="386" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="447" y="404" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="468" y="386" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="485" y="404" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="506" y="386" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="523" y="404" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
  </g>
  <text x="430" y="426" font-size="9" fill="#888">(a=1, b=1, c=1)</text>

  <!-- ====== Round 2 downward ====== -->
  <rect x="40" y="446" width="560" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="468" font-size="12" fill="#b85450" font-weight="bold">第 2 轮 · 下降段 z→a</text>
  <text x="60" y="482" font-size="10" fill="#888">取走 c, b, a 各一个 → freq 全 0</text>

  <g font-size="14">
    <rect x="180" y="490" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="509" text-anchor="middle" fill="#b85450" font-weight="bold">c</text>
    <rect x="214" y="490" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="229" y="509" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <rect x="248" y="490" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="263" y="509" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
  </g>
  <text x="300" y="512" font-size="12" fill="#4a7a3a" font-weight="bold">→ result = "abccbaabccba" ✓</text>

  <text x="430" y="468" font-size="10" fill="#888">剩余 freq</text>
  <g font-size="11">
    <rect x="430" y="476" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="447" y="494" text-anchor="middle" fill="#bbb">0</text>
    <rect x="468" y="476" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="485" y="494" text-anchor="middle" fill="#bbb">0</text>
    <rect x="506" y="476" width="34" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="523" y="494" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="430" y="516" font-size="9" fill="#888">全归零，结束</text>

  <text x="320" y="544" text-anchor="middle" font-size="11" fill="#666">len(result)=12 == len(s) ⇒ 返回 "abccbaabccba"</text>
</svg>
