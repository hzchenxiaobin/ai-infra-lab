<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：id=2 "the QUICK brown fox" 全流程过一遍</text>

  <rect x="30" y="38" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① 词数 = 3 个空格 + 1 = 4　→　CROSS JOIN 后幸存 n = 1,2,3,4</text>

  <path d="M 280 76 L 280 90" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② + ③ + ④ words → capitalized 中间表</text>

  <rect x="42" y="116" width="476" height="122" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <line x1="42" y1="140" x2="518" y2="140" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="42" y1="162" x2="518" y2="162" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="42" y1="184" x2="518" y2="184" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="42" y1="206" x2="518" y2="206" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="116" x2="102" y2="238" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="282" y1="116" x2="282" y2="238" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="72" y="133" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">word_pos</text>
  <text x="192" y="133" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">word（双层 SI 取词）</text>
  <text x="400" y="133" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cap_word（INITCAP 变形）</text>
  <text x="72" y="156" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="156" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">the</text>
  <text x="400" y="156" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">The</text>
  <text x="72" y="178" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">QUICK ← 全大写！</text>
  <text x="400" y="178" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Quick（其余压小写）</text>
  <text x="72" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="192" y="200" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">brown</text>
  <text x="400" y="200" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Brown</text>
  <text x="72" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="192" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">fox</text>
  <text x="400" y="222" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">Fox</text>
  <text x="280" y="234" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">（content_id / content_text 两列同表携带，略）</text>

  <path d="M 280 240 L 280 254" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="256" width="500" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="10" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">⑤ GROUP_CONCAT(cap_word ORDER BY word_pos SEPARATOR ' ') = "The Quick Brown Fox" ✓</text>

  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">其余三行走同一条流水线（仅词数不同）</text>

  <rect x="30" y="322" width="500" height="66" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="341" font-size="9.5" fill="#333" filter="url(#rough2)">id=1　hello world of SQL　　　　→ Hello World Of Sql　　（SQL → Sql）</text>
  <text x="52" y="358" font-size="9.5" fill="#333" filter="url(#rough2)">id=3　data science AND machine learning → Data Science And Machine Learning</text>
  <text x="52" y="375" font-size="9.5" fill="#333" filter="url(#rough2)">id=4　TOP rated programming BOOKS　→ Top Rated Programming Books</text>

  <rect x="30" y="396" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">注意：小词 of / and 也照样大写 —— 是每个单词，不是英语标题体（title case 语法）</text>
</svg>
