<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 515" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="515" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 单调指针 j，每次操作增量扣减 sum</text>

  <!-- start -->
  <ellipse cx="210" cy="46" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="51" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 210 61 L 210 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- preprocess -->
  <rect x="70" y="76" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">预处理：order 按（值, 下标）升序排序</text>
  <text x="210" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">marked 全 false；sum = Σ nums；j = 0</text>
  <path d="M 210 122 L 210 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- next query -->
  <rect x="95" y="140" width="230" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取下一个 query = [idx, k]</text>
  <path d="M 210 172 L 210 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="210,192 288,222 210,252 132,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="226" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">marked[idx] ?</text>

  <!-- no -> mark idx -->
  <path d="M 288 222 L 328 222" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="306" y="214" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <rect x="328" y="202" width="176" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="416" y="217" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">点名标记 idx</text>
  <text x="416" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">sum −= nums[idx]</text>
  <path d="M 416 242 L 416 266 L 218 266" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- yes down -->
  <path d="M 210 252 L 210 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="272" font-size="10" fill="#446688" filter="url(#rough2)">是·已标记则忽略</text>

  <!-- diamond 2 -->
  <polygon points="210,286 300,320 210,354 120,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="324" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k &gt; 0 且 j &lt; n ?</text>

  <!-- no -> answer -->
  <path d="M 120 320 L 60 320 L 60 448" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="84" y="310" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否·不足 k 个全标完</text>

  <!-- yes down -->
  <path d="M 210 354 L 210 380" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="372" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 3 -->
  <polygon points="210,382 296,414 210,446 124,414" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="418" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">marked[order[j]] ?</text>

  <!-- yes -> skip -->
  <path d="M 296 414 L 332 414" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="406" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是·插队者</text>
  <rect x="332" y="394" width="172" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="418" y="409" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">跳过：j++</text>
  <text x="418" y="424" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">不消耗 k</text>
  <path d="M 418 394 L 418 326 L 304 326" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="428" y="362" font-size="9.5" fill="#b85450" filter="url(#rough2)">回判</text>

  <!-- no -> mark smallest -->
  <path d="M 210 446 L 210 456" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="452" font-size="10" fill="#446688" filter="url(#rough2)">否·真候选</text>
  <rect x="120" y="458" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="473" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">标记 order[j]</text>
  <text x="210" y="488" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">sum −= 值；j++；k −−</text>
  <path d="M 300 478 L 540 478 L 540 318 L 304 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="470" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">回判</text>

  <!-- answer box -->
  <rect x="14" y="452" width="104" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="66" y="470" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">answer[i]</text>
  <text x="66" y="486" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">= sum</text>

  <!-- answer -> next query -->
  <path d="M 40 452 L 40 156 L 91 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="30" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a" transform="rotate(-90 30 300)" filter="url(#rough2)">下一个 query</text>
</svg>
