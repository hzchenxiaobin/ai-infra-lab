<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：相邻对 A·B / C·D 相遇即消除（栈 = 括号匹配）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">把 A 当作 B 的“左括号”，C 当作 D 的“左括号”</text>

  <!-- Two rules -->
  <text x="40" y="74" font-size="11" fill="#666" font-weight="bold">消除规则</text>

  <!-- rule AB -->
  <rect x="110" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <rect x="144" y="58" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <path d="M188 73 L222 73" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∅（消除）</text>
  <text x="320" y="78" font-size="11" fill="#888">AB → 空</text>

  <!-- rule CD -->
  <rect x="110" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C</text>
  <rect x="144" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>
  <path d="M188 115 L222 115" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∅（消除）</text>
  <text x="320" y="120" font-size="11" fill="#888">CD → 空</text>

  <!-- Stack demo: scan A then B -->
  <text x="40" y="168" font-size="11" fill="#666" font-weight="bold">栈模拟</text>

  <!-- input chars A B -->
  <rect x="110" y="152" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="150" y="172" font-size="12" fill="#888">压入栈</text>
  <!-- arrow into stack -->
  <path d="M127 184 L127 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stack box with A -->
  <rect x="100" y="210" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="170" y="230" font-size="11" fill="#888">栈顶 = A</text>

  <!-- next char B arrives -->
  <rect x="300" y="210" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <text x="342" y="230" font-size="11" fill="#d6a040" font-weight="bold">来到</text>
  <!-- compare: top A + B -->
  <path d="M300 225 L160 225" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="230" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A + B = “AB” → 弹出</text>

  <!-- annihilation result -->
  <text x="127" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✕ A·B 同归于尽</text>
  <rect x="100" y="246" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="266" text-anchor="middle" font-size="11" fill="#b85450">空</text>

  <!-- bottom insight box -->
  <rect x="40" y="288" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么消除顺序不影响结果？</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#555">AB 与 CD 字母不重合，任意两个消除对永不共享位置 → 无重叠冲突</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#555">⇒ 终态唯一（合流）⇒ 贪心一次扫描即得最小长度</text>
</svg>
