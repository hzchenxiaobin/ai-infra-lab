<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="230" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 2, 2, 2]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">全局支配 x=2，f=3；条件 cnt×2 &gt; i+1 且 (f−cnt)×2 &gt; 右半长</text>

  <rect x="35" y="152" width="490" height="38" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="35" y="68" width="490" height="26" fill="#e8f0fe" filter="url(#rough2)"/>

  <path d="M35,94 L525,94 M35,122 L525,122 M35,152 L525,152 M35,190 L525,190" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M65,68 L65,190 M175,68 L175,190 M215,68 L215,190 M335,68 L335,190 M455,68 L455,190" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <rect x="35" y="68" width="490" height="122" fill="none" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="50" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="120" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">左半[0..i]</text>
  <text x="195" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt</text>
  <text x="275" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">左判定</text>
  <text x="395" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">右判定</text>
  <text x="490" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">结果</text>

  <text x="50" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="120" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">[1]</text>
  <text x="195" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="275" y="111" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0&gt;1 ✗</text>
  <text x="395" y="111" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="490" y="111" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">跳过</text>

  <text x="50" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="120" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">[1,2]</text>
  <text x="195" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="275" y="139" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2&gt;2 ✗</text>
  <text x="395" y="139" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="490" y="139" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">跳过</text>

  <text x="50" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">[1,2,2]</text>
  <text x="195" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4&gt;3 ✓</text>
  <text x="395" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2&gt;1 ✓</text>
  <text x="490" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回2</text>

  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">右半频次 = f−cnt：i=2 时右半 [2]，f−cnt = 3−2 = 1</text>
</svg>
