<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：word = "CAKE" 的 dp 滚动过程</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">C(0,2) A(0,0) K(1,4) E(0,4)；dist(C,A)=2, dist(A,K)=5, dist(K,E)=1</text>

  <!-- header -->
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="36" y="76">步</text>
    <text x="96" y="76" text-anchor="middle">打字</text>
    <text x="200" y="76" text-anchor="middle">prev → cur (dist)</text>
    <text x="430" y="76" text-anchor="middle">dp 状态（仅列有限项，★ 为最优路径）</text>
  </g>
  <line x1="20" y1="82" x2="560" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: type C ===== -->
  <g font-size="11">
    <text x="36" y="108" fill="#333" font-weight="bold">1</text>
    <rect x="80" y="92" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97" y="109" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <text x="200" y="109" text-anchor="middle" font-size="10" fill="#888">空闲落键，代价 0</text>
    <!-- dp cell F:0 optimal -->
    <rect x="280" y="92" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="306" y="109" text-anchor="middle" fill="#b85450" font-weight="bold">F : 0 ★</text>
  </g>

  <!-- ===== Row 2: type A, prev=C, d=2 ===== -->
  <g font-size="11">
    <text x="36" y="172" fill="#333" font-weight="bold">2</text>
    <rect x="80" y="156" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97" y="173" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <text x="200" y="173" text-anchor="middle" font-size="10" fill="#888">C → A (d=2)</text>
    <!-- F:2 optimal (A-case) -->
    <rect x="280" y="156" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="306" y="173" text-anchor="middle" fill="#b85450" font-weight="bold">F : 2 ★</text>
    <text x="306" y="190" text-anchor="middle" font-size="8" fill="#b85450">A 同指 +2</text>
    <!-- C:0 (B-case) -->
    <rect x="344" y="156" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="370" y="173" text-anchor="middle" fill="#333">C : 0</text>
    <text x="370" y="190" text-anchor="middle" font-size="8" fill="#4a7a3a">B 空闲→A</text>
  </g>

  <!-- ===== Row 3: type K, prev=A, d=5 ===== -->
  <g font-size="11">
    <text x="36" y="236" fill="#333" font-weight="bold">3</text>
    <rect x="80" y="220" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97" y="237" text-anchor="middle" fill="#446688" font-weight="bold">K</text>
    <text x="200" y="237" text-anchor="middle" font-size="10" fill="#888">A → K (d=5)</text>
    <!-- F:7 -->
    <rect x="276" y="220" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="301" y="237" text-anchor="middle" fill="#333">F : 7</text>
    <!-- C:5 -->
    <rect x="330" y="220" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="355" y="237" text-anchor="middle" fill="#333">C : 5</text>
    <!-- A:2 optimal (B-case from F:2) -->
    <rect x="384" y="220" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="409" y="237" text-anchor="middle" fill="#b85450" font-weight="bold">A : 2 ★</text>
    <text x="409" y="254" text-anchor="middle" font-size="8" fill="#b85450">B 空闲→K +0</text>
  </g>

  <!-- ===== Row 4: type E, prev=K, d=1 ===== -->
  <g font-size="11">
    <text x="36" y="300" fill="#333" font-weight="bold">4</text>
    <rect x="80" y="284" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97" y="301" text-anchor="middle" fill="#446688" font-weight="bold">E</text>
    <text x="200" y="301" text-anchor="middle" font-size="10" fill="#888">K → E (d=1)</text>
    <!-- F:8 -->
    <rect x="268" y="284" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="292" y="301" text-anchor="middle" fill="#333">F : 8</text>
    <!-- C:6 -->
    <rect x="320" y="284" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="344" y="301" text-anchor="middle" fill="#333">C : 6</text>
    <!-- A:3 optimal (A-case from A:2) -->
    <rect x="372" y="284" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="396" y="301" text-anchor="middle" fill="#b85450" font-weight="bold">A : 3 ★</text>
    <text x="396" y="318" text-anchor="middle" font-size="8" fill="#b85450">A 同指 +1</text>
    <!-- K:6 (B-case) -->
    <rect x="424" y="284" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="448" y="301" text-anchor="middle" fill="#333">K : 6</text>
    <text x="448" y="318" text-anchor="middle" font-size="8" fill="#4a7a3a">B A→E +4</text>
  </g>

  <!-- answer banner -->
  <rect x="80" y="338" width="420" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = min{8, 6, 3, 6} = 3 ✓</text>

  <!-- optimal path trace -->
  <rect x="40" y="382" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最优路径回溯：F:0 →(A 同指 C→A, +2) F:2 →(B 空闲落 K, +0) A:2 →(A 同指 K→E, +1) A:3</text>
  <text x="290" y="420" text-anchor="middle" font-size="10" fill="#888">指1：C→A（代价 2）；指2：K→E（代价 1）；总距离 3</text>
</svg>
