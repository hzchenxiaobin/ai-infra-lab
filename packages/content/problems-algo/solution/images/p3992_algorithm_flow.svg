<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="215" y="16" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="35" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 54" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="85" y="56" width="350" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 cy = 0、cx = 0、mid = [ ]，一趟扫描 s</text>
  <path d="M 260 86 L 260 96" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有字符？ -->
  <polygon points="260,98 345,130 260,162 175,130" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有字符？</text>

  <!-- 否 → 拼接输出 -->
  <path d="M 345 130 L 392 130" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="123" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="395" y="106" width="116" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="453" y="126" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">拼接 t =</text>
  <text x="453" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">y·cy + mid + x·cx</text>
  <path d="M 453 154 L 453 166" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="395" y="168" width="116" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="453" y="187" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 t</text>

  <!-- 是 → c == y ? -->
  <path d="M 260 162 L 260 172" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <polygon points="260,174 340,206 260,238 180,206" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == y ?</text>

  <path d="M 180 206 L 148 206" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="190" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="210" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cy 加一</text>

  <!-- 否 → c == x ? -->
  <path d="M 260 238 L 260 248" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <polygon points="260,250 340,282 260,314 180,282" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == x ?</text>

  <path d="M 180 282 L 148 282" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="266" width="116" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="286" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">cx 加一</text>

  <!-- 否 → mid -->
  <path d="M 260 314 L 260 324" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="324" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="193" y="326" width="134" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">mid ← c（其余字符）</text>

  <!-- 回边：三个动作盒汇到左侧总线，再回到「还有字符？」 -->
  <path d="M 30 206 L 14 206 L 14 130 L 171 130" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 30 282 L 14 282 L 14 206" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 193 342 L 14 342 L 14 282" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">处理下一个字符</text>

  <!-- 底部注释 -->
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一趟扫描 O(n)：每个字符恰好三路分类一次（数 y / 数 x / 进 mid）</text>
  <text x="260" y="406" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">计数守恒 ⇒ t 是 s 的排列；x 或 y 不出现 ⇒ 对应段为空，条件空泛成立</text>
</svg>
