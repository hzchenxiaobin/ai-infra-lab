<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[1,7,0,7,-8] 逐层求和</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">3 轮 while，每轮算一层 sum，滚动维护 maxSum / ans</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#b85450" font-weight="bold">轮次 1（L1）：队列=[1], size=1</text>
  <g font-size="10">
    <rect x="30" y="84" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="80" y="98" font-size="9" fill="#888">→ 出队 1，入队 7, 0；sum = 1</text>
    <rect x="290" y="84" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="325" y="100" text-anchor="middle" font-size="9" fill="#b85450">sum = 1</text>
    <rect x="370" y="84" width="155" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="447" y="100" text-anchor="middle" font-size="9" fill="#d6a040">1 &gt; −∞ → max=1, ans=1</text>
  </g>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="140" font-size="11" fill="#446688" font-weight="bold">轮次 2（L2）：队列=[7,0], size=2</text>
  <g font-size="10">
    <rect x="30" y="150" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="166" text-anchor="middle" fill="#446688" font-size="9">7</text>
    <rect x="68" y="150" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="166" text-anchor="middle" fill="#446688" font-size="9">0</text>
    <text x="115" y="164" font-size="9" fill="#888">→ 出 7（入 7,−8），出 0（无子）；sum = 7+0 = 7</text>
    <rect x="290" y="150" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="325" y="166" text-anchor="middle" font-size="9" fill="#446688">sum = 7</text>
    <rect x="370" y="150" width="155" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="447" y="166" text-anchor="middle" font-size="9" fill="#d6a040">7 &gt; 1 → max=7, ans=2 ✅</text>
  </g>

  <!-- ===== Round 3 ===== -->
  <text x="30" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">轮次 3（L3）：队列=[7,−8], size=2</text>
  <g font-size="10">
    <rect x="30" y="216" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="232" text-anchor="middle" fill="#4a7a3a" font-size="9">7</text>
    <rect x="68" y="216" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="232" text-anchor="middle" fill="#4a7a3a" font-size="9">−8</text>
    <text x="115" y="230" font-size="9" fill="#888">→ 出 7（无子），出 −8（无子）；sum = 7+(−8) = −1</text>
    <rect x="290" y="216" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="325" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">sum = −1</text>
    <rect x="370" y="216" width="155" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
    <text x="447" y="232" text-anchor="middle" font-size="9" fill="#888">−1 &gt; 7? 否，不动</text>
  </g>

  <!-- ===== Round 4 ===== -->
  <text x="30" y="272" font-size="11" fill="#888" font-weight="bold">轮次 4：队列=[]，while 结束</text>
  <rect x="30" y="280" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="294" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="80" y="294" font-size="9" fill="#888">→ 退出，返回 ans = 2</text>

  <line x1="20" y1="320" x2="520" y2="320" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Final ===== -->
  <rect x="30" y="336" width="480" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：ans = 2（第 2 层 sum = 7 最大）</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#555">3 轮 while = 3 层，每轮 for 跑 size 次累加 sum</text>
  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#555">严格 &gt; 更新 → L3 的 −1 不覆盖 L2 的 7</text>
  <text x="270" y="414" text-anchor="middle" font-size="9" fill="#888">平局同理：相等时不更新，保留更小层号</text>
  <text x="270" y="430" text-anchor="middle" font-size="9" fill="#888">5 个节点各入队出队 1 次 → O(n)；maxSum 初值 INT_MIN 容纳负值</text>
</svg>
