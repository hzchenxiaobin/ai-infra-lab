<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两层 DP + 单调队列维护窗口最大值 —— O(n·m) 时间 / O(n) 空间</text>

  <ellipse cx="170" cy="42" rx="82" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="38" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">前缀和 P[0..n]</text>
  <text x="170" y="52" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">f ← 0（c=0 层）；ans ← −∞</text>

  <path d="M 170 62 L 170 66" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="62" y="68" width="216" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="87" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">外层循环 c = 1 … m（恰好 c 段）</text>

  <path d="M 170 98 L 170 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="62" y="106" width="216" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="125" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">内层循环 i = l … n（末段右端点）</text>

  <path d="M 170 136 L 170 142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="52" y="144" width="236" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="158" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">j = i − l：v = f[j] − P[j]</text>
  <text x="170" y="172" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">弹掉队尾值 ≤ v 的，再把 j 压入队尾</text>

  <path d="M 170 178 L 170 182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,184 252,206 170,228 88,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="210" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">队首 j &lt; i−r ?</text>

  <path d="M 252 206 L 258 206" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="254" y="199" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="260" y="190" width="88" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="203" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">队首过期</text>
  <text x="304" y="216" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">弹出队首</text>

  <path d="M 304 190 C 302 168, 214 166, 174 181" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="244" y="170" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">再查一次</text>

  <path d="M 170 228 L 170 238" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="179" y="235" font-size="9.5" fill="#55688a" filter="url(#rough2)">否</text>

  <rect x="50" y="240" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="259" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">g[i] = max(g[i−1], P[i] + v[队首])</text>

  <path d="M 170 270 L 170 276" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="50" y="278" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="292" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">本层收尾：ans ← max(ans, g[n])</text>
  <text x="170" y="304" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">f ← g（滚动数组进入下一层）</text>

  <path d="M 170 310 L 170 320" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <ellipse cx="170" cy="338" rx="62" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="342" text-anchor="middle" font-size="10.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <!-- i 循环回边 -->
  <path d="M 290 255 L 430 255 L 430 126 L 282 126" fill="none" stroke="#778899" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="249" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">i+1 ≤ n ⟲</text>

  <!-- c 循环回边 -->
  <path d="M 290 294 L 478 294 L 478 94 L 282 94" fill="none" stroke="#778899" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="308" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">c+1 ≤ m ⟲</text>

  <!-- 侧注 -->
  <rect x="300" y="46" width="168" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="60" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">窗口 [i−r, i−l] 定长滑动</text>
  <text x="384" y="74" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">每个 j 进出队各一次，均摊 O(1)</text>
</svg>
