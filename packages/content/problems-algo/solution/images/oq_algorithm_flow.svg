<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按 k 分支</text>

  <!-- Start -->
  <rect x="200" y="46" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 s, k</text>
  <path d="M 280 86 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: k == 1 ? -->
  <polygon points="280,108 360,154 280,200 200,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">k == 1 ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#888">只有首字符可移</text>

  <!-- YES branch (left) -->
  <path d="M 200 154 L 150 154 L 150 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- NO branch (right) -->
  <path d="M 360 154 L 410 154 L 410 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="148" font-size="10" fill="#d6a040" font-weight="bold">否 (k≥2)</text>

  <!-- YES: enumerate rotations -->
  <rect x="50" y="188" width="200" height="76" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">枚举所有旋转</text>
  <rect x="66" y="216" width="168" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#446688">for i in 0..n-1:</text>
  <rect x="66" y="240" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="10" fill="#446688">候选 = s[i:] + s[:i]</text>
  <path d="M 150 266 L 150 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- YES: pick min -->
  <rect x="70" y="288" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取字典序最小旋转</text>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#666">min(candidates)</text>

  <!-- NO: sort -->
  <rect x="310" y="188" width="200" height="76" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">直接排序</text>
  <rect x="326" y="216" width="168" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="10" fill="#d6a040">相邻交换可达任意排列</text>
  <rect x="326" y="240" width="168" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="254" text-anchor="middle" font-size="10" fill="#d6a040">sorted(s)</text>
  <path d="M 410 266 L 410 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- NO: result sorted -->
  <rect x="330" y="288" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">排序结果即答案</text>
  <text x="410" y="320" text-anchor="middle" font-size="10" fill="#666">"".join(sorted(s))</text>

  <!-- merge to output -->
  <path d="M 150 330 C 150 360, 230 360, 270 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 330 C 410 360, 330 360, 290 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="190" y="372" width="180" height="40" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">返回字典序最小串</text>
</svg>
