<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：分支1 与 分支2</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">abccba → aaccba（分支1）｜ aaabaaa → aaabaab（分支2）</text>

  <!-- ===== Example 1: abccba ===== -->
  <text x="40" y="78" font-size="13" fill="#446688" font-weight="bold">例1：palindrome = "abccba"（n=6, half=3）</text>

  <!-- step table header -->
  <g font-size="10" fill="#888">
    <text x="50" y="100">步</text>
    <text x="90" y="100">下标</text>
    <text x="150" y="100">字符</text>
    <text x="210" y="100">判定</text>
    <text x="330" y="100">动作</text>
  </g>
  <path d="M 40 106 L 500 106" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: i=0, 'a', skip -->
  <g font-size="11" fill="#333">
    <text x="50" y="124">1</text>
    <text x="90" y="124">0</text>
    <rect x="148" y="112" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="127" text-anchor="middle" font-size="10">a</text>
    <text x="210" y="124" fill="#888">== 'a'，跳过</text>
    <text x="330" y="124" fill="#888">i++，继续</text>
  </g>

  <!-- row 2: i=1, 'b', hit branch1 -->
  <g font-size="11" fill="#333">
    <text x="50" y="156">2</text>
    <text x="90" y="156">1</text>
    <rect x="148" y="144" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="159" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">b</text>
    <text x="210" y="156" fill="#b85450" font-weight="bold">!= 'a'，命中分支1</text>
    <text x="330" y="156" fill="#4a7a3a" font-weight="bold">改 'a'，返回</text>
  </g>

  <!-- arrow down to result -->
  <path d="M 270 170 L 270 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result string: a a c c b a with index1 highlighted -->
  <g font-size="14">
    <g font-size="8" fill="#888">
      <text x="120" y="206" text-anchor="middle">0</text>
      <text x="152" y="206" text-anchor="middle">1</text>
      <text x="184" y="206" text-anchor="middle">2</text>
      <text x="216" y="206" text-anchor="middle">3</text>
      <text x="248" y="206" text-anchor="middle">4</text>
      <text x="280" y="206" text-anchor="middle">5</text>
    </g>
    <rect x="104" y="212" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="120" y="233" text-anchor="middle" fill="#333">a</text>
    <rect x="136" y="212" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="152" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="168" y="212" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="184" y="233" text-anchor="middle" fill="#333">c</text>
    <rect x="200" y="212" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="216" y="233" text-anchor="middle" fill="#333">c</text>
    <rect x="232" y="212" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="233" text-anchor="middle" fill="#d6a040" font-weight="bold">b</text>
    <rect x="264" y="212" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="280" y="233" text-anchor="middle" fill="#333">a</text>
  </g>

  <!-- mirror check annotation -->
  <path d="M 152 200 C 152 192, 248 192, 248 200" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="9" fill="#b85450">位置1 'a' ≠ 位置4 'b' → 非回文 ✓</text>

  <text x="350" y="233" font-size="11" fill="#444">输出 <tspan font-weight="bold" fill="#4a7a3a">"aaccba"</tspan></text>

  <!-- divider -->
  <path d="M 30 268 L 510 268" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 2: aaabaaa ===== -->
  <text x="40" y="292" font-size="13" fill="#b85450" font-weight="bold">例2：palindrome = "aaabaaa"（n=7, half=3）</text>

  <g font-size="10" fill="#888">
    <text x="50" y="314">步</text>
    <text x="90" y="314">下标</text>
    <text x="150" y="314">字符</text>
    <text x="210" y="314">判定</text>
    <text x="330" y="314">动作</text>
  </g>
  <path d="M 40 320 L 500 320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows: i=0,1,2 all 'a' skip; then branch2 -->
  <g font-size="11" fill="#333">
    <text x="50" y="338">1</text>
    <text x="90" y="338">0</text>
    <rect x="148" y="326" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="341" text-anchor="middle" font-size="10">a</text>
    <text x="210" y="338" fill="#888">== 'a'，跳过</text>
    <text x="330" y="338" fill="#888">i++</text>

    <text x="50" y="360">2</text>
    <text x="90" y="360">1</text>
    <rect x="148" y="348" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="363" text-anchor="middle" font-size="10">a</text>
    <text x="210" y="360" fill="#888">== 'a'，跳过</text>
    <text x="330" y="360" fill="#888">i++</text>

    <text x="50" y="382">3</text>
    <text x="90" y="382">2</text>
    <rect x="148" y="370" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="385" text-anchor="middle" font-size="10">a</text>
    <text x="210" y="382" fill="#888">== 'a'，跳过</text>
    <text x="330" y="382" fill="#888">扫描结束</text>

    <text x="50" y="404">4</text>
    <text x="90" y="404">—</text>
    <text x="150" y="404" fill="#888">前半全 'a'</text>
    <text x="210" y="404" fill="#b85450" font-weight="bold">进入分支2</text>
    <text x="330" y="404" fill="#b85450" font-weight="bold">末位改 'b'</text>
  </g>

  <!-- arrow down -->
  <path d="M 270 414 L 270 430" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result: a a a b a a b, last char highlighted -->
  <g font-size="13">
    <g font-size="8" fill="#888">
      <text x="84" y="448" text-anchor="middle">0</text>
      <text x="112" y="448" text-anchor="middle">1</text>
      <text x="140" y="448" text-anchor="middle">2</text>
      <text x="168" y="448" text-anchor="middle">3</text>
      <text x="196" y="448" text-anchor="middle">4</text>
      <text x="224" y="448" text-anchor="middle">5</text>
      <text x="252" y="448" text-anchor="middle">6</text>
    </g>
    <rect x="68" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="82" y="453" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="98" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="112" y="453" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="126" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="140" y="453" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="154" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="168" y="453" text-anchor="middle" font-size="11" fill="#333">b</text>
    <rect x="182" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="196" y="453" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="210" y="434" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="224" y="453" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="238" y="434" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
    <text x="252" y="453" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b</text>
  </g>

  <text x="300" y="453" font-size="10" fill="#b85450">位置0 'a' ≠ 位置6 'b' → 非回文 ✓</text>
  <text x="300" y="470" font-size="11" fill="#444">输出 <tspan font-weight="bold" fill="#b85450">"aaabaab"</tspan></text>
</svg>
