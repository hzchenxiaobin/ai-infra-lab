<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：状态机处理 [2,2,3,2]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每步更新 (ones, twos)，3 位二进制展示；最终 ones 即落单数</text>

  <!-- ===== Table ===== -->
  <!-- highlight step3 (归零) -->
  <rect x="30" y="198" width="520" height="32" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <!-- highlight result row -->
  <rect x="30" y="262" width="520" height="32" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- grid lines vertical -->
  <path d="M 30 70 L 30 294 M 100 70 L 100 294 M 190 70 L 190 294 M 270 70 L 270 294 M 350 70 L 350 294 M 550 70 L 550 294" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- grid lines horizontal -->
  <path d="M 30 70 L 550 70 M 30 102 L 550 102 M 30 134 L 550 134 M 30 166 L 550 166 M 30 198 L 550 198 M 30 230 L 550 230 M 30 262 L 550 262 M 30 294 L 550 294" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <text x="65" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="145" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="230" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ones</text>
  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">twos</text>
  <text x="450" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">说明</text>

  <!-- 初始 -->
  <text x="65" y="122" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="145" y="122" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="230" y="122" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="310" y="122" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="360" y="122" font-size="10" fill="#888">状态全 0</text>

  <!-- step1: x=2 -->
  <text x="65" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="145" y="154" text-anchor="middle" font-size="11" fill="#333">2 (010)</text>
  <text x="230" y="154" text-anchor="middle" font-size="12" fill="#2e6b2e" font-weight="bold">010</text>
  <text x="310" y="154" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="360" y="154" font-size="10" fill="#555">bit1 见过 1 次</text>

  <!-- step2: x=2 -->
  <text x="65" y="186" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="145" y="186" text-anchor="middle" font-size="11" fill="#333">2 (010)</text>
  <text x="230" y="186" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="310" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">010</text>
  <text x="360" y="186" font-size="10" fill="#555">bit1 见过 2 次</text>

  <!-- step3: x=3 (归零) -->
  <text x="65" y="218" text-anchor="middle" font-size="11" fill="#6a4a10" font-weight="bold">3</text>
  <text x="145" y="218" text-anchor="middle" font-size="11" fill="#6a4a10">3 (011)</text>
  <text x="230" y="218" text-anchor="middle" font-size="12" fill="#2e6b2e" font-weight="bold">001</text>
  <text x="310" y="218" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="360" y="218" font-size="10" fill="#6a4a10">bit1 满 3 归零；bit0 见 1 次</text>

  <!-- step4: x=2 -->
  <text x="65" y="250" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="145" y="250" text-anchor="middle" font-size="11" fill="#333">2 (010)</text>
  <text x="230" y="250" text-anchor="middle" font-size="12" fill="#2e6b2e" font-weight="bold">011</text>
  <text x="310" y="250" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="360" y="250" font-size="10" fill="#555">bit1 再见 1 次</text>

  <!-- result -->
  <text x="65" y="282" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">结果</text>
  <text x="145" y="282" text-anchor="middle" font-size="11" fill="#3a5a2a">—</text>
  <text x="230" y="282" text-anchor="middle" font-size="12" fill="#2e6b2e" font-weight="bold">011 = 3</text>
  <text x="310" y="282" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="360" y="282" font-size="10.5" fill="#3a5a2a" font-weight="bold">落单数 = 3 ✓</text>

  <!-- footnote -->
  <text x="30" y="318" font-size="10" fill="#888">注：bit1 出现 4 次（2,2,3,2 中 2 的 bit1 三次 + 3 的 bit1 一次）→ 4 mod 3 = 1，留在 ones。</text>
</svg>
