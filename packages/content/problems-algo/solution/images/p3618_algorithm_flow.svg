<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：埃氏筛 → 单趟分桶 → 绝对差</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="52" rx="40" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 150 66 L 150 78" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 埃氏筛 -->
  <rect x="48" y="82" width="204" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 埃氏筛标记 isComposite[0..n−1]</text>
  <text x="150" y="111" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">合数从 i·i 开始划掉，i·i ≥ n 停</text>
  <path d="M 150 120 L 150 130" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="48" y="134" width="204" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② sumA = sumB = 0</text>
  <path d="M 150 158 L 150 168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 遍历 -->
  <rect x="48" y="172" width="204" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ for i = 0 .. n−1</text>
  <path d="M 150 196 L 150 208" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 菱形判定 -->
  <polygon points="150,210 242,258 150,306 58,258" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≥ 2 且</text>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">非合数 ?</text>

  <!-- 是 ↓ -->
  <path d="M 150 306 L 150 322" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="318" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ⑤ sumA -->
  <rect x="48" y="326" width="204" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="343" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑤ sumA += nums[i]</text>

  <!-- 否 → ⑥ sumB -->
  <path d="M 242 258 L 296 258" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="300" y="245" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑥ sumB += nums[i]</text>

  <!-- ⑥ → 回到 ⑤ 后继续循环 -->
  <path d="M 375 271 C 375 335, 300 339, 256 339" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 左侧回边到 ③ -->
  <path d="M 48 339 C 22 339, 22 184, 44 184" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="262" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 32 262)" filter="url(#rough2)">i++，下一轮</text>

  <!-- i = n 退出 -->
  <path d="M 252 184 C 292 184, 320 176, 354 172" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = n 结束</text>

  <!-- 输出 -->
  <rect x="358" y="156" width="142" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="429" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出 |sumA − sumB|</text>
</svg>
