<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：频次表本身即排序数组，一趟扫描得五大量
  </text>

  <!-- ===== 频次桶 ===== -->
  <text x="40" y="62" font-size="11.5" fill="#888" filter="url(#rough2)">count[256]：</text>

  <!-- 桶 0 (count=0) 灰 -->
  <rect x="90"  y="78" width="48" height="40" rx="4" fill="#f0f0f0"
        stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="114" y="98" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="114" y="132" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">idx 0</text>

  <!-- 桶 1 (count=1) 蓝 最小值 -->
  <rect x="148" y="78" width="48" height="40" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="172" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">idx 1</text>

  <!-- 桶 2 (count=3) 蓝 -->
  <rect x="206" y="78" width="48" height="40" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">idx 2</text>

  <!-- 桶 3 (count=4) 橙 众数+最大值 -->
  <rect x="264" y="78" width="48" height="40" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="288" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="288" y="132" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">idx 3</text>

  <!-- 省略号 -->
  <text x="340" y="98" font-size="14" fill="#aaa" filter="url(#rough2)">. . .</text>
  <text x="340" y="132" font-size="10" fill="#aaa" filter="url(#rough2)">idx 4~254</text>

  <!-- 桶 255 (count=0) 灰 -->
  <rect x="400" y="78" width="48" height="40" rx="4" fill="#f0f0f0"
        stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="424" y="98" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="424" y="132" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">idx 255</text>

  <!-- ===== 五大量结果框 ===== -->
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    一趟扫描 → 5 个统计量
  </text>

  <!-- minimum -->
  <rect x="30" y="172" width="96" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">minimum</text>
  <text x="78" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">首个非零桶</text>
  <path d="M 78 78 L 78 172" stroke="#446688" stroke-width="1.3" fill="none"
        stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- maximum -->
  <rect x="138" y="172" width="96" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="186" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">maximum</text>
  <text x="186" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">末个非零桶</text>

  <!-- mean -->
  <rect x="246" y="172" width="96" height="52" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mean</text>
  <text x="294" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Σ(i·cnt) / Σcnt</text>

  <!-- median -->
  <rect x="354" y="172" width="96" height="52" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="402" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">median</text>
  <text x="402" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">累加找第 k 位</text>

  <!-- mode -->
  <rect x="462" y="172" width="68" height="52" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">mode</text>
  <text x="496" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">argmax cnt</text>
  <path d="M 288 120 L 496 172" stroke="#d6a040" stroke-width="1.3" fill="none"
        stroke-dasharray="3,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== 关键洞察 ===== -->
  <rect x="40" y="250" width="480" height="70" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    count 天然有序：idx 升序 = 样本升序
  </text>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    无需展开数组（Σcnt 可达 10⁹），仅扫 256 桶 → O(1)
  </text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    中位数 = 累加 count 到第 ⌈N/2⌉ 位时的 idx
  </text>

  <!-- ===== 溢出提醒 ===== -->
  <rect x="40" y="340" width="480" height="50" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ 溢出陷阱：i·count[i] 可达 255×10⁹ ≈ 2.5×10¹¹
  </text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    C++ 用 long long，Python 天然大整数无虞
  </text>

  <!-- 底部标注 -->
  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">
    示例：count=[0,1,3,4,0,…] → 样本 [1,2,2,2,3,3,3,3]
  </text>
</svg>
