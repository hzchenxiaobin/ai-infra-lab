<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：枚举未用 nums2[j] 配到 nums1[i]，取最小</text>

  <!-- current state box -->
  <rect x="30" y="56" width="180" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">当前状态 dp[mask]</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#555">已分配集合 = mask</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#555">下一位置 i = popcount(mask)</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#555">配对基准 = nums1[i]</text>

  <!-- try j (valid, min update) -->
  <rect x="300" y="46" width="230" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选未用 nums2[j]：取更小 ✓</text>
  <text x="415" y="84" text-anchor="middle" font-size="11" fill="#555">dp[mask|1&lt;&lt;j] = min(旧, dp[mask]+nums1[i]^nums2[j])</text>

  <path d="M 210 90 L 296 70" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- try j2 (no improvement) -->
  <rect x="300" y="108" width="230" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">选另一个 nums2[j']：不更小 ✗</text>
  <text x="415" y="146" text-anchor="middle" font-size="11" fill="#999">dp[mask|1&lt;&lt;j'] 保持原值不变</text>

  <path d="M 210 112 L 296 132" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- cost formula box -->
  <rect x="30" y="170" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">转移代价 = nums1[i] XOR nums2[j]（异或后取值，无单调性）</text>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#555">遍历每个未用 j，累加代价后取 min → 每个状态只保留最优配对方案</text>

  <!-- base & answer -->
  <rect x="30" y="244" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始：dp[0] = 0</text>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#555">空配对代价为 0（未配任何元素）</text>

  <rect x="290" y="244" width="240" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案：dp[(1&lt;&lt;n) − 1]</text>
  <text x="410" y="288" text-anchor="middle" font-size="11" fill="#555">所有 n 位都为 1 = nums2 全部分配完</text>

  <!-- complexity footnote -->
  <rect x="30" y="322" width="500" height="44" fill="#fafafa" stroke="#888" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#666">状态 2ⁿ 个 × 每个枚举 n 个 j → O(n · 2ⁿ)，n ≤ 14 约 2.3×10⁵ 次</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#b85450">⚠️ XOR 无单调性，无法像 1874 那样排序贪心，只能状压 DP</text>
</svg>
