<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：stones = [0,1,3,5,6,8,12,17]</text>

  <!-- header row -->
  <rect x="40" y="50" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="120" y="70" font-size="12" fill="#333" font-weight="bold">pos</text>
  <text x="180" y="70" font-size="12" fill="#333" font-weight="bold">dp[i]（到达跳距）</text>
  <text x="350" y="70" font-size="12" fill="#333" font-weight="bold">来源</text>

  <!-- column dividers -->
  <path d="M 100 50 L 100 324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 160 50 L 160 324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 50 L 340 324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- outer border -->
  <rect x="40" y="50" width="540" height="274" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="60" y="100" font-size="12" fill="#333">0</text>
  <text x="120" y="100" font-size="12" fill="#333">0</text>
  <text x="180" y="100" font-size="12" fill="#333" font-weight="bold">{0}</text>
  <text x="350" y="100" font-size="11" fill="#888">起点</text>

  <!-- row 1 -->
  <text x="60" y="130" font-size="12" fill="#333">1</text>
  <text x="120" y="130" font-size="12" fill="#333">1</text>
  <text x="180" y="130" font-size="12" fill="#333" font-weight="bold">{1}</text>
  <text x="350" y="130" font-size="11" fill="#888">0: k=0 → step 1</text>

  <!-- row 2 -->
  <text x="60" y="160" font-size="12" fill="#333">2</text>
  <text x="120" y="160" font-size="12" fill="#333">3</text>
  <text x="180" y="160" font-size="12" fill="#333" font-weight="bold">{2}</text>
  <text x="350" y="160" font-size="11" fill="#888">1: k=1 → step 2</text>

  <!-- row 3 -->
  <text x="60" y="190" font-size="12" fill="#333">3</text>
  <text x="120" y="190" font-size="12" fill="#333">5</text>
  <text x="180" y="190" font-size="12" fill="#333" font-weight="bold">{2}</text>
  <text x="350" y="190" font-size="11" fill="#888">2: k=2 → step 2</text>

  <!-- row 4 -->
  <text x="60" y="220" font-size="12" fill="#333">4</text>
  <text x="120" y="220" font-size="12" fill="#333">6</text>
  <text x="180" y="220" font-size="12" fill="#333" font-weight="bold">{1, 3}</text>
  <text x="350" y="220" font-size="11" fill="#888">3: k=2→step1；2: k=2→step3</text>

  <!-- row 5 -->
  <text x="60" y="250" font-size="12" fill="#333">5</text>
  <text x="120" y="250" font-size="12" fill="#333">8</text>
  <text x="180" y="250" font-size="12" fill="#333" font-weight="bold">{2, 3}</text>
  <text x="350" y="250" font-size="11" fill="#888">3: k=2→step3；4: k=1→step2</text>

  <!-- row 6 -->
  <text x="60" y="280" font-size="12" fill="#333">6</text>
  <text x="120" y="280" font-size="12" fill="#333">12</text>
  <text x="180" y="280" font-size="12" fill="#333" font-weight="bold">{4}</text>
  <text x="350" y="280" font-size="11" fill="#888">5: k=3 → step 4</text>

  <!-- row 7 (answer) highlight -->
  <rect x="40" y="294" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="120" y="314" font-size="12" fill="#333" font-weight="bold">17</text>
  <text x="180" y="314" font-size="12" fill="#b85450" font-weight="bold">{5} ⭐</text>
  <text x="350" y="314" font-size="11" fill="#b85450">6: k=4 → step 5 → 到达终点！</text>

  <!-- bottom note -->
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#888">路径：0→1(1)→3(2)→5(2)→8(3)→12(4)→17(5)，跳距 1,2,2,3,4,5 每步 ±1 内</text>
</svg>
