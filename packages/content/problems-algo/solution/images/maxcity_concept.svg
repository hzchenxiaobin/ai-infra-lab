<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心把新站放在能覆盖城市 i 的最右位置</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">stations=[1,2,4,5,0], r=1, 初始电量 p=[3,7,11,9,5], 目标 P=5</text>

  <!-- ============ City row ============ -->
  <text x="36" y="78" font-size="12" fill="#333" font-weight="bold">城市</text>
  <!-- 5 cities, centers at x=110,190,270,350,430 -->
  <rect x="80" y="84" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#333">城市0</text>
  <text x="110" y="117" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">电量3</text>

  <rect x="160" y="84" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="11" fill="#333">城市1</text>
  <text x="190" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a">电量7</text>

  <rect x="240" y="84" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#333">城市2</text>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a">电量11</text>

  <rect x="320" y="84" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="11" fill="#333">城市3</text>
  <text x="350" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a">电量9</text>

  <rect x="400" y="84" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#333">城市4</text>
  <text x="430" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a">电量5</text>

  <!-- red mark under city 0 -->
  <text x="110" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 &lt; P=5 需补2</text>

  <!-- ============ Option A: place left (bad) ============ -->
  <text x="36" y="184" font-size="12" fill="#b85450" font-weight="bold">方案A</text>
  <text x="80" y="184" font-size="11" fill="#b85450">放城市0（偏左）覆盖 [0,1]</text>
  <!-- coverage bracket under cities 0-1 -->
  <path d="M 90 200 L 90 210 L 190 210 L 190 200" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="224" text-anchor="middle" font-size="10" fill="#b85450">覆盖城市0,1</text>
  <!-- station marker at city0 -->
  <circle cx="110" cy="196" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="240" text-anchor="middle" font-size="10" fill="#b85450">+2站</text>
  <text x="480" y="206" font-size="10" fill="#b85450">✗ 后续余量少</text>

  <!-- ============ Option B: place right (good) ============ -->
  <text x="36" y="276" font-size="12" fill="#4a7a3a" font-weight="bold">方案B</text>
  <text x="80" y="276" font-size="11" fill="#4a7a3a">放城市1（最右 j=min(i+r,n-1)）覆盖 [0,2]</text>
  <!-- coverage bracket under cities 0-2 -->
  <path d="M 90 292 L 90 302 L 270 302 L 270 292" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">覆盖城市0,1,2（多覆盖1座）</text>
  <!-- station marker at city1 -->
  <circle cx="190" cy="288" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">+2站</text>
  <text x="480" y="298" font-size="10" fill="#4a7a3a">✓ 后续余量大</text>

  <!-- arrow between A and B -->
  <path d="M 290 248 L 290 274" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="266" font-size="10" fill="#888">右移无损</text>

  <!-- ============ bottom key idea ============ -->
  <rect x="36" y="348" width="508" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：能覆盖城市 i 的新站可放 [i−r, i+r]，放最右 j=min(i+r,n−1)</text>
  <text x="290" y="384" text-anchor="middle" font-size="11" fill="#d6a040">覆盖集只增不减 ⇒ 贪心等价最优；区间加用差分 d 摊还为 O(1)</text>
</svg>
