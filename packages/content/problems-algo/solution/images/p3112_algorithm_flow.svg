<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：堆优化 Dijkstra + 双闸门松弛</text>

  <rect x="215" y="36" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 260 60 L 260 70" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="74" width="220" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无向边双向加入邻接表 g</text>

  <path d="M 260 104 L 260 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="118" width="240" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist 全置 INF；dist[0] = 0；push(0, 0)</text>

  <path d="M 260 152 L 260 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="190,196 260,168 330,196 260,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="11" fill="#8a6a1f" filter="url(#rough2)">堆空？</text>
  <text x="342" y="190" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">是</text>

  <path d="M 260 224 L 260 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="236" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="135" y="242" width="250" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出 (d, u)；若 d &gt; dist[u] 跳过（懒删除）</text>

  <path d="M 260 276 L 260 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="135" y="290" width="250" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举 g[u] 的邻边 (v, w)：nd = d + w</text>

  <path d="M 260 320 L 260 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="140,366 260,336 380,366 260,396" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">nd &lt; dist[v] 且</text>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">nd &lt; disappear[v] ?</text>

  <path d="M 260 396 L 260 408" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="406" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>

  <rect x="150" y="412" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="235" y="433" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">dist[v] = nd；push(nd, v)</text>

  <path d="M 150 429 L 60 429 L 60 196 L 186 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续处理堆</text>

  <path d="M 140 366 L 100 366 L 100 305 L 131 305" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="108" y="356" font-size="9.5" fill="#b85450" filter="url(#rough2)">否·下一条边</text>

  <path d="M 330 196 L 452 196 L 452 428 L 507 428" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="335" y="412" width="172" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="421" y="433" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">ans[i] = INF ? -1 : dist[i]</text>

  <path d="M 421 446 L 421 456" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="376" y="458" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="421" y="474" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">结束</text>
</svg>
