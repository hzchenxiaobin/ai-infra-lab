<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描维护前二大与最小值</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="52" rx="38" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 69 L 260 78" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="80" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max1 = max2 = −∞，min1 = +∞</text>
  <path d="M 260 106 L 260 114" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="190" y="116" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 260 142 L 260 150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：x > max1 ? -->
  <polygon points="260,150 330,174 260,198 186,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x &gt; max1 ?</text>

  <text x="340" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 330 174 L 356 174" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="161" width="142" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="429" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max2 = max1；max1 = x</text>

  <text x="172" y="168" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 186 174 L 160 174" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="18" y="161" width="142" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="89" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max2 = max(max2, x)</text>

  <!-- 汇合到 min 更新 -->
  <path d="M 429 187 L 429 231 L 341 231" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 89 187 L 89 231 L 179 231" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="181" y="218" width="158" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min1 = min(min1, x)</text>
  <path d="M 260 244 L 260 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：还有元素 ? -->
  <polygon points="260,252 335,276 260,300 185,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">还有元素 ?</text>

  <text x="420" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是（回到取元素）</text>
  <path d="M 335 276 L 506 276 L 506 129 L 334 129" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="268" y="310" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 300 L 260 312" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="140" y="314" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回 max1 + max2 − min1</text>

  <text x="16" y="356" font-size="9.5" fill="#999" filter="url(#rough2)">💡 排序版：sort 后返回 nums[n−1] + nums[n−2] − nums[0]，O(n log n)；相等值走 else 落进 max2，天然处理并列</text>
</svg>
