<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历累计 → 产出列/行 → 拼表输出</text>

  <!-- Step 1: 遍历订单 -->
  <rect x="70" y="50" width="400" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 遍历订单 orders[i] = [name, table, food]</text>
  <text x="270" y="90" text-anchor="middle" font-size="11" fill="#444">丢弃 name；table = stoi(o[1]) 转 int</text>
  <text x="270" y="104" text-anchor="middle" font-size="11" fill="#444">foodSet.insert(food); tableSet.insert(t); cnt[t][food]++</text>

  <path d="M 270 112 L 270 138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: 产出列 (foods) -->
  <rect x="70" y="142" width="190" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 产出列 foods</text>
  <text x="165" y="182" text-anchor="middle" font-size="10" fill="#444">遍历 set&lt;string&gt; foodSet</text>
  <text x="165" y="196" text-anchor="middle" font-size="10" fill="#444">→ 字典序餐品列表</text>

  <!-- Step 3: 产出行 (tables) -->
  <rect x="280" y="142" width="190" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 产出行 tables</text>
  <text x="375" y="182" text-anchor="middle" font-size="10" fill="#444">遍历 set&lt;int&gt; tableSet</text>
  <text x="375" y="196" text-anchor="middle" font-size="10" fill="#444">→ 数值序桌号列表</text>

  <path d="M 165 202 L 165 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 375 202 L 375 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: 拼表头 -->
  <rect x="70" y="232" width="400" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④ 拼表头 header</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#444">["Table"] + foods → ans[0]</text>

  <path d="M 270 284 L 270 310" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5: 拼数据行 (loop) -->
  <rect x="70" y="314" width="400" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ 对每个桌号 t ∈ tables 拼数据行</text>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#444">row = [to_string(t)]</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#444">for f ∈ foods: row.push_back(to_string(cnt[t][f]))</text>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#b85450">缺失餐品 find == end() → 补 "0"</text>

  <path d="M 270 390 L 270 416" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 6: 返回 -->
  <rect x="70" y="420" width="400" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">⑥ 返回 ans（表头 + 各桌数据行）</text>

  <!-- loop back arrow from step5 to itself indicator -->
  <path d="M 470 351 Q 496 351 496 328" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="500" y="340" text-anchor="middle" font-size="9" fill="#b85450" transform="rotate(90 500 340)">每桌</text>

  <!-- bottom note -->
  <rect x="40" y="490" width="460" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="510" text-anchor="middle" font-size="11" fill="#444">三阶段解耦：① 累计计数 O(n) → ②③ 产出有序列/行 O(f log f + m log m)</text>
  <text x="270" y="528" text-anchor="middle" font-size="11" fill="#444">→ ④⑤ 拼表 O(m·f)（输出规模下界）</text>
</svg>
