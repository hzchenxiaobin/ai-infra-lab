<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">LFU 缓存：频率桶 + 哈希表</text>
  <path d="M 280 40 Q 450 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Hash table -->
  <text x="110" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">哈希表 (O(1) 定位)</text>
  <g filter="url(#sk)">
    <rect x="40" y="84" width="150" height="200" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="58" y="106" font-size="11" fill="#444">key</text>
  <text x="160" y="106" font-size="11" fill="#444">→ node*</text>
  <line x1="50" y1="112" x2="180" y2="112" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="58" y="132" font-size="11" fill="#444">1</text>
  <text x="160" y="132" font-size="11" fill="#2e6e2e">→ A</text>
  <text x="58" y="156" font-size="11" fill="#444">2</text>
  <text x="160" y="156" font-size="11" fill="#2e6e2e">→ B</text>
  <text x="58" y="180" font-size="11" fill="#444">3</text>
  <text x="160" y="180" font-size="11" fill="#2e6e2e">→ C</text>
  <text x="58" y="204" font-size="11" fill="#444">4</text>
  <text x="160" y="204" font-size="11" fill="#2e6e2e">→ D</text>
  <text x="58" y="246" font-size="10" fill="#888">node 记录 freq</text>
  <text x="58" y="262" font-size="10" fill="#888">与所在桶位置</text>

  <!-- min_freq indicator -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="150" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="115" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">min_freq</text>
  <text x="115" y="340" text-anchor="middle" font-size="11" fill="#b85450">= 当前最小频率</text>

  <!-- Frequency buckets -->
  <text x="560" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">频率桶 freq → 双向链表 (同频内 LRU)</text>

  <!-- freq=1 bucket -->
  <text x="250" y="118" font-size="12" font-weight="bold" fill="#b85450">freq=1</text>
  <g filter="url(#sk)">
    <rect x="300" y="104" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="318" y="126" text-anchor="middle" font-size="11" fill="#888">H</text>
  <g filter="url(#sk)">
    <rect x="360" y="102" width="80" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="400" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">D(k=4)</text>
  <text x="400" y="133" text-anchor="middle" font-size="9" fill="#888">最近←</text>
  <g filter="url(#sk)">
    <rect x="470" y="104" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="488" y="126" text-anchor="middle" font-size="11" fill="#888">T</text>
  <path d="M 336 121 L 358 121" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 121 L 468 121" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="540" y="124" font-size="10" fill="#b85450">← 淘汰端(T 前)</text>

  <!-- min_freq arrow to freq=1 -->
  <path d="M 190 318 Q 240 280 250 130" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- freq=2 bucket -->
  <text x="250" y="190" font-size="12" font-weight="bold" fill="#d6a040">freq=2</text>
  <g filter="url(#sk)">
    <rect x="300" y="176" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="318" y="198" text-anchor="middle" font-size="11" fill="#888">H</text>
  <g filter="url(#sk)">
    <rect x="360" y="174" width="80" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="400" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">C(k=3)</text>
  <text x="400" y="205" text-anchor="middle" font-size="9" fill="#888">最近←</text>
  <g filter="url(#sk)">
    <rect x="470" y="176" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="488" y="198" text-anchor="middle" font-size="11" fill="#888">T</text>
  <path d="M 336 193 L 358 193" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 193 L 468 193" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- freq=3 bucket -->
  <text x="250" y="262" font-size="12" font-weight="bold" fill="#4a8e4a">freq=3</text>
  <g filter="url(#sk)">
    <rect x="300" y="248" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="318" y="270" text-anchor="middle" font-size="11" fill="#888">H</text>
  <g filter="url(#sk)">
    <rect x="360" y="246" width="80" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="400" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">A(k=1)</text>
  <text x="400" y="277" text-anchor="middle" font-size="9" fill="#888">最近←</text>
  <g filter="url(#sk)">
    <rect x="470" y="248" width="36" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="510" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">B(k=2)</text>
  <text x="510" y="277" text-anchor="middle" font-size="9" fill="#888">←最久</text>
  <g filter="url(#sk)">
    <rect x="570" y="248" width="36" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="588" y="270" text-anchor="middle" font-size="11" fill="#888">T</text>
  <path d="M 336 265 L 358 265" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 265 L 468 265" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 506 265 L 568 265" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- hash -> node pointers -->
  <path d="M 190 128 Q 240 100 360 250" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 152 Q 230 110 480 250" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 176 Q 240 150 360 178" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 200 Q 230 160 360 106" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- freq=3 bucket label for evict note -->
  <text x="640" y="262" font-size="10" fill="#888">同频内 T 前 = 最久未用</text>

  <!-- operations summary -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="820" height="86" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="384" font-size="13" font-weight="bold" fill="#444">操作要点：</text>
  <text x="60" y="406" font-size="11" fill="#2e6e2e" font-weight="bold">访问(get/put命中)：</text>
  <text x="200" y="406" font-size="11" fill="#444">从 freq 桶摘除 → freq+1 → 插入新桶 head；旧桶空且 freq==min_freq 则 min_freq++</text>
  <text x="60" y="428" font-size="11" fill="#b85450" font-weight="bold">淘汰(put 满新建)：</text>
  <text x="200" y="428" font-size="11" fill="#444">删 min_freq 桶的 tail 前节点(同频最久) → 新节点入 freq=1 桶 head → min_freq=1</text>
</svg>
