<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：构造 → 排序 → 首尾配对</text>

  <!-- 左列：构造阶段 -->
  <rect x="84" y="30" width="112" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="46" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：mx = 0</text>

  <path d="M 140 54 L 140 62" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="66" width="164" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">mx = max(mx, nums[i])</text>
  <text x="140" y="91" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">（先更新！mx 含 nums[i] 自己）</text>

  <path d="M 140 96 L 140 104" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="108" width="164" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="125" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">g[i] = gcd(nums[i], mx)</text>

  <path d="M 140 134 L 140 142" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="140,148 202,174 140,200 78,174" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="178" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">还有元素?</text>

  <path d="M 78 174 L 40 174 L 40 81 L 54 81" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 202 174 L 230 174 L 230 79 L 286 79" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 左列下方注释 -->
  <rect x="58" y="232" width="164" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="250" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">奇数长度：l == r 停止</text>
  <text x="140" y="264" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">中间元素落单忽略</text>
  <text x="140" y="278" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">n = 1 直接返回 0</text>

  <rect x="58" y="298" width="164" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠ 上界 5×10¹³</text>
  <text x="140" y="323" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">ans 必须 long long</text>

  <!-- 右列：配对阶段 -->
  <rect x="290" y="66" width="170" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="83" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">sort(g)：非递减排序</text>

  <path d="M 375 92 L 375 100" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="290" y="102" width="170" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="119" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">l = 0, r = n−1, ans = 0</text>

  <path d="M 375 128 L 375 136" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="375,142 443,168 375,194 307,168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="172" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">l &lt; r ?</text>

  <path d="M 375 194 L 375 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="203" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="290" y="206" width="170" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="220" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += gcd(g[l], g[r])</text>
  <text x="375" y="233" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">l++; r−−</text>

  <path d="M 290 222 L 262 222 L 262 168 L 303 168" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="250" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">循环</text>

  <path d="M 443 168 L 474 168 L 474 310 L 444 310" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="456" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="316" y="298" width="128" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="314" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（long long）</text>
</svg>
