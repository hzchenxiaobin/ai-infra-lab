<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">核心观察：目标 t = 原始 s 的反转，是「固定靶子」</text>

  <!-- 行 s -->
  <text x="80" y="94" text-anchor="end" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">s =</text>
  <rect x="90" y="70" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="70" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="70" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="70" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="113" y="94">1</text>
    <text x="165" y="94">0</text>
    <text x="217" y="94">1</text>
    <text x="269" y="94">0</text>
  </g>

  <!-- 逐位比较：全部 ≠ -->
  <g filter="url(#rough2)" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="113" y="136">≠</text>
    <text x="165" y="136">≠</text>
    <text x="217" y="136">≠</text>
    <text x="269" y="136">≠</text>
  </g>

  <!-- 行 t -->
  <text x="80" y="174" text-anchor="end" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">t = rev(s)</text>
  <rect x="90" y="150" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="150" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="150" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="150" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="113" y="174">0</text>
    <text x="165" y="174">1</text>
    <text x="217" y="174">0</text>
    <text x="269" y="174">1</text>
  </g>

  <!-- 失配对括号：对 (0,3) -->
  <path d="M 113 194 L 113 203 L 269 203 L 269 194" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="191" y="221" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">失配对 (0,3) ⇒ +2</text>

  <!-- 失配对括号：对 (1,2) -->
  <path d="M 165 230 L 165 239 L 217 239 L 217 230" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="191" y="257" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">失配对 (1,2) ⇒ +2</text>

  <!-- 底部结论 -->
  <rect x="48" y="282" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="238" y="303" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2 × 失配对数 = 2 + 2 = 4</text>
  <text x="238" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇数长度时中间位与自己比较，永远免费</text>

  <!-- 右侧审题陷阱 -->
  <rect x="312" y="64" width="184" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#b85450" text-anchor="middle">
    <text x="404" y="88" font-size="12.5" font-weight="bold">⚠️ 审题陷阱</text>
    <text x="404" y="110">「等于其原始形式的反转」</text>
    <text x="404" y="126">= 固定靶，翻转不改变它</text>
    <text x="404" y="150">若看成回文化：</text>
    <text x="404" y="166">每对失配只 +1</text>
    <text x="404" y="182">→ "1010" 得 2 ✗</text>
    <text x="404" y="206">本题固定靶：</text>
    <text x="404" y="222">每对失配 +2</text>
    <text x="404" y="238">→ "1010" 得 4 ✓</text>
    <text x="404" y="256" font-size="10">答案 = Hamming(s, rev(s))</text>
  </g>
</svg>
