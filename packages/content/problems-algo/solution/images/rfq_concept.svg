<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：值 → 有序下标列表 + 二分
  </text>

  <!-- 数组 arr -->
  <text x="40" y="62" font-size="12" fill="#666" filter="url(#rough2)">arr (下标 →)</text>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <!-- 下标 -->
    <text x="62" y="78" text-anchor="middle">0</text>
    <text x="94" y="78" text-anchor="middle">1</text>
    <text x="126" y="78" text-anchor="middle">2</text>
    <text x="158" y="78" text-anchor="middle">3</text>
    <text x="190" y="78" text-anchor="middle">4</text>
    <text x="222" y="78" text-anchor="middle">5</text>
    <text x="254" y="78" text-anchor="middle">6</text>
    <text x="286" y="78" text-anchor="middle">7</text>
    <text x="318" y="78" text-anchor="middle">8</text>
    <text x="350" y="78" text-anchor="middle">9</text>
    <text x="382" y="78" text-anchor="middle">10</text>
    <text x="414" y="78" text-anchor="middle">11</text>
    <!-- 格子 -->
    <rect x="48" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="80" y="84" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="112" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="144" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="176" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="208" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="240" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="272" y="84" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="304" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="336" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="368" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="400" y="84" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <!-- 值 -->
    <text x="62" y="101" text-anchor="middle">12</text>
    <text x="94" y="101" text-anchor="middle" fill="#b85450" font-weight="bold">33</text>
    <text x="126" y="101" text-anchor="middle">4</text>
    <text x="158" y="101" text-anchor="middle">56</text>
    <text x="190" y="101" text-anchor="middle">22</text>
    <text x="222" y="101" text-anchor="middle">2</text>
    <text x="254" y="101" text-anchor="middle">34</text>
    <text x="286" y="101" text-anchor="middle" fill="#b85450" font-weight="bold">33</text>
    <text x="318" y="101" text-anchor="middle">22</text>
    <text x="350" y="101" text-anchor="middle">12</text>
    <text x="382" y="101" text-anchor="middle">34</text>
    <text x="414" y="101" text-anchor="middle">56</text>
  </g>

  <!-- 箭头：两个 33 指向下方哈希表 -->
  <path d="M94,112 Q140,150 200,168" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M286,112 Q260,150 220,168" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 哈希表 -->
  <text x="40" y="178" font-size="12" fill="#666" filter="url(#rough2)">HashMap</text>
  <rect x="150" y="160" width="220" height="118" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">value → 有序下标列表</text>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="166" y="198">33</text>
    <rect x="190" y="188" width="20" height="18" fill="#fff8e1" stroke="#d6a040" rx="3"/>
    <text x="200" y="201" text-anchor="middle">1</text>
    <rect x="212" y="188" width="20" height="18" fill="#fff8e1" stroke="#d6a040" rx="3"/>
    <text x="222" y="201" text-anchor="middle">7</text>

    <text x="166" y="226">4</text>
    <rect x="190" y="216" width="20" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <text x="200" y="229" text-anchor="middle">2</text>

    <text x="166" y="254">22</text>
    <rect x="190" y="244" width="20" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <text x="200" y="257" text-anchor="middle">4</text>
    <rect x="212" y="244" width="20" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <text x="222" y="257" text-anchor="middle">8</text>

    <text x="262" y="226">...</text>
  </g>

  <!-- 查询框 -->
  <rect x="380" y="160" width="160" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">query(0, 11, 33)</text>
  <text x="392" y="200" font-size="11" fill="#333" filter="url(#rough2)">在 [1, 7] 中找：</text>
  <text x="392" y="218" font-size="11" fill="#333" filter="url(#rough2)">lo = ≥0 的首个 → 1</text>
  <text x="392" y="236" font-size="11" fill="#333" filter="url(#rough2)">hi = &gt;11 的首个 → 末尾</text>

  <!-- 二分箭头 -->
  <path d="M232,197 L386,206" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 答案 -->
  <rect x="380" y="262" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">count = hi − lo</text>
  <text x="460" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2 − 0 = 2 ✅</text>

  <!-- 底部说明 -->
  <rect x="40" y="320" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="12" fill="#333" filter="url(#rough2)">
    构造时一次遍历，每个 value 收集出现下标——天然升序，无需排序。
  </text>
  <text x="56" y="360" font-size="12" fill="#333" filter="url(#rough2)">
    查询时 lower_bound(left) 与 upper_bound(right) 两次二分，计数 = 两下标之差，O(log n)。
  </text>
</svg>
