<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：哈希集合把存在性查询降到 O(1)，倍增链至多 O(log V)</text>

  <!-- ====== Left: nums array → hash set ====== -->
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">① 建哈希集合（O(n) 一次）</text>

  <!-- nums array -->
  <text x="40" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="70" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="92" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="106" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="124" y="92" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="142" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="178" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="92" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="214" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="92" text-anchor="middle" font-size="13" fill="#333">12</text>

  <!-- arrow down to set -->
  <path d="M 142 108 L 142 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="122" font-size="9" fill="#446688">→ 放入集合</text>

  <!-- hash set (drawn as rounded box with elements) -->
  <rect x="56" y="128" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="64" y="122" font-size="10" fill="#4a7a3a" font-weight="bold">set:</text>
  <text x="156" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">{ 1, 3, 5, 6, 12 }</text>

  <!-- note about O(1) lookup -->
  <rect x="56" y="180" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="156" y="199" text-anchor="middle" font-size="10" fill="#d6a040">每次查询 original 是否存在 → O(1)</text>

  <!-- divider -->
  <path d="M 290 50 L 290 400" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Right: doubling chain ====== -->
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">② 倍增链：反复 ×2 查集合</text>

  <!-- original = 3 -->
  <rect x="380" y="76" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="362" y="98" text-anchor="middle" font-size="9" fill="#888">original</text>
  <text x="410" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">在集合中 ✅</text>

  <!-- arrow -->
  <path d="M 410 114 L 410 132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>

  <!-- original = 6 -->
  <rect x="380" y="138" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="410" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">在集合中 ✅</text>

  <!-- arrow -->
  <path d="M 410 176 L 410 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="190" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>

  <!-- original = 12 -->
  <rect x="380" y="200" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12</text>
  <text x="410" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">在集合中 ✅</text>

  <!-- arrow -->
  <path d="M 410 238 L 410 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>

  <!-- original = 24 -->
  <rect x="380" y="262" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">24</text>
  <text x="410" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">不在集合中 ❌</text>

  <!-- arrow to result -->
  <path d="M 410 300 L 410 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="314" font-size="10" fill="#b85450" font-weight="bold">停止</text>

  <!-- result -->
  <rect x="350" y="322" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="344" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 24 ✓</text>

  <!-- ====== Bottom: key insight summary ====== -->
  <path d="M 30 382 L 530 382" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="56" y="390" width="448" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#d6a040">倍增次数 k ≤ ⌈log₂(max(nums) / original)⌉ + 1 ≤ ⌈log₂ 1000⌉ ≈ 10，故总 O(n + k) = O(n)</text>
</svg>
