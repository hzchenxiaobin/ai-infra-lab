<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root1=[2,1,4], root2=[1,0,3], target=5</text>

  <!-- ===== root1 静态 ===== -->
  <text x="100" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root1（阶段一建表）</text>
  <circle cx="100" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="91" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <circle cx="62" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="88" y1="99" x2="72" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="142" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="114" y1="99" x2="132" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- ===== root2 静态 ===== -->
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">root2（阶段二查补数）</text>
  <circle cx="260" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="91" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <circle cx="222" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <line x1="248" y1="99" x2="232" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="302" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="302" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="274" y1="99" x2="292" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 高亮 root2 节点 1（命中点） -->
  <circle cx="260" cy="86" r="18" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <!-- 高亮 root1 节点 4（补数） -->
  <circle cx="142" cy="142" r="17" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== 步骤表格 ===== -->
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">逐步演算</text>

  <!-- 表头 -->
  <rect x="370" y="68" width="250" height="26" fill="#e8f0ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">步</text>
  <text x="420" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">树</text>
  <text x="458" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">v</text>
  <text x="520" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">操作 / 查询</text>

  <!-- 阶段一分隔 -->
  <rect x="370" y="96" width="250" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="495" y="109" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">— 阶段一：遍历 root1 建表 —</text>

  <!-- 步骤 1 -->
  <rect x="370" y="116" width="250" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="388" y="131" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="420" y="131" text-anchor="middle" font-size="10" fill="#446688">root1</text>
  <text x="458" y="131" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="520" y="131" text-anchor="middle" font-size="10" fill="#4a7a3a">add → {2}</text>

  <!-- 步骤 2 -->
  <rect x="370" y="140" width="250" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="388" y="155" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="420" y="155" text-anchor="middle" font-size="10" fill="#446688">root1</text>
  <text x="458" y="155" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="520" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a">add → {2,1}</text>

  <!-- 步骤 3 -->
  <rect x="370" y="164" width="250" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="388" y="179" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="420" y="179" text-anchor="middle" font-size="10" fill="#446688">root1</text>
  <text x="458" y="179" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="520" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a">add → {2,1,4}</text>

  <!-- 阶段二分隔 -->
  <rect x="370" y="188" width="250" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="495" y="201" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">— 阶段二：遍历 root2 查补数 —</text>

  <!-- 步骤 4: 命中 -->
  <rect x="370" y="208" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="420" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">root2</text>
  <text x="458" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="520" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5−1=4 ∈集合 ✓</text>

  <!-- 步骤 5: 不会执行（命中即返回） -->
  <rect x="370" y="232" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="388" y="247" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="420" y="247" text-anchor="middle" font-size="10" fill="#999">root2</text>
  <text x="458" y="247" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="520" y="247" text-anchor="middle" font-size="10" fill="#999">— 跳过（已返回）</text>

  <!-- 说明 -->
  <rect x="40" y="280" width="560" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="12" fill="#555" font-weight="bold">关键观察：</text>
  <text x="60" y="324" font-size="11" fill="#555">• 步骤 4：访问 root2 的节点 1，查补数 5−1=4，4 ∈ {2,1,4} 命中 → 1(root2) + 4(root1) = 5。</text>
  <text x="60" y="342" font-size="11" fill="#555">• 注意 2(root1) + 3(root2) = 5 也是合法对，但哈希法在访问 1 时就先命中了 4。</text>
  <text x="60" y="360" font-size="11" fill="#555">• 命中即返回 true，root2 剩余节点（0、3）不再访问 —— 早停优化。</text>
  <text x="60" y="378" font-size="11" fill="#555">• 若 target=10：root2 全遍历后 9/10/7 均不在 {2,1,4}，返回 false。</text>

  <!-- 复杂度 -->
  <rect x="40" y="416" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段一 O(n) 建表 + 阶段二 O(m) 查补数 = 总 O(n+m)｜空间 O(n)（存较小树更省）</text>
</svg>
