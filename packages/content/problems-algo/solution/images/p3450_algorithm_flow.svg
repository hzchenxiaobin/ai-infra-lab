<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历投桶，再取桶大小最大值</text>

  <!-- 步骤1：初始化 -->
  <rect x="150" y="42" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">初始化 d：bench_id → 学号集合</text>
  <path d="M 260 74 L 260 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：取记录 -->
  <rect x="150" y="88" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一条记录 [sid, bid]</text>
  <path d="M 260 120 L 260 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：还有记录？ -->
  <polygon points="260,140 380,182 260,224 140,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">还有记录？</text>

  <text x="390" y="176" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 380 182 L 398 182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 投桶操作 -->
  <rect x="400" y="160" width="112" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d[bid].add(sid)</text>
  <text x="456" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">set 判重 · 均摊 O(1)</text>

  <!-- 回到取记录 -->
  <path d="M 456 158 L 456 106 L 374 106" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="130" font-size="10.5" fill="#446688" filter="url(#rough2)">下一轮</text>

  <text x="272" y="244" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 224 L 260 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4：取最值 -->
  <rect x="140" y="250" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">遍历 d 各桶：ans = max(ans, |桶|)</text>
  <path d="M 260 282 L 260 298" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="260" cy="326" rx="140" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 ans（空输入时为 0）</text>

  <!-- 右上提示 -->
  <rect x="388" y="40" width="124" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">💡 add 幂等：</text>
  <text x="450" y="82" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">重复登记自动去重</text>
</svg>
