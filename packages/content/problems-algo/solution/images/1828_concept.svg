<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：比较平方距离 d² ≤ r²，避免开方</text>

  <!-- Left side: coordinate plane with circle -->
  <!-- Light grid lines -->
  <g stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="30" y1="80" x2="30" y2="350"/>
    <line x1="60" y1="80" x2="60" y2="350"/>
    <line x1="90" y1="80" x2="90" y2="350"/>
    <line x1="120" y1="80" x2="120" y2="350"/>
    <line x1="150" y1="80" x2="150" y2="350"/>
    <line x1="180" y1="80" x2="180" y2="350"/>
    <line x1="210" y1="80" x2="210" y2="350"/>
    <line x1="240" y1="80" x2="240" y2="350"/>
    <line x1="270" y1="80" x2="270" y2="350"/>
    <line x1="300" y1="80" x2="300" y2="350"/>
    <line x1="330" y1="80" x2="330" y2="350"/>
    <line x1="30" y1="80" x2="330" y2="80"/>
    <line x1="30" y1="110" x2="330" y2="110"/>
    <line x1="30" y1="140" x2="330" y2="140"/>
    <line x1="30" y1="170" x2="330" y2="170"/>
    <line x1="30" y1="200" x2="330" y2="200"/>
    <line x1="30" y1="230" x2="330" y2="230"/>
    <line x1="30" y1="260" x2="330" y2="260"/>
    <line x1="30" y1="290" x2="330" y2="290"/>
    <line x1="30" y1="320" x2="330" y2="320"/>
    <line x1="30" y1="350" x2="330" y2="350"/>
  </g>

  <!-- Circle -->
  <circle cx="180" cy="220" r="75" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Radius line -->
  <line x1="180" y1="220" x2="255" y2="220" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="217" y="237" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r</text>

  <!-- Center C -->
  <circle cx="180" cy="220" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="180" y="245" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">C(xj, yj)</text>

  <!-- P1 inside (green) -->
  <line x1="180" y1="220" x2="155" y2="200" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="155" cy="200" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="148" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">P₁ ✓</text>
  <text x="155" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a">d² &lt; r²</text>

  <!-- P2 on boundary (orange) -->
  <line x1="180" y1="220" x2="180" y2="145" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="180" cy="145" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="173" y="137" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">P₂ ✓</text>
  <text x="180" y="130" text-anchor="middle" font-size="9" fill="#d6a040">d² = r²</text>

  <!-- P3 outside (red) -->
  <line x1="180" y1="220" x2="290" y2="200" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="290" cy="200" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="297" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">P₃ ✗</text>
  <text x="290" y="185" text-anchor="middle" font-size="9" fill="#b85450">d² &gt; r²</text>

  <!-- Right side: formula and insight -->

  <!-- Formula box -->
  <rect x="360" y="58" width="220" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">平方距离判定</text>
  <text x="470" y="103" text-anchor="middle" font-size="12" fill="#333">d² = (px−xj)² + (py−yj)²</text>
  <text x="470" y="124" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">d² ≤ r²  →  点在圆内</text>

  <!-- Insight box (green) -->
  <rect x="360" y="152" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">为什么不用 sqrt？</text>
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#555">✓ 全程整数运算</text>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#555">✓ 无浮点精度误差</text>
  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#555">✓ 边界点 d²=r² 包含</text>
  <text x="470" y="246" text-anchor="middle" font-size="10" fill="#888">O(1) 判定，无函数调用开销</text>

  <!-- Contrast box (red/pink) -->
  <rect x="360" y="266" width="220" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sqrt 方案的问题</text>
  <text x="470" y="308" text-anchor="middle" font-size="11" fill="#555">✗ sqrt(d) ≤ r 有浮点误差</text>
  <text x="470" y="326" text-anchor="middle" font-size="11" fill="#555">✗ 整数 → 浮点 → 比较</text>
  <text x="470" y="338" text-anchor="middle" font-size="9" fill="#888">边界点可能被误判</text>

  <!-- Bottom note -->
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#888">点在圆内 ⟺ 到圆心的距离 ≤ 半径 ⟺ 平方距离 ≤ 半径平方</text>
</svg>
