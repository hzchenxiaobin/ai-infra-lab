<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，逐元素取余、累加代价</text>

  <!-- 开始 -->
  <rect x="215" y="34" width="90" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 62 L 260 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 取下一个元素 -->
  <rect x="175" y="82" width="170" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 260 116 L 260 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 取余 -->
  <rect x="175" y="136" width="170" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r ← x mod 3</text>
  <path d="M 260 170 L 260 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形 r=0? -->
  <polygon points="260,190 340,224 260,258 180,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">r = 0 ?</text>

  <!-- 是：代价 0 -->
  <path d="M 180 224 L 162 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="170" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="48" y="206" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="103" y="228" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">代价 0（不动）</text>

  <!-- 否：代价 min(r,3-r) -->
  <path d="M 340 224 L 358 224" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="349" y="215" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <rect x="362" y="206" width="128" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">代价 = min(r, 3 − r)</text>
  <text x="426" y="235" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">恒等于 1</text>

  <!-- 汇合到 ans -->
  <path d="M 103 242 C 103 268, 180 266, 228 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 426 242 C 426 268, 340 266, 292 282" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="175" y="286" width="170" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += 代价</text>
  <path d="M 260 320 L 260 336" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形 取完? -->
  <polygon points="260,340 340,374 260,408 180,374" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">元素取完 ?</text>

  <!-- 是：返回 -->
  <path d="M 340 374 L 370 374" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="354" y="365" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="374" y="357" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="378" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="429" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">= 非整除元素的个数</text>

  <!-- 否：回环 -->
  <path d="M 260 408 L 260 428 L 30 428 L 30 99 L 171 99" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="150" y="421" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否：继续取下一个</text>
</svg>
