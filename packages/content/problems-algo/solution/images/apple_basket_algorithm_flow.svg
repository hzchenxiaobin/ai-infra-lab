<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 逐个累加 → 超限即停</text>

  <!-- Step 1: sort -->
  <rect x="60" y="56" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">① 将 weight 升序排序</text>
  <text x="150" y="88" text-anchor="middle" font-size="10" fill="#666">sort(weight.begin(), weight.end())</text>

  <!-- arrow down -->
  <path d="M 150 100 L 150 118" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="60" y="122" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="140" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">② 初始化</text>
  <text x="150" y="154" text-anchor="middle" font-size="10" fill="#666">total = 0, count = 0</text>

  <!-- arrow down -->
  <path d="M 150 166 L 150 184" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop decision diamond -->
  <polygon points="150,188 250,228 150,268 50,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">遍历每个 apple</text>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#a67830">total + w ≤ 5000?</text>

  <!-- Yes branch: right -->
  <path d="M 250 228 L 320 228" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="322" y="206" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="224" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">放入篮子</text>
  <text x="417" y="240" text-anchor="middle" font-size="10" fill="#3a5a2a">total += w; count++</text>

  <!-- loop back up from yes -->
  <path d="M 417 206 L 417 140 L 250 140" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">下一个苹果</text>

  <!-- No branch: down -->
  <path d="M 150 268 L 150 296" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="168" y="288" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="60" y="300" width="180" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="318" text-anchor="middle" font-size="12" fill="#883a38" font-weight="bold">③ 超出容量，停止</text>
  <text x="150" y="332" text-anchor="middle" font-size="10" fill="#883a38">break</text>

  <!-- arrow to return -->
  <path d="M 150 344 L 150 362" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="60" y="366" width="180" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="385" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">返回 count</text>

  <!-- note box on right -->
  <rect x="322" y="300" width="190" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="320" font-size="10" fill="#555">💡 贪心正确性：</text>
  <text x="338" y="336" font-size="10" fill="#555">排序后前 k 个轻苹果</text>
  <text x="338" y="350" font-size="10" fill="#555">是所有 k 元素子集中</text>
  <text x="338" y="364" font-size="10" fill="#555">总重量最小的 → 最优</text>
</svg>
