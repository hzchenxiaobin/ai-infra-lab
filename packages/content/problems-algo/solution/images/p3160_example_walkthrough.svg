<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：limit = 4，queries = [[1,4],[2,5],[1,3],[3,4]]</text>

  <text x="82" y="46" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="160" y="46" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">ball2color</text>
  <text x="300" y="46" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">color2cnt</text>
  <text x="444" y="46" text-anchor="middle" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">答案</text>

  <rect x="30" y="54" width="460" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="80" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="82" y="84" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[1,4]</text>
  <text x="160" y="84" font-size="11.5" fill="#446688" filter="url(#rough2)">{1:4}</text>
  <text x="300" y="84" font-size="11.5" fill="#446688" filter="url(#rough2)">{4:1}</text>
  <rect x="424" y="66" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="444" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="82" y="106" font-size="10" fill="#888" filter="url(#rough2)">球1 新染 4：新颜色 +1</text>

  <rect x="30" y="124" width="460" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="82" y="154" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[2,5]</text>
  <text x="160" y="154" font-size="11.5" fill="#446688" filter="url(#rough2)">{1:4, 2:5}</text>
  <text x="300" y="154" font-size="11.5" fill="#446688" filter="url(#rough2)">{4:1, 5:1}</text>
  <rect x="424" y="136" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="444" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="82" y="176" font-size="10" fill="#888" filter="url(#rough2)">球2 新染 5：新颜色 +1</text>

  <rect x="30" y="194" width="460" height="62" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="220" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="82" y="224" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[1,3]</text>
  <text x="160" y="224" font-size="11.5" fill="#446688" filter="url(#rough2)">{1:3, 2:5}</text>
  <text x="300" y="224" font-size="11.5" fill="#446688" filter="url(#rough2)">{3:1, 5:1}</text>
  <rect x="424" y="206" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="444" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="82" y="246" font-size="10" fill="#b85450" filter="url(#rough2)">球1 重染 3：颜色 4 归零 → 删键！一减一增，答案不变</text>

  <rect x="30" y="264" width="460" height="62" fill="#ffffff" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="290" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="294" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="82" y="294" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[3,4]</text>
  <text x="160" y="294" font-size="11.5" fill="#446688" filter="url(#rough2)">{1:3, 2:5, 3:4}</text>
  <text x="300" y="294" font-size="11.5" fill="#446688" filter="url(#rough2)">{3:1, 5:1, 4:1}</text>
  <rect x="424" y="276" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="444" y="295" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="82" y="316" font-size="10" fill="#8a6d3b" filter="url(#rough2)">球3 新染 4：颜色 4 复活 → +1</text>

  <rect x="30" y="342" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠️ 坑点在步骤 3：若只减计数不删键，len 会把已消失的颜色 4 也数进去</text>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">→ 错输出 3；「归零即删」保住 len = 现存颜色数 的不变式</text>
</svg>
