<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 8，逐位 DP 填表</text>

  <!-- ===== Table ===== -->
  <!-- column x centers: i=60, binary=140, i>>1=220, i&1=280, ans[i>>1]=360, ans[i]=460 -->
  <!-- column boundaries: 30 / 90 / 190 / 250 / 310 / 410 / 510 -->

  <!-- header background -->
  <rect x="30" y="40" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="140" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">binary</text>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i&gt;&gt;1</text>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i&amp;1</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans[i&gt;&gt;1]</text>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[i]</text>

  <!-- vertical separators -->
  <line x1="90"  y1="40" x2="90"  y2="398" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="190" y1="40" x2="190" y2="398" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="250" y1="40" x2="250" y2="398" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="310" y1="40" x2="310" y2="398" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="410" y1="40" x2="410" y2="398" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ans[i] column highlight -->
  <rect x="410" y="70" width="100" height="328" fill="#fce4ec" opacity="0.35" filter="url(#rough2)"/>

  <!-- ===== Row 0: i=0 (boundary) ===== -->
  <rect x="30" y="72" width="480" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="91" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <text x="140" y="91" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="220" y="91" text-anchor="middle" font-size="12" fill="#ccc">—</text>
  <text x="280" y="91" text-anchor="middle" font-size="12" fill="#ccc">—</text>
  <text x="360" y="91" text-anchor="middle" font-size="12" fill="#ccc">—</text>
  <text x="460" y="91" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Row 1: i=1 ===== -->
  <text x="60"  y="121" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="140" y="121" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="220" y="121" text-anchor="middle" font-size="12" fill="#446688">0</text>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="360" y="121" text-anchor="middle" font-size="12" fill="#446688">0</text>
  <text x="460" y="121" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row 2: i=2 ===== -->
  <rect x="30" y="126" width="480" height="28" fill="#f5f5f5" opacity="0.5" filter="url(#rough2)"/>
  <text x="60"  y="145" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <text x="140" y="145" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="220" y="145" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="360" y="145" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="460" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row 3: i=3 ===== -->
  <text x="60"  y="175" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <text x="140" y="175" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="220" y="175" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="280" y="175" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="360" y="175" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="460" y="175" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row 4: i=4 ===== -->
  <rect x="30" y="180" width="480" height="28" fill="#f5f5f5" opacity="0.5" filter="url(#rough2)"/>
  <text x="60"  y="199" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <text x="140" y="199" text-anchor="middle" font-size="12" fill="#333">100</text>
  <text x="220" y="199" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="280" y="199" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="360" y="199" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="460" y="199" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row 5: i=5 ===== -->
  <text x="60"  y="229" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <text x="140" y="229" text-anchor="middle" font-size="12" fill="#333">101</text>
  <text x="220" y="229" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="280" y="229" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="360" y="229" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="460" y="229" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row 6: i=6 ===== -->
  <rect x="30" y="234" width="480" height="28" fill="#f5f5f5" opacity="0.5" filter="url(#rough2)"/>
  <text x="60"  y="253" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
  <text x="140" y="253" text-anchor="middle" font-size="12" fill="#333">110</text>
  <text x="220" y="253" text-anchor="middle" font-size="12" fill="#446688">3</text>
  <text x="280" y="253" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="360" y="253" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="460" y="253" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row 7: i=7 ===== -->
  <text x="60"  y="283" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7</text>
  <text x="140" y="283" text-anchor="middle" font-size="12" fill="#333">111</text>
  <text x="220" y="283" text-anchor="middle" font-size="12" fill="#446688">3</text>
  <text x="280" y="283" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="360" y="283" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="460" y="283" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3</text>

  <!-- ===== Row 8: i=8 ===== -->
  <rect x="30" y="288" width="480" height="28" fill="#f5f5f5" opacity="0.5" filter="url(#rough2)"/>
  <text x="60"  y="307" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">8</text>
  <text x="140" y="307" text-anchor="middle" font-size="12" fill="#333">1000</text>
  <text x="220" y="307" text-anchor="middle" font-size="12" fill="#446688">4</text>
  <text x="280" y="307" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="360" y="307" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="460" y="307" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="338" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="357" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：ans = [0, 1, 1, 2, 1, 2, 2, 3, 1]</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a">每行只需查一次已算好的 ans[i&gt;&gt;1]，一趟填完</text>

  <!-- dependency arrow example: row 6 (i=6, i>>1=3) references row 3 -->
  <path d="M 360 253 Q 440 253 440 175 Q 440 175 410 175" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="218" font-size="9.5" fill="#d6a040" font-weight="bold">查 ans[3]</text>
</svg>
