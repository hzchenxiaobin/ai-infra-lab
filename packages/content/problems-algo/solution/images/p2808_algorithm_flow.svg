<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：哈希表 + 间隙取半求最小</text>

  <!-- Box 1 -->
  <rect x="80" y="44" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 建哈希表：遍历 nums，记录每个值的出现位置列表</text>

  <!-- arrow 1->2 -->
  <path d="M 280 92 L 280 104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2 -->
  <rect x="80" y="110" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 对每个候选值 x（只需枚举出现过的值）</text>

  <!-- arrow 2->3 -->
  <path d="M 280 158 L 280 170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 (taller, highlight) -->
  <rect x="60" y="176" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 遍历位置列表相邻对 (p[i], p[i+1])：</text>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">gap = p[i+1] − p[i]；环形首尾 gap = p[0] + n − p[−1]</text>

  <!-- arrow 3->4 -->
  <path d="M 280 242 L 280 254" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4 -->
  <rect x="80" y="260" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ max_gap = max(所有间距)；ans(x) = max_gap // 2</text>

  <!-- arrow 4->5 -->
  <path d="M 280 308 L 280 320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5 (answer, green) -->
  <rect x="120" y="326" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ answer = min(ans(x))</text>

  <!-- side note: complexity -->
  <rect x="420" y="326" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">时间 O(n)</text>
  <text x="480" y="361" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">空间 O(n)</text>
</svg>
