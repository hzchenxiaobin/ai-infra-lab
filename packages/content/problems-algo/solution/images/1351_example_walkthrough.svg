<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：4×4 矩阵阶梯行走（7 步 = m+n−1）</text>

  <!-- ====== Left: matrix with path ====== -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">矩阵（圈中数字 = 行走步序）</text>

  <!-- col index -->
  <g font-size="9" fill="#aaa">
    <text x="72" y="74" text-anchor="middle">c0</text>
    <text x="128" y="74" text-anchor="middle">c1</text>
    <text x="184" y="74" text-anchor="middle">c2</text>
    <text x="240" y="74" text-anchor="middle">c3</text>
  </g>
  <!-- row index -->
  <g font-size="9" fill="#aaa">
    <text x="34" y="104" text-anchor="end">r0</text>
    <text x="34" y="144" text-anchor="end">r1</text>
    <text x="34" y="184" text-anchor="end">r2</text>
    <text x="34" y="224" text-anchor="end">r3</text>
  </g>

  <!-- cells row 0: 4,3,2,-1 -->
  <g font-size="15">
    <rect x="44" y="84" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="110" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="100" y="84" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="110" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="156" y="84" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="184" y="110" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="200" y="98" font-size="9" fill="#446688">②</text>
    <rect x="212" y="84" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="240" y="110" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <text x="268" y="98" font-size="11" fill="#b85450" font-weight="bold">①</text>
  </g>
  <!-- cells row 1: 3,2,1,-1 -->
  <g font-size="15">
    <rect x="44" y="124" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="150" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="100" y="124" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="150" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="156" y="124" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="184" y="150" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="200" y="138" font-size="9" fill="#446688">③</text>
    <rect x="212" y="124" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="240" y="150" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
  </g>
  <!-- cells row 2: 1,1,-1,-2 -->
  <g font-size="15">
    <rect x="44" y="164" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="190" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="100" y="164" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="190" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="156" y="164" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="184" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <text x="200" y="178" font-size="11" fill="#b85450" font-weight="bold">④</text>
    <rect x="212" y="164" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="240" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
  </g>
  <!-- cells row 3: -1,-1,-2,-3 -->
  <g font-size="15">
    <rect x="44" y="204" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="72" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <text x="88" y="218" font-size="11" fill="#b85450" font-weight="bold">⑦</text>
    <rect x="100" y="204" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="128" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">-1</text>
    <text x="144" y="218" font-size="11" fill="#b85450" font-weight="bold">⑥</text>
    <rect x="156" y="204" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="184" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
    <rect x="212" y="204" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="240" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">-3</text>
  </g>

  <!-- path arrows on matrix -->
  <!-- ①→② left -->
  <path d="M 232 88 L 196 88" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ②→③ down -->
  <path d="M 184 128 L 184 132" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ③→④ down -->
  <path d="M 184 168 L 184 172" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ④→⑤ left (to r2,c1) -->
  <path d="M 176 168 L 140 168" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="146" y="178" font-size="9" fill="#446688">⑤</text>
  <!-- ⑤→⑥ down -->
  <path d="M 128 208 L 128 212" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ⑥→⑦ left -->
  <path d="M 120 208 L 88 208" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Right: step table ====== -->
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">逐步记录</text>

  <!-- table header -->
  <rect x="320" y="68" width="300" height="22" rx="3" fill="#446688" filter="url(#rough2)"/>
  <g font-size="10" fill="#fff" font-weight="bold">
    <text x="332" y="83">步</text>
    <text x="370" y="83">(r,c)</text>
    <text x="420" y="83">值</text>
    <text x="460" y="83">动作</text>
    <text x="580" y="83" text-anchor="middle">count</text>
  </g>

  <!-- step rows -->
  <g font-size="10" fill="#444">
    <!-- step 1 -->
    <rect x="320" y="92" width="300" height="20" fill="#fce4ec" filter="url(#rough2)" opacity="0.5"/>
    <text x="332" y="106">①</text>
    <text x="370" y="106">(0,3)</text>
    <text x="420" y="106" fill="#b85450" font-weight="bold">-1</text>
    <text x="460" y="106">+4, col--</text>
    <text x="580" y="106" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <!-- step 2 -->
    <rect x="320" y="112" width="300" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="332" y="126">②</text>
    <text x="370" y="126">(0,2)</text>
    <text x="420" y="126" fill="#446688" font-weight="bold">2</text>
    <text x="460" y="126">row++</text>
    <text x="580" y="126" text-anchor="middle">4</text>
    <!-- step 3 -->
    <rect x="320" y="132" width="300" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="332" y="146">③</text>
    <text x="370" y="146">(1,2)</text>
    <text x="420" y="146" fill="#446688" font-weight="bold">1</text>
    <text x="460" y="146">row++</text>
    <text x="580" y="146" text-anchor="middle">4</text>
    <!-- step 4 -->
    <rect x="320" y="152" width="300" height="20" fill="#fce4ec" filter="url(#rough2)" opacity="0.5"/>
    <text x="332" y="166">④</text>
    <text x="370" y="166">(2,2)</text>
    <text x="420" y="166" fill="#b85450" font-weight="bold">-1</text>
    <text x="460" y="166">+2, col--</text>
    <text x="580" y="166" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <!-- step 5 -->
    <rect x="320" y="172" width="300" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="332" y="186">⑤</text>
    <text x="370" y="186">(2,1)</text>
    <text x="420" y="186" fill="#446688" font-weight="bold">1</text>
    <text x="460" y="186">row++</text>
    <text x="580" y="186" text-anchor="middle">6</text>
    <!-- step 6 -->
    <rect x="320" y="192" width="300" height="20" fill="#fce4ec" filter="url(#rough2)" opacity="0.5"/>
    <text x="332" y="206">⑥</text>
    <text x="370" y="206">(3,1)</text>
    <text x="420" y="206" fill="#b85450" font-weight="bold">-1</text>
    <text x="460" y="206">+1, col--</text>
    <text x="580" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <!-- step 7 -->
    <rect x="320" y="212" width="300" height="20" fill="#fce4ec" filter="url(#rough2)" opacity="0.5"/>
    <text x="332" y="226">⑦</text>
    <text x="370" y="226">(3,0)</text>
    <text x="420" y="226" fill="#b85450" font-weight="bold">-1</text>
    <text x="460" y="226">+1, col--</text>
    <text x="580" y="226" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <!-- end -->
    <rect x="320" y="232" width="300" height="20" fill="#e6f4ea" filter="url(#rough2)" opacity="0.5"/>
    <text x="332" y="246">—</text>
    <text x="370" y="246">col&lt;0</text>
    <text x="420" y="246">结束</text>
    <text x="460" y="246">return</text>
    <text x="580" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
  </g>

  <!-- bottom insight -->
  <rect x="40" y="280" width="580" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：①吃第 4 列全部 4 个负数，④吃第 3 列从 r2 起 2 个，⑥⑦各吃 1 个</text>
  <text x="330" y="320" text-anchor="middle" font-size="11" fill="#666">7 步 = m+n−1 = 4+4−1，每步排除一行或一列</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="60" y="354" width="16" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="82" y="364" fill="#555">非负 (≥0) → 下移</text>
    <rect x="200" y="354" width="16" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="222" y="364" fill="#555">负数 (&lt;0) → 吃列左移</text>
    <rect x="370" y="354" width="16" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="364" fill="#555">结束 → 返回</text>
  </g>

  <text x="330" y="396" text-anchor="middle" font-size="11" fill="#888">count = 4 + 2 + 1 + 1 = 8 ✓</text>
</svg>
