<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：滑动窗口求最长合法保留窗口</text>

  <!-- 步骤1：预处理 -->
  <rect x="60" y="46" width="520" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="68" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理</text>
  <text x="80" y="86" font-size="11.5" fill="#333" filter="url(#rough2)">统计全串 cnt[a/b/c]；若任一 cnt[c] &lt; k → 返回 -1；否则 limit[c] = cnt[c] − k</text>
  <path d="M 320 96 L 320 112" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：初始化 -->
  <rect x="160" y="114" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">② 初始化 l = 0, win = {0,0,0}, maxWin = 0</text>
  <text x="320" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">win 记窗口内各字符数；r 从 0 遍历到 n−1</text>
  <path d="M 320 160 L 320 176" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：加入 s[r] -->
  <rect x="100" y="178" width="440" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="203" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">③ 加入 s[r]：win[s[r]] += 1（右端扩张，纳入保留窗口）</text>
  <path d="M 320 220 L 320 236" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形：win[s[r]] > limit[s[r]] ? -->
  <polygon points="320,238 470,278 320,318 170,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">win[s[r]] &gt; limit[s[r]] ?</text>
  <text x="320" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（保留过多→取走不足 k）</text>

  <!-- 是：左缩 -->
  <text x="92" y="276" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 170 278 L 70 278 L 70 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="252" width="60" height="0" fill="none"/>
  <rect x="40" y="246" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">左缩 l</text>
  <text x="100" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">win[s[l]] −−; l++</text>
  <path d="M 100 290 L 100 306 L 245 306 L 245 296" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="302" font-size="9.5" fill="#888" filter="url(#rough2)">回到判定</text>

  <!-- 否：更新 maxWin -->
  <text x="478" y="276" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 470 278 L 520 278 L 520 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500" y="246" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="560" y="264" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">窗口合法</text>
  <text x="560" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxWin = max(maxWin, r−l+1)</text>
  <path d="M 560 290 L 560 340" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- r++ 循环 -->
  <rect x="100" y="342" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="367" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#rough2)">r++；若 r &lt; n 回到 ③ 继续；否则结束</text>
  <path d="M 320 384 L 320 398" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="160" y="400" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 返回 n − maxWin（= 最少取走数）</text>
  <text x="320" y="438" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">maxWin 越大 ⟺ 保留越多 ⟺ 取走越少</text>

  <text x="320" y="454" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">l、r 单调不退，每个字符进出窗口各一次 → O(n)</text>
</svg>
