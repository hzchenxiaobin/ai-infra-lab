<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <rect x="230" y="18" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="39" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 piles</text>

  <line x1="280" y1="50" x2="280" y2="72" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="74" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">xor = 0</text>

  <line x1="280" y1="106" x2="280" y2="128" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="130" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for p in piles: xor ^= p</text>

  <line x1="280" y1="162" x2="280" y2="184" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,186 345,221 280,256 215,221" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">xor == 0?</text>

  <line x1="215" y1="221" x2="165" y2="221" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="214" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="35" y="204" width="125" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="226" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <line x1="345" y1="221" x2="395" y2="221" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="400" y="204" width="125" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <text x="97" y="256" text-anchor="middle" font-size="10" fill="#7a3a38" filter="url(#rough2)">先手必败 P</text>
  <text x="462" y="256" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">先手必胜 N</text>

  <rect x="60" y="285" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    Bouton 定理：O(n) 一趟异或即可判定先手胜负
  </text>
</svg>
