<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位取放法（循环 32 次）</text>

  <!-- 开始 -->
  <ellipse cx="270" cy="62" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M 270 80 L 270 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="196" y="94" width="148" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res = 0,  i = 0</text>
  <path d="M 270 130 L 270 142" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="270,144 360,184 270,224 180,184" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; 32 ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="10" fill="#888">（已处理位数）</text>

  <!-- 否分支 -> 返回 -->
  <path d="M 360 184 L 432 184" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="434" y="166" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 res</text>

  <!-- 是分支向下 -->
  <path d="M 270 224 L 270 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="234" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 取低位 -->
  <rect x="190" y="238" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bit = n &amp; 1</text>
  <path d="M 270 274 L 270 286" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左移拼入 -->
  <rect x="166" y="288" width="208" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="311" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">res = (res &lt;&lt; 1) | bit</text>
  <path d="M 270 324 L 270 336" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右移+自增 -->
  <rect x="166" y="338" width="208" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="361" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n &gt;&gt;= 1;   i += 1</text>

  <!-- 回到判断的回路 -->
  <path d="M 374 356 L 410 356 L 410 184 L 360 184" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="272" font-size="10.5" fill="#888" font-weight="bold">回判断</text>

  <!-- 底部说明 -->
  <rect x="50" y="392" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">固定循环 32 次：先取再拼，最后右移消费 n，每轮 1 位</text>
</svg>
