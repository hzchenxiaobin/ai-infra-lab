<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按数位和分组：每组只保留已见过的最大值</text>

  <!-- nums row -->
  <text x="40" y="62" font-size="12" fill="#888">nums =</text>
  <g filter="url(#rough2)">
    <rect x="92"  y="46" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="46" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="46" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="46" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="46" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="118" y="68">18</text>
    <text x="176" y="68">43</text>
    <text x="234" y="68">36</text>
    <text x="292" y="68">13</text>
    <text x="350" y="68">7</text>
  </g>

  <!-- digit sums -->
  <text x="40" y="104" font-size="12" fill="#888">数位和 d =</text>
  <g font-size="12" fill="#d6a040" text-anchor="middle" font-weight="bold">
    <text x="118" y="104">9</text>
    <text x="176" y="104">7</text>
    <text x="234" y="104">9</text>
    <text x="292" y="104">4</text>
    <text x="350" y="104">7</text>
  </g>

  <!-- arrows down to groups -->
  <path d="M 118 112 L 118 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 234 112 L 130 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 176 112 L 300 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 350 112 L 326 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 292 112 L 470 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- group 9 -->
  <rect x="60" y="156" width="180" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="178" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">d = 9 组</text>
  <g filter="url(#rough2)">
    <rect x="80"  y="188" width="46" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="170" y="188" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="103" y="206">18</text>
    <text x="193" y="206">36</text>
  </g>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#b85450">最大值 mx[9] = 36</text>

  <!-- group 7 -->
  <rect x="260" y="156" width="180" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">d = 7 组</text>
  <g filter="url(#rough2)">
    <rect x="280" y="188" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="354" y="188" width="46" height="28" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="303" y="206">43</text>
    <text x="377" y="206">7</text>
  </g>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#446688">最大值 mx[7] = 43</text>

  <!-- group 4 -->
  <rect x="460" y="156" width="80" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="178" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">d=4 组</text>
  <g filter="url(#rough2)">
    <rect x="476" y="188" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="500" y="206" text-anchor="middle" font-size="12" fill="#333">13</text>
  <text x="500" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">仅 1 个，无法配对</text>

  <!-- pairing note -->
  <rect x="40" y="272" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="294" font-size="12.5" fill="#333" font-weight="bold">配对规则：每个数只与"同组中已见过的最大值"配对</text>
  <text x="56" y="314" font-size="11" fill="#555">• 36 来时 mx[9]=18 → 候选 18+36=54；之后 mx[9] 升为 36</text>
  <text x="56" y="334" font-size="11" fill="#555">• 7 来时 mx[7]=43 → 候选 43+7=50；d=4 组始终只有一个，不参与配对</text>

  <text x="40" y="380" font-size="11" fill="#555">每个数组只需保留"该和下已见过的最大值"一个量，新数与之相加即得最优候选。</text>
  <text x="40" y="400" font-size="11" fill="#555">无需存"前两大"——最优数对中后到的元素，看到的 mx[d] 必 ≥ 它的搭档。</text>
  <text x="40" y="430" font-size="10.5" fill="#888">键域 d ∈ [1, 81]（nums[i] ≤ 10^9，最大 999,999,999 的数位和为 81）。</text>
</svg>
