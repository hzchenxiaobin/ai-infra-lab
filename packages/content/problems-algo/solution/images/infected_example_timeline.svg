<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：感染按 BFS 层逐分钟扩散，最后一层即答案</text>

  <line x1="60" y1="356" x2="500" y2="356" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" fill="#555">
    <circle cx="80" cy="356" r="4" fill="#b85450" filter="url(#rough2)"/>
    <text x="80" y="376" text-anchor="middle">第 0 分</text>
    <circle cx="190" cy="356" r="4" fill="#d6a040" filter="url(#rough2)"/>
    <text x="190" y="376" text-anchor="middle">第 1 分</text>
    <circle cx="290" cy="356" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="290" y="376" text-anchor="middle">第 2 分</text>
    <circle cx="390" cy="356" r="4" fill="#446688" filter="url(#rough2)"/>
    <text x="390" y="376" text-anchor="middle">第 3 分</text>
    <circle cx="490" cy="356" r="4" fill="#b85450" filter="url(#rough2)"/>
    <text x="490" y="376" text-anchor="middle">第 4 分</text>
  </g>

  <circle cx="280" cy="62" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="304" y="58" font-size="10" fill="#d6a040">1 分</text>

  <path d="M 268 75 L 222 112" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 292 75 L 338 112" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="210" cy="124" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="210" y="109" text-anchor="middle" font-size="10" fill="#4a7a3a">2 分</text>

  <circle cx="350" cy="124" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="350" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="350" y="109" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 分 ★</text>

  <path d="M 210 140 L 210 170" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 338 137 L 314 170" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 362 137 L 388 170" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="210" cy="182" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="210" y="168" text-anchor="middle" font-size="10" fill="#446688">3 分</text>
  <circle cx="304" cy="182" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="187" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <text x="304" y="168" text-anchor="middle" font-size="10" fill="#d6a040">1 分</text>
  <circle cx="398" cy="182" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="398" y="168" text-anchor="middle" font-size="10" fill="#d6a040">1 分</text>

  <path d="M 198 196 L 180 226" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 222 196 L 240 226" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="174" cy="238" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="174" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="174" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 分</text>
  <circle cx="246" cy="238" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="246" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="246" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 分</text>

  <path d="M 440 250 L 280 240" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="232" font-size="10" fill="#b85450">最后感染 9、2</text>

  <rect x="392" y="262" width="158" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="471" y="280" text-anchor="middle" font-size="11" fill="#b85450">最大层 = 第 4 分</text>
  <text x="471" y="298" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">ans = 4</text>

  <text x="40" y="392" font-size="10" fill="#888">节点旁数字 = 该节点被感染的时刻 = BFS 中它到 start 的边数</text>
</svg>
