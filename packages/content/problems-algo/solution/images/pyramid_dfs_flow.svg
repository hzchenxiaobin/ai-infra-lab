<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：DFS + 记忆化 + 回溯建行</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">自底向上逐层构建，每层用回溯枚举所有合法的下一行</text>

  <!-- ===== dfs(row) main flow ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">dfs(row)：当前行能否堆到顶层？</text>

  <!-- Step 1: check len == 1 -->
  <rect x="30" y="82" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">len(row) == 1 ?</text>

  <!-- Yes arrow -->
  <path d="M 120 114 L 120 126" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="124" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="50" y="128" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return True ✓</text>

  <!-- No arrow to memo check -->
  <path d="M 210 98 L 240 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="216" y="92" font-size="9" fill="#666">否</text>

  <!-- Step 2: memo check -->
  <rect x="240" y="82" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">row ∈ memo ?</text>

  <!-- memo hit -->
  <path d="M 320 114 L 320 128" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="328" y="124" font-size="9" fill="#d6a040" font-weight="bold">命中</text>
  <rect x="250" y="130" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="10" fill="#d6a040">return memo[row]</text>

  <!-- memo miss -> build -->
  <path d="M 400 98 L 430 98" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="406" y="92" font-size="9" fill="#b85450">未命中</text>

  <!-- Step 3: build next row via backtracking -->
  <rect x="240" y="170" width="250" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="365" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">build(idx, next_row) — 回溯</text>

  <text x="252" y="206" font-size="10" fill="#555">if idx == len(row)-1:</text>
  <text x="268" y="220" font-size="10" fill="#4a7a3a">→ return dfs(next_row)</text>

  <text x="252" y="238" font-size="10" fill="#555">for top in trans[(row[idx], row[idx+1])]:</text>
  <text x="268" y="252" font-size="10" fill="#b85450">next_row.append(top)</text>
  <text x="268" y="266" font-size="10" fill="#b85450">if build(idx+1, next_row): return True</text>
  <text x="268" y="280" font-size="10" fill="#b85450">next_row.pop()  ← 回溯</text>

  <!-- Arrow from build to dfs (recursive) -->
  <path d="M 365 170 L 365 160 L 120 160 L 120 82" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="156" font-size="9" fill="#4a7a3a" font-weight="bold">递归调用 dfs(下一行)</text>

  <!-- Step 4: memoize -->
  <path d="M 365 290 L 365 306" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="250" y="308" width="230" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="326" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">memo[row] = result; return result</text>

  <!-- ===== Left: key points ===== -->
  <rect x="30" y="170" width="190" height="166" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="125" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键设计</text>

  <text x="42" y="206" font-size="9" fill="#555">① 自底向上：从 bottom</text>
  <text x="42" y="218" font-size="9" fill="#555">  开始，逐层减一</text>

  <text x="42" y="234" font-size="9" fill="#555">② 回溯建行：每位置试遍</text>
  <text x="42" y="246" font-size="9" fill="#555">  trans 映射的所有候选</text>

  <text x="42" y="262" font-size="9" fill="#555">③ 记忆化：同一 row 只算</text>
  <text x="42" y="274" font-size="9" fill="#555">  一次，缓存成败结果</text>

  <text x="42" y="290" font-size="9" fill="#555">④ 剪枝：某对底块无候选</text>
  <text x="42" y="302" font-size="9" fill="#555">  → 此路不通，立即回退</text>

  <text x="42" y="318" font-size="9" fill="#b85450" font-weight="bold">终止：len(row)==1 → True</text>
  <text x="42" y="330" font-size="9" fill="#b85450" font-weight="bold">      所有路径失败 → False</text>
</svg>
