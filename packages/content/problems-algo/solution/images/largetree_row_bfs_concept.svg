<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：逐层出队，每层维护最大值</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 层序骨架照搬 102，把「收集整层」改成「跟踪 max」即可</text>

  <!-- ===== Tree ===== -->
  <g font-size="12">
    <!-- root L0 -->
    <circle cx="180" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="180" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- L1 -->
    <circle cx="130" cy="165" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="130" y="170" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <circle cx="230" cy="165" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="230" y="170" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- edges L0-L1 -->
    <line x1="166" y1="104" x2="142" y2="151" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="194" y1="104" x2="218" y2="151" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2 -->
    <circle cx="95" cy="240" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="95" y="245" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <circle cx="165" cy="240" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="165" y="245" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="260" cy="240" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="260" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <line x1="116" y1="179" x2="102" y2="226" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="144" y1="179" x2="158" y2="226" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="248" y1="179" x2="256" y2="226" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- layer labels -->
  <text x="32" y="96" font-size="10" fill="#b85450" font-weight="bold">L0</text>
  <text x="32" y="171" font-size="10" fill="#b85450" font-weight="bold">L1</text>
  <text x="32" y="246" font-size="10" fill="#b85450" font-weight="bold">L2</text>

  <!-- max arrows: each layer's max highlighted -->
  <text x="320" y="96" font-size="10" fill="#888">max(1) =</text>
  <text x="386" y="96" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <text x="320" y="171" font-size="10" fill="#888">max(3, 2) =</text>
  <text x="394" y="171" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <text x="320" y="246" font-size="10" fill="#888">max(5, 3, 9) =</text>
  <text x="402" y="246" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <!-- ===== Per-layer result ===== -->
  <line x1="20" y1="282" x2="500" y2="282" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="302" font-size="11" fill="#444" font-weight="bold">逐层只保留最大值 → 一维结果数组</text>

  <g font-size="11">
    <!-- result cells -->
    <rect x="30" y="314" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="52" y="332" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="52" y="356" text-anchor="middle" font-size="9" fill="#888">L0</text>

    <rect x="84" y="314" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="106" y="332" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="106" y="356" text-anchor="middle" font-size="9" fill="#888">L1</text>

    <rect x="138" y="314" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="160" y="332" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <text x="160" y="356" text-anchor="middle" font-size="9" fill="#888">L2</text>
  </g>

  <rect x="300" y="314" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="334" font-size="10" fill="#d6a040" font-weight="bold">关键改动（对比 102）</text>
  <text x="320" y="350" font-family="monospace" font-size="9" fill="#333">每层：维护 maxVal 而非 level[]</text>
  <text x="320" y="364" font-family="monospace" font-size="9" fill="#b85450">maxVal = max(maxVal, node-&gt;val)</text>
</svg>
