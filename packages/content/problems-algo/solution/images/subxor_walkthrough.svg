<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "101101" 的两查询映射</text>

  <!-- ===== Top: s grid ===== -->
  <text x="40" y="56" font-size="12" fill="#888">主串 s（下标 / 字符）</text>
  <!-- 6 cells, x = 60 + idx*44, y=64 h=42 -->
  <!-- idx0 '1' highlighted (part of query1 "101") -->
  <rect x="60" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="82" y="120" text-anchor="middle" font-size="10" fill="#888">0</text>
  <!-- idx1 '0' -->
  <rect x="104" y="64" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="126" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="126" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>
  <!-- idx2 '1' (part of both "101" and "11") -->
  <rect x="148" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- idx3 '1' (part of "11") -->
  <rect x="192" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="214" y="120" text-anchor="middle" font-size="10" fill="#888">3</text>
  <!-- idx4 '0' -->
  <rect x="236" y="64" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="258" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="258" y="120" text-anchor="middle" font-size="10" fill="#888">4</text>
  <!-- idx5 '1' -->
  <rect x="280" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="302" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="302" y="120" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- bracket: "101" at idx0..2 -->
  <path d="M 62 128 L 62 136 L 190 136 L 190 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="126" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"101" = 5 → mp[5]=[0,2]</text>
  <!-- bracket: "11" at idx2..3 -->
  <path d="M 150 128 L 150 144 L 234 144 L 234 128" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="192" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"11" = 3 → mp[3]=[2,3]</text>

  <!-- ===== Middle: mp table (partial) ===== -->
  <text x="360" y="56" font-size="12" fill="#888">预处理映射 mp（部分）</text>
  <!-- header -->
  <rect x="360" y="64" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="395" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值</text>
  <rect x="430" y="64" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="470" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[l, r]</text>
  <!-- rows -->
  <rect x="360" y="88" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="430" y="88" width="80" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="103" text-anchor="middle" font-size="11" fill="#333">[1,1]</text>

  <rect x="360" y="112" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="430" y="112" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="470" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0,2]</text>

  <rect x="360" y="136" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="430" y="136" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="470" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2,3]</text>

  <rect x="360" y="160" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="175" text-anchor="middle" font-size="11" fill="#888">…</text>
  <rect x="430" y="160" width="80" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="175" text-anchor="middle" font-size="11" fill="#888">…</text>

  <!-- ===== Bottom: two queries ===== -->
  <!-- query 1 -->
  <rect x="40" y="200" width="470" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="222" font-size="12" fill="#4a7a3a" font-weight="bold">查询 1：[0, 5]</text>
  <text x="180" y="222" font-size="12" fill="#333">target = 0 ^ 5 = 5</text>
  <text x="320" y="222" font-size="12" fill="#4a7a3a" font-weight="bold">查表 mp[5] = [0,2]</text>
  <text x="55" y="244" font-size="11" fill="#444">bin(5) = "101"，在 s[0..2] 最左出现</text>
  <text x="55" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans = [0, 2] ✓</text>
  <!-- arrow from mp[5] row to query1 -->
  <path d="M 430 123 L 350 123 L 350 235 L 300 235" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- query 2 -->
  <rect x="40" y="284" width="470" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="306" font-size="12" fill="#446688" font-weight="bold">查询 2：[1, 2]</text>
  <text x="180" y="306" font-size="12" fill="#333">target = 1 ^ 2 = 3</text>
  <text x="320" y="306" font-size="12" fill="#446688" font-weight="bold">查表 mp[3] = [2,3]</text>
  <text x="55" y="328" font-size="11" fill="#444">bin(3) = "11"，在 s[2..3] 最左出现</text>
  <text x="55" y="346" font-size="11" fill="#446688" font-weight="bold">→ ans = [2, 3] ✓</text>
  <!-- arrow from mp[3] row to query2 -->
  <path d="M 430 147 L 358 147 L 358 319 L 300 319" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
