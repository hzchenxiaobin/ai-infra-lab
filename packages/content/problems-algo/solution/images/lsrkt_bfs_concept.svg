<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：BFS 逐层扩展候选，每层长度 +1</text>

  <!-- Layer 0: empty -->
  <rect x="260" y="48" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"" (L=0)</text>

  <!-- arrows down to layer 1 -->
  <path d="M 300 80 L 300 96" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Layer 1 -->
  <text x="30" y="116" font-size="11" fill="#888">available = {e, l, t}</text>
  <rect x="150" y="100" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="275" y="100" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <rect x="400" y="100" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <text x="300" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a">L=1：每个字符重复 k=2 次都是子序列 ✓</text>

  <!-- arrows down to layer 2 -->
  <path d="M 175 132 L 175 148" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 132 L 300 148" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 132 L 425 148" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Layer 2 -->
  <rect x="100" y="154" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="123" y="171" text-anchor="middle" font-size="11" fill="#333">ee</text>
  <rect x="160" y="154" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="183" y="171" text-anchor="middle" font-size="11" fill="#b85450">el ✗</text>
  <rect x="220" y="154" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="243" y="171" text-anchor="middle" font-size="11" fill="#333">et</text>
  <rect x="280" y="154" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="171" text-anchor="middle" font-size="11" fill="#333">le</text>
  <rect x="340" y="154" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="363" y="171" text-anchor="middle" font-size="11" fill="#333">lt</text>
  <rect x="400" y="154" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="423" y="171" text-anchor="middle" font-size="11" fill="#333">te</text>
  <text x="300" y="193" text-anchor="middle" font-size="10" fill="#4a7a3a">L=2：el / ll / tl / tt 被 isSubseq 或频次剪枝淘汰</text>

  <!-- arrows down to layer 3 -->
  <path d="M 123 182 L 123 198" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 243 182 L 243 198" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 303 182 L 303 198" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 363 182 L 363 198" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 423 182 L 423 198" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Layer 3 -->
  <rect x="195" y="204" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="225" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ete</text>
  <rect x="270" y="204" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lee</text>
  <rect x="345" y="204" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">let</text>
  <text x="300" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L=3：最长合法层 ✓</text>

  <!-- arrow down: try extend -->
  <path d="M 300 234 L 300 250" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Layer 4: empty -->
  <rect x="250" y="256" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="275" text-anchor="middle" font-size="11" fill="#888">L=4：无法扩展</text>

  <!-- Result box -->
  <path d="M 300 288 L 300 304" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="180" y="310" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="333" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">max({"ete","lee","let"}) = "let"</text>

  <!-- Key insight box -->
  <rect x="40" y="362" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三个观察把搜索空间压缩到可枚举规模</text>
  <text x="55" y="402" font-size="10" fill="#555">① len(seq) ≤ 7（由 n &lt; k·8 推出）  ② available 只含 freq ≥ k 的字符  ③ BFS 天然求最长</text>
  <text x="55" y="420" font-size="10" fill="#555">同层候选等长 → max() 取字典序最大；isSubseq 用 next_pos 表 O(1) 跳转剪枝</text>
</svg>
