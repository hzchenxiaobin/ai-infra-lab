<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：coordinates = [[1,2],[4,2],[1,3],[5,2]]，k = 5</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">处理第 2 个点 (4,2)：枚举 6 个候选配对坐标 (4⊕x, 2⊕(5−x))</text>

  <!-- candidate boxes -->
  <rect x="26" y="52" width="88" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x=0</text>
  <text x="70" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(4,7)</text>

  <rect x="122" y="52" width="88" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x=1</text>
  <text x="166" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(5,6)</text>

  <rect x="218" y="52" width="88" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x=2</text>
  <text x="262" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(6,1)</text>

  <rect x="314" y="52" width="88" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x=3</text>
  <text x="358" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(7,0)</text>

  <rect x="410" y="52" width="88" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x=4</text>
  <text x="454" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0,3)</text>

  <rect x="506" y="52" width="88" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="550" y="68" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x=5</text>
  <text x="550" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,2) ✓</text>

  <text x="310" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">只有 (1,2) 在哈希表里 → ans += 1（对应点对 (0,1)）</text>

  <!-- table header -->
  <rect x="30" y="132" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="82" y="132" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">当前点</text>
  <rect x="168" y="132" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">命中候选</text>
  <rect x="296" y="132" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="344" y="132" width="256" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="149" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">处理后的 cnt</text>

  <!-- row 1 -->
  <rect x="30" y="158" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="82" y="158" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,2)</text>
  <rect x="168" y="158" width="128" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="177" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无</text>
  <rect x="296" y="158" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="344" y="158" width="256" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{(1,2): 1}</text>

  <!-- row 2 -->
  <rect x="30" y="188" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="82" y="188" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4,2)</text>
  <rect x="168" y="188" width="128" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x=5 → (1,2)</text>
  <rect x="296" y="188" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="344" y="188" width="256" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{(1,2): 1, (4,2): 1}</text>

  <!-- row 3 -->
  <rect x="30" y="218" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="82" y="218" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,3)</text>
  <rect x="168" y="218" width="128" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="237" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无</text>
  <rect x="296" y="218" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="344" y="218" width="256" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{(1,2): 1, (4,2): 1, (1,3): 1}</text>

  <!-- row 4 -->
  <rect x="30" y="248" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82" y="248" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5,2)</text>
  <rect x="168" y="248" width="128" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x=4 → (1,3)</text>
  <rect x="296" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="267" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="344" y="248" width="256" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">同上，再 + (5,2): 1</text>

  <!-- verification -->
  <rect x="70" y="296" width="480" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">点对 (0,1)：(1⊕4) + (2⊕2) = 5 + 0 = 5 ✓</text>
  <text x="310" y="344" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">点对 (2,3)：(1⊕5) + (3⊕2) = 4 + 1 = 5 ✓</text>
  <text x="310" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终答案 = 2</text>
</svg>
