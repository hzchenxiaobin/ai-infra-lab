<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="260" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 8, 3, 19, 3]，k = 3，op1 = op2 = 1</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[a][b]：处理完前缀后剩 a 次①、b 次② 的最小和（行 = a，列 = b）；初始全 0</text>

  <!-- 表头 -->
  <text x="40" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">过 x=2</text>
  <text x="136" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">过 x=8</text>
  <text x="232" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">过 x=3</text>
  <text x="328" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">过 x=19</text>
  <text x="424" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">过 x=3</text>

  <!-- 行列标签（仅首表） -->
  <text x="34" y="93" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">a=0</text>
  <text x="34" y="123" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">a=1</text>
  <text x="58" y="70" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=0</text>
  <text x="94" y="70" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=1</text>

  <!-- 表 1：x=2 -->
  <rect x="40" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="40" y="104" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="94" y="124" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 表 2：x=8 -->
  <rect x="136" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="172" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="136" y="104" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="172" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="124" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 表 3：x=3 -->
  <rect x="232" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">13</text>
  <rect x="268" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="232" y="104" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="268" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286" y="124" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 表 4：x=19 -->
  <rect x="328" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">32</text>
  <rect x="364" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">29</text>
  <rect x="328" y="104" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">23</text>
  <rect x="364" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="124" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- 表 5：x=3（终表） -->
  <rect x="424" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">35</text>
  <rect x="460" y="74" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">32</text>
  <rect x="424" y="104" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">26</text>
  <rect x="460" y="104" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">23</text>
  <text x="478" y="150" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 23 ✓</text>

  <!-- 表间箭头 -->
  <path d="M 114 104 L 132 104" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 104 L 228 104" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 104 L 324 104" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 402 104 L 420 104" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 关键步注释 -->
  <text x="190" y="150" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">8 吃两招：8→4→1</text>
  <text x="382" y="150" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">19 吃两招：19→10→7</text>

  <!-- 底部结论 -->
  <rect x="20" y="164" width="480" height="82" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="184" font-size="10" fill="#333" filter="url(#rough2)">两条等优路线（和都 = 23）：</text>
  <text x="34" y="202" font-size="10" fill="#333" filter="url(#rough2)">路线①　19 独吃两招（先①后②：19 → 10 → 7）：2 + 8 + 3 + 7 + 3 = 23</text>
  <text x="34" y="220" font-size="10" fill="#333" filter="url(#rough2)">路线②　8 吃②（→ 5）、19 吃①（→ 10）：2 + 5 + 3 + 10 + 3 = 23（官方题解的方案）</text>
  <text x="34" y="238" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">右下角格子 (a=1, b=1) 一路演化：1 → 3 → 6 → 20 → 23 ✓</text>
</svg>
