<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3×3 幻方的性质</text>

  <!-- ===== 3x3 网格 ===== -->
  <!-- 对角线高亮单元格(淡绿) -->
  <rect x="200" y="80" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="134" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="188" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 副对角线高亮 -->
  <rect x="308" y="80" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="188" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 其余单元格(淡蓝) -->
  <rect x="254" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- 数字: 8 1 6 / 3 5 7 / 4 9 2 -->
  <text x="227" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">8</text>
  <text x="281" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">1</text>
  <text x="335" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">6</text>
  <text x="227" y="167" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">3</text>
  <text x="281" y="167" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="335" y="167" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">7</text>
  <text x="227" y="221" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">4</text>
  <text x="281" y="221" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">9</text>
  <text x="335" y="221" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">2</text>

  <!-- ===== 行和标注 (右侧) ===== -->
  <text x="385" y="113" font-size="14" fill="#4a7a3a" filter="url(#rough2)">行→ 8+1+6 = 15</text>
  <text x="385" y="167" font-size="14" fill="#4a7a3a" filter="url(#rough2)">行→ 3+5+7 = 15</text>
  <text x="385" y="221" font-size="14" fill="#4a7a3a" filter="url(#rough2)">行→ 4+9+2 = 15</text>

  <!-- ===== 列和标注 (下方) ===== -->
  <text x="227" y="262" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">8+3+4</text>
  <text x="227" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">=15</text>
  <text x="281" y="262" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1+5+9</text>
  <text x="281" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">=15</text>
  <text x="335" y="262" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6+7+2</text>
  <text x="335" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">=15</text>

  <!-- ===== 对角线标注 ===== -->
  <text x="110" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">主对角↓</text>
  <text x="110" y="118" font-size="13" fill="#b85450" filter="url(#rough2)">8+5+2=15</text>
  <text x="110" y="200" font-size="13" fill="#b85450" filter="url(#rough2)">副对角↓</text>
  <text x="110" y="218" font-size="13" fill="#b85450" filter="url(#rough2)">6+5+4=15</text>

  <!-- 主对角线虚线 -->
  <path d="M210,90 L352,232" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" opacity="0.6" filter="url(#rough2)"/>
  <!-- 副对角线虚线 -->
  <path d="M352,90 L210,232" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" opacity="0.6" filter="url(#rough2)"/>

  <!-- ===== 底部说明框 ===== -->
  <rect x="40" y="305" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="13" fill="#333" filter="url(#rough2)">幻方三要素：</text>
  <text x="60" y="346" font-size="12" fill="#555" filter="url(#rough2)">① 1~9 各出现一次（distinct）   ② 行/列/两对角线和均 = 15</text>
  <text x="60" y="360" font-size="12" fill="#555" filter="url(#rough2)">③ 中心格必为 5（1~9 总和 45 ÷ 3 = 15，中心参与 4 条线）</text>
</svg>
