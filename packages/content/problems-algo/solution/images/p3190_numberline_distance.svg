<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：3 的倍数间距为 3，任何数离最近的倍数至多 1 步</text>

  <!-- 图例 -->
  <circle cx="118" cy="44" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="48" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 的倍数（目标）</text>
  <circle cx="292" cy="44" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="306" y="48" font-size="10.5" fill="#446688" filter="url(#rough2)">普通数（待修）</text>

  <!-- 数轴 -->
  <path d="M 46 130 L 478 130" stroke="#888" stroke-width="1.6" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <circle cx="70" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="112" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="154" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="196" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="238" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="322" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="364" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="406" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="448" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="112" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="154" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="196" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="238" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="322" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="364" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="406" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="448" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- 每个普通数到最近倍数的 1 步弧线 -->
  <path d="M 112 108 Q 91 70 74 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 154 108 Q 175 70 192 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 238 108 Q 217 70 200 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 280 108 Q 301 70 318 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 364 108 Q 343 70 326 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 406 108 Q 427 70 444 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <text x="91" y="66" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">1 步</text>
  <text x="301" y="66" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">1 步</text>
  <text x="427" y="66" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">1 步</text>

  <!-- 余数三分类 -->
  <rect x="45" y="196" width="140" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">余数 r = 0</text>
  <text x="115" y="238" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">如 3、6、9</text>
  <text x="115" y="258" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">代价 0，不用动</text>

  <rect x="190" y="196" width="140" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">余数 r = 1</text>
  <text x="260" y="238" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">如 1、4、7</text>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">代价 min(1, 2) = 1</text>

  <rect x="335" y="196" width="140" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">余数 r = 2</text>
  <text x="405" y="238" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">如 2、5、8</text>
  <text x="405" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">代价 min(2, 1) = 1</text>

  <!-- 公式 -->
  <rect x="45" y="292" width="430" height="36" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每元素代价 = min(r, 3 − r)，取值只能是 0 或 1</text>

  <!-- 结论 -->
  <rect x="45" y="344" width="430" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">每个非整除元素恰好花 1 步</text>
  <text x="260" y="379" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 数一数 x mod 3 ≠ 0 的元素个数</text>
</svg>
