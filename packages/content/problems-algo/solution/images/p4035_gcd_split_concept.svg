<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：分割有效 ⇔ 两侧 gcd 都等于全局 g</text>

    <!-- Panel A: 不删除 -->
    <rect x="16" y="34" width="244" height="222" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <text x="138" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 不删除：全局 g = 5</text>

    <rect x="45" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="93" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="141" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2"/>
    <rect x="189" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="66" y="82" text-anchor="middle" font-size="11" fill="#333">10</text>
    <text x="114" y="82" text-anchor="middle" font-size="11" fill="#333">30</text>
    <text x="162" y="82" text-anchor="middle" font-size="11" fill="#333">15</text>
    <text x="210" y="82" text-anchor="middle" font-size="11" fill="#333">10</text>
    <path d="M 146 68 L 178 90" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 178 68 L 146 90" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="162" y="103" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">删除它</text>

    <path d="M 90 96 V 108" stroke="#888888" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
    <path d="M 138 96 V 108" stroke="#888888" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
    <path d="M 186 96 V 108" stroke="#888888" stroke-width="1" stroke-dasharray="3 2" fill="none"/>

    <text x="24" y="122" font-size="9" fill="#777777">分割 i</text>
    <text x="90" y="122" text-anchor="middle" font-size="10" fill="#555555" font-weight="bold">0</text>
    <text x="138" y="122" text-anchor="middle" font-size="10" fill="#555555" font-weight="bold">1</text>
    <text x="186" y="122" text-anchor="middle" font-size="10" fill="#555555" font-weight="bold">2</text>

    <rect x="68" y="128" width="44" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="116" y="128" width="44" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="164" y="128" width="44" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="90" y="142" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="138" y="142" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="186" y="142" text-anchor="middle" font-size="10" fill="#333">5</text>
    <text x="24" y="142" font-size="9.5" fill="#446688">前缀 gcd</text>

    <rect x="68" y="152" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="116" y="152" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="164" y="152" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="90" y="166" text-anchor="middle" font-size="10" fill="#333">5</text>
    <text x="138" y="166" text-anchor="middle" font-size="10" fill="#333">5</text>
    <text x="186" y="166" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="24" y="166" font-size="9.5" fill="#4a7a3a">后缀 gcd</text>

    <text x="24" y="188" font-size="9.5" fill="#777777">相等？</text>
    <text x="90" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
    <text x="138" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
    <text x="186" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

    <text x="138" y="214" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">得分 = 0</text>
    <text x="138" y="232" text-anchor="middle" font-size="8.5" fill="#888888">g 被 15 拉低，两侧处处错开</text>

    <!-- Panel B: 删除 15 -->
    <rect x="280" y="34" width="224" height="222" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <text x="392" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 删除 15：全局 g = 10</text>

    <rect x="323" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="371" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="419" y="64" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="344" y="82" text-anchor="middle" font-size="11" fill="#333">10</text>
    <text x="392" y="82" text-anchor="middle" font-size="11" fill="#333">30</text>
    <text x="440" y="82" text-anchor="middle" font-size="11" fill="#333">10</text>

    <path d="M 368 96 V 108" stroke="#888888" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
    <path d="M 416 96 V 108" stroke="#888888" stroke-width="1" stroke-dasharray="3 2" fill="none"/>

    <text x="288" y="122" font-size="9" fill="#777777">分割 i</text>
    <text x="368" y="122" text-anchor="middle" font-size="10" fill="#555555" font-weight="bold">0</text>
    <text x="416" y="122" text-anchor="middle" font-size="10" fill="#555555" font-weight="bold">1</text>

    <rect x="346" y="128" width="44" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="394" y="128" width="44" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="368" y="142" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="416" y="142" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="288" y="142" font-size="9.5" fill="#446688">前缀 gcd</text>

    <rect x="346" y="152" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="394" y="152" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="368" y="166" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="416" y="166" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="288" y="166" font-size="9.5" fill="#4a7a3a">后缀 gcd</text>

    <text x="288" y="188" font-size="9.5" fill="#777777">相等？</text>
    <text x="368" y="190" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold">✓</text>
    <text x="416" y="190" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold">✓</text>

    <text x="392" y="214" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold">得分 = 2 ← 答案</text>
    <text x="392" y="232" text-anchor="middle" font-size="8.5" fill="#888888">两侧处处都是 g，处处有效</text>

    <!-- insight box -->
    <rect x="16" y="272" width="488" height="152" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">三条推论</text>
    <text x="32" y="316" font-size="9.5" fill="#6b5416">① 两侧 gcd 都是 g 的倍数，且两者再取 gcd 就是 g ⇒ 两侧相等时只能都等于 g</text>
    <text x="32" y="338" font-size="9.5" fill="#6b5416">② 前缀 gcd 在整除意义上只降不升，一旦降到 g 便锁死 ⇒ 有效分割有左端点 t₁</text>
    <text x="32" y="360" font-size="9.5" fill="#6b5416">③ 后缀 gcd 向右只可能变成 g 的更大倍数 ⇒ 有效分割有右端点 t₂ − 1</text>
    <text x="32" y="388" font-size="9.5" fill="#8a6d1f" font-weight="bold">⇒ 有效分割连成中间一段 [t₁, t₂−1]，一次线性扫描即可数出得分</text>
    <text x="32" y="410" font-size="9.5" fill="#6b5416">删除元素只会让 g 在整除意义下不降 —— 例 1 正是靠删 15 把 g 从 5 抬到 10</text>
  </g>
</svg>
