<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>

  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">top(3) 演算：从最高分往下扫</text>
  <path d="M 230 36 Q 340 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 当前表② cnt（降序）===== -->
  <text x="30" y="62" font-size="11" font-weight="bold" fill="#888">当前表 ② cnt（降序）：</text>
  <g filter="url(#sk)"><rect x="180" y="48" width="60" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="210" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">51→2</text>
  <g filter="url(#sk)"><rect x="250" y="48" width="60" height="26" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">39→1</text>
  <g filter="url(#sk)"><rect x="320" y="48" width="60" height="26" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="350" y="66" text-anchor="middle" font-size="12" fill="#333">4→1</text>
  <text x="395" y="66" font-size="10" fill="#888">玩家：2:51, 4:51, 3:39, 5:4</text>

  <!-- ===== 扫描表头 ===== -->
  <text x="110" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">分数</text>
  <text x="210" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">人数</text>
  <text x="310" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">take</text>
  <text x="430" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">累加 ans</text>
  <text x="560" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">剩余 rem</text>
  <line x1="50" y1="120" x2="620" y2="120" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== 第1步：51 ===== -->
  <g filter="url(#sk)"><rect x="80" y="135" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="110" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">51</text>
  <g filter="url(#sk)"><rect x="180" y="135" width="60" height="34" rx="4" fill="#fff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="210" y="158" text-anchor="middle" font-size="14" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="280" y="135" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="370" y="135" width="120" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="430" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2×51 = 102</text>
  <g filter="url(#sk)"><rect x="530" y="135" width="60" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="560" y="158" text-anchor="middle" font-size="14" fill="#2b6e9e">1</text>
  <text x="640" y="155" font-size="10" fill="#7a5415">min(2,3)=2</text>
  <text x="640" y="168" font-size="10" fill="#888">rem: 3→1</text>

  <!-- 向下箭头 1->2 -->
  <path d="M 310 171 L 310 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- ===== 第2步：39 ===== -->
  <g filter="url(#sk)"><rect x="80" y="195" width="60" height="34" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="110" y="218" text-anchor="middle" font-size="14" fill="#333">39</text>
  <g filter="url(#sk)"><rect x="180" y="195" width="60" height="34" rx="4" fill="#fff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="210" y="218" text-anchor="middle" font-size="14" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="280" y="195" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="370" y="195" width="120" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="430" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">102+39 = 141</text>
  <g filter="url(#sk)"><rect x="530" y="195" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="560" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>
  <text x="640" y="215" font-size="10" fill="#b85450" font-weight="bold">rem=0 停!</text>
  <text x="640" y="228" font-size="10" fill="#888">min(1,1)=1</text>

  <!-- ===== 第3步：4（跳过）===== -->
  <g filter="url(#sk)"><rect x="80" y="255" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="110" y="278" text-anchor="middle" font-size="13" fill="#aaa">4</text>
  <g filter="url(#sk)"><rect x="180" y="255" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="210" y="278" text-anchor="middle" font-size="13" fill="#aaa">1</text>
  <g filter="url(#sk)"><rect x="280" y="255" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="310" y="278" text-anchor="middle" font-size="13" fill="#aaa">—</text>
  <g filter="url(#sk)"><rect x="370" y="255" width="120" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="430" y="278" text-anchor="middle" font-size="12" fill="#aaa">（已取满，跳过）</text>
  <g filter="url(#sk)"><rect x="530" y="255" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="560" y="278" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <!-- ===== 最终结果 ===== -->
  <g filter="url(#sk)"><rect x="40" y="315" width="600" height="78" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="55" y="340" font-size="12" font-weight="bold" fill="#b85450">结果：</text>
  <text x="110" y="340" font-size="12" fill="#444">top(3) = 51 + 51 + 39 = 141 ✓</text>
  <text x="55" y="362" font-size="11" fill="#444">① 第 1 步吃掉整个 51 桶（2 人 = 102），剩余 1 个名额；</text>
  <text x="55" y="380" font-size="11" fill="#444">② 第 2 步从 39 桶取 1 人（39），rem 归 0 立即停止，4 桶无需访问。</text>
  <text x="640" y="378" font-size="11" fill="#7a5415" font-weight="bold">★ 扫 2 步 ≠ n=4</text>
</svg>
