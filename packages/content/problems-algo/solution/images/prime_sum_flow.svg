<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：反复用质因数之和替换，直到值不再变</text>

  <!-- Start -->
  <rect x="210" y="46" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 n</text>
  <path d="M 270 82 L 270 106" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: compute sum of prime factors -->
  <rect x="110" y="106" width="320" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s ← 质因数之和(n)</text>
  <text x="270" y="149" text-anchor="middle" font-size="11" fill="#666">（试除到 √n，含重数）</text>
  <path d="M 270 160 L 270 184" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: s == n ? -->
  <polygon points="270,184 366,222 270,260 174,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s == n ?</text>

  <!-- Yes branch -->
  <path d="M 366 222 L 400 222" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="383" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="200" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="462" y="219" text-anchor="middle" font-size="13" fill="#2f5d20" font-weight="bold">返回 n</text>
  <text x="462" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a">不动点：质数 / 4</text>

  <!-- No branch -->
  <path d="M 270 260 L 270 290" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="278" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="210" y="290" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n ← s</text>

  <!-- Loop back arrow -->
  <path d="M 210 308 L 64 308 L 64 133 L 106 133" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="302" text-anchor="middle" font-size="11" fill="#888">继续替换</text>

  <!-- Footnote -->
  <rect x="40" y="360" width="460" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#666">不动点判定用 <tspan font-weight="bold">s == n</tspan> 一式覆盖两种情形：</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#666">质数（单因子，s = n）与 n = 4（2+2 = 4）。其余合数 s &lt; n，必缩。</text>
</svg>
