<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：names = ["kaido","kaido(1)","kaido","kaido(1)"]</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#888">整个输入串作 base → 嵌套后缀 "kaido(1)(1)" 自然产生</text>

  <!-- Table header row -->
  <rect x="36" y="56" width="608" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">names[i]</text>
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">查表 / 试探</text>
  <text x="455" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">分配结果</text>
  <text x="585" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d 关键更新</text>

  <!-- vertical separators -->
  <path d="M 100 56 L 100 242 M 200 56 L 200 242 M 410 56 L 410 242 M 510 56 L 510 242" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="36" y="86" width="608" height="38" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="110" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="145" y="110" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"kaido"</text>
  <text x="300" y="110" text-anchor="middle" font-size="10.5" fill="#555">不在 d 中</text>
  <text x="455" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"kaido"</text>
  <text x="585" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a">d["kaido"] = 1</text>

  <!-- row 1 -->
  <rect x="36" y="124" width="608" height="38" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="148" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="145" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"kaido(1)"</text>
  <text x="300" y="148" text-anchor="middle" font-size="10.5" fill="#555">不在 d 中</text>
  <text x="455" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"kaido(1)"</text>
  <text x="585" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a">d["kaido(1)"] = 1</text>

  <!-- row 2 -->
  <rect x="36" y="162" width="608" height="42" rx="3" fill="#fffde7" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="188" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="145" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"kaido"</text>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="#b85450">在 d, k=1 → "kaido(1)" 占用</text>
  <text x="300" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">k=2 → "kaido(2)" 空闲 ✓</text>
  <text x="455" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"kaido(2)"</text>
  <text x="585" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">d["kaido(2)"]=1</text>
  <text x="585" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d["kaido"]=3</text>

  <!-- row 3 -->
  <rect x="36" y="204" width="608" height="42" rx="3" fill="#fffde7" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="230" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="145" y="230" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">"kaido(1)"</text>
  <text x="300" y="226" text-anchor="middle" font-size="10" fill="#b85450">在 d, k=1</text>
  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">→ "kaido(1)(1)" 空闲 ✓</text>
  <text x="455" y="230" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">"kaido(1)(1)"</text>
  <text x="585" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a">d["kaido(1)(1)"]=1</text>
  <text x="585" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d["kaido(1)"]=2</text>

  <!-- Result -->
  <text x="340" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 ans = ["kaido", "kaido(1)", "kaido(2)", "kaido(1)(1)"]</text>

  <!-- color legend -->
  <rect x="120" y="294" width="16" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="144" y="305" font-size="10.5" fill="#555">names[i]（输入名，整体作 base）</text>
  <rect x="400" y="294" width="16" height="13" rx="3" fill="#fffde7" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="305" font-size="10.5" fill="#555">发生冲突试探的行</text>

  <!-- footnote: nested suffix explanation -->
  <rect x="48" y="320" width="584" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 ④ 行的陷阱：输入 "kaido(1)" 已被占用</text>
  <text x="340" y="358" text-anchor="middle" font-size="10.5" fill="#555">base 是 "kaido(1)"（不剥离已有后缀），追加 "(1)" → "kaido(1)(1)"</text>
  <text x="340" y="372" text-anchor="middle" font-size="10" fill="#888">嵌套后缀而非 "kaido(2)"——后者属于 base "kaido" 的候选族</text>

  <!-- footer note -->
  <rect x="48" y="388" width="584" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="406" text-anchor="middle" font-size="11" fill="#555">每个候选族互不相交 + 计数器单调推进 → 均摊 O(n)</text>
  <text x="340" y="420" text-anchor="middle" font-size="10" fill="#888">第 ③ 行跳过 "kaido(1)" 只此一次，后续永不再扫</text>
</svg>
