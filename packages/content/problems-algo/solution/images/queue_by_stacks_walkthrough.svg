<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="640" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：push/pop/peek 全流程</text>
  <path d="M 290 42 Q 460 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="70" text-anchor="middle" font-size="12" fill="#666">操作序列：push(1), push(2), push(3), pop(), push(4), pop(), peek(), pop(), pop(), empty()</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="86" width="80" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="120" y="86" width="150" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="270" y="86" width="300" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
    <rect x="570" y="86" width="300" height="34" rx="3" fill="#e0e0e0" stroke="#888"/>
  </g>
  <text x="80" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">步骤</text>
  <text x="195" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">操作</text>
  <text x="420" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">in_stack（顶在右）</text>
  <text x="720" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">out_stack（顶在右）</text>

  <!-- 行1: push(1) -->
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#666">①</text>
  <text x="195" y="148" text-anchor="middle" font-size="12" fill="#333">push(1)</text>
  <g filter="url(#sk)">
    <rect x="290" y="132" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="310" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="345" y="152" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="152" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="860" y="148" font-size="11" fill="#2e6e2e">—</text>

  <!-- 行2: push(2) -->
  <text x="80" y="190" text-anchor="middle" font-size="11" fill="#666">②</text>
  <text x="195" y="190" text-anchor="middle" font-size="12" fill="#333">push(2)</text>
  <g filter="url(#sk)">
    <rect x="290" y="174" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="330" y="174" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="310" y="194" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="350" y="194" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="385" y="194" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="194" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="860" y="190" font-size="11" fill="#2e6e2e">—</text>

  <!-- 行3: push(3) -->
  <text x="80" y="232" text-anchor="middle" font-size="11" fill="#666">③</text>
  <text x="195" y="232" text-anchor="middle" font-size="12" fill="#333">push(3)</text>
  <g filter="url(#sk)">
    <rect x="290" y="216" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="330" y="216" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="370" y="216" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="310" y="236" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="350" y="236" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="390" y="236" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="425" y="236" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="236" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="860" y="232" font-size="11" fill="#2e6e2e">—</text>

  <!-- 行4: pop() -> 倒栈 -->
  <text x="80" y="282" text-anchor="middle" font-size="11" fill="#666">④</text>
  <text x="195" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="294" text-anchor="middle" font-size="9" fill="#b85450">out 空→倒栈</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e">倒空 →</text>
  <g filter="url(#sk)">
    <rect x="590" y="266" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="630" y="266" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="670" y="266" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="610" y="286" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="650" y="286" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="690" y="286" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="725" y="286" font-size="10" fill="#b85450">顶</text>
  <text x="780" y="278" text-anchor="middle" font-size="10" fill="#7a5415">倒栈后</text>
  <text x="780" y="292" text-anchor="middle" font-size="10" fill="#7a5415">顺序逆转</text>
  <text x="860" y="282" font-size="12" fill="#b85450" font-weight="bold">→ 1 ✓</text>
  <path d="M 415 240 Q 460 252 590 282" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 行5: push(4) -->
  <text x="80" y="330" text-anchor="middle" font-size="11" fill="#666">⑤</text>
  <text x="195" y="330" text-anchor="middle" font-size="12" fill="#333">push(4)</text>
  <g filter="url(#sk)">
    <rect x="290" y="314" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="345" y="334" font-size="10" fill="#b85450">顶</text>
  <g filter="url(#sk)">
    <rect x="590" y="314" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="630" y="314" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="610" y="334" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="650" y="334" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="685" y="334" font-size="10" fill="#b85450">顶</text>
  <text x="860" y="330" font-size="11" fill="#2e6e2e">—</text>
  <text x="780" y="326" text-anchor="middle" font-size="9" fill="#2e6e2e">out 非空</text>
  <text x="780" y="340" text-anchor="middle" font-size="9" fill="#2e6e2e">不再倒栈</text>

  <!-- 行6: pop() -> 2 -->
  <text x="80" y="376" text-anchor="middle" font-size="11" fill="#666">⑥</text>
  <text x="195" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pop()</text>
  <text x="310" y="380" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="345" y="380" font-size="10" fill="#b85450">顶</text>
  <g filter="url(#sk)">
    <rect x="590" y="360" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="610" y="380" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="645" y="380" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="376" text-anchor="middle" font-size="10" fill="#7a5415">弹出 2</text>
  <text x="860" y="376" font-size="12" fill="#b85450" font-weight="bold">→ 2 ✓</text>

  <!-- 行7: peek() -> 3 -->
  <text x="80" y="422" text-anchor="middle" font-size="11" fill="#666">⑦</text>
  <text x="195" y="422" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">peek()</text>
  <text x="310" y="426" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="345" y="426" font-size="10" fill="#b85450">顶</text>
  <text x="610" y="426" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="645" y="426" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="422" text-anchor="middle" font-size="10" fill="#7a5415">只看不弹</text>
  <text x="860" y="422" font-size="12" fill="#b85450" font-weight="bold">→ 3 ✓</text>

  <!-- 行8: pop() -> 3 -->
  <text x="80" y="468" text-anchor="middle" font-size="11" fill="#666">⑧</text>
  <text x="195" y="468" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pop()</text>
  <text x="310" y="472" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="345" y="472" font-size="10" fill="#b85450">顶</text>
  <text x="720" y="468" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="860" y="468" font-size="12" fill="#b85450" font-weight="bold">→ 3 ✓</text>

  <!-- 行9: pop() -> 4, 倒栈 -->
  <text x="80" y="514" text-anchor="middle" font-size="11" fill="#666">⑨</text>
  <text x="195" y="510" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="526" text-anchor="middle" font-size="9" fill="#b85450">out 空→倒栈</text>
  <text x="420" y="514" text-anchor="middle" font-size="11" fill="#2e6e2e">倒空 →</text>
  <g filter="url(#sk)">
    <rect x="590" y="498" width="40" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="610" y="518" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="645" y="518" font-size="10" fill="#b85450">顶</text>
  <text x="860" y="514" font-size="12" fill="#b85450" font-weight="bold">→ 4 ✓</text>
  <path d="M 415 478 Q 460 488 590 514" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 行10: empty() -> true -->
  <text x="80" y="566" text-anchor="middle" font-size="11" fill="#666">⑩</text>
  <text x="195" y="566" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">empty()</text>
  <text x="420" y="566" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="720" y="566" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="860" y="566" font-size="12" fill="#2e6e2e" font-weight="bold">→ true</text>

  <!-- 底部小结 -->
  <text x="460" y="610" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">出队顺序 1,2,3,4 —— 与入队顺序完全一致（FIFO），两次倒栈抵消了 LIFO</text>
</svg>
