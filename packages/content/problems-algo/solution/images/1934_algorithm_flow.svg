<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：LEFT JOIN → GROUP BY → AVG(0/1) → ROUND</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="12" fill="#446688" font-weight="bold">① LEFT JOIN：Signups s LEFT JOIN Confirmations c ON s.user_id = c.user_id</text>
  <text x="56" y="90" font-size="10.5" fill="#555">左表每行保留；无匹配的右表列填 NULL（用户 6 → 一行 NULL）</text>
  <text x="56" y="104" font-size="9.5" fill="#888">→ 拼接后行数 = Signups 行数 + 有匹配的 Confirmations 行数（每条确认一行）</text>

  <path d="M 300 110 L 300 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">② GROUP BY s.user_id：按用户分桶，每个用户一个分组</text>
  <text x="56" y="172" font-size="10.5" fill="#555">用户 6 的分组只有一行（全 NULL），其余用户的分组含其所有确认记录</text>

  <path d="M 300 186 L 300 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="208" width="520" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="12" fill="#d6a040" font-weight="bold">③ 组内算确认率：AVG(IF(c.action='confirmed',1,0))</text>
  <text x="56" y="248" font-size="10.5" fill="#555">confirmed → 1，timeout → 0，NULL → IF 取 0；AVG 对 0/1 求均值 = confirmed 占比</text>
  <text x="56" y="264" font-size="9.5" fill="#888">用户 6：单行 NULL → IF=0 → AVG=0；用户 7：三行 1 → AVG=1.00；用户 2：1,0 → AVG=0.50</text>

  <path d="M 300 278 L 300 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="300" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12" fill="#b85450" font-weight="bold">④ IFNULL(..., 0) 兜底 + ROUND(..., 2)</text>
  <text x="56" y="340" font-size="10.5" fill="#555">防御性 IFNULL（AVG 在此写法下已不会为 NULL，但显式兜底更稳妥）；ROUND 保留 2 位小数</text>

  <path d="M 300 354 L 300 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="180" y="376" width="240" height="72" fill="#fafafa" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="10.5" fill="#888">输出结果</text>
  <line x1="190" y1="400" x2="410" y2="400" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="200" y="416" font-size="10" fill="#888">user_id</text>
  <text x="320" y="416" font-size="10" fill="#888">confirmation_rate</text>
  <text x="205" y="432" font-size="10.5" fill="#333">6</text><text x="325" y="432" font-size="10.5" fill="#b85450" font-weight="bold">0.00</text>
  <text x="205" y="446" font-size="10.5" fill="#333">3</text><text x="325" y="446" font-size="10.5" fill="#b85450" font-weight="bold">0.00</text>
</svg>
