<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口流程：收缩到非法，ans += left</text>

  <!-- Init -->
  <rect x="100" y="44" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">预处理与初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#555">mx = max(nums)；left = cnt = ans = 0</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="90" y="126" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for right in 0..n−1</text>
  <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="#555">右指针遍历每个位置</text>

  <path d="M 230 174 L 230 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- cnt++ -->
  <rect x="120" y="196" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">if nums[right] == mx：cnt++</text>

  <path d="M 230 240 L 230 258" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: cnt >= k? -->
  <polygon points="230,262 360,308 230,354 100,308" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt ≥ k ?</text>
  <text x="230" y="322" text-anchor="middle" font-size="10.5" fill="#777">窗口内 M 至少 k 个？</text>

  <!-- Yes branch: shrink -->
  <path d="M 100 308 L 40 308 L 40 364" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="6" y="368" width="130" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="71" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">收缩左端</text>
  <text x="71" y="408" text-anchor="middle" font-size="9.5" fill="#555">cnt −= (nums[left]==mx)</text>
  <text x="71" y="424" text-anchor="middle" font-size="9.5" fill="#555">left++</text>

  <!-- while back edge to diamond -->
  <path d="M 22 400 L 22 294 L 136 294" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="14" y="350" font-size="9" fill="#aaa" transform="rotate(-90 14 350)">再判</text>

  <!-- No branch -->
  <path d="M 360 308 L 400 308 L 400 364" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="374" y="300" font-size="11" fill="#82b366" font-weight="bold">No</text>

  <!-- count box -->
  <rect x="324" y="368" width="130" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="389" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += left</text>
  <text x="389" y="408" text-anchor="middle" font-size="9.5" fill="#555">以 right 结尾的</text>
  <text x="389" y="424" text-anchor="middle" font-size="9.5" fill="#555">合法起点共 left 个</text>

  <!-- shrink -> count -->
  <path d="M 136 403 L 320 403" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="228" y="396" text-anchor="middle" font-size="9.5" fill="#777">直到 cnt &lt; k</text>

  <!-- loop back -->
  <path d="M 454 403 L 446 403 L 446 148 L 374 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="452" y="280" font-size="9.5" fill="#aaa" transform="rotate(-90 452 280)">循环</text>

  <!-- final -->
  <text x="230" y="496" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束 → return ans（O(n), O(1)）</text>
  <text x="230" y="518" text-anchor="middle" font-size="10.5" fill="#888">答案上限 n(n+1)/2 ≈ 5×10⁹，C++ 需用 long long</text>
</svg>
