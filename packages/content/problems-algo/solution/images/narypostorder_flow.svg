<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反转法栈迭代流程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">孩子顺序入栈 → 出栈得「根，孩子逆序」→ 反转得后序</text>

  <!-- 开始 -->
  <rect x="225" y="58" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <!-- 特判 -->
  <path d="M 280 90 L 360 124 L 280 158 L 200 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333">root == null?</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333">返回 []</text>

  <!-- 初始化 -->
  <rect x="210" y="172" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="11" fill="#333">stack = [root]</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333">result = []</text>

  <!-- while 栈非空 -->
  <path d="M 280 216 L 380 248 L 280 280 L 180 248 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333">栈非空?</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#333">否→跳出</text>

  <!-- 循环体 -->
  <rect x="120" y="294" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">① pop 出栈 → result.append(val)</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#333">② for child in children: stack.push(child)  (顺序入栈)</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888">顶=最后入栈的孩子→先出，得到「根，孩子逆序」</text>

  <!-- 反转 -->
  <rect x="180" y="358" width="200" height="0" fill="none"/>

  <!-- 连线 -->
  <line x1="280" y1="84" x2="280" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="158" x2="280" y2="172" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="168" font-size="10" fill="#4a7a3a">否</text>
  <line x1="360" y1="124" x2="430" y2="124" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="118" font-size="10" fill="#b85450">是</text>
  <rect x="430" y="112" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="#b85450">return []</text>

  <line x1="280" y1="206" x2="280" y2="216" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="280" x2="280" y2="294" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="290" font-size="10" fill="#4a7a3a">是</text>

  <!-- 循环回边 -->
  <path d="M 440 322 Q 480 322 480 248 Q 480 248 380 248" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="288" font-size="10" fill="#888">循环</text>

  <!-- 反转+返回 -->
  <rect x="170" y="360" width="220" height="0" fill="none"/>
  <rect x="100" y="358" width="360" height="0" fill="none"/>
  <rect x="140" y="356" width="280" height="0" fill="none"/>

  <rect x="155" y="352" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">reverse(result) → 返回后序</text>

  <line x1="280" y1="350" x2="280" y2="352" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 248 Q 110 248 110 360 Q 110 363 155 363" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="300" font-size="10" fill="#888">栈空</text>
</svg>
