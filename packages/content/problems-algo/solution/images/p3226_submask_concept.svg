<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="404" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：操作只能 1 → 0，k 的每个 1 位都得从 n 里「继承」——k 是 n 的子掩码</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐位对齐只有三种命运：1→0 可关（橙）、0→1 禁止（红）、相同不动（绿）</text>

  <!-- 左：可行示例 n=13, k=4 -->
  <rect x="22" y="52" width="266" height="168" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 可行：n = 13, k = 4</text>

  <text x="64" y="101" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">n</text>
  <rect x="73" y="82" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="82" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="159" y="82" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="101" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="202" y="82" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="64" y="139" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">k</text>
  <rect x="73" y="120" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="116" y="120" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="159" y="120" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="202" y="120" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <text x="91" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="134" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="177" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="220" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <text x="155" y="184" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">bit3、bit0：n=1 → k=0，各关 1 次</text>
  <text x="155" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">bit2：双方同为 1，不用动 → 答案 2</text>

  <!-- 右：无解示例 n=14, k=13 -->
  <rect x="292" y="52" width="266" height="168" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无解：n = 14, k = 13</text>

  <text x="334" y="101" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">n</text>
  <rect x="343" y="82" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="386" y="82" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="429" y="82" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="472" y="82" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="101" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <text x="334" y="139" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">k</text>
  <rect x="343" y="120" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="386" y="120" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="429" y="120" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="472" y="120" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="139" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="361" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="404" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="447" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="490" y="162" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <text x="425" y="184" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">bit0：k = 1 但 n = 0 —— 0 变不出 1</text>
  <text x="425" y="202" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">只要有一位这样 ⇒ 整体返回 -1</text>

  <!-- 底部两个结论框 -->
  <rect x="22" y="234" width="266" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="258" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一步 · 可行性判定（一步位运算）</text>
  <text x="155" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">k &amp; ~n ≠ 0 ⟹ 返回 -1</text>
  <text x="155" y="312" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">语义：k 与 n 的「补集」有交集</text>
  <text x="155" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">即 k 里存在 n 不具备的 1 位</text>
  <text x="155" y="356" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">等价写法：(n &amp; k) ≠ k 或 (n | k) ≠ n</text>

  <rect x="292" y="234" width="266" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二步 · 数出答案（一步位运算）</text>
  <text x="425" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = popcount(n ⊕ k)</text>
  <text x="425" y="312" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">可行时，差异位全是 n=1、k=0</text>
  <text x="425" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个差异位恰好需要关 1 次</text>
  <text x="425" y="356" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">等价写法：popcount(n) − popcount(k)</text>
</svg>
