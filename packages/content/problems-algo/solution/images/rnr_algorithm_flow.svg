<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 从 0 遍历，受限节点直接跳过</text>

  <!-- ① 建图 + 标记受限 -->
  <rect x="150" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 建邻接表 g；blocked[i] = (i ∈ restricted)</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#888">O(n) 预处理，restricted 放入哈希集合</text>

  <path d="M 280 88 L 280 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 BFS -->
  <rect x="150" y="110" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② vis[0]=true；ans=1；queue=[0]</text>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#888">起点 0 一定可达（题目保证 0 非受限）</text>

  <path d="M 280 156 L 280 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 取队首 -->
  <rect x="150" y="180" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 队列空？→ 是则跳到 ⑥ 返回 ans</text>

  <path d="M 280 218 L 280 240" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="232" font-size="9" fill="#888">否</text>

  <!-- ④ 取出 u -->
  <rect x="150" y="242" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ u = queue.pop()</text>

  <path d="M 280 280 L 280 300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 遍历邻居（菱形判定） -->
  <polygon points="280,302 420,346 280,390 140,346" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对每个邻居 v：</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#333">blocked[v] 或 vis[v]？</text>

  <!-- 跳过分支（红，向右回环到③） -->
  <path d="M 420 346 Q 480 346 480 200 Q 480 198 412 198" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="276" font-size="10" fill="#b85450" font-weight="bold">是 → 跳过</text>

  <!-- 入队分支（绿，向下回环到③） -->
  <path d="M 280 390 Q 280 414 200 414 Q 96 414 96 200 Q 96 198 148 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="410" font-size="10" fill="#4a7a3a" font-weight="bold">否 → vis[v]=1；ans++；queue.push(v)</text>

  <!-- ⑥ 返回 -->
  <rect x="390" y="110" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ return ans</text>
  <path d="M 410 198 Q 410 160 440 146" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
