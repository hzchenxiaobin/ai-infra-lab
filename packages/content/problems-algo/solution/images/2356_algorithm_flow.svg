<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="820" height="380" fill="#fafafa"/>

  <text x="410" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：去重计数的两条等价路径</text>

  <!-- shared input box -->
  <rect x="24" y="152" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="99" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Teacher 表</text>
  <text x="99" y="194" text-anchor="middle" font-size="9" fill="#666">teacher_id, subject_id, dept_id</text>

  <!-- ===== Approach A (top) ===== -->
  <text x="370" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">解法 A：一步 COUNT(DISTINCT)（推荐）</text>
  <path d="M174 165 C 212 165 212 117 250 117" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="250" y="92" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="114" text-anchor="middle" font-size="10" fill="#333">GROUP BY teacher_id</text>
  <text x="370" y="131" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">COUNT(DISTINCT subject_id) AS cnt</text>
  <path d="M490 117 L600 175" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Approach B (bottom) ===== -->
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">解法 B：先 DISTINCT 去重 再 COUNT(*)（两步）</text>
  <path d="M174 195 C 212 195 212 291 250 291" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="250" y="266" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="288" text-anchor="middle" font-size="10" fill="#333">SELECT DISTINCT</text>
  <text x="325" y="305" text-anchor="middle" font-size="9" fill="#d6a040">teacher_id, subject_id</text>
  <path d="M400 291 L420 291" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="420" y="266" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="288" text-anchor="middle" font-size="10" fill="#333">GROUP BY teacher_id</text>
  <text x="495" y="305" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">COUNT(*) AS cnt</text>
  <path d="M570 291 L600 210" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== result box (shared) ===== -->
  <rect x="600" y="152" width="190" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="695" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（任意顺序）</text>
  <text x="695" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">teacher_id=1, cnt=2</text>
  <text x="695" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">teacher_id=2, cnt=4</text>

  <!-- ===== Bottom note ===== -->
  <rect x="24" y="320" width="772" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#666">两者等价：A 由聚合函数内部去重（一次扫描，组内维护哈希集合）；B 先物化去重表再聚合（两步，行数先减）</text>
  <text x="410" y="358" text-anchor="middle" font-size="10" fill="#666">数据重复率高时 B 的「先减行」可降低后续聚合开销；现代优化器常把 A、B 改写为相近执行计划</text>
</svg>
