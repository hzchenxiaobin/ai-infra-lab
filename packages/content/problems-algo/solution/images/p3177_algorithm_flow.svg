<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 548"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="548" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐元素扫描，每个元素更新 k+1 行</text>

  <rect x="160" y="32" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="51" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">哈希值域压缩：nums → 编号 0..m−1</text>

  <path d="M 270 62 L 270 74" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="76" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="95" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp 清零；每行 (mx₁,arg₁,mx₂)=(0,−1,0)；ans = 0</text>

  <path d="M 270 106 L 270 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="120" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="139" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个元素 x（值编号）</text>

  <path d="M 270 150 L 270 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="164" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 0（从小到大逐行更新）</text>

  <path d="M 270 194 L 270 206" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="208" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="227" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cand = dp[j][x] + 1（同值接龙）</text>

  <path d="M 270 238 L 270 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="205,278 270,254 335,278 270,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &gt; 0 ?</text>

  <path d="M 335 278 L 360 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="364" y="256" width="132" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">cand = max(cand,</text>
  <text x="430" y="283" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">排除 x 列的行最值 + 1)</text>
  <text x="430" y="296" text-anchor="middle" font-size="8" fill="#8a6d3b" filter="url(#rough2)">arg₁≠x ? mx₁ : mx₂</text>

  <path d="M 270 302 L 270 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="312" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 430 300 C 430 312, 352 314, 314 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="318" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[j][x] = cand；ans = max(ans, cand)</text>
  <text x="270" y="352" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">按三分支维护第 j 行 top-2</text>

  <path d="M 270 362 L 270 374" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="205,402 270,378 335,402 270,426" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="407" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; k ?</text>

  <path d="M 205 402 L 92 402 L 92 179 L 156 179" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="395" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="104" y="394" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j+1</text>

  <path d="M 270 426 L 270 438" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="436" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="205,466 270,442 335,466 270,490" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="471" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有元素 ?</text>

  <path d="M 205 466 L 60 466 L 60 135 L 156 135" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="459" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="74" y="458" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下一个</text>

  <path d="M 270 490 L 270 502" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="500" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="504" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="523" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="396" y="352" width="116" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="370" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">复杂度速览</text>
  <text x="454" y="388" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">每元素 k+1 次</text>
  <text x="454" y="402" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">每次 O(1)</text>
  <text x="454" y="416" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">总计 O(nk)</text>
  <text x="454" y="434" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">n=5000, k=50</text>
  <text x="454" y="448" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">→ 2.6×10⁵</text>
  <text x="454" y="466" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（暴力 O(n²k)</text>
  <text x="454" y="480" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">≈ 6×10⁸）</text>
  <text x="454" y="496" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Python 也稳</text>
</svg>
