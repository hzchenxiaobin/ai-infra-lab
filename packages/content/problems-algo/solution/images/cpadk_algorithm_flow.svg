<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历 + 频次哈希累加</text>

  <!-- Step 1: init -->
  <rect x="60" y="56" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="170" y="94" text-anchor="middle" font-size="10" fill="#666">ans = 0，cnt = 空哈希表</text>

  <!-- arrow down -->
  <path d="M 170 104 L 170 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="40" y="128" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for each x in nums：</text>
  <text x="170" y="166" text-anchor="middle" font-size="10" fill="#666">逐个遍历数组元素</text>

  <path d="M 170 176 L 170 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: lookup -->
  <rect x="30" y="200" width="280" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">查表累加</text>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += cnt[x+k] + cnt[x−k]</text>
  <text x="170" y="254" text-anchor="middle" font-size="10" fill="#888">（缺键视为 0）</text>

  <path d="M 170 264 L 170 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: record -->
  <rect x="60" y="288" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">登记当前元素</text>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[x] += 1</text>

  <!-- loop back arrow -->
  <path d="M 60 310 Q 30 310 30 200 Q 30 150 40 150" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="232" font-size="10" fill="#888" transform="rotate(-90 20 232)">继续下一个</text>

  <!-- Step 5: return -->
  <path d="M 170 336 L 170 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="360" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束</text>
  <text x="170" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- side notes -->
  <rect x="340" y="200" width="230" height="148" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="455" y="224" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">为何「先查后存」？</text>
  <text x="350" y="246" font-size="10" fill="#555">查的时候表里只有「下标</text>
  <text x="350" y="260" font-size="10" fill="#555">更早」的元素，因此累加</text>
  <text x="350" y="274" font-size="10" fill="#555">的每对都满足 i &lt; j，</text>
  <text x="350" y="288" font-size="10" fill="#555">不会把当前元素自配对，</text>
  <text x="350" y="302" font-size="10" fill="#555">也不需要除以 2 去重。</text>
  <text x="350" y="324" font-size="10" fill="#4a7a3a" font-weight="bold">与「两数之和」同构：</text>
  <text x="350" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">查补数 → 命中即配对</text>
</svg>
