<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">翻转只改变两对边界差值</text>

  <!-- Subarray bracket -->
  <path d="M 175 50 L 175 44 L 333 44 L 333 50" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="254" y="38" text-anchor="middle" font-size="10" fill="#d6a040">翻转 [3,1,5]</text>

  <!-- Original array -->
  <text x="55" y="73" font-size="11" fill="#888">原数组</text>
  <rect x="120" y="55" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="75" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="175" y="55" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="75" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="230" y="55" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="75" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="285" y="55" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="309" y="75" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="340" y="55" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="75" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- Original pair values with colored pills -->
  <rect x="159" y="93" width="25" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="171" y="105" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="214" y="93" width="25" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="227" y="105" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <rect x="269" y="93" width="25" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="282" y="105" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <rect x="324" y="93" width="25" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="337" y="105" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <text x="420" y="105" font-size="10" fill="#888">S = 1+2+4+1 = 8</text>

  <path d="M 254 116 L 254 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Reversed array -->
  <text x="55" y="168" font-size="11" fill="#888">翻转后</text>
  <rect x="120" y="150" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="170" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="175" y="150" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="170" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="230" y="150" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="285" y="150" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="309" y="170" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="340" y="150" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="170" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- Reversed pair values -->
  <rect x="159" y="188" width="25" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="171" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="214" y="188" width="25" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="227" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <rect x="269" y="188" width="25" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="282" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <rect x="324" y="188" width="25" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="337" y="200" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <text x="420" y="200" font-size="10" fill="#888">S = 3+4+2+1 = 10</text>

  <!-- Annotations -->
  <rect x="50" y="222" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a">内部对：2+4 = 4+2 = 6，和不变</text>

  <rect x="310" y="222" width="250" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="241" text-anchor="middle" font-size="10.5" fill="#b85450">边界对：1+1 → 3+1，变化 +2</text>

  <!-- Formula box -->
  <rect x="40" y="268" width="500" height="115" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="11" fill="#666">a = nums[l−1], b = nums[l], c = nums[r], d = nums[r+1]</text>
  <text x="290" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Δ = (|a−c| + |b−d|) − (|a−b| + |c−d|)</text>
  <text x="290" y="340" text-anchor="middle" font-size="11.5" fill="#666">= (|2−5| + |3−4|) − (|2−3| + |5−4|)</text>
  <text x="290" y="365" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= (3 + 1) − (1 + 1) = 2</text>
</svg>
