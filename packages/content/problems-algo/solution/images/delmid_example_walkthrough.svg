<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="#fdfcf7"/>

  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：奇数链与偶数链</text>
  <path d="M 240 38 Q 410 46 580 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- ===== 奇数链 n=5 ===== -->
  <text x="40" y="68" font-size="13" font-weight="bold" fill="#2b6e9e">例 1：head = 1→2→3→4→5（n=5，⌊5/2⌋=2，删节点 3）</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="40" y="80" width="120" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="100" y="98" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">轮次</text>
  <g filter="url(#sk)"><rect x="160" y="80" width="180" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="250" y="98" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">slow 位置</text>
  <g filter="url(#sk)"><rect x="340" y="80" width="180" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="430" y="98" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">fast 位置</text>
  <g filter="url(#sk)"><rect x="520" y="80" width="260" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="650" y="98" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">说明</text>

  <!-- 行 -->
  <g font-size="11" fill="#444">
    <g filter="url(#sk)"><rect x="40" y="108" width="120" height="26" fill="#fff" stroke="#ddd"/><rect x="160" y="108" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="340" y="108" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="520" y="108" width="260" height="26" fill="#fff" stroke="#ddd"/></g>
    <text x="100" y="125" text-anchor="middle">初始</text>
    <text x="250" y="125" text-anchor="middle" fill="#7a5415" font-weight="bold">dummy</text>
    <text x="430" y="125" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="650" y="125" text-anchor="middle" fill="#666">slow=dummy, fast=head</text>

    <g filter="url(#sk)"><rect x="40" y="134" width="120" height="26" fill="#fff" stroke="#ddd"/><rect x="160" y="134" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="340" y="134" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="520" y="134" width="260" height="26" fill="#fff" stroke="#ddd"/></g>
    <text x="100" y="151" text-anchor="middle">第 1 轮</text>
    <text x="250" y="151" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <text x="430" y="151" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="650" y="151" text-anchor="middle" fill="#666">slow+1, fast+2</text>

    <g filter="url(#sk)"><rect x="40" y="160" width="120" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="160" y="160" width="180" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="340" y="160" width="180" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="520" y="160" width="260" height="26" fill="#fff8e1" stroke="#d6a040"/></g>
    <text x="100" y="177" text-anchor="middle" font-weight="bold">第 2 轮</text>
    <text x="250" y="177" text-anchor="middle" fill="#7a5415" font-weight="bold">2（前驱）</text>
    <text x="430" y="177" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
    <text x="650" y="177" text-anchor="middle" fill="#8a6a20">fast.next=null，停止</text>
  </g>
  <text x="40" y="202" font-size="11" fill="#b85450" font-weight="bold">→ slow.next 指向 3，跳过 → 结果 1→2→4→5 ✓</text>

  <!-- ===== 偶数链 n=4 ===== -->
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#7a5415">例 2：head = 1→2→3→4（n=4，⌊4/2⌋=2，删节点 3）</text>

  <g filter="url(#sk)"><rect x="40" y="244" width="120" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">轮次</text>
  <g filter="url(#sk)"><rect x="160" y="244" width="180" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="250" y="262" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">slow 位置</text>
  <g filter="url(#sk)"><rect x="340" y="244" width="180" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="430" y="262" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">fast 位置</text>
  <g filter="url(#sk)"><rect x="520" y="244" width="260" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="650" y="262" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">说明</text>

  <g font-size="11" fill="#444">
    <g filter="url(#sk)"><rect x="40" y="272" width="120" height="26" fill="#fff" stroke="#ddd"/><rect x="160" y="272" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="340" y="272" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="520" y="272" width="260" height="26" fill="#fff" stroke="#ddd"/></g>
    <text x="100" y="289" text-anchor="middle">初始</text>
    <text x="250" y="289" text-anchor="middle" fill="#7a5415" font-weight="bold">dummy</text>
    <text x="430" y="289" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="650" y="289" text-anchor="middle" fill="#666">slow=dummy, fast=head</text>

    <g filter="url(#sk)"><rect x="40" y="298" width="120" height="26" fill="#fff" stroke="#ddd"/><rect x="160" y="298" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="340" y="298" width="180" height="26" fill="#fff" stroke="#ddd"/><rect x="520" y="298" width="260" height="26" fill="#fff" stroke="#ddd"/></g>
    <text x="100" y="315" text-anchor="middle">第 1 轮</text>
    <text x="250" y="315" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <text x="430" y="315" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="650" y="315" text-anchor="middle" fill="#666">slow+1, fast+2</text>

    <g filter="url(#sk)"><rect x="40" y="324" width="120" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="160" y="324" width="180" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="340" y="324" width="180" height="26" fill="#fff8e1" stroke="#d6a040"/><rect x="520" y="324" width="260" height="26" fill="#fff8e1" stroke="#d6a040"/></g>
    <text x="100" y="341" text-anchor="middle" font-weight="bold">第 2 轮</text>
    <text x="250" y="341" text-anchor="middle" fill="#7a5415" font-weight="bold">2（前驱）</text>
    <text x="430" y="341" text-anchor="middle" fill="#2e6e2e" font-weight="bold">null（越尾）</text>
    <text x="650" y="341" text-anchor="middle" fill="#8a6a20">fast=null，停止</text>
  </g>
  <text x="40" y="366" font-size="11" fill="#b85450" font-weight="bold">→ slow.next 指向 3，跳过 → 结果 1→2→4 ✓</text>

  <!-- ===== 边界 n=1 ===== -->
  <text x="40" y="396" font-size="13" font-weight="bold" fill="#b85450">例 3（边界）：head = 1（n=1，⌊1/2⌋=0，删唯一的节点）</text>
  <g filter="url(#sk)"><rect x="40" y="412" width="640" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="56" y="434" font-size="11" fill="#444">slow=dummy, fast=head(1)。判断 fast.next：1.next=null → 条件不成立，循环不执行。</text>
  <text x="56" y="454" font-size="11" fill="#b85450" font-weight="bold">slow 仍在 dummy → dummy.next = head.next = null → 返回 null（空链）✓</text>
  <text x="56" y="472" font-size="10" fill="#888">哑节点统一了「删唯一节点」的边界：无需特判，dummy.next 自然指向 null。</text>

  <text x="410" y="510" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">核心：循环条件 fast &amp;&amp; fast.next 与 876 完全一致，奇偶两种停止情形 slow 都停在前驱</text>
  <text x="410" y="530" text-anchor="middle" font-size="10" fill="#888">奇数链 fast 停在末尾（fast.next=null）；偶数链 fast 越过末尾（fast=null）</text>
</svg>
