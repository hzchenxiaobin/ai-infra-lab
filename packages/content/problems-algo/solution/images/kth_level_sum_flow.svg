<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层求和 → 判层数 → 排序取第 k</text>

  <!-- 1. Start -->
  <ellipse cx="260" cy="58" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 2. root null? -->
  <polygon points="260,94 340,128 260,162 180,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">root == null ?</text>
  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#888">（空树：0 层 &lt; k）</text>
  <!-- yes -> -1 -->
  <path d="M 340 128 L 430 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="365" y="120" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="116" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>
  <!-- no -> init -->
  <path d="M 260 162 L 260 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="176" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- 3. init -->
  <rect x="170" y="182" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="260" y="216" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">queue = [root];  sums = []</text>
  <path d="M 260 222 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 4. while queue not empty -->
  <polygon points="260,242 356,276 260,310 164,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">queue 非空 ?</text>
  <text x="260" y="287" text-anchor="middle" font-size="9" fill="#888">（还有层没算）</text>
  <!-- no -> check k -->
  <path d="M 356 276 L 410 276 L 410 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="375" y="268" font-size="10" fill="#446688" font-weight="bold">否</text>
  <!-- yes -> process level -->
  <path d="M 260 310 L 260 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="322" font-size="10" fill="#666" font-weight="bold">是</text>

  <!-- 5. process one level -->
  <rect x="120" y="328" width="280" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">处理当前层（for i &lt; size）</text>
  <text x="260" y="362" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">node = pop;  level_sum += node.val</text>
  <text x="260" y="378" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">入队 node.left / node.right</text>
  <!-- loop back to while -->
  <path d="M 120 357 L 70 357 L 70 276 L 164 276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="9" fill="#888">sums.append</text>
  <text x="76" y="332" font-size="9" fill="#888">(level_sum)</text>
  <text x="76" y="348" font-size="9" fill="#888">回循环</text>

  <!-- 6. check len(sums) < k -->
  <polygon points="410,360 490,394 410,428 330,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="391" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">len(sums) &lt; k ?</text>
  <text x="410" y="405" text-anchor="middle" font-size="9" fill="#888">层数不足</text>
  <!-- yes -> -1 -->
  <path d="M 490 394 L 510 394 L 510 134 L 490 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="500" y="270" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <!-- no -> sort & return -->
  <path d="M 410 428 L 410 452" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="420" y="446" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- 7. sort & return k-th -->
  <rect x="300" y="454" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="472" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">sort(sums, 降序)</text>
  <text x="410" y="490" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return sums[k−1]</text>

  <!-- legend -->
  <rect x="20" y="462" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="40" y="474" font-size="9" fill="#888">判定</text>
  <rect x="20" y="482" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="40" y="494" font-size="9" fill="#888">处理</text>
  <rect x="20" y="502" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="40" y="514" font-size="9" fill="#888">返回</text>
</svg>
