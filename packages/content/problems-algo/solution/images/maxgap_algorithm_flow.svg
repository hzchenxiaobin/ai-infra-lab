<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">桶排序求最大间距 · 算法流程</text>

  <!-- start -->
  <rect x="220" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 nums</text>
  <path d="M280 76 L280 88" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- decision: n < 2 -->
  <polygon points="280,90 360,124 280,158 200,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333">n &lt; 2 或</text>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333">min == max?</text>
  <path d="M200 124 L150 124 L150 156" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="165" y="118" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M280 158 L280 170" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="290" y="168" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- return 0 -->
  <rect x="100" y="158" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="150" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 0</text>

  <!-- compute bucket_size -->
  <rect x="180" y="172" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#333">bucket_size = max(1,</text>
  <text x="280" y="205" text-anchor="middle" font-size="11" fill="#333">(max−min) // (n−1))</text>
  <path d="M280 214 L280 226" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- compute bucket_count -->
  <rect x="190" y="228" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333">bucket_count = range/size+1</text>
  <path d="M280 262 L280 274" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- distribute -->
  <rect x="170" y="276" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#333">遍历 nums，把每个数投入桶</text>
  <text x="280" y="309" text-anchor="middle" font-size="11" fill="#333">桶只记 min / max</text>
  <path d="M280 318 L280 330" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- scan adjacent -->
  <rect x="150" y="332" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333">扫相邻非空桶：</text>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#333">gap = bucket[i].min − prev.max</text>
  <path d="M280 374 L280 386" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="200" y="388" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 最大 gap</text>

  <!-- side note -->
  <rect x="410" y="276" width="140" height="60" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="480" y="296" text-anchor="middle" font-size="10" fill="#888">每个元素 O(1)</text>
  <text x="480" y="312" text-anchor="middle" font-size="10" fill="#888">入桶 + O(桶数) 扫描</text>
  <text x="480" y="328" text-anchor="middle" font-size="10" fill="#888">= 总计 O(n)</text>
</svg>
