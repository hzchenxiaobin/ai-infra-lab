<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">置换环：最小交换次数 = n − 环个数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例③ [18, 43, 34, 16]，数位和 [9, 7, 7, 7]</text>

  <!-- 位置下标 -->
  <text x="137" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置0</text>
  <text x="219" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置1</text>
  <text x="301" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置2</text>
  <text x="383" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置3</text>

  <!-- 当前数组（按环着色：0/3 蓝，1/2 绿） -->
  <rect x="102" y="64" width="70" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="184" y="64" width="70" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="266" y="64" width="70" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="348" y="64" width="70" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="137" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">18</text>
  <text x="219" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">43</text>
  <text x="301" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">34</text>
  <text x="383" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">16</text>

  <text x="137" y="107" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数位和 9</text>
  <text x="219" y="107" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数位和 7</text>
  <text x="301" y="107" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数位和 7</text>
  <text x="383" y="107" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数位和 7</text>

  <!-- 环②（绿）：位置1 ↔ 位置2，浅环 -->
  <path d="M219,122 Q260,148 301,122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M301,122 Q260,198 219,122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">②</text>

  <!-- 环①（蓝）：位置0 ↔ 位置3，深环 -->
  <path d="M137,124 Q260,300 383,124" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M383,124 Q260,360 137,124" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>

  <!-- 右侧标注 -->
  <text x="408" y="142" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">环② 位置1↔2</text>
  <text x="408" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">长 2 → 1 次交换</text>
  <text x="408" y="198" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">环① 位置0↔3</text>
  <text x="408" y="214" font-size="11" fill="#446688" filter="url(#rough2)">长 2 → 1 次交换</text>

  <!-- 底部公式框 -->
  <rect x="60" y="288" width="330" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="225" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">长度 L 的环恰好 L−1 次交换（一次交换拆一环）</text>
  <text x="225" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = n − 环数 = 4 − 2 = 2 ✓</text>

  <!-- 目标数组说明 -->
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">目标序（按数位和、数值升序）：[16, 34, 43, 18]</text>
</svg>
