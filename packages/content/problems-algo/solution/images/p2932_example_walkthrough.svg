<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,4,5]，枚举 i ≤ j 的全部 15 对</text>

  <!-- 列头 -->
  <text x="154" y="52" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">j=1</text>
  <text x="198" y="52" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">j=2</text>
  <text x="242" y="52" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="286" y="52" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">j=4</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">j=5</text>

  <!-- 行标签 -->
  <text x="122" y="79" text-anchor="end" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="122" y="113" text-anchor="end" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="122" y="147" text-anchor="end" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">i=3</text>
  <text x="122" y="181" text-anchor="end" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">i=4</text>
  <text x="122" y="215" text-anchor="end" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">i=5</text>

  <!-- 第 1 行 -->
  <rect x="132" y="58" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="176" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="80" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="220" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="80" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">✗</text>
  <rect x="264" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="80" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">✗</text>
  <rect x="308" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="80" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">✗</text>

  <!-- 第 2 行 -->
  <rect x="176" y="92" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="114" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="220" y="92" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="114" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="264" y="92" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="286" y="114" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="308" y="92" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="114" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">✗</text>

  <!-- 第 3 行 -->
  <rect x="220" y="126" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="148" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="264" y="126" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="148" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">7★</text>
  <rect x="308" y="126" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="148" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 第 4 行 -->
  <rect x="264" y="160" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="182" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="308" y="160" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="182" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 第 5 行 -->
  <rect x="308" y="194" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="216" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <!-- 下三角说明 -->
  <rect x="146" y="146" width="124" height="60" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="208" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i &gt; j 的对与</text>
  <text x="208" y="181" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i &lt; j 的重复，</text>
  <text x="208" y="196" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">无需枚举</text>

  <!-- 图例 -->
  <rect x="368" y="58" width="136" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="436" y="78" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="378" y="90" width="24" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">强数对标 XOR</text>
  <rect x="378" y="116" width="24" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">✗ 非强数对</text>
  <rect x="378" y="142" width="24" height="18" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">自身对 XOR=0</text>
  <rect x="378" y="168" width="24" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">★ 最大值 7</text>

  <!-- 结论 -->
  <rect x="60" y="252" width="400" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">强数对共 11 个：对角 5 个 + 非对角 6 个</text>

  <rect x="60" y="288" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">最大 XOR = 3 ⊕ 4 = 7</text>

  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">非强数对 4 个：(1,3)、(1,4)、(1,5)、(2,5) —— 大数都超过小数的 2 倍</text>
</svg>
