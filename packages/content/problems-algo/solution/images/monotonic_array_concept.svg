<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两个布尔标志同时追踪递增与递减</text>

  <!-- ====== Left: Monotone Increasing [1,2,2,3] ====== -->
  <rect x="24" y="46" width="160" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="104" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">单调递增 ✓</text>
  <text x="104" y="84" text-anchor="middle" font-size="10" fill="#888">[1, 2, 2, 3]</text>

  <!-- bars: baseline y=236, heights proportional -->
  <line x1="42" y1="236" x2="170" y2="236" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="44" y="210" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="184" width="28" height="52" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="116" y="184" width="28" height="52" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="158" width="28" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="166" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- trend arrow: up -->
  <path d="M 50 248 Q 100 254 166 160" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="104" y="250" text-anchor="middle" font-size="9.5" fill="#4a7a3a">只升不降 → increasing=true</text>

  <!-- ====== Middle: Monotone Decreasing [6,5,4,4] ====== -->
  <rect x="196" y="46" width="160" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="276" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">单调递减 ✓</text>
  <text x="276" y="84" text-anchor="middle" font-size="10" fill="#888">[6, 5, 4, 4]</text>

  <line x1="214" y1="236" x2="342" y2="236" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="148" width="28" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="166" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="252" y="162" width="28" height="74" fill="#fff" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="288" y="176" width="28" height="60" fill="#fff" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="302" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="324" y="176" width="28" height="60" fill="#fff" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- trend arrow: down -->
  <path d="M 222 156 Q 272 150 338 180" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="250" text-anchor="middle" font-size="9.5" fill="#446688">只降不升 → decreasing=true</text>

  <!-- ====== Right: Non-monotonic [1,3,2] ====== -->
  <rect x="368" y="46" width="148" height="210" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非单调 ✗</text>
  <text x="442" y="84" text-anchor="middle" font-size="10" fill="#888">[1, 3, 2]</text>

  <line x1="386" y1="236" x2="500" y2="236" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="388" y="210" width="28" height="26" fill="#fff" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="424" y="148" width="28" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="438" y="166" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="460" y="184" width="28" height="52" fill="#fff" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="474" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- up then down arrows -->
  <path d="M 402 206 L 430 162" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <path d="M 438 158 L 466 190" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="442" y="250" text-anchor="middle" font-size="9.5" fill="#b85450">又升又降 → 两个 flag 都 false</text>

  <!-- ====== Bottom: two-flag strategy ====== -->
  <rect x="24" y="270" width="492" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一趟扫描策略：维护两个布尔标志</text>

  <!-- flag boxes -->
  <rect x="44" y="304" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="144" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">increasing = true（初值）</text>
  <text x="144" y="346" text-anchor="middle" font-size="10" fill="#555">遇到 nums[i] &lt; nums[i−1] → 置 false</text>

  <rect x="296" y="304" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="396" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">decreasing = true（初值）</text>
  <text x="396" y="346" text-anchor="middle" font-size="10" fill="#555">遇到 nums[i] &gt; nums[i−1] → 置 false</text>

  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 最终 return increasing || decreasing</text>
</svg>
