<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：0 是按位或的幺元，ans=0 起手无须特判</text>

  <!-- 数组格子 -->
  <text x="70" y="60" font-size="12" fill="#446688" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="108" y="44" width="44" height="30" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="130" y="64" text-anchor="middle" font-size="13" fill="#777">1</text>
    <rect x="152" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="174" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="196" y="44" width="44" height="30" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="218" y="64" text-anchor="middle" font-size="13" fill="#777">3</text>
    <rect x="240" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="262" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="284" y="44" width="44" height="30" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="306" y="64" text-anchor="middle" font-size="13" fill="#777">5</text>
    <rect x="328" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="350" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">绿色格子 = 偶数（x &amp; 1 == 0），参与 OR</text>

  <!-- 竖式 OR -->
  <text x="70" y="136" font-size="12" fill="#446688" filter="url(#rough2)">偶数二进制竖式：</text>
  <g filter="url(#rough2)" font-family="'Comic Sans MS', monospace" font-size="14">
    <rect x="150" y="116" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="158" y="133" fill="#4a7a3a" font-weight="bold">2 = 0 1 0</text>
    <rect x="150" y="144" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="158" y="161" fill="#4a7a3a" font-weight="bold">4 = 1 0 0</text>
    <rect x="150" y="172" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="158" y="189" fill="#4a7a3a" font-weight="bold">6 = 1 1 0</text>
    <path d="M 150 202 L 260 202" stroke="#446688" stroke-width="1.6"/>
    <rect x="150" y="208" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="158" y="226" fill="#446688" font-weight="bold">6 = 1 1 0</text>
  </g>
  <path d="M 270 160 L 306 160" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="318" y="156" font-size="11" fill="#b85450" filter="url(#rough2)">最低位全是 0</text>
  <text x="318" y="172" font-size="11" fill="#b85450" filter="url(#rough2)">OR 后仍是 0 ⇒</text>
  <text x="318" y="188" font-size="11" fill="#b85450" filter="url(#rough2)">偶数的或还是偶数</text>

  <!-- 幺元说明 -->
  <rect x="40" y="252" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">ans 初始为 0：0 | x = x，任何偶数首次命中直接接管</text>
  <text x="260" y="289" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">无偶数 ⇒ ans 原封不动 = 0，恰是题目要求的返回值</text>

  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">一遍扫描 + O(1) 空间：筛选（判偶）与累积（|=）同轮完成</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">⚠️ 别用错运算：连乘/异或/与都不是本题语义，累积器选「|」</text>
</svg>
