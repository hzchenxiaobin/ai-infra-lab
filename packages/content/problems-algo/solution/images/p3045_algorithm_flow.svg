<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="448" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 words，插入即查询</text>

  <!-- A start -->
  <rect x="160" y="34" width="200" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">取下一个单词 w（从左到右）</text>
  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B init -->
  <rect x="165" y="88" width="190" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur = root；s = 0</text>
  <path d="M 260 118 L 260 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- C loop body -->
  <rect x="140" y="138" width="240" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">k = 0 … L−1：</text>
  <text x="260" y="169" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">code = ( w[k], w[L−1−k] ) 首尾配对</text>
  <path d="M 260 176 L 260 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D decision -->
  <polygon points="260,198 352,232 260,266 168,232" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cur 有 code</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">子节点？</text>
  <text x="356" y="226" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 352 232 L 406 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="410" y="215" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="475" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">新建子节点（cnt=0）</text>
  <path d="M 475 249 L 475 296 L 386 296" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- E advance & accumulate -->
  <rect x="140" y="278" width="240" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">cur = 子节点</text>
  <text x="260" y="309" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">s += cnt[cur]（沿途累加）</text>

  <!-- k loop back -->
  <path d="M 140 296 L 66 296 L 66 157 L 134 157" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="66" y="146" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">k 循环 ↺</text>

  <path d="M 260 316 L 260 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- F register -->
  <rect x="140" y="334" width="240" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans += s（先累加：只算先前单词）</text>
  <text x="260" y="365" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">++cnt[cur]（后登记：保证 i &lt; j）</text>

  <!-- words loop back -->
  <path d="M 380 353 L 524 353 L 524 51 L 366 51" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="536" y="210" text-anchor="middle" font-size="9.5" fill="#446688" transform="rotate(-90 536 210)" filter="url(#rough2)">还有单词 ↺</text>

  <path d="M 260 372 L 260 388" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- G return -->
  <rect x="170" y="392" width="180" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">return ans（int64）</text>
</svg>
