<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三等分核心观察：用 1 的分布定位三段</text>

  <!-- 1-count note -->
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a">1 的总数 m = 3 → 每段 k = 1 个 1</text>

  <!-- Array cells: arr = [1,0,0,1,0,0,1,0,0] -->
  <!-- part1: indices 0,1,2 (blue) -->
  <rect x="65" y="86" width="50" height="34" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="115" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="165" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- part2: indices 3,4,5 (green) -->
  <rect x="215" y="86" width="50" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="265" y="86" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="315" y="86" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- part3: indices 6,7,8 (orange) -->
  <rect x="365" y="86" width="50" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="415" y="86" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="465" y="86" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- Part braces + labels -->
  <path d="M 65 128 L 65 136 L 215 136 L 215 128" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">part1 (0..2)</text>

  <path d="M 215 128 L 215 136 L 365 136 L 365 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="290" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">part2 (3..5)</text>

  <path d="M 365 128 L 365 136 L 515 136 L 515 128" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">part3 (6..8)</text>

  <!-- trailing zeros bracket on part3 (cells 7,8) -->
  <path d="M 415 174 L 415 182 L 515 182 L 515 174" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="465" y="198" text-anchor="middle" font-size="11" fill="#b85450">trailing = 2</text>

  <!-- trailing zeros on part1 (cells 1,2) -->
  <path d="M 115 174 L 115 182 L 215 182 L 215 174" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="165" y="198" text-anchor="middle" font-size="11" fill="#b85450">同样留 2 个 0</text>

  <!-- trailing zeros on part2 (cells 4,5) -->
  <path d="M 265 174 L 265 182 L 365 182 L 365 174" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="315" y="198" text-anchor="middle" font-size="11" fill="#b85450">同样留 2 个 0</text>

  <!-- trailing formula -->
  <rect x="60" y="216" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="234" text-anchor="middle" font-size="12" fill="#333">第三段末尾 0 锁定三段：trailing = n − 1 − ones[−1]</text>
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#888">第三段在数组末尾，其末尾 0 个数客观固定，前两段必须照搬</text>

  <!-- cut point formula -->
  <rect x="60" y="272" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i = ones[k−1] + trailing  =  0 + 2 = 2</text>
  <text x="290" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j = ones[2k−1] + trailing + 1  =  3 + 2 + 1 = 6</text>

  <!-- leading zero note -->
  <rect x="60" y="344" width="460" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠️ 切分点定下后仍须逐位比较三段（从首个 1 起）</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#888">前导零可忽略，但 1 之间的 0 分布必须完全一致</text>
</svg>
