<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">限制的 V 形包络与下包络（真实上界）</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#888">每个限制生成一个 ±1 斜率的 V 形上界，所有 V 的逐点最小 = 建筑能到的最高高度</text>

  <!-- ===== Plot area ===== -->
  <!-- axes -->
  <line x1="60" y1="300" x2="480" y2="300" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="60" y1="300" x2="60" y2="70" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- y-axis labels (height) -->
  <g font-size="9" fill="#999" text-anchor="end">
    <text x="54" y="304">0</text>
    <text x="54" y="276">1</text>
    <text x="54" y="248">2</text>
    <text x="54" y="220">3</text>
    <text x="54" y="192">4</text>
    <text x="54" y="164">5</text>
    <text x="54" y="136">6</text>
  </g>
  <!-- x-axis labels (building id 1..10), center x = 70 + (i-1)*44 -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="70" y="316">1</text>
    <text x="114" y="316">2</text>
    <text x="158" y="316">3</text>
    <text x="202" y="316">4</text>
    <text x="246" y="316">5</text>
    <text x="290" y="316">6</text>
    <text x="334" y="316">7</text>
    <text x="378" y="316">8</text>
    <text x="422" y="316">9</text>
    <text x="466" y="316">10</text>
  </g>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#777">建筑编号 id</text>
  <text x="22" y="185" font-size="10" fill="#777" transform="rotate(-90 22 185)">高度 h</text>

  <!-- gridlines (faint horizontal) -->
  <g stroke="#eee" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="272" x2="480" y2="272"/>
    <line x1="60" y1="244" x2="480" y2="244"/>
    <line x1="60" y1="216" x2="480" y2="216"/>
    <line x1="60" y1="188" x2="480" y2="188"/>
    <line x1="60" y1="160" x2="480" y2="160"/>
    <line x1="60" y1="132" x2="480" y2="132"/>
  </g>

  <!-- ===== V-envelopes (faint dashed) ===== -->
  <!-- env from (1,0): h = id-1, y = 300 - (id-1)*28 -->
  <polyline points="70,300 114,272 158,244 202,216 246,188 290,160 334,132 378,104 422,76 466,48"
    fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.45" filter="url(#rough2)"/>
  <text x="470" y="50" font-size="9" fill="#446688">env(1,0)</text>

  <!-- env from (5,3): h = 3+|id-5|, vertex (246,216) -->
  <polyline points="70,132 114,160 158,188 202,204 246,216 290,204 334,188 378,160 422,132 466,104"
    fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.45" filter="url(#rough2)"/>
  <text x="470" y="106" font-size="9" fill="#d6a040">env(5,3)</text>

  <!-- env from (10,3): h = 3+|id-10|, vertex (466,216) -->
  <polyline points="246,76 290,104 334,132 378,160 422,188 466,216"
    fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.45" filter="url(#rough2)"/>
  <text x="470" y="220" font-size="9" fill="#b85450">env(10,3)</text>

  <!-- env from (7,4): h = 4+|id-7|, vertex (334,188) -->
  <polyline points="202,76 246,104 290,160 334,188 378,160 422,104 466,76"
    fill="none" stroke="#9a6abf" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.35" filter="url(#rough2)"/>

  <!-- ===== Lower envelope (bold green) ===== -->
  <!-- points: 70,300 114,272 158,244 202,216 246,216 290,188 334,188 378,160 422,188 466,216 -->
  <polyline points="70,300 114,272 158,244 202,216 246,216 290,188 334,188 378,160 422,188 466,216"
    fill="none" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>

  <!-- restriction points on lower envelope -->
  <g filter="url(#rough2)">
    <circle cx="70" cy="300" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="114" cy="272" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="246" cy="216" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="334" cy="188" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="466" cy="216" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>

  <!-- peak marker at building 8 (378, 160) = height 5 -->
  <g filter="url(#rough2)">
    <circle cx="378" cy="160" r="6" fill="#4a7a3a" stroke="#2e5e1e" stroke-width="2"/>
  </g>
  <text x="378" y="148" text-anchor="middle" font-size="11" fill="#2e5e1e" font-weight="bold">峰=5</text>

  <!-- lower envelope label -->
  <text x="150" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">下包络 = 真实上界 bound(x)</text>

  <!-- ===== Legend box (right side) ===== -->
  <g filter="url(#rough2)">
    <rect x="510" y="78" width="220" height="148" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="620" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">图例</text>
  <g font-size="10" fill="#444">
    <g filter="url(#rough2)">
      <line x1="524" y1="116" x2="556" y2="116" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.6"/>
    </g>
    <text x="564" y="119">V 形包络（单个限制）</text>
    <g filter="url(#rough2)">
      <line x1="524" y1="138" x2="556" y2="138" stroke="#4a7a3a" stroke-width="2.8"/>
    </g>
    <text x="564" y="141">下包络（真实上界）</text>
    <g filter="url(#rough2)">
      <circle cx="540" cy="160" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    </g>
    <text x="564" y="163">限制点（收紧后）</text>
    <g filter="url(#rough2)">
      <circle cx="540" cy="182" r="6" fill="#4a7a3a" stroke="#2e5e1e" stroke-width="2"/>
    </g>
    <text x="564" y="185">峰值（最高建筑）</text>
    <text x="524" y="208" font-size="9" fill="#888">两限制间峰高 =</text>
    <text x="524" y="220" font-size="9" fill="#4a7a3a" font-weight="bold">⌊(h₁+h₂+d)/2⌋</text>
  </g>

  <!-- ===== Key insight box (bottom) ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="352" width="680" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="70" y="376" font-size="12" font-weight="bold" fill="#2e6e2e">核心洞察</text>
  <g font-size="11" fill="#444">
    <text x="70" y="396">① 限制 [id, h] 施加 V 形上界包络：bound(x) ≤ h + |x − id|（相邻差 ≤ 1 的直接推论）</text>
    <text x="70" y="414">② 真实上界 = 所有钱包络的逐点最小（下包络）；排序后两趟传播 O(m) 算出所有限制点的紧上界</text>
    <text x="70" y="432" fill="#b85450" font-weight="bold">③ 两限制间的峰值 = ⌊(h₁ + h₂ + d)/2⌋，末段峰值 = h_last + (n − id_last)</text>
  </g>
</svg>
