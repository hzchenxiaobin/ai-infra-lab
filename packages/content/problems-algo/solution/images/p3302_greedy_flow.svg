<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">两趟扫描：先建 suf 表，再带预算贪心</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">免死金牌（至多一次修改）：精确匹配闭眼收，动刀之前验后路</text>

  <!-- 开始 -->
  <rect x="200" y="50" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="68.5" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：j=0，used=false</text>

  <path d="M 260 78 L 260 90" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段一 -->
  <rect x="150" y="92" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">阶段一：i 从 n−1 → 0（从右往左）</text>
  <text x="260" y="127" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">一趟填 suf：word2 最长后缀 ⊂ word1[i:] 的长度</text>

  <path d="M 260 136 L 260 148" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体边界 -->
  <rect x="100" y="152" width="400" height="246" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="106" y="330" font-size="9.5" fill="#999" transform="rotate(-90 106 330)" filter="url(#rough2)">（循环体）</text>

  <!-- 阶段二循环头（骑在边界上） -->
  <rect x="150" y="152" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">阶段二：for i = 0..n−1（j &lt; m）</text>

  <path d="M 260 184 C 260 196, 234 194, 213 202" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：字符相等？ -->
  <polygon points="210,204 290,236 210,268 130,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="232" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">word1[i]==word2[j]?</text>
  <text x="210" y="247" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">字符相等？</text>

  <path d="M 290 236 L 306 236" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="228" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="310" y="212" width="182" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="401" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">精确收下：ans += i，j++</text>
  <text x="401" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">交换论证——收下永不亏</text>
  <text x="401" y="256" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">→ i++ 继续扫</text>

  <path d="M 210 268 L 210 286" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 菱形2：动刀判定 -->
  <polygon points="210,290 294,320 210,350 126,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="316" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">预算未花 且</text>
  <text x="210" y="332" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">suf[i+1] ≥ m−j−1 ?</text>

  <path d="M 294 320 L 306 320" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="310" y="296" width="182" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="401" y="314" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">动刀收下：ans += i，j++</text>
  <text x="401" y="328" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">used = true；剩余由 suf 担保</text>
  <text x="401" y="340" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">原样接完 → i++ 继续扫</text>

  <path d="M 210 350 L 210 358" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="362" width="100" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="379" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过 i</text>

  <!-- 易错点（左侧，循环体外） -->
  <rect x="28" y="216" width="100" height="136" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="236" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">⚠ 易错点</text>
  <text x="78" y="254" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">① 动刀前必验</text>
  <text x="78" y="268" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">suf：改完后</text>
  <text x="78" y="282" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">剩余必须零失配</text>
  <text x="78" y="300" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">② 纯匹配可行时</text>
  <text x="78" y="314" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">也可能动刀换</text>
  <text x="78" y="328" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">更小下标：</text>
  <text x="78" y="342" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">ba / a → [0]</text>

  <!-- 出循环 -->
  <path d="M 260 398 C 260 410, 238 412, 213 421" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="410" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个分支收尾后 i++ 回到循环顶；i 走完或 j==m 出循环</text>

  <!-- 最终判定 -->
  <polygon points="210,424 282,452 210,480 138,452" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="448" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">j == m ?</text>
  <text x="210" y="462" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">m 个全收齐？</text>

  <path d="M 282 452 L 302 452" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="444" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="306" y="437" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="358" y="456" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <path d="M 138 452 L 108 452 L 108 484" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="444" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="56" y="488" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="106" y="506" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">返回 []</text>
</svg>
