<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "111000" → 逐位比对两种目标</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">misA = 与「0101…」错位数，misB = 与「1010…」错位数</text>

  <!-- Header row -->
  <rect x="20" y="56" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="74">i</text>
    <text x="130" y="74">s[i]</text>
    <text x="210" y="74">A[i]</text>
    <text x="290" y="74">A 匹配?</text>
    <text x="380" y="74">B[i]</text>
    <text x="460" y="74">B 匹配?</text>
    <text x="550" y="74">说明</text>
  </g>

  <!-- Row i=0: s=1, A=0(✗), B=1(✓) -->
  <rect x="20" y="88" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="106" fill="#555" font-weight="bold">0</text>
    <text x="130" y="106" fill="#d6a040" font-weight="bold">1</text>
    <text x="210" y="106" fill="#555" font-weight="bold">0</text>
    <text x="290" y="106" fill="#b85450" font-weight="bold">✗</text>
    <text x="380" y="106" fill="#555" font-weight="bold">1</text>
    <text x="460" y="106" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="550" y="106" fill="#888" font-size="9">A错位:1</text>
  </g>

  <!-- Row i=1: s=1, A=1(✓), B=0(✗) -->
  <rect x="20" y="118" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="136" fill="#555" font-weight="bold">1</text>
    <text x="130" y="136" fill="#d6a040" font-weight="bold">1</text>
    <text x="210" y="136" fill="#555" font-weight="bold">1</text>
    <text x="290" y="136" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="380" y="136" fill="#555" font-weight="bold">0</text>
    <text x="460" y="136" fill="#b85450" font-weight="bold">✗</text>
    <text x="550" y="136" fill="#888" font-size="9">B错位:1</text>
  </g>

  <!-- Row i=2: s=1, A=0(✗), B=1(✓) -->
  <rect x="20" y="148" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="166" fill="#555" font-weight="bold">2</text>
    <text x="130" y="166" fill="#d6a040" font-weight="bold">1</text>
    <text x="210" y="166" fill="#555" font-weight="bold">0</text>
    <text x="290" y="166" fill="#b85450" font-weight="bold">✗</text>
    <text x="380" y="166" fill="#555" font-weight="bold">1</text>
    <text x="460" y="166" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="550" y="166" fill="#888" font-size="9">A错位:1</text>
  </g>

  <!-- Row i=3: s=0, A=1(✗), B=0(✓) -->
  <rect x="20" y="178" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="196" fill="#555" font-weight="bold">3</text>
    <text x="130" y="196" fill="#d6a040" font-weight="bold">0</text>
    <text x="210" y="196" fill="#555" font-weight="bold">1</text>
    <text x="290" y="196" fill="#b85450" font-weight="bold">✗</text>
    <text x="380" y="196" fill="#555" font-weight="bold">0</text>
    <text x="460" y="196" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="550" y="196" fill="#888" font-size="9">A错位:0</text>
  </g>

  <!-- Row i=4: s=0, A=0(✓), B=1(✗) -->
  <rect x="20" y="208" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="226" fill="#555" font-weight="bold">4</text>
    <text x="130" y="226" fill="#d6a040" font-weight="bold">0</text>
    <text x="210" y="226" fill="#555" font-weight="bold">0</text>
    <text x="290" y="226" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="380" y="226" fill="#555" font-weight="bold">1</text>
    <text x="460" y="226" fill="#b85450" font-weight="bold">✗</text>
    <text x="550" y="226" fill="#888" font-size="9">B错位:0</text>
  </g>

  <!-- Row i=5: s=0, A=1(✗), B=0(✓) -->
  <rect x="20" y="238" width="580" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="256" fill="#555" font-weight="bold">5</text>
    <text x="130" y="256" fill="#d6a040" font-weight="bold">0</text>
    <text x="210" y="256" fill="#555" font-weight="bold">1</text>
    <text x="290" y="256" fill="#b85450" font-weight="bold">✗</text>
    <text x="380" y="256" fill="#555" font-weight="bold">0</text>
    <text x="460" y="256" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="550" y="256" fill="#888" font-size="9">A错位:0</text>
  </g>

  <!-- Summary header -->
  <text x="30" y="288" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">汇总</text>

  <!-- Pattern A summary -->
  <rect x="40" y="296" width="260" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">模式A "010101"</text>
  <text x="170" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">misA = 4（2个1错位 + 2个0错位）</text>
  <text x="170" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">swapsA = 4 / 2 = 2</text>

  <!-- Pattern B summary -->
  <rect x="320" y="296" width="260" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">模式B "101010"</text>
  <text x="450" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">misB = 2（1个1错位 + 1个0错位）</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">swapsB = 2 / 2 = 1</text>

  <!-- arrow down -->
  <path d="M 310 356 L 310 380" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- min result box -->
  <rect x="130" y="384" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="407" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(swapsA, swapsB) = min(2, 1) = 1 ✓</text>
</svg>
