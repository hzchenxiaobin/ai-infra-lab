<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：backtrack(cell, d)</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">清扫本格 → 标记 → 四方向轮试 → 回溯返回</text>

  <!-- Entry: backtrack(cell=(0,0), d=0) -->
  <rect x="80" y="54" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">进入 backtrack(cell, d)</text>
  <text x="270" y="88" text-anchor="middle" font-size="10.5" fill="#555">cell = 当前相对坐标，d = 当前朝向</text>

  <path d="M 270 96 L 270 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 1: clean + visited.add -->
  <rect x="80" y="114" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① robot.clean() ; visited.add(cell)</text>
  <text x="270" y="152" text-anchor="middle" font-size="10.5" fill="#555">清扫并标记本格已访问</text>

  <path d="M 270 162 L 270 176" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop: for i in 0..3 -->
  <polygon points="270,180 380,220 270,260 160,220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; 4 ?</text>
  <text x="270" y="234" text-anchor="middle" font-size="10.5" fill="#777">new_d = (d+i) % 4</text>

  <!-- No -> return (loop done) -->
  <path d="M 380 220 L 470 220 L 470 268" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="396" y="212" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="400" y="272" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">四向试完</text>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return</text>
  <text x="460" y="328" text-anchor="middle" font-size="9.5" fill="#888">回到上一层</text>

  <!-- Yes -> compute new_cell -->
  <path d="M 270 260 L 270 280" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="284" y="276" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="80" y="284" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">new_cell = cell + dirs[new_d]</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#555">dirs = [↑(-1,0), →(0,1), ↓(1,0), ←(0,-1)]</text>

  <path d="M 270 324 L 270 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Decision: not visited and move()? -->
  <polygon points="270,344 380,384 270,424 160,384" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">未访问 且</text>
  <text x="270" y="396" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">robot.move()?</text>

  <!-- Yes (left): recurse + go_back -->
  <path d="M 160 384 L 70 384 L 70 432" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="78" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="14" y="436" width="112" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="456" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">backtrack</text>
  <text x="70" y="471" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(new_cell, new_d)</text>
  <text x="70" y="486" text-anchor="middle" font-size="9.5" fill="#4a7a3a">→ go_back()</text>

  <!-- No (right): skip -->
  <path d="M 380 384 L 430 384 L 430 432" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="398" y="376" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="372" y="436" width="116" height="48" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="456" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">跳过此向</text>
  <text x="430" y="472" text-anchor="middle" font-size="9.5" fill="#888">（已访 / 撞墙）</text>

  <!-- both branches merge to turnRight -->
  <path d="M 70 492 L 70 504 L 250 504" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 430 484 L 430 504 L 250 504" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- turnRight box -->
  <rect x="150" y="436" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="456" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">robot.turnRight()</text>
  <text x="210" y="472" text-anchor="middle" font-size="9.5" fill="#888">切到下一方向</text>
  <path d="M 210 436 L 210 420 L 210 384" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="218" y="412" font-size="9.5" fill="#888" font-style="italic">回循环顶</text>
</svg>
