<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="600" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最小面积矩形 II：算法流程</text>

  <!-- Step 1: enumerate pairs -->
  <rect x="60" y="40" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">枚举所有点对 (i, j)，i &lt; j</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">共 C(n,2) 对，每对视为一条「候选对角线」</text>

  <path d="M 230 100 L 230 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 2: compute key -->
  <rect x="60" y="122" width="340" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="144" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">计算分组键 key</text>
  <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="#555">cx = xᵢ + xⱼ，cy = yᵢ + yⱼ（和，非中点）</text>
  <text x="230" y="178" text-anchor="middle" font-size="10.5" fill="#555">d² = (xᵢ−xⱼ)² + (yᵢ−yⱼ)²　全整数，无浮点</text>

  <path d="M 230 190 L 230 208" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 3: group by key -->
  <rect x="60" y="212" width="340" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">按 key 分组：map[key] → 点对列表</text>
  <text x="230" y="252" text-anchor="middle" font-size="10.5" fill="#555">同组 = 共中点 + 等长 → 可配成矩形</text>

  <path d="M 230 266 L 230 284" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Outer loop: each group -->
  <rect x="60" y="288" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="308" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for each group（同 key 的点对集）</text>
  <text x="230" y="324" text-anchor="middle" font-size="10.5" fill="#555">遍历每个分组</text>

  <path d="M 230 336 L 230 354" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: group size >= 2? -->
  <polygon points="230,358 370,400 230,442 90,400" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="396" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">组内 ≥ 2 对?</text>
  <text x="230" y="414" text-anchor="middle" font-size="10" fill="#777">能配成矩形?</text>

  <!-- No branch -->
  <path d="M 90 400 L 40 400 L 40 440" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="50" y="393" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="2" y="444" width="76" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="466" text-anchor="middle" font-size="10.5" fill="#555">跳过</text>

  <!-- Yes branch -->
  <path d="M 370 400 L 410 400 L 410 440" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="382" y="393" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Inner: enumerate pair-of-pairs -->
  <rect x="300" y="444" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="464" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">取两对 (d₁,d₂)</text>
  <text x="370" y="478" text-anchor="middle" font-size="9.5" fill="#555">area = ½|d₁×d₂|</text>
  <text x="370" y="492" text-anchor="middle" font-size="9.5" fill="#82b366">更新 min</text>

  <!-- loop back arrows -->
  <path d="M 40 480 L 40 520 L 20 520 L 20 308 L 58 308" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="12" y="410" font-size="9" fill="#aaa" transform="rotate(-90 12 410)">下一组</text>

  <path d="M 440 500 L 440 530 L 420 530 L 420 464 L 442 464" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="424" y="520" font-size="9" fill="#aaa">下两对</text>

  <!-- final -->
  <rect x="110" y="548" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="571" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return min == ∞ ? 0 : min</text>
</svg>
