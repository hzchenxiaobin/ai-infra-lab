<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐行读 → 判合法性 → 判全等 → 判两等 → 兜底</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#888">CASE 自上而下短路匹配：任一分支命中即返回，不再看后续条件</text>

  <!-- start box -->
  <rect x="170" y="60" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM Triangles</text>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#555">逐行读入 (A, B, C)</text>

  <path d="M 260 100 L 260 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: validity -->
  <polygon points="260,122 392,164 260,206 128,164" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">② 任一两边之和 ≤ 第三边？</text>
  <text x="260" y="174" text-anchor="middle" font-size="9" fill="#777">(A+B≤C 或 A+C≤B 或 B+C≤A)</text>

  <path d="M 392 164 L 518 164" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="524" y="146" width="176" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="612" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Not A Triangle</text>

  <path d="M 260 206 L 260 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="222" font-size="10" fill="#888">否</text>

  <!-- diamond 2: equilateral -->
  <polygon points="260,228 392,270 260,312 128,270" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">③ 三边全等？</text>
  <text x="260" y="280" text-anchor="middle" font-size="9" fill="#777">(A=B 且 B=C)</text>

  <path d="M 392 270 L 518 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="452" y="262" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>

  <rect x="524" y="252" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="612" y="274" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Equilateral（等边）</text>

  <path d="M 260 312 L 260 334" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="328" font-size="10" fill="#888">否</text>

  <!-- diamond 3: isosceles -->
  <polygon points="260,334 392,376 260,418 128,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">④ 恰有两边相等？</text>
  <text x="260" y="386" text-anchor="middle" font-size="9" fill="#777">(A=B 或 B=C 或 A=C)</text>

  <path d="M 392 376 L 518 376" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="452" y="368" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <rect x="524" y="358" width="176" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="612" y="380" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Isosceles（等腰）</text>

  <path d="M 260 418 L 260 440" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="434" font-size="10" fill="#888">否</text>

  <!-- else: scalene -->
  <rect x="170" y="440" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="462" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ ELSE → Scalene（不等边）</text>

  <!-- bottom notes -->
  <text x="360" y="492" text-anchor="middle" font-size="9.5" fill="#bbb">四个分支互斥且完备：每行恰好命中一类；等腰分支无需排除全等——已被上方拦截（短路）</text>
</svg>
