<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：横边（非树边）闭合一个环</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">从源点 s 做 BFS · 环长 = dist[u] + dist[v] + 1</text>

  <!-- ===== BFS tree edges (blue solid) ===== -->
  <line x1="108" y1="212" x2="200" y2="153" stroke="#446688" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <line x1="108" y1="228" x2="200" y2="287" stroke="#446688" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <line x1="232" y1="145" x2="325" y2="145" stroke="#446688" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <line x1="232" y1="295" x2="325" y2="295" stroke="#446688" stroke-width="1.9" fill="none" filter="url(#rough2)"/>

  <!-- ===== cross edge u-v (red dashed) ===== -->
  <path d="M 345 163 Q 432 220 345 277" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,3" fill="none" filter="url(#rough2)"/>
  <text x="445" y="226" font-size="11" fill="#b85450" font-weight="bold">横边</text>
  <text x="445" y="240" font-size="9.5" fill="#b85450">(非树边)</text>

  <!-- ===== Nodes ===== -->
  <!-- s (level 0) -->
  <circle cx="90" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">s</text>
  <text x="90" y="258" text-anchor="middle" font-size="10" fill="#888">dist=0</text>

  <!-- a, b (level 1) -->
  <circle cx="216" cy="145" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">a</text>
  <text x="216" y="125" text-anchor="middle" font-size="10" fill="#888">dist=1</text>

  <circle cx="216" cy="295" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">b</text>
  <text x="216" y="325" text-anchor="middle" font-size="10" fill="#888">dist=1</text>

  <!-- u, v (level 2) -->
  <circle cx="341" cy="145" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="341" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">u</text>
  <text x="341" y="125" text-anchor="middle" font-size="10" fill="#b85450">dist=2</text>

  <circle cx="341" cy="295" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="341" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">v</text>
  <text x="341" y="325" text-anchor="middle" font-size="10" fill="#b85450">dist=2</text>

  <!-- ===== Cycle decomposition (left-bottom) ===== -->
  <text x="40" y="370" font-size="11.5" fill="#4a7a3a" font-weight="bold">环 = 路径 s⇝u (2) + 路径 s⇝v (2) + 边(u,v)</text>

  <!-- ===== Formula box (right-bottom) ===== -->
  <rect x="355" y="350" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="370" text-anchor="middle" font-size="11.5" fill="#666">环长 =</text>
  <text x="445" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">dist[u]+dist[v]+1 = 5</text>

  <!-- footnote -->
  <text x="280" y="404" text-anchor="middle" font-size="9.5" fill="#aaa">跳过 v == parent[u]：避免把「来的那条树边」当成环走回去</text>
</svg>
