<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="araw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#333" filter="url(#rough2)">示例 1 演算：grid = [[1,1],[3,4]]</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（按值从大到小计算 dfs，保证更大邻居已算好）</text>

  <!-- 四张步骤卡 -->
  <!-- 卡 1 -->
  <rect x="16" y="62" width="116" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#b85450" filter="url(#rough2)">步骤 1</text>
  <text x="74" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">格子 (1,1)</text>
  <text x="74" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 = 4</text>
  <text x="74" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">更大邻居：</text>
  <text x="74" y="158" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">无</text>
  <text x="74" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dfs = 1</text>
  <text x="74" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#b85450" filter="url(#rough2)">dp = 1</text>

  <!-- 卡 2 -->
  <rect x="140" y="62" width="116" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="198" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#d6a040" filter="url(#rough2)">步骤 2</text>
  <text x="198" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">格子 (1,0)</text>
  <text x="198" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 = 3</text>
  <text x="198" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">更大邻居：</text>
  <text x="198" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,1)=4 ✓</text>
  <text x="198" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + dp(1,1)</text>
  <text x="198" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#d6a040" filter="url(#rough2)">dp = 2</text>

  <!-- 卡 3 -->
  <rect x="264" y="62" width="116" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="322" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#446688" filter="url(#rough2)">步骤 3</text>
  <text x="322" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">格子 (0,1)</text>
  <text x="322" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 = 1</text>
  <text x="322" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">更大邻居：</text>
  <text x="322" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,1)=4 ✓</text>
  <text x="322" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + dp(1,1)</text>
  <text x="322" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#446688" filter="url(#rough2)">dp = 2</text>

  <!-- 卡 4 -->
  <rect x="388" y="62" width="116" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4a7a3a" filter="url(#rough2)">步骤 4</text>
  <text x="446" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">格子 (0,0)</text>
  <text x="446" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 = 1</text>
  <text x="446" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">更大邻居：</text>
  <text x="446" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,0)=3 ✓</text>
  <text x="446" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + dp(1,0)</text>
  <text x="446" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#4a7a3a" filter="url(#rough2)">dp = 3</text>

  <!-- 卡间箭头 -->
  <path d="M132,137 L138,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#araw)" filter="url(#rough2)"/>
  <path d="M256,137 L262,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#araw)" filter="url(#rough2)"/>
  <path d="M380,137 L386,137" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#araw)" filter="url(#rough2)"/>

  <!-- 底部：带 dp 标注的网格 -->
  <text x="120" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#333" filter="url(#rough2)">最终 dp 值</text>

  <!-- (0,0) dp=3 -->
  <rect x="70" y="266" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="98" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值1</text>
  <text x="98" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="98" y="338" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(0,0)</text>

  <!-- (0,1) dp=2 -->
  <rect x="134" y="266" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="162" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值1</text>
  <text x="162" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#446688" filter="url(#rough2)">2</text>
  <text x="162" y="338" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(0,1)</text>

  <!-- (1,0) dp=2 -->
  <rect x="70" y="330" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="98" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值3</text>
  <text x="98" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#d6a040" filter="url(#rough2)">2</text>

  <!-- (1,1) dp=1 -->
  <rect x="134" y="330" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="162" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值4</text>
  <text x="162" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 求和说明 -->
  <rect x="250" y="266" width="254" height="120" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="377" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#333" filter="url(#rough2)">每格 dp = 以其为起点的路径数</text>
  <text x="266" y="320" font-size="12" fill="#333" filter="url(#rough2)">(0,0): [1],[1→3],[1→3→4] = 3</text>
  <text x="266" y="338" font-size="12" fill="#333" filter="url(#rough2)">(0,1): [1],[1→4] = 2</text>
  <text x="266" y="356" font-size="12" fill="#333" filter="url(#rough2)">(1,0): [3],[3→4] = 2 ; (1,1): [4] = 1</text>
  <text x="377" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#b85450" filter="url(#rough2)">Σ = 1+2+2+3 = 8</text>
</svg>
