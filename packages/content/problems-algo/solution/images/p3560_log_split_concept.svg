<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：恰好切一刀，且切得越不均积越小</text>

  <text x="40" y="46" font-size="11" fill="#888" filter="url(#rough2)">以 n = 6, m = 5, k = 5 为例：</text>

  <!-- 木材 n：超限，切一刀 -->
  <text x="40" y="68" font-size="11" fill="#8a6d3a" filter="url(#rough2)">木材 n = 6 &gt; k，必须切一刀：</text>
  <rect x="40" y="76" width="25" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="65" y="76" width="125" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="127" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <line x1="65" y1="72" x2="65" y2="104" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="59" y="70" font-size="11" fill="#b85450" filter="url(#rough2)">✂</text>
  <text x="40" y="118" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">成本 = 1 × 5 = 5</text>

  <!-- 木材 m：直接装车 -->
  <text x="310" y="68" font-size="11" fill="#2a5a2a" filter="url(#rough2)">木材 m = 5 ≤ k：</text>
  <rect x="310" y="76" width="125" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <text x="310" y="118" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">不切，成本 0</text>

  <!-- 三辆卡车 -->
  <text x="40" y="144" font-size="11" fill="#333" filter="url(#rough2)">切完共 3 段，恰好装满 3 辆卡车（每车最多一段，且长度 ≤ k）：</text>

  <rect x="40" y="156" width="145" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">卡车①</text>
  <rect x="87" y="178" width="50" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <text x="112" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">来自 n 的切段</text>

  <rect x="187" y="156" width="145" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">卡车②</text>
  <rect x="234" y="178" width="50" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="259" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">来自 n 的切段</text>

  <rect x="334" y="156" width="145" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">卡车③</text>
  <rect x="381" y="178" width="50" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <text x="406" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">m 原装上车</text>

  <!-- 切分方案对比 -->
  <text x="40" y="246" font-size="11" fill="#333" filter="url(#rough2)">固定和 len₁ + len₂ = 6，积随切点变化：</text>

  <rect x="40" y="258" width="145" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="112" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1 + 5</text>
  <text x="112" y="295" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1 × 5 = 5 ✓ 最小</text>

  <rect x="187" y="258" width="145" height="46" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="277" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">2 + 4</text>
  <text x="259" y="295" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2 × 4 = 8</text>

  <rect x="334" y="258" width="145" height="46" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="277" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">3 + 3</text>
  <text x="406" y="295" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3 × 3 = 9（最大）</text>

  <!-- 结论 -->
  <rect x="55" y="320" width="410" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">两根都 ≤ k → 0；恰一根 x &gt; k → k·(x−k)</text>
  <text x="260" y="361" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">两根都 &gt; k 时至少两刀、4 段 &gt; 3 车 → 无解（题目保证不出现）</text>
</svg>
