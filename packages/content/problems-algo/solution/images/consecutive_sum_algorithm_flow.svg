<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 k，整除则计数</text>

  <!-- 开始 -->
  <rect x="170" y="46" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始：ans = 0, k = 1</text>

  <!-- arrow down -->
  <path d="M 260 82 L 260 98" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：k(k+1)/2 <= n ? -->
  <polygon points="260,100 380,150 260,200 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k(k+1)/2 ≤ n ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888">（保证 a ≥ 1）</text>

  <!-- No 分支 → 返回 -->
  <path d="M 380 150 L 430 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <rect x="430" y="133" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="470" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes 分支 ↓ -->
  <path d="M 260 200 L 260 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- 计算余数 -->
  <rect x="120" y="220" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r = (n − k(k−1)/2) mod k</text>

  <!-- arrow down -->
  <path d="M 260 256 L 260 272" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：r == 0 ? -->
  <polygon points="260,274 360,314 260,354 160,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r == 0 ?</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#888">（a 为整数）</text>

  <!-- Yes → ans++ -->
  <path d="M 160 314 L 110 314" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <rect x="20" y="297" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="63" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans++</text>

  <!-- ans++ 回到 k++ -->
  <path d="M 63 297 L 63 380 L 200 380" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No → 直接到 k++ -->
  <path d="M 260 354 L 260 380" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="372" font-size="11" fill="#888">No</text>

  <!-- k++ -->
  <rect x="170" y="382" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k = k + 1</text>

  <!-- 回到循环顶部 -->
  <path d="M 260 416 L 260 440 L 460 440 L 460 150 L 430 150" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="456" text-anchor="middle" font-size="10" fill="#888">回到循环条件判断</text>

  <!-- 底部说明 -->
  <rect x="40" y="472" width="440" height="36" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="494" text-anchor="middle" font-size="11" fill="#666">循环约 √(2n) 轮，每轮 O(1) → 总时间 O(√n)</text>
</svg>
