<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">计分规则：一跳 i → j 得 (j − i) × nums[i]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">跨度 × 起点值——计分看「从哪起跳」，不看「落在哪」（与 3205 落点值计分互为镜像）</text>

  <!-- 数组格子：[1,3,1,5]，4 格 w=60 gap=16，start x=116 -->
  <rect x="116" y="130" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="157" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="146" y="190" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下标0·起点</text>

  <rect x="192" y="130" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="157" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="222" y="190" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">1·更大值</text>

  <rect x="268" y="130" width="60" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="298" y="190" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <rect x="344" y="130" width="60" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="157" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="374" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3·终点</text>

  <!-- 跳 0→1 的小弧 -->
  <path d="M 146 126 Q 184 86 218 126" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="184" y="96" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">0→1：1 × 1 = 1</text>

  <!-- 跳 1→3 的大弧 -->
  <path d="M 232 120 Q 300 52 368 124" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1→3：跨度 2 × 起点值 3 = 6</text>

  <text x="260" y="215" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">总得分 = 1 + 6 = 7</text>

  <!-- 对比框 A：直达 -->
  <rect x="30" y="234" width="222" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="256" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">直达 0→3</text>
  <text x="141" y="277" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 3 × 1 = 3</text>
  <text x="141" y="297" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">起点值太小，跨得再远也白搭 ✗</text>

  <!-- 对比框 B：最优 -->
  <rect x="272" y="234" width="218" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最优 0→1→3</text>
  <text x="381" y="277" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 1×1 + 2×3 = 7</text>
  <text x="381" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">途中只在「更大值」处换脚 ✓</text>

  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对照示例 2 [4,3,1,3,2]：起点 4 右侧没有更大值，直达 0→4 一跳 4×4 = 16 最优</text>
</svg>
