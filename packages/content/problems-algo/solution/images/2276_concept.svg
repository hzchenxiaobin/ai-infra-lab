<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：有序 map 维护互不相交且不相邻的闭区间，cnt 实时累加</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">不变量：任意相邻两段间至少留 1 个整数间隙 → 长度可直接相加，无需去重</text>

  <!-- number line cells 1..11, start x=40, w=44 -->
  <!-- 1 -->
  <rect x="40" y="60" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="88" text-anchor="middle" font-size="13" fill="#999">1</text>
  <!-- 2 covered [2,3] -->
  <rect x="84" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="88" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- 3 covered -->
  <rect x="128" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- 4 -->
  <rect x="172" y="60" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="88" text-anchor="middle" font-size="13" fill="#999">4</text>
  <!-- 5 -->
  <rect x="216" y="60" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="88" text-anchor="middle" font-size="13" fill="#999">5</text>
  <!-- 6 -->
  <rect x="260" y="60" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="88" text-anchor="middle" font-size="13" fill="#999">6</text>
  <!-- 7 covered [7,10] -->
  <rect x="304" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="88" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- 8 -->
  <rect x="348" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="88" text-anchor="middle" font-size="13" fill="#333">8</text>
  <!-- 9 -->
  <rect x="392" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="414" y="88" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- 10 -->
  <rect x="436" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458" y="88" text-anchor="middle" font-size="13" fill="#333">10</text>
  <!-- 11 -->
  <rect x="480" y="60" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="502" y="88" text-anchor="middle" font-size="13" fill="#999">11</text>

  <!-- brackets below covered segments -->
  <!-- [2,3]: x 84..172 -->
  <path d="M86 112 L86 120 L170 120 L170 112" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="128" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">长度 2 = 3−2+1</text>

  <!-- [7,10]: x 304..480 -->
  <path d="M306 112 L306 120 L478 120 L478 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="392" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">长度 4 = 10−7+1</text>

  <!-- map representation -->
  <text x="60" y="178" font-size="11" fill="#666">map：</text>
  <rect x="96" y="160" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="156" y="178" text-anchor="middle" font-size="10" fill="#888">键 l → 值 r</text>
  <text x="156" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2 → 3</text>

  <rect x="248" y="160" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="308" y="178" text-anchor="middle" font-size="10" fill="#888">键 l → 值 r</text>
  <text x="308" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7 → 10</text>

  <text x="392" y="186" font-size="11" fill="#888">（按键 l 升序，红黑树）</text>

  <!-- cnt formula box -->
  <rect x="80" y="220" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="10.5" fill="#888">运行时累计 cnt</text>
  <text x="280" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cnt = Σ(r − l + 1) = 2 + 4 = 6</text>

  <!-- footer note -->
  <rect x="40" y="284" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#333">count() 直接返回 cnt → O(1)；add 时合并被覆盖的旧段并同步增减 cnt</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333">大值域 10⁹ 不铺点，只存 O(操作数) 条端点 → 稀疏区间的经典胜利</text>
</svg>
