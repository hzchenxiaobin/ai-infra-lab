<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍递增扫描的状压 DP</text>

  <!-- ① 初始化 -->
  <rect x="140" y="46" width="310" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="67" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">① 初始化：dp[0] = 0，其余 = ∞</text>
  <line x1="295" y1="80" x2="295" y2="94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 枚举 mask -->
  <rect x="140" y="98" width="310" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="117" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">② mask = 0, 1, 2, …, 2ⁿ−1 递增枚举</text>
  <text x="295" y="133" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">数值递增恰好是转移 DAG 的拓扑序</text>
  <line x1="295" y1="144" x2="295" y2="158" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 计算 x -->
  <rect x="140" y="162" width="310" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="183" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">③ x = 1 + k · popcount(mask)（已开几把，攒能就多快）</text>
  <line x1="295" y1="196" x2="295" y2="210" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 转移 -->
  <rect x="140" y="214" width="310" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="233" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 枚举不在 mask 中的每把锁 i：</text>
  <text x="295" y="250" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">dp[mask|1&lt;&lt;i] ← min(dp[mask|1&lt;&lt;i], dp[mask] + ⌈s[i]/x⌉)</text>
  <line x1="295" y1="266" x2="295" y2="280" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="295,282 395,320 295,358 195,320" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="325" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">mask 枚举完？</text>

  <!-- 否：回环 -->
  <path d="M 395 320 L 470 320 L 470 121 L 456 121" fill="none" stroke="#d6a040" stroke-width="1.8"
        stroke-dasharray="6,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="440" y="310" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">否：下一个 mask</text>

  <!-- 是：收尾 -->
  <line x1="295" y1="358" x2="295" y2="370" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="368" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="140" y="372" width="310" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="395" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑤ 返回 dp[(1&lt;&lt;n) − 1] —— 打开全部锁的最少分钟</text>

  <text x="260" y="428" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">递增枚举为何正确：转移只会去严格更大的 mask|1&lt;&lt;i，处理 mask 时它的前驱已全部定型</text>
</svg>
