<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">从「单下标」到「下标集合」：允许重复的改造</text>
  <path d="M 280 46 Q 450 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#7a5415">同一 val 可出现多次 → idx[val] 从「一个下标」升级为「一组下标」</text>

  <!-- ===== Left: 380 回顾 ===== -->
  <g filter="url(#sk)"><rect x="40" y="84" width="380" height="220" rx="10" fill="#f2f6fb" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="230" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">380：不允许重复</text>
  <text x="230" y="128" text-anchor="middle" font-size="10.5" fill="#5a7a9e">idx : val → 单个下标</text>
  <!-- vals row -->
  <text x="60" y="158" font-size="11.5" fill="#346" font-weight="bold">vals</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="100" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="122" y="166" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="144" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="166" y="166" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="188" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="210" y="166" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="232" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="254" y="166" text-anchor="middle" fill="#2b6e9e">7</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="122" y="188" text-anchor="middle">0</text>
    <text x="166" y="188" text-anchor="middle">1</text>
    <text x="210" y="188" text-anchor="middle">2</text>
    <text x="254" y="188" text-anchor="middle">3</text>
  </g>
  <!-- idx table -->
  <text x="60" y="216" font-size="11.5" fill="#346" font-weight="bold">idx</text>
  <g font-size="12" filter="url(#sk)">
    <rect x="100" y="206" width="60" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="130" y="222" text-anchor="middle" fill="#7a5415">1 → 0</text>
    <rect x="170" y="206" width="60" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="200" y="222" text-anchor="middle" fill="#7a5415">3 → 1</text>
    <rect x="240" y="206" width="60" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="270" y="222" text-anchor="middle" fill="#7a5415">5 → 2</text>
    <rect x="310" y="206" width="60" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="340" y="222" text-anchor="middle" fill="#7a5415">7 → 3</text>
  </g>
  <text x="230" y="258" text-anchor="middle" font-size="10.5" fill="#888">insert(1) 再来一次 → 拒绝（false）</text>
  <g filter="url(#sk)"><rect x="100" y="270" width="220" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  <text x="210" y="287" text-anchor="middle" font-size="10.5" fill="#b03a3a">1 已存在 → 无法记录第二个位置</text>

  <!-- arrow from 380 to 381 -->
  <path d="M 420 194 L 470 194" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="445" y="184" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">升级</text>

  <!-- ===== Right: 381 ===== -->
  <g filter="url(#sk)"><rect x="480" y="84" width="380" height="220" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="670" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">381：允许重复</text>
  <text x="670" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a">idx : val → 下标集合（set）</text>
  <!-- vals row with duplicates -->
  <text x="500" y="158" font-size="11.5" fill="#346" font-weight="bold">vals</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="540" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="562" y="166" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="584" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="606" y="166" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="628" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="650" y="166" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="672" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="694" y="166" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="716" y="146" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="738" y="166" text-anchor="middle" fill="#2b6e9e">3</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="562" y="188" text-anchor="middle">0</text>
    <text x="606" y="188" text-anchor="middle">1</text>
    <text x="650" y="188" text-anchor="middle" fill="#b03a3a">2</text>
    <text x="694" y="188" text-anchor="middle">3</text>
    <text x="738" y="188" text-anchor="middle" fill="#b03a3a">4</text>
  </g>
  <!-- idx table : sets -->
  <text x="500" y="216" font-size="11.5" fill="#346" font-weight="bold">idx</text>
  <g font-size="12" filter="url(#sk)">
    <rect x="540" y="206" width="110" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="595" y="222" text-anchor="middle" fill="#7a5415">1 → {0, 2}</text>
    <rect x="660" y="206" width="110" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="715" y="222" text-anchor="middle" fill="#7a5415">3 → {1, 4}</text>
    <rect x="780" y="206" width="70" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="815" y="222" text-anchor="middle" fill="#7a5415">5 → {3}</text>
  </g>
  <text x="670" y="258" text-anchor="middle" font-size="10.5" fill="#888">insert(1) 再来 → 接受，下标 2 加入 idx[1]</text>
  <g filter="url(#sk)"><rect x="540" y="270" width="220" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="650" y="287" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">重复值 → 多个下标存进集合</text>

  <!-- ===== Bottom: getRandom 按频次 ===== -->
  <g filter="url(#sk)"><rect x="80" y="338" width="740" height="186" rx="12" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="450" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">getRandom 按出现次数等概率返回</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#542">vals 自带重复 → 取下标即天然按频次加权，无需额外权重数组</text>

  <!-- probability bars -->
  <text x="110" y="416" font-size="11.5" fill="#346" font-weight="bold">vals =</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="160" y="404" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="182" y="422" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="204" y="404" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="226" y="422" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="248" y="404" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="270" y="422" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="292" y="404" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="314" y="422" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="336" y="404" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="358" y="422" text-anchor="middle" fill="#2b6e9e">3</text>
  </g>
  <text x="400" y="422" font-size="11" fill="#888">5 个位置 → rand() % 5 ∈ {0,1,2,3,4}</text>

  <!-- freq table -->
  <g font-size="12" filter="url(#sk)">
    <rect x="160" y="446" width="60" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="190" y="464" text-anchor="middle" fill="#2e6e2e">值 1</text>
    <rect x="220" y="446" width="60" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="250" y="464" text-anchor="middle" fill="#2e6e2e">值 3</text>
    <rect x="280" y="446" width="60" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="310" y="464" text-anchor="middle" fill="#2e6e2e">值 5</text>
  </g>
  <g font-size="11.5" fill="#346">
    <text x="370" y="464">频次: 1→2, 3→2, 5→1</text>
    <text x="370" y="484" fill="#b03a3a" font-weight="bold">P(1)=2/5, P(3)=2/5, P(5)=1/5</text>
  </g>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">关键：vals 里每个槽位 1/n 等概率 → 出现 k 次的值概率 k/n</text>

  <text x="450" y="540" text-anchor="middle" font-size="10.5" fill="#888">结构骨架与 380 完全一致，仅 idx 的 value 由 int 升级为 set&lt;int&gt;</text>
</svg>
