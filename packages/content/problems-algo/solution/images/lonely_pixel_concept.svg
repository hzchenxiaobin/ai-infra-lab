<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">孤独像素判定：B 所在行 &amp; 列均无其他 B</text>

  <!-- ===== 左：示例1 全孤独 ===== -->
  <text x="134" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例1：3 个 B 全孤独 → ans=3</text>

  <!-- 列标 -->
  <text x="98" y="84" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="134" y="84" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- 行标 -->
  <text x="68" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="68" y="149" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="68" y="185" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- 矩阵格子 36x36, origin (80,96) -->
  <!-- row 0: W W B -->
  <rect x="80" y="96" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="119" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="116" y="96" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="119" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="152" y="96" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <!-- row 1: W B W -->
  <rect x="80" y="132" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="155" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="116" y="132" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="152" y="132" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <!-- row 2: B W W -->
  <rect x="80" y="168" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="116" y="168" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="191" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="152" y="168" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="12" fill="#ccc">W</text>

  <!-- rowCount 标注（右侧） -->
  <text x="206" y="84" text-anchor="middle" font-size="9" fill="#888">行B数</text>
  <rect x="194" y="100" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="194" y="136" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="194" y="172" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- colCount 标注（下方） -->
  <text x="56" y="216" text-anchor="middle" font-size="9" fill="#888">列B数</text>
  <rect x="86" y="208" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="122" y="208" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="158" y="208" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== 右：示例2 仅1孤独 ===== -->
  <text x="394" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例2：仅 1 个孤独 → ans=1</text>

  <!-- 列标 -->
  <text x="358" y="84" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="394" y="84" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="430" y="84" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- 行标 -->
  <text x="328" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="328" y="149" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="328" y="185" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- 矩阵格子 origin (340,96) -->
  <!-- row 0: B W W -->
  <rect x="340" y="96" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="358" y="119" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">B</text>
  <rect x="376" y="96" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="394" y="119" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="412" y="96" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="119" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <!-- row 1: W B W -->
  <rect x="340" y="132" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="358" y="155" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="376" y="132" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="394" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="412" y="132" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="155" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <!-- row 2: B W W -->
  <rect x="340" y="168" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="358" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">B</text>
  <rect x="376" y="168" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="394" y="191" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="412" y="168" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="191" text-anchor="middle" font-size="12" fill="#ccc">W</text>

  <!-- rowCount 标注（右侧） -->
  <text x="466" y="84" text-anchor="middle" font-size="9" fill="#888">行B数</text>
  <rect x="454" y="100" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="466" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="454" y="136" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="466" y="151" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="454" y="172" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="466" y="187" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- colCount 标注（下方）-->
  <text x="316" y="216" text-anchor="middle" font-size="9" fill="#888">列B数</text>
  <rect x="346" y="208" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="358" y="223" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="382" y="208" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="394" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="418" y="208" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 列0 双B标注 -->
  <path d="M 358 96 L 358 78" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="358" y="74" text-anchor="middle" font-size="9" fill="#b85450">列0 有 2 个 B</text>

  <!-- 底部说明 -->
  <rect x="36" y="250" width="488" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="274" font-size="12" fill="#446688" font-weight="bold">孤独像素判定条件</text>
  <text x="56" y="296" font-size="11" fill="#555">• 像素 picture[i][j] == 'B'（黑像素）</text>
  <text x="56" y="316" font-size="11" fill="#555">• 第 i 行的 B 总数 = 1（行内唯一）</text>
  <text x="56" y="336" font-size="11" fill="#555">• 第 j 列的 B 总数 = 1（列内唯一）</text>
  <text x="56" y="356" font-size="11" fill="#b85450" font-weight="bold">三者同时满足才计入答案；示例2 的 (0,0) 和 (2,0) 因列0 有两个 B 而被排除</text>
</svg>
