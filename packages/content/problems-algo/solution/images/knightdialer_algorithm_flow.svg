<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">骑士拨号器 DP 算法流程</text>

  <!-- ===== Step 1: Algorithm Steps ===== -->
  <rect x="30" y="40" width="150" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="105" y="74" text-anchor="middle" font-size="10" fill="#333">dp[1][d] = 1</text>
  <text x="105" y="88" text-anchor="middle" font-size="9" fill="#888">∀d ∈ {0..9}</text>

  <path d="M 184 67 L 206 67" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="40" width="160" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② 递推 i = 2..n</text>
  <text x="290" y="74" text-anchor="middle" font-size="10" fill="#333">dp[d] = Σ dp[prev]</text>
  <text x="290" y="88" text-anchor="middle" font-size="9" fill="#888">prev ∈ N(d)（骑士邻居）</text>

  <path d="M 374 67 L 396 67" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="40" width="140" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ 求和返回</text>
  <text x="470" y="74" text-anchor="middle" font-size="10" fill="#333">Σ dp[n][d]</text>
  <text x="470" y="88" text-anchor="middle" font-size="9" fill="#888">mod 10⁹+7</text>

  <!-- ===== Step 2: Transition Visualization ===== -->
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">转移示例：dp[i][4] = dp[i−1][0] + dp[i−1][3] + dp[i−1][9]</text>

  <!-- Step i-1 label -->
  <text x="28" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">步 i−1</text>

  <!-- Step i-1 row: 10 digit boxes -->
  <!-- 0 (highlighted - predecessor) -->
  <rect x="52" y="136" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- 1 -->
  <rect x="98" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="119" y="155" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <!-- 2 -->
  <rect x="144" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="155" text-anchor="middle" font-size="11" fill="#aaa">2</text>
  <!-- 3 (highlighted - predecessor) -->
  <rect x="190" y="136" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 4 -->
  <rect x="236" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="257" y="155" text-anchor="middle" font-size="11" fill="#aaa">4</text>
  <!-- 5 -->
  <rect x="282" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="303" y="155" text-anchor="middle" font-size="11" fill="#aaa">5</text>
  <!-- 6 -->
  <rect x="328" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="349" y="155" text-anchor="middle" font-size="11" fill="#aaa">6</text>
  <!-- 7 -->
  <rect x="374" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="155" text-anchor="middle" font-size="11" fill="#aaa">7</text>
  <!-- 8 -->
  <rect x="420" y="136" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="441" y="155" text-anchor="middle" font-size="11" fill="#aaa">8</text>
  <!-- 9 (highlighted - predecessor) -->
  <rect x="466" y="136" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="487" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- Arrows from predecessors to digit 4 in step i -->
  <!-- 0 → 4 -->
  <path d="M 73 168 Q 120 196 255 214" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 3 → 4 -->
  <path d="M 211 168 Q 230 190 255 214" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 9 → 4 -->
  <path d="M 487 168 Q 400 196 259 214" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step i label -->
  <text x="28" y="236" font-size="11" fill="#d6a040" font-weight="bold">步 i</text>

  <!-- Step i row: 10 digit boxes -->
  <rect x="52" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="73" y="239" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="98" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="119" y="239" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <rect x="144" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="239" text-anchor="middle" font-size="11" fill="#aaa">2</text>
  <rect x="190" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="211" y="239" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <!-- 4 (highlighted - target) -->
  <rect x="236" y="220" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="282" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="303" y="239" text-anchor="middle" font-size="11" fill="#aaa">5</text>
  <rect x="328" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="349" y="239" text-anchor="middle" font-size="11" fill="#aaa">6</text>
  <rect x="374" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="239" text-anchor="middle" font-size="11" fill="#aaa">7</text>
  <rect x="420" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="441" y="239" text-anchor="middle" font-size="11" fill="#aaa">8</text>
  <rect x="466" y="220" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="239" text-anchor="middle" font-size="11" fill="#aaa">9</text>

  <!-- Annotation -->
  <text x="257" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4 的骑士邻居 = {0, 3, 9}</text>

  <!-- ===== Step 3: Formula & Rolling Array ===== -->
  <rect x="40" y="284" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">递推式：dp[i][d] = Σ dp[i−1][prev]，prev ∈ N(d)</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#888">N(d) = d 的骑士邻居集合；5 的 N(5) = ∅，故 dp[i][5] = 0 (i≥2)</text>

  <!-- Rolling array note -->
  <rect x="40" y="340" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">滚动数组：dp[i] 只依赖 dp[i−1] → 压成一维 dp[10]</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">每轮用 prev[10] 快照上一轮，原地更新 dp[10]，空间 O(1)</text>
</svg>
