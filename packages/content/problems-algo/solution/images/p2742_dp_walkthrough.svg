<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 DP 演算　cost=[1,2,3,2] time=[1,2,3,2]</text>
  <text x="270" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">物品 (w=time+1, c=cost)：(2,1)(3,2)(4,3)(3,2)　目标 dp[4]</text>

  <!-- table: 7 cols (label + j0..j4), 6 rows (header + init + 4 items) -->
  <!-- col x positions: label 60, j0 150, j1 215, j2 280, j3 345, j4 410 -->
  <!-- row y centers: header 80, init 116, item0 152, item1 188, item2 224, item3 260 -->

  <!-- header row -->
  <rect x="40" y="66" width="450" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">阶段</text>
  <text x="150" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">j=0</text>
  <text x="215" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">j=1</text>
  <text x="280" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">j=2</text>
  <text x="345" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">j=3</text>
  <text x="410" y="87" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">j=4</text>

  <!-- init row -->
  <rect x="40" y="100" width="450" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">init</text>
  <text x="150" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="121" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>
  <text x="345" y="121" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>
  <text x="410" y="121" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>

  <!-- item0 row (w=2,c=1) -->
  <rect x="40" y="134" width="450" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">物品0 (2,1)</text>
  <text x="150" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="345" y="155" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>
  <text x="410" y="155" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>

  <!-- item1 row (w=3,c=2) -->
  <rect x="40" y="168" width="450" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">物品1 (3,2)</text>
  <text x="150" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="410" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- item2 row (w=4,c=3) -->
  <rect x="40" y="202" width="450" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">物品2 (4,3)</text>
  <text x="150" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- item3 row (w=3,c=2) - highlight answer -->
  <rect x="40" y="236" width="450" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">物品3 (3,2)</text>
  <text x="150" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="257" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ✓</text>

  <!-- annotation -->
  <rect x="60" y="290" width="420" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#7a3a3a" filter="url(#rough2)">最优：选墙0(覆盖2)+墙1(覆盖3)=覆盖5堵≥4</text>
  <text x="270" y="335" text-anchor="middle" font-size="12" fill="#7a3a3a" filter="url(#rough2)">花费 cost[0]+cost[1]=1+2=3</text>
  <text x="270" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[4] = 3　（=示例输出）</text>
</svg>
