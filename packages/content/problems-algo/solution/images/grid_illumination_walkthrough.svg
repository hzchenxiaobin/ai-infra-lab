<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="660" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5, lamps=[[0,0],[4,4]], queries=[[1,1],[1,1]]</text>

  <!-- ===== 初始建表 ===== -->
  <text x="40" y="58" font-size="11.5" fill="#888" font-weight="bold">① 建表：开灯 (0,0) 与 (4,4)</text>

  <!-- 网格 5x5，每格 34，起点 (40, 68) -->
  <!-- 照亮底色：行0、行4、列0、列4、主对角 r-c=0、副对角 r+c=0(只(0,0)) 和 r+c=8(只(4,4)) -->
  <!-- 行0 全亮(行+列0+主对角) -->
  <rect x="40" y="68" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="68" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="68" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="68" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="68" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行1: 列0 + 列4 + 主对角(1,1) -->
  <rect x="40" y="102" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="102" width="34" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="102" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="102" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="102" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行2: 列0 + 列4 + 主对角(2,2) -->
  <rect x="40" y="136" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="136" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="136" width="34" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="136" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="136" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行3: 列0 + 列4 + 主对角(3,3) -->
  <rect x="40" y="170" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="170" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="170" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="170" width="34" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="170" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行4 全亮 -->
  <rect x="40" y="204" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="204" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="204" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="204" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="204" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 灯 (0,0) 和 (4,4) -->
  <circle cx="57" cy="85" r="8" fill="#d6a040" stroke="#8a5a10" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="193" cy="221" r="8" fill="#d6a040" stroke="#8a5a10" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 右侧计数表 -->
  <text x="250" y="80" font-size="11" fill="#888" font-weight="bold">计数表</text>
  <rect x="250" y="86" width="340" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="258" y="104" font-size="10.5" fill="#333">rowCnt: {0:1, 4:1}</text>
  <rect x="250" y="116" width="340" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="258" y="134" font-size="10.5" fill="#333">colCnt: {0:1, 4:1}</text>
  <rect x="250" y="146" width="340" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="258" y="164" font-size="10.5" fill="#333">diag1Cnt: {0:2}   ← (0,0)与(4,4)同主对角</text>
  <rect x="250" y="176" width="340" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="258" y="194" font-size="10.5" fill="#333">diag2Cnt: {0:1, 8:1}</text>
  <rect x="250" y="206" width="340" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="258" y="224" font-size="10.5" fill="#333">lampSet: {(0,0), (4,4)}</text>

  <path d="M 310 246 L 310 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 查询 0 ===== -->
  <text x="40" y="278" font-size="11.5" fill="#888" font-weight="bold">② 查询 [1,1]：diag1[0]=2 &gt; 0 → ans[0]=1</text>

  <!-- 网格 5x5，每格 34，起点 (40, 288) -->
  <!-- 照亮同上 -->
  <rect x="40" y="288" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="288" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="288" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="288" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="288" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="322" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- (1,1) 查询格高亮蓝框 -->
  <rect x="74" y="322" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="108" y="322" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="322" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="322" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="356" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="356" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="356" width="34" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="356" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="356" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="390" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="390" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="390" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="390" width="34" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="390" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="424" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="74" y="424" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="424" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="424" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="176" y="424" width="34" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 灯 (0,0) 待关、(4,4) 保留 -->
  <circle cx="57" cy="305" r="8" fill="#d6a040" stroke="#8a5a10" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 3x3 邻域虚框 around (1,1): (0,0)~(2,2) -->
  <rect x="38" y="286" width="108" height="108" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="298" font-size="9.5" fill="#b85450">3×3 邻域</text>
  <text x="148" y="310" font-size="9.5" fill="#b85450">关掉(0,0)</text>

  <circle cx="193" cy="441" r="8" fill="#d6a040" stroke="#8a5a10" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="445" font-size="9.5" fill="#4a7a3a">(4,4) 保留</text>

  <!-- 右侧：关灯后计数 -->
  <rect x="280" y="296" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="313" font-size="10.5" fill="#333" font-weight="bold">关 (0,0) 后：</text>
  <text x="290" y="329" font-size="10" fill="#555">diag1Cnt: {0:1}（仅剩 (4,4)）</text>
  <rect x="280" y="342" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="360" font-size="10.5" fill="#333" font-weight="bold">ans[0] = 1</text>

  <path d="M 310 382 L 310 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 查询 1 ===== -->
  <text x="40" y="414" font-size="11.5" fill="#888" font-weight="bold">③ 查询 [1,1]：diag1[0]=1 &gt; 0（(4,4)主对角）→ ans[1]=1</text>

  <!-- 网格 5x5，每格 30，起点 (40, 424) ... 但空间不够，简化用表格说明 -->
  <rect x="40" y="436" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="455" text-anchor="middle" font-size="11" fill="#333">(4,4) 仍在灯位集合，其主对角线 r−c=0 穿过 (1,1)</text>
  <text x="310" y="470" text-anchor="middle" font-size="10.5" fill="#555">diag1Cnt[0]=1 &gt; 0 → 被照亮，ans[1]=1</text>

  <path d="M 310 480 L 310 498" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="100" y="502" width="420" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="523" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">最终结果</text>
  <text x="310" y="542" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = [1, 1]</text>

  <!-- 图例 -->
  <rect x="40" y="566" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="577" font-size="10" fill="#555">行/列照亮</text>
  <rect x="135" y="566" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="577" font-size="10" fill="#555">对角线照亮</text>
  <rect x="230" y="566" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="577" font-size="10" fill="#555">查询格</text>
  <circle cx="330" cy="573" r="6" fill="#d6a040" stroke="#8a5a10" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="577" font-size="10" fill="#555">灯</text>
  <rect x="380" y="566" width="14" height="14" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="400" y="577" font-size="10" fill="#555">3×3 关灯邻域</text>

  <rect x="40" y="600" width="540" height="6" fill="#f5f5f5" stroke="none" rx="4" filter="url(#rough2)"/>
</svg>
