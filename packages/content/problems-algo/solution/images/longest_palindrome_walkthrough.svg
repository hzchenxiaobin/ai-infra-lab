<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s = "abccccdd"  →  7</text>

  <!-- s cells -->
  <text x="36" y="62" font-size="11" fill="#888" font-weight="bold">s:</text>
  <g font-size="13" fill="#333" font-weight="bold">
    <rect x="56" y="46" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="71" y="66" text-anchor="middle">a</text>
    <rect x="88" y="46" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="103" y="66" text-anchor="middle">b</text>
    <rect x="120" y="46" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="66" text-anchor="middle">c</text>
    <rect x="152" y="46" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="167" y="66" text-anchor="middle">c</text>
    <rect x="184" y="46" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="66" text-anchor="middle">c</text>
    <rect x="216" y="46" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="231" y="66" text-anchor="middle">c</text>
    <rect x="248" y="46" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="263" y="66" text-anchor="middle">d</text>
    <rect x="280" y="46" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="295" y="66" text-anchor="middle">d</text>
  </g>

  <!-- step table -->
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">逐字母累加过程</text>

  <!-- header -->
  <rect x="40" y="118" width="480" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="136" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="176" y="136" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">字母</text>
  <text x="268" y="136" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">freq</text>
  <text x="380" y="136" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">ans += freq//2*2</text>
  <text x="488" y="136" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">hasOdd</text>

  <!-- row 1 a -->
  <rect x="40" y="144" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="160" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="176" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>
  <text x="268" y="160" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#555">+0 → ans=0</text>
  <text x="488" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">true</text>

  <!-- row 2 b -->
  <rect x="40" y="168" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="184" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="176" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b</text>
  <text x="268" y="184" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#555">+0 → ans=0</text>
  <text x="488" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">true</text>

  <!-- row 3 c -->
  <rect x="40" y="192" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="208" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="176" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="268" y="208" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#555">+4 → ans=4</text>
  <text x="488" y="208" text-anchor="middle" font-size="11" fill="#888">true</text>

  <!-- row 4 d -->
  <rect x="40" y="216" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="232" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="176" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">d</text>
  <text x="268" y="232" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#555">+2 → ans=6</text>
  <text x="488" y="232" text-anchor="middle" font-size="11" fill="#888">true</text>

  <!-- final step -->
  <rect x="40" y="250" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">收尾</text>
  <text x="300" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">hasOdd=true → ans += 1</text>
  <text x="488" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans=7</text>

  <!-- constructed palindrome -->
  <text x="36" y="320" font-size="11" fill="#888" font-weight="bold">构造:</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">取 d d / c c c c 配对，剩 1 个 a 或 b 放正中 → "dccaccd"</text>

  <g font-size="13" fill="#333" font-weight="bold">
    <rect x="120" y="334" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="136" y="354" text-anchor="middle">d</text>
    <rect x="156" y="334" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="172" y="354" text-anchor="middle">c</text>
    <rect x="192" y="334" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="208" y="354" text-anchor="middle">c</text>
    <rect x="228" y="334" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="244" y="354" text-anchor="middle" fill="#b85450">a</text>
    <rect x="264" y="334" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="280" y="354" text-anchor="middle">c</text>
    <rect x="300" y="334" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="316" y="354" text-anchor="middle">c</text>
    <rect x="336" y="334" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="352" y="354" text-anchor="middle">d</text>
  </g>

  <text x="244" y="384" text-anchor="middle" font-size="10" fill="#888">↑ 落单 a 放正中，长度 7</text>
</svg>
