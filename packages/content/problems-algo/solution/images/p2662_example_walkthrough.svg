<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：Dijkstra 逐步执行</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">S=(1,1) T=(4,5) 道路0:(1,2)→(3,3)=2 道路1:(3,4)→(4,5)=1</text>

  <!-- ===== Step 1 ===== -->
  <rect x="20" y="56" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <!-- step number circle -->
  <circle cx="50" cy="102" r="20" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="107" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">1</text>

  <!-- pop info -->
  <text x="82" y="78" font-size="10" fill="#446688" font-weight="bold">弹出</text>
  <text x="82" y="94" font-size="11" fill="#333">(d=0, u=S)</text>

  <!-- actions -->
  <text x="82" y="116" font-size="10" fill="#555">松弛：</text>
  <text x="118" y="116" font-size="9" fill="#4a7a3a">① 步行→T: 0+7=7 → dist[T]=7</text>
  <text x="118" y="130" font-size="9" fill="#d6a040">② 道路0: 0+(walk 1)+2=3 → dist[B]=3</text>
  <text x="118" y="142" font-size="9" fill="#d6a040">② 道路1: 0+(walk 5)+1=6 → dist[T]=min(7,6)=6</text>

  <!-- heap after -->
  <rect x="400" y="108" width="108" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="454" y="121" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">heap after</text>
  <text x="454" y="134" text-anchor="middle" font-size="9" fill="#555">[(3,B), (6,T)]</text>

  <!-- ===== Step 2 ===== -->
  <rect x="20" y="160" width="500" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <circle cx="50" cy="200" r="20" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="50" y="205" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">2</text>

  <text x="82" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">弹出</text>
  <text x="82" y="194" font-size="11" fill="#333">(d=3, u=B=(3,3))</text>

  <text x="82" y="214" font-size="10" fill="#555">松弛：</text>
  <text x="118" y="214" font-size="9" fill="#999">① 步行→T: 3+3=6 → 无更新</text>
  <text x="118" y="228" font-size="9" fill="#d6a040">② 道路1: 3+(walk 1)+1=5 → dist[T]=min(6,5)=5 ✓</text>

  <rect x="400" y="188" width="108" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="454" y="201" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">heap after</text>
  <text x="454" y="214" text-anchor="middle" font-size="9" fill="#555">[(5,T), (6,T)]</text>

  <!-- ===== Step 3 ===== -->
  <rect x="20" y="252" width="500" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <circle cx="50" cy="283" r="20" fill="#b85450" filter="url(#rough2)"/>
  <text x="50" y="288" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">3</text>

  <text x="82" y="272" font-size="10" fill="#b85450" font-weight="bold">弹出</text>
  <text x="82" y="288" font-size="11" fill="#333">(d=5, u=T=(4,5))</text>

  <text x="82" y="306" font-size="11" fill="#b85450" font-weight="bold">u == target → return 5 ✓</text>

  <!-- ===== Summary ===== -->
  <rect x="20" y="330" width="500" height="54" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最优路径：(1,1) →步1→ (1,2) →路2→ (3,3) →步1→ (3,4) →路1→ (4,5)</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总代价 = 1 + 2 + 1 + 1 = 5　（直接步行 = 7）</text>
</svg>
