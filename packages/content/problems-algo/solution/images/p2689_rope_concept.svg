<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Rope 树：叶子存串，内部节点拼串</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">每个节点的 len = 该子树代表的完整串长度</text>

  <!-- ===== Tree (example 2) ===== -->
  <!-- L0 root (internal, len=12) -->
  <rect x="244" y="64" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">len=12</text>
  <text x="280" y="93" text-anchor="middle" font-size="9" fill="#b85450">val=""</text>

  <!-- L1 (internal, len=6) -->
  <rect x="124" y="138" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">len=6</text>
  <text x="160" y="167" text-anchor="middle" font-size="9" fill="#446688">val=""</text>

  <rect x="364" y="138" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">len=6</text>
  <text x="400" y="167" text-anchor="middle" font-size="9" fill="#446688">val=""</text>

  <!-- edges L0-L1 -->
  <line x1="262" y1="98" x2="180" y2="138" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="298" y1="98" x2="380" y2="138" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- L2 leaves -->
  <rect x="58" y="212" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"abc"</text>
  <text x="90" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a">len=3</text>

  <rect x="198" y="212" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"efg"</text>
  <text x="230" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a">len=3</text>

  <rect x="298" y="212" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"hij"</text>
  <text x="330" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a">len=3</text>

  <rect x="438" y="212" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"klm"</text>
  <text x="470" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a">len=3</text>

  <!-- edges L1-L2 -->
  <line x1="142" y1="172" x2="104" y2="212" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="178" y1="172" x2="216" y2="212" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="382" y1="172" x2="344" y2="212" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="418" y1="172" x2="456" y2="212" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- node type labels on right -->
  <text x="540" y="84" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">内部节点</text>
  <text x="540" y="98" text-anchor="end" font-size="9" fill="#b85450">val 为空</text>
  <text x="540" y="158" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">内部节点</text>
  <text x="540" y="232" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">叶子节点</text>

  <!-- ===== concat formula + string ===== -->
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">S(内部) = S(左) + S(右)</text>

  <g font-size="12">
    <!-- leaf strings under braces -->
    <text x="90" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">a b c</text>
    <text x="230" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">e f g</text>
    <text x="330" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">h i j</text>
    <text x="470" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">k l m</text>
  </g>

  <!-- the full string -->
  <rect x="80" y="322" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a b c e f g h i j k l m</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#888">S(root) = "abc"+"efg"+"hij"+"klm" = "abcefghijklm"（长度 12 = root.len）</text>
</svg>
