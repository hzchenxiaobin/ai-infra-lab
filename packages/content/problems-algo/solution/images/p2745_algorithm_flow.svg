<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2745f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：比较 x 与 y，算交替块数</text>

  <!-- input -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 x, y, z</text>

  <path d="M280,80 L280,100" stroke="#446688" stroke-width="2" marker-end="url(#arr2745f)" filter="url(#rough2)"/>

  <!-- decision diamond: x == y? -->
  <path d="M280,104 L380,148 L280,192 L180,148 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">x == y ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#d6a040">（两边 AA/BB 数量相等）</text>

  <!-- YES branch (left) -->
  <text x="168" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M180,148 L100,148 L100,210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2745f)" filter="url(#rough2)"/>
  <rect x="30" y="214" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">用全部 x 个 AA + y 个 BB</text>
  <text x="130" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">blocks = 2·min(x,y)</text>

  <!-- NO branch (right) -->
  <text x="392" y="144" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M380,148 L460,148 L460,210" stroke="#b85450" stroke-width="2" marker-end="url(#arr2745f)" filter="url(#rough2)"/>
  <rect x="350" y="214" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">多的那方多用一个</text>
  <text x="460" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">blocks = 2·min(x,y) + 1</text>

  <!-- converge -->
  <path d="M130,256 L130,290 L280,290" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2745f)" filter="url(#rough2)"/>
  <path d="M460,256 L460,290 L280,290" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2745f)" filter="url(#rough2)"/>

  <!-- add AB -->
  <rect x="160" y="296" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">+ 2·z（全部 AB 永远可用）</text>

  <!-- final answer -->
  <rect x="100" y="340" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">answer = 2 × blocks + 2 × z</text>
</svg>
