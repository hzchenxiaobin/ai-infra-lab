<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：预处理合法组 + 低位固定状压 DP</text>

  <!-- ===== Phase 1 (left column) ===== -->
  <rect x="24" y="46" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="144" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：预处理合法组</text>

  <rect x="44" y="86" width="200" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举 C(n,m) 个大小为 m 的子集</text>

  <path d="M144,124 L144,142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="144,146 200,166 144,186 88,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">组内有重复值?</text>

  <path d="M200,166 L230,166" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="208" y="160" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="234" y="170" font-size="9" fill="#b85450" filter="url(#rough2)">跳过</text>

  <path d="M144,186 L144,202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="198" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="44" y="206" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">计算 inc = max − min</text>
  <text x="144" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">存入 groups[最低位].append(g,inc)</text>

  <path d="M144,242 L144,258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="262" width="200" height="30" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">得到按最低位分桶的合法组表</text>

  <!-- ===== Phase 2 (right column) ===== -->
  <rect x="296" y="46" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="416" y="65" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">阶段二：状压 DP</text>

  <rect x="316" y="86" width="200" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[0] = 0, 其余 = ∞</text>

  <path d="M416,116 L416,132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="316" y="136" width="200" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 mask = 0 … 2^n−1</text>

  <path d="M416,166 L416,182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="416,186 480,206 416,226 352,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="210" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[mask] = ∞?</text>

  <path d="M480,206 L510,206" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="486" y="200" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="514" y="210" font-size="9" fill="#b85450" filter="url(#rough2)">跳过</text>

  <path d="M416,226 L416,242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="238" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="316" y="246" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="266" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b = mask 最低未选位</text>

  <path d="M416,276 L416,290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="316" y="294" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="310" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">枚举 groups[b] 中合法组 g</text>
  <text x="416" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">g ∩ mask == 0 → 更新 dp[mask|g]</text>

  <!-- arrow from phase 1 to phase 2 -->
  <path d="M244,278 C270,278 290,200 316,200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="232" font-size="9" fill="#888" filter="url(#rough2)">输入</text>

  <!-- bottom return -->
  <path d="M416,330 L416,352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="296" y="356" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="416" y="378" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">返回 dp[2^n − 1]</text>

  <!-- bottom note -->
  <rect x="24" y="356" width="250" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="36" y="376" font-size="10" fill="#446688" filter="url(#rough2)">固定最低未选位 b → 每个元素恰在</text>
  <text x="36" y="390" font-size="10" fill="#446688" filter="url(#rough2)">一个组中被「首次选中」，去重 k! 排列</text>
</svg>
