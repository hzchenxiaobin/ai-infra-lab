<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预建行映射 → 逐词逐字符核对行号一致性</text>

  <!-- Step 1: build map -->
  <rect x="60" y="48" width="440" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">① 预建 rowOf[26] 映射表</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#555">row1 = qwertyuiop, row2 = asdfghjkl, row3 = zxcvbnm → 每个 letter 编码 1/2/3</text>

  <line x1="280" y1="94" x2="280" y2="116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for each word -->
  <rect x="60" y="118" width="440" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">② 对每个 word：r = rowOf[word[0].lower()]  （取首字母行号作基准）</text>

  <line x1="280" y1="152" x2="280" y2="174" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop chars -->
  <rect x="60" y="176" width="440" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">③ 遍历 word 中每个字符 c</text>

  <line x1="280" y1="210" x2="280" y2="232" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,234 380,274 280,314 180,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">rowOf[c.lower()]</text>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">== r ?</text>

  <!-- No branch: reject -->
  <line x1="380" y1="274" x2="440" y2="274" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="268" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="256" width="80" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">标记无效</text>
  <text x="480" y="286" text-anchor="middle" font-size="10" fill="#b85450">break</text>

  <!-- Yes branch: continue -->
  <line x1="280" y1="314" x2="280" y2="346" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="160" y="348" width="240" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#3a5a2a">继续下一字符（全部一致则该词有效）</text>

  <!-- loop back arrow from continue to step 3 -->
  <path d="M 160 363 L 120 363 L 120 193 L 60 193" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="280" font-size="10" fill="#4a7a3a">下一字符</text>

  <!-- Step 4: collect valid -->
  <line x1="280" y1="378" x2="280" y2="404" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="406" width="440" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">④ 若词有效（未 break）→ 加入结果；遍历完所有词后返回</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">单词长 n → 内层 O(n)；总 O(Σ|word|)，空间 O(26) = O(1)</text>
</svg>
