<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：seats=2，逐边油耗 1+1+2+1+1+1=7</text>

  <!-- ===== tree ===== -->
  <!-- edges gray -->
  <g stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <line x1="280" y1="80" x2="280" y2="111"/>
    <line x1="280" y1="80" x2="405" y2="111"/>
    <line x1="155" y1="141" x2="155" y2="181"/>
    <line x1="280" y1="141" x2="280" y2="181"/>
    <line x1="155" y1="211" x2="155" y2="251"/>
  </g>
  <!-- highlighted edge 0-1 (=1→0, cost 2) red -->
  <g stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)">
    <line x1="280" y1="80" x2="155" y2="111"/>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="64" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333">0</text>

    <circle cx="155" cy="126" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="155" y="131" text-anchor="middle" font-size="12" fill="#7a4a10">1</text>

    <circle cx="280" cy="126" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="131" text-anchor="middle" font-size="12" fill="#333">4</text>

    <circle cx="405" cy="126" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="405" y="131" text-anchor="middle" font-size="12" fill="#333">5</text>

    <circle cx="155" cy="196" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="155" y="201" text-anchor="middle" font-size="12" fill="#333">3</text>

    <circle cx="280" cy="196" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="201" text-anchor="middle" font-size="12" fill="#333">6</text>

    <circle cx="155" cy="266" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="155" y="271" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>

  <!-- P tags (green) right of each node -->
  <g filter="url(#rough2)" font-size="11" fill="#4a7a3a">
    <text x="302" y="68">P=7</text>
    <text x="177" y="130">P=3</text>
    <text x="302" y="130">P=2</text>
    <text x="427" y="130">P=1</text>
    <text x="177" y="200">P=2</text>
    <text x="302" y="200">P=1</text>
    <text x="177" y="270">P=1</text>
  </g>

  <!-- edge car-count tags -->
  <g filter="url(#rough2)" font-size="11">
    <text x="200" y="100" fill="#b85450" font-weight="bold">2 辆</text>
    <text x="288" y="100" fill="#888">1</text>
    <text x="350" y="100" fill="#888">1</text>
    <text x="165" y="166" fill="#888">1</text>
    <text x="290" y="166" fill="#888">1</text>
    <text x="165" y="236" fill="#888">1</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <line x1="430" y1="252" x2="458" y2="252" stroke="#b85450" stroke-width="3"/>
    <text x="464" y="256" fill="#b85450">2 辆（拼不下）</text>
    <line x1="430" y1="272" x2="458" y2="272" stroke="#bbb" stroke-width="1.5"/>
    <text x="464" y="276" fill="#888">1 辆</text>
  </g>

  <!-- ===== edge cost table (two side-by-side blocks) ===== -->
  <!-- left block -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="298" width="66" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="73" y="314" text-anchor="middle" fill="#446688" font-weight="bold">边</text>
    <rect x="106" y="298" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="131" y="314" text-anchor="middle" fill="#446688" font-weight="bold">P</text>
    <rect x="156" y="298" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="183" y="314" text-anchor="middle" fill="#446688" font-weight="bold">⌈P/2⌉</text>

    <rect x="40" y="320" width="66" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="73" y="334" text-anchor="middle" fill="#333">2→3</text>
    <rect x="106" y="320" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="131" y="334" text-anchor="middle" fill="#333">1</text>
    <rect x="156" y="320" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="183" y="334" text-anchor="middle" fill="#333">1</text>

    <rect x="40" y="340" width="66" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="73" y="354" text-anchor="middle" fill="#333">3→1</text>
    <rect x="106" y="340" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="131" y="354" text-anchor="middle" fill="#333">2</text>
    <rect x="156" y="340" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="183" y="354" text-anchor="middle" fill="#333">1</text>

    <rect x="40" y="360" width="66" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="73" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">1→0</text>
    <rect x="106" y="360" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="131" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="156" y="360" width="54" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="183" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- right block -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="300" y="298" width="66" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="333" y="314" text-anchor="middle" fill="#446688" font-weight="bold">边</text>
    <rect x="366" y="298" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="391" y="314" text-anchor="middle" fill="#446688" font-weight="bold">P</text>
    <rect x="416" y="298" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="443" y="314" text-anchor="middle" fill="#446688" font-weight="bold">⌈P/2⌉</text>

    <rect x="300" y="320" width="66" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="333" y="334" text-anchor="middle" fill="#333">6→4</text>
    <rect x="366" y="320" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="391" y="334" text-anchor="middle" fill="#333">1</text>
    <rect x="416" y="320" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="443" y="334" text-anchor="middle" fill="#333">1</text>

    <rect x="300" y="340" width="66" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="333" y="354" text-anchor="middle" fill="#333">4→0</text>
    <rect x="366" y="340" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="391" y="354" text-anchor="middle" fill="#333">2</text>
    <rect x="416" y="340" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="443" y="354" text-anchor="middle" fill="#333">1</text>

    <rect x="300" y="360" width="66" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="333" y="374" text-anchor="middle" fill="#333">5→0</text>
    <rect x="366" y="360" width="50" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="391" y="374" text-anchor="middle" fill="#333">1</text>
    <rect x="416" y="360" width="54" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="443" y="374" text-anchor="middle" fill="#333">1</text>
  </g>

  <!-- sum line -->
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">总油耗 = 1 + 1 + 2 + 1 + 1 + 1 = 7 ✓</text>
</svg>
