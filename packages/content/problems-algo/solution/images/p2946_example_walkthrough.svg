<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：mat = [[1,2,1,2],[5,5,5,5],[6,3,6,3]]，k = 2</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 4 ⇒ s = 2 mod 4 = 2：偶数行左移 2 位，奇数行右移 2 位</text>

  <!-- Row 0 -->
  <text x="36" y="82" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0 偶数行</text>
  <text x="36" y="98" font-size="11" fill="#446688" filter="url(#rough2)">左移 2 位</text>

  <path d="M 178 58 Q 218 40 258 58" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="46" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j=0 ↔ j=2：1 = 1 ✓</text>

  <rect x="160" y="62" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="62" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="62" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="62" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 218 100 Q 258 120 298 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="124" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j=1 ↔ j=3：2 = 2 ✓</text>

  <text x="360" y="78" font-size="11.5" fill="#555" filter="url(#rough2)">↦ [1,2,1,2]</text>
  <text x="360" y="98" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">该行不变 ✓</text>

  <!-- Row 1 -->
  <text x="36" y="158" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i = 1 奇数行</text>
  <text x="36" y="174" font-size="11" fill="#8a6d1f" filter="url(#rough2)">右移 2 位</text>

  <rect x="160" y="138" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="200" y="138" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="138" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="280" y="138" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <text x="258" y="190" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">j 与 j−2 的每一对都是 5 = 5 ✓</text>
  <text x="360" y="154" font-size="11.5" fill="#555" filter="url(#rough2)">↦ [5,5,5,5]</text>
  <text x="360" y="174" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全等行：怎么移都不变 ✓</text>

  <!-- Row 2 -->
  <text x="36" y="234" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 2 偶数行</text>
  <text x="36" y="250" font-size="11" fill="#446688" filter="url(#rough2)">左移 2 位</text>

  <path d="M 178 210 Q 218 192 258 210" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j=0 ↔ j=2：6 = 6 ✓</text>

  <rect x="160" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="237" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="200" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="237" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="237" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="280" y="214" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="237" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 218 252 Q 258 272 298 252" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="276" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j=1 ↔ j=3：3 = 3 ✓</text>

  <text x="360" y="230" font-size="11.5" fill="#555" filter="url(#rough2)">↦ [6,3,6,3]</text>
  <text x="360" y="250" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">该行不变 ✓</text>

  <!-- Example 1 contrast -->
  <rect x="46" y="292" width="428" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">反例 · 示例 1：mat = [[1,2,3],…] ，k = 4，n = 3 ⇒ s = 1</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">行 0 第一步就失配：mat[0][0] = 1 ≠ 2 = mat[0][1] ⇒ 一票否决，false</text>

  <!-- conclusion -->
  <rect x="86" y="368" width="348" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 2 三行全部通过 ⇒ 返回 true</text>
  <text x="260" y="410" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[1,2,1,2] 与 [6,3,6,3] 恰以 2 为周期，[5,5,5,5] 以 1 为周期</text>
</svg>
