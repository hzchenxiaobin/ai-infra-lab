<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次扫描维护 left2 / right2，中心下标 j 从左到右</text>

  <!-- 0. 初始化右侧（整串的「ba」二元子序列数） -->
  <rect x="150" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化 right2 = 整串「ba」二元子序列数</text>
  <text x="270" y="80" text-anchor="middle" font-size="10" fill="#666">同时建 suf_cnt（整串各数字频次）</text>

  <path d="M 270 88 L 270 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop label -->
  <text x="98" y="126" font-size="11" fill="#888">for j = 0..n−1</text>
  <rect x="120" y="112" width="300" height="312" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>

  <!-- 1. 把 s[j] 移出右侧 -->
  <rect x="150" y="118" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 把 s[j] 移出右侧区域</text>
  <text x="270" y="154" text-anchor="middle" font-size="10" fill="#666">right2[c][a] −= suf_cnt[a] − (a==c)；suf_cnt[c]−−</text>

  <path d="M 270 162 L 270 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 累加贡献 -->
  <rect x="150" y="178" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 累加贡献</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#666">ans += Σ left2[a][b] · right2[b][a]</text>

  <path d="M 270 222 L 270 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 把 s[j] 加入左侧 -->
  <rect x="150" y="238" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 把 s[j] 加入左侧区域</text>
  <text x="270" y="274" text-anchor="middle" font-size="10" fill="#666">left2[a][c] += left_cnt[a]；left_cnt[c]++</text>

  <!-- loop back arrow on the right -->
  <path d="M 390 260 Q 440 260 440 160 Q 440 140 390 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="448" y="200" font-size="10" fill="#b85450" font-weight="bold">下一 j</text>

  <path d="M 270 282 L 270 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 区域示意 -->
  <rect x="150" y="300" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#333">此刻：左区=[0,j)  右区=[j+1,n)</text>
  <text x="270" y="336" text-anchor="middle" font-size="10" fill="#666">left2 反映 [0,j)，right2 反映 [j+1,n)，恰好以 j 为中心</text>

  <path d="M 270 344 L 270 362" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 返回 -->
  <rect x="180" y="362" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="387" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans mod 10⁹+7</text>

  <!-- Footer complexity -->
  <text x="270" y="446" text-anchor="middle" font-size="10.5" fill="#888">每步：移出 O(10) + 贡献 O(100) + 加入 O(10) = O(100)，总计 O(100·n)</text>
  <text x="270" y="464" text-anchor="middle" font-size="10" fill="#aaa">空间仅两张 10×10 表 + 两个 10 元计数 = O(100) = O(1)</text>
</svg>
