<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [1,4,3,2,5,2]，x = 3</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">逐节点遍历，按 val 与 x 比较尾插到 small / large，最后拼接</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <rect x="84" y="60" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="77" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">curr</text>
  <rect x="148" y="60" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="178" y="77" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">判断</text>
  <rect x="212" y="60" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="312" y="77" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">small（val &lt; 3）</text>
  <rect x="416" y="60" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="516" y="77" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">large（val ≥ 3）</text>

  <!-- 行 0: 初始 -->
  <rect x="20" y="90" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="109" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <rect x="84" y="90" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="109" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="148" y="90" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="109" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="212" y="90" width="200" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="312" y="109" text-anchor="middle" font-size="10" fill="#888">∅（sDummy）</text>
  <rect x="416" y="90" width="200" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="516" y="109" text-anchor="middle" font-size="10" fill="#888">∅（lDummy）</text>

  <!-- 行 1: curr=1 -->
  <rect x="20" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="141" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="84" y="122" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="122" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 &lt; 3</text>
  <rect x="212" y="122" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="416" y="122" width="200" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="516" y="141" text-anchor="middle" font-size="10" fill="#888">∅</text>

  <!-- 行 2: curr=4 -->
  <rect x="20" y="154" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="173" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="84" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="148" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="173" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4 ≥ 3</text>
  <rect x="212" y="154" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="312" y="173" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="416" y="154" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 行 3: curr=3 -->
  <rect x="20" y="186" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="205" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="84" y="186" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="148" y="186" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="205" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3 ≥ 3</text>
  <rect x="212" y="186" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="312" y="205" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="416" y="186" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 → 3</text>

  <!-- 行 4: curr=2 -->
  <rect x="20" y="218" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="237" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="84" y="218" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="218" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="237" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 &lt; 3</text>
  <rect x="212" y="218" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 → 2</text>
  <rect x="416" y="218" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="516" y="237" text-anchor="middle" font-size="11" fill="#333">4 → 3</text>

  <!-- 行 5: curr=5 -->
  <rect x="20" y="250" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="269" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="84" y="250" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="148" y="250" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="269" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5 ≥ 3</text>
  <rect x="212" y="250" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="312" y="269" text-anchor="middle" font-size="11" fill="#333">1 → 2</text>
  <rect x="416" y="250" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 → 3 → 5</text>

  <!-- 行 6: curr=2 -->
  <rect x="20" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="301" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="84" y="282" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="282" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="301" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 &lt; 3</text>
  <rect x="212" y="282" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 → 2 → 2</text>
  <rect x="416" y="282" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="516" y="301" text-anchor="middle" font-size="11" fill="#333">4 → 3 → 5</text>

  <!-- 行 7: 拼接 -->
  <rect x="20" y="314" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="333" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">拼接</text>
  <rect x="84" y="314" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="114" y="333" text-anchor="middle" font-size="10" fill="#888">null</text>
  <rect x="148" y="314" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="333" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">合并</text>
  <rect x="212" y="314" width="404" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="414" y="333" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 → 2 → 2 → 4 → 3 → 5</text>

  <!-- 拼接说明 -->
  <rect x="20" y="356" width="600" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="376" font-size="11" fill="#8a6a20" font-weight="bold">拼接操作：</text>
  <text x="34" y="392" font-size="11" fill="#555">① sTail.next = lDummy.next   →  把 large 段接到 small 段尾后</text>
  <text x="34" y="406" font-size="11" fill="#555">② lTail.next = null           →  断开 large 段尾，防止指向原链后续节点成环</text>

  <!-- 结果链表可视化 -->
  <text x="20" y="436" font-size="12" fill="#444" font-weight="bold">最终结果：</text>
  <g font-size="13">
    <rect x="40" y="446" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="62" y="466" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="92" y="446" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="114" y="466" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="144" y="446" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="166" y="466" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="196" y="446" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="218" y="466" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <rect x="248" y="446" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="270" y="466" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="300" y="446" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="322" y="466" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="84" y1="461" x2="92" y2="461" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="136" y1="461" x2="144" y2="461" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="188" y1="461" x2="196" y2="461" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="240" y1="461" x2="248" y2="461" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="292" y1="461" x2="300" y2="461" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <rect x="40" y="484" width="200" height="16" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="496" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">small 段（原序 1,2,2）</text>
  <rect x="196" y="484" width="148" height="16" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="496" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">large 段（原序 4,3,5）</text>

  <!-- 底部要点 -->
  <rect x="20" y="516" width="600" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="534" font-size="11" fill="#b85450" font-weight="bold">观察：</text>
  <text x="34" y="548" font-size="11" fill="#555">small 段内 1,2,2 与原链出现顺序一致；large 段内 4,3,5 与原链出现顺序一致——尾插天然保序。</text>
</svg>
