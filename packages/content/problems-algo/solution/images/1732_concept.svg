<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#aaa"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：海拔 = gain 的前缀和，最高海拔 = max(前缀和)</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">altitude[0] = 0，altitude[i+1] = altitude[i] + gain[i]</text>

  <!-- gain row: 5 cards centered at 144,212,280,348,416 -->
  <text x="44" y="95" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">gain</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="116" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="144" y="95" fill="#333" font-weight="bold">−5</text>
    <rect x="184" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="212" y="95" fill="#333" font-weight="bold">+1</text>
    <rect x="252" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="280" y="95" fill="#333" font-weight="bold">+5</text>
    <rect x="320" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="348" y="95" fill="#333" font-weight="bold">0</text>
    <rect x="388" y="74" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="416" y="95" fill="#333" font-weight="bold">−7</text>
  </g>

  <!-- arrows gain -> altitude (逐项累加) -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <path d="M 144 106 L 144 138" marker-end="url(#arr)"/>
    <path d="M 212 106 L 212 138" marker-end="url(#arr)"/>
    <path d="M 280 106 L 280 138" marker-end="url(#arr)"/>
    <path d="M 348 106 L 348 138" marker-end="url(#arr)"/>
    <path d="M 416 106 L 416 138" marker-end="url(#arr)"/>
  </g>
  <text x="478" y="124" font-size="10" fill="#888" filter="url(#rough2)">逐项累加</text>

  <!-- altitude row: 6 cards centered at 110,178,246,314,382,450 -->
  <text x="38" y="173" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">altitude</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- 点0 = 0 起点 (neutral) -->
    <rect x="82" y="150" width="56" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4"/>
    <text x="110" y="173" fill="#555" font-weight="bold">0</text>
    <!-- 点1 = -5 -->
    <rect x="150" y="150" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="178" y="173" fill="#b85450" font-weight="bold">−5</text>
    <!-- 点2 = -4 -->
    <rect x="218" y="150" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="246" y="173" fill="#b85450" font-weight="bold">−4</text>
    <!-- 点3 = +1 HIGHLIGHTED -->
    <rect x="286" y="150" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="314" y="173" fill="#4a7a3a" font-weight="bold">+1</text>
    <!-- 点4 = +1 HIGHLIGHTED -->
    <rect x="354" y="150" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="382" y="173" fill="#4a7a3a" font-weight="bold">+1</text>
    <!-- 点5 = -6 -->
    <rect x="422" y="150" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="450" y="173" fill="#b85450" font-weight="bold">−6</text>
  </g>

  <!-- point index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="110" y="200">点 0</text>
    <text x="178" y="200">点 1</text>
    <text x="246" y="200">点 2</text>
    <text x="314" y="200">点 3</text>
    <text x="382" y="200">点 4</text>
    <text x="450" y="200">点 5</text>
  </g>

  <!-- annotation: max arrow up to highlighted cards -->
  <path d="M 348 224 L 348 190" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="238" y="224" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="348" y="244" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最高海拔 = max(altitude) = 1</text>

  <!-- bottom note -->
  <rect x="50" y="274" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">altitude[k] = Σ gain[0..k−1]，answer = max(0, max₁..ₙ altitude[k])</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">起点 altitude[0]=0 必须参与比较 → best 初值取 0（非 −∞）</text>
  <text x="280" y="328" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">无需存整条 altitude，滚动维护 alt 与 best 两个标量即可</text>
</svg>
