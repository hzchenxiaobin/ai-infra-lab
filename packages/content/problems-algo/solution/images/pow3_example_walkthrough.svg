<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四类输入的判定</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">输入 n</text>
  <rect x="120" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一关 n &gt; 0</text>
  <rect x="240" y="48" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第二关 3^19 mod n == 0</text>
  <rect x="420" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">结果</text>

  <!-- Row 1: n = 27 -->
  <rect x="30" y="84" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n = 27</text>
  <text x="75" y="124" text-anchor="middle" font-size="9.5" fill="#888">= 3^3</text>

  <rect x="120" y="84" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✅</text>

  <rect x="240" y="84" width="180" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#333">1162261467 / 27</text>
  <text x="330" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">= 43046721 余 0 ✅</text>

  <rect x="420" y="84" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- Row 2: n = 45 -->
  <rect x="30" y="142" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n = 45</text>
  <text x="75" y="182" text-anchor="middle" font-size="9.5" fill="#888">= 9 × 5</text>

  <rect x="120" y="142" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✅</text>

  <rect x="240" y="142" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="164" text-anchor="middle" font-size="11" fill="#333">1162261467 mod 45</text>
  <text x="330" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">= 27 ✗（含因子 5）</text>

  <rect x="420" y="142" width="110" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="172" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- Row 3: n = 0 -->
  <rect x="30" y="200" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="230" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n = 0</text>

  <rect x="120" y="200" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="230" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <rect x="240" y="200" width="180" height="50" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="230" text-anchor="middle" font-size="11" fill="#888">—（短路跳过）</text>

  <rect x="420" y="200" width="110" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="230" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- Row 4: n = -3 -->
  <rect x="30" y="258" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n = −3</text>

  <rect x="120" y="258" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <rect x="240" y="258" width="180" height="50" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="11" fill="#888">—（短路跳过）</text>

  <rect x="420" y="258" width="110" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="288" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- 解读说明 -->
  <rect x="30" y="324" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="11.5" fill="#d6a040" font-weight="bold">解读</text>
  <text x="50" y="364" font-size="10.5" fill="#333">• n=27=3^3：3^19 / 3^3 = 3^16 = 43046721，整除 → 是 3 的幂</text>
  <text x="50" y="380" font-size="10.5" fill="#333">• n=45=9×5：含非 3 的素因子 5，3^19 只含素因子 3，必不整除 → 非幂</text>
  <text x="50" y="396" font-size="10.5" fill="#333">• n≤0：第一关即挡下，短路跳过取模（避免 0 作除数的未定义行为）</text>
</svg>
