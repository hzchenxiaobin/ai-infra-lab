<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DFS 回溯算法流程</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">进入节点时加值 · 回到 0 时更新答案 · 离开时回退</text>

  <!-- Start node -->
  <ellipse cx="280" cy="70" rx="60" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(0, 0)</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: Enter node, add value -->
  <rect x="170" y="110" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">进入节点 node</text>
  <text x="280" y="143" text-anchor="middle" font-size="10" fill="#555">if visited[node]==0: curVal += val[node]</text>
  <text x="280" y="155" text-anchor="middle" font-size="10" fill="#555">visited[node]++</text>

  <path d="M 280 160 L 280 176" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Check if node==0 -->
  <polygon points="280,178 360,210 280,242 200,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node == 0 ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#888">(合法路径终点)</text>

  <!-- Yes branch: update ans -->
  <path d="M 200 210 L 100 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="30" y="190" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="207" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans = max(ans, curVal)</text>
  <text x="95" y="221" text-anchor="middle" font-size="9.5" fill="#666">更新最大价值</text>

  <!-- Merge back -->
  <path d="M 95 230 L 95 270 L 280 270" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 280 242 L 280 270" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- No label -->
  <text x="290" y="255" font-size="10" fill="#888">否</text>

  <path d="M 280 270 L 280 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Enumerate neighbors -->
  <rect x="130" y="288" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">枚举邻居 (nxt, t) ∈ adj[node]</text>
  <text x="280" y="321" text-anchor="middle" font-size="10" fill="#555">if time + t ≤ maxTime:</text>
  <text x="280" y="333" text-anchor="middle" font-size="10" fill="#555">dfs(nxt, time + t)  ← 递归</text>

  <!-- Recursive call arrow -->
  <path d="M 430 313 Q 480 313, 480 200 Q 480 135, 280 135" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="495" y="200" font-size="9.5" fill="#b85450" font-weight="bold" transform="rotate(-90 495 200)">递归调用</text>

  <path d="M 280 338 L 280 354" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Backtrack -->
  <rect x="150" y="356" width="260" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">回溯恢复</text>
  <text x="280" y="389" text-anchor="middle" font-size="10" fill="#555">visited[node]--</text>
  <text x="280" y="401" text-anchor="middle" font-size="10" fill="#555">if visited[node]==0: curVal -= val[node]</text>

  <!-- Legend -->
  <rect x="30" y="356" width="110" height="50" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="38" y="364" width="12" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
  <text x="56" y="373" font-size="9" fill="#555">加值/更新</text>
  <rect x="38" y="380" width="12" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2"/>
  <text x="56" y="389" font-size="9" fill="#555">枚举邻居</text>
  <rect x="38" y="396" width="12" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
  <text x="56" y="405" font-size="9" fill="#555">回溯恢复</text>
</svg>
