<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：正向扫算左侧距离，反向扫取较小值</text>

  <!-- Start -->
  <rect x="170" y="40" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[n] 填 ∞(=n)；last = -1</text>
  <path d="M 280 76 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Forward section label -->
  <rect x="150" y="100" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 正向：for i = 0 → n−1</text>
  <path d="M 280 136 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update last -->
  <rect x="120" y="160" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#333">若 s[i] == c ：last = i</text>
  <path d="M 280 196 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update ans -->
  <rect x="120" y="220" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#333">if last != -1 ：ans[i] = i − last</text>

  <!-- forward loop back -->
  <path d="M 440 237 L 484 237 L 484 117 L 410 117" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="492" y="180" font-size="10" fill="#888">i 未完</text>

  <path d="M 120 237 L 76 237 L 76 280 L 170 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="262" font-size="10" fill="#888">正向扫完</text>

  <!-- reset last -->
  <rect x="170" y="264" width="220" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333">last = -1（重置）</text>
  <path d="M 280 300 L 280 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Backward section label -->
  <rect x="150" y="324" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 反向：for i = n−1 → 0</text>
  <path d="M 280 360 L 280 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update last -->
  <rect x="120" y="384" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#333">若 s[i] == c ：last = i</text>
  <path d="M 280 420 L 280 440" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update ans min -->
  <rect x="120" y="444" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="12" fill="#333">if last != -1 ：ans[i] = min(ans[i], last − i)</text>

  <!-- backward loop back -->
  <path d="M 440 461 L 484 461 L 484 341 L 410 341" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="492" y="404" font-size="10" fill="#888">i 未完</text>

  <path d="M 120 461 L 76 461 L 76 504 L 200 504" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="486" font-size="10" fill="#888">反向扫完</text>

  <!-- Return -->
  <rect x="200" y="488" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <text x="280" y="534" text-anchor="middle" font-size="10" fill="#888">两遍各 O(n)，整体 O(n) / O(1) 额外空间</text>
</svg>
