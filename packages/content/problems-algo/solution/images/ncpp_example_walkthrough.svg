<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="490" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：11 行 → 3 个帖子 → 匹配评论 → 输出</text>

  <!-- ===== 左侧：输入表 ===== -->
  <text x="30" y="46" font-size="11" fill="#888">输入 Submissions 表（颜色标注行类型）</text>
  <rect x="30" y="54" width="200" height="282" fill="white" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="30" y1="76" x2="230" y2="76" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="54" x2="120" y2="336" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="70" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">sub_id</text>
  <text x="175" y="70" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">parent_id</text>

  <!-- 帖子行（蓝色背景） -->
  <rect x="31" y="77" width="198" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="92" text-anchor="middle" font-size="10.5" fill="#446688">1</text>
  <text x="175" y="92" text-anchor="middle" font-size="10.5" fill="#446688">NULL</text>

  <rect x="31" y="99" width="198" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="114" text-anchor="middle" font-size="10.5" fill="#446688">2</text>
  <text x="175" y="114" text-anchor="middle" font-size="10.5" fill="#446688">NULL</text>

  <!-- 重复帖子行（蓝色虚线框） -->
  <rect x="31" y="121" width="198" height="22" fill="#e8f0fe" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="75" y="136" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="175" y="136" text-anchor="middle" font-size="10.5" fill="#999">NULL</text>
  <text x="225" y="136" font-size="8.5" fill="#b85450">重复</text>

  <rect x="31" y="143" width="198" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75" y="158" text-anchor="middle" font-size="10.5" fill="#446688">12</text>
  <text x="175" y="158" text-anchor="middle" font-size="10.5" fill="#446688">NULL</text>

  <!-- 评论行（绿色背景） -->
  <rect x="31" y="165" width="198" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3</text>
  <text x="175" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a">1</text>

  <rect x="31" y="187" width="198" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a">5</text>
  <text x="175" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>

  <!-- 重复评论行 -->
  <rect x="31" y="209" width="198" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="75" y="224" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="175" y="224" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="225" y="224" font-size="8.5" fill="#b85450">重复</text>

  <rect x="31" y="231" width="198" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a">4</text>
  <text x="175" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a">1</text>

  <rect x="31" y="253" width="198" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a">9</text>
  <text x="175" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a">1</text>

  <rect x="31" y="275" width="198" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="75" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a">10</text>
  <text x="175" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>

  <!-- 悬空评论行（红色背景） -->
  <rect x="31" y="297" width="198" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="75" y="312" text-anchor="middle" font-size="10.5" fill="#b85450">6</text>
  <text x="175" y="312" text-anchor="middle" font-size="10.5" fill="#b85450">7</text>
  <text x="225" y="312" font-size="8.5" fill="#b85450">悬空</text>

  <text x="130" y="330" text-anchor="middle" font-size="9" fill="#888">蓝=帖子 绿=评论 红=悬空</text>

  <!-- ===== 右侧：匹配过程 ===== -->
  <text x="280" y="46" font-size="11" fill="#888">LEFT JOIN 匹配：以帖子为驱动表</text>

  <!-- 帖子 1 -->
  <rect x="290" y="58" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="76" font-size="11.5" fill="#446688" font-weight="bold">帖子 1</text>
  <text x="304" y="93" font-size="10.5" fill="#555">匹配评论 parent_id=1 → sub_id {3, 3, 4, 9}</text>
  <text x="304" y="108" font-size="10.5" fill="#d6a040" font-weight="bold">DISTINCT 去重 → {3, 4, 9} → count = 3</text>

  <!-- 帖子 2 -->
  <rect x="290" y="124" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="142" font-size="11.5" fill="#446688" font-weight="bold">帖子 2</text>
  <text x="304" y="159" font-size="10.5" fill="#555">匹配评论 parent_id=2 → sub_id {5, 10}</text>
  <text x="304" y="174" font-size="10.5" fill="#d6a040" font-weight="bold">DISTINCT 去重 → {5, 10} → count = 2</text>

  <!-- 帖子 12 -->
  <rect x="290" y="190" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="208" font-size="11.5" fill="#446688" font-weight="bold">帖子 12</text>
  <text x="304" y="225" font-size="10.5" fill="#888">无匹配评论（LEFT JOIN 保留，COUNT = 0）</text>

  <!-- 悬空评论 6 -->
  <rect x="290" y="244" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="262" font-size="11.5" fill="#b85450" font-weight="bold">评论 6（悬空）</text>
  <text x="304" y="279" font-size="10.5" fill="#555">parent_id=7，但无 sub_id=7 的帖子行</text>
  <text x="304" y="294" font-size="10.5" fill="#b85450" font-weight="bold">JOIN 匹配失败 → 不计入任何帖子 ✗</text>

  <!-- 连接线：从输入表到匹配框 -->
  <path d="M 232 88 Q 260 88 288 86" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 232 110 Q 260 200 288 152" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 232 154 Q 260 210 288 212" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 232 308 Q 260 290 288 272" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 底部：输出表 ===== -->
  <path d="M 320 306 L 320 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="340" font-size="11" fill="#888">输出（ORDER BY post_id ASC）</text>
  <rect x="200" y="330" width="240" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="200" y1="356" x2="440" y2="356" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="330" x2="300" y2="420" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="348" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">post_id</text>
  <text x="370" y="348" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">number_of_comments</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="370" y="372" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="250" y="390" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="390" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="250" y="408" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="370" y="408" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- 底部提示 -->
  <rect x="40" y="438" width="560" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="456" font-size="10.5" fill="#555" font-weight="bold">💡 关键：以帖子为驱动表 LEFT JOIN</text>
  <text x="60" y="470" font-size="10" fill="#888">悬空评论因 JOIN 匹配失败被自动排除；无评论帖子因 LEFT JOIN 保留且 COUNT=0；重复行靠 DISTINCT / COUNT DISTINCT 消除</text>
</svg>
