<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历 + 单调栈弹栈</text>

  <!-- Start -->
  <rect x="230" y="44" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">stack = []</text>

  <path d="M 280 74 L 280 92" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="200" y="94" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i = 0 … n−1</text>

  <path d="M 280 124 L 280 142" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: pop? -->
  <polygon points="280,144 430,200 280,256 130,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">栈非空 且 栈顶 &gt; nums[i]</text>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">且 len(stack)+(n−i) &gt; k ?</text>

  <!-- Yes: pop, loop back -->
  <path d="M 430 200 L 470 200 L 470 145 L 380 145" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="132" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="372" y="128" width="62" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="403" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">stack.pop()</text>

  <!-- No: go down -->
  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="268" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision 2: len < k? -->
  <polygon points="280,276 380,316 280,356 180,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">len(stack) &lt; k ?</text>

  <!-- Yes: push -->
  <path d="M 380 316 L 430 316" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="310" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="302" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="485" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">stack.push(nums[i])</text>
  <path d="M 485 302 L 485 286 L 280 286 L 280 94" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: skip -->
  <path d="M 280 356 L 280 374" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="368" font-size="9" fill="#888" font-weight="bold">否(跳过)</text>

  <!-- back to loop -->
  <path d="M 230 374 L 90 374 L 90 109 L 200 109" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="240" font-size="9" fill="#888">下一个 i</text>

  <!-- End -->
  <path d="M 280 374 L 280 394" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="396" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return stack</text>

  <!-- side note -->
  <rect x="30" y="396" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="414" font-size="9" fill="#446688" font-weight="bold">每元素至多入栈 1 次、出栈 1 次</text>
  <text x="40" y="428" font-size="9" fill="#555">总操作 ≤ 2n → 时间 O(n)</text>
  <text x="40" y="442" font-size="9" fill="#555">栈最大 k 个 → 空间 O(k)</text>
</svg>
