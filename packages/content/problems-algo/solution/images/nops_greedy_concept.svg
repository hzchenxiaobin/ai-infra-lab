<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">贪心思路：最早结束优先 = 经典区间调度</text>

  <!-- position axis -->
  <line x1="60" y1="150" x2="510" y2="150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="154" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">位置</text>

  <!-- tick labels 0..10 -->
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="70" y="168" text-anchor="middle">0</text>
    <text x="112" y="168" text-anchor="middle">1</text>
    <text x="154" y="168" text-anchor="middle">2</text>
    <text x="196" y="168" text-anchor="middle">3</text>
    <text x="238" y="168" text-anchor="middle">4</text>
    <text x="280" y="168" text-anchor="middle">5</text>
    <text x="322" y="168" text-anchor="middle">6</text>
    <text x="364" y="168" text-anchor="middle">7</text>
    <text x="406" y="168" text-anchor="middle">8</text>
    <text x="448" y="168" text-anchor="middle">9</text>
    <text x="490" y="168" text-anchor="middle">10</text>
  </g>

  <!-- ticks -->
  <g stroke="#888" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="146" x2="70" y2="152"/>
    <line x1="196" y1="146" x2="196" y2="152"/>
    <line x1="322" y1="146" x2="322" y2="152"/>
    <line x1="448" y1="146" x2="448" y2="152"/>
  </g>

  <!-- A[0,3] picked (green) -->
  <rect x="70" y="120" width="126" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="78" y="134" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="196" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">end=3</text>

  <!-- B[1,5] not picked (gray, upper row) -->
  <rect x="112" y="92" width="168" height="20" fill="#eeeeee" stroke="#aaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">B</text>

  <!-- C[4,6] picked -->
  <rect x="238" y="120" width="84" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="246" y="134" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="322" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">end=6</text>

  <!-- D[6,9] picked -->
  <rect x="322" y="120" width="126" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="330" y="134" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="448" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">end=9</text>

  <!-- E[7,10] not picked -->
  <rect x="364" y="92" width="126" height="20" fill="#eeeeee" stroke="#aaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="372" y="106" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">E</text>

  <!-- last_end markers -->
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)">
    <line x1="196" y1="116" x2="196" y2="150"/>
    <line x1="322" y1="116" x2="322" y2="150"/>
    <line x1="448" y1="116" x2="448" y2="150"/>
  </g>
  <text x="196" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">last_end=3</text>
  <text x="322" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">last_end=6</text>
  <text x="448" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">last_end=9</text>

  <!-- pick sequence -->
  <text x="40" y="236" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① 选 A（结束最早，end=3）→ last_end=3</text>
  <text x="40" y="256" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 在 start≥3 中选 C（最早结束，end=6）→ last_end=6</text>
  <text x="40" y="276" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 在 start≥6 中选 D（最早结束，end=9）→ last_end=9</text>
  <text x="40" y="296" text-anchor="start" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">共 3 段 = 最优（交换论证：换最早结束段不增代价）</text>

  <!-- note -->
  <rect x="40" y="308" width="520" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个「区间」= 一个长度 ≥ k 的回文子串；回文预处理 O(n²) 后贪心本体 O(n)</text>
</svg>
