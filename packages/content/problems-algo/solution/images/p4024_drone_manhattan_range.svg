<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <clipPath id="plot"><rect x="70" y="60" width="280" height="280"/></clipPath>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：可达 ⟺ 曼哈顿距离 ≤ range；最近者胜，并列取小下标</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">示例 2：drones = [[2,1,5],[4,4,5],[6,6,8]]，target = [5,5]（无人机 1、2 并列 dist 2）</text>

    <!-- legend -->
    <path d="M 70 52 H 94" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,5" fill="none"/>
    <text x="98" y="55" font-size="8.5" fill="#a87020">range = 5 等距线（无人机 0/1 的判定线）</text>
    <path d="M 300 52 H 324" stroke="#446688" stroke-width="1.4" stroke-dasharray="2,5" fill="none"/>
    <text x="328" y="55" font-size="8.5" fill="#446688">range = 8 等距线（无人机 2 的判定线）</text>

    <!-- grid -->
    <path d="M 98 60 V 340 M 126 60 V 340 M 154 60 V 340 M 182 60 V 340 M 210 60 V 340 M 238 60 V 340 M 266 60 V 340 M 294 60 V 340 M 322 60 V 340" stroke="#e8e8e8" stroke-width="0.8" stroke-dasharray="2,4" fill="none"/>
    <path d="M 70 88 H 350 M 70 116 H 350 M 70 144 H 350 M 70 172 H 350 M 70 200 H 350 M 70 228 H 350 M 70 256 H 350 M 70 284 H 350 M 70 312 H 350" stroke="#e8e8e8" stroke-width="0.8" stroke-dasharray="2,4" fill="none"/>

    <!-- axes -->
    <path d="M 70 340 H 362" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <path d="M 70 340 V 54" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <text x="368" y="344" font-size="10" fill="#777" font-weight="bold">x</text>
    <text x="62" y="50" font-size="10" fill="#777" font-weight="bold">y</text>

    <!-- ticks -->
    <text x="70" y="354" text-anchor="middle" font-size="9" fill="#889">0</text>
    <text x="126" y="354" text-anchor="middle" font-size="9" fill="#889">2</text>
    <text x="182" y="354" text-anchor="middle" font-size="9" fill="#889">4</text>
    <text x="238" y="354" text-anchor="middle" font-size="9" fill="#889">6</text>
    <text x="294" y="354" text-anchor="middle" font-size="9" fill="#889">8</text>
    <text x="350" y="354" text-anchor="middle" font-size="9" fill="#889">10</text>
    <text x="62" y="343" text-anchor="end" font-size="9" fill="#889">0</text>
    <text x="62" y="287" text-anchor="end" font-size="9" fill="#889">2</text>
    <text x="62" y="231" text-anchor="end" font-size="9" fill="#889">4</text>
    <text x="62" y="175" text-anchor="end" font-size="9" fill="#889">6</text>
    <text x="62" y="119" text-anchor="end" font-size="9" fill="#889">8</text>
    <text x="62" y="63" text-anchor="end" font-size="9" fill="#889">10</text>

    <!-- manhattan diamonds centered at target (5,5) -->
    <polygon points="70,200 210,340 350,200 210,60" fill="#fff8e1" fill-opacity="0.3" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,5"/>
    <polygon points="210,-24 434,200 210,424 -14,200" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="2,5" clip-path="url(#plot)"/>

    <!-- L-shaped manhattan paths -->
    <path d="M 126 312 H 210 V 200" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none"/>
    <text x="168" y="306" text-anchor="middle" font-size="8.5" fill="#b85450">Δx=3</text>
    <text x="216" y="262" font-size="8.5" fill="#b85450">Δy=4</text>
    <path d="M 182 228 H 210 V 200" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" fill="none"/>
    <text x="196" y="221" text-anchor="middle" font-size="8" fill="#4a7a3a">Δx=1</text>
    <text x="216" y="221" font-size="8" fill="#4a7a3a">Δy=1</text>
    <path d="M 238 172 H 210 V 200" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" fill="none"/>
    <text x="224" y="166" text-anchor="middle" font-size="8" fill="#446688">Δx=1</text>
    <text x="204" y="190" text-anchor="end" font-size="8" fill="#446688">Δy=1</text>

    <!-- target -->
    <circle cx="210" cy="200" r="9" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="2,3"/>
    <circle cx="210" cy="200" r="6" fill="#b85450"/>
    <text x="222" y="196" font-size="9.5" fill="#b85450" font-weight="bold">目标 (5,5)</text>

    <!-- drones -->
    <circle cx="126" cy="312" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="130" y="331" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">无人机0 (2,1) ✗</text>
    <circle cx="182" cy="228" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="172" y="231" text-anchor="end" font-size="8.5" fill="#4a7a3a" font-weight="bold">无人机1 (4,4) ✓</text>
    <circle cx="238" cy="172" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="248" y="176" font-size="8.5" fill="#446688" font-weight="bold">无人机2 (6,6) ✓</text>

    <!-- right: judgement box -->
    <rect x="465" y="64" width="142" height="228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="536" y="86" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">逐架判定（示例 2）</text>
    <text x="536" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">无人机0：dist 7 &gt; 5 → ✗</text>
    <text x="536" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">无人机1：dist 2 ≤ 5 → ✓</text>
    <text x="536" y="146" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">无人机2：dist 2 ≤ 8 → ✓</text>
    <path d="M 483 160 H 589" stroke="#d6a040" stroke-width="1.2"/>
    <text x="536" y="180" text-anchor="middle" font-size="9" fill="#7a5c1a">无人机 1、2 并列 dist 2</text>
    <text x="536" y="197" text-anchor="middle" font-size="9" fill="#7a5c1a">严格小于不换 ⇒ 小下标</text>
    <text x="536" y="220" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">答案 = 1</text>
    <path d="M 483 236 H 589" stroke="#d6a040" stroke-width="1.2"/>
    <text x="536" y="256" text-anchor="middle" font-size="8.5" fill="#a87020">dist = |Δx| + |Δy|（L 形路）</text>
    <text x="536" y="274" text-anchor="middle" font-size="8.5" fill="#a87020">菱形 = 曼哈顿等距线</text>
    <text x="536" y="288" text-anchor="middle" font-size="8.5" fill="#a87020">各无人机判各自的 range</text>

    <!-- bottom takeaway -->
    <rect x="40" y="385" width="560" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="58" y="405" font-size="10.5" fill="#446688" font-weight="bold">三句话吃透本题</text>
    <text x="58" y="423" font-size="9" fill="#33506b">① 曼哈顿距离 = |Δx| + |Δy|：先横后竖的 L 形路；range 的等距线是以目标为心的菱形，各判各的</text>
    <text x="58" y="441" font-size="9" fill="#33506b">② 可达（dist ≤ range）是入围门槛，最近是夺魁标准；更新用严格小于 ⇒ 并列时先到的小下标天然留下</text>
    <text x="58" y="459" font-size="9" fill="#33506b">③ best 初值 −1 兼作「无可达」返回值；bestDist 初值 +∞ 保证首个可达无人机必入选</text>
  </g>
</svg>
