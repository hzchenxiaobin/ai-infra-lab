<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">法三：中序模拟 —— 链表顺序 = BST 中序序列</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">递归顺序（左→根→右）恰好 = 中序遍历顺序 = 链表顺序</text>

  <!-- ===== 链表节点（顶部） ===== -->
  <g font-size="13">
    <rect x="40" y="74" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="70" y="95" text-anchor="middle" fill="#333" font-weight="bold">-10</text>
    <line x1="100" y1="90" x2="128" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="134" y="74" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="164" y="95" text-anchor="middle" fill="#333" font-weight="bold">-3</text>
    <line x1="194" y1="90" x2="222" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="228" y="74" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="258" y="95" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <line x1="288" y1="90" x2="316" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="322" y="74" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="352" y="95" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="382" y1="90" x2="410" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="416" y="74" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="446" y="95" text-anchor="middle" fill="#333" font-weight="bold">9</text>
  </g>

  <!-- curr 指针 -->
  <rect x="48" y="48" width="46" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="71" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 71 68 L 70 74" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 填值顺序编号 -->
  <text x="70" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">①</text>
  <text x="164" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">②</text>
  <text x="258" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <text x="352" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④</text>
  <text x="446" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑤</text>

  <!-- ===== 递归调用结构（中序） ===== -->
  <text x="50" y="160" font-size="12" fill="#555" font-weight="bold">递归 build(L, R) 执行顺序（= 中序 = 左→根→右）：</text>

  <!-- build(0,4) 根 -->
  <rect x="232" y="172" width="116" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="191" text-anchor="middle" font-size="11" fill="#333">build(0,4) ③取0</text>

  <!-- build(0,1) 左 -->
  <rect x="80" y="220" width="116" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="239" text-anchor="middle" font-size="11" fill="#333">build(0,1) ②取-3</text>
  <path d="M 250 200 L 138 220" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- build(3,4) 右 -->
  <rect x="384" y="220" width="116" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="239" text-anchor="middle" font-size="11" fill="#333">build(3,4) ④取5</text>
  <path d="M 330 200 L 442 220" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- build(0,0) 左叶 -->
  <rect x="20" y="268" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="286" text-anchor="middle" font-size="10" fill="#333">build(0,0) ①取-10</text>
  <path d="M 120 248 L 70 268" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- build(4,4) 右叶 -->
  <rect x="460" y="268" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="510" y="286" text-anchor="middle" font-size="10" fill="#333">build(4,4) ⑤取9</text>
  <path d="M 460 248 L 510 268" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== 关键说明框 ===== -->
  <rect x="40" y="312" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="334" font-size="12" fill="#8a6a20" font-weight="bold">核心：递归顺序 = 中序顺序，故按链表顺序依次填值</text>
  <text x="52" y="352" font-size="11" fill="#555">build(L,R)：先 build(L,mid-1) 建左子树（消耗左半节点），</text>
  <text x="52" y="368" font-size="11" fill="#555">再取 curr.val 为根、curr 前进，最后 build(mid+1,R) 建右子树</text>
  <text x="52" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">无需显式找中点，只用区间长度定位「该在哪取根」</text>
</svg>
