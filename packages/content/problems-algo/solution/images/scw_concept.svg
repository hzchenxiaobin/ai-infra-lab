<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：词频覆盖 —— 单词必须「不缺」车牌里的每个字母</text>

  <!-- licensePlate raw -->
  <text x="36" y="64" font-size="12" fill="#888">车牌原文</text>
  <rect x="90" y="46" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="165" y="69" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1s3 PSt</text>

  <!-- arrow to extract letters -->
  <path d="M 244 63 L 286 63" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">提取字母</text>

  <!-- extracted letters -->
  <rect x="290" y="46" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="375" y="69" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">s, s, p, t</text>
  <text x="470" y="64" font-size="10" fill="#888">忽略数字/空格</text>
  <text x="470" y="76" font-size="10" fill="#888">统一小写</text>

  <!-- arrow to freq table -->
  <path d="M 375 84 L 375 108" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="100" font-size="10" fill="#4a7a3a">统计频次</text>

  <!-- need freq table -->
  <text x="36" y="128" font-size="12" fill="#888">需求频次 need</text>
  <rect x="90" y="112" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s:2</text>
  <rect x="156" y="112" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p:1</text>
  <rect x="222" y="112" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t:1</text>

  <!-- separator -->
  <line x1="30" y1="160" x2="550" y2="160" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- candidate steps -->
  <text x="36" y="186" font-size="12" fill="#888">候选 steps</text>
  <rect x="90" y="170" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s:2</text>
  <rect x="156" y="170" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p:1</text>
  <rect x="222" y="170" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t:1</text>
  <text x="300" y="190" font-size="12" fill="#444">每项 ≥ need →</text>
  <rect x="400" y="170" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">补全词 ✓</text>

  <!-- candidate step (fail) -->
  <text x="36" y="226" font-size="12" fill="#888">候选 step</text>
  <rect x="90" y="210" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">s:1</text>
  <rect x="156" y="210" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p:1</text>
  <rect x="222" y="210" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t:1</text>
  <text x="300" y="230" font-size="12" fill="#b85450" font-weight="bold">s:1 &lt; need 2 →</text>
  <rect x="400" y="210" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非补全词 ✗</text>

  <!-- key rules -->
  <rect x="30" y="266" width="520" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="290" font-size="12" fill="#446688" font-weight="bold">三条关键规则</text>
  <text x="50" y="312" font-size="11" fill="#444">① 车牌只取字母：跳过数字 0-9 与空格，大小写统一转小写（A/a 视作同一字母）</text>
  <text x="50" y="332" font-size="11" fill="#444">② 「覆盖」判定：对 need 中每个字母 c，单词里 c 的频次必须 ≥ need[c]（多则不碍，少则不行）</text>
  <text x="50" y="352" font-size="11" fill="#444">③ 选最短：在所有补全词里挑长度最短者；并列时返回数组中靠前者（保持首次出现）</text>
  <text x="50" y="372" font-size="10" fill="#888">频次表用 26 长数组 int[26] 实现即可，比哈希更快；need 至多 7 个字母，覆盖判定 O(26)</text>
</svg>
