<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：单店上限 x 越大 → 所需商店数 g(x) 越少（单调递减）</text>

  <!-- Input -->
  <text x="40" y="52" font-size="12" fill="#888">n = 6 商店, quantities = [11, 6]</text>

  <!-- ===== Store distribution: x=3 ===== -->
  <!-- Product 0 bracket -->
  <text x="185" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">商品 0：11 件 → ⌈11/3⌉ = 4 间</text>

  <!-- Product 0 stores: 2, 3, 3, 3 (blue) -->
  <rect x="80" y="82" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="82" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="188" y="82" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="242" y="82" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- separator between product groups -->
  <line x1="300" y1="76" x2="300" y2="130" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Product 1 bracket -->
  <text x="365" y="72" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">商品 1：6 件 → ⌈6/3⌉ = 2 间</text>

  <!-- Product 1 stores: 3, 3 (orange) -->
  <rect x="314" y="82" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="368" y="82" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- store labels -->
  <text x="104" y="138" text-anchor="middle" font-size="9" fill="#999">店1</text>
  <text x="158" y="138" text-anchor="middle" font-size="9" fill="#999">店2</text>
  <text x="212" y="138" text-anchor="middle" font-size="9" fill="#999">店3</text>
  <text x="266" y="138" text-anchor="middle" font-size="9" fill="#999">店4</text>
  <text x="338" y="138" text-anchor="middle" font-size="9" fill="#999">店5</text>
  <text x="392" y="138" text-anchor="middle" font-size="9" fill="#999">店6</text>

  <!-- max label -->
  <rect x="430" y="86" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="486" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max = 3 ← 目标</text>

  <!-- arrow down -->
  <path d="M 280 150 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="162" font-size="11" fill="#888">g(3) = 6 ≤ n ✓</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="80" y1="185" x2="80" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="370" x2="400" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="191" text-anchor="end" font-size="10" fill="#888">商店数</text>
  <text x="404" y="374" font-size="10" fill="#888">x →</text>
  <text x="74" y="374" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y ticks: 17 (top), 1 (bottom) -->
  <text x="74" y="214" text-anchor="end" font-size="9" fill="#aaa">17</text>
  <line x1="78" y1="340" x2="82" y2="340" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="344" text-anchor="end" font-size="9" fill="#aaa">1</text>

  <!-- decreasing step curve: g(x) = ceil(11/x)+ceil(6/x) -->
  <!-- x=1:17, x=2:9, x=3:6, x=4:5, x=5:5, x=6:3, x=7..10:3, x=11:2 -->
  <path d="M 90 210 L 119 210 L 119 275 L 148 275 L 148 299 L 177 299 L 177 307 L 235 307 L 235 324 L 380 324 L 380 332"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="130" y="250" font-size="11" fill="#446688" font-weight="bold">x ↑ ⇒ g(x) ↓</text>

  <!-- n threshold line -->
  <line x1="80" y1="299" x2="400" y2="299" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="404" y="303" font-size="11" fill="#b85450" font-weight="bold">n = 6</text>

  <!-- answer point at x=3 -->
  <circle cx="148" cy="299" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="148" y1="299" x2="148" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="148" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x* = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="100" y="293" font-size="10" fill="#b85450">商店不够 ✗</text>
  <text x="300" y="293" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="412" y="210" width="138" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="481" y="234" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="481" y="256" text-anchor="middle" font-size="11" fill="#666">x ∈ [1, max(q)]</text>
  <text x="481" y="276" text-anchor="middle" font-size="11" fill="#666">求最小的 x</text>
  <text x="481" y="296" text-anchor="middle" font-size="11" fill="#666">使 g(x) ≤ n</text>
  <text x="481" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
