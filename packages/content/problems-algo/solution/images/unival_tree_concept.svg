<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单值二叉树：以 root.val 为基准值，DFS 逐节点比对</text>

  <!-- 左：示例1 [1,1,1,1,1,null,1] 全 1，true -->
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">示例1：基准=1 → true</text>

  <line x1="132" y1="88" x2="108" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="88" x2="178" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="140" cy="78" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>

  <line x1="99" y1="146" x2="80" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="113" y1="146" x2="132" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="186" y1="146" x2="208" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="106" cy="134" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="186" cy="134" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>

  <circle cx="78" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="200" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="134" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="200" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="210" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="10" fill="#333">1</text>

  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部 = 1 ✓</text>

  <!-- 右：示例2 [2,2,2,5,2] 含 5，false -->
  <text x="400" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例2：基准=2 → false</text>

  <line x1="392" y1="88" x2="368" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="408" y1="88" x2="438" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="400" cy="78" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="11" fill="#333">2</text>

  <line x1="359" y1="146" x2="340" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="373" y1="146" x2="392" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="366" cy="134" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="446" cy="134" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="446" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>

  <circle cx="338" cy="196" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="338" y="200" text-anchor="middle" font-size="10" fill="#333">5</text>
  <circle cx="394" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="394" y="200" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 早停：从 5 引出虚线箭头 -->
  <path d="M 338 210 L 338 228" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5 ≠ 2 ✗ 立即返回 false</text>

  <!-- 说明框 -->
  <rect x="40" y="278" width="480" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心观察</text>
  <text x="60" y="324" font-size="11" fill="#555">整树单值 ⟺ 每个节点 val 都等于 root.val（基准值）</text>
  <text x="60" y="342" font-size="11" fill="#4a7a3a">无需后序传递子树结论——拿根值做全局基准，遇到不等立即短路返回 false</text>
  <text x="60" y="360" font-size="11" fill="#b85450">对照 250 题：250 需逐子树判定故用后序布尔传递；965 只判整树，基准值法更简</text>
</svg>
