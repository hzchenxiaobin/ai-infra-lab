<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">复制粘贴爆发与 DP 递推</text>

  <!-- timeline -->
  <line x1="40" y1="180" x2="520" y2="180" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="184" font-size="12" fill="#446688" filter="url(#rough2)">步数</text>

  <!-- ticks for j-1, j, j+1, j+2, j+3 ... i -->
  <!-- j position -->
  <line x1="170" y1="172" x2="170" y2="188" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j</text>

  <!-- j+1 Ctrl-A -->
  <line x1="250" y1="172" x2="250" y2="188" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="206" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j+1</text>

  <!-- j+2 Ctrl-C -->
  <line x1="330" y1="172" x2="330" y2="188" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="206" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j+2</text>

  <!-- i Ctrl-V last -->
  <line x1="470" y1="172" x2="470" y2="188" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="206" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i</text>

  <!-- screen box at j -->
  <rect x="120" y="120" width="100" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">屏幕 = dp[j]</text>

  <!-- burst region bracket -->
  <rect x="226" y="92" width="252" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="352" y="84" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">一次「复制粘贴爆发」</text>

  <!-- labels under burst steps -->
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Ctrl-A</text>
  <text x="330" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Ctrl-C</text>
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">Ctrl-V ×(i−j−2)</text>

  <!-- buffer arrow -->
  <line x1="330" y1="188" x2="400" y2="250" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">缓冲区 = dp[j]，每次粘贴 +dp[j]</text>

  <!-- result formula box -->
  <rect x="110" y="290" width="340" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[i] = dp[j] × (i − j − 1)</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原有 1 份 + 粘贴 (i−j−2) 份 = 乘 (i−j−1)</text>

  <!-- link from dp[j] box to formula -->
  <line x1="170" y1="160" x2="200" y2="290" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
</svg>
