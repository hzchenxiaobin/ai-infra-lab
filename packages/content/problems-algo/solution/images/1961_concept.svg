<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：游标 i 对齐 s，逐词逐字符比对，词末 i == n 即命中</text>

  <!-- ===== Case 1: s ends at word boundary (true) ===== -->
  <text x="40" y="56" font-size="12.5" fill="#555" font-weight="bold">情形一：s 恰在词界结束 → true ✓</text>

  <!-- s string boxes -->
  <text x="40" y="82" font-size="11" fill="#888">s =</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="78" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="93" y="87">i</text>
    <rect x="108" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="123" y="87">l</text>
    <rect x="138" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="153" y="87">o</text>
    <rect x="168" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="183" y="87">v</text>
    <rect x="198" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="213" y="87">e</text>
    <rect x="228" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="243" y="87">l</text>
    <rect x="258" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="87">e</text>
    <rect x="288" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="303" y="87">e</text>
    <rect x="318" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="333" y="87">t</text>
    <rect x="348" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="363" y="87">c</text>
    <rect x="378" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="393" y="87">o</text>
    <rect x="408" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="423" y="87">d</text>
    <rect x="438" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="453" y="87">e</text>
  </g>
  <!-- n=13 marker -->
  <text x="468" y="82" font-size="10.5" fill="#888">n=13</text>

  <!-- words grouped below with brackets -->
  <text x="40" y="120" font-size="11" fill="#888">words:</text>

  <!-- word 1: "i" (indices 0) -->
  <rect x="76" y="108" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="93" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">"i"</text>

  <!-- word 2: "love" (indices 1-4) -->
  <rect x="112" y="108" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="171" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">"love"</text>

  <!-- word 3: "leetcode" (indices 5-12) -->
  <rect x="232" y="108" width="238" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">"leetcode"</text>

  <!-- word 4: "apples" (not consumed) -->
  <rect x="472" y="108" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="512" y="126" text-anchor="middle" font-size="10.5" fill="#999">"apples" (跳过)</text>

  <!-- word boundary line at i=13 -->
  <path d="M 468 64 L 468 138" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="476" y="146" font-size="10.5" fill="#4a7a3a" font-weight="bold">词界 i==n ✓</text>

  <!-- result box -->
  <rect x="76" y="158" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="266" y="177" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i 在 "leetcode" 末尾恰等于 n=13 → return true</text>

  <!-- Divider -->
  <path d="M 40 206 L 540 206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Case 2: s ends mid-word (false) ===== -->
  <text x="40" y="232" font-size="12.5" fill="#555" font-weight="bold">情形二：s 在词中间结束 → false ✗</text>

  <text x="40" y="258" font-size="11" fill="#888">s =</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="78" y="244" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="93" y="263">i</text>
    <rect x="108" y="244" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="123" y="263">l</text>
    <rect x="138" y="244" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="153" y="263">o</text>
  </g>
  <text x="178" y="258" font-size="10.5" fill="#888">n=3</text>

  <text x="40" y="296" font-size="11" fill="#888">words:</text>

  <!-- word 1: "ilove" (s only matches first 3 chars, word has 5) -->
  <rect x="76" y="284" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="302" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">"ilove"</text>

  <!-- matched portion vs unmatched -->
  <path d="M 168 240 L 168 278" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="100" y="322" font-size="10" fill="#4a7a3a">i,l,o ✓</text>
  <text x="195" y="322" font-size="10" fill="#b85450" font-weight="bold">v,e: i≥n 越界!</text>

  <!-- cursor i=3 at boundary -->
  <path d="M 168 240 L 168 318" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="176" y="252" font-size="10.5" fill="#b85450" font-weight="bold">i=3=n</text>

  <rect x="76" y="330" width="380" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="266" y="349" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"ilove" 仍有 'v','e' 但 i≥n → 越界保护 return false</text>

  <!-- ===== Case 3: mismatch (false) ===== -->
  <path d="M 40 378 L 540 378" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="404" font-size="12.5" fill="#555" font-weight="bold">情形三：字符失配 → false ✗</text>

  <text x="40" y="430" font-size="11" fill="#888">s[0]='i'</text>
  <text x="120" y="430" font-size="12" fill="#b85450" font-weight="bold">≠</text>
  <text x="140" y="430" font-size="11" fill="#888">words[0][0]='a' ("apples")</text>
  <text x="280" y="430" font-size="11" fill="#888">→</text>
  <rect x="300" y="416" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="433" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">首字符即失配 → false</text>
</svg>
