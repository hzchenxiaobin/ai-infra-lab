<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">filter 谓词筛：真值者过，假值者落</text>

  <!-- arr row (green) -->
  <text x="34" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">arr</text>
  <rect x="75" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="175" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="275" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="375" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="475" y="58" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- down arrows into gate -->
  <path d="M95,87 L95,128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M195,87 L195,128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M295,87 L295,128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M395,87 L395,128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M495,87 L495,128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- gate -->
  <rect x="55" y="130" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="158" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">谓词门：fn(arr[i], i) 返回值是真值？</text>

  <!-- truthy pass arrows (green) for −2,0,1,2 -->
  <path d="M95,176 L95,222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="106" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">过</text>
  <path d="M295,176 L295,222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="306" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">过</text>
  <path d="M395,176 L395,222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="406" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">过</text>
  <path d="M495,176 L495,222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="506" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">过</text>

  <!-- falsy drop for −1: red X + deflected tag -->
  <path d="M187,182 L203,198 M203,182 L187,198" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M195,176 L240,210" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="206" font-size="11" fill="#b85450" filter="url(#rough2)">落（假值 0）</text>

  <!-- output row (blue) -->
  <text x="20" y="244" font-size="12" fill="#446688" filter="url(#rough2)">filteredArr</text>
  <rect x="75" y="222" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="275" y="222" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="375" y="222" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="475" y="222" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="290" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">保留原元素 arr[i]，不是 fn 的返回值；输出长度 ≤ n</text>
</svg>
