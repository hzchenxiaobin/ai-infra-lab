<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心不变式：已处理硬币的子集和恰好覆盖 [1, x−1]，x 是最小缺口</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后逐枚考察 c；初始 x = 1（覆盖为空，空子序列不算金额）</text>

  <!-- case 1: c <= x -->
  <text x="70" y="72" text-anchor="start" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 下一枚 c ≤ x：新段 [c, c+x−1] 与旧段重叠/相接</text>
  <rect x="70" y="84" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">已覆盖（旧子集和）</text>
  <text x="150" y="111" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ··· x−1</text>
  <rect x="212" y="84" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="96" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">新段（旧和 + c）</text>
  <text x="292" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">c ··· c+x−1</text>

  <path d="M 260 116 L 260 134" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="70" y="138" width="302" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">合并（无缝）</text>
  <text x="221" y="165" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ··· x+c−1</text>
  <text x="386" y="159" text-anchor="start" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">x ← x + c</text>

  <!-- case 2: c > x -->
  <text x="70" y="196" text-anchor="start" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">② 下一枚 c &gt; x（或硬币用尽）：x 成了真缺口</text>
  <rect x="70" y="208" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">已覆盖</text>
  <text x="135" y="235" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ··· x−1</text>
  <rect x="208" y="208" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="220" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">缺口</text>
  <text x="230" y="235" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">x</text>
  <path d="M 254 224 L 298 224" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="276" y="218" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">?</text>
  <rect x="300" y="208" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="220" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">够不着</text>
  <text x="345" y="235" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c ···</text>

  <path d="M 230 240 L 230 260" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="120" y="264" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="9" fill="#8a6420" filter="url(#rough2)">必须补一枚新硬币</text>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">补面值 x ⇒ 覆盖 [1, 2x−1]，x ← 2x</text>

  <!-- bottom note -->
  <rect x="48" y="316" width="424" height="72" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">任何可行方案此刻都得补一枚 y ≤ x 的硬币——未处理面值全 ≥ c &gt; x，救不了 x</text>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y = x 让覆盖恰好翻倍：y &lt; x 增长慢半拍，y &gt; x 连 x 本身都补不上</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x 每次翻倍 ⇒ 补币次数至多 ⌈log₂ target⌉ + 1 次</text>
</svg>
