<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat = [[0,0],[0,1]]，3 次翻转归零</text>

  <!-- ===== Grid 1: start [[0,0],[0,1]] ===== -->
  <text x="114" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">初始</text>
  <!-- (0,0)=0 -->
  <rect x="72" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="98" text-anchor="middle" font-size="14" fill="#333">0</text>
  <!-- (0,1)=0 -->
  <rect x="114" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="98" text-anchor="middle" font-size="14" fill="#333">0</text>
  <!-- (1,0)=0 -->
  <rect x="72" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="140" text-anchor="middle" font-size="14" fill="#333">0</text>
  <!-- (1,1)=1 highlight problem -->
  <rect x="114" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="114" y="172" text-anchor="middle" font-size="10" fill="#888">init = 0b1000 = 8</text>

  <!-- arrow 1 -->
  <path d="M 162 133 L 196 133" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="179" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">翻(1,0)</text>
  <text x="179" y="150" text-anchor="middle" font-size="9" fill="#888">⊕13</text>

  <!-- ===== Grid 2: after flip(1,0) [[1,0],[1,0]] ===== -->
  <text x="242" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">第 1 次</text>
  <!-- (0,0)=1 changed -->
  <rect x="200" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <!-- (0,1)=0 -->
  <rect x="242" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="98" text-anchor="middle" font-size="14" fill="#333">0</text>
  <!-- (1,0)=1 changed -->
  <rect x="200" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <!-- (1,1)=0 changed -->
  <rect x="242" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="242" y="172" text-anchor="middle" font-size="10" fill="#888">8⊕13 = 5</text>

  <!-- arrow 2 -->
  <path d="M 290 133 L 324 133" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="307" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">翻(0,1)</text>
  <text x="307" y="150" text-anchor="middle" font-size="9" fill="#888">⊕11</text>

  <!-- ===== Grid 3: after flip(0,1) [[0,1],[1,1]] ===== -->
  <text x="370" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">第 2 次</text>
  <!-- (0,0)=0 changed -->
  <rect x="328" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <!-- (0,1)=1 changed -->
  <rect x="370" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <!-- (1,0)=1 -->
  <rect x="328" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- (1,1)=1 changed -->
  <rect x="370" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="370" y="172" text-anchor="middle" font-size="10" fill="#888">5⊕11 = 14</text>

  <!-- arrow 3 -->
  <path d="M 418 133 L 452 133" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="435" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">翻(1,1)</text>
  <text x="435" y="150" text-anchor="middle" font-size="9" fill="#888">⊕14</text>

  <!-- ===== Grid 4: after flip(1,1) [[0,0],[0,0]] ===== -->
  <text x="498" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">归零 ✓</text>
  <!-- (0,0)=0 changed -->
  <rect x="456" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <!-- (0,1)=0 changed -->
  <rect x="498" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="519" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <!-- (1,0)=0 changed -->
  <rect x="456" y="112" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <!-- (1,1)=0 changed -->
  <rect x="498" y="112" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="519" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="498" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">14⊕14 = 0</text>

  <!-- ===== Bottom: XOR verification ===== -->
  <rect x="40" y="200" width="520" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">掩码 XOR 验证：所选格子翻转掩码的 XOR = init 即可归零</text>

  <!-- flip masks row -->
  <text x="60" y="250" font-size="11" fill="#555">flip(1,0)=0b1101=13</text>
  <text x="60" y="270" font-size="11" fill="#555">flip(0,1)=0b1011=11</text>
  <text x="60" y="290" font-size="11" fill="#555">flip(1,1)=0b1110=14</text>

  <text x="200" y="270" font-size="14" fill="#888" font-weight="bold">⊕⊕</text>

  <rect x="230" y="252" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">13⊕11⊕14</text>

  <text x="346" y="274" font-size="14" fill="#888" font-weight="bold">=</text>

  <rect x="362" y="252" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="392" y="276" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>

  <text x="438" y="274" font-size="11" fill="#888">= init</text>

  <text x="300" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 个掩码 XOR = init → 翻转这 3 格即归零，答案 = 3</text>
</svg>
