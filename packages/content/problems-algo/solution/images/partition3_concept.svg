<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：总和能被 3 整除 → 找三段和均为 total/3
  </text>

  <!-- 原数组标签 -->
  <text x="16" y="94" font-size="12" fill="#555" filter="url(#rough2)">原数组</text>

  <!-- Row1 原数组 boxes  [0,2,1,-6,6,-7,9,1,2,0,1]  y=72 h=34  step 38 -->
  <!-- Part1 [0..2]=green  Part2 [3..7]=blue  Part3 [8..10]=orange -->
  <g filter="url(#rough2)">
    <rect x="70"  y="72" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="108" y="72" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="146" y="72" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="72" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="72" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="260" y="72" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="298" y="72" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="336" y="72" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="72" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="412" y="72" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="450" y="72" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="88"  y="94">0</text>
    <text x="126" y="94">2</text>
    <text x="164" y="94">1</text>
    <text x="202" y="94">−6</text>
    <text x="240" y="94">6</text>
    <text x="278" y="94">−7</text>
    <text x="316" y="94">9</text>
    <text x="354" y="94">1</text>
    <text x="392" y="94">2</text>
    <text x="430" y="94">0</text>
    <text x="468" y="94">1</text>
  </g>

  <!-- 下标关键点 -->
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="88"  y="118">0</text>
    <text x="164" y="118">2</text>
    <text x="202" y="118">3</text>
    <text x="354" y="118">7</text>
    <text x="392" y="118">8</text>
    <text x="468" y="118">10</text>
  </g>

  <!-- 三个部分括号 + 求和 -->
  <!-- Part1 括号 70..182 -->
  <path d="M70,128 L70,134 L182,134 L182,128" fill="none" stroke="#4a7a3a"
        stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="126" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    第 1 段 = 0+2+1 = 3
  </text>

  <!-- Part2 括号 184..372 -->
  <path d="M184,128 L184,134 L372,134 L372,128" fill="none" stroke="#446688"
        stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="278" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    第 2 段 = −6+6−7+9+1 = 3
  </text>

  <!-- Part3 括号 374..486 -->
  <path d="M374,128 L374,134 L486,134 L486,128" fill="none" stroke="#d6a040"
        stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    第 3 段 = 2+0+1 = 3
  </text>

  <!-- 求和等式箭头 -->
  <line x1="280" y1="162" x2="280" y2="182" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total / 3 = target 说明 -->
  <rect x="80" y="186" width="400" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    total = 9，target = total / 3 = 3
  </text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    先判 total % 3 ≠ 0 直接返回 false
  </text>

  <!-- 贪心策略说明 -->
  <rect x="80" y="244" width="400" height="68" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    贪心：从左到右累加 cur
  </text>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">
    每当 cur == target 就切一段、count++、cur 归零
  </text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">
    最终 count ≥ 3 即可三等分
  </text>

  <!-- 结论 -->
  <rect x="80" y="324" width="400" height="40" rx="16" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    三段和均为 target = 3 → 返回 true
  </text>
</svg>
