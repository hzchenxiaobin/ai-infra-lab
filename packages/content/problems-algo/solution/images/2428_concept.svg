<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：沙漏 = 顶行 3 连和 + 中格 + 底行 3 连和</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">行前缀和把每段 3 连和压成 O(1)（示例取自 2428 样例左上 3×3）</text>

  <!-- ===== LEFT: 3x3 hourglass grid ===== -->
  <text x="121" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">沙漏形状（3×3，挖去左右中格）</text>

  <!-- excluded cells (1,0) and (1,2): gray with X -->
  <rect x="40" y="134" width="54" height="54" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="48" y1="142" x2="86" y2="180" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="86" y1="142" x2="48" y2="180" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="167" text-anchor="middle" font-size="12" fill="#bbb">4</text>

  <rect x="148" y="134" width="54" height="54" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="156" y1="142" x2="194" y2="180" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="194" y1="142" x2="156" y2="180" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="167" text-anchor="middle" font-size="12" fill="#bbb">1</text>

  <!-- top row: blue -->
  <rect x="40" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="67" y="113" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <rect x="94" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="121" y="113" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <rect x="148" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="113" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <!-- middle cell (1,1): green -->
  <rect x="94" y="134" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- bottom row: blue -->
  <rect x="40" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="67" y="221" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <rect x="94" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="121" y="221" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <rect x="148" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="221" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">8</text>

  <!-- row labels -->
  <text x="34" y="111" text-anchor="end" font-size="10" fill="#888">i</text>
  <text x="34" y="165" text-anchor="end" font-size="10" fill="#888">i+1</text>
  <text x="34" y="219" text-anchor="end" font-size="10" fill="#888">i+2</text>

  <!-- arrow to right -->
  <path d="M 212 161 L 268 161" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== RIGHT: decomposition ===== -->
  <!-- top row sum -->
  <rect x="282" y="84" width="252" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="104" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">顶行 3 连和 = 6+2+1 = 9</text>
  <text x="408" y="121" text-anchor="middle" font-size="9.5" fill="#888">pref[i][j+3] − pref[i][j]</text>

  <text x="408" y="143" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">+</text>

  <!-- mid -->
  <rect x="282" y="149" width="252" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="173" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">中格 = grid[i+1][j+1] = 2</text>

  <text x="408" y="200" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">+</text>

  <!-- bot row sum -->
  <rect x="282" y="206" width="252" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="226" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">底行 3 连和 = 9+2+8 = 19</text>
  <text x="408" y="243" text-anchor="middle" font-size="9.5" fill="#888">pref[i+2][j+3] − pref[i+2][j]</text>

  <!-- = arrow -->
  <path d="M 408 256 L 408 276" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="300" y="280" width="216" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="408" y="305" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">H(i,j) = 9 + 2 + 19 = 30</text>

  <!-- footer note -->
  <rect x="40" y="338" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">行前缀和：pref[r][c] = grid[r][0]+…+grid[r][c−1]，段和 = pref[r][R+1] − pref[r][L]</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#888">沙漏只跨 3 列，每段 3 连和 O(1)；枚举所有 (i,j) 共 (m−2)(n−2) 个沙漏</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">时间 O(m·n)，空间 O(n)（仅存当前两行前缀和即可）</text>
</svg>
