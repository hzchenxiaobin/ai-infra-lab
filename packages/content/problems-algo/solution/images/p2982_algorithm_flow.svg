<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 + 每字符维护前三大</text>

  <!-- start -->
  <rect x="200" y="42" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始遍历 i</text>

  <path d="M 260 74 L 260 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: same char -->
  <polygon points="260,96 350,132 260,168 170,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">s[i] == s[i-1] ?</text>
  <text x="260" y="145" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">（i=0 视为否）</text>

  <path d="M 170 132 L 96 132 L 96 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="130" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 350 132 L 424 132 L 424 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="384" y="124" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- run update -->
  <rect x="36" y="190" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">新游程开始</text>
  <text x="96" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">run = 1</text>

  <rect x="364" y="190" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="424" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">游程延续</text>
  <text x="424" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">run += 1</text>

  <path d="M 96 230 L 96 252 L 214 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 424 230 L 424 252 L 306 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- insert into top3 -->
  <rect x="216" y="232" width="88" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">把 run 插入</text>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">top3[c]</text>

  <!-- top3 detail box -->
  <rect x="120" y="284" width="280" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">top3[c] = 该字符 len 值的前三大（降序数组，3 次比较插入）</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c = s[i]；游程内逐位插入 1,2,…,L，自动去重排序</text>

  <path d="M 260 264 L 260 282" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 260 336 L 260 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="350" font-size="10" fill="#446688" filter="url(#rough2)">i 自增，直到扫完</text>

  <!-- final step -->
  <rect x="140" y="358" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">遍历 26 个字符：ans = max(ans, top3[c][2])</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（top3[c][2] = 0 表示不足 3 个值，跳过）</text>

  <path d="M 260 396 L 260 412" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="170" y="414" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans（初始 −1）</text>
</svg>
