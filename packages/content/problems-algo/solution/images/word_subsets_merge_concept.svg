<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：把 words2 的多个需求合并成一张「最大频次表」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">words2 = ["c", "cc", "b"] → 每个词单独提需求，按字母取 max 合并</text>

  <!-- ===== Column 1: "c" ===== -->
  <text x="95" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">words2[0]</text>
  <rect x="60" y="86" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">"c"</text>
  <text x="95" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">频次:</text>
  <rect x="60" y="146" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c: 1</text>

  <!-- ===== Column 2: "cc" ===== -->
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">words2[1]</text>
  <rect x="245" y="86" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">"cc"</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">频次:</text>
  <rect x="245" y="146" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c: 2</text>

  <!-- ===== Column 3: "b" ===== -->
  <text x="465" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">words2[2]</text>
  <rect x="430" y="86" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">"b"</text>
  <text x="465" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">频次:</text>
  <rect x="430" y="146" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b: 1</text>

  <!-- ===== Arrows down to merge ===== -->
  <path d="M 95 178 L 210 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 178 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 178 L 350 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">逐字母取 max</text>

  <!-- ===== Merged maxFreq ===== -->
  <rect x="170" y="234" width="220" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">合并后的 maxFreq（唯一需求表）</text>
  <text x="280" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b: 1    c: 2</text>

  <!-- ===== Note ===== -->
  <rect x="40" y="300" width="480" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">合并后只需一次判定：a 的频次 ⊇ maxFreq 即为通用单词</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">取 max 因 "cc" 比 "c" 对 c 的需求更苛刻，满足 maxFreq 必满足所有 words2</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">O(|words1|·L + |words2|·L) 替代暴力的 O(|words1|·|words2|·L)</text>
</svg>
