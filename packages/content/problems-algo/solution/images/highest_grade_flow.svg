<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → 窗口函数打排名 → WHERE rn=1 → ORDER BY</text>

  <!-- Step 1: FROM Enrolls -->
  <rect x="140" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Enrolls</text>
  <text x="260" y="78" text-anchor="middle" font-size="9.5" fill="#555">读取全部选课记录</text>

  <path d="M260 90 L260 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: PARTITION BY -->
  <rect x="80" y="110" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② PARTITION BY student_id</text>
  <text x="260" y="148" text-anchor="middle" font-size="9.5" fill="#555">按学生分组，每个学生一个独立窗口</text>

  <path d="M260 164 L260 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: ORDER BY grade DESC, course_id ASC -->
  <rect x="60" y="184" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ ORDER BY grade DESC, course_id ASC</text>
  <text x="260" y="222" text-anchor="middle" font-size="9.5" fill="#555">窗内按成绩降序排（高的在前）</text>
  <text x="260" y="236" text-anchor="middle" font-size="9.5" fill="#b85450">并列时 course_id 小的排前面 → tie-breaking</text>

  <path d="M260 244 L260 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: ROW_NUMBER -->
  <rect x="100" y="264" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ ROW_NUMBER() → 每行打排名 rn</text>
  <text x="260" y="296" text-anchor="middle" font-size="9.5" fill="#555">每组内 1, 2, 3, ...（强制唯一，不并列）</text>

  <path d="M260 308 L260 326" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: WHERE rn=1 + ORDER BY -->
  <rect x="80" y="328" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⑤ WHERE rn = 1 → ORDER BY student_id</text>
  <text x="260" y="364" text-anchor="middle" font-size="9.5" fill="#555">每组取第 1 行，按 student_id 升序输出</text>
</svg>
