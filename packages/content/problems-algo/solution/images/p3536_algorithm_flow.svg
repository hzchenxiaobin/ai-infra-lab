<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 414"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="414" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：维护 a（最大）≥ b（次大）</text>

  <!-- 开始 -->
  <ellipse cx="250" cy="48" rx="58" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="53" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">开始：n ≥ 10</text>
  <path d="M 250 66 L 250 74" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取末位 -->
  <rect x="130" y="76" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取末位 d ← n % 10；n ← n / 10</text>
  <path d="M 250 112 L 250 122" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 d >= a -->
  <polygon points="250,124 316,152 250,180 184,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">d ≥ a ?</text>
  <text x="328" y="145" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 316 152 L 368 152" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="370" y="134" width="130" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b ← a；a ← d</text>

  <text x="257" y="193" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 250 180 L 250 194" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 d > b -->
  <polygon points="250,196 316,224 250,252 184,224" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">d > b ?</text>
  <text x="328" y="217" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 316 224 L 368 224" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="370" y="206" width="130" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b ← d</text>

  <text x="257" y="269" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 250 252 L 250 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 n > 0 -->
  <polygon points="250,268 316,296 250,324 184,296" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="301" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">n > 0 ?</text>

  <!-- 是：回环取下一个数位 -->
  <text x="176" y="289" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 184 296 L 95 296 L 95 94 L 128 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取下一个数位</text>

  <!-- 更新 a/b 的两条支路汇入「n > 0 ?」 -->
  <path d="M 500 152 L 510 152 L 510 296 L 322 296" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 435 242 L 435 296" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 否：返回 -->
  <text x="257" y="338" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 250 324 L 250 340" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="342" width="130" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 a × b</text>

  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 判「登顶」要用 ≥（不是 >）：22 的第二个 2 才能把 b 顶成 2</text>
</svg>
