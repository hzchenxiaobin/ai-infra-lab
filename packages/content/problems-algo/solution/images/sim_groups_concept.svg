<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：相似关系建图 → 连通分量 = 组数</text>

  <!-- group 1 dashed outline -->
  <rect x="34" y="50" width="392" height="80" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="48" y="46" font-size="10.5" fill="#446688">组 1（根 0）</text>

  <!-- string nodes group 1 -->
  <rect x="50" y="64" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">tars</text>
  <text x="95" y="116" text-anchor="middle" font-size="9.5" fill="#888">下标 0</text>

  <rect x="190" y="64" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="235" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rats</text>
  <text x="235" y="116" text-anchor="middle" font-size="9.5" fill="#888">下标 1</text>

  <rect x="330" y="64" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="375" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">arts</text>
  <text x="375" y="116" text-anchor="middle" font-size="9.5" fill="#888">下标 2</text>

  <!-- edges -->
  <line x1="140" y1="80" x2="190" y2="80" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="280" y1="80" x2="330" y2="80" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a">差2</text>
  <text x="305" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a">差2</text>

  <!-- group 2 -->
  <rect x="190" y="156" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="235" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">star</text>
  <text x="235" y="200" text-anchor="middle" font-size="9.5" fill="#888">下标 3</text>
  <rect x="174" y="146" width="122" height="62" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="188" y="142" font-size="10.5" fill="#4a7a3a">组 2（根 3）</text>

  <!-- tars vs arts not directly similar -->
  <path d="M 95 96 Q 235 130 375 96" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="235" y="128" text-anchor="middle" font-size="9.5" fill="#b85450">差3 · 不直接相似</text>

  <!-- definition box -->
  <rect x="30" y="222" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">相似 = 交换两个字符可相等</text>
  <text x="270" y="262" text-anchor="middle" font-size="11.5" fill="#555">所有串互为字母异位词 → 差异位数 ∈ {0, 2} 即相似</text>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#888">（差 0 相同；差 2 交换那两位即相等）</text>

  <!-- result -->
  <rect x="30" y="294" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">并查集合并相似对 → 根的个数 = 组数</text>

  <rect x="30" y="344" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#444">相似具传递性：tars∼rats、rats∼arts ⟹ 三者同组</text>
</svg>
