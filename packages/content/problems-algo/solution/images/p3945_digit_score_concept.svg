<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：Σ d×freq(d) = 数位和（合并同类项）</text>

  <!-- 左面板：题面直译，先数频率再加权 -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="250" height="200" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="145" y="60" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">题面直译：先数频率，再加权</text>

    <rect x="58" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="79" y="95" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="124" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="145" y="95" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="190" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="211" y="95" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="145" y="126" text-anchor="middle" font-size="10" fill="#4a6b5a">n = 122，哈希统计频率</text>

    <rect x="48" y="136" width="90" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="93" y="155" text-anchor="middle" font-size="10.5" fill="#2f5d24">freq(1) = 1</text>
    <rect x="152" y="136" width="90" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="197" y="155" text-anchor="middle" font-size="10.5" fill="#2f5d24">freq(2) = 2</text>

    <text x="145" y="186" text-anchor="middle" font-size="11" fill="#2f5d24">得分 = 1×1 + 2×2</text>
    <text x="145" y="216" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">= 5</text>
  </g>

  <!-- 中间箭头 -->
  <g filter="url(#rough2)">
    <path d="M258,140 L286,140" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="272" y="128" text-anchor="middle" font-size="9" fill="#33506b">合并</text>
    <text x="272" y="160" text-anchor="middle" font-size="9" fill="#33506b">同类项</text>
  </g>

  <!-- 右面板：等价变形，直接数位和 -->
  <g filter="url(#rough2)">
    <rect x="290" y="40" width="250" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="415" y="60" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">等价变形：直接逐位累加</text>

    <rect x="328" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="349" y="95" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="390" y="95" text-anchor="middle" font-size="14" fill="#33506b">+</text>
    <rect x="398" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="419" y="95" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="460" y="95" text-anchor="middle" font-size="14" fill="#33506b">+</text>
    <rect x="468" y="72" width="42" height="36" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="489" y="95" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="415" y="126" text-anchor="middle" font-size="10" fill="#33506b">每个数字出现几次就加几次</text>

    <rect x="318" y="136" width="194" height="30" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <text x="415" y="155" text-anchor="middle" font-size="10.5" fill="#33506b">同一个 d，freq(d) 份贡献</text>

    <text x="415" y="186" text-anchor="middle" font-size="11" fill="#33506b">得分 = 1 + 2 + 2</text>
    <text x="415" y="216" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">= 5</text>
  </g>

  <!-- 观察解释框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="252" width="520" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">为什么恒等？数字 d 出现 freq(d) 次，每次贡献 d</text>
    <text x="280" y="292" text-anchor="middle" font-size="10" fill="#8a6d1a">d×freq(d) 只是把这些贡献「打包」——加法满足交换律，打包再拆开结果不变</text>
    <text x="280" y="309" text-anchor="middle" font-size="10" fill="#8a6d1a">n = 101 同理：0×1 + 1×2 = 0 + 1 + 1 = 2（0 的贡献天然为 0）</text>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="330" width="520" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">结论：得分 = 数位和，连 cnt[10] 哈希表都省了</text>
    <text x="280" y="372" text-anchor="middle" font-size="10" fill="#2f5d24">一趟「取模剥个位 + 除 10 丢个位」即可，n ≤ 10⁹ 至多 10 位</text>
  </g>
</svg>
