<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反转定区间：[min(n,r), max(n,r)] 内的质数求和</text>

  <!-- n and r boxes -->
  <rect x="92" y="56" width="88" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="136" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n = 13</text>

  <path d="M 184 77 L 236 77" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="210" y="64" text-anchor="middle" font-size="11" fill="#888">数字反转</text>

  <rect x="240" y="56" width="88" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="284" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">r = 31</text>

  <!-- side note: trailing zeros -->
  <rect x="350" y="46" width="190" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="66" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">尾部 0 自动丢弃：</text>
  <text x="445" y="83" text-anchor="middle" font-size="11" fill="#a87020">10 → 1，100 → 1，1000 → 1</text>
  <text x="445" y="100" text-anchor="middle" font-size="11" fill="#a87020">循环反转天然不吃前导零</text>

  <!-- transition -->
  <path d="M 280 104 L 280 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">lo = min(n, r) = 13，hi = max(n, r) = 31</text>
  <text x="280" y="184" text-anchor="middle" font-size="11.5" fill="#777">对闭区间 [lo, hi] 内所有质数求和</text>

  <!-- range band -->
  <rect x="82" y="228" width="416" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- number axis -->
  <path d="M 56 252 L 514 252" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- non-prime dots -->
  <circle cx="114" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="136" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="158" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="202" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="246" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="268" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="290" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="334" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="356" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="378" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="400" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="422" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="466" cy="252" r="2.5" fill="#aaa" filter="url(#rough2)"/>

  <!-- prime dots -->
  <circle cx="92" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">13</text>
  <circle cx="180" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">17</text>
  <circle cx="224" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">19</text>
  <circle cx="312" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">23</text>
  <circle cx="444" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">29</text>
  <circle cx="488" cy="252" r="5.5" fill="#d6a040" stroke="#a87020" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="242" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">31</text>

  <!-- lo / hi markers -->
  <path d="M 92 276 L 92 292" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="92" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo = 13</text>
  <path d="M 488 276 L 488 292" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="488" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hi = 31</text>

  <!-- sum formula -->
  <rect x="70" y="322" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">区间质数：13 + 17 + 19 + 23 + 29 + 31 = 132</text>

  <!-- edge note -->
  <rect x="55" y="378" width="450" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11.5" fill="#444">回文数 n = r（如 8 → [8,8] 无质数 → 0）；1 不是质数（n=10 → [1,10] 从 2 数起）</text>
</svg>
