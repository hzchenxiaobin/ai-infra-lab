<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,4,2,5,3]，逐元素贡献</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="63" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">i</text>

  <rect x="84" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="63" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">arr[i]</text>

  <rect x="158" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="63" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">left</text>

  <rect x="222" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="63" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">right</text>

  <rect x="286" y="44" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="63" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">LE, LO</text>

  <rect x="400" y="44" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="63" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">RE, RO</text>

  <rect x="514" y="44" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="557" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">count / 贡献</text>

  <!-- ===== Data rows ===== -->
  <!-- row i=0 -->
  <rect x="20" y="76" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="84" y="76" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="119" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="158" y="76" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="222" y="76" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="252" y="95" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="286" y="76" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="341" y="95" text-anchor="middle" font-size="11" fill="#3a5a2a">1, 0</text>
  <rect x="400" y="76" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="95" text-anchor="middle" font-size="11" fill="#3a5a2a">3, 2</text>
  <rect x="514" y="76" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="557" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 → 3</text>

  <!-- row i=1 -->
  <rect x="20" y="108" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="84" y="108" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="119" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="158" y="108" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="222" y="108" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="252" y="127" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="286" y="108" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="341" y="127" text-anchor="middle" font-size="11" fill="#3a5a2a">1, 1</text>
  <rect x="400" y="108" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="127" text-anchor="middle" font-size="11" fill="#3a5a2a">2, 2</text>
  <rect x="514" y="108" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="557" y="127" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 → 16</text>

  <!-- row i=2 highlighted (center) -->
  <rect x="20" y="140" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>
  <rect x="84" y="140" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="119" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>
  <rect x="158" y="140" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="188" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>
  <rect x="222" y="140" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>
  <rect x="286" y="140" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="341" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2, 1</text>
  <rect x="400" y="140" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="455" y="159" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2, 1</text>
  <rect x="514" y="140" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="557" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 → 10</text>

  <!-- row i=3 -->
  <rect x="20" y="172" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="191" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="84" y="172" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="119" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="158" y="172" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="191" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="222" y="172" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="252" y="191" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="286" y="172" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="341" y="191" text-anchor="middle" font-size="11" fill="#3a5a2a">2, 2</text>
  <rect x="400" y="172" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="191" text-anchor="middle" font-size="11" fill="#3a5a2a">1, 1</text>
  <rect x="514" y="172" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="557" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 → 20</text>

  <!-- row i=4 -->
  <rect x="20" y="204" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="223" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="84" y="204" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="119" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="158" y="204" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="223" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="222" y="204" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="252" y="223" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="286" y="204" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="341" y="223" text-anchor="middle" font-size="11" fill="#3a5a2a">3, 2</text>
  <rect x="400" y="204" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="223" text-anchor="middle" font-size="11" fill="#3a5a2a">1, 0</text>
  <rect x="514" y="204" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="557" y="223" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 → 9</text>

  <!-- ===== Sum row ===== -->
  <rect x="20" y="248" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="271" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">总和 = 3 + 16 + 10 + 20 + 9 = 58 ✓</text>

  <!-- ===== Notes ===== -->
  <rect x="20" y="300" width="580" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="320" font-size="11" fill="#a87020" font-weight="bold">观察：</text>
  <text x="40" y="338" font-size="10.5" fill="#555">• i=2 居中，left=right=2，count=5 最高——居中元素被最多奇数长度子数组包含</text>
  <text x="40" y="354" font-size="10.5" fill="#555">• i=0 与 i=4 对称，count 均为 3（[1],[1,4,2],[1,4,2,5,3] vs [3],[2,5,3],[1,4,2,5,3]）</text>
  <text x="40" y="370" font-size="10.5" fill="#555">• count(i) 只依赖 i 与 n，与 arr[i] 无关——同一位置在不同数组中被包含次数相同</text>
</svg>
