<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">各字符独立缩减：无论出现几次，最终各留 1 个</text>

  <!-- ===== input string: d d d a a a ===== -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s = "dddaaa"</text>

  <!-- d group bracket -->
  <text x="40" y="80" font-size="10" fill="#446688" filter="url(#rough2)">字符 d ×3</text>

  <!-- three d's -->
  <rect x="40" y="88" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="76" y="88" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="112" y="88" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- a group -->
  <text x="170" y="80" font-size="10" fill="#4a7a3a" filter="url(#rough2)">字符 a ×3</text>
  <rect x="170" y="88" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="206" y="88" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="242" y="88" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <!-- ===== reduce arrows ===== -->
  <!-- d: pick middle, delete left + right -->
  <path d="M 57 130 L 57 152" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 93 130 L 93 152" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 129 130 L 129 152" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="93" y="146" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中心</text>

  <!-- a: pick middle, delete left + right -->
  <path d="M 187 130 L 187 152" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 223 130 L 223 152" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 259 130 L 259 152" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="223" y="146" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中心</text>

  <!-- intermediate labels -->
  <text x="93" y="170" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">删左+右各一个 d</text>
  <text x="223" y="170" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">删左+右各一个 a</text>

  <!-- ===== result: d a ===== -->
  <text x="40" y="196" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">各留 1 个</text>

  <rect x="76" y="184" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="209" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="206" y="184" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="209" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- crossed-out extra copies (visual: d count 3 -> 1) -->
  <text x="150" y="175" font-size="11" fill="#b85450" filter="url(#rough2)">3→1</text>
  <text x="280" y="175" font-size="11" fill="#b85450" filter="url(#rough2)">3→1</text>

  <!-- ===== summary box ===== -->
  <rect x="350" y="88" width="180" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">不同字符种数</text>
  <text x="440" y="148" text-anchor="middle" font-size="28" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 2</text>
  <text x="440" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d, a 各 1 个</text>

  <!-- arrow from result to box -->
  <path d="M 250 203 L 345 150" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== key takeaway ===== -->
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">关键：操作只删同类 → 各字符独立缩减 → 每种恰剩 1</text>

  <!-- three mini cards: k=1, k=2, k>=3 -->
  <rect x="40" y="268" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="115" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = 1</text>
  <text x="115" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">已是最小</text>
  <text x="115" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无需操作</text>

  <rect x="205" y="268" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k = 2</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">选其一为中心</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删另一侧同类 → 1</text>

  <rect x="370" y="268" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="445" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k ≥ 3</text>
  <text x="445" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">选非两端为中心</text>
  <text x="445" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删左右各一，k-2 递推</text>
</svg>
