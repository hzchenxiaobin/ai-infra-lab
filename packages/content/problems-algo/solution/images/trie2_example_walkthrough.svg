<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="480" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：计数随操作变化</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="11" fill="#888">只插入 apple ×2，观察 end / pass 随 erase 递减；查询 O(1) 读计数</text>

  <!-- ===== Steps table ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="76" width="860" height="384" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="40" y="76" width="860" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <g font-size="11" fill="#2b6e9e" font-weight="bold">
    <text x="56" y="96">步</text>
    <text x="100" y="96">操作</text>
    <text x="300" y="96">apple 末端 e (end / pass)</text>
    <text x="540" y="96">第 2 个 p 节点 (pass)</text>
    <text x="760" y="96">查询结果</text>
  </g>
  <line x1="40" y1="106" x2="900" y2="106" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>

  <!-- row 1 -->
  <g font-size="10" fill="#444">
    <text x="56" y="128" font-weight="bold" fill="#2e8b57">1</text>
    <text x="100" y="128" font-weight="bold" fill="#2e8b57">insert("apple")</text>
    <text x="300" y="128" fill="#555">0/0 → </text>
    <text x="350" y="128" fill="#2e8b57" font-weight="bold">end=1, pass=1</text>
    <text x="540" y="128" fill="#555">0 → </text>
    <text x="580" y="128" fill="#2e8b57" font-weight="bold">pass=1</text>
    <text x="760" y="128" fill="#888">—</text>
  </g>
  <line x1="40" y1="140" x2="900" y2="140" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 2 -->
  <g font-size="10" fill="#444">
    <text x="56" y="160" font-weight="bold" fill="#2e8b57">2</text>
    <text x="100" y="160" font-weight="bold" fill="#2e8b57">insert("apple")</text>
    <text x="300" y="160" fill="#555">1/1 → </text>
    <text x="350" y="160" fill="#2e8b57" font-weight="bold">end=2, pass=2</text>
    <text x="540" y="160" fill="#555">1 → </text>
    <text x="580" y="160" fill="#2e8b57" font-weight="bold">pass=2</text>
    <text x="760" y="160" fill="#888">—</text>
  </g>
  <line x1="40" y1="172" x2="900" y2="172" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 3 -->
  <g font-size="10" fill="#444">
    <text x="56" y="192" font-weight="bold" fill="#4a8edb">3</text>
    <text x="100" y="192" font-weight="bold" fill="#4a8edb">countWordsEqualTo("apple")</text>
    <text x="300" y="192" fill="#2e8b57" font-weight="bold">读 end = 2</text>
    <text x="540" y="192" fill="#888">—</text>
    <text x="760" y="192" fill="#2e8b57" font-weight="bold">返回 2 ✓</text>
  </g>
  <line x1="40" y1="204" x2="900" y2="204" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 4 -->
  <g font-size="10" fill="#444">
    <text x="56" y="224" font-weight="bold" fill="#4a8edb">4</text>
    <text x="100" y="224" font-weight="bold" fill="#4a8edb">countWordsStartingWith("app")</text>
    <text x="300" y="224" fill="#888">—</text>
    <text x="540" y="224" fill="#c98a2b" font-weight="bold">读 pass = 2</text>
    <text x="760" y="224" fill="#c98a2b" font-weight="bold">返回 2 ✓</text>
  </g>
  <line x1="40" y1="236" x2="900" y2="236" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 5 -->
  <g font-size="10" fill="#444">
    <text x="56" y="256" font-weight="bold" fill="#c04050">5</text>
    <text x="100" y="256" font-weight="bold" fill="#c04050">erase("apple")</text>
    <text x="300" y="256" fill="#555">2/2 → </text>
    <text x="350" y="256" fill="#c04050" font-weight="bold">end=1, pass=1</text>
    <text x="540" y="256" fill="#555">2 → </text>
    <text x="580" y="256" fill="#c04050" font-weight="bold">pass=1</text>
    <text x="760" y="256" fill="#888">—</text>
  </g>
  <line x1="40" y1="268" x2="900" y2="268" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 6 -->
  <g font-size="10" fill="#444">
    <text x="56" y="288" font-weight="bold" fill="#4a8edb">6</text>
    <text x="100" y="288" font-weight="bold" fill="#4a8edb">countWordsEqualTo("apple")</text>
    <text x="300" y="288" fill="#2e8b57" font-weight="bold">读 end = 1</text>
    <text x="540" y="288" fill="#888">—</text>
    <text x="760" y="288" fill="#2e8b57" font-weight="bold">返回 1 ✓</text>
  </g>
  <line x1="40" y1="300" x2="900" y2="300" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 7 -->
  <g font-size="10" fill="#444">
    <text x="56" y="320" font-weight="bold" fill="#4a8edb">7</text>
    <text x="100" y="320" font-weight="bold" fill="#4a8edb">countWordsStartingWith("app")</text>
    <text x="300" y="320" fill="#888">—</text>
    <text x="540" y="320" fill="#c98a2b" font-weight="bold">读 pass = 1</text>
    <text x="760" y="320" fill="#c98a2b" font-weight="bold">返回 1 ✓</text>
  </g>
  <line x1="40" y1="332" x2="900" y2="332" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 8 -->
  <g font-size="10" fill="#444">
    <text x="56" y="352" font-weight="bold" fill="#c04050">8</text>
    <text x="100" y="352" font-weight="bold" fill="#c04050">erase("apple")</text>
    <text x="300" y="352" fill="#555">1/1 → </text>
    <text x="350" y="352" fill="#c04050" font-weight="bold">end=0, pass=0</text>
    <text x="540" y="352" fill="#555">1 → </text>
    <text x="580" y="352" fill="#c04050" font-weight="bold">pass=0</text>
    <text x="760" y="352" fill="#888">—</text>
  </g>
  <line x1="40" y1="364" x2="900" y2="364" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- row 9 -->
  <g font-size="10" fill="#444">
    <text x="56" y="384" font-weight="bold" fill="#4a8edb">9</text>
    <text x="100" y="384" font-weight="bold" fill="#4a8edb">countWordsStartingWith("app")</text>
    <text x="300" y="384" fill="#888">—</text>
    <text x="540" y="384" fill="#c98a2b" font-weight="bold">读 pass = 0</text>
    <text x="760" y="384" fill="#c98a2b" font-weight="bold">返回 0 ✓</text>
  </g>
  <line x1="40" y1="396" x2="900" y2="396" stroke="#eee" stroke-width="0.6" filter="url(#sk)"/>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="440" width="860" height="20" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="0.8"/>
  </g>
  <text x="470" y="454" text-anchor="middle" font-size="10" fill="#8a6a1a">💡 erase 不删节点结构，只递减计数；pass 归 0 后该前缀等价于不存在（查询返回 0）</text>
</svg>
