<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：总余数 r → 找子数组和 mod p == r</text>

  <!-- ===== Top: full array bar ===== -->
  <text x="40" y="56" font-size="10" fill="#888">原数组 nums（总和 S）</text>
  <rect x="40" y="62" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S = sum(nums),  r = S mod p</text>

  <!-- r == 0 branch -->
  <path d="M 290 104 L 290 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,124 400,154 290,184 180,154" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">r == 0?</text>

  <!-- yes -> return 0 -->
  <path d="M 180 154 L 120 154" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="20" y="138" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="68" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">返回 0</text>

  <!-- no -> need remove -->
  <path d="M 400 154 L 460 154" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="148" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="460" y="138" width="104" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="512" y="155" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">需移除子数组</text>
  <text x="512" y="167" text-anchor="middle" font-size="8" fill="#b85450">使 T mod p = r</text>

  <!-- ===== Middle: array split into keep + remove ===== -->
  <text x="40" y="212" font-size="10" fill="#888">移除子数组 T 后：剩余和 S − T</text>

  <!-- keep left -->
  <rect x="40" y="218" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留部分</text>

  <!-- remove middle (red) -->
  <rect x="195" y="218" width="190" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="241" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">移除子数组 T (mod p == r)</text>

  <!-- keep right -->
  <rect x="390" y="218" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留部分</text>

  <!-- bracket showing T -->
  <path d="M 195 260 L 195 268 L 385 268 L 385 260" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-size="9" fill="#b85450">T mod p = r  ⇒  (S − T) mod p = 0 ✓</text>

  <!-- ===== Bottom: congruence transformation ===== -->
  <path d="M 290 296 L 290 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="316" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">同余转化：prefix[r+1] − prefix[l] ≡ r (mod p)</text>
  <text x="290" y="354" text-anchor="middle" font-size="10" fill="#666">⇒  P_l ≡ (P_i − r + p) mod p   （P_i = prefix[i] mod p）</text>
  <text x="290" y="368" text-anchor="middle" font-size="9" fill="#888">哈希表 last[余数] = 最近下标，查 target 取最短</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="392" width="500" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="54" y="404" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="74" y="415" font-size="9" fill="#4a7a3a">绿：保留</text>
  <rect x="150" y="404" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="415" font-size="9" fill="#b85450">红：移除（和 mod p = r）</text>
  <rect x="340" y="404" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="360" y="415" font-size="9" fill="#d6a040">橙：同余转化</text>
</svg>
