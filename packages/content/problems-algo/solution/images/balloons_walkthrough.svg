<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[[10,16],[2,8],[1,6],[7,12]] → 排序后扫描</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">按右端点排序：[1,6] → [2,8] → [7,12] → [10,16]，逐个判断是否需新箭</text>

  <!-- table outer -->
  <rect x="30" y="64" width="540" height="186" rx="6" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- header background -->
  <rect x="30" y="64" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#2a4a66" font-weight="bold" text-anchor="middle">
    <text x="55"  y="83">步骤</text>
    <text x="125" y="83">气球(排序后)</text>
    <text x="195" y="83">start</text>
    <text x="245" y="83">end</text>
    <text x="335" y="83">start &gt; 箭位?</text>
    <text x="435" y="83">动作</text>
    <text x="495" y="83">箭位</text>
    <text x="545" y="83">箭数</text>
  </g>

  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="80"  y1="64" x2="80"  y2="250"/>
    <line x1="170" y1="64" x2="170" y2="250"/>
    <line x1="220" y1="64" x2="220" y2="250"/>
    <line x1="270" y1="64" x2="270" y2="250"/>
    <line x1="400" y1="64" x2="400" y2="250"/>
    <line x1="470" y1="64" x2="470" y2="250"/>
    <line x1="520" y1="64" x2="520" y2="250"/>
  </g>

  <!-- row backgrounds: step1 & step3 = shoot (red tint); step2 & step4 = skip (green tint) -->
  <rect x="30" y="94"  width="540" height="36" fill="#fce4ec" fill-opacity="0.5" filter="url(#rough2)"/>
  <rect x="30" y="130" width="540" height="36" fill="#e6f4ea" fill-opacity="0.5" filter="url(#rough2)"/>
  <rect x="30" y="166" width="540" height="36" fill="#fce4ec" fill-opacity="0.5" filter="url(#rough2)"/>
  <rect x="30" y="202" width="540" height="36" fill="#e6f4ea" fill-opacity="0.5" filter="url(#rough2)"/>

  <!-- row separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="130" x2="570" y2="130"/>
    <line x1="30" y1="166" x2="570" y2="166"/>
    <line x1="30" y1="202" x2="570" y2="202"/>
  </g>

  <!-- row data -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- step 1 -->
    <text x="55"  y="116" font-weight="bold" fill="#b85450">1</text>
    <text x="125" y="116">[1,6]</text>
    <text x="195" y="116">1</text>
    <text x="245" y="116">6</text>
    <text x="335" y="116" fill="#888">初始</text>
    <text x="435" y="116" fill="#b85450" font-weight="bold">射箭 @6</text>
    <text x="495" y="116" fill="#b85450" font-weight="bold">6</text>
    <text x="545" y="116" fill="#b85450" font-weight="bold">1</text>
    <!-- step 2 -->
    <text x="55"  y="152">2</text>
    <text x="125" y="152">[2,8]</text>
    <text x="195" y="152">2</text>
    <text x="245" y="152">8</text>
    <text x="335" y="152" fill="#4a7a3a">否 (2 ≤ 6)</text>
    <text x="435" y="152" fill="#4a7a3a">跳过</text>
    <text x="495" y="152">6</text>
    <text x="545" y="152">1</text>
    <!-- step 3 -->
    <text x="55"  y="188" font-weight="bold" fill="#b85450">3</text>
    <text x="125" y="188">[7,12]</text>
    <text x="195" y="188">7</text>
    <text x="245" y="188">12</text>
    <text x="335" y="188" fill="#b85450">是 (7 &gt; 6)</text>
    <text x="435" y="188" fill="#b85450" font-weight="bold">射箭 @12</text>
    <text x="495" y="188" fill="#b85450" font-weight="bold">12</text>
    <text x="545" y="188" fill="#b85450" font-weight="bold">2</text>
    <!-- step 4 -->
    <text x="55"  y="224">4</text>
    <text x="125" y="224">[10,16]</text>
    <text x="195" y="224">10</text>
    <text x="245" y="224">16</text>
    <text x="335" y="224" fill="#4a7a3a">否 (10 ≤ 12)</text>
    <text x="435" y="224" fill="#4a7a3a">跳过</text>
    <text x="495" y="224">12</text>
    <text x="545" y="224">2</text>
  </g>

  <!-- legend -->
  <g font-size="10" fill="#555">
    <rect x="60" y="270" width="16" height="12" fill="#fce4ec" fill-opacity="0.7" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="82" y="280">射新箭</text>
    <rect x="150" y="270" width="16" height="12" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="172" y="280">被当前箭覆盖，跳过</text>
  </g>

  <!-- result -->
  <rect x="120" y="300" width="360" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">答案 = 2 支箭</text>
  <text x="300" y="334" text-anchor="middle" font-size="10" fill="#555">x=6 引爆 [1,6]、[2,8]；x=12 引爆 [7,12]、[10,16]</text>
</svg>
