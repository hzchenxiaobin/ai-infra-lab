<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：计数 → 排序 → 按下标查成本累加</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">下标 i 从 0 起，cost = ⌊i / 9⌋ + 1，每满 9 个字母升一档</text>

  <!-- ===== Main flow column (center x=180) ===== -->
  <!-- B1 start oval -->
  <rect x="80" y="66" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="180" y="88" text-anchor="middle" font-size="11.5" fill="#2f5a22" font-weight="bold">统计频次 cnt[ 字母 ]</text>
  <line x1="180" y1="100" x2="180" y2="116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 sort -->
  <rect x="60" y="116" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">按频次从大到小排序</text>
  <line x1="180" y1="154" x2="180" y2="170" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 loop begin -->
  <rect x="60" y="170" width="240" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">遍历 i = 0 .. 25（循环开始）</text>
  <line x1="180" y1="208" x2="180" y2="224" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 body -->
  <rect x="60" y="224" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cost = ⌊ i / 9 ⌋ + 1</text>
  <text x="180" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += cnt[ i ] × cost</text>
  <line x1="180" y1="270" x2="180" y2="286" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B5 end oval -->
  <rect x="80" y="286" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="180" y="308" text-anchor="middle" font-size="11.5" fill="#7a2e2a" font-weight="bold">返回 ans</text>

  <!-- loop-back arrow (i++ back to loop) -->
  <path d="M 60 247 C 28 247, 28 189, 60 189" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="22" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i++</text>
  <text x="22" y="234" text-anchor="middle" font-size="8.5" fill="#b85450">回循环</text>

  <!-- ===== Right: formula & tier table ===== -->
  <text x="435" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键公式（下标从 0 起）</text>

  <rect x="330" y="84" width="210" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="116" text-anchor="middle" font-size="15" fill="#8a6a20" font-weight="bold">cost = ⌊ i / 9 ⌋ + 1</text>
  <text x="435" y="138" text-anchor="middle" font-size="9.5" fill="#8a6a20">每满 9 个字母，成本升一档</text>

  <rect x="330" y="166" width="210" height="128" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">档位区间</text>
  <rect x="342" y="196" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="362" y="206" font-size="10" fill="#333" font-weight="bold">i ∈ [0, 8] → ×1</text>
  <text x="510" y="206" text-anchor="end" font-size="9" fill="#888">9 个</text>
  <rect x="342" y="214" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="362" y="224" font-size="10" fill="#333" font-weight="bold">i ∈ [9, 17] → ×2</text>
  <text x="510" y="224" text-anchor="end" font-size="9" fill="#888">9 个</text>
  <rect x="342" y="232" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="362" y="242" font-size="10" fill="#333" font-weight="bold">i ∈ [18, 25] → ×3</text>
  <text x="510" y="242" text-anchor="end" font-size="9" fill="#888">8 个</text>
  <text x="435" y="278" text-anchor="middle" font-size="9.5" fill="#446688">合 计 26 个字母</text>

  <!-- footer note -->
  <rect x="20" y="334" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">排序后下标天然对应档位；无需显式维护“当前档 / 当前键”，整除 9 即得成本</text>
</svg>
