<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,3,4,1,2,3,1] 逐元素投放</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">色块=值，角标=投放顺序；同色跨多行 = 该值频次</text>

  <!-- ===== nums on top with step badges ===== -->
  <g font-size="12">
    <!-- i=0 val 1 step1 -->
    <rect x="80"  y="56" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="97"  y="75" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <circle cx="111" cy="58" r="8" fill="#b85450" filter="url(#rough2)"/>
    <text x="111" y="62" text-anchor="middle" font-size="9" fill="#fff">1</text>
    <!-- i=1 val 3 step2 -->
    <rect x="118" y="56" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="75" text-anchor="middle" fill="#2a4a1a">3</text>
    <circle cx="149" cy="58" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="149" y="62" text-anchor="middle" font-size="9" fill="#fff">2</text>
    <!-- i=2 val 4 step3 -->
    <rect x="156" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="173" y="75" text-anchor="middle" fill="#333">4</text>
    <circle cx="187" cy="58" r="8" fill="#446688" filter="url(#rough2)"/>
    <text x="187" y="62" text-anchor="middle" font-size="9" fill="#fff">3</text>
    <!-- i=3 val 1 step4 -->
    <rect x="194" y="56" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="211" y="75" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <circle cx="225" cy="58" r="8" fill="#b85450" filter="url(#rough2)"/>
    <text x="225" y="62" text-anchor="middle" font-size="9" fill="#fff">4</text>
    <!-- i=4 val 2 step5 -->
    <rect x="232" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="249" y="75" text-anchor="middle" fill="#333">2</text>
    <circle cx="263" cy="58" r="8" fill="#446688" filter="url(#rough2)"/>
    <text x="263" y="62" text-anchor="middle" font-size="9" fill="#fff">5</text>
    <!-- i=5 val 3 step6 -->
    <rect x="270" y="56" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="287" y="75" text-anchor="middle" fill="#2a4a1a">3</text>
    <circle cx="301" cy="58" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="301" y="62" text-anchor="middle" font-size="9" fill="#fff">6</text>
    <!-- i=6 val 1 step7 -->
    <rect x="308" y="56" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="325" y="75" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <circle cx="339" cy="58" r="8" fill="#b85450" filter="url(#rough2)"/>
    <text x="339" y="62" text-anchor="middle" font-size="9" fill="#fff">7</text>
  </g>
  <text x="55" y="75" text-anchor="middle" font-size="10" fill="#888">nums</text>

  <!-- arrows down to lanes -->
  <path d="M 97 92 L 97 130" stroke="#b85450" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 211 92 L 211 192" stroke="#b85450" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 325 92 L 325 254" stroke="#b85450" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== lane row0: 1(s1) 3(s2) 4(s3) 2(s5) ===== -->
  <text x="40" y="150" text-anchor="middle" font-size="10" fill="#888">row 0</text>
  <g font-size="12">
    <rect x="80"  y="134" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="97"  y="153" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="97"  y="178" text-anchor="middle" font-size="8" fill="#b85450">s1</text>

    <rect x="118" y="134" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="135" y="153" text-anchor="middle" fill="#2a4a1a">3</text>
    <text x="135" y="178" text-anchor="middle" font-size="8" fill="#4a7a3a">s2</text>

    <rect x="156" y="134" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="173" y="153" text-anchor="middle" fill="#333">4</text>
    <text x="173" y="178" text-anchor="middle" font-size="8" fill="#446688">s3</text>

    <rect x="232" y="134" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="249" y="153" text-anchor="middle" fill="#333">2</text>
    <text x="249" y="178" text-anchor="middle" font-size="8" fill="#446688">s5</text>
  </g>

  <!-- ===== lane row1: 1(s4) 3(s6) ===== -->
  <text x="40" y="210" text-anchor="middle" font-size="10" fill="#888">row 1</text>
  <g font-size="12">
    <rect x="194" y="194" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="211" y="213" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="211" y="238" text-anchor="middle" font-size="8" fill="#b85450">s4</text>

    <rect x="270" y="194" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="287" y="213" text-anchor="middle" fill="#2a4a1a">3</text>
    <text x="287" y="238" text-anchor="middle" font-size="8" fill="#4a7a3a">s6</text>
  </g>

  <!-- ===== lane row2: 1(s7) ===== -->
  <text x="40" y="272" text-anchor="middle" font-size="10" fill="#888">row 2</text>
  <g font-size="12">
    <rect x="308" y="256" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="325" y="275" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="325" y="300" text-anchor="middle" font-size="8" fill="#b85450">s7</text>
  </g>

  <!-- ===== conclusion ===== -->
  <rect x="370" y="194" width="170" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="216" text-anchor="middle" font-size="11" fill="#8a5a10" font-weight="bold">结果</text>
  <text x="455" y="234" text-anchor="middle" font-size="10" fill="#5a3a00">row0 = [1,3,4,2]</text>
  <text x="455" y="250" text-anchor="middle" font-size="10" fill="#5a3a00">row1 = [1,3]</text>
  <text x="455" y="266" text-anchor="middle" font-size="10" fill="#5a3a00">row2 = [1]</text>
  <text x="455" y="280" text-anchor="middle" font-size="9" fill="#8a5a10">3 行 = maxFreq ✓</text>

  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#b85450">值 1 跨 3 行（频次 3）= 最少行数；同值副本分散，行内自然互异</text>
</svg>
