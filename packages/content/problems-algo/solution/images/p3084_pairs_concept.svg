<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：合法子串 ⟺ 从 c 的位置中选一对 (i ≤ j)</text>

  <!-- string cells: abada -->
  <text x="60" y="79" font-size="12" fill="#888" filter="url(#rough2)">s =</text>
  <rect x="134" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="186" y="58" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="208" y="80" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">b</text>
  <rect x="238" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="290" y="58" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="80" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">d</text>
  <rect x="342" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="156" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="208" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="260" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="312" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="364" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- self loops above the three 'a' cells: i = j -->
  <ellipse cx="156" cy="44" rx="9" ry="6.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="260" cy="44" rx="9" ry="6.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="364" cy="44" rx="9" ry="6.5" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="398" y="32" width="114" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="49" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">i = j：单字符 ×3</text>

  <!-- cross arcs: i &lt; j pairs -->
  <path d="M 156 112 Q 182 138 208 112" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="182" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">aba</text>
  <path d="M 260 112 Q 286 138 312 112" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="286" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ada</text>
  <path d="M 156 112 Q 260 180 364 112" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">abada</text>

  <!-- side note: middle chars don't matter -->
  <path d="M 394 148 L 344 150" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="398" y="126" width="114" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两端是 c 即可</text>
  <text x="455" y="162" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">中间随便！</text>

  <!-- divider -->
  <path d="M 40 196 L 480 196" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">m = 3（c 出现 3 次）⟹ 答案 = 1 + 2 + 3</text>

  <!-- triangular dots: 1 + 2 + 3 -->
  <circle cx="120" cy="240" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="108" cy="264" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="132" cy="264" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="96" cy="288" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="120" cy="288" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="144" cy="288" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">三角形数</text>

  <!-- formula box -->
  <rect x="196" y="236" width="284" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="338" y="260" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 + 2 + ⋯ + m = m(m+1)/2</text>
  <text x="338" y="282" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">= 3×4/2 = 6 ✓</text>

  <!-- bottom conclusion -->
  <rect x="48" y="332" width="424" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">自环 3 个（单字符）+ 跨位置 3 对 = 6 个合法子串</text>
  <text x="260" y="366" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不同 (i, j) ⟺ 不同子串，不重不漏</text>

  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 2 "zzz"：m = 3，同样得 6</text>
</svg>
