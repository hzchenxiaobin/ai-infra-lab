<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描状态机 —— inWord / firstWord 两个布尔量</text>
  <text x="310" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">一趟扫描完成全部三步；扫描结束后统一截断</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="180" y="48" width="260" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="310" y="65" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">开始：tag ← '#'，inWord ← false，firstWord ← true</text>
  </g>
  <path d="M 310 74 L 310 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- D1 还有字符? -->
  <g filter="url(#rough2)">
    <polygon points="310,86 362,108 310,130 258,108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="112" text-anchor="middle" font-size="10" fill="#333">还有字符 ?</text>
  </g>
  <path d="M 362 108 L 434 108" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="384" y="102" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">否</text>
  <path d="M 310 130 L 310 140" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="140" font-size="8" fill="#55677d" filter="url(#rough2)">是</text>

  <!-- 退出链 -->
  <g filter="url(#rough2)">
    <rect x="438" y="94" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="518" y="112" text-anchor="middle" font-size="9" fill="#8a6d1f">扫描结束：超 100 则截断</text>
  </g>
  <path d="M 518 122 L 518 130" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="458" y="134" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="518" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">返回 tag ✓</text>
  </g>

  <!-- D2 c 是空格? -->
  <g filter="url(#rough2)">
    <polygon points="310,144 360,164 310,184 260,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="168" text-anchor="middle" font-size="10" fill="#333">c 是空格 ?</text>
  </g>
  <path d="M 260 164 L 198 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="242" y="157" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">是</text>
  <path d="M 310 184 L 310 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="194" font-size="8" fill="#55677d" filter="url(#rough2)">否</text>

  <!-- B1 空格关门 -->
  <g filter="url(#rough2)">
    <rect x="64" y="147" width="128" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="163" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#33506b">inWord ← false</text>
    <text x="128" y="176" text-anchor="middle" font-size="8.5" fill="#55677d">（空格只关门不追加）</text>
  </g>

  <!-- D3 新词首字母? -->
  <g filter="url(#rough2)">
    <polygon points="310,202 372,226 310,250 248,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="223" text-anchor="middle" font-size="10" fill="#333">新词首字母 ?</text>
    <text x="310" y="237" text-anchor="middle" font-size="8.5" fill="#55677d">（!inWord）</text>
  </g>
  <path d="M 372 226 L 424 226" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="388" y="219" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">是</text>
  <path d="M 310 250 L 310 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="258" font-size="8" fill="#55677d" filter="url(#rough2)">否</text>

  <!-- B2 首字母分支 -->
  <g filter="url(#rough2)">
    <rect x="428" y="200" width="170" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="513" y="216" text-anchor="middle" font-size="8" fill="#33506b">tag += firstWord ? tolower : toupper</text>
    <text x="513" y="232" text-anchor="middle" font-size="8" fill="#33506b">inWord ← true，firstWord ← false</text>
    <text x="513" y="248" text-anchor="middle" font-size="8" fill="#55677d">（词 1 转小写，词 2+ 转大写）</text>
  </g>

  <!-- B3 词内字符 -->
  <g filter="url(#rough2)">
    <rect x="230" y="262" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="310" y="280" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">tag += tolower(c)</text>
  </g>

  <!-- 各分支汇入底部回环总线 -->
  <path d="M 128 181 L 128 296" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 513 252 L 513 296" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 310 290 L 310 296" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 513 302 L 36 302 L 36 108 L 252 108" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">所有分支汇合 → 回到「还有字符 ?」</text>

  <text x="310" y="352" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">空格只关门（inWord ← false），从不追加；'#' 计入 100 上限；全空格输入 → 扫描结束返回 "#"</text>
</svg>
