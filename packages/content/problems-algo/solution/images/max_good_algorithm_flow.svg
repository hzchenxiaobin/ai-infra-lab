<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="640" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">位掩码枚举 + 好人陈述校验 流程</text>

  <!-- Step 1: enumerate mask -->
  <rect x="160" y="48" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 mask = 0 .. (1&lt;&lt;n)−1</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#666">第 i 位 = 1 表示 i 是好人</text>

  <path d="M 280 94 L 280 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop i -->
  <rect x="160" y="118" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="12" fill="#333">遍历每个人 i = 0 .. n−1</text>

  <path d="M 280 156 L 280 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i good? -->
  <polygon points="280,180 380,220 280,260 180,220" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">i 是好人?</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#666">(mask&gt;&gt;i)&amp;1 == 1</text>

  <!-- No: skip -->
  <path d="M 180 220 L 100 220 L 100 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="212" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="300" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="318" text-anchor="middle" font-size="11" fill="#333">i 是坏人</text>
  <text x="100" y="332" text-anchor="middle" font-size="10" fill="#b85450">忽略其陈述</text>

  <!-- Yes: check statements -->
  <path d="M 380 220 L 460 220 L 460 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="416" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="300" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="318" text-anchor="middle" font-size="11" fill="#333">i 是好人</text>
  <text x="460" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">校验其陈述</text>

  <path d="M 460 342 L 460 366" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Inner loop j -->
  <rect x="370" y="368" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="391" text-anchor="middle" font-size="11" fill="#333">遍历 j = 0 .. n−1</text>

  <path d="M 460 406 L 460 428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: st[i][j]==2? -->
  <polygon points="460,430 540,460 460,490 380,460" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="458" text-anchor="middle" font-size="11" fill="#333">st[i][j]==2?</text>

  <path d="M 380 460 L 340 460" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="452" font-size="10" fill="#666">是</text>
  <text x="316" y="464" font-size="10" fill="#888">跳过</text>

  <path d="M 460 490 L 460 510" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="468" y="504" font-size="10" fill="#4a7a3a">否</text>

  <!-- Check consistency -->
  <rect x="370" y="512" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="532" text-anchor="middle" font-size="10" fill="#333">(mask&gt;&gt;j)&amp;1</text>
  <text x="460" y="546" text-anchor="middle" font-size="10" fill="#333">== st[i][j] ?</text>

  <!-- Fail branch -->
  <path d="M 370 534 L 300 534 L 300 560" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="526" font-size="10" fill="#b85450" font-weight="bold">否 → mask 非法</text>

  <!-- Valid end -->
  <path d="M 280 322 L 280 560 L 200 560 L 200 580" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="120" y="582" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="600" text-anchor="middle" font-size="11" fill="#333">若全部通过</text>
  <text x="200" y="614" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = max(ans, popcount)</text>

  <text x="380" y="624" text-anchor="middle" font-size="10" fill="#888">返回 ans</text>
</svg>
