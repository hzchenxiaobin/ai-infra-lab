<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix=[[1,0,1],[0,−2,3]], k=2 → 2</text>

  <!-- 原矩阵 -->
  <text x="100" y="50" text-anchor="middle" font-size="10" fill="#999">matrix (2×3)</text>
  <text x="74" y="74" text-anchor="end" font-size="9" fill="#999">r0</text>
  <text x="74" y="94" text-anchor="end" font-size="9" fill="#999">r1</text>
  <rect x="84" y="62" width="102" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M118 62 V110 M152 62 V110 M84 86 H186" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="134" y="80" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="168" y="80" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="100" y="100" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="134" y="100" text-anchor="middle" font-size="10" fill="#b85450">−2</text>
  <text x="168" y="100" text-anchor="middle" font-size="10" fill="#333">3</text>
  <!-- 高亮答案矩形 col1..2, row0..1 -->
  <rect x="118" y="62" width="68" height="48" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>
  <rect x="118" y="62" width="68" height="48" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="90" font-size="10" fill="#d6a040" font-weight="bold">答案矩形</text>
  <text x="200" y="104" font-size="9" fill="#d6a040">row0..1,col1..2</text>

  <!-- 表头 -->
  <rect x="36" y="124" width="508" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">top,bottom</text>
  <text x="160" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">colSum</text>
  <text x="280" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">关键查询 (c, pref, lb(pref−k))</text>
  <text x="470" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cand</text>
  <text x="528" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans</text>

  <!-- 行 1: top=0, bottom=0 -->
  <rect x="36" y="150" width="508" height="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="174" text-anchor="middle" font-size="10" fill="#444">0,0</text>
  <text x="160" y="174" text-anchor="middle" font-size="10" fill="#444">[1, 0, 1]</text>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="#444">c=2: pref=2, lb(0)→0</text>
  <text x="280" y="184" text-anchor="middle" font-size="9" fill="#999">2 − 0 = 2</text>
  <text x="470" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="528" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- 行 2: top=0, bottom=1  (关键行) -->
  <rect x="36" y="190" width="508" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="216" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">0,1</text>
  <text x="160" y="216" text-anchor="middle" font-size="10" fill="#444">[1, −2, 4]</text>
  <text x="280" y="210" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">c=2: pref=3, lb(1)→1</text>
  <text x="280" y="224" text-anchor="middle" font-size="9" fill="#d6a040">3 − 1 = 2  (子段 c=1..2)</text>
  <text x="470" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="528" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- 行 3: top=1, bottom=1 -->
  <rect x="36" y="234" width="508" height="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="258" text-anchor="middle" font-size="10" fill="#444">1,1</text>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#444">[0, −2, 3]</text>
  <text x="280" y="254" text-anchor="middle" font-size="9" fill="#444">c=2: pref=1, lb(−1)→0</text>
  <text x="280" y="268" text-anchor="middle" font-size="9" fill="#999">1 − 0 = 1</text>
  <text x="470" y="258" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="528" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- 关键解释框 -->
  <rect x="36" y="296" width="508" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">关键命中：top=0, bottom=1, c=2</text>

  <text x="52" y="344" font-size="10" fill="#444">colSum = [1, −2, 4]   →   前缀和 s = [1, −1, 3]</text>
  <text x="52" y="362" font-size="10" fill="#444">prefSet 演化：{0} → {0,1} → {−1,0,1} → 插入 3 前</text>
  <text x="52" y="380" font-size="10" fill="#b85450" font-weight="bold">查询 lb(pref − k) = lb(3 − 2) = lb(1) → 命中 1</text>
  <text x="52" y="398" font-size="10" fill="#d6a040" font-weight="bold">cand = 3 − 1 = 2  ⟷  子段 colSum[1..2] = −2 + 4 = 2</text>
  <text x="52" y="416" font-size="10" fill="#3a5a2a">↑ 这个 “1” 是 c=0 时的前缀和，意味着去掉 colSum[0]=1 那段</text>
</svg>
