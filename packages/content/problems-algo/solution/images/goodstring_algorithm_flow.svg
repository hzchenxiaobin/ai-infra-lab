<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟 DP + 区间求和</text>

  <!-- 1. start -->
  <g filter="url(#rough2)">
    <rect x="150" y="42" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="68" text-anchor="middle" font-size="13" fill="#3a5a2a">dp[0] = 1   （空串算 1 种）</text>
  </g>
  <path d="M260,82 L260,100" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 2. loop -->
  <g filter="url(#rough2)">
    <rect x="160" y="100" width="200" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="125" text-anchor="middle" font-size="13" fill="#334455">for i = 1 … high</text>
  </g>
  <path d="M260,138 L260,156" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 3. recurrence -->
  <g filter="url(#rough2)">
    <rect x="28" y="156" width="464" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="185" text-anchor="middle" font-size="12" fill="#7a4a10">dp[i] = (i≥zero ? dp[i−zero] : 0) + (i≥one ? dp[i−one] : 0)   mod M</text>
  </g>
  <path d="M260,204 L260,222" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 4. decision diamond -->
  <g filter="url(#rough2)">
    <path d="M260,222 L322,250 L260,278 L198,250 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
    <text x="260" y="255" text-anchor="middle" font-size="12" fill="#b85450">i &lt; high ?</text>
  </g>
  <!-- yes: loop back to box2 right edge -->
  <path d="M322,250 L352,250 L352,119 L360,119" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="358" y="246" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <!-- no: down -->
  <path d="M260,278 L260,300" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="268" y="294" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 5. range sum -->
  <g filter="url(#rough2)">
    <rect x="50" y="300" width="420" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="327" text-anchor="middle" font-size="12" fill="#334455">ans = Σ dp[i],  i = low … high   (mod M)</text>
  </g>
  <path d="M260,344 L260,356" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 6. return -->
  <g filter="url(#rough2)">
    <rect x="190" y="356" width="140" height="20" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="370" text-anchor="middle" font-size="12" fill="#3a5a2a">return ans</text>
  </g>
</svg>
