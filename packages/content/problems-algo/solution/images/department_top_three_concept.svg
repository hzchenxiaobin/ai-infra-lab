  <text x="84" y="99" font-size="9" fill="#333">Max</text>
  <text x="122" y="99" font-size="9" fill="#4a7a3a" font-weight="bold">90k</text>
  <text x="162" y="99" font-size="9" fill="#333">1</text>

  <rect x="40" y="104" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="117" font-size="9" fill="#333">1</text>
  <text x="84" y="117" font-size="9" fill="#333">Joe</text>
  <text x="122" y="117" font-size="9" fill="#333">85k</text>
  <text x="162" y="117" font-size="9" fill="#333">1</text>

  <rect x="40" y="122" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
