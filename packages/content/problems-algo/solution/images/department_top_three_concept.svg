  <text x="84" y="135" font-size="9" fill="#333">Randy</text>
  <text x="122" y="135" font-size="9" fill="#333">85k</text>
  <text x="162" y="135" font-size="9" fill="#333">1</text>

  <rect x="40" y="140" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="153" font-size="9" fill="#333">7</text>
  <text x="84" y="153" font-size="9" fill="#333">Will</text>
  <text x="122" y="153" font-size="9" fill="#333">70k</text>
  <text x="162" y="153" font-size="9" fill="#333">1</text>

