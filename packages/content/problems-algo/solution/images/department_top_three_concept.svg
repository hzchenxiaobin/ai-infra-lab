<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：PARTITION BY 分组 → DENSE_RANK 打组内名次 → WHERE rk≤3 筛前三档</text>

  <!-- ===== Step 1: Employee + Department input ===== -->
  <text x="105" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① Employee JOIN Department</text>
  <rect x="40" y="64" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="79" font-size="9" fill="#333">id</text>
  <text x="84" y="79" font-size="9" fill="#333">name</text>
  <text x="122" y="79" font-size="9" fill="#333">salary</text>
  <text x="162" y="79" font-size="9" fill="#333">dId</text>
  <line x1="68" y1="64" x2="68" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="104" y1="64" x2="104" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="142" y1="64" x2="142" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="86" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
