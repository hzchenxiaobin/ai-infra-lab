  <text x="84" y="171" font-size="9" fill="#333">Janet</text>
  <text x="122" y="171" font-size="9" fill="#888">69k</text>
  <text x="162" y="171" font-size="9" fill="#333">1</text>

  <rect x="40" y="178" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="191" font-size="9" fill="#333">2</text>
  <text x="84" y="191" font-size="9" fill="#333">Henry</text>
  <text x="122" y="191" font-size="9" fill="#d6a040" font-weight="bold">80k</text>
  <text x="162" y="191" font-size="9" fill="#333">2</text>

  <rect x="40" y="196" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="209" font-size="9" fill="#333">3</text>
  <text x="84" y="209" font-size="9" fill="#333">Sam</text>
  <text x="122" y="209" font-size="9" fill="#333">60k</text>
  <text x="162" y="209" font-size="9" fill="#333">2</text>
  <line x1="68" y1="86" x2="68" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="104" y1="86" x2="104" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="142" y1="86" x2="142" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="110" y="232" text-anchor="middle" font-size="9" fill="#888">绿=IT(dId 1) / 橙=Sales(dId 2)</text>

  <!-- Arrow: Employee -> DENSE_RANK window -->
  <path d="M180 139 L236 139" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="208" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">DENSE_RANK</text>
  <text x="208" y="150" text-anchor="middle" font-size="8" fill="#446688">OVER(...)</text>

  <!-- ===== Step 2: window function output (with rk column) ===== -->
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 窗口函数打名次（不跳号）</text>
  <rect x="250" y="64" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="79" font-size="9" fill="#333">name</text>
  <text x="306" y="79" font-size="9" fill="#333">salary</text>
  <text x="346" y="79" font-size="9" fill="#333">dId</text>
  <text x="395" y="79" font-size="9" fill="#b85450" font-weight="bold">rk</text>
  <line x1="286" y1="64" x2="286" y2="86" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="326" y1="64" x2="326" y2="86" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="366" y1="64" x2="366" y2="86" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

