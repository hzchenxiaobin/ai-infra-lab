<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "Hello how are you Contestant", k = 4</text>

  <!-- Table frame -->
  <!-- Column x positions: i(60-150), s[i](150-300), cnt(300-380), 动作(380-560) -->
  <!-- Header row -->
  <rect x="50" y="48" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="150" y1="48" x2="150" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="48" x2="300" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="48" x2="380" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下标 i</text>
  <text x="225" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[i]</text>
  <text x="340" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt</text>
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">动作</text>

  <!-- Row 1: i=0..4 Hello, cnt=0 -->
  <rect x="50" y="80" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="99" text-anchor="middle" font-size="11" fill="#333">0 – 4</text>
  <text x="225" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Hello</text>
  <text x="340" y="99" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="470" y="99" text-anchor="middle" font-size="11" fill="#666">扫描词 1</text>

  <!-- Row 2: i=5 space, cnt=1 -->
  <rect x="50" y="110" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="129" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="225" y="129" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">' '（空格）</text>
  <text x="340" y="129" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="470" y="129" text-anchor="middle" font-size="11" fill="#666">第 1 个空格，词 1 结束</text>

  <!-- Row 3: i=6..8 how -->
  <rect x="50" y="140" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="159" text-anchor="middle" font-size="11" fill="#333">6 – 8</text>
  <text x="225" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">how</text>
  <text x="340" y="159" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="470" y="159" text-anchor="middle" font-size="11" fill="#666">扫描词 2</text>

  <!-- Row 4: i=9 space, cnt=2 -->
  <rect x="50" y="170" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="189" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="225" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">' '（空格）</text>
  <text x="340" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="470" y="189" text-anchor="middle" font-size="11" fill="#666">第 2 个空格，词 2 结束</text>

  <!-- Row 5: i=10..12 are -->
  <rect x="50" y="200" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="219" text-anchor="middle" font-size="11" fill="#333">10 – 12</text>
  <text x="225" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">are</text>
  <text x="340" y="219" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="470" y="219" text-anchor="middle" font-size="11" fill="#666">扫描词 3</text>

  <!-- Row 6: i=13 space, cnt=3 -->
  <rect x="50" y="230" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="249" text-anchor="middle" font-size="11" fill="#333">13</text>
  <text x="225" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">' '（空格）</text>
  <text x="340" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="470" y="249" text-anchor="middle" font-size="11" fill="#666">第 3 个空格，词 3 结束</text>

  <!-- Row 7: i=14..16 you -->
  <rect x="50" y="260" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="279" text-anchor="middle" font-size="11" fill="#333">14 – 16</text>
  <text x="225" y="279" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">you</text>
  <text x="340" y="279" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="470" y="279" text-anchor="middle" font-size="11" fill="#666">扫描词 4</text>

  <!-- Row 8: i=17 space, cnt=4==k HIT (green) -->
  <rect x="50" y="290" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">17</text>
  <text x="225" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">' '（空格）</text>
  <text x="340" y="311" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 == k</text>
  <text x="470" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✅ 命中！返回 s[0..16]</text>

  <!-- Result box -->
  <rect x="90" y="338" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="360" font-size="11" fill="#555">结果：</text>
  <text x="155" y="361" font-size="13" fill="#4a7a3a" font-weight="bold">"Hello how are you"</text>

  <!-- Note -->
  <rect x="50" y="384" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#666">扫描在 i = 17 停止，从未访问 "Contestant" —— 提前返回的价值</text>
</svg>
