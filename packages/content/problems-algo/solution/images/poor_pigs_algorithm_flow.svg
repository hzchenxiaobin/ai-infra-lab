<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：迭代乘 (T+1) 直到 ≥ buckets，数乘的次数</text>

  <!-- ===== 步骤 1: rounds = minutesToTest / minutesToDie ===== -->
  <rect x="150" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">rounds = minutesToTest / minutesToDie</text>

  <path d="M 260 90 L 260 100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 2: base = rounds + 1 ===== -->
  <rect x="170" y="104" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">base = rounds + 1</text>

  <path d="M 260 146 L 260 156" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 3: 初始化 ===== -->
  <rect x="170" y="160" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">pigs = 0, states = 1</text>

  <path d="M 260 202 L 260 212" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 4: 判断菱形 ===== -->
  <polygon points="260,216 380,258 260,300 140,258" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">states ≥ buckets ?</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#888">(base^pigs 够覆盖?)</text>

  <!-- 是 → 返回 -->
  <path d="M 380 258 Q 430 258 430 200 Q 430 180 410 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="412" y="156" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="462" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 pigs</text>
  <text x="462" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">最小猪数</text>

  <!-- 否 → 累乘回环 -->
  <path d="M 140 258 Q 70 258 70 200 Q 70 180 90 180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 累乘框（左侧） -->
  <rect x="50" y="156" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pigs += 1</text>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">states *= base</text>

  <!-- 回环箭头：累乘框 → 菱形（从底部绕回） -->
  <path d="M 130 204 Q 130 230 130 258 L 140 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 底部说明 ===== -->
  <rect x="40" y="330" width="440" height="84" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="11" fill="#555" font-weight="bold">关键点：</text>
  <text x="60" y="370" font-size="11" fill="#666">① rounds = ⌊minutesToTest / minutesToDie⌋ 为完整测试轮数</text>
  <text x="60" y="388" font-size="11" fill="#666">② 每只猪有 rounds+1 种结局（rounds 种死法 + 活下来）</text>
  <text x="60" y="406" font-size="11" fill="#666">③ 迭代乘法替代 log，避免浮点精度问题（如 log(8)/log(2) 可能算成 2.9999）</text>
</svg>
