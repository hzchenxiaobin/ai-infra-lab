<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二分答案 m：判定「最长相同子串 ≤ m」</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 一遍扫描 s，切出极大连续段 L₁, L₂, …, L_k</text>

  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="102" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">② lo = 1，hi = 初始最长段（一次不翻就是可行上界）</text>

  <path d="M 260 136 L 260 154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: check -->
  <rect x="50" y="156" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">③ check(mid)：mid = 1 → 整串交替，代价 min(d, n−d)</text>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">mid ≥ 2 → 代价 Σ ⌊L/(mid+1)⌋（d：与 0101… 的汉明距离）</text>

  <path d="M 260 208 L 260 226" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: feasible diamond -->
  <polygon points="260,228 340,262 260,296 180,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">代价 ≤ numOps ?</text>

  <text x="140" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 180 262 L 114 262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="246" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="266" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">hi = mid</text>

  <text x="352" y="252" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 340 262 L 384 262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="246" width="106" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="441" y="266" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">lo = mid + 1</text>

  <!-- loop back arrows -->
  <path d="M 20 262 C 2 262 2 119 60 119" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 494 262 C 510 262 510 119 460 119" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="50" y="330" width="420" height="44" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">循环至 lo = hi，返回 lo —— 单调性保证可行域是区间：</text>
  <text x="260" y="366" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">m 可行 ⟹ m+1 可行（同一翻转方案即证据）</text>
</svg>
