<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：right 主循环入窗 + 内层 while 收缩</text>

  <!-- start -->
  <rect x="175" y="36" width="170" height="30" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">cnt[0..29]=0，left=0，ans=+∞</text>

  <path d="M 260 66 L 260 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- main loop -->
  <rect x="170" y="86" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">for right = 0 … n−1</text>

  <path d="M 260 114 L 260 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- add bits -->
  <rect x="135" y="134" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">nums[right] 的 30 个位逐位加入 cnt（+1）</text>

  <path d="M 260 164 L 260 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,182 385,224 260,266 135,224" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">left ≤ right 且</text>
  <text x="260" y="235" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">OR(cnt) ≥ k ？</text>

  <!-- yes branch -->
  <path d="M 260 266 L 260 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="280" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- shrink box -->
  <rect x="115" y="286" width="290" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">ans = min(ans, right − left + 1)</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">移除 nums[left] 的位（−1），left++</text>

  <!-- feedback to diamond -->
  <path d="M 405 307 L 450 307 L 450 224 L 391 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="458" y="262" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续收缩</text>

  <!-- no branch back to main loop -->
  <path d="M 135 224 L 95 224 L 95 100 L 164 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="118" y="216" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="104" y="170" font-size="10" fill="#b85450" filter="url(#rough2)">right++</text>

  <!-- loop end to return -->
  <path d="M 350 100 L 482 100 L 482 380 L 348 380" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="470" y="92" font-size="10" fill="#999" filter="url(#rough2)">循环结束</text>

  <!-- return -->
  <rect x="190" y="366" width="158" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="269" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans（+∞ 则 −1）</text>

  <rect x="60" y="404" width="400" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个 right 至少触发一次失败判断即停——left、right 各单调前进，总计 O(n) 次窗口更新</text>
</svg>
