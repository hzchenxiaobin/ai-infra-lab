<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 6, quantities = [11, 6]，答案区间 [1, 11]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">g(x) = ⌈11/x⌉ + ⌈6/x⌉，二分找最小 x 使 g(x) ≤ 6</text>

  <!-- Header row background -->
  <rect x="20" y="60" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- Header texts -->
  <text x="41" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <text x="77" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">lo</text>
  <text x="107" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">hi</text>
  <text x="140" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">mid</text>
  <text x="184" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">⌈11/x⌉</text>
  <text x="231" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">⌈6/x⌉</text>
  <text x="276" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">stores</text>
  <text x="320" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">≤n?</text>
  <text x="440" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>

  <!-- Column dividers -->
  <line x1="62" y1="90" x2="62" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="92" y1="90" x2="92" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="122" y1="90" x2="122" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="158" y1="90" x2="158" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="90" x2="210" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="90" x2="252" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="90" x2="300" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="90" x2="340" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: [1,11], mid=6, ✓ -->
  <rect x="20" y="90" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="77" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="107" y="111" text-anchor="middle" font-size="11" fill="#333">11</text>
  <text x="140" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="184" y="111" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="231" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="276" y="111" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="320" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="440" y="111" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans=6, hi=5</text>

  <!-- Row 2: [1,5], mid=3, ✓ -->
  <rect x="20" y="122" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="77" y="143" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="107" y="143" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="184" y="143" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="231" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="276" y="143" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="320" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="440" y="143" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans=3, hi=2</text>

  <!-- Row 3: [1,2], mid=1, ✗ -->
  <rect x="20" y="154" width="520" height="32" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="77" y="175" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="107" y="175" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="184" y="175" text-anchor="middle" font-size="11" fill="#333">11</text>
  <text x="231" y="175" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="276" y="175" text-anchor="middle" font-size="11" fill="#333">17</text>
  <text x="320" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="440" y="175" text-anchor="middle" font-size="10.5" fill="#b85450">lo=2</text>

  <!-- Row 4: [2,2], mid=2, ✗ -->
  <rect x="20" y="186" width="520" height="32" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="207" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="77" y="207" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="107" y="207" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="184" y="207" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="231" y="207" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="276" y="207" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="320" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="440" y="207" text-anchor="middle" font-size="10.5" fill="#b85450">lo=3</text>

  <!-- Final row -->
  <rect x="20" y="218" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">lo=3 &gt; hi=2 → 循环结束，返回 ans = 3</text>

  <!-- Bottom note -->
  <rect x="40" y="266" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#444">g(x) 单调递减：x=3 时 g=6≤n ✓（可行），x=2 时 g=9&gt;n ✗（不可行）</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#446688">⌈q/x⌉ 用 (q + x − 1) / x 实现向上取整，避免浮点</text>
</svg>
