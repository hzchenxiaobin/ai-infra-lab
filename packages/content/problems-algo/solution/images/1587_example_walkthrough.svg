<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个账户的逐笔累加与 HAVING 过滤</text>

  <!-- ===== Column 1: Alice (900001) ===== -->
  <rect x="30" y="40" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice (900001)</text>

  <rect x="30" y="74" width="150" height="180" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="90" font-size="8" fill="#888">amount   余额</text>
  <line x1="30" y1="96" x2="180" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="112" font-size="9" fill="#446688">+7000  →  7000</text>
  <text x="40" y="132" font-size="9" fill="#446688">+7000  →  14000</text>
  <text x="40" y="152" font-size="9" fill="#b85450">-3000  →  11000</text>
  <text x="40" y="172" font-size="9" fill="#446688">+6000  →  17000</text>

  <line x1="40" y1="186" x2="170" y2="186" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="36" y="196" width="138" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">17000 ✓</text>

  <text x="105" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">&gt; 10000 → 保留</text>

  <!-- ===== Column 2: Bob (900002) ===== -->
  <rect x="205" y="40" width="150" height="28" fill="#fff" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">Bob (900002)</text>

  <rect x="205" y="74" width="150" height="180" fill="#fff" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="90" font-size="8" fill="#888">amount   余额</text>
  <line x1="205" y1="96" x2="355" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="215" y="112" font-size="9" fill="#666">+1000  →  1000</text>

  <line x1="215" y1="186" x2="345" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="211" y="196" width="138" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1000 ✗</text>

  <text x="280" y="242" text-anchor="middle" font-size="9" fill="#b85450">≤ 10000 → 丢弃</text>

  <!-- ===== Column 3: Charlie (900003) ===== -->
  <rect x="380" y="40" width="150" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Charlie (900003)</text>

  <rect x="380" y="74" width="150" height="180" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="90" font-size="8" fill="#888">amount   余额</text>
  <line x1="380" y1="96" x2="530" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="390" y="112" font-size="9" fill="#4a7a3a">+6000  →  6000</text>
  <text x="390" y="132" font-size="9" fill="#4a7a3a">+6000  →  12000</text>
  <text x="390" y="152" font-size="9" fill="#b85450">-4000  →  8000</text>

  <line x1="390" y1="186" x2="520" y2="186" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="196" width="138" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8000 ✗</text>

  <text x="455" y="242" text-anchor="middle" font-size="9" fill="#b85450">≤ 10000 → 丢弃</text>

  <!-- ===== Arrow down to result ===== -->
  <path d="M 105 262 L 105 282 L 280 282" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== HAVING filter bar ===== -->
  <rect x="60" y="286" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">HAVING SUM(amount) &gt; 10000</text>

  <!-- Arrow down -->
  <path d="M 280 324 L 280 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result table ===== -->
  <rect x="170" y="344" width="220" height="64" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">name      balance</text>
  <line x1="170" y1="368" x2="390" y2="368" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="174" y="372" width="212" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="190" y="388" font-size="11" fill="#4a7a3a" font-weight="bold">Alice       17000</text>

  <!-- ===== Note ===== -->
  <rect x="60" y="418" width="440" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="9" fill="#d6a040">每笔交易直接归属一个 account，SUM 即得余额——比 1555 的 UNION ALL 拆分更简单</text>
</svg>
