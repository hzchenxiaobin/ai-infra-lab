<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">不移位，只对下标：new[j] 的值从哪来？（图示 s=1, n=4）</text>

  <!-- ======== top group: even row, left shift ======== -->
  <text x="36" y="52" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数行：循环左移 s 位</text>

  <text x="40" y="86" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">old</text>
  <rect x="76" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="95" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="118" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="137" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="160" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>
  <text x="179" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="202" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <text x="221" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>

  <text x="40" y="172" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">new</text>
  <rect x="76" y="150" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="173" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">B</text>
  <text x="95" y="200" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[1]</text>
  <rect x="118" y="150" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="173" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">C</text>
  <text x="137" y="200" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[2]</text>
  <rect x="160" y="150" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="173" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">D</text>
  <text x="179" y="200" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[3]</text>
  <rect x="202" y="150" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="173" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">A</text>
  <text x="221" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">old[0]</text>

  <path d="M 137 102 Q 114 124 97 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 93 100 C 26 132, 150 122, 217 146" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="64" y="134" font-size="9.5" fill="#b85450" filter="url(#rough2)">j+s 出界</text>
  <text x="64" y="146" font-size="9.5" fill="#b85450" filter="url(#rough2)">mod n 绕回</text>

  <rect x="290" y="62" width="205" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="392" y="88" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">new[j] = old[(j+s) mod n]</text>
  <text x="392" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">移位后不变 ⟺</text>
  <text x="392" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">old[j] = old[(j+s) mod n]，∀j</text>

  <!-- ======== bottom group: odd row, right shift ======== -->
  <text x="36" y="240" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇数行：循环右移 s 位</text>

  <text x="40" y="274" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">old</text>
  <rect x="76" y="252" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="95" y="300" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="118" y="252" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="137" y="300" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="160" y="252" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">C</text>
  <text x="179" y="300" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="202" y="252" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">D</text>
  <text x="221" y="300" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>

  <text x="40" y="360" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">new</text>
  <rect x="76" y="338" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="361" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">D</text>
  <text x="95" y="388" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">old[3]</text>
  <rect x="118" y="338" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="361" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">A</text>
  <text x="137" y="388" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[0]</text>
  <rect x="160" y="338" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="361" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">B</text>
  <text x="179" y="388" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[1]</text>
  <rect x="202" y="338" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="361" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">C</text>
  <text x="221" y="388" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">old[2]</text>

  <path d="M 95 290 Q 118 312 135 332" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 223 290 C 290 322, 156 308, 99 332" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="238" y="322" font-size="9.5" fill="#b85450" filter="url(#rough2)">j−s &lt; 0</text>
  <text x="238" y="334" font-size="9.5" fill="#b85450" filter="url(#rough2)">+n 再 mod</text>

  <rect x="290" y="250" width="205" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="392" y="276" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">new[j] = old[(j−s+n) mod n]</text>
  <text x="392" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">移位后不变 ⟺</text>
  <text x="392" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">old[j] = old[(j−s+n) mod n]</text>

  <!-- bottom conclusion -->
  <rect x="46" y="412" width="428" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">每行把 n 对下标各比一次：全过 ⇒ 该行「移位不变」</text>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不搬动任何元素：O(m·n) 时间 / O(1) 空间</text>
</svg>
