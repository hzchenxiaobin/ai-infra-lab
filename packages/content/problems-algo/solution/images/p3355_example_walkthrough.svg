<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,3,2,1]，queries = [[1,3],[0,2]]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">diff 长度 n+1 = 5，第 5 列是哨兵位；两阶段：打标记 → 前缀和</text>

  <!-- 表头 -->
  <rect x="24" y="54" width="128" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="74" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">下标 →</text>
  <rect x="152" y="54" width="64" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="74" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="216" y="54" width="64" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="74" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="54" width="64" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="74" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="344" y="54" width="64" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="74" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="408" y="54" width="64" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="440" y="80" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">哨兵</text>

  <!-- 行1：diff 初始 -->
  <rect x="24" y="88" width="128" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="108" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">diff 初始</text>
  <rect x="152" y="88" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="216" y="88" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="280" y="88" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="344" y="88" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="408" y="88" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>

  <!-- 行2：处理 [1,3] -->
  <rect x="24" y="122" width="128" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="142" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">+ query [1,3]</text>
  <rect x="152" y="122" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="142" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="216" y="122" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="280" y="122" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="142" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="344" y="122" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="142" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="408" y="122" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 行3：处理 [0,2] -->
  <rect x="24" y="156" width="128" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="176" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">+ query [0,2]</text>
  <rect x="152" y="156" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="176" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="216" y="156" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="176" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">+1</text>
  <rect x="280" y="156" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="176" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="344" y="156" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="176" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="408" y="156" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">−1</text>

  <!-- 行4：前缀和 cov -->
  <rect x="24" y="190" width="128" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="212" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">前缀和 → cov</text>
  <rect x="152" y="190" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="184" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="190" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="248" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280" y="190" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="344" y="190" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="408" y="190" width="64" height="34" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="212" text-anchor="middle" font-size="11" fill="#7a9a7a" filter="url(#rough2)">(0)</text>

  <!-- 行5：nums -->
  <rect x="24" y="228" width="128" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="248" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="152" y="228" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="248" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="216" y="228" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="248" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="280" y="228" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="248" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="344" y="228" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="248" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="408" y="228" width="64" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="248" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">−</text>

  <!-- 行6：判定 -->
  <rect x="24" y="262" width="128" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cov ≥ nums ?</text>
  <rect x="152" y="262" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1≥4 ✗</text>
  <rect x="216" y="262" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="248" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2≥3 ✗</text>
  <rect x="280" y="262" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="284" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2≥2 ✓</text>
  <rect x="344" y="262" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="284" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1≥1 ✓</text>
  <rect x="408" y="262" width="64" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="284" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">−</text>

  <!-- 箭头标注：前缀和方向 -->
  <path d="M 156 330 L 460 330" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="322" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">前缀和方向：cov[i] = diff[0] + … + diff[i]</text>

  <!-- 底部结论 -->
  <rect x="20" y="344" width="480" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="362" font-size="10.5" fill="#333" filter="url(#rough2)">两条查询共 4 次端点写入（橙行加粗格）；一遍前缀和还原 cov = [1,2,2,1]。</text>
  <text x="34" y="380" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">下标 0：cov = 1 &lt; nums = 4 → 券不够，返回 false ✓（扫描到 i=0 即可提前退出）</text>
</svg>
