<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">闭包展开：字符 d 的初始区间 [1,6] 如何扩展到 [0,7]</text>

  <!-- ===== String with indices ===== -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">s = "adefaddaccc"</text>

  <!-- index labels -->
  <text x="64" y="78" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="94" y="78" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="124" y="78" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="154" y="78" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="184" y="78" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="214" y="78" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="244" y="78" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="274" y="78" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="304" y="78" text-anchor="middle" font-size="9" fill="#aaa">8</text>
  <text x="334" y="78" text-anchor="middle" font-size="9" fill="#aaa">9</text>
  <text x="364" y="78" text-anchor="middle" font-size="9" fill="#aaa">10</text>

  <!-- character cells -->
  <rect x="50" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="80" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="110" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="140" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="154" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="170" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="214" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="230" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="260" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="274" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="290" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="320" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="350" y="84" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="364" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- ===== Step 1: Initial interval [1,6] for 'd' ===== -->
  <text x="40" y="138" font-size="11" fill="#446688" font-weight="bold">① d 的初始区间 [first[d], last[d]] = [1, 6]</text>
  <rect x="80" y="120" width="178" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- ===== Step 2: Contains 'a' ===== -->
  <text x="40" y="168" font-size="11" fill="#b85450" font-weight="bold">② 区间内含 a → first[a]=0 &lt; 1，左扩到 0</text>
  <!-- highlight 'a' at position 1 and 4,5,6 within [1,6] -->
  <rect x="80" y="84" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="170" y="84" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- left expansion arrow -->
  <path d="M 80 150 L 50 150 L 50 120" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- expanded interval -->
  <rect x="50" y="150" width="208" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- ===== Step 3: Right expand ===== -->
  <text x="40" y="198" font-size="11" fill="#b85450" font-weight="bold">③ a 的 last[a]=7 &gt; 6，右扩到 7</text>
  <!-- right expansion arrow -->
  <path d="M 258 166 L 278 166 L 278 150" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- fully expanded interval -->
  <rect x="50" y="180" width="238" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <!-- ===== Step 4: Final closure ===== -->
  <text x="40" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">④ 闭包稳定：[0, 7] = "adefadda"</text>
  <rect x="50" y="210" width="238" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">closure(d) = [0, 7]</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="250" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">闭包 = 初始 [first, last] 的最小扩展</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#555">区间内出现的每个字符 c，都必须把 [first[c], last[c]] 也纳入</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#555">反复扩展直到稳定 → 最多 26 轮（字母表大小）</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="320" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">为什么需要闭包？</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555">条件 2：子字符串含字符 c ⇒ s 中所有 c 都必须在子字符串内</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#555">初始 [1,6] 含 a 但漏了 s[0] 和 s[7] 的 a → 不合法 → 必须扩展</text>
</svg>
