<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="260" cy="26" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="31" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 58" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：剪枝 -->
  <polygon points="260,60 344,88 260,116 176,88" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">|k| &gt; Σnums？</text>
  <path d="M 344 88 L 386 88" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="388" y="74" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="438" y="93" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <path d="M 260 116 L 260 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="128" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 初始化 -->
  <rect x="160" y="134" width="200" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">初始化 dp[par][p] 与 over[par] 位集</text>
  <path d="M 260 164 L 260 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历元素 -->
  <rect x="120" y="180" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">for x in nums：</text>
  <text x="260" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">快照 snap ← dp，并注入虚拟空状态</text>
  <path d="M 260 214 L 260 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：超限判断 -->
  <polygon points="260,230 348,258 260,286 172,258" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p·x ≤ limit？</text>

  <path d="M 172 258 C 130 258 110 274 104 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="24" y="294" width="164" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="106" y="311" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">dp[par⊕1][p·x] |= s±x</text>
  <text x="106" y="328" text-anchor="middle" font-size="10.5" fill="#2a4a1a" filter="url(#rough2)">（位集整体移位 + 或）</text>

  <path d="M 348 258 C 390 258 410 274 416 292" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="392" y="250" font-size="11" fill="#a07820" filter="url(#rough2)">否（超限）</text>
  <rect x="332" y="294" width="164" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="414" y="311" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">over[par⊕1] |= s±x</text>
  <text x="414" y="328" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">若 x=0：over → dp[·][0] 复活</text>

  <!-- 汇总输出 -->
  <path d="M 200 316 C 230 336 250 340 252 344" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="254" y="332" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="349" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p: limit→0 探测 s=k</text>
</svg>
