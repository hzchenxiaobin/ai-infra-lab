<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：五次 addNum 的区间演化</text>
  <path d="M 220 34 Q 380 42 540 34" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Column headers -->
  <text x="60" y="58" font-size="10" fill="#888" font-weight="bold">操作</text>
  <text x="170" y="58" font-size="10" fill="#888" font-weight="bold">value</text>
  <text x="250" y="58" font-size="10" fill="#888" font-weight="bold">情形</text>
  <text x="380" y="58" font-size="10" fill="#888" font-weight="bold">区间状态（ getIntervals 返回）</text>

  <!-- ===== Row 1: addNum(1) ===== -->
  <g filter="url(#rough2)"><rect x="40" y="68" width="690" height="60" rx="6" fill="#fffdf3" stroke="#eee" stroke-width="1"/></g>
  <text x="60" y="94" font-size="11" fill="#444" font-weight="bold">addNum(1)</text>
  <g filter="url(#rough2)"><circle cx="180" cy="90" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="180" y="94" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="250" y="94" font-size="10" fill="#7a5415">⑤ 孤立</text>
  <!-- intervals: [1,1] -->
  <g filter="url(#rough2)"><rect x="360" y="80" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="385" y="95" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>
  <text x="360" y="120" font-size="9" fill="#aaa">空表 → 插入单点</text>

  <!-- ===== Row 2: addNum(3) ===== -->
  <g filter="url(#rough2)"><rect x="40" y="132" width="690" height="60" rx="6" fill="#fffdf3" stroke="#eee" stroke-width="1"/></g>
  <text x="60" y="158" font-size="11" fill="#444" font-weight="bold">addNum(3)</text>
  <g filter="url(#rough2)"><circle cx="180" cy="154" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="180" y="158" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="250" y="158" font-size="10" fill="#7a5415">⑤ 孤立</text>
  <g filter="url(#rough2)"><rect x="360" y="144" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="385" y="159" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>
  <g filter="url(#rough2)"><rect x="420" y="144" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="445" y="159" text-anchor="middle" font-size="10" fill="#446688">[3,3]</text>
  <text x="360" y="184" font-size="9" fill="#aaa">3 与 [1,1] 不邻接（差 2）→ 新增单点</text>

  <!-- ===== Row 3: addNum(7) ===== -->
  <g filter="url(#rough2)"><rect x="40" y="196" width="690" height="60" rx="6" fill="#fffdf3" stroke="#eee" stroke-width="1"/></g>
  <text x="60" y="222" font-size="11" fill="#444" font-weight="bold">addNum(7)</text>
  <g filter="url(#rough2)"><circle cx="180" cy="218" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="180" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
  <text x="250" y="222" font-size="10" fill="#7a5415">⑤ 孤立</text>
  <g filter="url(#rough2)"><rect x="360" y="208" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="385" y="223" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>
  <g filter="url(#rough2)"><rect x="420" y="208" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="445" y="223" text-anchor="middle" font-size="10" fill="#446688">[3,3]</text>
  <g filter="url(#rough2)"><rect x="480" y="208" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="505" y="223" text-anchor="middle" font-size="10" fill="#446688">[7,7]</text>
  <text x="360" y="248" font-size="9" fill="#aaa">7 与 [3,3] 不邻接 → 新增单点</text>

  <!-- ===== Row 4: addNum(2) ===== highlight merge -->
  <g filter="url(#rough2)"><rect x="40" y="260" width="690" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="286" font-size="11" fill="#444" font-weight="bold">addNum(2)</text>
  <g filter="url(#rough2)"><circle cx="180" cy="282" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="180" y="286" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="250" y="286" font-size="10" fill="#d6a040" font-weight="bold">② 桥接</text>
  <!-- before: [1,1] [3,3] dimmed -->
  <g opacity="0.4">
    <g filter="url(#rough2)"><rect x="360" y="272" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="385" y="287" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>
    <g filter="url(#rough2)"><rect x="420" y="272" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="445" y="287" text-anchor="middle" font-size="10" fill="#446688">[3,3]</text>
  </g>
  <!-- arrow to merged -->
  <path d="M 480 283 L 530 283" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- merged [1,3] -->
  <g filter="url(#rough2)"><rect x="540" y="272" width="80" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="580" y="287" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[1,3]</text>
  <text x="360" y="312" font-size="9" fill="#d6a040">2==1+1 且 2==3−1 → 桥接 [1,1] 与 [3,3]</text>

  <!-- ===== Row 5: addNum(6) ===== highlight extend ceiling -->
  <g filter="url(#rough2)"><rect x="40" y="324" width="690" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="350" font-size="11" fill="#444" font-weight="bold">addNum(6)</text>
  <g filter="url(#rough2)"><circle cx="180" cy="346" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="180" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">6</text>
  <text x="250" y="350" font-size="10" fill="#d6a040" font-weight="bold">④ 扩展 ceiling</text>
  <!-- before: [1,3] [7,7] dimmed -->
  <g opacity="0.4">
    <g filter="url(#rough2)"><rect x="360" y="336" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="400" y="351" text-anchor="middle" font-size="10" fill="#446688">[1,3]</text>
    <g filter="url(#rough2)"><rect x="460" y="336" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="485" y="351" text-anchor="middle" font-size="10" fill="#446688">[7,7]</text>
  </g>
  <path d="M 520 347 L 560 347" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- [1,3] kept + [6,7] extended -->
  <g filter="url(#rough2)"><rect x="570" y="336" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="610" y="351" text-anchor="middle" font-size="10" fill="#446688">[1,3]</text>
  <g filter="url(#rough2)"><rect x="570" y="362" width="80" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="610" y="373" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[6,7] ← 扩展</text>
  <text x="360" y="380" font-size="9" fill="#d6a040">6==7−1 → 将 [7,7] 左扩为 [6,7]</text>

  <!-- ===== Final state ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="396" width="690" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="418" font-size="11" fill="#2e6e2e" font-weight="bold">最终 getIntervals()</text>
  <text x="60" y="436" font-size="10" fill="#4a7a3a">→ [[1,3], [6,7]]</text>
  <g filter="url(#rough2)"><rect x="360" y="412" width="90" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="405" y="428" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[1,3]</text>
  <g filter="url(#rough2)"><rect x="470" y="412" width="90" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="515" y="428" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[6,7]</text>
</svg>
