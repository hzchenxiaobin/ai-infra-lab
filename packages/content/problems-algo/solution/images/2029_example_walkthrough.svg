<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 3 演算：stones = [5,1,2,4,3]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">两种开局都判 Alice 输 → 返回 false</text>

  <!-- step 1: classify -->
  <text x="28" y="74" font-size="11" fill="#666" font-weight="bold">① 按 mod 3 分堆</text>
  <g filter="url(#rough2)">
    <rect x="80" y="84" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="97" y="103" text-anchor="middle" font-size="10.5" fill="#333">5</text>
    <rect x="116" y="84" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="133" y="103" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="152" y="84" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="169" y="103" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="188" y="84" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="205" y="103" text-anchor="middle" font-size="10.5" fill="#333">4</text>
    <rect x="224" y="84" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="241" y="103" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  </g>

  <!-- counts -->
  <rect x="290" y="84" width="240" height="28" fill="#e8f4ea" stroke="#4a7a3a" stroke-width="0" rx="6" filter="url(#rough2)"/>
  <text x="410" y="103" text-anchor="middle" font-size="11" fill="#333">c₀=1, c₁=2, c₂=2</text>

  <!-- step 2: check open 1 -->
  <text x="28" y="138" font-size="11" fill="#666" font-weight="bold">② 试开余1：check(c₁=2, c₂=2)</text>
  <rect x="40" y="150" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="55" y="170" font-size="10.5" fill="#555">c₁ ≤ c₂ ? 2 ≤ 2 ✓ → 落入「余1 先耗尽」情形，受害者初始 = Bob</text>
  <text x="55" y="186" font-size="10.5" fill="#555">Alice 赢 ⇔ c₀ 为偶。此处 c₀ = 1（奇）→ Alice 输</text>
  <text x="55" y="200" font-size="10.5" fill="#b85450" font-weight="bold">→ r1 = False</text>

  <!-- step 3: check open 2 -->
  <text x="28" y="232" font-size="11" fill="#666" font-weight="bold">③ 试开余2：check(c₂=2, c₁=2)</text>
  <rect x="40" y="244" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="55" y="264" font-size="10.5" fill="#555">c₂ ≤ c₁ ? 2 ≤ 2 ✓ → 落入「余2 先耗尽」情形，受害者初始 = Bob（镜像）</text>
  <text x="55" y="280" font-size="10.5" fill="#555">Alice 赢 ⇔ c₀ 为偶。此处 c₀ = 1（奇）→ Alice 输</text>
  <text x="55" y="294" font-size="10.5" fill="#b85450" font-weight="bold">→ r2 = False</text>

  <!-- step 4: merge -->
  <text x="28" y="328" font-size="11" fill="#666" font-weight="bold">④ 汇总</text>
  <rect x="150" y="340" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return r1 or r2 = False or False = False</text>

  <!-- trace one concrete line -->
  <rect x="40" y="390" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="55" y="408" font-size="10" fill="#4a7a3a" font-weight="bold">印证（开余1 的一条主战线）：</text>
  <text x="55" y="422" font-size="9.5" fill="#555">A:1 → B:1 → A:2 → B:跳0 → A:无路→被迫出2→和%3=0，A 输 ✓</text>
</svg>
