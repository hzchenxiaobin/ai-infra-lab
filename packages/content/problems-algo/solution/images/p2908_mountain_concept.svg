<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：山形以 j 为中心 —— 枚举山峰，两侧各自取最小</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums = [8,6,1,5,3]，最优山形三元组 = (2, 3, 4)</text>

  <!-- baseline -->
  <path d="M 58 290 L 438 290" fill="none" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- bars: values 8,6,1,5,3 (scale 22px per unit, baseline y=290) -->
  <rect x="70" y="114" width="52" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="145" y="158" width="52" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="220" y="268" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="295" y="180" width="52" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="174" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="370" y="224" width="52" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- index labels -->
  <text x="96" y="306" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="171" y="306" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="246" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="321" y="306" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="396" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k=4</text>

  <!-- role labels -->
  <text x="96" y="324" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">左侧候选</text>
  <text x="171" y="324" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">左侧候选</text>
  <text x="246" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左侧最小 ✓</text>
  <text x="321" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">山峰</text>
  <text x="396" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右侧最小 ✓</text>

  <!-- mountain shape over (i,j,k) -->
  <path d="M 246 268 L 321 180 L 396 224" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="246" cy="268" rx="4" ry="4" fill="#b85450" filter="url(#rough2)"/>
  <ellipse cx="321" cy="180" rx="4" ry="4" fill="#b85450" filter="url(#rough2)"/>
  <ellipse cx="396" cy="224" rx="4" ry="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- comparison annotations -->
  <text x="252" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">左侧 1 &lt; 山峰 5 ✓</text>
  <text x="416" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">右侧 3 &lt; 山峰 5 ✓</text>

  <!-- right answer block -->
  <text x="505" y="168" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">固定 j = 3：</text>
  <text x="505" y="194" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 + 5 + 3 = 9</text>
  <text x="505" y="218" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">三元组 (2, 3, 4)</text>
  <text x="505" y="244" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">= preMin + 山峰 + sufMin</text>

  <!-- formula box -->
  <rect x="70" y="340" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">固定山峰 j：和 = min(左侧) + nums[j] + min(右侧)，两侧候选集不相交、互不干扰</text>
</svg>
