<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">两个实现坑：负数平方 与 int 溢出</text>

  <!-- panel A: negative square -->
  <rect x="22" y="40" width="238" height="282" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="141" y="64" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">坑 1：负数平方变正数</text>

  <rect x="48" y="80" width="186" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="141" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">矩形分离: w = −2, h = 5</text>
  <text x="141" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（这一对其实不相交）</text>

  <rect x="48" y="134" width="186" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直接 s = min(w,h) = −2</text>
  <text x="141" y="176" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s × s = 4 &gt; 0 ✗</text>

  <rect x="48" y="196" width="186" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="141" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">先判 w &gt; 0 且 h &gt; 0</text>
  <text x="141" y="240" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">或 side = max(0, min(w,h))</text>
  <text x="141" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 这对贡献 0 ✓</text>

  <text x="141" y="300" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">分离 / 贴边都不能进平方</text>

  <!-- panel B: overflow -->
  <rect x="260" y="40" width="238" height="282" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="379" y="64" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">坑 2：面积爆 int</text>

  <rect x="286" y="80" width="186" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="379" y="100" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">坐标上限 10^7 → s 可近 10^7</text>
  <text x="379" y="120" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">s × s ≈ 10^14</text>
  <text x="379" y="138" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">int 上限 2^31−1 ≈ 2.1 × 10^9</text>

  <text x="379" y="168" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">相差约 4 个数量级</text>
  <text x="379" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">s × s 存 int 必爆 ✗</text>

  <rect x="286" y="208" width="186" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="379" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C++ / Java: long long / long</text>
  <text x="379" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Python: 任意精度，天然安全</text>
  <text x="379" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">注意: 乘法前先转宽类型 ✓</text>

  <text x="379" y="306" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">函数签名返回 long long 就是提示</text>
</svg>
