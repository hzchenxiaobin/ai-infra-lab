<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：房屋编号即值域 —— 按 end 分桶 + 前缀 dp 扫描</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dp[i+1] = max(dp[i], dp[start] + gold)：房屋 i 不卖 / 卖给「以 i 结尾」的买家</text>

  <!-- offer arcs above house line (example: n=5, offers=[[0,0,1],[0,2,2],[1,3,2]]) -->
  <path d="M 198 142 Q 198 118 212 128 Q 224 138 212 142" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[0,0] g=1</text>

  <path d="M 198 142 Q 254 84 310 142" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[0,2] g=2</text>

  <path d="M 254 142 Q 310 62 366 142" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="316" y="60" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[1,3] g=2</text>

  <!-- house line cells 0..4 -->
  <rect x="170" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="226" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="338" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="394" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="138" y="163" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">房屋</text>

  <!-- dp array -->
  <text x="310" y="204" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">dp[i] = 只用房屋 [0 … i−1] 能赚到的最大金币</text>

  <rect x="146" y="216" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[0]</text>
  <text x="170" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="194" y="216" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[1]</text>
  <text x="218" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="216" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[2]</text>
  <text x="266" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="290" y="216" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[3]</text>
  <text x="314" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="338" y="216" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[4]</text>
  <text x="362" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="386" y="216" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="230" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">dp[5]</text>
  <text x="410" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- transfer arrows below dp array -->
  <path d="M 170 254 Q 194 288 214 254" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <path d="M 170 258 Q 242 316 308 258" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="242" y="314" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+2</text>

  <path d="M 218 262 Q 292 338 356 262" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="292" y="336" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">+2</text>

  <!-- insight box -->
  <rect x="430" y="216" width="170" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="515" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">end ≤ n−1 ≤ 10⁵</text>
  <text x="515" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">直接当数组下标分桶</text>
  <text x="515" y="274" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">O(n+m)，免排序免二分</text>

  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">转移含义：报价 [start, end, gold] 占用房屋 start…end，前面的利润取 dp[start]，金币记到 dp[end+1]</text>
</svg>
