<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，逐元素「末位对决」</text>

  <!-- start -->
  <rect x="150" y="36" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：arr1=[nums₁]，arr2=[nums₂]，i=3</text>

  <path d="M 260 66 L 260 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,86 356,124 260,162 164,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">arr1 的尾元素</text>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">&gt; arr2 的尾元素？</text>

  <!-- yes branch -->
  <path d="M 164 124 L 112 124 L 112 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="116" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="182" width="164" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums[i] 追加到 arr1</text>

  <!-- no branch -->
  <path d="M 356 124 L 408 124 L 408 178" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="116" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="326" y="182" width="164" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="408" y="201" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums[i] 追加到 arr2</text>

  <!-- merge -->
  <path d="M 112 212 L 112 240 L 216 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 408 212 L 408 240 L 304 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i increment -->
  <rect x="218" y="226" width="84" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← i+1</text>

  <path d="M 260 254 L 260 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="260,274 322,300 260,326 198,300" fill="#f5f7fa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i &gt; n ？</text>

  <!-- loop back -->
  <path d="M 198 300 L 84 300 L 84 124 L 156 124" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="292" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否，继续分配</text>

  <!-- end -->
  <path d="M 322 300 L 376 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="344" y="292" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="380" y="286" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="439" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 arr1 + arr2</text>

  <!-- side note -->
  <rect x="356" y="226" width="148" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">注意：题面下标从 1 开始，</text>
  <text x="430" y="257" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">写代码时从 nums[2] 起循环</text>
</svg>
