<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums1 = [1,2], nums2 = [3,4]   half = 2, 目标 = 2.5</text>

  <!-- ============ Panel 1 ============ -->
  <rect x="20" y="40" width="540" height="172" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="62" font-size="12" fill="#444" font-weight="bold">第 1 轮   [lo, hi] = [0, 2]   →   i = 1,  j = half − i = 1</text>

  <!-- nums1 row -->
  <text x="98" y="98" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums1</text>
  <rect x="110" y="84" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="101" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="156" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="101" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="132" y="80" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L1=1</text>
  <text x="178" y="80" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R1=2</text>

  <!-- nums2 row -->
  <text x="98" y="134" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums2</text>
  <rect x="110" y="120" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="137" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="156" y="120" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="137" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="132" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L2=3</text>
  <text x="178" y="158" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R2=4</text>

  <!-- partition line panel1 (i=1, j=1) at x=156 -->
  <line x1="156" y1="78" x2="156" y2="148" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- analysis right -->
  <text x="226" y="92" font-size="11" fill="#555">左部 = {nums1[0], nums2[0]} = {1, 3}</text>
  <text x="226" y="110" font-size="11" fill="#555">右部 = {nums1[1], nums2[1]} = {2, 4}</text>
  <text x="226" y="134" font-size="11" fill="#4a7a3a">L1≤R2? 1≤4 ✓</text>
  <text x="330" y="134" font-size="11" fill="#b85450">L2≤R1? 3≤2 ✗</text>
  <text x="226" y="156" font-size="11" fill="#666">→ nums1 给左部太少（3 在左、2 却在右）</text>
  <text x="226" y="176" font-size="12" fill="#b85450" font-weight="bold">→ lo = i + 1 = 2</text>

  <!-- ============ Panel 2 ============ -->
  <rect x="20" y="228" width="540" height="172" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="250" font-size="12" fill="#444" font-weight="bold">第 2 轮   [lo, hi] = [2, 2]   →   i = 2,  j = half − i = 0</text>

  <!-- nums1 row: both in left, partition after both (x=200) -->
  <text x="98" y="286" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums1</text>
  <rect x="110" y="272" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="289" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="156" y="272" width="44" height="24" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="178" y="268" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L1=2</text>
  <text x="214" y="289" font-size="10" fill="#d6a040" font-weight="bold">R1=+∞</text>

  <!-- nums2 row: both in right, partition before first (x=110) -->
  <text x="98" y="322" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums2</text>
  <text x="100" y="322" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">L2=−∞</text>
  <rect x="110" y="308" width="44" height="24" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="156" y="308" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="325" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="132" y="346" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R2=3</text>

  <!-- partition lines panel2: nums1 at x=200, nums2 at x=110 -->
  <line x1="200" y1="266" x2="200" y2="300" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="110" y1="302" x2="110" y2="336" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- analysis right -->
  <text x="240" y="278" font-size="11" fill="#555">左部 = {nums1[0], nums1[1]} = {1, 2}</text>
  <text x="240" y="296" font-size="11" fill="#555">右部 = {nums2[0], nums2[1]} = {3, 4}</text>
  <text x="240" y="320" font-size="11" fill="#4a7a3a">L1≤R2? 2≤3 ✓   L2≤R1? −∞≤+∞ ✓</text>
  <text x="240" y="340" font-size="12" fill="#4a7a3a" font-weight="bold">→ 合法划分！</text>
  <text x="240" y="360" font-size="11" fill="#666">left_max = max(L1, L2) = max(2, −∞) = 2</text>
  <text x="240" y="378" font-size="11" fill="#666">right_min = min(R1, R2) = min(+∞, 3) = 3</text>

  <!-- ============ result box ============ -->
  <rect x="120" y="414" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="434" text-anchor="middle" font-size="11" fill="#555">总长 4（偶）</text>
  <text x="290" y="450" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">中位数 = (2 + 3) / 2 = 2.5  ✓</text>
</svg>
