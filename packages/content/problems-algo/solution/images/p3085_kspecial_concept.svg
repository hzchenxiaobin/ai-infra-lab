<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：枚举下界 x，三段清算频率桶（示例 2：k = 2，取 x = 2）</text>

  <!-- window lines -->
  <path d="M 95 228 L 445 228" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="92" y="224" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <path d="M 95 156 L 445 156" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x+k = 4</text>

  <!-- baseline -->
  <path d="M 120 300 L 430 300" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- bar a: freq 1 < x, delete all -->
  <rect x="135" y="264" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="158" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="158" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">全删 −1</text>
  <text x="158" y="318" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a</text>

  <!-- bar b: freq 2 in window, keep -->
  <rect x="203" y="228" width="46" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="226" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="226" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留</text>
  <text x="226" y="318" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">b</text>

  <!-- bar c: freq 3 in window, keep -->
  <rect x="271" y="192" width="46" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="294" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="294" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留</text>
  <text x="294" y="318" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">c</text>

  <!-- bar d: freq 5 > x+k, cut top to x+k -->
  <rect x="339" y="156" width="46" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="339" y="120" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="362" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="362" y="112" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">d</text>
  <text x="394" y="142" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">削顶 −1</text>
  <text x="362" y="318" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">d</text>

  <!-- legend -->
  <rect x="34" y="332" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="54" y="342" font-size="10.5" fill="#666" filter="url(#rough2)">低于 x：整桶删光</text>
  <rect x="180" y="332" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="200" y="342" font-size="10.5" fill="#666" filter="url(#rough2)">窗口 [x, x+k]：不动</text>
  <rect x="338" y="332" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <text x="358" y="342" font-size="10.5" fill="#666" filter="url(#rough2)">高于 x+k：削到 x+k</text>
</svg>
