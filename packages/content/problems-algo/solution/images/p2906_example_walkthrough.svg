<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[1,2],[3,4]] 拍扁成 a = [1,2,3,4]</text>

  <!-- table 1 caption -->
  <text x="160" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一遍 · 右→左（res 先存后缀积）</text>

  <!-- table 1 header -->
  <rect x="25" y="58" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k</text>
  <rect x="75" y="58" width="55" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a[k]</text>
  <rect x="130" y="58" width="105" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">res[k] ← suf</text>
  <rect x="235" y="58" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="265" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">suf→</text>

  <!-- table 1 rows -->
  <rect x="25" y="84" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="75" y="84" width="55" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="84" width="105" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="235" y="84" width="60" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="25" y="110" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="75" y="110" width="55" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="110" width="105" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="235" y="110" width="60" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>

  <rect x="25" y="136" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="75" y="136" width="55" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="136" width="105" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="235" y="136" width="60" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>

  <rect x="25" y="162" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="75" y="162" width="55" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="162" width="105" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>
  <rect x="235" y="162" width="60" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>

  <!-- table 2 caption -->
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第二遍 · 左→右（再乘前缀积）</text>

  <!-- table 2 header -->
  <rect x="325" y="58" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="350" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">k</text>
  <rect x="375" y="58" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">res[k] × pre</text>
  <rect x="525" y="58" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="560" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">pre→</text>

  <!-- table 2 rows -->
  <rect x="325" y="84" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="375" y="84" width="150" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24 × 1 = 24</text>
  <rect x="525" y="84" width="70" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="560" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="325" y="110" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="375" y="110" width="150" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12 × 1 = 12</text>
  <rect x="525" y="110" width="70" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="560" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="325" y="136" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="375" y="136" width="150" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4 × 2 = 8</text>
  <rect x="525" y="136" width="70" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="560" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <rect x="325" y="162" width="50" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="375" y="162" width="150" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 × 6 = 6</text>
  <rect x="525" y="162" width="70" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="560" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>

  <!-- mid note -->
  <text x="310" y="212" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">第一遍结束 res = [24,12,4,1]：每格恰好是「右侧全体之积」；第二遍把「左侧全体之积」乘回去</text>

  <!-- result box -->
  <rect x="110" y="228" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="257" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终 p = [[24,12],[8,6]] ✓（数值均 &lt; 12345，取模不改变）</text>

  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 2 的 12345 取模后为 0，两遍扫描天然产出 [[2],[0],[0]]——合数模数的坑自动免疫</text>
</svg>
