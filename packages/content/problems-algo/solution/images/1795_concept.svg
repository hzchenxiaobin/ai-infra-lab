<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：宽表「列转行」UNPIVOT —— 每个商店列变成若干行</text>
  <path d="M 140 36 Q 360 44 580 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: wide Products table ===== -->
  <text x="30" y="68" font-size="12" fill="#888" font-weight="bold">Products 表（宽表，2 行）</text>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="30" y="78" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="65" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">store1</text>
  <text x="190" y="95" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">store2</text>
  <text x="250" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">store3</text>

  <!-- column separators -->
  <g filter="url(#rough2)">
    <line x1="100" y1="78" x2="100" y2="154" stroke="#bbb" stroke-width="1"/>
    <line x1="160" y1="78" x2="160" y2="154" stroke="#bbb" stroke-width="1"/>
    <line x1="220" y1="78" x2="220" y2="154" stroke="#bbb" stroke-width="1"/>
  </g>

  <!-- row 0: 0 | 95 | 100 | 105 -->
  <g filter="url(#rough2)"><rect x="30" y="104" width="250" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="65" y="120" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">95</text>
  <text x="190" y="120" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">100</text>
  <text x="250" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">105</text>

  <!-- row 1: 1 | 70 | null | 80 -->
  <g filter="url(#rough2)"><rect x="30" y="130" width="250" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="65" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">70</text>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#999" font-style="italic">null</text>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">80</text>

  <!-- highlight the null cell -->
  <g filter="url(#rough2)">
    <rect x="160" y="130" width="60" height="24" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" rx="3"/>
  </g>
  <text x="190" y="172" text-anchor="middle" font-size="9" fill="#b85450">未出售 → 丢弃</text>

  <!-- ===== Middle: UNPIVOT arrow ===== -->
  <g filter="url(#rough2)">
    <rect x="300" y="112" width="120" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">UNPIVOT</text>
  <text x="360" y="152" text-anchor="middle" font-size="11" fill="#333">列转行 / melt</text>

  <!-- arrow from table to unpivot -->
  <path d="M 282 140 L 298 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow from unpivot to result -->
  <path d="M 422 140 L 438 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- ===== Right: long result table ===== -->
  <text x="440" y="68" font-size="12" fill="#888" font-weight="bold">结果（长表，5 行）</text>

  <g filter="url(#rough2)">
    <rect x="440" y="78" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="475" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="545" y="95" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">store</text>
  <text x="610" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">price</text>

  <g filter="url(#rough2)">
    <line x1="510" y1="78" x2="510" y2="226" stroke="#bbb" stroke-width="1"/>
    <line x1="580" y1="78" x2="580" y2="226" stroke="#bbb" stroke-width="1"/>
  </g>

  <!-- result rows -->
  <g filter="url(#rough2)"><rect x="440" y="104" width="200" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="475" y="120" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="545" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">store1</text>
  <text x="610" y="120" text-anchor="middle" font-size="11" fill="#333">95</text>

  <g filter="url(#rough2)"><rect x="440" y="128" width="200" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="475" y="144" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="545" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">store2</text>
  <text x="610" y="144" text-anchor="middle" font-size="11" fill="#333">100</text>

  <g filter="url(#rough2)"><rect x="440" y="152" width="200" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="475" y="168" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="545" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">store3</text>
  <text x="610" y="168" text-anchor="middle" font-size="11" fill="#333">105</text>

  <g filter="url(#rough2)"><rect x="440" y="176" width="200" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="475" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="545" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">store1</text>
  <text x="610" y="192" text-anchor="middle" font-size="11" fill="#333">70</text>

  <g filter="url(#rough2)"><rect x="440" y="200" width="200" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="475" y="216" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="545" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">store3</text>
  <text x="610" y="216" text-anchor="middle" font-size="11" fill="#333">80</text>

  <!-- color legend linking columns to rows -->
  <text x="545" y="246" text-anchor="middle" font-size="9" fill="#888">颜色对应左表的商店列</text>

  <!-- ===== Bottom insight ===== -->
  <g filter="url(#rough2)"><rect x="30" y="270" width="660" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="50" y="290" font-size="11" fill="#446688" font-weight="bold">⭐ 宽表 → 长表：</text>
  <text x="50" y="306" font-size="11" fill="#333">每个商店列（store1/2/3）拆成若干行；NULL 表示「未出售」，拆行后用 WHERE IS NOT NULL 丢弃。</text>

  <g filter="url(#rough2)"><rect x="30" y="324" width="660" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="50" y="344" font-size="11" fill="#d6a040" font-weight="bold">💡 为何要长表？</text>
  <text x="50" y="360" font-size="11" fill="#333">长表是「整洁数据」(tidy data)：每列一变量、每行一观测，便于按 store 分组聚合、连接、扩展新商店而不改表结构。</text>

  <text x="360" y="420" text-anchor="middle" font-size="10" fill="#aaa">行数 = 产品数 × 有价的商店数（NULL 不占行）</text>
</svg>
