<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">约束等价：长度 ≥3 全看 ⇔ 只看长度恰为 3 的窗口</text>

  <!-- array cells -->
  <rect x="70" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="116" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="67" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="162" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="208" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="254" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="67" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="300" y="46" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- long subarray box -->
  <rect x="63" y="38" width="248" height="48" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="330" y="56" font-size="11" fill="#446688">长度 5 的子数组</text>
  <text x="330" y="72" font-size="11" fill="#446688">max 必 ≥ k</text>

  <!-- inner 3-window -->
  <rect x="66" y="41" width="144" height="42" fill="none" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="34" text-anchor="middle" font-size="11" fill="#d6a040">必含一个长度恰 3 的子数组</text>

  <!-- conclusion -->
  <rect x="70" y="106" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max(长子数组) ≥ max(所含三元组)</text>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#555">⇒ 只需：任意连续 3 个元素中至少一个 ≥ k（哨兵）</text>

  <!-- scenario A -->
  <text x="60" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 间距 3：每个窗口都被哨兵罩住</text>
  <path d="M 120 196 L 120 188 L 260 188 L 260 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">间距 3 ≤ 3</text>
  <rect x="80" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="120" y="200" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="12" fill="#333">≥k</text>
  <rect x="160" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="200" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="240" y="200" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#333">≥k</text>
  <rect x="280" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#888">_</text>
  <text x="336" y="218" font-size="11" fill="#4a7a3a">合法 ✓</text>

  <!-- scenario B -->
  <text x="60" y="272" font-size="12" fill="#b85450" font-weight="bold">✗ 间距 4：中间窗口漏了</text>
  <path d="M 100 286 L 100 278 L 260 278 L 260 286" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="274" text-anchor="middle" font-size="10" fill="#b85450">间距 4 &gt; 3</text>
  <rect x="80" y="290" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="12" fill="#333">≥k</text>
  <rect x="120" y="290" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="160" y="290" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="310" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="200" y="290" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="310" text-anchor="middle" font-size="12" fill="#888">_</text>
  <rect x="240" y="290" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#333">≥k</text>
  <rect x="280" y="290" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12" fill="#888">_</text>
  <!-- uncovered window -->
  <rect x="116" y="286" width="128" height="38" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="336" y="308" font-size="11" fill="#b85450">违规 ✗</text>
  <text x="180" y="340" text-anchor="middle" font-size="11" fill="#b85450">窗口 [1,3] 内没有任何哨兵 → max &lt; k</text>

  <rect x="60" y="354" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="371" text-anchor="middle" font-size="11" fill="#555">结论：哨兵间距 ≤ 3，且首哨兵 ≤ 2、末哨兵 ≥ n−3</text>
</svg>
