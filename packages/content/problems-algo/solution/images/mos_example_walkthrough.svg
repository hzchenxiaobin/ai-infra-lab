<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：text = "abdcdbc", pattern = "ac"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">a = 'a' (pattern[0]), b = 'c' (pattern[1])</text>

  <!-- ===== Text character row ===== -->
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">字符 ch</text>
  <g font-size="12">
    <!-- 7 characters: a b d c d b c -->
    <rect x="80" y="82" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="108" y="104" text-anchor="middle" fill="#446688" font-weight="bold">a</text>

    <rect x="140" y="82" width="56" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="168" y="104" text-anchor="middle" fill="#888">b</text>

    <rect x="200" y="82" width="56" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="228" y="104" text-anchor="middle" fill="#888">d</text>

    <rect x="260" y="82" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="288" y="104" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>

    <rect x="320" y="82" width="56" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="348" y="104" text-anchor="middle" fill="#888">d</text>

    <rect x="380" y="82" width="56" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="408" y="104" text-anchor="middle" fill="#888">b</text>

    <rect x="440" y="82" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="468" y="104" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
  </g>
  <g font-size="8" fill="#888">
    <text x="108" y="78" text-anchor="middle">步骤1</text>
    <text x="168" y="78" text-anchor="middle">步骤2</text>
    <text x="228" y="78" text-anchor="middle">步骤3</text>
    <text x="288" y="78" text-anchor="middle">步骤4</text>
    <text x="348" y="78" text-anchor="middle">步骤5</text>
    <text x="408" y="78" text-anchor="middle">步骤6</text>
    <text x="468" y="78" text-anchor="middle">步骤7</text>
  </g>

  <!-- ===== cntA row ===== -->
  <text x="30" y="140" font-size="11" fill="#446688" font-weight="bold">cntA (a的累计)</text>
  <g font-size="12">
    <rect x="80" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="108" y="142" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="140" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="168" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="200" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="228" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="260" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="288" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="320" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="348" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="380" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="408" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="440" y="126" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="468" y="142" text-anchor="middle" fill="#446688">1</text>
  </g>

  <!-- ===== cntB row ===== -->
  <text x="30" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">cntB (c的累计)</text>
  <g font-size="12">
    <rect x="80" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="108" y="174" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="140" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="168" y="174" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="200" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="228" y="174" text-anchor="middle" fill="#4a7a3a">0</text>
    <rect x="260" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="288" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="320" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="348" y="174" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="380" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="408" y="174" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="440" y="158" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="468" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- ===== existing row ===== -->
  <text x="30" y="204" font-size="11" fill="#b85450" font-weight="bold">existing</text>
  <g font-size="12">
    <rect x="80" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="108" y="206" text-anchor="middle" fill="#b85450">0</text>
    <rect x="140" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="168" y="206" text-anchor="middle" fill="#b85450">0</text>
    <rect x="200" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="228" y="206" text-anchor="middle" fill="#b85450">0</text>
    <rect x="260" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="288" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="320" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="348" y="206" text-anchor="middle" fill="#b85450">1</text>
    <rect x="380" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="408" y="206" text-anchor="middle" fill="#b85450">1</text>
    <rect x="440" y="190" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="468" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== pairing arrows ===== -->
  <!-- arrow from a (step1) to c (step4) -->
  <path d="M 108 116 Q 108 130 288 82" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow from a (step1) to c (step7) -->
  <path d="M 108 116 Q 108 135 468 82" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="80" y="232" font-size="9" fill="#b85450">↗ 虚线 = a 与 c 的配对（原有子序列）</text>

  <!-- ===== Summary box ===== -->
  <rect x="30" y="246" width="490" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="266" font-size="11" fill="#d6a040" font-weight="bold">遍历结束结果</text>
  <text x="48" y="284" font-size="11" fill="#555">cntA = 1（1个a），cntB = 2（2个c），existing = 2（原有子序列数）</text>
  <text x="48" y="298" font-size="11" fill="#555">最优增量 = max(cntA, cntB) = max(1, 2) = 2 → 插入 'a' 于最左端，与2个c配对</text>

  <!-- ===== Final answer ===== -->
  <rect x="30" y="316" width="490" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">答案 = existing + gain = 2 + 2 = 4 ✓</text>

  <!-- ===== Explanation ===== -->
  <rect x="30" y="372" width="490" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="388" font-size="10" fill="#666">步骤4：遇 c，existing += cntA(=1) → existing=1（a₁配c₁）</text>
  <text x="40" y="402" font-size="10" fill="#666">步骤7：遇 c，existing += cntA(=1) → existing=2（a₁配c₂）</text>
</svg>
