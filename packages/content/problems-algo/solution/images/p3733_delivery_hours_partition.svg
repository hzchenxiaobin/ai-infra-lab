<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：[1,T] 的小时按「谁能送」四分类，容斥 O(1) 计数</text>

  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例构型：r1 = 2，r2 = 3，T = 6（小时从 1 起编号，L = lcm(2,3) = 6）</text>

  <!-- 小时轴：6 个格子 -->
  <rect x="74" y="56" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">共享</text>

  <rect x="138" y="56" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="164" y="93" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">②专属</text>

  <rect x="202" y="56" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="228" y="93" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">①专属</text>

  <rect x="266" y="56" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="292" y="93" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">②专属</text>

  <rect x="330" y="56" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="356" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">共享</text>

  <rect x="394" y="56" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="420" y="93" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">双双充电</text>

  <!-- 充电说明 -->
  <text x="74" y="118" font-size="11" fill="#446688" filter="url(#rough2)">① 在 2、4、6 小时充电（r1 = 2 的倍数）</text>
  <text x="74" y="134" font-size="11" fill="#d6a040" filter="url(#rough2)">② 在 3、6 小时充电（r2 = 3 的倍数）</text>
  <text x="74" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">6 是 lcm(2,3) 的倍数 → 双双充电，谁也送不了的一小时</text>

  <!-- 计数公式 -->
  <rect x="18" y="162" width="238" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="137" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c1 = T − ⌊T/r1⌋ = 6−3 = 3 → 小时 1,3,5</text>

  <rect x="264" y="162" width="238" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="383" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c2 = T − ⌊T/r2⌋ = 6−2 = 4 → 小时 1,2,4,5</text>

  <rect x="18" y="198" width="484" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">共享 s = T − ⌊T/r1⌋ − ⌊T/r2⌋ + ⌊T/L⌋ = 6−3−2+1 = 2 → 小时 1,5</text>

  <rect x="18" y="234" width="484" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">专属 e1 = c1−s = 1（小时 3）；e2 = c2−s = 2（小时 2,4）—— 只有本机能用</text>

  <!-- 可行性判定横幅 -->
  <rect x="18" y="270" width="484" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">check(T) ⇔ max(0, d1−e1) + max(0, d2−e2) ≤ s —— 专属先用，溢出挤共享</text>

  <!-- 底注 -->
  <text x="18" y="322" font-size="10" fill="#666" filter="url(#rough2)">💡 这一条不等式还自动蕴含 d1 ≤ c1、d2 ≤ c2：若 d1 &gt; c1 = e1+s，则 d1−e1 &gt; s，必然超标</text>
  <text x="18" y="338" font-size="10" fill="#666" filter="url(#rough2)">💡 T 增加 → 每类容量只增不减 ⇒ check 单调不减 ⇒ 可二分最小可行 T（上界 2×(d1+d2)）</text>
  <text x="18" y="354" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 漏掉 +⌊T/L⌋ 项会两头失真：r1=r2=2、d=[1,2]、T=3 时会把「不可行」误判成「可行」</text>
</svg>
