<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：routes=[[1,2,7],[3,6,7]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">source=1, target=6 — stop→routes: {1:{0}, 2:{0}, 7:{0,1}, 3:{1}, 6:{1}}</text>

  <!-- ===== BFS Layer visualization ===== -->

  <!-- Layer 1 label -->
  <text x="50" y="78" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 层</text>
  <text x="50" y="92" font-size="10" fill="#888">(buses=1)</text>

  <!-- Route 0 box -->
  <rect x="100" y="62" width="220" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="82" font-size="11" fill="#4a7a3a" font-weight="bold">路线 0</text>

  <!-- Route 0 stops -->
  <rect x="160" y="68" width="34" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="177" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="198" y="68" width="34" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="215" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="236" y="68" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="253" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7</text>

  <text x="282" y="82" font-size="10" fill="#888">6 不在此路线</text>

  <!-- Transfer arrow via stop 7 -->
  <path d="M 253 100 L 253 138" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="122" font-size="10" fill="#d6a040" font-weight="bold">站 7</text>
  <text x="268" y="134" font-size="10" fill="#d6a040" font-weight="bold">换乘</text>

  <!-- Layer 2 label -->
  <text x="50" y="158" font-size="11" fill="#d6a040" font-weight="bold">第 2 层</text>
  <text x="50" y="172" font-size="10" fill="#888">(buses=2)</text>

  <!-- Route 1 box -->
  <rect x="100" y="142" width="220" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="162" font-size="11" fill="#d6a040" font-weight="bold">路线 1</text>

  <!-- Route 1 stops -->
  <rect x="160" y="148" width="34" height="30" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="177" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="198" y="148" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>

  <rect x="236" y="148" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="253" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7</text>

  <text x="282" y="162" font-size="10" fill="#b85450" font-weight="bold">找到 target!</text>

  <!-- Divider -->
  <line x1="30" y1="200" x2="530" y2="200" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step table ===== -->
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">BFS 逐步执行</text>

  <!-- Column headers -->
  <text x="42" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="108" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">路线</text>
  <text x="168" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">buses</text>
  <text x="250" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">扫描站点</text>
  <text x="355" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">target?</text>
  <text x="465" y="244" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">新入队 / 队列</text>

  <!-- Step 1 row -->
  <rect x="20" y="252" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="42" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="108" y="276" text-anchor="middle" font-size="11" fill="#333">路线 0</text>
  <text x="168" y="276" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="250" y="276" text-anchor="middle" font-size="11" fill="#333">1, 2, 7</text>
  <text x="355" y="276" text-anchor="middle" font-size="11" fill="#888">否</text>
  <text x="465" y="270" text-anchor="middle" font-size="10" fill="#d6a040">站7→路线1</text>
  <text x="465" y="284" text-anchor="middle" font-size="10" fill="#666">[路线1]</text>

  <!-- Step 2 row -->
  <rect x="20" y="298" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="42" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="108" y="322" text-anchor="middle" font-size="11" fill="#333">路线 1</text>
  <text x="168" y="322" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="250" y="322" text-anchor="middle" font-size="11" fill="#333">3, 6, ...</text>
  <text x="355" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是! (6)</text>
  <text x="465" y="322" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Arrow down to answer -->
  <path d="M 280 340 L 280 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="100" y="366" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 buses = 2</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#666">路线0 (1趟) → 站7换乘 → 路线1 (第2趟) → 到达6</text>

  <!-- Footnote -->
  <text x="40" y="440" font-size="10" fill="#888">BFS 第 N 层 = 坐第 N 趟公交；站 7 是路线 0 与路线 1 的唯一共享站（换乘枢纽）</text>
  <text x="40" y="456" font-size="10" fill="#446688" font-weight="bold">stop_to_routes[7] = {0,1}：一次查询即发现可换乘到路线 1</text>
</svg>
