<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：行内有序呈阶梯形，从右上角走 O(rows+cols)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">每行 0..0 1..1 ⇒ 1 集中右侧成阶梯；见 1 左移找更早的 1，见 0 下移跳过本行</text>

  <!-- ===== Left: 4x4 matrix with staircase ===== -->
  <text x="170" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例矩阵（0 蓝 / 1 绿，阶梯边界为红色折线）</text>

  <!-- col labels j -->
  <g font-size="10" fill="#888">
    <text x="108" y="92" text-anchor="middle">j=0</text>
    <text x="164" y="92" text-anchor="middle">j=1</text>
    <text x="220" y="92" text-anchor="middle">j=2</text>
    <text x="276" y="92" text-anchor="middle">j=3</text>
  </g>
  <!-- row labels i -->
  <g font-size="10" fill="#888">
    <text x="48" y="142" text-anchor="middle">i=0</text>
    <text x="48" y="198" text-anchor="middle">i=1</text>
    <text x="48" y="254" text-anchor="middle">i=2</text>
    <text x="48" y="310" text-anchor="middle">i=3</text>
  </g>

  <!-- cells: x=80+j*56, y=110+i*56, size 56x56 -->
  <!-- row0: 0 0 1 1 -->
  <rect x="80" y="110" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="110" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="110" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="110" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="144" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row1: 0 1 1 1 -->
  <rect x="80" y="166" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="166" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="200" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row2: 0 0 0 1 -->
  <rect x="80" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="222" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="222" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="256" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <!-- row3: 0 0 0 0 -->
  <rect x="80" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="136" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="278" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="312" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>

  <!-- staircase boundary (red zigzag) between 0 and 1 regions -->
  <path d="M 192 110 L 192 166 L 136 166 L 136 222 L 248 222 L 248 278 L 80 278"
        stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- ===== Walk path arrows (top-right start) ===== -->
  <!-- (0,3) center (276,138) -> (0,2) center (220,138): left -->
  <path d="M 262 138 L 234 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- (0,2) -> (0,1) center (164,138): left -->
  <path d="M 206 138 L 178 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- (0,1) -> (1,1) center (164,194): down -->
  <path d="M 164 150 L 164 182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (1,1) -> (1,0) center (108,194): left -->
  <path d="M 150 194 L 122 194" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- (1,0) -> (2,0) center (108,250): down -->
  <path d="M 108 206 L 108 238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (2,0) -> (3,0) center (108,306): down -->
  <path d="M 108 262 L 108 294" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (3,0) -> out: down -->
  <path d="M 108 318 L 108 346" stroke="#4a7a3a" stroke-width="2" fill="none" marker-dasharray="3 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="138" y="340" font-size="9" fill="#4a7a3a">出界→结束</text>

  <!-- start marker -->
  <circle cx="276" cy="138" r="6" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="120" font-size="9" fill="#b85450" font-weight="bold">起点(0,3)</text>

  <text x="170" y="362" text-anchor="middle" font-size="9" fill="#b85450">红箭头=见 1 左移，绿箭头=见 0 下移</text>

  <!-- ===== Right: walk logic ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">走法规则（每次只调一次 get）</text>

  <!-- rule 1: ==1 -->
  <rect x="350" y="92" width="240" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若 get(r,c) == 1</text>
  <text x="362" y="134" font-size="10" fill="#555">• 此列有 1，更新 ans = c</text>
  <text x="362" y="150" font-size="10" fill="#555">• 左移 c−−：尝试找更左的 1</text>

  <!-- rule 2: ==0 -->
  <rect x="350" y="176" width="240" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">若 get(r,c) == 0</text>
  <text x="362" y="218" font-size="10" fill="#555">• 本行 c 及以右全是 0（行有序）</text>
  <text x="362" y="234" font-size="10" fill="#555">• 下移 r++：换下一行再找</text>

  <!-- invariant box -->
  <rect x="350" y="260" width="240" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">不变式</text>
  <text x="362" y="302" font-size="10" fill="#555">• 当前位置以右的列已确认「</text>
  <text x="362" y="316" font-size="10" fill="#555">  至少有一个 1」，ans 记最左</text>
  <text x="362" y="330" font-size="10" fill="#555">• r 单调增、c 单调减，共 ≤ R+C 步</text>

  <!-- result -->
  <rect x="350" y="346" width="240" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">本例 ans = 1（第 1 列）</text>

  <!-- ===== Bottom: key insight box ===== -->
  <rect x="30" y="380" width="560" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="402" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两个关键观察</text>
  <text x="46" y="422" font-size="11" fill="#555">① <tspan font-weight="bold" fill="#446688">行内有序 ⇒ 阶梯形</tspan>：每行前缀 0、后缀 1，1 集中在右侧，0/1 交界呈阶梯折线，最左 1 列即阶梯最左触点。</text>
  <text x="46" y="440" font-size="11" fill="#555">② <tspan font-weight="bold" fill="#4a7a3a">右上角出发单向走</tspan>：见 1 左移（找更早的 1）、见 0 下移（跳过本行右段），r/c 各单调 ⇒ get 次数 ≤ rows+cols。</text>
</svg>
