<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 合并计数 k → 2^k mod p</text>

  <!-- Step 1: sort -->
  <rect x="170" y="50" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12.5" fill="#224466" font-weight="bold">① 按起点排序 ranges.sort()</text>

  <line x1="280" y1="92" x2="280" y2="114" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: scan merge + count -->
  <rect x="80" y="116" width="400" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">② 线性扫描 + 合并计数</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#3a5a2a" font-family="monospace">维护 curEnd；对每个 [a, b]：</text>
  <text x="280" y="178" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold" font-family="monospace">a &gt; curEnd ?  k++  :  curEnd = max(curEnd, b)</text>

  <line x1="280" y1="194" x2="280" y2="216" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: return -->
  <rect x="110" y="218" width="340" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold">③ k = 连通块数（独立分组单元）</text>
  <text x="280" y="263" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return 2^k mod (10⁹+7)</text>

  <line x1="280" y1="276" x2="280" y2="298" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Result highlight -->
  <rect x="90" y="300" width="380" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">k 个连通块 ⟹ 每块 2 选 1 ⟹ 2^k 种方案</text>
  <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#b03a3a">合并判定同 56 题：a ≤ curEnd 即有公共整数</text>
</svg>
