<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 流程：dfs(node) 返回子树和，val == l+r 时计数</text>

  <!-- 入口 -->
  <rect x="225" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 80 L 340 110 L 280 140 L 220 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 72 L 280 80" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return 0 -->
  <path d="M 340 110 L 420 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="102" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="96" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="11" fill="#333">return 0</text>

  <!-- 否 → 递归 -->
  <path d="M 220 110 L 160 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="102" font-size="10" fill="#b85450">否</text>

  <rect x="70" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="114" text-anchor="middle" font-size="11" fill="#333">递归左右</text>
  <text x="115" y="140" text-anchor="middle" font-size="10" fill="#888">l = dfs(left) , r = dfs(right)</text>

  <path d="M 115 124 L 115 150 L 280 150 L 280 165" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- val == l + r? -->
  <path d="M 280 165 L 360 200 L 280 235 L 200 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="11" fill="#333">node.val == l + r ?</text>
  <text x="280" y="212" text-anchor="middle" font-size="9" fill="#888">(后代之和)</text>

  <!-- 是 → ans += 1 -->
  <path d="M 360 200 L 430 200" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="192" font-size="10" fill="#4a7a3a">是</text>
  <rect x="430" y="186" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += 1</text>

  <!-- 否 → 跳过 (汇合到 return) -->
  <path d="M 200 200 L 130 200" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="192" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="186" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="204" text-anchor="middle" font-size="11" fill="#333">跳过计数</text>

  <!-- 汇合 → return -->
  <path d="M 85 214 L 85 250 L 280 250 L 280 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 214 L 480 250 L 280 250" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- return val + l + r -->
  <rect x="190" y="268" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return node.val + l + r</text>

  <!-- 底部说明 -->
  <rect x="50" y="325" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11" fill="#555">空节点返回 0（叶子的后代和=0）· 返回值=子树总和 · 计数与返回值职责分离</text>
</svg>
