<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 425"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="425" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：words = ["abc", "aaaaa", "bcdef"]，target = "aabcdabc"</text>

  <!-- 表头 -->
  <rect x="30" y="32" width="460" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="50" y="47" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="195" y="47" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">沿 Trie 行走（✓ 走通 / ✗ 卡住）</text>
  <text x="360" y="47" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">match[i]</text>
  <text x="445" y="47" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">i + match[i]</text>

  <!-- 高亮行：i = 0, 2, 5（推动 R 前进的三行） -->
  <rect x="30" y="54" width="460" height="23" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="100" width="460" height="23" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="169" width="460" height="23" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <text x="50" y="69" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="80" y="69" font-size="10.5" fill="#333" filter="url(#rough2)">a✓ a✓ b✗（aa 之后只有 a）</text>
  <text x="360" y="69" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="445" y="69" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="50" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="80" y="92" font-size="10.5" fill="#333" filter="url(#rough2)">a✓ b✓ c✓ d✗（abc 到头）</text>
  <text x="360" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="445" y="92" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>

  <text x="50" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="80" y="115" font-size="10.5" fill="#333" filter="url(#rough2)">b✓ c✓ d✓ a✗（bcde 后只有 f）</text>
  <text x="360" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="445" y="115" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="50" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="80" y="138" font-size="10.5" fill="#333" filter="url(#rough2)">c✗（根没有 c 分支）</text>
  <text x="360" y="138" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="445" y="138" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <text x="50" y="161" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="80" y="161" font-size="10.5" fill="#333" filter="url(#rough2)">d✗</text>
  <text x="360" y="161" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="445" y="161" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>

  <text x="50" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="80" y="184" font-size="10.5" fill="#333" filter="url(#rough2)">a✓ b✓ c✓（到达串尾）</text>
  <text x="360" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="445" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="50" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="80" y="207" font-size="10.5" fill="#333" filter="url(#rough2)">b✓ c✓（到达串尾）</text>
  <text x="360" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="445" y="207" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>

  <text x="50" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="80" y="230" font-size="10.5" fill="#333" filter="url(#rough2)">c✗</text>
  <text x="360" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="445" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>

  <!-- 表格线（画在内容之上） -->
  <path d="M 30 54 L 490 54 M 30 77 L 490 77 M 30 100 L 490 100 M 30 123 L 490 123 M 30 146 L 490 146 M 30 169 L 490 169 M 30 192 L 490 192 M 30 215 L 490 215" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 70 32 L 70 238 M 320 32 L 320 238 M 400 32 L 400 238" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="32" width="460" height="206" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 分层扩张链 -->
  <rect x="48" y="254" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="81" y="271" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">R₀ = 0</text>
  <path d="M 114 267 L 134 267" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="124" y="251" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=0</text>
  <rect x="138" y="254" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="171" y="271" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">R₁ = 2</text>
  <path d="M 204 267 L 224 267" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="214" y="251" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=2</text>
  <rect x="228" y="254" width="66" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="261" y="271" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">R₂ = 5</text>
  <path d="M 294 267 L 314 267" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="304" y="251" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=5</text>
  <rect x="318" y="254" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="368" y="271" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">R₃ = 8 ≥ n ✓</text>
  <text x="428" y="271" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⟹ ans = 3</text>

  <!-- 最优切分 -->
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最优切分：3 段，每段都是某个 word 的前缀</text>
  <rect x="85" y="310" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="331" text-anchor="middle" font-size="14" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">aa</text>
  <text x="185" y="331" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">+</text>
  <rect x="205" y="310" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="331" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">bcd</text>
  <text x="315" y="331" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">+</text>
  <rect x="335" y="310" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="331" text-anchor="middle" font-size="14" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">abc</text>
  <text x="120" y="358" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">words[1] 的前缀</text>
  <text x="250" y="358" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">words[2] 的前缀</text>
  <text x="380" y="358" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">words[0] 的前缀</text>

  <!-- 对照说明 -->
  <rect x="55" y="372" width="410" height="42" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">对照示例 2：match = [5,4,3,2,1,5,4,3,2,1]，R：0 → 5 → 10，答案 2</text>
  <text x="260" y="407" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对照示例 3：match = [0,0,0]，R₁ = R₀ = 0 卡死，返回 −1</text>
</svg>
