<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两趟线性扫描</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">BFS 标记传染闭包 → 一次扫边判定 → 收集幸存者</text>

  <!-- 开始 -->
  <rect x="192" y="50" width="56" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="66" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">开始</text>
  <path d="M 220 74 L 220 88" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 建邻接表 -->
  <rect x="120" y="88" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="107" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 建邻接表 g[a] 追加 b</text>
  <text x="330" y="107" font-size="9" fill="#999" filter="url(#rough2)">O(m)</text>
  <path d="M 220 118 L 220 132" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② BFS -->
  <rect x="100" y="132" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="151" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 从 k 开始 BFS，标记 susp[ ]</text>
  <text x="352" y="151" font-size="9" fill="#999" filter="url(#rough2)">O(n+m)</text>
  <path d="M 220 162 L 220 176" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 判定菱形 -->
  <polygon points="220,176 335,222 220,268 105,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">③ 任意边 (a,b)：</text>
  <text x="220" y="231" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">susp[a]=0 且 susp[b]=1 ？</text>

  <!-- 是 → 右分支 -->
  <path d="M 335 222 L 355 222" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="345" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="355" y="200" width="150" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="219" text-anchor="middle" font-size="10.5" fill="#7a3530" font-weight="bold" filter="url(#rough2)">返回 [0,1,…,n−1]</text>
  <text x="430" y="236" text-anchor="middle" font-size="10" fill="#7a3530" filter="url(#rough2)">一个都不删</text>

  <!-- 否 → 下分支 -->
  <path d="M 220 268 L 220 284" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="232" y="281" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="110" y="284" width="220" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="303" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">返回所有 susp[i]=0 的方法</text>

  <!-- 汇合到结束 -->
  <rect x="302" y="332" width="56" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="348" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">结束</text>
  <path d="M 220 314 L 220 344 L 296 344" stroke="#a07830" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 244 L 430 344 L 364 344" stroke="#a07830" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
