<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：把购买拆成「边际单位」</text>

  <!-- 物品拆解卡 -->
  <rect x="24" y="46" width="330" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="66" font-size="12" fill="#333" filter="url(#rough2)">物品 C：价 ¥6，gain = 2（可白送 2 种）</text>
  <rect x="38" y="76" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2×</text>
  <rect x="74" y="76" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2×</text>
  <line x1="114" y1="72" x2="114" y2="106" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="122" y="76" width="30" height="24" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="92" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1×</text>
  <rect x="158" y="76" width="30" height="24" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="92" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1×</text>
  <text x="196" y="92" font-size="12" fill="#777" filter="url(#rough2)">… 无限</text>

  <text x="370" y="62" font-size="11.5" fill="#446688" filter="url(#rough2)">前 gain 份 = 双倍单位：</text>
  <text x="370" y="78" font-size="11.5" fill="#446688" filter="url(#rough2)">花 1 份钱得 2 个物品</text>
  <text x="370" y="96" font-size="11.5" fill="#888" filter="url(#rough2)">其后每份 = 单倍单位</text>
  <text x="370" y="112" font-size="11.5" fill="#888" filter="url(#rough2)">花 1 份钱得 1 个</text>

  <!-- 映射箭头 -->
  <path d="M89,116 L89,128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M170,114 C 260,152 400,108 448,128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 双倍通道 -->
  <rect x="24" y="132" width="336" height="180" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">双倍通道（示例 2，p_min = ¥6）</text>
  <text x="194" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2·p_min = ¥12</text>
  <line x1="194" y1="170" x2="194" y2="214" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="40" y="176" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="195" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">¥8 ×2份</text>
  <rect x="112" y="176" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="195" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">¥10 ×5份</text>
  <rect x="204" y="176" width="66" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="195" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">¥17 ×1份</text>
  <rect x="278" y="176" width="66" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="195" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">¥20 ×1份</text>
  <path d="M204,176 L270,206" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M278,176 L344,206" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="40" y="233" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ q &lt; 2·p_min：花 1 份钱得 2 个，更划算</text>
  <text x="40" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">   每份省下 2·p_min − q，都折进 g</text>
  <text x="40" y="277" font-size="11" fill="#b85450" filter="url(#rough2)">✗ q ≥ 2·p_min：不买，换成 2 份单倍</text>
  <text x="40" y="294" font-size="11" fill="#b85450" filter="url(#rough2)">   花费不增、个数不减（交换论证）</text>

  <!-- 单倍通道 -->
  <rect x="376" y="132" width="160" height="180" fill="#f0f7f0" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="392" y="154" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">单倍通道</text>
  <rect x="392" y="168" width="128" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p_min = ¥6 / 份</text>
  <text x="392" y="228" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只买最便宜的那种</text>
  <text x="392" y="246" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">无限量供应</text>
  <text x="392" y="276" font-size="10.5" fill="#666" filter="url(#rough2)">余钱全部换成物品</text>
  <text x="392" y="292" font-size="10.5" fill="#666" filter="url(#rough2)">（零头就浪费了）</text>

  <!-- 汇入公式 -->
  <path d="M192,314 L192,328" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M456,314 L456,328" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="24" y="330" width="512" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">g(a) = C(a) − 2a·p_min 先降后升（单谷），取谷底 g_min</text>
  <text x="280" y="376" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = (budget − g_min) ÷ p_min（整除取整）</text>
</svg>
