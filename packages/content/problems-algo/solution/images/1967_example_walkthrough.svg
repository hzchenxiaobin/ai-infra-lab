<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组输入的子串判定与计数</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="54" font-size="12.5" fill="#555" font-weight="bold">示例 1：word = "abc"</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="62" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="54" y="80">a</text>
    <rect x="68" y="62" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="80">b</text>
    <rect x="96" y="62" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="80">c</text>
  </g>
  <text x="140" y="80" font-size="11.5" fill="#555">"a"→✓, "abc"→✓, "bc"→✓, "d"→✗</text>
  <rect x="140" y="92" width="180" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="109" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 3</text>

  <!-- Divider -->
  <path d="M 40 128 L 540 128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="154" font-size="12.5" fill="#555" font-weight="bold">示例 2：word = "aaaaabbbbb"</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="162" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="51" y="179">a</text>
    <rect x="62" y="162" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="73" y="179">a</text>
    <rect x="84" y="162" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="95" y="179">a</text>
    <rect x="106" y="162" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="117" y="179">a</text>
    <rect x="128" y="162" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="139" y="179">a</text>
    <rect x="150" y="162" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="161" y="179">b</text>
    <rect x="172" y="162" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="183" y="179">b</text>
    <rect x="194" y="162" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="205" y="179">b</text>
    <rect x="216" y="162" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="227" y="179">b</text>
    <rect x="238" y="162" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="249" y="179">b</text>
  </g>
  <text x="280" y="179" font-size="11.5" fill="#555">"a"→✓, "b"→✓, "c"→✗</text>
  <rect x="280" y="190" width="160" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 2</text>

  <!-- Divider -->
  <path d="M 40 226 L 540 226" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="40" y="252" font-size="12.5" fill="#555" font-weight="bold">示例 3：word = "ab"（重复 pattern 各自计数）</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="260" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="54" y="278">a</text>
    <rect x="68" y="260" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="278">b</text>
  </g>
  <text x="110" y="278" font-size="11.5" fill="#555">"a"→✓, "a"→✓, "a"→✓（不去重）</text>
  <rect x="110" y="288" width="280" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 3（三份 "a" 各命中一次）</text>

  <!-- Divider -->
  <path d="M 40 332 L 540 332" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Notes -->
  <text x="40" y="356" font-size="11" fill="#888">观察：① 判定独立——某 pattern 是否命中不影响其他；② 重复 pattern 各自计数（示例 3）；</text>
  <text x="40" y="376" font-size="11" fill="#888">③ pattern 可等于 word 本身（"abc"⊆"abc" ✓）；④ 子串需连续，非子序列。</text>
</svg>
