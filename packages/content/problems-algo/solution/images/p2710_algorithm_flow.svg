<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：游标从右端出发，遇 0 左移，遇非零即停</text>

  <!-- ===== string row with cursor ===== -->
  <text x="50" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">num = "51230100"</text>

  <!-- index labels -->
  <text x="70" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="112" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="154" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="196" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="238" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="280" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="322" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="364" y="80" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">7</text>

  <!-- digit boxes -->
  <rect x="50" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="154" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="196" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="218" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="238" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="88" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="302" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="114" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="344" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="114" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- cursor i starting at index 7 -->
  <path d="M 364 58 L 364 82" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 7</text>

  <!-- arrow showing i moving left -->
  <path d="M 350 135 L 290 135" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i-- 左移</text>

  <!-- cursor at index 5 (stops) -->
  <path d="M 280 58 L 280 82" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 5 停</text>

  <!-- ===== decision diamond ===== -->
  <path d="M 430 175 L 490 205 L 430 235 L 370 205 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num[i]</text>
  <text x="430" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== '0' ?</text>

  <!-- link from string to diamond -->
  <path d="M 364 130 L 400 175" stroke="#888" stroke-width="1.3" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- Yes branch: left move -->
  <text x="350" y="200" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 370 205 L 200 205 L 200 175" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="120" y="155" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i-- （尾随零，左移）</text>

  <!-- No branch: stop -->
  <text x="498" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 490 205 L 490 250" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="360" y="256" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停止，返回 num[0..i]</text>

  <!-- step list -->
  <text x="40" y="200" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">步骤：</text>
  <rect x="40" y="210" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① i = n-1 起始</text>
  <rect x="40" y="236" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 遇 '0' 则 i--</text>
  <rect x="40" y="262" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="277" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 遇非零即停截断</text>

  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">循环只覆盖尾部零段，最坏退化为 O(n)</text>
</svg>
