<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：双哈希表——「球→颜色」正映射 +「颜色→计数」聚合</text>

  <text x="32" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① limit ≤ 10⁹ 开不了数组 → 只存「被染过的球」</text>

  <rect x="100" y="62" width="44" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="148" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="196" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="244" y="62" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="82" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="292" y="62" width="44" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="314" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <text x="122" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">球0</text>
  <text x="170" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">球1</text>
  <text x="218" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">球2</text>
  <text x="266" y="110" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">球3</text>
  <text x="314" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">球4</text>

  <text x="362" y="72" font-size="10.5" fill="#999" filter="url(#rough2)">虚线 = 从未被染：</text>
  <text x="362" y="88" font-size="10.5" fill="#999" filter="url(#rough2)">不进表、不算颜色</text>

  <path d="M 218 116 C 210 132 198 140 186 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="132" font-size="10" fill="#888" filter="url(#rough2)">染过的才进表</text>

  <text x="32" y="144" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② ball2color：球 → 当前颜色</text>
  <rect x="40" y="154" width="205" height="88" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="178" font-size="12" fill="#333" filter="url(#rough2)">球 1 → 颜色 <tspan fill="#446688" font-weight="bold">3</tspan></text>
  <text x="60" y="202" font-size="12" fill="#333" filter="url(#rough2)">球 2 → 颜色 <tspan fill="#4a7a3a" font-weight="bold">5</tspan></text>
  <text x="60" y="226" font-size="12" fill="#333" filter="url(#rough2)">球 3 → 颜色 <tspan fill="#8a6d3b" font-weight="bold">4</tspan></text>

  <text x="285" y="144" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ color2cnt：颜色 → 球数</text>
  <rect x="288" y="154" width="200" height="88" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="308" y="178" font-size="12" fill="#333" filter="url(#rough2)">颜色 <tspan fill="#446688" font-weight="bold">3</tspan> → ×1</text>
  <text x="308" y="202" font-size="12" fill="#333" filter="url(#rough2)">颜色 <tspan fill="#4a7a3a" font-weight="bold">5</tspan> → ×1</text>
  <text x="308" y="226" font-size="12" fill="#333" filter="url(#rough2)">颜色 <tspan fill="#8a6d3b" font-weight="bold">4</tspan> → ×1</text>

  <path d="M 245 198 L 286 198" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">聚合</text>

  <path d="M 388 242 L 388 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="278" y="264" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="290" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = len(color2cnt) = 3</text>

  <rect x="32" y="330" width="456" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">💡 不变式：color2cnt 里每个键的计数都 ≥ 1</text>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">计数减到 0 → 立刻删键，len 才恒等于「现存颜色数」</text>
</svg>
