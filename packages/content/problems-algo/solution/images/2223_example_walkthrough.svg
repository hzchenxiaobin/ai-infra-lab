<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "babab"（n = 5）逐位求 Z</text>

  <!-- ====== String row ====== -->
  <text x="60" y="58" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">s</text>
  <rect x="80" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="63" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="124" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="63" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="168" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="212" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="63" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="256" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="63" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <!-- indices -->
  <text x="102" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="146" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="190" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="234" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="278" y="88" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <!-- ====== Summary table ====== -->
  <!-- header -->
  <text x="60" y="118" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <rect x="80" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0</text>
  <rect x="124" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <rect x="168" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <rect x="212" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="234" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <rect x="256" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>

  <!-- box state row -->
  <text x="60" y="148" text-anchor="end" font-size="9.5" fill="#888">盒子 [l,r)</text>
  <rect x="80" y="132" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="148" text-anchor="middle" font-size="9.5" fill="#999">—</text>
  <rect x="124" y="132" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="148" text-anchor="middle" font-size="9.5" fill="#999">[1,1)</text>
  <rect x="168" y="132" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="190" y="148" text-anchor="middle" font-size="9.5" fill="#3a5a2a" font-weight="bold">[2,5)</text>
  <rect x="212" y="132" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="234" y="148" text-anchor="middle" font-size="9.5" fill="#3a5a2a" font-weight="bold">[2,5)</text>
  <rect x="256" y="132" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="278" y="148" text-anchor="middle" font-size="9.5" fill="#3a5a2a" font-weight="bold">[2,5)</text>

  <!-- verdict row -->
  <text x="60" y="178" text-anchor="end" font-size="9.5" fill="#888">判定</text>
  <rect x="80" y="162" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="178" text-anchor="middle" font-size="9" fill="#a87020">整串</text>
  <rect x="124" y="162" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="178" text-anchor="middle" font-size="9" fill="#b85450">盒外</text>
  <rect x="168" y="162" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="178" text-anchor="middle" font-size="8.5" fill="#b85450">盒外扩展</text>
  <rect x="212" y="162" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="234" y="178" text-anchor="middle" font-size="8.5" fill="#335">盒内复制</text>
  <rect x="256" y="162" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="178" text-anchor="middle" font-size="8.5" fill="#335">盒内截断</text>

  <!-- z value row -->
  <text x="60" y="208" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">z[i]</text>
  <rect x="80" y="192" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="210" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">5</text>
  <rect x="124" y="192" width="44" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="146" y="210" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="168" y="192" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="210" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">3</text>
  <rect x="212" y="192" width="44" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="210" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="256" y="192" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="210" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">1</text>

  <!-- divider -->
  <path d="M 30 232 L 550 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Detail: i=2 (extend) ====== -->
  <text x="40" y="256" font-size="11" fill="#b85450" font-weight="bold">i=2（盒外）：逐字比较，扩展得 3，盒子扩张为 [2,5)</text>
  <!-- prefix -->
  <text x="120" y="288" font-size="9.5" fill="#446688">前缀</text>
  <rect x="150" y="274" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="164" y="290" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">b</text>
  <rect x="178" y="274" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="192" y="290" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">a</text>
  <rect x="206" y="274" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="290" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">b</text>
  <!-- suffix aligned below -->
  <text x="120" y="316" font-size="9.5" fill="#4a7a3a">s[2:]</text>
  <rect x="150" y="302" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="164" y="318" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="178" y="302" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="192" y="318" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="206" y="302" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="250" y="318" font-size="10" fill="#b85450" font-weight="bold">→ 3 位全匹配，z[2]=3</text>

  <!-- ====== Detail: i=4 (truncate) ====== -->
  <text x="40" y="352" font-size="11" fill="#335" font-weight="bold">i=4（盒内 [2,5)）：镜像 i−l=2，z[2]=3 ≥ r−i=1，截断为 1</text>
  <!-- show box [2,5) covers positions 2,3,4; i=4 inside; mirror i-l=2 -->
  <text x="120" y="380" font-size="9.5" fill="#446688">前缀 z[2]</text>
  <rect x="180" y="366" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="382" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">3</text>
  <text x="226" y="382" font-size="10" fill="#888">≥</text>
  <rect x="244" y="366" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="264" y="382" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">r−i=1</text>
  <text x="300" y="382" font-size="10" fill="#335" font-weight="bold">→ 取 min = 1，遇边界停止</text>

  <text x="120" y="408" font-size="9.5" fill="#888">结果</text>
  <rect x="180" y="394" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="410" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">1</text>
  <text x="226" y="410" font-size="10" fill="#3a5a2a" font-weight="bold">无需再扩展（i+z=5 已到串尾）</text>

  <!-- ====== Answer ====== -->
  <rect x="120" y="426" width="340" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="445" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">Z = [5, 0, 3, 0, 1]，答案 = 5+0+3+0+1 = 9</text>
</svg>
