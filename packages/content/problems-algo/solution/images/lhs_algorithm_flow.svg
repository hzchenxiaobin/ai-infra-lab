<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希计数 + 相邻值配对</text>

  <!-- Step 1: count -->
  <rect x="150" y="42" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 哈希表统计每个值频次</text>
  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#555">cnt[x] = x 出现次数</text>
  <path d="M 260 88 L 260 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: init ans -->
  <rect x="150" y="106" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② ans = 0，遍历每个 key x</text>
  <path d="M 260 144 L 260 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond: x+1 in cnt? -->
  <path d="M 260 162 L 340 200 L 260 238 L 180 200 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x+1 在 cnt 中?</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#888">(差恰为 1)</text>

  <!-- No branch -->
  <path d="M 180 200 L 80 200 L 80 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="100" y="194" font-size="11" fill="#888">否</text>
  <rect x="30" y="252" width="100" height="40" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#555">差为 0</text>
  <text x="80" y="284" text-anchor="middle" font-size="10.5" fill="#888">跳过，不合法</text>

  <!-- Yes branch -->
  <path d="M 340 200 L 440 200 L 440 250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="386" y="194" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="370" y="252" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">candidate =</text>
  <text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">cnt[x] + cnt[x+1]</text>

  <!-- converge to update -->
  <path d="M 440 304 L 440 318 L 260 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 80 294 L 80 318 L 260 318" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- Step: update ans -->
  <rect x="150" y="306" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ ans = max(ans, candidate)</text>

  <!-- loop back arrow -->
  <path d="M 372 324 Q 470 324 470 124 L 372 124" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="486" y="226" text-anchor="middle" font-size="10" fill="#888" font-style="italic">下一个 x</text>

  <!-- return -->
  <rect x="150" y="350" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">遍历结束 → 返回 ans</text>
  <path d="M 260 344 L 260 348" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
