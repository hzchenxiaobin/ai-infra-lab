<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">纵向扫描：按列对齐比较字符</text>

  <!-- row labels -->
  <text x="44" y="74" font-size="12" fill="#888">strs[0]</text>
  <text x="44" y="112" font-size="12" fill="#888">strs[1]</text>
  <text x="44" y="150" font-size="12" fill="#888">strs[2]</text>

  <!-- column index header -->
  <text x="120" y="50" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">列0</text>
  <text x="168" y="50" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">列1</text>
  <text x="216" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">列2</text>
  <text x="264" y="50" text-anchor="middle" font-size="10" fill="#ccc">列3</text>
  <text x="312" y="50" text-anchor="middle" font-size="10" fill="#ccc">列4</text>
  <text x="360" y="50" text-anchor="middle" font-size="10" fill="#ccc">列5</text>

  <!-- row 0: flower -->
  <rect x="96" y="58" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="144" y="58" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="192" y="58" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="240" y="58" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="79" text-anchor="middle" font-size="13" fill="#999">w</text>
  <rect x="288" y="58" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="79" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="336" y="58" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="79" text-anchor="middle" font-size="13" fill="#999">r</text>

  <!-- row 1: flow -->
  <rect x="96" y="96" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="144" y="96" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="192" y="96" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="240" y="96" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="117" text-anchor="middle" font-size="13" fill="#999">w</text>

  <!-- row 2: flight -->
  <rect x="96" y="134" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>
  <rect x="144" y="134" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="192" y="134" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i</text>
  <rect x="240" y="134" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="155" text-anchor="middle" font-size="13" fill="#999">g</text>
  <rect x="288" y="134" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="155" text-anchor="middle" font-size="13" fill="#999">h</text>
  <rect x="336" y="134" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" fill="#999">t</text>

  <!-- column0 match bracket -->
  <path d="M 96 176 Q 96 184 102 184 L 138 184 Q 144 184 144 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="120" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 一致</text>

  <!-- column1 match bracket -->
  <path d="M 144 176 Q 144 184 150 184 L 186 184 Q 192 184 192 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="168" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 一致</text>

  <!-- column2 mismatch -->
  <path d="M 192 176 Q 192 184 198 184 L 234 184 Q 240 184 240 176" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="216" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 分歧!</text>

  <!-- arrow indicating scan stops -->
  <text x="216" y="44" text-anchor="middle" font-size="10" fill="#b85450">↓ 停止</text>

  <!-- prefix result -->
  <rect x="80" y="214" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="235" font-size="11" fill="#555">公共前缀 =</text>
  <text x="190" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">"fl"</text>

  <!-- Core idea box -->
  <rect x="40" y="262" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：公共前缀 = 所有字符串同列字符都相同</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#666">逐列扫描，字符一致则前缀增长；</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#888">出现分歧 / 某串耗尽 → 立即停止，返回已积累前缀</text>
</svg>
