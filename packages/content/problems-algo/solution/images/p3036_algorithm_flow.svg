<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：差分取符号 → 预处理 fail → 单遍扫描计数</text>

  <!-- phase 1 -->
  <rect x="90" y="36" width="280" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="54" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① 构造符号数组 b（长 n−1）</text>
  <text x="230" y="71" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">b[i] = sign(nums[i+1] − nums[i]) ∈ {−1, 0, +1}</text>

  <path d="M 230 78 L 230 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 2 -->
  <rect x="90" y="96" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="114" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 预处理 pattern 的失配数组 fail</text>
  <text x="230" y="131" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">fail[i] = 最长相等真前后缀长度，O(m)</text>

  <path d="M 230 138 L 230 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="140" y="156" width="180" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 初始化 j = 0，ans = 0</text>

  <path d="M 230 186 L 230 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- read c -->
  <rect x="150" y="206" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="228" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">④ 读入 c = b[i]</text>

  <!-- mismatch diamond (left) -->
  <path d="M 150 223 L 168 223" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <polygon points="95,197 170,223 95,249 20,223" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="93" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j &gt; 0 且</text>
  <text x="93" y="233" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">c ≠ pattern[j] ?</text>

  <!-- fail loop-back -->
  <path d="M 95 249 L 95 276 L 36 276 L 36 223 L 16 223" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="66" y="291" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">j ← fail[j−1]（反复回退）</text>

  <!-- match advance (right) -->
  <path d="M 350 223 L 376 223" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="363" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">能接上</text>
  <rect x="380" y="206" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="221" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">若 c == pattern[j]：</text>
  <text x="455" y="235" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">j ← j + 1</text>

  <!-- to j==m diamond -->
  <path d="M 300 240 L 300 284" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="300,288 385,318 300,348 215,318" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="323" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j == m ?</text>

  <!-- count box -->
  <path d="M 385 318 L 428 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="432" y="296" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="492" y="313" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans++（命中）</text>
  <text x="492" y="330" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">j ← fail[j−1] 续找</text>

  <!-- to i++ -->
  <path d="M 300 348 L 300 368" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="362" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="200" y="372" width="200" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="393" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⑤ i++；扫完 b 返回 ans</text>

  <!-- loop back to read c -->
  <path d="M 200 389 L 60 389 L 60 223 L 16 223" stroke="#999" stroke-width="0" fill="none" filter="url(#rough2)"/>
  <path d="M 200 389 L 72 389 L 72 322" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 72 223 L 72 322" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="132" y="382" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- note -->
  <rect x="18" y="404" width="524" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">💡 j 的总回退量 ≤ 总增量 ≤ n，双指针摊还后匹配阶段 O(n)，总计 O(n + m)</text>
</svg>
