<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：「昨天」按日期差 DATEDIFF=1 配对，而非 id−1</text>

  <rect x="40" y="50" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">id</text>
  <rect x="90" y="50" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">recordDate</text>
  <rect x="250" y="50" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">temperature</text>

  <rect x="40" y="76" width="50" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="76" width="160" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2015-01-01</text>
  <rect x="250" y="76" width="90" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>

  <rect x="40" y="108" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="90" y="108" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2015-01-02</text>
  <rect x="250" y="108" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="129" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25</text>

  <rect x="40" y="140" width="50" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="90" y="140" width="160" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2015-01-03</text>
  <rect x="250" y="140" width="90" height="32" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="161" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>

  <rect x="40" y="172" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="90" y="172" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2015-01-04</text>
  <rect x="250" y="172" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="193" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30</text>

  <path d="M 345 92 L 358 92 L 358 124 L 345 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="365" y="112" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25 &gt; 10 ✓</text>

  <path d="M 345 124 L 358 124 L 358 156 L 345 156" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="365" y="144" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">20 &lt; 25 ✗</text>

  <path d="M 345 156 L 358 156 L 358 188 L 345 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="365" y="176" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30 &gt; 20 ✓</text>

  <rect x="40" y="228" width="490" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">⚠️ 为什么不能用 w1.id = w2.id − 1 ？</text>
  <text x="60" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">① id 可能有缺口：删过行后 id 不连续，id−1 指向的根本不是昨天</text>
  <text x="60" y="302" font-size="11.5" fill="#555" filter="url(#rough2)">② 日期可能有缺口：某天没记录，相邻两行日期差 ≠ 1 天</text>
  <text x="60" y="326" font-size="11.5" fill="#555" filter="url(#rough2)">③ id 顺序未必与日期顺序一致（id 不保证按 recordDate 递增）</text>
  <text x="60" y="356" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 必须用 DATEDIFF(w1.recordDate, w2.recordDate) = 1 锚定「昨天」</text>
</svg>
