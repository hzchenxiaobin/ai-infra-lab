<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [12,8,3,4,null,1,null]</text>

  <!-- 左：标注树 -->
  <text x="40" y="56" font-size="12" fill="#888">每个节点旁标 (sum, cnt) 与 avg：</text>

  <!-- 连线 -->
  <line x1="178" y1="92" x2="128" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="198" y1="92" x2="250" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="122" y1="166" x2="90" y2="212" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="246" y1="166" x2="218" y2="212" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 根 12 -->
  <circle cx="188" cy="78" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="208" y="74" font-size="9" fill="#4a7a3a">(28,5)</text>
  <text x="208" y="88" font-size="9" fill="#b85450">avg=5.6</text>

  <!-- 节点 8 [最大] -->
  <circle cx="126" cy="152" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="126" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="146" y="148" font-size="9" fill="#4a7a3a">(12,2)</text>
  <text x="146" y="162" font-size="9" fill="#b85450" font-weight="bold">avg=6 ★</text>

  <!-- 节点 3 -->
  <circle cx="252" cy="152" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="272" y="148" font-size="9" fill="#4a7a3a">(4,2)</text>
  <text x="272" y="162" font-size="9" fill="#b85450">avg=2</text>

  <!-- 叶 4 -->
  <circle cx="88" cy="226" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="230" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="104" y="224" font-size="9" fill="#4a7a3a">(4,1)</text>
  <text x="104" y="238" font-size="9" fill="#b85450">avg=4</text>

  <!-- 叶 1 -->
  <circle cx="216" cy="226" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="230" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="232" y="224" font-size="9" fill="#4a7a3a">(1,1)</text>
  <text x="232" y="238" font-size="9" fill="#b85450">avg=1</text>

  <!-- 后序访问顺序 -->
  <text x="40" y="268" font-size="11" fill="#888">后序访问：4 → 1 → 8 → 3 → 12</text>

  <!-- 右：演算表 -->
  <text x="360" y="56" font-size="12" fill="#888">逐节点演算：</text>

  <!-- 表头 -->
  <rect x="350" y="66" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">node</text>
  <rect x="390" y="66" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="417" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(sum,cnt)</text>
  <rect x="445" y="66" width="45" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="467" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">avg</text>
  <rect x="490" y="66" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">maxAvg</text>

  <!-- 行 4 -->
  <rect x="350" y="88" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="103" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="390" y="88" width="55" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="103" text-anchor="middle" font-size="10" fill="#333">(4,1)</text>
  <rect x="445" y="88" width="45" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="467" y="103" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="490" y="88" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="103" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- 行 1 -->
  <rect x="350" y="110" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="125" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="390" y="110" width="55" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="125" text-anchor="middle" font-size="10" fill="#333">(1,1)</text>
  <rect x="445" y="110" width="45" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="467" y="125" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="490" y="110" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="125" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- 行 8 [高亮] -->
  <rect x="350" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="147" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <rect x="390" y="132" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="147" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(12,2)</text>
  <rect x="445" y="132" width="45" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="147" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <rect x="490" y="132" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="147" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>

  <!-- 行 3 -->
  <rect x="350" y="154" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="169" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="390" y="154" width="55" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="169" text-anchor="middle" font-size="10" fill="#333">(4,2)</text>
  <rect x="445" y="154" width="45" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="467" y="169" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="490" y="154" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="169" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- 行 12 -->
  <rect x="350" y="176" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="191" text-anchor="middle" font-size="10" fill="#333">12</text>
  <rect x="390" y="176" width="55" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="417" y="191" text-anchor="middle" font-size="10" fill="#333">(28,5)</text>
  <rect x="445" y="176" width="45" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="467" y="191" text-anchor="middle" font-size="10" fill="#333">5.6</text>
  <rect x="490" y="176" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="191" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- 结果 -->
  <path d="M 515 200 L 515 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="445" y="220" width="95" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="492" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 6.0 ✓</text>

  <!-- 底部说明 -->
  <rect x="30" y="288" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键观察：最大平均值不一定出现在叶子</text>
  <text x="46" y="336" font-size="11" fill="#555">① 叶子 4 的 avg=4、叶子 1 的 avg=1，均小于内部节点 8 的 avg=6</text>
  <text x="46" y="356" font-size="11" fill="#555">② 节点 8 的子树 = {8,4}：和 12 ÷ 2 = 6，因其值 8 远大于孩子 4，拉高了均值</text>
  <text x="46" y="374" font-size="11" fill="#b85450" font-weight="bold">结论：必须枚举每个节点为根的子树，不能只看叶子——后序 DFS 天然覆盖全部节点</text>
</svg>
