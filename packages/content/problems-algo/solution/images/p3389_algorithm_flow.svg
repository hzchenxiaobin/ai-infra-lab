<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：枚举 c + 26 位两状态 DP</text>

  <!-- 1 统计频次 -->
  <rect x="150" y="34" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="52" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">统计频次 occ[26]</text>

  <!-- 2 枚举 c -->
  <rect x="150" y="84" width="240" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举目标频率 c ∈ [1, n]</text>

  <!-- 3 初始化 -->
  <rect x="150" y="134" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[j] = |occ[a] − j·c|</text>

  <!-- 4 转移（关键） -->
  <rect x="100" y="184" width="340" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">i = 1..25 逐字母转移</text>
  <text x="270" y="219" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">ndp[j] = min(dp[j'] + |occ[i] − j·c|</text>
  <text x="270" y="235" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">− min(盈余(i−1), 缺口(i)))</text>

  <!-- 5 更新答案 -->
  <rect x="150" y="264" width="240" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = min(ans, min(dp))</text>

  <!-- 判断：还有 c 未试 -->
  <polygon points="210,320 270,300 330,320 270,340" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">还有 c 未试？</text>

  <!-- 返回 -->
  <rect x="370" y="306" width="115" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 主流程箭头 -->
  <path d="M 270 60 L 270 80" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 110 L 270 130" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 160 L 270 180" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 240 L 270 260" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 290 L 270 297" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是：回到枚举 c -->
  <path d="M 210 320 L 62 320 L 62 97 L 146 97" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="311" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 330 320 L 366 320" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="343" y="311" font-size="12" fill="#555" filter="url(#rough2)">否</text>
</svg>
