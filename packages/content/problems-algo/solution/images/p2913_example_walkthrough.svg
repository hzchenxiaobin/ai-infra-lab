<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="380" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,1]，双循环逐步累计，最终 15</text>

  <!-- table header -->
  <rect x="120" y="56" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="180" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="255" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">子数组</text>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">集合</text>
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="475" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">d²</text>
  <text x="530" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- data rows (grouped by i: green / blue / yellow) -->
  <rect x="120" y="90" width="440" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="255" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="530" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="120" y="120" width="440" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="430" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="475" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="530" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="120" y="150" width="440" height="30" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="255" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,2,1]</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="475" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="530" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="120" y="180" width="440" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="360" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="430" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="530" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>

  <rect x="120" y="210" width="440" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="255" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,1]</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="430" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="475" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="530" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>

  <rect x="120" y="240" width="440" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="255" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="360" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="430" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="530" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- total row -->
  <rect x="120" y="270" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+4+4+1+4+1</text>
  <text x="530" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="340" y="336" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">同色的连续几行 = 同一个 i 的内层循环：d 单调不减，红色 4 来自「老面孔 1」</text>
  <text x="340" y="356" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i 前进 = 换新窗口：seen 清空、d 归零，从头扩张</text>
</svg>
