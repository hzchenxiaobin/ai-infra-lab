<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段 DP 算法流程</text>

  <!-- Phase 1 header -->
  <rect x="100" y="44" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="67" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Phase 1：填代价表 cost</text>

  <path d="M 230 84 L 230 100" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 1 step 1 -->
  <rect x="90" y="104" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for len = 1 to n:</text>
  <text x="230" y="140" text-anchor="middle" font-size="10.5" fill="#555">按子串长度递增填表</text>

  <path d="M 230 152 L 230 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 1 step 2 -->
  <rect x="90" y="172" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for i = 0 to n−len:</text>
  <text x="230" y="209" text-anchor="middle" font-size="11" fill="#333">j = i + len − 1</text>
  <text x="230" y="223" text-anchor="middle" font-size="10.5" fill="#888">cost[i][j] = cost[i+1][j-1] + (s[i]≠s[j])</text>

  <path d="M 230 232 L 230 248" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 1 loop back -->
  <path d="M 370 192 L 430 192 L 430 122 L 372 122" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="436" y="157" font-size="9.5" fill="#aaa" transform="rotate(-90 436 157)">循环</text>

  <!-- Phase 1 done -->
  <text x="230" y="260" text-anchor="middle" font-size="10.5" fill="#d6a040" font-style="italic">代价表填完 → O(n²)</text>

  <path d="M 230 268 L 230 284" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 2 header -->
  <rect x="100" y="288" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Phase 2：填分组 DP 表</text>

  <path d="M 230 328 L 230 344" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 2 step 1 -->
  <rect x="90" y="348" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="366" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i = 1 to n:</text>
  <text x="230" y="384" text-anchor="middle" font-size="10.5" fill="#555">枚举前缀长度 i（s[0..i−1]）</text>

  <path d="M 230 396 L 230 412" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 2 step 2 -->
  <rect x="90" y="416" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="437" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for j = 2 to min(i, k):</text>
  <text x="230" y="453" text-anchor="middle" font-size="10.5" fill="#555">枚举段数 j，倒数第二段切点 m</text>
  <text x="230" y="467" text-anchor="middle" font-size="10.5" fill="#888">dp[i][j] = min(dp[m][j−1] + cost[m][i−1])</text>

  <path d="M 230 476 L 230 492" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 2 loop back -->
  <path d="M 370 436 L 430 436 L 430 366 L 372 366" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="436" y="401" font-size="9.5" fill="#aaa" transform="rotate(-90 436 401)">循环</text>

  <!-- Final -->
  <rect x="110" y="496" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="517" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return dp[n][k]　O(n²·k)</text>
</svg>
