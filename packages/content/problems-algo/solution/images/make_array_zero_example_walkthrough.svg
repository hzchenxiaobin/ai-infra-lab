<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,5,0,3,5] → 3</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">每轮取 x = 当前最小非零值，|S| 逐轮减 1</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="52" width="580" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55"  y="71">步</text>
    <text x="115" y="71">x（最小非零）</text>
    <text x="225" y="71">操作后 nums</text>
    <text x="380" y="71">非零不同值集合 S</text>
    <text x="520" y="71">|S|</text>
  </g>

  <!-- vertical separators -->
  <g stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)">
    <line x1="90"  y1="52" x2="90"  y2="240"/>
    <line x1="140" y1="52" x2="140" y2="240"/>
    <line x1="310" y1="52" x2="310" y2="240"/>
    <line x1="450" y1="52" x2="450" y2="240"/>
  </g>

  <!-- row: initial -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="55"  y="100">初始</text>
    <text x="115" y="100" fill="#888">—</text>
    <text x="225" y="100">[1, 5, 0, 3, 5]</text>
    <text x="380" y="100">{ 1, 3, 5 }</text>
    <text x="520" y="100" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- row: op1 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="55"  y="138">1</text>
    <text x="115" y="138" fill="#b85450" font-weight="bold">x=1</text>
    <text x="225" y="138">[0, 4, 0, 2, 4]</text>
    <text x="380" y="138">{ 2, 4 }</text>
    <text x="520" y="138" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row: op2 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="55"  y="176">2</text>
    <text x="115" y="176" fill="#b85450" font-weight="bold">x=2</text>
    <text x="225" y="176">[0, 2, 0, 0, 2]</text>
    <text x="380" y="176">{ 2 }</text>
    <text x="520" y="176" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row: op3 (highlight) -->
  <g filter="url(#rough2)">
    <rect x="20" y="194" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="55"  y="218">3</text>
    <text x="115" y="218" fill="#b85450" font-weight="bold">x=2</text>
    <text x="225" y="218">[0, 0, 0, 0, 0]</text>
    <text x="380" y="218" fill="#d6a040" font-weight="bold">∅（空）</text>
    <text x="520" y="218" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- table bottom border -->
  <path d="M 20 234 L 600 234" stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)"/>

  <!-- |S| monotone decrease note -->
  <text x="20" y="264" font-size="11" fill="#555" font-weight="bold">|S| 变化轨迹：3 → 2 → 1 → 0（每轮恰减 1）</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="276" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="276" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="276" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="360" y="276" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="85"  y="296">3</text>
    <text x="185" y="296">2</text>
    <text x="285" y="296">1</text>
    <text x="385" y="296" fill="#b85450">0</text>
  </g>
  <path d="M 115 291 L 155 291" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 215 291 L 255 291" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 315 291 L 355 291" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="425" y="296" font-size="10.5" fill="#888">每步 −1</text>

  <!-- answer -->
  <rect x="150" y="330" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 初始 |S| = 3</text>
  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a">= nums 中不同非零值的个数</text>

  <text x="20" y="412" font-size="11" fill="#555">• 重复的 5 只算一个值，与最小值 1 同步被减，不额外贡献操作。</text>
  <text x="20" y="428" font-size="10.5" fill="#888">• 0 本已归零，从不参与任何操作，故不计入 S。</text>
</svg>
