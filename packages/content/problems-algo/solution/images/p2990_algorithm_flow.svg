<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">执行流程：一趟扫描 → 分桶 → 双计数过滤 → 排序输出</text>

  <rect x="110" y="44" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① FROM Loans：单表一趟扫描（示例 8 行 / 4 个用户）</text>

  <path d="M 280 84 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="102" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② GROUP BY user_id：每位用户的贷款归入一组</text>
  <text x="280" y="139" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每组只输出一行——天然去重，SELECT 无需 DISTINCT</text>

  <path d="M 210 146 Q 200 156 190 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 146 Q 360 156 370 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="166" width="195" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="172" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③a SUM(Refinance) &gt; 0</text>
  <text x="172" y="207" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">该用户至少一笔再融资</text>

  <rect x="290" y="166" width="195" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="387" y="188" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③b SUM(Mortgage) &gt; 0</text>
  <text x="387" y="207" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">该用户至少一笔房贷</text>

  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">AND</text>

  <path d="M 172 218 Q 200 232 262 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 387 218 Q 360 232 298 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="246" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ HAVING 双条件 AND 过滤：101 / 103 / 104 出局</text>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">101 缺 Refinance，103 缺 Mortgage，104 缺 Refinance——AND 缺一不可</text>

  <path d="M 280 290 L 280 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="308" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ ORDER BY user_id → SELECT user_id</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出单列（升序）：102</text>

  <rect x="30" y="360" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对比暴力：两个 IN 子查询扫两遍表、自连接要 DISTINCT 去重；</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一趟分组聚合 + 组内两个计数器，Loans 只扫一次</text>
</svg>
