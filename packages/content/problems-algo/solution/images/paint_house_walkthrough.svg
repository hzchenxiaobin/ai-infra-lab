<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：costs = [[17,2,17],[16,16,5],[14,3,19]]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每列一种颜色：红 / 蓝 / 绿，逐行递推 dp[i][c]</text>

  <!-- Column headers -->
  <text x="120" y="76" font-size="12" fill="#888">i</text>
  <text x="220" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">红 (0)</text>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">蓝 (1)</text>
  <text x="420" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">绿 (2)</text>

  <!-- House 0: cost row -->
  <rect x="80" y="84" width="60" height="28" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="103" text-anchor="middle" font-size="12" fill="#333">cost 0</text>
  <rect x="170" y="84" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="270" y="84" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="103" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="370" y="84" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="103" text-anchor="middle" font-size="12" fill="#333">17</text>

  <!-- dp[0] row -->
  <rect x="80" y="118" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[0]</text>
  <rect x="170" y="118" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="137" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="270" y="118" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="370" y="118" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="137" text-anchor="middle" font-size="12" fill="#333">17</text>

  <text x="490" y="137" font-size="10" fill="#888">= cost[0]</text>

  <!-- House 1: cost row -->
  <rect x="80" y="152" width="60" height="28" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="171" text-anchor="middle" font-size="12" fill="#333">cost 1</text>
  <rect x="170" y="152" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="171" text-anchor="middle" font-size="12" fill="#333">16</text>
  <rect x="270" y="152" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="171" text-anchor="middle" font-size="12" fill="#333">16</text>
  <rect x="370" y="152" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="171" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- dp[1] row with computation -->
  <rect x="80" y="186" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[1]</text>
  <rect x="170" y="186" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="205" text-anchor="middle" font-size="12" fill="#333">18</text>
  <rect x="270" y="186" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#333">33</text>
  <rect x="370" y="186" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="205" text-anchor="middle" font-size="12" fill="#333">7</text>

  <text x="486" y="200" font-size="10" fill="#888">16+min(2,17)=18</text>
  <text x="486" y="213" font-size="10" fill="#888">16+min(17,17)=33</text>
  <text x="486" y="226" font-size="10" fill="#888">5+min(17,2)=7</text>

  <!-- House 2: cost row -->
  <rect x="80" y="220" width="60" height="28" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="239" text-anchor="middle" font-size="12" fill="#333">cost 2</text>
  <rect x="170" y="220" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="239" text-anchor="middle" font-size="12" fill="#333">14</text>
  <rect x="270" y="220" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="239" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="370" y="220" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="239" text-anchor="middle" font-size="12" fill="#333">19</text>

  <!-- dp[2] row with computation -->
  <rect x="80" y="254" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[2]</text>
  <rect x="170" y="254" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="273" text-anchor="middle" font-size="12" fill="#333">21</text>
  <rect x="270" y="254" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="273" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">10</text>
  <rect x="370" y="254" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="273" text-anchor="middle" font-size="12" fill="#333">37</text>

  <text x="486" y="268" font-size="10" fill="#888">14+min(33,7)=21</text>
  <text x="486" y="281" font-size="10" fill="#b85450" font-weight="bold">3+min(18,7)=10 ✓</text>
  <text x="486" y="294" font-size="10" fill="#888">19+min(18,33)=37</text>

  <!-- Answer -->
  <rect x="80" y="298" width="390" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="321" text-anchor="middle" font-size="13" fill="#333">答案 = min(dp[2]) = min(21, 10, 37) = </text>
  <text x="455" y="321" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">10</text>

  <!-- Optimal path trace -->
  <text x="40" y="356" font-size="12" fill="#555" font-weight="bold">最优方案回溯（dp[2][蓝]=10 最小）：</text>

  <rect x="60" y="368" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="386" text-anchor="middle" font-size="11" fill="#333">house 2 选蓝</text>
  <text x="125" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 3</text>

  <path d="M 195 390 L 235 390" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="384" text-anchor="middle" font-size="9" fill="#888">前一格必非蓝</text>

  <rect x="240" y="368" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="305" y="386" text-anchor="middle" font-size="11" fill="#333">house 1 选绿</text>
  <text x="305" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 5</text>

  <path d="M 375 390 L 415 390" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="384" text-anchor="middle" font-size="9" fill="#888">前一格必非绿</text>

  <rect x="420" y="368" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="386" text-anchor="middle" font-size="11" fill="#333">house 0 选蓝</text>
  <text x="475" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 2</text>

  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总花费 = 2 + 5 + 3 = 10 ✓</text>
</svg>
