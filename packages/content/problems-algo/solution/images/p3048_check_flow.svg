<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 开始：二分 -->
  <rect x="185" y="16" width="150" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="38" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">二分最小可行 x ∈ [1, m]</text>
  <path d="M260,50 L260,68" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求 last -->
  <rect x="140" y="70" width="240" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">last[i] = 下标 i 在前 x 秒的</text>
  <text x="260" y="105" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最晚出现秒号（未出现记 −1）</text>
  <path d="M260,114 L260,132" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：是否有未出现下标 -->
  <polygon points="260,132 372,168 260,204 148,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">存在未出现的</text>
  <text x="260" y="181" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">下标？</text>
  <text x="382" y="160" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M372,168 L406,168" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="408" y="150" width="92" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="173" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">false 不可行</text>
  <text x="268" y="220" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M260,204 L260,224" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 按时刻升序处理 -->
  <rect x="140" y="226" width="240" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">按 last 时刻升序处理下标：</text>
  <text x="260" y="261" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">j++，S ← S + nums[i]</text>
  <path d="M380,248 L406,248" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j 跑满 n</text>
  <rect x="408" y="230" width="92" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="253" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">true 可行</text>
  <path d="M260,270 L260,288" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：条件判定 -->
  <polygon points="260,290 362,324 260,358 158,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">tⱼ − j ≥ Sⱼ</text>
  <text x="260" y="337" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">成立？</text>
  <text x="372" y="316" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M362,324 L400,324" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="306" width="98" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="451" y="329" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">false 不可行</text>

  <!-- 回环：是 → 下一个 -->
  <path d="M158,324 C96,324 96,248 138,248" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="86" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">下一个 j</text>
</svg>
