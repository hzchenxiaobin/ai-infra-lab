<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：')' 触发栈内归约</text>

  <!-- Expression row -->
  <text x="270" y="60" text-anchor="middle" font-size="13" fill="#333">表达式：! ( &amp; ( f , t ) )</text>
  <rect x="178" y="46" width="80" height="22" fill="none" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="40" text-anchor="middle" font-size="10" fill="#d6a040">最内层子式</text>

  <!-- Step 1 -->
  <text x="40" y="92" font-size="12" fill="#b85450" font-weight="bold">① 读到第一个 ')' → 归约 &amp;(f,t)</text>

  <!-- Stack before step 1 -->
  <text x="40" y="124" font-size="10" fill="#888">栈：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="87" y="126" text-anchor="middle" font-size="12" fill="#446688">!</text>
    <rect x="108" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="125" y="126" text-anchor="middle" font-size="12" fill="#446688">&amp;</text>
    <rect x="146" y="108" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="163" y="126" text-anchor="middle" font-size="12" fill="#d6a040">(</text>
    <rect x="184" y="108" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="201" y="126" text-anchor="middle" font-size="12" fill="#b85450">f</text>
    <rect x="222" y="108" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="239" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a">t</text>
  </g>

  <!-- arrow reduce -->
  <path d="M 266 121 L 300 121" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="116" text-anchor="middle" font-size="9" fill="#b85450">弹出</text>
  <text x="283" y="138" text-anchor="middle" font-size="9" fill="#b85450">t,f,(</text>

  <!-- op box -->
  <rect x="304" y="108" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="126" text-anchor="middle" font-size="10" fill="#d6a040">&amp; → 全真才真</text>

  <path d="M 396 121 L 430 121" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stack after step 1 -->
  <text x="438" y="116" font-size="10" fill="#888">→</text>
  <g filter="url(#rough2)">
    <rect x="452" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="469" y="126" text-anchor="middle" font-size="12" fill="#446688">!</text>
    <rect x="490" y="108" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="507" y="126" text-anchor="middle" font-size="12" fill="#b85450">f</text>
  </g>

  <!-- Step 2 -->
  <text x="40" y="184" font-size="12" fill="#b85450" font-weight="bold">② 读到第二个 ')' → 归约 !(f)</text>

  <!-- Stack before step 2 -->
  <text x="40" y="216" font-size="10" fill="#888">栈：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="200" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="87" y="218" text-anchor="middle" font-size="12" fill="#446688">!</text>
    <rect x="108" y="200" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="125" y="218" text-anchor="middle" font-size="12" fill="#b85450">f</text>
  </g>

  <path d="M 150 213 L 184 213" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="167" y="208" text-anchor="middle" font-size="9" fill="#b85450">弹出</text>
  <text x="167" y="230" text-anchor="middle" font-size="9" fill="#b85450">f,(</text>

  <rect x="188" y="200" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="234" y="218" text-anchor="middle" font-size="10" fill="#d6a040">! → 取反</text>

  <path d="M 280 213 L 314 213" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="322" y="208" font-size="10" fill="#888">→</text>
  <g filter="url(#rough2)">
    <rect x="336" y="200" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="353" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a">t</text>
  </g>

  <!-- Result -->
  <rect x="160" y="270" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">结果 = t = true ✓</text>

  <!-- Key insight footer -->
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#888">关键：')' 是归约信号——弹出至 '(' 的所有值，取 '(' 前的算子求值</text>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#888">逗号 ',' 只是分隔符，入栈时直接跳过</text>
</svg>
