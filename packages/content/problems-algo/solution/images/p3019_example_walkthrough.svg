<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aAbBcC"，归一化后逐位比较相邻</text>

  <!-- header -->
  <rect x="84" y="52" width="332" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="147" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="201" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">lower(s[i])</text>
  <text x="256" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">prev</text>
  <text x="318" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">换键？</text>
  <text x="384" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">count</text>

  <!-- highlight rows: i=2 and i=4 -->
  <rect x="84" y="154" width="332" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="84" y="226" width="332" height="36" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- grid lines -->
  <path d="M 84 82 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 84 118 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 84 154 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 84 190 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 84 226 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 84 262 H 416" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 120 52 V 298" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 174 52 V 298" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 228 52 V 298" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 284 52 V 298" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 352 52 V 298" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="84" y="52" width="332" height="246" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="102" y="104" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="147" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="201" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="256" y="104" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="318" y="104" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="384" y="104" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <text x="102" y="140" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="147" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="201" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="256" y="140" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">a</text>
  <text x="318" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="384" y="140" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <!-- row 2 (change) -->
  <text x="102" y="176" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="147" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="201" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="256" y="176" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">a</text>
  <text x="318" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="384" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <text x="102" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="147" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="201" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="256" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <text x="318" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="384" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>

  <!-- row 4 (change) -->
  <text x="102" y="248" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="147" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="201" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <text x="256" y="248" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <text x="318" y="248" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="384" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 5 -->
  <text x="102" y="284" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="147" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="201" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <text x="256" y="284" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">c</text>
  <text x="318" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="384" y="284" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>

  <!-- side annotations -->
  <text x="424" y="176" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 换键 +1</text>
  <text x="424" y="248" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 换键 +1</text>

  <!-- example 2 box -->
  <rect x="48" y="316" width="424" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 2：s = "AaAaAaaA" → 归一化 "aaaaaaaa"</text>
  <text x="260" y="354" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">8 次输入全是同一个键 a：相邻比较全部相同 → 按键变更 0 次</text>

  <!-- conclusion box -->
  <rect x="48" y="374" width="424" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论：答案 = lower(s) 中相邻字符不同的对数 —— 本例 2 对，答案 2</text>
</svg>
