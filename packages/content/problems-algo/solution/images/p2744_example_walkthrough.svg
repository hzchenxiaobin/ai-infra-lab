<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：words = [cd, ac, dc, ca, zz]</text>

  <!-- table header -->
  <rect x="30" y="46" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步骤 / word</text>
  <rect x="130" y="46" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rev</text>
  <rect x="200" y="46" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描前 set</text>
  <rect x="320" y="46" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">动作</text>

  <!-- row 1: cd -->
  <rect x="30" y="76" width="100" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1: cd</text>
  <rect x="130" y="76" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dc</text>
  <rect x="200" y="76" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∅</text>
  <rect x="320" y="76" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dc 不在 set，加入 cd → {cd}</text>

  <!-- row 2: ac -->
  <rect x="30" y="110" width="100" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2: ac</text>
  <rect x="130" y="110" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ca</text>
  <rect x="200" y="110" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{cd}</text>
  <rect x="320" y="110" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ca 不在 set，加入 ac → {cd,ac}</text>

  <!-- row 3: dc (match) -->
  <rect x="30" y="144" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">3: dc ✓</text>
  <rect x="130" y="144" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cd</text>
  <rect x="200" y="144" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{cd, ac}</text>
  <rect x="320" y="144" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="166" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">cd 在 set！配对，ans=1，移除 cd</text>

  <!-- row 4: ca (match) -->
  <rect x="30" y="178" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">4: ca ✓</text>
  <rect x="130" y="178" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ac</text>
  <rect x="200" y="178" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ac}</text>
  <rect x="320" y="178" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">ac 在 set！配对，ans=2，移除 ac</text>

  <!-- row 5: zz -->
  <rect x="30" y="212" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5: zz</text>
  <rect x="130" y="212" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">zz</text>
  <rect x="200" y="212" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∅</text>
  <rect x="320" y="212" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">回文，自反，无法配对，加入 zz</text>

  <!-- result box -->
  <rect x="80" y="280" width="460" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="14" fill="#3a5a2a" filter="url(#rough2)">结果：ans = 2 ✓</text>
  <text x="310" y="330" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">cd↔dc 一对，ac↔ca 一对；zz 自反落单</text>

  <!-- note about palindrome -->
  <rect x="80" y="370" width="460" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="12" fill="#7a5a1a" filter="url(#rough2)">⚠️ 回文串（如 aa、zz）反转等于自身</text>
  <text x="310" y="414" text-anchor="middle" font-size="12" fill="#7a5a1a" filter="url(#rough2)">因 words 互不相同，回文串只能出现一次，永远无法配对</text>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#7a5a1a" filter="url(#rough2)">→ 哈希集合法天然处理，无需特判</text>
</svg>
