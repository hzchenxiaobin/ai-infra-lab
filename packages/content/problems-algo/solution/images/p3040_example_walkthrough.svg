<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums = [3,2,1,2,3,4]（n = 6）</text>

  <!-- Section A: s = 5 -->
  <text x="36" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">锁定 s = 5 —— 一路删空，共 3 次</text>

  <g filter="url(#rough2)">
    <rect x="56" y="64" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="88" y="64" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="120" y="64" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="152" y="64" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="184" y="64" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="216" y="64" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <text x="70" y="82" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="102" y="82" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="134" y="82" text-anchor="middle" font-size="12" fill="#999">1</text>
    <text x="166" y="82" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="198" y="82" text-anchor="middle" font-size="12" fill="#999">3</text>
    <text x="230" y="82" text-anchor="middle" font-size="12" fill="#999">4</text>
  </g>
  <text x="262" y="82" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 删前两个：3+2 = 5 ✓</text>
  <path d="M 70 92 L 70 102" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56" y="106" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="88" y="106" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="120" y="106" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="152" y="106" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="70" y="124" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="102" y="124" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="134" y="124" text-anchor="middle" font-size="12" fill="#999">3</text>
    <text x="166" y="124" text-anchor="middle" font-size="12" fill="#333">4</text>
  </g>
  <text x="262" y="124" font-size="11.5" fill="#b07830" font-weight="bold" filter="url(#rough2)">② 删首尾：1+4 = 5 ✓</text>
  <path d="M 70 134 L 70 144" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56" y="148" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="88" y="148" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="70" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="102" y="166" text-anchor="middle" font-size="12" fill="#333">3</text>
  </g>
  <text x="262" y="166" font-size="11.5" fill="#b07830" font-weight="bold" filter="url(#rough2)">③ 删首尾：2+3 = 5 ✓</text>
  <path d="M 70 176 L 70 186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="190" width="60" height="26" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="86" y="208" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">空</text>
  <text x="262" y="208" font-size="11.5" fill="#666" filter="url(#rough2)">区间空 → 停止，dfs = 3</text>

  <!-- divider -->
  <line x1="36" y1="228" x2="524" y2="228" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- Section B: s = 7 -->
  <text x="36" y="252" font-size="12" fill="#b07830" font-weight="bold" filter="url(#rough2)">锁定 s = 7 —— 删一对就卡死，共 1 次</text>

  <g filter="url(#rough2)">
    <rect x="56" y="262" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="88" y="262" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="120" y="262" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="152" y="262" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="184" y="262" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="216" y="262" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="70" y="280" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="102" y="280" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="134" y="280" text-anchor="middle" font-size="12" fill="#999">1</text>
    <text x="166" y="280" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="198" y="280" text-anchor="middle" font-size="12" fill="#999">3</text>
    <text x="230" y="280" text-anchor="middle" font-size="12" fill="#333">4</text>
  </g>
  <text x="262" y="280" font-size="11.5" fill="#b07830" font-weight="bold" filter="url(#rough2)">① 删首尾：3+4 = 7 ✓</text>
  <path d="M 70 290 L 70 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56" y="304" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="88" y="304" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="120" y="304" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="152" y="304" width="28" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <text x="70" y="322" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="102" y="322" text-anchor="middle" font-size="12" fill="#999">1</text>
    <text x="134" y="322" text-anchor="middle" font-size="12" fill="#999">2</text>
    <text x="166" y="322" text-anchor="middle" font-size="12" fill="#999">3</text>
  </g>
  <text x="262" y="314" font-size="10.5" fill="#b85450" filter="url(#rough2)">2+1=3 ✗　2+3=5 ✗　2+3=5 ✗</text>
  <text x="262" y="330" font-size="10.5" fill="#666" filter="url(#rough2)">三种删法分数都不等于 7 → 无路可走，dfs = 1</text>

  <!-- answer box -->
  <rect x="36" y="352" width="488" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = max(dfs₅, dfs₇) = max(3, 1) = 3</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对每个候选分数各跑一遍区间 DP，取三者最大值</text>
</svg>
