<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：二分最大可行 k</text>

  <!-- example 1 -->
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：nums = [2,3,4,4,4]，n = 5，hi = ⌊5/2⌋ = 2</text>

  <!-- table: header -->
  <rect x="40" y="64" width="45" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">轮次</text>
  <rect x="85" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">lo</text>
  <rect x="123" y="64" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">hi</text>
  <rect x="161" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">mid</text>
  <rect x="201" y="64" width="245" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">check(mid)</text>
  <rect x="446" y="64" width="134" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="513" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">动作</text>

  <!-- row 1 -->
  <rect x="40" y="98" width="45" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="85" y="98" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="104" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="123" y="98" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="161" y="98" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="201" y="98" width="245" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="323" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a=[2,3]，b=[4,4]：2&lt;4 ✓，3&lt;4 ✓</text>
  <rect x="446" y="98" width="134" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="513" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">lo = 2</text>

  <!-- row 2 -->
  <rect x="40" y="132" width="45" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="85" y="132" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="104" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="123" y="132" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="161" y="132" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="201" y="132" width="245" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="323" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = hi，二分结束</text>
  <rect x="446" y="132" width="134" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="513" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k = 2</text>

  <!-- answer 1 -->
  <rect x="60" y="182" width="500" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">答案 = 5 − 2×2 = 1 ✓（删 (2,4) 与 (3,4)，剩下的 4 无搭档）</text>

  <!-- example 2 -->
  <text x="310" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">例 2：nums = [10⁹, 10⁹]，n = 2，hi = 1</text>

  <rect x="60" y="260" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">mid = 1：check(1) 要求 nums[0] &lt; nums[1]，即 10⁹ &lt; 10⁹ ✗ → hi = 0</text>

  <!-- answer 2 -->
  <rect x="60" y="304" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="327" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">答案 = 2 − 0 = 2 ✓（相等元素不满足严格小于，永远删不掉）</text>

  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每删一对恰少 2 个元素：最小长度 = n − 2k，最大化 k 即最小化长度</text>
</svg>
