<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="435" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：桥边一搭，答案拆成两半</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">两棵树 + 1 条边 = 一棵更大的树（n+m−1 条边）⇒ 树内部距离全不变</text>

  <!-- ===== 树 1 区域 ===== -->
  <rect x="35" y="88" width="215" height="222" fill="none" stroke="#446688" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="142" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">树 1（n 个节点）</text>

  <!-- 树 1 的边 -->
  <line x1="128" y1="212" x2="75" y2="158" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="128" y1="212" x2="208" y2="148" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="128" y1="212" x2="82" y2="272" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="82" y1="272" x2="185" y2="288" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- i→a 高亮 -->
  <line x1="128" y1="212" x2="208" y2="148" stroke="#d6a040" stroke-width="4" filter="url(#rough2)"/>
  <text x="152" y="184" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">d(i,a)</text>

  <!-- 树 1 的节点 -->
  <circle cx="75" cy="158" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="82" cy="272" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="185" cy="288" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="208" cy="148" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="208" y="153" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="208" y="128" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">桥端点</text>
  <circle cx="128" cy="212" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="128" y="217" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="128" y="248" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">查询点 i</text>

  <!-- ===== 树 2 区域 ===== -->
  <rect x="312" y="88" width="178" height="222" fill="none" stroke="#4a7a3a" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="401" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树 2（m 个节点）</text>

  <!-- 树 2 的边 -->
  <line x1="348" y1="150" x2="430" y2="118" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="430" y1="118" x2="458" y2="208" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="458" y1="208" x2="408" y2="282" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="348" y1="150" x2="350" y2="240" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- b→w 高亮 -->
  <path d="M 348 150 L 430 118 L 458 208" fill="none" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <text x="464" y="156" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d(b,w)</text>

  <!-- 树 2 的节点 -->
  <circle cx="430" cy="118" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="408" cy="282" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="350" cy="240" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="348" cy="150" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="348" y="155" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="348" y="180" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">桥端点</text>
  <circle cx="458" cy="208" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="458" y="213" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="458" y="238" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">目标点 w</text>

  <!-- ===== 桥边 ===== -->
  <line x1="222" y1="148" x2="334" y2="150" stroke="#b85450" stroke-width="2.5"
        stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="278" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1（新桥边）</text>

  <!-- ===== 公式框 ===== -->
  <rect x="30" y="322" width="235" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="147" y="341" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">树 2 侧：d(i,w) = d(i,a) + 1 + d(b,w)</text>
  <text x="147" y="357" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">≤ k ⟺ d(b,w) ≤ k−1−d(i,a)</text>
  <text x="147" y="373" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（中间那个 1 就是过桥的一步）</text>

  <rect x="275" y="322" width="215" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="341" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">取 a = i（门口搭桥）最划算</text>
  <text x="382" y="357" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">预算 = k−1 最大，且与 i 无关</text>
  <text x="382" y="373" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">best2 = max_b cnt2[b]（全局常数）</text>

  <rect x="30" y="398" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer[i] = cnt1[i] + best2　（树 1 内部距离不变 ⇒ cnt1[i] 固定）</text>
</svg>
