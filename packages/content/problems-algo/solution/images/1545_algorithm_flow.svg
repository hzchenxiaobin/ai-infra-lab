<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分治递归流程：按 k 与中间位置 m 的关系三分</text>

  <!-- start box -->
  <rect x="210" y="50" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">findKthBit(n, k)</text>

  <!-- arrow down to decision 1 -->
  <path d="M 280 90 L 280 110" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: n == 1 ? -->
  <path d="M 280 112 L 360 150 L 280 188 L 200 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">n == 1 ?</text>

  <!-- yes branch -> return '0' -->
  <path d="M 200 150 L 130 150 L 130 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="142" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="70" y="198" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return '0'</text>

  <!-- no branch down -->
  <path d="M 280 188 L 280 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- compute m box -->
  <rect x="200" y="212" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m = 2^(n−1)</text>

  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: k vs m -->
  <path d="M 280 270 L 410 320 L 280 370 L 150 320 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">k 与 m 比较</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(m 为中间 '1')</text>

  <!-- left branch: k < m -->
  <path d="M 150 320 L 80 320 L 80 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="312" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">k &lt; m</text>
  <rect x="20" y="394" width="120" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">左半 = S_{n−1}</text>
  <text x="80" y="434" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">return find(n−1, k)</text>

  <!-- middle branch: k == m -->
  <path d="M 280 370 L 280 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="384" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k == m</text>
  <rect x="220" y="394" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">命中中间</text>
  <text x="280" y="434" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">return '1'</text>

  <!-- right branch: k > m -->
  <path d="M 410 320 L 480 320 L 480 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="312" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k &gt; m</text>
  <rect x="412" y="394" width="146" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="412" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">右半 = rev(inv S_{n−1})</text>
  <text x="485" y="428" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">c = find(n−1, 2ⁿ−k)</text>
  <text x="485" y="442" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">return invert(c)</text>
</svg>
