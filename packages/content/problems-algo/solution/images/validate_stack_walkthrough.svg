<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：pushed=[1,2,3,4,5] popped=[4,5,3,2,1]</text>

  <!-- 列头：pushed 指针 + popped 指针 -->
  <text x="40" y="54" font-size="11" fill="#888">pushed →</text>
  <text x="40" y="250" font-size="11" fill="#888">popped →</text>

  <!-- pushed 序列（顶部一行，标记进度）-->
  <g font-size="12" font-weight="bold">
    <rect x="110" y="42" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="127" y="60" text-anchor="middle" fill="#4a7a3a">1✓</text>
    <rect x="148" y="42" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="165" y="60" text-anchor="middle" fill="#4a7a3a">2✓</text>
    <rect x="186" y="42" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="203" y="60" text-anchor="middle" fill="#4a7a3a">3✓</text>
    <rect x="224" y="42" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="241" y="60" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="262" y="42" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="279" y="60" text-anchor="middle" fill="#446688">5</text>
    <text x="241" y="82" text-anchor="middle" font-size="10" fill="#d6a040">↑ i（待压 4）</text>
  </g>

  <!-- 中间栈快照 A：压入 1,2,3 -->
  <text x="60" y="120" font-size="11" fill="#446688" font-weight="bold">① push 1,2,3：</text>
  <g font-size="12" font-weight="bold">
    <rect x="70" y="200" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="90" y="216" text-anchor="middle" fill="#446688">1</text>
    <rect x="70" y="178" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="90" y="194" text-anchor="middle" fill="#446688">2</text>
    <rect x="70" y="156" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="90" y="172" text-anchor="middle" fill="#446688">3←顶</text>
  </g>
  <text x="90" y="238" text-anchor="middle" font-size="10" fill="#888">j=0, 顶3≠4</text>

  <!-- 箭头 A→B -->
  <path d="M 120 178 L 165 178" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="170" font-size="10" fill="#888">push 4</text>

  <!-- 栈快照 B：压入 4，栈顶匹配 -->
  <text x="185" y="120" font-size="11" fill="#d6a040" font-weight="bold">② push 4：顶==4 ✅</text>
  <g font-size="12" font-weight="bold">
    <rect x="195" y="200" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="215" y="216" text-anchor="middle" fill="#446688">1</text>
    <rect x="195" y="178" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="215" y="194" text-anchor="middle" fill="#446688">2</text>
    <rect x="195" y="156" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="215" y="172" text-anchor="middle" fill="#446688">3</text>
    <rect x="195" y="134" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="215" y="150" text-anchor="middle" fill="#d6a040">4←顶</text>
  </g>
  <text x="215" y="238" text-anchor="middle" font-size="10" fill="#d6a040">连弹开始</text>

  <!-- 箭头 B→C：pop 4 -->
  <path d="M 245 145 L 290 145" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="137" font-size="10" fill="#4a7a3a" font-weight="bold">pop→4</text>

  <!-- 栈快照 C：弹出 4 后，顶3≠5 -->
  <text x="310" y="120" font-size="11" fill="#888" font-weight="bold">③ pop 4：顶3≠5 停</text>
  <g font-size="12" font-weight="bold">
    <rect x="320" y="200" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="340" y="216" text-anchor="middle" fill="#446688">1</text>
    <rect x="320" y="178" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="340" y="194" text-anchor="middle" fill="#446688">2</text>
    <rect x="320" y="156" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="340" y="172" text-anchor="middle" fill="#446688">3←顶</text>
  </g>
  <text x="340" y="238" text-anchor="middle" font-size="10" fill="#888">j=1</text>

  <!-- 箭头 C→D：push 5 -->
  <path d="M 370 178 L 415 178" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="170" font-size="10" fill="#888">push 5</text>

  <!-- 栈快照 D：压入 5，触发级联连弹 -->
  <text x="435" y="120" font-size="11" fill="#d6a040" font-weight="bold">④ push 5：顶==5 ✅</text>
  <g font-size="12" font-weight="bold">
    <rect x="445" y="200" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="465" y="216" text-anchor="middle" fill="#446688">1</text>
    <rect x="445" y="178" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="465" y="194" text-anchor="middle" fill="#446688">2</text>
    <rect x="445" y="156" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="465" y="172" text-anchor="middle" fill="#446688">3</text>
    <rect x="445" y="134" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="465" y="150" text-anchor="middle" fill="#d6a040">5←顶</text>
  </g>
  <text x="465" y="238" text-anchor="middle" font-size="10" fill="#d6a040">级联连弹</text>

  <!-- popped 序列（底部，标记消费进度）-->
  <g font-size="12" font-weight="bold">
    <rect x="110" y="262" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="127" y="280" text-anchor="middle" fill="#4a7a3a">4✓</text>
    <rect x="148" y="262" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="165" y="280" text-anchor="middle" fill="#4a7a3a">5✓</text>
    <rect x="186" y="262" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="203" y="280" text-anchor="middle" fill="#4a7a3a">3✓</text>
    <rect x="224" y="262" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="241" y="280" text-anchor="middle" fill="#4a7a3a">2✓</text>
    <rect x="262" y="262" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="279" y="280" text-anchor="middle" fill="#4a7a3a">1✓</text>
    <text x="290" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">全部消费：j=5=n → true ✅</text>
  </g>

  <!-- 级联弹出示意（D 之后向下）-->
  <rect x="320" y="330" width="240" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="340" y="352" font-size="11.5" fill="#4a7a3a" font-weight="bold">⑤ 连弹链（一次 push 触发 4 次 pop）：</text>
  <text x="340" y="372" font-size="11" fill="#555" font-family="monospace">pop 5 (j=2) → 顶 3==3</text>
  <text x="340" y="388" font-size="11" fill="#555" font-family="monospace">pop 3 (j=3) → 顶 2==2</text>
  <text x="340" y="404" font-size="11" fill="#555" font-family="monospace">pop 2 (j=4) → 顶 1==1 → pop 1 (j=5)</text>

  <rect x="30" y="330" width="270" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="352" font-size="11" fill="#446688" font-weight="bold">操作计数（均摊 O(n) 论证）：</text>
  <text x="50" y="372" font-size="10.5" fill="#555">push 共 5 次，pop 共 5 次</text>
  <text x="50" y="388" font-size="10.5" fill="#555">每个元素至多入栈 1 次、出栈 1 次</text>
  <text x="50" y="404" font-size="10.5" fill="#555">总操作 2n → 内层 while 并非 O(n²)</text>

  <text x="290" y="438" text-anchor="middle" font-size="10.5" fill="#888">💡 「连弹」是本题最关键的现象：一次 push 可能清空栈中一长串匹配元素</text>
</svg>
