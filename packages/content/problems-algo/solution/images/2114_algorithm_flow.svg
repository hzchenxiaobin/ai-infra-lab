<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历句子 → 数空格 → +1 取最大</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">外层遍历句子，内层遍历字符数空格，最后取最大值</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="100" cy="74" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <!-- arrow start -> init -->
  <path d="M 100 96 L 100 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init: ans=0, i=0 ===== -->
  <rect x="48" y="122" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="156" text-anchor="middle" font-size="10" fill="#555">ans=0, i=0</text>

  <!-- arrow init -> outer cond -->
  <path d="M 100 168 L 100 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Outer loop condition diamond ===== -->
  <polygon points="100,192 170,226 100,260 30,226" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i &lt; n?</text>
  <text x="100" y="238" text-anchor="middle" font-size="10" fill="#555">(还有句子)</text>

  <!-- ===== YES branch: go right ===== -->
  <path d="M 170 226 L 210 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== spaces=0, scan sentence ===== -->
  <rect x="210" y="206" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="224" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">spaces = 0</text>
  <text x="295" y="240" text-anchor="middle" font-size="10" fill="#555">遍历 sentences[i] 每个字符 c</text>

  <!-- arrow -> inner count -->
  <path d="M 295 252 L 295 274" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Inner: if c==' ' then spaces++ (green) ===== -->
  <rect x="210" y="276" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">if c == ' '</text>
  <text x="295" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">spaces++</text>

  <!-- arrow inner -> update ans -->
  <path d="M 295 320 L 295 334" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Update ans: ans = max(ans, spaces+1) ===== -->
  <rect x="210" y="336" width="170" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- ===== NO branch: go down to return ===== -->
  <path d="M 100 260 L 100 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="276" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Return node ===== -->
  <ellipse cx="100" cy="306" rx="56" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="100" y="318" text-anchor="middle" font-size="10" fill="#555">(最多单词数)</text>

  <!-- ===== Right side: update ans callout ===== -->
  <rect x="420" y="336" width="90" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- arrow update -> back to outer cond -->
  <path d="M 380 346 L 410 346 L 410 226 L 380 226" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="410" y="300" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 410 300)">ans=max(ans,spaces+1) → i++ 回到外层</text>

  <!-- ===== Bottom callout: update ans formula ===== -->
  <rect x="40" y="336" width="370" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="350" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans = max(ans, spaces + 1) → i++，回到外层判定</text>

  <!-- Footer -->
  <text x="260" y="356" text-anchor="middle" font-size="9.5" fill="#aaa">时间 O(N·L) · 空间 O(1)</text>
</svg>
