<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：抬到「子集 lcm 的倍数」，覆盖集合装进 bitmask</text>

  <!-- ===== Panel A: number line ===== -->
  <text x="20" y="48" font-size="12.5" fill="#446688" filter="url(#rough2)">例：target = {2, 3, 5}，x = 7 → 抬到哪个数最划算？</text>

  <!-- highlight arc: 7 -> 10 -->
  <g filter="url(#rough2)">
    <path d="M 84 141 Q 175 88 264 141" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrO)"/>
    <text x="172" y="78" text-anchor="middle" font-size="11.5" fill="#8a6d1a">抬到 10：一次抬高，2 和 5 一起满足</text>
  </g>

  <!-- number line -->
  <g filter="url(#rough2)">
    <path d="M 55 150 L 515 150" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)"/>
    <!-- ticks -->
    <path d="M 80 144 L 80 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 150 144 L 150 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 210 144 L 210 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 270 144 L 270 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 350 144 L 350 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 430 144 L 430 156" stroke="#666" stroke-width="1.5"/>
    <path d="M 500 144 L 500 156" stroke="#666" stroke-width="1.5"/>
    <!-- start dot -->
    <circle cx="80" cy="150" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="80" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">7</text>
    <!-- multiples -->
    <circle cx="150" cy="150" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="171" text-anchor="middle" font-size="12" fill="#333">8</text>
    <circle cx="210" cy="150" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="210" y="171" text-anchor="middle" font-size="12" fill="#333">9</text>
    <circle cx="270" cy="150" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="270" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a">10</text>
    <circle cx="350" cy="150" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="350" y="171" text-anchor="middle" font-size="12" fill="#333">12</text>
    <circle cx="430" cy="150" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="430" y="171" text-anchor="middle" font-size="12" fill="#333">15</text>
    <circle cx="500" cy="150" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="500" y="171" text-anchor="middle" font-size="12" fill="#b85450">30</text>
    <!-- cost / coverage labels -->
    <text x="150" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a">+1 覆盖{2}</text>
    <text x="210" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a">+2 覆盖{3}</text>
    <text x="270" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1a">+3 覆盖{2,5}</text>
    <text x="350" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a">+5 覆盖{2,3}</text>
    <text x="430" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a">+8 覆盖{3,5}</text>
    <text x="500" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">+23 全覆盖</text>
    <!-- small guides from dots to labels -->
    <path d="M 270 143 L 270 128" stroke="#d6a040" stroke-width="1" stroke-dasharray="2,3"/>
    <path d="M 500 143 L 500 128" stroke="#b85450" stroke-width="1" stroke-dasharray="2,3"/>
  </g>

  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">cost(x,S) = (L − x mod L) mod L，L = lcm(S)：抬到不小于 x 的最小 L 倍数</text>

  <!-- ===== Panel B: bitmask states ===== -->
  <text x="20" y="224" font-size="12.5" fill="#446688" filter="url(#rough2)">覆盖集合只有 2^m 种（m ≤ 4 ⇒ 至多 16 个状态）→ dp[mask]</text>

  <g filter="url(#rough2)">
    <rect x="30" y="248" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="65" y="268" text-anchor="middle" font-size="13" fill="#333">000</text>
    <text x="65" y="285" text-anchor="middle" font-size="10.5" fill="#666">空</text>

    <rect x="130" y="248" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="165" y="268" text-anchor="middle" font-size="13" fill="#333">001</text>
    <text x="165" y="285" text-anchor="middle" font-size="10.5" fill="#666">{2}</text>

    <rect x="230" y="248" width="70" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="265" y="268" text-anchor="middle" font-size="13" fill="#2d4d22">011</text>
    <text x="265" y="285" text-anchor="middle" font-size="10.5" fill="#666">{2,3}</text>

    <rect x="330" y="248" width="70" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="365" y="268" text-anchor="middle" font-size="13" fill="#2d4d22">101</text>
    <text x="365" y="285" text-anchor="middle" font-size="10.5" fill="#666">{2,5}</text>

    <rect x="440" y="248" width="80" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="480" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">111</text>
    <text x="480" y="285" text-anchor="middle" font-size="10.5" fill="#666">全覆盖</text>

    <!-- transition arrows below boxes -->
    <path d="M 265 296 Q 350 326 474 296" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="360" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a">x 抬成 5 的倍数（补上 {5}）</text>
    <path d="M 365 296 Q 425 312 470 297" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  </g>

  <!-- transition formula box -->
  <g filter="url(#rough2)">
    <rect x="30" y="340" width="500" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="360" text-anchor="middle" font-size="13" fill="#8a6d1a">转移：dp′[ j ∪ s ] = min( dp[j] + cost(x, s) )</text>
    <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#8a6d1a">只需枚举与 j 不相交的非空子集 s（s = ∅ 即「不动这个数」）</text>
  </g>
</svg>
