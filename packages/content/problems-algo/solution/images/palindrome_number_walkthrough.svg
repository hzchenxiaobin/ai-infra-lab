<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x = 12321（奇数位回文）</text>

  <!-- step table header -->
  <text x="30" y="60" font-size="12" fill="#444" font-weight="bold">轮次</text>
  <text x="90" y="60" font-size="12" fill="#444" font-weight="bold">剩余 x</text>
  <text x="220" y="60" font-size="12" fill="#444" font-weight="bold">digit = x%10</text>
  <text x="350" y="60" font-size="12" fill="#444" font-weight="bold">reverted</text>
  <text x="480" y="60" font-size="12" fill="#444" font-weight="bold">x &gt; reverted?</text>
  <line x1="20" y1="68" x2="560" y2="68" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- step 0 init -->
  <text x="30" y="92" font-size="11" fill="#333">初始</text>
  <rect x="80" y="76" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12321</text>
  <text x="220" y="95" font-size="11" fill="#888">—</text>
  <rect x="330" y="76" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="480" y="95" font-size="11" fill="#4a7a3a" font-weight="bold">是 → 进循环</text>

  <!-- step 1 -->
  <text x="30" y="128" font-size="11" fill="#333">1</text>
  <rect x="80" y="112" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1232</text>
  <text x="220" y="131" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="112" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="480" y="131" font-size="11" fill="#4a7a3a" font-weight="bold">1232 &gt; 1，是</text>

  <!-- step 2 -->
  <text x="30" y="164" font-size="11" fill="#333">2</text>
  <rect x="80" y="148" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">123</text>
  <text x="220" y="167" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="330" y="148" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="480" y="167" font-size="11" fill="#4a7a3a" font-weight="bold">123 &gt; 12，是</text>

  <!-- step 3 -->
  <text x="30" y="200" font-size="11" fill="#333">3</text>
  <rect x="80" y="184" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="220" y="203" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="330" y="184" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">123</text>
  <text x="480" y="203" font-size="11" fill="#b85450" font-weight="bold">12 &gt; 123? 否，停</text>

  <!-- final compare -->
  <rect x="40" y="230" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">循环结束：x = 12，reverted = 123</text>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#666">奇数位 → 比较 x == reverted / 10 ⇒ 12 == 12 ✓ → 返回 true</text>
  <text x="290" y="286" text-anchor="middle" font-size="10" fill="#888">中点「3」被 reverted 多压一位，整除 10 后丢弃</text>

  <!-- second example: even digits 1221 -->
  <text x="290" y="316" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">对照：偶数位 x = 1221</text>
  <rect x="40" y="326" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="346" font-size="11" fill="#444">轮次1：x=122, reverted=1；轮次2：x=12, reverted=12（x 不大于 reverted，停）</text>
  <text x="60" y="364" font-size="11" fill="#444">偶数位 → 比较 x == reverted ⇒ 12 == 12 ✓ → 返回 true</text>
  <text x="60" y="380" font-size="10" fill="#888">两半位数相等，无需除 10</text>
</svg>
