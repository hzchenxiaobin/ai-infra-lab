<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：旋转→倍增滑窗 + 互补trick，O(n) 一趟扫描</text>

  <!-- ===== Section 1: Rotation concept ===== -->
  <text x="20" y="50" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 类型1（旋转）= 在 s+s 上选长度 n 的窗口</text>

  <!-- s = "111000" -->
  <text x="20" y="80" font-size="10" fill="#888" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="50" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="68" y="84" fill="#333" font-weight="bold">1</text>
    <rect x="86" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="104" y="84" fill="#333" font-weight="bold">1</text>
    <rect x="122" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="140" y="84" fill="#333" font-weight="bold">1</text>
    <rect x="158" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="176" y="84" fill="#333" font-weight="bold">0</text>
    <rect x="194" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="212" y="84" fill="#333" font-weight="bold">0</text>
    <rect x="230" y="66" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="248" y="84" fill="#333" font-weight="bold">0</text>
  </g>

  <!-- Arrow: rotate -->
  <path d="M 280 79 L 350 79" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="315" y="72" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">类型1 ×2</text>

  <!-- Rotated: "100011" -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="370" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="388" y="84" fill="#333" font-weight="bold">1</text>
    <rect x="406" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="424" y="84" fill="#333" font-weight="bold">0</text>
    <rect x="442" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="460" y="84" fill="#333" font-weight="bold">0</text>
    <rect x="478" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="496" y="84" fill="#333" font-weight="bold">0</text>
    <rect x="514" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="532" y="84" fill="#333" font-weight="bold">1</text>
    <rect x="550" y="66" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="568" y="84" fill="#333" font-weight="bold">1</text>
  </g>

  <text x="320" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">↑ 旋转不改字符只改起点 → 等价于在 s+s 上滑动长度为 n 的窗口</text>

  <!-- ===== Section 2: Doubled string + sliding window ===== -->
  <text x="20" y="128" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 倍增 t = s+s，用绝对模式 P₀ 统一奇偶窗口</text>

  <!-- position labels -->
  <g filter="url(#rough2)" font-size="8" fill="#aaa" text-anchor="middle">
    <text x="68" y="144">0</text>
    <text x="104" y="144">1</text>
    <text x="140" y="144">2</text>
    <text x="176" y="144">3</text>
    <text x="212" y="144">4</text>
    <text x="248" y="144">5</text>
    <text x="284" y="144">6</text>
    <text x="320" y="144">7</text>
    <text x="356" y="144">8</text>
    <text x="392" y="144">9</text>
    <text x="428" y="144">10</text>
    <text x="464" y="144">11</text>
  </g>

  <!-- t = s+s -->
  <text x="20" y="166" font-size="10" fill="#888" filter="url(#rough2)">t=</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="50" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="68" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="86" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="104" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="122" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="158" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="170" fill="#333" font-weight="bold">0</text>
    <rect x="194" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="212" y="170" fill="#333" font-weight="bold">0</text>
    <rect x="230" y="152" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="248" y="170" fill="#333" font-weight="bold">0</text>
    <rect x="266" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="284" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="302" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="320" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="338" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="356" y="170" fill="#333" font-weight="bold">1</text>
    <rect x="374" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="392" y="170" fill="#333" font-weight="bold">0</text>
    <rect x="410" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="428" y="170" fill="#333" font-weight="bold">0</text>
    <rect x="446" y="152" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="464" y="170" fill="#333" font-weight="bold">0</text>
  </g>

  <!-- Window [0,5] bracket -->
  <path d="M 50 184 L 50 190 L 266 190 L 266 184" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="158" y="202" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口[0,5]: diff₀=4, min(4,2)=2</text>

  <!-- Window [2,7] bracket -->
  <path d="M 122 210 L 122 216 L 338 216 L 338 210" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口[2,7]: diff₀=4（旋转2次→"100011"）</text>

  <!-- P0 row -->
  <text x="20" y="250" font-size="10" fill="#888" filter="url(#rough2)">P₀=</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="50" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="68" y="251" fill="#888">0</text>
    <rect x="86" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="104" y="251" fill="#888">1</text>
    <rect x="122" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="140" y="251" fill="#888">0</text>
    <rect x="158" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="176" y="251" fill="#888">1</text>
    <rect x="194" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="212" y="251" fill="#888">0</text>
    <rect x="230" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="248" y="251" fill="#888">1</text>
    <rect x="266" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="284" y="251" fill="#888">0</text>
    <rect x="302" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="320" y="251" fill="#888">1</text>
    <rect x="338" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="356" y="251" fill="#888">0</text>
    <rect x="374" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="392" y="251" fill="#888">1</text>
    <rect x="410" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="428" y="251" fill="#888">0</text>
    <rect x="446" y="236" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="464" y="251" fill="#888">1</text>
  </g>
  <text x="500" y="250" font-size="9" fill="#888" filter="url(#rough2)">↑ 绝对模式</text>
  <text x="500" y="262" font-size="8" fill="#aaa" filter="url(#rough2)">偶位→0, 奇位→1</text>

  <!-- ===== Section 3: Complement trick ===== -->
  <text x="20" y="282" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 互补trick：两种目标逐位互补 → diffA + diffB = n</text>

  <rect x="40" y="292" width="560" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每个位置恰与一种目标不匹配 → 无需分别算两种模式</text>
  <text x="320" y="330" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = min(diff₀, n − diff₀)</text>

  <!-- ===== Section 4: Sliding update ===== -->
  <text x="20" y="354" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 滑窗 O(1) 更新：移出 t[i−1]，移入 t[i+n−1]</text>

  <rect x="40" y="364" width="560" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="384" font-size="11" fill="#333" filter="url(#rough2)">• 初始：遍历 t[0..n−1] 逐位比 P₀，得 diff₀</text>
  <text x="60" y="402" font-size="11" fill="#333" filter="url(#rough2)">• 滑动：t[i−1]≠P₀[i−1] 则 diff₀−−；t[i+n−1]≠P₀[i+n−1] 则 diff₀++</text>
  <text x="60" y="420" font-size="11" fill="#333" filter="url(#rough2)">• 更新：ans = min(ans, diff₀, n − diff₀)，共滑 n−1 次</text>
  <text x="60" y="440" font-size="9.5" fill="#b85450" filter="url(#rough2)">⚠ n 偶时 diff₀ 不随滑动改变（旋转无效）；n 奇时 diff₀ 每步 ±1（旋转有效）</text>
</svg>
