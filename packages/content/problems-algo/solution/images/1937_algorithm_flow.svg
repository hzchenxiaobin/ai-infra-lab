<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：逐行两趟扫描 + 滚动 dp
  </text>

  <!-- Step 1: init -->
  <rect x="150" y="50" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp = points[0]   （第 0 行直接取）</text>
  <line x1="270" y1="90" x2="270" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: loop decision -->
  <polygon points="270,110 380,156 270,202 160,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">还有下一行</text>
  <text x="270" y="170" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">r = 1..m−1 ?</text>

  <!-- Yes branch -->
  <line x1="270" y1="202" x2="270" y2="220" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- left pass -->
  <rect x="60" y="222" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="242" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">左趟：leftMax[c]</text>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cur = max(cur, dp[c] + c)</text>
  <text x="160" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c 从 0 → n−1</text>

  <!-- right pass -->
  <rect x="280" y="222" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="242" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">右趟：rightMax[c]</text>
  <text x="380" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cur = max(cur, dp[c] − c)</text>
  <text x="380" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c 从 n−1 → 0</text>

  <line x1="160" y1="272" x2="270" y2="290" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <line x1="380" y1="272" x2="270" y2="290" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- combine -->
  <rect x="80" y="292" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">new_dp[c] = points[r][c]</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">  + max( leftMax[c] − c ,  rightMax[c] + c )</text>

  <line x1="270" y1="336" x2="270" y2="354" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- roll -->
  <rect x="150" y="356" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp = new_dp   （滚动覆盖）</text>

  <!-- loop back -->
  <path d="M 150 373 Q 50 373 50 156 Q 50 156 160 156" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="38" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下个</text>
  <text x="38" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">行 r</text>

  <!-- No branch -->
  <line x1="380" y1="156" x2="448" y2="156" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="412" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="448" y="137" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="491" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="491" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">max(dp)</text>

  <!-- notes -->
  <rect x="60" y="420" width="420" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="442" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">
    ⚠ 关键：把 O(n²) 转移压成 O(n)
  </text>
  <text x="270" y="460" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">
    绝对值分 c'≤c / c'≥c 两段，各跑一趟
  </text>
  <text x="270" y="476" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">
    前缀/后缀 max 让每个 c 的最优源 O(1) 继承
  </text>
  <text x="270" y="494" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    每行 2 趟 + 合并，共 O(n)；总 O(m·n)
  </text>
</svg>
