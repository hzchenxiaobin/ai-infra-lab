<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：8 行 → 分组聚合 → 过滤 → 输出</text>

  <!-- ===== Left: 8 input rows ===== -->
  <text x="30" y="50" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① Views（8 行）</text>
  <!-- header -->
  <rect x="30" y="56" width="210" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold" filter="url(#rough2)">art</text>
  <text x="120" y="69" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold" filter="url(#rough2)">viewer</text>
  <text x="195" y="69" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold" filter="url(#rough2)">date</text>

  <!-- rows: art, viewer, date ; h=15 -->
  <g font-size="9" filter="url(#rough2)">
    <!-- row1 G1 -->
    <rect x="30" y="74" width="210" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2"/>
    <text x="60" y="85" text-anchor="middle" fill="#333">1</text><text x="120" y="85" text-anchor="middle" fill="#333">5</text><text x="195" y="85" text-anchor="middle" fill="#4a7a3a">08-01</text>
    <!-- row2 G1 -->
    <rect x="30" y="89" width="210" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2"/>
    <text x="60" y="100" text-anchor="middle" fill="#333">3</text><text x="120" y="100" text-anchor="middle" fill="#333">5</text><text x="195" y="100" text-anchor="middle" fill="#4a7a3a">08-01</text>
    <!-- row3 G2 -->
    <rect x="30" y="104" width="210" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
    <text x="60" y="115" text-anchor="middle" fill="#333">1</text><text x="120" y="115" text-anchor="middle" fill="#333">6</text><text x="195" y="115" text-anchor="middle" fill="#446688">08-02</text>
    <!-- row4 G3 -->
    <rect x="30" y="119" width="210" height="15" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2"/>
    <text x="60" y="130" text-anchor="middle" fill="#888">2</text><text x="120" y="130" text-anchor="middle" fill="#888">7</text><text x="195" y="130" text-anchor="middle" fill="#888">08-01</text>
    <!-- row5 G2 -->
    <rect x="30" y="134" width="210" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
    <text x="60" y="145" text-anchor="middle" fill="#333">2</text><text x="120" y="145" text-anchor="middle" fill="#333">6</text><text x="195" y="145" text-anchor="middle" fill="#446688">08-02</text>
    <!-- row6 G4 -->
    <rect x="30" y="149" width="210" height="15" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2"/>
    <text x="60" y="160" text-anchor="middle" fill="#888">4</text><text x="120" y="160" text-anchor="middle" fill="#888">1</text><text x="195" y="160" text-anchor="middle" fill="#888">07-22</text>
    <!-- row7 G5 -->
    <rect x="30" y="164" width="210" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2"/>
    <text x="60" y="175" text-anchor="middle" fill="#8a6a20">3</text><text x="120" y="175" text-anchor="middle" fill="#8a6a20">4</text><text x="195" y="175" text-anchor="middle" fill="#8a6a20">07-21</text>
    <!-- row8 G5 dup -->
    <rect x="30" y="179" width="210" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" rx="2"/>
    <text x="60" y="190" text-anchor="middle" fill="#8a6a20">3</text><text x="120" y="190" text-anchor="middle" fill="#8a6a20">4</text><text x="195" y="190" text-anchor="middle" fill="#8a6a20">07-21</text>
  </g>

  <!-- arrow to groups -->
  <path d="M 245 130 L 285 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="124" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">分组</text>

  <!-- ===== Right: 5 groups ===== -->
  <text x="290" y="50" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② GROUP BY (viewer, date) → 5 组</text>

  <!-- G1 viewer5@08-01 {1,3} 2 ✓ -->
  <rect x="290" y="74" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="93" font-size="9" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">viewer 5 @ 08-01</text>
  <text x="430" y="93" font-size="9" fill="#333" filter="url(#rough2)">arts {1,3}</text>
  <text x="510" y="93" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">N=2 ✓</text>

  <!-- G2 viewer6@08-02 {1,2} 2 ✓ -->
  <rect x="290" y="108" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="127" font-size="9" fill="#3a5a3a" font-weight="bold" filter="url(#rough2)">viewer 6 @ 08-02</text>
  <text x="430" y="127" font-size="9" fill="#333" filter="url(#rough2)">arts {1,2}</text>
  <text x="510" y="127" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">N=2 ✓</text>

  <!-- G3 viewer7@08-01 {2} 1 ✗ -->
  <rect x="290" y="142" width="280" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="161" font-size="9" fill="#888" filter="url(#rough2)">viewer 7 @ 08-01</text>
  <text x="430" y="161" font-size="9" fill="#888" filter="url(#rough2)">arts {2}</text>
  <text x="510" y="161" font-size="9" fill="#b85450" filter="url(#rough2)">N=1 ✗</text>

  <!-- G4 viewer1@07-22 {4} 1 ✗ -->
  <rect x="290" y="176" width="280" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="195" font-size="9" fill="#888" filter="url(#rough2)">viewer 1 @ 07-22</text>
  <text x="430" y="195" font-size="9" fill="#888" filter="url(#rough2)">arts {4}</text>
  <text x="510" y="195" font-size="9" fill="#b85450" filter="url(#rough2)">N=1 ✗</text>

  <!-- G5 viewer4@07-21 {3} 1 ✗ -->
  <rect x="290" y="210" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="229" font-size="9" fill="#8a6a20" filter="url(#rough2)">viewer 4 @ 07-21</text>
  <text x="430" y="229" font-size="9" fill="#8a6a20" filter="url(#rough2)">arts {3}</text>
  <text x="510" y="229" font-size="9" fill="#b85450" filter="url(#rough2)">N=1 ✗</text>
  <text x="570" y="229" text-anchor="end" font-size="7" fill="#d6a040" filter="url(#rough2)">2行同文</text>

  <!-- arrow down to HAVING -->
  <path d="M 430 244 L 430 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="256" font-size="9" fill="#4a7a3a" filter="url(#rough2)">HAVING N&gt;1</text>

  <!-- ===== Step 3: result ===== -->
  <text x="30" y="276" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 留 2 组 → SELECT DISTINCT viewer_id AS id → ORDER BY id</text>

  <!-- qualifying ids -->
  <rect x="120" y="288" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="200" y="288" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="307" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <path d="M 280 302 L 320 302" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">升序</text>

  <!-- final output -->
  <rect x="330" y="288" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="307" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="410" y="288" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="307" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="495" y="307" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 输出</text>

  <!-- bottom note -->
  <rect x="30" y="338" width="540" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">💡 关键点</text>
  <text x="50" y="376" font-size="9" fill="#8a6a20" filter="url(#rough2)">• viewer 5 同日(08-01)看文章 1、3 → 2 篇 &gt; 1 ✓；viewer 6 同日(08-02)看文章 1、2 → 2 篇 ✓</text>
  <text x="50" y="392" font-size="9" fill="#8a6a20" filter="url(#rough2)">• viewer 4 有两行(07-21)但都是文章 3 → COUNT(DISTINCT)=1，不入选（COUNT(*) 会误判为 2）</text>
  <text x="50" y="408" font-size="9" fill="#8a6a20" filter="url(#rough2)">• 外层 DISTINCT：若某 viewer 多日都入选，只保留一个 id</text>
</svg>
