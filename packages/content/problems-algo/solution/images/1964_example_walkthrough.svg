<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：obstacles = [3, 1, 5, 6, 4, 2]</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#888">预期输出：ans = [1, 1, 2, 3, 2, 2]</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="40" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="70" y="62" width="50" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="120" y="62" width="150" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="270" y="62" width="180" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="450" y="62" width="180" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="630" y="62" width="100" height="28" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="50" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="95" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="195" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x=obstacles[i]</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">upper_bound 结果</text>
  <text x="540" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tails（变化后）</text>
  <text x="680" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans[i]</text>

  <!-- Row 1: i=0, x=3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="90" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="90" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="90" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="90" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="450" y="90" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="630" y="90" width="100" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
  </g>
  <text x="50" y="108" text-anchor="middle" font-size="11" fill="#444">1</text>
  <text x="95" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="195" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="360" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">pos=0 (==len) → 追加</text>
  <text x="540" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[3]</text>
  <text x="680" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 2: i=1, x=1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="118" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="118" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="118" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="118" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="450" y="118" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="630" y="118" width="100" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
  </g>
  <text x="50" y="136" text-anchor="middle" font-size="11" fill="#444">2</text>
  <text x="95" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="195" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="360" y="136" text-anchor="middle" font-size="10" fill="#c98a2b">pos=0 (&gt;1 是 3) → 替换</text>
  <text x="540" y="136" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">[1]</text>
  <text x="680" y="136" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">1</text>

  <!-- Row 3: i=2, x=5 -->
  <g filter="url(#rough2)">
    <rect x="30" y="146" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="146" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="146" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="146" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="450" y="146" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="630" y="146" width="100" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
  </g>
  <text x="50" y="164" text-anchor="middle" font-size="11" fill="#444">3</text>
  <text x="95" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="195" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="360" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">pos=1 (==len) → 追加</text>
  <text x="540" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 5]</text>
  <text x="680" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 4: i=3, x=6 -->
  <g filter="url(#rough2)">
    <rect x="30" y="174" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="174" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="174" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="174" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="450" y="174" width="180" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
    <rect x="630" y="174" width="100" height="28" fill="#e6f4ea" stroke="#cdddc4"/>
  </g>
  <text x="50" y="192" text-anchor="middle" font-size="11" fill="#444">4</text>
  <text x="95" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="195" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <text x="360" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">pos=2 (==len) → 追加</text>
  <text x="540" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 5, 6]</text>
  <text x="680" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 5: i=4, x=4 -->
  <g filter="url(#rough2)">
    <rect x="30" y="202" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="202" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="202" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="202" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="450" y="202" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="630" y="202" width="100" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
  </g>
  <text x="50" y="220" text-anchor="middle" font-size="11" fill="#444">5</text>
  <text x="95" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="195" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="360" y="220" text-anchor="middle" font-size="10" fill="#c98a2b">pos=1 (&gt;4 是 5) → 替换</text>
  <text x="540" y="220" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">[1, 4, 6]</text>
  <text x="680" y="220" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">2</text>

  <!-- Row 6: i=5, x=2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="230" width="40" height="28" fill="#fffdf3" stroke="#e2dccd"/>
    <rect x="70" y="230" width="50" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="120" y="230" width="150" height="28" fill="#e8f0fa" stroke="#cdd9e6"/>
    <rect x="270" y="230" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="450" y="230" width="180" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
    <rect x="630" y="230" width="100" height="28" fill="#fff8e1" stroke="#e6d4ad"/>
  </g>
  <text x="50" y="248" text-anchor="middle" font-size="11" fill="#444">6</text>
  <text x="95" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="195" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="360" y="248" text-anchor="middle" font-size="10" fill="#c98a2b">pos=1 (&gt;2 是 4) → 替换</text>
  <text x="540" y="248" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">[1, 2, 6]</text>
  <text x="680" y="248" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">2</text>

  <!-- Result box -->
  <rect x="30" y="278" width="700" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：</text>
  <text x="50" y="316" font-size="12" fill="#4a7a3a">ans = [1, 1, 2, 3, 2, 2] ✓  （与示例 3 完全一致）</text>

  <!-- Key observations -->
  <rect x="30" y="338" width="700" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="360" font-size="12" fill="#d6a040" font-weight="bold">关键观察：</text>

  <text x="50" y="382" font-size="11" fill="#c98a2b">① 步骤 2（x=1）：1 &lt; 3，upper_bound 找到第一个 &gt; 1 的元素（3 在 pos=0），用 1 替换 3。</text>
  <text x="50" y="382" font-size="11" fill="#c98a2b"> </text>
  <text x="50" y="400" font-size="11" fill="#c98a2b">    tails 从 [3] → [1]，长度不变但末尾更小，为后续接更长留余地。ans[1] = 0+1 = 1。</text>

  <text x="50" y="422" font-size="11" fill="#4a7a3a">② 步骤 5（x=4）：tails=[1,5,6]，upper_bound 找第一个 &gt; 4（5 在 pos=1），用 4 替换 5。</text>
  <text x="50" y="440" font-size="11" fill="#4a7a3a">    tails → [1,4,6]。ans[4] = pos+1 = 2。注意 6 没被碰——因为 6 &gt; 4 不在 pos=1 位置。</text>

  <text x="50" y="462" font-size="11" fill="#888">③ ans[i] = pos + 1：pos 是「以 x 结尾的非严格 LIS 长度 - 1」，因为 tails[pos] 是该长度的最小末尾。</text>
</svg>
