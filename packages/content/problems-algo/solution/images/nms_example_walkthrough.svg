<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcde", words = ["a","bb","acd","ace"]</text>

  <!-- initial state -->
  <rect x="30" y="42" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="11" fill="#333">初始分桶： bucket['a']={"a",0;"acd",0;"ace",0}   bucket['b']={"bb",0}   其余空</text>

  <!-- Column headers -->
  <text x="56" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">扫描字符</text>
  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">取走的桶</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">推进结果（新分桶）</text>
  <text x="534" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">ans</text>

  <!-- separator -->
  <line x1="30" y1="100" x2="550" y2="100" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: s[0]='a' -->
  <rect x="36" y="110" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="56" y="152" text-anchor="middle" font-size="9" fill="#aaa">s[0]</text>

  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#333">'a' 桶 ×3</text>
  <text x="180" y="144" text-anchor="middle" font-size="10" fill="#888">"a","acd","ace"</text>

  <rect x="290" y="112" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="127" font-size="10" fill="#333">"a" ptr→1 ==len ✓</text>
  <rect x="290" y="138" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="153" font-size="10" fill="#333">"acd"→'c'; "ace"→'c'</text>

  <rect x="514" y="120" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="30" y1="172" x2="550" y2="172" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: s[1]='b' -->
  <rect x="36" y="182" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="56" y="224" text-anchor="middle" font-size="9" fill="#aaa">s[1]</text>

  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#333">'b' 桶 ×1</text>
  <text x="180" y="216" text-anchor="middle" font-size="10" fill="#888">"bb"</text>

  <rect x="290" y="184" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="199" font-size="10" fill="#333">"bb" ptr→1 仍等 'b'</text>
  <text x="298" y="215" font-size="10" fill="#888">放回 bucket['b']</text>

  <rect x="514" y="192" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="30" y1="244" x2="550" y2="244" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 2: s[2]='c' -->
  <rect x="36" y="254" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="56" y="296" text-anchor="middle" font-size="9" fill="#aaa">s[2]</text>

  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#333">'c' 桶 ×2</text>
  <text x="180" y="288" text-anchor="middle" font-size="10" fill="#888">"acd","ace"</text>

  <rect x="290" y="256" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="271" font-size="10" fill="#333">"acd" ptr→2 等 'd'</text>
  <rect x="290" y="280" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="295" font-size="10" fill="#333">"ace" ptr→2 等 'e'</text>

  <rect x="514" y="264" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="30" y1="316" x2="550" y2="316" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 3: s[3]='d' -->
  <rect x="36" y="326" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d</text>
  <text x="56" y="368" text-anchor="middle" font-size="9" fill="#aaa">s[3]</text>

  <text x="180" y="344" text-anchor="middle" font-size="11" fill="#333">'d' 桶 ×1</text>
  <text x="180" y="360" text-anchor="middle" font-size="10" fill="#888">"acd"</text>

  <rect x="290" y="328" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="343" font-size="10" fill="#333">"acd" ptr→3 ==len ✓</text>
  <text x="298" y="359" font-size="10" fill="#888">匹配完成</text>

  <rect x="514" y="336" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="534" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <line x1="30" y1="388" x2="550" y2="388" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 4: s[4]='e' -->
  <rect x="36" y="398" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="418" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">e</text>
  <text x="56" y="440" text-anchor="middle" font-size="9" fill="#aaa">s[4]</text>

  <text x="180" y="416" text-anchor="middle" font-size="11" fill="#333">'e' 桶 ×1</text>
  <text x="180" y="432" text-anchor="middle" font-size="10" fill="#888">"ace"</text>

  <rect x="290" y="400" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="415" font-size="10" fill="#333">"ace" ptr→3 ==len ✓</text>
  <text x="298" y="431" font-size="10" fill="#888">匹配完成</text>

  <rect x="514" y="408" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="534" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Final result -->
  <rect x="30" y="460" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="480" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">扫完 s → ans = 3（"a"、"acd"、"ace" 命中）</text>
  <text x="290" y="496" text-anchor="middle" font-size="10" fill="#888">"bb" 残留在 bucket['b']：s 只有一个 'b'，第二格永远等不到</text>
</svg>
