<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：6 行改价记录 → 过滤 → 排序取最新 → LEFT JOIN 补默认 → 3 行结果</text>

  <!-- ===== Original Products table ===== -->
  <text x="180" y="48" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Products 表（6 行）</text>
  <rect x="60" y="54" width="240" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="67" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">product_id</text>
  <text x="180" y="67" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">new_price</text>
  <text x="260" y="67" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">change_date</text>
  <line x1="140" y1="54" x2="140" y2="72" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="220" y1="54" x2="220" y2="72" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="72" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="180" y="83" text-anchor="middle" font-size="8" fill="#333">20</text>
  <text x="260" y="83" text-anchor="middle" font-size="8" fill="#333">2019-08-14</text>
  <line x1="140" y1="72" x2="140" y2="86" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="72" x2="220" y2="86" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="60" y="86" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="97" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="180" y="97" text-anchor="middle" font-size="8" fill="#333">50</text>
  <text x="260" y="97" text-anchor="middle" font-size="8" fill="#333">2019-08-14</text>
  <line x1="140" y1="86" x2="140" y2="100" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="86" x2="220" y2="100" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="60" y="100" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="111" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="180" y="111" text-anchor="middle" font-size="8" fill="#333">30</text>
  <text x="260" y="111" text-anchor="middle" font-size="8" fill="#333">2019-08-15</text>
  <line x1="140" y1="100" x2="140" y2="114" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="100" x2="220" y2="114" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="60" y="114" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="125" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="180" y="125" text-anchor="middle" font-size="8" fill="#333">35</text>
  <text x="260" y="125" text-anchor="middle" font-size="8" fill="#333">2019-08-16</text>
  <line x1="140" y1="114" x2="140" y2="128" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="114" x2="220" y2="128" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="60" y="128" width="240" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="139" text-anchor="middle" font-size="8" fill="#b85450">2</text>
  <text x="180" y="139" text-anchor="middle" font-size="8" fill="#b85450">65</text>
  <text x="260" y="139" text-anchor="middle" font-size="8" fill="#b85450">2019-08-17</text>
  <line x1="140" y1="128" x2="140" y2="142" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="128" x2="220" y2="142" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="60" y="142" width="240" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="153" text-anchor="middle" font-size="8" fill="#b85450">3</text>
  <text x="180" y="153" text-anchor="middle" font-size="8" fill="#b85450">20</text>
  <text x="260" y="153" text-anchor="middle" font-size="8" fill="#b85450">2019-08-18</text>
  <line x1="140" y1="142" x2="140" y2="156" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="142" x2="220" y2="156" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="300" y="140" font-size="7.5" fill="#b85450" font-weight="bold">✗ 目标日后</text>
  <text x="300" y="154" font-size="7.5" fill="#b85450" font-weight="bold">✗ 目标日后</text>

  <!-- arrow step1 -->
  <path d="M305 108 L345 108" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="325" y="100" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">① 过滤</text>
  <text x="325" y="110" text-anchor="middle" font-size="6.5" fill="#d6a040">≤ 08-16</text>

  <!-- ===== Step 1 result: filtered + ROW_NUMBER ===== -->
  <text x="480" y="48" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">过滤后 + ROW_NUMBER 排序</text>
  <rect x="350" y="54" width="260" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="67" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="450" y="67" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">new_price</text>
  <text x="515" y="67" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">change_date</text>
  <text x="585" y="67" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">rn</text>
  <line x1="420" y1="54" x2="420" y2="72" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="485" y1="54" x2="485" y2="72" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="555" y1="54" x2="555" y2="72" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- P1 rows sorted desc: 08-16(35) rn1, 08-15(30) rn2, 08-14(20) rn3 -->
  <rect x="350" y="72" width="260" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="385" y="83" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">1</text>
  <text x="450" y="83" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">35</text>
  <text x="515" y="83" text-anchor="middle" font-size="8" fill="#333">2019-08-16</text>
  <text x="585" y="83" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <line x1="420" y1="72" x2="420" y2="86" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="485" y1="72" x2="485" y2="86" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="555" y1="72" x2="555" y2="86" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="350" y="86" width="260" height="14" fill="#f5f5f5" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="385" y="97" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="450" y="97" text-anchor="middle" font-size="8" fill="#888">30</text>
  <text x="515" y="97" text-anchor="middle" font-size="8" fill="#888">2019-08-15</text>
  <text x="585" y="97" text-anchor="middle" font-size="8" fill="#888">2</text>
  <line x1="420" y1="86" x2="420" y2="100" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="485" y1="86" x2="485" y2="100" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="555" y1="86" x2="555" y2="100" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="350" y="100" width="260" height="14" fill="#f5f5f5" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="385" y="111" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="450" y="111" text-anchor="middle" font-size="8" fill="#888">20</text>
  <text x="515" y="111" text-anchor="middle" font-size="8" fill="#888">2019-08-14</text>
  <text x="585" y="111" text-anchor="middle" font-size="8" fill="#888">3</text>
  <line x1="420" y1="100" x2="420" y2="114" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="485" y1="100" x2="485" y2="114" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="555" y1="100" x2="555" y2="114" stroke="#bbb" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- P2 row: 08-14(50) rn1 -->
  <rect x="350" y="114" width="260" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="385" y="125" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">2</text>
  <text x="450" y="125" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="515" y="125" text-anchor="middle" font-size="8" fill="#333">2019-08-14</text>
  <text x="585" y="125" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <line x1="420" y1="114" x2="420" y2="128" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="485" y1="114" x2="485" y2="128" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="555" y1="114" x2="555" y2="128" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="480" y="146" text-anchor="middle" font-size="7.5" fill="#888">P2 仅 1 行 ≤ 目标日 → rn=1</text>
  <text x="480" y="158" text-anchor="middle" font-size="7.5" fill="#b85450">P3 无行 ≤ 目标日 → 不在子查询中</text>

  <!-- arrow step2: WHERE rn=1 -->
  <path d="M480 168 L480 192" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="510" y="184" font-size="7.5" fill="#d6a040" font-weight="bold">② WHERE rn=1</text>

  <!-- ===== Step 2 result: latest prices (subquery t) ===== -->
  <rect x="360" y="196" width="240" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="207" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">product_id</text>
  <text x="490" y="207" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">new_price</text>
  <line x1="445" y1="196" x2="445" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="360" y="210" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="400" y="221" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">1</text>
  <text x="490" y="221" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">35</text>
  <line x1="445" y1="210" x2="445" y2="224" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="360" y="224" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="400" y="235" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">2</text>
  <text x="490" y="235" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">50</text>
  <line x1="445" y1="224" x2="445" y2="238" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="480" y="252" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">子查询 t（仅 2 行，P3 缺席）</text>

  <!-- ===== Step 3: all products LEFT JOIN t ===== -->
  <text x="180" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">③ 全部产品 LEFT JOIN 子查询 t</text>

  <!-- all products (left) -->
  <rect x="40" y="288" width="120" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="300" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">全部 product_id</text>
  <rect x="40" y="304" width="120" height="14" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="315" text-anchor="middle" font-size="8" fill="#333">1</text>
  <rect x="40" y="318" width="120" height="14" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="329" text-anchor="middle" font-size="8" fill="#333">2</text>
  <rect x="40" y="332" width="120" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="343" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">3</text>

  <!-- join symbol -->
  <text x="185" y="325" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">LEFT JOIN</text>
  <path d="M170 325 L200 325" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- subquery t (right) -->
  <rect x="210" y="288" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">子查询 t (product,price)</text>
  <rect x="210" y="304" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="270" y="315" text-anchor="middle" font-size="8" fill="#4a7a3a">1 → 35</text>
  <rect x="210" y="318" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="270" y="329" text-anchor="middle" font-size="8" fill="#4a7a3a">2 → 50</text>
  <rect x="210" y="332" width="120" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="343" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">3 → NULL</text>

  <!-- arrow to join result -->
  <path d="M340 325 L380 325" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- join result -->
  <rect x="385" y="288" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="300" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">JOIN 结果 + IFNULL</text>
  <rect x="385" y="304" width="140" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="455" y="315" text-anchor="middle" font-size="8" fill="#333">1 → 35</text>
  <rect x="385" y="318" width="140" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="455" y="329" text-anchor="middle" font-size="8" fill="#333">2 → 50</text>
  <rect x="385" y="332" width="140" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="455" y="343" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">3 → IFNULL(NULL,10)=10</text>

  <!-- ===== Final result ===== -->
  <path d="M455 350 L455 372" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="490" y="365" font-size="7.5" fill="#4a7a3a" font-weight="bold">④ 输出</text>

  <rect x="335" y="378" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="391" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">product_id</text>
  <text x="505" y="391" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">price</text>
  <line x1="455" y1="378" x2="455" y2="396" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="335" y="396" width="240" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="395" y="408" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <text x="505" y="408" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">35</text>
  <line x1="455" y1="396" x2="455" y2="412" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="335" y="412" width="240" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="395" y="424" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="505" y="424" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">50</text>
  <line x1="455" y1="412" x2="455" y2="428" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="335" y="428" width="240" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="395" y="440" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="505" y="440" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">10</text>
  <line x1="455" y1="428" x2="455" y2="444" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="40" y="378" width="270" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="55" y="396" font-size="9" fill="#d6a040" font-weight="bold">演算小结</text>
  <text x="55" y="412" font-size="8.5" fill="#333">• P1 三次改价 ≤ 目标日，取最新 08-16 = <tspan fill="#4a7a3a" font-weight="bold">35</tspan></text>
  <text x="55" y="426" font-size="8.5" fill="#333">• P2 仅 08-14 ≤ 目标日，取 <tspan fill="#4a7a3a" font-weight="bold">50</tspan>（08-17 被过滤）</text>
  <text x="55" y="440" font-size="8.5" fill="#333">• P3 首次改价 08-18 &gt; 目标日 → <tspan fill="#d6a040" font-weight="bold">默认 10</tspan></text>
</svg>
