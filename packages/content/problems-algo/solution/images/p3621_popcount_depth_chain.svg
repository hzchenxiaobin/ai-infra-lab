<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 链条：7 → 3 → 2 → 1 -->
  <rect x="36" y="36" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="59" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="68" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">111</text>

  <rect x="150" y="36" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="59" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="182" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">11</text>

  <rect x="264" y="36" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="59" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="296" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">10</text>

  <rect x="378" y="36" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="59" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="410" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">终点</text>

  <path d="M 102 58 L 144 58" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="49" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">popcount</text>
  <path d="M 216 58 L 258 58" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="49" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">popcount</text>
  <path d="M 330 58 L 372 58" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="49" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">popcount</text>

  <!-- 深度括线 -->
  <path d="M 36 92 L 442 92" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="239" y="111" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">链条走了 3 步 ⟹ depth(7) = 3</text>

  <!-- 洞察框 -->
  <rect x="36" y="124" width="268" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="151" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">第一步后只剩 j = popcount(x)，</text>
  <text x="170" y="173" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">深度完全由 j 决定，与 x 其余位无关</text>

  <rect x="322" y="124" width="162" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ≥ 2 时：</text>
  <text x="403" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">depth(x) = 1 + dep[j]</text>

  <!-- 规模框 -->
  <rect x="36" y="200" width="448" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">n ≤ 10¹⁵ &lt; 2⁵⁰ ⟹ j = popcount(x) ∈ [1, 50]，只有 50 种！</text>

  <!-- 分桶 -->
  <text x="36" y="258" font-size="12.5" fill="#333" filter="url(#rough2)">按 j 分桶（颜色 = 该桶的深度）：</text>

  <rect x="36" y="268" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="51" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="268" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="104" y="268" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="119" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="138" y="268" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="153" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="268" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="187" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="206" y="268" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="240" y="268" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="274" y="268" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="289" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="318" y="288" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">…</text>
  <rect x="344" y="268" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="359" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">49</text>
  <rect x="380" y="268" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">50</text>

  <!-- 图例 -->
  <rect x="36" y="314" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="11" fill="#555" filter="url(#rough2)">深度 1（仅 j=1）</text>
  <rect x="156" y="314" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="326" font-size="11" fill="#555" filter="url(#rough2)">深度 2</text>
  <rect x="236" y="314" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="256" y="326" font-size="11" fill="#555" filter="url(#rough2)">深度 3</text>
  <rect x="316" y="314" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="336" y="326" font-size="11" fill="#555" filter="url(#rough2)">深度 4（n ≤ 10¹⁵ 的最深）</text>

  <!-- 底注 -->
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">每个桶的元素个数 =「≤ n 且二进制恰含 j 个 1」→ 组合计数一步求出</text>
</svg>
