<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：值域三分——只有 s1、只有 s2、两边都有</text>

  <!-- Venn: two overlapping circles -->
  <circle cx="205" cy="160" r="92" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="335" cy="160" r="92" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="145" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">only₁</text>
  <text x="145" y="130" text-anchor="middle" font-size="10" fill="#666">只有 nums1 有</text>
  <text x="145" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a 个</text>

  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">common</text>
  <text x="270" y="168" text-anchor="middle" font-size="10" fill="#666">两边都有</text>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c 个</text>

  <text x="395" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">only₂</text>
  <text x="395" y="130" text-anchor="middle" font-size="10" fill="#666">只有 nums2 有</text>
  <text x="395" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b 个</text>

  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s₁ = set(nums1)</text>
  <text x="390" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">s₂ = set(nums2)</text>

  <!-- capacity note -->
  <rect x="40" y="270" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每个数组各保留 n/2 个名额（重复值只留一份拷贝即可）</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#666">独占值只能靠「本数组」的名额进入 s —— 别处的名额救不了它</text>

  <!-- formula box -->
  <rect x="40" y="338" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = k₁ + k₂ + min(c, 剩余名额₁ + 剩余名额₂)</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888">k₁ = min(a, n/2)，k₂ = min(b, n/2)：独占优先，公共值用剩余名额补</text>
</svg>
