<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：频次统计 + 逐键比较</text>

  <!-- Step 1: 遍历 target 统计频次 -->
  <rect x="130" y="50" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">遍历 target，统计每个值出现次数</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#666">freqT[v] += 1</text>

  <path d="M 280 110 L 280 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 遍历 arr 扣减频次 -->
  <rect x="130" y="138" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">遍历 arr，对 freqT 扣减</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#666">freqT[v] -= 1</text>

  <path d="M 280 198 L 280 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 所有频次归零? -->
  <polygon points="280,224 410,274 280,324 150,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">所有 freqT[v]</text>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">均 == 0 ?</text>

  <!-- Yes branch -->
  <path d="M 150 274 L 90 274 L 90 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="366" width="100" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="384" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="90" y="402" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- No branch -->
  <path d="M 410 274 L 470 274 L 470 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="366" width="100" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="384" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回</text>
  <text x="470" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">false</text>

  <!-- Bottom note -->
  <rect x="40" y="424" width="480" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#444">一趟遍历 target + 一趟遍历 arr，O(n) 时间 / O(V) 空间（V 为值域）</text>
</svg>
