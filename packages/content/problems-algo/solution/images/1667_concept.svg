<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">修复名字：拆分首字符 → 大小写转换 → 拼接</text>

  <!-- Column headers -->
  <text x="142" y="50" text-anchor="middle" font-size="10" fill="#888">原始 name</text>
  <text x="260" y="50" text-anchor="middle" font-size="10" fill="#888">SUBSTRING 拆分</text>
  <text x="405" y="50" text-anchor="middle" font-size="10" fill="#888">UPPER / LOWER</text>
  <text x="525" y="50" text-anchor="middle" font-size="10" fill="#888">CONCAT 拼接</text>

  <!-- ===== Row 1: aLice → Alice ===== -->
  <!-- Input -->
  <rect x="110" y="60" width="65" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="142" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">aLice</text>

  <!-- Arrow split -->
  <path d="M177 78 L198 78" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- First char -->
  <rect x="200" y="60" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- Plus -->
  <text x="247" y="83" text-anchor="middle" font-size="14" fill="#888">+</text>

  <!-- Rest -->
  <rect x="255" y="60" width="65" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Lice</text>

  <!-- Arrow transform -->
  <path d="M322 78 L343 78" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Upper result -->
  <rect x="345" y="60" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>

  <!-- Plus -->
  <text x="392" y="83" text-anchor="middle" font-size="14" fill="#888">+</text>

  <!-- Lower result -->
  <rect x="400" y="60" width="65" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="432" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">lice</text>

  <!-- Arrow concat -->
  <path d="M467 78 L488 78" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="490" y="60" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="83" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Alice</text>

  <!-- Function annotations for row 1 -->
  <text x="220" y="112" text-anchor="middle" font-size="8.5" fill="#4a7a3a">SUBSTRING(name,1,1)</text>
  <text x="287" y="112" text-anchor="middle" font-size="8.5" fill="#d6a040">SUBSTRING(name,2)</text>
  <text x="365" y="112" text-anchor="middle" font-size="8.5" fill="#446688">UPPER(a)</text>
  <text x="432" y="112" text-anchor="middle" font-size="8.5" fill="#446688">LOWER(Lice)</text>

  <!-- ===== Row 2: bOB → Bob ===== -->
  <!-- Input -->
  <rect x="110" y="126" width="65" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="142" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bOB</text>

  <!-- Arrow split -->
  <path d="M177 144 L198 144" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- First char -->
  <rect x="200" y="126" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- Plus -->
  <text x="247" y="149" text-anchor="middle" font-size="14" fill="#888">+</text>

  <!-- Rest -->
  <rect x="255" y="126" width="65" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">OB</text>

  <!-- Arrow transform -->
  <path d="M322 144 L343 144" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Upper result -->
  <rect x="345" y="126" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>

  <!-- Plus -->
  <text x="392" y="149" text-anchor="middle" font-size="14" fill="#888">+</text>

  <!-- Lower result -->
  <rect x="400" y="126" width="65" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="432" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ob</text>

  <!-- Arrow concat -->
  <path d="M467 144 L488 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="490" y="126" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Bob</text>

  <!-- ===== Key points ===== -->
  <rect x="30" y="184" width="600" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键要点</text>
  <text x="50" y="232" font-size="10.5" fill="#333">① 拆分：SUBSTRING(name, 1, 1) 取首字符，SUBSTRING(name, 2) 取剩余部分</text>
  <text x="50" y="252" font-size="10.5" fill="#333">② 转换：UPPER() 把首字符转大写，LOWER() 把剩余部分转小写</text>
  <text x="50" y="272" font-size="10.5" fill="#333">③ 拼接：CONCAT(upper_first, lower_rest) 合并两部分，得到首字母大写 + 其余小写</text>
  <text x="50" y="292" font-size="10.5" fill="#333">④ 纯 SQL 字符串函数组合，无需正则或应用层处理</text>

  <!-- Common mistake -->
  <rect x="30" y="316" width="600" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="10.5" fill="#b85450">⚠ 常见错误：直接用 LOWER(name) → 全小写 "alice"；或 UPPER(name) → 全大写 "ALICE"；均不符合「首字母大写」要求</text>
</svg>
