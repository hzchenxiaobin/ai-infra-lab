<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">含重复值：nums[left]==nums[mid] 时无法判断哪半有序</text>

  <!-- ====== Top: 33 题（无重复，可判断） ====== -->
  <rect x="20" y="40" width="520" height="130" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="40" width="520" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">33 题（值互异）：nums[left] vs nums[mid] 必能定胜负</text>

  <text x="32" y="80" font-size="10.5" fill="#888">nums：</text>
  <rect x="80" y="66" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="124" y="66" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="84" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="168" y="66" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="212" y="66" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="256" y="66" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="84" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="300" y="66" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="344" y="66" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="84" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="100" y="108" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">left</text>
  <text x="232" y="108" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid</text>
  <text x="364" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">right</text>

  <rect x="44" y="116" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[left]=4 &lt; nums[mid]=7 → 左半有序 ✓</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#888">三者互异 → 比较结果唯一确定有序半段</text>

  <!-- ====== Bottom: 81 题（有重复，歧义） ====== -->
  <rect x="20" y="186" width="520" height="170" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="186" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">81 题（含重复）：nums[left]==nums[mid]==nums[right] → 歧义！</text>

  <text x="32" y="226" font-size="10.5" fill="#888">nums：</text>
  <rect x="80" y="212" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="212" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="176" y="212" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="224" y="212" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="212" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="102" y="254" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">left=0</text>
  <text x="198" y="254" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="294" y="254" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">right=4</text>

  <rect x="44" y="262" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[left]=1 == nums[mid]=1 == nums[right]=1</text>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#888">无法判断旋转点在左半还是右半 → 哪半有序未知 ✗</text>

  <rect x="44" y="312" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">对策：left++ 收缩边界，跳过重复值再二分</text>

  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">最坏全相同值时退化为 O(n)，但平均仍接近 O(log n)</text>
</svg>
