<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,3,2,2,2,3,4,3,1] → 23 分</text>

  <!-- ===== Step 1: original, remove 2 2 2 ===== -->
  <text x="30" y="52" font-size="11" fill="#888">① 消 [2,2,2]</text>
  <!-- boxes row -->
  <rect x="100" y="40" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="40" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="144" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="38" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="38" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="38" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="234" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="250" y="40" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="264" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="40" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="294" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="310" y="40" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="324" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="40" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="354" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="392" y="56" font-size="11" fill="#b85450" font-weight="bold">+9 (3²)</text>
  <path d="M 204 70 L 204 88" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: [1,3,3,4,3,1] remove 4 first to merge 3s ===== -->
  <text x="30" y="108" font-size="11" fill="#888">② 消 [4] 让三个 3 贴一起</text>
  <rect x="100" y="96" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="94" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="144" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="94" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="190" y="96" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="204" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="220" y="94" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="234" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="96" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="264" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="300" y="112" font-size="10" fill="#888">消 4 得 +1</text>
  <path d="M 204 126 L 204 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: [1,3,3,3,1] remove 3 3 3 ===== -->
  <text x="30" y="164" font-size="11" fill="#888">③ 消 [3,3,3]</text>
  <rect x="100" y="152" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="150" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="144" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="150" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="190" y="150" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="152" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="234" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="270" y="168" font-size="11" fill="#d6a040" font-weight="bold">+9 (3²)</text>
  <path d="M 174 182 L 174 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: [1,1] remove 1 1 ===== -->
  <text x="30" y="220" font-size="11" fill="#888">④ 消 [1,1]</text>
  <rect x="100" y="208" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="208" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="144" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="180" y="224" font-size="11" fill="#446688" font-weight="bold">+4 (2²)</text>
  <path d="M 122 238 L 122 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: [] done ===== -->
  <text x="30" y="276" font-size="11" fill="#888">⑤ 完成</text>
  <rect x="100" y="264" width="60" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#777">空</text>

  <!-- ===== Score tally ===== -->
  <rect x="300" y="300" width="250" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">积分累计</text>
  <text x="320" y="344" font-size="11" fill="#555">① 消 3 个 2：  3² = 9</text>
  <text x="320" y="362" font-size="11" fill="#555">② 消 1 个 4：  1² = 1</text>
  <text x="320" y="380" font-size="11" fill="#555">③ 消 3 个 3：  3² = 9</text>
  <text x="320" y="398" font-size="11" fill="#555">④ 消 2 个 1：  2² = 4</text>
  <line x1="320" y1="408" x2="530" y2="408" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="428" font-size="13" fill="#b85450" font-weight="bold">合计 = 23</text>

  <!-- ===== side note: where k matters ===== -->
  <rect x="30" y="300" width="250" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：k 维的作用</text>
  <text x="45" y="344" font-size="10" fill="#444">步骤 ② 消掉中间的 4 后，</text>
  <text x="45" y="360" font-size="10" fill="#444">左右两个 3 "贴"到第三个 3 上——</text>
  <text x="45" y="376" font-size="10" fill="#444">这正是 dp 里"消中间 i+1..m-1，</text>
  <text x="45" y="392" font-size="10" fill="#444">让 boxes[i] 贴到 boxes[m]，</text>
  <text x="45" y="408" font-size="10" fill="#444">挂载数 k → k+1" 的具象化。</text>
  <text x="45" y="428" font-size="10" fill="#4a7a3a" font-weight="bold">没有 k 维就无法表达这种合并！</text>
</svg>
