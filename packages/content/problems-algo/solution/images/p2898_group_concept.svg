<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：线性条件 ⇔ p[i] − i 同组</text>

  <!-- equation transformation -->
  <rect x="30" y="44" width="252" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="63" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">相邻选中下标 a &lt; b</text>
  <text x="156" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p[b] − p[a] = b − a</text>

  <path d="M 286 68 L 334 68" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">移项</text>

  <rect x="338" y="44" width="232" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="63" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两边同减下标</text>
  <text x="454" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p[b] − b = p[a] − a</text>

  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">链式传递 ⇒ 选中的所有元素满足 p[i] − i = 同一常数 c</text>

  <!-- prices array -->
  <text x="24" y="156" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">prices</text>
  <text x="105" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="165" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="225" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="285" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="345" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=5</text>

  <rect x="78" y="134" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="134" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="198" y="134" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="258" y="134" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="318" y="134" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <text x="105" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">p−i=0</text>
  <text x="165" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p−i=3</text>
  <text x="225" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">p−i=0</text>
  <text x="285" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p−i=3</text>
  <text x="345" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p−i=3</text>

  <!-- arrows to buckets -->
  <path d="M 105 190 L 148 246" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 225 190 L 202 246" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 165 190 L 376 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 285 190 L 438 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 345 190 L 480 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- bucket c=0 -->
  <rect x="56" y="250" width="210" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="270" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">组 c = 0</text>
  <text x="252" y="270" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">和 = 4</text>
  <rect x="84" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- bucket c=3 -->
  <rect x="296" y="250" width="250" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="270" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组 c = 3</text>
  <text x="534" y="270" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">和 = 20</text>
  <rect x="324" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="376" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="428" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- arrows to answer -->
  <path d="M 161 316 L 230 340" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 421 316 L 370 340" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="120" y="344" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="363" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max(4, 20) = 20</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">价格为正 ⇒ 组内全选；不同组不能混选</text>
</svg>
