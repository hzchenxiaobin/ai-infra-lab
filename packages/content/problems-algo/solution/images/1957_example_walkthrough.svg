<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：末两位判定逐字符去留</text>

  <!-- ===== Example 1: leeetcode ===== -->
  <text x="50" y="58" font-size="12" fill="#555" font-weight="bold">示例 1：s = "leeetcode" → "leetcode"（删 1 个）</text>

  <!-- 9 char cells, width 36, start x=70 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="90">l</text>
    <rect x="106" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="90">e</text>
    <rect x="142" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="90">e</text>
    <!-- skipped 3rd e -->
    <rect x="178" y="70" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="196" y="90" fill="#b85450">e</text>
    <rect x="214" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="232" y="90">t</text>
    <rect x="250" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="268" y="90">c</text>
    <rect x="286" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="304" y="90">o</text>
    <rect x="322" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="90">d</text>
    <rect x="358" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="376" y="90">e</text>
  </g>
  <!-- strikethrough on skipped -->
  <path d="M 180 76 L 212 94" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- status labels -->
  <g font-size="9.5" text-anchor="middle">
    <text x="88" y="116" fill="#4a7a3a">留</text>
    <text x="124" y="116" fill="#4a7a3a">留</text>
    <text x="160" y="116" fill="#4a7a3a">留</text>
    <text x="196" y="116" fill="#b85450" font-weight="bold">删</text>
    <text x="232" y="116" fill="#4a7a3a">留</text>
    <text x="268" y="116" fill="#4a7a3a">留</text>
    <text x="304" y="116" fill="#4a7a3a">留</text>
    <text x="340" y="116" fill="#4a7a3a">留</text>
    <text x="376" y="116" fill="#4a7a3a">留</text>
  </g>

  <!-- explanation for the skip -->
  <rect x="70" y="130" width="430" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="285" y="148" text-anchor="middle" font-size="10.5" fill="#555">第 3 个 e：结果末两位 "ee" 都 == e → 删；后续 t 起新段，末两位不再 == e → 留</text>

  <!-- result box -->
  <rect x="70" y="168" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="188" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果 = "leetcode"</text>

  <!-- Divider -->
  <path d="M 40 222 L 520 222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: aabaaaa ===== -->
  <text x="50" y="250" font-size="12" fill="#555" font-weight="bold">示例 2：s = "aabaaaa" → "aabaa"（删 2 个）</text>

  <!-- 7 char cells, width 36, start x=110 (centered) -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="110" y="262" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="128" y="282">a</text>
    <rect x="146" y="262" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="282">a</text>
    <rect x="182" y="262" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="200" y="282">b</text>
    <rect x="218" y="262" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="282">a</text>
    <rect x="254" y="262" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="272" y="282">a</text>
    <!-- skipped 6th a -->
    <rect x="290" y="262" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="308" y="282" fill="#b85450">a</text>
    <!-- skipped 7th a -->
    <rect x="326" y="262" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="344" y="282" fill="#b85450">a</text>
  </g>
  <!-- strikethrough on skipped -->
  <path d="M 292 268 L 324 286" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 328 268 L 360 286" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- status labels -->
  <g font-size="9.5" text-anchor="middle">
    <text x="128" y="308" fill="#4a7a3a">留</text>
    <text x="164" y="308" fill="#4a7a3a">留</text>
    <text x="200" y="308" fill="#4a7a3a">留</text>
    <text x="236" y="308" fill="#4a7a3a">留</text>
    <text x="272" y="308" fill="#4a7a3a">留</text>
    <text x="308" y="308" fill="#b85450" font-weight="bold">删</text>
    <text x="344" y="308" fill="#b85450" font-weight="bold">删</text>
  </g>

  <!-- explanation -->
  <rect x="70" y="322" width="430" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="285" y="340" text-anchor="middle" font-size="10.5" fill="#555">第 3、4 个 a：结果末两位 "aa" 都 == a → 各删一次；b 段后另起，留满 2 个 a 再裁</text>

  <!-- result box -->
  <rect x="110" y="360" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="380" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果 = "aabaa"</text>

  <!-- summary -->
  <rect x="50" y="412" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">规律：每段连续相同字符保留前 2 个，其后全部删除</text>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#555">删除数 = Σ max(0, Lᵢ − 2)；同段字符相同 → 保留哪几个不影响结果串 → 答案唯一</text>
</svg>
