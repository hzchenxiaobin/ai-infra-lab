<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nextVisit = [0, 0, 2]，答案 = 6</text>

  <!-- Section 1: day-by-day sequence -->
  <text x="40" y="50" font-size="12" fill="#555" font-weight="bold">逐日访问序列</text>

  <!-- Day labels -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="80" y="72">第0天</text>
    <text x="140" y="72">第1天</text>
    <text x="200" y="72">第2天</text>
    <text x="260" y="72">第3天</text>
    <text x="320" y="72">第4天</text>
    <text x="380" y="72">第5天</text>
    <text x="440" y="72">第6天</text>
  </g>

  <!-- Room cells row -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="56" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="103">0</text>
    <rect x="116" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="103">0</text>
    <rect x="176" y="80" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="200" y="103">1</text>
    <rect x="236" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="103">0</text>
    <rect x="296" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="320" y="103">0</text>
    <rect x="356" y="80" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="380" y="103">1</text>
    <rect x="416" y="78" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="442" y="103" font-weight="bold">2</text>
  </g>

  <!-- parity annotations -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="126">奇→回0</text>
    <text x="140" y="126">偶→进1</text>
    <text x="200" y="126">奇→回0</text>
    <text x="260" y="126">奇→回0</text>
    <text x="320" y="126">偶→进1</text>
    <text x="380" y="126">偶→进2</text>
    <text x="442" y="126" fill="#b85450" font-weight="bold">全部到访!</text>
  </g>

  <!-- Divider -->
  <path d="M 40 144 L 520 144" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Section 2: dp computation -->
  <text x="40" y="164" font-size="12" fill="#555" font-weight="bold">DP 计算（prefix[i] = Σ dp[0..i−1]）</text>

  <!-- dp[0] -->
  <rect x="40" y="178" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="196" font-size="11" fill="#333" font-weight="bold">i=0:</text>
  <text x="100" y="196" font-size="11" fill="#555">j = nextVisit[0] = 0</text>
  <text x="270" y="196" font-size="11" fill="#333">dp[0] = 2 + prefix[0] − prefix[0] = 2 + 0 − 0 = </text>
  <text x="500" y="196" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="100" y="212" font-size="10.5" fill="#888">prefix[1] = 0 + 2 = 2</text>

  <!-- dp[1] -->
  <rect x="40" y="230" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="248" font-size="11" fill="#333" font-weight="bold">i=1:</text>
  <text x="100" y="248" font-size="11" fill="#555">j = nextVisit[1] = 0</text>
  <text x="270" y="248" font-size="11" fill="#333">dp[1] = 2 + prefix[1] − prefix[0] = 2 + 2 − 0 = </text>
  <text x="500" y="248" font-size="11.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="100" y="264" font-size="10.5" fill="#888">prefix[2] = 2 + 4 = 6</text>
  <text x="100" y="280" font-size="10" fill="#4a7a3a">含义：首访1(第2天)→回0→重走dp[0]=2天→再访1→进2，共4天</text>

  <!-- Answer -->
  <rect x="40" y="300" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = prefix[n−1] = prefix[2] = 6</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#888">首访房间 2 的那天 = 第 0 + dp[0] + dp[1] = 0 + 2 + 4 = 6 天</text>

  <!-- Divider -->
  <path d="M 40 352 L 520 352" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- dp[1] visual breakdown -->
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">dp[1] = 4 的构成可视化</text>

  <!-- timeline for dp[1]: day2 to day6 -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="90" y="396">第2天</text>
    <text x="190" y="396">第3天</text>
    <text x="290" y="396">第4天</text>
    <text x="390" y="396">第5天</text>
    <text x="480" y="396">第6天</text>
  </g>

  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="60" y="404" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="424">访1</text>
    <rect x="160" y="404" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="424">访0</text>
    <rect x="260" y="404" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="424">访0</text>
    <rect x="360" y="404" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="424">访1</text>
    <rect x="450" y="404" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="480" y="424">访2</text>
  </g>

  <!-- bracket for dp[0] part -->
  <path d="M 160 444 Q 175 452 190 444" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 444 Q 225 452 260 444" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="225" y="462" text-anchor="middle" font-size="10" fill="#446688">折返 = dp[0] = 2 天</text>

  <!-- 1 day labels -->
  <text x="90" y="462" text-anchor="middle" font-size="10" fill="#d6a040">+1</text>
  <text x="390" y="462" text-anchor="middle" font-size="10" fill="#d6a040">+1</text>
</svg>
