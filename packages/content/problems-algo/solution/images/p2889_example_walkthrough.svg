  <rect x="30" y="222" width="76" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="106" y="222" width="56" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="162" y="222" width="52" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="236" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">ElPaso</text>
