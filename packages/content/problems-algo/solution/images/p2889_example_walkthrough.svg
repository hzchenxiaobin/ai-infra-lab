  <text x="68" y="96" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">city</text>
  <rect x="106" y="82" width="56" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="96" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">month</text>
  <rect x="162" y="82" width="52" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="96" text-anchor="middle" font-size="7.5" fill="#ffffff" filter="url(#rough2)">temperature</text>

