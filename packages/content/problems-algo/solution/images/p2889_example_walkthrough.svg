  <!-- trace arrows -->
  <path d="M 220 114 C 320 185 460 185 538 122" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <path d="M 220 272 C 360 330 520 260 580 186" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

