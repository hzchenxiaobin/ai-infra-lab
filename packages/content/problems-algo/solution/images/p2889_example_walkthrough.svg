  <rect x="162" y="162" width="52" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="176" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">Jacksonville</text>
  <text x="134" y="176" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">April</text>
