  <text x="330" y="360" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① (city=Jacksonville, month=January) 那行 → temperature=13 → 格 [January × Jacksonville]</text>
  <text x="330" y="380" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② (city=ElPaso, month=April) 那行 → temperature=2 → 格 [April × ElPaso]</text>
  <text x="330" y="400" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5 月 × 2 城 = 10 格，恰好每格一行观测；组合缺失的格子会是 NaN</text>
