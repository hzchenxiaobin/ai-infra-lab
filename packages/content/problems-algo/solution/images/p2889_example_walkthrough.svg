  <rect x="30" y="282" width="76" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="106" y="282" width="56" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="162" y="282" width="52" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="296" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">ElPaso</text>
  <text x="134" y="296" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">May</text>
  <text x="188" y="296" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">43</text>

  <!-- Middle: dedup bags -->
  <path d="M 222 130 L 244 122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="70" width="160" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="328" y="88" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">month 去重 → 5 个行标签</text>
  <text x="328" y="110" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">January · February · March</text>
  <text x="328" y="128" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">April · May</text>
  <text x="328" y="148" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">顺序 = 首次出现序</text>

  <path d="M 222 240 L 244 228" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="182" width="160" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="328" y="200" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">city 去重 → 2 个列标签</text>
  <text x="328" y="222" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Jacksonville · ElPaso</text>
  <text x="328" y="242" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">列序 = 首次出现序</text>

  <path d="M 410 130 L 440 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 220 C 424 190 434 130 442 98" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: output wide table -->
  <rect x="444" y="56" width="192" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="74" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">输出：宽表 5 行 × 2 列</text>

  <rect x="450" y="82" width="60" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="96" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">month</text>
