<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：matrix = [[3,7,8],[9,11,13],[15,16,17]]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">附加 minRow 列(绿)与 maxCol 行(橙)，行最小候选再验列最大</text>

  <!-- augmented matrix -->
  <!-- col labels -->
  <g font-size="10" fill="#888">
    <text x="88" y="78" text-anchor="middle">col0</text>
    <text x="144" y="78" text-anchor="middle">col1</text>
    <text x="200" y="78" text-anchor="middle">col2</text>
    <text x="272" y="78" text-anchor="middle">minRow</text>
  </g>

  <!-- row0 -->
  <g font-size="15">
    <rect x="60" y="88" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="88" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="116" y="88" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="144" y="115" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <rect x="172" y="88" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="200" y="115" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="244" y="88" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="272" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
  </g>
  <!-- row1 -->
  <g font-size="15">
    <rect x="60" y="130" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="88" y="157" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="116" y="130" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="144" y="157" text-anchor="middle" fill="#446688" font-weight="bold">11</text>
    <rect x="172" y="130" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="200" y="157" text-anchor="middle" fill="#446688" font-weight="bold">13</text>
    <rect x="244" y="130" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="272" y="157" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
  </g>
  <!-- row2: 15 lucky -->
  <g font-size="15">
    <rect x="60" y="172" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="88" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">15</text>
    <text x="88" y="174" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">★</text>
    <rect x="116" y="172" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="144" y="199" text-anchor="middle" fill="#d6a040" font-weight="bold">16</text>
    <rect x="172" y="172" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="200" y="199" text-anchor="middle" fill="#d6a040" font-weight="bold">17</text>
    <rect x="244" y="172" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="272" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
  </g>
  <!-- maxCol row -->
  <g font-size="15">
    <rect x="60" y="214" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="88" y="241" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <rect x="116" y="214" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="144" y="241" text-anchor="middle" fill="#d6a040" font-weight="bold">16</text>
    <rect x="172" y="214" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="200" y="241" text-anchor="middle" fill="#d6a040" font-weight="bold">17</text>
    <text x="272" y="241" text-anchor="middle" font-size="11" fill="#888">maxCol</text>
  </g>

  <!-- arrow to check table -->
  <path d="M 320 160 L 350 160" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="335" y="152" text-anchor="middle" font-size="10" fill="#666">验</text>

  <!-- check table: row-min candidates -->
  <text x="470" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">行最小候选 → 再验列最大</text>
  <!-- header -->
  <rect x="360" y="88" width="230" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="104" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">候选</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">值</text>
  <text x="500" y="104" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">==maxCol?</text>
  <text x="568" y="104" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">幸运?</text>
  <!-- row (0,0) -->
  <rect x="360" y="112" width="230" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">(0,0)</text>
  <text x="430" y="131" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="500" y="131" text-anchor="middle" font-size="11" fill="#b85450">3==15 ✗</text>
  <text x="568" y="131" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <!-- row (1,0) -->
  <rect x="360" y="140" width="230" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a">(1,0)</text>
  <text x="430" y="159" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="500" y="159" text-anchor="middle" font-size="11" fill="#b85450">9==15 ✗</text>
  <text x="568" y="159" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <!-- row (2,0) lucky -->
  <rect x="360" y="168" width="230" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(2,0)</text>
  <text x="430" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15</text>
  <text x="500" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15==15 ✓</text>
  <text x="568" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- result -->
  <rect x="360" y="210" width="230" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = [15]</text>
  <text x="475" y="242" text-anchor="middle" font-size="10" fill="#888">互异 ⇒ 至多一个，已找到即全部</text>

  <!-- saddle check -->
  <rect x="60" y="284" width="530" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">鞍点定理快速验证（进阶）</text>
  <text x="325" y="328" text-anchor="middle" font-size="11" fill="#666">max(行最小) = max(3, 9, 15) = 15</text>
  <text x="325" y="348" text-anchor="middle" font-size="11" fill="#666">min(列最大) = min(15, 16, 17) = 15</text>
  <text x="325" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15 == 15 ⇒ 幸运数存在且唯一 = 15</text>
  <text x="325" y="388" text-anchor="middle" font-size="10" fill="#888">无需逐格判定，一次比较即得答案</text>
</svg>
