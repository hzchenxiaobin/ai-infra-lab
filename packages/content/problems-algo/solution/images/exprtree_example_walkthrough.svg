<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：s = "2*3−4*5"</text>

  <!-- Expression -->
  <rect x="170" y="38" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2 * 3 − 4 * 5</text>

  <!-- Table header -->
  <rect x="20" y="78" width="520" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="94" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="70" y="94" font-size="10.5" fill="#888" font-weight="bold">字符</text>
  <text x="120" y="94" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="280" y="94" font-size="10.5" fill="#888" font-weight="bold">opStack</text>
  <text x="430" y="94" font-size="10.5" fill="#888" font-weight="bold">nodeStack</text>

  <!-- Row 1: 2 -->
  <rect x="20" y="104" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="117" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="121" text-anchor="middle" font-size="9" fill="#fff">1</text>
  <rect x="62" y="108" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="121" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="121" font-size="10.5" fill="#555">叶子节点</text>
  <text x="280" y="121" font-size="11" fill="#888">[ ]</text>
  <text x="430" y="121" font-size="11" fill="#446688" font-weight="bold">[ 2 ]</text>

  <!-- Row 2: * -->
  <rect x="20" y="130" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="143" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="147" text-anchor="middle" font-size="9" fill="#fff">2</text>
  <rect x="62" y="134" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="147" text-anchor="middle" font-size="11" fill="#333">*</text>
  <text x="120" y="147" font-size="10.5" fill="#555">压入运算符栈</text>
  <text x="280" y="147" font-size="11" fill="#b85450" font-weight="bold">[ * ]</text>
  <text x="430" y="147" font-size="11" fill="#446688">[ 2 ]</text>

  <!-- Row 3: 3 -->
  <rect x="20" y="156" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="169" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="173" text-anchor="middle" font-size="9" fill="#fff">3</text>
  <rect x="62" y="160" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="173" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="173" font-size="10.5" fill="#555">叶子节点</text>
  <text x="280" y="173" font-size="11" fill="#b85450">[ * ]</text>
  <text x="430" y="173" font-size="11" fill="#446688" font-weight="bold">[ 2, 3 ]</text>

  <!-- Row 4: - (HIGHLIGHTED) -->
  <rect x="20" y="182" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="195" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="33" y="199" text-anchor="middle" font-size="9" fill="#fff">4</text>
  <rect x="62" y="186" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="199" text-anchor="middle" font-size="11" fill="#333">−</text>
  <text x="120" y="199" font-size="10.5" fill="#d6a040" font-weight="bold">弹 * 建树 (* 2 3)，压 −</text>
  <text x="280" y="199" font-size="11" fill="#b85450" font-weight="bold">[ − ]</text>
  <text x="430" y="199" font-size="11" fill="#4a7a3a" font-weight="bold">[ (* 2 3) ]</text>

  <!-- Row 5: 4 -->
  <rect x="20" y="208" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="221" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="225" text-anchor="middle" font-size="9" fill="#fff">5</text>
  <rect x="62" y="212" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="225" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="225" font-size="10.5" fill="#555">叶子节点</text>
  <text x="280" y="225" font-size="11" fill="#b85450">[ − ]</text>
  <text x="430" y="225" font-size="11" fill="#446688">[ (* 2 3), 4 ]</text>

  <!-- Row 6: * -->
  <rect x="20" y="234" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="247" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="251" text-anchor="middle" font-size="9" fill="#fff">6</text>
  <rect x="62" y="238" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="251" text-anchor="middle" font-size="11" fill="#333">*</text>
  <text x="120" y="251" font-size="10.5" fill="#555">prec(−)&lt;prec(*) → 直接压栈</text>
  <text x="280" y="251" font-size="11" fill="#b85450" font-weight="bold">[ −, * ]</text>
  <text x="430" y="251" font-size="11" fill="#446688">[ (* 2 3), 4 ]</text>

  <!-- Row 7: 5 -->
  <rect x="20" y="260" width="520" height="26" fill="white" stroke="#eee" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="273" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="33" y="277" text-anchor="middle" font-size="9" fill="#fff">7</text>
  <rect x="62" y="266" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="277" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="120" y="277" font-size="10.5" fill="#555">叶子节点</text>
  <text x="280" y="277" font-size="11" fill="#b85450">[ −, * ]</text>
  <text x="430" y="277" font-size="11" fill="#446688" font-weight="bold">[ (* 2 3), 4, 5 ]</text>

  <!-- Row 8: End (HIGHLIGHTED) -->
  <rect x="20" y="286" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <circle cx="33" cy="299" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="33" y="303" text-anchor="middle" font-size="9" fill="#fff">8</text>
  <text x="67" y="303" font-size="10.5" fill="#888" font-weight="bold">结束</text>
  <text x="120" y="303" font-size="10.5" fill="#d6a040" font-weight="bold">弹 * 建树, 弹 − 建树</text>
  <text x="280" y="303" font-size="11" fill="#888">[ ]</text>
  <text x="430" y="303" font-size="10.5" fill="#4a7a3a" font-weight="bold">[ (− (* 2 3) (* 4 5)) ]</text>

  <!-- Divider -->
  <path d="M 40 326 L 520 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final tree -->
  <text x="280" y="348" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">最终表达式树</text>

  <!-- Root: - -->
  <circle cx="280" cy="378" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">−</text>

  <!-- Left: * -->
  <circle cx="210" cy="424" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="210" y="429" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">*</text>

  <!-- Right: * -->
  <circle cx="350" cy="424" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="429" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">*</text>

  <!-- Edges from root -->
  <path d="M 268 390 L 220 410" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 292 390 L 340 410" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Leaves -->
  <rect x="170" y="460" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="476" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="222" y="460" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="476" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="310" y="460" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="476" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="362" y="460" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="476" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Edges to leaves -->
  <path d="M 200 438 L 184 460" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 220 438 L 236 460" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 340 438 L 324 460" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 360 438 L 376 460" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Step 4 annotation -->
  <text x="190" y="516" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 步骤④</text>
  <text x="370" y="516" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">步骤⑧ ↑</text>
  <text x="280" y="516" text-anchor="middle" font-size="10" fill="#888">高亮步骤 = 建树操作发生处</text>
</svg>
