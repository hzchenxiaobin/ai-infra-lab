<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回文链表 O(1) 空间：找中点 → 反转后半 → 双指针比较</text>

  <!-- ===== ① 找前中点 ===== -->
  <text x="40" y="68" font-size="12" fill="#888" font-weight="bold">① 找前中点（slow 停在前半段末尾）</text>
  <g font-size="13">
    <rect x="100" y="82" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="103" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="150" y1="98" x2="178" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="184" y="82" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="209" y="103" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <line x1="234" y1="98" x2="262" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="268" y="82" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="293" y="103" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="318" y1="98" x2="346" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="352" y="82" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="377" y="103" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="402" y1="98" x2="430" y2="98" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="442" y="103" font-size="12" fill="#888">∅</text>
  </g>
  <text x="209" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ slow</text>
  <text x="209" y="146" text-anchor="middle" font-size="9" fill="#888">前半末尾</text>

  <!-- ===== ② 反转后半段 ===== -->
  <text x="40" y="186" font-size="12" fill="#888" font-weight="bold">② 反转 slow.next 起的后半段（2→1 掉头成 1→2）</text>
  <g font-size="13">
    <rect x="100" y="200" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="221" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="150" y1="216" x2="178" y2="216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="184" y="200" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="209" y="221" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="209" y="252" text-anchor="middle" font-size="9" fill="#888">前半段保持不动</text>

    <text x="300" y="216" font-size="14" fill="#d6a040" font-weight="bold">⇒</text>

    <rect x="340" y="200" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="365" y="221" text-anchor="middle" fill="#8a6a20" font-weight="bold">1</text>
    <line x1="390" y1="216" x2="418" y2="216" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="424" y="200" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="449" y="221" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
    <text x="449" y="252" text-anchor="middle" font-size="9" fill="#888">后半段反转后</text>
  </g>

  <!-- ===== ③ 双指针比较 ===== -->
  <text x="40" y="288" font-size="12" fill="#888" font-weight="bold">③ p1、p2 双指针逐节点比较</text>
  <g font-size="13">
    <text x="40" y="316" font-size="11" fill="#446688" font-weight="bold">p1:</text>
    <rect x="80" y="302" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="105" y="323" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="130" y1="318" x2="158" y2="318" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="164" y="302" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="189" y="323" text-anchor="middle" fill="#333" font-weight="bold">2</text>

    <text x="40" y="358" font-size="11" fill="#d6a040" font-weight="bold">p2:</text>
    <rect x="80" y="344" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="105" y="365" text-anchor="middle" fill="#8a6a20" font-weight="bold">1</text>
    <line x1="130" y1="360" x2="158" y2="360" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="164" y="344" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="189" y="365" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
  </g>

  <text x="240" y="323" font-size="11" fill="#4a7a3a" font-weight="bold">1 == 1 ✓</text>
  <text x="240" y="365" font-size="11" fill="#4a7a3a" font-weight="bold">2 == 2 ✓</text>

  <rect x="360" y="312" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">p2 走到 ∅，全程相等</text>
  <text x="465" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 是回文 ✓</text>

  <text x="300" y="404" text-anchor="middle" font-size="10" fill="#888">三步均为 O(n) / O(1)，无数组、无递归栈</text>
</svg>
