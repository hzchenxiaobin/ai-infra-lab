<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐字符扫描 + 成对消解</text>

  <!-- Start -->
  <rect x="230" y="40" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化 left=0, ans=0</text>

  <!-- arrow down -->
  <path d="M 280 70 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s[i] == '(' ? -->
  <polygon points="280,90 360,130 280,170 200,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#333">s[i] == '(' ?</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#333"></text>

  <!-- Left branch: '(' -->
  <path d="M 200 130 L 120 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="116" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">left++; i++</text>

  <!-- Right branch: ')' -->
  <path d="M 360 130 L 440 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否 ')' </text>

  <!-- Decision 2: s[i+1] == ')' ? -->
  <polygon points="440,130 510,160 440,190 370,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="158" text-anchor="middle" font-size="10" fill="#333">s[i+1]=')'?</text>

  <!-- Right sub-branch: yes, )) pair -->
  <path d="M 510 160 L 510 210 L 440 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="196" width="390" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="208" text-anchor="middle" font-size="10" fill="#333">凑成 '))' ：left&gt;0 ? left-- : ans++</text>
  <text x="245" y="222" text-anchor="middle" font-size="10" fill="#888">（无 ( 则补 ( ）→ i += 2</text>

  <!-- Left sub-branch: no, single ) -->
  <path d="M 370 160 L 280 160 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="156" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- single ) box (overlap-fix: place below yes box) -->
  <rect x="50" y="244" width="390" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="256" text-anchor="middle" font-size="10" fill="#333">单个 ')' ：left&gt;0 ? (left--, ans++) : ans+=2</text>
  <text x="245" y="270" text-anchor="middle" font-size="10" fill="#888">（有 ( 补 ) ，无 ( 补 ( 和 ) ）→ i += 1</text>

  <!-- connect single ) box up to the "否" path: from 280,196 (already drawn above into 280,196 area) - draw a line from 280 190 down to 244 -->
  <path d="M 280 196 L 280 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Merge arrow: both branches loop back -->
  <path d="M 50 230 L 30 230 L 30 130 L 50 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 50 261 L 30 261 L 30 232" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="200" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 20 200)">继续扫描</text>

  <!-- End: scan done -->
  <rect x="180" y="300" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扫描结束：ans += left × 2</text>
  <path d="M 280 278 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="294" font-size="10" fill="#888">i 越界</text>

  <!-- Return -->
  <path d="M 280 334 L 280 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="360" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Legend / note -->
  <rect x="30" y="406" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="424" font-size="10" fill="#666">关键：遇到 '))' 时 i += 2 跳过两个字符，避免把第二个 ')' 当单个处理。</text>
  <text x="50" y="442" font-size="10" fill="#b85450" font-weight="bold">每个 '(' 恒需 2 个 ')'，缺口确定 → 即时补缺即全局最优。</text>
</svg>
