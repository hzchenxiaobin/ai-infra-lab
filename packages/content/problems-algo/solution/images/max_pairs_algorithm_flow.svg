<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希统计频次 → 累加 ⌊c/2⌋ 与 c mod 2</text>

  <!-- Input -->
  <rect x="160" y="42" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：nums</text>
  <text x="280" y="76" text-anchor="middle" font-size="10.5" fill="#888">如 [1,3,2,1,3,2,2]</text>

  <path d="M 280 86 L 280 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: count freq -->
  <rect x="120" y="108" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">① 统计频次：freq[v] += 1</text>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#888">一次遍历建哈希表：{1:2, 2:3, 3:2}</text>

  <path d="M 280 166 L 280 184" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop accumulate -->
  <rect x="80" y="188" width="400" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 遍历 freq 的每个 (值 v, 次数 c)：</text>
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#333">pairs += c / 2 ;  leftover += c % 2</text>
  <text x="280" y="250" text-anchor="middle" font-size="10.5" fill="#888">每个值独立贡献，与遍历顺序无关</text>

  <path d="M 280 264 L 280 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: return -->
  <rect x="140" y="286" width="280" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">③ 返回 [pairs, leftover]</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#888">= [3, 1]</text>

  <!-- legend notes -->
  <path d="M 40 350 L 520 350" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="370" font-size="11" fill="#555">• 哈希表大小 = 不同值个数 ≤ n，遍历 O(n)</text>
  <text x="40" y="388" font-size="11" fill="#555">• c / 2 与 c % 2 同时给出「对数」与「余数」，一次整除两用</text>
  <text x="40" y="406" font-size="10.5" fill="#888">注：值域 [0,100] 时可用数组当哈希；值域大则用 unordered_map / dict。</text>
</svg>
