<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：DFS 调用顺序与克隆节点逐个建立</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">root = [1,null,3,2,4,null,5,6]  →  6 个节点，6 次调用</text>

  <!-- ===== Left: tree with visit order ===== -->
  <text x="140" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原树（标注 DFS 访问序）</text>

  <!-- edges -->
  <path d="M 140 122 L 95 195" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 140 122 L 140 195" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 140 122 L 185 195" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 95 217 L 78 285" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 95 217 L 112 285" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <ellipse cx="140" cy="105" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <ellipse cx="95" cy="205" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <ellipse cx="140" cy="205" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <ellipse cx="185" cy="205" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <ellipse cx="78" cy="295" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="299" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <ellipse cx="112" cy="295" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="299" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>

  <!-- visit order badges (red circles with number) -->
  <circle cx="165" cy="92" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>

  <circle cx="116" cy="192" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="196" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>

  <circle cx="60" cy="282" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="286" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>

  <circle cx="130" cy="282" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>

  <circle cx="161" cy="192" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="161" y="196" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>

  <circle cx="206" cy="192" r="9" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="196" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">6</text>

  <!-- arrow to table -->
  <path d="M 250 200 L 300 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: steps table ===== -->
  <text x="440" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">调用与克隆建立</text>

  <rect x="310" y="86" width="260" height="252" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- table header -->
  <rect x="310" y="86" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="332" y="103" text-anchor="middle" font-size="11" fill="#335533" font-weight="bold">步</text>
  <text x="392" y="103" text-anchor="middle" font-size="11" fill="#335533" font-weight="bold">调用</text>
  <text x="492" y="103" text-anchor="middle" font-size="11" fill="#335533" font-weight="bold">新建克隆</text>
  <line x1="355" y1="86" x2="355" y2="338" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="435" y1="86" x2="435" y2="338" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="332" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <text x="392" y="128" text-anchor="middle" font-size="11" fill="#335577">dfs(1)</text>
  <text x="492" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1′</text>

  <text x="332" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="392" y="158" text-anchor="middle" font-size="11" fill="#335577">dfs(3)</text>
  <text x="492" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3′</text>

  <text x="332" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <text x="392" y="188" text-anchor="middle" font-size="11" fill="#335577">dfs(5)</text>
  <text x="492" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5′</text>

  <text x="332" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="392" y="218" text-anchor="middle" font-size="11" fill="#335577">dfs(6)</text>
  <text x="492" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6′</text>

  <text x="332" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="392" y="248" text-anchor="middle" font-size="11" fill="#335577">dfs(2)</text>
  <text x="492" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2′</text>

  <text x="332" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥</text>
  <text x="392" y="278" text-anchor="middle" font-size="11" fill="#335577">dfs(4)</text>
  <text x="492" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4′</text>

  <!-- return phase note -->
  <line x1="320" y1="298" x2="560" y2="298" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="435" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 进入即建（前序）</text>
  <text x="435" y="330" text-anchor="middle" font-size="9.5" fill="#888">↓ 返回时接线（后序）</text>

  <!-- footer note -->
  <rect x="40" y="360" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#8a6a20">返回阶段自底向上接线：③④返回 → 3′.children=[5′,6′]；⑤⑥返回 → 1′.children=[3′,2′,4′]</text>
  <text x="290" y="396" text-anchor="middle" font-size="10.5" fill="#666">每个节点「进入时新建（前序）+ 返回时接线（后序）」—— 6 节点恰好 6 次调用，无重复</text>
</svg>
