<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：枚举所有分配 i，取最大候选</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="80" y="72" font-size="13" fill="#555">nums1=[3,4,6,5] (m=4)，nums2=[9,1,2,5,8,3] (n=6)，k=5；i ∈ [max(0,5−6), min(5,4)] = [0, 4]</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="86" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="120" y="86" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="270" y="86" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="440" y="86" width="220" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="660" y="86" width="220" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="90" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">i</text>
  <text x="195" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">A=取 nums1 前 i 大</text>
  <text x="355" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">B=取 nums2 前 k−i 大</text>
  <text x="550" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">merge(A, B)</text>
  <text x="770" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是否最大</text>

  <!-- 行 i=0 -->
  <g filter="url(#sk)">
    <rect x="60" y="124" width="60" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="120" y="124" width="150" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="270" y="124" width="170" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="440" y="124" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="660" y="124" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="90" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="195" y="144" text-anchor="middle" font-size="12" fill="#333">[ ]</text>
  <text x="355" y="144" text-anchor="middle" font-size="12" fill="#333">[9,2,5,8,3]</text>
  <text x="550" y="144" text-anchor="middle" font-size="12" fill="#333">[9,2,5,8,3]</text>
  <text x="770" y="144" text-anchor="middle" font-size="12" fill="#888">第 2 位 2 偏小</text>

  <!-- 行 i=1 -->
  <g filter="url(#sk)">
    <rect x="60" y="156" width="60" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="120" y="156" width="150" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="270" y="156" width="170" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="440" y="156" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="660" y="156" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="90" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="195" y="176" text-anchor="middle" font-size="12" fill="#333">[6]</text>
  <text x="355" y="176" text-anchor="middle" font-size="12" fill="#333">[9,5,8,3]</text>
  <text x="550" y="176" text-anchor="middle" font-size="12" fill="#333">[9,6,5,8,3]</text>
  <text x="770" y="176" text-anchor="middle" font-size="12" fill="#888">第 2 位 6 &lt; 8</text>

  <!-- 行 i=2 (winner) -->
  <g filter="url(#sk)">
    <rect x="60" y="188" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="120" y="188" width="150" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="270" y="188" width="170" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="440" y="188" width="220" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="660" y="188" width="220" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="90" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="195" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">[6,5]</text>
  <text x="355" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">[9,8,3]</text>
  <text x="550" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">[9,8,6,5,3]</text>
  <text x="770" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">★ 最大候选</text>

  <!-- 行 i=3 -->
  <g filter="url(#sk)">
    <rect x="60" y="226" width="60" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="120" y="226" width="150" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="270" y="226" width="170" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="440" y="226" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="660" y="226" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="90" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <text x="195" y="246" text-anchor="middle" font-size="12" fill="#333">[4,6,5]</text>
  <text x="355" y="246" text-anchor="middle" font-size="12" fill="#333">[9,8]</text>
  <text x="550" y="246" text-anchor="middle" font-size="12" fill="#333">[9,8,4,6,5]</text>
  <text x="770" y="246" text-anchor="middle" font-size="12" fill="#888">第 3 位 4 &lt; 6</text>

  <!-- 行 i=4 -->
  <g filter="url(#sk)">
    <rect x="60" y="258" width="60" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="120" y="258" width="150" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="270" y="258" width="170" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="440" y="258" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
    <rect x="660" y="258" width="220" height="30" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="90" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="195" y="278" text-anchor="middle" font-size="12" fill="#333">[3,4,6,5]</text>
  <text x="355" y="278" text-anchor="middle" font-size="12" fill="#333">[9]</text>
  <text x="550" y="278" text-anchor="middle" font-size="12" fill="#333">[9,3,4,6,5]</text>
  <text x="770" y="278" text-anchor="middle" font-size="12" fill="#888">第 2 位 3 &lt; 8</text>

  <!-- 比较链 -->
  <text x="80" y="316" font-size="13" font-weight="bold" fill="#2b2b2b">候选逐位比较（字典序）：</text>

  <g filter="url(#sk)">
    <rect x="80" y="330" width="780" height="40" rx="6" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="100" y="354" font-size="12" fill="#333">[9,8,6,5,3]  &gt;  [9,8,4,6,5]  &gt;  [9,6,5,8,3]  &gt;  [9,3,4,6,5]  &gt;  [9,2,5,8,3]</text>
  <text x="700" y="354" font-size="11" fill="#888">第二位 8 最大者胜</text>

  <!-- 聚焦 i=2 的合并过程 -->
  <text x="80" y="398" font-size="13" font-weight="bold" fill="#7a5415">聚焦 i=2：merge([6,5], [9,8,3]) 的合并轨迹</text>

  <g filter="url(#sk)">
    <rect x="80" y="412" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="105" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">①</text>
  <text x="140" y="432" font-size="12" fill="#555">A[0]=6  vs  B[0]=9 ⟹ 6&lt;9 取 9</text>

  <g filter="url(#sk)">
    <rect x="80" y="446" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="105" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">②</text>
  <text x="140" y="466" font-size="12" fill="#555">A[0]=6  vs  B[1]=8 ⟹ 6&lt;8 取 8</text>

  <g filter="url(#sk)">
    <rect x="80" y="480" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="105" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">③</text>
  <text x="140" y="500" font-size="12" fill="#555">A[0]=6  vs  B[2]=3 ⟹ 6&gt;3 取 6</text>

  <g filter="url(#sk)">
    <rect x="80" y="514" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="105" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">④⑤</text>
  <text x="140" y="534" font-size="12" fill="#555">A[1]=5&gt;3 取 5；A 用尽，接入 B 剩余 3</text>

  <!-- 最终答案 -->
  <g filter="url(#sk)">
    <rect x="500" y="412" width="360" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="680" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">答案 ans</text>
  <g filter="url(#sk)">
    <rect x="540" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="584" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="628" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="672" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="716" y="450" width="44" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="562" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <text x="606" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">8</text>
  <text x="650" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">6</text>
  <text x="694" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5</text>
  <text x="738" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="680" y="508" text-anchor="middle" font-size="12" fill="#4a7a3a">= 5 个分配里字典序最大者</text>
  <text x="680" y="526" text-anchor="middle" font-size="11" fill="#888">i=2：nums1 出 2 位、nums2 出 3 位</text>

  <text x="470" y="586" text-anchor="middle" font-size="12" fill="#888">枚举 i 仅 min(m,n,k)+1 种；每种做一次「单调栈 + 合并」，取最大即答案。</text>
</svg>
