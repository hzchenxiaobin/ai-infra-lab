<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：堆优化 Dijkstra——节点为状态，最早到达时刻为距离</text>

  <ellipse cx="260" cy="44" rx="38" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 58 L 260 70" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="72" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建邻接表：adj[u] 存 (v, start, end)</text>

  <path d="M 260 96 L 260 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="110" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist[0] = 0（其余 ∞），小根堆压入 (0, 0)</text>

  <path d="M 260 134 L 260 146" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,148 310,170 260,192 210,170" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆空？</text>
  <path d="M 310 170 L 396 170" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="164" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="400" y="158" width="100" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1 ✗</text>
  <path d="M 260 192 L 260 204" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="203" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <rect x="130" y="206" width="260" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出堆顶 (t, u)——堆中时刻最小的状态</text>

  <path d="M 260 232 L 260 244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,246 318,268 260,290 202,268" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t &gt; dist[u] ?</text>
  <path d="M 318 268 L 396 268" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="262" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="400" y="256" width="100" height="24" rx="6" fill="#f3f3f3" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">陈旧条目丢弃</text>
  <path d="M 500 268 L 510 268 L 510 219 L 394 219" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 290 L 260 302" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="301" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="260,304 318,326 260,348 202,326" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u == n−1 ?</text>
  <path d="M 318 326 L 396 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="320" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="400" y="314" width="100" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 t ✓</text>
  <path d="M 260 348 L 260 360" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="359" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <rect x="140" y="362" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 u 的邻边 (v, start, end)</text>

  <path d="M 260 388 L 260 400" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="402" width="320" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="421" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 若 t &gt; end → 此边已过期，弃用 ✗</text>
  <text x="260" y="439" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② nt = max(t, start) + 1（等待被 max 吞掉）</text>
  <text x="260" y="457" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 若 nt &lt; dist[v] → 更新 dist[v] 并压入 (nt, v)</text>

  <path d="M 100 435 L 18 435 L 18 219 L 124 219" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="492" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所有邻边处理完 → 回到「弹出堆顶」继续循环</text>

  <text x="260" y="528" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每次转移时刻严格 +1（正权）＋ 早到可等待（支配）⇒ 首次弹出 n−1 时的 t 即答案</text>
</svg>
