<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两步证明：恰好卡在 g = a·b − a − b</text>

  <!-- ① 构造 -->
  <text x="60" y="58" font-size="12.5" fill="#4a7a3a" font-weight="bold">① 构造：任何 v ≥ (a−1)(b−1) = g+1 都可买</text>

  <rect x="30" y="72" width="158" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="109" y="94" text-anchor="middle" font-size="11.5" fill="#333">选 y ∈ [0, a−1]</text>
  <text x="109" y="112" text-anchor="middle" font-size="11.5" fill="#333">使 b·y ≡ v (mod a)</text>
  <text x="109" y="128" text-anchor="middle" font-size="9.5" fill="#888">b 模 a 有逆元，y 存在且唯一</text>

  <path d="M 188 100 L 206 100" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="210" y="72" width="158" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="94" text-anchor="middle" font-size="11.5" fill="#333">v − b·y &gt; −a</text>
  <text x="289" y="112" text-anchor="middle" font-size="11.5" fill="#333">且是 a 的倍数 ⇒ ≥ 0</text>
  <text x="289" y="128" text-anchor="middle" font-size="9.5" fill="#888">下界：v − b(a−1) &gt; −a</text>

  <path d="M 368 100 L 386 100" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="390" y="72" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="94" text-anchor="middle" font-size="11.5" fill="#333">x = (v−b·y)/a ≥ 0</text>
  <text x="460" y="114" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">v = a·x + b·y ✓</text>

  <!-- ② 反证 -->
  <text x="60" y="168" font-size="12.5" fill="#b85450" font-weight="bold">② 反证：g = a·b − a − b 本身买不到</text>

  <rect x="30" y="182" width="158" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="109" y="204" text-anchor="middle" font-size="11.5" fill="#333">假设 g = a·x + b·y</text>
  <text x="109" y="222" text-anchor="middle" font-size="11.5" fill="#333">(x, y ≥ 0)</text>

  <path d="M 188 210 L 206 210" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrr)"/>

  <rect x="210" y="182" width="158" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="204" text-anchor="middle" font-size="11.5" fill="#333">模 a：b(y+1) ≡ 0 (mod a)</text>
  <text x="289" y="222" text-anchor="middle" font-size="11.5" fill="#333">互质 ⇒ a | y+1 ⇒ y ≥ a−1</text>

  <path d="M 368 210 L 386 210" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrr)"/>

  <rect x="390" y="182" width="140" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="204" text-anchor="middle" font-size="11.5" fill="#333">x = (g−b·y)/a ≤ −1</text>
  <text x="460" y="224" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">x &lt; 0，矛盾 ✗</text>

  <!-- 结论 -->
  <path d="M 280 244 L 280 262" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="46" y="266" width="468" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">两个结论拼起来：g 之前可能有红格，g 之后全是绿格</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333">⇒ 最后一个红格恰是 g，它就是最贵买不到的价格</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888">Chicken McNugget 定理（麦乐鸡定理）：互质 a、b 的 Frobenius 数</text>
</svg>
