<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 4，三条路径恰好拼出互不相交的三块</text>
  <text x="260" y="34" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">fruits = [[1,2,3,4],[5,6,8,7],[9,10,11,12],[13,14,15,16]]</text>
  <rect x="52" y="56" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="56" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="130.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="156" y="56" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="208" y="56" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="52" y="108" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="78.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="104" y="108" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="156" y="108" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="208" y="108" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="234.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">7</text>
  <rect x="52" y="160" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="78.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">9</text>
  <rect x="104" y="160" width="52" height="52" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="130.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">10</text>
  <rect x="156" y="160" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="208" y="160" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234.0" y="190.0" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="52" y="212" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78.0" y="242.0" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="104" y="212" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130.0" y="242.0" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="156" y="212" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="242.0" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="208" y="212" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234.0" y="242.0" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="210" y="214" width="48" height="48" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 94 98 L 114 118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 150 L 166 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 198 202 L 218 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 98 L 198 118" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 198 150 L 218 170" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 234.0 204 L 234.0 220" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 238.0 L 112 238.0" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 238.0 L 164 238.0" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 238.0 L 216 238.0" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="56" width="232" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396.0" y="73" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">A（蓝，主对角线）</text>
  <text x="396.0" y="93" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">1 + 6 + 11 + 16 = 34</text>
  <text x="396.0" y="111" text-anchor="middle" font-size="8.8" fill="#666" filter="url(#rough2)"></text>
  <rect x="280" y="132" width="232" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396.0" y="149" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B（绿，右侧楔形）</text>
  <text x="396.0" y="169" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">4 + 8 + 12 + 0 = 24</text>
  <text x="396.0" y="187" text-anchor="middle" font-size="8.8" fill="#666" filter="url(#rough2)">终点 16 已归 A → 记 0</text>
  <rect x="280" y="208" width="232" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396.0" y="225" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C（橙，左下楔形）</text>
  <text x="396.0" y="245" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">13 + 14 + 15 + 0 = 42</text>
  <text x="396.0" y="263" text-anchor="middle" font-size="8.8" fill="#666" filter="url(#rough2)">终点同理记 0</text>
  <rect x="280" y="284" width="232" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="396.0" y="305" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">总计 = 34 + 24 + 42 = 100 ✓</text>
  <text x="396.0" y="325" text-anchor="middle" font-size="9" fill="#8a4440" filter="url(#rough2)">与官方示例一致</text>
  <rect x="52" y="330" width="460" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="282" y="350" text-anchor="middle" font-size="9.8" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 对照（n = 2）：三人各只有一条路，终点 (1,1) 三人共到</text>
  <text x="282" y="368" text-anchor="middle" font-size="9.2" fill="#555" filter="url(#rough2)">A = 1+1，B = 1，C = 1 → 合计 4 ✓ —— 「共点房间只计一次」正是对角线记 0 的极端情形</text>
</svg>
