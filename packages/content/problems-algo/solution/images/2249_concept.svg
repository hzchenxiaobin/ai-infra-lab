<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：枚举 [0,200]×[0,200] 全局格点 → 逐圆判定 → 命中即停</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">坐标范围封闭（xi±ri ∈ [0,200]），点视角天然去重，无需集合</text>

  <!-- ===== Left: coordinate range analysis ===== -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 坐标范围封闭</text>

  <rect x="40" y="86" width="210" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="104" font-size="10" fill="#555">约束：1 ≤ xi, yi ≤ 100</text>
  <text x="50" y="120" font-size="10" fill="#555">      ri ≤ min(xi, yi)</text>
  <text x="50" y="138" font-size="10" fill="#b85450" font-weight="bold">下界：xi − ri ≥ 0</text>
  <text x="50" y="154" font-size="10" fill="#b85450" font-weight="bold">上界：xi + ri ≤ 200</text>

  <!-- range bar -->
  <text x="50" y="184" font-size="10" fill="#888">格点坐标范围：</text>
  <rect x="40" y="190" width="210" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x, y ∈ [0, 200]</text>

  <!-- total points -->
  <rect x="40" y="228" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">候选格点 201 × 201</text>
  <text x="145" y="262" text-anchor="middle" font-size="10" fill="#555">≈ 4 × 10⁴ 个</text>

  <!-- note -->
  <rect x="40" y="284" width="210" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="145" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">点视角 vs 圆视角</text>
  <text x="50" y="318" font-size="9.5" fill="#555">点视角：天然去重 O(1) 空间</text>
  <text x="50" y="332" font-size="9.5" fill="#555">圆视角：需集合去重 O(nr²) 空间</text>

  <!-- split line -->
  <line x1="270" y1="60" x2="270" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: grid + circle illustration ===== -->
  <text x="415" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 逐格点判定（命中即停）</text>

  <!-- grid -->
  <g filter="url(#rough2)">
    <!-- grid lines -->
    <g stroke="#e0e0e0" stroke-width="0.8">
      <line x1="310" y1="90" x2="520" y2="90"/>
      <line x1="310" y1="120" x2="520" y2="120"/>
      <line x1="310" y1="150" x2="520" y2="150"/>
      <line x1="310" y1="180" x2="520" y2="180"/>
      <line x1="310" y1="210" x2="520" y2="210"/>
      <line x1="310" y1="240" x2="520" y2="240"/>
      <line x1="310" y1="270" x2="520" y2="270"/>
      <line x1="310" y1="300" x2="520" y2="300"/>
      <line x1="310" y1="330" x2="520" y2="330"/>
      <line x1="310" y1="90" x2="310" y2="360"/>
      <line x1="340" y1="90" x2="340" y2="360"/>
      <line x1="370" y1="90" x2="370" y2="360"/>
      <line x1="400" y1="90" x2="400" y2="360"/>
      <line x1="430" y1="90" x2="430" y2="360"/>
      <line x1="460" y1="90" x2="460" y2="360"/>
      <line x1="490" y1="90" x2="490" y2="360"/>
      <line x1="520" y1="90" x2="520" y2="360"/>
    </g>
    <!-- grid border -->
    <rect x="310" y="90" width="210" height="270" fill="none" stroke="#bbb" stroke-width="1.5"/>
  </g>

  <!-- circle 1: center (2,2) r=2, mapped to grid at (370, 150) with scale 30px/unit -->
  <circle cx="370" cy="150" r="60" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- circle 2: center (3,4) r=1, mapped to (400, 210) -->
  <circle cx="400" cy="210" r="30" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- lattice points inside circle 1 (green dots) -->
  <g fill="#4a7a3a" filter="url(#rough2)">
    <circle cx="310" cy="150" r="3.5"/>
    <circle cx="340" cy="120" r="3.5"/>
    <circle cx="340" cy="150" r="3.5"/>
    <circle cx="340" cy="180" r="3.5"/>
    <circle cx="370" cy="90" r="3.5"/>
    <circle cx="370" cy="120" r="3.5"/>
    <circle cx="370" cy="150" r="3.5"/>
    <circle cx="370" cy="180" r="3.5"/>
    <circle cx="370" cy="210" r="3.5"/>
    <circle cx="400" cy="120" r="3.5"/>
    <circle cx="400" cy="150" r="3.5"/>
    <circle cx="400" cy="180" r="3.5"/>
    <circle cx="430" cy="150" r="3.5"/>
  </g>

  <!-- lattice points only in circle 2 (orange dots, not overlapping) -->
  <g fill="#d6a040" filter="url(#rough2)">
    <circle cx="400" cy="240" r="3.5"/>
    <circle cx="430" cy="210" r="3.5"/>
    <circle cx="400" cy="210" r="4.5" stroke="#b85450" stroke-width="1.2"/>
  </g>

  <!-- overlap points highlighted (red ring) -->
  <g fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)">
    <circle cx="370" cy="210" r="5"/>
    <circle cx="400" cy="180" r="5"/>
  </g>

  <!-- center markers -->
  <text x="370" y="146" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">C1</text>
  <text x="400" y="206" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">C2</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <circle cx="296" cy="372" r="3.5" fill="#4a7a3a"/>
    <text x="306" y="376" font-size="9" fill="#555">圆内格点</text>
    <circle cx="376" cy="372" r="3.5" fill="#d6a040"/>
    <text x="386" y="376" font-size="9" fill="#555">仅圆2</text>
    <circle cx="440" cy="372" r="5" fill="none" stroke="#b85450" stroke-width="1.5"/>
    <text x="452" y="376" font-size="9" fill="#555">重叠（计1次）</text>
  </g>

  <!-- distance formula note -->
  <rect x="285" y="388" width="250" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="406" text-anchor="middle" font-size="10" fill="#333">判定：dx² + dy² ≤ r²（整数运算）</text>
</svg>
