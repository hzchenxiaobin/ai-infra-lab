<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先过合法性关卡，再做三档分类</text>

  <!-- step 1: sort -->
  <rect x="185" y="38" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">排序得 a ≤ b ≤ c</text>

  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <path d="M 260 92 L 330 124 L 260 156 L 190 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">a + b &gt; c ?</text>
  <text x="260" y="139" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（严格大于）</text>

  <!-- none branch -->
  <path d="M 330 124 L 392 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="396" y="106" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="129" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">"none"</text>

  <!-- yes branch -->
  <path d="M 260 156 L 260 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="168" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- decision 2 -->
  <path d="M 260 176 L 336 208 L 260 240 L 184 208 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a == b 且 b == c ?</text>
  <text x="260" y="223" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（三边全等）</text>

  <!-- equilateral branch -->
  <path d="M 336 208 L 392 208" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="396" y="190" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="213" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"equilateral"</text>

  <!-- no branch -->
  <path d="M 260 240 L 260 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="252" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision 3 -->
  <path d="M 260 260 L 336 292 L 260 324 L 184 292 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a == b 或 b == c ?</text>
  <text x="260" y="307" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（恰有两边相等）</text>

  <!-- isosceles branch -->
  <path d="M 336 292 L 392 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="362" y="284" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="396" y="274" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="297" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">"isosceles"</text>

  <!-- scalene branch -->
  <path d="M 260 324 L 260 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="336" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="210" y="344" width="100" height="36" fill="#ffffff" stroke="#999" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">"scalene"</text>

  <!-- side note -->
  <rect x="30" y="176" width="136" height="64" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="98" y="198" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">排序后相等边必相邻，</text>
  <text x="98" y="214" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不用查 a == c：</text>
  <text x="98" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a == c 必然三边全等</text>
</svg>
