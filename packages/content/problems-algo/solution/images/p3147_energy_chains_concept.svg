<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：下标按 mod k 分链，起点收益 = 链上后缀和</text>

  <text x="16" y="46" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① energy = [5, 2, −10, −5, 1]，k = 3：从 i 传送到 i + k，吸到底</text>

  <!-- original cells, tinted by chain -->
  <rect x="70" y="64" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="95" y="97" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">i=0</text>

  <rect x="126" y="64" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="84" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="151" y="97" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">i=1</text>

  <rect x="182" y="64" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="84" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">−10</text>
  <text x="207" y="97" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">i=2</text>

  <rect x="238" y="64" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="84" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="263" y="97" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">i=3</text>

  <rect x="294" y="64" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="84" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="319" y="97" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">i=4</text>

  <!-- jump arcs i -> i+k -->
  <path d="M 95 104 C 130 142, 226 142, 258 106" stroke="#446688" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 151 104 C 186 158, 284 158, 314 106" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="360" y="132" font-size="10.5" fill="#555" filter="url(#rough2)">传送 +k，</text>
  <text x="360" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">跳到出界为止</text>

  <!-- ② chains -->
  <text x="16" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 模 3 同余 ⇒ 三条独立链，逐链求后缀和：dp[i] = energy[i] + dp[i+k]</text>

  <!-- chain r=0 -->
  <text x="24" y="221" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">链 r=0</text>
  <rect x="90" y="202" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="221" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 138 216 L 162 216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="168" y="202" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="221" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="232" y="221" font-size="10" fill="#446688" filter="url(#rough2)">dp[3] = −5，dp[0] = 5 + (−5) = 0</text>

  <!-- chain r=1 -->
  <text x="24" y="257" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">链 r=1</text>
  <rect x="90" y="238" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="257" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 138 252 L 162 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="168" y="238" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="257" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="232" y="257" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[4] = 1，dp[1] = 2 + 1 =</text>
  <text x="368" y="257" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ← 答案</text>

  <!-- chain r=2 -->
  <text x="24" y="293" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">链 r=2</text>
  <rect x="90" y="274" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="293" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">−10</text>
  <text x="232" y="293" font-size="10" fill="#8a6a1f" filter="url(#rough2)">dp[2] = −10（孤链，吸一口就出界）</text>

  <!-- bottom note -->
  <rect x="12" y="308" width="496" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">ans = max{0, −5, 1, 3, −10} = 3：从魔法师 1 出发，2 + 1 一路吸到底</text>
  <text x="260" y="345" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">路径唯一且不能中途收手 ⇒ 后缀和直接打擂台，用不上 Kadane（对照 53 题）</text>
</svg>
