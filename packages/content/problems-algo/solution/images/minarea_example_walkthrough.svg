<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[1,1],[1,3],[3,1],[3,3],[4,1],[4,3]]</text>

  <!-- coordinate axes -->
  <path d="M 70 340 L 400 340" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <path d="M 90 360 L 90 70" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <text x="406" y="344" font-size="11" fill="#aaa">x</text>
  <text x="86" y="66" font-size="11" fill="#aaa">y</text>

  <!-- grid ticks -->
  <text x="168" y="356" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="246" y="356" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="285" y="356" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="82" y="294" text-anchor="end" font-size="10" fill="#aaa">1</text>
  <text x="82" y="216" text-anchor="end" font-size="10" fill="#aaa">3</text>

  <!-- Rectangle 1: area=4 (x=1..3, y=1..3) -->
  <rect x="168" y="216" width="78" height="78" fill="#e8f0fe" fill-opacity="0.4" stroke="#6a9acc" stroke-width="2" stroke-dasharray="6,3" rx="2" filter="url(#rough2)"/>
  <text x="207" y="305" text-anchor="middle" font-size="11" fill="#6a9acc" font-weight="bold">面积=4</text>

  <!-- Rectangle 2: area=2 (x=3..4, y=1..3) -->
  <rect x="246" y="216" width="39" height="78" fill="#fce4ec" fill-opacity="0.45" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" rx="2" filter="url(#rough2)"/>
  <text x="265" y="305" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">面积=2</text>

  <!-- diagonal for rect 2 -->
  <path d="M 246 294 L 285 216" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- Points -->
  <!-- (1,1) -->
  <circle cx="168" cy="294" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="150" y="310" font-size="10" fill="#446688" font-weight="bold">(1,1)</text>
  <!-- (1,3) -->
  <circle cx="168" cy="216" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="140" y="210" font-size="10" fill="#446688" font-weight="bold">(1,3)</text>
  <!-- (3,1) -->
  <circle cx="246" cy="294" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="234" y="310" font-size="10" fill="#446688" font-weight="bold">(3,1)</text>
  <!-- (3,3) -->
  <circle cx="246" cy="216" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="228" y="210" font-size="10" fill="#446688" font-weight="bold">(3,3)</text>
  <!-- (4,1) -->
  <circle cx="285" cy="294" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="280" y="310" font-size="10" fill="#446688" font-weight="bold">(4,1)</text>
  <!-- (4,3) -->
  <circle cx="285" cy="216" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="278" y="210" font-size="10" fill="#446688" font-weight="bold">(4,3)</text>

  <!-- highlight diagonal pair for min rect -->
  <circle cx="246" cy="294" r="9" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="285" cy="216" r="9" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="330" text-anchor="middle" font-size="9.5" fill="#d6a040">对角 p₁=(3,1) p₂=(4,3)</text>

  <!-- right side explanation -->
  <rect x="410" y="90" width="120" height="240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">枚举过程</text>
  <line x1="422" y1="120" x2="518" y2="120" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <text x="420" y="138" font-size="9.5" fill="#555">p₁(1,1)–p₂(3,3):</text>
  <text x="430" y="152" font-size="9" fill="#82b366">✓ (1,3)(3,1)都在</text>
  <text x="430" y="165" font-size="9" fill="#6a9acc">area=4, min=4</text>

  <text x="420" y="182" font-size="9.5" fill="#555">p₁(1,1)–p₂(4,3):</text>
  <text x="430" y="196" font-size="9" fill="#82b366">✓ (1,3)(4,1)都在</text>
  <text x="430" y="209" font-size="9" fill="#6a9acc">area=6, min=4</text>

  <text x="420" y="226" font-size="9.5" fill="#555">p₁(3,1)–p₂(4,3):</text>
  <text x="430" y="240" font-size="9" fill="#82b366">✓ (3,3)(4,1)都在</text>
  <text x="430" y="253" font-size="9.5" fill="#b85450" font-weight="bold">area=2, min=2</text>

  <text x="420" y="270" font-size="9.5" fill="#555">p₁(1,1)–p₂(1,3):</text>
  <text x="430" y="284" font-size="9" fill="#b85450">✗ 同x,非对角</text>

  <text x="420" y="301" font-size="9.5" fill="#555">... 其余对类似</text>

  <text x="470" y="322" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">→ return 2</text>
</svg>
