<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心匹配：每次选全局最近的 (工人, 自行车) 对</text>

  <!-- Grid background -->
  <g filter="url(#rough2)" opacity="0.35">
    <line x1="60" y1="60" x2="60" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="100" y1="60" x2="100" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="140" y1="60" x2="140" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="180" y1="60" x2="180" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="220" y1="60" x2="220" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="260" y1="60" x2="260" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="300" y1="60" x2="300" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="340" y1="60" x2="340" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="380" y1="60" x2="380" y2="220" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="60" x2="380" y2="60" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="100" x2="380" y2="100" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="140" x2="380" y2="140" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="180" x2="380" y2="180" stroke="#ccc" stroke-width="1"/>
    <line x1="60" y1="220" x2="380" y2="220" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- Manhattan distance path: W0[0,0] -> B0[1,2] -->
  <!-- W0 at grid (0,0) -> pixel (100, 180), B0 at grid (1,2) -> pixel (140, 100) -->
  <path d="M 100 180 L 140 180 L 140 100" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="118" y="196" text-anchor="middle" font-size="9.5" fill="#d6a040">Δx=1</text>
  <text x="150" y="142" font-size="9.5" fill="#d6a040">Δy=2</text>

  <!-- W0 at [0,0] -->
  <circle cx="100" cy="180" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">W0</text>

  <!-- W1 at [2,1] -->
  <circle cx="180" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="144" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">W1</text>

  <!-- B0 at [1,2] -->
  <rect x="128" y="88" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B0</text>

  <!-- B1 at [3,3] -->
  <rect x="248" y="68" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B1</text>

  <!-- Manhattan distance label -->
  <text x="400" y="88" font-size="11" fill="#555">曼哈顿距离:</text>
  <text x="400" y="106" font-size="12" fill="#b85450" font-weight="bold">|Δx| + |Δy|</text>
  <text x="400" y="124" font-size="10.5" fill="#888">非直线距离，而是</text>
  <text x="400" y="138" font-size="10.5" fill="#888">沿网格走的折线路径</text>

  <!-- Greedy concept -->
  <rect x="40" y="248" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="268" font-size="11.5" fill="#4a7a3a" font-weight="bold">💡 贪心规则（三层 tie-break）：</text>
  <text x="60" y="284" font-size="10.5" fill="#555">① 选曼哈顿距离最短的 (W, B) 对</text>
  <text x="60" y="298" font-size="10.5" fill="#555">② 距离相同 → 工人编号小的优先</text>

  <text x="300" y="284" font-size="10.5" fill="#555">③ 工人也相同 → 自行车编号小的优先</text>
  <text x="300" y="298" font-size="10.5" fill="#555">④ 重复直到所有工人都有自行车</text>

  <!-- Warning box -->
  <rect x="40" y="320" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="11" fill="#b85450" font-weight="bold">⚠️ 注意：</text>
  <text x="60" y="356" font-size="10.5" fill="#888">贪心 ≠ 总距离最小！题目要求"每轮选最近对"的特定规则</text>
  <text x="60" y="370" font-size="10.5" fill="#888">最小化总距离是 1066 题，需 DP + 状态压缩</text>
</svg>
