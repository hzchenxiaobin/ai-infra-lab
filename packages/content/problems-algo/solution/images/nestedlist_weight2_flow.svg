<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    一遍 BFS 累加翻倍流程
  </text>

  <!-- Init -->
  <rect x="180" y="50" width="200" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    queue ← nestedList，total=0，level_sum=0
  </text>
  <line x1="280" y1="90" x2="280" y2="110" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While queue? -->
  <polygon points="280,112 400,158 280,204 160,158" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    queue 非空?
  </text>
  <text x="280" y="173" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    否 → return total
  </text>

  <!-- Yes: process one level -->
  <line x1="280" y1="204" x2="280" y2="222" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="224" width="260" height="34" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    处理本层 level_size 个元素
  </text>
  <line x1="280" y1="258" x2="280" y2="276" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: isInteger? -->
  <polygon points="280,278 380,316 280,354 180,316" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    elem.isInteger()?
  </text>

  <!-- Yes: accumulate level_sum -->
  <line x1="180" y1="316" x2="100" y2="316" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="350" width="170" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="105" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    level_sum += val
  </text>
  <text x="105" y="386" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    （整数累入本层）
  </text>

  <!-- No: extend children -->
  <line x1="380" y1="316" x2="460" y2="316" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="308" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="380" y="350" width="170" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    queue.extend(children)
  </text>
  <text x="465" y="386" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    （列表下钻一层）
  </text>

  <!-- Merge to total += level_sum -->
  <path d="M 105 394 L 105 410 L 280 410" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 394 L 465 410 L 280 410" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total += level_sum (key step) -->
  <rect x="180" y="412" width="200" height="0" fill="none"/>
  <text x="280" y="424" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    本层结束：total += level_sum ↑ 回到 while
  </text>
</svg>
