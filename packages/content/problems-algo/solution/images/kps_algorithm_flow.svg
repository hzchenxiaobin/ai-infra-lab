<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：小顶堆多路归并求前 k 小对</text>

  <!-- Box 1: init -->
  <rect x="80" y="44" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333">① 把 (nums1[i]+nums2[0], i, 0) 入堆</text>
  <text x="260" y="80" text-anchor="middle" font-size="11" fill="#555">i = 0 .. min(k, len₁) − 1</text>

  <path d="M 260 90 L 260 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: loop -->
  <rect x="80" y="108" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="13" fill="#333">② 循环 k 次（堆空提前停）：</text>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#555">弹出堆顶 (sum, i, j) → 写入答案</text>

  <path d="M 260 154 L 260 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: j+1 < len2 ? -->
  <path d="M 260 172 L 340 192 L 260 212 L 180 192 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333">j + 1 &lt; len₂ ?</text>

  <!-- yes branch -->
  <text x="355" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 340 192 L 380 192 L 380 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="234" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="254" text-anchor="middle" font-size="11" fill="#333">入堆 (nums1[i]+nums2[j+1], i, j+1)</text>

  <!-- no branch -->
  <text x="160" y="188" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 192 L 140 192 L 140 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="234" width="160" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#888">该 i 路耗尽，跳过</text>

  <!-- merge back -->
  <path d="M 140 266 L 140 286 L 380 286 L 380 266" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- loop back arrow to box 2 -->
  <path d="M 260 286 L 260 304 L 470 304 L 470 130 L 442 130" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="478" y="216" font-size="10" fill="#b85450" font-weight="bold">未到</text>
  <text x="478" y="230" font-size="10" fill="#b85450" font-weight="bold">k 次</text>

  <!-- after loop -->
  <path d="M 260 286 L 260 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="298" font-size="10" fill="#888">已 k 次</text>

  <!-- Box final -->
  <rect x="80" y="308" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③ 返回答案列表（按弹出顺序）</text>

  <!-- complexity note -->
  <rect x="40" y="356" width="440" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#b85450">时间 O(k log min(k, n₁))，空间 O(min(k, n₁))</text>
</svg>
