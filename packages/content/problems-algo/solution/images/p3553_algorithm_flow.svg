<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：BFS 预处理 + 倍增 LCA，每查询 3 次 LCA 拼出答案</text>
  <text x="300" y="44" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">answer = ( d(a,b) + d(b,c) + d(c,a) ) / 2，其中 a=src1, b=src2, c=dest</text>

  <!-- 列标题 -->
  <text x="160" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">预处理（一次，O(n log n)）</text>
  <text x="430" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">每次查询（O(log n)）</text>

  <!-- 左列：预处理 -->
  <rect x="30" y="70" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="90" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 建邻接表，从根 0 迭代 BFS</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">得 depth[v]、dist[v]、up[0][v]=父</text>
  <path d="M 160 122 L 160 136" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="138" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 建倍增表（K = ⌈log₂ n⌉ 层）</text>
  <text x="160" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">up[k][v] = up[k−1][ up[k−1][v] ]</text>
  <path d="M 160 190 L 160 204" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="206" width="260" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="226" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">③ LCA(x,y) 两阶段：</text>
  <text x="160" y="243" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">按二进制拆分跳齐深度，</text>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">再从高位到低位一起上跳</text>

  <rect x="30" y="286" width="260" height="36" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">空间 O(n log n)：约 17 × 10⁵ 个 int</text>

  <!-- 右列：查询 -->
  <rect x="340" y="70" width="230" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="94" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">取 a=src1, b=src2, c=dest</text>
  <path d="M 455 110 L 455 122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="340" y="124" width="230" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="143" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">三次 LCA：</text>
  <text x="455" y="160" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">lca(a,b)、lca(b,c)、lca(c,a)</text>
  <path d="M 455 170 L 455 182" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="340" y="184" width="230" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="204" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">三次距离：</text>
  <text x="455" y="220" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">d(x,y) = dist[x]+dist[y]</text>
  <text x="455" y="234" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">− 2·dist[lca(x,y)]</text>
  <path d="M 455 238 L 455 250" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="340" y="252" width="230" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="273" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">answer = (d(a,b) + d(b,c)</text>
  <text x="455" y="289" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">+ d(c,a)) / 2</text>
  <text x="455" y="303" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">（和必为偶数，64 位累加）</text>

  <!-- 底部说明 -->
  <rect x="30" y="336" width="540" height="68" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">为什么比 2203（一般图版）省事：树路径唯一 ⇒ 不用 Dijkstra 枚举汇合点</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">两点距离一个 LCA 顶死；三点最小连通子树（斯坦纳树）有闭式解 = 三距离和的一半</text>
  <text x="300" y="394" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">总复杂度 O((n + q) log n)，n, q 均到 10⁵ 也稳</text>
</svg>
