<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四次 O(1) 计算出答案</text>

  <!-- main chain -->
  <rect x="25" y="48" width="262" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="65" text-anchor="middle" font-size="12" fill="#333">读入 n, limit</text>
  <text x="156" y="82" text-anchor="middle" font-size="10" fill="#446688">令 L = limit + 1</text>
  <path d="M 156 90 L 156 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="104" width="262" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="121" text-anchor="middle" font-size="12" fill="#333">ans ← f(n)</text>
  <text x="156" y="138" text-anchor="middle" font-size="10" fill="#888">无上限总数</text>
  <path d="M 156 146 L 156 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="158" width="262" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="175" text-anchor="middle" font-size="12" fill="#333">ans ← ans − 3·f(n−L)</text>
  <text x="156" y="192" text-anchor="middle" font-size="10" fill="#b85450">减：恰 1 人超限</text>
  <path d="M 156 200 L 156 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="212" width="262" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="229" text-anchor="middle" font-size="12" fill="#333">ans ← ans + 3·f(n−2L)</text>
  <text x="156" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a">加：恰 2 人超限（多减的加回来）</text>
  <path d="M 156 254 L 156 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="266" width="262" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="283" text-anchor="middle" font-size="12" fill="#333">ans ← ans − f(n−3L)</text>
  <text x="156" y="300" text-anchor="middle" font-size="10" fill="#b85450">减：3 人都超限</text>
  <path d="M 156 308 L 156 316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="320" width="262" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="156" y="343" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出 ans</text>

  <!-- f helper -->
  <rect x="330" y="48" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="405" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算 f(m)</text>
  <path d="M 405 80 L 405 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <polygon points="405,94 452,120 405,146 358,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="124" text-anchor="middle" font-size="11" fill="#333">m &lt; 0 ?</text>
  <path d="M 358 120 L 340 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="351" y="112" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <text x="304" y="124" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <path d="M 405 146 L 405 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="416" y="156" font-size="10" fill="#4a7a3a">否</text>
  <rect x="330" y="162" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="181" text-anchor="middle" font-size="12" fill="#333">(m+1)(m+2) / 2</text>

  <!-- note box -->
  <rect x="300" y="215" width="205" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="402" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全程 O(1)</text>
  <text x="402" y="262" text-anchor="middle" font-size="10" fill="#555">4 次 f 闭式计算</text>
  <text x="402" y="280" text-anchor="middle" font-size="10" fill="#555">无循环、无 DP 数组</text>
  <text x="402" y="298" text-anchor="middle" font-size="10" fill="#555">n, limit ≤ 10⁹ 稳过</text>
</svg>
