<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两对角线共中点 + 等长 → 矩形</text>

  <!-- coordinate axes -->
  <path d="M 60 330 L 330 330" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <path d="M 80 350 L 80 70" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <text x="336" y="334" font-size="11" fill="#aaa">x</text>
  <text x="76" y="66" font-size="11" fill="#aaa">y</text>

  <!-- grid ticks: x=0,1,2,3 ; y=0,1,2,3,4 -->
  <!-- origin (0,0) -> pixel (140, 300), scale 40px per unit -->
  <text x="140" y="346" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="180" y="346" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="346" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="132" y="304" text-anchor="end" font-size="9" fill="#aaa">0</text>
  <text x="132" y="264" text-anchor="end" font-size="9" fill="#aaa">1</text>
  <text x="132" y="224" text-anchor="end" font-size="9" fill="#aaa">2</text>
  <text x="132" y="184" text-anchor="end" font-size="9" fill="#aaa">3</text>
  <text x="132" y="144" text-anchor="end" font-size="9" fill="#aaa">4</text>

  <!-- rectangle fill (tilted, not axis-aligned) -->
  <!-- p1=(0,0)->(140,300), p2=(3,1)->(260,260), p3=(2,4)->(220,140), p4=(-1,3)->(100,180) -->
  <polygon points="140,300 260,260 220,140 100,180" fill="#e8f0fe" fill-opacity="0.45" stroke="#6a9acc" stroke-width="2" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <!-- diagonal 1: p1(0,0) -> p3(2,4) -->
  <path d="M 140 300 L 220 140" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- diagonal 2: p2(3,1) -> p4(-1,3) -->
  <path d="M 260 260 L 100 180" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- midpoint M = (1,2) -> (180, 220) -->
  <circle cx="180" cy="220" r="6" fill="#82b366" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="216" font-size="12" fill="#4a7a3a" font-weight="bold">M（共中点）</text>

  <!-- equal-length tick marks near midpoint on each diagonal -->
  <text x="150" y="250" font-size="10" fill="#d6a040" font-weight="bold">|d₁|²=20</text>
  <text x="210" y="200" font-size="10" fill="#b85450" font-weight="bold">|d₂|²=20</text>

  <!-- vertices -->
  <circle cx="140" cy="300" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="100" y="314" font-size="10.5" fill="#446688" font-weight="bold">p₁(0,0)</text>

  <circle cx="260" cy="260" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="268" y="258" font-size="10.5" fill="#446688" font-weight="bold">p₂(3,1)</text>

  <circle cx="220" cy="140" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="228" y="136" font-size="10.5" fill="#446688" font-weight="bold">p₃(2,4)</text>

  <circle cx="100" cy="180" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="174" font-size="10.5" fill="#446688" font-weight="bold">p₄(−1,3)</text>

  <!-- diagonal labels -->
  <text x="165" y="180" font-size="9.5" fill="#d6a040">对角线①</text>
  <text x="150" y="232" font-size="9.5" fill="#b85450">对角线②</text>

  <!-- right side: key + area formula -->
  <rect x="360" y="80" width="170" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="445" y="102" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">分组键 key</text>
  <line x1="372" y1="110" x2="518" y2="110" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="128" text-anchor="middle" font-size="10" fill="#555">key = (cx, cy, d²)</text>
  <text x="372" y="144" font-size="9.5" fill="#555">cx = x₁ + x₃</text>
  <text x="372" y="158" font-size="9.5" fill="#555">cy = y₁ + y₃</text>
  <text x="372" y="172" font-size="9.5" fill="#555">d² = Δx² + Δy²</text>
  <text x="372" y="192" font-size="9" fill="#82b366">两对角线 key 相同</text>
  <text x="372" y="204" font-size="9" fill="#82b366">→ 共中点 + 等长</text>

  <rect x="360" y="225" width="170" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="445" y="247" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">面积公式</text>
  <line x1="372" y1="255" x2="518" y2="255" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="445" y="275" text-anchor="middle" font-size="10" fill="#333">area = ½ |d₁ × d₂|</text>
  <text x="445" y="293" text-anchor="middle" font-size="9" fill="#555">= ½ |Δx₁·Δy₂ − Δy₁·Δx₂|</text>
  <text x="445" y="311" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">本例 = ½·20 = 10</text>

  <!-- note about tilted -->
  <rect x="60" y="352" width="270" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="195" y="367" text-anchor="middle" font-size="9.5" fill="#b85450">⚠ 边可任意倾斜（与 939 轴对齐版不同）</text>
</svg>
