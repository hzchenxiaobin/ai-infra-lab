<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[3,1,4,2,5] 上的一次改值与一次查询</text>

  <!-- ① 初始化 -->
  <text x="24" y="48" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <rect x="110" y="54" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="54" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="176" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="54" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="73" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="248" y="54" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="294" y="54" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="130" y="94" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="176" y="94" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="222" y="94" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="268" y="94" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="314" y="94" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="110" y="100" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <rect x="156" y="100" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="176" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="202" y="100" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="116" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="100" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="294" y="100" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="314" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <text x="344" y="68" font-size="10" fill="#555" filter="url(#rough2)">p[2]=1：4&gt;1 且 4&gt;2</text>
  <text x="344" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">→ BIT.add(3, +1)</text>

  <!-- ② 改值 -->
  <text x="24" y="148" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② [2,3,4]：nums[3] ← 4</text>
  <rect x="110" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="176" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="248" y="154" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="173" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="294" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="190" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="206" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <rect x="156" y="190" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="176" y="206" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="202" y="190" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="222" y="206" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1→0</text>
  <rect x="248" y="190" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="206" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="294" y="190" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="314" y="206" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <text x="344" y="166" font-size="10" fill="#555" filter="url(#rough2)">refresh(2)：4&gt;4 不成立</text>
  <text x="344" y="184" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ add(3, −1)，p[2]=0</text>
  <text x="344" y="202" font-size="10" fill="#888" filter="url(#rough2)">refresh(3)(4)：不变 / 跳过</text>

  <!-- ③ 查询 -->
  <text x="24" y="248" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ [1,0,4]：数开区间 (0,4)</text>
  <rect x="151" y="255" width="142" height="34" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <rect x="110" y="260" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="276" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <rect x="156" y="260" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="202" y="260" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="248" y="260" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="294" y="260" width="40" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="314" y="276" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">×</text>
  <text x="344" y="276" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = pre(4) − pre(1) = 0</text>

  <!-- 结果框 -->
  <rect x="50" y="300" width="420" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = [0] ✓</text>
  <text x="260" y="335" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">—— [3,1,4,4,5] 相邻相等，没有严格大于两侧的元素</text>

  <!-- 对照示例 2 -->
  <rect x="40" y="352" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">对照示例 2 [4,1,4,2,1,5]：初始 p[2]=1（4&gt;1 且 4&gt;2）</text>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">查询 [1,0,4] → 1；查询 [1,0,2] → 0（输出 [0,1] ✓）</text>
</svg>
