<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：O(n·k) 双重循环 + 滚动数组</text>

  <!-- 关键提醒框 -->
  <rect x="412" y="42" width="102" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="60" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">转移全读</text>
  <text x="463" y="75" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">昨天的 f ⇒</text>
  <text x="463" y="90" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">同一天最多</text>
  <text x="463" y="105" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一次操作</text>

  <!-- 初始化 -->
  <rect x="150" y="42" width="220" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">初始化（第 0 天开盘前）</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[0][0] = 0，其余 = −∞</text>

  <path d="M260,90 L260,104" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="115" y="108" width="290" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">外层：i = 0 … n−1，p = prices[i]</text>

  <path d="M260,146 L260,160" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <rect x="85" y="164" width="350" height="116" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">内层：j = 0 … k，三状态各一次松弛</text>
  <text x="260" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g[j][0] = max(f[j][0], f[j−1][1] + p, f[j−1][2] − p)</text>
  <text x="260" y="225" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g[j][1] = max(f[j][1], f[j][0] − p)</text>
  <text x="260" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g[j][2] = max(f[j][2], f[j][0] + p)</text>
  <text x="260" y="264" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">算完一天后 f ← g（滚动数组，只留前一天）</text>

  <path d="M260,280 L260,294" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,298 352,332 260,366 168,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">还有下一天？</text>
  <text x="260" y="345" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">（i 未到 n−1）</text>

  <!-- 循环回边 -->
  <path d="M352,332 C470,332 470,127 410,127" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="375" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 否 -->
  <path d="M260,366 L260,382" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="274" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 输出 -->
  <rect x="95" y="386" width="250" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="411" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">答案 = max(0 ≤ j ≤ k) f[j][0]</text>

  <!-- 复杂度注释 -->
  <rect x="365" y="386" width="145" height="40" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="437" y="403" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">时间 O(n·k) ≈ 5×10⁵</text>
  <text x="437" y="418" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">空间 O(k)（滚动）</text>
</svg>
