<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">inc / dec 操作流程</text>
  <path d="M 320 38 Q 450 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== INC column (left) ===== -->
  <text x="230" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">inc(key)</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="150" y="78" width="160" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="230" y="101" text-anchor="middle" font-size="11" fill="#2e6e2e">keyTable 查 key</text>

  <!-- decision: exists? -->
  <path d="M 230 114 L 230 130" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 230 130 L 300 160 L 230 190 L 160 160 Z" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="155" text-anchor="middle" font-size="10" fill="#7a5415">key 存在?</text>
  <text x="230" y="168" text-anchor="middle" font-size="10" fill="#7a5415">count+1</text>

  <!-- NO branch: new key, count=1 -->
  <path d="M 160 160 L 110 160 L 110 210" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="100" y="180" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="40" y="214" width="150" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="115" y="234" text-anchor="middle" font-size="10" fill="#444">head.next.count==1 ?</text>
  <text x="115" y="250" text-anchor="middle" font-size="10" fill="#444">→ 加入该桶；否则插新桶</text>
  <text x="115" y="284" text-anchor="middle" font-size="9" fill="#888">新 count=1 桶恒在 head 端</text>

  <!-- YES branch: inc existing -->
  <path d="M 300 160 L 350 160 L 350 210" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="180" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="270" y="214" width="160" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="350" y="237" text-anchor="middle" font-size="10" fill="#444">从 oldB.keys 删 key</text>

  <path d="M 350 250 L 350 266" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 350 266 L 420 296 L 350 326 L 280 296 Z" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="350" y="292" text-anchor="middle" font-size="10" fill="#7a5415">next.count==</text>
  <text x="350" y="305" text-anchor="middle" font-size="10" fill="#7a5415">old+1 ?</text>

  <!-- next matches -->
  <path d="M 420 296 L 460 296 L 460 336" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="445" y="290" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="395" y="340" width="130" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="460" y="362" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 next 桶</text>

  <!-- next doesn't match -->
  <path d="M 280 296 L 245 296 L 245 336" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="290" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="170" y="340" width="150" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="245" y="362" text-anchor="middle" font-size="10" fill="#b85450">插新桶(old+1)于 oldB 后</text>

  <!-- converge: cleanup -->
  <path d="M 460 374 L 460 394 L 245 394 L 245 410" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 374 L 245 410" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="170" y="414" width="160" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="250" y="437" text-anchor="middle" font-size="10" fill="#444">oldB 空? → 摘除; 更新 map</text>

  <!-- ===== DEC column (right) ===== -->
  <text x="680" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">dec(key)  (key 必存在)</text>

  <g filter="url(#sk)">
    <rect x="600" y="78" width="160" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="680" y="101" text-anchor="middle" font-size="11" fill="#b85450">oldB = keyTable[key]</text>

  <path d="M 680 114 L 680 130" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="600" y="134" width="160" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="680" y="157" text-anchor="middle" font-size="10" fill="#444">从 oldB.keys 删 key</text>

  <path d="M 680 170 L 680 186" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 680 186 L 750 216 L 680 246 L 610 216 Z" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="680" y="212" text-anchor="middle" font-size="10" fill="#7a5415">newCount</text>
  <text x="680" y="225" text-anchor="middle" font-size="10" fill="#7a5415">== 0 ?</text>

  <!-- yes: remove -->
  <path d="M 610 216 L 565 216 L 565 260" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="575" y="240" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="490" y="264" width="150" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="565" y="286" text-anchor="middle" font-size="10" fill="#2e6e2e">map.erase(key) 彻底移除</text>

  <!-- no: check prev -->
  <path d="M 750 216 L 795 216 L 795 260" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="780" y="240" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <path d="M 795 260 L 865 290 L 795 320 L 725 290 Z" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="795" y="286" text-anchor="middle" font-size="10" fill="#7a5415">prev.count==</text>
  <text x="795" y="299" text-anchor="middle" font-size="10" fill="#7a5415">old−1 ?</text>

  <!-- prev matches -->
  <path d="M 725 290 L 690 290 L 690 330" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="700" y="320" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="630" y="334" width="120" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="690" y="356" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 prev 桶</text>

  <!-- prev doesn't match -->
  <path d="M 865 290 L 895 290 L 895 330" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="885" y="320" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="810" y="334" width="80" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="850" y="350" text-anchor="middle" font-size="9" fill="#b85450">插新桶</text>
  <text x="850" y="362" text-anchor="middle" font-size="9" fill="#b85450">(old−1)于 oldB 前</text>

  <!-- converge: cleanup -->
  <path d="M 690 368 L 690 392 L 565 392" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 850 368 L 850 392 L 565 392" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 565 298 L 565 410" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="480" y="414" width="180" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="570" y="437" text-anchor="middle" font-size="10" fill="#444">oldB 空? → 摘除; newCount&gt;0 则更新 map</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="470" width="820" height="56" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="494" font-size="12" font-weight="bold" fill="#444">O(1) 的根源：</text>
  <text x="60" y="514" font-size="11" fill="#444">每个分支只做 哈希查询 + 集合增删 + 链表指针操作，且新桶位置只看 next/prev 一个相邻桶（±1 保证），无遍历无排序</text>
</svg>
