<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 漫灌</text>

  <!-- start -->
  <rect x="200" y="48" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12" fill="#333">调用 dfs(sr, sc)</text>

  <path d="M 270 86 L 270 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: orig == color? -->
  <polygon points="270,112 370,152 270,192 170,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#333">orig == color ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#333">(起点色 == 新色)</text>

  <!-- yes branch: return -->
  <path d="M 370 152 L 410 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="134" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="157" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">直接返回 image</text>
  <text x="465" y="180" text-anchor="middle" font-size="9.5" fill="#b85450">否则会无限递归！</text>

  <!-- no branch -->
  <path d="M 270 192 L 270 214" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="208" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- dfs body box -->
  <rect x="60" y="218" width="420" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(i, j) 递归体</text>

  <text x="80" y="262" font-size="11.5" fill="#333">1. 越界或 grid[i][j] != orig → return</text>
  <text x="80" y="282" font-size="11.5" fill="#333">2. grid[i][j] = color   （改色即标记 visited）</text>
  <text x="80" y="302" font-size="11.5" fill="#333">3. 对 4 方向 (上/下/左/右) 各递归 dfs(ni, nj)</text>
  <text x="80" y="322" font-size="11" fill="#b85450">注：先改色再递归，邻居不会再回头染本格</text>

  <path d="M 270 338 L 270 358" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="180" y="358" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 image（漫灌完成）</text>
</svg>
