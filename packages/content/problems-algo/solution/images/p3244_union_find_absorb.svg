<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrgr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arror" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">并查集吸收：find(x) = 从 x 向右第一个还活着的点</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">已有查询 (0,3)、(3,6) 吸收了 1、2、4、5；现在加入新查询 (0,6)</text>

  <!-- 新查询弧 (0,6) -->
  <path d="M 50 104 Q 239 50 420 104" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="239" y="66" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,6) 新查询</text>

  <!-- 链 0..7（y=118），灰点：1,2,4,5 -->
  <circle cx="50" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="113" cy="118" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="176" cy="118" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="239" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="302" cy="118" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="365" cy="118" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="428" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="491" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="113" y="122" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="176" y="122" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="239" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="302" y="122" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="365" y="122" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="428" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="491" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <!-- 灰点划掉线 -->
  <path d="M 105 126 L 121 110" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 168 126 L 184 110" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 294 126 L 310 110" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 357 126 L 373 110" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 节点 3 的吸收高亮 -->
  <circle cx="239" cy="118" r="19" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="268" y="98" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吸收 3</text>

  <!-- fa 指针：灰点 → 右边第一个活点 -->
  <path d="M 113 135 Q 150 165 226 135" stroke="#a07830" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arror)" filter="url(#rough2)"/>
  <path d="M 176 135 Q 205 158 226 135" stroke="#a07830" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arror)" filter="url(#rough2)"/>
  <path d="M 302 135 Q 340 165 415 135" stroke="#a07830" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arror)" filter="url(#rough2)"/>
  <path d="M 365 135 Q 395 158 415 135" stroke="#a07830" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arror)" filter="url(#rough2)"/>
  <text x="152" y="178" font-size="10" fill="#a07830" filter="url(#rough2)">find(1) = 3</text>
  <text x="345" y="178" font-size="10" fill="#a07830" filter="url(#rough2)">find(4) = 6</text>
  <text x="260" y="196" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">fa[x] ≠ x 表示 x 已灰；find 沿指针向右「逃」到活点</text>

  <!-- 吸收三步 -->
  <rect x="48" y="208" width="424" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="232" font-size="10.5" fill="#33506b" filter="url(#rough2)">① x ← find(0+1) = find(1) = 3　（1、2 已灰，指针直接落到 3）</text>
  <text x="68" y="254" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 3 &lt; 6 → 吸收 3（橙色圈）：skipped++，fa[3] ← 4</text>
  <text x="68" y="276" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ x ← find(4) = 6；6 &lt; 6 不成立 → 停。skipped：4 → 5</text>

  <!-- 结论 -->
  <rect x="48" y="310" width="424" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">每个点一生只灰一次 → 总吸收 ≤ n 次，find 均摊近常数，整体 O(n+q)</text>
</svg>
