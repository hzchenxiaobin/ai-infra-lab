<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定中间元素 j，左右两侧独立取最大</text>

  <!-- 上方箭头与标注：left / right 的来源 -->
  <path d="M 214 82 C 240 56, 300 56, 326 80" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="268" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">价格 2 &lt; 3 ✓ → left = 2</text>
  <path d="M 474 82 C 448 56, 388 56, 362 80" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="418" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">价格 4 &gt; 3 ✓ → right = 10</text>

  <!-- 商品卡片：prices=[10,2,3,4], profits=[100,2,7,10] -->
  <rect x="36" y="84" width="96" height="58" fill="#ffffff" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="106" text-anchor="middle" font-size="13" fill="#999">价 10</text>
  <text x="84" y="126" text-anchor="middle" font-size="13" fill="#999">利 100</text>

  <rect x="166" y="84" width="96" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="214" y="106" text-anchor="middle" font-size="13" fill="#333">价 2</text>
  <text x="214" y="126" text-anchor="middle" font-size="13" fill="#333">利 2</text>

  <rect x="296" y="84" width="96" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="344" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">价 3</text>
  <text x="344" y="126" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">利 7</text>

  <rect x="426" y="84" width="96" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="474" y="106" text-anchor="middle" font-size="13" fill="#333">价 4</text>
  <text x="474" y="126" text-anchor="middle" font-size="13" fill="#333">利 10</text>

  <!-- 下标标签 -->
  <text x="84" y="158" text-anchor="middle" font-size="11" fill="#999">下标 0</text>
  <text x="214" y="158" text-anchor="middle" font-size="11" fill="#d6a040">下标 1</text>
  <text x="344" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">下标 2（j）</text>
  <text x="474" y="158" text-anchor="middle" font-size="11" fill="#446688">下标 3</text>

  <!-- 下标 0 的注释 -->
  <text x="84" y="178" text-anchor="middle" font-size="10" fill="#b85450">价格 10 全场最高</text>
  <text x="84" y="192" text-anchor="middle" font-size="10" fill="#b85450">→ 谁也组不了队</text>

  <!-- left / right 定义框 -->
  <rect x="36" y="208" width="246" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left(j)：j 左侧价格 &lt; prices[j]</text>
  <text x="159" y="248" text-anchor="middle" font-size="11" fill="#555">的商品里，利润的最大值</text>
  <text x="159" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">此处 = 2（只有下标 1 满足）</text>

  <rect x="298" y="208" width="246" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="421" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right(j)：j 右侧价格 &gt; prices[j]</text>
  <text x="421" y="248" text-anchor="middle" font-size="11" fill="#555">的商品里，利润的最大值</text>
  <text x="421" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">此处 = 10（只有下标 3 满足）</text>

  <!-- 候选公式框 -->
  <rect x="36" y="288" width="508" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">候选利润 = left + profits[j] + right = 2 + 7 + 10 = 19</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#555">枚举所有 j（1 ≤ j ≤ n−2），取候选最大值 → 答案 19</text>

  <!-- 利润王为何落选 -->
  <rect x="36" y="360" width="508" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠️ 利润王（下标 0，利润 100）为什么进不了组？</text>
  <text x="290" y="398" text-anchor="middle" font-size="11" fill="#555">当 i 需右侧有更贵商品（没有）；当 j / k 需左侧有更便宜商品（也没有）</text>
  <text x="290" y="414" text-anchor="middle" font-size="11" fill="#555">—— 链式价格约束下，光利润高没用</text>
</svg>
