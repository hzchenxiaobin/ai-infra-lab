<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：5 邮箱 → 3 组</text>

  <!-- table header -->
  <text x="30" y="58" font-size="10.5" fill="#888" font-weight="bold">编号分配：</text>
  <rect x="30" y="66" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="81" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">idx</text>
  <rect x="70" y="66" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="81" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">email</text>
  <rect x="240" y="66" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="81" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">name</text>
  <rect x="310" y="66" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="365" y="81" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">所属账户</text>

  <!-- row 0 -->
  <rect x="30" y="88" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="103" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <rect x="70" y="88" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="103" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">johnsmith</text>
  <rect x="240" y="88" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="103" text-anchor="middle" font-size="10.5" fill="#333">John</text>
  <rect x="310" y="88" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="103" text-anchor="middle" font-size="10" fill="#555">acc#1, acc#2</text>

  <!-- row 1 -->
  <rect x="30" y="110" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="125" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="70" y="110" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="125" text-anchor="middle" font-size="10" fill="#333">john_newyork</text>
  <rect x="240" y="110" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="125" text-anchor="middle" font-size="10.5" fill="#333">John</text>
  <rect x="310" y="110" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="125" text-anchor="middle" font-size="10" fill="#555">acc#1</text>

  <!-- row 2 -->
  <rect x="30" y="132" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="147" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="70" y="132" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="147" text-anchor="middle" font-size="10" fill="#333">john00</text>
  <rect x="240" y="132" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="147" text-anchor="middle" font-size="10.5" fill="#333">John</text>
  <rect x="310" y="132" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="147" text-anchor="middle" font-size="10" fill="#555">acc#2</text>

  <!-- row 3 -->
  <rect x="30" y="154" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="169" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <rect x="70" y="154" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="169" text-anchor="middle" font-size="10" fill="#333">mary</text>
  <rect x="240" y="154" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="169" text-anchor="middle" font-size="10.5" fill="#333">Mary</text>
  <rect x="310" y="154" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="169" text-anchor="middle" font-size="10" fill="#555">acc#3</text>

  <!-- row 4 -->
  <rect x="30" y="176" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="191" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="70" y="176" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="191" text-anchor="middle" font-size="10" fill="#333">johnnybravo</text>
  <rect x="240" y="176" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="191" text-anchor="middle" font-size="10.5" fill="#333">John</text>
  <rect x="310" y="176" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="191" text-anchor="middle" font-size="10" fill="#555">acc#4</text>

  <!-- union section -->
  <text x="30" y="222" font-size="10.5" fill="#888" font-weight="bold">union（与账户第一个邮箱合并）：</text>

  <rect x="30" y="230" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="10.5" fill="#333">acc#1: union(0, 1)</text>
  <text x="200" y="246" font-size="10" fill="#446688">→ parent[0]=1</text>

  <rect x="30" y="256" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="272" font-size="10.5" fill="#333">acc#2: union(0, 2)</text>
  <text x="200" y="272" font-size="10" fill="#446688">→ parent[2]=1</text>

  <rect x="30" y="282" width="280" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="298" font-size="10.5" fill="#888">acc#3 / acc#4：单邮箱，跳过</text>

  <!-- parent array state -->
  <text x="30" y="326" font-size="10.5" fill="#888" font-weight="bold">parent[]（压缩后根标在第二行）：</text>
  <rect x="30" y="334" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="70" y="334" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="110" y="334" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="150" y="334" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="190" y="334" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <text x="50" y="372" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="90" y="372" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="130" y="372" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="170" y="372" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="210" y="372" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- grouping -->
  <text x="30" y="396" font-size="10.5" fill="#888" font-weight="bold">按根分组 → 排序输出：</text>

  <rect x="30" y="404" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="40" y="420" font-size="10" fill="#b85450" font-weight="bold">根1: John</text>
  <text x="40" y="434" font-size="9.5" fill="#555">john00, john_newyork, johnsmith</text>

  <rect x="220" y="404" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="420" font-size="10" fill="#4a7a3a" font-weight="bold">根3: Mary</text>
  <text x="230" y="434" font-size="9.5" fill="#555">mary</text>

  <rect x="350" y="404" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360" y="420" font-size="10" fill="#d6a040" font-weight="bold">根4: John（独立人）</text>
  <text x="360" y="434" font-size="9.5" fill="#555">johnnybravo</text>
</svg>
