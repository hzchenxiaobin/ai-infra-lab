<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：槽提取 → 长度过滤 → 双向匹配</text>

  <!-- Step 1 -->
  <rect x="170" y="46" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 收集所有槽</text>
  <text x="300" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">逐行 + 逐列，按 '#' 切分得连续非 # 段</text>
  <path d="M 300 90 L 300 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="170" y="114" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="132" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 长度过滤</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">只保留 len(seg) == len(word) 的槽</text>
  <path d="M 300 158 L 300 178" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="170" y="182" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 对每个候选槽双向匹配</text>
  <text x="300" y="216" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">match(seg, word) 或 match(seg, word[::-1])</text>
  <path d="M 300 226 L 300 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="300,254 410,300 300,346 190,300" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">存在相容槽?</text>
  <text x="300" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（每个字母：空格或相同）</text>

  <!-- Yes branch -> right -->
  <path d="M 410 300 L 470 300" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="438" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="474" y="282" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="524" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- No branch -> down -->
  <path d="M 300 346 L 300 370" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="362" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 4 -->
  <rect x="170" y="374" width="260" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 所有候选槽都不相容</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">return false</text>

  <!-- Note -->
  <rect x="40" y="426" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="443" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">水平、竖直各扫一遍即可；正读覆盖左→右/上→下，反读覆盖右→左/下→上</text>
</svg>
