<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2734w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：跳过 a 后递减非 a 段</text>

  <!-- Example 1: cbabc -->
  <text x="30" y="54" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "cbabc"</text>
  <text x="30" y="70" font-size="9" fill="#888">无前导 a，从首字 c 起递减，遇 a(index 2) 即停：</text>

  <rect x="30" y="76" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="50" y="97" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="70" y="76" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="90" y="97" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="110" y="76" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="130" y="97" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="150" y="76" width="40" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">b</text>
  <rect x="190" y="76" width="40" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="210" y="97" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">c</text>
  <text x="240" y="97" font-size="9" fill="#888">→ b a</text>

  <path d="M120,114 L120,124" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2734w)" filter="url(#rough2)"/>

  <rect x="30" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="50" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="70" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="90" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="110" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="130" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="150" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="190" y="128" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="210" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="240" y="128" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"baabc" ✓</text>

  <!-- Example 2: acbbc -->
  <text x="30" y="182" font-size="12" fill="#446688" font-weight="bold">示例 2：s = "acbbc"</text>
  <text x="30" y="198" font-size="9" fill="#888">跳过前导 a，从 index 1 的 c 起递减到末尾（无 a 阻挡）：</text>

  <rect x="30" y="204" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="225" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="70" y="204" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="90" y="225" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="110" y="204" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="130" y="225" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="150" y="204" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="170" y="225" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="190" y="204" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="210" y="225" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>

  <path d="M130,242 L130,252" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2734w)" filter="url(#rough2)"/>

  <rect x="30" y="256" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="50" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="70" y="256" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="90" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="110" y="256" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="130" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="150" y="256" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="190" y="256" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="210" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="240" y="256" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"abaab" ✓</text>

  <!-- Example 3: leetcode -->
  <text x="30" y="310" font-size="12" fill="#446688" font-weight="bold">示例 3：s = "leetcode"（无 a，整串递减）</text>

  <rect x="30" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l</text>
  <rect x="66" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="84" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="102" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="138" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="174" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="210" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="246" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <rect x="282" y="318" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="330" y="335" font-size="10" fill="#4a7a3a">每个 −1</text>

  <path d="M160,350 L160,360" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2734w)" filter="url(#rough2)"/>

  <rect x="30" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k</text>
  <rect x="66" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="84" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="102" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="138" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="156" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s</text>
  <rect x="174" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="210" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="228" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>
  <rect x="246" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="282" y="366" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="330" y="366" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="395" y="383" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"kddsbncd" ✓</text>

  <!-- Special case: aa -->
  <text x="30" y="416" font-size="12" fill="#b85450" font-weight="bold">特例：s = "aa"（全 a，必须操作一次）</text>
  <rect x="30" y="422" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="50" y="439" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <rect x="70" y="422" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="90" y="439" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="120" y="439" font-size="10" fill="#b85450">改最后一个 a→z</text>
  <path d="M160,435 L190,435" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2734w)" filter="url(#rough2)"/>
  <rect x="200" y="422" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="220" y="439" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="240" y="422" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="260" y="439" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">z</text>
  <rect x="290" y="422" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="335" y="439" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"az" ✓</text>
  <text x="400" y="439" font-size="9" fill="#888">不是 "za"</text>
</svg>
