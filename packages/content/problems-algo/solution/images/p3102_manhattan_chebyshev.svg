<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="dimO" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="dimR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">|a|+|b| = max(|a+b|, |a−b|)：曼哈顿 → 切比雪夫（45° 旋转）</text>

  <!-- 左面板：原坐标 -->
  <rect x="18" y="42" width="218" height="252" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="127" y="64" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">原坐标 (x, y) —— 曼哈顿 L₁</text>
  <path d="M 44 268 L 226 268" stroke="#888" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 44 268 L 44 78" stroke="#888" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="282" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="32" y="84" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <path d="M 70 242 L 148 242 L 148 190" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="70" cy="242" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="256" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">P(1,1)</text>
  <circle cx="148" cy="190" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="184" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Q(4,3)</text>

  <path d="M 74 256 L 144 256" stroke="#b85450" stroke-width="1.3" marker-start="url(#dimR)" marker-end="url(#dimR)" filter="url(#rough2)"/>
  <text x="109" y="266" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">Δx = 3</text>
  <path d="M 160 194 L 160 238" stroke="#4a7a3a" stroke-width="1.3" marker-start="url(#dimG)" marker-end="url(#dimG)" filter="url(#rough2)"/>
  <text x="166" y="220" font-size="9" fill="#4a7a3a" filter="url(#rough2)">Δy = 2</text>

  <text x="127" y="236" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">|Δx|+|Δy| = 5</text>

  <polygon points="186,100 204,118 186,136 168,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="186" y="152" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">L₁ 球 = 菱形</text>

  <!-- 中间箭头 -->
  <path d="M 240 160 L 280 160" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">旋转 45°</text>
  <text x="260" y="178" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">u = x−y</text>
  <text x="260" y="192" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">v = x+y</text>

  <!-- 右面板：新坐标 -->
  <rect x="284" y="42" width="218" height="252" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="393" y="64" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">新坐标 (u, v) —— 切比雪夫 L∞</text>
  <path d="M 310 268 L 492 268" stroke="#888" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 310 268 L 310 78" stroke="#888" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="488" y="282" font-size="10" fill="#888" filter="url(#rough2)">u</text>
  <text x="298" y="84" font-size="10" fill="#888" filter="url(#rough2)">v</text>

  <rect x="310" y="86" width="26" height="130" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="310" cy="216" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="230" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">P′(0,2)</text>
  <circle cx="336" cy="86" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="80" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Q′(1,7)</text>

  <path d="M 312 254 L 334 254" stroke="#b85450" stroke-width="1.3" marker-start="url(#dimR)" marker-end="url(#dimR)" filter="url(#rough2)"/>
  <text x="323" y="248" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">|Δu| = 1</text>
  <path d="M 348 90 L 348 212" stroke="#4a7a3a" stroke-width="1.3" marker-start="url(#dimG)" marker-end="url(#dimG)" filter="url(#rough2)"/>
  <text x="354" y="155" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|Δv| = 5</text>

  <text x="420" y="236" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">max(1,5) = 5</text>

  <rect x="424" y="100" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="152" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">L∞ 球 = 正方形</text>

  <!-- 底部结论 -->
  <rect x="18" y="306" width="484" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">|xᵢ−xⱼ| + |yᵢ−yⱼ| = max(|uᵢ−uⱼ|, |vᵢ−vⱼ|)</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">点集直径 D = max(max u − min u, max v − min v)</text>
  <text x="260" y="364" text-anchor="middle" font-size="10" fill="#a08544" filter="url(#rough2)">—— 两两距离的最大值，只由 4 个极值决定！</text>
</svg>
