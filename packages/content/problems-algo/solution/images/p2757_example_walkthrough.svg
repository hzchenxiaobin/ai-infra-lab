<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：arr=[1,2,3,4,5], steps=[1,2,6], startIndex=0</text>

  <!-- array row drawn 3 times for 3 steps; show index trajectory -->
  <!-- step 1 row -->
  <text x="40" y="74" font-size="11" fill="#888" filter="url(#rough2)">step 1</text>
  <rect x="100" y="56" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="56" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <path d="M125,96 L175,96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="380" y="78" font-size="11.5" fill="#b85450" filter="url(#rough2)">yield arr[1] = 2</text>

  <!-- step 2 row -->
  <text x="40" y="160" font-size="11" fill="#888" filter="url(#rough2)">step 2</text>
  <rect x="100" y="142" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="142" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="142" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="142" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="300" y="142" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <path d="M175,182 L275,182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="194" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+2</text>
  <text x="380" y="164" font-size="11.5" fill="#b85450" filter="url(#rough2)">yield arr[3] = 4</text>

  <!-- step 6 row (wrap) -->
  <text x="40" y="246" font-size="11" fill="#888" filter="url(#rough2)">step 6</text>
  <rect x="100" y="228" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="228" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="228" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="228" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="228" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <!-- wrap arrow: from i=3 over the right end, loop back, land on i=4 -->
  <path d="M275,268 C345,300 360,300 360,242 C360,205 345,210 325,228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="296" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3+6=9, 9%5=4</text>
  <text x="380" y="250" font-size="11.5" fill="#b85450" filter="url(#rough2)">yield arr[4] = 5</text>

  <!-- output -->
  <rect x="60" y="324" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">输出 = [2, 4, 5]</text>

  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">橙色 = 该步起点，红色 = 该步终点（被 yield 的值）</text>
</svg>
