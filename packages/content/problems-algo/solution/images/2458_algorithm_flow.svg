<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M5,1 L1,9 L9,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M5,9 L1,1 L9,1 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：两次 DFS</text>

  <!-- 分隔线 -->
  <line x1="280" y1="50" x2="280" y2="360" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ============ 左：Pass 1 后序（自底向上） ============ -->
  <text x="140" y="62" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">Pass 1：后序 DFS</text>
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">depth 向下传，height 向上传</text>

  <!-- 树边 -->
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" stroke-linecap="round">
    <line x1="140" y1="125" x2="100" y2="185"/>
    <line x1="140" y1="125" x2="180" y2="185"/>
    <line x1="100" y1="185" x2="70" y2="245"/>
  </g>
  <!-- 节点 -->
  <circle cx="140" cy="125" r="16" fill="#fff8e1" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="100" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="180" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="70" cy="245" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 上行箭头（height 回程） -->
  <path d="M78 238 Q105 215 108 198" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M108 178 Q125 155 132 132" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M188 178 Q170 155 148 132" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- depth 标注（向下传，蓝色） -->
  <text x="160" y="120" font-size="10" fill="#446688" filter="url(#rough2)">d=0</text>
  <text x="120" y="180" font-size="10" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="200" y="180" font-size="10" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="90" y="240" font-size="10" fill="#446688" filter="url(#rough2)">d=2</text>

  <!-- 公式 -->
  <rect x="35" y="285" width="210" height="62" rx="8" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">height[u] =</text>
  <text x="140" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + max(height[孩子])</text>
  <text x="140" y="338" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">叶子 height = 0</text>

  <!-- ============ 右：Pass 2 前序（自顶向下） ============ -->
  <text x="420" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">Pass 2：前序 DFS</text>
  <text x="420" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans 向下传，查表 O(1)</text>

  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" stroke-linecap="round">
    <line x1="420" y1="125" x2="380" y2="185"/>
    <line x1="420" y1="125" x2="460" y2="185"/>
    <line x1="380" y1="185" x2="350" y2="245"/>
  </g>
  <circle cx="420" cy="125" r="16" fill="#fff8e1" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="380" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="460" cy="185" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="350" cy="245" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 下行箭头（ans 下传，绿色） -->
  <path d="M412 132 Q395 155 388 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <path d="M388 198 Q370 220 358 238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>

  <!-- ans 标注 -->
  <text x="440" y="120" font-size="10" fill="#d6a040" filter="url(#rough2)">a=-∞</text>
  <text x="402" y="180" font-size="10" fill="#d6a040" filter="url(#rough2)">a=max(-∞,1+0)=1</text>
  <text x="482" y="180" font-size="10" fill="#d6a040" filter="url(#rough2)">a=1</text>

  <!-- 公式 -->
  <rect x="315" y="285" width="210" height="62" rx="8" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[u] = max(</text>
  <text x="420" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[父], depth[u]+height[姐妹])</text>
  <text x="420" y="338" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">无姐妹时用 depth[父]</text>
</svg>
