<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [7,6,5,4,3,2,1,6,10,11]，从右往左一趟</text>

  <!-- table header -->
  <rect x="52" y="40" width="496" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="76" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="126" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="196" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">弹出的下标（值）</text>
  <text x="330" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i]</text>
  <text x="400" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i]−i</text>
  <text x="470" y="56" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">子数组</text>

  <!-- rows: i = 9 down to 0, row height 26 -->
  <g font-size="10.5" fill="#555">
    <rect x="52" y="64" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="81" filter="url(#rough2)">9</text><text x="126" y="81" filter="url(#rough2)">11</text>
    <text x="196" y="81" filter="url(#rough2)">—（栈空）</text><text x="330" y="81" filter="url(#rough2)">10 = n</text>
    <text x="400" y="81" filter="url(#rough2)">1</text><text x="470" y="81" filter="url(#rough2)">[11]</text>

    <rect x="52" y="90" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="107" filter="url(#rough2)">8</text><text x="126" y="107" filter="url(#rough2)">10</text>
    <text x="196" y="107" filter="url(#rough2)">—（11 ≥ 10，不弹）</text><text x="330" y="107" filter="url(#rough2)">9</text>
    <text x="400" y="107" filter="url(#rough2)">1</text><text x="470" y="107" filter="url(#rough2)">[10]</text>

    <rect x="52" y="116" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="133" filter="url(#rough2)">7</text><text x="126" y="133" filter="url(#rough2)">6</text>
    <text x="196" y="133" filter="url(#rough2)">—（10 ≥ 6）</text><text x="330" y="133" filter="url(#rough2)">8</text>
    <text x="400" y="133" filter="url(#rough2)">1</text><text x="470" y="133" filter="url(#rough2)">[6]</text>

    <rect x="52" y="142" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="159" filter="url(#rough2)">6</text><text x="126" y="159" filter="url(#rough2)">1</text>
    <text x="196" y="159" filter="url(#rough2)">—（6 ≥ 1）</text><text x="330" y="159" filter="url(#rough2)">7</text>
    <text x="400" y="159" filter="url(#rough2)">1</text><text x="470" y="159" filter="url(#rough2)">[1]</text>

    <rect x="52" y="168" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="185" filter="url(#rough2)">5</text><text x="126" y="185" filter="url(#rough2)">2</text>
    <text x="196" y="185" filter="url(#rough2)">弹出 6（1 &lt; 2）</text><text x="330" y="185" filter="url(#rough2)">7</text>
    <text x="400" y="185" filter="url(#rough2)">2</text><text x="470" y="185" filter="url(#rough2)">[2,1]</text>

    <rect x="52" y="194" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="211" filter="url(#rough2)">4</text><text x="126" y="211" filter="url(#rough2)">3</text>
    <text x="196" y="211" filter="url(#rough2)">弹出 5（2 &lt; 3）</text><text x="330" y="211" filter="url(#rough2)">7</text>
    <text x="400" y="211" filter="url(#rough2)">3</text><text x="470" y="211" filter="url(#rough2)">[3,2,1]</text>

    <rect x="52" y="220" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="237" filter="url(#rough2)">3</text><text x="126" y="237" filter="url(#rough2)">4</text>
    <text x="196" y="237" filter="url(#rough2)">弹出 4（3 &lt; 4）</text><text x="330" y="237" filter="url(#rough2)">7</text>
    <text x="400" y="237" filter="url(#rough2)">4</text><text x="470" y="237" filter="url(#rough2)">[4,3,2,1]</text>

    <rect x="52" y="246" width="496" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="263" filter="url(#rough2)">2</text><text x="126" y="263" filter="url(#rough2)">5</text>
    <text x="196" y="263" filter="url(#rough2)">弹出 3（4 &lt; 5）</text><text x="330" y="263" filter="url(#rough2)">7</text>
    <text x="400" y="263" filter="url(#rough2)">5</text><text x="470" y="263" filter="url(#rough2)">[5,4,3,2,1]</text>

    <rect x="52" y="272" width="496" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="76" y="289" fill="#555" filter="url(#rough2)">1</text><text x="126" y="289" fill="#555" filter="url(#rough2)">6</text>
    <text x="196" y="289" fill="#555" filter="url(#rough2)">弹出 2（5 &lt; 6）；6 = 6 不弹</text>
    <text x="330" y="289" fill="#555" filter="url(#rough2)">7</text>
    <text x="400" y="289" fill="#555" filter="url(#rough2)">6</text><text x="470" y="289" fill="#555" filter="url(#rough2)">[6,…,1,6]</text>

    <rect x="52" y="298" width="496" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="76" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="126" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
    <text x="196" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">弹出 1、7（6 &lt; 7）；10 ≥ 7 停</text>
    <text x="330" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
    <text x="400" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 ★</text>
    <text x="470" y="315" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[7,…,1,6]</text>
  </g>

  <!-- key step annotation -->
  <path d="M 470 311 Q 510 311 520 296" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary box -->
  <rect x="60" y="338" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="360" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max{1,1,1,1,2,3,4,5,6,8} = 8，即 [7,6,5,4,3,2,1,6]</text>

  <!-- footnotes -->
  <text x="30" y="392" font-size="10.5" fill="#999" filter="url(#rough2)">注意 i=1 那行：相等的 6（下标 7）不会被弹出，R[1] = 7 —— 「下一个更大或相等」里相等也当墙</text>
  <text x="30" y="410" font-size="10.5" fill="#999" filter="url(#rough2)">每个下标至多入栈一次、出栈一次，整趟均摊 O(n)</text>
</svg>
