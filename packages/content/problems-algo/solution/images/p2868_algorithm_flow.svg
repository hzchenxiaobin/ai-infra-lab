<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">双指针贪心模拟：永远出「最小的紧密更大词」</text>

  <!-- start -->
  <rect x="170" y="38" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="300" y="74" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">w = a[0]（开局词）；i = 1，j = 0；轮到 Bob</text>

  <path d="M 300 82 L 300 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="300,94 398,126 300,158 202,126" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="122" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">当前方指针</text>
  <text x="300" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">到头了吗？</text>

  <path d="M 398 126 L 424 126" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="411" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="426" y="100" width="166" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="509" y="118" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">当前方判负！</text>
  <text x="509" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Bob 烧完 → true（Alice 胜）</text>
  <text x="509" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Alice 烧完 → false</text>

  <path d="M 300 158 L 300 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="170" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- take candidate -->
  <rect x="182" y="178" width="236" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取候选词 t = 当前方数组[p]</text>

  <path d="M 300 214 L 300 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="300,228 408,268 300,308 192,268" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">首字母相同 且 t &gt; w ？</text>
  <text x="300" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">或 首字母恰好大 1 ？</text>

  <path d="M 408 268 L 434 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="421" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="436" y="246" width="152" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="512" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w = t</text>
  <text x="512" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">交换行动方</text>

  <path d="M 512 290 L 512 346 L 420 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 300 308 L 300 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="324" font-size="10.5" fill="#999" filter="url(#rough2)">否（跳过）</text>

  <!-- advance pointer -->
  <rect x="182" y="334" width="236" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="357" text-anchor="middle" font-size="11.5" fill="#7a5c10" filter="url(#rough2)">p ← p + 1（用掉，或永久跳过）</text>

  <!-- loop back -->
  <path d="M 182 352 L 118 352 L 118 126 L 198 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="246" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下一轮</text>

  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">判定口诀：首字母落后 / 领先 ≥ 2 → 不可出；恰好 +1 → 必可出（字典序必然更大）；相同 → 再比字符串</text>
  <text x="300" y="424" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">被跳过的词：要么 ≤ w 永久作废，要么说明本轮已必死 —— 指针从不回退</text>
</svg>
