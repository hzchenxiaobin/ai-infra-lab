<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="460" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：逐节点 DFS 复制 + 映射修正</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#666">输入 root = [[1,null],null,[4,3],[7,0],[5,null]] —— 前序 DFS：1 → 4 → 7 → 5</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="74" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="80" y="74" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="74" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="300" y="74" width="130" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="430" y="74" width="400" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="55" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#234">步</text>
  <text x="135" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#234">访问 old</text>
  <text x="245" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#234">创建 new</text>
  <text x="365" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#234">map 登记映射</text>
  <text x="630" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#234">设置 new 的指针</text>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="106" width="50" height="34" rx="4" fill="#fff" stroke="#ccc"/>
    <rect x="80" y="106" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="106" width="110" height="34" rx="4" fill="#bfe0bf" stroke="#4a8e4a"/>
    <rect x="300" y="106" width="130" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="430" y="106" width="400" height="34" rx="4" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="55" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <text x="135" y="128" text-anchor="middle" font-size="12" fill="#234">1</text>
  <text x="245" y="128" text-anchor="middle" font-size="12" fill="#2e6e2e">1'</text>
  <text x="365" y="128" text-anchor="middle" font-size="11" fill="#7a5415">1 → 1'</text>
  <text x="448" y="128" font-size="11" fill="#666">（根节点，先登记再递归）</text>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="144" width="50" height="34" rx="4" fill="#fff" stroke="#ccc"/>
    <rect x="80" y="144" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="144" width="110" height="34" rx="4" fill="#bfe0bf" stroke="#4a8e4a"/>
    <rect x="300" y="144" width="130" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="430" y="144" width="400" height="34" rx="4" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="55" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="135" y="166" text-anchor="middle" font-size="12" fill="#234">4</text>
  <text x="245" y="166" text-anchor="middle" font-size="12" fill="#2e6e2e">4'</text>
  <text x="365" y="166" text-anchor="middle" font-size="11" fill="#7a5415">4 → 4'</text>
  <text x="448" y="166" font-size="11" fill="#444">1'.right = dfs(4) = 4'</text>

  <!-- 行 3 -->
  <g filter="url(#sk)">
    <rect x="30" y="182" width="50" height="34" rx="4" fill="#fff" stroke="#ccc"/>
    <rect x="80" y="182" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="182" width="110" height="34" rx="4" fill="#bfe0bf" stroke="#4a8e4a"/>
    <rect x="300" y="182" width="130" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="430" y="182" width="400" height="34" rx="4" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="55" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <text x="135" y="204" text-anchor="middle" font-size="12" fill="#234">7</text>
  <text x="245" y="204" text-anchor="middle" font-size="12" fill="#2e6e2e">7'</text>
  <text x="365" y="204" text-anchor="middle" font-size="11" fill="#7a5415">7 → 7'</text>
  <text x="448" y="204" font-size="11" fill="#444">4'.left = dfs(7) = 7'</text>

  <!-- 行 4 -->
  <g filter="url(#sk)">
    <rect x="30" y="220" width="50" height="34" rx="4" fill="#fff" stroke="#ccc"/>
    <rect x="80" y="220" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="220" width="110" height="34" rx="4" fill="#bfe0bf" stroke="#4a8e4a"/>
    <rect x="300" y="220" width="130" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="430" y="220" width="400" height="34" rx="4" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="55" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="135" y="242" text-anchor="middle" font-size="12" fill="#234">5</text>
  <text x="245" y="242" text-anchor="middle" font-size="12" fill="#2e6e2e">5'</text>
  <text x="365" y="242" text-anchor="middle" font-size="11" fill="#7a5415">5 → 5'</text>
  <text x="448" y="242" font-size="11" fill="#444">4'.right = dfs(5) = 5'</text>

  <!-- 行 5：random 修正 -->
  <g filter="url(#sk)">
    <rect x="30" y="258" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="80" y="258" width="110" height="34" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="190" y="258" width="110" height="34" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="300" y="258" width="130" height="34" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="430" y="258" width="400" height="34" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="55" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="135" y="280" text-anchor="middle" font-size="11" fill="#888">回溯</text>
  <text x="245" y="280" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="365" y="280" text-anchor="middle" font-size="11" fill="#888">查 map</text>
  <text x="448" y="274" font-size="11" fill="#b85450">4'.random = map[4.random] = map[7] = 7'</text>
  <text x="448" y="288" font-size="11" fill="#b85450">7'.random = map[7.random] = map[1] = 1'</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="30" y="308" width="800" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="50" y="332" font-size="12" font-weight="bold" fill="#2e5e2e">结果：新树结构与原树一致，所有 random 已修正为新节点</text>
  <text x="50" y="350" font-size="11" fill="#444">1'(rnd=null) → right=4'(rnd=7') → {left=7'(rnd=1'), right=5'(rnd=null)}</text>

  <!-- 关键提示 -->
  <g filter="url(#sk)">
    <rect x="30" y="376" width="800" height="68" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="50" y="400" font-size="12" font-weight="bold" fill="#7a5415">关键细节：先登记 map[old]=new，再递归子树</text>
  <text x="50" y="418" font-size="11" fill="#444">若 random 指向自己或祖先，递归回来查 map 时该节点必须已登记——</text>
  <text x="50" y="434" font-size="11" fill="#444">「先登记后递归」保证 random 查询命中，避免死循环与重复创建。</text>
</svg>
