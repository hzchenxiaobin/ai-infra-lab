<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：前缀异或 → 收集 → 取第 K 大</text>

  <!-- Step 1: 输入矩阵 -->
  <rect x="36" y="60" width="130" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="101" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 1</text>
  <text x="101" y="102" text-anchor="middle" font-size="10" fill="#444">输入 matrix</text>
  <text x="101" y="118" text-anchor="middle" font-size="9" fill="#888">m × n 非负整数</text>

  <!-- 箭头 1→2 -->
  <path d="M166 94 L210 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 计算二维前缀异或 -->
  <rect x="212" y="60" width="140" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="282" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Step 2</text>
  <text x="282" y="102" text-anchor="middle" font-size="10" fill="#444">计算二维前缀异或</text>
  <text x="282" y="118" text-anchor="middle" font-size="9" fill="#888">pref[i][j]=m[i][j]^..^..^..</text>

  <!-- 箭头 2→3 -->
  <path d="M352 94 L396 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 收集所有值 -->
  <rect x="398" y="60" width="130" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="463" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Step 3</text>
  <text x="463" y="102" text-anchor="middle" font-size="10" fill="#444">收集全部 pref</text>
  <text x="463" y="118" text-anchor="middle" font-size="9" fill="#888">共 m·n 个值</text>

  <!-- 箭头 3→4 (向下) -->
  <path d="M463 128 L463 176" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 排序 / nth_element -->
  <rect x="398" y="178" width="130" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="463" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 4</text>
  <text x="463" y="220" text-anchor="middle" font-size="10" fill="#444">排序 / nth_element</text>
  <text x="463" y="236" text-anchor="middle" font-size="9" fill="#888">降序第 K 个</text>

  <!-- 箭头 4→5 (向左) -->
  <path d="M398 212 L354 212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 返回答案 -->
  <rect x="212" y="178" width="140" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="282" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Step 5</text>
  <text x="282" y="220" text-anchor="middle" font-size="10" fill="#444">返回第 K 大</text>
  <text x="282" y="236" text-anchor="middle" font-size="9" fill="#888">sorted[k-1]</text>

  <!-- 底部说明框 -->
  <rect x="36" y="270" width="488" height="110" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">复杂度与选择</text>
  <text x="56" y="316" font-size="10" fill="#444">• 前缀异或：O(m·n) 一次遍历，每格 O(1) 四角 XOR</text>
  <text x="56" y="336" font-size="10" fill="#444">• 排序法：O(m·n·log(m·n))，m·n ≤ 10⁶ ≈ 2×10⁷ 步，可过</text>
  <text x="56" y="356" font-size="10" fill="#444">• nth_element：平均 O(m·n)，C++ 直接 std::nth_element 更快</text>
  <text x="56" y="376" font-size="10" fill="#b85450" font-weight="bold">关键：XOR 自逆 → 容斥全是 ^，无需 +/− 切换</text>
</svg>
