<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三航班按 booking_time 排序的机票状态</text>

  <!-- header -->
  <g font-size="11" fill="#888" font-weight="bold">
    <text x="46" y="56" text-anchor="middle">flight_id</text>
    <text x="100" y="56" text-anchor="middle">capacity</text>
    <text x="250" y="56" text-anchor="middle">旅客（按 booking_time 升序，绿=Confirmed 橙=Waitlist）</text>
  </g>

  <line x1="20" y1="64" x2="540" y2="64" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row 1: flight 1, cap 2, pax 103(12:00) 101(16:30) 102(17:45) -->
  <g font-size="13" font-weight="bold">
    <text x="46" y="100" text-anchor="middle" fill="#333">1</text>
    <text x="100" y="100" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="155" y="78" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="179" y="98" text-anchor="middle" fill="#333" font-size="12">103</text>
    <text x="179" y="114" text-anchor="middle" fill="#888" font-size="9">12:00</text>
    <rect x="207" y="78" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="231" y="98" text-anchor="middle" fill="#333" font-size="12">101</text>
    <text x="231" y="114" text-anchor="middle" fill="#888" font-size="9">16:30</text>
    <rect x="259" y="78" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="283" y="98" text-anchor="middle" fill="#333" font-size="12">102</text>
    <text x="283" y="114" text-anchor="middle" fill="#888" font-size="9">17:45</text>
  </g>
  <text x="179" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1 ✓</text>
  <text x="231" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">rn2 ✓</text>
  <text x="283" y="132" text-anchor="middle" font-size="9" fill="#d6a040">rn3 ✗</text>

  <line x1="20" y1="140" x2="540" y2="140" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: flight 2, cap 2, pax 105(09:00) 104(13:23) -->
  <g font-size="13" font-weight="bold">
    <text x="46" y="176" text-anchor="middle" fill="#333">2</text>
    <text x="100" y="176" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="155" y="154" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="179" y="174" text-anchor="middle" fill="#333" font-size="12">105</text>
    <text x="179" y="190" text-anchor="middle" fill="#888" font-size="9">09:00</text>
    <rect x="207" y="154" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="231" y="174" text-anchor="middle" fill="#333" font-size="12">104</text>
    <text x="231" y="190" text-anchor="middle" fill="#888" font-size="9">13:23</text>
  </g>
  <text x="179" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1 ✓</text>
  <text x="231" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">rn2 ✓</text>

  <line x1="20" y1="216" x2="540" y2="216" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: flight 3, cap 1, pax 107(09:10) 106(11:10) -->
  <g font-size="13" font-weight="bold">
    <text x="46" y="252" text-anchor="middle" fill="#333">3</text>
    <text x="100" y="252" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="155" y="230" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="179" y="250" text-anchor="middle" fill="#333" font-size="12">107</text>
    <text x="179" y="266" text-anchor="middle" fill="#888" font-size="9">09:10</text>
    <rect x="207" y="230" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="231" y="250" text-anchor="middle" fill="#333" font-size="12">106</text>
    <text x="231" y="266" text-anchor="middle" fill="#888" font-size="9">11:10</text>
  </g>
  <text x="179" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1 ✓</text>
  <text x="231" y="284" text-anchor="middle" font-size="9" fill="#d6a040">rn2 ✗</text>

  <!-- formula reminders -->
  <rect x="40" y="306" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rn = ROW_NUMBER() OVER (PARTITION BY flight_id ORDER BY booking_time)</text>

  <!-- takeaway -->
  <rect x="40" y="354" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rn ≤ capacity → Confirmed · rn > capacity → Waitlist · 按 booking_time 定先后</text>
</svg>
