<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">排序不等式：逆序配对最小，正序配对最大</text>

  <!-- ===== Top: 逆序配对 (MIN) ===== -->
  <text x="180" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逆序配对（升序 × 降序）→ 最小</text>

  <!-- nums1 ascending: 2,3,4,5 -->
  <text x="80" y="80" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums1↑</text>
  <rect x="92" y="62" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="62" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="62" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="62" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="238" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="298" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- connecting arrows -->
  <path d="M 118 94 L 118 110" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 94 L 178 110" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 94 L 238 110" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 94 L 298 110" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nums2 descending: 5,4,2,2 -->
  <text x="80" y="132" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums2↓</text>
  <rect x="92" y="114" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="114" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="114" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="114" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="178" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="238" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="298" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- products and sum (right side) -->
  <text x="370" y="78" font-size="11" fill="#555" filter="url(#rough2)">乘积：</text>
  <text x="370" y="98" font-size="11" fill="#333" filter="url(#rough2)">2×5 + 3×4 + 4×2 + 5×2</text>
  <text x="370" y="116" font-size="11" fill="#333" filter="url(#rough2)">= 10 + 12 + 8 + 10</text>
  <rect x="360" y="126" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="144" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小 = 40</text>

  <!-- divider -->
  <path d="M 40 174 L 560 174" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bottom: 正序配对 (MAX) ===== -->
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">正序配对（升序 × 升序）→ 最大</text>

  <!-- nums1 ascending: 2,3,4,5 -->
  <text x="80" y="224" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums1↑</text>
  <rect x="92" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="238" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="298" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- connecting arrows -->
  <path d="M 118 238 L 118 254" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 238 L 178 254" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 238 L 238 254" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 238 L 298 254" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nums2 ascending: 2,2,4,5 -->
  <text x="80" y="276" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums2↑</text>
  <rect x="92" y="258" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="258" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="258" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="258" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="279" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="279" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="238" y="279" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="298" y="279" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- products and sum -->
  <text x="370" y="222" font-size="11" fill="#555" filter="url(#rough2)">乘积：</text>
  <text x="370" y="242" font-size="11" fill="#333" filter="url(#rough2)">2×2 + 3×2 + 4×4 + 5×5</text>
  <text x="370" y="260" font-size="11" fill="#333" filter="url(#rough2)">= 4 + 6 + 16 + 25</text>
  <rect x="360" y="270" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="288" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大 = 51</text>

  <!-- summary -->
  <rect x="60" y="318" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">大配小、小配大 → 乘积均衡 → 总和最小</text>
  <text x="300" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">逆序和 ≤ 任意排列 ≤ 顺序和</text>

  <!-- exchange argument note -->
  <rect x="60" y="368" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">交换正序对为逆序对：Δ = (a_j−a_i)(b_σ(i)−b_σ(j)) ≤ 0，和不增</text>
</svg>
