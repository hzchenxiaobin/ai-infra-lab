<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：除法批量版逐轮追踪</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每轮：商 k = 本轮操作数，余数 = 新值，累计 ops = Σk</text>

  <!-- ===== Example 1: num1=2, num2=3 → 3 ===== -->
  <text x="28" y="68" font-size="11" fill="#444" font-weight="bold">示例 1：num1=2, num2=3 → 3</text>

  <!-- table header -->
  <rect x="28" y="74" width="464" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="88" text-anchor="middle" font-size="9.5" fill="#555">轮次</text>
  <text x="120" y="88" text-anchor="middle" font-size="9.5" fill="#555">num1</text>
  <text x="170" y="88" text-anchor="middle" font-size="9.5" fill="#555">num2</text>
  <text x="222" y="88" text-anchor="middle" font-size="9.5" fill="#555">比较</text>
  <text x="282" y="88" text-anchor="middle" font-size="9.5" fill="#555">商 k</text>
  <text x="340" y="88" text-anchor="middle" font-size="9.5" fill="#555">余数</text>
  <text x="410" y="88" text-anchor="middle" font-size="9.5" fill="#555">累计 ops</text>

  <!-- row 1 -->
  <rect x="28" y="94" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="108" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="120" y="108" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="170" y="108" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="222" y="108" text-anchor="middle" font-size="9.5" fill="#333">2 &lt; 3</text>
  <text x="282" y="108" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="340" y="108" text-anchor="middle" font-size="9.5" fill="#333">3%2=1</text>
  <text x="410" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 2 -->
  <rect x="28" y="114" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="128" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="120" y="128" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="170" y="128" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="222" y="128" text-anchor="middle" font-size="9.5" fill="#333">2 ≥ 1</text>
  <text x="282" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="340" y="128" text-anchor="middle" font-size="9.5" fill="#333">2%1=0</text>
  <text x="410" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- result line -->
  <text x="492" y="128" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 返回 3</text>

  <!-- ===== Example 2: num1=10, num2=10 → 1 ===== -->
  <text x="28" y="158" font-size="11" fill="#444" font-weight="bold">示例 2：num1=10, num2=10 → 1</text>

  <rect x="28" y="164" width="464" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="178" text-anchor="middle" font-size="9.5" fill="#555">轮次</text>
  <text x="120" y="178" text-anchor="middle" font-size="9.5" fill="#555">num1</text>
  <text x="170" y="178" text-anchor="middle" font-size="9.5" fill="#555">num2</text>
  <text x="222" y="178" text-anchor="middle" font-size="9.5" fill="#555">比较</text>
  <text x="282" y="178" text-anchor="middle" font-size="9.5" fill="#555">商 k</text>
  <text x="340" y="178" text-anchor="middle" font-size="9.5" fill="#555">余数</text>
  <text x="410" y="178" text-anchor="middle" font-size="9.5" fill="#555">累计 ops</text>

  <rect x="28" y="184" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="198" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="120" y="198" text-anchor="middle" font-size="9.5" fill="#333">10</text>
  <text x="170" y="198" text-anchor="middle" font-size="9.5" fill="#333">10</text>
  <text x="222" y="198" text-anchor="middle" font-size="9.5" fill="#333">10 ≥ 10</text>
  <text x="282" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="340" y="198" text-anchor="middle" font-size="9.5" fill="#333">10%10=0</text>
  <text x="410" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="492" y="198" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 返回 1</text>

  <!-- ===== Example 3: num1=7, num2=3 → 5 ===== -->
  <text x="28" y="228" font-size="11" fill="#444" font-weight="bold">示例 3：num1=7, num2=3 → 5（多轮辗转）</text>

  <rect x="28" y="234" width="464" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="248" text-anchor="middle" font-size="9.5" fill="#555">轮次</text>
  <text x="120" y="248" text-anchor="middle" font-size="9.5" fill="#555">num1</text>
  <text x="170" y="248" text-anchor="middle" font-size="9.5" fill="#555">num2</text>
  <text x="222" y="248" text-anchor="middle" font-size="9.5" fill="#555">比较</text>
  <text x="282" y="248" text-anchor="middle" font-size="9.5" fill="#555">商 k</text>
  <text x="340" y="248" text-anchor="middle" font-size="9.5" fill="#555">余数</text>
  <text x="410" y="248" text-anchor="middle" font-size="9.5" fill="#555">累计 ops</text>

  <rect x="28" y="254" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="268" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="120" y="268" text-anchor="middle" font-size="9.5" fill="#333">7</text>
  <text x="170" y="268" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="222" y="268" text-anchor="middle" font-size="9.5" fill="#333">7 ≥ 3</text>
  <text x="282" y="268" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="340" y="268" text-anchor="middle" font-size="9.5" fill="#333">7%3=1</text>
  <text x="410" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="28" y="274" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="56" y="288" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="120" y="288" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="170" y="288" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="222" y="288" text-anchor="middle" font-size="9.5" fill="#333">1 &lt; 3</text>
  <text x="282" y="288" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="340" y="288" text-anchor="middle" font-size="9.5" fill="#333">3%1=0</text>
  <text x="410" y="288" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="492" y="288" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 返回 5</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="306" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#333">暴力验证示例 3：7→4→1（2 次）+ 3→2→1→0（3 次）= 5 次 ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#888">除法版 2 轮 vs 暴力版 5 步——输入越大优势越明显</text>
</svg>
