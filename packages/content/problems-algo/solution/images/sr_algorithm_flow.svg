<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：小顶堆维护 k 路指针，滑动左端求最小区间</text>

  <!-- Box 1: init -->
  <rect x="80" y="44" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333">① 每路首元素 (val, row, 0) 入小顶堆</text>
  <text x="260" y="82" text-anchor="middle" font-size="11" fill="#555">currentMax = max(所有首元素)</text>

  <path d="M 260 94 L 260 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: pop -->
  <rect x="80" y="112" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#333">② 弹堆顶 (val, r, c) → 区间左端 a = val</text>

  <path d="M 260 154 L 260 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: better range? -->
  <path d="M 260 172 L 350 200 L 260 228 L 170 200 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333">[a, currentMax]</text>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#333">更优？</text>

  <!-- yes -->
  <text x="362" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 350 200 L 396 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="186" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="206" text-anchor="middle" font-size="10" fill="#333">更新 best</text>

  <!-- no -->
  <text x="146" y="196" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 170 200 L 130 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="44" y="186" width="84" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="86" y="206" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <!-- merge to next decision -->
  <path d="M 86 216 L 86 250 L 260 250 L 260 240" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 440 216 L 440 250 L 260 250" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 260 250 L 260 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c+1 < len? -->
  <path d="M 260 268 L 350 296 L 260 324 L 170 296 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#333">c + 1 &lt;</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#333">nums[r].len ?</text>

  <!-- yes: push next -->
  <text x="362" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 350 296 L 396 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="280" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="296" text-anchor="middle" font-size="10" fill="#333">入堆 next</text>
  <text x="448" y="309" text-anchor="middle" font-size="10" fill="#333">刷新 max</text>

  <!-- no: break -->
  <text x="146" y="292" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 170 296 L 130 296" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="44" y="282" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="86" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">该路耗尽</text>

  <!-- loop back to box 2 -->
  <path d="M 448 314 L 448 360 L 460 360 L 460 132 L 440 132" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="468" y="248" font-size="10" fill="#b85450" font-weight="bold">继续</text>
  <text x="468" y="262" font-size="10" fill="#b85450" font-weight="bold">归并</text>

  <!-- break path to final -->
  <path d="M 86 312 L 86 360 L 260 360" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 260 360 L 260 384" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="376" font-size="10" fill="#888">某路耗尽 → 停</text>

  <!-- final box -->
  <rect x="80" y="386" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③ 返回最优区间 best = [a*, b*]</text>

  <!-- complexity note -->
  <rect x="60" y="436" width="400" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#b85450">时间 O(N log k)，空间 O(k)；N 为所有元素总数</text>
</svg>
