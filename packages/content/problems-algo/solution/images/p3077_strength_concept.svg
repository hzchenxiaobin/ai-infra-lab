<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：系数只由「第几个子数组」决定——逐元素贡献拆解</text>

  <!-- coefficient badges -->
  <rect x="143" y="52" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="66" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">×3</text>
  <rect x="253" y="52" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="277" y="66" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">×(−2)</text>
  <rect x="308" y="52" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">×1</text>
  <text x="420" y="66" font-size="10.5" fill="#888" filter="url(#rough2)">← k=3 的系数</text>

  <!-- array cells -->
  <rect x="85" y="80" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="102" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="140" y="80" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="102" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="195" y="80" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="102" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="250" y="80" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="102" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="305" y="80" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="102" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- group brackets -->
  <path d="M 110 120 C 110 128, 85 128, 85 136 M 110 120 C 110 128, 245 128, 245 136" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="165" y="150" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">第1段：6 × 3 = 18</text>
  <path d="M 275 120 C 275 128, 250 128, 250 136 M 275 120 C 275 128, 300 128, 300 136" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="277" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">第2段：(−1)×(−2) = 2</text>
  <path d="M 330 120 C 330 128, 305 128, 305 136 M 330 120 C 330 128, 355 128, 355 136" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="335" y="164" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第3段：2 × 1 = 2</text>

  <!-- formula box -->
  <rect x="30" y="174" width="500" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">strength = 3·sum₁ − 2·sum₂ + 1·sum₃ = 3×6 − 2×(−1) + 1×2</text>
  <text x="280" y="216" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 18 + 2 + 2 = 22 ✓（[1,2,3] ｜ [−1] ｜ [2]）</text>

  <!-- general ladder -->
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">一般地（k 为奇数）：c_j = (−1)^{j+1}·(k−j+1)，正负交替、绝对值从 k 递减到 1</text>

  <rect x="104" y="266" width="45" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126.5" y="285" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+7</text>
  <rect x="155" y="266" width="45" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177.5" y="285" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−6</text>
  <rect x="206" y="266" width="45" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="228.5" y="285" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+5</text>
  <rect x="257" y="266" width="45" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279.5" y="285" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−4</text>
  <rect x="308" y="266" width="45" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330.5" y="285" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+3</text>
  <rect x="359" y="266" width="45" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381.5" y="285" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="410" y="266" width="45" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432.5" y="285" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="126.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="177.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="228.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="279.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=4</text>
  <text x="330.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=5</text>
  <text x="381.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=6</text>
  <text x="432.5" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">j=7</text>
  <text x="280" y="304" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">……（以 k=7 为例）</text>

  <!-- bottom note -->
  <rect x="30" y="314" width="500" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 逐元素视角：strength = Σ c_{j(t)}·nums[t]，每个元素的贡献 = 所在段系数 × 元素值，</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">未选元素贡献 0 —— 问题变成「从左到右切出恰好 k 个游程，第 j 个游程统一乘 c_j」的划分型 DP。</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">奇数位系数为正（想要大和），偶数位为负（想要负和）；首段 +k 最大，末段因 k 为奇数恒为 +1。</text>
</svg>
