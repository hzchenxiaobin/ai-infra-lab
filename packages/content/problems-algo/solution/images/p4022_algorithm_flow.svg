<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：二分块号 → 块内定位</text>

  <!-- 输入 -->
  <rect x="195" y="38" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 k（≤ 10¹⁵）</text>
  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 二分块 -->
  <rect x="120" y="86" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">二分最小的块号 b，满足</text>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">digits(10b+9) ≥ k</text>
  <path d="M 260 132 L 260 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 b=0 -->
  <polygon points="260,150 350,178 260,206 170,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b = 0 ?</text>

  <!-- 是 → 返回 k -->
  <path d="M 170 178 L 122 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="160" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">直接返回 k</text>
  <text x="70" y="190" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（块 0 = 123…9）</text>

  <!-- 否 → 块内定位 -->
  <path d="M 260 206 L 260 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="105" y="228" width="310" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">pos = k − digits(10b−1)，L = 位数(10b)</text>
  <path d="M 260 260 L 260 278" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="280" width="310" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i = (pos−1) ÷ L，j = (pos−1) mod L</text>
  <path d="M 260 312 L 260 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="90" y="332" width="340" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">num = b 为偶 ? 10b+i : 10b+9−i</text>
  <text x="260" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = num 从左起第 j+1 位数字</text>

  <text x="260" y="412" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偶数块整数为递增序，奇数块整数为递减序</text>
</svg>
