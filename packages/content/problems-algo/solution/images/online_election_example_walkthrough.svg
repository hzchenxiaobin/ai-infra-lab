<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐票统计与领先者变化</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">persons=[0,1,1,0,0,1,0]  times=[0,5,10,15,20,25,30]</text>

  <!-- table header -->
  <rect x="30" y="54" width="70" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <rect x="100" y="54" width="70" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">时刻</text>
  <rect x="170" y="54" width="70" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">投票人</text>
  <rect x="240" y="54" width="140" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">count 变化</text>
  <rect x="380" y="54" width="80" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">领先者</text>

  <!-- step 1 -->
  <rect x="30" y="86" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="108" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <rect x="100" y="86" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="108" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="170" y="86" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="108" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="86" width="140" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="11" fill="#555">c[0]=1</text>
  <rect x="380" y="86" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- step 2 -->
  <rect x="30" y="124" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="146" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <rect x="100" y="124" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="146" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="170" y="124" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="240" y="124" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="146" text-anchor="middle" font-size="11" fill="#555">c[1]=1 (平票)</text>
  <rect x="380" y="124" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- step 3 -->
  <rect x="30" y="162" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="184" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <rect x="100" y="162" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="184" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="170" y="162" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="184" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="240" y="162" width="140" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="184" text-anchor="middle" font-size="11" fill="#555">c[1]=2</text>
  <rect x="380" y="162" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- step 4 -->
  <rect x="30" y="200" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="222" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <rect x="100" y="200" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="170" y="200" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="200" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="11" fill="#555">c[0]=2 (平票)</text>
  <rect x="380" y="200" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- step 5 -->
  <rect x="30" y="238" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="260" text-anchor="middle" font-size="11" fill="#333">i=4</text>
  <rect x="100" y="238" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="260" text-anchor="middle" font-size="11" fill="#333">20</text>
  <rect x="170" y="238" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="260" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="238" width="140" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="11" fill="#555">c[0]=3</text>
  <rect x="380" y="238" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- step 6 -->
  <rect x="30" y="276" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="298" text-anchor="middle" font-size="11" fill="#333">i=5</text>
  <rect x="100" y="276" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="298" text-anchor="middle" font-size="11" fill="#333">25</text>
  <rect x="170" y="276" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="298" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="240" y="276" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#555">c[1]=3 (平票)</text>
  <rect x="380" y="276" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- step 7 -->
  <rect x="30" y="314" width="70" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="336" text-anchor="middle" font-size="11" fill="#333">i=6</text>
  <rect x="100" y="314" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="336" text-anchor="middle" font-size="11" fill="#333">30</text>
  <rect x="170" y="314" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="336" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="314" width="140" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="336" text-anchor="middle" font-size="11" fill="#555">c[0]=4</text>
  <rect x="380" y="314" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- query demo -->
  <rect x="30" y="362" width="430" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="245" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">查询验证</text>
  <text x="50" y="406" font-size="11" fill="#444">q(12) → ≤12 最大时刻 = 10 (idx2) → leaders[2] = 1</text>
  <text x="50" y="424" font-size="11" fill="#444">q(24) → ≤24 最大时刻 = 20 (idx4) → leaders[4] = 0</text>
  <text x="50" y="442" font-size="11" fill="#444">q(8)  → ≤8 最大时刻 = 5 (idx1)  → leaders[1] = 1</text>
</svg>
