<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "aabcaba"，k = 0（频次 c=1，b=2，a=4）</text>

  <!-- ======== row 1: x = 1, baseline 140 ======== -->
  <text x="36" y="124" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">x=1</text>
  <path d="M 104 126 L 248 126" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 110 140 L 250 140" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="126" width="30" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="164" y="112" width="30" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="164" y="126" width="30" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="179" y="107" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="208" y="84" width="30" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="208" y="126" width="30" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="223" y="79" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="135" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="179" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=2</text>
  <text x="223" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a=4</text>
  <text x="268" y="122" font-size="11" fill="#666" filter="url(#rough2)">c 留 · b 削 1 · a 削 3 → cost = 4</text>

  <!-- ======== row 2: x = 2, baseline 238 ======== -->
  <rect x="14" y="164" width="400" height="92" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>
  <text x="36" y="208" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x=2</text>
  <path d="M 104 210 L 248 210" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 110 238 L 250 238" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="224" width="30" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="135" y="219" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="164" y="210" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="208" y="182" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="208" y="210" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="223" y="177" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="135" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="179" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=2</text>
  <text x="223" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a=4</text>
  <text x="268" y="206" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c 全删 1 · a 削 2 → cost = 3 ✓</text>

  <!-- ======== row 3: x = 4, baseline 336 ======== -->
  <rect x="14" y="262" width="400" height="92" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>
  <text x="36" y="276" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x=4</text>
  <path d="M 104 280 L 248 280" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 110 336 L 250 336" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="322" width="30" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="135" y="317" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="164" y="308" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="179" y="303" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="208" y="280" width="30" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="135" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="179" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=2</text>
  <text x="223" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a=4</text>
  <text x="268" y="276" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c、b 全删 → cost = 3 ✓</text>

  <text x="260" y="380" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ ans = 3（删 2 个 a + 1 个 c → "baba"）</text>
</svg>
