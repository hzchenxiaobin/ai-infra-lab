<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三步贪心求最大增量总和</text>

  <!-- Step 1: compute rowMax -->
  <rect x="60" y="52" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <circle cx="88" cy="80" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="88" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="120" y="74" font-size="12" fill="#333" font-weight="bold">计算行最大值</text>
  <text x="120" y="94" font-size="11" fill="#555">rowMax[i] = max(grid[i][0], ..., grid[i][n−1])</text>

  <!-- arrow down -->
  <path d="M 260 110 L 260 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute colMax -->
  <rect x="60" y="134" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <circle cx="88" cy="162" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="88" y="167" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="120" y="156" font-size="12" fill="#333" font-weight="bold">计算列最大值</text>
  <text x="120" y="176" font-size="11" fill="#555">colMax[j] = max(grid[0][j], ..., grid[n−1][j])</text>

  <!-- arrow down -->
  <path d="M 260 192 L 260 212" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sum increases -->
  <rect x="60" y="216" width="400" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <circle cx="88" cy="250" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="88" y="255" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="120" y="240" font-size="12" fill="#333" font-weight="bold">遍历每格，累加增量</text>
  <text x="120" y="260" font-size="11" fill="#555">sum += min(rowMax[i], colMax[j]) − grid[i][j]</text>
  <text x="120" y="276" font-size="10" fill="#888">每格独立计算，互不影响</text>

  <!-- arrow down -->
  <path d="M 260 286 L 260 306" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="140" y="310" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 sum（最大高度增量总和）</text>
</svg>
