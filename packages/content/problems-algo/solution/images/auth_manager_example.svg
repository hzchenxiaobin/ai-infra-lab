<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：timeToLive=5，8 次调用</text>

  <!-- Column headers -->
  <text x="44" y="48" font-size="10" fill="#aaa" filter="url(#rough2)">操作</text>
  <text x="210" y="48" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">aaa（exp）</text>
  <text x="340" y="48" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">bbb（exp）</text>
  <text x="470" y="48" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">返回</text>

  <!-- separator under header -->
  <path d="M 36 54 L 524 54" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: AuthenticationManager(5) -->
  <text x="44" y="78" font-size="10.5" fill="#888" filter="url(#rough2)">init(5)</text>
  <text x="210" y="78" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="470" y="78" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">null</text>

  <!-- Row 2: renew("aaa", 1) -> ignore -->
  <text x="44" y="114" font-size="10.5" fill="#888" filter="url(#rough2)">renew(aaa,1)</text>
  <text x="210" y="114" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="340" y="114" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="436" y="100" width="68" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">null</text>
  <text x="470" y="134" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">不存在</text>

  <!-- Row 3: generate("aaa", 2) -> exp=7 -->
  <text x="44" y="158" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">gen(aaa,2)</text>
  <rect x="172" y="144" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="470" y="160" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">null</text>

  <!-- Row 4: count(6) -> 1 -->
  <text x="44" y="194" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">count(6)</text>
  <rect x="172" y="180" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7 &gt; 6</text>
  <text x="340" y="196" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="442" y="180" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 5: generate("bbb", 7) -> exp=12 -->
  <text x="44" y="230" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">gen(bbb,7)</text>
  <rect x="172" y="216" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="302" y="216" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">null</text>

  <!-- Row 6: renew("aaa", 8) -> expired, ignore -->
  <text x="44" y="266" font-size="10.5" fill="#888" filter="url(#rough2)">renew(aaa,8)</text>
  <rect x="172" y="252" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7 ≤ 8 ✗</text>
  <rect x="302" y="252" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="470" y="268" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">null</text>
  <text x="470" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">已过期</text>

  <!-- Row 7: renew("bbb", 10) -> renew, exp=15 -->
  <text x="44" y="302" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">renew(bbb,10)</text>
  <rect x="172" y="288" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="304" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="302" y="288" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="470" y="304" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">null</text>
  <text x="340" y="322" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">12&gt;10 → 续期</text>

  <!-- Row 8: count(15) -> 0 -->
  <text x="44" y="342" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">count(15)</text>
  <rect x="172" y="328" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7 ≤ 15 ✗</text>
  <rect x="302" y="328" width="76" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">15 ≤ 15 ✗</text>
  <rect x="442" y="328" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- dashed separator -->
  <path d="M 40 366 L 524 366" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="80" y="378" width="400" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出：[null, null, null, 1, null, null, null, 0]</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=生成  绿=未过期/续期  红=已过期（exp ≤ currentTime）</text>
</svg>
