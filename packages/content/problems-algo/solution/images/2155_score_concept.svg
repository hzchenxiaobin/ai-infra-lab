<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：得分 = 左侧 0 的个数 + 右侧 1 的个数</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">下标 i 处切开：numsleft = nums[0..i−1]，numsright = nums[i..n−1]</text>

  <!-- nums array: [0,0,1,0], 4 cells, w=46 gap=6 start=120 -->
  <text x="28" y="80" font-size="10.5" fill="#666">nums</text>

  <rect x="120" y="62" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="172" y="62" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="224" y="62" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="276" y="62" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- index labels -->
  <text x="143" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="195" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="247" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="299" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>

  <!-- Split line at i=2: between index 1 and 2 (x=223) -->
  <path d="M 223 54 L 223 138" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="223" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=2 切开</text>

  <!-- left bracket -->
  <text x="170" y="152" text-anchor="middle" font-size="10.5" fill="#446688">numsleft [0,0]</text>
  <text x="170" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a">0 的个数 = 2</text>

  <!-- right bracket -->
  <text x="276" y="152" text-anchor="middle" font-size="10.5" fill="#d6a040">numsright [1,0]</text>
  <text x="276" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a">1 的个数 = 1</text>

  <!-- score formula -->
  <rect x="100" y="182" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">得分(i=2) = 2 + 1 = 3 ✅ 最高</text>

  <!-- Transition: moving split from i to i+1 -->
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">切点右移一格：nums[i] 从右侧「跨过」切线进入左侧</text>

  <!-- two cases -->
  <rect x="40" y="252" width="210" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">若 nums[i] == 0</text>
  <text x="145" y="289" text-anchor="middle" font-size="10.5" fill="#555">左侧多一个 0 → leftZeros += 1</text>
  <text x="145" y="304" text-anchor="middle" font-size="10.5" fill="#555">右侧 1 数不变</text>

  <rect x="270" y="252" width="210" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">若 nums[i] == 1</text>
  <text x="375" y="289" text-anchor="middle" font-size="10.5" fill="#555">左侧 0 数不变（1 不加分）</text>
  <text x="375" y="304" text-anchor="middle" font-size="10.5" fill="#555">右侧少一个 1 → rightOnes −= 1</text>

  <!-- arrow between two boxes -->
  <path d="M 250 281 L 270 281" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- footer -->
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#888">两个滚动变量 leftZeros / rightOnes，O(1) 增量更新，无需重算前缀</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#aaa">对照 2155 暴力 O(n²)：每个切点重扫两侧 → 重复统计</text>
</svg>
