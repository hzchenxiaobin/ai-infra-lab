<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "10011100"</text>

  <!-- 原串 -->
  <text x="52" y="62" font-size="12" fill="#446688">原串</text>
  <rect x="120" y="44" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="204" y="44" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">01</text>
  <rect x="288" y="44" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="372" y="44" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">00</text>
  <text x="466" y="64" font-size="11" fill="#999">下标对 (0,1)(2,3)(4,5)(6,7)</text>

  <!-- 逐对判定 -->
  <text x="52" y="118" font-size="12" fill="#446688">逐对</text>

  <rect x="100" y="94" width="180" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="12" fill="#333">s[0]=1, s[1]=0</text>
  <text x="190" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ≠ 0 ⇒ +1（累计 1）</text>

  <rect x="300" y="94" width="180" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="114" text-anchor="middle" font-size="12" fill="#333">s[2]=0, s[3]=1</text>
  <text x="390" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ≠ 1 ⇒ +1（累计 2）</text>

  <rect x="100" y="168" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="12" fill="#333">s[4]=1, s[5]=1</text>
  <text x="190" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 = 1 ⇒ +0（累计 2）</text>

  <rect x="300" y="168" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="188" text-anchor="middle" font-size="12" fill="#333">s[6]=0, s[7]=0</text>
  <text x="390" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0 = 0 ⇒ +0（累计 2）</text>

  <path d="M 480 123 C 512 150 512 180 488 196" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="500" y="146" font-size="11" fill="#999">改哪个都行：</text>
  <text x="500" y="162" font-size="11" fill="#999">"10"→"11"，"01"→"00"</text>

  <!-- 修改 -->
  <text x="52" y="268" font-size="12" fill="#446688">修改</text>
  <text x="118" y="260" font-size="12" fill="#333">s[1]: 0→1，s[3]: 1→0，共改 2 个字符：</text>
  <rect x="120" y="274" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="204" y="274" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">00</text>
  <rect x="288" y="274" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="372" y="274" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">00</text>
  <text x="466" y="294" font-size="11" fill="#999">"11|00|11|00" 美丽 ✓</text>

  <!-- 结论 -->
  <rect x="120" y="330" width="330" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="348" text-anchor="middle" font-size="12" fill="#333">答案 = 不匹配的固定对个数</text>
  <text x="285" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 2</text>
</svg>
