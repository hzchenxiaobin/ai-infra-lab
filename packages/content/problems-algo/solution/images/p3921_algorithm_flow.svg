<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <ellipse cx="260" cy="32" rx="108" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="37" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：score = 0, counter = 0</text>

  <path d="M 260 52 L 260 68" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="72" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个事件 e</text>

  <path d="M 260 106 L 260 118" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,122 332,150 260,178 188,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e 的类型？</text>

  <path d="M 188 150 C 150 150, 128 160, 108 178" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 150 C 370 150, 392 160, 412 178" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="182" width="145" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="107" y="206" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">数字：score += e</text>

  <rect x="190" y="182" width="140" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"W"：counter += 1</text>

  <rect x="340" y="182" width="145" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="206" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"WD"/"NB"：score += 1</text>

  <path d="M 107 222 L 107 242 L 412 242" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 222 L 260 240" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 242 L 260 254" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,256 342,284 260,312 178,284" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">counter == 10 ?</text>

  <path d="M 342 284 L 366 284" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="276" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="368" y="266" width="148" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="442" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 [score, counter]</text>

  <path d="M 260 312 L 260 332 L 90 332 L 90 89 L 176 89" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否，继续下一事件</text>
</svg>
