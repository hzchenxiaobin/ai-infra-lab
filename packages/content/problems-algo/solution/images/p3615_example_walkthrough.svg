<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算（示例 3）：label = "bbac"，答案 3</text>

  <!-- 左侧：无向图 -->
  <path d="M 105 108 L 62 200" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 105 108 L 150 200" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 150 200 L 215 132" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="105" cy="108" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="78" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>

  <circle cx="62" cy="200" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="36" y="207" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>

  <circle cx="150" cy="200" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="122" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <path d="M 150 246 L 150 222" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="260" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">中心</text>

  <circle cx="215" cy="132" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="240" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>

  <!-- 对称对虚线弧 -->
  <path d="M 105 89 C 130 48, 190 58, 215 113" fill="none" stroke="#b85450" stroke-width="1.4"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="160" y="50" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对称对：(0,1) 都是 'b'</text>

  <text x="135" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">无向图（圆内为节点字符，红边为路径 0→3→1）</text>

  <!-- 右侧：步骤 -->
  <rect x="270" y="56" width="235" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="387" y="73" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 基态：中心点 3（'c'）</text>
  <text x="387" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mask = {3}，(l, r) = (3, 3)，长度 1</text>

  <path d="M 387 106 L 387 116" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="118" width="235" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="387" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 两端各接一个 'b'：</text>
  <text x="387" y="150" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a = 0 ∈ N(3)，b = 1 ∈ N(3)，a ≠ b</text>
  <text x="387" y="165" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mask = {0,1,3}，(l, r) = (0, 1)</text>
  <text x="387" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">路径 0→3→1："bcb"，长度 3</text>

  <path d="M 387 190 L 387 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="202" width="235" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="387" y="219" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 继续扩展受阻：</text>
  <text x="387" y="234" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a ∈ N(0)∖mask = {2}，</text>
  <text x="387" y="248" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b ∈ N(1)∖mask = ∅ → 停止</text>

  <path d="M 387 258 L 387 268" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="270" width="235" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="387" y="287" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ 其余基态均死路：</text>
  <text x="387" y="302" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">三条边两端字符互不相同 → 无偶数基态</text>
  <text x="387" y="314" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">单点 {0},{1},{2} 凑不出同字符对</text>

  <!-- 结果框 -->
  <path d="M 387 320 C 387 340, 300 336, 252 326" fill="none" stroke="#d6a040" stroke-width="1.5"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="55" y="300" width="190" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 3（"bcb"）</text>
</svg>
