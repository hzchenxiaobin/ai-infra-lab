<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先建质数表，再一趟扫描维护 first / last</text>

  <!-- step 1 -->
  <rect x="160" y="40" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 埃氏筛建表 isComposite[2..100]</text>

  <path d="M 260 78 L 260 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 loop -->
  <rect x="160" y="100" width="200" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② i = 0 … n−1 逐个扫描</text>

  <path d="M 260 134 L 260 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,156 380,204 260,252 140,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">nums[i] 是质数？</text>
  <text x="260" y="216" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">(x ≥ 2 且 !isComposite[x])</text>

  <!-- no: loop back -->
  <path d="M 140 204 L 62 204 L 62 117 L 152 117" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="122" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- yes: update -->
  <path d="M 260 252 L 260 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="264" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="150" y="272" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">first 未定则记 first = i</text>
  <text x="260" y="307" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">last = i（每次都刷新）</text>

  <path d="M 260 316 L 260 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 3 return -->
  <rect x="160" y="334" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 返回 last − first</text>

  <!-- side note -->
  <rect x="396" y="160" width="114" height="96" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="453" y="182" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">值域仅 [1,100]</text>
  <text x="453" y="202" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">筛表只 101 格</text>
  <text x="453" y="220" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">单次判定 O(1)</text>
  <text x="453" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">整题 O(n)</text>

  <!-- bottom note -->
  <rect x="12" y="150" width="118" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="71" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">题目保证</text>
  <text x="71" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">至少一个质数</text>
  <text x="71" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">first 必被赋值</text>
</svg>
