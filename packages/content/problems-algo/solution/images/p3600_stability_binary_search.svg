<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：二分「下限 x」，每条边的命运随之确定</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">chk(x) = 能否选出所有边有效强度 ≥ x 的生成树 · 有效强度 = s（不升级）或 2s（升级）</text>

  <!-- ============ Panel 1: 三档可选边 ============ -->
  <text x="34" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① must=0 可选边：以 x = 6 为例分三档</text>

  <g filter="url(#rough2)">
    <line x1="78" y1="95" x2="134" y2="95" stroke="#4a7a3a" stroke-width="2.5"/>
    <ellipse cx="66" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="146" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="66" y="99" text-anchor="middle" font-size="10" fill="#2a5a2a">0</text>
    <text x="146" y="99" text-anchor="middle" font-size="10" fill="#2a5a2a">1</text>
    <text x="106" y="86" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">s=9</text>

    <line x1="232" y1="95" x2="288" y2="95" stroke="#d6a040" stroke-width="2.5"/>
    <ellipse cx="220" cy="95" rx="12" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="300" cy="95" rx="12" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="220" y="99" text-anchor="middle" font-size="10" fill="#8a6d1f">0</text>
    <text x="300" y="99" text-anchor="middle" font-size="10" fill="#8a6d1f">1</text>
    <text x="260" y="86" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">s=4</text>

    <line x1="386" y1="95" x2="442" y2="95" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3"/>
    <ellipse cx="374" cy="95" rx="12" ry="12" fill="#f7f7f7" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="454" cy="95" rx="12" ry="12" fill="#f7f7f7" stroke="#b85450" stroke-width="1.6"/>
    <text x="374" y="99" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="454" y="99" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="414" y="86" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">s=2</text>

    <rect x="46" y="118" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="106" y="133" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">s ≥ x：免费入树 ✓</text>
    <text x="106" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">不花升级预算</text>

    <rect x="200" y="118" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="260" y="133" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">x/2 ≤ s &lt; x：付费 ✓</text>
    <text x="260" y="148" text-anchor="middle" font-size="9" fill="#8a6d1f">花 1 次升级 → 2s = 8 ≥ 6</text>

    <rect x="354" y="118" width="120" height="38" fill="#f7f7f7" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="4"/>
    <text x="414" y="133" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2s &lt; x：弃用 ✗</text>
    <text x="414" y="148" text-anchor="middle" font-size="9" fill="#999">升级也到不了 x</text>
  </g>

  <!-- ============ Panel 2: must 边 ============ -->
  <text x="34" y="180" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② must=1 边：强制入树、禁升级</text>
  <g filter="url(#rough2)">
    <rect x="46" y="190" width="428" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="260" y="210" text-anchor="middle" font-size="10.5" fill="#8a3a36">s &lt; x ⟹ chk(x) 直接失败；must 边彼此成环 ⟹ 无合法生成树（返回 −1）</text>
  </g>

  <!-- ============ Panel 3: 单调性数轴 ============ -->
  <text x="34" y="248" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 可行性随 x 单调递减</text>

  <g filter="url(#rough2)">
    <line x1="80" y1="284" x2="440" y2="284" stroke="#446688" stroke-width="2"/>
    <text x="100" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="130" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="160" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="190" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="220" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="275" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="305" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="335" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="365" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="395" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
    <text x="425" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

    <line x1="250" y1="262" x2="250" y2="296" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3"/>
    <ellipse cx="250" cy="284" rx="4.5" ry="4.5" fill="#d6a040"/>

    <text x="80" y="302" text-anchor="middle" font-size="9" fill="#888">1</text>
    <text x="440" y="302" text-anchor="middle" font-size="9" fill="#888">2·max s</text>
    <text x="165" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">chk = true（可行）</text>
    <text x="345" y="316" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">chk = false（不可行）</text>
    <text x="250" y="316" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">↑ 答案</text>
  </g>

  <!-- ============ Panel 4: 升级预算刻画 ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="336" width="440" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">④ 升级预算的精确刻画：must + 免费边加完后剩 c 个连通块</text>
    <text x="260" y="376" text-anchor="middle" font-size="10" fill="#33455e">每条付费边恰好合并两块 ⟹ 恰需 c−1 次升级（顺序无关）；k &lt; c−1 ⟹ chk 失败</text>
  </g>
</svg>
