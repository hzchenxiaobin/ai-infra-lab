<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：带权并查集逐边判定</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="52" rx="44" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 67 L 280 84" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读边 -->
  <rect x="192" y="86" width="176" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">取出下一条边 [u, v, w]</text>
  <path d="M 280 118 L 280 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find -->
  <rect x="170" y="136" width="220" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">ru = find(u)，rv = find(v)</text>
  <path d="M 280 168 L 280 184" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：同根？ -->
  <polygon points="280,186 354,228 280,270 206,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="12" fill="#a07020" font-weight="bold" filter="url(#rough2)">ru == rv ?</text>

  <!-- 否 → 合并 -->
  <path d="M 206 228 L 168 228 L 168 252" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="219" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="79" y="253" width="178" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="274" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合并两树，旧约束不受影响</text>
  <text x="168" y="294" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">p[rv]=ru, d[rv]=d[u]⊕d[v]⊕w</text>

  <path d="M 168 305 L 168 371" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="342" text-anchor="start" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans+1</text>

  <!-- 是 → 菱形 2 -->
  <path d="M 354 228 L 440 228 L 440 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="219" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="440,262 510,306 440,350 370,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="303" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold" filter="url(#rough2)">d[u] ⊕ d[v]</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold" filter="url(#rough2)">== w ?</text>

  <!-- 菱形 2：是 → ans+1 -->
  <path d="M 440 350 L 440 360 L 342 360 L 342 371" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="456" y="340" text-anchor="start" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是：ans+1</text>

  <!-- 菱形 2：否 → 跳过 -->
  <path d="M 510 306 L 534 306 L 534 396 L 406 396" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="290" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否：跳过</text>

  <!-- 汇合框 -->
  <rect x="158" y="372" width="244" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">取下一条边</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">（edges 全部处理完则返回 ans）</text>
</svg>
