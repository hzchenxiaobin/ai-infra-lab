<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：建表 → 扫值域 → 取最小
  </text>

  <rect x="160" y="50" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1. 预处理：前缀计数表</text>
  <text x="270" y="84" text-anchor="middle" font-size="10" fill="#5a7a9a" filter="url(#rough2)">pre[i+1]=pre[i]; ++pre[i+1][nums[i]]</text>
  <line x1="270" y1="94" x2="270" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="160" y="110" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2. 查询 [l,r]：prev=-1, best=+∞</text>
  <line x1="270" y1="144" x2="270" y2="160" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="160" y="160" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">3. v = 1 → 100 逐值扫描</text>
  <line x1="270" y1="194" x2="270" y2="210" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <polygon points="270,210 370,238 270,266 170,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="235" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">pre[r+1][v]−pre[l][v] &gt; 0 ?</text>
  <text x="270" y="250" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">(值 v 在区间出现?)</text>

  <line x1="170" y1="238" x2="130" y2="238" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="150" y="231" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="219" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="236" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">best=min(best,</text>
  <text x="75" y="250" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">v−prev); prev=v</text>

  <line x1="370" y1="238" x2="410" y2="238" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="390" y="231" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="410" y="219" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="243" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">跳过该 v</text>

  <rect x="160" y="272" width="220" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↑ 对每个 v = 1..100 重复以上判断</text>
  <line x1="270" y1="296" x2="270" y2="312" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <polygon points="270,314 370,342 270,370 170,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="339" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">best == +∞ ?</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">(不足 2 个出现值)</text>

  <line x1="170" y1="342" x2="130" y2="342" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="150" y="335" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="20" y="323" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="347" text-anchor="middle" font-size="12" fill="#7a3a38" filter="url(#rough2)">ans = -1</text>

  <line x1="370" y1="342" x2="410" y2="342" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="390" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="410" y="323" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="347" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">ans = best</text>

  <line x1="75" y1="361" x2="75" y2="404" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="75" y1="404" x2="160" y2="404" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <line x1="465" y1="361" x2="465" y2="404" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="465" y1="404" x2="380" y2="404" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="160" y="388" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">返回 ans</text>
</svg>
