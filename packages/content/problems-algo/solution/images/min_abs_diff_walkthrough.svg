<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [4,2,1,3]</text>

  <!-- 原始数组 -->
  <text x="40" y="56" font-size="12" fill="#888">原始：</text>
  <rect x="80" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <path d="M 152 76 L 152 96" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="162" y="90" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- 排序后 -->
  <text x="40" y="118" font-size="12" fill="#888">排序后：</text>
  <rect x="80" y="106" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="212" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 第一遍：求最小差 -->
  <text x="40" y="162" font-size="12" fill="#888" font-weight="bold">第一遍：求 minDiff</text>

  <text x="40" y="184" font-size="10" fill="#555">i=1: |2−1| = </text>
  <rect x="120" y="172" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="180" y="184" font-size="10" fill="#555">→ minDiff = 1</text>

  <text x="40" y="208" font-size="10" fill="#555">i=2: |3−2| = </text>
  <rect x="120" y="196" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="180" y="208" font-size="10" fill="#555">→ minDiff = 1</text>

  <text x="40" y="232" font-size="10" fill="#555">i=3: |4−3| = </text>
  <rect x="120" y="220" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="180" y="232" font-size="10" fill="#555">→ minDiff = 1</text>

  <rect x="280" y="172" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="192" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">minDiff = 1</text>

  <!-- 第二遍：收集 -->
  <text x="40" y="276" font-size="12" fill="#888" font-weight="bold">第二遍：收集差值 = minDiff 的对</text>

  <text x="40" y="300" font-size="10" fill="#555">i=1: [1,2] 差=1 ✓ 收集</text>
  <rect x="200" y="288" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="305" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[1, 2]</text>

  <text x="40" y="328" font-size="10" fill="#555">i=2: [2,3] 差=1 ✓ 收集</text>
  <rect x="200" y="316" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="333" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[2, 3]</text>

  <text x="40" y="356" font-size="10" fill="#555">i=3: [3,4] 差=1 ✓ 收集</text>
  <rect x="200" y="344" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="361" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3, 4]</text>

  <!-- 最终结果 -->
  <text x="40" y="396" font-size="12" fill="#888" font-weight="bold">最终结果：</text>
  <rect x="120" y="384" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[[1,2], [2,3], [3,4]]</text>

  <!-- 说明 -->
  <rect x="40" y="426" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">排序保证结果天然升序且 a &lt; b，无需后处理</text>
</svg>
