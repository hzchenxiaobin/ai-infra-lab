<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">对称整数 = 偶数位 &amp; 前半数位和 == 后半数位和</text>

  <!-- Row 1: 1203 symmetric -->
  <text x="36" y="72" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 1203</text>
  <rect x="100" y="48" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="72" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="150" y="48" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="72" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="198" y1="42" x2="198" y2="90" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="200" y="48" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="72" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="250" y="48" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="273" y="72" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="106" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前半和 1+2 = 3</text>
  <text x="248" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">后半和 0+3 = 3</text>
  <text x="320" y="72" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 == 3 → 对称 ✓</text>

  <!-- Row 2: 1245 not symmetric -->
  <text x="36" y="142" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 1245</text>
  <rect x="100" y="118" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="142" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="150" y="118" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="142" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <line x1="198" y1="112" x2="198" y2="160" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="200" y="118" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="142" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="250" y="118" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="142" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="148" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前半和 1+2 = 3</text>
  <text x="248" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">后半和 4+5 = 9</text>
  <text x="320" y="142" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ≠ 9 → 不对称 ✗</text>

  <!-- Row 3: odd digit count -->
  <text x="36" y="216" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">✗ 357</text>
  <rect x="100" y="192" width="46" height="36" fill="#eeeeee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="216" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">3</text>
  <rect x="150" y="192" width="46" height="36" fill="#eeeeee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="216" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">5</text>
  <rect x="200" y="192" width="46" height="36" fill="#eeeeee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="216" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">7</text>
  <text x="280" y="216" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 位 = 奇数位 → 无法对半分，直接出局</text>

  <!-- Row 4: two digits -->
  <text x="36" y="284" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 44</text>
  <rect x="100" y="260" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="284" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="150" y="260" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="230" y="284" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">两位数对称 ⟺ x % 11 == 0（11, 22, …, 99）</text>

  <!-- Bottom note -->
  <rect x="40" y="308" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">回文 vs 对称：回文要求逐位镜像（1221 ✓，1203 ✗）</text>
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">对称只要求两半和相等（1203 ✓）→ 偶数位回文必对称，反之不成立</text>
</svg>
