<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次整除判定</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">无需枚举搜索，O(1) 由 num 直接算出三个整数</text>

  <!-- Start: num -->
  <rect x="200" y="64" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 num</text>

  <!-- arrow down -->
  <path d="M 260 104 L 260 126" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num % 3 == 0? -->
  <polygon points="260,130 384,176 260,222 136,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">num % 3 == 0 ?</text>
  <text x="260" y="190" text-anchor="middle" font-size="10.5" fill="#888">num 能否被 3 整除</text>

  <!-- No branch (left) → empty array -->
  <path d="M 136 176 L 100 176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="24" y="158" width="74" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="61" y="182" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 [ ]</text>

  <!-- Yes branch (right) → compute -->
  <path d="M 384 176 L 420 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="424" y="158" width="74" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="461" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">x = num/3</text>
  <text x="461" y="190" text-anchor="middle" font-size="9.5" fill="#888">整除</text>

  <!-- arrow from yes box down to result -->
  <path d="M 461 198 L 461 220 L 260 220 L 260 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="120" y="244" width="280" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 [ x−1, x, x+1 ]</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#555">即 [ num/3 − 1,  num/3,  num/3 + 1 ]</text>

  <!-- Bottom note -->
  <rect x="40" y="316" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：连续整数的对称性把「搜索」降维成「一次除法」</text>
</svg>
