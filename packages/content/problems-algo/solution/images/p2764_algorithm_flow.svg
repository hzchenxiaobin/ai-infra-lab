<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2764f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="470" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单调栈验证前序</text>

  <!-- Start -->
  <rect x="160" y="40" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nodes[0] 入栈（根），i=1</text>

  <!-- arrow to i<n -->
  <path d="M240,80 L240,104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="240,106 320,148 240,190 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n ?</text>

  <!-- No -> return true -->
  <path d="M320,148 L372,148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="372" y="130" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Yes -> read node -->
  <path d="M240,190 L240,210" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="252" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="212" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">读 [id, parent]</text>

  <!-- arrow to diamond top -->
  <path d="M240,250 L240,272" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>

  <!-- Diamond: top == parent ? -->
  <polygon points="240,274 336,316 240,358 144,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">栈顶==parent?</text>

  <!-- Yes (left) -> push, i++ -->
  <path d="M144,316 L120,316" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="132" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="298" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="321" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">入栈; i++</text>

  <!-- loop back: up left side to i<n diamond left -->
  <path d="M20,316 L8,316 L8,148 L160,148" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="16" y="232" font-size="10" fill="#888">回到</text>
  <text x="16" y="246" font-size="10" fill="#888">判 i&lt;n</text>

  <!-- No (bottom) -> pop -->
  <path d="M240,358 L240,378" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="252" y="372" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="200" y="380" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="402" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">弹栈</text>

  <!-- arrow to empty? diamond -->
  <path d="M240,414 L240,424" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>

  <!-- Diamond: empty ? -->
  <polygon points="240,426 296,446 240,466 184,446" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="450" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">栈空?</text>

  <!-- No (right) -> back to top==parent? -->
  <path d="M296,446 L340,446 L340,316 L336,316" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="318" y="438" font-size="10" fill="#888">否</text>
  <text x="345" y="380" font-size="10" fill="#888">回到判</text>
  <text x="345" y="393" font-size="10" fill="#888">栈顶</text>

  <!-- Yes (left) -> return false -->
  <path d="M184,446 L150,446" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2764f)" filter="url(#rough2)"/>
  <text x="167" y="438" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="28" y="428" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="451" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
</svg>
