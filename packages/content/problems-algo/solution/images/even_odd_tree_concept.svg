<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：奇偶层交替的奇偶性与单调性</text>

  <!-- ===== 左侧：层标签列 ===== -->
  <g font-size="11">
    <!-- L0 -->
    <rect x="14" y="60" width="130" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="42" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">L0 偶层</text>
    <text x="100" y="79" text-anchor="middle" fill="#4a7a3a">奇数 ↑</text>
    <!-- L1 -->
    <rect x="14" y="120" width="130" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="42" y="139" text-anchor="middle" fill="#446688" font-weight="bold">L1 奇层</text>
    <text x="100" y="139" text-anchor="middle" fill="#446688">偶数 ↓</text>
    <!-- L2 -->
    <rect x="14" y="180" width="130" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="42" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">L2 偶层</text>
    <text x="100" y="199" text-anchor="middle" fill="#4a7a3a">奇数 ↑</text>
    <!-- L3 -->
    <rect x="14" y="240" width="130" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="42" y="259" text-anchor="middle" fill="#446688" font-weight="bold">L3 奇层</text>
    <text x="100" y="259" text-anchor="middle" fill="#446688">偶数 ↓</text>
  </g>

  <!-- ===== 中间：二叉树（示例1） ===== -->
  <g font-size="12">
    <!-- 连线 -->
    <line x1="335" y1="88" x2="290" y2="122" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="365" y1="88" x2="410" y2="122" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="282" y1="148" x2="250" y2="182" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="402" y1="148" x2="380" y2="182" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="418" y1="148" x2="450" y2="182" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="244" y1="208" x2="222" y2="242" stroke="#aaa" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="256" y1="208" x2="278" y2="242" stroke="#aaa" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="374" y1="208" x2="362" y2="242" stroke="#aaa" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="456" y1="208" x2="468" y2="242" stroke="#aaa" stroke-width="1.1" filter="url(#rough2)"/>

    <!-- L0: 1 (odd) -->
    <circle cx="350" cy="75" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="350" y="80" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <!-- L1: 10, 4 (even, decreasing) -->
    <circle cx="290" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="290" y="140" text-anchor="middle" fill="#446688" font-weight="bold">10</text>
    <circle cx="410" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="410" y="140" text-anchor="middle" fill="#446688" font-weight="bold">4</text>

    <!-- L2: 3, 7, 9 (odd, increasing) -->
    <circle cx="250" cy="195" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="250" y="200" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="380" cy="195" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="380" y="200" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="450" cy="195" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="450" y="200" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>

    <!-- L3: 12, 8, 6, 2 (even, decreasing) -->
    <circle cx="220" cy="255" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">12</text>
    <circle cx="280" cy="255" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
    <circle cx="360" cy="255" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="360" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
    <circle cx="470" cy="255" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- ===== 右侧：单调方向箭头 ===== -->
  <!-- L0: 单点 -->
  <text x="565" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a">单点</text>
  <!-- L1: ↓ decreasing -->
  <line x1="298" y1="135" x2="402" y2="135" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="565" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">严格递减</text>
  <!-- L2: ↑ increasing -->
  <line x1="264" y1="195" x2="436" y2="195" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="565" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">严格递增</text>
  <!-- L3: ↓ decreasing -->
  <line x1="233" y1="255" x2="457" y2="255" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="565" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">严格递减</text>

  <!-- ===== 底部规则总结条 ===== -->
  <rect x="20" y="300" width="580" height="124" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="324" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold">奇偶树两条规则（层号从 0 起）</text>

  <!-- 规则1 -->
  <rect x="40" y="338" width="250" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="359" font-size="11" fill="#3a5a2a" font-weight="bold">偶数层（0,2,4…）</text>
  <text x="200" y="359" font-size="11" fill="#3a5a2a">奇数值 + 严格递增 ↑</text>

  <!-- 规则2 -->
  <rect x="320" y="338" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="338" y="359" font-size="11" fill="#2a4a6a" font-weight="bold">奇数层（1,3,5…）</text>
  <text x="478" y="359" font-size="11" fill="#2a4a6a">偶数值 + 严格递减 ↓</text>

  <text x="310" y="396" text-anchor="middle" font-size="11" fill="#7a5a20">值的奇偶与层号奇偶「相反」，单调方向也「相反」</text>
  <text x="310" y="414" text-anchor="middle" font-size="10" fill="#999">例：L0 偶层→奇数↑ ；L1 奇层→偶数↓；L2 偶层→奇数↑ …</text>
</svg>
