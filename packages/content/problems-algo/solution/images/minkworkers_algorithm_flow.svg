<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：算比率 → 排序 → 大顶堆留 K 小 → 取最小成本</text>

  <!-- Step 1 -->
  <rect x="150" y="46" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 计算 ratio[i] = wage[i] / quality[i]</text>

  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="104" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 按 ratio 升序排序（队长即当前工人）</text>

  <path d="M 260 142 L 260 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="120" y="162" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 初始化：大顶堆(quality)空 · sumq=0 · ans=∞</text>

  <path d="M 260 200 L 260 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: loop -->
  <rect x="130" y="220" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 遍历每个工人 i（已按 ratio 排序）</text>

  <path d="M 260 258 L 260 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- push quality -->
  <rect x="160" y="278" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="299" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">push quality[i] · sumq += quality[i]</text>

  <path d="M 260 314 L 260 326" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: heap.size > k? -->
  <polygon points="260,330 350,362 260,394 170,362" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">堆大小</text>
  <text x="260" y="374" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">&gt; k ?</text>

  <!-- Yes: pop max -->
  <path d="M 350 362 L 410 362" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="360" y="356" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="344" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="361" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">弹出最大质量</text>
  <text x="458" y="375" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sumq -= 堆顶</text>

  <!-- loop back to push -->
  <path d="M 458 344 L 458 294 L 360 294" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- No branch -> update ans -->
  <path d="M 170 362 L 110 362" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="118" y="356" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <path d="M 62 362 L 62 408 L 150 408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- size == k ? update ans -->
  <rect x="150" y="392" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 size==k：ans = min(ans, ratio[i]×sumq)</text>

  <!-- loop back to step 4 -->
  <path d="M 390 409 L 460 409 L 460 237 L 390 237" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="410" y="231" font-size="10" fill="#d6a040">下一工人</text>

  <!-- Return -->
  <path d="M 270 426 L 270 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="170" y="440" width="200" height="0" fill="none"/>
</svg>
