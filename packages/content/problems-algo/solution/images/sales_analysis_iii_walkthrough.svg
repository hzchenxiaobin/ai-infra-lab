<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 行 → 2 个产品 → 2 条首年记录</text>

  <!-- 原始表 Sales -->
  <text x="30" y="52" font-size="11.5" fill="#888">原始表 Sales</text>

  <rect x="30" y="58" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sale_id</text>
  <rect x="100" y="58" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">product_id</text>
  <rect x="180" y="58" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">year</text>
  <rect x="240" y="58" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">quantity</text>
  <rect x="310" y="58" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">price</text>

  <!-- Row 1: sale_id=1, product=100, year=2008 (first year, green) -->
  <rect x="30" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="99" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="100" y="84" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="99" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="180" y="84" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="210" y="99" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2008</text>
  <rect x="240" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="99" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <rect x="310" y="84" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="99" text-anchor="middle" font-size="10.5" fill="#333">5000</text>

  <!-- Row 2: sale_id=2, product=100, year=2009 (not first, orange) -->
  <rect x="30" y="108" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="123" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="100" y="108" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="123" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="180" y="108" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="123" text-anchor="middle" font-size="10.5" fill="#333">2009</text>
  <rect x="240" y="108" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="123" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <rect x="310" y="108" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="123" text-anchor="middle" font-size="10.5" fill="#333">5000</text>

  <!-- Row 3: sale_id=7, product=200, year=2011 (first year, blue) -->
  <rect x="30" y="132" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="147" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="100" y="132" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="147" text-anchor="middle" font-size="10.5" fill="#333">200</text>
  <rect x="180" y="132" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="210" y="147" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2011</text>
  <rect x="240" y="132" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="147" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="310" y="132" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="147" text-anchor="middle" font-size="10.5" fill="#333">9000</text>

  <!-- 右侧标注 -->
  <text x="400" y="99" font-size="10.5" fill="#4a7a3a" font-weight="bold">← 产品100最早年 2008 ✓</text>
  <text x="400" y="123" font-size="10.5" fill="#d6a040">← 2009 &gt; 2008，非首年 ✗</text>
  <text x="400" y="147" font-size="10.5" fill="#446688" font-weight="bold">← 产品200最早年 2011 ✓</text>

  <!-- 箭头到子查询 -->
  <path d="M 210 158 L 210 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="173" font-size="10" fill="#888">GROUP BY + MIN</text>

  <!-- 子查询结果 -->
  <text x="30" y="190" font-size="11.5" fill="#888">子查询 m：每个产品的最早年份</text>

  <rect x="60" y="196" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">product_id</text>
  <rect x="170" y="196" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">first_year</text>

  <rect x="60" y="222" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="237" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="170" y="222" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="237" text-anchor="middle" font-size="10.5" fill="#333">2008</text>

  <rect x="60" y="246" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="261" text-anchor="middle" font-size="10.5" fill="#333">200</text>
  <rect x="170" y="246" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="261" text-anchor="middle" font-size="10.5" fill="#333">2011</text>

  <text x="400" y="240" font-size="10.5" fill="#888">MIN(year) 按产品分组取最小年份</text>

  <!-- 箭头到 JOIN -->
  <path d="M 210 270 L 210 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="285" font-size="10" fill="#888">JOIN s ON year = first_year</text>

  <!-- JOIN 结果 -->
  <text x="30" y="302" font-size="11.5" fill="#888">JOIN 命中：原表 year = first_year 的行</text>

  <rect x="60" y="308" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="325" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">product_id</text>
  <rect x="160" y="308" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="325" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">first_year</text>
  <rect x="250" y="308" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="325" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">quantity</text>
  <rect x="330" y="308" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="325" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">price</text>

  <rect x="60" y="334" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="349" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="160" y="334" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="349" text-anchor="middle" font-size="10.5" fill="#333">2008</text>
  <rect x="250" y="334" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="349" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <rect x="330" y="334" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="349" text-anchor="middle" font-size="10.5" fill="#333">5000</text>

  <rect x="60" y="358" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="373" text-anchor="middle" font-size="10.5" fill="#333">200</text>
  <rect x="160" y="358" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="373" text-anchor="middle" font-size="10.5" fill="#333">2011</text>
  <rect x="250" y="358" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="373" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="330" y="358" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="373" text-anchor="middle" font-size="10.5" fill="#333">9000</text>

  <text x="430" y="349" font-size="10.5" fill="#4a7a3a" font-weight="bold">← sale_id=1 命中</text>
  <text x="430" y="373" font-size="10.5" fill="#446688" font-weight="bold">← sale_id=7 命中</text>

  <!-- 提示框 -->
  <rect x="30" y="396" width="560" height="128" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="418" font-size="11" fill="#555" font-weight="bold">💡 关键细节</text>
  <text x="50" y="438" font-size="10.5" fill="#888">① 子查询只保留 (product_id, first_year)，丢掉了 quantity / price → 必须 JOIN 回原表补回明细列。</text>
  <text x="50" y="458" font-size="10.5" fill="#888">② JOIN 条件是双键：product_id 相同 AND year = first_year，缺一不可（product_id 防串产品，year 锁首年）。</text>
  <text x="50" y="478" font-size="10.5" fill="#888">③ 若产品 100 在 2008 年还有 sale_id=8 一条记录，JOIN 会同时命中 sale_id=1 和 8 → 两行都输出。</text>
  <text x="50" y="498" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 这正是「同年多条全保留」的体现——JOIN 不去重，首年有几条就输出几条。</text>
  <text x="50" y="516" font-size="10.5" fill="#4a7a3a">④ 输出列名 first_year 来自子查询的别名（或 s.year AS first_year），题目要求列名为 first_year。</text>
</svg>
