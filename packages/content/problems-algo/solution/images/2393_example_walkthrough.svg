<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 3, 5, 4, 4, 6]，逐下标维护 len 与 ans</text>

  <!-- ===== Reference row: nums ===== -->
  <text x="40" y="58" font-size="11" fill="#888">nums =</text>
  <g filter="url(#rough2)">
    <rect x="178" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="200" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <rect x="224" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="246" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <rect x="270" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="292" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
    <rect x="316" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="338" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <rect x="362" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="384" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <rect x="408" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="430" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  </g>

  <!-- ===== Table ===== -->
  <!-- column x boundaries: 20, 80, 140, 250, 330, 410, 640 -->
  <!-- centers: i=50, nums[i]=110, 比较=195, len=290, 累计=370, 子数组=525 -->
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="20" y="86" width="620" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="50"  y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
    <text x="110" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i]</text>
    <text x="195" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">与前比较</text>
    <text x="290" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">len</text>
    <text x="370" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">累计 ans</text>
    <text x="525" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">以 i 结尾的递增子数组</text>
    <line x1="80"  y1="86" x2="80"  y2="116" stroke="#446688" stroke-width="1"/>
    <line x1="140" y1="86" x2="140" y2="116" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="86" x2="250" y2="116" stroke="#446688" stroke-width="1"/>
    <line x1="330" y1="86" x2="330" y2="116" stroke="#446688" stroke-width="1"/>
    <line x1="410" y1="86" x2="410" y2="116" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- rows: each 32 high, start y=116 -->
  <g filter="url(#rough2)">
    <!-- row 0: i=0, base -->
    <rect x="20" y="116" width="620" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="50"  y="137" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="110" y="137" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="195" y="137" text-anchor="middle" font-size="11" fill="#888">—（起点）</text>
    <text x="290" y="137" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <text x="370" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="525" y="137" text-anchor="middle" font-size="11" fill="#888">[1]</text>

    <!-- row 1: i=1 extend -->
    <rect x="20" y="148" width="620" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="50"  y="169" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="110" y="169" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="195" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 &gt; 1 ✓</text>
    <text x="290" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="370" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="525" y="169" text-anchor="middle" font-size="11" fill="#888">[3], [1,3]</text>

    <!-- row 2: i=2 extend -->
    <rect x="20" y="180" width="620" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="50"  y="201" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="110" y="201" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <text x="195" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5 &gt; 3 ✓</text>
    <text x="290" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="370" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="525" y="201" text-anchor="middle" font-size="11" fill="#888">[5], [3,5], [1,3,5]</text>

    <!-- row 3: i=3 reset -->
    <rect x="20" y="212" width="620" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="50"  y="233" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="110" y="233" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
    <text x="195" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &lt; 5 ✗</text>
    <text x="290" y="233" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="370" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="525" y="233" text-anchor="middle" font-size="11" fill="#888">[4]</text>

    <!-- row 4: i=4 reset (equal) -->
    <rect x="20" y="244" width="620" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="50"  y="265" text-anchor="middle" font-size="12" fill="#666">4</text>
    <text x="110" y="265" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
    <text x="195" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 = 4 ✗</text>
    <text x="290" y="265" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="370" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
    <text x="525" y="265" text-anchor="middle" font-size="11" fill="#888">[4]</text>

    <!-- row 5: i=5 extend -->
    <rect x="20" y="276" width="620" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="50"  y="297" text-anchor="middle" font-size="12" fill="#666">5</text>
    <text x="110" y="297" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
    <text x="195" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 &gt; 4 ✓</text>
    <text x="290" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="370" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="525" y="297" text-anchor="middle" font-size="11" fill="#888">[6], [4,6]</text>
  </g>

  <!-- column dividers across data rows -->
  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <line x1="80"  y1="116" x2="80"  y2="308"/>
    <line x1="140" y1="116" x2="140" y2="308"/>
    <line x1="250" y1="116" x2="250" y2="308"/>
    <line x1="330" y1="116" x2="330" y2="308"/>
    <line x1="410" y1="116" x2="410" y2="308"/>
  </g>

  <!-- answer box -->
  <rect x="150" y="324" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="349" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = 1 + 2 + 3 + 1 + 1 + 2 = 10 ✓</text>

  <!-- reset note -->
  <rect x="40" y="376" width="580" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=3（4 &lt; 5）与 i=4（4 = 4）两次断裂，len 均归 1</text>
  <text x="330" y="412" text-anchor="middle" font-size="11" fill="#888">⚠️ 严格递增要求严格大于，相等也算断裂——这是与「非严格递增」题的分水岭</text>

  <!-- example 3 mini note -->
  <rect x="60" y="430" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="450" text-anchor="middle" font-size="11" fill="#666">示例 3：nums = [5,4,3,2,1] 严格递减 → 每步 len=1，答案 = 5（仅单元素子数组）</text>
</svg>
