<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：贪心削平 + 阈值 T（批量等差求和）</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888">每次卖当前数量最多的颜色球 ⇒ 把高堆“削平”到阈值 T，再按价值 T 补齐剩余 orders</text>

  <!-- ===== 左侧价值坐标轴 ===== -->
  <line x1="92" y1="172" x2="92" y2="340" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688">
    <text x="84" y="345" text-anchor="end">0</text>
    <text x="84" y="321" text-anchor="end">1</text>
    <text x="84" y="297" text-anchor="end">2</text>
    <text x="84" y="273" text-anchor="end" font-weight="bold" fill="#4a7a3a">3 = T</text>
    <text x="84" y="249" text-anchor="end">4</text>
    <text x="84" y="225" text-anchor="end">5</text>
    <text x="84" y="201" text-anchor="end">6</text>
    <text x="84" y="177" text-anchor="end">7</text>
  </g>
  <text x="70" y="256" font-size="11" fill="#888" transform="rotate(-90 70 256)">球的价值 = 当前堆高</text>

  <!-- ===== 阈值虚线 T = 3 ===== -->
  <line x1="92" y1="268" x2="510" y2="268" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="516" y="272" font-size="12" fill="#4a7a3a" font-weight="bold">阈值 T</text>

  <!-- ===== 4 个颜色球堆 inv = [7, 5, 5, 3] ===== -->
  <!-- 灰段：价值 1..T-1（不卖）；绿段：价值 T（补齐剩余）；橙段：价值 > T（批量削平卖掉） -->

  <!-- 堆1 inv=7, x=160 -->
  <rect x="130" y="292" width="60" height="48" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="172" width="60" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">inv=7</text>

  <!-- 堆2 inv=5, x=260 -->
  <rect x="230" y="292" width="60" height="48" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="230" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="230" y="220" width="60" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">inv=5</text>

  <!-- 堆3 inv=5, x=360 -->
  <rect x="330" y="292" width="60" height="48" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="220" width="60" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">inv=5</text>

  <!-- 堆4 inv=3, x=460 -->
  <rect x="430" y="292" width="60" height="48" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="460" y="260" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">inv=3</text>

  <!-- 基线 -->
  <line x1="92" y1="340" x2="510" y2="340" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== 图例 ===== -->
  <g font-size="11" fill="#333">
    <rect x="120" y="362" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="142" y="372">价值 &gt; T：批量削平卖掉（等差数列 T+1..inv）</text>
    <rect x="120" y="380" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="142" y="390">价值 = T：补齐剩余 orders 个（每个价值 T）</text>
    <rect x="120" y="398" width="16" height="12" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="142" y="408">价值 &lt; T：不卖（已削平到此即停）</text>
  </g>

  <!-- ===== 公式框 ===== -->
  <rect x="330" y="356" width="220" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">批量价值 = Σ (inv + T + 1)(inv − T) / 2</text>
  <text x="440" y="392" text-anchor="middle" font-size="10" fill="#555">+ (orders − Σ(inv−T)) × T</text>
  <text x="440" y="408" text-anchor="middle" font-size="10" fill="#888">等差数列 T+1,T+2,…,inv 的和</text>
</svg>
