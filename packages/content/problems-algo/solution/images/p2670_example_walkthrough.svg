<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="290" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,2,3,4,2]</text>

  <!-- table outer frame -->
  <rect x="30" y="40" width="500" height="190" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header row band -->
  <rect x="30" y="40" width="500" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="133" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 nums[0..i]</text>
  <text x="222" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">pre</text>
  <text x="311" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀 nums[i+1..]</text>
  <text x="400" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">suf</text>
  <text x="463" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">diff[i]</text>

  <!-- column dividers -->
  <line x1="66" y1="40" x2="66" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="40" x2="200" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="244" y1="40" x2="244" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="378" y1="40" x2="378" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="422" y1="40" x2="422" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row separators -->
  <line x1="30" y1="70" x2="530" y2="70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="100" x2="530" y2="100" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="130" x2="530" y2="130" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="160" x2="530" y2="160" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="190" x2="530" y2="190" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlight row i=2 -->
  <rect x="424" y="131" width="104" height="28" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="48" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="133" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="222" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="311" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,3,4,2]</text>
  <text x="400" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="463" y="89" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−2</text>

  <!-- row 1 -->
  <text x="48" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="133" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,2]</text>
  <text x="222" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="311" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,4,2]</text>
  <text x="400" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="463" y="119" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- row 2 -->
  <text x="48" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="133" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,2,3]</text>
  <text x="222" y="149" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="311" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,2]</text>
  <text x="400" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="463" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- row 3 -->
  <text x="48" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="133" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,2,3,4]</text>
  <text x="222" y="179" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="311" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="400" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="463" y="179" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 4 -->
  <text x="48" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="133" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,2,3,4,2]</text>
  <text x="222" y="209" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="311" y="209" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[]（空）</text>
  <text x="400" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="463" y="209" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- result -->
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">结果 diff = [−2, −1, 0, 2, 3] ✅</text>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2 处前缀 {3,2} 与后缀 {4,2} 各 2 个不同元素，差恰为 0</text>
</svg>
