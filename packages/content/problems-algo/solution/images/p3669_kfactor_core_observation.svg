<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：因子都在约数表里 + 只搜非递减序列</text>

  <!-- ===== 观察① ===== -->
  <rect x="20" y="44" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">观察①</text>
  <text x="95" y="59" font-size="11.5" fill="#333" filter="url(#rough2)">拆分里的每个因子都整除 n</text>

  <rect x="95" y="70" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="136" y="89" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">×</text>
  <rect x="143" y="70" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="184" y="89" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">×</text>
  <rect x="191" y="70" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="240" y="89" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">=</text>
  <rect x="248" y="70" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">44</text>

  <text x="393" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">44 的约数表 divs（搜索域）</text>
  <rect x="300" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="332" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="364" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="396" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <rect x="428" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="441" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>
  <rect x="460" y="74" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">44</text>

  <text x="95" y="118" font-size="10.5" fill="#666" filter="url(#rough2)">候选从 1..n 缩到约数表：n ≤ 10⁵ 时约数个数 τ(n) ≤ 128</text>

  <path d="M 30 138 L 490 138" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- ===== 观察② ===== -->
  <rect x="20" y="152" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">观察②</text>
  <text x="95" y="167" font-size="11.5" fill="#333" filter="url(#rough2)">顺序无关 → 同一拆分的各种排列只搜一次</text>

  <rect x="95" y="178" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2,2,11] ✓</text>
  <text x="137" y="222" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">只搜非递减这种</text>

  <rect x="191" y="178" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[2,11,2] ✗</text>
  <path d="M 196 192 L 270 184" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重复排列</text>

  <rect x="287" y="178" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[11,2,2] ✗</text>
  <path d="M 292 192 L 366 184" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重复排列</text>

  <text x="95" y="244" font-size="10.5" fill="#666" filter="url(#rough2)">枚举保证 a₁ ≤ a₂ ≤ … ≤ a_k：dfs 传 i（不是 i+1），同一因数可重复选</text>

  <path d="M 30 258 L 490 258" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- ===== 观察③ ===== -->
  <rect x="20" y="272" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">观察③</text>
  <text x="95" y="287" font-size="11.5" fill="#333" filter="url(#rough2)">剩余因子都 ≥ d → 乘积下界剪枝</text>

  <rect x="95" y="298" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="215" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最小可达乘积 = prod · d^remain</text>
  <path d="M 339 312 L 367 312" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="370" y="298" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="316" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">&gt; n → break ✂</text>

  <text x="95" y="348" font-size="10" fill="#666" filter="url(#rough2)">例：已选 [2] 再试 d=11：2×11² = 242 &gt; 44 → 11 及更大的因数整段剪掉</text>
</svg>
