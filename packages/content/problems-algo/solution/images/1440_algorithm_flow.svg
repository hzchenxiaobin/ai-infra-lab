<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：FROM → JOIN v1 → JOIN v2 → CASE WHEN → 输出</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: FROM Expressions -->
  <rect x="170" y="84" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11.5" fill="#333">FROM Expressions e</text>

  <path d="M 280 116 L 280 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: JOIN v1 -->
  <rect x="120" y="130" width="320" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#333">JOIN Variables v1 ON e.left_operand = v1.name</text>

  <path d="M 280 162 L 280 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: JOIN v2 -->
  <rect x="120" y="176" width="320" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#333">JOIN Variables v2 ON e.right_operand = v2.name</text>

  <path d="M 280 208 L 280 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: CASE WHEN operator -->
  <polygon points="280,222 380,260 280,298 180,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">CASE</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333">operator?</text>

  <!-- Three branches -->
  <!-- > branch: left -->
  <path d="M 180 260 L 120 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="40" y="244" width="80" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="264" text-anchor="middle" font-size="10" fill="#333">v1 &gt; v2?</text>

  <!-- = branch: right -->
  <path d="M 380 260 L 440 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">=</text>
  <rect x="440" y="244" width="80" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="264" text-anchor="middle" font-size="10" fill="#333">v1 = v2?</text>

  <!-- < branch: down -->
  <path d="M 280 298 L 280 310" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="308" font-size="12" fill="#b85450" font-weight="bold">&lt;</text>
  <rect x="200" y="312" width="160" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#333">v1 &lt; v2?</text>

  <!-- Lines converging to THEN/ELSE -->
  <path d="M 80 276 L 80 360 L 200 360" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 480 276 L 480 360 L 360 360" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 280 340 L 280 350" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- THEN 'true' / ELSE 'false' -->
  <rect x="140" y="352" width="280" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333">THEN 'true' / ELSE 'false' AS value</text>

  <path d="M 280 384 L 280 396" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="120" y="398" width="320" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333">SELECT left_operand, operator, right_operand, value</text>

  <path d="M 280 426 L 280 436" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="280" cy="448" rx="42" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="11" fill="#333">输出结果</text>

  <!-- footer note -->
  <rect x="40" y="432" width="0" height="0" rx="8" fill="none" stroke="none"/>
</svg>
