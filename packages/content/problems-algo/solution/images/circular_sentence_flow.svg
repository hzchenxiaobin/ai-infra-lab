<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描字符串，遇空格检查两侧字符</text>

  <!-- 起点 -->
  <rect x="215" y="48" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12.5" fill="#333">开始，i = 0</text>

  <path d="M 270 84 L 270 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="270,104 380,150 270,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#888">(还有字符)</text>

  <!-- 否：跳出循环 -->
  <path d="M 380 150 L 430 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="142" font-size="11.5" fill="#446688" font-weight="bold">否</text>

  <!-- 是：进入空格判断 -->
  <path d="M 270 196 L 270 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="210" font-size="11.5" fill="#446688" font-weight="bold">是</text>

  <!-- 空格判断 -->
  <polygon points="270,218 388,262 270,306 152,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#333">s[i] == ' ' ?</text>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#888">(衔接点)</text>

  <!-- 是空格：比较两侧字符 -->
  <path d="M 152 262 L 90 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="254" font-size="11.5" fill="#446688" font-weight="bold">是</text>

  <rect x="30" y="245" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="266" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">比较</text>

  <path d="M 60 245 L 60 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="30" y="188" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="209" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">s[i−1]==s[i+1] ? 否→false</text>

  <!-- 比较成功回到 i++ -->
  <path d="M 230 205 L 470 205 L 470 150 L 388 150" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="360" y="198" font-size="10.5" fill="#888">是，继续</text>

  <!-- 否（非空格）：i++ 回到循环头 -->
  <path d="M 388 262 L 470 262 L 470 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="254" font-size="11.5" fill="#446688" font-weight="bold">否</text>
  <text x="478" y="210" font-size="10.5" fill="#888">i++</text>

  <!-- 首尾闭合判定 -->
  <path d="M 430 150 L 470 150 L 470 338 L 350 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="322" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="343" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">s[n−1]==s[0] ? 否→false</text>

  <path d="M 350 338 L 350 354" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="190" y="356" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="377" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">是 → return true</text>
</svg>
