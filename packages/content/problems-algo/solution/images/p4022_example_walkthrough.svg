<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：k = 15</text>

  <!-- 位置标号 -->
  <g font-size="9" fill="#888" filter="url(#rough2)">
    <text x="63" y="48" text-anchor="middle">1</text>
    <text x="89" y="48" text-anchor="middle">2</text>
    <text x="115" y="48" text-anchor="middle">3</text>
    <text x="141" y="48" text-anchor="middle">4</text>
    <text x="167" y="48" text-anchor="middle">5</text>
    <text x="193" y="48" text-anchor="middle">6</text>
    <text x="219" y="48" text-anchor="middle">7</text>
    <text x="245" y="48" text-anchor="middle">8</text>
    <text x="271" y="48" text-anchor="middle">9</text>
    <text x="297" y="48" text-anchor="middle">10</text>
    <text x="323" y="48" text-anchor="middle">11</text>
    <text x="349" y="48" text-anchor="middle">12</text>
    <text x="375" y="48" text-anchor="middle">13</text>
    <text x="401" y="48" text-anchor="middle">14</text>
    <text x="427" y="48" text-anchor="middle" fill="#b85450" font-weight="bold">15</text>
  </g>

  <!-- 字符串格子：块 0（1~9） -->
  <g filter="url(#rough2)">
    <rect x="50" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="258" y="52" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <!-- 块 1：19 18 17 -->
    <rect x="284" y="52" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="310" y="52" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="336" y="52" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="362" y="52" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="388" y="52" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- 第 15 格高亮 -->
    <rect x="414" y="52" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>

    <text x="63" y="71" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="89" y="71" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="115" y="71" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="141" y="71" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="167" y="71" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="193" y="71" text-anchor="middle" font-size="11" fill="#333">6</text>
    <text x="219" y="71" text-anchor="middle" font-size="11" fill="#333">7</text>
    <text x="245" y="71" text-anchor="middle" font-size="11" fill="#333">8</text>
    <text x="271" y="71" text-anchor="middle" font-size="11" fill="#333">9</text>
    <text x="297" y="71" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="323" y="71" text-anchor="middle" font-size="11" fill="#333">9</text>
    <text x="349" y="71" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="375" y="71" text-anchor="middle" font-size="11" fill="#333">8</text>
    <text x="401" y="71" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="427" y="71" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
    <text x="452" y="71" font-size="14" fill="#888">…</text>
  </g>

  <!-- 分组标注 -->
  <g filter="url(#rough2)">
    <text x="167" y="94" text-anchor="middle" font-size="10" fill="#446688">块 0</text>
    <text x="310" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">19</text>
    <text x="362" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">18</text>
    <text x="414" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">17</text>
  </g>
  <path d="M 427 100 L 427 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="427" y="112" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">第 15 位</text>

  <!-- 步骤 ① -->
  <rect x="25" y="122" width="470" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="141" font-size="11" fill="#333" filter="url(#rough2)">① digits(9) = 9 &lt; 15 ≤ digits(19) = 29 → 落在块 b = 1</text>
  <text x="40" y="158" font-size="10" fill="#666" filter="url(#rough2)">（块 1 写完时恰好累计 29 位）</text>

  <!-- 步骤 ② -->
  <rect x="25" y="176" width="470" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="195" font-size="11" fill="#333" filter="url(#rough2)">② pos = 15 − 9 = 6，L = 2 → i = 5÷2 = 2，j = 5 mod 2 = 1</text>
  <text x="40" y="212" font-size="10" fill="#666" filter="url(#rough2)">（块内第 6 位 → 第 i=2 个整数的第 j=1 位）</text>

  <!-- 步骤 ③ -->
  <rect x="25" y="230" width="470" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="249" font-size="11" fill="#333" filter="url(#rough2)">③ b=1 为奇数块（递减）：第 i=2 个整数 = 19 − 2 = 17</text>
  <text x="40" y="266" font-size="10" fill="#666" filter="url(#rough2)">（取 17 从左起第 j+1 = 2 位）</text>

  <!-- 结论 -->
  <rect x="25" y="284" width="470" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = "17" 的第 2 位 → 7 ✓</text>
</svg>
