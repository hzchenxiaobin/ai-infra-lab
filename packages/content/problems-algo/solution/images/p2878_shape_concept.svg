<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">df.shape：一次拿到 行 × 列</text>

  <!-- Left: DataFrame table -->
  <rect x="40" y="60" width="230" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">players（DataFrame）</text>

  <!-- header row -->
  <rect x="76" y="90" width="62" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="107" y="106" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">player_id</text>
  <rect x="140" y="90" width="52" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="106" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="194" y="90" width="46" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="217" y="106" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">team</text>

  <!-- data rows -->
  <rect x="50" y="118" width="26" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="63" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="76" y="118" width="62" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="107" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">846</text>
  <rect x="140" y="118" width="52" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Mason</text>
  <rect x="194" y="118" width="46" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="217" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Real..</text>

  <rect x="50" y="140" width="26" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="63" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="76" y="140" width="62" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="107" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">749</text>
  <rect x="140" y="140" width="52" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Riley</text>
  <rect x="194" y="140" width="46" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="217" y="154" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Bar..</text>

  <rect x="50" y="162" width="26" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="63" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="76" y="162" width="62" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="107" y="176" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">155</text>
  <rect x="140" y="162" width="52" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="176" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="194" y="162" width="46" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="217" y="176" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Man..</text>

  <text x="155" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⋮  （共 10 行）</text>

  <!-- rows arrow (right of table, pointing down) -->
  <path d="M 284 92 L 284 216" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="140" font-size="11" fill="#446688" filter="url(#rough2)">行数</text>
  <text x="296" y="156" font-size="11" fill="#446688" filter="url(#rough2)">= 10</text>

  <!-- cols arrow (below table, pointing right) -->
  <path d="M 76 240 L 252 240" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="260" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">列数 = 5（图示 3 列 + 省略 2 列）</text>

  <!-- Middle: .shape attribute -->
  <path d="M 300 170 L 340 170" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="344" y="128" width="86" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="387" y="152" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">players.shape</text>
  <text x="387" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">属性，不是方法</text>
  <text x="387" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不加括号 ()</text>

  <!-- Right: tuple to list -->
  <path d="M 432 170 L 462 170" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="466" y="112" width="76" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="504" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(10, 5)</text>
  <text x="504" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">tuple</text>

  <path d="M 504 164 L 504 186" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="512" y="180" font-size="9" fill="#4a7a3a" filter="url(#rough2)">list()</text>

  <rect x="466" y="190" width="76" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="504" y="209" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[10, 5]</text>
  <text x="504" y="227" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">题目要的 list</text>

  <!-- Bottom warning -->
  <rect x="55" y="290" width="450" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ df.size 不是 df.shape</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">df.size = 行数 × 列数 = 10 × 5 = 50（元素总数）</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">标题里的 Size 容易误导——求形状要用 .shape</text>
</svg>
