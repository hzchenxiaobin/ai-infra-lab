<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：三元表达式右结合 → 从右向左归约</text>

  <!-- expression cells: a ? b : c ? d : e -->
  <text x="20" y="62" font-size="12" fill="#888">expr：</text>
  <g filter="url(#rough2)">
    <rect x="58" y="48" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="73" y="68" text-anchor="middle" font-size="12" fill="#333">a</text>
    <rect x="92" y="48" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="107" y="68" text-anchor="middle" font-size="12" fill="#888">?</text>
    <rect x="126" y="48" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="141" y="68" text-anchor="middle" font-size="12" fill="#333">b</text>
    <rect x="160" y="48" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="175" y="68" text-anchor="middle" font-size="12" fill="#888">:</text>
    <rect x="194" y="48" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="209" y="68" text-anchor="middle" font-size="12" fill="#333">c</text>
    <rect x="228" y="48" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="243" y="68" text-anchor="middle" font-size="12" fill="#888">?</text>
    <rect x="262" y="48" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="277" y="68" text-anchor="middle" font-size="12" fill="#333">d</text>
    <rect x="296" y="48" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="311" y="68" text-anchor="middle" font-size="12" fill="#888">:</text>
    <rect x="330" y="48" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="345" y="68" text-anchor="middle" font-size="12" fill="#333">e</text>
  </g>

  <!-- LEFT: wrong left-assoc tree -->
  <text x="120" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 左结合（错误）</text>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.5" fill="none">
    <line x1="120" y1="130" x2="80" y2="156"/>
    <line x1="120" y1="130" x2="160" y2="156"/>
    <line x1="160" y1="156" x2="140" y2="182"/>
    <line x1="160" y1="156" x2="180" y2="182"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="105" y="118" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="120" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">?</text>
    <rect x="65" y="148" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="80" y="164" text-anchor="middle" font-size="11" fill="#333">a?b</text>
    <rect x="145" y="148" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="160" y="164" text-anchor="middle" font-size="11" fill="#333">:</text>
    <rect x="125" y="174" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="140" y="190" text-anchor="middle" font-size="11" fill="#333">c</text>
    <rect x="165" y="174" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="180" y="190" text-anchor="middle" font-size="11" fill="#333">d:e</text>
  </g>
  <text x="120" y="216" text-anchor="middle" font-size="10" fill="#b85450">(a?b:c) ? d : e</text>

  <!-- RIGHT: correct right-assoc tree -->
  <text x="370" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 右结合（正确）</text>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.5" fill="none">
    <line x1="370" y1="130" x2="330" y2="156"/>
    <line x1="370" y1="130" x2="410" y2="156"/>
    <line x1="410" y1="156" x2="390" y2="182"/>
    <line x1="410" y1="156" x2="430" y2="182"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="355" y="118" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">?</text>
    <rect x="315" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="330" y="164" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="355" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="164" text-anchor="middle" font-size="11" fill="#333">b</text>
    <rect x="395" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="410" y="164" text-anchor="middle" font-size="11" fill="#333">:</text>
    <rect x="375" y="174" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="390" y="190" text-anchor="middle" font-size="11" fill="#333">c</text>
    <rect x="415" y="174" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="430" y="190" text-anchor="middle" font-size="11" fill="#333">d:e</text>
  </g>
  <text x="370" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">a ? b : (c ? d : e)</text>

  <!-- arrow: inner c?d:e resolves first -->
  <path d="M 280 232 L 280 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">先算内层</text>

  <!-- insight box -->
  <rect x="30" y="258" width="500" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">从右向左扫描：最右的 ? 先归约</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#555">普通字符压栈；遇 ? 时弹两段（真/假分支）按条件压回一段</text>

  <!-- footer -->
  <rect x="30" y="322" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#444">每个 ? 把「条件 + 两子表达式」归约成一个值 → 自底向上建语法树</text>
</svg>
