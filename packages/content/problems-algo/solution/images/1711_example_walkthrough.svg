<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：deliciousness = [1,3,5,7,9] → 4</text>

  <!-- ===== Array row ===== -->
  <text x="40" y="56" font-size="10" fill="#888" filter="url(#rough2)">数组：</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="78" y="44" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="97" y="65" fill="#446688">1</text>
    <rect x="116" y="44" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="135" y="65" fill="#446688">3</text>
    <rect x="154" y="44" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="173" y="65" fill="#446688">5</text>
    <rect x="192" y="44" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="211" y="65" fill="#446688">7</text>
    <rect x="230" y="44" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="249" y="65" fill="#446688">9</text>
  </g>
  <text x="284" y="65" font-size="9" fill="#aaa" filter="url(#rough2)">幂集合 {1,2,4,8,16,32,…}</text>

  <!-- column headers -->
  <text x="86" y="96" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="160" y="96" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">x（当前餐）</text>
  <text x="250" y="96" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">命中补数</text>
  <text x="430" y="96" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">ans　/　cnt 状态</text>

  <!-- ===== Step 0: x=1 ===== -->
  <rect x="40" y="104" width="500" height="56" fill="#fff" stroke="#eee" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="128" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=0</text>
  <rect x="148" y="116" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="250" y="128" font-size="10" fill="#888" filter="url(#rough2)">p=4→补3？p=8→补7？…</text>
  <text x="250" y="144" font-size="10" fill="#aaa" filter="url(#rough2)">cnt 为空，全无命中</text>
  <text x="430" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0</text>
  <text x="430" y="146" font-size="10" fill="#555" filter="url(#rough2)">cnt = {1:1} ← 存入</text>

  <!-- ===== Step 1: x=3 ===== -->
  <rect x="40" y="164" width="500" height="56" fill="#fff" stroke="#eee" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="188" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=1</text>
  <rect x="148" y="176" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="197" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="250" y="188" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p=4 → 补数=1，cnt[1]=1 ✓</text>
  <text x="250" y="204" font-size="9" fill="#888" filter="url(#rough2)">(3+1=4=2² 是幂)</text>
  <text x="430" y="188" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0+1 = 1</text>
  <text x="430" y="206" font-size="10" fill="#555" filter="url(#rough2)">cnt = {1:1, 3:1}</text>

  <!-- ===== Step 2: x=5 ===== -->
  <rect x="40" y="224" width="500" height="56" fill="#fff" stroke="#eee" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="248" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2</text>
  <rect x="148" y="236" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="257" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="250" y="248" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p=8 → 补数=3，cnt[3]=1 ✓</text>
  <text x="250" y="264" font-size="9" fill="#888" filter="url(#rough2)">(5+3=8=2³ 是幂)</text>
  <text x="430" y="248" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 1+1 = 2</text>
  <text x="430" y="266" font-size="10" fill="#555" filter="url(#rough2)">cnt = {1:1, 3:1, 5:1}</text>

  <!-- ===== Step 3: x=7 ===== -->
  <rect x="40" y="284" width="500" height="56" fill="#fff" stroke="#eee" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="308" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=3</text>
  <rect x="148" y="296" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="317" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="250" y="308" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p=8 → 补数=1，cnt[1]=1 ✓</text>
  <text x="250" y="324" font-size="9" fill="#888" filter="url(#rough2)">(7+1=8=2³ 是幂)</text>
  <text x="430" y="308" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 2+1 = 3</text>
  <text x="430" y="326" font-size="10" fill="#555" filter="url(#rough2)">cnt = {1:1, 3:1, 5:1, 7:1}</text>

  <!-- ===== Step 4: x=9 ===== -->
  <rect x="40" y="344" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="368" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=4</text>
  <rect x="148" y="356" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="377" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="250" y="368" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p=16 → 补数=7，cnt[7]=1 ✓</text>
  <text x="250" y="384" font-size="9" fill="#888" filter="url(#rough2)">(9+7=16=2⁴ 是幂)</text>
  <text x="430" y="368" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 3+1 = 4</text>
  <text x="430" y="386" font-size="10" fill="#555" filter="url(#rough2)">cnt = {1,3,5,7,9 各 1}</text>

  <!-- ===== Result box ===== -->
  <rect x="40" y="412" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="432" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">配对结果（每对 i&lt;j 恰数一次）：</text>
  <text x="56" y="450" font-size="10" fill="#555" filter="url(#rough2)">(1,3)=4　(3,5)=8　(1,7)=8　(7,9)=16　→ 共 4 对大餐</text>
  <text x="56" y="466" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键：先查后存，i=3 处理 7 时只看到之前的 1（看不到自己），避免自配对</text>

  <!-- Footer -->
  <text x="290" y="504" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个 x 枚举至多 22 个幂，命中即累加历史频次 —— O(22n) 一次遍历完成计数</text>

  <text x="290" y="524" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">（注：示例仅显示命中的幂，实际会枚举全部 22 个幂查补数）</text>
</svg>
