<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">修复：右半的 c 与后面更大的字符逐对交换（aabbcc）</text>

  <!-- half brackets -->
  <path d="M 150 40 L 150 34 L 268 34 L 268 40" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="209" y="30" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">左半：m 个最小字符，不动</text>
  <path d="M 316 40 L 316 34 L 434 34 L 434 40" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="375" y="30" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">右半：局部换血</text>

  <!-- Row 1: sorted with middle conflict -->
  <text x="26" y="74" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 排序</text>
  <rect x="150" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="198" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="72" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="294" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="72" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="342" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="390" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="292" y="100" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">中间对 s[2] = s[3] = b，冲突！</text>

  <!-- Row 2: locate i and j -->
  <text x="26" y="148" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 定位</text>
  <text x="316" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="364" y="122" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="150" y="126" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="198" y="126" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="126" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="294" y="126" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="342" y="126" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="148" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="390" y="126" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="292" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i 跳过右半整段 b，指向第一个 ≠ b 的字符；j 指向冲突对右端</text>

  <!-- Row 3: swap -->
  <text x="26" y="218" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ 交换</text>
  <path d="M 364 190 C 364 178 316 178 316 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="196" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="198" y="196" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="294" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="342" y="196" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="390" y="196" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="292" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c 顶进中间，b 挤到后面 → 中间对 b ≠ c，修好 ✓</text>

  <!-- Row 4: next pair check -->
  <text x="26" y="288" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">④ 下一对</text>
  <text x="364" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="150" y="266" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="288" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="198" y="266" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="288" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="246" y="266" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="294" y="266" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="342" y="266" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="288" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="390" y="266" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="288" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="292" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">j 右移：s[4] = b 对 s[1] = a，不冲突 → 停止</text>

  <!-- final box -->
  <rect x="40" y="328" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">左半不动 = 字典序下限；右半只做「最小必要」的交换</text>
  <text x="260" y="361" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 "aabcbc" 就是字典序最小的反回文</text>
</svg>
