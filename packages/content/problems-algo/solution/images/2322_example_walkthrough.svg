<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：删边 (0−1) 与 (1−2) → 三段异或 {5, 10, 1}，分数 9</text>

  <!-- ============ Component enclosures (behind nodes) ============ -->
  <!-- C3 {0}: orange -->
  <ellipse cx="280" cy="64" rx="26" ry="20" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- C2 {1,3,4}: blue -->
  <rect x="256" y="106" width="124" height="144" rx="12" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- C1 {2}: green -->
  <ellipse cx="200" cy="176" rx="26" ry="22" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Edges ============ -->
  <!-- 0-1 cut -->
  <line x1="280" y1="80" x2="280" y2="104" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="294" y="95" font-size="11" fill="#b85450" filter="url(#rough2)">切</text>
  <!-- 1-2 cut -->
  <line x1="266" y1="136" x2="214" y2="164" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="226" y="144" font-size="11" fill="#b85450" filter="url(#rough2)">切</text>
  <!-- 1-3 -->
  <line x1="296" y1="136" x2="344" y2="164" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 3-4 -->
  <line x1="360" y1="192" x2="360" y2="218" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ============ Nodes ============ -->
  <!-- node 0 -->
  <circle cx="280" cy="64" r="16" fill="#fff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="258" y="52" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <!-- node 1 -->
  <circle cx="280" cy="120" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="258" y="108" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <!-- node 2 -->
  <circle cx="200" cy="176" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="178" y="164" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <!-- node 3 -->
  <circle cx="360" cy="176" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="338" y="164" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <!-- node 4 -->
  <circle cx="360" cy="232" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="338" y="220" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <!-- ============ Component XOR labels ============ -->
  <text x="322" y="64" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">z = 1</text>
  <text x="394" y="176" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">y = 10</text>
  <text x="160" y="176" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 5</text>

  <!-- ============ Result row ============ -->
  <rect x="120" y="288" width="60" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="190" y="288" width="60" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="260" y="288" width="60" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="330" y="308" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">→  max − min = 10 − 1 = 9</text>
</svg>
