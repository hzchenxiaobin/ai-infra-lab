<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：区间重叠 → 反连接 → 计数</text>

  <!-- ===== Step 1: FROM Subscriptions ===== -->
  <rect x="60" y="42" width="200" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">FROM Subscriptions s</text>
  <text x="160" y="76" text-anchor="middle" font-size="8" fill="#888">读取全部订阅行</text>
  <text x="160" y="88" text-anchor="middle" font-size="8" fill="#888">6 个账户</text>

  <!-- Arrow down -->
  <path d="M 160 94 L 160 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: WHERE overlap 2021 ===== -->
  <rect x="40" y="116" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">WHERE 区间重叠 2021</text>
  <text x="160" y="150" text-anchor="middle" font-size="8" fill="#666">s.start_date ≤ '2021-12-31'</text>
  <text x="160" y="162" text-anchor="middle" font-size="8" fill="#666">AND s.end_date ≥ '2021-01-01'</text>

  <!-- Arrow down -->
  <path d="M 160 176 L 160 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Intermediate result: 5 accounts (exclude acc 11) -->
  <rect x="80" y="198" width="160" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="214" text-anchor="middle" font-size="9" fill="#666">2021 活跃账户</text>
  <text x="160" y="230" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">9, 3, 13, 4, 5（排除了 11）</text>

  <!-- Arrow right to anti-join -->
  <path d="M 240 218 L 300 218" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: NOT EXISTS (right side) ===== -->
  <rect x="304" y="116" width="240" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="424" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">AND NOT EXISTS (...)</text>
  <text x="424" y="150" text-anchor="middle" font-size="8" fill="#666">SELECT 1 FROM Streams st</text>
  <text x="424" y="162" text-anchor="middle" font-size="8" fill="#666">WHERE st.account_id = s.account_id</text>

  <!-- NOT EXISTS subquery box -->
  <rect x="304" y="186" width="240" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="424" y="202" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">子查询：2021 年的 stream</text>
  <text x="424" y="216" text-anchor="middle" font-size="8" fill="#666">AND YEAR(st.stream_date) = 2021</text>
  <text x="424" y="228" text-anchor="middle" font-size="8" fill="#888">有 2021 stream 的账户：3, 13, 5</text>

  <!-- Arrow down from NOT EXISTS -->
  <path d="M 424 238 L 424 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Filter result ===== -->
  <rect x="324" y="260" width="200" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="424" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">反连接结果</text>
  <text x="424" y="294" text-anchor="middle" font-size="9" fill="#666">活跃但无 2021 stream</text>
  <text x="424" y="306" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">acc 4, acc 9</text>

  <!-- Arrow from intermediate to result (merge) -->
  <path d="M 160 238 L 160 270 C 160 290, 280 290, 324 286" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: COUNT ===== -->
  <path d="M 424 312 L 424 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="334" y="332" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="424" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT COUNT(*)</text>
  <text x="424" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">AS accounts_count</text>

  <!-- Result box -->
  <path d="M 514 354 L 544 354" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="548" y="340" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="562" y="360" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- SQL clause order note -->
  <rect x="40" y="340" width="240" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="160" y="356" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序</text>
  <text x="160" y="370" text-anchor="middle" font-size="8" fill="#666">FROM → WHERE（含 NOT EXISTS）→ SELECT(COUNT)</text>
  <text x="160" y="382" text-anchor="middle" font-size="8" fill="#888">NOT EXISTS 属于 WHERE，逐行判定</text>
</svg>
