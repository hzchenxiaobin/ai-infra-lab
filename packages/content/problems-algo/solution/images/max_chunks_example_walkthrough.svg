<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：维护 mx，每当 mx == i 即切刀</text>

  <!-- ===== Panel 1: arr = [1,0,2,3,4] ===== -->
  <text x="70" y="62" font-size="12.5" fill="#446688" font-weight="bold">示例①  arr = [1, 0, 2, 3, 4]</text>

  <!-- arr cells: width 52 start x=70 -->
  <rect x="70"  y="74" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="96"  y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="74" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="174" y="74" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="226" y="74" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="278" y="74" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="96"  y="124" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="148" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="200" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="252" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="304" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <!-- mx row -->
  <text x="48" y="160" text-anchor="end" font-size="11" fill="#888" font-weight="bold">mx</text>
  <rect x="70"  y="142" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="96"  y="161" text-anchor="middle" font-size="12.5" fill="#888">1</text>
  <rect x="122" y="142" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="148" y="161" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="174" y="142" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="200" y="161" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="226" y="142" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="161" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">3</text>
  <rect x="278" y="142" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="304" y="161" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">4</text>

  <!-- cut markers (✂ at boundaries where mx==i): after i=1 (x=174), i=2 (x=226), i=3 (x=278), i=4 (x=330) -->
  <path d="M 174 70 L 174 178" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="178" y="190" font-size="11" fill="#b85450" font-weight="bold">✂ 块1</text>
  <path d="M 226 70 L 226 178" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="230" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">✂ 块2</text>
  <path d="M 278 70 L 278 178" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="282" y="190" font-size="11" fill="#d6a040" font-weight="bold">✂ 块3</text>
  <path d="M 330 70 L 330 178" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="334" y="190" font-size="11" fill="#446688" font-weight="bold">✂ 块4</text>

  <text x="96" y="208" text-anchor="middle" font-size="10.5" fill="#888">i=0: mx=1≠0</text>
  <text x="200" y="208" text-anchor="middle" font-size="10.5" fill="#888">i=1..4: 依次 mx==i，连切 4 刀</text>

  <!-- ===== Panel 2: arr = [4,3,2,1,0] ===== -->
  <text x="70" y="246" font-size="12.5" fill="#446688" font-weight="bold">示例②  arr = [4, 3, 2, 1, 0]</text>

  <rect x="70"  y="258" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="96"  y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="258" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="174" y="258" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="226" y="258" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="278" y="258" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <text x="96"  y="308" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="148" y="308" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="200" y="308" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="252" y="308" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="304" y="308" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <text x="48" y="344" text-anchor="end" font-size="11" fill="#888" font-weight="bold">mx</text>
  <rect x="70"  y="326" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96"  y="345" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">4</text>
  <rect x="122" y="326" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="345" text-anchor="middle" font-size="12.5" fill="#888">4</text>
  <rect x="174" y="326" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="345" text-anchor="middle" font-size="12.5" fill="#888">4</text>
  <rect x="226" y="326" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="345" text-anchor="middle" font-size="12.5" fill="#888">4</text>
  <rect x="278" y="326" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="304" y="345" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">4</text>

  <!-- single cut at end (x=330) -->
  <path d="M 330 254 L 330 362" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="334" y="374" font-size="11" fill="#446688" font-weight="bold">✂ 仅 1 块</text>

  <text x="200" y="374" text-anchor="middle" font-size="10.5" fill="#888">mx 一路保持 4，直到 i=4 才满足 mx==i</text>

  <!-- answer box -->
  <rect x="70" y="396" width="440" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="418" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例① 答案 = 4        示例② 答案 = 1</text>
</svg>
