<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：8 条朋友边逐一判定</text>

  <!-- 主表 -->
  <rect x="24" y="44" width="312" height="238" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">朋友对 (a,b)</text>
  <text x="162" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">共同朋友 z</text>
  <text x="248" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="304" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">输出</text>
  <line x1="24" y1="72" x2="336" y2="72" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="44" x2="120" y2="282" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="206" y1="44" x2="206" y2="282" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="272" y1="44" x2="272" y2="282" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="72" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="162" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="248" y="92" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="92" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="72" y="118" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <text x="162" y="118" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="248" y="118" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="118" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="72" y="144" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 4)</text>
  <text x="162" y="144" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="248" y="144" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="144" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="72" y="170" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1, 5)</text>
  <text x="162" y="170" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="248" y="170" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="170" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <rect x="26" y="180" width="308" height="24" fill="#e6f4ea" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="72" y="196" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(6, 7)</text>
  <text x="162" y="196" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">无</text>
  <text x="248" y="196" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 保留</text>
  <text x="304" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✅</text>

  <text x="72" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3, 4)</text>
  <text x="162" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="248" y="222" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="72" y="248" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 5)</text>
  <text x="162" y="248" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="248" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">✗ 排除</text>
  <text x="304" y="248" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>

  <rect x="26" y="258" width="308" height="24" fill="#e6f4ea" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="72" y="274" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(8, 9)</text>
  <text x="162" y="274" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">无</text>
  <text x="248" y="274" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 保留</text>
  <text x="304" y="274" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✅</text>

  <!-- 右侧卡片 A：清单来源 -->
  <rect x="352" y="44" width="146" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">清单从哪来：按 z 分组</text>
  <text x="362" y="80" font-size="8.5" fill="#333" filter="url(#rough2)">z=1：朋友{2,5} → (2,5)</text>
  <text x="362" y="98" font-size="8.5" fill="#333" filter="url(#rough2)">z=2：{1,3,4,5} → 6 对</text>
  <text x="362" y="116" font-size="8.5" fill="#333" filter="url(#rough2)">z=3：{2,4} → (2,4)</text>
  <text x="362" y="134" font-size="8.5" fill="#333" filter="url(#rough2)">z=4：{2,3} → (2,3)</text>
  <text x="362" y="152" font-size="8.5" fill="#333" filter="url(#rough2)">z=5：{1,2} → (1,2)</text>
  <text x="362" y="170" font-size="8.5" fill="#333" filter="url(#rough2)">z=6~9：度为 1，无产出</text>
  <text x="362" y="186" font-size="8" fill="#888" filter="url(#rough2)">（z 的朋友们两两配对）</text>

  <!-- 右侧卡片 B：最终输出 -->
  <rect x="352" y="208" width="146" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="230" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最终输出（升序）</text>
  <text x="425" y="252" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(6, 7)</text>
  <text x="425" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(8, 9)</text>

  <!-- 底部自检卡 -->
  <rect x="24" y="296" width="474" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="261" y="316" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">自检：两条保留边 (6,7)、(8,9) 均不在任何三角形中；</text>
  <text x="261" y="336" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">其余 6 条边各被一个共同朋友排除，与题面解释逐一对应。</text>
</svg>
