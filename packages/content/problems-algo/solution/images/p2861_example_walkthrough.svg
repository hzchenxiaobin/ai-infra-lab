<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算（示例 3）：n = 2, k = 3, budget = 10</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">逐台机器算花费 f(x)，各自找最大可行份数，答案取 max</text>
  <text x="310" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">composition = [[2,1],[1,2],[1,1]]，stock = [1,1]，cost = [5,5]</text>

  <!-- table header -->
  <rect x="70" y="82" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">机器（配方）</text>
  <text x="260" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <text x="340" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <text x="420" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 3</text>
  <text x="505" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">最大份数</text>

  <!-- row 1 -->
  <rect x="70" y="112" width="480" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">机器 1 [2,1]</text>
  <text x="260" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <text x="340" y="131" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">20 ✗</text>
  <text x="420" y="131" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">35 ✗</text>
  <text x="505" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="70" y="142" width="480" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">机器 2 [1,2]</text>
  <text x="260" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <text x="340" y="161" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">20 ✗</text>
  <text x="420" y="161" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">35 ✗</text>
  <text x="505" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 3 (highlight) -->
  <rect x="70" y="172" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="191" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">机器 3 [1,1]</text>
  <text x="260" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="340" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10 ✓</text>
  <text x="420" y="191" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">20 ✗</text>
  <text x="505" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- column separators -->
  <path d="M 220 82 L 220 202 M 300 82 L 300 202 M 380 82 L 380 202 M 460 82 L 460 202" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- notes -->
  <text x="70" y="234" font-size="11" fill="#333" filter="url(#rough2)">• 机器 3：库存各 1 份 → 第 1 份合金完全白拿，f(1) = 0</text>
  <text x="70" y="254" font-size="11" fill="#333" filter="url(#rough2)">• 第 2 份两种金属各买 1 份 → 1×5 + 1×5 = 10，恰好打满预算</text>
  <text x="70" y="274" font-size="11" fill="#999" filter="url(#rough2)">• 机器 1：f(2) = max(0, 4−1)×5 + max(0, 2−1)×5 = 20 &gt; 10，止步 1 份</text>

  <!-- answer -->
  <rect x="70" y="292" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="313" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max(1, 1, 2) = 2 ✓</text>
  <text x="310" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全局二分 [0, 2×10⁸]，约 28 次判定收敛；暴力逐份最坏要试 2×10⁸ 次</text>

  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">库存抵扣 max(0, ·) 是唯一的花活，其余是标准二分答案模板</text>
</svg>
