<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[2,2,2,5,2]，基准 target=2</text>

  <!-- 左侧树，前序访问编号 -->
  <line x1="172" y1="88" x2="138" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="188" y1="88" x2="222" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="78" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="160" y="70" font-size="11" fill="#4a7a3a" font-weight="bold">①</text>

  <line x1="131" y1="146" x2="108" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="145" y1="146" x2="168" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="138" cy="134" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="138" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>

  <circle cx="224" cy="134" r="14" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="224" y="138" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="236" y="126" font-size="9" fill="#999">未访问</text>

  <circle cx="106" cy="196" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="106" y="200" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="84" y="190" font-size="11" fill="#b85450" font-weight="bold">③✗</text>

  <circle cx="170" cy="196" r="12" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="10" fill="#999">2</text>

  <!-- 访问路径虚线箭头 ①→②→③ -->
  <path d="M 168 86 Q 150 110 142 120" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 150 Q 116 172 110 184" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧演算表 -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前序访问步骤</text>
  <rect x="320" y="70" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <text x="395" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">节点val</text>
  <text x="475" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=2? 动作</text>

  <rect x="320" y="96" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="345" y="114" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="395" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="475" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 继续递归</text>

  <rect x="320" y="122" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="345" y="140" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="395" y="140" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="475" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 继续递归</text>

  <rect x="320" y="148" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="166" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="395" y="166" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="475" y="166" text-anchor="middle" font-size="10" fill="#b85450">✗ 返回 false</text>

  <!-- 结论框 -->
  <rect x="40" y="250" width="480" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">短路效应</text>
  <text x="60" y="296" font-size="11" fill="#555">前序访问 ①根 ②左子 后进入 ③左左叶节点 5，发现 5 ≠ 2 立即返回 false。</text>
  <text x="60" y="314" font-size="11" fill="#b85450">此时 ②的右子(2)、根的右子(2) 均未被访问——递归因 &amp;&amp; 短路而提前终止。</text>
  <text x="60" y="332" font-size="11" fill="#4a7a3a">最好情况 O(1)：根的左孩子就不等，直接返回；最坏 O(n) 需遍历全部节点。</text>
  <text x="60" y="350" font-size="11" fill="#555">最终整棵树返回 false ✓（与示例输出一致）。</text>
</svg>
