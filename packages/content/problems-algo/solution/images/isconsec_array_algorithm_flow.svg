<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">两种判定流程：排序法 vs 哈希法</text>

  <!-- ===== Left column: 排序法 ===== -->
  <rect x="30" y="46" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">排序法  O(n log n)</text>

  <!-- step1 sort -->
  <rect x="50" y="92" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="113" text-anchor="middle" font-size="12" fill="#333">① 对 nums 升序排序</text>
  <path d="M145 126 L145 146" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step2 check nums[i]==nums[0]+i -->
  <rect x="40" y="148" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="166" text-anchor="middle" font-size="11" fill="#333">② 遍历 i=1..n−1：</text>
  <text x="145" y="182" text-anchor="middle" font-size="11" fill="#333">若 nums[i] ≠ nums[0]+i → 缺口/重复</text>
  <path d="M145 192 L145 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="145,214 205,254 145,294 85,254" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="250" text-anchor="middle" font-size="11" fill="#333">全部满足?</text>
  <text x="145" y="266" text-anchor="middle" font-size="11" fill="#333">nums[i]=nums[0]+i</text>
  <path d="M120 290 L100 318" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="306" text-anchor="end" font-size="10" fill="#b85450">否</text>
  <path d="M170 290 L190 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="194" y="306" font-size="10" fill="#4a7a3a">是</text>

  <rect x="48" y="320" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="339" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>
  <rect x="168" y="320" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="205" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="145" y="380" text-anchor="middle" font-size="10" fill="#777">排序后相邻差必为 1，</text>
  <text x="145" y="394" text-anchor="middle" font-size="10" fill="#777">一步兼顾“无重复 + 连续”</text>

  <!-- ===== Right column: 哈希法 ===== -->
  <rect x="300" y="46" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">哈希法  O(n)</text>

  <!-- step1 min/max + set -->
  <rect x="316" y="92" width="198" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="113" text-anchor="middle" font-size="12" fill="#333">① 一趟求 min / max / set</text>
  <path d="M415 126 L415 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- decision1: max-min==n-1? -->
  <polygon points="415,148 478,184 415,220 352,184" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="180" text-anchor="middle" font-size="11" fill="#333">max−min</text>
  <text x="415" y="196" text-anchor="middle" font-size="11" fill="#333">== n−1 ?</text>
  <path d="M372 206 L340 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="216" font-size="10" fill="#b85450">否</text>
  <path d="M415 220 L415 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424" y="236" font-size="10" fill="#4a7a3a">是</text>

  <rect x="296" y="234" width="78" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="335" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- decision2: len(set)==n? -->
  <polygon points="415,246 478,282 415,318 352,282" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="278" text-anchor="middle" font-size="11" fill="#333">len(set)</text>
  <text x="415" y="294" text-anchor="middle" font-size="11" fill="#333">== n ?</text>
  <path d="M372 304 L340 330" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="318" font-size="10" fill="#b85450">否</text>
  <path d="M415 318 L415 342" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424" y="334" font-size="10" fill="#4a7a3a">是</text>

  <rect x="296" y="332" width="78" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="335" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>
  <rect x="378" y="344" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="363" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="415" y="380" text-anchor="middle" font-size="10" fill="#777">先卡跨度，再查互异；</text>
  <text x="415" y="394" text-anchor="middle" font-size="10" fill="#777">两关都过才连续</text>

  <!-- divider -->
  <line x1="282" y1="50" x2="282" y2="400" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,4" filter="url(#rough2)"/>
</svg>
