<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">滑动窗口 + 单调递减队列维护 max(charge)</text>

  <!-- chargeTimes row -->
  <text x="36" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">charge:</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="146" y="78" filter="url(#rough2)">3</text>
    <rect x="180" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="206" y="78" filter="url(#rough2)">6</text>
    <rect x="240" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="266" y="78" filter="url(#rough2)">1</text>
    <rect x="300" y="56" width="52" height="32" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="326" y="78" fill="#888" filter="url(#rough2)">3</text>
    <rect x="360" y="56" width="52" height="32" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="386" y="78" fill="#888" filter="url(#rough2)">4</text>
  </g>
  <text x="424" y="74" font-size="11" fill="#888" filter="url(#rough2)">...</text>

  <!-- runningCosts row -->
  <text x="36" y="118" font-size="13" fill="#d6a040" filter="url(#rough2)">runCost:</text>
  <g font-size="13" fill="#7a5a10" text-anchor="middle">
    <rect x="120" y="100" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="146" y="119" filter="url(#rough2)">2</text>
    <rect x="180" y="100" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="206" y="119" filter="url(#rough2)">1</text>
    <rect x="240" y="100" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="266" y="119" filter="url(#rough2)">3</text>
  </g>

  <!-- window bracket -->
  <path d="M120,146 L120,138 L292,138 L292,146" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">窗口 [l, r] = [0, 2]，长度 k = 3</text>

  <!-- monotonic deque -->
  <text x="36" y="206" font-size="13" fill="#446688" filter="url(#rough2)">单调队列(下标):</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="150" y="186" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="180" y="208" filter="url(#rough2)">1 →6</text>
    <rect x="220" y="186" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="250" y="208" filter="url(#rough2)">2 →1</text>
  </g>
  <text x="150" y="178" font-size="11" fill="#b85450" filter="url(#rough2)">队头=窗口最大</text>
  <path d="M212,210 L216,210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">值递减</text>
  <text x="288" y="214" font-size="11" fill="#888" filter="url(#rough2)">(队尾入/弹)</text>

  <!-- cost formula -->
  <rect x="60" y="248" width="440" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">总成本 = max(charge[l..r]) + k × sum(runCost[l..r])</text>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">= max(3,6,1) + 3 × (2+1+3) = 6 + 18 = 24 ≤ 25 ✓</text>

  <!-- shrink hint -->
  <rect x="60" y="332" width="440" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#7a2a26" filter="url(#rough2)">若成本 &gt; budget：成本随 r 增长单调不降 ⇒ 左端 l 右移收缩</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">删 l 时若 l 在队头则出队（懒惰删除），sum 同步减</text>
</svg>
