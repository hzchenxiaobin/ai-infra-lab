<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：logs = [[0,5],[1,2],[0,2],[0,5],[1,3]], k = 5</text>

  <!-- ===== Section A: building userTimes ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段①：遍历日志构建 userTimes</text>

  <!-- table header -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <rect x="32" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="78" fill="#446688">步骤</text>
    <rect x="88" y="62" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="138" y="78" fill="#446688">日志 [id,t]</text>
    <rect x="188" y="62" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="248" y="78" fill="#446688">操作</text>
    <rect x="308" y="62" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="418" y="78" fill="#446688">userTimes 状态</text>
  </g>

  <!-- row i=0 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="86" width="56" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="60" y="102" fill="#555">i=0</text>
    <rect x="88" y="86" width="100" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="138" y="102" fill="#446688" font-weight="bold">[0, 5]</text>
    <rect x="188" y="86" width="120" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="248" y="102" fill="#555">add(5)</text>
    <rect x="308" y="86" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="418" y="102" fill="#4a7a3a" font-weight="bold">{0: {5}}</text>
  </g>

  <!-- row i=1 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="110" width="56" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="60" y="126" fill="#555">i=1</text>
    <rect x="88" y="110" width="100" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="138" y="126" fill="#446688" font-weight="bold">[1, 2]</text>
    <rect x="188" y="110" width="120" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="248" y="126" fill="#555">add(2)</text>
    <rect x="308" y="110" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="418" y="126" fill="#4a7a3a" font-weight="bold">{0: {5}, 1: {2}}</text>
  </g>

  <!-- row i=2 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="134" width="56" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="60" y="150" fill="#555">i=2</text>
    <rect x="88" y="134" width="100" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="138" y="150" fill="#446688" font-weight="bold">[0, 2]</text>
    <rect x="188" y="134" width="120" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="248" y="150" fill="#555">add(2)</text>
    <rect x="308" y="134" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="418" y="150" fill="#4a7a3a" font-weight="bold">{0: {5,2}, 1: {2}}</text>
  </g>

  <!-- row i=3 (highlighted - duplicate) -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="158" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="60" y="174" fill="#d6a040" font-weight="bold">i=3</text>
    <rect x="88" y="158" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="138" y="174" fill="#d6a040" font-weight="bold">[0, 5]</text>
    <rect x="188" y="158" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="248" y="174" fill="#d6a040" font-weight="bold">add(5) ★</text>
    <rect x="308" y="158" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="418" y="174" fill="#b85450" font-weight="bold">5 已存在，无变化</text>
  </g>

  <!-- row i=4 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="182" width="56" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="60" y="198" fill="#555">i=4</text>
    <rect x="88" y="182" width="100" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="138" y="198" fill="#446688" font-weight="bold">[1, 3]</text>
    <rect x="188" y="182" width="120" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="248" y="198" fill="#555">add(3)</text>
    <rect x="308" y="182" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="418" y="198" fill="#4a7a3a" font-weight="bold">{0: {5,2}, 1: {2,3}}</text>
  </g>

  <!-- note for i=3 -->
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ i=3 的 [0,5] 是重复操作，集合 add(5) 不改变状态 —— 这就是「插入即去重」</text>

  <!-- divider -->
  <line x1="32" y1="246" x2="528" y2="246" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Section B: distribution counting ===== -->
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">阶段②：统计 UAM 分布</text>

  <!-- distribution table header -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <rect x="32" y="282" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="72" y="298" fill="#b85450">用户</text>
    <rect x="112" y="282" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="182" y="298" fill="#b85450">时间集合</text>
    <rect x="252" y="282" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="302" y="298" fill="#b85450">UAM = len</text>
    <rect x="352" y="282" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="392" y="298" fill="#b85450">answer 下标</text>
    <rect x="432" y="282" width="96" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="480" y="298" fill="#b85450">answer 变化</text>
  </g>

  <!-- user 0 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="306" width="80" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="72" y="322" fill="#4a7a3a" font-weight="bold">ID=0</text>
    <rect x="112" y="306" width="140" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="182" y="322" fill="#446688" font-weight="bold">{5, 2}</text>
    <rect x="252" y="306" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="302" y="322" fill="#d6a040" font-weight="bold">2</text>
    <rect x="352" y="306" width="80" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="392" y="322" fill="#555">2−1 = 1</text>
    <rect x="432" y="306" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="480" y="322" fill="#446688" font-weight="bold">ans[1]→1</text>
  </g>

  <!-- user 1 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="32" y="330" width="80" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="72" y="346" fill="#4a7a3a" font-weight="bold">ID=1</text>
    <rect x="112" y="330" width="140" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="182" y="346" fill="#446688" font-weight="bold">{2, 3}</text>
    <rect x="252" y="330" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="302" y="346" fill="#d6a040" font-weight="bold">2</text>
    <rect x="352" y="330" width="80" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="392" y="346" fill="#555">2−1 = 1</text>
    <rect x="432" y="330" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="480" y="346" fill="#446688" font-weight="bold">ans[1]→2</text>
  </g>

  <!-- ===== Final answer ===== -->
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终 answer（k = 5）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="112" y="406" font-size="9" fill="#aaa">j=1</text>
    <text x="182" y="406" font-size="9" fill="#aaa">j=2</text>
    <text x="252" y="406" font-size="9" fill="#aaa">j=3</text>
    <text x="322" y="406" font-size="9" fill="#aaa">j=4</text>
    <text x="392" y="406" font-size="9" fill="#aaa">j=5</text>

    <rect x="92" y="412" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="438" fill="#446688" font-weight="bold" font-size="14">0</text>
    <rect x="162" y="412" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="182" y="438" fill="#d6a040" font-weight="bold" font-size="14">2</text>
    <rect x="232" y="412" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="438" fill="#446688" font-weight="bold" font-size="14">0</text>
    <rect x="302" y="412" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="322" y="438" fill="#446688" font-weight="bold" font-size="14">0</text>
    <rect x="372" y="412" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="392" y="438" fill="#446688" font-weight="bold" font-size="14">0</text>
  </g>

  <!-- footer insight -->
  <rect x="32" y="470" width="496" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="490" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论：两个用户 UAM 都是 2 → answer[2] = 2，其余为 0</text>
  <text x="48" y="504" font-size="10" fill="#555" filter="url(#rough2)">集合去重让 [0,5] 的重复操作不影响 UAM，len({5,2}) = 2</text>
</svg>
