<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "10#11#12" → "jkab"</text>

  <!-- index labels -->
  <text x="40" y="44" font-size="10" fill="#888">下标</text>
  <text x="103" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="151" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="199" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="247" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="295" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="343" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="391" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="439" y="44" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">7</text>

  <!-- char cells: 0:'1' 1:'0' 2:'#' 3:'1' 4:'1' 5:'#' 6:'1' 7:'2' -->
  <rect x="80" y="50" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="50" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="50" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="71" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">#</text>
  <rect x="224" y="50" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="50" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="50" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="71" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">#</text>
  <rect x="368" y="50" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="416" y="50" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- grouping brackets -->
  <path d="M 80 86 L 80 90 L 242 90 L 242 86" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="161" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10# → j</text>
  <path d="M 224 86 L 224 90 L 366 90 L 366 86" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="295" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">11# → k</text>
  <path d="M 368 86 L 368 90 L 414 90 L 414 86" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="391" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1 → a</text>
  <path d="M 416 86 L 416 90 L 462 90 L 462 86" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="439" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2 → b</text>

  <!-- scan direction arrow -->
  <text x="490" y="66" font-size="10" fill="#b85450" font-weight="bold">← 从右</text>
  <text x="490" y="80" font-size="10" fill="#b85450" font-weight="bold">  向左</text>

  <!-- table header -->
  <text x="30" y="134" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="70" y="134" font-size="11" fill="#444" font-weight="bold">i</text>
  <text x="110" y="134" font-size="11" fill="#444" font-weight="bold">s[i]</text>
  <text x="170" y="134" font-size="11" fill="#444" font-weight="bold">判断</text>
  <text x="250" y="134" font-size="11" fill="#444" font-weight="bold">num</text>
  <text x="305" y="134" font-size="11" fill="#444" font-weight="bold">c</text>
  <text x="360" y="134" font-size="11" fill="#444" font-weight="bold">res（追加后）</text>
  <line x1="20" y1="140" x2="540" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: i=7, '2', 非#, 2, b, [b] -->
  <text x="30" y="158" font-size="10" fill="#333">1</text>
  <text x="70" y="158" font-size="10" fill="#333">7</text>
  <text x="110" y="158" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="158" font-size="10" fill="#446688">非 #</text>
  <text x="250" y="158" font-size="10" fill="#333">2</text>
  <text x="305" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="360" y="158" font-size="10" fill="#333">[ b ]</text>

  <!-- row 2: i=6, '1', 非#, 1, a, [b,a] -->
  <text x="30" y="176" font-size="10" fill="#333">2</text>
  <text x="70" y="176" font-size="10" fill="#333">6</text>
  <text x="110" y="176" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="176" font-size="10" fill="#446688">非 #</text>
  <text x="250" y="176" font-size="10" fill="#333">1</text>
  <text x="305" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="360" y="176" font-size="10" fill="#333">[ b, a ]</text>

  <!-- row 3: i=5, '#', 是#, 11, k, [b,a,k] -->
  <text x="30" y="194" font-size="10" fill="#333">3</text>
  <text x="70" y="194" font-size="10" fill="#333">5</text>
  <text x="110" y="194" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="170" y="194" font-size="10" fill="#b85450">是 #（取左两位 11）</text>
  <text x="250" y="194" font-size="10" fill="#333">11</text>
  <text x="305" y="194" font-size="11" fill="#b85450" font-weight="bold">k</text>
  <text x="360" y="194" font-size="10" fill="#333">[ b, a, k ]</text>

  <!-- row 4: i=2, '#', 是#, 10, j, [b,a,k,j] -->
  <text x="30" y="212" font-size="10" fill="#333">4</text>
  <text x="70" y="212" font-size="10" fill="#333">2</text>
  <text x="110" y="212" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="170" y="212" font-size="10" fill="#b85450">是 #（取左两位 10）</text>
  <text x="250" y="212" font-size="10" fill="#333">10</text>
  <text x="305" y="212" font-size="11" fill="#b85450" font-weight="bold">j</text>
  <text x="360" y="212" font-size="10" fill="#333">[ b, a, k, j ]</text>

  <line x1="20" y1="222" x2="540" y2="222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="236" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i = −1 结束：反转 res = [b, a, k, j]</text>
  <text x="280" y="274" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">→ "jkab" ✓</text>

  <!-- bottom note -->
  <rect x="60" y="296" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">观察：遇 # 取左两位（j~z），否则取一位（a~i）</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">逆向追加得 b,a,k,j，反转即正向 "jkab"</text>
</svg>
