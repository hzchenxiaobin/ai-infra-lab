<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：sentences = ["alice and bob love leetcode", ...]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每句数空格 → +1 得单词数 → 取三者最大</text>

  <!-- Table outer frame -->
  <rect x="30" y="58" width="460" height="180" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="70" y1="58" x2="70" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="58" x2="300" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="58" x2="360" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="30" y1="86" x2="490" y2="86" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="31" y="59" width="458" height="26" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="50" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">#</text>
  <text x="185" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">句子</text>
  <text x="330" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">空格数</text>
  <text x="425" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">单词数 (+1)</text>

  <!-- Row 1: alice and bob love leetcode -->
  <rect x="31" y="87" width="458" height="48" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="30" y1="135" x2="490" y2="135" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="108" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="80" y="108" font-size="10.5" fill="#333">alice and bob love leetcode</text>
  <text x="80" y="124" font-size="9.5" fill="#888">alice␣and␣bob␣love␣leetcode</text>
  <text x="330" y="114" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="425" y="114" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <!-- Row 2: i think so too -->
  <rect x="31" y="135" width="458" height="48" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="30" y1="183" x2="490" y2="183" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="156" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="80" y="156" font-size="10.5" fill="#333">i think so too</text>
  <text x="80" y="172" font-size="9.5" fill="#888">i␣think␣so␣too</text>
  <text x="330" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="425" y="162" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- Row 3: this is great thanks very much (max highlight) -->
  <rect x="31" y="183" width="458" height="55" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="50" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="80" y="204" font-size="10.5" fill="#333">this is great thanks very much</text>
  <text x="80" y="220" font-size="9.5" fill="#888">this␣is␣great␣thanks␣very␣much</text>
  <text x="330" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="425" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6 ✓</text>

  <!-- ===== Result box ===== -->
  <rect x="70" y="252" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">max(5, 4, 6) = 6 → 答案</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#555">第 3 句空格最多（5 个），单词数 = 5 + 1 = 6</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="308" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：每句只数空格，无需切分存储单词</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#555">空格数 + 1 = 单词数，O(1) 空间扫描即可</text>
</svg>
