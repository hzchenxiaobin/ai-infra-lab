<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：zip 配对 → 键强制转字符串 → 后写覆盖（同键留末值）</text>

  <!-- 两行输入数组 -->
  <text x="60" y="58" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">keys</text>
  <text x="60" y="108" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">values</text>

  <!-- keys 行: 1, "1", false -->
  <rect x="120" y="44" width="60" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="44" width="60" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"1"</text>
  <rect x="252" y="44" width="60" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="282" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">false</text>

  <!-- values 行: 4, 5, 6 -->
  <rect x="120" y="94" width="60" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="186" y="94" width="60" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="252" y="94" width="60" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="282" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- zip 连线（key[i] 配 value[i]） -->
  <path d="M 150 74 L 150 94" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 216 74 L 216 94" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 282 74 L 282 94" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="118" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">①zip 配对</text>

  <!-- 配对结果 -->
  <rect x="120" y="138" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4]</text>
  <rect x="186" y="138" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">["1",5]</text>
  <rect x="252" y="138" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[false,6]</text>

  <path d="M 282 168 L 282 188" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 键强制转字符串 框 -->
  <rect x="40" y="192" width="340" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="212" font-size="12" fill="#d6a040" filter="url(#rough2)" font-weight="bold">②键强制转字符串 String(key)</text>
  <text x="60" y="232" font-size="11" fill="#555" filter="url(#rough2)">1 → "1"    "1" → "1"（撞键！）    false → "false"</text>
  <text x="60" y="248" font-size="10" fill="#999" filter="url(#rough2)">数字/布尔当键都被隐式 String 化</text>

  <path d="M 210 258 L 210 282" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 后写覆盖 框 -->
  <rect x="40" y="286" width="340" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">③后写覆盖（last-write-wins）</text>
  <text x="60" y="326" font-size="11" fill="#555" filter="url(#rough2)">"1":4 后被 "1":5 覆盖 → 留 5</text>

  <path d="M 210 344 L 210 368" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 最终对象 -->
  <rect x="40" y="372" width="340" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="392" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">输出对象</text>
  <text x="210" y="414" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{"1": 5, "false": 6}</text>

  <!-- 右侧说明：等价两种写法 -->
  <rect x="400" y="138" width="190" height="294" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">两种等价写法</text>
  <line x1="412" y1="172" x2="578" y2="172" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="412" y="192" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">声明式</text>
  <text x="412" y="210" font-size="10" fill="#333" filter="url(#rough2)">Object.fromEntries(</text>
  <text x="412" y="224" font-size="10" fill="#333" filter="url(#rough2)">  keys.map((k,i)</text>
  <text x="412" y="238" font-size="10" fill="#333" filter="url(#rough2)">    =&gt; [k, values[i]]))</text>
  <line x1="412" y1="252" x2="578" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="412" y="272" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">命令式</text>
  <text x="412" y="290" font-size="10" fill="#333" filter="url(#rough2)">const obj = {};</text>
  <text x="412" y="304" font-size="10" fill="#333" filter="url(#rough2)">for (i...) {</text>
  <text x="412" y="318" font-size="10" fill="#333" filter="url(#rough2)">  obj[keys[i]] =</text>
  <text x="412" y="332" font-size="10" fill="#333" filter="url(#rough2)">     values[i];</text>
  <text x="412" y="346" font-size="10" fill="#333" filter="url(#rough2)">}</text>
  <text x="412" y="372" font-size="9" fill="#999" filter="url(#rough2)">两者键转换、覆盖</text>
  <text x="412" y="386" font-size="9" fill="#999" filter="url(#rough2)">语义完全一致</text>
</svg>
