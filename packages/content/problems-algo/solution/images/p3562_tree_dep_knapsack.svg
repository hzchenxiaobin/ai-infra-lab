<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：折扣只看「父买没买」+ 两条合并线</text>

  <!-- 左侧：层级树 -->
  <text x="125" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">公司层级树（5→8 = 价格→卖价）</text>

  <!-- 边 1-2, 1-3, 2-4 -->
  <path d="M 106 96 L 78 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 144 96 L 192 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 65 176 L 65 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 折扣标注 -->
  <rect x="18" y="106" width="66" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="51" y="120" text-anchor="middle" font-size="10.5" fill="#a07818" filter="url(#rough2)">父买 ⇒ ½价</text>
  <path d="M 84 116 C 96 112, 102 106, 106 100" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 节点 -->
  <rect x="92" y="62" width="66" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 ⋅ 5→8</text>
  <text x="132" y="58" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">CEO</text>

  <rect x="32" y="142" width="66" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2 ⋅ 2→5</text>

  <rect x="172" y="142" width="66" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3 ⋅ 3→6</text>

  <rect x="32" y="222" width="66" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="243" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4 ⋅ …</text>

  <text x="132" y="262" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">更远的祖先只经父节点传导</text>

  <!-- 右侧框 A：状态定义 -->
  <rect x="258" y="48" width="250" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="68" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">状态 f[u][b][j]：子树 u 的最大利润</text>
  <text x="270" y="88" font-size="11.5" fill="#333" filter="url(#rough2)">b = 0：父没买 ⇒ u 全价 present[u]</text>
  <text x="270" y="106" font-size="11.5" fill="#333" filter="url(#rough2)">b = 1：父买了 ⇒ u 半价 ⌊present[u]/2⌋</text>
  <text x="270" y="124" font-size="11.5" fill="#666" filter="url(#rough2)">j：总花费不超过 j（预算维）</text>

  <!-- 右侧框 B：两条合并线 -->
  <rect x="258" y="146" width="250" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="166" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">两条合并线（后序 DFS）</text>
  <text x="270" y="186" font-size="11.5" fill="#333" filter="url(#rough2)">u 不买：g₀ = g₀ ⊗ f[v][0]（孩子全价）</text>
  <text x="270" y="204" font-size="11.5" fill="#333" filter="url(#rough2)">u 买：g₁ = g₁ ⊗ f[v][1]（孩子半价）</text>
  <text x="270" y="222" font-size="11" fill="#666" filter="url(#rough2)">⊗ = 背包卷积：max(a[j]+b[k]), j+k≤m</text>
  <text x="270" y="238" font-size="11" fill="#666" filter="url(#rough2)">两条线互斥分流，不是重复计算</text>

  <!-- 右侧框 C：组装 -->
  <rect x="258" y="256" width="250" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="276" text-anchor="middle" font-size="11.5" fill="#a07818" filter="url(#rough2)">合并完所有孩子后组装：</text>
  <text x="383" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[u][b][j] = max(g₀[j], 利润 + g₁[j−cost])</text>

  <!-- 底部警示 -->
  <rect x="40" y="318" width="440" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 亏本买入不能剪枝：它解锁整个子树的半价！</text>
</svg>
