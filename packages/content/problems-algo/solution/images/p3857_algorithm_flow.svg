<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：贪心视角推导 → O(1) 公式</text>

  <!-- 起点 -->
  <g filter="url(#rough2)">
    <rect x="170" y="36" width="180" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="55" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">输入 n（1 ≤ n ≤ 500）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 66 L 260 76" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- 判定 -->
  <g filter="url(#rough2)">
    <polygon points="260,78 316,106 260,134 204,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="110" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">n ≤ 1 ?</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 316 106 L 382 106" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="344" y="99" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M 260 134 L 260 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <text x="272" y="146" font-size="10.5" fill="#446688" font-weight="bold">否</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="386" y="90" width="108" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="440" y="110" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">返回 0</text>
  </g>

  <!-- 主链 -->
  <g filter="url(#rough2)">
    <rect x="140" y="150" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="171" text-anchor="middle" font-size="11" fill="#33506b">每次拆出 1：代价依次为 n−1, n−2, …, 1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 184 L 260 196" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="140" y="198" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="219" text-anchor="middle" font-size="11" fill="#33506b">等差数列求和 = n(n−1)/2 = C(n,2)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 232 L 260 244" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="140" y="246" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="267" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">返回 n × (n−1) / 2</text>
  </g>

  <!-- 侧注 -->
  <g filter="url(#rough2)">
    <rect x="382" y="150" width="128" height="130" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="446" y="172" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">不变量兜底</text>
    <text x="446" y="192" text-anchor="middle" font-size="10" fill="#557">任何拆法的总代价</text>
    <text x="446" y="208" text-anchor="middle" font-size="10" fill="#557">都恒等于 C(n,2)</text>
    <text x="446" y="224" text-anchor="middle" font-size="10" fill="#557">公式值既是最小</text>
    <text x="446" y="240" text-anchor="middle" font-size="10" fill="#557">也是最大 ✓</text>
  </g>

  <!-- 底注 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5" fill="#777">
    <text x="260" y="316">时间 O(1) · 空间 O(1) · n ≤ 500 时答案 ≤ 124750，32 位 int 安全</text>
    <text x="260" y="336">n = 1 时公式给出 0，无需特判</text>
  </g>
</svg>
