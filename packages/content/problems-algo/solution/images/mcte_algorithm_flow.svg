<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：longest(target) 子过程 + 两遍取 max</text>

  <!-- entry: call twice -->
  <rect x="170" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max(longest('T'), longest('F'))</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="120" y="96" width="320" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#555">初始化 left=0, flip=0, ans=0</text>

  <path d="M 280 130 L 280 144" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="160" y="148" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for right = 0 .. n-1</text>

  <path d="M 280 182 L 280 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 1: right expand -->
  <rect x="100" y="200" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#333">① 右扩：if s[right] != target  then  flip += 1</text>

  <path d="M 280 236 L 280 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond: flip > k ? -->
  <polygon points="280,254 360,284 280,314 200,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">flip &gt; k ?</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#888">窗口非法?</text>

  <!-- yes branch: shrink -->
  <path d="M 200 284 L 96 284" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="150" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="40" y="266" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="281" text-anchor="middle" font-size="9" fill="#b83a30" font-weight="bold">②左缩</text>
  <text x="68" y="294" text-anchor="middle" font-size="9" fill="#b83a30">while</text>

  <!-- shrink detail below -->
  <path d="M 68 302 L 68 322" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="326" width="96" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="68" y="342" text-anchor="middle" font-size="9" fill="#b83a30">if s[left]!=target</text>
  <text x="68" y="354" text-anchor="middle" font-size="9" fill="#b83a30">flip -= 1</text>
  <text x="68" y="366" text-anchor="middle" font-size="9" fill="#b83a30">left += 1</text>

  <!-- loop back from shrink to decision -->
  <path d="M 68 376 Q 68 284 200 284" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- no branch: update ans -->
  <path d="M 360 284 L 464 284" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="412" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="410" y="266" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="281" text-anchor="middle" font-size="9" fill="#2a5a1a" font-weight="bold">③更新答案</text>
  <text x="460" y="294" text-anchor="middle" font-size="9" fill="#2a5a1a">ans=max</text>

  <!-- update detail -->
  <path d="M 460 302 L 460 322" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="400" y="326" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="460" y="346" text-anchor="middle" font-size="10" fill="#2a5a3a">ans=max(ans,r-l+1)</text>

  <!-- loop back to for -->
  <path d="M 460 360 Q 460 165 400 165" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="470" y="250" font-size="9" fill="#888" transform="rotate(0 470 250)">回循环</text>

  <!-- return -->
  <path d="M 280 314 L 280 400" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)" stroke-dasharray="0"/>
  <rect x="180" y="404" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- note bottom -->
  <rect x="40" y="424" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="100" y="442" text-anchor="middle" font-size="9" fill="#8a6a20">while 非 if：可能连缩多次</text>
</svg>
