<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    Trie + DFS：只走 is_end=true 的节点
  </text>

  <circle cx="290" cy="68" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root</text>
  <text x="290" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">is_end ✓</text>

  <path d="M278,80 Q230,100 175,130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="100" font-size="11" fill="#d6a040" filter="url(#rough2)">a</text>

  <circle cx="160" cy="142" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="160" y="174" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M148,157 Q120,182 95,212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="187" font-size="11" fill="#d6a040" filter="url(#rough2)">p</text>

  <circle cx="85" cy="222" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p</text>
  <text x="85" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M75,240 Q60,272 55,307" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="277" font-size="11" fill="#d6a040" filter="url(#rough2)">p</text>

  <circle cx="50" cy="317" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="321" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p</text>
  <text x="50" y="349" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M45,337 Q40,362 42,387" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="367" font-size="11" fill="#d6a040" filter="url(#rough2)">l</text>

  <circle cx="45" cy="397" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="401" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <text x="45" y="429" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">end✓</text>

  <path d="M68,394 Q150,362 230,337" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="362" font-size="11" fill="#d6a040" filter="url(#rough2)">e</text>

  <circle cx="245" cy="332" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="245" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="245" y="360" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">apple★</text>

  <path d="M68,402 Q170,402 265,347" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="417" font-size="11" fill="#d6a040" filter="url(#rough2)">y</text>

  <circle cx="285" cy="397" r="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="401" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y</text>
  <text x="285" y="425" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">apply</text>

  <path d="M310,402 Q380,382 410,347" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="362" font-size="11" fill="#d6a040" filter="url(#rough2)">b</text>

  <circle cx="420" cy="337" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="341" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="420" y="365" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">end✗</text>

  <text x="420" y="314" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 断路</text>

  <rect x="370" y="50" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="72" font-size="11" fill="#333" filter="url(#rough2)">DFS 规则：</text>
  <text x="385" y="92" font-size="10.5" fill="#555" filter="url(#rough2)">• 只递归 is_end=true 的子节点</text>
  <text x="385" y="110" font-size="10.5" fill="#555" filter="url(#rough2)">• children 按 a→z 字典序遍历</text>
  <text x="385" y="128" font-size="10.5" fill="#555" filter="url(#rough2)">• len &gt; 严格更新（保最小序）</text>

  <text x="290" y="448" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    绿色=合法路径(全 is_end)  橙=答案  灰=等长非最优  红=断路
  </text>
</svg>
