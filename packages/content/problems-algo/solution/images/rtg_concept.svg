<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 462" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="462" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：补齐 (性别 × 日期) 网格，缺失日按 0 累计</text>

  <!-- ============ Grid 1: daily aggregation with a GAP ============ -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 每日聚合 daily：GROUP BY gender, day（有缺口）</text>

  <!-- header -->
  <rect x="125" y="60" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gender</text>
  <rect x="195" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=1</text>
  <rect x="275" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=2</text>
  <rect x="355" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=3</text>

  <!-- row F -->
  <rect x="125" y="86" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="195" y="86" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">57</text>
  <rect x="275" y="86" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">49</text>
  <!-- the GAP cell -->
  <rect x="355" y="86" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="395" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">NULL</text>
  <text x="446" y="100" font-size="9.5" fill="#b85450" font-weight="bold">缺失！</text>
  <text x="446" y="112" font-size="8.5" fill="#b85450">无 F 得分</text>

  <!-- row M -->
  <rect x="125" y="116" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">M</text>
  <rect x="195" y="116" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">36</text>
  <rect x="275" y="116" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">99</text>
  <rect x="355" y="116" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">104</text>

  <!-- arrow grid1 -> grid2 -->
  <path d="M280 152 L280 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="150" y="153" width="260" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#333">{F,M} CROSS JOIN {1,2,3} + LEFT JOIN + COALESCE(0)</text>

  <!-- ============ Grid 2: filled grid ============ -->
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 补齐网格 grid：缺失格补 0</text>

  <rect x="125" y="192" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="209" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gender</text>
  <rect x="195" y="192" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="209" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=1</text>
  <rect x="275" y="192" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="209" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=2</text>
  <rect x="355" y="192" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="209" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=3</text>

  <rect x="125" y="218" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="195" y="218" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">57</text>
  <rect x="275" y="218" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">49</text>
  <!-- filled cell -->
  <rect x="355" y="218" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="446" y="235" font-size="9.5" fill="#d6a040" font-weight="bold">补齐</text>

  <rect x="125" y="248" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">M</text>
  <rect x="195" y="248" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">36</text>
  <rect x="275" y="248" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">99</text>
  <rect x="355" y="248" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">104</text>

  <!-- arrow grid2 -> grid3 -->
  <path d="M280 284 L280 304" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="120" y="285" width="320" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="9.5" fill="#333">SUM(pts) OVER (PARTITION BY gender ORDER BY day) 累计</text>

  <!-- ============ Grid 3: running total ============ -->
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 累计求和 total：缺失日沿用前一天</text>

  <rect x="125" y="324" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="341" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gender</text>
  <rect x="195" y="324" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="341" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=1</text>
  <rect x="275" y="324" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="341" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=2</text>
  <rect x="355" y="324" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="341" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">day=3</text>

  <rect x="125" y="350" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="195" y="350" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">57</text>
  <rect x="275" y="350" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">106</text>
  <rect x="355" y="350" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="370" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">106</text>
  <text x="446" y="367" font-size="9.5" fill="#d6a040" font-weight="bold">沿用</text>
  <text x="446" y="379" font-size="8.5" fill="#d6a040">106+0</text>

  <rect x="125" y="380" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">M</text>
  <rect x="195" y="380" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">36</text>
  <rect x="275" y="380" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">135</text>
  <rect x="355" y="380" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">239</text>

  <!-- bottom note -->
  <rect x="20" y="424" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="443" font-size="10" fill="#333">关键：窗口函数只在<tspan fill="#b85450" font-weight="bold">已有行</tspan>上滑动。先用 CROSS JOIN 造出 (性别×日期) 骨架，缺失填 0，累计即可<tspan fill="#d6a040" font-weight="bold">沿用前一天</tspan>。</text>
</svg>
