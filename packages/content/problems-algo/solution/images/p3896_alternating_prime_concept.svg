<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：偶数位跳下一个质数，奇数位跳下一个非质数（示例 [1,2,3,4]）</text>

  <!-- 上方跳转标注 -->
  <text x="164" y="46" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 → 2（+1）</text>
  <text x="228" y="46" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 → 4（+2）</text>
  <text x="292" y="46" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">✓ +0</text>
  <text x="356" y="46" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">✓ +0</text>

  <!-- 数组格子：偶数位蓝（要质数），奇数位橙（要非质数） -->
  <rect x="136" y="56" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="164" y="82" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="200" y="56" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="228" y="82" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="264" y="56" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="328" y="56" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="356" y="82" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 下标与要求 -->
  <text x="164" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="228" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="292" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="356" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>

  <text x="164" y="126" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶 · 要质数</text>
  <text x="228" y="126" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇 · 要非质数</text>
  <text x="292" y="126" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶 · 要质数</text>
  <text x="356" y="126" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇 · 要非质数</text>

  <!-- 奇数位闭式面板 -->
  <rect x="40" y="144" width="280" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="164" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇数位闭式：c = O(1)，连表都不用查</text>
  <text x="180" y="184" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x = 1 或合数 → 0（已合法）</text>
  <text x="180" y="201" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x = 2 → 2（3 也是质数，须跳到 4）</text>
  <text x="180" y="218" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x = 奇质数 p → 1（p+1 为偶数 ≥ 4，必是合数）</text>
  <text x="180" y="238" text-anchor="middle" font-size="9" fill="#a08030" filter="url(#rough2)">关键：相邻整数奇偶交替 + 大于 2 的偶数全是合数</text>

  <!-- 独立性面板 -->
  <rect x="340" y="144" width="150" height="106" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="166" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">条件只看本位</text>
  <text x="415" y="184" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">操作按位独立 +1</text>
  <text x="415" y="204" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⇒ 总代价 = Σ c(i)</text>
  <text x="415" y="224" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">无跨位约束</text>
  <text x="415" y="240" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">连 DP 都不需要</text>

  <!-- 偶数位公式面板 -->
  <rect x="40" y="262" width="450" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="282" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">偶数位：c = nxt[x] − x，其中 nxt[x] = 最小质数 ≥ x</text>
  <text x="265" y="300" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">埃氏筛 + 倒扫递推 nxt[x] = 质数 ? x : nxt[x+1]，查表 O(1)</text>
  <text x="265" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">筛上界取 1e5+200：≥ 1e5 的最小质数是 100003，间隙余量充足</text>

  <!-- 图例 -->
  <rect x="40" y="338" width="14" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="348" font-size="9.5" fill="#33506b" filter="url(#rough2)">偶数位（0,2,…）必须是质数</text>
  <rect x="250" y="338" width="14" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="348" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">奇数位（1,3,…）必须是非质数</text>
</svg>
