<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：状态 (节点, 末尾连续长度) 上的 Dijkstra</text>

  <!-- step 1 -->
  <rect x="150" y="34" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建有向邻接表；dist[(0,1)] = 0 入堆</text>

  <path d="M 280 66 L 280 82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="105" y="84" width="350" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 出队堆顶 (d, u, c)——当前最小距离</text>
  <text x="280" y="117" text-anchor="middle" font-size="10.5" fill="#667788">若 d &gt; dist[u][c]：过期条目，丢弃重取</text>

  <path d="M 280 124 L 280 140" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 diamond -->
  <polygon points="280,140 412,169 280,198 148,169" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">u == n−1 ?</text>

  <path d="M 412 169 L 444 169" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="428" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="446" y="151" width="98" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="495" y="167" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return d</text>
  <text x="495" y="181" text-anchor="middle" font-size="9.5" fill="#4a7a3a">首个出队即最优</text>

  <path d="M 280 198 L 280 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">否</text>

  <!-- step 4 -->
  <rect x="112" y="216" width="336" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 遍历 u 的出边 (v, w)：nc = 同标签 ? c+1 : 1</text>

  <path d="M 280 248 L 280 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 5 diamond -->
  <polygon points="280,264 400,293 280,322 160,293" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">nc &gt; k ?</text>

  <path d="M 400 293 L 428 293" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="275" width="114" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="487" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">剪枝</text>
  <text x="487" y="305" text-anchor="middle" font-size="9.5" fill="#b85450">非法转移，跳过此边</text>

  <path d="M 280 322 L 280 338" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="334" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">否</text>

  <!-- step 6 -->
  <rect x="112" y="340" width="336" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑥ 松弛：d + w &lt; dist[v][nc] ⇒ 更新并入堆</text>

  <!-- iterate loop -->
  <path d="M 112 356 C 46 356, 46 104, 103 104" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="36" y="235" text-anchor="middle" font-size="10" fill="#8899aa" transform="rotate(-90 36 235)">迭代直到堆空</text>

  <!-- bottom note -->
  <rect x="60" y="388" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">堆空仍未出队任何 (n−1, c) ⇒ return −1（无可行路径）</text>
  <text x="280" y="423" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">状态 n·k 个、每条边在每个 c 下松弛一次 ⇒ O((n+E)·k·log(n·k))</text>
</svg>
