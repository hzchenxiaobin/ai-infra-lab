<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：每日聚合 → 7 天窗口求和 → 过滤 + 计算平均</text>

  <!-- ============ Box 1: daily aggregation ============ -->
  <rect x="15" y="46" width="160" height="272" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="15" y="46" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 每日聚合 daily</text>

  <rect x="25" y="80" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="32" y="94" font-size="8.5" fill="#333">GROUP BY visited_on</text>
  <text x="32" y="106" font-size="8.5" fill="#333">SUM(amount) AS day_total</text>
  <text x="32" y="118" font-size="8.5" fill="#d6a040" font-weight="bold">→ 每天一行日合计</text>

  <!-- mini table header -->
  <rect x="30" y="132" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">visited_on</text>
  <rect x="90" y="132" width="48" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="114" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">amount</text>

  <!-- rows: 10 days -->
  <rect x="30" y="152" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a">01-01</text>
  <text x="114" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">100</text>

  <rect x="30" y="168" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="8" fill="#4a7a3a">01-02</text>
  <text x="114" y="180" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="30" y="184" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="196" text-anchor="middle" font-size="8" fill="#4a7a3a">01-03</text>
  <text x="114" y="196" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">120</text>

  <rect x="30" y="200" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="8" fill="#4a7a3a">01-04</text>
  <text x="114" y="212" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">130</text>

  <rect x="30" y="216" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a">01-05</text>
  <text x="114" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="30" y="232" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="244" text-anchor="middle" font-size="8" fill="#4a7a3a">01-06</text>
  <text x="114" y="244" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">140</text>

  <rect x="30" y="248" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a">01-07</text>
  <text x="114" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">150</text>

  <rect x="30" y="264" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="276" text-anchor="middle" font-size="8" fill="#4a7a3a">01-08</text>
  <text x="114" y="276" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">80</text>

  <rect x="30" y="280" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="292" text-anchor="middle" font-size="8" fill="#4a7a3a">01-09</text>
  <text x="114" y="292" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="30" y="296" width="108" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">01-10</text>
  <text x="114" y="308" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">280</text>

  <text x="95" y="314" text-anchor="middle" font-size="8" fill="#555">10 行（每天一行）</text>

  <!-- arrow 1 -> 2 -->
  <path d="M180 172 L202 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="191" y="165" text-anchor="middle" font-size="8" fill="#d6a040">窗口</text>

  <!-- ============ Box 2: 7-day window sum ============ -->
  <rect x="205" y="46" width="160" height="272" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="205" y="46" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="63" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 7 天窗口求和</text>

  <rect x="215" y="80" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="222" y="94" font-size="8.5" fill="#333">SUM(day_total) OVER (</text>
  <text x="222" y="106" font-size="8.5" fill="#333">  ORDER BY visited_on</text>
  <text x="222" y="118" font-size="8.5" fill="#333">  ROWS 6 PRECEDING</text>
  <text x="222" y="130" font-size="8.5" fill="#d6a040" font-weight="bold">  AND CURRENT ROW)</text>

  <!-- mini table header -->
  <rect x="210" y="144" width="48" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="234" y="158" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">date</text>
  <rect x="258" y="144" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="158" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">rn</text>
  <rect x="294" y="144" width="48" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="158" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">amount</text>

  <!-- rn 1-6: gray (filtered out later) -->
  <rect x="210" y="164" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="174" text-anchor="middle" font-size="7.5" fill="#999">01-01</text>
  <text x="276" y="174" text-anchor="middle" font-size="7.5" fill="#999">1</text>
  <text x="318" y="174" text-anchor="middle" font-size="7.5" fill="#999">100</text>

  <rect x="210" y="178" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="188" text-anchor="middle" font-size="7.5" fill="#999">01-02</text>
  <text x="276" y="188" text-anchor="middle" font-size="7.5" fill="#999">2</text>
  <text x="318" y="188" text-anchor="middle" font-size="7.5" fill="#999">210</text>

  <rect x="210" y="192" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="202" text-anchor="middle" font-size="7.5" fill="#999">01-03</text>
  <text x="276" y="202" text-anchor="middle" font-size="7.5" fill="#999">3</text>
  <text x="318" y="202" text-anchor="middle" font-size="7.5" fill="#999">330</text>

  <rect x="210" y="206" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="216" text-anchor="middle" font-size="7.5" fill="#999">01-04</text>
  <text x="276" y="216" text-anchor="middle" font-size="7.5" fill="#999">4</text>
  <text x="318" y="216" text-anchor="middle" font-size="7.5" fill="#999">460</text>

  <rect x="210" y="220" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="230" text-anchor="middle" font-size="7.5" fill="#999">01-05</text>
  <text x="276" y="230" text-anchor="middle" font-size="7.5" fill="#999">5</text>
  <text x="318" y="230" text-anchor="middle" font-size="7.5" fill="#999">570</text>

  <rect x="210" y="234" width="132" height="14" fill="#f0f0f0" stroke="#aaa" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="234" y="244" text-anchor="middle" font-size="7.5" fill="#999">01-06</text>
  <text x="276" y="244" text-anchor="middle" font-size="7.5" fill="#999">6</text>
  <text x="318" y="244" text-anchor="middle" font-size="7.5" fill="#999">710</text>

  <!-- rn 7-10: green (kept) -->
  <rect x="210" y="248" width="132" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="234" y="258" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">01-07</text>
  <text x="276" y="258" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="318" y="258" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">860</text>

  <rect x="210" y="262" width="132" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="234" y="272" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">01-08</text>
  <text x="276" y="272" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="318" y="272" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">840</text>

  <rect x="210" y="276" width="132" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="234" y="286" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">01-09</text>
  <text x="276" y="286" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="318" y="286" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">840</text>

  <rect x="210" y="290" width="132" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="234" y="300" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">01-10</text>
  <text x="276" y="300" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="318" y="300" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">1000</text>

  <text x="285" y="314" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">rn &lt; 7 → 过滤掉</text>

  <!-- arrow 2 -> 3 -->
  <path d="M370 172 L392 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="381" y="165" text-anchor="middle" font-size="8" fill="#d6a040">过滤</text>

  <!-- ============ Box 3: filter + average ============ -->
  <rect x="395" y="46" width="160" height="272" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="395" y="46" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 过滤 + 计算平均</text>

  <rect x="405" y="80" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="94" font-size="8.5" fill="#333">WHERE rn &gt;= 7</text>
  <text x="412" y="106" font-size="8.5" fill="#333">SELECT visited_on,</text>
  <text x="412" y="118" font-size="8.5" fill="#333">  amount,</text>
  <text x="412" y="130" font-size="8.5" fill="#b85450" font-weight="bold">  ROUND(amount/7, 2)</text>

  <!-- mini table header -->
  <rect x="410" y="148" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="438" y="162" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">visited_on</text>
  <rect x="466" y="148" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="162" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">amt</text>
  <rect x="502" y="148" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="522" y="162" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">avg_amt</text>

  <rect x="410" y="168" width="132" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="438" y="181" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-07</text>
  <text x="484" y="181" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">860</text>
  <text x="522" y="181" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">122.86</text>

  <rect x="410" y="186" width="132" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="438" y="199" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-08</text>
  <text x="484" y="199" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">840</text>
  <text x="522" y="199" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">120</text>

  <rect x="410" y="204" width="132" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="438" y="217" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-09</text>
  <text x="484" y="217" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">840</text>
  <text x="522" y="217" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">120</text>

  <rect x="410" y="222" width="132" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="438" y="235" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">01-10</text>
  <text x="484" y="235" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">1000</text>
  <text x="522" y="235" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">142.86</text>

  <rect x="405" y="250" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="264" font-size="8.5" fill="#333">amount = 7 天日合计之和</text>
  <text x="412" y="278" font-size="8.5" fill="#333">average = amount / 7</text>
  <text x="412" y="292" font-size="8.5" fill="#b85450" font-weight="bold">ROUND(..., 2) 保留两位</text>
  <text x="412" y="302" font-size="8" fill="#555">ORDER BY visited_on</text>

  <text x="475" y="314" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4 行最终输出</text>

  <!-- bottom note -->
  <rect x="15" y="326" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="343" font-size="9.5" fill="#333">三步流水线：<tspan fill="#446688" font-weight="bold">聚合</tspan>（GROUP BY 去到每天一行）→ <tspan fill="#d6a040" font-weight="bold">窗口求和</tspan>（ROWS 6 PRECEDING 固定 7 行框架 + ROW_NUMBER 编号）→ <tspan fill="#b85450" font-weight="bold">过滤</tspan>（rn≥7 丢掉前 6 行）+ ROUND 除以 7。</text>
</svg>
