<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">距离相等的条形码：奇偶交错填充算法流程</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 统计条形码频率</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: count freq -->
  <rect x="150" y="104" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333">哈希表统计每个值的频率</text>

  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: sort by freq desc -->
  <rect x="150" y="160" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#333">按频率降序排列条形码值</text>

  <path d="M 270 194 L 270 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: expand to chars -->
  <rect x="130" y="216" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#333">展开为 chars 序列 (同值连续，高频在前)</text>

  <path d="M 270 250 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: fill even indices -->
  <rect x="130" y="272" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="12" fill="#333">填偶数下标: res[0], res[2], res[4]…</text>

  <path d="M 270 306 L 270 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: fill odd indices -->
  <rect x="130" y="328" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#333">填奇数下标: res[1], res[3], res[5]…</text>

  <path d="M 270 362 L 270 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="270" cy="404" rx="80" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="12" fill="#333">返回 res (相邻无重复)</text>

  <!-- Side note -->
  <rect x="430" y="160" width="100" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="180" text-anchor="middle" font-size="10" fill="#666">题目保证有解</text>
  <text x="480" y="194" text-anchor="middle" font-size="10" fill="#666">无需判定</text>
  <text x="480" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">max_count 上界</text>

  <path d="M 410 232 L 430 200" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Summary -->
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#888">关键：最高频 ≤ ⌈n/2⌉ 恰填满偶数位；偶/奇位内部间隔 2，天然不相邻</text>
</svg>
