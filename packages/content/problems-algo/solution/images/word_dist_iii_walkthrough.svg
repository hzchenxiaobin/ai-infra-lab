<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word1 = word2 = "makes"</text>

  <!-- array -->
  <text x="24" y="62" font-size="12" fill="#888">words：</text>
  <rect x="60" y="46" width="92" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="106" y="68" text-anchor="middle" font-size="11.5" fill="#aaa">practice</text>
  <rect x="156" y="46" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <rect x="252" y="46" width="92" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="68" text-anchor="middle" font-size="11.5" fill="#aaa">perfect</text>
  <rect x="348" y="46" width="92" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="68" text-anchor="middle" font-size="11.5" fill="#aaa">coding</text>
  <rect x="444" y="46" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <text x="106" y="98" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="202" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="298" y="98" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="394" y="98" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="490" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>

  <!-- step table header -->
  <rect x="40" y="116" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="180" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">words[i]</text>
  <text x="300" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">命中?</text>
  <text x="400" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">prev</text>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- row i=0 -->
  <line x1="40" y1="140" x2="540" y2="140" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="180" y="158" text-anchor="middle" font-size="11" fill="#aaa">practice</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#888">−1</text>
  <text x="500" y="158" text-anchor="middle" font-size="11" fill="#888">∞</text>

  <!-- row i=1 -->
  <line x1="40" y1="170" x2="540" y2="170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">makes</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#888">−1 → 1</text>
  <text x="500" y="188" text-anchor="middle" font-size="11" fill="#888">∞</text>
  <text x="200" y="188" font-size="9.5" fill="#888">prev=−1 跳过比距；prev←1</text>

  <!-- row i=2 -->
  <line x1="40" y1="200" x2="540" y2="200" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="218" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#aaa">perfect</text>
  <text x="300" y="218" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="400" y="218" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="500" y="218" text-anchor="middle" font-size="11" fill="#888">∞</text>

  <!-- row i=3 -->
  <line x1="40" y1="230" x2="540" y2="230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="248" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="#aaa">coding</text>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#888">∞</text>

  <!-- row i=4 -->
  <line x1="40" y1="260" x2="540" y2="260" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">makes</text>
  <text x="300" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 → 4</text>
  <text x="500" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="200" y="278" font-size="9.5" fill="#b85450" font-weight="bold">先算 4−1=3 更新 ans；prev←4</text>

  <!-- distance arrow between i=1 and i=4 -->
  <path d="M 202 296 L 202 306 L 490 306 L 490 296" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="346" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">相邻两次 makes：|4 − 1| = 3 ✓ 最小</text>

  <!-- footer note -->
  <rect x="40" y="332" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">关键：命中时「先比距 i−prev，后挪 prev←i」，保证两位置不同</text>
</svg>
