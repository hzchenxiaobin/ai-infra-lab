<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)" font-weight="bold">三个方法的流程</text>

  <!-- ===== set 列 ===== -->
  <text x="135" y="58" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)" font-weight="bold">set(key, value, duration)</text>

  <rect x="30" y="68" width="210" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="12" fill="#333" filter="url(#rough2)">① existed = Map.has(key)</text>

  <path d="M 135 102 L 135 116" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="120" width="210" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="12" fill="#333" filter="url(#rough2)">② 若 existed → clearTimeout(旧)</text>

  <path d="M 135 154 L 135 168" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="172" width="210" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="12" fill="#333" filter="url(#rough2)">③ timer = setTimeout(delete, d)</text>

  <path d="M 135 206 L 135 220" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="224" width="210" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="12" fill="#333" filter="url(#rough2)">④ Map.set(key, {value, timer})</text>

  <path d="M 135 258 L 135 272" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="276" width="210" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="296" font-size="12" fill="#333" filter="url(#rough2)">⑤ return existed</text>

  <!-- ===== get 列 ===== -->
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)" font-weight="bold">get(key)</text>

  <polygon points="400,72 470,104 400,136 330,104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Map.has(key)?</text>

  <!-- yes branch -->
  <path d="M 400 136 C 400 145, 360 145, 360 154" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="150" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="310" y="154" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return value</text>

  <!-- no branch -->
  <path d="M 400 136 C 400 145, 480 145, 480 154" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="484" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="430" y="154" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return -1</text>

  <!-- ===== count 列 ===== -->
  <text x="400" y="226" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)" font-weight="bold">count()</text>

  <rect x="335" y="238" width="130" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return Map.size</text>

  <!-- note -->
  <rect x="30" y="320" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="46" y="344" font-size="12" fill="#333" filter="url(#rough)">💡 定时器到期自动 delete key，Map 里只剩"未过期"键，</text>
  <text x="46" y="362" font-size="12" fill="#333" filter="url(#rough)">　 故 count() 直接返回 size，get() 查到即未过期，无需扫描。</text>
</svg>
