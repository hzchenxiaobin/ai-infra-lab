<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：修 k 个连续坑洼花费 k + 1 —— 开工费摊薄，长块优先</text>

  <!-- road cells -->
  <text x="64" y="54" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">road = "..xxxxx"</text>

  <rect x="64" y="62" width="38" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="87" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="110" y="62" width="38" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="129" y="87" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="156" y="62" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="87" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="202" y="62" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="221" y="87" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="248" y="62" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="267" y="87" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="294" y="62" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="313" y="87" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="340" y="62" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="87" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- bracket under x-block -->
  <path d="M 156 104 L 156 114 L 378 114 L 378 104" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="267" y="131" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">一个连续坑洼块，L = 5</text>

  <!-- cost model row -->
  <text x="64" y="158" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">只修其中连续 k = 3 个：</text>

  <rect x="64" y="166" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="188" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">开工费 1</text>

  <text x="166" y="188" font-size="16" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="182" y="166" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="166" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="233" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="254" y="166" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="269" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="294" y="188" font-size="16" fill="#555" font-weight="bold" filter="url(#rough2)">=</text>

  <rect x="310" y="166" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="188" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">花费 4</text>

  <text x="64" y="222" font-size="11" fill="#888" filter="url(#rough2)">每个坑洼单价 1，每开一段工再收 1 —— 修 k 个 ⇔ 花 k + 1</text>

  <!-- amortized efficiency strip -->
  <text x="64" y="248" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">每坑摊销 = (k+1) / k，随 k 递减：</text>

  <rect x="64" y="258" width="74" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="101" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">k = 1</text>
  <text x="101" y="294" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2.00</text>

  <text x="144" y="286" font-size="13" fill="#999" filter="url(#rough2)">→</text>

  <rect x="156" y="258" width="74" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="193" y="276" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">k = 2</text>
  <text x="193" y="294" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1.50</text>

  <text x="236" y="286" font-size="13" fill="#999" filter="url(#rough2)">→</text>

  <rect x="248" y="258" width="74" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="285" y="276" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">k = 3</text>
  <text x="285" y="294" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1.33</text>

  <text x="328" y="286" font-size="13" fill="#999" filter="url(#rough2)">→</text>

  <rect x="340" y="258" width="74" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="377" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">k = 10</text>
  <text x="377" y="294" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1.10</text>

  <text x="64" y="322" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段越长每坑越便宜 —— 同样的预算，长块换到的坑更多！</text>

  <!-- greedy summary -->
  <rect x="48" y="334" width="424" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心：块长降序 → 依次整块修复（每块花 L + 1）</text>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">预算 b &lt; L+1 时：修其中连续 b − 1 个收尾，预算花光结束</text>
</svg>
