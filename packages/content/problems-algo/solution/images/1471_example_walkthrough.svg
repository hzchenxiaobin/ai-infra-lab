<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr = [1,2,3,4,5]，k = 2</text>

  <!-- Step 0: setup -->
  <text x="40" y="48" font-size="11.5" fill="#333">① 排序后 arr = [1,2,3,4,5]，n=5，m = arr[(5−1)/2] = arr[2] = <tspan fill="#d6a040" font-weight="bold">3</tspan></text>
  <text x="40" y="66" font-size="11.5" fill="#333">② 强度 |x−m| = [<tspan fill="#b85450" font-weight="bold">2</tspan>, 1, <tspan fill="#d6a040" font-weight="bold">0</tspan>, 1, <tspan fill="#b85450" font-weight="bold">2</tspan>]，呈 V 形，双指针 l=0, r=4</text>

  <!-- ===== Round 1 (y around 100..170) ===== -->
  <text x="40" y="98" font-size="12" fill="#333" font-weight="bold">第 1 轮</text>
  <!-- array cells: 5 cells width 52 from x=80, centers 106,158,210,262,314 ; y=104..132 -->
  <!-- idx0 val1 (L points here) -->
  <rect x="80" y="104" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="106" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="106" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">强2</text>
  <!-- idx1 val2 -->
  <rect x="132" y="104" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="124" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="158" y="148" text-anchor="middle" font-size="10" fill="#888">强1</text>
  <!-- idx2 val3 median -->
  <rect x="184" y="104" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="210" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">强0</text>
  <!-- idx3 val4 -->
  <rect x="236" y="104" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="124" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="262" y="148" text-anchor="middle" font-size="10" fill="#888">强1</text>
  <!-- idx4 val5 (R points here) -->
  <rect x="288" y="104" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="314" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="314" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">强2</text>

  <!-- L / R labels -->
  <text x="106" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">L=0</text>
  <text x="314" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">R=4</text>

  <!-- compare annotation: 2 >= 2 -> take right -->
  <text x="370" y="124" font-size="11" fill="#333">|5−3|=2 ≥ |1−3|=2</text>
  <text x="370" y="140" font-size="10.5" fill="#888">并列 → 取大值 → 右端</text>
  <!-- take arrow to res -->
  <rect x="498" y="110" width="64" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">取 5</text>
  <path d="M 340 119 L 496 123" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="530" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a">r → 3</text>

  <!-- ===== Round 2 (y around 190..260) ===== -->
  <text x="40" y="188" font-size="12" fill="#333" font-weight="bold">第 2 轮</text>
  <!-- idx0 val1 (L) still highlighted -->
  <rect x="80" y="194" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="106" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="106" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">强2</text>
  <!-- idx1 val2 -->
  <rect x="132" y="194" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="214" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="158" y="238" text-anchor="middle" font-size="10" fill="#888">强1</text>
  <!-- idx2 val3 median -->
  <rect x="184" y="194" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="210" y="238" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">强0</text>
  <!-- idx3 val4 (R now here) highlighted -->
  <rect x="236" y="194" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="262" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="262" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">强1</text>
  <!-- idx4 val5 dimmed (taken) -->
  <rect x="288" y="194" width="52" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="314" y="214" text-anchor="middle" font-size="14" fill="#aaa">5</text>
  <text x="314" y="238" text-anchor="middle" font-size="10" fill="#bbb">已取</text>

  <!-- L / R labels -->
  <text x="106" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">L=0</text>
  <text x="262" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">R=3</text>

  <!-- compare: 2 >= 1 false -> take left -->
  <text x="370" y="214" font-size="11" fill="#333">|1−3|=2 &gt; |4−3|=1</text>
  <text x="370" y="230" font-size="10.5" fill="#888">左更强 → 取左端</text>
  <rect x="498" y="200" width="64" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">取 1</text>
  <path d="M 132 209 L 496 213" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="530" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a">l → 1</text>

  <!-- Result -->
  <rect x="80" y="284" width="440" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">k = 2 轮取完 → 结果 res = [5, 1]</text>
  <text x="300" y="318" text-anchor="middle" font-size="10.5" fill="#555">顺序任意，[1, 5] 同样正确</text>

  <!-- footer note -->
  <rect x="60" y="338" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#555">判定用 ≥：右端严格更强取右（&gt;），并列取大值也取右（=）——两种情形合一</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#555">V 形保证每轮最强必在剩余区间两端，贪心摘取无后效性</text>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#888">排序 O(n log n) + 双指针 O(k) = 总 O(n log n)</text>
</svg>
