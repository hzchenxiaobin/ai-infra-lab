<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：右对齐竖式二进制加法，从最低位起逐位相加，满二进一</text>

  <!-- carry row -->
  <text x="86" y="74" font-size="12" fill="#888">carry:</text>
  <text x="186" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="240" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="294" y="74" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="348" y="74" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- num1 row: 1 0 1 0 -->
  <text x="86" y="106" font-size="12" fill="#888">a:</text>
  <text x="186" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i=0</text>
  <text x="240" y="78" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="294" y="78" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="348" y="78" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <rect x="164" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="218" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="272" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="326" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- num2 row: 1 0 1 1 -->
  <text x="86" y="154" font-size="12" fill="#888">b:</text>
  <rect x="164" y="132" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="218" y="132" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="272" y="132" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="326" y="132" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="348" y="180" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">j=3</text>

  <!-- + symbol -->
  <text x="140" y="156" font-size="18" fill="#666" font-weight="bold">+</text>

  <!-- divider line -->
  <path d="M 120 188 L 382 188" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- sum row: 1 0 1 0 1 -->
  <text x="86" y="226" font-size="12" fill="#888">sum:</text>
  <rect x="120" y="200" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="200" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="218" y="200" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="200" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="326" y="200" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- scan direction arrow -->
  <path d="M 348 244 L 142 244" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">← 从低位向高位扫描</text>

  <!-- right note box -->
  <rect x="408" y="84" width="142" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="479" y="108" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">逐位求和公式</text>
  <text x="479" y="134" text-anchor="middle" font-size="11" fill="#666">d1 + d2 + carry</text>
  <text x="479" y="156" text-anchor="middle" font-size="10" fill="#888">（短串扫完取 0）</text>
  <text x="479" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a">本位 = sum &amp; 1</text>
  <text x="479" y="206" text-anchor="middle" font-size="11" fill="#446688">进位 = sum &gt;&gt; 1</text>
  <text x="479" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最大 sum = 1+1+1 = 3</text>

  <!-- bottom note -->
  <rect x="40" y="288" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：carry 永远 ≤ 1，状态极简；从低位起，进位单向传播无需回头</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#666">若从高位向低位扫，低位进位无法回头修正高位</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">结果长度 = max(m,n) 或 max(m,n)+1（最高位进位时）</text>
</svg>
