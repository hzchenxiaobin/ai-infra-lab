<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">KMP 核心：用「最长相同前后缀」避免主串回退</text>

  <text x="38" y="84" font-size="12" fill="#666">已匹配前缀</text>

  <rect x="130" y="60" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="176" y="60" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="222" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="268" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="314" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <text x="151" y="112" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="197" y="112" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="243" y="112" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="289" y="112" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="335" y="112" text-anchor="middle" font-size="10" fill="#888">4</text>

  <path d="M130 54 L130 46 L218 46 L218 54" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="174" y="40" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前缀 "aa"</text>

  <path d="M268 118 L268 126 L356 126 L356 118" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="312" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">后缀 "aa"</text>

  <rect x="90" y="158" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12.5" fill="#444">前缀 = 后缀 = "aa" → 最长相同前后缀长度 = 2 = LPS[4]</text>

  <text x="38" y="234" font-size="12" fill="#666">失配时</text>

  <rect x="130" y="212" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="176" y="212" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="222" y="212" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="268" y="212" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="314" y="212" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="360" y="212" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="236" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">f</text>

  <text x="151" y="262" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="197" y="262" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="243" y="262" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="289" y="262" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="335" y="262" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="381" y="262" text-anchor="middle" font-size="10" fill="#888">5</text>

  <rect x="222" y="212" width="42" height="36" fill="none" stroke="#82b366" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j=2</text>
  <text x="381" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j=5 失配</text>

  <path d="M381 284 L381 300 L243 300 L243 254" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="316" text-anchor="middle" font-size="11" fill="#b85450">j = LPS[j−1] = LPS[4] = 2</text>

  <rect x="80" y="332" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="353" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">主串指针 i 不回退，pattern 直接跳到 j=2 继续比较</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#888">暴力法在这里会把 i 往回挪一位重新开始 → 退化 O(n·m)</text>
</svg>
