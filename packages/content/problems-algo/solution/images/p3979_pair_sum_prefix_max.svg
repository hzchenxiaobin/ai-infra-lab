<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：固定 j，i 只能取 [0, j−k] 里的最大值</text>

  <!-- 图例 -->
  <rect x="30" y="32" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="42" font-size="9" fill="#446688" filter="url(#rough2)">可行 i</text>
  <rect x="100" y="32" width="12" height="12" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="116" y="42" font-size="9" fill="#888" filter="url(#rough2)">不可行</text>
  <rect x="172" y="32" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="42" font-size="9" fill="#8a6d1f" filter="url(#rough2)">右端点 j</text>
  <rect x="248" y="32" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="264" y="42" font-size="9" fill="#4a7a3a" filter="url(#rough2)">新进</text>
  <text x="336" y="42" font-size="9.5" fill="#446688" filter="url(#rough2)">prefixMax = max(nums[0..j−k])</text>

  <!-- 顶部原数组 -->
  <text x="40" y="79" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="68" y="58" width="50" height="32" rx="4" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="93" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="58" width="50" height="32" rx="4" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="153" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="188" y="58" width="50" height="32" rx="4" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="213" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="248" y="58" width="50" height="32" rx="4" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="273" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="308" y="58" width="50" height="32" rx="4" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="333" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="93" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="153" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="213" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="273" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="333" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=4</text>

  <rect x="386" y="56" width="112" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="71" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k = 2</text>
  <text x="442" y="85" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">即 j − i ≥ 2</text>

  <!-- 行 j=2 -->
  <text x="44" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j=2</text>
  <rect x="68" y="118" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="108" y="118" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="125" y="138" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="148" y="118" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="165" y="138" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="188" y="118" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="205" y="138" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="228" y="118" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="245" y="138" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="276" y="137" font-size="10.5" fill="#555" filter="url(#rough2)">prefixMax=1 → 1+5=6</text>
  <text x="85" y="158" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新进</text>

  <!-- 行 j=3 -->
  <text x="44" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j=3</text>
  <rect x="68" y="162" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="108" y="162" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="125" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="162" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="165" y="182" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="188" y="162" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="228" y="162" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="245" y="182" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="276" y="181" font-size="10.5" fill="#555" filter="url(#rough2)">prefixMax=3 → 3+2=5</text>
  <text x="125" y="202" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新进</text>

  <!-- 行 j=4 -->
  <text x="44" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j=4</text>
  <rect x="68" y="206" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="108" y="206" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="206" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="165" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="188" y="206" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="205" y="226" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="228" y="206" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="226" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="276" y="225" font-size="11" fill="#2f5527" font-weight="bold" filter="url(#rough2)">prefixMax=5 → 5+8=13 ✓</text>
  <text x="430" y="225" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 答案</text>
  <text x="165" y="246" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新进</text>

  <!-- 结论框 -->
  <rect x="30" y="262" width="300" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="280" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">可行域 [0, j−k] 只扩不缩 → 一个滚动变量即可</text>
  <text x="180" y="298" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">prefixMax ← max(prefixMax, nums[j−k])</text>
  <text x="180" y="314" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">ans ← max(ans, prefixMax + nums[j])，一趟 O(n)</text>

  <!-- 小抄框 -->
  <rect x="344" y="262" width="148" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="418" y="279" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· k ≤ n−1 ⇒ 有效对必存在</text>
  <text x="418" y="295" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 和 ≤ 2×10⁹，int 恰好装下</text>
  <text x="418" y="311" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 同构 121 股票题（min 版）</text>

  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">距离约束把 i 压成连续前缀，前缀只增 → 滚动 max，完事</text>
</svg>
