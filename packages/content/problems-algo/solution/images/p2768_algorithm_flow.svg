<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2768f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2768g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2768r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希表只记受影响块 + 末位补 0</text>

  <!-- 1. init -->
  <rect x="170" y="42" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cnt = {} ；total = (m−1)(n−1)</text>
  <path d="M280,76 L280,98" stroke="#446688" stroke-width="2" marker-end="url(#arr2768f)" filter="url(#rough2)"/>

  <!-- 2. outer loop -->
  <rect x="150" y="100" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for (x, y) in coordinates</text>
  <path d="M410,117 L450,117" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2768g)" filter="url(#rough2)"/>
  <text x="430" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">耗尽</text>
  <path d="M280,134 L280,158" stroke="#446688" stroke-width="2" marker-end="url(#arr2768f)" filter="url(#rough2)"/>

  <!-- 3. candidate enumeration -->
  <rect x="110" y="160" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">枚举候选块 (r, c) ∈ {x−1, x} × {y−1, y}</text>
  <path d="M280,194 L280,216" stroke="#446688" stroke-width="2" marker-end="url(#arr2768f)" filter="url(#rough2)"/>

  <!-- 4. bounds diamond -->
  <path d="M280,220 L372,258 L280,296 L188,258 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 ≤ r &lt; m−1</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">且 0 ≤ c &lt; n−1 ?</text>

  <!-- yes -> cnt++ -->
  <text x="180" y="252" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M188,258 L132,258" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2768g)" filter="url(#rough2)"/>
  <rect x="28" y="240" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt[(r,c)]++</text>
  <text x="80" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a">↻ 下一候选</text>

  <!-- no -> drop -->
  <text x="380" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M372,258 L428,258" stroke="#b85450" stroke-width="2" marker-end="url(#arr2768r)" filter="url(#rough2)"/>
  <rect x="428" y="240" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="483" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">丢弃(越界)</text>
  <text x="483" y="290" text-anchor="middle" font-size="9" fill="#b85450">↻ 下一候选</text>

  <!-- annotation + arrow to tally -->
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">候选耗尽 → 回外层取下一黑格</text>
  <path d="M280,322 L280,350" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr2768g)" filter="url(#rough2)"/>
  <text x="300" y="340" font-size="9" fill="#4a7a3a">循环结束</text>

  <!-- 5. tally -->
  <rect x="120" y="352" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for v in cnt.values(): arr[v]++; s++</text>
  <path d="M280,386 L280,408" stroke="#446688" stroke-width="2" marker-end="url(#arr2768f)" filter="url(#rough2)"/>

  <!-- 6. arr[0] -->
  <rect x="150" y="410" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">arr[0] = total − s   （0 黑格块补齐）</text>
  <path d="M280,444 L280,462" stroke="#446688" stroke-width="2" marker-end="url(#arr2768f)" filter="url(#rough2)"/>

  <!-- 7. return -->
  <rect x="210" y="464" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="484" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return arr</text>
</svg>
