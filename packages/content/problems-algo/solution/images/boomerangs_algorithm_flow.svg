<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举中心 → 按距离分组 → 累加 m×(m−1)</text>

  <!-- Step 1: for each point i -->
  <rect x="180" y="50" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 枚举每个点 i 作为中心</text>

  <path d="M 280 90 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute distance to all others -->
  <rect x="140" y="112" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">② 遍历其它所有点 j，计算</text>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">平方距离 dist = dx² + dy²</text>

  <path d="M 280 156 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: group by distance in hash map -->
  <rect x="120" y="178" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 按距离分组存入哈希表</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#555">cnt[dist]++  （统计每个距离的点数）</text>

  <path d="M 280 222 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: for each distance group add m*(m-1) -->
  <rect x="120" y="244" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 遍历哈希表每组 m 个点</text>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans += m × (m − 1)</text>

  <path d="M 280 288 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return ans -->
  <rect x="180" y="310" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">⑤ 返回 ans</text>

  <!-- loop back arrow from step 5 to step 1 -->
  <path d="M 380 330 Q 460 330 460 190 Q 460 70 380 70" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="200" font-size="10" fill="#888">下一个</text>
  <text x="470" y="214" font-size="10" fill="#888">中心 i</text>

  <!-- complexity footer -->
  <rect x="80" y="380" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">复杂度</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#333">时间 O(n²)：n 个中心 × 每中心 O(n) 扫描</text>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#333">空间 O(n)：每中心的哈希表至多 n−1 个距离</text>
</svg>
