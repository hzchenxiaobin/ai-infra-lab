<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">哈希集合只追踪「有 / 无」，不记个数</text>

  <!-- ===== Row 1: initial set ===== -->
  <text x="50" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">初始 S</text>
  <g filter="url(#rough2)">
    <rect x="50" y="82" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="74" y="104" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="102" y="82" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="104" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="154" y="82" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="178" y="104" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="206" y="82" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="230" y="104" text-anchor="middle" font-size="14" fill="#333">8</text>
  </g>
  <text x="280" y="104" font-size="13" fill="#b85450" filter="url(#rough2)">操作：1 → 2</text>

  <!-- arrow down -->
  <path d="M130,128 L130,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="152" font-size="12" fill="#d6a040" filter="url(#rough2)">erase(1) → insert(2)</text>

  <!-- ===== Row 2: after erase 1 ===== -->
  <text x="50" y="184" font-size="13" fill="#b85450" filter="url(#rough2)">删 1</text>
  <g filter="url(#rough2)">
    <rect x="50" y="192" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="74" y="214" text-anchor="middle" font-size="14" fill="#999">1</text>
    <path d="M54,196 L94,222 M54,222 L94,196" stroke="#b85450" stroke-width="2" fill="none"/>
    <rect x="102" y="192" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="214" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="154" y="192" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="178" y="214" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="206" y="192" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="230" y="214" text-anchor="middle" font-size="14" fill="#333">8</text>
    <!-- new 2 appearing -->
    <rect x="258" y="192" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="282" y="214" text-anchor="middle" font-size="14" fill="#333">2</text>
  </g>
  <text x="320" y="214" font-size="12" fill="#4a7a3a" filter="url(#rough2)">insert(2) 已加入</text>

  <!-- arrow down -->
  <path d="M150,238 L150,278" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: result set ===== -->
  <text x="50" y="294" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结果 S</text>
  <g filter="url(#rough2)">
    <rect x="50" y="302" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="74" y="324" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="102" y="302" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="126" y="324" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="154" y="302" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="178" y="324" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="206" y="302" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="230" y="324" text-anchor="middle" font-size="14" fill="#333">8</text>
  </g>
  <text x="290" y="324" font-size="12" fill="#666" filter="url(#rough2)">位置 1 空，位置 2 有石块</text>

  <!-- key insight box -->
  <rect x="320" y="296" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="318" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">关键：移动 = 源消失 + 目的加入</text>
  <text x="430" y="338" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">集合只存「在不在」，无需计数</text>
</svg>
