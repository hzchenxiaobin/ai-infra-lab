  <path d="M 240 88 Q 226 96 216 108" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="340" width="460" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="56" y="362" font-size="12" font-weight="bold" fill="#b85450">死锁条件（Coffman 四条件全满足）：</text>
  <text x="56" y="380" font-size="10" fill="#444">互斥 ✓ · 占有并等待 ✓ · 不可抢占 ✓ · 循环等待 P0→P1→P2→P3→P4→P0 ✓</text>
