<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：固定右端点 i，左端点 l ∈ (lastInvalid, min(lastMin,lastMax)]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">三指针各记「最近越界 / 最近 minK / 最近 maxK」位置，合成一段合法左端点区间</text>

  <!-- nums = [5,2,1,9,3,5,1] snapshot at i=6 ; 7 cells w=48 gap=6 start=74 -->
  <text x="36" y="86" font-size="10.5" fill="#666">nums</text>

  <!-- cell 0 : 5 -->
  <rect x="74" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>
  <!-- cell 1 : 2 -->
  <rect x="128" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="85" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- cell 2 : 1  (old minK) -->
  <rect x="182" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="85" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- cell 3 : 9  out of range -->
  <rect x="236" y="62" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <!-- cell 4 : 3  valid left endpoint -->
  <rect x="290" y="62" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="85" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- cell 5 : 5  lastMax -->
  <rect x="344" y="62" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>
  <!-- cell 6 : 1  lastMin + right end i -->
  <rect x="398" y="62" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="98" y="56" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="152" y="56" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="206" y="56" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="260" y="56" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="314" y="56" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="368" y="56" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="422" y="56" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- valid left range bracket over cells 4-5 -->
  <path d="M 290 50 L 290 44 L 392 44 L 392 50" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="341" y="38" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">合法左端点 (3, 5] = {4,5}</text>

  <!-- right endpoint marker i=6 -->
  <path d="M 422 100 L 422 116" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="128" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">右端点 i</text>

  <!-- lastInvalid pointer cell 3 -->
  <path d="M 260 100 L 260 144" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">lastInvalid</text>
  <text x="260" y="170" text-anchor="middle" font-size="9.5" fill="#b85450">越界硬左界</text>

  <!-- lastMin pointer cell 6 -->
  <path d="M 422 100 L 422 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="158" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">lastMin</text>

  <!-- lastMax pointer cell 5 -->
  <path d="M 368 100 L 368 144" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">lastMax</text>

  <!-- Formula box -->
  <rect x="60" y="192" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">本步贡献 = max(0, min(lastMin, lastMax) − lastInvalid)</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#555">= max(0, min(6, 5) − 3) = max(0, 5 − 3) = 2</text>
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#888">对应 [3,5,1] 与 [5,1] 两个定界子数组</text>

  <!-- Why interval -->
  <rect x="40" y="262" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何成连续区间？</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#555">l &gt; lastInvalid 排除越界元素；l ≤ lastMin 保证含 minK；l ≤ lastMax 保证含 maxK</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#555">三条件皆「单侧不等式」⟹ 交集是一段区间</text>

  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#aaa">minK = 1, maxK = 5 ｜ 对比 795：795 只约束「最大值 ≤ 上界」，左界仅由越界位置决定</text>
</svg>
