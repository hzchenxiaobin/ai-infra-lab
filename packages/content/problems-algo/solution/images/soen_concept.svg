<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">增量维护偶数和：只调整被修改元素的贡献</text>

  <!-- Row 1: array A -->
  <text x="40" y="72" font-size="12" fill="#888">数组 A:</text>
  <rect x="100" y="52" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="73" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="160" y="52" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="52" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="73" text-anchor="middle" font-size="13" fill="#999">3</text>
  <rect x="280" y="52" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- even sum annotation -->
  <text x="360" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">偶数和 S = 2 + 4 = 6</text>
  <text x="360" y="82" font-size="11" fill="#888">(绿色 = 偶数，贡献入 S)</text>

  <!-- single element update illustration -->
  <text x="40" y="126" font-size="12" fill="#888">查询 [val, idx]：</text>
  <rect x="150" y="106" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">old</text>
  <path d="M 218 123 L 250 123" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="254" y="106" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="286" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">new</text>
  <text x="330" y="127" font-size="12" fill="#888">new = old + val，仅 idx 位置变化</text>

  <!-- four cases header -->
  <text x="270" y="170" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">偶数和增量 ΔS（按 old / new 的奇偶分四种情况）</text>

  <!-- column headers -->
  <text x="200" y="196" text-anchor="middle" font-size="11" fill="#888">new 为偶</text>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#888">new 为奇</text>
  <!-- row headers -->
  <text x="104" y="230" text-anchor="end" font-size="11" fill="#888">old 为偶</text>
  <text x="104" y="290" text-anchor="end" font-size="11" fill="#888">old 为奇</text>

  <!-- cell (old even, new even): S += val -->
  <rect x="120" y="208" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S += val</text>
  <!-- cell (old even, new odd): S -= old -->
  <rect x="280" y="208" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S -= old</text>
  <!-- cell (old odd, new even): S += new -->
  <rect x="120" y="268" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="298" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S += new</text>
  <!-- cell (old odd, new odd): S unchanged -->
  <rect x="280" y="268" width="160" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="298" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">S 不变</text>

  <!-- insight box -->
  <rect x="40" y="332" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="354" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：无需重新遍历整个数组</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#666">每次查询只动 idx 一个位置 → 先扣 old 贡献，再加 new 贡献，O(1) 维护 S</text>
</svg>
