<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：CIDR 块 = 二进制对齐区间，贪心取最大合法块</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">覆盖 255.0.0.7 ~ 255.0.0.16（n=10）→ 3 块</text>

  <!-- address cells: x = 44 + i*48, w=47, y=58, h=42 -->
  <!-- i=0 addr 7 (orange single) -->
  <rect x="44" y="58" width="47" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- i=1..8 addr 8..15 (blue block) -->
  <rect x="92" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="58" width="47" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- i=9 addr 16 (orange single) -->
  <rect x="476" y="58" width="47" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- address labels (末段) centered y=84 -->
  <text x="67" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">.7</text>
  <text x="115" y="84" text-anchor="middle" font-size="12" fill="#446688">.8</text>
  <text x="163" y="84" text-anchor="middle" font-size="12" fill="#446688">.9</text>
  <text x="211" y="84" text-anchor="middle" font-size="12" fill="#446688">.10</text>
  <text x="259" y="84" text-anchor="middle" font-size="12" fill="#446688">.11</text>
  <text x="307" y="84" text-anchor="middle" font-size="12" fill="#446688">.12</text>
  <text x="355" y="84" text-anchor="middle" font-size="12" fill="#446688">.13</text>
  <text x="403" y="84" text-anchor="middle" font-size="12" fill="#446688">.14</text>
  <text x="451" y="84" text-anchor="middle" font-size="12" fill="#446688">.15</text>
  <text x="499" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">.16</text>

  <!-- binary hints under 7, 8, 16 -->
  <text x="67" y="114" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">0111</text>
  <text x="115" y="114" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">1000</text>
  <text x="499" y="114" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">10000</text>

  <!-- block bracket labels y=128 h=24 -->
  <rect x="44" y="128" width="47" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="145" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">/32 ×1</text>

  <rect x="92" y="128" width="383" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">255.0.0.8/29   ×8（一个对齐块吞 8 个地址）</text>

  <rect x="476" y="128" width="47" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="499" y="145" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">/32 ×1</text>

  <!-- callout -->
  <rect x="44" y="168" width="492" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="60" y="188" font-size="11" fill="#444" font-weight="bold">对齐约束：块大小 = 2^k ⇒ 起点低 k 位必须全 0</text>
  <text x="60" y="206" font-size="11" fill="#444">起点处能取的最大对齐块 = <tspan fill="#b85450" font-weight="bold">start &amp; -start</tspan>（整除 start 的最大 2 幂）</text>

  <!-- bit diagram title -->
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位运算示例：12 &amp; -12 = 4 —— 只保留最低置位 bit</text>

  <!-- 8 bit cells per row; x = 140 + i*34, w=32, h=22 -->
  <!-- Row 1: 12 = 0000 1100 ; row label x=128 right-anchor -->
  <text x="128" y="277" text-anchor="end" font-size="11" fill="#444" font-weight="bold">12</text>
  <rect x="140" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="156" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="174" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="190" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="208" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="224" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="242" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="258" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="276" y="266" width="32" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/><text x="292" y="281" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="310" y="266" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/><text x="326" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="344" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="360" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="378" y="266" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="394" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- Row 2: -12 = 1111 0100 -->
  <text x="128" y="309" text-anchor="end" font-size="11" fill="#444" font-weight="bold">−12</text>
  <rect x="140" y="298" width="32" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/><text x="156" y="313" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="174" y="298" width="32" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/><text x="190" y="313" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="208" y="298" width="32" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/><text x="224" y="313" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="242" y="298" width="32" height="22" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/><text x="258" y="313" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="276" y="298" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="292" y="313" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="310" y="298" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/><text x="326" y="313" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="344" y="298" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="360" y="313" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="378" y="298" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="394" y="313" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- Row 3: 12 & -12 = 0000 0100 = 4 -->
  <text x="128" y="341" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">&amp;</text>
  <rect x="140" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="156" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="174" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="190" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="208" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="224" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="242" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="258" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="276" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="292" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="310" y="330" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/><text x="326" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="344" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="360" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="378" y="330" width="32" height="22" fill="#fff" stroke="#ccc" rx="3" filter="url(#rough2)"/><text x="394" y="345" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- result label -->
  <text x="430" y="341" font-size="13" fill="#b85450" font-weight="bold">= 4</text>
</svg>
