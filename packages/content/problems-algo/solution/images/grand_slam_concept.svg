<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：宽表（4 冠军列）→ 长表（1 player_id 列）</text>

  <!-- ===== Left: Championships wide table ===== -->
  <text x="30" y="56" font-size="10" fill="#888">Championships（宽表：每年 4 列各存一个冠军 ID）</text>

  <!-- table outer -->
  <rect x="24" y="64" width="236" height="132" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- header row -->
  <rect x="24" y="64" width="236" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">year</text>
  <text x="96" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Wim</text>
  <text x="140" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Fr</text>
  <text x="184" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">US</text>
  <text x="228" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Au</text>
  <line x1="24" y1="88" x2="260" y2="88" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2018 row -->
  <text x="44" y="104" text-anchor="middle" font-size="9" fill="#446688">2018</text>
  <text x="96" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="140" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="184" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="228" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="24" y1="110" x2="260" y2="110" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2019 row -->
  <text x="44" y="126" text-anchor="middle" font-size="9" fill="#446688">2019</text>
  <text x="96" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="140" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="184" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="228" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="24" y1="132" x2="260" y2="132" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2020 row -->
  <text x="44" y="148" text-anchor="middle" font-size="9" fill="#446688">2020</text>
  <text x="96" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="184" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="228" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="142" y="174" text-anchor="middle" font-size="8" fill="#888">3 行 × 4 冠军列 = 12 个冠军 ID 散落在宽表里</text>
  <text x="142" y="188" text-anchor="middle" font-size="8" fill="#888">红色 = Nadal(1)，绿色 = Federer(2)</text>

  <!-- ===== Middle: UNION ALL arrow ===== -->
  <rect x="280" y="108" width="92" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="326" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">UNION ALL</text>
  <text x="326" y="140" text-anchor="middle" font-size="8" fill="#d6a040">×4 次 SELECT</text>
  <!-- arrow from wide table to union box -->
  <path d="M 262 110 L 278 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow from union box to long table -->
  <path d="M 374 130 L 392 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: Long table (player_id column) ===== -->
  <text x="410" y="56" font-size="10" fill="#888">长表 T（1 列 player_id，12 行）</text>

  <rect x="408" y="64" width="84" height="132" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="408" y="64" width="84" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="450" y="79" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">player_id</text>
  <line x1="408" y1="86" x2="492" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- 12 rows: 2018(1,1,1,1) 2019(1,1,2,2) 2020(2,1,2,2) -->
  <text x="450" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="136" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="450" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="450" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="450" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" opacity="0"></text>

  <!-- count bracket on right of long table -->
  <path d="M 500 92 L 514 92 L 514 168 L 500 168" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="540" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Nadal=7</text>
  <text x="540" y="138" text-anchor="middle" font-size="8" fill="#b85450">(6 行... 实为 7)</text>

  <path d="M 500 172 L 514 172 L 514 196 L 500 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="540" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">余 5 行</text>

  <!-- ===== Bottom callout ===== -->
  <rect x="40" y="222" width="520" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">UNION ALL = SQL 的 UNPIVOT（列转行）</text>
  <text x="300" y="262" text-anchor="middle" font-size="9" fill="#555">4 个「冠军 ID 列」各自 SELECT 出来，纵向堆叠成 1 列</text>
  <text x="300" y="278" text-anchor="middle" font-size="9" fill="#555">→ 再 JOIN Players 取名字 → GROUP BY player_id → COUNT(*) 即得大满贯数</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="310" width="520" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">为什么不能直接对宽表 COUNT？</text>
  <text x="300" y="352" text-anchor="middle" font-size="9" fill="#555">冠军 ID 散落在 4 个不同列里，COUNT(column) 只能数单列</text>
  <text x="300" y="368" text-anchor="middle" font-size="9" fill="#555">要数「某个 ID 在 4 列中出现的总次数」，必须先把 4 列拍平成 1 列</text>
  <text x="300" y="388" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">口诀：宽表计数先 UNION ALL 拍平，再聚合</text>
  <text x="300" y="406" text-anchor="middle" font-size="8" fill="#888">（或用 SUM(col=p.id) 累加 4 列的布尔命中，见解法 C）</text>
</svg>
