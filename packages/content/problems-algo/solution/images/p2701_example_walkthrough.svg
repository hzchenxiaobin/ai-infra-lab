<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">
    示例演算：客户 105 的 7 笔交易逐步处理
  </text>

  <!-- Column x positions: date=40 w=80, amount=120 w=55, prev_date=175 w=80, prev_amt=255 w=65, check=320 w=95, is_break=415 w=55, group=470 w=55 -->
  <!-- total: 470+55=525, with 40 margin each side: 605. viewBox 660 is fine -->

  <!-- Header row -->
  <rect x="40" y="34" width="525" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">date</text>
  <text x="147" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">amount</text>
  <text x="215" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">prev_date</text>
  <text x="287" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">prev_amt</text>
  <text x="367" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">连续&amp;递增?</text>
  <text x="442" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">is_break</text>
  <text x="497" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">group_id</text>

  <!-- Row 1: 05-01, 100, NULL, NULL, —, 1, 1 (Group 1 blue) -->
  <rect x="40" y="62" width="525" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-01</text>
  <text x="147" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">100</text>
  <text x="215" y="82" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">NULL</text>
  <text x="287" y="82" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">NULL</text>
  <text x="367" y="82" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="442" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="497" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- Row 2: 05-02, 150, 05-01, 100, ✓✓, 0, 1 -->
  <rect x="40" y="94" width="525" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-02</text>
  <text x="147" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">150</text>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-01</text>
  <text x="287" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="367" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 1天 ↑</text>
  <text x="442" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="497" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- Row 3: 05-03, 200, 05-02, 150, ✓✓, 0, 1 -->
  <rect x="40" y="126" width="525" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-03</text>
  <text x="147" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">200</text>
  <text x="215" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-02</text>
  <text x="287" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">150</text>
  <text x="367" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 1天 ↑</text>
  <text x="442" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="497" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- Row 4: 05-04, 300, 05-03, 200, ✓✓, 0, 1 -->
  <rect x="40" y="158" width="525" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-04</text>
  <text x="147" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">300</text>
  <text x="215" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-03</text>
  <text x="287" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">200</text>
  <text x="367" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 1天 ↑</text>
  <text x="442" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="497" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- Separator between groups -->
  <line x1="40" y1="194" x2="565" y2="194" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Row 5: 05-12, 250, 05-04, 300, ✗8天, 1, 2 (Group 2 green) -->
  <rect x="40" y="196" width="525" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-12</text>
  <text x="147" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">250</text>
  <text x="215" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-04</text>
  <text x="287" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">300</text>
  <text x="367" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 8天</text>
  <text x="442" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="497" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- Row 6: 05-13, 260, 05-12, 250, ✓✓, 0, 2 -->
  <rect x="40" y="228" width="525" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-13</text>
  <text x="147" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">260</text>
  <text x="215" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-12</text>
  <text x="287" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">250</text>
  <text x="367" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 1天 ↑</text>
  <text x="442" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="497" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- Row 7: 05-14, 270, 05-13, 260, ✓✓, 0, 2 -->
  <rect x="40" y="260" width="525" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <text x="80" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-14</text>
  <text x="147" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">270</text>
  <text x="215" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-13</text>
  <text x="287" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">260</text>
  <text x="367" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 1天 ↑</text>
  <text x="442" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="497" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- Group result annotations -->
  <rect x="40" y="306" width="525" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Group 1: COUNT=4 ≥ 3 ✓ → (105, 05-01, 05-04)</text>

  <rect x="40" y="334" width="525" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Group 2: COUNT=3 ≥ 3 ✓ → (105, 05-12, 05-14)</text>

  <!-- Bottom note -->
  <text x="330" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    "连续&amp;递增" = DATEDIFF(date, prev_date)=1 且 amount > prev_amount，缺一即断
  </text>
  <text x="330" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    客户 101 同理：3 行连续递增 → (101, 05-01, 05-03)；客户 102 无 ≥3 连续段 → 排除
  </text>
</svg>
