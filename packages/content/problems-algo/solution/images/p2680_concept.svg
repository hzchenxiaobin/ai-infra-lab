<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">集中左移 k 位 vs 分散左移：高位比特价值压倒一切</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 a=3(011), b=4(100), k=2</text>

  <!-- bit position header -->
  <text x="190" y="72" text-anchor="end" font-size="10" fill="#aaa" filter="url(#rough2)">位</text>
  <text x="220" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="264" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="308" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="352" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="396" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <!-- Group 1: Concentrate -->
  <rect x="200" y="80" width="240" height="96" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="206" y="94" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">集中：k=2 全给 b</text>

  <text x="190" y="116" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">b&lt;&lt;2=16</text>
  <rect x="198" y="104" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="121" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="242" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="121" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="286" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="121" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="330" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="121" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="374" y="104" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="121" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>

  <text x="190" y="146" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">a=3</text>
  <rect x="198" y="134" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="151" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="242" y="134" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="151" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="286" y="134" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="151" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="330" y="134" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="151" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="134" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="151" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="190" y="172" text-anchor="end" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">OR=19</text>
  <rect x="198" y="160" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="177" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="242" y="160" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="177" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="286" y="160" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="177" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="330" y="160" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="177" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="160" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="177" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- callout for concentrate -->
  <path d="M 242 172 L 196 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">位4=新</text>

  <!-- Group 2: Split -->
  <rect x="200" y="196" width="240" height="96" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="206" y="210" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">分散：a,b 各左移 1 位</text>

  <text x="190" y="232" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">a&lt;&lt;1=6</text>
  <rect x="198" y="220" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="237" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="242" y="220" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="237" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="286" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="237" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="330" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="237" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="220" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="237" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>

  <text x="190" y="262" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">b&lt;&lt;1=8</text>
  <rect x="198" y="250" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="267" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="242" y="250" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="264" y="267" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="286" y="250" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="267" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="330" y="250" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="267" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="374" y="250" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="267" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>

  <text x="190" y="288" text-anchor="end" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">OR=14</text>
  <rect x="198" y="276" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="293" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="242" y="276" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="264" y="293" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="286" y="276" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="308" y="293" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="330" y="276" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="293" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="276" width="44" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="293" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- callout for split -->
  <path d="M 286 288 L 242 288" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="293" font-size="10" fill="#d6a040" filter="url(#rough2)">最高仅位3</text>

  <!-- Bottom annotation -->
  <rect x="60" y="316" width="440" height="68" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">集中 → 最高比特在位 4：2⁴ = 16</text>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">分散 → 最高比特在位 3：2³+2²+2¹ = 14</text>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">单个高位 &gt; 所有低位之和，故集中必优</text>
</svg>
