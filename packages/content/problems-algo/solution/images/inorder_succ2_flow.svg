<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">inorderSuccessor 算法流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="56" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">输入 node</text>

  <path d="M 280 78 L 280 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: node.right != null? -->
  <path d="M 280 108 L 376 150 L 280 192 L 184 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node.right</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">!= null ?</text>

  <!-- Yes 分支（左） -->
  <path d="M 184 150 L 130 150 L 130 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="60" y="200" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="11" fill="#333">cur = node.right</text>

  <path d="M 130 234 L 130 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="260" width="172" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="11" fill="#333">while (cur.left)</text>
  <text x="130" y="293" text-anchor="middle" font-size="11" fill="#333">    cur = cur.left</text>

  <path d="M 130 300 L 130 322" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="326" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return cur</text>

  <!-- No 分支（右） -->
  <path d="M 376 150 L 430 150 L 430 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="142" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="360" y="200" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="11" fill="#333">cur = node</text>

  <path d="M 430 234 L 430 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="342" y="260" width="176" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="11" fill="#333">while (cur.parent &amp;&amp;</text>
  <text x="430" y="293" text-anchor="middle" font-size="11" fill="#333">       cur==cur.parent.right)</text>
  <text x="430" y="306" text-anchor="middle" font-size="11" fill="#333">    cur = cur.parent</text>

  <path d="M 430 308 L 430 322" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="326" width="136" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return cur.parent</text>

  <!-- 汇合到 End -->
  <path d="M 130 360 L 130 396 L 280 396" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 360 L 430 396 L 280 396" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="280" cy="410" rx="60" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回后继 / null</text>

  <!-- 注脚 -->
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">两条分支互斥：有右子树走「右-左到底」，无右子树走「parent 上溯」</text>
</svg>
