<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CROSS JOIN 三表 → WHERE 过滤 → SELECT 输出</text>

  <rect x="70" y="56" width="460" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① FROM SchoolA A  CROSS JOIN SchoolB B  CROSS JOIN SchoolC C</text>
  <text x="300" y="102" text-anchor="middle" font-size="10" fill="#666">三校学生做笛卡尔积（无 ON 条件，全组合）</text>

  <path d="M300 116 L300 138" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="140" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 笛卡尔积  |A| × |B| × |C| = 2 × 1 × 3 = 6 行</text>
  <text x="300" y="186" text-anchor="middle" font-size="10" fill="#666">产出 6 个候选三元组（每校各出一人的所有组合）</text>

  <path d="M300 200 L300 222" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="224" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ WHERE a.name&lt;&gt;b.name AND b.name&lt;&gt;c.name AND a.name&lt;&gt;c.name</text>
  <text x="300" y="270" text-anchor="middle" font-size="10" fill="#666">过滤掉任意两人同名的组合 → 剩 3 行</text>

  <path d="M300 284 L300 306" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="308" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ SELECT a.student_id, a.student_name, b.student_id, b.student_name, ...</text>
  <text x="300" y="354" text-anchor="middle" font-size="10" fill="#666">输出 6 列 × 3 行有效三元组</text>

  <rect x="70" y="382" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="406" text-anchor="middle" font-size="10.5" fill="#333">CROSS JOIN = 无 ON 条件的 INNER JOIN，产出两表所有行的两两组合</text>
</svg>
