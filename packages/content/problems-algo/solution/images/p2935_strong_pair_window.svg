<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序后 y ≤ 2x —— 合法伙伴收拢成连续区间</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 nums = [1,2,3,4,5]（已排序），当前右端 y = 5</text>

  <!-- 出窗/窗口内 标签 -->
  <text x="130" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">出窗 ✗</text>
  <text x="194" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">出窗 ✗</text>
  <text x="290" y="62" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口内</text>
  <text x="386" y="62" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 右端</text>

  <!-- 数组格子 -->
  <rect x="100" y="68" width="60" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="94" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">1</text>
  <rect x="164" y="68" width="60" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="94" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <rect x="228" y="68" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="94" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="292" y="68" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="94" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="356" y="68" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="94" text-anchor="middle" font-size="14" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 指针标签 -->
  <text x="258" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ left</text>
  <text x="386" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ right</text>

  <!-- 窗口下划线 -->
  <path d="M 228 136 L 416 136" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 228 136 L 228 130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 416 136 L 416 130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="154" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">窗口 {3,4,5}：任意两个数都满足 nums[j] ≤ 2·nums[i]</text>

  <!-- 收缩步骤框 -->
  <rect x="36" y="168" width="228" height="88" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 5 时的窗口收缩</text>
  <text x="48" y="208" font-size="11" fill="#333" filter="url(#rough2)">① 5 &gt; 2×1 ⟹ 删 1（Trie cnt−−）</text>
  <text x="48" y="227" font-size="11" fill="#333" filter="url(#rough2)">② 5 &gt; 2×2 ⟹ 删 2（Trie cnt−−）</text>
  <text x="48" y="246" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 5 ≤ 2×3 ⟹ 停，left 停在 3</text>

  <!-- 条件化简框 -->
  <rect x="282" y="168" width="202" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="383" y="188" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">排序化简（设 x ≤ y）</text>
  <text x="383" y="208" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">|x − y| ≤ min(x, y)</text>
  <text x="383" y="227" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">⇔ y − x ≤ x ⇔ y ≤ 2x</text>
  <text x="383" y="246" text-anchor="middle" font-size="10.5" fill="#6688aa" filter="url(#rough2)">绝对值与 min 同时塌缩成一次比较</text>

  <!-- 底部：滑动窗口框 -->
  <rect x="36" y="270" width="228" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">滑动窗口</text>
  <text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">固定 y：伙伴 = 连续区间 [y/2, y]</text>
  <text x="150" y="330" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">y 右移 ⇒ 区间左端单调不降</text>
  <text x="150" y="348" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⇒ 双指针一遍扫描</text>

  <!-- 底部：Trie 框 -->
  <rect x="282" y="270" width="202" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="383" y="292" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0-1 Trie（可删除）</text>
  <text x="383" y="312" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">窗口内求与 y 异或的最大值</text>
  <text x="383" y="330" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">节点挂计数 cnt</text>
  <text x="383" y="348" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">insert(x, ±1) 惰性增删</text>
</svg>
