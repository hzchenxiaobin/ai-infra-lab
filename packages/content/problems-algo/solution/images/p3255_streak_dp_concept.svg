<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 398"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="398" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：以 i 结尾的连续上升段长度 cnt</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例：nums = [1, 2, 3, 4, 3, 2, 5]，k = 3</text>

  <!-- 第一行：nums -->
  <text x="35" y="76" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="35" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="103" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="171" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="239" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="307" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="443" y="84" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="124" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="192" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="328" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="396" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="464" y="105" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">5</text>

  <!-- 相邻链判定：间隙符号 -->
  <text x="90" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="158" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="226" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="294" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="362" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="430" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="35" y="136" font-size="9.5" fill="#888" filter="url(#rough2)">链：</text>

  <!-- 第二行：cnt -->
  <text x="35" y="170" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <rect x="35" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="103" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="171" y="178" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="239" y="178" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="307" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="443" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="199" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="124" y="199" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="192" y="199" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="260" y="199" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="328" y="199" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="396" y="199" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="464" y="199" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>

  <!-- 两个转移说明框 -->
  <rect x="30" y="234" width="222" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="254" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">链延续：nums[i] = nums[i−1] + 1</text>
  <text x="141" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">cnt[i] = cnt[i−1] + 1</text>

  <rect x="268" y="234" width="222" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="379" y="254" text-anchor="middle" font-size="10.5" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">断链（或 i = 0）</text>
  <text x="379" y="272" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#rough2)">cnt[i] = 1，重新起算</text>

  <path d="M 226 148 Q 141 190 141 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 362 148 Q 379 190 379 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="30" y="312" width="460" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">cnt[i] ≥ k ⇔ 窗口 [i−k+1, i] 整段连续上升</text>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#a07830" filter="url(#rough2)">⇔ 该窗口能量值 = nums[i]（窗口最大值 = 右端点）</text>
  <text x="260" y="374" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">图中绿色 cnt = 3, 4 ≥ k = 3，恰好对应答案 3、4</text>
</svg>
