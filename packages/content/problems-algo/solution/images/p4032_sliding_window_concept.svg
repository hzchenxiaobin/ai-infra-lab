<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：质因数并集随窗口只增不减 ⇒ 滑动窗口</text>

    <!-- array cells -->
    <rect x="60" y="46" width="80" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="72" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="150" y="46" width="80" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="72" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="240" y="46" width="80" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="72" text-anchor="middle" font-size="14" fill="#333">10</text>
    <rect x="330" y="46" width="80" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="370" y="72" text-anchor="middle" font-size="14" fill="#333">12</text>
    <rect x="420" y="46" width="80" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="460" y="72" text-anchor="middle" font-size="14" fill="#333">11</text>

    <!-- factor sets under cells -->
    <text x="100" y="108" text-anchor="middle" font-size="10" fill="#6b7f99">{7}</text>
    <text x="190" y="108" text-anchor="middle" font-size="10" fill="#6b7f99">{2,3}</text>
    <text x="280" y="108" text-anchor="middle" font-size="10" fill="#6b7f99">{2,5}</text>
    <text x="370" y="108" text-anchor="middle" font-size="10" fill="#6b7f99">{2,3}</text>
    <text x="460" y="108" text-anchor="middle" font-size="10" fill="#6b7f99">{11}</text>

    <!-- window over cells 6,10,12 -->
    <rect x="144" y="40" width="252" height="54" rx="8" fill="none" stroke="#d6a040" stroke-width="2.5"/>
    <text x="270" y="34" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">窗口 [6, 10, 12]</text>

    <!-- expand / shrink arrows -->
    <path d="M 402 66 L 440 66" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none"/>
    <text x="416" y="56" text-anchor="middle" font-size="9.5" fill="#d6a040">right 扩张</text>
    <path d="M 138 66 L 100 66" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none"/>
    <text x="118" y="56" text-anchor="middle" font-size="9.5" fill="#b85450">left 收缩</text>

    <!-- union annotation -->
    <text x="270" y="132" text-anchor="middle" font-size="10" fill="#333">并集 {2, 3, 5}：加入元素只添新质因数，移除元素只会让计数减少</text>

    <!-- cnt hash table -->
    <rect x="46" y="152" width="250" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="171" y="174" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold">cnt：含质因数 p 的元素个数</text>
    <text x="66" y="198" font-size="10" fill="#2f5527">p = 2 → 2（来自 10、12）</text>
    <text x="66" y="218" font-size="10" fill="#2f5527">p = 3 → 1（来自 12）</text>
    <text x="66" y="238" font-size="10" fill="#2f5527">p = 5 → 1（来自 10）</text>
    <text x="66" y="260" font-size="9" fill="#4a7a3a">元素进出窗口，对每个质因数各 ±1</text>

    <!-- distinct counter -->
    <rect x="322" y="152" width="192" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="418" y="176" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">distinct = 非零计数个数</text>
    <text x="418" y="202" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">distinct = 3 ≤ k = 3 ✓</text>
    <text x="418" y="226" text-anchor="middle" font-size="10" fill="#7a5c1a">合法 ⇒ ans = right − left + 1</text>
    <text x="418" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">distinct &gt; k ⇒ 左端收缩</text>

    <!-- monotonicity note -->
    <rect x="46" y="292" width="468" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">单调性（能用双指针的原因）</text>
    <text x="62" y="336" font-size="9.5" fill="#8a3a35">子数组的质因数并集 ⊆ 大子数组的并集——区间越长集合越大，合法性关于区间包含单调；</text>
    <text x="62" y="354" font-size="9.5" fill="#8a3a35">于是 right 单调右移时，「恰好恢复合法」的最小 left 也单调右移，左端点永不回退，</text>
    <text x="62" y="372" font-size="9.5" fill="#8a3a35">与 904 水果成篮 / 340 至多 K 个不同字符完全同构（只是把「字符」换成了「质因数」）。</text>
  </g>
</svg>
