<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后按「值层」计数，每个元素需下降层数次</text>

  <!-- Original array label -->
  <text x="50" y="68" font-size="12" fill="#888">原数组 nums = [1,1,2,2,3]</text>

  <!-- Original row: five cells -->
  <rect x="70" y="82" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="140" y="82" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="210" y="82" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <rect x="280" y="82" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <rect x="350" y="82" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <!-- Arrow down: sort (already sorted, label only) -->
  <text x="50" y="148" font-size="11" fill="#d6a040" font-weight="bold">排序后（天然有序）</text>

  <!-- Tier index row -->
  <text x="50" y="182" font-size="12" fill="#888">值层序号：</text>
  <text x="102" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="172" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="242" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="312" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="382" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- Reduction arrows: each element steps down tier by tier to tier 0 -->
  <text x="50" y="216" font-size="12" fill="#888">下降路径：</text>

  <!-- tier-0 elements: no drop needed -->
  <text x="102" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">0 次</text>
  <text x="172" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">0 次</text>

  <!-- tier-1 element: drop 2->1 (one step) -->
  <path d="M 242 246 L 242 272" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="266" font-size="9" fill="#d6a040">2→1</text>
  <text x="242" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">1 次</text>

  <path d="M 312 246 L 312 272" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="266" font-size="9" fill="#d6a040">2→1</text>
  <text x="312" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">1 次</text>

  <!-- tier-2 element: drop 3->2->1 (two steps) -->
  <path d="M 382 246 L 382 268" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="262" font-size="9" fill="#b85450">3→2</text>
  <path d="M 382 272 L 382 294" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="288" font-size="9" fill="#d6a040">2→1</text>
  <text x="382" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a">2 次</text>

  <!-- Target line -->
  <rect x="70" y="324" width="344" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="242" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">目标：全部降到第 0 层（最小值）</text>

  <!-- Contribution box on right -->
  <rect x="430" y="82" width="150" height="268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="505" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">按层贡献</text>
  <text x="505" y="134" text-anchor="middle" font-size="10" fill="#666">第 0 层(值1)：2 个</text>
  <text x="505" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">贡献 0×2 = 0</text>
  <text x="505" y="176" text-anchor="middle" font-size="10" fill="#666">第 1 层(值2)：2 个</text>
  <text x="505" y="192" text-anchor="middle" font-size="10" fill="#d6a040">贡献 1×2 = 2</text>
  <text x="505" y="218" text-anchor="middle" font-size="10" fill="#666">第 2 层(值3)：1 个</text>
  <text x="505" y="234" text-anchor="middle" font-size="10" fill="#b85450">贡献 2×1 = 2</text>
  <line x1="455" y1="250" x2="555" y2="250" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="505" y="272" text-anchor="middle" font-size="11" fill="#444">答案 = 层数之和</text>
  <text x="505" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 0+0+1+1+2</text>
  <text x="505" y="318" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">= 4</text>

  <!-- Result box -->
  <rect x="430" y="360" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="505" y="385" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">操作次数 = 4</text>

  <!-- Bottom note -->
  <text x="300" y="412" text-anchor="middle" font-size="10" fill="#888">蓝=第0层(最小) 橙=第1层 红=第2层；每个元素下降到第0层所需的「跨层数」即其操作贡献</text>
  <text x="300" y="428" text-anchor="middle" font-size="10" fill="#888">等价：每次操作把最大层整体下移一层，第 j 层需 (≥j 层元素总数) 次操作</text>
</svg>
