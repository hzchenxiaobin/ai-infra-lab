<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：取走=前缀+后缀，保留=中间连续子串</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "aabaaaacaabc"（示例 1），k = 2</text>

  <!-- 下标 -->
  <g font-size="9" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="144" y="70">0</text><text x="184" y="70">1</text><text x="224" y="70">2</text>
    <text x="264" y="70">3</text><text x="304" y="70">4</text><text x="344" y="70">5</text><text x="384" y="70">6</text>
    <text x="424" y="70">7</text><text x="464" y="70">8</text><text x="504" y="70">9</text><text x="544" y="70">10</text><text x="584" y="70">11</text>
  </g>

  <!-- 前缀取走 pos0-2 (a a b) -->
  <g filter="url(#rough2)">
    <rect x="124" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="164" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="204" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a5415" text-anchor="middle" filter="url(#rough2)">
    <text x="144" y="104">a</text><text x="184" y="104">a</text><text x="224" y="104">b</text>
  </g>

  <!-- 中间保留窗口 pos3-6 (a a a a) -->
  <g filter="url(#rough2)">
    <rect x="244" y="78" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="78" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="324" y="78" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="364" y="78" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#3a5a2a" text-anchor="middle" filter="url(#rough2)">
    <text x="264" y="104">a</text><text x="304" y="104">a</text><text x="344" y="104">a</text><text x="384" y="104">a</text>
  </g>

  <!-- 后缀取走 pos7-11 (c a a b c) -->
  <g filter="url(#rough2)">
    <rect x="404" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="444" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="484" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="524" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="564" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a5415" text-anchor="middle" filter="url(#rough2)">
    <text x="424" y="104">c</text><text x="464" y="104">a</text><text x="504" y="104">a</text><text x="544" y="104">b</text><text x="584" y="104">c</text>
  </g>

  <!-- 花括号：前缀取走 -->
  <path d="M 144 122 L 144 132 L 224 132 L 224 122" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 184 132 L 184 140" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="184" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">左取走 3 个</text>

  <!-- 花括号：中间保留 -->
  <path d="M 264 122 L 264 134 L 384 134 L 384 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 324 134 L 324 144" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="324" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">中间保留窗口（最长 4）</text>

  <!-- 花括号：后缀取走 -->
  <path d="M 424 122 L 424 132 L 584 132 L 584 122" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 504 132 L 504 140" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="504" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">右取走 5 个</text>

  <text x="360" y="176" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">橙=取走（前缀+后缀）　绿=保留（中间连续子串，不取）</text>

  <!-- 关键不变式框 -->
  <rect x="40" y="190" width="640" height="74" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="212" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键不变式</text>
  <text x="60" y="232" font-size="11.5" fill="#333" filter="url(#rough2)">取走每种 ≥ k  ⟺  保留窗口每种 ≤ (全串该种总数 − k)</text>
  <text x="60" y="250" font-size="11" fill="#555" filter="url(#rough2)">本例：a 共 8、b 共 2、c 共 2，k=2 → 窗口内 a≤6、b≤0、c≤0（窗口不能含 b/c，故只装纯 a 段）</text>

  <!-- 取走结算 -->
  <rect x="40" y="276" width="300" height="84" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">取走校验（前缀 aab + 后缀 caabc）</text>
  <text x="60" y="318" font-size="11.5" fill="#333" filter="url(#rough2)">a 取 4 ≥ 2 ✓　b 取 2 ≥ 2 ✓　c 取 2 ≥ 2 ✓</text>
  <text x="60" y="340" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">取走总数 = 3 + 5 = 8 = 最少分钟</text>

  <!-- 公式框 -->
  <rect x="360" y="276" width="320" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="520" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案公式</text>
  <text x="520" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">最少取走 = n − 最长合法保留窗口</text>
  <text x="520" y="346" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 12 − 4 = 8</text>

  <text x="360" y="374" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">求「最少取走」⟺ 求「最长可保留的中间窗口」→ 滑动窗口</text>
</svg>
