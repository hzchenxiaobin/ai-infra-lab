<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">循环交换法流程：先归位，再扫描</text>

  <!-- Init -->
  <rect x="110" y="38" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#555">n = len(nums)，i = 0</text>

  <path d="M 270 94 L 270 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop diamond: i < n ? -->
  <polygon points="270,114 392,158 270,202 148,158" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="270" y="172" text-anchor="middle" font-size="10.5" fill="#777">还有位置没归位？</text>

  <!-- No -> scan phase -->
  <path d="M 392 158 L 470 158 L 470 392" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="412" y="150" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes down -->
  <path d="M 270 202 L 270 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="286" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- check diamond: nums[i] in [1,n] and nums[i] != nums[nums[i]-1] ? -->
  <polygon points="270,224 432,272 270,320 108,272" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[i]∈[1,n]</text>
  <text x="270" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">且 ≠ nums[nums[i]−1] ?</text>
  <text x="270" y="296" text-anchor="middle" font-size="10" fill="#d6a040">能否归位？</text>

  <!-- Yes -> swap, stay at i -->
  <path d="M 108 272 L 44 272 L 44 196 L 270 196 L 270 202" stroke="#82b366" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="52" y="238" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="20" y="276" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">swap</text>
  <text x="68" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a">交换后 i 不变</text>

  <!-- No -> i += 1 -->
  <path d="M 270 320 L 270 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="286" y="334" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="190" y="344" width="160" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i += 1</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#b85450">该位无法归位，跳过</text>

  <!-- loop-back to top diamond -->
  <path d="M 190 365 L 150 365 L 150 158 L 148 158" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- scan phase -->
  <rect x="334" y="392" width="272" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">扫描：找首个 nums[i] ≠ i+1</text>
  <text x="470" y="430" text-anchor="middle" font-size="11" fill="#446688">找到 → return i+1</text>
  <text x="470" y="446" text-anchor="middle" font-size="11" fill="#446688">全匹配 → return n+1</text>

  <path d="M 470 392 L 470 158" stroke="#888" stroke-width="0" fill="none"/>
</svg>
