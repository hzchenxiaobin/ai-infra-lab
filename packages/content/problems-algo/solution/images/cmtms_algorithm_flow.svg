<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="argreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arred" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">逆向还原 + 最大堆：算法流程</text>
  <path d="M 150 36 Q 280 44 410 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="210" y="58" width="140" height="30" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">建最大堆（存 target）、total=和</text>
  <path d="M 280 90 L 280 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop max -->
  <g filter="url(#sk)">
    <rect x="200" y="116" width="160" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="137" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">弹出堆顶 M（当前最大值）</text>
  <path d="M 280 150 L 280 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: M == 1 ? -->
  <g filter="url(#sk)">
    <polygon points="280,172 372,212 280,252 188,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">M == 1 ?</text>
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#b03a3a">（最大值为1 ⇒ 全为1）</text>
  <!-- yes -> true -->
  <path d="M 188 212 L 120 212" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#argreen)" filter="url(#sk)"/>
  <text x="154" y="206" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="40" y="198" width="78" height="28" rx="14" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="79" y="217" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return True</text>

  <!-- no -> compute rest -->
  <path d="M 280 252 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="294" y="266" font-size="11" fill="#666">否</text>
  <g filter="url(#sk)">
    <rect x="190" y="278" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#2b4b6e">rest = total − M</text>
  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: rest==0 or M<=rest ? -->
  <g filter="url(#sk)">
    <polygon points="280,332 390,372 280,412 170,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">rest==0 或 M≤rest ?</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#b03a3a">（rest==0：n=1；M≤rest：矛盾）</text>
  <!-- yes -> false -->
  <path d="M 390 372 L 460 372" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <text x="424" y="366" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="462" y="358" width="82" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="503" y="377" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">return False</text>

  <!-- no -> modulo + push -->
  <path d="M 170 372 L 110 372" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="366" text-anchor="middle" font-size="11" fill="#666">否</text>
  <g filter="url(#sk)">
    <rect x="40" y="356" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="75" y="377" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">取模加速</text>

  <!-- modulo box (lower left) -->
  <g filter="url(#sk)">
    <rect x="34" y="404" width="240" height="56" rx="6" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="424" font-size="11.5" fill="#7a5415" font-weight="bold">prev = M % rest</text>
  <text x="50" y="442" font-size="11" fill="#7a5415">if prev == 0: prev = rest</text>
  <text x="50" y="456" font-size="11" fill="#7a5415">total = rest + prev；push(prev)</text>

  <!-- loop back arrow -->
  <path d="M 154 404 Q 70 360 70 290 Q 70 220 200 132" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="58" y="200" font-size="10.5" fill="#888" font-weight="bold">循环回到弹出堆顶</text>

  <!-- right tip -->
  <g filter="url(#sk)">
    <rect x="300" y="404" width="244" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="316" y="424" font-size="11.5" fill="#b03a3a" font-weight="bold">⚠️ 为什么 M ≤ rest 必为假？</text>
  <text x="316" y="442" font-size="10.5" fill="#b03a3a">正向时 M = prev + rest，prev ≥ 1</text>
  <text x="316" y="456" font-size="10.5" fill="#b03a3a">⇒ 合法序列中 M 恒 &gt; rest</text>
</svg>
