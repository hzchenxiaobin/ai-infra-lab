<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描 + 在线维护 mx[d]</text>

  <!-- start -->
  <ellipse cx="280" cy="58" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans = -1, mx 清空</text>

  <path d="M 280 80 L 280 102" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="150" y="106" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">遍历每个 v ∈ nums</text>

  <path d="M 280 148 L 280 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- digit sum -->
  <rect x="150" y="172" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12" fill="#333">算数位和 d</text>
  <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#888">for (t=v; t; t/=10) d += t%10</text>

  <path d="M 280 218 L 280 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,240 400,288 280,336 160,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">mx[d] 存在？</text>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#888">(该和下见过数)</text>

  <!-- Yes branch -->
  <path d="M 400 288 L 470 288 L 470 360" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="430" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="370" y="362" width="200" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">候选 = mx[d] + v</text>
  <text x="470" y="404" text-anchor="middle" font-size="11" fill="#555">ans = max(ans, 候选)</text>
  <text x="470" y="424" text-anchor="middle" font-size="11" fill="#555">mx[d] = max(mx[d], v)</text>

  <!-- No branch -->
  <path d="M 160 288 L 90 288 L 90 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="112" y="282" font-size="11" fill="#888" font-weight="bold">否</text>

  <rect x="20" y="362" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="384" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">mx[d] = v</text>
  <text x="90" y="404" text-anchor="middle" font-size="10.5" fill="#888">首次见此数位和</text>

  <!-- merge back -->
  <path d="M 470 440 L 470 462 L 280 462" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 90 420 L 90 462 L 280 462" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="476" font-size="11" fill="#888">下一个 v（遍历结束则返回 ans）</text>
</svg>
