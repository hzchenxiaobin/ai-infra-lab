<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐行求和，严格 &gt; 刷新答案，遍历完返回</text>

  <!-- Step 1: init -->
  <rect x="40" y="52" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="60" y="88" font-size="11" fill="#555" filter="url(#rough2)">idx = 0, mx = 0   （下标与最大 1 数；mx=0 时首行不更新即天然选中 row 0）</text>

  <path d="M 300 96 L 300 112" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="40" y="116" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="134" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 遍历每一行</text>
  <text x="60" y="152" font-size="11" fill="#555" filter="url(#rough2)">for i, row in enumerate(mat):   cnt = sum(row)   （0/1 求和 = 该行 1 的个数）</text>

  <path d="M 300 160 L 300 176" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="300,180 470,236 300,292 130,236" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ cnt &gt; mx ?</text>
  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">严格大于（平手不更新）</text>
  <text x="300" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ 保留更小下标</text>

  <!-- yes branch (right) -->
  <text x="478" y="232" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 470 236 L 500 236" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch (left) -->
  <text x="100" y="232" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <path d="M 130 236 L 100 236" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update (yes) -->
  <rect x="500" y="214" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="540" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 刷新</text>
  <text x="540" y="248" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mx=cnt</text>
  <text x="540" y="260" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">idx=i</text>

  <!-- no path note -->
  <text x="92" y="252" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">保持不变</text>

  <!-- loop back arrow: from both branches back up to step 2 left side -->
  <path d="M 100 236 L 30 236 L 30 138 L 40 138" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 540 258 L 540 300 L 30 300 L 30 138 L 40 138" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="22" y="320" font-size="10" fill="#999" filter="url(#rough2)">下一行（虚线回环）</text>

  <!-- Step 5: return -->
  <rect x="40" y="334" width="520" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 返回</text>
  <text x="120" y="356" font-size="11" fill="#555" filter="url(#rough2)">return [idx, mx]   —— 时间 O(m·n)，额外空间 O(1)</text>
</svg>
