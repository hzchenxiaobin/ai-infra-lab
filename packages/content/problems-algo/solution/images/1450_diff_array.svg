<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">扩展：差分数组支持多次 O(1) 查询</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">start = [1,2,3]，end = [3,2,7]；对每个区间 [s, e]：diff[s]+=1, diff[e+1]-=1</text>

  <!-- Operations text -->
  <text x="40" y="68" font-size="10.5" fill="#4a7a3a">学生0 [1,3]：diff[1] += 1，diff[4] −= 1</text>
  <text x="40" y="84" font-size="10.5" fill="#4a7a3a">学生1 [2,2]：diff[2] += 1，diff[3] −= 1</text>
  <text x="40" y="100" font-size="10.5" fill="#4a7a3a">学生2 [3,7]：diff[3] += 1，diff[8] −= 1</text>

  <!-- diff array label -->
  <text x="32" y="148" font-size="11" fill="#333" font-weight="bold">diff</text>

  <!-- diff array cells: 11 cells (idx 0..10), width 40, gap 4, x = 40 + i*44 -->
  <!-- idx 0: val 0 -->
  <rect x="40" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 1: val +1 (green highlight) -->
  <rect x="84" y="130" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
  <!-- idx 2: val +1 (green) -->
  <rect x="128" y="130" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
  <!-- idx 3: val 0 (net: -1+1) -->
  <rect x="172" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="192" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 4: val -1 (red) -->
  <rect x="216" y="130" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <!-- idx 5: val 0 -->
  <rect x="260" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 6: val 0 -->
  <rect x="304" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="324" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 7: val 0 -->
  <rect x="348" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="368" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 8: val -1 (red) -->
  <rect x="392" y="130" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <!-- idx 9: val 0 -->
  <rect x="436" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 10: val 0 -->
  <rect x="480" y="130" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- index labels for diff -->
  <text x="60" y="124" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="104" y="124" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="148" y="124" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="192" y="124" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="236" y="124" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="280" y="124" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="324" y="124" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="368" y="124" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="412" y="124" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="456" y="124" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="500" y="124" text-anchor="middle" font-size="9" fill="#888">10</text>

  <!-- prefix sum arrow / label between diff and cnt -->
  <text x="32" y="206" font-size="11" fill="#333" font-weight="bold">cnt</text>
  <text x="32" y="220" font-size="9" fill="#888">(前缀和)</text>
  <path d="M 60 170 L 60 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="72" y="184" font-size="9.5" fill="#4a7a3a">累加</text>

  <!-- cnt array cells: values [0,1,2,2,1,1,1,1,0,0,0] -->
  <!-- idx 0: 0 -->
  <rect x="40" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 1: 1 -->
  <rect x="84" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx 2: 2 -->
  <rect x="128" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="148" y="212" text-anchor="middle" font-size="12" fill="#333">2</text>
  <!-- idx 3: 2 -->
  <rect x="172" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="192" y="212" text-anchor="middle" font-size="12" fill="#333">2</text>
  <!-- idx 4: 1 (ANSWER - highlight) -->
  <rect x="216" y="190" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="236" y="212" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <!-- idx 5: 1 -->
  <rect x="260" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx 6: 1 -->
  <rect x="304" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="324" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx 7: 1 -->
  <rect x="348" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="368" y="212" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx 8: 0 -->
  <rect x="392" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="412" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 9: 0 -->
  <rect x="436" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx 10: 0 -->
  <rect x="480" y="190" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- index labels for cnt -->
  <text x="60" y="236" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="104" y="236" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="148" y="236" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="192" y="236" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="236" y="236" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="280" y="236" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="324" y="236" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="368" y="236" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="412" y="236" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="456" y="236" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="500" y="236" text-anchor="middle" font-size="9" fill="#888">10</text>

  <!-- query answer annotation -->
  <path d="M 236 244 L 236 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="262" width="172" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cnt[queryTime=4] = 1 → 答案</text>

  <!-- footer note -->
  <rect x="40" y="308" width="540" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">预处理 O(n + T)，每次查询 O(1)（T = 最大时间 = 1000）</text>
  <text x="310" y="350" text-anchor="middle" font-size="10.5" fill="#555">区间 [s, e] 上的 +1 → diff[s]+=1, diff[e+1]-=1；前缀和还原每个时刻的人数</text>
  <text x="310" y="368" text-anchor="middle" font-size="10.5" fill="#555">单次查询：一次遍历 O(n) 更优；多次查询：差分数组摊还 O(1)/次</text>
  <text x="310" y="386" text-anchor="middle" font-size="10.5" fill="#888">适用前提：时间值域有界（本题 ≤ 1000）；无界时退化为一次遍历</text>
</svg>
