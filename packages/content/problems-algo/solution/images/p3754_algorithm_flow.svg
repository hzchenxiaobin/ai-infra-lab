<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟剥位同时收三个量（x、sum、pw），O(d) 时间 / O(1) 空间</text>

  <!-- 初始化 -->
  <rect x="130" y="40" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">x = 0, sum = 0, pw = 1</text>

  <path d="M 220 74 L 220 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：n > 0 ? -->
  <polygon points="220,98 288,130 220,162 152,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">n &gt; 0 ?</text>

  <path d="M 288 130 L 334 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="123" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="338" y="108" width="196" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="126" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">返回 x · sum</text>
  <text x="436" y="143" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⚠ 上界 8.1×10¹⁰，须 long long</text>

  <path d="M 220 162 L 220 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="177" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 取低位 -->
  <rect x="140" y="182" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="203" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">d = n mod 10</text>

  <path d="M 220 216 L 220 236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：d == 0 ? -->
  <polygon points="220,240 282,272 220,304 158,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">d == 0 ?</text>

  <path d="M 282 272 L 326 272" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">是·丢零</text>

  <rect x="330" y="256" width="186" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="276" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">pw 不动，直接丢弃</text>

  <path d="M 220 304 L 220 324" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="318" font-size="9.5" fill="#446688" filter="url(#rough2)">否·保留</text>

  <!-- 保留 -->
  <rect x="118" y="326" width="204" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="346" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">x += d·pw ；pw ×= 10</text>
  <text x="220" y="366" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">sum += d ←顺手累加</text>

  <!-- 汇合到 n /= 10 -->
  <path d="M 220 378 L 220 396" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 423 288 L 423 412 L 306 412" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="398" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="417" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">n /= 10</text>

  <!-- 回环 -->
  <path d="M 140 413 L 84 413 L 84 130 L 146 130" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="76" y="270" text-anchor="middle" font-size="9.5" fill="#8a6d1f" transform="rotate(-90 76 270)" filter="url(#rough2)">回到 n &gt; 0 ?</text>

  <text x="310" y="440" font-size="10" fill="#777" filter="url(#rough2)">每轮剥掉一位 ⇒ 至多 10 轮（n ≤ 10⁹ 为 10 位数）；n = 0 时循环不执行，天然返回 0</text>
</svg>
