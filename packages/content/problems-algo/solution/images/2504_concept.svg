<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：把每行的 name 与 profession 无分隔拼接成新字符串</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#888">CONCAT(a, b) 按顺序首尾相接、不加任何分隔符；要加分隔符须用 CONCAT_WS(sep, a, b)</text>

  <!-- ============ Person table (left) ============ -->
  <text x="40" y="80" font-size="11.5" fill="#666" font-weight="bold">Person 表（输入）</text>

  <!-- header row -->
  <rect x="40" y="88" width="250" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="106" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">person_id</text>
  <text x="142" y="106" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">name</text>
  <text x="232" y="106" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">profession</text>

  <!-- row 1: Alex | Singer -->
  <rect x="40" y="114" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="142" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alex</text>
  <text x="232" y="132" text-anchor="middle" font-size="11" fill="#333">Singer</text>

  <!-- row 2: Alice | Actor -->
  <rect x="40" y="140" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="142" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice</text>
  <text x="232" y="158" text-anchor="middle" font-size="11" fill="#333">Actor</text>

  <!-- row 3: Bob | Player -->
  <rect x="40" y="166" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="184" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="142" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Bob</text>
  <text x="232" y="184" text-anchor="middle" font-size="11" fill="#333">Player</text>

  <!-- arrows from name & profession columns into the CONCAT box -->
  <path d="M 168 132 L 318 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 158 L 318 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ CONCAT box (middle) ============ -->
  <rect x="322" y="120" width="118" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">CONCAT</text>
  <text x="381" y="160" text-anchor="middle" font-size="10.5" fill="#555">name + profession</text>
  <text x="381" y="176" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="381" y="194" text-anchor="middle" font-size="10" fill="#888">首尾相接 · 无分隔符</text>

  <!-- arrow to output -->
  <path d="M 442 166 L 500 166" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ output table (right) ============ -->
  <text x="500" y="80" font-size="11.5" fill="#666" font-weight="bold">输出（单列）</text>
  <rect x="500" y="88" width="180" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590" y="106" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">name</text>

  <rect x="500" y="114" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">AlexSinger</text>

  <rect x="500" y="140" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">AliceActor</text>

  <rect x="500" y="166" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">BobPlayer</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="250" width="640" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">查询本质：SELECT CONCAT(name, profession) AS name FROM Person</text>
  <text x="360" y="294" text-anchor="middle" font-size="10.5" fill="#555">① 逐行读 name 与 profession；② CONCAT 按入参顺序首尾拼接、不插分隔符；③ 别名 AS name 决定输出列名</text>
  <text x="360" y="312" text-anchor="middle" font-size="10.5" fill="#555">CONCAT vs CONCAT_WS：CONCAT(a,b) = "ab"（无分隔）；CONCAT_WS(' ',a,b) = "a b"（首参为分隔符）</text>
  <text x="360" y="330" text-anchor="middle" font-size="10" fill="#888">person_id 仅标识行，不进入拼接；输出行数 = 输入行数（逐行映射，无聚合无过滤）</text>

  <text x="360" y="364" text-anchor="middle" font-size="9.5" fill="#bbb">本题「concatenate」即 SQL 的 CONCAT 语义——拼接、不加分隔符；若题面要求分隔符请改用 CONCAT_WS</text>
</svg>
