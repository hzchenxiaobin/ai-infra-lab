<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟迭代 DFS ＋ 一趟逆序累加</text>

  <!-- ① 建邻接表 -->
  <rect x="90" y="38" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="57" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建 children 邻接表（i＝1…n−1）</text>
  <line x1="200" y1="68" x2="200" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 弹出事件 -->
  <rect x="90" y="92" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="111" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 弹出栈顶事件 (x, saved, phase)</text>
  <line x1="200" y1="122" x2="200" y2="138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：退出事件？ -->
  <polygon points="200,142 272,172 200,202 128,172" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">退出事件？</text>

  <!-- 是 → 还原 -->
  <line x1="272" y1="172" x2="358" y2="172" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="305" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="360" y="155" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="170" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">还原现场：</text>
  <text x="435" y="183" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">last[s[x]] ＝ saved</text>
  <path d="M 435 155 Q 435 122 315 107" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="126" font-size="8" fill="#4a7a3a" filter="url(#rough2)">继续弹栈</text>

  <!-- 否 ↓ -->
  <line x1="200" y1="202" x2="200" y2="218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="214" font-size="9" fill="#446688" filter="url(#rough2)">否（进入 x，c＝s[x]）</text>

  <!-- 菱形：last[c] ≠ −1？ -->
  <polygon points="200,222 280,252 200,282 120,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="256" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">last[c] ≠ −1 ？</text>

  <!-- 是 → np[x]=last[c] -->
  <line x1="120" y1="252" x2="70" y2="252" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="244" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="15" y="237" width="55" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="42" y="250" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">np[x]＝</text>
  <text x="42" y="261" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">last[c]</text>

  <!-- 否 → np[x]=parent[x] -->
  <line x1="280" y1="252" x2="330" y2="252" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="244" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="332" y="237" width="90" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="377" y="250" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">np[x]＝</text>
  <text x="377" y="261" text-anchor="middle" font-size="8.5" fill="#666" font-weight="bold" filter="url(#rough2)">parent[x]</text>

  <!-- 两分支汇合到 ③ -->
  <path d="M 42 267 Q 42 300 118 310" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 377 267 Q 377 300 285 310" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 进入处理 -->
  <rect x="90" y="298" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">③ preorder 追加 x；先压退出事件；</text>
  <text x="200" y="330" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">last[c] ＝ x；孩子逆序入栈</text>

  <!-- 循环回边 -->
  <path d="M 90 321 Q 58 321 58 107 L 88 107" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="215" font-size="8.5" fill="#446688" filter="url(#rough2)" transform="rotate(-90 26 215)">循环</text>

  <!-- ④ 栈空 → 逆序累加 -->
  <line x1="200" y1="344" x2="200" y2="364" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="360" font-size="9" fill="#446688" filter="url(#rough2)">栈空</text>
  <rect x="90" y="368" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="386" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">④ 逆序扫 preorder：</text>
  <text x="200" y="401" text-anchor="middle" font-size="9.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">sz[np[x]] ＋＝ sz[x]</text>

  <!-- 返回 -->
  <line x1="200" y1="410" x2="200" y2="428" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="432" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="200" y="450" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 sz</text>

  <!-- 右下注 -->
  <rect x="330" y="368" width="180" height="60" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="388" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">全程 O(n)：每节点进出栈各一次，</text>
  <text x="420" y="402" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">last 改写 / 还原各一次；</text>
  <text x="420" y="416" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">链状树也不怕——无递归</text>
</svg>
