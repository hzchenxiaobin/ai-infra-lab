<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：组的 len / med 只由子集决定 —— 合并树 ⇒ 子集 DP</text>

  <!-- 根：{0,1,2} -->
  <rect x="155" y="40" width="210" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">并成一组 {0,1,2}（mask=111）</text>
  <text x="260" y="79" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1,2,…,8]　len=8　med=4</text>

  <!-- 中间节点：{0,1} -->
  <rect x="55" y="160" width="200" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="181" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">{0,1}（mask=011）</text>
  <text x="155" y="199" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1,2,3,4,5]　len=5　med=3</text>

  <!-- 叶子：三个原始列表 -->
  <rect x="15" y="282" width="122" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="303" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">lists[0]（001）</text>
  <text x="76" y="321" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,3,5] len=3 med=3</text>

  <rect x="157" y="282" width="122" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="303" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">lists[1]（010）</text>
  <text x="218" y="321" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[2,4] len=2 med=2</text>

  <rect x="333" y="282" width="142" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="303" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">lists[2]（100）</text>
  <text x="404" y="321" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[6,7,8] len=3 med=7</text>

  <!-- 合并边 -->
  <path d="M 76 282 Q 82 244 112 213" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 282 Q 212 244 195 213" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 160 Q 162 120 200 93" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 282 Q 382 170 318 93" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 代价标注 -->
  <text x="160" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">6 = 3+2+|3−2|</text>
  <text x="105" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">12 = 5+3+|3−7|</text>
  <text x="460" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">总代价 6+12=18</text>

  <!-- 说明框 -->
  <rect x="396" y="130" width="114" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="453" y="152" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">多重并集与</text>
  <text x="453" y="168" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">合并顺序无关 ⇒</text>
  <text x="453" y="184" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">len(S)、med(S)</text>
  <text x="453" y="200" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">只由子集 S 决定</text>

  <!-- 底部公式框 -->
  <rect x="22" y="344" width="476" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">dp[mask] = min{ dp[s]+dp[t]+len[mask]+|med[s]−med[t]| }，s∪t=mask</text>
</svg>
