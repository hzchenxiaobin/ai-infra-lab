<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">斐波那契树 order(n)：左子树 order(n−2)，右子树 order(n−1)</text>

  <!-- order(0) empty -->
  <rect x="36" y="60" width="92" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="82" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">order(0)</text>
  <text x="82" y="100" text-anchor="middle" font-size="11" fill="#888">空树</text>

  <!-- order(1) single node -->
  <circle cx="180" cy="86" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="124" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">order(1)</text>

  <!-- order(2): root + right child only -->
  <circle cx="300" cy="66" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="11" fill="#333">2</text>
  <path d="M 300 80 L 300 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="300" cy="120" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="252" y="70" font-size="10.5" fill="#b85450">左:空</text>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">order(2)</text>

  <!-- order(3): root + left order(1) + right order(2) -->
  <circle cx="430" cy="56" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- left child order(1) -->
  <path d="M 430 70 L 404 96" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="398" cy="104" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="108" text-anchor="middle" font-size="10" fill="#333">1</text>
  <!-- right child order(2): node 2 + its right child 1 -->
  <path d="M 430 70 L 462 96" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="468" cy="104" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="108" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 468 115 L 468 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="468" cy="142" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="468" y="145" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="430" y="170" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">order(3)</text>

  <!-- divider -->
  <path d="M 30 188 L 530 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- order(4) bigger tree -->
  <text x="280" y="210" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">order(4) = 根 + 左 order(2) + 右 order(3)</text>

  <!-- root 4 -->
  <circle cx="280" cy="240" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- left subtree order(2): node 2 -> right child 1 -->
  <path d="M 280 255 L 196 282" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="190" cy="290" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="294" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 190 303 L 190 322" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="190" cy="330" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="333" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="150" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">order(2)</text>

  <!-- right subtree order(3): node 3 -> left 1, right 2 -> 1 -->
  <path d="M 280 255 L 364 282" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="370" cy="290" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="294" text-anchor="middle" font-size="10" fill="#333">3</text>
  <!-- node 3 left child 1 -->
  <path d="M 370 303 L 348 322" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="344" cy="330" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="333" text-anchor="middle" font-size="9" fill="#333">1</text>
  <!-- node 3 right child 2 -> 1 -->
  <path d="M 370 303 L 396 322" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="402" cy="330" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="402" y="333" text-anchor="middle" font-size="9" fill="#333">2</text>
  <path d="M 402 340 L 402 356" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="402" cy="362" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="402" y="365" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="430" y="312" font-size="10" fill="#d6a040" font-weight="bold">order(3)</text>

  <!-- size note -->
  <rect x="50" y="390" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11.5" fill="#333">节点数 size(n) = size(n−1) + size(n−2) + 1 = Fib(n+2) − 1</text>
  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#b85450">⚠ n=100 时节点数 ≈ Fib(102)，天文数字 → 不能真的建树，必须递推 SG 值</text>
</svg>
