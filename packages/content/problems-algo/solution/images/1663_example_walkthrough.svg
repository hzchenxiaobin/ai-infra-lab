<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：n = 5, k = 73 → "aaszz"</text>

  <!-- Column headers -->
  <text x="60" y="56" font-size="11" fill="#666" font-weight="bold">步</text>
  <text x="110" y="56" font-size="11" fill="#666" font-weight="bold">i</text>
  <text x="160" y="56" font-size="11" fill="#666" font-weight="bold">rest</text>
  <text x="230" y="56" font-size="11" fill="#666" font-weight="bold">k</text>
  <text x="320" y="56" font-size="11" fill="#666" font-weight="bold">26·(rest-1)</text>
  <text x="430" y="56" font-size="11" fill="#666" font-weight="bold">v</text>
  <text x="500" y="56" font-size="11" fill="#666" font-weight="bold">字符</text>

  <!-- divider -->
  <line x1="50" y1="64" x2="540" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step rows -->
  <!-- Step 1 -->
  <text x="60" y="92" font-size="12" fill="#333">①</text>
  <text x="110" y="92" font-size="12" fill="#333">0</text>
  <text x="160" y="92" font-size="12" fill="#333">5</text>
  <text x="230" y="92" font-size="12" fill="#333">73</text>
  <text x="320" y="92" font-size="12" fill="#333">104</text>
  <text x="430" y="92" font-size="12" fill="#b85450" font-weight="bold">max(1, -31)=1</text>
  <text x="500" y="92" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>

  <!-- Step 2 -->
  <text x="60" y="120" font-size="12" fill="#333">②</text>
  <text x="110" y="120" font-size="12" fill="#333">1</text>
  <text x="160" y="120" font-size="12" fill="#333">4</text>
  <text x="230" y="120" font-size="12" fill="#333">72</text>
  <text x="320" y="120" font-size="12" fill="#333">78</text>
  <text x="430" y="120" font-size="12" fill="#b85450" font-weight="bold">max(1, -6)=1</text>
  <text x="500" y="120" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>

  <!-- Step 3 -->
  <text x="60" y="148" font-size="12" fill="#333">③</text>
  <text x="110" y="148" font-size="12" fill="#333">2</text>
  <text x="160" y="148" font-size="12" fill="#333">3</text>
  <text x="230" y="148" font-size="12" fill="#333">71</text>
  <text x="320" y="148" font-size="12" fill="#333">52</text>
  <text x="430" y="148" font-size="12" fill="#b85450" font-weight="bold">max(1, 19)=19</text>
  <text x="500" y="148" font-size="13" fill="#d6a040" font-weight="bold">s</text>

  <!-- Step 4 -->
  <text x="60" y="176" font-size="12" fill="#333">④</text>
  <text x="110" y="176" font-size="12" fill="#333">3</text>
  <text x="160" y="176" font-size="12" fill="#333">2</text>
  <text x="230" y="176" font-size="12" fill="#333">52</text>
  <text x="320" y="176" font-size="12" fill="#333">26</text>
  <text x="430" y="176" font-size="12" fill="#b85450" font-weight="bold">max(1, 26)=26</text>
  <text x="500" y="176" font-size="13" fill="#446688" font-weight="bold">z</text>

  <!-- Step 5 -->
  <text x="60" y="204" font-size="12" fill="#333">⑤</text>
  <text x="110" y="204" font-size="12" fill="#333">4</text>
  <text x="160" y="204" font-size="12" fill="#333">1</text>
  <text x="230" y="204" font-size="12" fill="#333">26</text>
  <text x="320" y="204" font-size="12" fill="#333">0</text>
  <text x="430" y="204" font-size="12" fill="#b85450" font-weight="bold">max(1, 26)=26</text>
  <text x="500" y="204" font-size="13" fill="#446688" font-weight="bold">z</text>

  <!-- divider -->
  <line x1="50" y1="218" x2="540" y2="218" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Result string visualization -->
  <text x="60" y="252" font-size="12" fill="#666" font-weight="bold">结果串：</text>
  <rect x="130" y="234" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="234" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="210" y="234" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">s</text>
  <rect x="250" y="234" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">z</text>
  <rect x="290" y="234" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">z</text>
  <text x="345" y="256" font-size="13" fill="#b85450" font-weight="bold">数值=1+1+19+26+26=73 ✓</text>

  <!-- Insight box -->
  <rect x="40" y="290" width="500" height="156" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="314" font-size="12" fill="#b85450" font-weight="bold">观察要点</text>
  <text x="58" y="336" font-size="11" fill="#555">• 前两位 k 远大于后缀上限 26·(rest-1) 的差为负 → 取下界 1，即 'a'</text>
  <text x="58" y="356" font-size="11" fill="#555">• 第③位差 71-52=19 &gt; 0 → 必须取 19='s'，否则后缀两位扛不住剩余 71</text>
  <text x="58" y="376" font-size="11" fill="#555">• 一旦「差距拉开」由负转正，当前位就不再是 'a'，而是恰好补足后缀缺口的值</text>
  <text x="58" y="396" font-size="11" fill="#555">• 第④⑤位 rest 小、k 仍大 → 直接取 26='z' 把多余数值用光</text>
  <text x="58" y="420" font-size="11" fill="#b85450" font-weight="bold">形态规律：[尽量多 a] + [一个过渡字符] + [尽量多 z]</text>

</svg>
