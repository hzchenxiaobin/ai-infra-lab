<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,3,4], left=1, right=5</text>

  <!-- All subarray sums -->
  <text x="40" y="56" font-size="11" fill="#555" font-weight="bold">所有子数组和（升序）：</text>
  <rect x="50" y="66" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="85" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="88" y="66" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="85" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="126" y="66" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="85" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="164" y="66" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="85" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="202" y="66" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">4</text>
  <rect x="240" y="66" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="85" text-anchor="middle" font-size="11" fill="#a87020">5</text>
  <rect x="278" y="66" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="85" text-anchor="middle" font-size="11" fill="#a87020">6</text>
  <rect x="316" y="66" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="85" text-anchor="middle" font-size="11" fill="#a87020">7</text>
  <rect x="354" y="66" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="85" text-anchor="middle" font-size="11" fill="#a87020">9</text>
  <rect x="392" y="66" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="85" text-anchor="middle" font-size="11" fill="#a87020">10</text>

  <!-- index labels -->
  <text x="68" y="108" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="106" y="108" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="144" y="108" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="182" y="108" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="220" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="258" y="108" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="296" y="108" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="334" y="108" text-anchor="middle" font-size="9" fill="#aaa">8</text>
  <text x="372" y="108" text-anchor="middle" font-size="9" fill="#aaa">9</text>
  <text x="410" y="108" text-anchor="middle" font-size="9" fill="#aaa">10</text>

  <!-- bracket for [left, right] = [1, 5] -->
  <path d="M 50 116 L 44 124 L 44 132 L 240 132 L 240 124 L 246 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="145" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[left=1, right=5]</text>

  <!-- divider -->
  <path d="M 40 168 L 560 168" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- sumFirstK(5) computation -->
  <text x="40" y="194" font-size="11.5" fill="#555" font-weight="bold">计算 sumFirstK(5)：</text>

  <!-- binary search trace -->
  <rect x="50" y="206" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="227" text-anchor="middle" font-size="10.5" fill="#335">二分区间 [1, 10]，找最小 v 使 count(≤v) ≥ 5</text>

  <!-- trace rows -->
  <text x="60" y="262" font-size="10.5" fill="#555">v=5: count(≤5)=6 ≥5 ✓ → hi=5</text>
  <text x="60" y="280" font-size="10.5" fill="#555">v=3: count(≤3)=4 &lt;5 ✗ → lo=4</text>
  <text x="60" y="298" font-size="10.5" fill="#555">v=4: count(≤4)=5 ≥5 ✓ → hi=4</text>
  <text x="60" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ v=4（第 5 小的值）</text>

  <!-- formula -->
  <rect x="50" y="330" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">cnt=5, sm=13（sum(≤4)=1+2+3+3+4）</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">sumFirstK(5) = 13 − (5−5)×4 = 13</text>

  <!-- final -->
  <rect x="80" y="384" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">ans = sumFirstK(5) − sumFirstK(0) = 13 − 0 = 13</text>
  <text x="300" y="420" text-anchor="middle" font-size="10" fill="#888">sumFirstK(0) = 0（k=0 直接返回 0）</text>
</svg>
