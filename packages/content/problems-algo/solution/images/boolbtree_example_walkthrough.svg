<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [2,1,3,null,null,0,1]</text>

  <!-- tree skeleton -->
  <!-- root 2 (OR) -->
  <circle cx="270" cy="80" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="270" y="58" text-anchor="middle" font-size="9" fill="#d6a040">OR</text>

  <!-- edges -->
  <path d="M 254 98 L 196 138" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 286 98 L 344 138" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 344 172 L 296 218" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 376 172 L 424 218" stroke="#aaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- left leaf 1 -->
  <circle cx="180" cy="156" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- right internal 3 (AND) -->
  <circle cx="360" cy="156" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="360" y="134" text-anchor="middle" font-size="9" fill="#446688">AND</text>

  <!-- AND left leaf 0 -->
  <circle cx="280" cy="240" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- AND right leaf 1 -->
  <circle cx="440" cy="240" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- step chips alongside leaves -->
  <circle cx="120" cy="120" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">叶 1 → true</text>

  <circle cx="240" cy="286" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="240" y="312" text-anchor="middle" font-size="9" fill="#b85450">叶 0 → false</text>

  <circle cx="500" cy="286" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="500" y="312" text-anchor="middle" font-size="9" fill="#4a7a3a">叶 1 → true</text>

  <!-- step 4: AND -->
  <circle cx="360" cy="200" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <rect x="300" y="324" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="341" text-anchor="middle" font-size="10" fill="#333">false AND true = </text>
  <text x="456" y="341" font-size="10" fill="#b85450" font-weight="bold">false</text>

  <!-- step 5: OR (root) -->
  <circle cx="270" cy="118" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="170" y="356" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true OR false = true ✓</text>

  <!-- order note -->
  <text x="270" y="406" text-anchor="middle" font-size="10" fill="#888">顺序：先算叶子（1→2→3），再算 AND（4），最后算根 OR（5）</text>
</svg>
