<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：值域数组 + 逆序 DP</text>
  <path d="M 300 38 Q 440 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- box 1 -->
  <g filter="url(#sk)"><rect x="110" y="58" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">① 建值域表 has[2..MAXV]，nums 全部置 1</text>
  <path d="M 270 98 L 270 116" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ard)" filter="url(#sk)"/>

  <!-- box 2 -->
  <g filter="url(#sk)"><rect x="110" y="118" width="320" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="270" y="142" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">② ans = 0；v 从 MAXV 递减到 2</text>
  <path d="M 270 158 L 270 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ard)" filter="url(#sk)"/>

  <!-- box 3 -->
  <g filter="url(#sk)"><rect x="110" y="178" width="320" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">③ 若 has[v]：</text>
  <text x="270" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dp[v] = 1 + (has[v²] ? dp[v²] : 0)</text>
  <text x="270" y="232" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">（v² 更大，逆序时已先算好）</text>
  <path d="M 270 236 L 270 254" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ard)" filter="url(#sk)"/>

  <!-- box 4 -->
  <g filter="url(#sk)"><rect x="110" y="256" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">④ ans = max(ans, dp[v])；v−−，回到 ②</text>
  <path d="M 270 296 L 270 314" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ard)" filter="url(#sk)"/>

  <!-- box 5 -->
  <g filter="url(#sk)"><rect x="110" y="316" width="320" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="270" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">⑤ 返回 ans ≥ 2 ? ans : −1</text>

  <!-- loop arrow: box4 left back up to box2 left -->
  <path d="M 110 276 L 66 276 Q 50 276 50 260 L 50 158 Q 50 138 66 138 L 110 138" stroke="#7a5415" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ard)" filter="url(#sk)"/>
  <text x="40" y="210" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">v−−</text>

  <!-- right callout: why reverse order -->
  <g filter="url(#sk)">
    <rect x="470" y="118" width="360" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="490" y="144" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">为什么必须「逆序」？</text>
  <text x="490" y="168" font-size="11" fill="#444" filter="url(#sk)">• 平方使后继 v² &gt; v（v ≥ 2 恒成立）</text>
  <text x="490" y="190" font-size="11" fill="#444" filter="url(#sk)">• → 大值是小值的后继</text>
  <text x="490" y="212" font-size="11" fill="#444" filter="url(#sk)">• → 从大到小遍历 = 反向拓扑序</text>
  <text x="490" y="234" font-size="11" fill="#444" filter="url(#sk)">• 处理 v 时 dp[v²] 已就绪，无依赖环</text>
  <text x="490" y="258" font-size="11" fill="#7a5415" filter="url(#sk)">• 故无需递归 / 记忆化 map，数组即可</text>
  <text x="490" y="282" font-size="10" fill="#888" filter="url(#sk)">链长上界：2→4→16→256→65536→溢出，≤ 5</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="110" y="378" width="720" height="68" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="130" y="402" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">复杂度</text>
  <text x="130" y="422" font-size="11" fill="#444" filter="url(#sk)">时间 O(MAXV + n) = O(n)（MAXV = 1e5 与 n 同阶）；空间 O(MAXV) 值域数组。</text>
  <text x="130" y="440" font-size="11" fill="#7a5415" filter="url(#sk)">每个值只处理一次 → 逆序一趟即得所有 dp，ans 取全局最大。</text>
</svg>
