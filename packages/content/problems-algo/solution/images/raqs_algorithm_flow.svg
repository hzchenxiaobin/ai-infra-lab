<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">替换所有的问号 算法流程（贪心不回溯）</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始: s 转字符数组, i = 0</text>

  <path d="M 270 78 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="270,100 360,138 270,176 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <!-- No -> return -->
  <path d="M 360 138 L 420 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="470" cy="138" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="142" text-anchor="middle" font-size="12" fill="#333">返回 s</text>
  <!-- Yes down -->
  <path d="M 270 176 L 270 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="192" font-size="11" fill="#82b366">是</text>

  <!-- D2: s[i] == '?' ? -->
  <polygon points="270,200 370,238 270,276 170,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="12" fill="#333">s[i] == '?' ?</text>
  <!-- No -> i+=1 box -->
  <path d="M 170 238 L 112 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="141" y="230" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="40" y="218" width="72" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="76" y="242" text-anchor="middle" font-size="11" fill="#333">i += 1</text>
  <!-- dashed loop back up to D1 -->
  <path d="M 76 218 L 76 138 L 180 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="178" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 76 178)">继续遍历</text>
  <!-- Yes down -->
  <path d="M 270 276 L 270 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="292" font-size="11" fill="#82b366">是</text>

  <!-- R: inner loop -->
  <rect x="150" y="300" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 c ∈ 'a'..'z'</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#555">若 (i==0 或 s[i-1]≠c)</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#555">且 (i==n-1 或 s[i+1]≠c)：</text>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">则 s[i] = c, 跳出内层</text>

  <!-- loop back from R bottom -> i+=1 box (right side route) -->
  <path d="M 270 392 L 270 410 L 76 410 L 76 258" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="424" text-anchor="middle" font-size="10" fill="#888">填好后 i += 1, 继续</text>

  <!-- Summary note -->
  <text x="270" y="448" text-anchor="middle" font-size="11" fill="#888">关键：每个 '?' 选首个与左右邻居都不同的字母即可，无需回溯</text>
</svg>
