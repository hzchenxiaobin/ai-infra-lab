<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：胜利门槛因人而异——玩家 i 需要「某色 ≥ i+1」</text>

  <!-- 左：门槛阶梯 -->
  <rect x="20" y="44" width="225" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="132" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">门槛阶梯（编号越大越难）</text>

  <rect x="38" y="168" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="181" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">P0</text>
  <text x="62" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">需 1</text>

  <rect x="90" y="136" width="48" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="150" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">P1</text>
  <text x="114" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">需 2</text>

  <rect x="142" y="104" width="48" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="118" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">P2</text>
  <text x="166" y="131" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">需 3</text>

  <rect x="194" y="72" width="48" height="126" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="86" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">P3</text>
  <text x="218" y="99" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">需 4</text>

  <path d="M 70 158 C 112 132, 168 100, 212 68" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">门槛 ↑</text>

  <text x="132" y="216" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">P0 任意球即胜；P3 需 4 个同色球</text>

  <!-- 右：计数网格 -->
  <rect x="265" y="44" width="235" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">计数网格 cnt[玩家][颜色]（示例 1）</text>

  <rect x="280" y="78" width="215" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">玩家</text>
  <text x="362" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色 0</text>
  <text x="417" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色 1</text>
  <text x="470" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 max</text>

  <rect x="280" y="100" width="215" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="362" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="417" y="117" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="470" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>

  <rect x="280" y="126" width="215" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="362" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="417" y="143" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="470" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <rect x="280" y="152" width="215" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="362" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="417" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ✗</text>

  <rect x="280" y="178" width="215" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="362" y="195" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="417" y="195" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="470" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ✗</text>

  <text x="382" y="217" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">✓ = 行最大 &gt; 行号 i；玩家 2 卡在 2 = 2</text>

  <!-- 汇合箭头 -->
  <path d="M 132 226 C 132 240, 190 246, 230 252" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 382 226 C 382 240, 330 246, 290 252" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 结论条 1 -->
  <rect x="40" y="254" width="440" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">一趟计数：每条 [x, y] 投进 cnt[x][y]，键域仅 10×11 → 定长数组当哈希</text>

  <path d="M 260 294 L 260 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 结论条 2 -->
  <rect x="40" y="306" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">判定：玩家 i 胜 ⟺ 行最大 max(cnt[i][·]) &gt; i（严格大于，恰好等于不算）</text>
</svg>
