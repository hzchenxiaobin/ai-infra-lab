<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双重枚举行边界 + 内层 560</text>

  <!-- 1. 开始 -->
  <rect x="150" y="44" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- 2. for top -->
  <rect x="120" y="92" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for top = 0 .. m−1   （外层：上边界）</text>

  <!-- 3. reset col_sum -->
  <rect x="120" y="140" width="300" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="12" fill="#444">col_sum = [0] × n   （每个 top 重置）</text>

  <!-- 4. for bottom -->
  <rect x="120" y="188" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for bottom = top .. m−1   （内层：下边界）</text>

  <!-- 5. 增量列累加 -->
  <rect x="120" y="236" width="300" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#444">col_sum[c] += matrix[bottom][c]</text>
  <text x="270" y="276" text-anchor="middle" font-size="10" fill="#888">增量累加，复用上一 bottom 的结果</text>

  <!-- 6. 560 框（高亮） -->
  <rect x="100" y="294" width="340" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <rect x="100" y="294" width="340" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="313" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">在 col_sum 上跑 560（前缀和 + 哈希）</text>
  <text x="116" y="338" font-size="11" fill="#444">count = {0 : 1},  s = 0</text>
  <text x="116" y="358" font-size="11" fill="#444">for x in col_sum:</text>
  <text x="132" y="376" font-size="11" fill="#444">s += x;  ans += count[s − target];  count[s] ++</text>
  <text x="116" y="394" font-size="10" fill="#888">先查 s−target，再写 s（与 560 完全一致）</text>

  <!-- 7. 返回 ans -->
  <rect x="150" y="418" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">top 遍历完 → 返回 ans</text>

  <!-- 主流向箭头（向下） -->
  <path d="M270 74 V92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270 126 V140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270 174 V188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270 222 V236" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270 274 V294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回环 A：560 框右侧 → 上 → for bottom 右侧（下一 bottom） -->
  <path d="M440 348 H470 V205 H420" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="476" y="280" font-size="10.5" fill="#d6a040" font-weight="bold">↻ 下一 bottom</text>

  <!-- 回环 B：for bottom 左侧 → 上 → for top 左侧（bottom 完 → 下一 top） -->
  <path d="M120 205 H80 V109 H120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="42" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold">bottom</text>
  <text x="42" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold">遍历完</text>
</svg>
