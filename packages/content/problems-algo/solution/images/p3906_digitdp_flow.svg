<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="548" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：数位 DP 计算 f(N)，答案 = f(r) − f(l−1)</text>

  <!-- ① 预处理 -->
  <g filter="url(#rough2)">
    <rect x="150" y="38" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="59" text-anchor="middle" font-size="10.5" fill="#33506b">① isPath[]：起点 0，D→+4，R→+1</text>
  </g>
  <path d="M 280,72 L 280,84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② f(N) 入口 -->
  <g filter="url(#rough2)">
    <rect x="150" y="88" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="109" text-anchor="middle" font-size="10.5" fill="#33506b">② f(N)：s ← N 补零 16 位，dfs(0, 1, 0, 0)</text>
  </g>
  <path d="M 280,122 L 280,136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 C：pos == 16 ? -->
  <g filter="url(#rough2)">
    <polygon points="280,142 356,174 280,206 204,174" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="178" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">pos == 16 ?</text>
  </g>
  <path d="M 356,174 L 394,174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="166" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="400" y="154" width="140" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="470" y="171" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">返回 1</text>
    <text x="470" y="186" text-anchor="middle" font-size="8.5" fill="#2f5d24">（活分支 cnt 必为 7）</text>
  </g>
  <path d="M 280,206 L 280,228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="221" font-size="9.5" fill="#333" filter="url(#rough2)">否</text>

  <!-- 菱形 D：pos 是路径下标？ -->
  <g filter="url(#rough2)">
    <polygon points="280,234 372,270 280,306 188,270" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">pos 是</text>
    <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">路径下标？</text>
  </g>
  <g filter="url(#rough2)">
    <text x="480" y="256" text-anchor="middle" font-size="9" fill="#666">hi = tight ?</text>
    <text x="480" y="270" text-anchor="middle" font-size="9" fill="#666">s[pos] : 9</text>
  </g>

  <!-- 是 → 左框 E -->
  <path d="M 188,270 L 150,270 L 150,342" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="262" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">是</text>

  <!-- 否 → 右框 F -->
  <path d="M 372,270 L 410,270 L 410,342" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="391" y="262" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">否</text>

  <text x="280" y="324" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">tight' = tight ∧ (d = hi)</text>

  <!-- E：路径位 -->
  <g filter="url(#rough2)">
    <rect x="36" y="350" width="232" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="152" y="370" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">路径位（是）</text>
    <text x="152" y="387" text-anchor="middle" font-size="9.5" fill="#8a6d1a">枚举 d ∈ [prev..hi]，d &lt; prev 剪掉</text>
    <text x="152" y="402" text-anchor="middle" font-size="9" fill="#8a6d1a">首个路径位无下界（cnt = 0 不比 prev）</text>
    <text x="152" y="421" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">→ dfs(pos+1, tight', cnt+1, d)</text>
  </g>

  <!-- F：自由位 -->
  <g filter="url(#rough2)">
    <rect x="292" y="350" width="232" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="408" y="370" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">自由位（否）</text>
    <text x="408" y="387" text-anchor="middle" font-size="9.5" fill="#2f5d24">枚举 d ∈ [0..hi]，无任何约束</text>
    <text x="408" y="402" text-anchor="middle" font-size="9" fill="#2f5d24">cnt、prev 原样传递</text>
    <text x="408" y="421" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">→ dfs(pos+1, tight', cnt, prev)</text>
  </g>

  <!-- 递归回环（虚线） -->
  <path d="M 48,350 C 30,270 80,180 194,174" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="58" y="298" font-size="8.5" fill="#b85450" filter="url(#rough2)">递归 pos+1</text>

  <!-- E/F → G -->
  <path d="M 150,436 L 150,450" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410,436 L 410,450" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G：记忆化 -->
  <g filter="url(#rough2)">
    <rect x="110" y="454" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="472" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">③ 记忆化 memo[pos][cnt][prev]：只存 tight=0 状态</text>
    <text x="280" y="489" text-anchor="middle" font-size="9" fill="#33506b">（tight=1 沿 N 前缀至多一条链，现算即可；16×8×10 = 1280 格）</text>
  </g>
  <path d="M 280,498 L 280,508" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- H：答案 -->
  <g filter="url(#rough2)">
    <rect x="165" y="512" width="230" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="531" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">④ ans = f(r) − f(l−1)</text>
  </g>
</svg>
