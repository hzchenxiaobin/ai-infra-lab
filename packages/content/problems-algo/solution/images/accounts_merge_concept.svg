<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：以「邮箱」为节点建并查集</text>

  <!-- left: accounts input -->
  <text x="20" y="58" font-size="11" fill="#888">输入账户（容器）：</text>

  <rect x="20" y="66" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="30" y="81" font-size="10.5" fill="#446688" font-weight="bold">John #1</text>
  <text x="30" y="95" font-size="9.5" fill="#555">johnsmith, john_newyork</text>

  <rect x="20" y="106" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="30" y="121" font-size="10.5" fill="#446688" font-weight="bold">John #2</text>
  <text x="30" y="135" font-size="9.5" fill="#555">johnsmith, john00</text>

  <rect x="20" y="146" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="30" y="161" font-size="10.5" fill="#4a7a3a" font-weight="bold">Mary</text>
  <text x="30" y="175" font-size="9.5" fill="#555">mary</text>

  <rect x="20" y="186" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="30" y="201" font-size="10.5" fill="#d6a040" font-weight="bold">John #3</text>
  <text x="30" y="215" font-size="9.5" fill="#555">johnnybravo</text>

  <!-- arrow: accounts -> email nodes -->
  <text x="250" y="118" font-size="10" fill="#888">拆出邮箱</text>
  <path d="M 222 114 Q 252 114 282 114" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 154 Q 252 200 282 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 194 Q 252 250 282 306" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right: email nodes -->
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">邮箱节点（并查集）：</text>

  <!-- john_newyork -->
  <ellipse cx="380" cy="92" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="96" text-anchor="middle" font-size="10" fill="#333">john_newyork</text>

  <!-- johnsmith (bridge) -->
  <ellipse cx="470" cy="140" rx="46" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="470" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">johnsmith</text>

  <!-- john00 -->
  <ellipse cx="380" cy="188" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="192" text-anchor="middle" font-size="10" fill="#333">john00</text>

  <!-- mary -->
  <ellipse cx="380" cy="244" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="248" text-anchor="middle" font-size="10" fill="#333">mary</text>

  <!-- johnnybravo -->
  <ellipse cx="380" cy="306" rx="50" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="310" text-anchor="middle" font-size="10" fill="#333">johnnybravo</text>

  <!-- union edges within account (dashed) -->
  <line x1="380" y1="110" x2="450" y2="128" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="448" y1="156" x2="380" y2="174" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- highlight bridge: johnsmith shared by acc1 & acc2 -->
  <path d="M 470 122 Q 470 100 440 100" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="500" y="118" font-size="9.5" fill="#b85450" font-weight="bold">公共邮箱</text>
  <text x="500" y="131" font-size="9.5" fill="#b85450">→ 必合并</text>

  <!-- key idea box -->
  <rect x="40" y="316" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">同名 ≠ 同人；只有「邮箱连通」才合并</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555">同账户内邮箱两两 union；按根分组即得「同一个人」</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450">johnnybravo 同名 John 却独立 → 单独成组</text>
</svg>
