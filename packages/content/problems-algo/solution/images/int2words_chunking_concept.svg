<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">整数转换英文表示：三位分块 + 量级后缀</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">输入 num = 1,234,567 → 从低到高每 3 位切一块</text>

  <!-- Three chunk boxes (high → low: 1 | 234 | 567) -->
  <rect x="95" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="155" y="78" font-size="14" fill="#888">,</text>
  <rect x="255" y="58" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">234</text>
  <text x="335" y="78" font-size="14" fill="#888">,</text>
  <rect x="425" y="58" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">567</text>

  <!-- Scale labels -->
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Million</text>
  <text x="290" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Thousand</text>
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">（无后缀）</text>

  <!-- arrows down -->
  <path d="M 120 114 L 120 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 114 L 290 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 114 L 460 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- helper call boxes -->
  <rect x="70" y="136" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="10" fill="#555">helper(1)</text>
  <rect x="240" y="136" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="10" fill="#555">helper(234)</text>
  <rect x="410" y="136" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="154" text-anchor="middle" font-size="10" fill="#555">helper(567)</text>

  <!-- helper outputs -->
  <rect x="70" y="172" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">One</text>
  <rect x="215" y="172" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Two Hundred Thirty Four</text>
  <rect x="385" y="172" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Five Hundred Sixty Seven</text>

  <!-- + scale annotations -->
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+ "Million"</text>
  <text x="290" y="218" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+ "Thousand"</text>
  <text x="460" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">（不加）</text>

  <!-- converge arrows -->
  <path d="M 120 226 L 120 244 L 460 244 L 460 226" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 244 L 290 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final result -->
  <rect x="30" y="262" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">One Million Two Hundred Thirty Four Thousand</text>
  <text x="290" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Five Hundred Sixty Seven</text>

  <!-- skip-zero note -->
  <rect x="30" y="324" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">跳过零块规则</text>
  <text x="150" y="360" text-anchor="middle" font-size="9" fill="#666">1,000,000 → 无 "Thousand" 段</text>
  <text x="150" y="374" text-anchor="middle" font-size="9" fill="#666">chunk == 0 时不拼量级</text>

  <!-- helper reuse note -->
  <rect x="290" y="324" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="344" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">每块 ≤ 999 复用同一 helper</text>
  <text x="420" y="360" text-anchor="middle" font-size="9" fill="#666"> Hundred / Tens / &lt;20 三表查表</text>
  <text x="420" y="374" text-anchor="middle" font-size="9" fill="#666">2³¹−1 最多 4 块（Billion）</text>
</svg>
