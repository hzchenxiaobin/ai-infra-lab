<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字符串相加：双指针从右向左逐位相加流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="132" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">开始: i=m−1, j=n−1, carry=0, ans=""</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i>=0 || j>=0 || carry>0 -->
  <polygon points="280,94 432,150 280,206 128,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">i ≥ 0 || j ≥ 0</text>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#333">|| carry &gt; 0 ?</text>

  <!-- No -> reverse and return -->
  <path d="M 432 150 L 488 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="436" y="174" width="112" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="194" text-anchor="middle" font-size="11" fill="#333">reverse(ans)</text>
  <text x="492" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
  <path d="M 492 150 L 492 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> down -->
  <path d="M 280 206 L 280 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="222" font-size="11" fill="#82b366">是</text>

  <!-- Process box: fetch digits -->
  <rect x="132" y="230" width="296" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#333">d1 = (i ≥ 0) ? num1[i--] − '0' : 0</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333">d2 = (j ≥ 0) ? num2[j--] − '0' : 0</text>

  <path d="M 280 288 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process box: sum and carry -->
  <rect x="132" y="304" width="296" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333">sum = d1 + d2 + carry</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans.push_back(sum % 10)</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">carry = sum / 10</text>

  <path d="M 280 382 L 280 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back to diamond (dashed) -->
  <path d="M 280 410 L 80 410 L 80 150 L 128 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="280" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 280)">下一轮（更高位）</text>

  <!-- bottom notes -->
  <rect x="40" y="436" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">循环条件含 carry &gt; 0：两串扫完但残留进位时补写最高位</text>
  <text x="280" y="474" text-anchor="middle" font-size="10" fill="#666">（如 99 + 1 = 100，扫完后 carry=1 需再写一位 '1'）</text>
</svg>
