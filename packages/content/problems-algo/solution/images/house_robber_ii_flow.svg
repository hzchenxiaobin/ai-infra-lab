<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：环形 → 拆两段 → 线性 DP → 取 max</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">复用 198 的 rob 函数，无新增 DP 逻辑</text>

  <g font-size="10" fill="#333">
    <!-- Step 1 -->
    <rect x="40" y="64" width="440" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① 特判</text>
    <text x="140" y="104" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">if n == 1: return nums[0]</text>
    <text x="140" y="120" text-anchor="middle" font-size="9" fill="#888">「单间必偷，无环可拆」</text>
    <rect x="300" y="74" width="170" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="92" text-anchor="middle" font-size="9" fill="#d6a040">为什么特判？</text>
    <text x="385" y="108" text-anchor="middle" font-size="8" fill="#d6a040">n=1 时两段都为空</text>

    <path d="M 260 132 L 260 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2 -->
    <rect x="40" y="150" width="440" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 拆环为线</text>
    <text x="140" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">A = rob(nums[0..n-2])</text>
    <text x="140" y="206" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">B = rob(nums[1..n-1])</text>
    <text x="140" y="222" text-anchor="middle" font-size="9" fill="#888">「剪开首尾冲突边，分两种情况」</text>
    <rect x="300" y="160" width="170" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">rob = 198 的模板</text>
    <text x="385" y="194" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7a3a">f(i)=max(f(i-1),</text>
    <text x="385" y="208" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7a3a">  f(i-2)+nums[i])</text>

    <path d="M 260 232 L 260 246" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3 -->
    <rect x="40" y="250" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 合并取 max</text>
    <text x="140" y="290" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">return max(A, B)</text>
    <text x="140" y="306" text-anchor="middle" font-size="9" fill="#888">「两种情况覆盖所有合法方案」</text>
    <rect x="300" y="260" width="170" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="278" text-anchor="middle" font-size="9" fill="#446688">完备性：</text>
    <text x="385" y="294" text-anchor="middle" font-size="8" fill="#446688">首尾至少一个不偷</text>

    <path d="M 260 318 L 260 332" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Result -->
    <rect x="40" y="336" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="260" y="358" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">时间 O(n) · 空间 O(1)（滚动数组）</text>
    <text x="260" y="374" text-anchor="middle" font-size="9" fill="#888">两次线性扫描，各用两个变量滚动</text>
  </g>
</svg>
