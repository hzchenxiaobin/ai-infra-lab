<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后最小绝对差必在相邻元素之间</text>

  <!-- 原始数组 -->
  <text x="40" y="58" font-size="12" fill="#888">原始数组 arr：</text>
  <rect x="40" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="84" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 排序箭头 -->
  <path d="M 116 104 L 116 128" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="126" y="120" font-size="10" fill="#d6a040" font-weight="bold">sort</text>

  <!-- 排序后数组 -->
  <text x="40" y="146" font-size="12" fill="#888">排序后：</text>
  <rect x="40" y="156" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="156" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="156" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="172" y="156" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 相邻差标注 -->
  <text x="40" y="206" font-size="12" fill="#888">相邻差：</text>
  <path d="M 80 186 L 80 214" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 124 186 L 124 214" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 168 186 L 168 214" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>

  <rect x="57" y="214" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="231" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2−1=1</text>

  <rect x="101" y="214" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="231" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3−2=1</text>

  <rect x="145" y="214" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="231" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4−3=1</text>

  <!-- min 框 -->
  <text x="40" y="262" font-size="12" fill="#888">最小值：</text>
  <rect x="90" y="250" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 1</text>

  <!-- 证明说明框 -->
  <rect x="250" y="56" width="300" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="262" y="80" font-size="11" fill="#333" font-weight="bold">为什么只需看相邻元素？</text>
  <text x="262" y="100" font-size="10" fill="#555">升序序列中，对任意 i &lt; j：</text>
  <text x="262" y="118" font-size="10" fill="#555">a[j] − a[i] = (a[j]−a[j−1]) + … + (a[i+1]−a[i])</text>
  <text x="262" y="136" font-size="10" fill="#555">即：跨元素的差 = 多个相邻差之和</text>
  <text x="262" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">⇒ 跨元素差 ≥ 其中某个相邻差</text>
  <text x="262" y="170" font-size="10" fill="#4a7a3a" font-weight="bold">⇒ 全局最小差必出现在相邻对中</text>

  <!-- 结果说明框 -->
  <rect x="250" y="190" width="300" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="262" y="214" font-size="11" fill="#333" font-weight="bold">收集所有差值 = min 的相邻对</text>
  <text x="262" y="234" font-size="10" fill="#555">本题要求返回全部最小差对，</text>
  <text x="262" y="250" font-size="10" fill="#555">因此两遍扫描：先求 min，再收集。</text>
  <text x="262" y="266" font-size="10" fill="#b85450" font-weight="bold">排序天然保证结果升序、a &lt; b。</text>

  <!-- 底部总结 -->
  <rect x="40" y="300" width="510" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="12" fill="#333" font-weight="bold">核心：排序 + 相邻扫描</text>
  <text x="60" y="344" font-size="11" fill="#555">排序后最小绝对差 = min{a[i]−a[i−1]}，无需检查非相邻对</text>
  <text x="60" y="362" font-size="11" fill="#b85450" font-weight="bold">两遍线性扫描即可：①求最小差 ②收集所有等于最小差的相邻对</text>
</svg>
