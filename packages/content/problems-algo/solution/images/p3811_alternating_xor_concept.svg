<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：块异或 = 前缀异或之差，交替约束 = 双状态跳转</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">在 i 处结束一块 XOR = target ⟺ 存在分割点 j 使 pref[j] = pref[i] ^ target —— 查一次表拿到全部转移来源</text>

  <!-- nums row -->
  <text x="56" y="84" font-size="10.5" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="100" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- highlight block [1,0] -->
  <rect x="96" y="62" width="98" height="36" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="58" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">块 [1,0]</text>

  <!-- pref row -->
  <text x="54" y="128" font-size="10.5" fill="#666" filter="url(#rough2)">pref</text>
  <rect x="82" y="112" width="36" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="112" width="36" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="112" width="36" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="112" width="36" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="100" y="150" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="150" y="150" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="200" y="150" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="250" y="150" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">3</text>

  <!-- highlight pref[0], pref[2] -->
  <ellipse cx="100" cy="125" rx="26" ry="19" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="200" cy="125" rx="26" ry="19" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="305" y="58" width="200" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="76" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">块 (j, i] 的异或</text>
  <text x="405" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= pref[i] ^ pref[j]</text>
  <text x="405" y="108" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">想要它 = target ⟺</text>
  <text x="405" y="122" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">pref[j] = pref[i] ^ target</text>
  <text x="405" y="139" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">例：[1,0] → 1 ^ 0 = 1 = t1 ✓</text>

  <!-- section label -->
  <text x="260" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">双状态 DP：m_A[v] = Σ f_A[j]（pref[j] = v），转移来源按前缀值聚合</text>

  <!-- state A -->
  <rect x="70" y="196" width="150" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="217" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold" filter="url(#rough2)">状态A：下一块 = t1</text>
  <text x="145" y="235" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">上块 = t2 或尚未切块（起点在此）</text>

  <!-- state B -->
  <rect x="300" y="196" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="217" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold" filter="url(#rough2)">状态B：下一块 = t2</text>
  <text x="375" y="235" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">上一块 = t1</text>

  <!-- arcs -->
  <path d="M 170 192 Q 260 164 350 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">结束 XOR = t1 的块：f_B(i) = m_A[p ^ t1]</text>

  <path d="M 350 252 Q 260 282 170 252" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结束 XOR = t2 的块：f_A(i) = m_B[p ^ t2]</text>

  <!-- answer -->
  <rect x="85" y="312" width="350" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = f_A[n] + f_B[n]（末块为 t1 或 t2 块均合法）</text>
  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">示例2：[1 | 0,0]、[1,0 | 0]、[1,0,0] —— 3 种分割全部被数到 ✓</text>
</svg>
