<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcbdd"（n=6，枚举两刀 (i, j)）</text>

  <!-- String reference -->
  <text x="40" y="56" font-size="11" fill="#888">s:</text>
  <rect x="70" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="60" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="110" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="60" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="150" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="60" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="190" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="60" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="230" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="60" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="270" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="60" text-anchor="middle" font-size="12" fill="#333">d</text>
  <text x="88" y="80" font-size="9" fill="#aaa">0</text>
  <text x="128" y="80" font-size="9" fill="#aaa">1</text>
  <text x="168" y="80" font-size="9" fill="#aaa">2</text>
  <text x="208" y="80" font-size="9" fill="#aaa">3</text>
  <text x="248" y="80" font-size="9" fill="#aaa">4</text>
  <text x="288" y="80" font-size="9" fill="#aaa">5</text>

  <!-- Enumerate table header -->
  <text x="40" y="110" font-size="11" fill="#555" font-weight="bold">枚举 i（第一刀），j（第二刀）：i ∈ [0, n−3]=[0,3]，j ∈ [i+1, n−2]=[i+1, 4]</text>

  <!-- Table: columns i, j, seg1, seg2, seg3, result -->
  <!-- header row -->
  <rect x="40" y="120" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="136" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <rect x="92" y="120" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="136" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">j</text>
  <rect x="144" y="120" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s[0..i]</text>
  <rect x="256" y="120" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="311" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s[i+1..j]</text>
  <rect x="368" y="120" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s[j+1..5]</text>
  <rect x="470" y="120" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="136" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">结果</text>

  <!-- Row i=0, j=1: "a" | "b" | "cbdd" -->
  <text x="65" y="160" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="117" y="160" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="144" y="148" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="163" text-anchor="middle" font-size="9" fill="#333">"a" ✓</text>
  <rect x="256" y="148" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="311" y="163" text-anchor="middle" font-size="9" fill="#333">"b" ✓</text>
  <rect x="368" y="148" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="163" text-anchor="middle" font-size="9" fill="#333">"cbdd" ✗</text>
  <rect x="470" y="148" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="163" text-anchor="middle" font-size="9" fill="#b85450">false</text>

  <!-- Row i=0, j=2: "a" | "bc" | "bdd" -->
  <text x="65" y="186" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="117" y="186" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="144" y="174" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="189" text-anchor="middle" font-size="9" fill="#333">"a" ✓</text>
  <rect x="256" y="174" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="311" y="189" text-anchor="middle" font-size="9" fill="#333">"bc" ✗</text>
  <rect x="368" y="174" width="100" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="189" text-anchor="middle" font-size="9" fill="#aaa">跳过</text>
  <rect x="470" y="174" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="189" text-anchor="middle" font-size="9" fill="#b85450">false</text>

  <!-- Row i=0, j=3: "a" | "bcb" | "dd"  ← HIT -->
  <text x="65" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="117" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="144" y="200" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="199" y="215" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">"a" ✓</text>
  <rect x="256" y="200" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="311" y="215" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">"bcb" ✓</text>
  <rect x="368" y="200" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="215" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">"dd" ✓</text>
  <rect x="470" y="200" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">true ⭐</text>

  <!-- Row i=0, j=4: "a" | "bcbd" | "d" -->
  <text x="65" y="238" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="117" y="238" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="144" y="226" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="241" text-anchor="middle" font-size="9" fill="#333">"a" ✓</text>
  <rect x="256" y="226" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="311" y="241" text-anchor="middle" font-size="9" fill="#333">"bcbd" ✗</text>
  <rect x="368" y="226" width="100" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="241" text-anchor="middle" font-size="9" fill="#aaa">跳过</text>
  <rect x="470" y="226" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="241" text-anchor="middle" font-size="9" fill="#b85450">false</text>

  <!-- separator for i=1 -->
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888">i=0 已命中 → 直接返回 true（后续 i=1,2,3 无需枚举）</text>

  <!-- Note: would continue i=1,2,3 but early return -->
  <rect x="60" y="278" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">短路返回：一旦某组 (i, j) 三段皆回文立即 return true</text>
  <text x="290" y="312" text-anchor="middle" font-size="10" fill="#888">最坏情况（无解）需枚举全部 O(n²) 组 (i, j)</text>

  <!-- Negative example -->
  <text x="40" y="346" font-size="11" fill="#555" font-weight="bold">反例：s = "bcbddxy"（n=7，无解 → false）</text>
  <rect x="40" y="354" width="490" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="372" text-anchor="middle" font-size="10" fill="#444">枚举所有 (i, j)：第一段 s[0..i] 需回文，候选 i=0("b")/i=2("bcb")</text>
  <text x="285" y="388" text-anchor="middle" font-size="10" fill="#444">但剩余子串无法同时切成两段回文 → 全部 false → 返回 false</text>

  <!-- Result -->
  <rect x="150" y="406" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案：abcbdd → true；bcbddxy → false</text>
</svg>
