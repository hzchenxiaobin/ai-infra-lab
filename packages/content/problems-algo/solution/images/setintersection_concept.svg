<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">贪心核心：在区间右端放 e−1 和 e，覆盖后续尽可能多的区间</text>

  <!-- number line: origin x=70, unit=50, values 0..6 -->
  <!-- Interval [1,3] -->
  <rect x="120" y="56" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="73" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">[1,3]</text>
  <text x="226" y="73" font-size="10.5" fill="#446688">→ 放 2, 3</text>

  <!-- Interval [2,5] -->
  <rect x="170" y="92" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="109" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">[2,5]</text>
  <text x="326" y="109" font-size="10.5" fill="#446688">3 已在 → 补 5</text>

  <!-- Interval [3,5] -->
  <rect x="220" y="128" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="145" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">[3,5]</text>
  <text x="326" y="145" font-size="10.5" fill="#4a7a3a">3,5 均在 → 不补</text>

  <!-- number line -->
  <line x1="70" y1="172" x2="378" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 378 172 L 370 168 L 370 176 Z" fill="#888" filter="url(#rough2)"/>
  <text x="386" y="176" font-size="10.5" fill="#888">x</text>

  <!-- ticks -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="70" y1="168" x2="70" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="192">0</text>
    <line x1="120" y1="168" x2="120" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="192">1</text>
    <line x1="170" y1="168" x2="170" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="170" y="192">2</text>
    <line x1="220" y1="168" x2="220" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="220" y="192">3</text>
    <line x1="270" y1="168" x2="270" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="270" y="192">4</text>
    <line x1="320" y1="168" x2="320" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="320" y="192">5</text>
    <line x1="370" y1="168" x2="370" y2="178" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="370" y="192">6</text>
  </g>

  <!-- placed points on number line -->
  <circle cx="170" cy="172" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">2</text>
  <circle cx="220" cy="172" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="320" cy="172" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>

  <!-- explanation: rightmost is optimal -->
  <rect x="32" y="208" width="456" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="228" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 选 e−1 和 e（区间最右两个整数）</text>
  <text x="48" y="246" font-size="11" fill="#4a7a3a">后续区间 end ≥ 当前 e（按右端排序），右端点越靠右越可能落入后续区间</text>
  <text x="48" y="260" font-size="11" fill="#4a7a3a">例：[1,3] 放 {2,3}，3 同时落在 [2,5] 和 [3,5] 内 → 一点多用</text>

  <!-- explanation: leftmost is suboptimal -->
  <rect x="32" y="274" width="456" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="294" font-size="12" fill="#b85450" font-weight="bold">✗ 若选 s 和 s+1（最左两个）</text>
  <text x="48" y="311" font-size="11" fill="#b85450">[1,3] 放 {1,2}，但 1,2 不在 [3,5] 内 → 后续仍需补点，总数更大</text>

  <!-- sort hint -->
  <rect x="32" y="326" width="456" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="345" font-size="11" fill="#d6a040" font-weight="bold">⚡ 排序：右端升序，同右端则左端降序（窄区间先处理）</text>
</svg>
