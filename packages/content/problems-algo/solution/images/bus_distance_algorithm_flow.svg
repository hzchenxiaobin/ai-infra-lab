<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求和取最小</text>

  <!-- Step 1: normalize start/destination -->
  <rect x="130" y="45" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 规整化：若 start &gt; dest 则交换</text>
  <text x="260" y="85" text-anchor="middle" font-size="10" fill="#888">保证 start ≤ dest，距离对称不影响结果</text>

  <!-- Arrow 1->2 -->
  <path d="M 260 95 L 260 115" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: sum clockwise -->
  <rect x="80" y="120" width="360" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 顺时针累加 clockwise</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#555">clockwise = Σ distance[i], i ∈ [start, dest)</text>

  <!-- Arrow 2->3 -->
  <path d="M 260 175 L 260 195" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: total -->
  <rect x="80" y="200" width="360" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 求环路总长 total</text>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#555">total = Σ distance[i], i ∈ [0, n)</text>

  <!-- Arrow 3->4 -->
  <path d="M 260 255 L 260 275" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: decision diamond -->
  <polygon points="260,280 360,330 260,380 160,330" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 取最小</text>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#555">min(clockwise,</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#555">total − clockwise)</text>

  <!-- Arrow 4->output -->
  <path d="M 360 330 L 420 330" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="420" y="312" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最短距离</text>

  <!-- Key insight box -->
  <rect x="40" y="392" width="440" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#444">💡 逆时针 = total − 顺时针，无需单独再算一遍</text>
</svg>
