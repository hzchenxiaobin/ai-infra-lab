<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：statements = [[2,1,2],[1,2,2],[2,0,2]]，n=3</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888">枚举 2³ = 8 种角色分配，逐一校验</text>

  <!-- Table header -->
  <rect x="20" y="60" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mask</text>

  <rect x="100" y="60" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="165" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(g0,g1,g2)</text>

  <rect x="230" y="60" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="410" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">校验过程（只看好人的陈述）</text>

  <rect x="590" y="60" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法?</text>

  <rect x="650" y="60" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="695" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好人数</text>

  <!-- Row 0: 000 -->
  <rect x="20" y="94" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="119" text-anchor="middle" font-size="11" fill="#333">000</text>
  <rect x="100" y="94" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="119" text-anchor="middle" font-size="11" fill="#333">坏,坏,坏</text>
  <rect x="230" y="94" width="360" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="119" text-anchor="middle" font-size="11" fill="#888">无人需校验</text>
  <rect x="590" y="94" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <rect x="650" y="94" width="90" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row 1: 001 -->
  <rect x="20" y="136" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="161" text-anchor="middle" font-size="11" fill="#333">001</text>
  <rect x="100" y="136" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="161" text-anchor="middle" font-size="11" fill="#333">坏,坏,好</text>
  <rect x="230" y="136" width="360" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="161" text-anchor="middle" font-size="10" fill="#333">g2好: st[2][1]=0 要求 g1=0 ✓</text>
  <rect x="590" y="136" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <rect x="650" y="136" width="90" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="161" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Row 2: 010 -->
  <rect x="20" y="178" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="203" text-anchor="middle" font-size="11" fill="#333">010</text>
  <rect x="100" y="178" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="203" text-anchor="middle" font-size="11" fill="#333">坏,好,坏</text>
  <rect x="230" y="178" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="203" text-anchor="middle" font-size="10" fill="#b85450">g1好: st[1][0]=1 要求 g0=1, 但 g0=0 ✗</text>
  <rect x="590" y="178" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <rect x="650" y="178" width="90" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="203" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 3: 011 -->
  <rect x="20" y="220" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="245" text-anchor="middle" font-size="11" fill="#333">011</text>
  <rect x="100" y="220" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="245" text-anchor="middle" font-size="11" fill="#333">坏,好,好</text>
  <rect x="230" y="220" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="245" text-anchor="middle" font-size="10" fill="#b85450">g1好: st[1][0]=1 要求 g0=1, 但 g0=0 ✗</text>
  <rect x="590" y="220" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="245" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <rect x="650" y="220" width="90" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="245" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 4: 100 -->
  <rect x="20" y="262" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="287" text-anchor="middle" font-size="11" fill="#333">100</text>
  <rect x="100" y="262" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="287" text-anchor="middle" font-size="11" fill="#333">好,坏,坏</text>
  <rect x="230" y="262" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="287" text-anchor="middle" font-size="10" fill="#b85450">g0好: st[0][1]=1 要求 g1=1, 但 g1=0 ✗</text>
  <rect x="590" y="262" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="287" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <rect x="650" y="262" width="90" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="287" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 5: 101 -->
  <rect x="20" y="304" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="329" text-anchor="middle" font-size="11" fill="#333">101</text>
  <rect x="100" y="304" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="329" text-anchor="middle" font-size="11" fill="#333">好,坏,好</text>
  <rect x="230" y="304" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="329" text-anchor="middle" font-size="10" fill="#b85450">g0好: st[0][1]=1 要求 g1=1, 但 g1=0 ✗</text>
  <rect x="590" y="304" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="329" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <rect x="650" y="304" width="90" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="329" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 6: 110 (highlight) -->
  <rect x="20" y="346" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="371" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">110</text>
  <rect x="100" y="346" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="371" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好,好,坏</text>
  <rect x="230" y="346" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="365" text-anchor="middle" font-size="10" fill="#333">g0好: st[0][1]=1 → g1=1 ✓</text>
  <text x="410" y="380" text-anchor="middle" font-size="10" fill="#333">g1好: st[1][0]=1 → g0=1 ✓</text>
  <rect x="590" y="346" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="620" y="371" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <rect x="650" y="346" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="695" y="371" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2 ⭐</text>

  <!-- Row 7: 111 -->
  <rect x="20" y="388" width="80" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="413" text-anchor="middle" font-size="11" fill="#333">111</text>
  <rect x="100" y="388" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="413" text-anchor="middle" font-size="11" fill="#333">好,好,好</text>
  <rect x="230" y="388" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="413" text-anchor="middle" font-size="10" fill="#b85450">g2好: st[2][1]=0 要求 g1=0, 但 g1=1 ✗</text>
  <rect x="590" y="388" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="620" y="413" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <rect x="650" y="388" width="90" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="695" y="413" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Legend -->
  <text x="30" y="460" font-size="11" fill="#555" font-weight="bold">图例：</text>
  <rect x="80" y="450" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="108" y="462" font-size="10" fill="#333">好人</text>
  <rect x="150" y="450" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="178" y="462" font-size="10" fill="#333">坏人</text>
  <rect x="220" y="450" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="462" font-size="10" fill="#333">混合</text>

  <!-- Conclusion -->
  <rect x="30" y="486" width="700" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="508" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最优解：mask = 110，好人 {0,1}</text>
  <text x="380" y="528" text-anchor="middle" font-size="11" fill="#555">0、1 互认好人（自洽），2 是坏人说假话指控 1 → 不影响一致性</text>
</svg>
