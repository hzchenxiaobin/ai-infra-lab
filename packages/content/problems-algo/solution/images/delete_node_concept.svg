<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- ===== 顶部：常规脱链法（失败） ===== -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">常规脱链：需要前驱 prev（本题拿不到）</text>

  <!-- chain: prev -> [node] -> next -->
  <rect x="92" y="64" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="13" fill="#333">prev</text>
  <line x1="148" y1="80" x2="192" y2="80" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="192" y="64" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">node</text>
  <line x1="248" y1="80" x2="292" y2="80" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="292" y="64" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="13" fill="#333">next</text>

  <!-- bypass arrow: prev.next points to next (skip node) -->
  <path d="M120 64 Q 220 20 320 64" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="30" text-anchor="middle" font-size="11" fill="#b85450">prev.next = node.next</text>

  <!-- fail note -->
  <rect x="380" y="68" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="87" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 拿不到 prev（无 head）</text>

  <line x1="40" y1="120" x2="560" y2="120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== 底部：值后移法（成功） ===== -->
  <text x="300" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">值后移法：把「删 node」偷换成「删 node.next」</text>

  <!-- Row 1: original  4 -> 5 -> [1] -> 9 -->
  <text x="60" y="186" font-size="11" fill="#888">原链表</text>
  <rect x="120" y="170" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="190" text-anchor="middle" font-size="12" fill="#333">4</text>
  <line x1="164" y1="185" x2="196" y2="185" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="170" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="190" text-anchor="middle" font-size="12" fill="#333">5</text>
  <line x1="240" y1="185" x2="272" y2="185" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="272" y="170" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="294" y="214" text-anchor="middle" font-size="9" fill="#d6a040">node</text>
  <line x1="316" y1="185" x2="348" y2="185" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="348" y="170" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="190" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="370" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">node.next</text>

  <!-- step1 arrow -->
  <path d="M370 206 L370 234" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="440" y="224" font-size="11" fill="#d6a040" font-weight="bold">① node.val = node.next.val（复制值）</text>

  <!-- Row 2: after copy  4 -> 5 -> [9] -> 9 -->
  <rect x="120" y="240" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="260" text-anchor="middle" font-size="12" fill="#333">4</text>
  <line x1="164" y1="255" x2="196" y2="255" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="240" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="260" text-anchor="middle" font-size="12" fill="#333">5</text>
  <line x1="240" y1="255" x2="272" y2="255" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="272" y="240" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <line x1="316" y1="255" x2="348" y2="255" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="348" y="240" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="260" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- step2 arrow -->
  <path d="M370 276 L370 304" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="294" font-size="11" fill="#b85450" font-weight="bold">② node.next = node.next.next（跳过后继）</text>

  <!-- Row 3: after skip  4 -> 5 -> 9  (next dropped) -->
  <rect x="120" y="310" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="330" text-anchor="middle" font-size="12" fill="#333">4</text>
  <line x1="164" y1="325" x2="196" y2="325" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="310" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="330" text-anchor="middle" font-size="12" fill="#333">5</text>
  <line x1="240" y1="325" x2="272" y2="325" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="272" y="310" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- dropped node next -->
  <rect x="348" y="310" width="44" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="370" y="330" text-anchor="middle" font-size="12" fill="#bbb">9</text>
  <line x1="372" y1="312" x2="392" y2="342" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="330" font-size="10" fill="#999">真后继脱链（伪删除）</text>

  <!-- takeaway -->
  <rect x="40" y="362" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键转换：node 借后继的值「伪装」，再以「前驱身份」干掉真后继</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#333">删 node ⇔ 删 node.next（此时 node 恰是 node.next 的前驱，标准脱链可用）</text>
</svg>
