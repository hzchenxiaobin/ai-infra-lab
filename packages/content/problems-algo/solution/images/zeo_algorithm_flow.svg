<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：条件变量 + turn 令牌（以 zero 为例）</text>

  <!-- entry -->
  <rect x="200" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">线程进入 zero()</text>

  <path d="M 270 78 L 270 94" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <path d="M 200 130 L 340 130 L 360 105 L 340 80 L 200 80 L 180 105 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="12" fill="#333">还有数要打印？</text>

  <path d="M 270 130 L 270 146" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <path d="M 360 105 L 400 105" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="372" y="98" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="400" y="88" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#333">线程结束</text>

  <!-- lock + wait -->
  <rect x="190" y="150" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#333">加锁 cv.wait(turn==0)</text>

  <path d="M 270 184 L 270 200" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- print zero -->
  <rect x="190" y="204" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#333">printNumber(0)</text>

  <path d="M 270 238 L 270 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decide next -->
  <path d="M 205 290 L 335 290 L 355 265 L 335 240 L 205 240 L 185 265 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#333">下一个数是奇还是偶？</text>

  <path d="M 185 265 L 130 265 L 130 295" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="145" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">奇</text>

  <path d="M 355 265 L 410 265 L 410 295" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="375" y="258" font-size="11" fill="#b85450" font-weight="bold">偶</text>

  <rect x="75" y="300" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#333">turn=1, cv.notify</text>

  <rect x="355" y="300" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="322" text-anchor="middle" font-size="11" fill="#333">turn=2, cv.notify</text>

  <path d="M 130 334 L 130 360 Q 130 370 140 370 L 260 370" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 410 334 L 410 360 Q 410 370 400 370 L 280 370" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop back -->
  <rect x="215" y="362" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#333">解锁，回到循环</text>

  <path d="M 270 392 L 270 410 L 90 410 L 90 130 L 180 130" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="60" y="424" width="420" height="28" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="442" text-anchor="middle" font-size="11" fill="#446688">odd()/even() 同构：cv.wait(自身 turn) → 打印 → turn=0 → notify</text>
</svg>
