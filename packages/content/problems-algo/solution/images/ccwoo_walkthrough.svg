<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：words1 / words2 → 频次表 → 交集判定</text>

  <!-- 左：freq1 表 -->
  <text x="100" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq1（扫 words1）</text>
  <rect x="40" y="72" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">词 → 次数</text>

  <rect x="40" y="100" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">leetcode → 1</text>

  <rect x="40" y="128" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">amazing → 1</text>

  <rect x="40" y="156" width="120" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">is → 2</text>

  <rect x="40" y="184" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">as → 1</text>

  <!-- 右：freq2 表 -->
  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq2（扫 words2）</text>
  <rect x="370" y="72" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">词 → 次数</text>

  <rect x="370" y="100" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">amazing → 1</text>

  <rect x="370" y="128" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">leetcode → 1</text>

  <rect x="370" y="156" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">is → 1</text>

  <!-- 中间箭头 -->
  <line x1="290" y1="200" x2="290" y2="232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="222" font-size="11" fill="#4a7a3a" filter="url(#rough2)">遍历 freq1 取交集</text>

  <!-- 交集判定表 -->
  <!-- 表头 -->
  <rect x="50" y="238" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="257" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">候选词 w</text>
  <rect x="162" y="238" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="257" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq1[w]</text>
  <rect x="244" y="238" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="257" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq2[w]</text>
  <rect x="326" y="238" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="257" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">双侧均==1?</text>
  <rect x="448" y="238" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="483" y="257" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行 1: leetcode ✓ -->
  <rect x="50" y="268" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">leetcode</text>
  <rect x="162" y="268" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="202" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="268" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="326" y="268" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="386" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 是</text>
  <rect x="448" y="268" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="483" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 行 2: amazing ✓ -->
  <rect x="50" y="298" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">amazing</text>
  <rect x="162" y="298" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="202" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="298" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="326" y="298" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="386" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 是</text>
  <rect x="448" y="298" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="483" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 3: is ✗ -->
  <rect x="50" y="328" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">is</text>
  <rect x="162" y="328" width="80" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="347" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <rect x="244" y="328" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="326" y="328" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 左=2</text>
  <rect x="448" y="328" width="70" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="347" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 4: as ✗ -->
  <rect x="50" y="358" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="377" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">as</text>
  <rect x="162" y="358" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="202" y="377" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="358" width="80" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="377" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="326" y="358" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="377" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 右缺失</text>
  <rect x="448" y="358" width="70" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="377" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <!-- 底部结论 -->
  <rect x="120" y="392" width="340" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="409" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans = 2（leetcode, amazing）✅</text>
</svg>
