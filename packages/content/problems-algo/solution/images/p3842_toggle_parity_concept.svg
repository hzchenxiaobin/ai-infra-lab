<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：翻转两次 = 没翻 → 最终亮不亮只看出现次数的奇偶</text>

  <!-- ===== 行 1：灯 10 被翻两次 ===== -->
  <text x="30" y="85" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">灯 10</text>
  <circle cx="112" cy="80" r="15" fill="#f0f0f0" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="85" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">关</text>
  <path d="M132,80 Q148,74 162,80" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻 ①</text>
  <circle cx="186" cy="80" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">开</text>
  <path d="M178,62 L172,54 M186,60 L186,50 M194,62 L200,54" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M206,80 Q222,74 236,80" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻 ②</text>
  <circle cx="260" cy="80" r="15" fill="#f0f0f0" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">关</text>
  <text x="300" y="76" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 出现 2 次（偶）→ 最终关</text>
  <text x="300" y="94" font-size="10.5" fill="#888" filter="url(#rough2)">翻两次相互抵消，等于没碰过它</text>

  <!-- ===== 行 2：灯 20 被翻一次 ===== -->
  <text x="30" y="155" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">灯 20</text>
  <circle cx="112" cy="150" r="15" fill="#f0f0f0" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="155" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">关</text>
  <path d="M132,150 Q148,144 162,150" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻 ①</text>
  <circle cx="186" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">开</text>
  <path d="M178,132 L172,124 M186,130 L186,120 M194,132 L200,124" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="146" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 出现 1 次（奇）→ 最终开</text>
  <text x="300" y="164" font-size="10.5" fill="#888" filter="url(#rough2)">奇数次翻转后停在"开"这一档</text>

  <!-- ===== 行 3：计数视角 ===== -->
  <text x="30" y="216" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">计数视角：bulbs = [10, 30, 20, 10]</text>
  <rect x="30" y="228" width="88" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt[10]=2</text>
  <text x="74" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">偶 ✗</text>
  <rect x="132" y="228" width="88" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cnt[20]=1</text>
  <text x="176" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇 ✓</text>
  <rect x="234" y="228" width="88" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="278" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cnt[30]=1</text>
  <text x="278" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇 ✓</text>
  <path d="M334,249 Q356,249 378,249" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="228" width="144" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">答案 [20, 30]</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="20" y="296" width="520" height="84" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">翻转 ≡ 计数 +1（mod 2）—— 顺序无关，只看每个编号被翻奇数次还是偶数次</text>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">编号范围 1~100 ⇒ 长度 101 的计数数组就是完美哈希表</text>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">按 1→100 扫描计数数组，收集奇数项，答案天然升序</text>
</svg>
