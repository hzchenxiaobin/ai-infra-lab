<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">限制松弛 Bellman-Ford 算法流程</text>

  <!-- Init -->
  <rect x="120" y="40" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#555">dist[src]=0，其余=∞</text>

  <path d="M 230 94 L 230 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Outer loop -->
  <rect x="100" y="116" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="136" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 0 to k</text>
  <text x="230" y="152" text-anchor="middle" font-size="10.5" fill="#555">共 k+1 轮松弛</text>

  <path d="M 230 162 L 230 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Snapshot -->
  <rect x="120" y="184" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prev = dist 副本</text>
  <text x="230" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">快照：本轮只读 prev</text>

  <path d="M 230 230 L 230 248" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Inner loop -->
  <rect x="100" y="252" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for (u, v, w) in flights</text>
  <text x="230" y="288" text-anchor="middle" font-size="10.5" fill="#555">遍历每条边</text>

  <path d="M 230 298 L 230 316" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="230,320 340,365 230,410 120,365" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="360" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">prev[u]+w &lt; dist[v]?</text>
  <text x="230" y="378" text-anchor="middle" font-size="10" fill="#777">经 u 中转更便宜？</text>

  <!-- Yes branch -->
  <path d="M 120 365 L 50 365 L 50 430" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="66" y="358" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="434" width="110" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="61" y="454" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">松弛</text>
  <text x="61" y="471" text-anchor="middle" font-size="10" fill="#555">dist[v]=</text>
  <text x="61" y="484" text-anchor="middle" font-size="10" fill="#555">prev[u]+w</text>

  <!-- No branch -->
  <path d="M 340 365 L 410 365 L 410 430" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="376" y="358" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="362" y="434" width="92" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="408" y="458" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>
  <text x="408" y="476" text-anchor="middle" font-size="9.5" fill="#b85450">不更新</text>

  <!-- Merge to inner loopback -->
  <path d="M 61 490 L 61 510 L 230 510" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 408 490 L 408 510 L 230 510" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Inner loopback (next edge) -->
  <path d="M 230 510 L 360 510 L 360 274 L 362 274" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="372" y="392" font-size="9.5" fill="#888" font-style="italic">下一条边</text>

  <!-- Outer loopback note (next round) -->
  <path d="M 100 138 L 70 138 L 70 540 L 230 540" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="78" y="340" font-size="9.5" fill="#d6a040" font-style="italic">边遍历完</text>
  <text x="78" y="352" font-size="9.5" fill="#d6a040" font-style="italic">→ 下一轮 i</text>

  <!-- Final result -->
  <rect x="120" y="524" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="544" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k+1 轮结束 → 返回 dist[dst] 或 −1</text>
</svg>
