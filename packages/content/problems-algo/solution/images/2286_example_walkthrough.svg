<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>
  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：BookMyShow(2, 5) 五步操作座位演化</text>
  <text x="380" y="42" text-anchor="middle" font-size="10" fill="#888">橙=本次新订，蓝=此前已订，绿=空位 free</text>

  <!-- ===== Step 1: gather(4,0) -> [0,0] ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="48" width="732" height="104" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="28" y="72" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">① gather(4, 0)</text>
  <text x="28" y="92" font-size="10.5" fill="#333" filter="url(#rough2)">排0 free=5≥4</text>
  <text x="28" y="108" font-size="10.5" fill="#333" filter="url(#rough2)">→ r=0, c=0</text>
  <text x="28" y="128" font-size="10.5" fill="#333" filter="url(#rough2)">订 [0,3]</text>
  <text x="28" y="146" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return [0, 0] ✓</text>

  <!-- row0 seats: 0-3 orange(booked now), 4 green -->
  <text x="160" y="100" font-size="10" fill="#888" filter="url(#rough2)">排0</text>
  <g filter="url(#rough2)">
    <rect x="186" y="84" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="220" y="84" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="254" y="84" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="288" y="84" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="322" y="84" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="9.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="201" y="100">0</text><text x="235" y="100">1</text><text x="269" y="100">2</text><text x="303" y="100">3</text><text x="337" y="100" fill="#2e6e2e">4</text>
  </g>
  <!-- row1 all green -->
  <text x="160" y="132" font-size="10" fill="#888" filter="url(#rough2)">排1</text>
  <g filter="url(#rough2)">
    <rect x="186" y="116" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="220" y="116" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="254" y="116" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="116" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="322" y="116" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>

  <!-- state -->
  <text x="380" y="100" font-size="10.5" fill="#446688" filter="url(#rough2)">used=[4,0]</text>
  <text x="380" y="116" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">free=[1,5]</text>
  <text x="380" y="132" font-size="10.5" fill="#888" filter="url(#rough2)">lo=0, mx=5, sum=6</text>

  <!-- ===== Step 2: gather(2,0) -> [] ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="160" width="732" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="28" y="184" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② gather(2, 0)</text>
  <text x="28" y="204" font-size="10.5" fill="#333" filter="url(#rough2)">排0 free=1&lt;2</text>
  <text x="28" y="220" font-size="10.5" fill="#333" filter="url(#rough2)">maxRow=0 只能排0</text>
  <text x="28" y="238" font-size="10.5" fill="#333" filter="url(#rough2)">mx[0,0]=1&lt;2</text>
  <text x="28" y="254" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return [] ✗</text>

  <!-- row0: 0-3 blue, 4 green -->
  <text x="160" y="212" font-size="10" fill="#888" filter="url(#rough2)">排0</text>
  <g filter="url(#rough2)">
    <rect x="186" y="196" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="196" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="254" y="196" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="288" y="196" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="196" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <!-- X mark over the only free seat (can't fit 2) -->
  <path d="M 322 196 L 352 220 M 352 196 L 322 220" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="160" y="244" font-size="10" fill="#888" filter="url(#rough2)">排1</text>
  <g filter="url(#rough2)">
    <rect x="186" y="228" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="220" y="228" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="254" y="228" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="228" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="322" y="228" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="212" font-size="10.5" fill="#446688" filter="url(#rough2)">状态不变 used=[4,0]</text>
  <text x="380" y="228" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">free=[1,5]</text>

  <!-- ===== Step 3: scatter(5,1) -> true ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="268" width="732" height="118" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="28" y="292" font-size="12.5" fill="#2b5588" font-weight="bold" filter="url(#rough2)">③ scatter(5, 1)</text>
  <text x="28" y="312" font-size="10.5" fill="#333" filter="url(#rough2)">sum[0,1]=1+5=6≥5</text>
  <text x="28" y="328" font-size="10.5" fill="#333" filter="url(#rough2)">从 lo=0 逐排填：</text>
  <text x="28" y="344" font-size="10.5" fill="#333" filter="url(#rough2)">排0 取1(座4)</text>
  <text x="28" y="360" font-size="10.5" fill="#333" filter="url(#rough2)">排1 取4(座0-3)</text>
  <text x="28" y="378" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true ✓</text>

  <!-- row0: 0-3 blue, 4 orange -->
  <text x="160" y="320" font-size="10" fill="#888" filter="url(#rough2)">排0</text>
  <g filter="url(#rough2)">
    <rect x="186" y="304" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="304" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="254" y="304" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="288" y="304" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="304" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="9.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="201" y="320">0</text><text x="235" y="320">1</text><text x="269" y="320">2</text><text x="303" y="320">3</text><text x="337" y="320" fill="#7a5415" font-weight="bold">4</text>
  </g>
  <!-- row1: 0-3 orange, 4 green -->
  <text x="160" y="352" font-size="10" fill="#888" filter="url(#rough2)">排1</text>
  <g filter="url(#rough2)">
    <rect x="186" y="336" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="220" y="336" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="254" y="336" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="288" y="336" width="30" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="322" y="336" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="9.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="201" y="352" fill="#7a5415" font-weight="bold">0</text><text x="235" y="352" fill="#7a5415" font-weight="bold">1</text><text x="269" y="352" fill="#7a5415" font-weight="bold">2</text><text x="303" y="352" fill="#7a5415" font-weight="bold">3</text><text x="337" y="352" fill="#2e6e2e">4</text>
  </g>

  <text x="380" y="320" font-size="10.5" fill="#446688" filter="url(#rough2)">used=[5,4]</text>
  <text x="380" y="336" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">free=[0,1]</text>
  <text x="380" y="352" font-size="10.5" fill="#888" filter="url(#rough2)">lo=1（排0 满→前进）</text>

  <!-- ===== Step 4: scatter(5,1) -> false ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="394" width="732" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="28" y="418" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ scatter(5, 1)</text>
  <text x="28" y="438" font-size="10.5" fill="#333" filter="url(#rough2)">sum[0,1]=0+1=1</text>
  <text x="28" y="454" font-size="10.5" fill="#333" filter="url(#rough2)">1&lt;5 → 不够</text>
  <text x="28" y="472" font-size="10.5" fill="#333" filter="url(#rough2)">不订任何座位</text>
  <text x="28" y="488" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false ✗</text>

  <!-- row0 all blue -->
  <text x="160" y="446" font-size="10" fill="#888" filter="url(#rough2)">排0</text>
  <g filter="url(#rough2)">
    <rect x="186" y="430" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="430" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="254" y="430" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="288" y="430" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="430" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- row1: 0-3 blue, 4 green -->
  <text x="160" y="478" font-size="10" fill="#888" filter="url(#rough2)">排1</text>
  <g filter="url(#rough2)">
    <rect x="186" y="462" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="462" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="254" y="462" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="288" y="462" width="30" height="24" rx="3" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="462" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="446" font-size="10.5" fill="#446688" filter="url(#rough2)">状态不变 used=[5,4]</text>
  <text x="380" y="462" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">free=[0,1]</text>

  <!-- footer -->
  <g filter="url(#rough2)">
    <rect x="14" y="506" width="732" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="380" y="524" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gather 靠 mx 一跳定位「第一个够 k 的排」；scatter 靠 sum 判总量 + lo 指针摊还逐排填</text>
  <text x="380" y="540" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">失败时（mx&lt;k 或 sum&lt;k）零修改直接返回，保证原子性</text>
</svg>
