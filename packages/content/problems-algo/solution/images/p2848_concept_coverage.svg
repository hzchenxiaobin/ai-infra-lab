<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">答案 = 区间并集的整数点数：重叠只数一次</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">nums = [[3,6],[1,5],[4,7]]（示例 1）</text>

  <!-- car bars: point p -> x = 75 + 52p, cell = [x-26, x+26] -->
  <rect x="101" y="86" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">车 [1,5]（长 5）</text>

  <rect x="205" y="120" width="208" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="137" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">车 [3,6]（长 4）</text>

  <rect x="257" y="154" width="208" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="171" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">车 [4,7]（长 4）</text>

  <!-- number line -->
  <line x1="55" y1="230" x2="510" y2="230" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <line x1="75"  y1="223" x2="75"  y2="237" stroke="#888" stroke-width="1"/>
    <line x1="127" y1="223" x2="127" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="179" y1="223" x2="179" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="231" y1="223" x2="231" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="283" y1="223" x2="283" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="335" y1="223" x2="335" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="387" y1="223" x2="387" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="439" y1="223" x2="439" y2="237" stroke="#888" stroke-width="1"/>
    <line x1="491" y1="223" x2="491" y2="237" stroke="#888" stroke-width="1"/>
    <text x="75"  y="258" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="127" y="258" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="179" y="258" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="231" y="258" text-anchor="middle" font-size="11" fill="#666">3</text>
    <text x="283" y="258" text-anchor="middle" font-size="11" fill="#666">4</text>
    <text x="335" y="258" text-anchor="middle" font-size="11" fill="#666">5</text>
    <text x="387" y="258" text-anchor="middle" font-size="11" fill="#666">6</text>
    <text x="439" y="258" text-anchor="middle" font-size="11" fill="#666">7</text>
    <text x="491" y="258" text-anchor="middle" font-size="11" fill="#666">8</text>
  </g>

  <!-- covered point markers -->
  <g filter="url(#rough2)">
    <circle cx="75"  cy="230" r="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="75"  y="234" text-anchor="middle" font-size="9" fill="#999">×</text>
    <circle cx="127" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="179" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="231" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="283" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="335" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="387" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="439" cy="230" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="491" cy="230" r="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="491" y="234" text-anchor="middle" font-size="9" fill="#999">×</text>
  </g>

  <!-- brace under covered region -->
  <path d="M 127 272 L 127 278 L 283 278 L 283 284 L 283 278 L 439 278 L 439 272"
        fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">被覆盖的点 1..7，共 7 个（答案）</text>

  <!-- bottom compare boxes -->
  <rect x="40" y="312" width="235" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="334" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 按车累加长度</text>
  <text x="157" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 + 5 + 4 = 13 个点</text>
  <text x="157" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">重叠点被重复计算 ✗</text>

  <rect x="295" y="312" width="225" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 数并集的点</text>
  <text x="407" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">并集 = [1,7]，共 7 个点</text>
  <text x="407" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">重叠自动只数一次 ✓</text>
</svg>
