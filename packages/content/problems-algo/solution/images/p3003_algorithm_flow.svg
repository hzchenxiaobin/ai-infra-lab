<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">dfs(i, mask, changed) 单步转移流程</text>

  <!-- 开始框 -->
  <rect x="90" y="38" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cur = s[i]，候选字母集 C：</text>
  <text x="260" y="71" text-anchor="middle" font-size="11" fill="#446688">changed 已用 → C = {cur}；还没用 → C = 全部 26 个（c=cur 即不改）</text>

  <path d="M260,78 L260,94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 -->
  <polygon points="260,98 420,134 260,170 100,134" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">m = mask | (1&lt;&lt;c)</text>
  <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">popcount(m) &gt; k ？</text>

  <path d="M100,134 L60,134 L60,168" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="86" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M420,134 L460,134 L460,168" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="436" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- 左分支：并入 -->
  <rect x="20" y="172" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dfs(i+1, m, nc)</text>
  <text x="120" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a">s[i] 并入当前段，段继续延伸</text>
  <text x="120" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（不许提前切！）</text>

  <!-- 右分支：切分 -->
  <rect x="300" y="172" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 + dfs(i+1, 1&lt;&lt;c, nc)</text>
  <text x="400" y="212" text-anchor="middle" font-size="10.5" fill="#b85450">在 i 前面切一刀，段数 +1</text>
  <text x="400" y="226" text-anchor="middle" font-size="10.5" fill="#b85450">s[i] 开启新段</text>

  <path d="M120,228 L120,254 L244,254" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M400,228 L400,254 L276,254" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 汇合框 -->
  <rect x="140" y="256" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">best = max(best, 分支值)，换下一个 c</text>

  <!-- 边界框 -->
  <path d="M260,292 L260,308" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="140" y="312" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">边界 i == n → return 1（最后一段收尾）</text>

  <!-- 警示框 -->
  <rect x="24" y="362" width="472" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 「最长前缀」是强制规则：装得下就必须继续装，没有提前切的分支；</text>
  <text x="260" y="399" text-anchor="middle" font-size="11" fill="#b85450">改成哪个字母交给 26 枚举全权决定（含 c = s[i] 的「不改」选项）</text>
</svg>
