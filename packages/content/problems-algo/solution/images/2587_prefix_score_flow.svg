<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：降序排序 + 滚动求和计数</text>

  <!-- 开始 -->
  <ellipse cx="270" cy="62" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M270,80 L270,100" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 降序排序 -->
  <rect x="180" y="102" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="13" fill="#333">将 nums 降序排序</text>

  <path d="M270,140 L270,160" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="180" y="162" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="13" fill="#333">sum = 0, count = 0</text>

  <path d="M270,200 L270,220" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 取下一个 -->
  <rect x="170" y="222" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="13" fill="#333">取下一个 num（遍历 nums）</text>

  <path d="M270,260 L270,280" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 累加 -->
  <rect x="190" y="282" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="13" fill="#333">sum += num</text>

  <path d="M270,320 L270,338" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="270,340 372,386 270,432 168,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="383" text-anchor="middle" font-size="13" fill="#333">sum &gt; 0 ?</text>

  <!-- Yes 分支：左 -->
  <path d="M168,386 L90,386 L90,242" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="92" y="258" width="50" height="22" fill="#fafafa" stroke="none"/>
  <text x="100" y="274" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Yes</text>
  <rect x="56" y="350" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="367" text-anchor="middle" font-size="12" fill="#4a7a3a">count++ → 回到取下一</text>

  <!-- No 分支：右 -->
  <path d="M372,386 L452,386" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="398" y="380" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">No</text>

  <!-- break / 返回 -->
  <rect x="392" y="372" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="392" text-anchor="middle" font-size="12" fill="#b85450">break</text>

  <path d="M438,402 L438,420 L270,420" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <ellipse cx="270" cy="438" rx="54" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 count</text>
</svg>
