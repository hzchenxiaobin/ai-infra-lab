<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍单调栈 + 逐位合并</text>

  <!-- start -->
  <rect x="170" y="42" width="180" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,74 L260,88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="115" y="90" width="290" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 从左到右遍历 i（栈存下标，cap 严格递增）</text>
  <path d="M260,126 L260,148" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,150 370,192 260,234 150,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">栈非空且</text>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">maxHeights[栈顶] ≥ h[i]？</text>

  <!-- yes branch -->
  <path d="M370,192 L400,192" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="402" y="174" width="180" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">弹栈（并入压平段）</text>
  <path d="M492,174 C 488,130 400,132 348,172" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M260,234 L260,254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="250" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- step 2 -->
  <rect x="85" y="256" width="350" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② j = 栈顶（空则 −1）</text>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">left[i] = left[j] + h·(i−j)，随后 i 入栈</text>
  <path d="M260,304 L260,322" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="85" y="324" width="350" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 从右到左同理求 right[i]</text>
  <path d="M260,360 L260,378" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="85" y="380" width="350" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="405" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ ans = max( left[i] + right[i] − h[i] )，返回</text>
</svg>
