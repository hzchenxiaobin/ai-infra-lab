<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：完成时刻 = 开始 + 时长，取全局最小</text>

  <!-- 任务 0 时间轴 -->
  <text x="48" y="96" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">任务 0</text>
  <path d="M 60 92 L 470 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="100" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="340" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <rect x="100" y="76" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s=1，t=6</text>
  <path d="M 340 64 L 340 112" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="348" y="68" font-size="11" fill="#666" filter="url(#rough2)">完成 = 1+6 = 7</text>

  <!-- 任务 1 时间轴 -->
  <text x="48" y="175" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">任务 1</text>
  <path d="M 60 171 L 470 171" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="140" y="191" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="260" y="191" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <rect x="140" y="155" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s=2，t=3</text>
  <path d="M 260 145 L 260 191" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="149" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最早完成 = 2+3 = 5 ✔</text>

  <!-- 两个完成时刻汇入 min -->
  <path d="M 340 118 C 340 180 330 196 312 214" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 260 195 L 260 214" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="130" y="218" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(每个任务的完成时刻)</text>
  <text x="260" y="253" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="bold" filter="url(#rough2)">= min(7, 5) = 5</text>

  <!-- 常见错误警示 -->
  <rect x="36" y="274" width="448" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 不是 min(s) + min(t)！</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s 与 t 成对绑定在同一任务上，拆开各自取 min 会低估答案</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">反例 [[1,100],[50,1]]：min(s)+min(t)=2，但真实最早完成 = 51</text>
</svg>
