<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：binary = "000110" → "111011"</text>

  <!-- ===== Original string with p, c ===== -->
  <text x="60" y="58" font-size="11" fill="#888" filter="url(#rough2)">原串：</text>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="92" y="46" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="107" y="67" fill="#b85450">0</text>
    <rect x="122" y="46" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="137" y="67" fill="#b85450">0</text>
    <rect x="152" y="46" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="167" y="67" fill="#b85450">0</text>
    <rect x="182" y="46" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="197" y="67" fill="#4a7a3a">1</text>
    <rect x="212" y="46" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="227" y="67" fill="#4a7a3a">1</text>
    <rect x="242" y="46" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="257" y="67" fill="#b85450">0</text>
  </g>

  <!-- index labels -->
  <g font-size="9" fill="#aaa" text-anchor="middle" filter="url(#rough2)">
    <text x="107" y="92">0</text>
    <text x="137" y="92">1</text>
    <text x="167" y="92">2</text>
    <text x="197" y="92">3</text>
    <text x="227" y="92">4</text>
    <text x="257" y="92">5</text>
  </g>

  <!-- p and c annotations -->
  <path d="M 107 100 L 107 110" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="116" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">p = 0（首个 0）</text>
  <text x="290" y="60" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 的个数 c = 4</text>
  <text x="290" y="74" font-size="9" fill="#888" filter="url(#rough2)">(下标 0,1,2,5)</text>

  <!-- ===== Formula computation ===== -->
  <rect x="40" y="128" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="148" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">套公式：</text>
  <text x="56" y="168" font-size="12" fill="#555" filter="url(#rough2)">唯一 0 的位置 = p + c − 1 = 0 + 4 − 1 = </text>
  <rect x="330" y="154" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="380" y="168" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 其余位全 1</text>
  <text x="56" y="184" font-size="10" fill="#888" filter="url(#rough2)">前缀 '1'×(p+c−1)=3 个 + '0' + 后缀 '1'×(n−p−c)=2 个</text>

  <!-- ===== Operation trace ===== -->
  <text x="60" y="216" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作轨迹（聚集 → 消灭）：</text>

  <!-- step 0 -->
  <text x="40" y="240" font-size="9" fill="#aaa" filter="url(#rough2)">原串</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="80" y="228" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="91" y="244" fill="#b85450">0</text>
    <rect x="102" y="228" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="113" y="244" fill="#b85450">0</text>
    <rect x="124" y="228" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="135" y="244" fill="#b85450">0</text>
    <rect x="146" y="228" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="157" y="244" fill="#4a7a3a">1</text>
    <rect x="168" y="228" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="179" y="244" fill="#4a7a3a">1</text>
    <rect x="190" y="228" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="201" y="244" fill="#b85450">0</text>
  </g>
  <text x="230" y="244" font-size="9" fill="#888" filter="url(#rough2)">000110</text>

  <!-- arrow down with op2 label -->
  <path d="M 145 256 L 145 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="266" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">op2×2 把尾 0 左移到下标 3</text>

  <!-- step 1: gathered 000011 -->
  <text x="40" y="290" font-size="9" fill="#aaa" filter="url(#rough2)">聚集</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="80" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="91" y="294" fill="#b85450">0</text>
    <rect x="102" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="113" y="294" fill="#b85450">0</text>
    <rect x="124" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="135" y="294" fill="#b85450">0</text>
    <rect x="146" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="157" y="294" fill="#b85450">0</text>
    <rect x="168" y="278" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="179" y="294" fill="#4a7a3a">1</text>
    <rect x="190" y="278" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="201" y="294" fill="#4a7a3a">1</text>
  </g>
  <text x="230" y="294" font-size="9" fill="#888" filter="url(#rough2)">000011（4 个 0 连成块）</text>

  <!-- arrow down op1 -->
  <path d="M 145 306 L 145 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="316" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">op1×3 逐对消灭，存活 0 右移</text>

  <!-- step 2: final 111011 -->
  <text x="40" y="340" font-size="9" fill="#aaa" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="80" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="91" y="344" fill="#4a7a3a">1</text>
    <rect x="102" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="113" y="344" fill="#4a7a3a">1</text>
    <rect x="124" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="135" y="344" fill="#4a7a3a">1</text>
    <rect x="146" y="328" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <text x="157" y="344" fill="#b85450">0</text>
    <rect x="168" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="179" y="344" fill="#4a7a3a">1</text>
    <rect x="190" y="328" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="201" y="344" fill="#4a7a3a">1</text>
  </g>
  <text x="230" y="344" font-size="9" fill="#888" filter="url(#rough2)">111011（唯一 0 在下标 3 ✓）</text>

  <!-- highlight final 0 position 3 -->
  <path d="M 157 354 L 157 360" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Verification box ===== -->
  <rect x="40" y="372" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="392" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证：</text>
  <text x="56" y="410" font-size="10" fill="#555" filter="url(#rough2)">原串 000110 = 6，结果 111011 = 59；操作只增不减，且 0 已被推到最右可能位置</text>
  <text x="56" y="424" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">首个 0 从下标 0 起吃掉 3 个 0 → 右移到下标 3，无法再右移（无 0 可配对）</text>

  <!-- Footer -->
  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">公式 O(n) 直接定位，无需模拟操作序列</text>
</svg>
