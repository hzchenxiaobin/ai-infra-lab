<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心：原始 settle 后再等 ms 才传播</text>

  <!-- 上半：resolve 路径（绿） -->
  <text x="40" y="72" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">resolve 路径</text>
  <line x1="70" y1="105" x2="510" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="515" y="109" font-size="11" fill="#999" filter="url(#rough2)">t</text>

  <!-- 原始 resolve at T -->
  <line x1="180" y1="93" x2="180" y2="117" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="180" cy="105" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">T：原始 resolve</text>
  <text x="180" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">fn() settle</text>

  <!-- delay 区间 -->
  <line x1="190" y1="105" x2="320" y2="105" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">等 ms 毫秒</text>

  <!-- 延迟后 resolve at T+ms -->
  <line x1="330" y1="93" x2="330" y2="117" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="330" cy="105" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">T+ms：延迟 resolve</text>
  <text x="330" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">传播 value ✓</text>

  <!-- 下半：reject 路径（红） -->
  <text x="40" y="180" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">reject 路径</text>
  <line x1="70" y1="213" x2="510" y2="213" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="515" y="217" font-size="11" fill="#999" filter="url(#rough2)">t</text>

  <!-- 原始 reject at T -->
  <line x1="180" y1="201" x2="180" y2="225" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="180" cy="213" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">T：原始 reject</text>
  <text x="180" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">fn() settle</text>

  <!-- delay 区间 -->
  <line x1="190" y1="213" x2="320" y2="213" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="255" y="206" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">同样等 ms 毫秒</text>

  <!-- 延迟后 reject at T+ms -->
  <line x1="330" y1="201" x2="330" y2="225" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="330" cy="213" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">T+ms：延迟 reject</text>
  <text x="330" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">传播 error ✗</text>

  <!-- 常见错误提示框 -->
  <rect x="50" y="270" width="460" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="293" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ 常见错误：只延迟 resolve，忘记延迟 reject</text>
  <text x="62" y="313" font-size="10.5" fill="#555" filter="url(#rough2)">await fn() 若 reject → 立即抛出 → 跳过 sleep</text>
  <text x="62" y="331" font-size="10.5" fill="#555" filter="url(#rough2)">→ reject 在 T 时刻就传播了，没有延迟！</text>
  <text x="62" y="351" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 正解：try/catch 两路都 await sleep()，再 return / throw</text>
</svg>
