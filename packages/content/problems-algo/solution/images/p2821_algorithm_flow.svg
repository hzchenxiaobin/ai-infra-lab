<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">try/catch + sleep 算法流程</text>

  <!-- 开始 -->
  <rect x="210" y="48" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">调用 wrappedFn(...args)</text>

  <!-- await fn() -->
  <rect x="200" y="100" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">const res = await fn(...args)</text>
  <line x1="280" y1="78" x2="280" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：settle 成功还是失败 -->
  <polygon points="280,150 360,190 280,230 200,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">settle 类型?</text>
  <text x="280" y="201" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">resolve / reject</text>
  <line x1="280" y1="134" x2="280" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左路：resolve（绿） -->
  <text x="160" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">resolve</text>
  <line x1="200" y1="190" x2="150" y2="190" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="55" y="215" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="235" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">await sleep(ms)</text>
  <line x1="115" y1="190" x2="115" y2="215" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="55" y="265" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">return res</text>
  <line x1="115" y1="245" x2="115" y2="265" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 右路：reject（红） -->
  <text x="400" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">reject</text>
  <line x1="360" y1="190" x2="410" y2="190" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="385" y="215" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="235" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">await sleep(ms)</text>
  <line x1="445" y1="190" x2="445" y2="215" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="385" y="265" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="285" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">throw err</text>
  <line x1="445" y1="245" x2="445" y2="265" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 汇合 -->
  <line x1="115" y1="295" x2="115" y2="325" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="445" y1="295" x2="445" y2="325" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="115" y1="325" x2="445" y2="325" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="200" y="340" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">延迟 Promise settle</text>
  <line x1="280" y1="325" x2="280" y2="340" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 关键提示 -->
  <rect x="50" y="385" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="62" y="403" font-size="10" fill="#555" filter="url(#rough2)">关键：两路（resolve / reject）都必须 await sleep(ms) 后再传播</text>
</svg>
