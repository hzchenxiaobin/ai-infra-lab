<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有根树 + 1 条有向边 → 两类违规</text>

  <!-- ===== Top: valid rooted tree ===== -->
  <rect x="30" y="44" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合法有根树：根入度 0，其余入度 1，无环</text>

  <circle cx="280" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="305" y="100" font-size="10" fill="#888">根</text>
  <circle cx="220" cy="142" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="340" cy="142" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <line x1="266" y1="110" x2="234" y2="134" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="294" y1="110" x2="326" y2="134" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a">入度：1→0，2→1，3→1 ✓</text>

  <!-- split arrows to two cases -->
  <line x1="240" y1="166" x2="160" y2="194" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="320" y1="166" x2="400" y2="194" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="182" font-size="11" fill="#b85450" font-weight="bold">+1 条有向边</text>

  <!-- ===== Left: Case A in-degree 2 ===== -->
  <rect x="30" y="200" width="240" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情形 A：某节点入度 = 2</text>
  <text x="150" y="236" text-anchor="middle" font-size="10.5" fill="#666">v 有两个父节点，删其一</text>

  <circle cx="80" cy="272" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="277" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="272" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="277" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="150" cy="350" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="355" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <line x1="92" y1="286" x2="138" y2="336" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="208" y1="286" x2="162" y2="336" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="328" font-size="9.5" fill="#446688">[1,3]</text>
  <text x="190" y="328" font-size="9.5" fill="#b85450" font-weight="bold">[2,3]</text>
  <text x="150" y="386" text-anchor="middle" font-size="10.5" fill="#444">cand1=[1,3]（先）</text>
  <text x="150" y="400" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">cand2=[2,3]（后，先试）</text>
  <text x="150" y="414" text-anchor="middle" font-size="10" fill="#888">先试删 cand2，无环即返</text>

  <!-- ===== Right: Case B cycle ===== -->
  <rect x="290" y="200" width="240" height="220" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情形 B：存在有向环</text>
  <text x="410" y="236" text-anchor="middle" font-size="10.5" fill="#666">每点入度 1，但环上闭路</text>

  <circle cx="350" cy="282" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="470" cy="282" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="470" cy="358" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="363" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="350" cy="358" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="363" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <line x1="365" y1="282" x2="455" y2="282" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="470" y1="297" x2="470" y2="343" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="455" y1="358" x2="365" y2="358" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="350" y1="343" x2="350" y2="297" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="274" text-anchor="middle" font-size="9.5" fill="#666">1→2</text>
  <text x="488" y="324" font-size="9.5" fill="#666">2→3</text>
  <text x="412" y="376" text-anchor="middle" font-size="9.5" fill="#666">3→4</text>
  <text x="330" y="324" font-size="9.5" fill="#b85450" font-weight="bold">[4,1]</text>
  <text x="410" y="394" text-anchor="middle" font-size="10.5" fill="#444">并查集抓「已同根」</text>
  <text x="410" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回环上最后出现的边</text>
</svg>
