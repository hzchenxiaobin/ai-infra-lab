<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：好 ⟺ OR = 最大值 ⟺ 所有位被最大值罩住</text>

  <rect x="16" y="34" width="146" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="89" y="55" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">OR = 某个在场元素</text>

  <path d="M 164 51 L 184 51" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="186" y="34" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="55" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">OR = max（最大值）</text>

  <path d="M 328 51 L 348 51" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="34" width="156" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="48" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">所有元素的位</text>
  <text x="428" y="62" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⊆ bits(max)</text>

  <rect x="16" y="80" width="236" height="124" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="98" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[2,3]：OR = 3　好 ✓</text>

  <text x="86" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4</text>
  <text x="116" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="146" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>

  <text x="66" y="138" text-anchor="end" font-size="9.5" fill="#333" filter="url(#rough2)">2 →</text>
  <rect x="73" y="126" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="103" y="126" width="26" height="18" rx="4" fill="#446688" stroke="#33506b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="139" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="133" y="126" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>

  <text x="66" y="160" text-anchor="end" font-size="9.5" fill="#333" filter="url(#rough2)">3 →</text>
  <rect x="73" y="148" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="161" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="103" y="148" width="26" height="18" rx="4" fill="#446688" stroke="#33506b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="161" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="133" y="148" width="26" height="18" rx="4" fill="#446688" stroke="#33506b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="161" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>

  <text x="66" y="182" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">OR →</text>
  <rect x="73" y="170" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="183" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="103" y="170" width="26" height="18" rx="4" fill="#4a7a3a" stroke="#2f5d24" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="116" y="183" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="133" y="170" width="26" height="18" rx="4" fill="#4a7a3a" stroke="#2f5d24" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="183" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <text x="170" y="183" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= 3</text>

  <text x="134" y="200" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">bits(2) ⊆ bits(3)：OR 没长出新位</text>

  <rect x="268" y="80" width="236" height="124" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="386" y="98" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">[4,2]：OR = 6　坏 ✗</text>

  <text x="338" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4</text>
  <text x="368" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="398" y="114" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>

  <text x="318" y="138" text-anchor="end" font-size="9.5" fill="#333" filter="url(#rough2)">4 →</text>
  <rect x="325" y="126" width="26" height="18" rx="4" fill="#446688" stroke="#33506b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="139" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="355" y="126" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="368" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="385" y="126" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>

  <text x="318" y="160" text-anchor="end" font-size="9.5" fill="#333" filter="url(#rough2)">2 →</text>
  <rect x="325" y="148" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="161" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="355" y="148" width="26" height="18" rx="4" fill="#d6a040" stroke="#8a6d1f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="368" y="161" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="385" y="148" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="161" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>

  <text x="318" y="182" text-anchor="end" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">OR →</text>
  <rect x="325" y="170" width="26" height="18" rx="4" fill="#446688" stroke="#a0433f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="183" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="355" y="170" width="26" height="18" rx="4" fill="#d6a040" stroke="#a0433f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="183" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="385" y="170" width="26" height="18" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="183" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="422" y="183" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">= 6</text>

  <text x="386" y="200" text-anchor="middle" font-size="8.5" fill="#a0433f" filter="url(#rough2)">位2（来自4）、位1（来自2）逃出 → 6 ∉ {4,2}</text>

  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">每个好子数组归「最左最大值」——贡献计数（示例 [4,2,3]）</text>

  <rect x="190" y="238" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="256" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="235" y="238" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="256" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280" y="238" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="210" y="276" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="255" y="276" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="300" y="276" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=2</text>

  <rect x="16" y="286" width="156" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="300" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i=0：贡献 1</text>
  <text x="94" y="314" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">子数组 [4]</text>

  <rect x="182" y="286" width="156" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i=1：贡献 1</text>
  <text x="260" y="314" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">子数组 [2]</text>

  <rect x="348" y="286" width="156" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="300" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i=2：贡献 2</text>
  <text x="426" y="314" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">子数组 [3]、[2,3]</text>

  <rect x="16" y="330" width="150" height="22" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="91" y="345" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献 = (i−L+1)(R−i+1)</text>

  <rect x="185" y="330" width="150" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合计 1+1+2 = 4 ✓</text>

  <rect x="354" y="330" width="150" height="22" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="429" y="345" text-anchor="middle" font-size="8.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">总和 ≤ n(n+1)/2 → 64 位</text>
</svg>
