<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3 层 BFS 收集 + 末尾翻转</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">root = [3,9,20,null,null,15,7] → 输出 [[15,7],[9,20],[3]]</text>

  <!-- ===== Tree (top-left) ===== -->
  <text x="30" y="68" font-size="10" fill="#446688" font-weight="bold">二叉树</text>
  <g font-size="10">
    <circle cx="80" cy="84" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="80" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <circle cx="52" cy="128" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="52" y="132" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <circle cx="118" cy="128" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="118" y="132" text-anchor="middle" fill="#4a7a3a" font-weight="bold">20</text>
    <line x1="72" y1="94" x2="60" y2="118" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="88" y1="94" x2="110" y2="118" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="100" cy="170" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="100" y="174" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <circle cx="140" cy="170" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="140" y="174" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="112" y1="138" x2="102" y2="160" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="124" y1="138" x2="138" y2="160" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- ===== Walkthrough table ===== -->
  <text x="200" y="68" font-size="10" fill="#446688" font-weight="bold">逐层演算（BFS 正序收集）</text>

  <!-- table header -->
  <g font-size="9" fill="#555">
    <rect x="190" y="78" width="330" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="200" y="92" font-weight="bold">轮次</text>
    <text x="240" y="92" font-weight="bold">队列初始</text>
    <text x="305" y="92" font-weight="bold">size</text>
    <text x="335" y="92" font-weight="bold">出队 / 入队</text>
    <text x="450" y="92" font-weight="bold">level</text>
    <text x="500" y="92" font-weight="bold">result</text>
  </g>

  <!-- row 1 -->
  <g font-size="9" fill="#333">
    <rect x="190" y="98" width="330" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="200" y="112" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="112">[3]</text>
    <text x="305" y="112">1</text>
    <text x="335" y="112">出 3 → 入 9, 20</text>
    <text x="450" y="112" fill="#b85450" font-weight="bold">[3]</text>
    <text x="500" y="112">[[3]]</text>
  </g>

  <!-- row 2 -->
  <g font-size="9" fill="#333">
    <rect x="190" y="120" width="330" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="200" y="134" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="240" y="134">[9, 20]</text>
    <text x="305" y="134">2</text>
    <text x="335" y="134">出 9 → 入 ∅; 出 20 → 入 15, 7</text>
    <text x="450" y="134" fill="#4a7a3a" font-weight="bold">[9, 20]</text>
    <text x="500" y="134">[[3],[9,20]]</text>
  </g>

  <!-- row 3 -->
  <g font-size="9" fill="#333">
    <rect x="190" y="142" width="330" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="200" y="156" fill="#d6a040" font-weight="bold">3</text>
    <text x="240" y="156">[15, 7]</text>
    <text x="305" y="156">2</text>
    <text x="335" y="156">出 15 → ∅; 出 7 → ∅</text>
    <text x="450" y="156" fill="#d6a040" font-weight="bold">[15, 7]</text>
    <text x="500" y="156">[[3],[9,20],[15,7]]</text>
  </g>

  <!-- row 4: queue empty -->
  <g font-size="9" fill="#333">
    <rect x="190" y="164" width="330" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="200" y="176" fill="#888">4</text>
    <text x="240" y="176" fill="#888">[]</text>
    <text x="305" y="176" fill="#888">—</text>
    <text x="335" y="176" fill="#888">队列空，BFS 结束</text>
    <text x="450" y="176" fill="#888">—</text>
    <text x="500" y="176" fill="#888">（待翻转）</text>
  </g>

  <!-- reverse step -->
  <path d="M 355 196 L 355 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="208" font-size="10" fill="#b85450" font-weight="bold">reverse(result)</text>

  <rect x="190" y="216" width="330" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="234" font-size="10" fill="#b85450" font-weight="bold">翻转</text>
  <text x="240" y="234" font-size="9" fill="#333">外层列表首尾互换：</text>
  <text x="450" y="234" font-family="monospace" font-size="9" fill="#b85450" font-weight="bold">[[15,7],[9,20],[3]]</text>

  <!-- ===== Before / After comparison ===== -->
  <text x="30" y="266" font-size="10" fill="#446688" font-weight="bold">翻转前后对比</text>

  <rect x="30" y="276" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="294" font-size="10" fill="#446688" font-weight="bold">翻转前（同 102）</text>
  <text x="40" y="312" font-family="monospace" font-size="10" fill="#333">[[3], [9,20], [15,7]]</text>
  <text x="40" y="322" font-size="8" fill="#888">顶层 L0 在前 → 自顶向下</text>

  <path d="M 275 300 L 295 300" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="276" width="240" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="294" font-size="10" fill="#b85450" font-weight="bold">翻转后（107 要求）</text>
  <text x="310" y="312" font-family="monospace" font-size="10" fill="#333">[[15,7], [9,20], [3]]</text>
  <text x="310" y="322" font-size="8" fill="#888">底层 L2 在前 → 自底向上</text>

  <!-- ===== Note ===== -->
  <rect x="30" y="340" width="510" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="42" y="358" font-size="10" fill="#4a7a3a" font-weight="bold">注意：翻转只动「外层」列表顺序，每个内层子列表 [9,20] 仍保持左→右原序</text>
  <text x="42" y="374" font-size="9" fill="#555">题面要求「自底向上，每层从左到右」—— 左→右 由 BFS 入队顺序（先 left 后 right）保证，</text>
  <text x="42" y="386" font-size="9" fill="#555">底→顶 由末尾整体 reverse 保证。两个维度独立，互不干扰。</text>
</svg>
