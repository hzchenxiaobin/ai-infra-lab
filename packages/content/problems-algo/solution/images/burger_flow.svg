<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="500" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">判定流程：O(1) 数学解法</text>

  <!-- Start -->
  <rect x="150" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 T, C</text>
  <path d="M 230 86 L 230 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond 1: T even? -->
  <polygon points="230,108 350,160 230,212 110,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T % 2 == 0 ?</text>
  <text x="230" y="174" text-anchor="middle" font-size="10" fill="#777">番茄为偶数？</text>

  <!-- No -> [] -->
  <path d="M 110 160 L 50 160 L 50 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="58" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="14" y="234" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="259" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return []</text>

  <!-- Yes -> next -->
  <path d="M 350 160 L 410 160 L 410 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="364" y="152" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Diamond 2: range? -->
  <polygon points="230,224 350,276 230,328 110,276" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="272" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2C ≤ T ≤ 4C ?</text>
  <text x="230" y="290" text-anchor="middle" font-size="10" fill="#777">番茄在可行区间？</text>

  <!-- No -> [] -->
  <path d="M 110 276 L 50 276 L 50 336" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="58" y="268" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="14" y="340" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="365" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return []</text>

  <!-- Yes -> compute -->
  <path d="M 350 276 L 410 276 L 410 336" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="364" y="268" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- compute box -->
  <rect x="110" y="340" width="300" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x = (T − 2C) / 2</text>
  <text x="260" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y = (4C − T) / 2</text>
  <text x="260" y="397" text-anchor="middle" font-size="10" fill="#888">两式均自动为非负整数</text>

  <path d="M 260 406 L 260 422" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="150" y="426" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="453" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">return [x, y]</text>

  <text x="230" y="488" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">全程 O(1) 时间 / O(1) 空间，无循环无搜索</text>
</svg>
