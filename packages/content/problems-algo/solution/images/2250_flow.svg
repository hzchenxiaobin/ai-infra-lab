<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：按高度分桶 + 桶内排序 + 逐桶二分计数</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">预处理 O(n log n) · 查询 O(100 · log n) · 总计 O((n + 100m) log n)</text>

  <!-- Step 1: Bucket -->
  <rect x="60" y="54" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="11" fill="#333">① 分桶：byHeight[h].append(l)  ← h ∈ [1, 100]，共 100 个桶</text>
  <path d="M 260 84 L 260 94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Sort each bucket -->
  <rect x="60" y="96" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#333">② 桶内排序：sort(byHeight[h])  ← 每个 h 的 l 列表升序</text>
  <path d="M 260 126 L 260 136" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: For each point -->
  <rect x="60" y="138" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#333">③ for each point (xⱼ, yⱼ)：cnt = 0  ←────────────┐</text>
  <path d="M 260 168 L 260 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Loop h from yj to 100 -->
  <rect x="60" y="180" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#333">④ for h = yⱼ to 100：  ← 至多 100 次迭代  ────┐</text>
  <path d="M 260 210 L 260 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Binary search -->
  <rect x="40" y="222" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ idx = lower_bound(byHeight[h], xⱼ)  ← 首个 l ≥ xⱼ 的位置</text>
  <path d="M 260 254 L 260 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Accumulate -->
  <rect x="60" y="266" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑥ cnt += len(byHeight[h]) − idx  ← 该桶中 l ≥ xⱼ 的个数</text>
  <path d="M 260 296 L 260 306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: Loop back h -->
  <rect x="60" y="308" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="#333">⑦ h 还有? ── Y ── 回到 ④ ──────────────────────┘</text>

  <!-- Loop-back arrow (right side, h loop) -->
  <path d="M 460 321 L 490 321 L 490 194 L 460 194" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 260 336 L 260 346" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 8: Record answer -->
  <rect x="60" y="348" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑧ ans[j] = cnt  ← 该点被包含的矩形数</text>

  <!-- Loop-back arrow (right side, point loop) -->
  <path d="M 460 362 L 505 362 L 505 152 L 460 152" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Side annotations -->
  <text x="48" y="114" font-size="9" fill="#446688">预处理</text>
  <text x="48" y="241" font-size="9" fill="#4a7a3a">二分</text>
  <text x="48" y="284" font-size="9" fill="#4a7a3a">计数</text>
  <text x="48" y="366" font-size="9" fill="#4a7a3a">输出</text>

  <!-- Footer -->
  <text x="260" y="392" text-anchor="middle" font-size="10" fill="#888">黄=循环 | 绿=核心操作 | 虚线箭头=循环回边</text>
</svg>
