<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：cnt = MAX(cnt) 等值筛选——并列冠军一个不漏</text>

  <!-- ① 左：分组计数 T 表 -->
  <text x="94" y="50" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① GROUP BY 计数 → T</text>

  <rect x="24" y="56" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dep_id</text>
  <text x="129" y="73" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>

  <rect x="24" y="82" width="140" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="129" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="24" y="108" width="140" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>
  <text x="129" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="24" y="134" width="140" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">107</text>
  <text x="129" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="24" y="160" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="59" y="177" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">MAX(cnt)</text>
  <text x="129" y="177" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">4</text>

  <line x1="94" y1="56" x2="94" y2="186" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="24" y="56" width="140" height="130" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- ② 中：柱状图 + 阈值线 -->
  <text x="272" y="50" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">② 阈值线：MAX = 4</text>

  <line x1="196" y1="100" x2="348" y2="100" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="272" y="90" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">MAX(cnt) = 4</text>

  <rect x="204" y="100" width="36" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="252" y="100" width="36" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="300" y="126" width="36" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="144" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="196" y1="204" x2="348" y2="204" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="270" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">101</text>
  <text x="318" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">107</text>

  <text x="222" y="238" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="318" y="238" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- ③ 右：回连取经理 -->
  <text x="436" y="50" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 回连取经理</text>

  <rect x="372" y="56" width="128" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="76" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">JOIN Employees</text>
  <text x="436" y="94" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ON dep_id 相等</text>
  <text x="436" y="112" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">AND position='Manager'</text>
  <line x1="384" y1="122" x2="488" y2="122" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="140" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Joseph — 100</text>
  <text x="436" y="158" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Isabella — 101</text>
  <text x="436" y="178" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">ORDER BY dep_id ↑</text>

  <path d="M 166 120 C 176 118, 186 116, 194 114" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 350 120 L 368 120" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 底部：陷阱 vs 正解 -->
  <rect x="24" y="258" width="228" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="280" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">陷阱写法：排序截断</text>
  <text x="138" y="302" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">ORDER BY cnt DESC LIMIT 1</text>
  <text x="138" y="322" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">→ 只剩一行，100 与 101 丢一个</text>
  <text x="138" y="340" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 并列冠军被静默丢弃</text>

  <rect x="272" y="258" width="224" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="384" y="280" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 正解：等值筛选</text>
  <text x="384" y="302" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">WHERE cnt = (SELECT MAX(cnt) FROM T)</text>
  <text x="384" y="322" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">→ 100、101 两个冠军全保留</text>
  <text x="384" y="340" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">并列 Argmax 的唯一安全写法</text>

  <path d="M 336 244 C 348 250, 358 254, 366 258" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
</svg>
