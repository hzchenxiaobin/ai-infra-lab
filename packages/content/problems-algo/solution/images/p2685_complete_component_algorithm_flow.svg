<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="510" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集统计完全连通分量 · 算法流程</text>

  <!-- 1: init union-find -->
  <rect x="130" y="44" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化并查集 parent[i]=i</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">nodeCnt[]、edgeCnt[] 置零</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2: union all edges -->
  <rect x="90" y="104" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 edges，对每条 (a,b) 执行 union(a,b)</text>
  <text x="270" y="140" text-anchor="middle" font-size="10.5" fill="#666">把每条边两端并到同一集合（同一连通分量）</text>
  <line x1="270" y1="152" x2="270" y2="172" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3: count nodes per root -->
  <rect x="70" y="172" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 0..n−1：nodeCnt[find(i)]++</text>
  <text x="270" y="208" text-anchor="middle" font-size="10.5" fill="#666">按根分组，统计每个连通分量的节点数 m</text>
  <line x1="270" y1="220" x2="270" y2="240" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4: count edges per root -->
  <rect x="70" y="240" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 edges：edgeCnt[find(a)]++</text>
  <text x="270" y="276" text-anchor="middle" font-size="10.5" fill="#666">每条边归入其所在分量的根，统计边数 e</text>
  <line x1="270" y1="288" x2="270" y2="308" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5: check each root -->
  <rect x="60" y="308" width="420" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对每个根 r（find(r)==r）</text>
  <text x="270" y="345" text-anchor="middle" font-size="11" fill="#333">m = nodeCnt[r]，e = edgeCnt[r]</text>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若 e == m(m−1)/2 → ans++</text>
  <line x1="270" y1="370" x2="270" y2="390" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6: answer -->
  <rect x="130" y="390" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="415" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- insight box -->
  <rect x="50" y="446" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="270" y="466" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">为何只需数边？完全图 K_m 恰有 C(m,2)=m(m−1)/2 条边</text>
  <text x="270" y="482" text-anchor="middle" font-size="10.5" fill="#666">连通分量已有 m 个节点，边数达标即每对都有边</text>
</svg>
