<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="920" height="520" fill="#fafafa"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Floyd 快慢指针：两阶段流程</text>
  <path d="M 320 48 Q 460 56 600 48" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：阶段一 -->
  <text x="230" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">阶段一：找相遇点</text>

  <!-- 起点框 -->
  <g filter="url(#sk)">
    <rect x="135" y="100" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="230" y="125" text-anchor="middle" font-size="13" fill="#333">slow = 0, fast = 0</text>

  <!-- 步进框 -->
  <path d="M 230 142 L 230 168" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="110" y="172" width="240" height="56" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="230" y="194" text-anchor="middle" font-size="12" fill="#333">slow = nums[slow]   （走 1 步）</text>
  <text x="230" y="214" text-anchor="middle" font-size="12" fill="#333">fast = nums[nums[fast]]（走 2 步）</text>

  <!-- 判断菱形 -->
  <path d="M 230 230 L 230 256" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 230 260 L 330 300 L 230 340 L 130 300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="230" y="297" text-anchor="middle" font-size="12" fill="#333">slow == fast ?</text>
  <text x="230" y="314" text-anchor="middle" font-size="11" fill="#888">（在环内相遇）</text>

  <!-- No 回环 -->
  <path d="M 130 300 L 70 300 L 70 200 L 108 200" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="62" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- Yes 向右到阶段二 -->
  <path d="M 330 300 L 430 300" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="380" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- 右：阶段二 -->
  <text x="700" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">阶段二：找环入口</text>

  <!-- 重置框 -->
  <g filter="url(#sk)">
    <rect x="600" y="278" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="700" y="298" text-anchor="middle" font-size="13" fill="#333">slow = 0（回起点）</text>
  <text x="700" y="314" text-anchor="middle" font-size="11" fill="#888">fast 留在相遇点</text>

  <!-- 同速步进框 -->
  <path d="M 700 324 L 700 356" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="580" y="360" width="240" height="48" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="700" y="389" text-anchor="middle" font-size="12" fill="#333">slow = nums[slow]；fast = nums[fast]</text>
  <text x="700" y="403" text-anchor="middle" font-size="10" fill="#888">（两者都走 1 步，同速）</text>

  <!-- 判断菱形 -->
  <path d="M 700 410 L 700 432" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 700 436 L 790 466 L 700 496 L 610 466 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="700" y="463" text-anchor="middle" font-size="12" fill="#333">slow == fast ?</text>
  <text x="700" y="479" text-anchor="middle" font-size="11" fill="#888">（到达环入口）</text>

  <!-- No 回环 -->
  <path d="M 610 466 L 540 466 L 540 384 L 578 384" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="546" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- Yes 返回结果 -->
  <path d="M 790 466 L 850 466" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="820" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="820" y="480" width="92" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="866" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 slow</text>
</svg>
