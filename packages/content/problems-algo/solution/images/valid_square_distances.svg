<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：4 个点 → C(4,2) = 6 条两两距离</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">正方形把这 6 条距离分成两组：4 条边 + 2 条对角线</text>

  <!-- Square: A(150,90) B(370,90) C(370,290) D(150,290) -->
  <!-- diagonals (drawn first, under sides) -->
  <line x1="150" y1="90" x2="370" y2="290" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7,4" filter="url(#rough2)"/>
  <line x1="370" y1="90" x2="150" y2="290" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7,4" filter="url(#rough2)"/>

  <!-- sides (blue) -->
  <line x1="150" y1="90" x2="370" y2="90" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="370" y1="90" x2="370" y2="290" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="370" y1="290" x2="150" y2="290" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="150" y1="290" x2="150" y2="90" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- vertices -->
  <circle cx="150" cy="90" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="90" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="290" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="290" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- vertex labels -->
  <text x="138" y="84" text-anchor="end" font-size="12" fill="#333" font-weight="bold">p1</text>
  <text x="382" y="84" font-size="12" fill="#333" font-weight="bold">p2</text>
  <text x="382" y="304" font-size="12" fill="#333" font-weight="bold">p3</text>
  <text x="138" y="304" text-anchor="end" font-size="12" fill="#333" font-weight="bold">p4</text>

  <!-- side length labels -->
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">边 s</text>
  <text x="384" y="194" font-size="12" fill="#446688" font-weight="bold">边 s</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">边 s</text>
  <text x="136" y="194" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">边 s</text>

  <!-- diagonal labels -->
  <text x="244" y="200" font-size="12" fill="#d6a040" font-weight="bold" transform="rotate(48 244 200)">对角线 d</text>
  <text x="276" y="180" font-size="12" fill="#d6a040" font-weight="bold" transform="rotate(-48 276 180)">对角线 d</text>

  <!-- right angle mark at A -->
  <path d="M 150 104 L 164 104 L 164 90" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- key idea box -->
  <rect x="30" y="320" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="341" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6 条距离 = {s, s, s, s, d, d}（仅 2 种值）</text>
  <text x="270" y="358" text-anchor="middle" font-size="11.5" fill="#446688">且 d² = 2·s²（勾股定理，直角自动满足）</text>
</svg>
