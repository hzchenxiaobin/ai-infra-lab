<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四类输入的判定</text>

  <!-- ===== Case 1: n=16 (true) ===== -->
  <text x="40" y="56" font-size="11.5" fill="#4a7a3a" font-weight="bold">例1: n=16</text>
  <!-- n = 10000 -->
  <rect x="150" y="42" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="59" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="188" y="42" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206" y="59" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="226" y="42" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="244" y="59" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="264" y="42" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="59" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="302" y="42" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="346" y="56" font-size="10.5" fill="#888">n（单 1）</text>

  <path d="M 168 66 Q 168 72 168 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="76" font-size="10" fill="#888">−1</text>

  <!-- n-1 = 01111 -->
  <rect x="150" y="82" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="99" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="188" y="82" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="99" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="226" y="82" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="99" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="264" y="82" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="282" y="99" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="302" y="82" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="99" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="346" y="96" font-size="10.5" fill="#888">n−1=15</text>

  <line x1="150" y1="110" x2="338" y2="110" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="114" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">&amp;</text>

  <!-- result = 00000 -->
  <rect x="150" y="116" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="188" y="116" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="226" y="116" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="264" y="116" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="282" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="302" y="116" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="133" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="346" y="133" font-size="11" fill="#4a7a3a" font-weight="bold">→ true ✓</text>

  <!-- divider -->
  <line x1="40" y1="150" x2="500" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Case 2: n=18 (false) ===== -->
  <text x="40" y="172" font-size="11.5" fill="#b85450" font-weight="bold">例2: n=18</text>
  <!-- n = 10010 -->
  <rect x="150" y="158" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="175" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="188" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206" y="175" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="226" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="244" y="175" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="264" y="158" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="175" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="302" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="175" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="346" y="172" font-size="10.5" fill="#b85450" font-weight="bold">n（两个 1）</text>

  <path d="M 168 182 Q 168 188 168 194" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="192" font-size="10" fill="#888">−1</text>

  <!-- n-1 = 10001 -->
  <rect x="150" y="198" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="215" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="188" y="198" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="215" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="226" y="198" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="215" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="264" y="198" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="282" y="215" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="302" y="198" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="215" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="346" y="212" font-size="10.5" fill="#888">n−1=17</text>

  <line x1="150" y1="226" x2="338" y2="226" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="230" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">&amp;</text>

  <!-- result = 10000 (remaining 1) -->
  <rect x="150" y="232" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="249" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="188" y="232" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206" y="249" text-anchor="middle" font-size="12.5" fill="#4a7a3a">0</text>
  <rect x="226" y="232" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="244" y="249" text-anchor="middle" font-size="12.5" fill="#4a7a3a">0</text>
  <rect x="264" y="232" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="249" text-anchor="middle" font-size="12.5" fill="#4a7a3a">0</text>
  <rect x="302" y="232" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="249" text-anchor="middle" font-size="12.5" fill="#4a7a3a">0</text>
  <text x="346" y="246" font-size="10.5" fill="#b85450" font-weight="bold">剩一个 1 ≠ 0</text>
  <text x="346" y="258" font-size="11" fill="#b85450" font-weight="bold">→ false ✗</text>

  <!-- divider -->
  <line x1="40" y1="266" x2="500" y2="266" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Case 3: n=0 ===== -->
  <text x="40" y="288" font-size="11.5" fill="#b85450" font-weight="bold">例3: n=0</text>
  <rect x="150" y="274" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n &gt; 0 不满足 → false（0 不是 2 的幂）</text>

  <!-- ===== Case 4: n=-16 ===== -->
  <text x="40" y="324" font-size="11.5" fill="#b85450" font-weight="bold">例4: n=−16</text>
  <rect x="150" y="310" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n &gt; 0 不满足 → false（2^x 恒正，负数必非 2 的幂）</text>

  <!-- bottom note -->
  <rect x="60" y="350" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两道关：① n &gt; 0   ② n &amp; (n−1) == 0，缺一不可</text>
</svg>
