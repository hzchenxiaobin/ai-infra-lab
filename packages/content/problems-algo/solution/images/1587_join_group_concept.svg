<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：JOIN 关联 → GROUP BY 求和 → HAVING 过滤</text>

  <!-- ===== Users table (left) ===== -->
  <text x="50" y="52" font-size="10" fill="#888">Users（账户名册）</text>
  <rect x="40" y="58" width="140" height="92" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="9" fill="#446688" font-weight="bold">account   name</text>
  <line x1="40" y1="80" x2="180" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="84" width="136" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="98" font-size="9" fill="#446688" font-weight="bold">900001   Alice</text>
  <text x="50" y="118" font-size="9" fill="#666">900002   Bob</text>
  <text x="50" y="138" font-size="9" fill="#666">900003   Charlie</text>

  <!-- ===== Transactions table (right) ===== -->
  <text x="380" y="52" font-size="10" fill="#888">Transactions（交易流水）</text>
  <rect x="350" y="58" width="200" height="196" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="74" font-size="9" fill="#446688" font-weight="bold">trans  account  amount</text>
  <line x1="350" y1="80" x2="550" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="352" y="84" width="196" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="98" font-size="9" fill="#446688" font-weight="bold">1    900001   +7000</text>
  <rect x="352" y="104" width="196" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="118" font-size="9" fill="#446688" font-weight="bold">2    900001   +7000</text>
  <rect x="352" y="124" width="196" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="138" font-size="9" fill="#446688" font-weight="bold">3    900001   -3000</text>
  <text x="360" y="158" font-size="9" fill="#666">4    900002   +1000</text>
  <rect x="352" y="164" width="196" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="178" font-size="9" fill="#446688" font-weight="bold">5    900001   +6000</text>
  <rect x="352" y="184" width="196" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="198" font-size="9" fill="#4a7a3a">6    900003   +6000</text>
  <rect x="352" y="204" width="196" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="218" font-size="9" fill="#4a7a3a">7    900003   +6000</text>
  <rect x="352" y="224" width="196" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="360" y="238" font-size="9" fill="#4a7a3a">8    900003   -4000</text>

  <!-- ===== JOIN arrows (account match) ===== -->
  <!-- Alice -> t1,t2,t3,t5 -->
  <path d="M 180 96 C 270 96, 270 96, 350 96" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 96 C 270 96, 270 116, 350 116" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 96 C 270 96, 270 136, 350 136" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 96 C 270 96, 270 176, 350 176" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" opacity="0.7"/>
  <!-- Bob -> t4 -->
  <path d="M 180 116 C 270 116, 270 156, 350 156" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.5"/>
  <!-- Charlie -> t6,t7,t8 -->
  <path d="M 180 136 C 270 136, 270 196, 350 196" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 136 C 270 136, 270 216, 350 216" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 180 136 C 270 136, 270 236, 350 236" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>

  <text x="220" y="48" font-size="9" fill="#888">JOIN ON account</text>

  <!-- ===== Arrow down to GROUP BY ===== -->
  <path d="M 290 262 L 290 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== GROUP BY + SUM box ===== -->
  <rect x="120" y="282" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY account, name</text>
  <text x="290" y="316" text-anchor="middle" font-size="9" fill="#888">SUM(amount) AS balance</text>

  <!-- Arrow down -->
  <path d="M 290 328 L 290 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== HAVING decision ===== -->
  <polygon points="290,346 420,386 290,426 160,386" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">HAVING</text>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#d6a040">SUM &gt; 10000?</text>

  <!-- No branch (left) -->
  <path d="M 160 386 L 110 386" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="380" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="30" y="372" width="78" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="392" text-anchor="middle" font-size="9" fill="#b85450">丢弃</text>

  <!-- Yes branch (right) -->
  <path d="M 420 386 L 470 386" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="472" y="370" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="522" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Alice</text>
  <text x="522" y="400" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">17000</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="432" width="520" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="448" text-anchor="middle" font-size="10" fill="#d6a040">每笔交易直接归属一个 account → JOIN 即可关联，无需 UNION ALL 拆分</text>

  <!-- Legend -->
  <rect x="200" y="150" width="150" height="42" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="210" y="164" font-size="8" fill="#446688">蓝：Alice 的 4 笔交易</text>
  <text x="210" y="176" font-size="8" fill="#666">灰：Bob 的 1 笔交易</text>
  <text x="210" y="188" font-size="8" fill="#4a7a3a">绿：Charlie 的 3 笔交易</text>
</svg>
