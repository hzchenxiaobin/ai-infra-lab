<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两层 DFS：遍历 root + isSame 判定</text>

  <!-- ============ Left: isSubtree traversal ============ -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">isSubtree(node, sub)</text>

  <!-- entry -->
  <rect x="60" y="62" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">访问 node</text>
  <line x1="130" y1="94" x2="130" y2="112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: node==null -->
  <polygon points="130,114 188,144 130,174 72,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="11" fill="#333">node</text>
  <text x="130" y="155" text-anchor="middle" font-size="11" fill="#333">== null?</text>
  <!-- yes -> return false -->
  <line x1="188" y1="144" x2="218" y2="144" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="138" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="222" y="128" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return false</text>

  <!-- no down -->
  <line x1="130" y1="174" x2="130" y2="192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="186" font-size="10" fill="#b85450">否</text>

  <!-- call isSame -->
  <rect x="44" y="194" width="172" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">isSame(node, sub) ?</text>
  <line x1="130" y1="228" x2="130" y2="246" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: isSame -->
  <polygon points="130,248 188,278 130,308 72,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="283" text-anchor="middle" font-size="11" fill="#333">相同?</text>
  <!-- yes -> return true -->
  <line x1="188" y1="278" x2="218" y2="278" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="272" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="222" y="262" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="268" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- no down -> recurse -->
  <line x1="130" y1="308" x2="130" y2="326" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="320" font-size="10" fill="#b85450">否</text>

  <rect x="28" y="328" width="204" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="346" text-anchor="middle" font-size="10" fill="#333">return isSubtree(left, sub)</text>
  <text x="130" y="361" text-anchor="middle" font-size="10" fill="#333">   || isSubtree(right, sub)</text>

  <!-- ============ Right: isSame helper ============ -->
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">isSame(a, b)</text>

  <rect x="355" y="62" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 a, b</text>
  <line x1="425" y1="94" x2="425" y2="112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond a==null || b==null -->
  <polygon points="425,114 495,150 425,186 355,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="146" text-anchor="middle" font-size="10" fill="#333">a,b</text>
  <text x="425" y="161" text-anchor="middle" font-size="10" fill="#333">有空?</text>
  <line x1="495" y1="150" x2="525" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="144" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="500" y="134" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="528" y="148" text-anchor="middle" font-size="9" fill="#b85450">return</text>
  <text x="528" y="160" text-anchor="middle" font-size="9" fill="#b85450">a==b</text>

  <line x1="425" y1="186" x2="425" y2="204" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="198" font-size="10" fill="#b85450">否</text>

  <!-- a.val != b.val -->
  <polygon points="425,206 495,242 425,278 355,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="238" text-anchor="middle" font-size="10" fill="#333">a.val</text>
  <text x="425" y="253" text-anchor="middle" font-size="10" fill="#333">!= b.val?</text>
  <line x1="495" y1="242" x2="525" y2="242" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="236" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="500" y="226" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="528" y="246" text-anchor="middle" font-size="9" fill="#b85450">return</text>

  <line x1="425" y1="278" x2="425" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="290" font-size="10" fill="#b85450">否</text>

  <!-- recurse both -->
  <rect x="345" y="298" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="316" text-anchor="middle" font-size="10" fill="#333">return isSame(a.l,b.l)</text>
  <text x="425" y="332" text-anchor="middle" font-size="10" fill="#333">&amp;&amp; isSame(a.r,b.r)</text>

  <!-- divider -->
  <line x1="328" y1="48" x2="328" y2="372" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="382" width="480" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="393" text-anchor="middle" font-size="9" fill="#555">外层遍历 root 每个 node，内层 isSame 做结构与值的完全比对</text>
</svg>
