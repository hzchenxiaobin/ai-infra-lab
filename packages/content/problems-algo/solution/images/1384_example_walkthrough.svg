<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每个销售期按年拆分 → 重叠天数 × 日均</text>

  <!-- year column backgrounds (full height band) -->
  <!-- 2018: x 95-215, 2019: x 225-345, 2020: x 355-475 -->
  <rect x="95" y="44" width="120" height="206" fill="#e8f0fe" opacity="0.35" stroke="none" filter="url(#rough2)"/>
  <rect x="225" y="44" width="120" height="206" fill="#e6f4ea" opacity="0.35" stroke="none" filter="url(#rough2)"/>
  <rect x="355" y="44" width="120" height="206" fill="#fff8e1" opacity="0.4" stroke="none" filter="url(#rough2)"/>

  <!-- year headers -->
  <rect x="95" y="44" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2018</text>
  <rect x="225" y="44" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2019</text>
  <rect x="355" y="44" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="59" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2020</text>

  <!-- year boundary labels -->
  <text x="155" y="78" text-anchor="middle" font-size="7.5" fill="#888">01-01 ~ 12-31</text>
  <text x="285" y="78" text-anchor="middle" font-size="7.5" fill="#888">01-01 ~ 12-31</text>
  <text x="415" y="78" text-anchor="middle" font-size="7.5" fill="#888">01-01 ~ 12-31</text>

  <!-- ============ Product 1: LC Phone ============ -->
  <text x="48" y="106" font-size="9.5" fill="#b85450" font-weight="bold">LC Phone</text>
  <text x="48" y="118" font-size="8" fill="#888">avg=100</text>
  <text x="48" y="129" font-size="7.5" fill="#888">01-25~02-28</text>
  <!-- period bar within 2019 (schematic) -->
  <rect x="232" y="98" width="58" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="111" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">period</text>
  <!-- annotation -->
  <rect x="232" y="122" width="58" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="261" y="135" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">35×100=3500</text>
  <!-- other years empty markers -->
  <text x="155" y="135" text-anchor="middle" font-size="9" fill="#ccc">—</text>
  <text x="415" y="135" text-anchor="middle" font-size="9" fill="#ccc">—</text>

  <!-- separator -->
  <path d="M40 148 L520 148" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ Product 2: LC T-Shirt ============ -->
  <text x="48" y="170" font-size="9.5" fill="#d6a040" font-weight="bold">LC T-Shirt</text>
  <text x="48" y="182" font-size="8" fill="#888">avg=10</text>
  <text x="48" y="193" font-size="7.5" fill="#888">18-12-01~</text>
  <text x="48" y="202" font-size="7.5" fill="#888">20-01-01</text>
  <!-- period bar spanning 2018(end) -> 2019(full) -> 2020(start) -->
  <rect x="200" y="162" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="175" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">period（跨 3 年）</text>
  <!-- per-year annotations -->
  <rect x="172" y="186" width="46" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="199" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">31×10=310</text>
  <rect x="232" y="186" width="106" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="199" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">365×10=3650</text>
  <rect x="352" y="186" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="199" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">1×10=10</text>

  <!-- separator -->
  <path d="M40 214 L520 214" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ Product 3: LC Keychain ============ -->
  <text x="48" y="236" font-size="9.5" fill="#4a7a3a" font-weight="bold">LC Keychain</text>
  <text x="48" y="248" font-size="8" fill="#888">avg=1</text>
  <text x="48" y="259" font-size="7.5" fill="#888">19-12-01~</text>
  <text x="48" y="268" font-size="7.5" fill="#888">20-01-31</text>
  <!-- period bar spanning 2019(end) -> 2020(start) -->
  <rect x="330" y="228" width="100" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="241" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">period（跨 2 年）</text>
  <!-- per-year annotations -->
  <text x="155" y="265" text-anchor="middle" font-size="9" fill="#ccc">—</text>
  <rect x="330" y="252" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="265" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">31×1</text>
  <rect x="356" y="252" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="381" y="265" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">31×1=31</text>

  <!-- ============ Output table ============ -->
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY product_id, report_year）</text>

  <!-- header -->
  <rect x="60" y="302" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="317" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">product_id</text>
  <rect x="140" y="302" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="317" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">product_name</text>
  <rect x="260" y="302" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="317" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">report_year</text>
  <rect x="350" y="302" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="317" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">total_amount</text>

  <!-- rows -->
  <rect x="60" y="324" width="390" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="335" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">1</text>
  <text x="200" y="335" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">LC Phone</text>
  <text x="305" y="335" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">2019</text>
  <text x="400" y="335" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">3500</text>

  <rect x="60" y="340" width="390" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="351" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="200" y="351" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">LC T-Shirt</text>
  <text x="305" y="351" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2018</text>
  <text x="400" y="351" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">310</text>

  <rect x="60" y="356" width="390" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="367" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="200" y="367" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">LC T-Shirt</text>
  <text x="305" y="367" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2019</text>
  <text x="400" y="367" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">3650</text>

  <rect x="60" y="372" width="390" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="383" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="200" y="383" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">LC T-Shirt</text>
  <text x="305" y="383" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">2020</text>
  <text x="400" y="383" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">10</text>

  <rect x="60" y="388" width="390" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="399" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="200" y="399" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">LC Keychain</text>
  <text x="305" y="399" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2019</text>
  <text x="400" y="399" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">31</text>

  <rect x="60" y="404" width="390" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="100" y="415" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="200" y="415" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">LC Keychain</text>
  <text x="305" y="415" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2020</text>
  <text x="400" y="415" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">31</text>

  <text x="475" y="335" font-size="8" fill="#b85450" font-weight="bold">← 单年期</text>
  <text x="475" y="367" font-size="8" fill="#d6a040" font-weight="bold">← 跨 3 年</text>
  <text x="475" y="415" font-size="8" fill="#4a7a3a" font-weight="bold">← 跨 2 年</text>
</svg>
