<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：入度表随每条边逐步长出来</text>

  <!-- ===== 左半：示例 1 ===== -->
  <text x="150" y="52" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：n = 3，edges = [[0,1],[1,2]]</text>

  <text x="112" y="82" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="122" y="66" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="66" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="66" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="177" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="215" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="112" y="114" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">+[0,1]</text>
  <rect x="122" y="98" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="98" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="98" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="115" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="177" y="115" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="215" y="115" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="112" y="146" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">+[1,2]</text>
  <rect x="122" y="130" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="130" width="34" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="130" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="147" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="177" y="147" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="215" y="147" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="112" y="172" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">下标 →</text>
  <text x="139" y="172" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="177" y="172" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="215" y="172" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <rect x="30" y="188" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 indeg = [0, 1, 1]</text>
  <text x="150" y="231" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">入度 0 只有队 0 → 返回 0 ✓</text>

  <!-- ===== 右半：示例 2 ===== -->
  <text x="445" y="52" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：n = 4，edges = [[0,2],[1,3],[1,2]]</text>

  <text x="352" y="82" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="360" y="66" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="66" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="66" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="66" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="412" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="448" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="484" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="352" y="114" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">+[0,2]</text>
  <rect x="360" y="98" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="98" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="98" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="98" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="115" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="412" y="115" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="448" y="115" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="484" y="115" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="352" y="146" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">+[1,3]</text>
  <rect x="360" y="130" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="130" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="130" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="130" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="147" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="412" y="147" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="448" y="147" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="484" y="147" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="352" y="178" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">+[1,2]</text>
  <rect x="360" y="162" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="162" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="162" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="162" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="179" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="412" y="179" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="448" y="179" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="484" y="179" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>

  <text x="352" y="208" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">下标 →</text>
  <text x="376" y="208" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="412" y="208" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="448" y="208" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="484" y="208" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <rect x="310" y="222" width="250" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终 indeg = [0, 0, 2, 1]</text>
  <text x="435" y="265" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">入度 0 有队 0、队 1 → 返回 −1 ✗</text>

  <!-- ===== 底部总结 ===== -->
  <rect x="25" y="300" width="530" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">恰好 1 个入度 0 → 唯一冠军；≥ 2 个 → 冠军不唯一 → 返回 −1</text>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两个入度 0 之间不可能有路径：否则路径最后一条边会让终点入度 ≥ 1，矛盾</text>
  <text x="290" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">DAG 必有入度 0（否则沿入边回走 n+1 步必重访成环）——只担心「太多」，不担心「没有」</text>
</svg>
