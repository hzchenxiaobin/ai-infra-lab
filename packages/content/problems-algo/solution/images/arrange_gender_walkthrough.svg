<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：9 行输入 → 按性别分桶排序 → 9 行输出</text>

  <!-- Left: input table -->
  <text x="60" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 Genders (9 行)</text>
  <rect x="14" y="56" width="92" height="186" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="74" font-size="9" fill="#888" font-weight="bold">id</text>
  <text x="74" y="74" font-size="9" fill="#888" font-weight="bold">gender</text>
  <line x1="14" y1="79" x2="106" y2="79" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="92" font-size="9" fill="#333">4</text><text x="74" y="92" font-size="9" fill="#b85450">male</text>
  <text x="34" y="105" font-size="9" fill="#333">7</text><text x="74" y="105" font-size="9" fill="#446688">female</text>
  <text x="34" y="118" font-size="9" fill="#333">2</text><text x="74" y="118" font-size="9" fill="#d6a040">other</text>
  <text x="34" y="131" font-size="9" fill="#333">5</text><text x="74" y="131" font-size="9" fill="#b85450">male</text>
  <text x="34" y="144" font-size="9" fill="#333">3</text><text x="74" y="144" font-size="9" fill="#446688">female</text>
  <text x="34" y="157" font-size="9" fill="#333">8</text><text x="74" y="157" font-size="9" fill="#b85450">male</text>
  <text x="34" y="170" font-size="9" fill="#333">6</text><text x="74" y="170" font-size="9" fill="#d6a040">other</text>
  <text x="34" y="183" font-size="9" fill="#333">1</text><text x="74" y="183" font-size="9" fill="#d6a040">other</text>
  <text x="34" y="196" font-size="9" fill="#333">9</text><text x="74" y="196" font-size="9" fill="#446688">female</text>

  <path d="M 112 130 L 138 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Middle: 3 buckets -->
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">按性别分桶 + 桶内排序</text>
  <!-- female bucket -->
  <rect x="140" y="58" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">female (key=1)</text>
  <text x="200" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3  7  9</text>
  <text x="200" y="106" text-anchor="middle" font-size="8" fill="#888">user_id 升序</text>

  <!-- other bucket -->
  <rect x="140" y="124" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">other (key=2)</text>
  <text x="200" y="158" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1  2  6</text>
  <text x="200" y="172" text-anchor="middle" font-size="8" fill="#888">user_id 升序</text>

  <!-- male bucket -->
  <rect x="140" y="190" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">male (key=3)</text>
  <text x="200" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4  5  8</text>
  <text x="200" y="238" text-anchor="middle" font-size="8" fill="#888">user_id 升序</text>

  <path d="M 264 140 L 290 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 206 L 290 206" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 274 L 290 274" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: output table -->
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出 (9 行)</text>
  <rect x="294" y="56" width="100" height="186" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="314" y="74" font-size="9" fill="#888" font-weight="bold">id</text>
  <text x="362" y="74" font-size="9" fill="#888" font-weight="bold">gender</text>
  <line x1="294" y1="79" x2="394" y2="79" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="314" y="92" font-size="9" fill="#333">3</text><text x="362" y="92" font-size="9" fill="#446688">female</text>
  <text x="314" y="105" font-size="9" fill="#333">7</text><text x="362" y="105" font-size="9" fill="#446688">female</text>
  <text x="314" y="118" font-size="9" fill="#333">9</text><text x="362" y="118" font-size="9" fill="#446688">female</text>
  <text x="314" y="131" font-size="9" fill="#333">1</text><text x="362" y="131" font-size="9" fill="#d6a040">other</text>
  <text x="314" y="144" font-size="9" fill="#333">2</text><text x="362" y="144" font-size="9" fill="#d6a040">other</text>
  <text x="314" y="157" font-size="9" fill="#333">6</text><text x="362" y="157" font-size="9" fill="#d6a040">other</text>
  <text x="314" y="170" font-size="9" fill="#333">4</text><text x="362" y="170" font-size="9" fill="#b85450">male</text>
  <text x="314" y="183" font-size="9" fill="#333">5</text><text x="362" y="183" font-size="9" fill="#b85450">male</text>
  <text x="314" y="196" font-size="9" fill="#333">8</text><text x="362" y="196" font-size="9" fill="#b85450">male</text>

  <!-- Bottom note -->
  <rect x="30" y="270" width="460" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 主排序键 FIELD(gender,...) 决定分组顺序</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#444">次排序键 user_id 决定组内稳定顺序</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#444">字典序会得 female,male,other ✗ — 故必须显式构造排序键</text>
  <text x="260" y="338" text-anchor="middle" font-size="9" fill="#888">ENUM('female','other','male') 的索引序恰好等于期望序</text>
</svg>
