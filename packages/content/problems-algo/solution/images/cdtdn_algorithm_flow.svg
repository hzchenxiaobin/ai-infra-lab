<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位取余计数，O(d) 一趟扫描</text>

  <!-- ====== Input ====== -->
  <rect x="200" y="40" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="13" fill="#333">输入 num</text>

  <path d="M 270 78 L 270 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Init ====== -->
  <rect x="170" y="98" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333">初始化：t = num, cnt = 0</text>
  <text x="270" y="131" text-anchor="middle" font-size="10.5" fill="#888">t 用于拆位，num 留作取余</text>

  <path d="M 270 138 L 270 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Loop diamond: t > 0? ====== -->
  <polygon points="270,160 360,202 270,244 180,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">t &gt; 0 ?</text>
  <text x="270" y="216" text-anchor="middle" font-size="10" fill="#888">（还有数位未处理）</text>

  <!-- Yes branch (left) into loop body -->
  <path d="M 180 202 L 80 202 L 80 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Loop body box -->
  <rect x="20" y="228" width="120" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环体</text>
  <text x="80" y="263" text-anchor="middle" font-size="10.5" fill="#555">d = t % 10</text>
  <text x="80" y="278" text-anchor="middle" font-size="10.5" fill="#555">if num % d == 0:</text>
  <text x="80" y="293" text-anchor="middle" font-size="10.5" fill="#555">    cnt += 1</text>
  <text x="80" y="307" text-anchor="middle" font-size="10.5" fill="#555">t //= 10</text>

  <!-- loop back arrow from body up to diamond -->
  <path d="M 80 228 L 80 180 L 178 180 L 178 202" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="9.5" fill="#888">回到判定</text>

  <!-- No branch (right) to return -->
  <path d="M 360 202 L 460 202 L 460 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="380" y="228" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="253" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return cnt</text>

  <!-- ====== bottom note ====== -->
  <rect x="50" y="290" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">两处 num / t 职责分离：num 不变供取余，t 逐次 //10 推进</text>
  <text x="270" y="328" text-anchor="middle" font-size="10.5" fill="#888">位 0 不出现 → 无除零风险；循环次数 = 数位个数 d = ⌊log₁₀ num⌋+1</text>
  <text x="270" y="344" text-anchor="middle" font-size="10" fill="#888">也可转字符串遍历字符，但取余法无类型转换、空间更省</text>
</svg>
