<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">灵魂一步：「位置前缀」 ⟷ 「值前缀」，逆排列来搭桥</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">例：perm = [2, 0, 1]，需求 [1, 1]</text>

  <path d="M 118 58 v -5 h 146 v 5" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="191" y="46" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">位置前缀 [0..1]</text>

  <text x="95" y="86" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">perm =</text>
  <rect x="120" y="68" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="142" y="94" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="180" y="68" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="94" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="240" y="68" width="44" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="94" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>

  <text x="142" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="262" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <path d="M 142 126 C 142 148, 202 148, 202 126" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="164" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 个逆序对（2 &gt; 0）</text>

  <line x1="110" y1="176" x2="110" y2="224" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <line x1="410" y1="224" x2="410" y2="176" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">σ = perm⁻¹：σ[v] = 值 v 在 perm 中的下标</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">perm ↔ σ 一一对应（双射，取两次逆还原）</text>

  <text x="95" y="256" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">σ =</text>
  <rect x="120" y="232" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="258" text-anchor="middle" font-size="14" fill="#a07820" filter="url(#rough2)">1</text>
  <rect x="180" y="232" width="44" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="258" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="240" y="232" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="258" text-anchor="middle" font-size="14" fill="#a07820" filter="url(#rough2)">0</text>

  <text x="142" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="262" y="286" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <text x="320" y="250" font-size="9.5" fill="#d6a040" filter="url(#rough2)">橙格 = 值 {0,1} 所在处</text>
  <text x="320" y="266" font-size="9.5" fill="#d6a040" filter="url(#rough2)">（分别住在下标 0 和 2）</text>

  <path d="M 142 290 C 142 312, 262 312, 262 290" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="202" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">值 1 在值 0 前面 → 1 个逆序对</text>

  <rect x="36" y="344" width="448" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">引理：inv(perm[0..e]) = 值 {0,…,e} 在 perm⁻¹ 中彼此之间的逆序对数</text>
  <text x="260" y="382" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">证：值 a &lt; b ≤ e 在 σ 中逆序 ⟺ perm[a] &gt; perm[b]，恰是前缀位置对 (a,b) 的逆序判据</text>
  <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 需求 [end, cnt] ⟺ 插完值 0..end 后，DP 里的 j 必须恰好 = cnt</text>
</svg>
