<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,2,3,5]，k = 3，在 [0,1] 上浮点二分</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">答案 v* = 2/5 = 0.4；下表展示前 5 轮二分如何把 mid 收敛到 0.4 并锁定 [2,5]</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="56" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">轮次</text>
  <text x="105" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">lo</text>
  <text x="175" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">hi</text>
  <text x="250" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="315" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cnt</text>
  <text x="365" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">≥k?</text>
  <text x="425" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">记录 p/q</text>
  <text x="525" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">区间动作</text>

  <!-- ===== Row 1 ===== -->
  <rect x="30" y="86" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="105" y="104" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="175" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="250" y="104" text-anchor="middle" font-size="11" fill="#333">0.5</text>
  <text x="315" y="104" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="365" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="425" y="104" text-anchor="middle" font-size="11" fill="#666">1/2</text>
  <text x="525" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a">hi = 0.5</text>

  <!-- ===== Row 2 ===== -->
  <rect x="30" y="116" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="105" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="175" y="134" text-anchor="middle" font-size="11" fill="#333">0.5</text>
  <text x="250" y="134" text-anchor="middle" font-size="11" fill="#333">0.25</text>
  <text x="315" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="365" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="425" y="134" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="525" y="134" text-anchor="middle" font-size="11" fill="#b85450">lo = 0.25</text>

  <!-- ===== Row 3 ===== -->
  <rect x="30" y="146" width="560" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="105" y="164" text-anchor="middle" font-size="11" fill="#333">0.25</text>
  <text x="175" y="164" text-anchor="middle" font-size="11" fill="#333">0.5</text>
  <text x="250" y="164" text-anchor="middle" font-size="11" fill="#333">0.375</text>
  <text x="315" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="365" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="425" y="164" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="525" y="164" text-anchor="middle" font-size="11" fill="#b85450">lo = 0.375</text>

  <!-- ===== Row 4 ===== -->
  <rect x="30" y="176" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="194" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="105" y="194" text-anchor="middle" font-size="11" fill="#333">0.375</text>
  <text x="175" y="194" text-anchor="middle" font-size="11" fill="#333">0.5</text>
  <text x="250" y="194" text-anchor="middle" font-size="11" fill="#333">0.4375</text>
  <text x="315" y="194" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="365" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="425" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2/5</text>
  <text x="525" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a">hi = 0.4375</text>

  <!-- ===== Row 5 ===== -->
  <rect x="30" y="206" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="224" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="105" y="224" text-anchor="middle" font-size="11" fill="#333">0.375</text>
  <text x="175" y="224" text-anchor="middle" font-size="11" fill="#333">0.4375</text>
  <text x="250" y="224" text-anchor="middle" font-size="11" fill="#333">0.40625</text>
  <text x="315" y="224" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="365" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="425" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2/5</text>
  <text x="525" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a">hi = 0.40625</text>

  <!-- ===== Convergence row ===== -->
  <rect x="30" y="236" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">… 继续二分 ⇒ mid → 0.4，区间 [lo,hi] 收敛到 v*=0.4，最终返回 [2, 5]</text>

  <!-- ===== count breakdown note ===== -->
  <rect x="30" y="280" width="560" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">count(mid) 的含义：分数 ≤ mid 的个数</text>
  <text x="50" y="324" font-size="11" fill="#666">mid=0.5：1/5, 1/3, 2/5, 1/2 → cnt=4 ≥3 ✓（阈值偏大，记录当前最大 1/2，继续左缩）</text>
  <text x="50" y="342" font-size="11" fill="#666">mid=0.375：1/5, 1/3 → cnt=2 &lt;3 ✗（阈值偏小，右缩）</text>
  <text x="50" y="358" font-size="11" fill="#666">mid=0.4375：1/5, 1/3, 2/5 → cnt=3 ≥3 ✓，记录 ≤0.4375 的最大分数 = 2/5（命中答案）</text>
</svg>
