<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 取首个可用 → 放置 → 循环</text>

  <!-- Step 1: init -->
  <rect x="180" y="44" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 res="", v=[(a,'a'),(b,'b'),(c,'c')]</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="160" y="98" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">按配额降序排序 v（O(1)，仅 3 个元素）</text>

  <path d="M 280 134 L 280 150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: loop through sorted -->
  <rect x="120" y="152" width="320" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">依次遍历 v：取第一个 cnt > 0 的字符 ch</text>

  <path d="M 280 188 L 280 204" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision diamond: would placing ch form XXX? -->
  <polygon points="280,206 400,252 280,298 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">res 末尾两位</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">都等于 ch ?</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#888">(会形成三连)</text>

  <!-- Yes branch: skip to next char -->
  <path d="M 400 252 L 470 252 L 470 174 L 440 174" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="448" y="248" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="478" y="214" font-size="10" fill="#b85450">跳过 ch</text>
  <text x="478" y="228" font-size="10" fill="#b85450">试下一个</text>

  <!-- No branch: place -->
  <path d="M 280 298 L 280 316" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step: place ch -->
  <rect x="160" y="318" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">res += ch; cnt--; placed = true</text>

  <path d="M 280 354 L 280 370" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop back to sort -->
  <path d="M 280 372 L 280 388 L 60 388 L 60 115 L 158 115" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="384" font-size="10" fill="#4a7a3a">下一轮：重新排序</text>

  <!-- Termination: no char placed -->
  <rect x="160" y="406" width="240" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">placed == false → 终止，返回 res</text>

  <path d="M 280 372 L 280 404" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="394" font-size="10" fill="#b85450">未放置任何字符</text>

  <!-- Side note -->
  <rect x="40" y="406" width="100" height="34" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="420" text-anchor="middle" font-size="9" fill="#888">配额耗尽 或</text>
  <text x="90" y="432" text-anchor="middle" font-size="9" fill="#888">被三连阻塞</text>
</svg>
