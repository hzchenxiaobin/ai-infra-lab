<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">24 点：两两归约的回溯搜索</text>
  <path d="M 210 40 Q 380 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#888">每轮挑 2 个数做一次运算 → 结果替换回去 → 数量减 1 → 直到剩 1 个数判 24</text>

  <!-- ===== 第 0 层: 4 个数 ===== -->
  <text x="120" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb">第 0 层（4 个数）</text>
  <g filter="url(#sk)"><rect x="50" y="116" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="73" y="138" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="104" y="116" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="127" y="138" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="158" y="116" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="181" y="138" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">8</text>
  <g filter="url(#sk)"><rect x="212" y="116" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="235" y="138" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">7</text>

  <!-- 选 4 和 8, 做 4*8=32 -->
  <path d="M 73 150 Q 90 170 110 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <path d="M 181 150 Q 160 170 130 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="135" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">挑 4,8 → 4×8=32</text>

  <!-- ===== 第 1 层: 3 个数 ===== -->
  <text x="120" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e8b57">第 1 层（3 个数）</text>
  <g filter="url(#sk)"><rect x="84" y="216" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="112" y="238" text-anchor="middle" font-size="13" fill="#2e8b57" font-weight="bold">32</text>
  <g filter="url(#sk)"><rect x="150" y="216" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="173" y="238" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="204" y="216" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="227" y="238" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">7</text>

  <!-- 选 1 和 7, 1+7=8 -->
  <path d="M 173 250 Q 190 270 200 286" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <path d="M 227 250 Q 215 270 210 286" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="220" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">挑 1,7 → 1+7=8</text>

  <!-- ===== 第 2 层: 2 个数 ===== -->
  <text x="160" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e8b57">第 2 层（2 个数）</text>
  <g filter="url(#sk)"><rect x="84" y="316" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="112" y="338" text-anchor="middle" font-size="13" fill="#2e8b57" font-weight="bold">32</text>
  <g filter="url(#sk)"><rect x="150" y="316" width="46" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="173" y="338" text-anchor="middle" font-size="13" fill="#2e8b57" font-weight="bold">8</text>

  <!-- 32 - 8 = 24 -->
  <path d="M 112 350 Q 135 370 148 388" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <path d="M 173 350 Q 158 370 150 388" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="165" y="372" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">32−8=24</text>

  <!-- ===== 结果 ===== -->
  <g filter="url(#sk)"><rect x="104" y="392" width="64" height="40" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/></g>
  <text x="136" y="418" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">24 ✓</text>

  <!-- ===== 右侧: 运算枚举 ===== -->
  <text x="520" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">每对 (a, b) 可产生的结果</text>
  <path d="M 430 108 Q 520 114 610 108" stroke="#2b2b2b" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="380" y="122" width="280" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>

  <text x="400" y="144" font-size="11" fill="#9a6a20" font-weight="bold">a + b</text>
  <text x="500" y="144" font-size="10" fill="#888">可交换，只算一次</text>
  <text x="400" y="166" font-size="11" fill="#9a6a20" font-weight="bold">a × b</text>
  <text x="500" y="166" font-size="10" fill="#888">可交换，只算一次</text>
  <text x="400" y="188" font-size="11" fill="#9a6a20" font-weight="bold">a − b</text>
  <text x="500" y="188" font-size="10" fill="#888">不可交换，b−a 也要试</text>
  <text x="400" y="210" font-size="11" fill="#9a6a20" font-weight="bold">a ÷ b</text>
  <text x="500" y="210" font-size="10" fill="#888">不可交换，b÷a 也要试</text>
  <text x="400" y="232" font-size="10" fill="#b85450" font-weight="bold">⚠ b=0 时跳过 a÷b</text>
  <text x="400" y="252" font-size="10" fill="#b85450" font-weight="bold">⚠ 浮点误差用 ε=1e-6</text>

  <text x="520" y="298" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">分支数估算</text>
  <g filter="url(#sk)"><rect x="380" y="308" width="280" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="400" y="330" font-size="11" fill="#2b6e9e">4个数: C(4,2)=6 对 × 6 结果</text>
  <text x="520" y="330" font-size="11" fill="#2b6e9e" font-weight="bold">= 36</text>
  <text x="400" y="352" font-size="11" fill="#2b6e9e">3个数: C(3,2)=3 对 × 6 结果</text>
  <text x="520" y="352" font-size="11" fill="#2b6e9e" font-weight="bold">= 18</text>
  <text x="400" y="374" font-size="11" fill="#2b6e9e">2个数: C(2,2)=1 对 × 6 结果</text>
  <text x="520" y="374" font-size="11" fill="#2b6e9e" font-weight="bold">= 6</text>
  <text x="400" y="394" font-size="11" fill="#2e8b57" font-weight="bold">总计 ≤ 36×18×6 ≈ 3888</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="420" width="680" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="380" y="440" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 本质：4 个数 → 3 → 2 → 1，每轮「选 2 数、试 6 种运算、替换」；递归到底判 |result−24| &lt; ε</text>
</svg>
