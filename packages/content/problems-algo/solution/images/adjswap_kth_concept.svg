<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：两阶段分解 = 求第 k 个妙数 + 算逆序对</text>

  <!-- Phase 1 label -->
  <rect x="20" y="40" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段①：对 num 调 k 次 nextPermutation → 第 k 个妙数 target</text>

  <!-- num cells: 5489355142 -->
  <text x="86" y="84" text-anchor="end" font-size="11" fill="#888">num</text>
  <!-- cell i: x = 102 + i*36, center = 118 + i*36 -->
  <rect x="102" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="91" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="138" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="91" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="174" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="91" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="210" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="91" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="246" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="91" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="282" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="91" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="318" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="91" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="354" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="91" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="390" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="91" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="426" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="91" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- num index labels -->
  <text x="118" y="112" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="154" y="112" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="190" y="112" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="226" y="112" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="262" y="112" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="298" y="112" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="334" y="112" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="370" y="112" text-anchor="middle" font-size="9" fill="#bbb">7</text>
  <text x="406" y="112" text-anchor="middle" font-size="9" fill="#bbb">8</text>
  <text x="442" y="112" text-anchor="middle" font-size="9" fill="#bbb">9</text>

  <!-- arrow down -->
  <path d="M 280 122 L 280 138" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="134" font-size="10.5" fill="#888">k 次 nextPermutation</text>

  <!-- target cells: 5489355421, highlight last 3 (changed) -->
  <text x="86" y="166" text-anchor="end" font-size="11" fill="#888">target</text>
  <rect x="102" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="173" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="138" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="173" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="174" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="173" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="210" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="173" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="246" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="173" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="282" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="173" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="318" y="154" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="173" text-anchor="middle" font-size="13" fill="#333">5</text>
  <!-- changed cells: 4,2,1 (originally 1,4,2) -->
  <rect x="354" y="154" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="390" y="154" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="426" y="154" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- divider -->
  <path d="M 20 196 L 540 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <rect x="20" y="206" width="520" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">阶段②：num →相邻交换→ target 的最少次数 = 位置映射 arr 的逆序对数</text>

  <!-- target char row (phase 2) -->
  <text x="86" y="252" text-anchor="end" font-size="11" fill="#888">target[i]</text>
  <rect x="102" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="118" y="256" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="138" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="154" y="256" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="174" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="256" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="210" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="226" y="256" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="246" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="262" y="256" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="282" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="256" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="318" y="240" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="334" y="256" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="354" y="240" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="256" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="390" y="240" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="256" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="426" y="240" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- source position row (arr) -->
  <text x="86" y="292" text-anchor="end" font-size="11" fill="#888">arr[i]</text>
  <rect x="102" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="118" y="296" text-anchor="middle" font-size="12" fill="#555">0</text>
  <rect x="138" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="154" y="296" text-anchor="middle" font-size="12" fill="#555">1</text>
  <rect x="174" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="296" text-anchor="middle" font-size="12" fill="#555">2</text>
  <rect x="210" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="226" y="296" text-anchor="middle" font-size="12" fill="#555">3</text>
  <rect x="246" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="262" y="296" text-anchor="middle" font-size="12" fill="#555">4</text>
  <rect x="282" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="296" text-anchor="middle" font-size="12" fill="#555">5</text>
  <rect x="318" y="280" width="32" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="334" y="296" text-anchor="middle" font-size="12" fill="#555">6</text>
  <rect x="354" y="280" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <rect x="390" y="280" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <rect x="426" y="280" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>

  <!-- inversion arcs: 8->7, 9->7 -->
  <path d="M 370 312 Q 406 336 442 312" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="332" font-size="9.5" fill="#b85450">8&gt;7</text>
  <path d="M 406 320 Q 424 346 442 320" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="346" font-size="9.5" fill="#b85450">9&gt;7</text>

  <!-- mapping note -->
  <text x="30" y="316" font-size="10" fill="#888">每个 target 字符 →</text>
  <text x="30" y="330" font-size="10" fill="#888">num 中最早未用的</text>
  <text x="30" y="344" font-size="10" fill="#888">同值下标（贪心匹配）</text>

  <!-- formula box -->
  <rect x="60" y="362" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最少相邻交换次数 = arr 的逆序对数 = 2</text>

  <!-- result -->
  <rect x="120" y="402" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ 重复数字按出现顺序稳定匹配，否则逆序数偏大</text>
</svg>
