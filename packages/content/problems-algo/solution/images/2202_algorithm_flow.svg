<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按 k 与 n 的关系分情况决策</text>

  <!-- Decision 1: k == 0? -->
  <polygon points="280,44 380,78 280,112 180,78" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k == 0?</text>

  <!-- Yes branch -->
  <path d="M 380 78 L 440 78" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="436" y="58" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="83" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">return nums[0]</text>

  <!-- No branch down -->
  <path d="M 280 112 L 280 128" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="122" font-size="10" fill="#aaa">否</text>

  <!-- Decision 2: n == 1? -->
  <polygon points="280,132 380,166 280,200 180,166" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n == 1?</text>

  <!-- Yes branch -->
  <path d="M 380 166 L 440 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="436" y="142" width="116" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="162" text-anchor="middle" font-size="10.5" fill="#3a5a2a">k 偶 → nums[0]</text>
  <text x="494" y="178" text-anchor="middle" font-size="10.5" fill="#b85450">k 奇 → −1</text>

  <!-- No branch down -->
  <path d="M 280 200 L 280 216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="210" font-size="10" fill="#aaa">否</text>

  <!-- Decision 3: k == 1? -->
  <polygon points="280,220 380,254 280,288 180,254" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k == 1?</text>

  <!-- Yes branch -->
  <path d="M 380 254 L 440 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="436" y="234" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="259" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">return nums[1]</text>

  <!-- No branch down -->
  <path d="M 280 288 L 280 304" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="298" font-size="10" fill="#aaa">否</text>

  <!-- Decision 4: k <= n+1? -->
  <polygon points="280,308 390,346 280,384 170,346" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k ≤ n+1?</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#b85450">(且 k ≥ 2)</text>

  <!-- Yes branch (left) -->
  <path d="M 170 346 L 110 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="14" y="320" width="98" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="63" y="340" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">max(a[0..k−2])</text>
  <text x="63" y="356" text-anchor="middle" font-size="10" fill="#335">∪ {a[k]} if k&lt;n</text>

  <!-- No branch (right) → k > n+1 -->
  <path d="M 390 346 L 450 346" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="420" y="340" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- Decision 5: (k-n) odd? -->
  <polygon points="510,318 510,374 540,346" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="340" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(k−n)</text>
  <text x="510" y="354" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">奇?</text>

  <!-- Odd branch (right) -->
  <path d="M 540 346 L 540 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="554" y="372" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="394" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="417" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">max(全部)</text>

  <!-- Even branch (left) -->
  <path d="M 510 374 L 510 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="524" y="386" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Need to reposition. Let me use a cleaner layout for the bottom. -->
  <!-- Remove the diamond at x=510 and redo -->

  <!-- Actually let me add the even result below -->
  <rect x="300" y="394" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="417" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">max(a[0..n−2])</text>

  <!-- Arrow from even branch to even result -->
  <path d="M 510 374 L 510 386 L 360 386 L 360 392" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- Footer note -->
  <rect x="60" y="442" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="460" text-anchor="middle" font-size="10.5" fill="#666">n ≥ 2 且 k ≥ 2 时，候选集 = {0..k−2} ∪ {k if k&lt;n}，答案取最大值</text>
</svg>
