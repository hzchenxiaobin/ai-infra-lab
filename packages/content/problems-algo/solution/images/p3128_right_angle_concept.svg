<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">贡献法：固定直角拐点，一横一竖独立选</text>

  <!-- 4x4 grid, cell 46, origin (66,64) -->
  <rect x="66" y="64" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="92" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="112" y="64" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="92" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">1</text>
  <rect x="158" y="64" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="92" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="204" y="64" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="92" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">1</text>

  <rect x="66" y="110" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="138" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="112" y="110" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="135" y="138" text-anchor="middle" font-size="14" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="158" y="110" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="138" text-anchor="middle" font-size="13" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="204" y="110" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="138" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="66" y="156" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="184" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">1</text>
  <rect x="112" y="156" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="184" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="158" y="156" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="184" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="204" y="156" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="184" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">1</text>

  <rect x="66" y="202" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="230" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="112" y="202" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="230" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">1</text>
  <rect x="158" y="202" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="230" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="204" y="202" width="46" height="46" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="230" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- row/col indices -->
  <text x="54" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="54" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="54" y="184" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="54" y="230" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="89" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="135" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="181" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="227" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>

  <!-- arrows from right-angle vertex (1,1) center (135,133) -->
  <line x1="144" y1="133" x2="170" y2="133" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="135" y1="124" x2="135" y2="98" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="135" y1="142" x2="135" y2="214" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="123" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">横</text>
  <text x="122" y="112" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">竖</text>
  <text x="122" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">竖</text>

  <!-- caption under grid -->
  <text x="158" y="272" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">一横（蓝）× 一竖（绿），拐点 = 红色格子</text>
  <text x="158" y="290" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">= 1 × 2 = 2 个 L 形直角三角形</text>

  <!-- right panel -->
  <rect x="286" y="62" width="258" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="12.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">直角拐点 (x,y) = (1,1)，值为 1</text>

  <rect x="286" y="110" width="258" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="134" text-anchor="middle" font-size="12.5" fill="#2c4a6b" filter="url(#rough2)">同行候选：row[1] − 1 = 2 − 1 = 1 个</text>

  <rect x="286" y="158" width="258" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="182" text-anchor="middle" font-size="12.5" fill="#2d5a24" filter="url(#rough2)">同列候选：col[1] − 1 = 3 − 1 = 2 个</text>

  <rect x="286" y="212" width="258" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="233" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">贡献 = (row[x]−1) × (col[y]−1)</text>
  <text x="415" y="252" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= 1 × 2 = 2</text>

  <!-- bottom note -->
  <rect x="30" y="306" width="514" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="287" y="325" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不重不漏：三点中只有拐点同时「与一点同行 + 与另一点同列」，</text>
  <text x="287" y="343" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">同行点与同列点既不同行也不同列，谁也当不了第二个拐点</text>
</svg>
