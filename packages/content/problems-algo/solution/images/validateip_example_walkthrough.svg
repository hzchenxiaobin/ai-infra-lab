<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三个示例演算：IPv4 / IPv6 / Neither</text>

  <!-- ===== Example 1: IPv4 ===== -->
  <text x="24" y="62" font-size="12" fill="#446688" font-weight="bold">① 172.16.254.1</text>
  <text x="170" y="62" font-size="11" fill="#666">split('.') → [172, 16, 254, 1]（4 段）</text>

  <rect x="24" y="74" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="92" text-anchor="middle" font-size="11" fill="#333">172</text>
  <text x="98" y="92" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="108" y="74" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="92" text-anchor="middle" font-size="11" fill="#333">16</text>
  <text x="166" y="92" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="176" y="74" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="92" text-anchor="middle" font-size="11" fill="#333">254</text>
  <text x="242" y="92" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="252" y="74" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="306" y="88" font-size="10.5" fill="#82b366">✓ 纯数字 · 无前导零 · ≤255</text>
  <text x="306" y="100" font-size="10.5" fill="#82b366">✓ “0”/“1” 单字符不受前导零限制</text>

  <rect x="470" y="76" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="513" y="93" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ IPv4</text>

  <path d="M 24 120 L 556 120" stroke="#eee" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ===== Example 2: IPv6 ===== -->
  <text x="24" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">② 2001:0db8:85a3:0:0:8A2E:0370:7334</text>
  <text x="318" y="146" font-size="11" fill="#666">split(':') → 8 段</text>

  <rect x="24" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="176" text-anchor="middle" font-size="10.5" fill="#333">2001</text>
  <text x="78" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="86" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="10.5" fill="#333">0db8</text>
  <text x="140" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="148" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="176" text-anchor="middle" font-size="10.5" fill="#333">85a3</text>
  <text x="202" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="210" y="158" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="176" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="244" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="252" y="158" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="176" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="286" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="294" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="176" text-anchor="middle" font-size="10.5" fill="#333">8A2E</text>
  <text x="348" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="356" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="176" text-anchor="middle" font-size="10.5" fill="#333">0370</text>
  <text x="410" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">:</text>
  <rect x="418" y="158" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="176" text-anchor="middle" font-size="10.5" fill="#333">7334</text>

  <text x="478" y="170" font-size="10.5" fill="#82b366">✓ 每段 1-4 位</text>
  <text x="478" y="182" font-size="10.5" fill="#82b366">✓ 均十六进制</text>

  <rect x="470" y="188" width="86" height="0" fill="none"/>

  <path d="M 24 206 L 556 206" stroke="#eee" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ===== Example 3: Neither ===== -->
  <text x="24" y="232" font-size="12" fill="#b85450" font-weight="bold">③ 256.256.256.256</text>
  <text x="170" y="232" font-size="11" fill="#666">split('.') → [256, 256, 256, 256]（4 段）</text>

  <rect x="24" y="244" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="262" text-anchor="middle" font-size="11" fill="#b85450">256</text>
  <text x="86" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="96" y="244" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="262" text-anchor="middle" font-size="11" fill="#b85450">256</text>
  <text x="158" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="168" y="244" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="262" text-anchor="middle" font-size="11" fill="#b85450">256</text>
  <text x="230" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">.</text>
  <rect x="240" y="244" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="262" text-anchor="middle" font-size="11" fill="#b85450">256</text>

  <text x="306" y="256" font-size="10.5" fill="#b85450">✗ 每段 256 &gt; 255 → IPv4 不通过</text>
  <text x="306" y="270" font-size="10.5" fill="#b85450">✗ split(':') 仅 1 段 → IPv6 不通过</text>

  <rect x="470" y="246" width="86" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="513" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ Neither</text>

  <!-- summary box -->
  <rect x="24" y="300" width="532" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="322" font-size="12" fill="#7a5415" font-weight="bold">关键结论</text>
  <text x="40" y="342" font-size="11" fill="#555">• 分隔符 + 段数分流版本：4 段走 IPv4 校验、8 段走 IPv6 校验，互不干扰。</text>
  <text x="40" y="360" font-size="11" fill="#555">• 逐段规则须列全：长度 / 字符集 / 前导零 / 数值范围，缺一条就漏判（如 ③ 漏范围会误判 IPv4）。</text>
  <text x="40" y="378" font-size="11" fill="#555">• 空段由 “段数 != 4/8” 或 “p 为空” 自然拦截，无需单独 count 分隔符。</text>
  <text x="40" y="396" font-size="11" fill="#555">• 转数值前先卡长度与字符集，避免 stoi / int() 对非数字串抛异常或越界。</text>
</svg>
