<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 位卖家逐一定位第 2 件售出商品</text>

  <!-- column headers -->
  <text x="55" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">seller</text>
  <text x="150" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">售出记录（按日期升序）</text>
  <text x="380" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 2 件品牌 vs 偏好</text>
  <text x="540" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">输出</text>
  <line x1="20" y1="62" x2="580" y2="62" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- ===== seller 1: no sales ===== -->
  <text x="55" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="90" y="80" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="97" text-anchor="middle" font-size="10" fill="#b85450">（无任何售出订单）</text>
  <text x="380" y="97" text-anchor="middle" font-size="10" fill="#888">— 无第 2 件 → NULL</text>
  <text x="540" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">no</text>

  <!-- ===== seller 2: HP(08-01), Samsung(08-04) ===== -->
  <text x="55" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="90" y="124" width="80" height="26" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="141" text-anchor="middle" font-size="9" fill="#888">08-01 / HP</text>
  <text x="175" y="141" font-size="11" fill="#888">→</text>
  <rect x="188" y="124" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">08-04 / Samsung</text>
  <text x="300" y="141" font-size="9" fill="#4a7a3a" font-weight="bold">① 第2件</text>
  <text x="380" y="141" text-anchor="middle" font-size="10" fill="#333">Samsung <tspan fill="#4a7a3a" font-weight="bold">=</tspan> fav(Samsung)</text>
  <text x="540" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">yes</text>

  <!-- ===== seller 3: Lenovo(08-02), LG(08-03) ===== -->
  <text x="55" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="90" y="172" width="90" height="26" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="189" text-anchor="middle" font-size="9" fill="#888">08-02 / Lenovo</text>
  <text x="185" y="189" font-size="11" fill="#888">→</text>
  <rect x="198" y="172" width="78" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="237" y="189" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">08-03 / LG</text>
  <text x="284" y="189" font-size="9" fill="#4a7a3a" font-weight="bold">① 第2件</text>
  <text x="380" y="189" text-anchor="middle" font-size="10" fill="#333">LG <tspan fill="#4a7a3a" font-weight="bold">=</tspan> fav(LG)</text>
  <text x="540" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">yes</text>

  <!-- ===== seller 4: Samsung(08-04), Lenovo(08-05) ===== -->
  <text x="55" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="90" y="220" width="96" height="26" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="237" text-anchor="middle" font-size="9" fill="#888">08-04 / Samsung</text>
  <text x="191" y="237" font-size="11" fill="#888">→</text>
  <rect x="204" y="220" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="247" y="237" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">08-05 / Lenovo</text>
  <text x="298" y="237" font-size="9" fill="#d6a040" font-weight="bold">① 第2件</text>
  <text x="380" y="237" text-anchor="middle" font-size="10" fill="#333">Lenovo <tspan fill="#b85450" font-weight="bold">≠</tspan> fav(HP)</text>
  <text x="540" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">no</text>

  <line x1="20" y1="262" x2="580" y2="262" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- ===== Result table ===== -->
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终结果表</text>

  <rect x="160" y="296" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="311" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">seller_id</text>
  <text x="245" y="311" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2nd_item_fav_brand</text>
  <line x1="220" y1="296" x2="220" y2="318" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="160" y="318" width="120" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="200" y="331" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="245" y="331" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">no</text>
  <line x1="220" y1="318" x2="220" y2="336" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="160" y="336" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="200" y="349" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="245" y="349" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">yes</text>
  <line x1="220" y1="336" x2="220" y2="354" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="160" y="354" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="200" y="367" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="245" y="367" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">yes</text>
  <line x1="220" y1="354" x2="220" y2="372" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="160" y="372" width="120" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="200" y="385" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="245" y="385" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">no</text>
  <line x1="220" y1="372" x2="220" y2="390" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- ===== Bottom notes ===== -->
  <rect x="20" y="408" width="560" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="428" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">绿框</tspan> = 第 2 件品牌命中偏好(yes)；<tspan fill="#d6a040" font-weight="bold">橙框</tspan> = 第 2 件品牌未命中(no)；<tspan fill="#b85450" font-weight="bold">红虚线</tspan> = 售出 &lt; 2 件(no)</text>
  <text x="40" y="446" font-size="9.5" fill="#333">• 「按日期升序的第 2 件」= ROW_NUMBER 分组排序后 rn=2 的那条；<tspan fill="#888">灰色</tspan>为第 1 件（被跳过）</text>
</svg>
