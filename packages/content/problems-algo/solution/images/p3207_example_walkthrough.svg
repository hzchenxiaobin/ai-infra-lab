<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[3,2,2]，E₀ = 2 —— 先变现，后连刷</text>

  <rect x="24" y="44" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="63" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="80" y="44" width="196" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="63" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="276" y="44" width="58" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="63" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">分数</text>
  <rect x="334" y="44" width="66" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="367" y="63" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">能量</text>
  <rect x="400" y="44" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="448" y="63" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">已标记</text>

  <rect x="24" y="74" width="56" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="74" width="196" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="95" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">得分：打敌人1（花 2）</text>
  <rect x="276" y="74" width="58" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="334" y="74" width="66" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="400" y="74" width="96" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">∅</text>

  <rect x="24" y="108" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="108" width="196" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="129" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">标记敌人0（得 3）</text>
  <rect x="276" y="108" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="334" y="108" width="66" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="400" y="108" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{0}</text>

  <rect x="24" y="142" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="142" width="196" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="163" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">标记敌人2（得 2）</text>
  <rect x="276" y="142" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="334" y="142" width="66" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="400" y="142" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{0,2}</text>

  <rect x="24" y="176" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="176" width="196" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="197" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">得分：打敌人1（花 2）</text>
  <rect x="276" y="176" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="197" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="334" y="176" width="66" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="400" y="176" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{0,2}</text>

  <rect x="24" y="210" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="210" width="196" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="231" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">得分：打敌人1（花 2）</text>
  <rect x="276" y="210" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="334" y="210" width="66" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="231" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="400" y="210" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="231" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{0,2}</text>

  <text x="120" y="106" font-size="9" fill="#446688" filter="url(#rough2)">解锁</text>
  <text x="120" y="139" font-size="9" fill="#446688" filter="url(#rough2)">变现</text>
  <text x="120" y="173" font-size="9" fill="#d6a040" filter="url(#rough2)">连刷</text>

  <rect x="24" y="262" width="472" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停止：剩余能量 1 &lt; mn = 2，打不动了</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">公式复核：ans = ⌊(E₀ + S − mn) / mn⌋ = ⌊(2+7−2)/2⌋ = 3 ✓</text>

  <rect x="24" y="338" width="472" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">对照：官方解释的另一种 3 分打法（交错进行）</text>
  <text x="260" y="376" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">打敌人1 → 标记敌人0 → 打敌人2 → 标记敌人2 → 打敌人1</text>
  <text x="260" y="392" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">殊途同归：本质都是「变现 5 点能量 + 连刷 2 点提款机」</text>
</svg>
