<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="350" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 从中心出发，出队即入结果</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">队列逐层消化等距菱形环，每个格子恰好入队出队各一次</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. Init -->
    <rect x="140" y="56" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="270" y="74" text-anchor="middle" fill="#d6a040" font-weight="bold">① 初始化</text>
    <text x="270" y="89" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">中心 (rCenter, cCenter) 入队，标记 visited</text>

    <path d="M 270 98 L 270 112" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 2. Queue empty? diamond -->
    <polygon points="270,114 370,144 270,174 170,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="140" text-anchor="middle" fill="#d6a040" font-weight="bold">队列非空？</text>
    <text x="270" y="156" text-anchor="middle" fill="#d6a040" font-size="10">(while !q.empty())</text>

    <!-- No -> return -->
    <path d="M 370 144 L 420 144" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="388" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="420" y="126" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="475" y="148" text-anchor="middle" fill="#b85450" font-weight="bold">返回 res</text>

    <!-- Yes -> down -->
    <path d="M 270 174 L 270 190" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="282" y="186" font-size="10" fill="#666" font-weight="bold">是</text>

    <!-- 3. Dequeue -->
    <rect x="120" y="192" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="270" y="210" text-anchor="middle" fill="#446688" font-weight="bold">② 出队 (i, j) → 追加到 res</text>
    <text x="270" y="225" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">q.pop() → res.push_back({i, j})</text>

    <path d="M 270 232 L 270 246" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 4. Expand neighbors -->
    <rect x="100" y="248" width="340" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="270" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">③ 遍历 (i,j) 的 4 个邻居</text>
    <text x="270" y="281" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">for d in {上,下,左,右}: (ni, nj)</text>
    <text x="270" y="293" text-anchor="middle" fill="#4a7a3a" font-size="10">在界内 且 未访问 → 标记 visited，入队</text>

    <!-- Loop back: expand -> queue check (dashed, left side) -->
    <path d="M 100 273 L 50 273 L 50 144 L 170 144" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
    <text x="40" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 40 210)">回到循环头</text>

    <!-- Note box on the right -->
    <rect x="420" y="190" width="110" height="72" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="6"/>
    <text x="475" y="207" text-anchor="middle" fill="#555" font-weight="bold" font-size="10">💡 入队即标记</text>
    <text x="475" y="222" text-anchor="middle" fill="#777" font-size="9">visited[ni][nj]</text>
    <text x="475" y="234" text-anchor="middle" fill="#777" font-size="9">在入队时置 true</text>
    <text x="475" y="248" text-anchor="middle" fill="#777" font-size="9">非出队时才标记</text>
    <text x="475" y="258" text-anchor="middle" fill="#777" font-size="9">→ 防重复入队</text>
  </g>

  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#888">黄框=初始化 | 菱形=循环条件 | 蓝框=出队追加 | 绿框=扩展邻居 | 红框=终止返回</text>
</svg>
