<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "leetcode"，i 从 0 扫到 7</text>
  <text x="300" y="40" text-anchor="middle" font-size="10.5" fill="#888">初始化 cur=1, ans=1（i=0 处即一段长度 1）；i≥1 比较相邻字符</text>

  <!-- Table columns: i | s[i] | s[i-1] | s[i]==s[i-1]? | cur | ans -->
  <!-- x: 110,150,200,260,380,440 ; widths 40,50,60,120,60,60 -->

  <!-- Header row y=50-74 -->
  <rect x="110" y="50" width="40" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="150" y="50" width="50" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <rect x="200" y="50" width="60" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i-1]</text>
  <rect x="260" y="50" width="120" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">相同？</text>
  <rect x="380" y="50" width="60" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur</text>
  <rect x="440" y="50" width="60" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- Row 0: i=0, l, —, —, 1, 1  (init) y=74-100 -->
  <rect x="110" y="74" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="175" y="92" text-anchor="middle" font-size="11.5" fill="#333">l</text>
  <text x="230" y="92" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#888">（初始）</text>
  <text x="410" y="92" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="92" text-anchor="middle" font-size="11.5" fill="#333">1</text>

  <!-- Row 1: i=1, e, l, ✗, 1, 1 -->
  <rect x="110" y="100" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="118" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="175" y="118" text-anchor="middle" font-size="11.5" fill="#333">e</text>
  <text x="230" y="118" text-anchor="middle" font-size="11.5" fill="#333">l</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="118" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="118" text-anchor="middle" font-size="11.5" fill="#333">1</text>

  <!-- Row 2: i=2, e, e, ✓, 2, 2  HIGHLIGHT -->
  <rect x="110" y="126" width="390" height="26" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="175" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">e</text>
  <text x="230" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">e</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 续段</text>
  <text x="410" y="144" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="470" y="144" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row 3: i=3, t, e, ✗, 1, 2 -->
  <rect x="110" y="152" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="170" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="175" y="170" text-anchor="middle" font-size="11.5" fill="#333">t</text>
  <text x="230" y="170" text-anchor="middle" font-size="11.5" fill="#333">e</text>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="170" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="170" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- Row 4: i=4, c, t, ✗, 1, 2 -->
  <rect x="110" y="178" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="175" y="196" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <text x="230" y="196" text-anchor="middle" font-size="11.5" fill="#333">t</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="196" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="196" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- Row 5: i=5, o, c, ✗, 1, 2 -->
  <rect x="110" y="204" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="175" y="222" text-anchor="middle" font-size="11.5" fill="#333">o</text>
  <text x="230" y="222" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="222" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="222" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- Row 6: i=6, d, o, ✗, 1, 2 -->
  <rect x="110" y="230" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="175" y="248" text-anchor="middle" font-size="11.5" fill="#333">d</text>
  <text x="230" y="248" text-anchor="middle" font-size="11.5" fill="#333">o</text>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="248" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="248" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- Row 7: i=7, e, d, ✗, 1, 2 -->
  <rect x="110" y="256" width="390" height="26" rx="0" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="274" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="175" y="274" text-anchor="middle" font-size="11.5" fill="#333">e</text>
  <text x="230" y="274" text-anchor="middle" font-size="11.5" fill="#333">d</text>
  <text x="320" y="274" text-anchor="middle" font-size="11" fill="#b85450">✗ 不同</text>
  <text x="410" y="274" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="470" y="274" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- annotation arrow pointing to row 2 -->
  <path d="M 540 139 L 504 139" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#rough2)" filter="url(#rough2)"/>
  <text x="546" y="136" font-size="10" fill="#d6a040" font-weight="bold">命中</text>
  <text x="546" y="149" font-size="10" fill="#d6a040">最长段</text>

  <!-- Summary box -->
  <rect x="80" y="300" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="319" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">能量 = ans = 2</text>
  <text x="300" y="335" text-anchor="middle" font-size="11" fill="#555">对应子串 "ee"（下标 1–2），唯一一次「续段」让 cur 达到峰值 2</text>
</svg>
