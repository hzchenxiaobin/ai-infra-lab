<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：求 [min, max]</text>

  <!-- Step 1: Sort -->
  <g filter="url(#rough2)">
    <rect x="150" y="48" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="250" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 排序 stones</text>
  </g>
  <path d="M 250 84 L 250 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Sliding window -->
  <g filter="url(#rough2)">
    <rect x="110" y="102" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="250" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 滑动窗口大小 n</text>
    <text x="250" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a">while stones[j]−stones[i]+1 &gt; n: i++</text>
  </g>
  <path d="M 250 150 L 250 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: min = n - max_count -->
  <g filter="url(#rough2)">
    <rect x="130" y="168" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="250" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ min = n − max_count</text>
  </g>
  <path d="M 250 204 L 250 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Decision diamond — special case? -->
  <g filter="url(#rough2)">
    <polygon points="250,222 390,262 250,302 110,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="250" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">④ 特判：</text>
    <text x="250" y="271" text-anchor="middle" font-size="9" fill="#666">前 n−1 连续 且 末间隙&gt;2</text>
    <text x="250" y="284" text-anchor="middle" font-size="9" fill="#666">或 后 n−1 连续 且 首间隙&gt;2？</text>
  </g>

  <!-- Yes branch → min = 2 -->
  <path d="M 390 262 L 430 262" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="432" y="244" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="460" y="267" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min=2</text>
  </g>

  <!-- No branch → continue -->
  <path d="M 250 302 L 250 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="314" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 5: max formula -->
  <g filter="url(#rough2)">
    <rect x="70" y="320" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="250" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⑤ max = max(stones[n−1]−stones[1]−n+2,</text>
    <text x="250" y="357" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">stones[n−2]−stones[0]−n+2)</text>
  </g>
  <path d="M 250 370 L 250 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Return -->
  <g filter="url(#rough2)">
    <rect x="160" y="388" width="180" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8"/>
    <text x="250" y="411" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">⑥ 返回 [min, max]</text>
  </g>

  <!-- Side annotation for max formula -->
  <g filter="url(#rough2)" font-size="9" fill="#888">
    <text x="440" y="340" text-anchor="middle">牺牲左端</text>
    <text x="440" y="354" text-anchor="middle">牺牲右端</text>
    <text x="440" y="368" text-anchor="middle">取较大值</text>
  </g>
</svg>
