<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：搬走会议 i 后，原地能连出多大的空地？</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">会议搬去哪，决定 [g[i] ｜ d[i] ｜ g[i+1]] 三段能否连成一片</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="300" y="48" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="318" y="58" font-size="9" fill="#55677d">空隙</text>
    <rect x="350" y="48" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="368" y="58" font-size="9" fill="#55677d">被搬的会议 d</text>
    <rect x="438" y="48" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <text x="456" y="58" font-size="9" fill="#55677d">其他会议</text>
  </g>

  <!-- 情况① 搬走前 -->
  <text x="36" y="68" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">情况 ①：存在别的空隙 g[j] ≥ d[i] → 整体搬走，三段连成一片</text>
  <g filter="url(#rough2)">
    <text x="26" y="93" font-size="9.5" fill="#55677d">前</text>
    <rect x="36" y="74" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="64" y="93" text-anchor="middle" font-size="9.5" fill="#33506b">会 i−1</text>
    <rect x="92" y="74" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="122" y="93" text-anchor="middle" font-size="9.5" fill="#2f5d24">g[i]=3</text>
    <rect x="152" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="172" y="93" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">d[i]</text>
    <rect x="192" y="74" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="212" y="93" text-anchor="middle" font-size="8" fill="#2f5d24">g[i+1]=2</text>
    <rect x="232" y="74" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="258" y="93" text-anchor="middle" font-size="9.5" fill="#33506b">会 i+1</text>
    <text x="294" y="93" font-size="10" fill="#55677d">···</text>
    <rect x="302" y="74" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <rect x="312" y="74" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" rx="4"/>
    <text x="342" y="93" text-anchor="middle" font-size="9.5" fill="#2f5d24">g[j]=3</text>
    <rect x="372" y="74" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="392" y="93" font-size="9.5" fill="#b85450" font-weight="bold">g[j] = 3 ≥ d[i] = 2 ✓</text>
  </g>
  <path d="M 172 106 C 215 122, 290 126, 334 122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="120" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">整体搬入 g[j]</text>

  <!-- 情况① 搬走后 -->
  <g filter="url(#rough2)">
    <text x="26" y="147" font-size="9.5" fill="#55677d">后</text>
    <rect x="36" y="128" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="64" y="147" text-anchor="middle" font-size="9.5" fill="#33506b">会 i−1</text>
    <rect x="92" y="128" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="162" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">g[i]+d[i]+g[i+1] = 7</text>
    <rect x="232" y="128" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="258" y="147" text-anchor="middle" font-size="9.5" fill="#33506b">会 i+1</text>
    <text x="294" y="147" font-size="10" fill="#55677d">···</text>
    <rect x="302" y="128" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <rect x="312" y="128" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="332" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">d[i]</text>
    <rect x="352" y="128" width="20" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="372" y="128" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="392" y="147" font-size="9" fill="#55677d">g[j] 还剩 3−2 = 1</text>
  </g>

  <!-- 情况② 平移前 -->
  <text x="36" y="192" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">情况 ②：所有别的空隙都 &lt; d[i] → 只能贴边平移，d[i] 仍占时长</text>
  <g filter="url(#rough2)">
    <text x="26" y="219" font-size="9.5" fill="#55677d">前</text>
    <rect x="36" y="200" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="64" y="219" text-anchor="middle" font-size="9.5" fill="#33506b">会 i−1</text>
    <rect x="92" y="200" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="122" y="219" text-anchor="middle" font-size="9.5" fill="#2f5d24">g[i]=3</text>
    <rect x="152" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="172" y="219" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">d[i]</text>
    <rect x="192" y="200" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="212" y="219" text-anchor="middle" font-size="8" fill="#2f5d24">g[i+1]=2</text>
    <rect x="232" y="200" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="258" y="219" text-anchor="middle" font-size="9.5" fill="#33506b">会 i+1</text>
    <text x="294" y="219" font-size="10" fill="#55677d">···</text>
    <rect x="302" y="200" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <rect x="312" y="200" width="20" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="332" y="200" width="8" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <rect x="340" y="200" width="20" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="360" y="200" width="10" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="378" y="219" font-size="9" fill="#b85450" font-weight="bold">别的空隙都只有 1 &lt; d[i] ✗</text>
  </g>
  <path d="M 170 234 C 158 246, 128 248, 114 244" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 情况② 贴左平移后 -->
  <g filter="url(#rough2)">
    <text x="26" y="263" font-size="9.5" fill="#55677d">后</text>
    <rect x="36" y="244" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="64" y="263" text-anchor="middle" font-size="9.5" fill="#33506b">会 i−1</text>
    <rect x="92" y="244" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="112" y="263" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">d[i]</text>
    <rect x="132" y="244" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="182" y="263" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">g[i]+g[i+1] = 5</text>
    <rect x="232" y="244" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="258" y="263" text-anchor="middle" font-size="9.5" fill="#33506b">会 i+1</text>
    <text x="300" y="263" font-size="9.5" fill="#b85450" font-weight="bold">d[i] 仍占 2 格时长！</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="36" y="298" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="146" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">能装下：g[j] ≥ d[i]</text>
    <text x="146" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">候选 = g[i] + d[i] + g[i+1]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="264" y="298" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="374" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">装不下：全部 &lt; d[i]</text>
    <text x="374" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">候选 = g[i] + g[i+1]</text>
  </g>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#55677d" filter="url(#rough2)">基线（一个都不搬）= max(g)；最终答案取所有候选与基线的最大值</text>
</svg>
