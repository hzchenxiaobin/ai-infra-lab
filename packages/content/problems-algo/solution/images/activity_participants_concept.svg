<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：统计各活动人数后剔除最大值与最小值，保留「中间档」</text>

  <!-- ===== Eating: MAX (3) ===== -->
  <text x="110" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Eating</text>
  <rect x="40" y="66" width="140" height="98" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <circle cx="75" cy="94" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="110" cy="94" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="145" cy="94" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="98" text-anchor="middle" font-size="9" fill="#b85450">J</text>
  <text x="110" y="98" text-anchor="middle" font-size="9" fill="#b85450">E</text>
  <text x="145" y="98" text-anchor="middle" font-size="9" fill="#b85450">D</text>
  <text x="110" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt = 3</text>
  <text x="110" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">MAX → 剔除 ✗</text>

  <!-- ===== Singing: KEEP (2) ===== -->
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Singing</text>
  <rect x="230" y="66" width="140" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <circle cx="265" cy="94" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="300" cy="94" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a">V</text>
  <text x="300" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a">J</text>
  <text x="300" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cnt = 2</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">中间档 → 保留 ✓</text>

  <!-- ===== Horse Riding: MIN (1) ===== -->
  <text x="490" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Horse Riding</text>
  <rect x="420" y="66" width="140" height="98" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <circle cx="490" cy="94" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="98" text-anchor="middle" font-size="9" fill="#b85450">B</text>
  <text x="490" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt = 1</text>
  <text x="490" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">MIN → 剔除 ✗</text>

  <!-- ===== filter bar ===== -->
  <rect x="70" y="180" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="199" text-anchor="middle" font-size="11" fill="#333">WHERE cnt ≠ (SELECT MAX(cnt) FROM t) AND cnt ≠ (SELECT MIN(cnt) FROM t)</text>

  <!-- Eating dashed (blocked at filter) -->
  <path d="M110 164 L110 180" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="124" y="176" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <!-- Horse Riding dashed (blocked at filter) -->
  <path d="M490 164 L490 180" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="504" y="176" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <!-- Singing passes through filter to result -->
  <path d="M300 164 L300 232" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== result box ===== -->
  <rect x="220" y="236" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="220" y="236" width="160" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">results</text>
  <text x="300" y="278" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Singing</text>

  <!-- ===== bottom notes ===== -->
  <rect x="30" y="306" width="540" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="328" font-size="11" fill="#333" font-weight="bold">两阶段聚合：</text>
  <text x="50" y="348" font-size="11" fill="#333">① GROUP BY activity + COUNT(*) → 每活动人数 cnt</text>
  <text x="50" y="368" font-size="11" fill="#333">② 在 cnt 上剔除 MAX(cnt) 与 MIN(cnt)，保留中间档</text>
  <text x="50" y="384" font-size="10" fill="#b85450">⚠ 第二阶段筛选发生在聚合之后，不能用 WHERE，须用 HAVING / 子查询 / CTE / 窗口函数</text>
</svg>
