<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：2021 赛季排名全过程</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">积分 = 胜×3 + 平×1；净胜球 = 进球 − 失球；名次 = 三键排序后的 RANK()</text>

  <!-- 主表格 -->
  <rect x="20" y="54" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">球队</text>
  <rect x="132" y="54" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">胜·平</text>
  <rect x="180" y="54" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">积分</text>
  <rect x="220" y="54" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">进·失</text>
  <rect x="272" y="54" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">净胜球</text>
  <rect x="314" y="54" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="71" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">名次</text>

  <rect x="20" y="82" width="112" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Manchester City</text>
  <rect x="132" y="82" width="48" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">29·6</text>
  <rect x="180" y="82" width="40" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">93</text>
  <rect x="220" y="82" width="52" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">99·26</text>
  <rect x="272" y="82" width="42" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+73</text>
  <rect x="314" y="82" width="44" height="29" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="101" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="20" y="113" width="112" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Liverpool</text>
  <rect x="132" y="113" width="48" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">28·8</text>
  <rect x="180" y="113" width="40" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">92</text>
  <rect x="220" y="113" width="52" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">94·26</text>
  <rect x="272" y="113" width="42" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+68</text>
  <rect x="314" y="113" width="44" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="132" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="20" y="144" width="112" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Chelsea</text>
  <rect x="132" y="144" width="48" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">21·11</text>
  <rect x="180" y="144" width="40" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">74</text>
  <rect x="220" y="144" width="52" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">76·33</text>
  <rect x="272" y="144" width="42" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+43</text>
  <rect x="314" y="144" width="44" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="163" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="20" y="175" width="112" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Tottenham</text>
  <rect x="132" y="175" width="48" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">22·5</text>
  <rect x="180" y="175" width="40" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">71</text>
  <rect x="220" y="175" width="52" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">69·40</text>
  <rect x="272" y="175" width="42" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+29</text>
  <rect x="314" y="175" width="44" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="194" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="20" y="206" width="112" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Arsenal</text>
  <rect x="132" y="206" width="48" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">22·3</text>
  <rect x="180" y="206" width="40" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">69</text>
  <rect x="220" y="206" width="52" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">61·48</text>
  <rect x="272" y="206" width="42" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+13</text>
  <rect x="314" y="206" width="44" height="29" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="225" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="189" y="252" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">积分 93 &gt; 92 &gt; 74 &gt; 71 &gt; 69 互不相同 → 第①级键就分出了高下</text>

  <!-- 右侧计算面板 -->
  <rect x="374" y="54" width="130" height="181" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="74" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">曼城行怎么算？</text>
  <text x="439" y="94" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">积分：29×3 + 6×1</text>
  <text x="439" y="108" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= 93 分</text>
  <text x="439" y="128" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">净胜球：99 − 26</text>
  <text x="439" y="142" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= +73</text>
  <text x="439" y="162" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">其余四行同理，</text>
  <text x="439" y="176" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">再按三键排序</text>
  <text x="439" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ 发名次 ①…⑤</text>
  <text x="439" y="212" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">2022 赛季同法，</text>
  <text x="439" y="226" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">榜单独立重排</text>

  <!-- 底部：平分判定 -->
  <rect x="20" y="262" width="484" height="122" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="284" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">平分怎么办？—— 三级键逐级消解（假想延伸数据）</text>
  <text x="36" y="306" font-size="10" fill="#333" filter="url(#rough2)">· 积分打平 → 比净胜球：纽卡 71 分 +35 &gt; 埃弗顿 71 分 +28 → 纽卡在前</text>
  <text x="36" y="326" font-size="10" fill="#333" filter="url(#rough2)">· 净胜球也平 → 比队名字典序：Brighton 排在 Everton 前（B 早于 E）</text>
  <text x="36" y="346" font-size="10" fill="#333" filter="url(#rough2)">· 三键全同 → RANK() 并列同号；本题有队名兜底，实际不会触发</text>
  <text x="36" y="370" font-size="9.5" fill="#666" filter="url(#rough2)">对照：真实英超同分先比净胜球再比进球数；本题末级改用队名字典序保证全序</text>
</svg>
