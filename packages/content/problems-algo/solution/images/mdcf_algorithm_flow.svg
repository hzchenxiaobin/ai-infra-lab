<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心降序算法流程（频次压低至互不相同）</text>

  <!-- Step 0: count frequencies -->
  <rect x="140" y="38" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333">统计各字符频次 freq[26]</text>

  <!-- arrow down -->
  <path d="M 270 68 L 270 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: sort descending -->
  <rect x="140" y="88" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#333">频次降序排序，过滤 0</text>

  <!-- arrow down -->
  <path d="M 270 118 L 270 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start node -->
  <ellipse cx="270" cy="158" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="12" fill="#333">开始: prev = ∞, deletions = 0</text>

  <!-- arrow down -->
  <path d="M 270 178 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more frequencies? -->
  <polygon points="270,200 370,246 270,268 170,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="12" fill="#333">还有频次?</text>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#666">(遍历未结束)</text>

  <!-- No branch -> end -->
  <path d="M 370 246 L 452 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="238" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="246" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="250" text-anchor="middle" font-size="12" fill="#333">返回 deletions</text>

  <!-- Yes branch down -->
  <path d="M 270 268 L 270 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="282" font-size="11" fill="#82b366">是</text>

  <!-- Get current frequency -->
  <rect x="130" y="290" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#333">取当前频次 f</text>

  <!-- arrow down -->
  <path d="M 270 324 L 270 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: f >= prev? -->
  <polygon points="270,346 380,392 270,414 160,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="12" fill="#333">f ≥ prev ?</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#666">(冲突?)</text>

  <!-- Yes (conflict) -> reduce -->
  <path d="M 160 392 L 100 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="384" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="14" y="368" width="84" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="386" text-anchor="middle" font-size="10" fill="#333">target =</text>
  <text x="56" y="400" text-anchor="middle" font-size="10" fill="#333">max(0, prev−1)</text>
  <text x="56" y="414" text-anchor="middle" font-size="10" fill="#b85450">del += f−target</text>

  <!-- No (no conflict) -> keep -->
  <path d="M 380 392 L 440 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="384" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <rect x="442" y="368" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="388" text-anchor="middle" font-size="10" fill="#333">target = f</text>
  <text x="484" y="404" text-anchor="middle" font-size="10" fill="#4a7a3a">无需删除</text>

  <!-- Merge: prev = target -->
  <path d="M 56 420 L 56 436 L 484 436 L 484 420" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 436 L 270 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="440" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="11" fill="#333">prev = target，继续循环</text>

  <!-- loop back arrow from bottom to decision -->
  <path d="M 270 464 L 270 468 L 40 468 L 40 246 L 170 246" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
