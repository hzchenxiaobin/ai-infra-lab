<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Prim 算法流程（堆优化版）</text>

  <!-- Step 1: Initialize -->
  <rect x="40" y="50" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="78" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="82" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="74" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="92" font-size="11" fill="#555">从任意点（如 0）出发，标记 visited[0]=true，把 0 到所有其它点的距离入最小堆</text>

  <!-- arrow -->
  <path d="M 280 106 L 280 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop header -->
  <rect x="40" y="128" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="156" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="160" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="152" font-size="12" fill="#333" font-weight="bold">循环 n−1 次（每次加入一个新节点）</text>
  <text x="100" y="170" font-size="11" fill="#555">从最小堆弹出最小的 (dist, v)，跳过已 visited 的（懒删除）</text>

  <!-- arrow -->
  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Add node -->
  <rect x="40" y="206" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="234" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="238" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="230" font-size="12" fill="#333" font-weight="bold">加入新节点 v，累加代价</text>
  <text x="100" y="248" font-size="11" fill="#555">visited[v]=true；ans += dist；v 成为已加入集合 S 的新成员</text>

  <!-- arrow -->
  <path d="M 280 262 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Update edges -->
  <rect x="40" y="284" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="312" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="316" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="308" font-size="12" fill="#333" font-weight="bold">更新候选边</text>
  <text x="100" y="326" font-size="11" fill="#555">遍历 v 到所有未 visited 点 u 的曼哈顿距离，若更短则入堆</text>

  <!-- arrow back to step 2 -->
  <path d="M 520 312 L 540 312 L 540 156 L 520 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="544" y="234" font-size="10" fill="#888" writing-mode="tb">回到步骤 2</text>

  <!-- Step 5: Return -->
  <path d="M 280 340 L 280 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="362" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="384" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="388" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="380" font-size="12" fill="#333" font-weight="bold">返回 ans（n−1 条边代价之和）</text>
  <text x="100" y="398" font-size="11" fill="#555">所有点已连通，ans 即为最小总费用</text>

  <!-- bottom note -->
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#888">每条边只在入堆时计算一次曼哈顿距离，堆操作 O(n² log n)</text>
  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#888">稠密图可用 O(n²) 朴素 Prim 替代堆（见第 5 节扩展）</text>
</svg>
