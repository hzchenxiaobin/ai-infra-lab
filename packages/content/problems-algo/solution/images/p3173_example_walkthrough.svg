<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 382" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="382" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个官方示例恰好覆盖 OR 的三个档位</text>

  <rect x="24" y="34" width="472" height="104" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="38" y="57" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① nums = [1, 3, 7, 15] → answer = [3, 7, 15]</text>

  <rect x="36" y="66" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="85" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1 | 3 = 3</text>
  <text x="107" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">001 | 011 = 011</text>

  <rect x="190" y="66" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="85" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3 | 7 = 7</text>
  <text x="261" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">011 | 111 = 111</text>

  <rect x="344" y="66" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="85" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">7 | 15 = 15</text>
  <text x="415" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0111 | 1111 = 1111</text>

  <text x="260" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">位的嵌套链 001 ⊆ 011 ⊆ 111 ⊆ 1111 → 每对都取 max（左端取等），answer 即 nums[1:]</text>

  <rect x="24" y="146" width="472" height="104" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="38" y="169" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② nums = [8, 4, 2] → answer = [12, 6]</text>

  <rect x="36" y="178" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="197" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">8 | 4 = 12</text>
  <text x="107" y="215" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1000 | 0100 = 1100</text>

  <rect x="190" y="178" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="197" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4 | 2 = 6</text>
  <text x="261" y="215" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0100 | 0010 = 0110</text>

  <text x="260" y="242" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">位两两不相交（a &amp; b = 0）→ OR 退化为加法：12 = 8 + 4、6 = 4 + 2（右端取等）</text>

  <rect x="24" y="258" width="472" height="104" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="38" y="281" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ nums = [5, 4, 9, 11] → answer = [5, 13, 11]</text>

  <rect x="36" y="290" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="309" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5 | 4 = 5</text>
  <text x="107" y="327" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0101 | 0100 = 0101</text>

  <rect x="190" y="290" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="309" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4 | 9 = 13</text>
  <text x="261" y="327" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0100 | 1001 = 1101</text>

  <rect x="344" y="290" width="142" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="309" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">9 | 11 = 11</text>
  <text x="415" y="327" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1001 | 1011 = 1011</text>

  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">逐对换档：子掩码（=max）/ 不相交（=和）/ 子掩码（=max）→ [5, 13, 11]</text>
</svg>
