<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：哈希表以 id 为键，arr2 覆盖 arr1，再按 id 排序输出</text>

  <!-- arr1 左上 -->
  <rect x="30" y="50" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">arr1</text>
  <line x1="40" y1="76" x2="200" y2="76" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="92" font-size="10" fill="#333" filter="url(#rough2)">{id:1, x:2, y:3}</text>
  <text x="42" y="108" font-size="10" fill="#333" filter="url(#rough2)">{id:2, x:3, y:6}</text>

  <!-- arr2 右上 -->
  <rect x="410" y="50" width="180" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">arr2</text>
  <line x1="420" y1="76" x2="580" y2="76" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="92" font-size="10" fill="#333" filter="url(#rough2)">{id:2, x:10, y:20}</text>
  <text x="422" y="108" font-size="10" fill="#333" filter="url(#rough2)">{id:3, x:0, y:0}</text>

  <!-- 箭头汇入 Map -->
  <path d="M 120 130 C 120 160, 230 168, 270 178" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="158" font-size="9" fill="#446688" filter="url(#rough2)">①入表</text>
  <path d="M 500 130 C 500 160, 390 168, 350 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="418" y="158" font-size="9" fill="#4a7a3a" filter="url(#rough2)">②覆盖</text>

  <!-- Map 中间 -->
  <rect x="180" y="180" width="260" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)" font-weight="bold">Map&lt;id, 合并对象&gt;</text>
  <line x1="190" y1="208" x2="430" y2="208" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="195" y="224" font-size="10" fill="#333" filter="url(#rough2)">1 → {id:1, x:2, y:3}</text>
  <text x="195" y="244" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">2 → {id:2, x:10, y:20}  ✦覆盖</text>
  <text x="195" y="264" font-size="10" fill="#333" filter="url(#rough2)">3 → {id:3, x:0, y:0}</text>
  <text x="195" y="286" font-size="9" fill="#888" filter="url(#rough2)">键唯一，重复 id 触发合并</text>

  <!-- 箭头到排序 -->
  <path d="M 310 300 L 310 326" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="318" font-size="9" fill="#888" filter="url(#rough2)">③取值+排序</text>

  <!-- 输出 -->
  <rect x="60" y="330" width="500" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">joinedArray（按 id 升序）</text>
  <line x1="70" y1="358" x2="550" y2="358" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="376" font-size="10" fill="#333" filter="url(#rough2)">{id:1, x:2, y:3}</text>
  <text x="220" y="376" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">{id:2, x:10, y:20}</text>
  <text x="380" y="376" font-size="10" fill="#333" filter="url(#rough2)">{id:3, x:0, y:0}</text>
  <text x="80" y="400" font-size="9" fill="#888" filter="url(#rough2)">id=1 仅 arr1 有 → 原样保留</text>
  <text x="220" y="400" font-size="9" fill="#888" filter="url(#rough2)">id=2 两方共有 → arr2 覆盖</text>
  <text x="380" y="400" font-size="9" fill="#888" filter="url(#rough2)">id=3 仅 arr2 有 → 原样保留</text>
  <text x="310" y="420" font-size="9" fill="#888" filter="url(#rough2)">长度 = 唯一 id 数 = 3</text>
</svg>
