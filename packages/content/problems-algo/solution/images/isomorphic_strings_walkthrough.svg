<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s="paper" , t="title"</text>
  <text x="290" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">逐位同步核对 s2t 与 t2s，全程无冲突 → 同构 ✓</text>

  <!-- 5 张步骤卡片：每张宽 100，间距 12，起点 x=20 -->
  <!-- 卡片 0: i=0, p→t -->
  <g>
    <rect x="20" y="70" width="100" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="70" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 0</text>
    <line x1="30" y1="100" x2="110" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="70" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s: p</text>
    <text x="70" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t: t</text>
    <line x1="30" y1="150" x2="110" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="70" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s2t:</text>
    <text x="70" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{p:t}</text>
    <text x="70" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t2s:</text>
    <text x="70" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{t:p}</text>
    <line x1="30" y1="226" x2="110" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="70" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="70" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <!-- 卡片 1: i=1, a→i -->
  <g>
    <rect x="132" y="70" width="100" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="182" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 1</text>
    <line x1="142" y1="100" x2="222" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="182" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s: a</text>
    <text x="182" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t: i</text>
    <line x1="142" y1="150" x2="222" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="182" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s2t:</text>
    <text x="182" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{p:t, a:i}</text>
    <text x="182" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t2s:</text>
    <text x="182" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{t:p, i:a}</text>
    <line x1="142" y1="226" x2="222" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="182" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="182" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <!-- 卡片 2: i=2, e→l -->
  <g>
    <rect x="244" y="70" width="100" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="294" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 2</text>
    <line x1="254" y1="100" x2="334" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="294" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s: e</text>
    <text x="294" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t: l</text>
    <line x1="254" y1="150" x2="334" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="294" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s2t:</text>
    <text x="294" y="182" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{p:t,a:i,e:l}</text>
    <text x="294" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t2s:</text>
    <text x="294" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{t:p,i:a,l:e}</text>
    <line x1="254" y1="226" x2="334" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="294" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="294" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <!-- 卡片 3: i=3, p→t (老字符，重点高亮) -->
  <g>
    <rect x="356" y="70" width="100" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="406" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 3</text>
    <line x1="366" y1="100" x2="446" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="406" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s: p</text>
    <text x="406" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t: t</text>
    <line x1="366" y1="150" x2="446" y2="150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="406" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s2t[p]:</text>
    <text x="406" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= t ✓</text>
    <text x="406" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t2s[t]:</text>
    <text x="406" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= p ✓</text>
    <line x1="366" y1="226" x2="446" y2="226" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="406" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">老字符</text>
    <text x="406" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">双向一致 ✓</text>
  </g>

  <!-- 卡片 4: i=4, r→e -->
  <g>
    <rect x="468" y="70" width="100" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="518" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 4</text>
    <line x1="478" y1="100" x2="558" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="518" y="120" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s: r</text>
    <text x="518" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t: e</text>
    <line x1="478" y1="150" x2="558" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="518" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s2t:</text>
    <text x="518" y="182" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">+{r:e}</text>
    <text x="518" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t2s:</text>
    <text x="518" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">+{e:r}</text>
    <line x1="478" y1="226" x2="558" y2="226" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="518" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两表皆新</text>
    <text x="518" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <!-- 底部结论 -->
  <rect x="120" y="296" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5 步全程无冲突</text>
  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ return true（同构）</text>

  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">对照：foo/bar 在 i=2 因 s2t[o]=a ≠ r 冲突 → false</text>
</svg>
