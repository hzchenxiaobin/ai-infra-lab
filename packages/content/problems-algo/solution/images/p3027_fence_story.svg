<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">围栏规则：Alice 必须左上、Bob 必须右下</text>

  <!-- panel 1: valid -->
  <text x="83" y="50" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">围栏空 → 合法 ✓</text>
  <rect x="26" y="86" width="118" height="128" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <circle cx="34" cy="94" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="20" y="88" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="136" cy="206" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="146" y="218" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="83" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">内部 + 边界都空</text>
  <text x="83" y="236" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同列 / 同行时围栏退化为</text>
  <text x="83" y="252" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">线段，照样合法 ✓</text>

  <!-- panel 2: third person -->
  <text x="260" y="50" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">有第三人 → 难过 ✗</text>
  <rect x="196" y="86" width="128" height="128" fill="#fce4ec" fill-opacity="0.35" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <circle cx="204" cy="94" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="190" y="88" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="316" cy="206" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="326" y="218" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="266" cy="152" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="276" y="148" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <circle cx="240" cy="214" r="4.5" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">压在边上也算</text>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">闭矩形：内部、边界都不能有</text>

  <!-- panel 3: wrong direction -->
  <text x="437" y="50" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">方向反 → 建不成 ✗</text>
  <circle cx="392" cy="96" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="380" y="90" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="478" cy="204" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="486" y="216" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <path d="M 396 104 L 474 196" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="140" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="437" y="236" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">A 在 B 右下方，</text>
  <text x="437" y="252" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">A 没法当左上角</text>

  <!-- bottom: scale up note -->
  <rect x="48" y="286" width="424" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">II 相比 I（3025）只放大了规模，规则一字不变：</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n：50 → 1000（×20），坐标：[0,50] → ±10⁹</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">放大的正是「暴力能不能过」的分水岭，见下文复杂度分析</text>

  <!-- tiny legend -->
  <text x="52" y="378" font-size="10" fill="#446688" filter="url(#rough2)">● Alice（左上角）</text>
  <text x="196" y="378" font-size="10" fill="#4a7a3a" filter="url(#rough2)">● Bob（右下角）</text>
  <text x="330" y="378" font-size="10" fill="#b85450" filter="url(#rough2)">● 其它人（一个点站一个人）</text>
</svg>
