<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：总乘积 = target²，找到一半就够</text>

  <!-- nums 行（按子集着色） -->
  <text x="26" y="59" font-size="11.5" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="88" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="38" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="38" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="202" y="38" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="240" y="38" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="286" y="59" font-size="11.5" fill="#555" filter="url(#rough2)">target = 24</text>

  <!-- 子集 A -->
  <text x="40" y="108" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">A:</text>
  <rect x="88" y="88" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="107" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">×</text>
  <rect x="140" y="88" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="184" y="107" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">=</text>
  <rect x="198" y="88" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="221" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">24 ✓</text>

  <!-- 子集 B -->
  <text x="40" y="150" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B:</text>
  <rect x="88" y="130" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="149" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">×</text>
  <rect x="140" y="130" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="180" y="149" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">×</text>
  <rect x="192" y="130" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="234" y="149" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">=</text>
  <rect x="248" y="130" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="271" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">24 ✓</text>

  <!-- 等式框 -->
  <rect x="30" y="180" width="292" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">总乘积 = 3×1×6×8×4 = 576 = 24² = target²</text>

  <!-- 洞察框 -->
  <rect x="30" y="232" width="292" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">只需找一个非空真子集 S，prod(S) = target</text>
  <text x="176" y="270" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">补集乘积 = target² ÷ target = target</text>
  <text x="176" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">划分自动成立，验证量直接减半 ✓</text>

  <!-- 右侧反例面板 -->
  <rect x="336" y="38" width="170" height="256" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 反例：条件满足仍无解</text>
  <text x="421" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">nums = [6,10,15]，target = 30</text>
  <text x="421" y="98" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">总乘积 900 = 30² ✓</text>
  <text x="421" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个元素都整除 30 ✓</text>
  <text x="421" y="140" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">但非空真子集乘积只有：</text>
  <text x="421" y="158" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6, 10, 15, 60, 90, 150</text>
  <text x="421" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">没有一个等于 30 ✗</text>
  <text x="421" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">→ 返回 false</text>
  <text x="421" y="226" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必要条件 ≠ 充分条件</text>
  <text x="421" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必须真正枚举子集乘积</text>
  <text x="421" y="272" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">(好在 n ≤ 12，枚举得起)</text>

  <!-- 底部结论 -->
  <rect x="30" y="312" width="478" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">n ≤ 12 ⟹ 子集只有 2¹² = 4096 个</text>
  <text x="269" y="351" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">位掩码逐个枚举非空真子集，乘积一旦超过 target 立即剪枝</text>
</svg>
