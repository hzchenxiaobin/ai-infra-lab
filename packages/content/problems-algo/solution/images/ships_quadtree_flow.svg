<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：分治递归</text>

  <!-- Start -->
  <rect x="120" y="38" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="220" y="58" text-anchor="middle" font-size="11" fill="#333">countShips(topRight, bottomLeft)</text>

  <!-- Arrow down -->
  <path d="M 220 70 L 220 82" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision 1: bottomLeft > topRight? -->
  <polygon points="220,84 320,118 220,152 120,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="10" fill="#444">bottomLeft</text>
  <text x="220" y="128" text-anchor="middle" font-size="10" fill="#444">&gt; topRight?</text>

  <!-- Yes arrow to right -->
  <path d="M 320 118 L 370 118" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="112" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="370" y="104" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="122" text-anchor="middle" font-size="10" fill="#b85450">return 0</text>

  <!-- No arrow down -->
  <path d="M 220 152 L 220 164" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="235" y="160" font-size="9" fill="#4a7a3a">否</text>

  <!-- Decision 2: hasShips? -->
  <polygon points="220,166 320,200 220,234 120,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="197" text-anchor="middle" font-size="10" fill="#444">hasShips?</text>
  <text x="220" y="210" text-anchor="middle" font-size="9" fill="#888">(查询接口)</text>

  <!-- No (false) arrow to right -->
  <path d="M 320 200 L 370 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="194" text-anchor="middle" font-size="9" fill="#b85450">false</text>
  <rect x="370" y="186" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="204" text-anchor="middle" font-size="10" fill="#b85450">return 0</text>

  <!-- Yes (true) arrow down -->
  <path d="M 220 234 L 220 246" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="235" y="242" font-size="9" fill="#4a7a3a">true</text>

  <!-- Decision 3: single point? -->
  <polygon points="220,248 320,282 220,316 120,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="279" text-anchor="middle" font-size="10" fill="#444">x1==x2</text>
  <text x="220" y="292" text-anchor="middle" font-size="10" fill="#444">&amp;&amp; y1==y2?</text>

  <!-- Yes arrow to right -->
  <path d="M 320 282 L 370 282" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="370" y="268" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">return 1</text>

  <!-- No arrow down -->
  <path d="M 220 316 L 220 328" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="235" y="324" font-size="9" fill="#4a7a3a">否</text>

  <!-- Process: split into 4 -->
  <rect x="120" y="330" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="350" text-anchor="middle" font-size="10" fill="#333">四等分：midX, midY 切四象限</text>

  <!-- Arrow down -->
  <path d="M 220 362 L 220 374" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Process: recurse -->
  <rect x="120" y="376" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="396" text-anchor="middle" font-size="10" fill="#333">递归 4 个子矩形并求和</text>

  <!-- Arrow down -->
  <path d="M 220 408 L 220 420" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Return sum -->
  <rect x="120" y="422" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="220" y="440" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return a + b + c + d</text>
</svg>
