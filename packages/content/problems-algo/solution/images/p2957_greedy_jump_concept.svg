<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：|差| ≤ 1 即冲突 → 改右格为安全字符，i 直接 +2</text>

  <!-- 区块 A：近似相等定义 -->
  <text x="24" y="50" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 近似相等 = 相等或字母表相邻 ⟺ |a − b| ≤ 1</text>

  <rect x="100" y="60" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="140" y="60" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="180" y="60" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="220" y="60" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">e</text>
  <rect x="260" y="60" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">f</text>

  <ellipse cx="160" cy="75" rx="66" ry="26" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">与 c 近似相等：{b, c, d}，共至多 3 个</text>

  <rect x="348" y="52" width="168" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="72" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">判定 O(1)：作差取绝对值</text>
  <text x="432" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">|a − b| ≤ 1 ⟺ 冲突</text>
  <text x="432" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（相等 = 0，相邻 = 1）</text>

  <!-- 区块 B：改右格，一次摆平两边 -->
  <text x="24" y="146" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 冲突时改 word[i] 为 ✱：与前后都不冲突，一次摆平两边</text>

  <rect x="60" y="158" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <rect x="112" y="158" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="164" y="158" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="216" y="158" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>

  <path d="M 160 146 L 168 158 L 163 158 L 170 172" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="136" y="202" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i−1</text>
  <text x="188" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i（改这格）</text>

  <path d="M 188 206 L 188 220" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="248" y="216" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 次修改</text>

  <rect x="60" y="224" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <rect x="112" y="224" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="164" y="224" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="245" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">✱</text>
  <rect x="216" y="224" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>

  <text x="136" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 安全</text>
  <text x="188" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 安全</text>

  <rect x="348" y="140" width="168" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">✱ 一定存在：</text>
  <text x="432" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前邻居排除 ≤ 3 个，后邻居 ≤ 3 个</text>
  <text x="432" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">26 − 6 &gt; 0，总有安全选择</text>
  <text x="432" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">无需知道 ✱ 是谁——只计数</text>

  <!-- 区块 C：跳 2 -->
  <text x="24" y="298" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ (i−1,i)、(i,i+1) 双双化解 → 下次比较直接 i+2</text>

  <rect x="70" y="308" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="114" y="308" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="329" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">✱</text>
  <rect x="158" y="308" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="202" y="308" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="329" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">✱</text>
  <rect x="246" y="308" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <path d="M 136 304 Q 180 282 224 304" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="180" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">跳过 i=2</text>

  <rect x="352" y="304" width="158" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="431" y="321" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">"aaaaa" → ans = 2 ✓</text>
  <text x="431" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（示例 1：改下标 1、3 两格）</text>
</svg>
