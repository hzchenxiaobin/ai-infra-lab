<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">前缀和一趟统计流程（O(n)）</text>

  <rect x="215" y="36" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 62 L 260 76" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="80" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#333">构建前缀和：prefix[0] = 0</text>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#333">prefix[i+1] = prefix[i] + nums[i]</text>
  <path d="M 260 124 L 260 138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="142" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#333">i = 0，ans = 0</text>
  <path d="M 260 168 L 260 182" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,186 330,214 260,242 190,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>

  <path d="M 190 214 L 154 214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="206" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="30" y="200" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="90" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans ⭐</text>

  <path d="M 260 242 L 260 256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="254" font-size="10" fill="#4a7a3a">是</text>

  <rect x="150" y="260" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333">start = max(0, i − nums[i])</text>
  <path d="M 260 286 L 260 300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="304" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += prefix[i+1] − prefix[start]</text>

  <path d="M 380 317 L 460 317 L 460 214 L 334 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="270" font-size="10" fill="#888">i++</text>
</svg>
