<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[9,9,9] → 999×2 = 1998</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- reversed list header -->
  <text x="80" y="78" font-size="13" font-weight="bold" fill="#2e6e2e">反转后链表（个位在前）：</text>
  <g filter="url(#sk)">
    <rect x="280" y="62" width="50" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="332" y="62" width="50" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="384" y="62" width="50" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="305" y="84" text-anchor="middle" font-size="15" fill="#2e6e2e">9</text>
  <text x="357" y="84" text-anchor="middle" font-size="15" fill="#2e6e2e">9</text>
  <text x="409" y="84" text-anchor="middle" font-size="15" fill="#2e6e2e">9</text>
  <text x="460" y="84" font-size="11" fill="#888">个位 → 最高位</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="60" y="110" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="180" y="110" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="300" y="110" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="420" y="110" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="540" y="110" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="120" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">步骤</text>
  <text x="240" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">当前位</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">carry（入）</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">v=位×2+carry</text>
  <text x="600" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">写值 / 进位</text>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="60" y="140" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="140" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="140" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="420" y="140" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="140" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#333">1（个位）</text>
  <text x="240" y="160" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="480" y="160" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">9×2+0=18</text>
  <text x="600" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8 / 进1</text>

  <g filter="url(#sk)">
    <rect x="60" y="170" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="170" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="170" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="420" y="170" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="170" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="120" y="190" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="240" y="190" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="190" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">9×2+1=19</text>
  <text x="600" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9 / 进1</text>

  <g filter="url(#sk)">
    <rect x="60" y="200" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="200" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="200" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="420" y="200" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="200" width="120" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="120" y="220" text-anchor="middle" font-size="12" fill="#333">3（最高位）</text>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="220" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">9×2+1=19</text>
  <text x="600" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9 / 进1</text>

  <!-- carry remains -->
  <g filter="url(#sk)"><rect x="60" y="240" width="600" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="360" y="260" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">遍历结束 carry 仍为 1 → 前插新最高位节点 1</text>

  <!-- result -->
  <text x="80" y="300" font-size="13" font-weight="bold" fill="#7a5415">反转回来并前插 1：</text>
  <g filter="url(#sk)">
    <rect x="250" y="284" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="302" y="284" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="354" y="284" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="406" y="284" width="50" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="275" y="306" text-anchor="middle" font-size="15" fill="#7a5415">1</text>
  <text x="327" y="306" text-anchor="middle" font-size="15" fill="#7a5415">9</text>
  <text x="379" y="306" text-anchor="middle" font-size="15" fill="#7a5415">9</text>
  <text x="431" y="306" text-anchor="middle" font-size="15" fill="#7a5415">8</text>
  <text x="475" y="306" font-size="13" fill="#555">= 1998 ✓</text>

  <g filter="url(#sk)"><rect x="60" y="340" width="760" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="80" y="358" font-size="11" fill="#7a5415">💡 三位全是 9，每位翻倍都进位；最高位进位不丢，前插成新的首位</text>
  <text x="80" y="374" font-size="11" fill="#888">这正是「循环外单独处理 carry」必须覆盖的边界——999 → 1998</text>
</svg>
