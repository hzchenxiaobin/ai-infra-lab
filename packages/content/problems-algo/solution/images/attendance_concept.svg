<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个奖励条件缺一不可（AND）</text>

  <!-- ============ Panel 1: Condition 1 ============ -->
  <rect x="30" y="44" width="500" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="12" fill="#446688" font-weight="bold">条件一：缺勤 'A' 严格少于 2 天（count(A) &lt; 2）</text>

  <!-- pass example: PPALLP -->
  <text x="50" y="92" font-size="11" fill="#888">PPALLP =</text>
  <rect x="118" y="78" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="97" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="146" y="78" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="174" y="78" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="97" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="202" y="78" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="97" text-anchor="middle" font-size="12" fill="#333">L</text>
  <rect x="230" y="78" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="97" text-anchor="middle" font-size="12" fill="#333">L</text>
  <rect x="258" y="78" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="97" text-anchor="middle" font-size="12" fill="#333">P</text>
  <text x="300" y="92" font-size="11" fill="#4a7a3a" font-weight="bold">A=1 &lt; 2</text>
  <text x="300" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">→ 满足 ✓</text>

  <!-- fail example: PAPALL -->
  <text x="50" y="138" font-size="11" fill="#888">PAPALL =</text>
  <rect x="118" y="124" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="143" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="146" y="124" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="174" y="124" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="143" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="202" y="124" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="230" y="124" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="143" text-anchor="middle" font-size="12" fill="#333">L</text>
  <rect x="258" y="124" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="143" text-anchor="middle" font-size="12" fill="#333">L</text>
  <text x="300" y="138" font-size="11" fill="#b85450" font-weight="bold">A=2 ≮ 2</text>
  <text x="300" y="152" font-size="11" fill="#b85450" font-weight="bold">→ 不满足 ✗</text>

  <!-- ============ Panel 2: Condition 2 ============ -->
  <rect x="30" y="210" width="500" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">条件二：不存在连续 3 天及以上的 'L'（无 "LLL" 子串）</text>

  <!-- pass example: PPALLP -->
  <text x="50" y="258" font-size="11" fill="#888">PPALLP =</text>
  <rect x="118" y="244" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="263" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="146" y="244" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="263" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="174" y="244" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="263" text-anchor="middle" font-size="12" fill="#333">A</text>
  <rect x="202" y="244" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="263" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">L</text>
  <rect x="230" y="244" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="263" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">L</text>
  <rect x="258" y="244" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="263" text-anchor="middle" font-size="12" fill="#333">P</text>
  <text x="300" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">最多连 2 个 L</text>
  <text x="300" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">→ 满足 ✓</text>

  <!-- fail example: PPALLL -->
  <text x="50" y="304" font-size="11" fill="#888">PPALLL =</text>
  <rect x="118" y="290" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="309" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="146" y="290" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="309" text-anchor="middle" font-size="12" fill="#333">P</text>
  <rect x="174" y="290" width="28" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="309" text-anchor="middle" font-size="12" fill="#333">A</text>
  <rect x="202" y="290" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="309" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="230" y="290" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="309" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="258" y="290" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="309" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <text x="300" y="304" font-size="11" fill="#b85450" font-weight="bold">出现 "LLL"</text>
  <text x="300" y="318" font-size="11" fill="#b85450" font-weight="bold">→ 不满足 ✗</text>

  <!-- bottom hint: AND -->
  <rect x="120" y="370" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">奖励 = 条件一 AND 条件二（两者同时成立）</text>
</svg>
