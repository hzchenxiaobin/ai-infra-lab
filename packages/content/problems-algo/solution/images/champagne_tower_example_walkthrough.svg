<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：poured = 6（逐行模拟流过体积）</text>

  <!-- ===== LEFT: pyramid ===== -->
  <text x="180" y="42" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">杯子内的数 = 流过该杯的体积 v</text>

  <!-- Row 0: dp=6 (red, overflowing) -->
  <ellipse cx="180" cy="60" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>

  <!-- Row 1: 2.5, 2.5 (red) -->
  <ellipse cx="140" cy="118" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2.5</text>
  <ellipse cx="220" cy="118" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2.5</text>

  <!-- Row 2: 0.75, 1.5, 0.75 -->
  <ellipse cx="100" cy="176" rx="18" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0.75</text>
  <ellipse cx="180" cy="176" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1.5</text>
  <ellipse cx="260" cy="176" rx="18" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0.75</text>

  <!-- Row 3: 0, 0.25, 0.25, 0 -->
  <ellipse cx="62" cy="234" rx="15" ry="15" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="62" y="237" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <ellipse cx="140" cy="234" rx="15" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="237" text-anchor="middle" font-size="8" fill="#d6a040">0.25</text>
  <ellipse cx="220" cy="234" rx="15" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="237" text-anchor="middle" font-size="8" fill="#d6a040">0.25</text>
  <ellipse cx="298" cy="234" rx="15" ry="15" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="298" y="237" text-anchor="middle" font-size="8" fill="#aaa">0</text>

  <!-- overflow arrows: Row0 -> Row1 -->
  <path d="M 168 76 Q 154 90 144 102" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 192 76 Q 206 90 216 102" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="148" y="90" text-anchor="middle" font-size="8.5" fill="#b85450">2.5</text>
  <text x="212" y="90" text-anchor="middle" font-size="8.5" fill="#b85450">2.5</text>

  <!-- Row1[0] -> Row2[0], Row2[1] -->
  <path d="M 128 134 Q 114 148 104 160" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 152 134 Q 164 148 174 160" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="148" text-anchor="middle" font-size="8" fill="#b85450">0.75</text>
  <text x="170" y="148" text-anchor="middle" font-size="8" fill="#b85450">0.75</text>

  <!-- Row1[1] -> Row2[1], Row2[2] -->
  <path d="M 208 134 Q 196 148 186 160" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 232 134 Q 246 148 256 160" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="8" fill="#b85450">0.75</text>
  <text x="256" y="148" text-anchor="middle" font-size="8" fill="#b85450">0.75</text>

  <!-- Row2[1] -> Row3[1], Row3[2] -->
  <path d="M 168 192 Q 154 206 144 220" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 192 192 Q 206 206 216 220" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="148" y="208" text-anchor="middle" font-size="8" fill="#b85450">0.25</text>
  <text x="212" y="208" text-anchor="middle" font-size="8" fill="#b85450">0.25</text>

  <!-- merge callout pointing to Row2[1] -->
  <path d="M 340 176 L 300 176" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== RIGHT: dp table ===== -->
  <text x="475" y="42" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">dp 表（流过体积 v）</text>

  <g font-size="9.5" fill="#333">
    <!-- header -->
    <rect x="360" y="52" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="68" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">r\g</text>
    <rect x="400" y="52" width="48" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="424" y="68" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="448" y="52" width="48" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="472" y="68" text-anchor="middle" font-size="9" fill="#888">1</text>
    <rect x="496" y="52" width="48" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="520" y="68" text-anchor="middle" font-size="9" fill="#888">2</text>
    <rect x="544" y="52" width="48" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="568" y="68" text-anchor="middle" font-size="9" fill="#888">3</text>

    <!-- row 0 -->
    <rect x="360" y="76" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="92" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="400" y="76" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="424" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="448" y="76" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="472" y="92" text-anchor="middle" fill="#ccc">—</text>
    <rect x="496" y="76" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="520" y="92" text-anchor="middle" fill="#ccc">—</text>
    <rect x="544" y="76" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="568" y="92" text-anchor="middle" fill="#ccc">—</text>

    <!-- row 1 -->
    <rect x="360" y="100" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="116" text-anchor="middle" font-size="9" fill="#888">1</text>
    <rect x="400" y="100" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="424" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">2.5</text>
    <rect x="448" y="100" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="472" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">2.5</text>
    <rect x="496" y="100" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="520" y="116" text-anchor="middle" fill="#ccc">—</text>
    <rect x="544" y="100" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="568" y="116" text-anchor="middle" fill="#ccc">—</text>

    <!-- row 2 -->
    <rect x="360" y="124" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="140" text-anchor="middle" font-size="9" fill="#888">2</text>
    <rect x="400" y="124" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="424" y="140" text-anchor="middle" fill="#d6a040">0.75</text>
    <rect x="448" y="124" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="472" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">1.5</text>
    <rect x="496" y="124" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="520" y="140" text-anchor="middle" fill="#d6a040">0.75</text>
    <rect x="544" y="124" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="568" y="140" text-anchor="middle" fill="#ccc">—</text>

    <!-- row 3 -->
    <rect x="360" y="148" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="164" text-anchor="middle" font-size="9" fill="#888">3</text>
    <rect x="400" y="148" width="48" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="424" y="164" text-anchor="middle" fill="#aaa">0</text>
    <rect x="448" y="148" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="472" y="164" text-anchor="middle" fill="#d6a040">0.25</text>
    <rect x="496" y="148" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="520" y="164" text-anchor="middle" fill="#d6a040">0.25</text>
    <rect x="544" y="148" width="48" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="568" y="164" text-anchor="middle" fill="#aaa">0</text>
  </g>

  <!-- merge annotation box -->
  <rect x="345" y="186" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">dp[2][1] = 0.75 + 0.75 = 1.5</text>
  <text x="470" y="220" text-anchor="middle" font-size="9.5" fill="#555">两个父杯各贡献一半溢出 → 中间杯叠加</text>

  <!-- bottom legend + answer -->
  <rect x="30" y="262" width="560" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="280" font-size="10" fill="#b85450" font-weight="bold">■ 红 = v&gt;1（溢出）</text>
  <text x="210" y="280" font-size="10" fill="#d6a040" font-weight="bold">■ 黄 = 0&lt;v≤1（部分满）</text>
  <text x="380" y="280" font-size="10" fill="#888" font-weight="bold">■ 灰 = v=0（无流入）</text>
  <text x="310" y="299" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">答案 = min(1, dp[query_row][query_glass])</text>
</svg>
