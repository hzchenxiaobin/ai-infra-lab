<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "100011001"，k = 3（1 的位置 0, 4, 5, 8）</text>

  <!-- 表头 -->
  <rect x="40" y="40" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right</text>
  <rect x="120" y="40" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">动作</text>
  <rect x="270" y="40" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">候选</text>
  <rect x="380" y="40" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt</text>
  <rect x="440" y="40" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans</text>

  <!-- 行 1 -->
  <rect x="40" y="68" width="80" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#333">0–4</text>
  <rect x="120" y="68" width="150" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="88" text-anchor="middle" font-size="12" fill="#333">扫描，1 不足 k</text>
  <rect x="270" y="68" width="110" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#999">无</text>
  <rect x="380" y="68" width="60" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="12" fill="#333">1→2</text>
  <rect x="440" y="68" width="80" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="88" text-anchor="middle" font-size="12" fill="#999">""</text>

  <!-- 行 2 -->
  <rect x="40" y="100" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="120" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="120" y="100" width="150" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="12" fill="#333">cnt 达 3，首已贴 1</text>
  <rect x="270" y="100" width="110" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="120" text-anchor="middle" font-size="12" fill="#333">"100011"</text>
  <rect x="380" y="100" width="60" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="440" y="100" width="80" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="113" text-anchor="middle" font-size="11" fill="#333">"100011"</text>
  <text x="480" y="126" text-anchor="middle" font-size="10" fill="#999">长 6</text>

  <!-- 行 3 -->
  <rect x="40" y="132" width="80" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="152" text-anchor="middle" font-size="12" fill="#333">6–7</text>
  <rect x="120" y="132" width="150" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="152" text-anchor="middle" font-size="12" fill="#333">进尾随 0，候选变长</text>
  <rect x="270" y="132" width="110" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="152" text-anchor="middle" font-size="12" fill="#999">"1000110"…</text>
  <rect x="380" y="132" width="60" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="440" y="132" width="80" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="152" text-anchor="middle" font-size="11" fill="#333">不变</text>

  <!-- 行 4：关键行 -->
  <rect x="40" y="164" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="80" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">关键步</text>
  <rect x="120" y="164" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="182" text-anchor="middle" font-size="11" fill="#333">cnt=4 超载 → 弹出 s₀</text>
  <text x="195" y="198" text-anchor="middle" font-size="11" fill="#333">left 越过 3 个前导 0</text>
  <rect x="270" y="164" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"11001"</text>
  <text x="325" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">长 5，更短</text>
  <rect x="380" y="164" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="12" fill="#333">4→3</text>
  <rect x="440" y="164" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"11001"</text>
  <text x="480" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 更新</text>

  <!-- 关键步小图：s 的格子 -->
  <text x="60" y="240" font-size="12" fill="#446688" font-weight="bold">关键步（right=8）窗口收缩示意：</text>

  <rect x="150" y="228" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="243" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <path d="M 155 234 L 175 244 M 155 244 L 175 234" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="228" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="195" y="243" text-anchor="middle" font-size="11" fill="#d6a040">0</text>
  <rect x="210" y="228" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="225" y="243" text-anchor="middle" font-size="11" fill="#d6a040">0</text>
  <rect x="240" y="228" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="255" y="243" text-anchor="middle" font-size="11" fill="#d6a040">0</text>
  <rect x="270" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="243" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="300" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="243" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="330" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="243" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="360" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="243" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="390" y="228" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="243" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="150" y="268" font-size="10" fill="#b85450">弹出（超载）</text>
  <text x="255" y="268" text-anchor="middle" font-size="10" fill="#d6a040">去前导 0</text>
  <text x="337" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">窗口 [4,8] = "11001"</text>

  <!-- 结论 -->
  <rect x="60" y="284" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 "11001"（长 5）✓ 与官方答案一致</text>
</svg>
