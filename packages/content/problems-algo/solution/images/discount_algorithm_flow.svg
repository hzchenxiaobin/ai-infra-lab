<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：按空格切分 → 逐词判定 → 整数分运算 → 空格拼接</text>

  <!-- 1. split -->
  <rect x="160" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">① 按单个空格切分 sentence → words[]</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. next word -->
  <rect x="160" y="100" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">② 取下一个 word</text>

  <path d="M 270 138 L 270 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. diamond: is price? -->
  <polygon points="270,158 380,202 270,246 160,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">是价格词？</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#888">w[0]=='$' 且 w[1:] 全数字</text>

  <!-- 否 → keep word -->
  <path d="M 160 202 L 90 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="194" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="188" width="66" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="53" y="206" text-anchor="middle" font-size="10.5" fill="#333">原样保留</text>

  <!-- 是 ↓ -->
  <path d="M 270 246 L 270 266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 4. parse price -->
  <rect x="130" y="266" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#333">③ price = 解析 w[1:] 为整数（long long）</text>

  <path d="M 270 304 L 270 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. cents -->
  <rect x="110" y="322" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ cents = price × (100 − discount)</text>

  <path d="M 270 360 L 270 378" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. format -->
  <rect x="100" y="378" width="340" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="11.5" fill="#333">⑤ 格式化 $dollars.frac（frac 补零至 2 位）</text>

  <!-- loop back arrow to ② -->
  <path d="M 440 397 L 480 397 L 480 119 L 382 119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="452" y="258" font-size="10" fill="#666">处理完所有词</text>
  <text x="452" y="272" font-size="10" fill="#666">回到 ②</text>

  <!-- end: join -->
  <path d="M 270 416 L 270 432" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="432" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="449" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ 用单空格 join → 返回</text>
</svg>
