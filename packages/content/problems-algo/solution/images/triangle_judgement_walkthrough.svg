<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两行各做三次比较，全过为 Yes</text>

  <!-- Column headers -->
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="70" y="58" text-anchor="middle">行</text>
    <text x="150" y="58" text-anchor="middle">x, y, z</text>
    <text x="245" y="58" text-anchor="middle">x+y&gt;z</text>
    <text x="325" y="58" text-anchor="middle">x+z&gt;y</text>
    <text x="405" y="58" text-anchor="middle">y+z&gt;x</text>
    <text x="475" y="58" text-anchor="middle">结论</text>
  </g>

  <!-- Row 1: 13, 15, 30 -> No -->
  <rect x="30" y="70" width="470" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="70" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- x,y,z cells -->
  <rect x="105" y="88" width="36" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <rect x="143" y="88" width="36" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <rect x="181" y="88" width="36" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">30</text>

  <!-- checks -->
  <text x="245" y="108" text-anchor="middle" font-size="11" fill="#333">28&gt;30</text>
  <text x="245" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#333">43&gt;15</text>
  <text x="325" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="405" y="108" text-anchor="middle" font-size="11" fill="#333">45&gt;13</text>
  <text x="405" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="475" y="115" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">No</text>

  <!-- Row 2: 10, 20, 15 -> Yes -->
  <rect x="30" y="170" width="470" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="70" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="105" y="188" width="36" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="143" y="188" width="36" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>
  <rect x="181" y="188" width="36" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <text x="245" y="208" text-anchor="middle" font-size="11" fill="#333">30&gt;15</text>
  <text x="245" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="325" y="208" text-anchor="middle" font-size="11" fill="#333">25&gt;20</text>
  <text x="325" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="405" y="208" text-anchor="middle" font-size="11" fill="#333">35&gt;10</text>
  <text x="405" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="475" y="215" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- rule box -->
  <rect x="30" y="270" width="470" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="290" text-anchor="middle" font-size="11" fill="#444">判定规则：三个不等式 AND 串联 → 全 ✓ 才 Yes</text>
  <text x="265" y="306" text-anchor="middle" font-size="10" fill="#888">行1 第1式即 ✗ → 短路为 No；行2 三式全 ✓ → Yes</text>

  <!-- GREATEST shortcut -->
  <rect x="30" y="328" width="470" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">等价捷径：排序后只判「最小两边和 &gt; 最大边」</text>
  <text x="265" y="366" text-anchor="middle" font-size="10" fill="#444">行1: max=30, 13+15=28 &lt; 30 → No</text>
  <text x="265" y="380" text-anchor="middle" font-size="10" fill="#444">行2: max=20, 10+15=25 &gt; 20 → Yes</text>
</svg>
