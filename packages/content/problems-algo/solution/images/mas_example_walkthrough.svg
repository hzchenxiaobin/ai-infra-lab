<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">示例演算：sea 与 eat，答案 231</text>
  <path d="M 250 44 Q 390 52 530 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="58" text-anchor="middle" font-size="11" fill="#888">绿色路径 = 最优回溯：保留公共子序列 "ea"，删 s1 的 's'(115) + 删 s2 的 't'(116) = 231</text>

  <!-- 行/列标签 -->
  <text x="80" y="104" font-size="11" fill="#888" font-weight="bold" text-anchor="end">s2→</text>
  <text x="80" y="124" font-size="11" fill="#888" font-weight="bold" text-anchor="end">s1↓</text>

  <!-- 列标题 -->
  <text x="160" y="96" text-anchor="middle" font-size="11" fill="#666">""</text>
  <text x="240" y="96" text-anchor="middle" font-size="11" fill="#666">e</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#666">a</text>
  <text x="400" y="96" text-anchor="middle" font-size="11" fill="#666">t</text>

  <!-- 行标题 -->
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#666">""</text>
  <text x="120" y="194" text-anchor="middle" font-size="11" fill="#666">s</text>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#666">e</text>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#666">a</text>

  <!-- 第一行：边界 -->
  <g filter="url(#sk)"><rect x="130" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="240" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">101</text>
  <g filter="url(#sk)"><rect x="290" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">198</text>
  <g filter="url(#sk)"><rect x="370" y="110" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="400" y="140" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">314</text>

  <!-- 第二行 dp[1] (s) -->
  <!-- dp[1][0]=115 路径起点：删 s1 的 s -->
  <g filter="url(#sk)"><rect x="130" y="170" width="60" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <text x="160" y="200" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">115</text>
  <g filter="url(#sk)"><rect x="210" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">216</text>
  <g filter="url(#sk)"><rect x="290" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="320" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">313</text>
  <g filter="url(#sk)"><rect x="370" y="170" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="400" y="200" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">429</text>

  <!-- 第三行 dp[2] (e) -->
  <g filter="url(#sk)"><rect x="130" y="230" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="260" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">216</text>
  <!-- dp[2][1]=115 路径：e==e 保留 -->
  <g filter="url(#sk)"><rect x="210" y="230" width="60" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <text x="240" y="260" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">115</text>
  <g filter="url(#sk)"><rect x="290" y="230" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="320" y="260" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">212</text>
  <g filter="url(#sk)"><rect x="370" y="230" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="400" y="260" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">328</text>

  <!-- 第四行 dp[3] (a) -->
  <g filter="url(#sk)"><rect x="130" y="290" width="60" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="160" y="320" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">313</text>
  <g filter="url(#sk)"><rect x="210" y="290" width="60" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="320" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">212</text>
  <!-- dp[3][2]=115 路径：a==a 保留 -->
  <g filter="url(#sk)"><rect x="290" y="290" width="60" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <text x="320" y="320" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">115</text>
  <!-- dp[3][3]=231 答案 -->
  <g filter="url(#sk)"><rect x="370" y="290" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">231</text>

  <!-- 回溯路径箭头（从答案倒推） -->
  <!-- dp[3][3] → dp[3][2]：删 s2 的 t (116)，左箭头 -->
  <path d="M 372 314 L 350 314" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="354" y="306" font-size="10" fill="#b85450" font-weight="bold">删 t +116</text>
  <!-- dp[3][2] → dp[2][1]：a==a 保留，对角箭头 -->
  <path d="M 290 300 Q 264 282 246 268" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="256" y="288" font-size="10" fill="#4a8e4a" font-weight="bold">a==a 保留</text>
  <!-- dp[2][1] → dp[1][0]：e==e 保留，对角箭头 -->
  <path d="M 210 240 Q 184 222 166 208" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="170" y="228" font-size="10" fill="#4a8e4a" font-weight="bold">e==e 保留</text>
  <!-- dp[1][0]：边界起点标注 删 s1 的 s -->
  <text x="100" y="226" font-size="10" fill="#c98a2b" font-weight="bold">删 s +115</text>

  <!-- 右侧：回溯结论 -->
  <g filter="url(#sk)">
    <rect x="470" y="110" width="280" height="200" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="610" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">最优回溯结论</text>
  <text x="490" y="160" font-size="11" fill="#4a8e4a" font-weight="bold">保留的公共子序列：</text>
  <g filter="url(#sk)"><rect x="490" y="170" width="28" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="504" y="188" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">e</text>
  <g filter="url(#sk)"><rect x="520" y="170" width="28" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="534" y="188" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">a</text>
  <text x="556" y="188" font-size="11" fill="#888">= "ea" (ASCII 198)</text>

  <text x="490" y="218" font-size="11" fill="#b85450" font-weight="bold">从 s1="sea" 删除：</text>
  <g filter="url(#sk)"><rect x="490" y="228" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="504" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s</text>
  <text x="526" y="246" font-size="11" fill="#888">ASCII 115</text>

  <text x="490" y="276" font-size="11" fill="#c98a2b" font-weight="bold">从 s2="eat" 删除：</text>
  <g filter="url(#sk)"><rect x="490" y="286" width="28" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="504" y="304" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">t</text>
  <text x="526" y="304" font-size="11" fill="#888">ASCII 116</text>

  <!-- 底部等式 -->
  <g filter="url(#sk)">
    <rect x="80" y="330" width="670" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="415" y="364" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">最小删除和 = 115(s) + 116(t) = 231</text>

  <!-- 底部注释 -->
  <text x="80" y="412" font-size="11" fill="#888">橙色 = 空串边界（删光另一侧的 ASCII 累加），蓝色 = 普通 DP 格，绿框 = 最优回溯路径，黄框 = 最终答案 dp[m][n]。</text>
  <text x="80" y="432" font-size="11" fill="#888">回溯规则：字符相等且 dp[i][j]==dp[i-1][j-1] → 保留走对角；否则走向 (删 s1) / (删 s2) 中还原等式成立的分支。</text>
</svg>
