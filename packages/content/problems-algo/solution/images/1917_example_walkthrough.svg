<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：2021-03-15 日的用户对筛选过程</text>

  <!-- ===== Day 03-15 listening data ===== -->
  <text x="30" y="48" font-size="10" fill="#888">2021-03-15 收听数据</text>
  <rect x="20" y="54" width="280" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="70" font-size="9" fill="#446688" font-weight="bold">user  歌曲</text>
  <line x1="20" y1="76" x2="300" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="92" font-size="9" fill="#4a7a3a">用户1: {10, 11, 12}</text>
  <text x="30" y="108" font-size="9" fill="#4a7a3a">用户2: {10, 11, 12}</text>
  <text x="30" y="124" font-size="9" fill="#4a7a3a">用户3: {10, 11, 12}</text>
  <text x="30" y="140" font-size="9" fill="#b85450">用户4: {10, 11, 13}</text>
  <text x="30" y="160" font-size="8" fill="#888">用户5 在 03-16，不参与本日</text>

  <!-- ===== Friendship note ===== -->
  <rect x="310" y="54" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="74" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Friendship</text>
  <text x="385" y="90" text-anchor="middle" font-size="9" fill="#666">(1, 2) 是好友</text>
  <text x="385" y="100" text-anchor="middle" font-size="8" fill="#888">对称化: (1,2)+(2,1)</text>

  <!-- ===== Pair analysis table ===== -->
  <text x="30" y="200" font-size="10" fill="#888">自连接后按 (day, user_x, user_y) 分组的用户对分析</text>

  <rect x="20" y="206" width="580" height="264" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="30" y="222" font-size="9" fill="#446688" font-weight="bold">user_x</text>
  <text x="90" y="222" font-size="9" fill="#446688" font-weight="bold">user_y</text>
  <text x="160" y="222" font-size="9" fill="#446688" font-weight="bold">共同歌曲</text>
  <text x="290" y="222" font-size="9" fill="#446688" font-weight="bold">数量</text>
  <text x="340" y="222" font-size="9" fill="#446688" font-weight="bold">好友?</text>
  <text x="400" y="222" font-size="9" fill="#446688" font-weight="bold">≥3?</text>
  <text x="460" y="222" font-size="9" fill="#446688" font-weight="bold">结论</text>
  <line x1="20" y1="228" x2="600" y2="228" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- (1,2) friends - excluded -->
  <rect x="22" y="230" width="576" height="22" fill="#fce4ec" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="244" font-size="9" fill="#b85450">1</text>
  <text x="90" y="244" font-size="9" fill="#b85450">2</text>
  <text x="160" y="244" font-size="9" fill="#b85450">{10, 11, 12}</text>
  <text x="290" y="244" font-size="9" fill="#b85450">3</text>
  <text x="340" y="244" font-size="9" fill="#b85450">✓ 好友</text>
  <text x="400" y="244" font-size="9" fill="#888">✓</text>
  <text x="460" y="244" font-size="9" fill="#b85450" font-weight="bold">✗ NOT EXISTS 删除</text>

  <!-- (1,3) pass -->
  <rect x="22" y="252" width="576" height="22" fill="#e6f4ea" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="266" font-size="9" fill="#4a7a3a">1</text>
  <text x="90" y="266" font-size="9" fill="#4a7a3a">3</text>
  <text x="160" y="266" font-size="9" fill="#4a7a3a">{10, 11, 12}</text>
  <text x="290" y="266" font-size="9" fill="#4a7a3a">3</text>
  <text x="340" y="266" font-size="9" fill="#888">✗</text>
  <text x="400" y="266" font-size="9" fill="#4a7a3a">✓</text>
  <text x="460" y="266" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 推荐 1→3</text>

  <!-- (1,4) fail count -->
  <text x="30" y="284" font-size="9" fill="#888">1</text>
  <text x="90" y="284" font-size="9" fill="#888">4</text>
  <text x="160" y="284" font-size="9" fill="#888">{10, 11}</text>
  <text x="290" y="284" font-size="9" fill="#888">2</text>
  <text x="340" y="284" font-size="9" fill="#888">✗</text>
  <text x="400" y="284" font-size="9" fill="#b85450">✗</text>
  <text x="460" y="284" font-size="9" fill="#b85450">✗ HAVING 删除</text>

  <!-- (2,1) friends - excluded -->
  <rect x="22" y="296" width="576" height="22" fill="#fce4ec" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="310" font-size="9" fill="#b85450">2</text>
  <text x="90" y="310" font-size="9" fill="#b85450">1</text>
  <text x="160" y="310" font-size="9" fill="#b85450">{10, 11, 12}</text>
  <text x="290" y="310" font-size="9" fill="#b85450">3</text>
  <text x="340" y="310" font-size="9" fill="#b85450">✓ 好友</text>
  <text x="400" y="310" font-size="9" fill="#888">✓</text>
  <text x="460" y="310" font-size="9" fill="#b85450" font-weight="bold">✗ NOT EXISTS 删除</text>

  <!-- (2,3) pass -->
  <rect x="22" y="318" width="576" height="22" fill="#e6f4ea" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="332" font-size="9" fill="#4a7a3a">2</text>
  <text x="90" y="332" font-size="9" fill="#4a7a3a">3</text>
  <text x="160" y="332" font-size="9" fill="#4a7a3a">{10, 11, 12}</text>
  <text x="290" y="332" font-size="9" fill="#4a7a3a">3</text>
  <text x="340" y="332" font-size="9" fill="#888">✗</text>
  <text x="400" y="332" font-size="9" fill="#4a7a3a">✓</text>
  <text x="460" y="332" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 推荐 2→3</text>

  <!-- (2,4) fail count -->
  <text x="30" y="350" font-size="9" fill="#888">2</text>
  <text x="90" y="350" font-size="9" fill="#888">4</text>
  <text x="160" y="350" font-size="9" fill="#888">{10, 11}</text>
  <text x="290" y="350" font-size="9" fill="#888">2</text>
  <text x="340" y="350" font-size="9" fill="#888">✗</text>
  <text x="400" y="350" font-size="9" fill="#b85450">✗</text>
  <text x="460" y="350" font-size="9" fill="#b85450">✗ HAVING 删除</text>

  <!-- (3,1) pass (reverse) -->
  <rect x="22" y="362" width="576" height="22" fill="#e6f4ea" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="376" font-size="9" fill="#4a7a3a">3</text>
  <text x="90" y="376" font-size="9" fill="#4a7a3a">1</text>
  <text x="160" y="376" font-size="9" fill="#4a7a3a">{10, 11, 12}</text>
  <text x="290" y="376" font-size="9" fill="#4a7a3a">3</text>
  <text x="340" y="376" font-size="9" fill="#888">✗</text>
  <text x="400" y="376" font-size="9" fill="#4a7a3a">✓</text>
  <text x="460" y="376" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 推荐 3→1</text>

  <!-- (3,2) pass (reverse) -->
  <rect x="22" y="384" width="576" height="22" fill="#e6f4ea" stroke="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="30" y="398" font-size="9" fill="#4a7a3a">3</text>
  <text x="90" y="398" font-size="9" fill="#4a7a3a">2</text>
  <text x="160" y="398" font-size="9" fill="#4a7a3a">{10, 11, 12}</text>
  <text x="290" y="398" font-size="9" fill="#4a7a3a">3</text>
  <text x="340" y="398" font-size="9" fill="#888">✗</text>
  <text x="400" y="398" font-size="9" fill="#4a7a3a">✓</text>
  <text x="460" y="398" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 推荐 3→2</text>

  <!-- (3,4) fail count -->
  <text x="30" y="416" font-size="9" fill="#888">3</text>
  <text x="90" y="416" font-size="9" fill="#888">4</text>
  <text x="160" y="416" font-size="9" fill="#888">{10, 11}</text>
  <text x="290" y="416" font-size="9" fill="#888">2</text>
  <text x="340" y="416" font-size="9" fill="#888">✗</text>
  <text x="400" y="416" font-size="9" fill="#b85450">✗</text>
  <text x="460" y="416" font-size="9" fill="#b85450">✗ HAVING 删除</text>

  <!-- (4,1)(4,2)(4,3) abbreviated -->
  <text x="30" y="434" font-size="8" fill="#888">4 → 1/2/3: 均 {10,11} 共 2 首 → 全部 HAVING 删除</text>
  <text x="30" y="450" font-size="8" fill="#888">5 在 03-16 独自听歌 → 无匹配行 → 不参与任何用户对</text>

  <!-- ===== Result ===== -->
  <rect x="20" y="470" width="580" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="490" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（SELECT DISTINCT 去重后）</text>
  <text x="300" y="506" text-anchor="middle" font-size="10" fill="#446688">(1,3) (2,3) (3,1) (3,2) — 双向各一行，无重复</text>

  <!-- ===== Legend ===== -->
  <rect x="470" y="54" width="130" height="50" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="68" font-size="8" fill="#b85450">红底：好友对（NOT EXISTS 删）</text>
  <text x="480" y="80" font-size="8" fill="#4a7a3a">绿底：通过全部过滤</text>
  <text x="480" y="92" font-size="8" fill="#888">灰：HAVING 不足 3 首删</text>

</svg>
