<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="424" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：4×4 矩阵共 4 个沙漏，逐个求和取最大</text>

  <!-- ===== LEFT: 4x4 grid with max hourglass highlighted ===== -->
  <text x="138" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">grid（红框为最大沙漏 (0,0)）</text>

  <!-- max hourglass (0,0): top row (0,0)(0,1)(0,2) blue, mid (1,1) green, bot (2,0)(2,1)(2,2) blue -->
  <!-- top row -->
  <rect x="30" y="74" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="56" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <rect x="82" y="74" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <rect x="134" y="74" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="186" y="74" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="106" text-anchor="middle" font-size="14" fill="#999">3</text>

  <!-- row1: (1,0) plain, (1,1) green, (1,2) plain, (1,3) plain -->
  <rect x="30" y="126" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="158" text-anchor="middle" font-size="14" fill="#999">4</text>
  <rect x="82" y="126" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="158" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="134" y="126" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="186" y="126" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="158" text-anchor="middle" font-size="14" fill="#999">5</text>

  <!-- row2: bottom row of max hourglass blue -->
  <rect x="30" y="178" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="56" y="210" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <rect x="82" y="178" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="210" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <rect x="134" y="178" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">8</text>
  <rect x="186" y="178" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="210" text-anchor="middle" font-size="14" fill="#999">7</text>

  <!-- row3: plain -->
  <rect x="30" y="230" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="262" text-anchor="middle" font-size="14" fill="#999">4</text>
  <rect x="82" y="230" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="262" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="134" y="230" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="262" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="186" y="230" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="262" text-anchor="middle" font-size="14" fill="#999">9</text>

  <!-- red highlight border around max hourglass (0,0) 3x3 -->
  <rect x="28" y="72" width="160" height="160" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6,3" rx="6" filter="url(#rough2)"/>

  <!-- arrow to table -->
  <path d="M 240 196 L 286 196" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== RIGHT: table of 4 hourglasses ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">逐沙漏求和</text>

  <!-- header -->
  <rect x="290" y="74" width="280" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="91" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">(i,j)</text>
  <text x="376" y="91" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">顶行和</text>
  <text x="430" y="91" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">中格</text>
  <text x="484" y="91" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">底行和</text>
  <text x="540" y="91" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">总和</text>

  <line x1="346" y1="74" x2="346" y2="232" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="406" y1="74" x2="406" y2="232" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="458" y1="74" x2="458" y2="232" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="512" y1="74" x2="512" y2="232" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row (0,0) MAX -->
  <rect x="290" y="98" width="280" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="118" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">(0,0)</text>
  <text x="376" y="118" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">9</text>
  <text x="430" y="118" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="484" y="118" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">19</text>
  <text x="540" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">30 ★</text>

  <!-- row (0,1) -->
  <rect x="290" y="128" width="280" height="28" fill="#f4f7fb" stroke="none"/>
  <text x="318" y="147" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,1)</text>
  <text x="376" y="147" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="430" y="147" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="484" y="147" text-anchor="middle" font-size="11.5" fill="#333">17</text>
  <text x="540" y="147" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">24</text>

  <!-- row (1,0) -->
  <rect x="290" y="156" width="280" height="28" fill="#f4f7fb" stroke="none"/>
  <text x="318" y="175" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(1,0)</text>
  <text x="376" y="175" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="430" y="175" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="484" y="175" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="540" y="175" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">16</text>

  <!-- row (1,1) -->
  <rect x="290" y="184" width="280" height="28" fill="#f4f7fb" stroke="none"/>
  <text x="318" y="203" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(1,1)</text>
  <text x="376" y="203" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <text x="430" y="203" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <text x="484" y="203" text-anchor="middle" font-size="11.5" fill="#333">12</text>
  <text x="540" y="203" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">28</text>

  <!-- stop row -->
  <rect x="290" y="212" width="280" height="20" fill="#f4f7fb" stroke="none"/>
  <text x="430" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">枚举完所有 (m−2)(n−2)=2×2=4 个沙漏，停止</text>

  <rect x="290" y="74" width="280" height="158" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="300" y="246" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="271" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = max{30,24,16,28} = 30</text>

  <!-- footer key insight -->
  <rect x="30" y="306" width="520" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">关键：沙漏和 = 顶行段和 + 中格 + 底行段和，段和用行前缀和 O(1) 取</text>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#888">不必每次重算 7 格；3 列定长窗口天然适配前缀和差分</text>

  <!-- footer ex2 -->
  <rect x="30" y="362" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">示例 2：3×3 矩阵仅 1 个沙漏 (0,0) = 1+2+3+5+7+8+9 = 35</text>
  <text x="290" y="396" text-anchor="middle" font-size="10" fill="#888">m=n=3 时 (m−2)(n−2)=1，唯一沙漏即答案</text>
</svg>
