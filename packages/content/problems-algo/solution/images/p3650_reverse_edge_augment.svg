<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">反转 ⟺ 权 2w 的虚拟反向边</text>

  <!-- 顶部概念图 -->
  <circle cx="90" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">u</text>
  <circle cx="260" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">v</text>

  <path d="M112 80 Q185 70 236 80" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="174" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">w</text>
  <path d="M244 102 Q175 134 104 102" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="174" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2w</text>
  <text x="174" y="150" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">在 v 处反转入边并穿过</text>

  <rect x="350" y="50" width="192" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每条原边补一条</text>
  <text x="446" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">虚拟反向边 (v, u, 2w)</text>
  <text x="446" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇒ 2m 条边、全正权</text>
  <text x="446" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">直接跑 Dijkstra</text>

  <path d="M20 168 L540 168" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 底部：示例 1 -->
  <text x="20" y="192" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">示例 1：</text>

  <!-- 原边 -->
  <path d="M96 290 Q160 250 232 241" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="250" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <path d="M96 310 Q160 345 232 350" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="344" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M268 347 Q350 342 432 308" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="334" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <path d="M432 281 Q350 246 270 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="256" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <!-- 虚拟反转边 1->3 -->
  <path d="M258 248 Q352 292 444 284" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="352" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2×1 = 2</text>

  <!-- 节点 -->
  <circle cx="80" cy="300" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="306" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="250" cy="232" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="250" cy="356" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="362" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="452" cy="294" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 答案框 -->
  <rect x="300" y="344" width="236" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最优：0→1 花 3</text>
  <text x="418" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">＋ 反转到 3 花 2 ＝ 5 ✅</text>

  <!-- 图例 -->
  <path d="M24 386 L50 386" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="390" font-size="11" fill="#555" filter="url(#rough2)">原边</text>
  <path d="M98 386 L124 386" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="130" y="390" font-size="11" fill="#555" filter="url(#rough2)">虚拟反转边</text>
</svg>
