<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：延迟插入 + 二分夹击</text>

  <rect x="140" y="44" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 j = x, ans = ∞, st = ∅</text>

  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,104 340,136 260,168 180,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j &lt; n ?</text>

  <path d="M 340 136 L 396 136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="130" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="396" y="120" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="446" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 168 L 260 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="182" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="120" y="188" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">st.insert(nums[j − x])</text>

  <path d="M 260 224 L 260 242" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="244" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">it = st.lower_bound(nums[j])</text>

  <path d="M 260 280 L 260 298" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="300" width="328" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">if it ≠ end: ans = min(ans, *it − target)</text>

  <path d="M 260 336 L 260 354" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="356" width="328" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">if it ≠ begin: −−it; ans = min(ans, target − *it)</text>

  <path d="M 260 392 L 260 408" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="410" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j++</text>

  <path d="M 180 425 L 50 425 L 50 136 L 176 136" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="11" fill="#999" filter="url(#rough2)" transform="rotate(-90 40 280)">循环</text>
</svg>
