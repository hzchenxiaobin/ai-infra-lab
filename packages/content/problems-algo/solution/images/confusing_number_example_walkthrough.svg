<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种典型情况</text>

  <!-- ===== Case A: n = 89 → 68 (true) ===== -->
  <rect x="30" y="38" width="480" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">Case A：n = 89 → true（易混淆）</text>

  <!-- original digits -->
  <text x="50" y="82" font-size="10" fill="#888">原数</text>
  <rect x="84" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="124" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <!-- mapping arrows -->
  <text x="176" y="80" font-size="10" fill="#4a7a3a">8→8</text>
  <text x="176" y="94" font-size="10" fill="#d6a040">9→6</text>

  <!-- rotated digits (reversed + mapped) -->
  <text x="220" y="82" font-size="10" fill="#888">反序+映射</text>
  <rect x="270" y="68" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="88" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">6</text>
  <rect x="310" y="68" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <text x="360" y="80" font-size="11" fill="#444">rotated = 68</text>
  <text x="360" y="96" font-size="11" fill="#b85450" font-weight="bold">68 ≠ 89 → true ✓</text>

  <!-- trace table -->
  <text x="50" y="120" font-size="10" fill="#888">轮1: d=9→map=6, rotated=6 | 轮2: d=8→map=8, rotated=68 → 68≠89</text>

  <!-- ===== Case B: n = 11 → 11 (false) ===== -->
  <rect x="30" y="150" width="480" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="170" font-size="12" fill="#b85450" font-weight="bold">Case B：n = 11 → false（中心对称，非易混淆）</text>

  <text x="50" y="194" font-size="10" fill="#888">原数</text>
  <rect x="84" y="180" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="180" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <text x="176" y="192" font-size="10" fill="#4a7a3a">1→1</text>
  <text x="176" y="206" font-size="10" fill="#4a7a3a">1→1</text>

  <text x="220" y="194" font-size="10" fill="#888">反序+映射</text>
  <rect x="270" y="180" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="180" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <text x="360" y="192" font-size="11" fill="#444">rotated = 11</text>
  <text x="360" y="208" font-size="11" fill="#b85450" font-weight="bold">11 = 11 → false ✗</text>

  <text x="50" y="228" font-size="10" fill="#888">旋转后与原数相同 → 中心对称数（strobogrammatic），不构成易混淆</text>

  <!-- ===== Case C: n = 25 → invalid (false) ===== -->
  <rect x="30" y="250" width="480" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="270" font-size="12" fill="#b85450" font-weight="bold">Case C：n = 25 → false（含非法数字）</text>

  <text x="50" y="294" font-size="10" fill="#888">原数</text>
  <rect x="84" y="280" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="280" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <text x="176" y="296" font-size="10" fill="#b85450" font-weight="bold">5 ∉ 映射表</text>

  <rect x="270" y="280" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <text x="360" y="292" font-size="11" fill="#444">d = 5 非法</text>
  <text x="360" y="308" font-size="11" fill="#b85450" font-weight="bold">→ return false ✗</text>

  <text x="50" y="328" font-size="10" fill="#888">轮1: d=5, 5∉{0,1,6,8,9} → 立即返回 false，无需继续扫描</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="350" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">判定逻辑：全部位有效 AND rotated ≠ n → true</text>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#888">三种否决路径：① 含非法数字 ② rotated = n（中心对称）③ n=0（rotated=0=n）</text>
</svg>
