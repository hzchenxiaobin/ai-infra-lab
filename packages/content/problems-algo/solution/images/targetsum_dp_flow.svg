<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数 0-1 背包：倒序累加方案数</text>

  <!-- 计算总和与剪枝 -->
  <rect x="160" y="44" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#333">S = sum(nums)</text>
  <text x="280" y="77" text-anchor="middle" font-size="10.5" fill="#888">|target|&gt;S 或 (S+target) 奇 → 返回 0</text>
  <path d="M 280 86 L 280 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pos -->
  <rect x="180" y="108" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos = (S + target) / 2</text>
  <path d="M 280 144 L 280 162" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="190" y="166" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#333">dp[0]=1，其余 0</text>
  <path d="M 280 202 L 280 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历 num 决策菱形 -->
  <path d="M 280 226 L 380 270 L 280 314 L 180 270 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11.5" fill="#333">还有未处理的 num？</text>
  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#888">每个元素用一次</text>

  <!-- 是分支向下 -->
  <path d="M 280 314 L 280 334" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="328" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 倒序更新 -->
  <rect x="130" y="338" width="300" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j = pos ↓ num</text>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#333">dp[j] += dp[j − num]</text>
  <text x="280" y="391" text-anchor="middle" font-size="10" fill="#888">（累加：不选 + 选当前 num）</text>

  <text x="450" y="362" font-size="10.5" fill="#b85450" font-weight="bold">↓ 倒序！</text>

  <!-- 回到决策 -->
  <path d="M 130 367 L 96 367 L 96 270 L 180 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <path d="M 380 270 L 470 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 返回 -->
  <rect x="408" y="252" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="473" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 dp[pos]</text>

  <!-- 底部说明 -->
  <rect x="40" y="416" width="480" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="10.5" fill="#555">倒序：dp[j−num] 仍是上一轮旧值 → 每个 num 只用一次</text>
  <text x="280" y="450" text-anchor="middle" font-size="10.5" fill="#555">升序则同一 num 被反复选取，退化为完全背包</text>
</svg>
