<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：A = [[5,4,5],[1,2,6],[7,4,6]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">大根堆按得分弹出，绿色路径为最优，瓶颈在 (0,1)=4</text>

  <!-- ===== 3x3 grid with dist values ===== -->
  <!-- cell size 52, origin (80, 66) -->
  <g font-size="14">
    <!-- row 0 -->
    <rect x="80" y="66" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="106" y="88" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="106" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">d=5</text>

    <rect x="136" y="66" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="162" y="88" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="162" y="106" text-anchor="middle" font-size="9" fill="#d6a040">d=4 ←瓶颈</text>

    <rect x="192" y="66" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="218" y="88" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="218" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">d=4</text>

    <!-- row 1 -->
    <rect x="80" y="122" width="52" height="52" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="144" text-anchor="middle" fill="#999" font-weight="bold">1</text>
    <text x="106" y="162" text-anchor="middle" font-size="9" fill="#999">d=1</text>

    <rect x="136" y="122" width="52" height="52" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="162" y="144" text-anchor="middle" fill="#999" font-weight="bold">2</text>
    <text x="162" y="162" text-anchor="middle" font-size="9" fill="#999">d=2</text>

    <rect x="192" y="122" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="218" y="144" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="218" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a">d=4</text>

    <!-- row 2 -->
    <rect x="80" y="178" width="52" height="52" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="200" text-anchor="middle" fill="#999" font-weight="bold">7</text>
    <text x="106" y="218" text-anchor="middle" font-size="9" fill="#999">未弹出</text>

    <rect x="136" y="178" width="52" height="52" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="162" y="200" text-anchor="middle" fill="#999" font-weight="bold">4</text>
    <text x="162" y="218" text-anchor="middle" font-size="9" fill="#999">未弹出</text>

    <rect x="192" y="178" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="218" y="200" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="218" y="218" text-anchor="middle" font-size="9" fill="#b85450">d=4 终点</text>
  </g>

  <!-- start / end labels -->
  <text x="106" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">起点</text>
  <text x="218" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">终点 (2,2)</text>
  <text x="162" y="58" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">↓ 瓶颈</text>

  <!-- route arrows along optimal path -->
  <path d="M 132 92 L 136 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 188 92 L 192 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 218 118 L 218 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 218 174 L 218 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== explanation panel right ===== -->
  <rect x="280" y="64" width="276" height="280" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="418" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">大根堆弹出顺序</text>

  <text x="292" y="108" font-size="10" fill="#446688" font-weight="bold">堆按「当前得分」取最大者弹出：</text>

  <text x="292" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">① 弹 (5, (0,0))</text>
  <text x="304" y="146" font-size="10" fill="#446688">→ 松弛 (0,1): min(5,4)=4</text>
  <text x="304" y="160" font-size="10" fill="#446688">→ 松弛 (1,0): min(5,1)=1</text>

  <text x="292" y="180" font-size="10" fill="#d6a040" font-weight="bold">② 弹 (4, (0,1))</text>
  <text x="304" y="196" font-size="10" fill="#446688">→ 松弛 (0,2): min(4,5)=4</text>
  <text x="304" y="210" font-size="10" fill="#446688">→ 松弛 (1,1): min(4,2)=2</text>

  <text x="292" y="230" font-size="10" fill="#4a7a3a" font-weight="bold">③ 弹 (4, (0,2))</text>
  <text x="304" y="246" font-size="10" fill="#446688">→ 松弛 (1,2): min(4,6)=4</text>

  <text x="292" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">④ 弹 (4, (1,2))</text>
  <text x="304" y="282" font-size="10" fill="#446688">→ 松弛 (2,2): min(4,6)=4</text>

  <text x="292" y="302" font-size="10" fill="#b85450" font-weight="bold">⑤ 弹 (4, (2,2)) = 终点</text>

  <rect x="292" y="312" width="252" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="418" y="329" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 4——瓶颈在 (0,1)=4</text>

  <text x="80" y="350" font-size="10" fill="#888">注：得分 = min(d, A[v])，路径每走一格得分只可能不增（非负值保证单调性）</text>
  <text x="80" y="366" font-size="10" fill="#888">弹出最大得分者即确定该格最优——任何绕远路径只会让 min 更小或持平，贪心正确</text>
  <text x="80" y="382" font-size="10" fill="#888">(1,0)=1 和 (2,0)=7 虽值高/低混合，但经 (1,0)=1 必拖累得分到 1，不如走顶行</text>
</svg>
