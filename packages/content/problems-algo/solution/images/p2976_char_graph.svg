<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：换一个字符 = 在「字符图」上走最短路</text>

  <!-- a -> b : 2 -->
  <path d="M 96 142 L 238 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="110" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- b -> c : 5 -->
  <path d="M 282 98 L 424 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="106" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- c -> b direct : 5 (grey, expensive) -->
  <path d="M 428 166 Q 340 178 284 106" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="174" font-size="11" fill="#999" filter="url(#rough2)">直连 5 ✗</text>

  <!-- c -> e : 1 (red, optimal) -->
  <path d="M 443 172 Q 450 230 420 286" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="456" y="232" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- e -> b : 2 (red, optimal) -->
  <path d="M 378 288 Q 288 205 275 110" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298" y="208" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- d -> e : 20 -->
  <path d="M 133 305 L 375 305" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="252" y="296" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- nodes -->
  <circle cx="75" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="157" text-anchor="middle" font-size="17" fill="#334" font-weight="bold" filter="url(#rough2)">a</text>

  <circle cx="260" cy="88" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="17" fill="#334" font-weight="bold" filter="url(#rough2)">b</text>

  <circle cx="445" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="157" text-anchor="middle" font-size="17" fill="#334" font-weight="bold" filter="url(#rough2)">c</text>

  <circle cx="110" cy="305" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="312" text-anchor="middle" font-size="17" fill="#334" font-weight="bold" filter="url(#rough2)">d</text>

  <circle cx="400" cy="305" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="312" text-anchor="middle" font-size="17" fill="#334" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- callout -->
  <rect x="38" y="215" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="236" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">下标 2：c→b 怎么换最省？</text>
  <text x="138" y="256" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">绕道 e：1+2 = 3 &lt; 直连 5</text>

  <!-- bottom note -->
  <rect x="40" y="345" width="440" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">26 个小写字母 = 26 个节点；同一对 x→y 出现多次（重边）取 min；</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">规则可以连续使用 → 真实成本 = 最短路，Floyd 一次算全 26×26 对。</text>
</svg>
