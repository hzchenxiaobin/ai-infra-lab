<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">删除链表中间节点：slow 落后一步，停在前驱</text>
  <path d="M 250 40 Q 450 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#666">head = 1 → 2 → 3 → 4 → 5（n=5，中间节点 = 下标 ⌊n/2⌋ = 2 → 节点 3）</text>

  <!-- ===== Phase 1: 初始 slow=dummy, fast=head ===== -->
  <text x="60" y="96" font-size="13" font-weight="bold" fill="#2b6e9e">① 初始：slow=dummy，fast=head（slow 比 876 落后 1 步）</text>

  <g filter="url(#sk)"><rect x="40" y="112" width="50" height="40" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="65" y="136" text-anchor="middle" font-size="11" fill="#888">dummy</text>
  <g filter="url(#sk)"><rect x="130" y="112" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="136" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="240" y="112" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="270" y="136" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="350" y="112" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="380" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="460" y="112" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="490" y="136" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="570" y="112" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="600" y="136" text-anchor="middle" font-size="13" fill="#444">5</text>
  <text x="690" y="136" font-size="11" fill="#888">→ null</text>

  <path d="M 90 132 L 126 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 132 L 236 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 132 L 346 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 132 L 456 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 132 L 566 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 630 132 L 676 132" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="65" y="172" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">slow</text>
  <path d="M 65 176 L 65 152" stroke="#7a5415" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">fast</text>
  <path d="M 160 176 L 160 152" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="380" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">中间节点（待删）</text>

  <!-- ===== Phase 2: 同速比 1:2 推进 ===== -->
  <text x="60" y="210" font-size="13" font-weight="bold" fill="#7a5415">② 同速比 1:2 推进：slow +1，fast +2，直到 fast 到尾</text>

  <g filter="url(#sk)"><rect x="40" y="226" width="50" height="40" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="65" y="250" text-anchor="middle" font-size="11" fill="#888">dummy</text>
  <g filter="url(#sk)"><rect x="130" y="226" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="240" y="226" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="270" y="250" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="350" y="226" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="380" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="460" y="226" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="490" y="250" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="570" y="226" width="60" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="600" y="250" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="690" y="250" font-size="11" fill="#888">→ null</text>

  <path d="M 90 246 L 126 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 246 L 236 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 246 L 346 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 246 L 456 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 246 L 566 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">slow（前驱）</text>
  <path d="M 270 282 L 270 266" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="600" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">fast（fast.next=null, 停止）</text>
  <path d="M 600 282 L 600 266" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- ===== Phase 3: 删除 ===== -->
  <text x="60" y="320" font-size="13" font-weight="bold" fill="#b85450">③ slow.next = slow.next.next（删除中间节点 3）</text>

  <g filter="url(#sk)"><rect x="40" y="336" width="50" height="40" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="65" y="360" text-anchor="middle" font-size="11" fill="#888">dummy</text>
  <g filter="url(#sk)"><rect x="130" y="336" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="160" y="360" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="240" y="336" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="270" y="360" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="350" y="336" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/></g>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="460" y="336" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="490" y="360" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="570" y="336" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="600" y="360" text-anchor="middle" font-size="13" fill="#444">5</text>
  <text x="640" y="360" font-size="11" fill="#888">→ null</text>

  <path d="M 90 352 L 126 352" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 352 L 236 352" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 352 L 346 352" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 348 Q 435 330 456 348" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="433" y="326" text-anchor="middle" font-size="9" fill="#b85450">跳过 3</text>
  <path d="M 520 352 L 566 352" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="640" y="386" font-size="11" fill="#7a5415" font-weight="bold">结果：1→2→4→5</text>
  <text x="450" y="406" text-anchor="middle" font-size="10" fill="#888">关键：slow 从 dummy 起步（而非 head），全程比 876 的 slow 落后 1 步，于是停在中间节点的前驱</text>
</svg>
