<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">「好」是数字多重集的性质：一个多重集 ⇒ 一整批好数</text>

  <!-- 两个 k 回文见证人 -->
  <rect x="90" y="38" width="70" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="59" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2442</text>
  <text x="125" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">k=2 回文 ✓（整除 2）</text>

  <rect x="360" y="38" width="70" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="59" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4224</text>
  <text x="395" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">k=2 回文 ✓（整除 2）</text>

  <!-- 汇聚箭头 -->
  <path d="M125,92 C160,110 192,118 216,126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M395,92 C360,110 328,118 304,126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 多重集 -->
  <rect x="170" y="130" width="180" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">数字多重集 {2,2,4,4}</text>

  <!-- 左：去重说明 -->
  <rect x="14" y="120" width="144" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">哈希集合去重</text>
  <text x="86" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">两个回文共用同一多重集</text>
  <text x="86" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">排序串做签名，只计一份！</text>

  <!-- 右：计数说明 -->
  <rect x="372" y="120" width="138" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">计数 = 排列数</text>
  <text x="441" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4!/（2!·2!）= 6</text>
  <text x="441" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">减首位为 0 的（此处无 0）</text>

  <path d="M260,164 L260,180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6 个排列：2 行 × 3 列 -->
  <rect x="150" y="184" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2244</text>

  <rect x="228" y="184" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2424</text>

  <rect x="306" y="184" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="338" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2442</text>
  <text x="338" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">回文 ✓</text>

  <rect x="150" y="232" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="182" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4224</text>
  <text x="182" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">回文 ✓</text>

  <rect x="228" y="232" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4242</text>

  <rect x="306" y="232" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4422</text>

  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 个无前导零排列全部是好数（k=2：末位恒为偶数）</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">答案 = Σ 好多重集的无前导零排列数；不去重会把这 6 个数计成两遍</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 4，k = 2 示例：好数自己不必是回文，也不必整除 k</text>
</svg>
