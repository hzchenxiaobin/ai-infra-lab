<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：数出每个值的频率，再把「并列第一」的频率加起来</text>

  <!-- nums array -->
  <text x="92" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="108" y="48" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="48" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="212" y="48" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="264" y="48" width="44" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <rect x="316" y="48" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="368" y="48" width="44" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">4</text>

  <!-- arrow down -->
  <path d="M 260 92 L 260 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="108" font-size="11" fill="#888" filter="url(#rough2)">每个值入桶计数 freq[v]++</text>

  <!-- freq buckets -->
  <text x="62" y="168" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">freq =</text>
  <text x="130" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">v=1</text>
  <rect x="106" y="144" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="202" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">v=2</text>
  <rect x="178" y="144" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="172" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="274" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=3</text>
  <rect x="250" y="144" width="48" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="172" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <text x="346" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=4</text>
  <rect x="322" y="144" width="48" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="346" y="172" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>

  <!-- maxFreq annotation -->
  <path d="M 414 150 C 440 148 444 158 442 170" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="378" y="176" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大频率 = 2</text>

  <!-- sum annotation -->
  <path d="M 130 192 L 130 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 202 192 L 202 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="58" y="218" width="404" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">并列冠军是 1 和 2（freq 都是 2）</text>
  <text x="260" y="266" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 2 + 2 = 4（把冠军们的频率求和，不是数个数）</text>

  <!-- bottom note -->
  <rect x="48" y="298" width="424" height="66" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 「总频率」＝ Σ freq[v]（对所有 freq[v] = 最大频率 的 v），</text>
  <text x="260" y="341" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不是「最大频率元素的个数」（那会是 2）。</text>
  <text x="260" y="357" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">等价说法：答案 = 最大频率 × 并列冠军的种类数 = 2 × 2 = 4</text>
</svg>
