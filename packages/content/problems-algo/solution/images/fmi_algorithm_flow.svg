<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：递归 CTE 造序列 + 反连接取缺口</text>

  <!-- Step 1 -->
  <rect x="50" y="44" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="76" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="76" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="68" font-size="12" fill="#446688" font-weight="bold">求边界</text>
  <text x="100" y="86" font-size="10" fill="#444">SELECT MIN(customer_id), MAX(customer_id) FROM Customers</text>
  <text x="100" y="100" font-size="10" fill="#666">→ 区间 [1, 8]</text>

  <!-- arrow 1->2 -->
  <path d="M 280 110 L 280 132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="50" y="136" width="460" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="168" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="76" y="172" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">递归 CTE 生成连续序列</text>
  <text x="100" y="178" font-size="10" fill="#444">WITH RECURSIVE seq: 1 → 2 → 3 → … → 8</text>
  <text x="100" y="192" font-size="10" fill="#666">锚点 = min；每次 +1 直到 max</text>

  <!-- arrow 2->3 -->
  <path d="M 280 202 L 280 224" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="50" y="228" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="260" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="76" y="264" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="252" font-size="12" fill="#d6a040" font-weight="bold">反连接：保留序列中不在表里的</text>
  <text x="100" y="270" font-size="10" fill="#444">LEFT JOIN Customers c ON s.id = c.customer_id WHERE c.customer_id IS NULL</text>
  <text x="100" y="284" font-size="10" fill="#666">等价：id NOT IN (SELECT customer_id FROM Customers)</text>

  <!-- arrow 3->4 -->
  <path d="M 280 294 L 280 316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="50" y="320" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="352" r="14" fill="#b85450" filter="url(#rough2)"/>
  <text x="76" y="356" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="344" font-size="12" fill="#b85450" font-weight="bold">输出 ids 并升序排列</text>
  <text x="100" y="362" font-size="10" fill="#444">SELECT id AS ids ORDER BY id</text>
  <text x="100" y="376" font-size="10" fill="#666">→ { 2, 3, 7 }</text>
</svg>
