<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：逐个插入建线性基 → 高位贪心求最大</text>

  <!-- 左列：建基 -->
  <text x="135" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4257" filter="url(#rough2)">① 建基（对每个 x）</text>

  <rect x="55" y="68" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="89" text-anchor="middle" font-size="12.5" fill="#2c4257" filter="url(#rough2)">取元素 x</text>
  <path d="M 135 100 L 135 118" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="135,124 215,152 135,180 55,152" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="135" y="157" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">x == 0 ?</text>
  <path d="M 215 152 L 248 152" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="142" font-size="10.5" fill="#888" filter="url(#rough2)">是：已消解完</text>
  <text x="256" y="168" font-size="10.5" fill="#888" filter="url(#rough2)">换下一个 x</text>
  <path d="M 135 180 L 135 196" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="192" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <rect x="55" y="200" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="220" text-anchor="middle" font-size="12.5" fill="#2c4257" filter="url(#rough2)">b ← x 的最高置位</text>
  <path d="M 135 230 L 135 248" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="135,254 205,282 135,310 65,282" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="287" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">basis[b]==0 ?</text>

  <path d="M 135 310 L 135 328" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="324" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="55" y="330" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">basis[b] ← x ✓</text>

  <path d="M 205 282 L 248 282" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="274" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <rect x="252" y="264" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="316" y="287" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">x ← x ⊕ basis[b]</text>
  <path d="M 316 264 V 215 H 220" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="238" font-size="10.5" fill="#888" filter="url(#rough2)">重新消解</text>

  <!-- 右列：贪心 -->
  <text x="390" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">② 贪心求最大</text>

  <rect x="310" y="68" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="89" text-anchor="middle" font-size="12.5" fill="#7a5c10" filter="url(#rough2)">ans ← 0</text>
  <path d="M 390 100 L 390 112" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="116" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="136" text-anchor="middle" font-size="12.5" fill="#7a5c10" filter="url(#rough2)">b 从 29 递减到 0</text>
  <path d="M 390 146 L 390 156" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="390,160 470,191 390,222 310,191" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="187" text-anchor="middle" font-size="11" fill="#7a5c10" filter="url(#rough2)">ans ⊕ basis[b]</text>
  <text x="390" y="203" text-anchor="middle" font-size="11" fill="#7a5c10" filter="url(#rough2)">&gt; ans ?</text>

  <path d="M 470 191 L 492 191" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="182" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <text x="482" y="207" font-size="10.5" fill="#888" filter="url(#rough2)">跳过</text>
  <path d="M 390 222 L 390 246" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="240" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="310" y="250" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">ans ← ans ⊕ basis[b]</text>

  <path d="M 390 282 V 302 H 480 V 347 H 474" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="298" font-size="10.5" fill="#888" filter="url(#rough2)">b−− 继续</text>

  <rect x="310" y="330" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">b 用尽 → 返回 ans ✓</text>

  <!-- 底部示例 -->
  <rect x="30" y="378" width="460" height="42" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="395" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">示例 nums = [1,2,3]：basis[1] = 2 (10)、basis[0] = 1 (01)，3 被消解为 0 不入基</text>
  <text x="260" y="412" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">贪心：ans = 0 →（b=1）2 →（b=0）3 ✓</text>
</svg>
