<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,2,3,1,4]，k = 3，val = 2</text>

  <rect x="36" y="40" width="448" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="96" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="140" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="192" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">prev</text>
  <text x="248" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[0]</text>
  <text x="298" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[1]</text>
  <text x="348" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[2]</text>
  <text x="424" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">当前最优链</text>

  <rect x="36" y="66" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="96" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="284" y="69" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="84" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="348" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>

  <rect x="36" y="92" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="284" y="95" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="110" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="348" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4]</text>

  <rect x="36" y="118" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="248" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="298" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="334" y="121" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="136" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="424" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4]</text>

  <rect x="36" y="144" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="96" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="192" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="147" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="162" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="298" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="348" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="424" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,3]（和5≡2）</text>

  <rect x="36" y="170" width="448" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="96" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="284" y="173" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="188" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="348" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="424" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4,1]</text>

  <rect x="36" y="196" width="448" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="96" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="284" y="199" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="214" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="348" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="424" y="214" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">[1,4,1,4] ✓</text>

  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dp[1] 沿 1→2→3→4：链 [1,4,1,4]，相邻和 5,5,5 ≡ 2 (mod 3)</text>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[0]=2 是 [2,3]（和 5≡2）；dp[2]=1 是单元素 [2]——首元素无相邻对，单独成链天然合法</text>

  <rect x="70" y="284" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">另两轮：val=0 得 3（[1,2,1]），val=1 得 3（[1,3,1]）</text>

  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">答案 = max{3, 3, 4} = 4</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">橙色格 = 本步被更新的 dp[y]，读的正是上一行的旧值</text>
</svg>
