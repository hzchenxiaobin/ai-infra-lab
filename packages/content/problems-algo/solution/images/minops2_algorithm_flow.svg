<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位求差分 → 整除性 + 总和守恒校验 → 答案 = Σ正差分 / k</text>

  <!-- start -->
  <ellipse cx="270" cy="52" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 270 70 L 270 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="200" y="88" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">sum = 0；pos = 0</text>
  <path d="M 270 120 L 270 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision k == 0 ? -->
  <polygon points="270,150 350,190 270,230 190,190" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k == 0 ?</text>

  <!-- yes branch (right): k=0 special case -->
  <path d="M 350 190 L 400 190" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="402" y="172" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="467" y="187" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k=0：需 nums1≡nums2</text>
  <text x="467" y="201" text-anchor="middle" font-size="9.5" fill="#b85450">全等→返 0，否则→返 −1</text>

  <!-- no branch (down) -->
  <text x="282" y="244" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 270 230 L 270 250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body rect -->
  <rect x="130" y="252" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#333">遍历 i = 0..n−1：d = nums1[i] − nums2[i]</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#446688">若 d%k≠0 → 返 −1；否则 sum+=d，d&gt;0 则 pos+=d/k</text>
  <path d="M 270 302 L 270 320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision sum == 0 ? -->
  <polygon points="270,322 350,362 270,402 190,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">sum == 0 ?</text>
  <text x="270" y="376" text-anchor="middle" font-size="9.5" fill="#b85450">总和守恒</text>

  <!-- no branch (right): return -1 -->
  <path d="M 350 362 L 400 362" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="402" y="344" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="467" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1</text>
  <text x="467" y="374" text-anchor="middle" font-size="9.5" fill="#b85450">Σ正 ≠ Σ|负|</text>

  <!-- yes branch (down): return pos -->
  <text x="282" y="416" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 402 L 270 420" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="170" y="422" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 pos = Σ正差分 / k</text>
  <text x="270" y="454" text-anchor="middle" font-size="9.5" fill="#4a7a3a">= Σ|负差分| / k</text>

  <!-- bottom note -->
  <rect x="20" y="462" width="500" height="14" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="473" text-anchor="middle" font-size="9.5" fill="#888">时间 O(n)｜空间 O(1)｜sum、pos 用 64 位（可达 10^14）</text>
</svg>
