<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，不足则批量补足 + 公式计费</text>

  <!-- 开始 -->
  <rect x="185" y="34" width="150" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">cur = k, cnt = 0, res = 0</text>

  <path d="M260,64 L260,80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个 -->
  <rect x="190" y="82" width="140" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取下一个 num</text>

  <path d="M260,110 L260,126" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断资源 -->
  <polygon points="260,128 332,158 260,188 188,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">cur &lt; num ?</text>

  <!-- 是 → 右侧批量补足 -->
  <path d="M332,158 L352,158" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="352" y="128" width="158" height="76" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="431" y="146" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">x = ⌈(num − cur) / k⌉</text>
  <text x="431" y="163" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">res += x·cnt + x(x+1)/2</text>
  <text x="431" y="179" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">cnt += x</text>
  <text x="431" y="195" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">cur += x·k （res 取模）</text>

  <path d="M431,204 L431,236 L334,236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 ↓ -->
  <path d="M260,188 L260,222" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 消耗 -->
  <rect x="190" y="222" width="140" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur -= num</text>
  <text x="260" y="262" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">不变式：此后 cur ∈ [0, k)</text>

  <path d="M260,252 L260,266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有元素? -->
  <polygon points="260,268 322,294 260,320 198,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">还有元素 ?</text>

  <!-- 是 → 回到取下一个 -->
  <path d="M198,294 L120,294 L120,96 L186,96" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否 → 结束 -->
  <path d="M260,320 L260,334" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="332" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="172" y="336" width="176" height="22" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="10" fill="#33506e" font-weight="bold" filter="url(#rough2)">返回 res mod (10⁹+7)</text>
</svg>
