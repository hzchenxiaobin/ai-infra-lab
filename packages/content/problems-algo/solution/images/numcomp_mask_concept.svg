<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：等长全 1 掩码 + 异或 = 补数</text>

  <!-- ===== Row num = 5 = 101 ===== -->
  <text x="44" y="86" font-size="12.5" fill="#446688" font-weight="bold">num = 5</text>
  <text x="44" y="102" font-size="10" fill="#888">二进制</text>
  <rect x="170" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="226" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="282" y="66" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="340" y="89" font-size="10.5" fill="#888">bit_length = 3</text>

  <!-- bit position labels -->
  <text x="193" y="58" text-anchor="middle" font-size="10" fill="#888">bit2</text>
  <text x="249" y="58" text-anchor="middle" font-size="10" fill="#888">bit1</text>
  <text x="305" y="58" text-anchor="middle" font-size="10" fill="#888">bit0</text>

  <!-- XOR symbol + line -->
  <text x="148" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">^</text>
  <line x1="170" y1="138" x2="328" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== Row mask = 7 = 111 ===== -->
  <text x="44" y="176" font-size="12.5" fill="#d6a040" font-weight="bold">mask = 7</text>
  <text x="44" y="192" font-size="10" fill="#888">等长全 1</text>
  <rect x="170" y="156" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="179" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="226" y="156" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="179" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="282" y="156" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="179" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="340" y="179" font-size="10.5" fill="#d6a040" font-weight="bold">(1 &lt;&lt; 3) − 1</text>

  <!-- equal sign -->
  <line x1="170" y1="206" x2="328" y2="206" stroke="#888" stroke-width="1.4" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Row result = 2 = 010 ===== -->
  <text x="44" y="246" font-size="12.5" fill="#b85450" font-weight="bold">补数 = 2</text>
  <text x="44" y="262" font-size="10" fill="#888">逐位翻转</text>
  <rect x="170" y="226" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="249" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="226" y="226" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="249" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="282" y="226" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="249" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="340" y="249" font-size="10.5" fill="#b85450" font-weight="bold">← 0↔1 翻转</text>

  <!-- arrow down to formula -->
  <path d="M 249 266 Q 249 280 249 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- mask formula box -->
  <rect x="40" y="298" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">掩码构造（关键）</text>
  <text x="155" y="340" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">L = bit_length(num)</text>
  <text x="155" y="360" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">mask = (1 &lt;&lt; L) − 1</text>

  <!-- result formula box -->
  <rect x="290" y="298" width="230" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键转化</text>
  <text x="405" y="340" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">补数 = num ⊕ mask</text>
  <text x="405" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">仅翻转 [0, L) 位</text>

  <!-- bottom note -->
  <rect x="40" y="384" width="480" height="0" fill="none"/>
</svg>
