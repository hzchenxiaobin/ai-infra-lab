<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算</text>

  <!-- ===== Example 1 ===== -->
  <rect x="40" y="42" width="500" height="170" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "cba", k = 1  →  只能旋转，枚举 n=3 个旋转</text>

  <!-- Table header -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="60" y="74" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="85" y="88" text-anchor="middle" fill="#446688" font-weight="bold">i</text>
    <rect x="110" y="74" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="185" y="88" text-anchor="middle" fill="#446688" font-weight="bold">旋转 s[i:]+s[:i]</text>
    <rect x="260" y="74" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="320" y="88" text-anchor="middle" fill="#446688" font-weight="bold">串值</text>
    <rect x="380" y="74" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="420" y="88" text-anchor="middle" fill="#446688" font-weight="bold">是否最小</text>
  </g>

  <!-- Row i=0: cba -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="60" y="96" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="85" y="112" text-anchor="middle" fill="#333">0</text>
    <rect x="110" y="96" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="185" y="112" text-anchor="middle" fill="#666">"" + "cba"</text>
    <rect x="260" y="96" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="320" y="112" text-anchor="middle" fill="#333" font-weight="bold">cba</text>
    <rect x="380" y="96" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="420" y="112" text-anchor="middle" fill="#999">否</text>

    <!-- Row i=1: bac -->
    <rect x="60" y="122" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="85" y="138" text-anchor="middle" fill="#333">1</text>
    <rect x="110" y="122" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="185" y="138" text-anchor="middle" fill="#666">"ba" + "c"</text>
    <rect x="260" y="122" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="320" y="138" text-anchor="middle" fill="#333" font-weight="bold">bac</text>
    <rect x="380" y="122" width="80" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="420" y="138" text-anchor="middle" fill="#999">否</text>

    <!-- Row i=2: acb (min) -->
    <rect x="60" y="148" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="85" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="110" y="148" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="185" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">"ac" + "b"</text>
    <rect x="260" y="148" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="320" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acb</text>
    <rect x="380" y="148" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="420" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ 最小</text>
  </g>

  <text x="60" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">→ 返回 "acb"（3 个旋转中字典序最小）</text>

  <!-- ===== Example 2 ===== -->
  <rect x="40" y="224" width="500" height="120" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="246" font-size="12" fill="#d6a040" font-weight="bold">示例 2：s = "baaca", k = 3 (≥2)  →  相邻交换可达任意排列，直接排序</text>

  <!-- original -->
  <g filter="url(#rough2)">
    <rect x="70" y="262" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
    <rect x="102" y="262" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="117" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
    <rect x="134" y="262" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="149" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
    <rect x="166" y="262" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="181" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
    <rect x="198" y="262" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="213" y="284" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  </g>
  <text x="149" y="312" text-anchor="middle" font-size="10" fill="#888">原串 baaca</text>

  <!-- sort arrow -->
  <path d="M 244 279 L 312 279" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">sort</text>
  <text x="278" y="292" text-anchor="middle" font-size="9" fill="#888">k≥2 全排列</text>

  <!-- sorted -->
  <g filter="url(#rough2)">
    <rect x="324" y="262" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="339" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="356" y="262" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="371" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="388" y="262" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="403" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="420" y="262" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="435" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
    <rect x="452" y="262" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="467" y="284" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  </g>
  <text x="403" y="312" text-anchor="middle" font-size="10" fill="#888">排序 aaabc</text>

  <text x="60" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">→ 返回 "aaabc"（k≥2 时排序即最优，无需枚举旋转）</text>

  <!-- takeaway -->
  <rect x="60" y="360" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键转折在 k = 1 → 2</text>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#666">k=1：旋转集合 = {循环移位}，规模 O(n)，须枚举比较</text>
  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#666">k=2：旋转 + 相邻交换 = 全排列，规模 n!，排序即最优</text>
</svg>
