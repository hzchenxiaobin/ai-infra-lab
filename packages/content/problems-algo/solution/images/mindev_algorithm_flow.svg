<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：奇数翻倍统一 → 大顶堆贪心折半</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始：奇数 ×2 入堆，记录 min，ans = +∞</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: heap top even? -->
  <polygon points="270,104 388,152 270,200 152,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#333">堆顶 max 是偶数 ?</text>
  <text x="270" y="166" text-anchor="middle" font-size="11" fill="#666">(还能再 ÷2 吗)</text>

  <!-- No branch -> final update + end -->
  <path d="M 388 152 L 448 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="144" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="448" y="132" width="84" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="150" text-anchor="middle" font-size="11" fill="#333">ans = min</text>
  <text x="490" y="166" text-anchor="middle" font-size="11" fill="#333">(ans, max−min)</text>
  <path d="M 490 176 L 490 408" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 270 200 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="11" fill="#82b366">是</text>

  <!-- record deviation -->
  <rect x="120" y="222" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#333">ans = min(ans, max − min)   （记录当前偏差）</text>

  <path d="M 270 256 L 270 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pop + halve + push -->
  <rect x="96" y="278" width="348" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="297" text-anchor="middle" font-size="12" fill="#333">弹出 max，v = max / 2，把 v 放回堆</text>
  <text x="270" y="313" text-anchor="middle" font-size="11" fill="#666">同时更新 min = min(min, v)</text>

  <path d="M 270 322 L 270 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back note -->
  <rect x="120" y="344" width="300" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#888">回到堆顶判定，继续折半新的最大值</text>

  <!-- loop back arrow -->
  <path d="M 120 361 L 60 361 L 60 152 L 152 152" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="256" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 52 256)">循环折半</text>

  <!-- end node -->
  <ellipse cx="270" cy="424" rx="120" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" fill="#333">返回 ans（沿途记录的最小偏差）</text>

  <path d="M 490 408 L 490 424 L 390 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="456" text-anchor="middle" font-size="11" fill="#888">每个元素至多折半 O(log maxVal) 次，堆操作 O(log n)，总量 O(n log(maxVal) log n)</text>
</svg>
