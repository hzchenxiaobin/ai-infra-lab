<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：加权并查集的 find 与 union</text>

  <!-- ===== find(x) flow (left column) ===== -->
  <rect x="20" y="44" width="250" height="356" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">find(x)：找根 + 路径压缩 + 累乘权值</text>

  <!-- start -->
  <rect x="95" y="78" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="96" text-anchor="middle" font-size="11" fill="#333">调用 find(x)</text>

  <path d="M 145 106 L 145 118" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: parent[x]==x? -->
  <polygon points="145,122 215,150 145,178 75,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="148" text-anchor="middle" font-size="10.5" fill="#333">parent[x] == x ?</text>

  <!-- yes: return x -->
  <path d="M 215 150 L 250 150" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="144" font-size="10" fill="#4a7a3a">是</text>
  <rect x="195" y="138" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a">return x</text>

  <!-- no -->
  <path d="M 145 178 L 145 190" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="188" font-size="10" fill="#b85450">否</text>

  <!-- step: root = find(parent[x]) -->
  <rect x="55" y="194" width="180" height="40" fill="#fff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="211" text-anchor="middle" font-size="10.5" fill="#333">root = find(parent[x])</text>
  <text x="145" y="226" text-anchor="middle" font-size="9.5" fill="#888">递归找根</text>

  <path d="M 145 234 L 145 246" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: weight[x] *= weight[parent[x]] -->
  <rect x="40" y="250" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="267" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">weight[x] *= weight[parent[x]]</text>
  <text x="145" y="282" text-anchor="middle" font-size="9.5" fill="#888">权值累乘：x/root = x/p × p/root</text>

  <path d="M 145 290 L 145 302" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: parent[x] = root -->
  <rect x="55" y="306" width="180" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="324" text-anchor="middle" font-size="10.5" fill="#333">parent[x] = root  （路径压缩）</text>

  <path d="M 145 340 L 145 352" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="356" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a">return root</text>

  <!-- ===== union(x,y,val) flow (right column) ===== -->
  <rect x="290" y="44" width="250" height="356" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="415" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">union(x, y, val)：x/y = val</text>

  <rect x="365" y="78" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="96" text-anchor="middle" font-size="11" fill="#333">调用 union(x,y,val)</text>

  <path d="M 415 106 L 415 118" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="315" y="122" width="200" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="140" text-anchor="middle" font-size="10.5" fill="#333">rx = find(x),  ry = find(y)</text>

  <path d="M 415 156 L 415 168" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision rx==ry? -->
  <polygon points="415,172 485,200 415,228 345,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="198" text-anchor="middle" font-size="10.5" fill="#333">rx == ry ?</text>

  <path d="M 485 200 L 525 200" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="194" font-size="10" fill="#4a7a3a">是</text>
  <rect x="478" y="188" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="500" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a">return</text>

  <path d="M 415 228 L 415 240" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="238" font-size="10" fill="#b85450">否</text>

  <!-- attach rx under ry -->
  <rect x="305" y="244" width="220" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="262" text-anchor="middle" font-size="10.5" fill="#333">parent[rx] = ry</text>
  <text x="415" y="274" text-anchor="middle" font-size="9.5" fill="#888">把 rx 这棵树挂到 ry 下</text>

  <path d="M 415 278 L 415 290" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- the key weight formula -->
  <rect x="300" y="294" width="230" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="415" y="313" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">weight[rx] = val × weight[y]</text>
  <text x="415" y="328" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">            ÷ weight[x]</text>
  <text x="415" y="342" text-anchor="middle" font-size="9" fill="#888">rx/ry = (x/y)·(y/ry)/(x/rx)</text>

  <path d="M 415 344 L 415 356" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="365" y="360" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a">return</text>
</svg>
