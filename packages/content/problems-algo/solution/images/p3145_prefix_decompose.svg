<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">S(n)：二分定位「完整数段」＋ 半截尾巴</text>

  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">big_nums 的前 n 个元素</text>
  <path d="M 60 52 L 460 52" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 60 48 L 60 56" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 460 48 L 460 56" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 完整数段（蓝） -->
  <rect x="30" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="62" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="126" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="190" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="254" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="286" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="318" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="62" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 尾巴（橙） -->
  <rect x="382" y="62" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="414" y="62" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="446" y="62" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="462" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 超出 n 的部分（虚线灰） -->
  <rect x="478" y="62" width="30" height="30" fill="none" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="493" y="82" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">⋯</text>

  <path d="M 477 54 L 477 100" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="485" y="104" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">n</text>

  <text x="196" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">数字 1..x 的完整强数组</text>
  <text x="196" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">f(x) 个元素，指数和 g(x)</text>
  <text x="410" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">x+1 强数组的前 r 个</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">r = n − f(x)，升序 ⇒ 最低 r 个置位</text>

  <!-- 二分说明框 -->
  <rect x="25" y="144" width="470" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x = max{ x : f(x) ≤ n }：f 严格递增（popcount ≥ 1）⇒ 二分 O(log n) 步定位</text>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">二分上界取 n 即可：f(x) ≥ x（每个数字至少贡献 1 个元素）</text>

  <!-- 流程 -->
  <rect x="25" y="220" width="105" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="77" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">查询 [from,to,mod]</text>
  <path d="M 132 238 L 148 238" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="220" width="105" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="202" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">E = S(to+1) − S(from)</text>
  <path d="M 257 238 L 273 238" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="275" y="220" width="105" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="327" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">快速幂 2^E mod m</text>
  <path d="M 382 238 L 398 238" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="220" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="447" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">answer[i]</text>

  <!-- 底注 -->
  <rect x="25" y="272" width="470" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每个 S(·)：一次二分（约 50 步，每步 O(51) 的 f）＋ 一次 g ＋ 扫 x+1 的置位</text>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">500 个查询共约 2.6×10⁶ 次整数运算</text>
  <text x="260" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">10¹⁵ 规模的隐式数组被彻底压缩</text>
</svg>
