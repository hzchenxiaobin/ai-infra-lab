<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：枚举「最后一枚」用的是哪个数</text>
  <path d="M 260 42 Q 430 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="62" text-anchor="middle" font-size="11" fill="#888">nums = [1,2,3], target = 4 → dp[4] = 7</text>

  <!-- ===== CENTER: dp[4] ===== -->
  <g filter="url(#sk)">
    <rect x="350" y="90" width="160" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="430" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">dp[4] = ?</text>
  <text x="430" y="136" text-anchor="middle" font-size="10.5" fill="#6a96c0">凑出 4 的排列数</text>

  <!-- three arrows down to dp[3], dp[2], dp[1] -->
  <!-- left arrow: +1 -->
  <path d="M 380 146 Q 250 190 170 226" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="226" y="170" width="70" height="24" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="261" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">末位=1</text>

  <!-- middle arrow: +2 -->
  <path d="M 430 146 L 430 226" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="395" y="170" width="70" height="24" rx="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="430" y="187" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">末位=2</text>

  <!-- right arrow: +3 -->
  <path d="M 480 146 Q 610 190 690 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="564" y="170" width="70" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="599" y="187" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">末位=3</text>

  <!-- ===== THREE dp boxes ===== -->
  <!-- dp[3] -->
  <g filter="url(#sk)">
    <rect x="80" y="230" width="180" height="140" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="170" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">dp[3] = 4</text>
  <text x="170" y="272" text-anchor="middle" font-size="9.5" fill="#5a8a5a">凑出 3 的排列</text>
  <g font-size="10.5" fill="#346">
    <text x="100" y="294">(1,1,1)</text>
    <text x="100" y="310">(1,2)</text>
    <text x="100" y="326">(2,1)</text>
    <text x="100" y="342">(3)</text>
  </g>
  <text x="170" y="362" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">+ 末位 1 → 4 种</text>

  <!-- dp[2] -->
  <g filter="url(#sk)">
    <rect x="340" y="230" width="180" height="140" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="430" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">dp[2] = 2</text>
  <text x="430" y="272" text-anchor="middle" font-size="9.5" fill="#a07a2a">凑出 2 的排列</text>
  <g font-size="10.5" fill="#542">
    <text x="370" y="294">(1,1)</text>
    <text x="370" y="310">(2)</text>
  </g>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">+ 末位 2 → 2 种</text>

  <!-- dp[1] -->
  <g filter="url(#sk)">
    <rect x="600" y="230" width="180" height="140" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="690" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">dp[1] = 1</text>
  <text x="690" y="272" text-anchor="middle" font-size="9.5" fill="#a05a5a">凑出 1 的排列</text>
  <g font-size="10.5" fill="#542">
    <text x="640" y="294">(1)</text>
  </g>
  <text x="690" y="362" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">+ 末位 3 → 1 种</text>

  <!-- ===== SUM bar ===== -->
  <g filter="url(#sk)">
    <rect x="200" y="390" width="460" height="50" rx="10" fill="#fffdf3" stroke="#c9a93a" stroke-width="2"/>
  </g>
  <text x="430" y="420" text-anchor="middle" font-size="14" fill="#444">
    <tspan font-weight="bold" fill="#2e6e2e">dp[3]</tspan>
    <tspan fill="#888"> + </tspan>
    <tspan font-weight="bold" fill="#7a5415">dp[2]</tspan>
    <tspan fill="#888"> + </tspan>
    <tspan font-weight="bold" fill="#b03a3a">dp[1]</tspan>
    <tspan fill="#888"> = </tspan>
    <tspan font-weight="bold" fill="#2b2b2b">4 + 2 + 1 = 7</tspan>
  </text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="460" width="740" height="66" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="482" text-anchor="middle" font-size="11.5" fill="#444">
    <tspan font-weight="bold" fill="#2b6e9e">外层遍历金额 i</tspan>，对每个 i 枚举「最后一步用的是哪个 num」
  </text>
  <text x="430" y="500" text-anchor="middle" font-size="11" fill="#666">
    (1,2,1) 与 (2,1,1) 末位都是 1，但前缀 (1,2) ≠ (2,1) 来自不同的 dp[2] 方案 → 被分别计数
  </text>
  <text x="430" y="518" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">末位不同即不同方案 → 顺序有关 → 排列数</text>
</svg>
