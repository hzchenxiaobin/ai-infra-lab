<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两端推入 → 双指针从外向内贪心</text>

  <!-- ===== Section 1: Problem I recap (one end) ===== -->
  <text x="40" y="50" font-size="11" fill="#888">I 代（1564）：只能从左端推入，瓶颈 = 前缀最小值</text>

  <rect x="60" y="64" width="40" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="78" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="108" width="40" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="80" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <text x="120" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="160" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="200" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="240" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <line x1="50" y1="122" x2="270" y2="122" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 30 100 L 50 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="24" y="92" text-anchor="end" font-size="10" fill="#446688">←左推入</text>

  <text x="270" y="104" font-size="10" fill="#888">有效高度 = 前缀 min</text>

  <!-- arrow down -->
  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 2: Problem II (both ends) ===== -->
  <text x="40" y="174" font-size="11" fill="#888">II 代（1580）：两端均可推入，有效高度 = max(前缀 min, 后缀 min)</text>

  <text x="60" y="198" text-anchor="middle" font-size="9" fill="#999">room 0</text>
  <text x="140" y="198" text-anchor="middle" font-size="9" fill="#999">room 1</text>
  <text x="220" y="198" text-anchor="middle" font-size="9" fill="#999">room 2</text>
  <text x="300" y="198" text-anchor="middle" font-size="9" fill="#999">room 3</text>
  <text x="380" y="198" text-anchor="middle" font-size="9" fill="#999">room 4</text>

  <!-- Warehouse bars: [3, 4, 1, 2, 5] -->
  <rect x="40" y="204" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="196" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="228" width="40" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="216" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="188" width="40" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="60" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="140" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="220" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="380" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>

  <line x1="30" y1="242" x2="410" y2="242" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Left push arrow -->
  <path d="M 12 210 L 30 210" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="8" y="202" text-anchor="end" font-size="10" fill="#446688">←左</text>

  <!-- Right push arrow -->
  <path d="M 428 210 L 410 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="432" y="202" font-size="10" fill="#b85450">右→</text>

  <!-- arrow down -->
  <path d="M 280 258 L 280 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 3: Effective height ===== -->
  <text x="40" y="290" font-size="11" fill="#888">有效高度 effective[i] = max(前缀 min, 后缀 min)</text>

  <!-- Prefix min row -->
  <text x="24" y="316" font-size="9" fill="#446688">前缀min</text>
  <rect x="40" y="302" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <rect x="120" y="302" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <rect x="200" y="302" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="280" y="302" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="360" y="302" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="318" text-anchor="middle" font-size="10" fill="#b85450">1</text>

  <!-- Suffix min row -->
  <text x="24" y="350" font-size="9" fill="#b85450">后缀min</text>
  <rect x="40" y="336" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="352" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="120" y="336" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="352" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="200" y="336" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <rect x="280" y="336" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <rect x="360" y="336" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="352" text-anchor="middle" font-size="10" fill="#b85450">5</text>

  <!-- Effective row -->
  <text x="24" y="384" font-size="9" fill="#d6a040">有效高</text>
  <rect x="40" y="370" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="120" y="370" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="200" y="370" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="280" y="370" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <rect x="360" y="370" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>

  <!-- arrow down -->
  <path d="M 280 396 L 280 414" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 4: Greedy strategy ===== -->
  <text x="40" y="428" font-size="11" fill="#888">贪心：箱子降序，双指针从两端向内，每次选高度更大的端放入</text>
  <rect x="120" y="436" width="320" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最大箱子先放 → 选更高的一端 → 双指针收缩</text>
</svg>
