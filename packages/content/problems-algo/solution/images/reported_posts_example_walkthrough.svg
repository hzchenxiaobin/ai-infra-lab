<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：9 行 Actions → 筛 4 行 report → 分组去重 → 结果</text>

  <!-- ===== Step ①: raw Actions ===== -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① Actions 表（9 行）</text>
  <rect x="20" y="58" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="33" y="72" font-size="7" fill="#446688" font-weight="bold">user</text>
  <text x="58" y="72" font-size="7" fill="#446688" font-weight="bold">post</text>
  <text x="86" y="72" font-size="7" fill="#446688" font-weight="bold">date</text>
  <text x="120" y="72" font-size="7" fill="#446688" font-weight="bold">action</text>
  <text x="170" y="72" font-size="7" fill="#446688" font-weight="bold">extra</text>

  <!-- greyed rows (non-report or wrong date) -->
  <rect x="20" y="78" width="180" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="33" y="88" text-anchor="middle" font-size="7" fill="#888">1</text><text x="58" y="88" text-anchor="middle" font-size="7" fill="#888">1</text><text x="86" y="88" text-anchor="middle" font-size="7" fill="#888">07-04</text><text x="120" y="88" text-anchor="middle" font-size="7" fill="#888">view</text><text x="170" y="88" text-anchor="middle" font-size="7" fill="#888">null</text>

  <rect x="20" y="92" width="180" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="33" y="102" text-anchor="middle" font-size="7" fill="#888">1</text><text x="58" y="102" text-anchor="middle" font-size="7" fill="#888">1</text><text x="86" y="102" text-anchor="middle" font-size="7" fill="#888">07-04</text><text x="120" y="102" text-anchor="middle" font-size="7" fill="#888">like</text><text x="170" y="102" text-anchor="middle" font-size="7" fill="#888">null</text>

  <rect x="20" y="106" width="180" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="33" y="116" text-anchor="middle" font-size="7" fill="#888">1</text><text x="58" y="116" text-anchor="middle" font-size="7" fill="#888">1</text><text x="86" y="116" text-anchor="middle" font-size="7" fill="#888">07-05</text><text x="120" y="116" text-anchor="middle" font-size="7" fill="#888">response</text><text x="170" y="116" text-anchor="middle" font-size="7" fill="#888">null</text>

  <!-- KEEP rows (report on 07-04) -->
  <rect x="20" y="120" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="33" y="132" text-anchor="middle" font-size="7.5" fill="#333">2</text><text x="58" y="132" text-anchor="middle" font-size="7.5" fill="#333">2</text><text x="86" y="132" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">07-04</text><text x="120" y="132" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">report</text><text x="170" y="132" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">spam</text>

  <rect x="20" y="136" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="33" y="148" text-anchor="middle" font-size="7.5" fill="#333">3</text><text x="58" y="148" text-anchor="middle" font-size="7.5" fill="#333">2</text><text x="86" y="148" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">07-04</text><text x="120" y="148" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">report</text><text x="170" y="148" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">spam</text>

  <rect x="20" y="152" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="33" y="164" text-anchor="middle" font-size="7.5" fill="#333">4</text><text x="58" y="164" text-anchor="middle" font-size="7.5" fill="#333">3</text><text x="86" y="164" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">07-04</text><text x="120" y="164" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">report</text><text x="170" y="164" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">racism</text>

  <rect x="20" y="168" width="180" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="33" y="178" text-anchor="middle" font-size="7" fill="#888">5</text><text x="58" y="178" text-anchor="middle" font-size="7" fill="#888">4</text><text x="86" y="178" text-anchor="middle" font-size="7" fill="#888">07-04</text><text x="120" y="178" text-anchor="middle" font-size="7" fill="#888">response</text><text x="170" y="178" text-anchor="middle" font-size="7" fill="#888">null</text>

  <rect x="20" y="182" width="180" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="33" y="192" text-anchor="middle" font-size="7" fill="#888">6</text><text x="58" y="192" text-anchor="middle" font-size="7" fill="#888">3</text><text x="86" y="192" text-anchor="middle" font-size="7" fill="#b85450">07-05</text><text x="120" y="192" text-anchor="middle" font-size="7" fill="#888">report</text><text x="170" y="192" text-anchor="middle" font-size="7" fill="#888">spam</text>

  <rect x="20" y="196" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="33" y="208" text-anchor="middle" font-size="7.5" fill="#333">7</text><text x="58" y="208" text-anchor="middle" font-size="7.5" fill="#333">3</text><text x="86" y="208" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">07-04</text><text x="120" y="208" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">report</text><text x="170" y="208" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">spam</text>

  <text x="110" y="228" text-anchor="middle" font-size="8" fill="#888">绿行 = report + 07-04（保留）</text>

  <!-- arrow ①→② -->
  <path d="M205 160 L240 160" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="222" y="154" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">筛</text>

  <!-- ===== Step ②: filtered reports ===== -->
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 筛出 4 行 report（07-04）</text>
  <rect x="245" y="58" width="150" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="72" font-size="8" fill="#4a7a3a" font-weight="bold">post_id</text>
  <text x="345" y="72" font-size="8" fill="#4a7a3a" font-weight="bold">extra</text>

  <rect x="245" y="78" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="275" y="92" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text><text x="345" y="92" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">spam</text>

  <rect x="245" y="98" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="275" y="112" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text><text x="345" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">spam</text>

  <rect x="245" y="118" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="275" y="132" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text><text x="345" y="132" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">racism</text>

  <rect x="245" y="138" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="275" y="152" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text><text x="345" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">spam</text>

  <rect x="245" y="170" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="187" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">post 2 + spam 出现 2 行</text>
  <text x="320" y="201" text-anchor="middle" font-size="8" fill="#888">COUNT(*) = 3 ❌</text>
  <text x="320" y="211" text-anchor="middle" font-size="8" fill="#4a7a3a">COUNT(DISTINCT) = 2 ✓</text>

  <!-- arrow ②→③ -->
  <path d="M397 130 L432 130" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="414" y="124" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">分组</text>

  <!-- ===== Step ③: grouped result ===== -->
  <text x="495" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 分组去重结果</text>
  <rect x="437" y="58" width="125" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="468" y="72" font-size="8" fill="#b85450" font-weight="bold">report_reason</text>
  <text x="535" y="72" font-size="8" fill="#b85450" font-weight="bold">count</text>

  <rect x="437" y="78" width="125" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="468" y="93" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">racism</text>
  <text x="535" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <rect x="437" y="100" width="125" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="468" y="115" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">spam</text>
  <text x="535" y="115" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <rect x="437" y="135" width="125" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="152" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">去重明细</text>
  <text x="448" y="168" font-size="8" fill="#333">spam: {2, 3} → 2</text>
  <text x="448" y="182" font-size="8" fill="#333">racism: {3} → 1</text>

  <!-- bottom explanation -->
  <rect x="20" y="248" width="540" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步解释</text>

  <text x="40" y="288" font-size="9.5" fill="#333">① <tspan fill="#446688" font-weight="bold">FROM Actions</tspan>：9 行原始数据，含 view/like/response/report 多种 action，extra 仅 report 行非空</text>
  <text x="40" y="306" font-size="9.5" fill="#333">② <tspan fill="#d6a040" font-weight="bold">WHERE action='report' AND action_date='2019-07-04'</tspan>：丢弃 view/like/response（extra 为 NULL）+ 丢弃 07-05 的 report → 剩 4 行</text>
  <text x="40" y="324" font-size="9.5" fill="#333">③ <tspan fill="#4a7a3a" font-weight="bold">GROUP BY extra</tspan> 分两组：spam 组 = {(post2,user2),(post2,user3),(post3,user7)}；racism 组 = {(post3,user4)}</text>
  <text x="40" y="342" font-size="9.5" fill="#333">④ <tspan fill="#b85450" font-weight="bold">COUNT(DISTINCT post_id)</tspan>：spam 组 post_id 去重 {2,3} = 2；racism 组 {3} = 1</text>
  <text x="40" y="360" font-size="9.5" fill="#333">   ⚠️ 若误用 <tspan fill="#888">COUNT(*)</tspan>：spam = 3（把 user2、user3 对同一 post2 的两次举报各算一次）→ 错误</text>
  <text x="40" y="378" font-size="9.5" fill="#333">⑤ 输出列改名：<tspan fill="#4a7a3a" font-weight="bold">extra → report_reason</tspan>，<tspan fill="#4a7a3a" font-weight="bold">count → report_count</tspan>，结果无特定顺序</text>
  <text x="40" y="396" font-size="9.5" fill="#333">⑥ <tspan fill="#b85450">07-05 的 report 行</tspan>因日期不符被 WHERE 排除——日期过滤是硬条件，与原因分组无关</text>
  <text x="40" y="414" font-size="9.5" fill="#333">   本题本质：<tspan fill="#446688" font-weight="bold">条件过滤 + 单层分组 + 去重计数</tspan>，无嵌套子查询，是 SQL 三件套基本功</text>
</svg>
