<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：root=[5,8,9,2,1,3,7,4,6], k=2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">4 轮 BFS，逐层累加；末轮 sums=[5,17,13,10]</text>

  <!-- ===== Table ===== -->
  <!-- header -->
  <rect x="24" y="58" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <g font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="46" y="75">轮次</text>
    <text x="125" y="75">队列初始</text>
    <text x="200" y="75">size</text>
    <text x="275" y="75">本层出队收集</text>
    <text x="365" y="75">level_sum</text>
    <text x="465" y="75">sums（追加后）</text>
  </g>

  <!-- column dividers -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="68" y1="58" x2="68" y2="254"/>
    <line x1="232" y1="58" x2="232" y2="254"/>
    <line x1="310" y1="58" x2="310" y2="254"/>
    <line x1="408" y1="58" x2="408" y2="254"/>
  </g>

  <!-- row 1: L1 -->
  <rect x="24" y="86" width="512" height="34" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="46" y="108" fill="#b85450" font-weight="bold">L1</text>
    <text x="125" y="108" fill="#333" font-family="monospace">[5]</text>
    <text x="200" y="108" fill="#333">1</text>
    <text x="275" y="108" fill="#b85450" font-weight="bold">5</text>
    <text x="365" y="108" fill="#b85450" font-weight="bold">5</text>
    <text x="465" y="108" fill="#333" font-family="monospace">[5]</text>
  </g>

  <!-- row 2: L2 -->
  <rect x="24" y="120" width="512" height="34" fill="#fafafa" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="46" y="142" fill="#446688" font-weight="bold">L2</text>
    <text x="125" y="142" fill="#333" font-family="monospace">[8, 9]</text>
    <text x="200" y="142" fill="#333">2</text>
    <text x="275" y="142" fill="#446688" font-weight="bold">8, 9</text>
    <text x="365" y="142" fill="#446688" font-weight="bold">17</text>
    <text x="465" y="142" fill="#333" font-family="monospace">[5, 17]</text>
  </g>

  <!-- row 3: L3 -->
  <rect x="24" y="154" width="512" height="34" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="46" y="176" fill="#d6a040" font-weight="bold">L3</text>
    <text x="125" y="176" fill="#333" font-family="monospace">[2, 1, 3, 7]</text>
    <text x="200" y="176" fill="#333">4</text>
    <text x="275" y="176" fill="#d6a040" font-weight="bold">2,1,3,7</text>
    <text x="365" y="176" fill="#d6a040" font-weight="bold">13</text>
    <text x="465" y="176" fill="#333" font-family="monospace">[5,17,13]</text>
  </g>

  <!-- row 4: L4 -->
  <rect x="24" y="188" width="512" height="34" fill="#fafafa" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="46" y="210" fill="#4a7a3a" font-weight="bold">L4</text>
    <text x="125" y="210" fill="#333" font-family="monospace">[4, 6]</text>
    <text x="200" y="210" fill="#333">2</text>
    <text x="275" y="210" fill="#4a7a3a" font-weight="bold">4, 6</text>
    <text x="365" y="210" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="465" y="210" fill="#333" font-family="monospace">[5,17,13,10]</text>
  </g>

  <!-- end row -->
  <rect x="24" y="222" width="512" height="32" fill="#f6f6f6" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="243" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">[ ]（空，结束）</text>
  <text x="275" y="243" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="365" y="243" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="465" y="243" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">len = 4 ≥ k=2 ✓</text>

  <!-- ===== Bottom: sort & answer ===== -->
  <line x1="24" y1="262" x2="536" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="34" y="284" font-size="11" fill="#444" font-weight="bold">降序排序 sums：</text>
  <g font-size="11" text-anchor="middle">
    <rect x="160" y="272" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="180" y="288" fill="#446688" font-weight="bold">17</text>
    <rect x="204" y="272" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="224" y="288" fill="#d6a040" font-weight="bold">13</text>
    <rect x="248" y="272" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="268" y="288" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="292" y="272" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="312" y="288" fill="#b85450" font-weight="bold">5</text>
    <text x="340" y="288" text-anchor="start" font-size="9" fill="#888">↑ 第 k=2 大 = sums[1]</text>
  </g>

  <!-- answer -->
  <path d="M 224 296 L 224 312 L 360 312" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="360" y="312" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="331" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return 13 ✓</text>

  <text x="34" y="331" font-size="10" fill="#888">第 1 大 17，第 2 大 13</text>
</svg>
