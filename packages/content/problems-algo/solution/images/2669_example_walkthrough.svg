<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 → 分组计数 → 排序输出</text>

  <!-- ===== Stage 1: Input ===== -->
  <text x="290" y="42" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">① 输入：Spotify 表（5 行）</text>
  <!-- Header -->
  <rect x="120" y="48" width="340" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="63" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">id</text>
  <text x="265" y="63" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">track_name</text>
  <text x="410" y="63" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">artist</text>
  <!-- Row 1: Ed Sheeran -->
  <rect x="120" y="70" width="340" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="8" fill="#333">303651</text>
  <text x="265" y="84" text-anchor="middle" font-size="8" fill="#333">Heart Won't Forget</text>
  <text x="410" y="84" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Ed Sheeran</text>
  <!-- Row 2: Sia -->
  <rect x="120" y="90" width="340" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="104" text-anchor="middle" font-size="8" fill="#333">1046089</text>
  <text x="265" y="104" text-anchor="middle" font-size="8" fill="#333">Shape of you</text>
  <text x="410" y="104" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Sia</text>
  <!-- Row 3: DJ Khalid -->
  <rect x="120" y="110" width="340" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="124" text-anchor="middle" font-size="8" fill="#333">33445</text>
  <text x="265" y="124" text-anchor="middle" font-size="8" fill="#333">I'm the one</text>
  <text x="410" y="124" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">DJ Khalid</text>
  <!-- Row 4: DJ Khalid -->
  <rect x="120" y="130" width="340" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="8" fill="#333">811266</text>
  <text x="265" y="144" text-anchor="middle" font-size="8" fill="#333">Young Dumb &amp; Broke</text>
  <text x="410" y="144" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">DJ Khalid</text>
  <!-- Row 5: Ed Sheeran -->
  <rect x="120" y="150" width="340" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="8" fill="#333">505727</text>
  <text x="265" y="164" text-anchor="middle" font-size="8" fill="#333">Happier</text>
  <text x="410" y="164" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Ed Sheeran</text>

  <!-- Arrow down -->
  <path d="M 290 172 L 290 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="186" font-size="8" fill="#888">GROUP BY artist + COUNT(*)</text>

  <!-- ===== Stage 2: After grouping + count (unsorted) ===== -->
  <text x="290" y="212" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">② 分组计数后（未排序，3 组）</text>
  <!-- Header -->
  <rect x="170" y="218" width="220" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="233" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">artist</text>
  <text x="370" y="233" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">occurrences</text>
  <!-- Row: Ed Sheeran, 2 -->
  <rect x="170" y="240" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="255" text-anchor="middle" font-size="9" fill="#446688">Ed Sheeran</text>
  <text x="370" y="255" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <!-- Row: Sia, 1 -->
  <rect x="170" y="262" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="277" text-anchor="middle" font-size="9" fill="#4a7a3a">Sia</text>
  <text x="370" y="277" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <!-- Row: DJ Khalid, 2 -->
  <rect x="170" y="284" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="299" text-anchor="middle" font-size="9" fill="#d6a040">DJ Khalid</text>
  <text x="370" y="299" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>

  <!-- Arrow down -->
  <path d="M 290 308 L 290 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="322" font-size="8" fill="#888">ORDER BY occurrences DESC, artist ASC</text>

  <!-- ===== Stage 3: Final output (sorted) ===== -->
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">③ 排序后输出（次数降序 → 名字升序）</text>
  <!-- Header -->
  <rect x="170" y="354" width="220" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="369" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">artist</text>
  <text x="370" y="369" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">occurrences</text>
  <!-- Row: DJ Khalid, 2 (D < E alphabetically, both count 2) -->
  <rect x="170" y="376" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="391" text-anchor="middle" font-size="9" fill="#d6a040">DJ Khalid</text>
  <text x="370" y="391" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <!-- Row: Ed Sheeran, 2 -->
  <rect x="170" y="398" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="413" text-anchor="middle" font-size="9" fill="#446688">Ed Sheeran</text>
  <text x="370" y="413" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <!-- Row: Sia, 1 -->
  <rect x="170" y="420" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="435" text-anchor="middle" font-size="9" fill="#4a7a3a">Sia</text>
  <text x="370" y="435" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="120" y="430" width="340" height="0" fill="none"/>
</svg>
