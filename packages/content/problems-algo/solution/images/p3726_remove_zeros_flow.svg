<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从低位到高位一趟剥位，O(d) 时间 / O(1) 空间</text>

  <!-- 开始 -->
  <rect x="140" y="40" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">res = 0, pw = 1</text>

  <path d="M 220 74 L 220 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：n == 0 ? -->
  <polygon points="220,98 288,130 220,162 152,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">n == 0 ?</text>

  <path d="M 288 130 L 334 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="123" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="338" y="113" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="134" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">返回 res（即答案）</text>

  <path d="M 220 162 L 220 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="177" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 取低位 -->
  <rect x="140" y="182" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="203" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">d = n mod 10</text>

  <path d="M 220 216 L 220 236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：d == 0 ? -->
  <polygon points="220,240 282,272 220,304 158,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">d == 0 ?</text>

  <path d="M 282 272 L 326 272" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">是·丢零</text>

  <rect x="330" y="256" width="180" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="276" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">pw 不动，直接丢弃</text>

  <path d="M 220 304 L 220 324" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="318" font-size="9.5" fill="#446688" filter="url(#rough2)">否·保留</text>

  <!-- 保留 -->
  <rect x="140" y="326" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="348" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">res += d·pw ；pw ×= 10</text>

  <!-- 汇合到 n /= 10 -->
  <path d="M 220 362 L 220 384" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 288 L 420 404 L 306 404" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="388" width="160" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="408" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">n /= 10</text>

  <!-- 回环 -->
  <path d="M 140 404 L 84 404 L 84 130 L 146 130" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="76" y="270" text-anchor="middle" font-size="9.5" fill="#8a6d1f" transform="rotate(-90 76 270)" filter="url(#rough2)">回到 n == 0 ?</text>

  <text x="330" y="440" font-size="10" fill="#777" filter="url(#rough2)">每轮剥掉一位 ⇒ 至多 ⌈log₁₀n⌉ ≈ 16 轮（10¹⁵ 为 16 位数）</text>
</svg>
