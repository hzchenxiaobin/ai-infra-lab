<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：root = [5,3,6,2,4,null,null,1]</text>

  <!-- ===== BST 树 ===== -->
  <line x1="285" y1="82" x2="238" y2="120" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="295" y1="82" x2="342" y2="120" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="225" y1="138" x2="200" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="138" x2="258" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="198" x2="170" y2="238" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="290" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="11" fill="#333">5</text>

  <circle cx="230" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="11" fill="#333">3</text>

  <circle cx="350" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="132" text-anchor="middle" font-size="11" fill="#333">6</text>

  <circle cx="196" cy="188" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="196" y="192" text-anchor="middle" font-size="10" fill="#333">2</text>

  <circle cx="264" cy="188" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="264" y="192" text-anchor="middle" font-size="10" fill="#333">4</text>

  <circle cx="165" cy="248" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="252" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- 中序序列标注 -->
  <text x="400" y="74" font-size="10" fill="#888">中序：</text>
  <rect x="432" y="60" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="444" y="74" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="458" y="60" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="484" y="60" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="496" y="74" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="510" y="60" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="522" y="74" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="536" y="60" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="548" y="74" text-anchor="middle" font-size="9" fill="#333">6</text>

  <!-- ===== 左：p=3 情况1 ===== -->
  <text x="150" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">p = 3（情况1：有右子树）</text>

  <rect x="40" y="300" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="316" text-anchor="middle" font-size="10" fill="#333">3 有右子树 ⇒ 进入右子树</text>

  <rect x="40" y="328" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="10" fill="#333">curr = 4，向左走：4.left = null</text>

  <rect x="40" y="356" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⇒ 后继 = 4</text>

  <!-- 标记 3 和 4 -->
  <circle cx="230" cy="128" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="264" cy="188" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="264" y="192" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- ===== 右：p=4 情况2 ===== -->
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">p = 4（情况2：无右子树）</text>

  <rect x="320" y="300" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="316" text-anchor="middle" font-size="10" fill="#333">4 无右子树 ⇒ 从根出发</text>

  <rect x="320" y="328" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="344" text-anchor="middle" font-size="10" fill="#333">5 &gt; 4 ⇒ succ=5，向左到 3</text>

  <rect x="320" y="356" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#333">3 ≤ 4 ⇒ 向右到 4；4 ≤ 4 ⇒ null</text>

  <rect x="320" y="384" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="402" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⇒ 后继 = 5</text>

  <!-- 路径箭头标注 p=4 -->
  <path d="M 296 78 Q 250 95 245 112" stroke="#888" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 142 Q 250 165 260 178" stroke="#888" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="424" width="460" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="310" y="441" text-anchor="middle" font-size="11" fill="#333">两种情况都只需沿一条路径下降，O(H) 时间 / O(1) 空间</text>
</svg>
