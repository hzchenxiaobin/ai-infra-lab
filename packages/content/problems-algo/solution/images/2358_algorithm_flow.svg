<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：答案只依赖 n，三种方式求 max k（k(k+1)/2 ≤ n）</text>

  <!-- Start node -->
  <rect x="190" y="46" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n = len(grades)</text>

  <!-- Arrow start -> decision -->
  <path d="M 280 84 L 280 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision node -->
  <rect x="130" y="110" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">求最大 k，使 k(k+1)/2 ≤ n</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#888">单调性：k 越大所需学生越多 → 可线性 / 二分 / 公式</text>

  <!-- Three arrows down to methods -->
  <path d="M 105 160 C 105 178, 105 188, 105 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 160 L 280 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 160 C 455 178, 455 188, 455 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Method 1: linear -->
  <rect x="30" y="200" width="150" height="118" fill="#fff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">线性累加 O(√n)</text>
  <line x1="42" y1="228" x2="168" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="10.5" fill="#333">k = 0</text>
  <text x="40" y="262" font-size="10.5" fill="#333">while (k+1)(k+2)/2 ≤ n:</text>
  <text x="52" y="278" font-size="10.5" fill="#4a7a3a" font-weight="bold">k = k + 1</text>
  <text x="40" y="304" font-size="10.5" fill="#333">return k</text>
  <text x="40" y="316" font-size="9.5" fill="#999">循环约 √(2n) 次</text>

  <!-- Method 2: binary -->
  <rect x="205" y="200" width="150" height="118" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">二分查找 O(log n)</text>
  <line x1="217" y1="228" x2="343" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="246" font-size="10.5" fill="#333">lo, hi = 0, n</text>
  <text x="215" y="262" font-size="10.5" fill="#333">while lo &lt; hi:</text>
  <text x="227" y="278" font-size="10.5" fill="#333">mid = (lo+hi+1)/2</text>
  <text x="227" y="294" font-size="10.5" fill="#4a7a3a">若 mid(mid+1)/2 ≤ n</text>
  <text x="239" y="308" font-size="10" fill="#4a7a3a">lo=mid 否则 hi=mid-1</text>
  <text x="215" y="316" font-size="10.5" fill="#333">return lo</text>

  <!-- Method 3: formula -->
  <rect x="380" y="200" width="150" height="118" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">公式 O(1)</text>
  <line x1="392" y1="228" x2="518" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="390" y="250" font-size="11" fill="#333">解 k²+k−2n ≤ 0</text>
  <text x="390" y="268" font-size="10.5" fill="#888">正根：</text>
  <text x="455" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k = (−1+√(8n+1))/2</text>
  <text x="390" y="306" font-size="10.5" fill="#333">return ⌊k⌋</text>
  <text x="390" y="316" font-size="9.5" fill="#999">用整数避免浮点误差</text>

  <!-- Merge arrows -->
  <path d="M 105 318 C 105 336, 220 340, 280 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 318 L 280 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 318 C 455 336, 340 340, 280 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return node -->
  <rect x="200" y="344" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return k  （= 最大组数）</text>
</svg>
