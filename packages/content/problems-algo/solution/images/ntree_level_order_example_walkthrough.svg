<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[1,null,3,2,4,null,5,6] 逐层出队</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">3 轮 while 循环，每轮 for 跑 size 次，最终 [[1],[3,2,4],[5,6]]</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#b85450" font-weight="bold">轮次 1：队列=[1], size=1</text>
  <g font-size="10">
    <rect x="30" y="84" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="80" y="98" font-size="9" fill="#888">→ 出队 1，遍历 children 入队 3, 2, 4</text>
    <rect x="250" y="84" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="266" y="100" text-anchor="middle" fill="#446688" font-size="9">3</text>
    <rect x="286" y="84" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="302" y="100" text-anchor="middle" fill="#446688" font-size="9">2</text>
    <rect x="322" y="84" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="338" y="100" text-anchor="middle" fill="#446688" font-size="9">4</text>
    <rect x="380" y="84" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="402" y="98" text-anchor="middle" font-size="9" fill="#b85450">[1]</text>
    <text x="432" y="98" font-size="9" fill="#888">← level</text>
    <text x="380" y="116" font-size="8" fill="#888">result: [[1]]</text>
  </g>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="142" font-size="11" fill="#446688" font-weight="bold">轮次 2：队列=[3,2,4], size=3</text>
  <g font-size="10">
    <rect x="30" y="152" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="46" y="168" text-anchor="middle" fill="#446688" font-size="9">3</text>
    <rect x="66" y="152" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="82" y="168" text-anchor="middle" fill="#446688" font-size="9">2</text>
    <rect x="102" y="152" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="118" y="168" text-anchor="middle" fill="#446688" font-size="9">4</text>
    <text x="145" y="166" font-size="9" fill="#888">→ 出队 3（入队 5,6），出队 2（无子），出队 4（无子）</text>
    <rect x="332" y="152" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="348" y="168" text-anchor="middle" fill="#d6a040" font-size="9">5</text>
    <rect x="368" y="152" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="384" y="168" text-anchor="middle" fill="#d6a040" font-size="9">6</text>
    <rect x="420" y="152" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="452" y="166" text-anchor="middle" font-size="9" fill="#446688">[3,2,4]</text>
    <text x="420" y="184" font-size="8" fill="#888">result: [[1],[3,2,4]]</text>
  </g>
  <text x="30" y="190" font-size="8" fill="#d6a040">注：for 跑 size=3 次，5/6 入队但不本轮处理</text>

  <!-- ===== Round 3 ===== -->
  <text x="30" y="214" font-size="11" fill="#d6a040" font-weight="bold">轮次 3：队列=[5,6], size=2</text>
  <g font-size="10">
    <rect x="30" y="224" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="46" y="240" text-anchor="middle" fill="#d6a040" font-size="9">5</text>
    <rect x="66" y="224" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="82" y="240" text-anchor="middle" fill="#d6a040" font-size="9">6</text>
    <text x="110" y="238" font-size="9" fill="#888">→ 出队 5（无子），出队 6（无子）</text>
    <rect x="320" y="224" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
    <text x="340" y="238" text-anchor="middle" font-size="9" fill="#888">空</text>
    <rect x="380" y="224" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="404" y="238" text-anchor="middle" font-size="9" fill="#d6a040">[5,6]</text>
    <text x="380" y="256" font-size="8" fill="#888">result: [[1],[3,2,4],[5,6]]</text>
  </g>

  <!-- ===== Round 4: end ===== -->
  <text x="30" y="280" font-size="11" fill="#888" font-weight="bold">轮次 4：队列=[]，while 结束</text>
  <rect x="30" y="288" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="302" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="80" y="302" font-size="9" fill="#888">→ 队列为空，退出 while，返回 result</text>

  <!-- ===== Final result ===== -->
  <line x1="20" y1="324" x2="520" y2="324" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="340" width="480" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：[[1], [3, 2, 4], [5, 6]]</text>
  <text x="270" y="382" text-anchor="middle" font-size="10" fill="#555">3 轮 while = 3 层，每轮 for 跑 size 次</text>
  <text x="270" y="400" text-anchor="middle" font-size="10" fill="#555">共 6 个节点，每节点入队出队各 1 次 → O(n)</text>
  <text x="270" y="418" text-anchor="middle" font-size="9" fill="#888">size 快照锁定层边界；children 顺序入队保证下一层左→右</text>
  <text x="270" y="434" text-anchor="middle" font-size="9" fill="#888">节点 2、4 的 children 为空，for 循环 0 次，无子入队</text>
</svg>
