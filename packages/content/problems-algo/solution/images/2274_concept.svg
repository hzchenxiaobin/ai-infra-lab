<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：排序 special，相邻特殊楼层之间 + 首尾边界 = 各连续段</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">bottom..top 内，特殊楼层把整段切成若干「不含特殊楼层的连续段」，取最长即可</text>

  <!-- floor strip: floors 2..9, cell w=48, start x=78 -->
  <text x="70" y="92" text-anchor="end" font-size="9.5" fill="#446688">bottom=2</text>
  <text x="470" y="92" text-anchor="start" font-size="9.5" fill="#446688">top=9</text>

  <!-- 2 -->
  <rect x="78" y="70" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="98" text-anchor="middle" font-size="14" fill="#333">2</text>
  <!-- 3 -->
  <rect x="126" y="70" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" fill="#333">3</text>
  <!-- 4 special -->
  <rect x="174" y="70" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="198" y="60" text-anchor="middle" font-size="9" fill="#b85450">★特殊</text>
  <!-- 5 -->
  <rect x="222" y="70" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="98" text-anchor="middle" font-size="14" fill="#333">5</text>
  <!-- 6 special -->
  <rect x="270" y="70" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="294" y="60" text-anchor="middle" font-size="9" fill="#b85450">★特殊</text>
  <!-- 7 -->
  <rect x="318" y="70" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="98" text-anchor="middle" font-size="14" fill="#333">7</text>
  <!-- 8 -->
  <rect x="366" y="70" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="98" text-anchor="middle" font-size="14" fill="#333">8</text>
  <!-- 9 -->
  <rect x="414" y="70" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="98" text-anchor="middle" font-size="14" fill="#333">9</text>

  <!-- brackets below cells (y 70..114) -->
  <!-- head run (2,3): x 78..174 -->
  <path d="M80 122 L80 130 L172 130 L172 122" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="126" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">头段 = 2</text>
  <text x="126" y="162" text-anchor="middle" font-size="9" fill="#888">special[0]−bottom</text>

  <!-- middle run (5): x 222..270 -->
  <path d="M224 122 L224 130 L268 130 L268 122" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="246" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中间段 = 1</text>
  <text x="246" y="162" text-anchor="middle" font-size="9" fill="#888">special[i]−special[i−1]−1</text>

  <!-- tail run (7,8,9): x 318..462 -->
  <path d="M320 122 L320 130 L460 130 L460 122" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">尾段 = 3 ← 最长</text>
  <text x="390" y="162" text-anchor="middle" font-size="9" fill="#888">top−special[last]</text>

  <!-- summary box -->
  <rect x="60" y="186" width="420" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三种段取 max = max(2, 1, 3) = 3</text>

  <text x="270" y="246" text-anchor="middle" font-size="10.5" fill="#888">等价于：排序后给首尾加哨兵，相邻“隔板”之差 −1 的最大值</text>

  <!-- footer note -->
  <rect x="60" y="270" width="420" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#333">“不含特殊楼层的连续段”= 两个相邻特殊楼层（或边界）之间的空隙</text>
  <text x="270" y="306" text-anchor="middle" font-size="10.5" fill="#333">排序让相邻关系显形 → 一趟扫描即可统计所有空隙</text>
</svg>
