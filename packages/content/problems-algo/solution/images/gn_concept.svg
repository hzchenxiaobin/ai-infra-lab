<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">guess(num) 的三段式反馈：−1 / 0 / +1</text>

  <!-- top note -->
  <text x="56" y="56" font-size="11" fill="#888">n = 10, pick = 6</text>
  <text x="56" y="72" font-size="11" fill="#888">猜测值 num 落在 pick 左/右/上 → 三种反馈</text>

  <!-- number cells 1..10, width 40, gap 6, start x=80 -->
  <!-- centers: 100, 146, 192, 238, 284, 330, 376, 422, 468, 514 -->

  <!-- cells 1-5: num < pick (green) -->
  <rect x="80" y="150" width="40" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="100" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">&lt;pick</text>

  <rect x="126" y="150" width="40" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="146" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="146" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">&lt;pick</text>

  <rect x="172" y="150" width="40" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="192" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">&lt;pick</text>

  <rect x="218" y="150" width="40" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="238" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="238" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">&lt;pick</text>

  <rect x="264" y="150" width="40" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="284" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="284" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">&lt;pick</text>

  <!-- cell 6: pick (highlight) -->
  <rect x="310" y="148" width="40" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="330" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="330" y="190" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">=pick</text>

  <!-- cells 7-10: num > pick (pink) -->
  <rect x="356" y="150" width="40" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="376" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="376" y="190" text-anchor="middle" font-size="9" fill="#b85450">&gt;pick</text>

  <rect x="402" y="150" width="40" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="422" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="422" y="190" text-anchor="middle" font-size="9" fill="#b85450">&gt;pick</text>

  <rect x="448" y="150" width="40" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="468" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="468" y="190" text-anchor="middle" font-size="9" fill="#b85450">&gt;pick</text>

  <rect x="494" y="150" width="40" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="514" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="514" y="190" text-anchor="middle" font-size="9" fill="#b85450">&gt;pick</text>

  <!-- arrow pointing down to pick -->
  <path d="M 330 116 L 330 144" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="84" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="105" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">pick = 答案</text>

  <!-- left region label: num < pick -->
  <rect x="80" y="226" width="224" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="192" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a">guess = +1（猜小了 → 往右搜）</text>

  <!-- pick label -->
  <rect x="310" y="226" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">= 0</text>

  <!-- right region label: num > pick -->
  <rect x="356" y="226" width="178" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="445" y="246" text-anchor="middle" font-size="11" fill="#b85450">guess = −1（猜大了 → 往左搜）</text>

  <!-- arrows showing search direction -->
  <path d="M 192 268 L 192 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left = mid + 1</text>

  <path d="M 445 268 L 445 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right = mid − 1</text>

  <!-- bottom note -->
  <rect x="100" y="316" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三段式比较 = 二分查找的判定源</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#888">每次 guess 把 [left, right] 折半 → O(log n) 次调用</text>
</svg>
