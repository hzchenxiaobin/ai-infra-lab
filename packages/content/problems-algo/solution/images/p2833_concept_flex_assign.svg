<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">「_」全部押向多数派：answer = |L − R| + U</text>

  <text x="280" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">x = (R − L) + (r − l)，其中 r + l = U（r 个「_」向右、l 个向左）</text>

  <!-- Number line -->
  <line x1="70" y1="200" x2="490" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- ticks: position p -> x = 280 + 52p -->
  <g filter="url(#rough2)">
    <line x1="72"  y1="193" x2="72"  y2="207" stroke="#888" stroke-width="1"/>
    <line x1="124" y1="193" x2="124" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="176" y1="193" x2="176" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="228" y1="193" x2="228" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="280" y1="189" x2="280" y2="211" stroke="#446688" stroke-width="2.5"/>
    <line x1="332" y1="193" x2="332" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="384" y1="193" x2="384" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="436" y1="193" x2="436" y2="207" stroke="#888" stroke-width="1"/>
    <line x1="488" y1="193" x2="488" y2="207" stroke="#888" stroke-width="1"/>
    <text x="72"  y="224" text-anchor="middle" font-size="11" fill="#666">−4</text>
    <text x="124" y="224" text-anchor="middle" font-size="11" fill="#666">−3</text>
    <text x="176" y="224" text-anchor="middle" font-size="11" fill="#666">−2</text>
    <text x="228" y="224" text-anchor="middle" font-size="11" fill="#666">−1</text>
    <text x="280" y="226" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
    <text x="332" y="224" text-anchor="middle" font-size="11" fill="#666">+1</text>
    <text x="384" y="224" text-anchor="middle" font-size="11" fill="#666">+2</text>
    <text x="436" y="224" text-anchor="middle" font-size="11" fill="#666">+3</text>
    <text x="488" y="224" text-anchor="middle" font-size="11" fill="#666">+4</text>
  </g>

  <!-- Blue arrow: fixed displacement R-L = -1 -->
  <path d="M 280 178 L 234 178" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="164" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">固定位移 R − L</text>

  <!-- Green arrow: U underscores all same direction -->
  <path d="M 228 150 L 128 150" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="178" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">U 个「_」全部同向追加</text>

  <!-- Final point at -3 -->
  <circle cx="124" cy="200" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="124" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最远点 x = −3</text>
  <text x="124" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">|R − L| + U = 1 + 2</text>

  <text x="392" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（以 R − L = −1、U = 2 为例）</text>

  <!-- Bottom-left: good strategy -->
  <rect x="40" y="286" width="235" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 全部同向（最优）</text>
  <text x="58" y="330" font-size="11" fill="#333" filter="url(#rough2)">U = 3 全向左：r = 0, l = 3</text>
  <text x="58" y="350" font-size="11" fill="#333" filter="url(#rough2)">|r − l| = 3 = r + l（取等）</text>
  <text x="58" y="374" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 步全部贡献到距离 ✓</text>

  <!-- Bottom-right: bad strategy -->
  <rect x="295" y="286" width="225" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="308" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 拆成两半（浪费）</text>
  <text x="313" y="330" font-size="11" fill="#333" filter="url(#rough2)">U = 3 拆开：r = 1, l = 2</text>
  <text x="313" y="350" font-size="11" fill="#333" filter="url(#rough2)">|r − l| = 1 &lt; 3 = r + l（严格小）</text>
  <text x="313" y="374" font-size="11" fill="#b85450" filter="url(#rough2)">有 2 步左右互踩白走 ✗</text>
</svg>
