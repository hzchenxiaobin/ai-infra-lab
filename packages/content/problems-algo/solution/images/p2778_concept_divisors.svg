<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="240" y="32" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">特殊元素：下标 i 整除 n（1-indexed）</text>

  <!-- n box -->
  <rect x="410" y="46" width="92" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="66" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">n = 6</text>

  <!-- index labels -->
  <text x="110" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="170" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="230" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="290" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="350" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=5</text>
  <text x="410" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i=6</text>

  <!-- cells: special green, non-special red -->
  <rect x="80" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="140" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="200" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="260" y="100" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="126" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">19</text>
  <rect x="320" y="100" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="126" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">18</text>
  <rect x="380" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- n % i computation -->
  <text x="60" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">n%i</text>
  <text x="110" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="170" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="230" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="290" y="166" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="350" y="166" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="410" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- check marks -->
  <text x="110" y="190" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="170" y="190" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="230" y="190" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="290" y="190" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="350" y="190" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="410" y="190" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- legend -->
  <rect x="80" y="214" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="226" font-size="12" fill="#4a7a3a" filter="url(#rough2)">特殊（i | n）</text>
  <rect x="220" y="214" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="226" font-size="12" fill="#b85450" filter="url(#rough2)">普通（i ∤ n）</text>

  <!-- arrow to conclusion -->
  <path d="M260,252 L260,278" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- conclusion box -->
  <rect x="60" y="288" width="400" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">答案 = 2² + 7² + 1² + 3²</text>
  <text x="260" y="330" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">= 4 + 49 + 1 + 9 = 63</text>
</svg>
