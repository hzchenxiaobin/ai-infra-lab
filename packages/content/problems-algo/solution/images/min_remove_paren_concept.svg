<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：栈标记「无法配对」的括号</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">s = "lee(t(c)o)de)" —— 用栈存左括号下标，扫完标记所有多余括号</text>

  <!-- ===== String display ===== -->
  <!-- 13 chars: l e e ( t ( c ) o ) d e ) -->
  <g font-size="12" fill="#333">
    <rect x="40" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="55" y="81" text-anchor="middle">l</text>
    <rect x="72" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="87" y="81" text-anchor="middle">e</text>
    <rect x="104" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="119" y="81" text-anchor="middle">e</text>

    <!-- index 3 ( -->
    <rect x="136" y="62" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="151" y="81" text-anchor="middle" fill="#446688" font-weight="bold">(</text>

    <rect x="168" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="183" y="81" text-anchor="middle">t</text>

    <!-- index 5 ( -->
    <rect x="200" y="62" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="215" y="81" text-anchor="middle" fill="#446688" font-weight="bold">(</text>

    <rect x="232" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="247" y="81" text-anchor="middle">c</text>

    <!-- index 7 ) matched -->
    <rect x="264" y="62" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="279" y="81" text-anchor="middle" fill="#4a7a3a" font-weight="bold">)</text>

    <rect x="296" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="311" y="81" text-anchor="middle">o</text>

    <!-- index 9 ) matched -->
    <rect x="328" y="62" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="343" y="81" text-anchor="middle" fill="#4a7a3a" font-weight="bold">)</text>

    <rect x="360" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="375" y="81" text-anchor="middle">d</text>
    <rect x="392" y="62" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="407" y="81" text-anchor="middle">e</text>

    <!-- index 12 ) unmatched -> remove -->
    <rect x="424" y="62" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="439" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">)</text>
  </g>

  <!-- index labels -->
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="55" y="104">0</text>
    <text x="87" y="104">1</text>
    <text x="119" y="104">2</text>
    <text x="151" y="104" fill="#446688">3</text>
    <text x="183" y="104">4</text>
    <text x="215" y="104" fill="#446688">5</text>
    <text x="247" y="104">6</text>
    <text x="279" y="104" fill="#4a7a3a">7</text>
    <text x="311" y="104">8</text>
    <text x="343" y="104" fill="#4a7a3a">9</text>
    <text x="375" y="104">10</text>
    <text x="407" y="104">11</text>
    <text x="439" y="104" fill="#b85450">12</text>
  </g>

  <!-- legend -->
  <g font-size="9" fill="#666">
    <rect x="470" y="66" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="488" y="75">( 入栈</text>
    <rect x="470" y="80" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="488" y="89">) 配对</text>
    <rect x="470" y="94" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="488" y="103">删</text>
  </g>

  <!-- Divider -->
  <path d="M 30 120 L 530 120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Two removal rules ===== -->
  <text x="30" y="142" font-size="12" fill="#555" font-weight="bold">两类「无法配对」的括号 → 标记删除</text>

  <!-- Rule 1 -->
  <rect x="30" y="156" width="245" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="176" font-size="11" fill="#b85450" font-weight="bold">① 多余的右括号 ')'</text>
  <text x="44" y="194" font-size="10" fill="#555">扫描到 ')' 时若栈为空，</text>
  <text x="44" y="208" font-size="10" fill="#555">说明它前面没有 '(' 可配对</text>
  <text x="44" y="222" font-size="10" fill="#b85450" font-weight="bold">→ 该 ')' 标记删除</text>
  <text x="200" y="194" font-size="9" fill="#888">本例: i=12 的 ')'</text>
  <text x="200" y="208" font-size="9" fill="#888">栈空 → 删</text>

  <!-- Rule 2 -->
  <rect x="285" y="156" width="245" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="299" y="176" font-size="11" fill="#b85450" font-weight="bold">② 残留的左括号 '('</text>
  <text x="299" y="194" font-size="10" fill="#555">扫描结束后，栈中仍存</text>
  <text x="299" y="208" font-size="10" fill="#555">的下标都是没被配对的 '('</text>
  <text x="299" y="222" font-size="10" fill="#b85450" font-weight="bold">→ 这些 '(' 标记删除</text>
  <text x="450" y="194" font-size="9" fill="#888">本例: 栈终为空</text>
  <text x="450" y="208" font-size="9" fill="#888">无残留 '('</text>

  <!-- ===== Result insight ===== -->
  <rect x="40" y="252" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">💡 保留所有「能配对」的括号，只删「无法配对」的</text>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#555">被删的每个括号都无法配对 → 删除数自然最少</text>

  <!-- ===== Result string ===== -->
  <text x="30" y="322" font-size="11" fill="#888">结果：</text>
  <g font-size="12" fill="#333">
    <rect x="70" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="85" y="327" text-anchor="middle">l</text>
    <rect x="102" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="117" y="327" text-anchor="middle">e</text>
    <rect x="134" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="149" y="327" text-anchor="middle">e</text>
    <rect x="166" y="308" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="181" y="327" text-anchor="middle" fill="#446688" font-weight="bold">(</text>
    <rect x="198" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="213" y="327" text-anchor="middle">t</text>
    <rect x="230" y="308" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="245" y="327" text-anchor="middle" fill="#446688" font-weight="bold">(</text>
    <rect x="262" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="277" y="327" text-anchor="middle">c</text>
    <rect x="294" y="308" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="309" y="327" text-anchor="middle" fill="#4a7a3a" font-weight="bold">)</text>
    <rect x="326" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="341" y="327" text-anchor="middle">o</text>
    <rect x="358" y="308" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="373" y="327" text-anchor="middle" fill="#4a7a3a" font-weight="bold">)</text>
    <rect x="390" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="405" y="327" text-anchor="middle">d</text>
    <rect x="422" y="308" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="437" y="327" text-anchor="middle">e</text>
  </g>
  <text x="465" y="327" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 合法</text>

  <!-- bottom note -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">蓝=左括号入栈 · 绿=成功配对的右括号 · 红=标记删除</text>
</svg>
