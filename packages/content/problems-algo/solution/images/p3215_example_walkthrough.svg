<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：a=[1,1], b=[2,3], c=[1,5] → 答案 4</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">蓝 = popcount 偶（E 桶）　　红 = popcount 奇（O 桶）</text>

  <!-- 数组 a -->
  <text x="46" y="64" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">a =</text>
  <rect x="80" y="48" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="108" y="84" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(1)₂ · 1 个 1</text>
  <rect x="144" y="48" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="84" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(1)₂ · 1 个 1</text>
  <rect x="384" y="48" width="110" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">Ea=0　Oa=2</text>

  <!-- 数组 b -->
  <text x="46" y="120" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">b =</text>
  <rect x="80" y="104" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="108" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(10)₂ · 1 个 1</text>
  <rect x="144" y="104" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="172" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(11)₂ · 2 个 1</text>
  <rect x="384" y="104" width="110" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">Eb=1　Ob=1</text>

  <!-- 数组 c -->
  <text x="46" y="176" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c =</text>
  <rect x="80" y="160" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="108" y="196" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(1)₂ · 1 个 1</text>
  <rect x="144" y="160" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="172" y="196" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(101)₂ · 2 个 1</text>
  <rect x="384" y="160" width="110" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">Ec=1　Oc=1</text>

  <!-- 四项乘积 -->
  <text x="60" y="222" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">四种合法组合的乘积贡献：</text>
  <text x="71" y="232" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a</text>
  <text x="89" y="232" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b</text>
  <text x="107" y="232" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c</text>

  <!-- 行 1：偶偶偶 -->
  <rect x="64" y="236" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="82" y="236" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="236" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="248" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">Ea·Eb·Ec = 0·1·1</text>
  <text x="310" y="248" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">= 0</text>

  <!-- 行 2：奇奇偶 -->
  <rect x="64" y="260" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="82" y="260" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="260" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="272" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">Oa·Ob·Ec = 2·1·1</text>
  <text x="310" y="272" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">= 2</text>
  <text x="352" y="272" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 3：奇偶奇 -->
  <rect x="64" y="284" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="82" y="284" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="284" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="296" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">Oa·Eb·Oc = 2·1·1</text>
  <text x="310" y="296" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">= 2</text>
  <text x="352" y="296" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 4：偶奇奇 -->
  <rect x="64" y="308" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="82" y="308" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="308" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="320" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">Ea·Ob·Oc = 0·1·1</text>
  <text x="310" y="320" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">= 0</text>

  <!-- 合计 -->
  <rect x="400" y="236" width="94" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="447" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">四项相加</text>
  <text x="447" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 4</text>
  <text x="447" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0+2+2+0</text>

  <text x="240" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 1 同法：仅 Oa·Ob·Ec = 1 非零 → 答案 1 ✓</text>
</svg>
