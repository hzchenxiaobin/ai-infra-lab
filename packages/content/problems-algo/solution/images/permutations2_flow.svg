<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">全排列 II 算法流程：排序 → 回溯 + 去重剪枝</text>

  <!-- Step 0: sort -->
  <rect x="120" y="40" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sort(nums.begin(), nums.end())　← 让重复元素相邻</text>

  <path d="M 290 76 L 290 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start backtrack -->
  <ellipse cx="290" cy="108" rx="80" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#333">backtrack(path, used)</text>

  <path d="M 290 126 L 290 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Termination check -->
  <polygon points="290,144 410,182 290,220 170,182" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="11" fill="#333">path.size == n ?</text>
  <text x="290" y="194" text-anchor="middle" font-size="10" fill="#888">(路径已满)</text>

  <!-- Yes: collect -->
  <path d="M 410 182 L 480 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="174" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="480" y="164" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="182" text-anchor="middle" font-size="11" fill="#333">ans.push_back</text>
  <text x="520" y="194" text-anchor="middle" font-size="11" fill="#333">(path); return</text>

  <!-- No: for loop -->
  <path d="M 290 220 L 290 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="230" font-size="10" fill="#b85450">否</text>

  <rect x="140" y="238" width="300" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for (i = 0 .. n-1)：遍历每个候选</text>

  <path d="M 290 274 L 290 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check 1: used[i] ? -->
  <polygon points="290,292 370,320 290,348 210,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="11" fill="#333">used[i] ?</text>
  <text x="290" y="332" text-anchor="middle" font-size="9" fill="#888">(已选过?)</text>

  <path d="M 370 320 L 440 320" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="312" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="440" y="304" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="324" text-anchor="middle" font-size="11" fill="#888">continue</text>

  <!-- Check 2: dedup (NEW compared to 46) -->
  <path d="M 290 348 L 290 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="358" font-size="10" fill="#82b366">否</text>

  <polygon points="290,366 390,398 290,430 190,398" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i&gt;0 &amp;&amp; nums[i]==nums[i-1]</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">&amp;&amp; !used[i-1] ?</text>
  <text x="290" y="422" text-anchor="middle" font-size="9" fill="#888">(★ 去重剪枝)</text>

  <!-- yes: skip (pruned) -->
  <path d="M 390 398 L 440 398" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="390" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="440" y="382" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="402" text-anchor="middle" font-size="11" fill="#b85450">continue</text>

  <!-- no: select-recurse-undo -->
  <path d="M 290 430 L 290 442" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="438" font-size="10" fill="#82b366">否</text>

  <rect x="100" y="444" width="380" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="455" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">选 → 递归 → 撤销（与 46 题完全相同）</text>
</svg>
