<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：方向锁定 → 路径 = 起点 + 定向射线，走一步吐一个前缀数</text>
  <text x="132" y="47" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余 5 个方向第一步就出界（虚线）</text>

  <!-- 3x2 grid of mat = [[1,1],[9,9],[1,1]] -->
  <rect x="86" y="64" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="92" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="64" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="86" y="110" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="109" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="132" y="110" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="86" y="156" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="109" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="156" width="46" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="78" y="91" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">起点</text>

  <!-- in-bounds directions -->
  <path d="M 118 87 L 150 87" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 116 92 L 151 128" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 109 95 L 109 172" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- out-of-bounds directions -->
  <path d="M 109 82 L 109 54" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 112 84 L 140 56" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 106 84 L 78 56" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 104 87 L 74 87" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 106 90 L 78 118" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="164" y="80" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">东</text>
  <text x="163" y="145" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">东南</text>
  <text x="109" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">南</text>

  <!-- right panel: number building -->
  <rect x="228" y="58" width="316" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="77" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">东 E：1 → 11</text>
  <text x="386" y="94" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">11 = 1×10+1，从两位数开始进判素</text>

  <rect x="228" y="114" width="316" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="133" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">东南 SE：1 → 19</text>
  <text x="386" y="150" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">19 = 1×10+9</text>

  <rect x="228" y="170" width="316" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">南 S：1 → 19 → 191</text>
  <text x="386" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">191 = 19×10+1 —— 每走一步都产出一个新数</text>
  <text x="386" y="220" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（路径的每个前缀都是独立生成的数）</text>

  <rect x="228" y="240" width="316" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">num ← num × 10 + d（O(1) 增量构数）</text>
  <text x="386" y="278" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ds ← ds + d（数位和顺带维护，供预筛）</text>

  <!-- bottom note -->
  <rect x="28" y="308" width="504" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 方向中途不可改变 ⇒ 每条路径由（起点, 方向）唯一确定，8 方向不重不漏；</text>
  <text x="280" y="349" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">候选数上界 = 36 起点 × 8 方向 × ≤6 步 ≈ 1728 个，每个 ≤ 999999 ——</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数据范围（m, n ≤ 6）本身就是「全量枚举可行」的信号</text>
</svg>
