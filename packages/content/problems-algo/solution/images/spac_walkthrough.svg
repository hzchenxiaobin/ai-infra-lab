<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：状态图 BFS 逐层扩散</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">n=4, 红=[[0,1],[2,3]], 蓝=[[1,2]]；色编码 红=0, 蓝=1</text>

  <!-- column headers -->
  <text x="40" y="70" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="120" y="70" font-size="10" fill="#888" font-weight="bold">弹出(u,色)</text>
  <text x="250" y="70" font-size="10" fill="#888" font-weight="bold">走反色邻接</text>
  <text x="400" y="70" font-size="10" fill="#888" font-weight="bold">dist 更新</text>
  <text x="540" y="70" font-size="10" fill="#888" font-weight="bold">队列(处理后)</text>

  <!-- ===== Initial row ===== -->
  <rect x="20" y="78" width="540" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="48" y="99" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="160" y="99" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="290" y="99" text-anchor="middle" font-size="10" fill="#888">dist[0][红]=0, dist[0][蓝]=0</text>
  <text x="430" y="99" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[0,0,_,_]</text>
  <text x="556" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0,红),(0,蓝)]</text>

  <!-- ===== Step 1: pop (0,红) ===== -->
  <rect x="20" y="118" width="540" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="48" y="141" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="160" y="141" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0, 红)</text>
  <text x="290" y="141" text-anchor="middle" font-size="10" fill="#888">蓝 adj[0] = ∅</text>
  <text x="430" y="141" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">无更新</text>
  <text x="556" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0,蓝)]</text>

  <!-- ===== Step 2: pop (0,蓝) ===== -->
  <rect x="20" y="160" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="48" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="160" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(0, 蓝)</text>
  <text x="290" y="184" text-anchor="middle" font-size="10" fill="#555">红 adj[0] = {1}</text>
  <text x="430" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">dist[1][红]=1 ✓</text>
  <text x="556" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(1,红)]</text>

  <!-- ===== Step 3: pop (1,红) ===== -->
  <rect x="20" y="206" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="48" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="160" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(1, 红)</text>
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#555">蓝 adj[1] = {2}</text>
  <text x="430" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" font-family="monospace">dist[2][蓝]=2 ✓</text>
  <text x="556" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(2,蓝)]</text>

  <!-- ===== Step 4: pop (2,蓝) ===== -->
  <rect x="20" y="252" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="48" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="160" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(2, 蓝)</text>
  <text x="290" y="276" text-anchor="middle" font-size="10" fill="#555">红 adj[2] = {3}</text>
  <text x="430" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">dist[3][红]=3 ✓</text>
  <text x="556" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(3,红)]</text>

  <!-- ===== Step 5: pop (3,红) ===== -->
  <rect x="20" y="298" width="540" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="48" y="321" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">5</text>
  <text x="160" y="321" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(3, 红)</text>
  <text x="290" y="321" text-anchor="middle" font-size="10" fill="#888">蓝 adj[3] = ∅</text>
  <text x="430" y="321" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">无更新</text>
  <text x="556" y="321" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[]</text>

  <!-- arrow down -->
  <path d="M 290 336 L 290 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Conclusion ===== -->
  <rect x="50" y="360" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">answer[i] = min(dist[i][红], dist[i][蓝])</text>
  <text x="290" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">= [min(0,0), min(1,∞), min(∞,2), min(3,∞)] = [0, 1, 2, 3]</text>

  <!-- footnotes -->
  <text x="40" y="438" font-size="10" fill="#888">弹出 (u,红) → 只看蓝出边；(u,蓝) → 只看红出边，天然保证交替</text>
  <text x="40" y="456" font-size="10" fill="#446688" font-weight="bold">每个 (节点,色) 状态首次被更新即最短 → 无需重复入队</text>
</svg>
