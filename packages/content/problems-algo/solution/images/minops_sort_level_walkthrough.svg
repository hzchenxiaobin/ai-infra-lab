<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 2 逐层交换过程</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">root = [1,3,2,7,6,5,4] → 每层最少交换求和 = 3</text>

  <!-- ===== Tree before ===== -->
  <text x="130" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原树</text>
  <g font-size="10">
    <line x1="130" y1="80" x2="88" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="130" y1="80" x2="172" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="88" y1="128" x2="66" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="88" y1="128" x2="110" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="172" y1="128" x2="150" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="172" y1="128" x2="194" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <!-- L0 -->
    <circle cx="130" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="130" y="78" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- L1 -->
    <circle cx="88" cy="124" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="88" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <circle cx="172" cy="124" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="172" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- L2 -->
    <circle cx="66" cy="172" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="66" y="176" text-anchor="middle" fill="#b85450" font-size="9">7</text>
    <circle cx="110" cy="172" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="110" y="176" text-anchor="middle" fill="#b85450" font-size="9">6</text>
    <circle cx="150" cy="172" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="150" y="176" text-anchor="middle" fill="#b85450" font-size="9">5</text>
    <circle cx="194" cy="172" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="194" y="176" text-anchor="middle" fill="#b85450" font-size="9">4</text>
    <!-- layer labels -->
    <text x="14" y="78" font-size="9" fill="#446688" font-weight="bold">L0</text>
    <text x="14" y="128" font-size="9" fill="#d6a040" font-weight="bold">L1</text>
    <text x="14" y="176" font-size="9" fill="#b85450" font-weight="bold">L2</text>
  </g>

  <!-- arrow to sorted tree -->
  <path d="M 210 124 L 350 124" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">交换 3 次</text>
  <text x="280" y="138" text-anchor="middle" font-size="8" fill="#888">L1:1 + L2:2</text>

  <!-- ===== Tree after ===== -->
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">排序后</text>
  <g font-size="10">
    <line x1="430" y1="80" x2="388" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="430" y1="80" x2="472" y2="118" stroke="#888" stroke-width="0.9" filter="url(#rough2)"/>
    <line x1="388" y1="128" x2="366" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="388" y1="128" x2="410" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="472" y1="128" x2="450" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <line x1="472" y1="128" x2="494" y2="166" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
    <!-- L0 -->
    <circle cx="430" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="430" y="78" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- L1 sorted [2,3] -->
    <circle cx="388" cy="124" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="388" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="472" cy="124" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="472" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- L2 sorted [4,5,6,7] -->
    <circle cx="366" cy="172" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="366" y="176" text-anchor="middle" fill="#4a7a3a" font-size="9">4</text>
    <circle cx="410" cy="172" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="410" y="176" text-anchor="middle" fill="#4a7a3a" font-size="9">5</text>
    <circle cx="450" cy="172" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="450" y="176" text-anchor="middle" fill="#4a7a3a" font-size="9">6</text>
    <circle cx="494" cy="172" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="494" y="176" text-anchor="middle" fill="#4a7a3a" font-size="9">7</text>
    <!-- layer labels -->
    <text x="338" y="78" font-size="9" fill="#446688" font-weight="bold">L0</text>
    <text x="338" y="128" font-size="9" fill="#4a7a3a" font-weight="bold">L1</text>
    <text x="338" y="176" font-size="9" fill="#4a7a3a" font-weight="bold">L2</text>
  </g>

  <!-- ===== bottom per-level strips ===== -->
  <g font-size="9">
    <!-- L1 strip -->
    <rect x="30" y="208" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="42" y="226" fill="#d6a040" font-weight="bold">L1</text>
    <text x="80" y="226" fill="#555">[3, 2]</text>
    <text x="200" y="226" fill="#b85450" font-weight="bold">→ 1 个环：0→1→0（长2）→ 2−1 = 1 次交换</text>
    <text x="200" y="240" fill="#888" font-size="8">swap(3, 2) → [2, 3] ✓</text>

    <!-- L2 strip -->
    <rect x="30" y="256" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="42" y="276" fill="#b85450" font-weight="bold">L2</text>
    <text x="80" y="276" fill="#555">[7, 6, 5, 4]</text>
    <text x="230" y="276" fill="#b85450" font-weight="bold">→ 2 个环：0↔3（长2）、1↔2（长2）→ 4−2 = 2 次</text>
    <text x="80" y="294" fill="#888" font-size="8">swap(7,4)→[4,6,5,7]  ·  swap(6,5)→[4,5,6,7] ✓</text>

    <!-- L0 strip -->
    <rect x="30" y="312" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
    <text x="42" y="330" fill="#446688" font-weight="bold">L0</text>
    <text x="80" y="330" fill="#555">[1]  已有序，0 次交换</text>
  </g>

  <!-- final result -->
  <rect x="30" y="356" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总操作数 = L0:0 + L1:1 + L2:2 = 3</text>
  <text x="280" y="396" text-anchor="middle" font-size="9" fill="#555">每层独立环分解求和；值互不相同保证置换唯一、环分解确定</text>
  <text x="280" y="410" text-anchor="middle" font-size="9" fill="#888">最终树：[1,2,3,4,5,6,7]</text>
</svg>
