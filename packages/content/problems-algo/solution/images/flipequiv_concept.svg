<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">翻转等价：每个节点对有「直连」或「交叉」两种匹配</text>

  <!-- Tree A -->
  <text x="145" y="50" text-anchor="middle" font-size="11" fill="#888">树 A</text>
  <circle cx="145" cy="76" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="11" fill="#333">a</text>
  <circle cx="115" cy="128" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="132" text-anchor="middle" font-size="9" fill="#333">a.L</text>
  <line x1="135" y1="88" x2="122" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="175" cy="128" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="132" text-anchor="middle" font-size="9" fill="#333">a.R</text>
  <line x1="155" y1="88" x2="168" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Tree B -->
  <text x="435" y="50" text-anchor="middle" font-size="11" fill="#888">树 B</text>
  <circle cx="435" cy="76" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="11" fill="#333">b</text>
  <circle cx="405" cy="128" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="132" text-anchor="middle" font-size="9" fill="#333">b.L</text>
  <line x1="425" y1="88" x2="412" y2="118" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="465" cy="128" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="132" text-anchor="middle" font-size="9" fill="#333">b.R</text>
  <line x1="445" y1="88" x2="458" y2="118" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Strategy 1: direct (no flip) -->
  <rect x="30" y="166" width="520" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" opacity="0.3" filter="url(#rough2)"/>
  <text x="45" y="186" font-size="12" fill="#4a7a3a" font-weight="bold">① 不翻转（直连）— 同 100 相同树</text>
  <circle cx="115" cy="216" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="220" text-anchor="middle" font-size="8" fill="#333">a.L</text>
  <circle cx="175" cy="216" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="8" fill="#333">a.R</text>
  <circle cx="405" cy="216" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="405" y="220" text-anchor="middle" font-size="8" fill="#333">b.L</text>
  <circle cx="465" cy="216" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="220" text-anchor="middle" font-size="8" fill="#333">b.R</text>
  <path d="M 127 210 L 393 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 187 222 L 453 222" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a">a.L ↔ b.L</text>
  <text x="320" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a">a.R ↔ b.R</text>

  <!-- Strategy 2: crossed (flip) -->
  <rect x="30" y="254" width="520" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" opacity="0.3" filter="url(#rough2)"/>
  <text x="45" y="274" font-size="12" fill="#d6a040" font-weight="bold">② 翻转（交叉）— 同 101 对称二叉树</text>
  <circle cx="115" cy="304" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="308" text-anchor="middle" font-size="8" fill="#333">a.L</text>
  <circle cx="175" cy="304" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="175" y="308" text-anchor="middle" font-size="8" fill="#333">a.R</text>
  <circle cx="405" cy="304" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="405" y="308" text-anchor="middle" font-size="8" fill="#333">b.L</text>
  <circle cx="465" cy="304" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="308" text-anchor="middle" font-size="8" fill="#333">b.R</text>
  <path d="M 127 298 Q 290 274 453 298" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 187 310 Q 290 334 417 310" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="9" fill="#d6a040">a.L ↔ b.R</text>
  <text x="290" y="346" text-anchor="middle" font-size="9" fill="#d6a040">a.R ↔ b.L</text>

  <!-- OR summary -->
  <rect x="90" y="352" width="400" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="375" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">直连成立 ∨ 交叉成立 → 翻转等价</text>
</svg>
