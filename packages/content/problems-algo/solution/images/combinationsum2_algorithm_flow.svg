<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="580" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">组合总和 II：算法流程</text>
  <path d="M 270 44 Q 430 52 590 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. 排序 -->
  <g filter="url(#sk)"><rect x="320" y="66" width="220" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="430" y="84" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">① 排序 candidates</text>
  <text x="430" y="100" text-anchor="middle" font-size="10" fill="#555">使相同值相邻，便于同层去重与剪枝</text>
  <path d="M 430 106 L 430 126" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. 进入回溯 -->
  <g filter="url(#sk)"><rect x="300" y="126" width="260" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="430" y="144" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">② backtrack(start, rem, path)</text>
  <text x="430" y="160" text-anchor="middle" font-size="10" fill="#555">初始调用 backtrack(0, target, [])</text>
  <path d="M 430 166 L 430 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. 判断 rem==0 (菱形) -->
  <g filter="url(#sk)"><path d="M 430 186 L 520 222 L 430 258 L 340 222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="430" y="219" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">rem == 0 ?</text>
  <text x="430" y="234" text-anchor="middle" font-size="10" fill="#7a5415">（恰好凑够 target）</text>

  <!-- yes -> 记录答案 -->
  <path d="M 520 222 L 600 222" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="560" y="214" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="600" y="204" width="200" height="36" rx="7" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.5"/></g>
  <text x="700" y="227" text-anchor="middle" font-size="11" fill="#1f5a1f" font-weight="bold">记录 path → return</text>

  <!-- no -> for 循环 -->
  <path d="M 430 258 L 430 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="442" y="274" font-size="10" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="300" y="280" width="260" height="34" rx="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="430" y="302" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">③ for i = start .. n-1</text>

  <!-- 4. 剪枝判断 -->
  <path d="M 430 314 L 430 334" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 430 334 L 540 368 L 430 402 L 320 368 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="430" y="365" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">candidates[i] &gt; rem ?</text>
  <text x="430" y="380" text-anchor="middle" font-size="9" fill="#b03a3a">已排序，后续只会更大</text>

  <path d="M 540 368 L 620 368" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="580" y="360" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="620" y="350" width="180" height="36" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="710" y="373" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">break（剪枝）</text>

  <!-- 5. 去重判断 -->
  <path d="M 430 402 L 430 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="442" y="416" font-size="10" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><path d="M 430 422 L 560 458 L 430 494 L 300 458 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="430" y="452" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">i &gt; start 且</text>
  <text x="430" y="466" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">candidates[i]==c[i-1] ?</text>
  <text x="430" y="481" text-anchor="middle" font-size="9" fill="#7a5415">同层相邻重复</text>

  <path d="M 560 458 L 620 458" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="590" y="450" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="620" y="440" width="180" height="36" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="710" y="463" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">continue（去重）</text>

  <!-- 6. 选择 -> 递归 -> 撤销 -->
  <path d="M 430 494 L 430 514" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="442" y="508" font-size="10" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="250" y="514" width="360" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="430" y="535" text-anchor="middle" font-size="11" fill="#1f5a1f" font-weight="bold">④ 选 candidates[i] → path.push</text>
  <text x="430" y="552" text-anchor="middle" font-size="10" fill="#2e6e2e">backtrack(i+1, rem − candidates[i], path) ；之后 path.pop() 撤销</text>

  <!-- return loop arrow back to for -->
  <path d="M 250 537 Q 150 537 150 297 Q 150 280 300 297" stroke="#888" stroke-width="1.3" stroke-dasharray="5 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="412" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 150 412)">回溯返回，继续下一轮 i</text>
</svg>
