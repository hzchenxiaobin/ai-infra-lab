<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">讨厌关系 = 无向边；能否分两组 = 是否二分图</text>

  <!-- ===== Left panel: dislikes list -> graph ===== -->
  <rect x="24" y="48" width="252" height="236" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#345678" font-weight="bold">把 dislikes 画成图</text>

  <!-- dislikes text -->
  <text x="44" y="96" font-size="11" fill="#555">dislikes =</text>
  <text x="44" y="112" font-size="11" fill="#333">[[1,2],[1,3],</text>
  <text x="44" y="126" font-size="11" fill="#333"> [2,4]]</text>

  <!-- arrow from text to graph -->
  <path d="M 120 118 L 150 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edges (drawn before nodes) -->
  <path d="M 100 168 L 200 168" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 100 168 L 200 230" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 100 230 L 200 168" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes 1..4 (uncolored, gray) -->
  <circle cx="100" cy="168" r="18" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="100" cy="230" r="18" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="200" cy="168" r="18" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="200" cy="230" r="18" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#555">每条讨厌关系就是一条无向边</text>

  <!-- ===== Right panel: two-coloring -> two groups ===== -->
  <rect x="292" y="48" width="244" height="236" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 二着色 → 两组分成功</text>
  <text x="350" y="96" text-anchor="middle" font-size="11" fill="#446688">组 A（蓝）</text>
  <text x="478" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a">组 B（绿）</text>

  <!-- edges (drawn before nodes) -->
  <path d="M 350 140 L 478 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 350 140 L 478 210" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 350 210 L 478 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: A = {1,4} blue, B = {2,3} green -->
  <circle cx="350" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="350" cy="210" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="478" cy="140" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="478" cy="210" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="414" y="250" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">每条边跨组 → 无讨厌者同组</text>
  <text x="414" y="268" text-anchor="middle" font-size="11" fill="#555">组 A = {1,4}，组 B = {2,3}</text>

  <!-- ===== Bottom note box ===== -->
  <rect x="40" y="304" width="480" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">建模：人 = 节点，dislikes = 无向边，两组 = 二着色</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#666">与 785 判断二分图完全等价，只是输入从邻接表变成边列表</text>
</svg>
