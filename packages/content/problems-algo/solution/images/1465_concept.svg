<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：最大面积 = 最大水平间距 × 最大竖直间距</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">h=5, w=4, hCuts=[1,2,4], vCuts=[1,3]  →  各方向独立取最大，相乘即为答案</text>

  <!-- ===== Cake outline (top-left 140,80 ; w=200,h=250 ; scale=50/unit) ===== -->
  <rect x="140" y="80" width="200" height="250" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="74" text-anchor="middle" font-size="11" fill="#888">蛋糕 w=4</text>
  <text x="128" y="208" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 128 208)">h=5</text>

  <!-- ===== Horizontal cut lines (red, across full width) at y=1,2,4 ===== -->
  <line x1="140" y1="130" x2="340" y2="130" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="140" y1="180" x2="340" y2="180" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="140" y1="280" x2="340" y2="280" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- vertical cut lines at x=1,3 -->
  <line x1="190" y1="80" x2="190" y2="330" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="290" y1="80" x2="290" y2="330" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- cut labels (small, near edges) -->
  <text x="348" y="134" font-size="9.5" fill="#b85450">y=1</text>
  <text x="348" y="184" font-size="9.5" fill="#b85450">y=2</text>
  <text x="348" y="284" font-size="9.5" fill="#b85450">y=4</text>
  <text x="194" y="344" font-size="9.5" fill="#b85450">x=1</text>
  <text x="294" y="344" font-size="9.5" fill="#b85450">x=3</text>

  <!-- ===== Max horizontal gap band (y in [2,4] -> [180,280]) highlight orange ===== -->
  <rect x="140" y="180" width="200" height="100" fill="#fff8e1" fill-opacity="0.0" stroke="#d6a040" stroke-width="0" filter="url(#rough2)"/>
  <!-- bracket on right showing maxH=2 -->
  <path d="M 348 180 L 358 180 L 358 280 L 348 280" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="372" y="234" font-size="12" fill="#d6a040" font-weight="bold">maxH</text>
  <text x="372" y="250" font-size="12" fill="#d6a040" font-weight="bold">= 2</text>

  <!-- ===== Max vertical gap band (x in [1,3] -> [190,290]) bracket on bottom ===== -->
  <path d="M 190 348 L 190 358 L 290 358 L 290 348" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="232" y="376" font-size="12" fill="#d6a040" font-weight="bold">maxV = 2</text>

  <!-- ===== Max-area piece (intersection) green square x[190,290] y[180,280] ===== -->
  <rect x="190" y="180" width="100" height="100" fill="#e6f4ea" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">最大块</text>
  <text x="240" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 × 2 = 4</text>

  <!-- ===== Right side: gap lists ===== -->
  <text x="430" y="100" font-size="11.5" fill="#555" font-weight="bold">水平间距（含边界）</text>
  <text x="430" y="118" font-size="10.5" fill="#888">[0,1,2,4,5] → 差分：</text>
  <!-- 4 gap chips: 1,1,2,1 with 2 highlighted -->
  <rect x="430" y="128" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="443" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="458" y="128" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="471" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="486" y="128" width="26" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="499" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="514" y="128" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="527" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="548" y="144" font-size="11" fill="#d6a040" font-weight="bold">← maxH</text>

  <text x="430" y="180" font-size="11.5" fill="#555" font-weight="bold">竖直间距（含边界）</text>
  <text x="430" y="198" font-size="10.5" fill="#888">[0,1,3,4] → 差分：</text>
  <rect x="430" y="208" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="443" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="458" y="208" width="26" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="471" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="486" y="208" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="499" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="518" y="224" font-size="11" fill="#d6a040" font-weight="bold">← maxV</text>

  <!-- formula box -->
  <rect x="430" y="252" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">面积 = maxH × maxV</text>
  <text x="515" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a">= 2 × 2 = 4</text>
  <text x="515" y="308" text-anchor="middle" font-size="10" fill="#888">再对 10⁹+7 取余</text>

  <!-- footer -->
  <text x="310" y="408" text-anchor="middle" font-size="10.5" fill="#888">关键：两个方向的间距都为正 → max(aᵢ·bⱼ) = max(aᵢ)·max(bⱼ)，维度可分离</text>
  <text x="310" y="424" text-anchor="middle" font-size="10" fill="#aaa">无需枚举所有 m×n 块，各自 O(n) 取最大即可</text>
</svg>
