  <text x="60" y="468" font-size="11" fill="#666">分隔后立即继续消耗 c——这正是「优先消耗最高频、节约稀缺分隔符」的贪心精髓</text>
  <text x="60" y="488" font-size="11" fill="#b85450">步骤 ⑨：c 仍剩 1 个但被 "cc" 阻塞，a/b 已耗尽 → 任何策略都无法再放 → 终止</text>
</svg>
