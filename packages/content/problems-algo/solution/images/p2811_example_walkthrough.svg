<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算</text>

  <!-- Example 1 -->
  <text x="20" y="54" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">示例1</text>
  <text x="20" y="70" font-size="11" fill="#555" filter="url(#rough2)">nums=[2,2,1] m=4</text>
  <rect x="120" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="44" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="61" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相邻对 2+2=4 ≥ 4 ✓</text>
  <text x="240" y="76" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ true</text>

  <!-- Example 2 -->
  <text x="20" y="118" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例2</text>
  <text x="20" y="134" font-size="11" fill="#555" filter="url(#rough2)">nums=[2,1,3] m=5</text>
  <rect x="120" y="108" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="108" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="108" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">2+1=3 &lt; 5 ✗</text>
  <text x="240" y="136" font-size="11" fill="#b85450" filter="url(#rough2)">1+3=4 &lt; 5 ✗</text>
  <text x="360" y="128" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ false</text>

  <!-- Example 3 -->
  <text x="20" y="182" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例3</text>
  <text x="20" y="198" font-size="11" fill="#555" filter="url(#rough2)">nums=[2,3,3,2,3] m=6</text>
  <rect x="120" y="172" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="172" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="172" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="172" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="264" y="172" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="310" y="186" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相邻对 3+3=6 ≥ 6 ✓</text>
  <text x="310" y="200" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ true</text>

  <!-- boundary cases box -->
  <rect x="20" y="240" width="500" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">边界情形速查</text>

  <text x="40" y="288" font-size="12" fill="#333" filter="url(#rough2)">• n = 1：已是一个非空数组，无需拆分 → true</text>
  <text x="40" y="312" font-size="12" fill="#333" filter="url(#rough2)">• n = 2：直接拆成两个长度为 1 的子数组，均 good → true</text>
  <text x="40" y="336" font-size="12" fill="#333" filter="url(#rough2)">• n ≥ 3：必须有至少一对相邻元素和 ≥ m，否则 false</text>
  <text x="40" y="360" font-size="12" fill="#888" filter="url(#rough2)">  （原数组本身无需 sum ≥ m，因为它不是某次拆分的结果）</text>
</svg>
