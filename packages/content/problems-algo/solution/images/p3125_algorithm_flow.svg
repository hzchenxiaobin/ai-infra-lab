<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两条路，殊途同归 ans = 2^x − 1</text>

  <!-- Lane A -->
  <text x="60" y="54" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A · n 是 64 位整数（O(1)）</text>

  <rect x="48" y="64" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="102" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n（整数）</text>

  <path d="M 158 86 L 174 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="178" y="64" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="268" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 63 − clz(n)</text>
  <text x="268" y="98" text-anchor="middle" font-size="10" fill="#7a8ba0" filter="url(#rough2)">最高置位比特下标</text>

  <path d="M 360 86 L 376 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="380" y="64" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="426" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 2^x − 1</text>

  <text x="60" y="128" font-size="10.5" fill="#888" filter="url(#rough2)">Python：n.bit_length() − 1；无内建用涂抹法 t |= t&gt;&gt;k，再右移一位</text>

  <!-- Lane B -->
  <text x="60" y="160" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B · n 是超长十进制串（大数版）</text>

  <rect x="48" y="170" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="148" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① 从 1 出发大数乘 2</text>
  <text x="148" y="204" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">生成 2^k 串表，直到位数超过 L</text>

  <path d="M 250 192 L 268 192" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="272" y="170" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② 表天然升序 → 二分</text>
  <text x="372" y="204" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">找最大的 2^x ≤ n</text>

  <path d="M 372 214 L 372 224 L 148 224 L 148 228" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="48" y="232" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="148" y="250" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③ 串减一：2^x → 2^x − 1</text>
  <text x="148" y="266" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">末位非 0 直减，遇 0 借位变 9</text>

  <path d="M 250 254 L 268 254" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="272" y="232" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="372" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 输出答案串</text>

  <!-- notes -->
  <rect x="48" y="288" width="424" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">十进制串比大小 = 先比长度、再比字典序（无前导零时等价数值序）</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">建表 O(L²) · 二分 O(L·log L) · 串减一 O(L)</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">别用浮点 log 估 x —— 2^k 邻域必翻车</text>

  <rect x="48" y="352" width="424" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">两条路的答案完全一致：不超过 n 的最大 2 的幂，再减一</text>
</svg>
