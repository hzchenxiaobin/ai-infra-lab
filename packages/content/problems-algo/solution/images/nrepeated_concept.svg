<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">长度 2N 数组：N 份重复元素 x + N 个互异值</text>

  <!-- Array label -->
  <text x="32" y="66" font-size="12" fill="#888">2N 数组</text>
  <text x="32" y="82" font-size="11" fill="#aaa">(N=4)</text>

  <!-- Array cells: [5,1,5,2,5,3,5,4] -->
  <!-- 8 cells, each 48 wide, starting x=90 -->
  <!-- 5s highlighted in red/orange, others in blue -->
  <rect x="90"  y="52" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="77" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>

  <rect x="138" y="52" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="77" text-anchor="middle" font-size="15" fill="#333">1</text>

  <rect x="186" y="52" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="77" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>

  <rect x="234" y="52" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="77" text-anchor="middle" font-size="15" fill="#333">2</text>

  <rect x="282" y="52" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="77" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>

  <rect x="330" y="52" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="77" text-anchor="middle" font-size="15" fill="#333">3</text>

  <rect x="378" y="52" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="77" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>

  <rect x="426" y="52" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="77" text-anchor="middle" font-size="15" fill="#333">4</text>

  <!-- index labels -->
  <text x="114" y="104" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="162" y="104" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="210" y="104" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="258" y="104" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="306" y="104" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="354" y="104" text-anchor="middle" font-size="10" fill="#aaa">5</text>
  <text x="402" y="104" text-anchor="middle" font-size="10" fill="#aaa">6</text>
  <text x="450" y="104" text-anchor="middle" font-size="10" fill="#aaa">7</text>

  <!-- Legend -->
  <rect x="492" y="56" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="67" font-size="11" fill="#555">x = 5 (N 份)</text>
  <rect x="492" y="76" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="87" font-size="11" fill="#555">互异值 (N 个)</text>

  <!-- Section: gap analysis -->
  <text x="32" y="138" font-size="12" fill="#888">相邻两份 x 之间的间隙：</text>

  <!-- gap brackets between consecutive 5s: 0->2, 2->4, 4->6 -->
  <!-- gap 1: between index 0 and 2, contains index 1 (value 1) -->
  <path d="M 114 120 Q 162 134 210 120" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="162" y="146" text-anchor="middle" font-size="11" fill="#b85450">间隙1: 1 个</text>

  <path d="M 210 120 Q 258 134 306 120" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="258" y="146" text-anchor="middle" font-size="11" fill="#b85450">间隙2: 1 个</text>

  <path d="M 306 120 Q 354 134 402 120" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="354" y="146" text-anchor="middle" font-size="11" fill="#b85450">间隙3: 1 个</text>

  <!-- Pigeonhole reasoning box -->
  <rect x="40" y="168" width="500" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="190" font-size="12" fill="#444" font-weight="bold">鸽巢原理：两份 x 的距离 ≤ 3</text>

  <text x="56" y="212" font-size="11" fill="#555">假设任意两份 x 都距离 ≥ 4（间隙 ≥ 3 个其它元素）：</text>
  <text x="56" y="230" font-size="11" fill="#555">N 份 x → N−1 个间隙 → 至少需 3(N−1) 个其它元素</text>
  <text x="56" y="248" font-size="11" fill="#555">但只有 N 个其它元素，故 3(N−1) ≤ N ⇒ N ≤ 1.5，与 N ≥ 2 矛盾 ✓</text>

  <!-- Conclusion -->
  <rect x="40" y="280" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结论：必存在 i，使 nums[i] = nums[i−1] / nums[i−2] / nums[i−3]</text>

  <!-- distance illustration on the right bottom -->
  <text x="40" y="346" font-size="11" fill="#888">回看 3 格示意（以下标 4 为例）：</text>
  <rect x="180" y="330" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="197" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="222" y="348" font-size="10" fill="#888">i=4</text>

  <path d="M 215 360 L 210 360 L 210 370" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 360 L 197 360 L 197 370" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="172" y="376" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="189" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="155" y="390" font-size="10" fill="#888">i−2</text>

  <text x="240" y="390" font-size="11" fill="#4a7a3a" font-weight="bold">命中！距离 2</text>
</svg>
