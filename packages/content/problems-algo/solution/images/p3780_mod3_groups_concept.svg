<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按 x mod 3 分组，每组只留前三大，四种余数组合逐一计分</text>

  <!-- 面板一：分组 -->
  <rect x="20" y="38" width="520" height="228" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① nums = [9, 6, 3, 7, 4, 5]：每个数按余数归组，组内降序</text>

  <!-- 数组格子（按余数着色） -->
  <rect x="96" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="93" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">9</text>
  <rect x="144" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="163" y="93" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">6</text>
  <rect x="192" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="93" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="240" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="259" y="93" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">7</text>
  <rect x="288" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="307" y="93" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">4</text>
  <rect x="336" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="93" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">5</text>

  <!-- 余数标注 -->
  <text x="115" y="116" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">mod 0</text>
  <text x="163" y="116" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">mod 0</text>
  <text x="211" y="116" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">mod 0</text>
  <text x="259" y="116" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">mod 1</text>
  <text x="307" y="116" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">mod 1</text>
  <text x="355" y="116" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">mod 2</text>

  <!-- 归组箭头 -->
  <path d="M 155 122 C 145 128 132 128 124 132" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 283 122 C 283 127 283 129 283 133" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 355 122 C 390 127 425 129 450 133" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 余 0 组 -->
  <rect x="36" y="136" width="158" height="84" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="155" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">余 0 组（3 个）</text>
  <rect x="48" y="164" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="183" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">9</text>
  <rect x="90" y="164" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="183" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">6</text>
  <rect x="132" y="164" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="183" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="115" y="212" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">前三大直接用</text>

  <!-- 余 1 组 -->
  <rect x="205" y="136" width="158" height="84" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="155" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">余 1 组（2 个）</text>
  <rect x="217" y="164" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="183" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">7</text>
  <rect x="259" y="164" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="183" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">4</text>
  <rect x="301" y="164" width="34" height="28" rx="4" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="284" y="212" text-anchor="middle" font-size="9.5" fill="#2d5a24" filter="url(#rough2)">凑不齐 3 个</text>

  <!-- 余 2 组 -->
  <rect x="374" y="136" width="158" height="84" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="453" y="155" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">余 2 组（1 个）</text>
  <rect x="386" y="164" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="183" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <rect x="428" y="164" width="34" height="28" rx="4" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="470" y="164" width="34" height="28" rx="4" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="453" y="212" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">凑不齐 3 个</text>

  <text x="36" y="240" font-size="10.5" fill="#33506b" filter="url(#rough2)">同余替换不减和 ⇒ 固定组合模式下各槽位取组内最大即最优 ⇒ 每组只留前三大，至多 9 个数参与决策</text>

  <!-- 面板二：四种组合 -->
  <rect x="20" y="278" width="520" height="134" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="298" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 三数之和 ≡ 0 (mod 3) 的余数形态只有四种，逐一计分取最大</text>

  <rect x="32" y="310" width="118" height="62" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="91" y="330" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">(0,0,0)</text>
  <text x="91" y="350" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">9+6+3 = 18 ✓</text>

  <rect x="158" y="310" width="118" height="62" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="330" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">(1,1,1)</text>
  <text x="217" y="350" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">只有 2 个 ✗</text>

  <rect x="284" y="310" width="118" height="62" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="343" y="330" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">(2,2,2)</text>
  <text x="343" y="350" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">只有 1 个 ✗</text>

  <rect x="410" y="310" width="118" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="469" y="330" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold" filter="url(#rough2)">(0,1,2)</text>
  <text x="469" y="350" text-anchor="middle" font-size="11" fill="#8a3030" filter="url(#rough2)">9+7+5 = 21 ✓</text>
  <text x="469" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ 答案</text>

  <text x="36" y="402" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">答案 = max{18, 21} = 21 —— 分组后其余 n − 9 个数与答案无关</text>
</svg>
