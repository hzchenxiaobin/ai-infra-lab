<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：查询按步长 k 跳跃更新，并非整段区间</text>

  <rect x="28" y="40" width="215" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">查询 [l, r, k, v] = [1, 6, 2, 3]</text>

  <text x="112" y="104" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">idx 从 l 出发</text>

  <path d="M 123 126 Q 177 82 231 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 231 126 Q 285 82 339 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 339 126 Q 393 82 447 126" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="177" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">idx += k</text>
  <text x="410" y="86" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">7 &gt; r，停！</text>

  <rect x="45" y="130" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="99" y="130" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3→9</text>
  <text x="123" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×3</text>

  <rect x="153" y="130" width="48" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="177" y="155" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="177" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="207" y="130" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5→15</text>
  <text x="231" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×3</text>

  <rect x="261" y="130" width="48" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="285" y="155" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="285" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="315" y="130" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7→21</text>
  <text x="339" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×3</text>

  <rect x="369" y="130" width="48" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="393" y="155" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">6</text>
  <text x="393" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="423" y="130" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <text x="69" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="123" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l=1</text>
  <text x="177" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="231" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="285" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="339" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="393" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r=6</text>
  <text x="447" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>

  <path d="M 99 200 H 417" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 99 197 V 205" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 417 197 V 205" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="219" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[l, r] 区间内也只有部分位置被更新</text>

  <rect x="35" y="230" width="450" height="114" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 触碰位置：l, l+k, l+2k, …（只要 ≤ r），共 ⌊(r−l)/k⌋+1 个</text>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 每步乘完立即 mod p —— 最终异或的是取模后的值</text>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 模乘可交换 ⇒ 查询先后不影响终值，按序模拟天然正确</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ n, q ≤ 10³ ⇒ 最坏 q·n = 10⁶ 次操作，暴力模拟即正解</text>
</svg>
