<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">0-1 BFS 求网格最少修改代价：算法流程</text>

  <!-- Step 1: 建模 -->
  <rect x="60" y="56" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="78" font-size="12" fill="#446688" font-weight="bold">① 建模：每格 4 条出边，权 0 或 1</text>
  <text x="80" y="96" font-size="10" fill="#555">方向 k 与 grid[r][c] 相同 → w=0（顺箭头）；否则 → w=1（改方向）</text>
  <text x="80" y="112" font-size="10" fill="#888">dr={0,0,1,-1}, dc={1,-1,0,0} 对应 →,←,↓,↑</text>

  <path d="M 280 122 L 280 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 初始化 -->
  <rect x="60" y="148" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="170" font-size="12" fill="#d6a040" font-weight="bold">② 初始化 dist[][]=∞，dist[0][0]=0，deque=[(0,0)]</text>
  <text x="80" y="188" font-size="10" fill="#555">vis[][] 全 false；起点 push_front 进队</text>
  <text x="80" y="204" font-size="10" fill="#888">deque 维护“按 dist 非递减”的单调性</text>

  <path d="M 280 214 L 280 236" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 弹出队首 -->
  <rect x="60" y="240" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">③ 弹出队首 (r,c)；若 vis[r][c] 已标记则跳过</text>
  <text x="80" y="280" font-size="10" fill="#555">否则标记 vis[r][c]=true（懒删除：旧记录直接跳过）</text>
  <text x="80" y="296" font-size="10" fill="#888">首弹出即最短路确定（deque 单调性保证）</text>

  <path d="M 280 306 L 280 328" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 松弛 4 方向 -->
  <rect x="60" y="332" width="440" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="354" font-size="12" fill="#b85450" font-weight="bold">④ 遍历 4 方向邻居 (nr,nc)：松弛并按权入队</text>
  <text x="80" y="372" font-size="10" fill="#555">w = (k+1 == grid[r][c]) ? 0 : 1</text>
  <text x="80" y="388" font-size="10" fill="#555">if dist[r][c]+w &lt; dist[nr][nc]：更新 dist，w==0 → push_front，w==1 → push_back</text>
  <text x="80" y="404" font-size="10" fill="#888">越界邻居跳过；dist 未改善不入队</text>

  <path d="M 280 414 L 280 436" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 返回 -->
  <rect x="60" y="440" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="462" font-size="12" fill="#d6a040" font-weight="bold">⑤ 队列空 → 返回 dist[m-1][n-1]</text>
  <text x="80" y="478" font-size="10" fill="#555">必可达：总能改箭头铺路，故无 -1</text>

  <!-- 侧标注 -->
  <text x="520" y="372" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">← 核心</text>
  <text x="520" y="462" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">← 答案</text>
</svg>
