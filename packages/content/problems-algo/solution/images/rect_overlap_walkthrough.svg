<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三个示例演算</text>

  <!-- Example 1: overlap -->
  <text x="95" y="50" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例1：[0,0,2,2] vs [1,1,3,3]</text>
  <line x1="45" y1="210" x2="150" y2="210" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="50" y1="215" x2="50" y2="118" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="222" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <rect x="50" y="154" width="56" height="56" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="78" y="126" width="56" height="56" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="78" y="154" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="56" y="150" font-size="9" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="118" y="122" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <text x="95" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x: 0&lt;3 ✓  1&lt;2 ✓</text>
  <text x="95" y="248" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">y: 0&lt;3 ✓  1&lt;2 ✓</text>
  <rect x="60" y="258" width="70" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- Example 2: edge touch -->
  <text x="265" y="50" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例2：[0,0,1,1] vs [1,0,2,1]</text>
  <line x1="220" y1="210" x2="325" y2="210" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="215" x2="225" y2="165" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="219" y="222" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <rect x="225" y="172" width="38" height="38" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="263" y="172" width="38" height="38" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <circle cx="263" cy="210" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="271" y="228" font-size="9" fill="#b85450" filter="url(#rough2)">仅边接触</text>
  <text x="231" y="168" font-size="9" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="278" y="168" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <text x="265" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x: 0&lt;2 ✓  1&lt;1 ✗</text>
  <text x="265" y="248" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">rec2[0] = rec1[2]</text>
  <rect x="230" y="258" width="70" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- Example 3: disjoint -->
  <text x="455" y="50" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例3：[0,0,1,1] vs [2,2,3,3]</text>
  <line x1="390" y1="215" x2="475" y2="215" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="395" y1="220" x2="395" y2="140" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="389" y="227" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <rect x="395" y="193" width="22" height="22" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="439" y="149" width="22" height="22" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="399" y="189" font-size="9" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="443" y="145" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <text x="455" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x: 0&lt;3 ✓  2&lt;1 ✗</text>
  <text x="455" y="248" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">完全不相交</text>
  <rect x="420" y="258" width="70" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false</text>
</svg>
