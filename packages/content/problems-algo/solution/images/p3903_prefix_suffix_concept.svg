<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀最大 × 后缀最小，双向一趟递推</text>

  <!-- nums 行 -->
  <text x="82" y="67" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="90" y="48" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="67" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="146" y="48" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="67" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="202" y="48" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="67" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="48" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="112" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="168" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="224" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="280" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- preMax 行 -->
  <text x="82" y="125" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">preMax</text>
  <rect x="90" y="106" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="125" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="146" y="106" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="125" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="202" y="106" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="125" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="258" y="106" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>

  <path d="M 95 146 L 298 146" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="161" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">从左往右递推</text>
  <circle cx="56" cy="150" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="154.5" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">−</text>

  <!-- sufMin 行 -->
  <text x="82" y="185" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">sufMin</text>
  <rect x="90" y="166" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="185" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="146" y="166" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="185" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="202" y="166" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="185" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="166" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 298 206 L 95 206" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="221" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">从右往左递推</text>
  <circle cx="56" cy="210" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="214.5" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- diff 行 -->
  <text x="82" y="245" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">diff</text>
  <rect x="90" y="226" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="245" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <rect x="146" y="226" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="245" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <rect x="202" y="226" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="245" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>
  <rect x="258" y="226" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="112" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="168" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="224" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ ≤3</text>

  <!-- 左下说明框 -->
  <rect x="20" y="282" width="286" height="56" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="298" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">为什么 diff ≥ 0 恒成立？</text>
  <text x="163" y="314" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">pre[i] ≥ nums[i] ≥ suf[i]，枢纽元素两侧闭区间都参与</text>
  <text x="163" y="330" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">k = 0 ⟺ nums[i] 既是前缀最大，又是后缀最小</text>

  <!-- 右侧便签 1：增量递推 -->
  <rect x="318" y="44" width="188" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="62" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">增量递推 · O(1) 传递</text>
  <text x="412" y="78" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">pre[i] = max(pre[i−1], nums[i])</text>
  <text x="412" y="92" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">suf[i] = min(suf[i+1], nums[i])</text>
  <text x="412" y="106" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">相邻下标的区间只差一个元素</text>

  <!-- 右侧便签 2：非单调警告 -->
  <rect x="318" y="126" width="188" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="144" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">小心：diff 并不单调</text>
  <text x="412" y="160" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">pre、suf 都随 i 不减</text>
  <text x="412" y="174" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">⇒ 两者之差无单调性</text>
  <text x="412" y="188" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">本例 5,5,4,1 一路递减</text>
  <text x="412" y="202" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">[1,5,2,3] 为 0,3,3,2 先升后降</text>
  <text x="412" y="216" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">⇒ 不能二分、不能提前终止</text>

  <!-- 右侧便签 3：判定 -->
  <rect x="318" y="232" width="188" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="250" text-anchor="middle" font-size="10" fill="#2f5c24" font-weight="bold" filter="url(#rough2)">判定：找首个达标下标</text>
  <text x="412" y="266" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">从左往右首个 pre − suf ≤ k</text>
  <text x="412" y="280" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">i=3：5 − 4 = 1 ≤ 3 ✓</text>
  <text x="412" y="294" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">⇒ 答案 3</text>

  <!-- 右侧便签 4：边界 -->
  <rect x="318" y="306" width="188" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="322" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">边界：n = 1 时 diff = 0 ≤ k</text>
  <text x="412" y="336" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">⇒ 答案必为 0（示例 3）</text>

  <text x="163" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">示例：nums = [5,0,1,4]，k = 3</text>
</svg>
