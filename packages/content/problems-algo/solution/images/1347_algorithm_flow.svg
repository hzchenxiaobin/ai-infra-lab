<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：统计频率 → 逐字符求差 → 累加正差</text>

  <!-- ① 初始化 diff 数组 -->
  <g filter="url(#rough2)">
    <rect x="200" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① diff[26] = {0}</text>
  </g>
  <path d="M280 82 L280 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ② 遍历 s：diff[c] 递减 -->
  <g filter="url(#rough2)">
    <rect x="180" y="104" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for c in s:  diff[c] −−</text>
    <text x="280" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a">s 的字符记为负</text>
  </g>
  <path d="M280 146 L280 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 遍历 t：diff[c]++ -->
  <g filter="url(#rough2)">
    <rect x="180" y="168" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for c in t:  diff[c] ++</text>
    <text x="280" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a">t 的字符记为正</text>
  </g>
  <path d="M280 210 L280 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ④ 判定菱形：diff[c] > 0 ? -->
  <g filter="url(#rough2)">
    <polygon points="280,232 360,262 280,292 200,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ diff[c] &gt; 0 ?</text>
    <text x="280" y="274" text-anchor="middle" font-size="10" fill="#d6a040">遍历 26 个字母</text>
  </g>

  <!-- 是 → 累加 -->
  <text x="370" y="258" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M360 262 L400 262" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="400" y="246" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="460" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans += diff[c]</text>
  </g>
  <path d="M460 246 L460 222 L280 222 L280 232" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="216" font-size="10" fill="#b85450">回溯继续下一字符</text>

  <!-- 否 → 跳过 -->
  <text x="190" y="258" text-anchor="end" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M200 262 L150 262" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="246" width="110" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="8"/>
    <text x="95" y="268" text-anchor="middle" font-size="12" fill="#666">跳过（≤0）</text>
  </g>
  <path d="M95 246 L95 222 L280 222" stroke="#888" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- ⑤ 返回 ans -->
  <path d="M280 292 L280 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="190" y="320" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10"/>
    <text x="280" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⑤ return ans</text>
  </g>

  <!-- 右下注释 -->
  <g filter="url(#rough2)">
    <rect x="400" y="320" width="135" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="467" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(n + 26)</text>
    <text x="467" y="358" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">空间 O(1)</text>
  </g>
</svg>
