<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">预处理：逐票更新计票表，记录每个时刻的领先者</text>

  <!-- input arrays -->
  <text x="40" y="64" font-size="12" fill="#888">times:</text>
  <rect x="90" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="146" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="202" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="258" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <rect x="314" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <rect x="370" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">25</text>
  <rect x="426" y="48" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">30</text>

  <text x="40" y="104" font-size="12" fill="#888">persons:</text>
  <rect x="90" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="146" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="258" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="314" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="370" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="426" y="88" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- arrow down -->
  <path d="M 270 128 L 270 148" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- process box -->
  <rect x="60" y="152" width="420" height="84" fill="#f0f0f0" stroke="#888" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">逐票扫描：count[persons[i]]++</text>
  <line x1="80" y1="182" x2="460" y2="182" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11.5" fill="#555">若 count[p] &gt;= count[leader] → leader = p</text>
  <text x="270" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">平票时刚投票者即最新 → 自然成为新领先者</text>

  <!-- arrow down -->
  <path d="M 270 240 L 270 258" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- leaders result -->
  <text x="40" y="290" font-size="12" fill="#888">leaders:</text>
  <rect x="90" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="146" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="258" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="314" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="370" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="426" y="272" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="118" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx0</text>
  <text x="174" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx1</text>
  <text x="230" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx2</text>
  <text x="286" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx3</text>
  <text x="342" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx4</text>
  <text x="398" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx5</text>
  <text x="454" y="324" text-anchor="middle" font-size="9" fill="#aaa">idx6</text>

  <!-- note -->
  <rect x="70" y="340" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">times 严格递增 → leaders 随 time 升序排列</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#888">查询时只需在 times 上二分定位，再取 leaders[idx]</text>
</svg>
