<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 总标题 -->
  <text x="30" y="34" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：从 m = 1 出发反复 m ← 2m + 1，数出 ≤ n 的候选</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="70" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="75" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 200 88 L 200 102" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="125" y="106" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = 1（先数 0）</text>
  <text x="200" y="141" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m = 1</text>

  <path d="M 200 146 L 200 160" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="200,164 272,200 200,236 128,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">m ≤ n ?</text>

  <!-- 是：更新 -->
  <text x="210" y="254" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 200 236 L 200 258" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="120" y="262" width="160" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = ans + 1</text>
  <text x="200" y="299" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m = 2·m + 1</text>

  <!-- 循环回边 -->
  <path d="M 120 285 L 72 285 L 72 200 L 124 200" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="244" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">循环</text>

  <!-- 否：返回 -->
  <text x="282" y="192" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 272 200 L 328 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="332" y="180" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- n=4 轨迹 -->
  <rect x="320" y="52" width="212" height="104" rx="8" fill="#ffffff" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="330" y="72" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 4 的执行轨迹：</text>
  <text x="330" y="92" font-size="11.5" fill="#333" filter="url(#rough2)">初始：ans = 1, m = 1</text>
  <text x="330" y="110" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 4 ✓ → ans = 2, m = 3</text>
  <text x="330" y="128" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3 ≤ 4 ✓ → ans = 3, m = 7</text>
  <text x="330" y="146" font-size="11.5" fill="#b85450" filter="url(#rough2)">7 &gt; 4 ✗ → 返回 3 ✓</text>

  <!-- 底部要点 -->
  <rect x="30" y="330" width="500" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">循环次数 = ⌊log₂(n+1)⌋：n = 1000 只转 10 圈</text>
  <text x="280" y="371" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m 用 64 位：退出前 m ≤ 2n + 1，大值域也不溢出</text>
</svg>
