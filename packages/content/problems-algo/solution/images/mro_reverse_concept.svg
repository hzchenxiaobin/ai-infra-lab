<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反转对称性：1 从 pos 跳到镜像位置 j</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">子数组 [i, i+k−1] 关于中心对称，1 的新位置 = 镜像 = 2i+k−1−pos</text>

  <!-- ===== Top: original array, n=7, 1 at pos=2, k=4 ===== -->
  <text x="40" y="76" font-size="10" fill="#888" font-weight="bold">原数组（1 在 pos=2）</text>
  <g font-size="12">
    <!-- 7 cells, index 0..6, cell width 40 starting x=70 -->
    <rect x="70" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="90" y="103" text-anchor="middle" fill="#999">0</text>
    <rect x="110" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="130" y="103" text-anchor="middle" fill="#999">0</text>
    <rect x="150" y="84" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="170" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="190" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="210" y="103" text-anchor="middle" fill="#999">0</text>
    <rect x="230" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="250" y="103" text-anchor="middle" fill="#999">0</text>
    <rect x="270" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="290" y="103" text-anchor="middle" fill="#999">0</text>
    <rect x="310" y="84" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="330" y="103" text-anchor="middle" fill="#999">0</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="90" y="126" text-anchor="middle">0</text>
    <text x="130" y="126" text-anchor="middle">1</text>
    <text x="170" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">2=pos</text>
    <text x="210" y="126" text-anchor="middle">3</text>
    <text x="250" y="126" text-anchor="middle">4</text>
    <text x="290" y="126" text-anchor="middle">5</text>
    <text x="330" y="126" text-anchor="middle">6</text>
  </g>

  <!-- ===== Middle: one detailed reverse, window i=1 -> [1,4] ===== -->
  <text x="40" y="160" font-size="10" fill="#446688" font-weight="bold">操作一次（取 i=1，窗口 [1,4]，k=4）</text>

  <!-- window highlight around cells 1..4 (x=110..270) -->
  <rect x="108" y="82" width="164" height="32" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="74" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">窗口 [i=1, i+k−1=4]</text>

  <!-- mirror arrow: pos=2 (x=170) -> j=3 (x=210) -->
  <path d="M 170 200 Q 190 224 210 200" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">镜像翻转</text>
  <text x="170" y="196" text-anchor="middle" font-size="9" fill="#b85450">pos=2</text>
  <text x="210" y="196" text-anchor="middle" font-size="9" fill="#b85450">j=3</text>

  <!-- after array -->
  <text x="40" y="266" font-size="10" fill="#888" font-weight="bold">翻转后（1 在 j=3）</text>
  <g font-size="12">
    <rect x="70" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="90" y="293" text-anchor="middle" fill="#999">0</text>
    <rect x="110" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="130" y="293" text-anchor="middle" fill="#999">0</text>
    <rect x="150" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="170" y="293" text-anchor="middle" fill="#999">0</text>
    <rect x="190" y="274" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="293" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="230" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="250" y="293" text-anchor="middle" fill="#999">0</text>
    <rect x="270" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="290" y="293" text-anchor="middle" fill="#999">0</text>
    <rect x="310" y="274" width="40" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="330" y="293" text-anchor="middle" fill="#999">0</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="90" y="316" text-anchor="middle">0</text>
    <text x="130" y="316" text-anchor="middle">1</text>
    <text x="170" y="316" text-anchor="middle">2</text>
    <text x="210" y="316" text-anchor="middle" fill="#b85450" font-weight="bold">3=j</text>
    <text x="250" y="316" text-anchor="middle">4</text>
    <text x="290" y="316" text-anchor="middle">5</text>
    <text x="330" y="316" text-anchor="middle">6</text>
  </g>
  <text x="190" y="338" text-anchor="middle" font-size="10" fill="#446688">j = i + (i+k−1) − pos = 2·i + k − 1 − pos = 2×1+4−1−2 = 3</text>

  <!-- ===== Bottom: as i varies, j sweeps a same-parity range ===== -->
  <text x="40" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">滑动窗口 i，j 连续扫过「同奇偶」的一段</text>

  <!-- table: i, window, j -->
  <g font-size="11">
    <rect x="60" y="376" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="85" y="392" text-anchor="middle" fill="#333">i = 0</text>
    <text x="140" y="392" text-anchor="middle" fill="#888">窗口[0,3] →</text>
    <rect x="225" y="376" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="250" y="392" text-anchor="middle" fill="#333" font-weight="bold">j = 1</text>

    <rect x="60" y="402" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="85" y="418" text-anchor="middle" fill="#333">i = 1</text>
    <text x="140" y="418" text-anchor="middle" fill="#888">窗口[1,4] →</text>
    <rect x="225" y="402" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="250" y="418" text-anchor="middle" fill="#333" font-weight="bold">j = 3</text>

    <rect x="60" y="428" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="85" y="444" text-anchor="middle" fill="#333">i = 2</text>
    <text x="140" y="444" text-anchor="middle" fill="#888">窗口[2,5] →</text>
    <rect x="225" y="428" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="250" y="444" text-anchor="middle" fill="#333" font-weight="bold">j = 5</text>
  </g>
  <text x="400" y="392" font-size="10" fill="#4a7a3a">可达集 {1,3,5}</text>
  <text x="400" y="410" font-size="10" fill="#4a7a3a">全是奇数 = 同一奇偶！</text>
  <text x="400" y="428" font-size="10" fill="#b85450" font-weight="bold">步长 2、单一奇偶</text>
  <text x="400" y="446" font-size="10" fill="#888">→ 可用有序集合批量跳过</text>
</svg>
