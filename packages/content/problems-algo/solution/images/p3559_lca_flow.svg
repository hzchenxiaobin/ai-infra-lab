<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：倍增 LCA 求路径边数 + 幂表</text>

  <!-- 左列：预处理 -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">预处理（整棵树一次）O(n log n)</text>

  <g filter="url(#rough2)">
    <rect x="45" y="68" width="170" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="130" y="91" text-anchor="middle" font-size="12.5" fill="#333">建邻接表 O(n)</text>

    <path d="M 130 104 L 130 118" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="45" y="122" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="130" y="143" text-anchor="middle" font-size="12.5" fill="#333">BFS（根 1）求</text>
    <text x="130" y="161" text-anchor="middle" font-size="12.5" fill="#333">depth 与 parent</text>

    <path d="M 130 172 L 130 186" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="45" y="190" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="130" y="211" text-anchor="middle" font-size="12.5" fill="#333">倍增表 up[k][v] =</text>
    <text x="130" y="229" text-anchor="middle" font-size="12.5" fill="#333">up[k−1][up[k−1][v]]</text>

    <path d="M 130 240 L 130 254" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="45" y="258" width="170" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="130" y="281" text-anchor="middle" font-size="12.5" fill="#333">幂表 pw[i] = 2ⁱ mod p</text>
  </g>

  <!-- 右列：每次查询 -->
  <text x="375" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个查询 O(log n)</text>

  <g filter="url(#rough2)">
    <rect x="290" y="68" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="375" y="89" text-anchor="middle" font-size="12.5" fill="#333">取查询 [u, v]</text>

    <path d="M 375 102 L 375 114" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>

    <rect x="290" y="118" width="170" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="375" y="139" text-anchor="middle" font-size="12.5" fill="#333">倍增求 LCA：</text>
    <text x="375" y="157" text-anchor="middle" font-size="12.5" fill="#333">深的先跳到同深度，</text>
    <text x="375" y="172" text-anchor="middle" font-size="12.5" fill="#333">再从高位到低位同跳</text>

    <path d="M 375 178 L 375 190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>

    <rect x="290" y="194" width="170" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="375" y="215" text-anchor="middle" font-size="12.5" fill="#333">k = dep[u]+dep[v]</text>
    <text x="375" y="233" text-anchor="middle" font-size="12.5" fill="#333">− 2·dep[lca(u,v)]</text>

    <path d="M 375 244 L 375 256" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>

    <polygon points="307,284 375,256 443,284 375,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="375" y="289" text-anchor="middle" font-size="12.5" fill="#a07818">k = 0 ?</text>

    <path d="M 352 304 C 336 316, 324 322, 312 330" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="326" y="314" font-size="12" fill="#b85450">是</text>
    <rect x="222" y="334" width="100" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="272" y="354" text-anchor="middle" font-size="12.5" fill="#b85450">answer = 0</text>

    <path d="M 398 304 C 414 316, 426 322, 438 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="416" y="314" font-size="12" fill="#4a7a3a">否</text>
    <rect x="392" y="334" width="118" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="451" y="354" text-anchor="middle" font-size="12.5" fill="#4a7a3a">answer = 2ᵏ⁻¹</text>
  </g>

  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">总计 O((n + q) log n)，n、q 均可达 10⁵</text>
</svg>
