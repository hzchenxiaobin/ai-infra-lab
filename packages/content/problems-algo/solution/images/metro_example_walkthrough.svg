<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐步追踪 checkIns 与 travelTimes</text>

  <!-- table header -->
  <rect x="20" y="48" width="680" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">#</text>
  <text x="180" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="380" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">checkIns</text>
  <text x="560" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">travelTimes 变化</text>
  <text x="675" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>

  <!-- column dividers -->
  <line x1="80" y1="48" x2="80" y2="452" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="48" x2="280" y2="452" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="48" x2="480" y2="452" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="640" y1="48" x2="640" y2="452" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: checkIn 45 -->
  <rect x="22" y="82" width="676" height="40" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">checkIn</text>
  <text x="180" y="114" text-anchor="middle" font-size="9" fill="#666">(45, Leyton, 3)</text>
  <text x="380" y="106" text-anchor="middle" font-size="10" fill="#446688">45→(Leyton, 3)</text>
  <text x="560" y="106" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="675" y="106" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 2: checkIn 32 -->
  <rect x="22" y="124" width="676" height="40" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="180" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">checkIn</text>
  <text x="180" y="156" text-anchor="middle" font-size="9" fill="#666">(32, Paradise, 8)</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="#446688">+32→(Paradise, 8)</text>
  <text x="380" y="156" text-anchor="middle" font-size="9" fill="#999">3 人在途</text>
  <text x="560" y="148" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="675" y="148" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 3: checkIn 27 -->
  <rect x="22" y="166" width="676" height="40" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="180" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">checkIn</text>
  <text x="180" y="198" text-anchor="middle" font-size="9" fill="#666">(27, Leyton, 10)</text>
  <text x="380" y="190" text-anchor="middle" font-size="10" fill="#446688">+27→(Leyton, 10)</text>
  <text x="560" y="190" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="675" y="190" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 4: checkOut 45 -->
  <rect x="22" y="208" width="676" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="180" y="226" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">checkOut</text>
  <text x="180" y="240" text-anchor="middle" font-size="9" fill="#666">(45, Waterloo, 15)</text>
  <text x="380" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删 45</text>
  <text x="560" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a">(L,W) += (12, 1)</text>
  <text x="560" y="240" text-anchor="middle" font-size="9" fill="#666">15−3=12</text>
  <text x="675" y="232" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 5: checkOut 27 -->
  <rect x="22" y="250" width="676" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="180" y="268" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">checkOut</text>
  <text x="180" y="282" text-anchor="middle" font-size="9" fill="#666">(27, Waterloo, 20)</text>
  <text x="380" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删 27</text>
  <text x="560" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">(L,W) → (22, 2)</text>
  <text x="560" y="282" text-anchor="middle" font-size="9" fill="#666">20−10=10</text>
  <text x="675" y="274" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 6: checkOut 32 -->
  <rect x="22" y="292" width="676" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="180" y="310" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">checkOut</text>
  <text x="180" y="324" text-anchor="middle" font-size="9" fill="#666">(32, Cambridge, 22)</text>
  <text x="380" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删 32 → 空</text>
  <text x="560" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a">(P,C) += (14, 1)</text>
  <text x="560" y="324" text-anchor="middle" font-size="9" fill="#666">22−8=14</text>
  <text x="675" y="316" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- Row 7: getAvg P,C -->
  <rect x="22" y="334" width="676" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="180" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">getAvg</text>
  <text x="180" y="366" text-anchor="middle" font-size="9" fill="#666">(Paradise, Cambridge)</text>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="560" y="358" text-anchor="middle" font-size="10" fill="#999">读 (14, 1)</text>
  <text x="675" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14.0</text>

  <!-- Row 8: getAvg L,W -->
  <rect x="22" y="376" width="676" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="180" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">getAvg</text>
  <text x="180" y="408" text-anchor="middle" font-size="9" fill="#666">(Leyton, Waterloo)</text>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="560" y="394" text-anchor="middle" font-size="10" fill="#999">读 (22, 2)</text>
  <text x="560" y="408" text-anchor="middle" font-size="9" fill="#666">22/2=11</text>
  <text x="675" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11.0</text>

  <!-- Row 9: checkOut 10 -->
  <rect x="22" y="418" width="676" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="442" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">9</text>
  <text x="180" y="436" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">checkOut</text>
  <text x="180" y="450" text-anchor="middle" font-size="9" fill="#666">(10, Waterloo, 38)</text>
  <text x="380" y="442" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删 10</text>
  <text x="560" y="436" text-anchor="middle" font-size="10" fill="#4a7a3a">(L,W) → (36, 3)</text>
  <text x="560" y="450" text-anchor="middle" font-size="9" fill="#666">38−24=14</text>
  <text x="675" y="442" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- final result annotation -->
  <rect x="480" y="460" width="218" height="10" rx="0" fill="transparent"/>
  <text x="675" y="462" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">最终 getAvg(L,W) = 36/3 = 12.0 ★</text>
</svg>
