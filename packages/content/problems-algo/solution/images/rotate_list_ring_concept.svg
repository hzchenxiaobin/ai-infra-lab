<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">旋转链表：成环再断开</text>
  <path d="M 300 40 Q 460 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Phase 1: Original list ====== -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">① 原链表：1 → 2 → 3 → 4 → 5 → null</text>

  <g font-size="13" fill="#444">
    <g filter="url(#sk)"><rect x="80" y="88" width="55" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="107" y="112" text-anchor="middle" font-weight="bold" fill="#2b6e9e">1</text></g>
    <g filter="url(#sk)"><rect x="190" y="88" width="55" height="38" rx="4" fill="#fff" stroke="#ddd"/><text x="217" y="112" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="300" y="88" width="55" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/><text x="327" y="112" text-anchor="middle" font-weight="bold" fill="#2e6e2e">3</text></g>
    <g filter="url(#sk)"><rect x="410" y="88" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="437" y="112" text-anchor="middle" font-weight="bold" fill="#b85450">4</text></g>
    <g filter="url(#sk)"><rect x="520" y="88" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="547" y="112" text-anchor="middle" font-weight="bold" fill="#b85450">5</text></g>
  </g>
  <text x="595" y="112" font-size="11" fill="#888">→ null</text>

  <path d="M 135 107 L 186 107" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 107 L 296 107" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 355 107 L 406 107" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 107 L 516 107" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="460" y="146" text-anchor="middle" font-size="11" fill="#888">n = 5, k = 2, n − k = 3 → 新尾 = 节点 3, 新头 = 节点 4</text>

  <!-- divider -->
  <path d="M 60 158 Q 460 162 860 158" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ====== Phase 2: Close ring ====== -->
  <text x="60" y="184" font-size="13" font-weight="bold" fill="#7a5415">② 成环：tail.next = head（节点 5 → 节点 1）</text>

  <!-- ring layout: 1 2 3 on top, 5 4 on bottom right, curved arrow from 5 back to 1 -->
  <g font-size="13" fill="#444">
    <g filter="url(#sk)"><rect x="120" y="204" width="55" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="147" y="228" text-anchor="middle" font-weight="bold" fill="#2b6e9e">1</text></g>
    <g filter="url(#sk)"><rect x="230" y="204" width="55" height="38" rx="4" fill="#fff" stroke="#ddd"/><text x="257" y="228" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="340" y="204" width="55" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/><text x="367" y="228" text-anchor="middle" font-weight="bold" fill="#2e6e2e">3</text></g>
    <g filter="url(#sk)"><rect x="450" y="204" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="477" y="228" text-anchor="middle" font-weight="bold" fill="#b85450">4</text></g>
    <g filter="url(#sk)"><rect x="560" y="204" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="587" y="228" text-anchor="middle" font-weight="bold" fill="#b85450">5</text></g>
  </g>

  <path d="M 175 223 L 226 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 285 223 L 336 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 395 223 L 446 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 505 223 L 556 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- curved arrow from 5 back to 1 (closing the ring) -->
  <path d="M 587 242 Q 500 310 147 242" stroke="#7a5415" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="370" y="300" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">tail.next = head</text>
  <text x="370" y="316" text-anchor="middle" font-size="10" fill="#888">首尾相连成环</text>

  <!-- divider -->
  <path d="M 60 328 Q 460 332 860 328" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ====== Phase 3: Break ====== -->
  <text x="60" y="352" font-size="13" font-weight="bold" fill="#b85450">③ 断开：new_tail(节点3).next = null → 4 → 5 → 1 → 2 → 3</text>

  <g font-size="13" fill="#444">
    <g filter="url(#sk)"><rect x="80" y="370" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="107" y="394" text-anchor="middle" font-weight="bold" fill="#b85450">4</text></g>
    <g filter="url(#sk)"><rect x="190" y="370" width="55" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="217" y="394" text-anchor="middle" font-weight="bold" fill="#b85450">5</text></g>
    <g filter="url(#sk)"><rect x="300" y="370" width="55" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="327" y="394" text-anchor="middle" font-weight="bold" fill="#2b6e9e">1</text></g>
    <g filter="url(#sk)"><rect x="410" y="370" width="55" height="38" rx="4" fill="#fff" stroke="#ddd"/><text x="437" y="394" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="520" y="370" width="55" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/><text x="547" y="394" text-anchor="middle" font-weight="bold" fill="#2e6e2e">3</text></g>
  </g>
  <text x="595" y="394" font-size="11" fill="#888">→ null</text>

  <path d="M 135 389 L 186 389" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 389 L 296 389" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 355 389 L 406 389" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 389 L 516 389" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- scissors icon at break point -->
  <text x="555" y="362" font-size="14" fill="#b85450" font-weight="bold">✂ 断开</text>
</svg>
