<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">双多重集滑窗：L 装 k−1 个最小并维护 smallSum，R 装其余</text>

  <!-- L bucket -->
  <rect x="56" y="116" width="190" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="151" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">L：need = k−1 个最小</text>
  <!-- L elements -->
  <rect x="74" y="150" width="34" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="170" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="114" y="150" width="34" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="170" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="151" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">smallSum = Σ L</text>

  <!-- R bucket -->
  <rect x="314" y="116" width="190" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="409" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R：其余元素</text>
  <rect x="332" y="150" width="34" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="170" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="372" y="150" width="34" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="170" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="409" y="198" text-anchor="middle" font-size="10" fill="#888">max(L) ≤ min(R)</text>

  <!-- insert arrow (top): x enters L -->
  <path d="M 151 88 L 151 114" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="151" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新元素 x 入 → 先进 L</text>

  <!-- overflow arrow L -> R (top) -->
  <path d="M 248 150 L 312 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">溢出 max(L)</text>
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#888">|L| &gt; need 时</text>

  <!-- pull-up arrow R -> L (bottom) -->
  <path d="M 312 190 L 248 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">补入 min(R)</text>
  <text x="280" y="200" text-anchor="middle" font-size="9" fill="#888">L 被删一个时</text>

  <!-- operation: insert box -->
  <rect x="40" y="248" width="240" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">插入 x（右端进窗口）</text>
  <text x="56" y="296" font-size="11" fill="#666">① L.add(x)，smallSum += x</text>
  <text x="56" y="316" font-size="11" fill="#666">② 若 |L| &gt; need：</text>
  <text x="68" y="336" font-size="11" fill="#4a7a3a">mx = max(L) 移到 R</text>
  <text x="68" y="356" font-size="11" fill="#4a7a3a">smallSum -= mx</text>

  <!-- operation: remove box -->
  <rect x="300" y="248" width="240" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">删除 y（左端出窗口）</text>
  <text x="316" y="296" font-size="11" fill="#666">① 若 y ≤ max(L)：y 在 L</text>
  <text x="328" y="314" font-size="11" fill="#b85450">L.remove(y)，smallSum -= y</text>
  <text x="328" y="332" font-size="11" fill="#b85450">从 R 拉 min(R) 补入 L</text>
  <text x="316" y="352" font-size="11" fill="#666">② 否则：y 在 R，R.remove(y)</text>
  <text x="316" y="370" font-size="9" fill="#888">判据：y ≤ max(L) ⟺ y 属于 k−1 最小</text>
</svg>
