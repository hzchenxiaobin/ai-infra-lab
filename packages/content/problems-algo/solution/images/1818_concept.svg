<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：换一个 nums1[i]，让该位 |nums1[j] − nums2[i]| 最小</text>

  <!-- ===== Left: original total ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 原始差值之和</text>

  <!-- nums1 row -->
  <text x="40" y="92" font-size="10" fill="#888" filter="url(#rough2)">nums1</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="70" y="76" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="91" y="95" fill="#446688" font-weight="bold">1</text>
    <rect x="120" y="76" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="141" y="95" fill="#446688" font-weight="bold">7</text>
    <rect x="170" y="76" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="191" y="95" fill="#446688" font-weight="bold">5</text>
    <text x="91" y="120" font-size="9" fill="#aaa">i=0</text>
    <text x="141" y="120" font-size="9" fill="#aaa">i=1</text>
    <text x="191" y="120" font-size="9" fill="#aaa">i=2</text>
  </g>

  <!-- nums2 row -->
  <text x="40" y="148" font-size="10" fill="#888" filter="url(#rough2)">nums2</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="70" y="132" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="91" y="151" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="120" y="132" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="141" y="151" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="170" y="132" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="191" y="151" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <!-- diff row -->
  <text x="40" y="188" font-size="10" fill="#888" filter="url(#rough2)">差值</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="70" y="172" width="42" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="91" y="191" fill="#555" font-weight="bold">1</text>
    <rect x="120" y="172" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="141" y="191" fill="#d6a040" font-weight="bold">4</text>
    <rect x="170" y="172" width="42" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="191" y="191" fill="#555" font-weight="bold">0</text>
  </g>

  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">total = 1 + 4 + 0 = 5</text>

  <!-- arrow from highlighted diff to right section -->
  <path d="M 214 188 L 290 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="252" y="166" font-size="9" fill="#d6a040" filter="url(#rough2)">替换 i=1</text>

  <!-- ===== Right: sort + binary search closest ===== -->
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 排序 + 二分找最接近值</text>

  <text x="300" y="86" font-size="10" fill="#888" filter="url(#rough2)">sorted1</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="330" y="92" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="351" y="111" fill="#446688" font-weight="bold">1</text>
    <rect x="380" y="92" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="401" y="111" fill="#446688" font-weight="bold">5</text>
    <rect x="430" y="92" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="451" y="111" fill="#446688" font-weight="bold">7</text>
  </g>

  <!-- target nums2[1]=3 -->
  <rect x="332" y="132" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标 nums2[1] = 3</text>

  <!-- binary search insertion arrow pointing between 1 and 5 -->
  <path d="M 380 132 L 380 124" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="404" y="86" font-size="9" fill="#d6a040" filter="url(#rough2)">bisect_left → 插入点</text>

  <!-- candidate highlight: 1 and 5 -->
  <g filter="url(#rough2)">
    <rect x="330" y="92" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="380" y="92" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>

  <!-- candidate distances -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="351" y="138" font-size="9" fill="#b85450">|1−3|=2</text>
    <text x="401" y="138" font-size="9" fill="#b85450">|5−3|=2</text>
  </g>

  <text x="410" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">min_dist = min(2, 2) = 2</text>

  <!-- improvement -->
  <rect x="300" y="188" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">improvement = 原差值 − min_dist = 4 − 2 = 2</text>

  <!-- ===== Bottom: answer formula ===== -->
  <rect x="32" y="248" width="496" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="270" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 对每个 i 求 improvement_i，取最大者：</text>
  <text x="48" y="288" font-size="10" fill="#555" filter="url(#rough2)">answer = ( total − max_i improvement_i ) mod (10⁹+7)</text>
  <text x="48" y="306" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= ( 5 − 2 ) mod (10⁹+7) = 3</text>

  <!-- footer insight -->
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键：每位最优替换 = 用 sorted1 二分找最接近 nums2[i] 的值，O(n log n) 排序 + O(n log n) 查询</text>

  <!-- ===== Side note: why only check 2 candidates ===== -->
  <rect x="32" y="362" width="496" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="384" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么只需查「插入点」左右两个候选？</text>
  <text x="48" y="402" font-size="10" fill="#555" filter="url(#rough2)">sorted1 有序，bisect_left 定位首个 ≥ nums2[i] 的位置 p。</text>
  <text x="48" y="418" font-size="10" fill="#555" filter="url(#rough2)">最近值必在 p 与 p−1 之中：左侧更小、右侧更大，</text>
  <text x="48" y="434" font-size="10" fill="#555" filter="url(#rough2)">夹在两侧的目标到这两个端点距离最近，无需扫描全表。</text>
  <text x="48" y="450" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">边界：p=0 只查 p；p=n 只查 p−1。</text>
</svg>
