<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种等价实现：找公共前缀</text>

  <!-- 中间分隔虚线 -->
  <path d="M 290 44 L 290 424" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：位移法 ===== -->
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">解法一：位移法</text>
  <text x="150" y="78" text-anchor="middle" font-size="10.5" fill="#888">右移到相等，再左移回来</text>

  <!-- 初始化框 -->
  <rect x="70" y="92" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="12" fill="#333">shift = 0</text>

  <path d="M 150 130 L 150 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="150,154 230,196 150,238 70,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">left == right ?</text>
  <text x="150" y="208" text-anchor="middle" font-size="10" fill="#888">（已只剩公共前缀）</text>

  <!-- 是 → 返回 -->
  <path d="M 230 196 L 268 196 L 268 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="238" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="70" y="338" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="170" y="364" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return left &lt;&lt; shift</text>

  <!-- 否 → 动作框 + 回环 -->
  <path d="M 70 196 L 40 196 L 40 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="48" y="188" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="50" y="266" width="200" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="286" text-anchor="middle" font-size="11.5" fill="#333">left &gt;&gt;= 1</text>
  <text x="150" y="302" text-anchor="middle" font-size="11.5" fill="#333">right &gt;&gt;= 1</text>
  <text x="150" y="316" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">shift++</text>

  <path d="M 150 320 L 150 338 L 150 150" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 150 150 L 150 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="300" font-size="10" fill="#888">↻ 回判</text>

  <!-- ===== 右：Brian Kernighan ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">解法二：Brian Kernighan</text>
  <text x="430" y="78" text-anchor="middle" font-size="10.5" fill="#888">不断消 right 最低位 1，直到 right ≤ left</text>

  <!-- 初始化框 -->
  <rect x="350" y="92" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="12" fill="#333">（无额外变量）</text>

  <path d="M 430 130 L 430 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="430,154 510,196 430,238 350,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">right &gt; left ?</text>
  <text x="430" y="208" text-anchor="middle" font-size="10" fill="#888">（还有变化位未消）</text>

  <!-- 否 → 返回 -->
  <path d="M 350 196 L 312 196 L 312 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="330" y="338" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="430" y="364" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return right</text>

  <!-- 是 → 动作框 + 回环 -->
  <path d="M 510 196 L 540 196 L 540 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="520" y="188" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="330" y="266" width="200" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">right &amp;= (right − 1)</text>
  <text x="430" y="308" text-anchor="middle" font-size="10.5" fill="#888">清掉 right 的最低位 1</text>

  <path d="M 430 320 L 430 338 L 430 150" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 430 150 L 430 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="300" font-size="10" fill="#888">↻ 回判</text>

  <!-- 底部等价说明 -->
  <rect x="40" y="400" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">两法等价：消最低 1 的次数 = 位移法里被清零的低位数 = shift</text>
</svg>
