<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两表法：双重预订表是三重预订的"预警器"</text>

  <!-- Number line legend: x origin 90, unit 30, range 0..14 -->
  <!-- Case 1: single booking (OK) -->
  <text x="34" y="70" font-size="11.5" fill="#4a7a3a" font-weight="bold">单重 ✓</text>
  <rect x="120" y="58" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">A [10,20)</text>
  <line x1="90" y1="86" x2="510" y2="86" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="100" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="180" y="100" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="270" y="100" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="360" y="100" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="450" y="100" text-anchor="middle" font-size="9.5" fill="#888">25</text>
  <text x="510" y="100" text-anchor="middle" font-size="9.5" fill="#888">x</text>

  <!-- Case 2: double booking (OK, allowed) -->
  <text x="34" y="138" font-size="11.5" fill="#d6a040" font-weight="bold">双重 ✓</text>
  <rect x="120" y="126" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">A [10,20)</text>
  <rect x="210" y="150" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">B [15,25)</text>
  <!-- overlap region highlight -->
  <rect x="210" y="126" width="30" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">交 [15,20)</text>
  <line x1="90" y1="178" x2="510" y2="178" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="180" y="192" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="270" y="192" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="360" y="192" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="450" y="192" text-anchor="middle" font-size="9.5" fill="#888">25</text>

  <!-- Case 3: triple booking (REJECTED) -->
  <text x="34" y="220" font-size="11.5" fill="#b85450" font-weight="bold">三重 ✗</text>
  <rect x="120" y="208" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="221" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A [10,20)</text>
  <rect x="210" y="228" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="241" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B [15,25)</text>
  <rect x="60" y="248" width="120" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="261" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">C [5,15)</text>
  <!-- triple region highlight -->
  <rect x="210" y="208" width="30" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="240" font-size="10.5" fill="#b85450" font-weight="bold">← [10,15) 三层覆盖</text>
  <line x1="90" y1="274" x2="510" y2="274" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="288" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="180" y="288" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="270" y="288" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="360" y="288" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="450" y="288" text-anchor="middle" font-size="9.5" fill="#888">25</text>

  <!-- Two-table mechanism box -->
  <rect x="30" y="308" width="500" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">两张表各司其职</text>
  <text x="48" y="349" font-size="11" fill="#444"><tspan font-weight="bold" fill="#446688">booked</tspan>：所有已预订事件 → 计算"新双重段"的来源</text>
  <text x="48" y="367" font-size="11" fill="#444"><tspan font-weight="bold" fill="#d6a040">overlaps</tspan>：双重预订段（两两交）→ 预判"是否升级为三重"</text>
  <text x="48" y="382" font-size="10.5" fill="#666">book(s,e)：先扫 overlaps 判拒/纳，再扫 booked 更新 overlaps，最后入 booked</text>
</svg>
