<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：位掩码 + 逐对子集判定</text>

  <!-- Start -->
  <rect x="210" y="42" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 70 L 260 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="140" y="88" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1. 公司名 → ID 映射（哈希表）</text>
  <path d="M 260 122 L 260 136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="140" y="140" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2. 构建每位用户的位掩码 mask[i]</text>
  <path d="M 260 174 L 260 188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: for each i -->
  <rect x="140" y="192" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3. for i = 0 to n−1</text>
  <path d="M 260 226 L 260 240" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop back arrow (from step 3 back to itself) -->
  <path d="M 380 209 L 430 209 L 430 168 L 384 168" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="192" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i++</text>

  <!-- Decision diamond -->
  <polygon points="260,244 390,294 260,344 130,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">存在 j≠i 使</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mask[i] ⊆ mask[j] ?</text>

  <!-- Yes branch (right) -->
  <path d="M 390 294 L 430 294" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="405" y="288" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="432" y="280" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过 i</text>

  <!-- No branch (left) -->
  <path d="M 130 294 L 90 294" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="288" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="12" y="280" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i 加入答案</text>

  <!-- Arrows from both branches to End -->
  <path d="M 470 308 L 470 366 L 260 366" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 50 308 L 50 366 L 260 366" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 366 L 260 378" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="180" y="382" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回升序答案</text>
</svg>
