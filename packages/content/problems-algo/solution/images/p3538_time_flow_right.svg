<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">删左加右：缺口里的时间全部流入右边第一个保留路标</text>

  <!-- ══════════ 合并前 ══════════ -->
  <text x="24" y="48" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 · 合并前：删 #1（time = 8），其时间向右流入 #2</text>

  <!-- 时间向右流动的红箭头 -->
  <path d="M 232 86 C 270 56, 330 56, 360 84" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="296" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">time[1] = 8 向右流入</text>

  <!-- 四个路标盒子 -->
  <rect x="20" y="64" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">#0 pos=0</text>
  <text x="60" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">t = 5</text>

  <rect x="150" y="64" width="80" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">#1 pos=3 ✗</text>
  <text x="190" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = 8</text>

  <rect x="363" y="64" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="405" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">#2 pos=8</text>
  <text x="405" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">t = 3+8 = 11</text>

  <rect x="455" y="64" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">#3 pos=10</text>
  <text x="495" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">t = 6</text>

  <!-- 公路 -->
  <path d="M 20 132 C 180 128, 380 136, 540 132" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="60" cy="132" r="4.5" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="132" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="405" cy="132" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="495" cy="132" r="4.5" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 原三段的每公里速度 -->
  <text x="125" y="152" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×5</text>
  <text x="297" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">×8（消失）</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×3</text>

  <!-- ══════════ 合并后 ══════════ -->
  <text x="24" y="184" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">合并后：路标 [0, 8, 10]，time = [5, 11, 6] —— 段速度取左端路标的累积 time</text>

  <rect x="30" y="202" width="100" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">pos 0</text>
  <text x="80" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">t = 5</text>

  <rect x="225" y="202" width="110" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">pos 8</text>
  <text x="280" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">t = 3+8 = 11</text>

  <rect x="430" y="202" width="105" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="482" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">pos 10（终点）</text>
  <text x="482" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#888" filter="url(#rough2)">t = 6（不用）</text>

  <path d="M 132 228 L 221 228" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8 km × 5 = 40</text>

  <path d="M 337 228 L 426 228" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="382" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2 km × 11 = 22</text>

  <text x="280" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">总耗时 = 40 + 22 = 62 ✓（示例 1 答案）</text>

  <!-- ══════════ 结论框 ══════════ -->
  <rect x="40" y="296" width="480" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">路段 a→b 耗时 = (pos[b] − pos[a]) × speed(a)</text>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">speed(a) = time[a] + 左缺口 (prev, a) 内 time 之和</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ 代价由相邻两个保留路标共同决定，DP 状态需带缺口信息</text>

  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">记 s = a 左侧紧邻删除个数：speed(a) = time[a] + P[a−1] − P[a−s−1]，且 s ≤ k ≤ 10</text>
</svg>
