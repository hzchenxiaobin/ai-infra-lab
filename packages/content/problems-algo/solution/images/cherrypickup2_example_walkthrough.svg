<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：grid = [[3,1,1],[2,5,1],[1,5,5],[2,1,1]]，逐行填 dp</text>

  <!-- ===== Left: grid with optimal paths ===== -->
  <text x="110" y="54" text-anchor="middle" font-size="11.5" fill="#888">grid + 最优路径</text>

  <!-- row 0 -->
  <rect x="50" y="64" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="64" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="89" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="150" y="64" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- row 1 -->
  <rect x="50" y="102" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="102" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="102" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="127" text-anchor="middle" font-size="14" fill="#999">1</text>
  <!-- row 2 -->
  <rect x="50" y="140" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="165" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="100" y="140" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="165" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="140" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="165" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- row 3 -->
  <rect x="50" y="178" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="203" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="178" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="203" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="150" y="178" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- R1 path arrows -->
  <path d="M 75 96 L 75 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 80 136 L 120 156" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 120 174 L 80 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- R2 path arrows -->
  <path d="M 170 96 L 130 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 130 136 L 170 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 175 174 L 175 194" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="75" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">R1</text>
  <text x="175" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">R2</text>

  <!-- path sums -->
  <rect x="40" y="228" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="247" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">R1: 3+2+5+2 = 12</text>
  <text x="130" y="263" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">R2: 1+5+5+1 = 12</text>

  <!-- ===== Right: DP state table ===== -->
  <text x="400" y="54" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键 dp 状态（行 i 的最优 (j₁, j₂)）</text>

  <!-- header -->
  <rect x="270" y="64" width="60" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="81" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">行 i</text>
  <rect x="330" y="64" width="70" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="81" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">(j₁, j₂)</text>
  <rect x="400" y="64" width="50" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="81" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">grid</text>
  <rect x="450" y="64" width="70" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="81" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp 值</text>

  <!-- row 0 -->
  <rect x="270" y="90" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="107" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="330" y="90" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="107" text-anchor="middle" font-size="10" fill="#333">(0, 2)</text>
  <rect x="400" y="90" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="107" text-anchor="middle" font-size="10" fill="#333">3+1</text>
  <rect x="450" y="90" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- row 1 -->
  <rect x="270" y="116" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="330" y="116" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="133" text-anchor="middle" font-size="10" fill="#333">(0, 1)</text>
  <rect x="400" y="116" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="133" text-anchor="middle" font-size="10" fill="#333">2+5</text>
  <rect x="450" y="116" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>

  <!-- row 1 other -->
  <rect x="270" y="142" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="159" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <rect x="330" y="142" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="159" text-anchor="middle" font-size="10" fill="#aaa">(1, 2)</text>
  <rect x="400" y="142" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="159" text-anchor="middle" font-size="10" fill="#aaa">5+1</text>
  <rect x="450" y="142" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="485" y="159" text-anchor="middle" font-size="10" fill="#aaa">10</text>

  <!-- row 2 -->
  <rect x="270" y="168" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="185" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="330" y="168" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="185" text-anchor="middle" font-size="10" fill="#333">(1, 2)</text>
  <rect x="400" y="168" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="185" text-anchor="middle" font-size="10" fill="#333">5+5</text>
  <rect x="450" y="168" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">21</text>

  <!-- row 2 transition note -->
  <text x="400" y="204" text-anchor="middle" font-size="9.5" fill="#888">前驱 max = dp[1][0][1] = 11</text>

  <!-- row 3 answer -->
  <rect x="270" y="210" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="227" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="330" y="210" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="227" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(0, 2)</text>
  <rect x="400" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="227" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2+1</text>
  <rect x="450" y="210" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="227" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">24</text>

  <text x="400" y="248" text-anchor="middle" font-size="9.5" fill="#888">前驱 max = dp[2][1][2] = 21</text>

  <!-- arrow from grid to table -->
  <path d="M 220 145 L 262 145" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="138" text-anchor="middle" font-size="9.5" fill="#888">填表</text>

  <!-- bottom answer -->
  <rect x="40" y="290" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">答案 = max(dp[3][j₁][j₂]) = dp[3][0][2] = 24</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">R1: (0,0)→(1,0)→(2,1)→(3,0) | R2: (0,2)→(1,1)→(2,2)→(3,2)</text>

  <!-- note about symmetric pruning -->
  <rect x="40" y="346" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="369" text-anchor="middle" font-size="10.5" fill="#555">💡 dp[i][j₁][j₂] ≡ dp[i][j₂][j₁]（两机器人可交换），故 j₁ ≤ j₂ 只算一半</text>
</svg>
