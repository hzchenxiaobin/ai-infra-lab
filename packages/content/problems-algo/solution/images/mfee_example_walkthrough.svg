<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,1,2,2,4,4,1]，双键扫描全过程</text>

  <!-- nums array with filter -->
  <text x="40" y="56" font-size="11" fill="#888">nums</text>
  <rect x="80" y="40" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="63" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="120" y="40" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="63" text-anchor="middle" font-size="14" fill="#b85450">1</text>
  <rect x="160" y="40" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="63" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="200" y="40" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219" y="63" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="240" y="40" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="259" y="63" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="280" y="40" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="299" y="63" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="320" y="40" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="339" y="63" text-anchor="middle" font-size="14" fill="#b85450">1</text>
  <text x="375" y="56" font-size="10" fill="#888">→ 偶数频次表 {0:1, 2:2, 4:2}</text>

  <!-- Arrow -->
  <path d="M 270 82 L 270 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="95" font-size="11" fill="#446688">初值 best=0, ans=-1；按下表扫描</text>

  <!-- Scan table: header -->
  <rect x="40" y="106" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">遍历 (v, c)</text>
  <text x="270" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">条件: c &gt; best ∨ (c==best ∧ v &lt; ans)</text>
  <text x="440" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">更新后 (best, ans)</text>
  <!-- column dividers -->
  <path d="M 150 106 L 150 232" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 370 106 L 370 232" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Row 1: (0,1) -->
  <rect x="40" y="134" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="155" text-anchor="middle" font-size="12" fill="#333">(0, 1)</text>
  <text x="270" y="155" text-anchor="middle" font-size="11.5" fill="#4a7a3a">1 &gt; 0 ✓ → 接管</text>
  <text x="440" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(1, 0)</text>

  <!-- Row 2: (2,2) -->
  <rect x="40" y="166" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="187" text-anchor="middle" font-size="12" fill="#333">(2, 2)</text>
  <text x="270" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a">2 &gt; 1 ✓ → 接管</text>
  <text x="440" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(2, 2)</text>

  <!-- Row 3: (4,2) -->
  <rect x="40" y="198" width="460" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="219" text-anchor="middle" font-size="12" fill="#333">(4, 2)</text>
  <text x="270" y="219" text-anchor="middle" font-size="11.5" fill="#b85450">2 == 2 但 4 ≮ 2 ✗ → 不动</text>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">(2, 2)</text>

  <!-- Arrow to result -->
  <path d="M 270 238 L 270 258" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="253" font-size="11" fill="#4a7a3a">扫描完毕，频次最大=2，并列 {2,4} 取 min → 2</text>

  <!-- Result -->
  <rect x="150" y="262" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 2 ✓</text>

  <!-- Note -->
  <text x="40" y="328" font-size="10.5" fill="#888">• 双键规则与遍历顺序无关：无论 (4,2) 先到还是后到，并列时副键 v&lt;ans 都保住更小值</text>
  <text x="40" y="346" font-size="10.5" fill="#888">• 空表（无偶数）时循环不执行，ans 留初值 -1 兜底返回</text>
</svg>
